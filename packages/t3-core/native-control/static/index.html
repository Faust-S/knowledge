<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IWXA T3 Control</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.55 system-ui, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center;
      background: #101317; color: #e9edf2; }
    main { padding: 32px; max-width: 520px; }
    h1 { font-size: 26px; font-weight: 620; margin: 0 0 14px; }
    p { color: #b4bdc7; margin: 0 0 12px; }
    .mark { display: inline-flex; align-items: center; justify-content: center;
      width: 50px; height: 50px; border-radius: 13px; background: #222b35;
      font-weight: 750; letter-spacing: -0.5px; margin-bottom: 24px; }
    .hint { border-top: 1px solid #303943; padding-top: 16px; margin-top: 22px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">IWXA</div>
    <h1>IWXA T3 Control</h1>
    <p>Рабочий контур ещё не выбран либо локальный Host недоступен.</p>
    <p class="hint">Выберите личный контур или организацию через штатное меню окна «Контуры».
    Если контуров нет, подключите установленный IWXA T3 Host.
    Доступ без подтверждённых полномочий не открывается.</p>
  </main>
</body>
</html>
