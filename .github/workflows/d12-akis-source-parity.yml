name: D12 AKIS original scientific source parity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-ru-1
          ref: 19882b9bd4591f67a717a3b644d73e1d14b06d6f
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - name: Verify exact site source revision
        run: |
          test "$(git rev-parse HEAD)" = "19882b9bd4591f67a717a3b644d73e1d14b06d6f" || { echo "AKIS_SITE_REVISION_INVALID"; exit 1; }
          echo "AKIS_SITE_SOURCE_IDENTITY=PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Exact site dependency install
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/akis-parity-install.log" 2>&1 || {
            echo "AKIS_PARITY_INSTALL=FAIL"; exit 1;
          }
          echo "AKIS_PARITY_INSTALL=PASS"
      - name: Research CASE-001 and CASE-002 site tests
        run: |
          for task in check:akis:production check:akis:article; do
            safe="${task//:/-}"
            bun run "$task" > "$RUNNER_TEMP/akis-parity-$safe.log" 2>&1 || {
              echo "AKIS_CASE_MODEL_TEST=FAIL $task"; exit 1;
            }
            echo "AKIS_CASE_MODEL_TEST=PASS $task"
          done
      - name: Get original scientific source (requires independent private-repo authorization)
        uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa
          ref: e624520c52101a34feab62ce68b2056dc54e5301
          path: akis-original-science
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - name: Verify original scientific source revision
        run: |
          test "$(git -C akis-original-science rev-parse HEAD)" = "e624520c52101a34feab62ce68b2056dc54e5301" || { echo "AKIS_RESEARCH_REVISION_INVALID"; exit 1; }
          echo "AKIS_ORIGINAL_SOURCE_IDENTITY=PASS"
      - name: Exact canonical source and complete parameter grid parity
        env:
          IWXA_AKIS_RESEARCH_SOURCE_DIR: ${{ github.workspace }}/akis-original-science
        run: |
          bun run check:akis:source-parity > "$RUNNER_TEMP/akis-parity-science.log" 2>&1 || {
            echo "AKIS_CANONICAL_PARITY=FAIL"
            grep -oE 'AKIS_[A-Z0-9_]+' "$RUNNER_TEMP/akis-parity-science.log" | sort -u | head -8 || true
            exit 1
          }
          echo "AKIS_CANONICAL_PARITY=PASS"
          echo "AKIS_TESTED_PARAMETER_GRID=10605"
          echo "AKIS_NUMERIC_FIELDS_COMPARED=159075"
      # No private files, raw logs, source archives or screenshots are uploaded.
