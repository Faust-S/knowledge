name: Admin Center 0.4.1 genuine Windows Setup Core and native GUI visual acceptance
on:
  push:
    branches:
      - work/2026-11-23-admin-center-041-unified-setup-qualification
    paths:
      - .github/workflows/admin-center-041-independent-visual-windows.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: admin-041-independent-native-gui-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-visual:
    runs-on: windows-2022
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Obtain exact fully assembled and hash-pinned unified setup
        uses: actions/download-artifact@v4
        with:
          repository: Faust-S/knowledge
          run-id: 45238012915
          name: admin-center-0.4.1-full-setup-core-candidate
          github-token: ${{ github.token }}
          path: .release-candidate
      - name: Independently pin original Windows bytes and validate UIA scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe='.release-candidate/IWXA-Admin-Center-0.4.1-Setup.exe'
          if(!(Test-Path -LiteralPath $exe -PathType Leaf)){
            throw 'ADMIN_041_VISUAL_NATIVE_INSTALLER_MISSING'
          }
          $hash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -cne '4ecc3672ea1f68536e30da8c29f89dbf53ece4a06c11f16bd0425ba8a548089e'){
            throw 'ADMIN_041_VISUAL_NATIVE_INSTALLER_SHA256_UNVERIFIED'
          }
          $read=(Get-Content -LiteralPath '.release-candidate/SHA256SUMS.txt' -Raw).Trim()
          if($read -cne ($hash+' *IWXA-Admin-Center-0.4.1-Setup.exe')){
            throw 'ADMIN_041_VISUAL_BUNDLE_MANIFEST_INVALID'
          }
          foreach($name in @('admin-center-041-setup-visual.ps1','admin-center-041-native-gui-visual.ps1')){
            $path=(Resolve-Path -LiteralPath ("packages/t3-core/tests/"+$name)).Path
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path,[ref]$tokens,[ref]$errors)|Out-Null
            if(@($errors).Count -gt 0){throw 'ADMIN_041_NATIVE_VISUAL_SCRIPT_SYNTAX_INVALID'}
          }
          Write-Host 'ADMIN_041_EXACT_RESOURCE_V2_NATIVE_INSTALLER_AND_VISUAL_TESTS_PINNED_PASS'
      - name: Open actual original unified IWXA Setup Core 1.0 GUI and capture red branded window
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference='Stop'
          & powershell.exe -NoProfile -STA -File ./packages/t3-core/tests/admin-center-041-setup-visual.ps1 -Installer '.release-candidate/IWXA-Admin-Center-0.4.1-Setup.exe' -ExpectedSha256 '4ecc3672ea1f68536e30da8c29f89dbf53ece4a06c11f16bd0425ba8a548089e' -ExpectedCenterSha '36c0a2d97e54e4ecd41bdf818441c5acc5aa2f0a' -OutputDir 'artifacts/admin-041-visual'
          if($LASTEXITCODE -ne 0){throw 'ADMIN_041_REAL_IWXA_SETUP_CORE_GUI_NOT_ACCEPTED'}
          Write-Host 'ADMIN_041_REAL_IWXA_SETUP_CORE_1_0_RED_BRAND_WINFORMS_PASS'
      - name: Install exactly that verified EXE and capture actual Tauri GUI at desktop and compact widths
        shell: pwsh
        timeout-minutes: 7
        run: |
          $ErrorActionPreference='Stop'
          & powershell.exe -NoProfile -STA -File ./packages/t3-core/tests/admin-center-041-native-gui-visual.ps1 -Installer '.release-candidate/IWXA-Admin-Center-0.4.1-Setup.exe' -ExpectedSha256 '4ecc3672ea1f68536e30da8c29f89dbf53ece4a06c11f16bd0425ba8a548089e' -OutputDir 'artifacts/admin-041-native-visual'
          if($LASTEXITCODE -ne 0){throw 'ADMIN_041_REAL_INSTALLED_NATIVE_CENTER_GUI_NOT_ACCEPTED'}
          Write-Host 'ADMIN_041_REAL_NATIVE_DESKTOP_AND_820_COMPACT_SCREENSHOTS_PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-center-041-native-visual-evidence
          path: |
            artifacts/admin-041-visual/*.png
            artifacts/admin-041-visual/*.json
            artifacts/admin-041-native-visual/*.png
            artifacts/admin-041-native-visual/*.json
          if-no-files-found: ignore
          retention-days: 7
