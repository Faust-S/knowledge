# Source diagnosis only; no private Actions, no source artifacts or site build.
name: D03 ArtBazy source anchor diagnosis
on:
  push:
    branches:
      - 'ci/once/d03-artbazy-anchor-diagnosis/**'
    paths:
      - '.github/ci-requests/d03-artbazy-anchor-diagnosis.json'
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event.created == false && github.event.deleted == false && github.event.forced == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE_PIN: a6ad6a7a90d97e04a931c8f33598373a5336c1a2
      SITE_TREE: a641b728d836017d3cf4c6d9410a8e28493e97ab
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci-harness
          persist-credentials: false
          fetch-depth: 2
      - name: Verify immutable source-only request
        working-directory: ci-harness
        run: python3 tools/ci/verify_once_request.py --repository Faust-S/knowledge --workflow d03-artbazy-anchor-diagnosis --profile source-anchor-diagnosis --revision site=a6ad6a7a90d97e04a931c8f33598373a5336c1a2
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/artbazy.ru
          ref: a6ad6a7a90d97e04a931c8f33598373a5336c1a2
          token: ${{ secrets.DOMEN }}
          path: private-site
          fetch-depth: 2
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Inspect exact source anchors without building
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git -C private-site rev-parse HEAD)" = "$SITE_PIN"
          test "$(git -C private-site rev-parse 'HEAD^{tree}')" = "$SITE_TREE"
          (cd private-site && bun install --frozen-lockfile --ignore-scripts) >"$RUNNER_TEMP/d03-anchor-install.log" 2>&1 || { echo SOURCE_DEPENDENCIES=FAIL; exit 1; }
          python3 - <<'PY'
          import subprocess
          def git(*args):
              return subprocess.check_output(['git','-C','private-site',*args])
          parent = '5994bc36837beb5534797c5349019d12ed30797c'
          paths = git('diff','--name-only','-z',parent,'HEAD').decode().strip('\0').split('\0')
          assert len(paths) == 90 and 'runtime/t3-platform/site-preservation.json' in paths
          total = 0
          for path in paths:
              if path == 'runtime/t3-platform/site-preservation.json':
                  continue
              assert path.startswith('src/') and path.endswith('.tsx')
              before = git('show',parent+':'+path)
              after = git('show','HEAD:'+path)
              i = j = inserted = 0
              while i < len(before) and j < len(after):
                  if before[i] == after[j]:
                      i += 1
                      j += 1
                  else:
                      assert after[j] == 47, 'NOT_SLASH_INSERTION'
                      inserted += 1
                      j += 1
              assert i == len(before) and j == len(after) and inserted > 0
              total += inserted
          assert total == 451
          print('SOURCE_DIFF=451_SLASH_INSERTIONS_ONLY; SOURCE_FILES=89')
          PY
          (cd private-site && npm run check:source-links && npm run test:source-links) >"$RUNNER_TEMP/d03-anchor-checks.log" 2>&1 || { echo SOURCE_LINK_CHECKS=FAIL; exit 1; }
          echo SOURCE_LINK_CHECKS=PASS
          node ci-harness/tools/ci/artbazy-delivery/audit-public-anchors.cjs private-site >"$RUNNER_TEMP/d03-anchor-audit.log"
          grep -E '^SOURCE_ANCHOR_(ROUTES|KIND|TOTAL)=' "$RUNNER_TEMP/d03-anchor-audit.log"
          if grep -Eq '^SOURCE_ANCHOR_KIND=(DATA_URL|JSX_HREF|JSX_TO)_' "$RUNNER_TEMP/d03-anchor-audit.log"; then
            echo SOURCE_CALCULATOR_LINKS=FAIL
            exit 1
          fi
          echo SOURCE_CALCULATOR_LINKS=PASS
      - name: Remove private checkout and diagnostic log
        if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/private-site" "$RUNNER_TEMP/d03-anchor-install.log" "$RUNNER_TEMP/d03-anchor-checks.log" "$RUNNER_TEMP/d03-anchor-audit.log"
