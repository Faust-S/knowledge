name: t3-core-source-qualification

on:
  push:
    branches:
      - work/2026-11-10-t3-t2-activity-projection
    paths:
      - packages/t3-core/src/t3/activity/**
      - packages/t3-core/**
      - tools/import-qualified-t2.mjs
      - tests/t3-inherited-contract.test.mjs
      - .github/workflows/t3-activity-projection.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t3-activity-projection-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install inherited T2 build dependencies
        run: npm ci --prefix packages/t3-core --ignore-scripts --no-audit --no-fund
      - run: node --check tools/import-qualified-t2.mjs
      - run: node --check packages/t3-core/src/t3/index.mjs
      - run: node --check packages/t3-core/src/t3/activity/index.mjs
      - run: node --check packages/t3-core/src/t3/activity/kernel-reader.mjs
      - run: node --check packages/t3-core/src/t3/activity/live-iwxa-client.mjs
      - run: node --check packages/t3-core/src/t3/activity/t2-host-witness.mjs
      - run: node --check packages/t3-core/src/t3/activity/real-t2-host-acceptance.mjs
      - run: node --check packages/t3-core/src/t3/activity/real-t2-d1-host-acceptance.mjs
      - run: node --test packages/t3-core/tests/t3-activity/*.test.mjs
      - run: node --experimental-strip-types --test tests/t3-inherited-contract.test.mjs
      - run: node --test packages/t3-core/tests/t3-subject-binding.test.mjs
      - run: node --test packages/t3-core/tests/t3-subject-kernel-scope.test.mjs
      - run: node --check packages/t3-core/src/t3/signed-access-host-port.mjs
      - run: node --test packages/t3-core/tests/t3-signed-access-host-port.test.mjs
      - name: Test BLI declaration in the original signed one-dist
        run: node --test packages/t3-core/scripts/t3-signed-dist-registration.test.mjs
      - name: Qualify canonical isolated signed Workspace server from public knowledge
        run: node --test packages/t3-core/tests/t3-d1-isolated-ui-server.test.mjs
      - name: Qualify staging original Control consumer without copying private code to knowledge
        run: node --test packages/t3-core/tests/t3-d1-control-consumer-stage.test.mjs
      - name: Verify D1 origin-isolated signed original Kernel carrier
        run: node --test packages/t3-core/tests/t3-d1-origin-isolated-kernel.test.mjs
      - name: Verify original Runtime 1.3 isolated bootstrap semantics
        run: node --test packages/t3-core/tests/t3-d1-origin-isolated-bootstrap.test.mjs
      - name: Run original T2 Runtime 1.3 Host facade regression
        working-directory: packages/t3-core
        run: ./node_modules/.bin/vitest run --config vitest.t3-bootstrap.config.mjs
      - name: Check T3 core inherited TypeScript source
        working-directory: packages/t3-core
        run: npm run typecheck
      - name: Build T3 core from inherited T2 source
        working-directory: packages/t3-core
        run: npm run build
      - name: Compile actual upstream WebLLM 0.2.87 Worker (public API only)
        working-directory: packages/t3-core
        run: node scripts/qualify-webllm-upstream-bundle.mjs
      - name: Verify ephemeral loopback TLS for inherited T2 Host
        working-directory: packages/t3-core
        run: node --test tests/t3-generated-loopback-tls.test.mjs
      - name: Original T2 source preflight
        if: always()
        working-directory: packages/t3-core
        run: npm run check:source
      - name: T3 product core regressions over inherited T2 code
        if: always()
        working-directory: packages/t3-core
        run: npm run test:product:core
      - name: T3 product Workspace and DOM regressions
        if: always()
        working-directory: packages/t3-core
        run: npm run test:product:workspace
      - name: Compile full BLI1 Workspace panel + WebLLM Worker in inherited T3 Host
        working-directory: packages/t3-core
        run: node scripts/qualify-bli-inherited-host.mjs
      # Nonportable archival metadata checks are retained for explicit forensic runs.
      # A regular successor product push must not burn time on expected T2-only layout.
      - name: Original T2 archival Node diagnostics (nonportable T2 metadata)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        working-directory: packages/t3-core
        run: npm run test:core
      - name: Original T2 archival Workspace diagnostics (nonportable docs)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        working-directory: packages/t3-core
        run: npm run test:workspace

  real-host:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install inherited runtime test dependencies
        run: npm ci --prefix packages/t3-core --ignore-scripts --no-audit --no-fund
      - name: Verify original 0.3.6 archive and stage via T2 verifier
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
        run: |
          set -eu
          archive=qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip
          echo "7075b8b9590ef1283e34ecb3c21dd9d1b7342697287e1aa150cd4f4a60860b68  $archive" | sha256sum -c -
          mkdir -p "$IWXA_T2_QUALIFIED_KERNEL_DIST"
          unzip -q "$archive" -d "$IWXA_T2_QUALIFIED_KERNEL_DIST"
          node --input-type=module -e 'import {assertQualifiedKernelArtifact} from "./src/factory2/products/domain-completion/independent-browser-witness.mjs"; assertQualifiedKernelArtifact(process.env.IWXA_T2_QUALIFIED_KERNEL_DIST,{kernel:"0.3.6",contract:"1.3.0",artifactId:"iwxa-kernel-k036-same-store-history-20261019-qualified.1"});'
      - name: Install real browser for original T2 Host qualification
        working-directory: packages/t3-core
        # Hosted runners normally contain the shared libraries. Installing
        # Ubuntu font packages via APT is non-deterministic on this runner and
        # must not block the original T2 browser qualification.
        run: npx --no-install playwright install chromium
      - name: Run original T2 0.3.6 Host and persistence browser qualification
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
          IWXA_T2_QUALIFIED_KERNEL_VERSION: '0.3.6'
        run: node --test tests/factory2-product-kernel.browser.mjs
      - name: Run T3 D2 live semantic activity and .iwxa exchange inheritance
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
        run: node tests/t3-activity/real-qualified-host.browser.mjs
      - name: Test domain-wide T3 switch and cold offline restart in real Chromium
        working-directory: packages/t3-core
        run: node --test tests/t3-domain-switch.browser.mjs
      # Compile the inherited Host only once. Qualify D1 first so its
      # browser first-run failures surface before the slower WebGPU timeout.
      - name: Compile complete inherited T3 Host with BLI Worker for browser qualification
        working-directory: packages/t3-core
        run: node scripts/qualify-bli-inherited-host.mjs
      - name: Run assembled signed Control one-dist on actual T2 Kernel over HTTP
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
        run: node tests/t3-d1-signed-control-one-dist.browser.mjs
      - name: Run actual compiled BLI panel in Chromium with qualified original Kernel
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
        run: node tests/t3-d5-full-bli.browser.mjs

  metal-webgpu:
    # A macOS runner was not allocated at all in #43233365753 (0 steps,
    # runner_id=0; cancelled after 15 min). Keep Linux product CI reliable.
    # The workflow is currently NOT on the repository's default branch,
    # so workflow_dispatch may not be offered. An explicit push commit with
    # [t3-metal] in its message opts in without touching the default branch.
    # Mac runner allocation and exposed hardware GPU must still be verified.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[t3-metal]')
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install inherited T3 Host dependencies
        run: npm ci --prefix packages/t3-core --ignore-scripts --no-audit --no-fund
      - name: Use OpenSSL 3 for temporary local test certificate
        run: |
          if ! brew list --versions openssl@3 >/dev/null 2>&1; then
            brew install openssl@3
          fi
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Verify and stage original T2 Kernel 0.3.6
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
        run: |
          set -eu
          archive=qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip
          echo "7075b8b9590ef1283e34ecb3c21dd9d1b7342697287e1aa150cd4f4a60860b68  $archive" | shasum -a 256 -c -
          mkdir -p "$IWXA_T2_QUALIFIED_KERNEL_DIST"
          unzip -q "$archive" -d "$IWXA_T2_QUALIFIED_KERNEL_DIST"
          node --input-type=module -e 'import {assertQualifiedKernelArtifact} from "./src/factory2/products/domain-completion/independent-browser-witness.mjs"; assertQualifiedKernelArtifact(process.env.IWXA_T2_QUALIFIED_KERNEL_DIST,{kernel:"0.3.6",contract:"1.3.0",artifactId:"iwxa-kernel-k036-same-store-history-20261019-qualified.1"});'
      - name: Install Chromium for Metal/WebGPU
        working-directory: packages/t3-core
        run: npx --no-install playwright install chromium
      - name: Build complete source-pinned BLI1/WebLLM Host once
        working-directory: packages/t3-core
        run: node scripts/qualify-bli-inherited-host.mjs
      - name: D1+D5 real Metal in compiled split-origin signed Workspace and original Kernel
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
          T3_D1_D5_REQUIRE_HARDWARE_GPU: '1'
        run: node tests/t3-d1-signed-control-one-dist.browser.mjs
      - name: D5 inherited domain real Metal generation and cold offline restart
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
          T3_D5_REQUIRE_HARDWARE_GPU: '1'
        run: node tests/t3-d5-full-bli.browser.mjs
