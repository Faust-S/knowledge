name: t3-core-source-qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t3-activity-projection-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Attest exact T3 engineering candidate and unchanged original T2 and BLI
        shell: bash
        run: |
          set -eu
          actual_src=$(git rev-parse HEAD:packages/t3-core/src)
          actual_t2=$(git rev-parse HEAD:packages/t3-core/qualified-runtime)
          actual_bli=$(git rev-parse HEAD:packages/t3-core/integration-sources)
          test "$actual_src" = "55c7731509513e80fd0aa80da25d3cb49f9f8efb"
          test "$actual_t2" = "1594274dbf5e38214b8422ba11e8c7114bd5425c"
          test "$actual_bli" = "e17b628392fb4e2dbeba2df67fdb0a5506fc5243"
          echo 'T3_FINAL_CANDIDATE_EXECUTABLE_SOURCE_TREE_PASS'
          echo 'T3_ORIGINAL_T2_AND_BLI_INPUT_TREES_UNCHANGED_PASS'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install inherited T2 build dependencies
        run: npm ci --prefix packages/t3-core --ignore-scripts --no-audit --no-fund
      - run: node --check tools/import-qualified-t2.mjs
      - run: node --check packages/t3-core/src/t3/index.mjs
      - run: node --check packages/t3-core/src/t3/activity/index.mjs
      - run: node --check packages/t3-core/src/t3/activity/kernel-reader.mjs
      - run: node --check packages/t3-core/src/t3/activity/live-iwxa-client.mjs
      - run: node --check packages/t3-core/src/t3/activity/t2-host-witness.mjs
      - run: node --check packages/t3-core/src/t3/activity/real-t2-host-acceptance.mjs
      - run: node --check packages/t3-core/src/t3/activity/real-t2-d1-host-acceptance.mjs
      - run: node --test packages/t3-core/tests/t3-activity/*.test.mjs
      - run: node --experimental-strip-types --test tests/t3-inherited-contract.test.mjs
      - run: node --test packages/t3-core/tests/t3-subject-binding.test.mjs
      - run: node --test packages/t3-core/tests/t3-subject-kernel-scope.test.mjs
      - run: node --check packages/t3-core/src/t3/signed-access-host-port.mjs
      - run: node --test packages/t3-core/tests/t3-signed-access-host-port.test.mjs
      - name: Qualify authentic Ed25519 PERSONAL Access over the inherited Kernel
        run: node --test packages/t3-core/tests/t3-d1-real-ed25519-personal.test.mjs
      - name: Run genuine signed Access through the existing Control HTTP transport
        run: |
          node --check packages/t3-core/src/t3/original-control-http-handler.mjs
          node --test packages/t3-core/tests/t3-d1-original-control-http.test.mjs
      - name: Qualify D3 original Reconciliation and signed native recipient transport
        run: |
          node --test packages/t3-core/tests/t3-reconciliation-owner-admission.test.mjs packages/t3-core/tests/t3-reconciliation-kernel-apply.test.mjs
      - name: Qualify D6 native Result continuation with original signed recovery
        run: node --test packages/t3-core/tests/t3-d6-native-continuation.test.mjs
      - name: Qualify original Agent product-owned One Dist builder, never test Host
        run: |
          node --check packages/t3-core/scripts/build-original-agent-one-dist.mjs
          node --test packages/t3-core/tests/t3-d6-agent-one-dist-builder.test.mjs
      - name: Qualify original Agent to Atlas D6 sender via existing native publisher and original ledger
        run: |
          node --check packages/t3-core/src/t3/native-agent-atlas-source-publisher.mjs
          node --test packages/t3-core/tests/t3-d6-native-agent-source-publisher.test.mjs
      - name: Qualify D7 original age recipient recovery and Exchange capability reporting
        run: node --test packages/t3-core/tests/t3-d7-protected-exchange.test.mjs
      - name: Qualify D7 original Publisher recipient readback and signed status
        run: node --test packages/t3-core/tests/t3-d7-publisher-handoff.test.mjs
      
      - name: Qualify two independently signed CORP grant/enrollment proofs over original persisted AccessRegistry
        run: |
          node --check packages/t3-core/src/t3/access/product-contracts.mjs
          node --check packages/t3-core/src/t3/access/organizational-operation.mjs
          node --test packages/t3-core/tests/t3-d1-two-corporate-original-access.test.mjs
      - name: Verify original Kernel/Store signed AccessRegistry persistence and rollback denial
        run: |
          node --check packages/t3-core/src/t3/access/original-kernel-registry-state.mjs
          node --test packages/t3-core/tests/t3-d1-original-kernel-registry.test.mjs
      - name: Qualify D3 independent employee issuer proof, original signed grants and lost ACK
        run: |
          node --check packages/t3-core/src/t3/access/original-employee-enrollment.mjs
          node --test packages/t3-core/tests/t3-d3-independent-employee-original-enrollment.test.mjs
      - name: Qualify existing offline Ed25519 encrypted local key vault
        run: node --test packages/t3-core/tests/t3-d1-original-vault.test.mjs
      - name: Test BLI declaration in the original signed one-dist
        run: node --test packages/t3-core/scripts/t3-signed-dist-registration.test.mjs
      - name: Qualify canonical isolated signed Workspace server from public knowledge
        run: node --test packages/t3-core/tests/t3-d1-isolated-ui-server.test.mjs
      - name: Verify D1 origin-isolated signed original Kernel carrier
        run: node --test packages/t3-core/tests/t3-d1-origin-isolated-kernel.test.mjs
      - name: Qualify PWA manifest and original one-dist packaging
        run: |
          node --check packages/t3-core/scripts/t3-pwa-manifest.mjs
          node --test packages/t3-core/tests/t3-pwa-install.test.mjs
          node --test packages/t3-core/tests/t3-final-one-dist-candidate.test.mjs
      - name: Verify original Runtime 1.3 isolated bootstrap semantics
        run: node --test packages/t3-core/tests/t3-d1-origin-isolated-bootstrap.test.mjs
      - name: Run original T2 Runtime 1.3 Host facade regression
        working-directory: packages/t3-core
        run: ./node_modules/.bin/vitest run --config vitest.t3-bootstrap.config.mjs
      - name: Check T3 core inherited TypeScript source
        working-directory: packages/t3-core
        run: npm run typecheck
      - name: Build T3 core from inherited T2 source
        working-directory: packages/t3-core
        run: npm run build
      - name: Compile actual upstream WebLLM 0.2.87 Worker (public API only)
        working-directory: packages/t3-core
        run: node scripts/qualify-webllm-upstream-bundle.mjs
      - name: Verify ephemeral loopback TLS for inherited T2 Host
        working-directory: packages/t3-core
        run: node --test tests/t3-generated-loopback-tls.test.mjs
      - name: Original T2 source preflight
        if: always()
        working-directory: packages/t3-core
        run: npm run check:source
      - name: T3 product core regressions over inherited T2 code
        if: always()
        working-directory: packages/t3-core
        run: npm run test:product:core
      - name: Qualify installed Agent D6 against the original T2 passport
        run: |
          node --check packages/t3-core/scripts/assemble-signed-control-dist.mjs
          node --test packages/t3-core/tests/t3-d1-signed-control-dist.test.mjs
          node --test packages/t3-core/tests/t3-d6-native-agent-source-publisher.test.mjs
      - name: T3 product Workspace and DOM regressions
        if: always()
        working-directory: packages/t3-core
        run: npm run test:product:workspace
      - name: Compile full BLI1 Workspace panel + WebLLM Worker in inherited T3 Host
        working-directory: packages/t3-core
        run: node scripts/qualify-bli-inherited-host.mjs
      # This is an owner INTEGRATION input, not a G4 release or an installed
      # product. The original Kernel and compiled Workspace are assembled by
      # each product's EXISTING Host for its actual origin and signed owner.
      - name: Record exact G4 candidate source and compiled byte hashes
        working-directory: packages/t3-core
        run: |
          set -eu
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > g4-integration.sha256
          sha256sum qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip >> g4-integration.sha256
          {
            printf 'KIND=COMPILED_OWNER_INTEGRATION_INPUT_NOT_G4_ACCEPTANCE\n'
            printf 'SOURCE_COMMIT=%s\n' "$GITHUB_SHA"
            printf 'ORIGINAL_KERNEL=0.3.6\n'
            printf 'ORIGINAL_CONTRACT=1.3.0\n'
            printf 'MODEL_ENGINE=WebLLM-0.2.87\n'
            printf 'PRIVATE_SIGNER_INCLUDED=false\n'
            printf 'MODEL_WEIGHTS_INCLUDED=false\n'
          } > g4-integration.txt
      - name: Retain compiled T3 and qualified original Kernel for independent owners
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-t3-owner-input-${{ github.sha }}
          path: |
            packages/t3-core/dist/
            packages/t3-core/qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip
            packages/t3-core/integration-sources/bli1/SOURCE_PIN.json
            packages/t3-core/package-lock.json
            packages/t3-core/g4-integration.sha256
            packages/t3-core/g4-integration.txt
          if-no-files-found: error
          retention-days: 14
      # Compiled platform and original T2 are copied once into each domain web
      # repo as versioned local build inputs, never fetched at hosting build time.
      - name: Package versioned portable T3 inputs for product-owned One Dist
        working-directory: packages/t3-core
        env:
          T3_PLATFORM_SOURCE: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {lstatSync,readdirSync,readFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {execFileSync} from 'node:child_process';
          const roots=["dist","qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip","integration-sources/bli1/SOURCE_PIN.json","package.json","package-lock.json","scripts/assemble-signed-control-dist.mjs","scripts/register-t3-local-inference.mjs","scripts/materialize-t3-domain-mode.mjs","scripts/t3-pwa-manifest.mjs","scripts/prepare-t3-one-dist-candidate.mjs","scripts/zip-store.mjs","scripts/real-kernel-e2e.mjs","src/t3","src/factory2/products/domain-completion/independent-browser-witness.mjs","src/factory2/products/domain-completion/qualified-kernel-artifact.json"];
          const digest=bytes=>createHash('sha256').update(bytes).digest('hex');
          const items=[];
          function include(path){
            const full=join(process.cwd(),path),stat=lstatSync(full);
            if(stat.isSymbolicLink())throw Error('T3_PLATFORM_SYMLINK_FORBIDDEN:'+path);
            if(stat.isDirectory()){
              for(const name of readdirSync(full).sort())include(path+'/'+name);
              return;
            }
            if(!stat.isFile()||path.split('/').some(part=>
                part==='.env'||part==='node_modules'||part==='__pycache__'))
              throw Error('T3_PLATFORM_FILE_INVALID:'+path);
            if(/\.(gguf|safetensors|onnx|pt|pth|map)$/i.test(path))
              throw Error('T3_PLATFORM_MODEL_OR_SOURCE_MAP_FORBIDDEN:'+path);
            const bytes=readFileSync(full);
            items.push({path,bytes:bytes.length,sha256:digest(bytes)});
          }
          for(const path of roots)include(path);
          items.sort((a,b)=>a.path.localeCompare(b.path,'en'));
          if(new Set(items.map(x=>x.path)).size!==items.length)
            throw Error('T3_PLATFORM_DUPLICATE_FILE');
          if(items.filter(x=>/^dist\/assets\/model-worker-[A-Za-z0-9_-]+\.js$/.test(x.path)).length!==1)
            throw Error('T3_PLATFORM_BLI_WORKER_MISSING');
          for(const name of ['LocalInferencePanel-','PublisherLicensePanel-'])
            if(!items.some(x=>x.path.startsWith('dist/assets/'+name)))
              throw Error('T3_PLATFORM_REQUIRED_COMPILED_MODULE_MISSING:'+name);
          const git=(...args)=>execFileSync('git',args,{
            cwd:join(process.cwd(),'../..'),encoding:'utf8'}).trim();
          const head=git('rev-parse','HEAD');
          if(head!==process.env.T3_PLATFORM_SOURCE)
            throw Error('T3_PLATFORM_EXACT_GIT_SHA_REQUIRED');
          const manifest={schema:'IWXA_T3_PORTABLE_PLATFORM_INPUTS/1',
            version:'0.3.0',sourceCommit:head,
            sourceTree:git('rev-parse','HEAD:packages/t3-core/src'),
            originalT2SourceCommit:'9c64951cd78411283e8a416641c36d71e169fc1d',
            originalKernel:'0.3.6',runtimeContract:'1.3.0',
            originalKernelArtifact:'iwxa-kernel-k036-same-store-history-20261019-qualified.1',
            releaseSubject:'LOCAL_BUILD_INPUT_FOR_ONE_PRODUCT_OWNED_FINAL_DIST',
            nativeSignerIncluded:false,modelWeightsIncluded:false,
            installedProductAccepted:false,domainMigrationAutoAuthorized:false,
            files:items};
          const bytes=Buffer.from(JSON.stringify(manifest,null,2)+'\n');
          writeFileSync('t3-platform-inputs.json',bytes,{flag:'wx'});
          writeFileSync('t3-platform-inputs.sha256',
            items.map(x=>x.sha256+'  '+x.path).join('\n')+'\n'+
            digest(bytes)+'  t3-platform-inputs.json\n',{flag:'wx'});
          console.log('T3_PORTABLE_PLATFORM_INPUTS_REPRODUCIBLE_PASS',
            JSON.stringify({version:manifest.version,sourceCommit:head,files:items.length,
              manifestSha256:digest(bytes),originalKernel:manifest.originalKernel}));
          NODE
          sha256sum -c t3-platform-inputs.sha256
      - name: Retain portable T3 0.3.0 platform inputs for web products
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-t3-platform-inputs-0.3.0-${{ github.sha }}
          path: |
            packages/t3-core/dist/
            packages/t3-core/qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip
            packages/t3-core/integration-sources/bli1/SOURCE_PIN.json
            packages/t3-core/package.json
            packages/t3-core/package-lock.json
            packages/t3-core/scripts/assemble-signed-control-dist.mjs
            packages/t3-core/scripts/register-t3-local-inference.mjs
            packages/t3-core/scripts/materialize-t3-domain-mode.mjs
            packages/t3-core/scripts/t3-pwa-manifest.mjs
            packages/t3-core/scripts/prepare-t3-one-dist-candidate.mjs
            packages/t3-core/scripts/zip-store.mjs
            packages/t3-core/scripts/real-kernel-e2e.mjs
            packages/t3-core/src/t3/
            packages/t3-core/src/factory2/products/domain-completion/independent-browser-witness.mjs
            packages/t3-core/src/factory2/products/domain-completion/qualified-kernel-artifact.json
            packages/t3-core/t3-platform-inputs.json
            packages/t3-core/t3-platform-inputs.sha256
          if-no-files-found: error
          retention-days: 30
      # Nonportable archival metadata checks are retained for explicit forensic runs.
      # A regular successor product push must not burn time on expected T2-only layout.
      - name: Original T2 archival Node diagnostics (nonportable T2 metadata)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        working-directory: packages/t3-core
        run: npm run test:core
      - name: Original T2 archival Workspace diagnostics (nonportable docs)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        working-directory: packages/t3-core
        run: npm run test:workspace

  real-host:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Attest exact T3 engineering candidate and unchanged original T2 and BLI
        shell: bash
        run: |
          set -eu
          actual_src=$(git rev-parse HEAD:packages/t3-core/src)
          actual_t2=$(git rev-parse HEAD:packages/t3-core/qualified-runtime)
          actual_bli=$(git rev-parse HEAD:packages/t3-core/integration-sources)
          test "$actual_src" = "55c7731509513e80fd0aa80da25d3cb49f9f8efb"
          test "$actual_t2" = "1594274dbf5e38214b8422ba11e8c7114bd5425c"
          test "$actual_bli" = "e17b628392fb4e2dbeba2df67fdb0a5506fc5243"
          echo 'T3_FINAL_CANDIDATE_EXECUTABLE_SOURCE_TREE_PASS'
          echo 'T3_ORIGINAL_T2_AND_BLI_INPUT_TREES_UNCHANGED_PASS'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install inherited runtime test dependencies
        run: npm ci --prefix packages/t3-core --ignore-scripts --no-audit --no-fund
      - name: Verify original 0.3.6 archive and stage via T2 verifier
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
        run: |
          set -eu
          archive=qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip
          echo "7075b8b9590ef1283e34ecb3c21dd9d1b7342697287e1aa150cd4f4a60860b68  $archive" | sha256sum -c -
          mkdir -p "$IWXA_T2_QUALIFIED_KERNEL_DIST"
          unzip -q "$archive" -d "$IWXA_T2_QUALIFIED_KERNEL_DIST"
          node --input-type=module -e 'import {assertQualifiedKernelArtifact} from "./src/factory2/products/domain-completion/independent-browser-witness.mjs"; assertQualifiedKernelArtifact(process.env.IWXA_T2_QUALIFIED_KERNEL_DIST,{kernel:"0.3.6",contract:"1.3.0",artifactId:"iwxa-kernel-k036-same-store-history-20261019-qualified.1"});'
      - name: Install real browser for original T2 Host qualification
        working-directory: packages/t3-core
        # Hosted runners normally contain the shared libraries. Installing
        # Ubuntu font packages via APT is non-deterministic on this runner and
        # must not block the original T2 browser qualification.
        run: npx --no-install playwright install chromium
      - name: Run original T2 0.3.6 Host and persistence browser qualification
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
          IWXA_T2_QUALIFIED_KERNEL_VERSION: '0.3.6'
        run: node --test tests/factory2-product-kernel.browser.mjs
      - name: Qualify real Ed25519 Control and durable STATUS in original Kernel across cold browser restart
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
        run: node --test tests/t3-d1-original-control-kernel.browser.mjs
      - name: Confirm original Kernel signed STATUS survives TWO cold Node Host process restarts
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
        run: node --test tests/t3-d1-real-host-process-restart.browser.mjs
      - name: Run T3 D2 live semantic activity and .iwxa exchange inheritance
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
        run: node tests/t3-activity/real-qualified-host.browser.mjs
      - name: Test domain-wide T3 switch and cold offline restart in real Chromium
        working-directory: packages/t3-core
        run: node --test tests/t3-domain-switch.browser.mjs
      - name: Qualify PWA two-window shared original Kernel and .iwxa after cold offline restart
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
        run: node --test tests/t3-pwa-original-kernel.browser.mjs
      # Desktop Agent carries signed T2 Control only; WebLLM is for browser
      # domain T3. Exercise the exact ordinary Vite build BEFORE the separate
      # browser-BLI stage modifies the disposable checkout.
      - name: Qualify desktop Agent signed original T2 Control without WebLLM worker
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
          IWXA_T3_AGENT_BUILD_PROFILE: DESKTOP_SIGNED_ONLY
        run: |
          npm run build
          node tests/t3-d6-original-agent-product-materialization.mjs
      # The later browser BLI test stages an optional WebLLM source module
      # in this disposable checkout. Preserve the ALREADY-qualified clean
      # native Agent build BEFORE that staging, not another post-BLI build.
      - name: Preserve qualified original native Agent T3 compile before BLI
        working-directory: packages/t3-core
        run: |
          set -eu
          target="$RUNNER_TEMP/iwxa-t3-native-agent-build"
          test ! -e "$target"
          mkdir -p "$target"
          cp -a dist/. "$target/"
          if find "$target" -type f -name 'model-worker-*.js' | grep -q .; then
            echo 'T3_AGENT_NATIVE_BLI_WORKER_WRONG_PROFILE'
            exit 1
          fi
          echo 'T3_AGENT_NATIVE_COMPILED_BEFORE_BLI_PASS'
      # Compile the inherited Host only once. Qualify D1 first so its
      # browser first-run failures surface before the slower WebGPU timeout.
      - name: Compile complete inherited T3 Host with BLI Worker for browser qualification
        working-directory: packages/t3-core
        run: node scripts/qualify-bli-inherited-host.mjs
      - name: Run assembled signed Control one-dist on actual T2 Kernel over HTTP
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
        run: node tests/t3-d1-signed-control-one-dist.browser.mjs
      - name: Build Agent D6 schema in the original qualified T2 One Core without changed Kernel
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
        run: node tests/t3-d6-original-agent-qualified-one-dist.mjs
      - name: Materialize original T2 product-owned Agent Host, verify signed One Dist and real browser Runtime
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
        run: node tests/t3-d6-original-agent-product-materialization.mjs
      - name: Run actual compiled BLI panel in Chromium with qualified original Kernel
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
        run: node tests/t3-d5-full-bli.browser.mjs
      # Actually assemble the existing qualified T2 + compiled T3 as ONE
      # reusable release candidate. This is a build output, not a G4 test.
      # The archive contains only public source-derived runtime bytes, never
      # the private issuer/Agent or model weights.
      - name: Stage original Agent-owned T2 from exact private read-only profile
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
          AGENT_PRIVATE_READ_TOKEN: ${{ secrets.AGENT }}
          DOMEN_PRIVATE_READ_TOKEN: ${{ secrets.DOMEN }}
          T3_PRIVATE_READ_TOKEN: ${{ secrets.T3 }}
        run: |
          node --input-type=module <<'NODE'
          import {join} from 'node:path';
          import {writeFileSync} from 'node:fs';
          import {getExactFile} from './scripts/qualify-original-private-d3-owner.mjs';
          import {materializeOriginalAgentT2Product} from './scripts/build-original-agent-one-dist.mjs';
          // Use the same three ALREADY-authorized read-only sources as
          // original Agent qualification, without printing token origins.
          const tokens=[process.env.AGENT_PRIVATE_READ_TOKEN,
            process.env.DOMEN_PRIVATE_READ_TOKEN,
            process.env.T3_PRIVATE_READ_TOKEN]
            .filter(x=>typeof x==='string'&&x.trim());
          if(!tokens.length)
            throw Error('T3_AGENT_PRODUCT_PROFILE_READ_GRANT_REQUIRED');
          // Read ONE immutable non-secret product configuration. Never clone,
          // publish original Agent source, enroll a fake signer or cache keys.
          const pin='8fcda07dae2b53a49f662a65928945350a0607df';
          let bytes=null;
          for(const token of tokens){
            try{
              bytes=await getExactFile('config/original-t2-agent-product.json',token,{
                repository:'Faust-S/iwxa-personal-agent',sourcePin:pin,
              });
              break;
            }catch(error){
              if(!['T3_PRIVATE_SOURCE_FETCH_403','T3_PRIVATE_SOURCE_FETCH_404']
                .includes(error?.message))throw error;
            }
          }
          if(!bytes)throw Error('T3_AGENT_PRODUCT_PROFILE_NOT_AUTHORIZED');
          if(bytes.length>8192)throw Error('T3_AGENT_PROFILE_TOO_LARGE');
          const path=join(process.env.RUNNER_TEMP,'iwxa-agent-original-profile.json');
          writeFileSync(path,bytes,{flag:'wx',mode:0o600});
          const prepared=await materializeOriginalAgentT2Product({
            qualifiedKernelDist:process.env.IWXA_T2_QUALIFIED_KERNEL_DIST,
            agentProfile:path,
            outputRoot:join(process.env.RUNNER_TEMP,'iwxa-t3-agent-product-t2'),
          });
          if(!prepared.verifiedKernel||prepared.productId!=='iwxa.personal-agent')
            throw Error('T3_AGENT_ORIGINAL_PRODUCT_STAGE_NOT_VERIFIED');
          console.log('T3_AGENT_PRODUCT_PROFILE_PIN',pin);
          console.log('T3_PRODUCT_OWNED_QUALIFIED_T2_STAGE_PASS');
          NODE
      # The browser's tested BLI build must never be shipped inside
      # native Agent, whose T3 Workspace uses other model integrations.
      - name: Assemble product-owned original T3 One Dist RC (no private signer)
        working-directory: packages/t3-core
        run: |
          node scripts/prepare-t3-one-dist-candidate.mjs \
            "$RUNNER_TEMP/iwxa-t3-agent-product-t2" \
            "$RUNNER_TEMP/iwxa-t3-native-agent-build" \
            "$RUNNER_TEMP/iwxa-t3-one-dist-rc" \
            "0.3.0-rc.1" \
            "$(git rev-parse HEAD)" \
            "9c64951cd78411283e8a416641c36d71e169fc1d" \
            --installed-agent-d6-control-only
          (cd "$RUNNER_TEMP/iwxa-t3-one-dist-rc" && sha256sum -c SHA256SUMS.txt)
      - name: Retain original T2 T3 One Dist RC ZIP, manifest and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-t3-one-dist-rc-${{ github.sha }}
          path: ${{ runner.temp }}/iwxa-t3-one-dist-rc/
          if-no-files-found: error
          retention-days: 14

  native-model:
    # Opt-in genuine native external model owner. No inference engine or model
    # weights are bundled with T3 and no private Agent is run on public CI.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[t3-native]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Attest exact T3 engineering candidate and unchanged original T2 and BLI
        shell: bash
        run: |
          set -eu
          actual_src=$(git rev-parse HEAD:packages/t3-core/src)
          actual_t2=$(git rev-parse HEAD:packages/t3-core/qualified-runtime)
          actual_bli=$(git rev-parse HEAD:packages/t3-core/integration-sources)
          test "$actual_src" = "55c7731509513e80fd0aa80da25d3cb49f9f8efb"
          test "$actual_t2" = "1594274dbf5e38214b8422ba11e8c7114bd5425c"
          test "$actual_bli" = "e17b628392fb4e2dbeba2df67fdb0a5506fc5243"
          echo 'T3_FINAL_CANDIDATE_EXECUTABLE_SOURCE_TREE_PASS'
          echo 'T3_ORIGINAL_T2_AND_BLI_INPUT_TREES_UNCHANGED_PASS'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source-pinned original Host dependencies
        run: npm ci --prefix packages/t3-core --ignore-scripts --no-audit --no-fund
      - name: Verify and stage original T2 Kernel 0.3.6
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
        run: |
          set -eu
          archive=qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip
          echo "7075b8b9590ef1283e34ecb3c21dd9d1b7342697287e1aa150cd4f4a60860b68  $archive" | sha256sum -c -
          mkdir -p "$IWXA_T2_QUALIFIED_KERNEL_DIST"
          unzip -q "$archive" -d "$IWXA_T2_QUALIFIED_KERNEL_DIST"
          node --input-type=module -e 'import {assertQualifiedKernelArtifact} from "./src/factory2/products/domain-completion/independent-browser-witness.mjs"; assertQualifiedKernelArtifact(process.env.IWXA_T2_QUALIFIED_KERNEL_DIST,{kernel:"0.3.6",contract:"1.3.0",artifactId:"iwxa-kernel-k036-same-store-history-20261019-qualified.1"});'
      - name: Install browser for original Kernel cold readback
        working-directory: packages/t3-core
        run: npx --no-install playwright install chromium
      - name: Download exact external llama.cpp binary and local Qwen3 weights
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/t3-native/exec"
          curl --fail --location --retry 3 --max-time 240 \
            "https://github.com/ggml-org/llama.cpp/releases/download/b12244/llama-b12244-bin-ubuntu-x64.tar.gz" \
            -o "$RUNNER_TEMP/t3-native/llama-bin.tar.gz"
          echo "c1d7e7f31b5c43f3e5d44f667b4d57104217be3e5f2060320cd3735651238849  $RUNNER_TEMP/t3-native/llama-bin.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/t3-native/llama-bin.tar.gz" -C "$RUNNER_TEMP/t3-native/exec"
          cli=$(find "$RUNNER_TEMP/t3-native/exec" -type f -name llama-cli | head -n 1)
          test -n "$cli"
          chmod +x "$cli"
          "$cli" --version
          curl --fail --location --retry 3 --max-time 480 \
            "https://huggingface.co/ggml-org/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_0.gguf" \
            -o "$RUNNER_TEMP/t3-native/Qwen3-0.6B-Q4_0.gguf"
          echo "da2572f16c06133561ce56accaa822216f2391ef4d37fba427801cd6736417d4  $RUNNER_TEMP/t3-native/Qwen3-0.6B-Q4_0.gguf" | sha256sum -c -
          echo "T3_D5_NATIVE_LLAMA_CLI=$cli" >> "$GITHUB_ENV"
          echo "T3_D5_NATIVE_GGUF=$RUNNER_TEMP/t3-native/Qwen3-0.6B-Q4_0.gguf" >> "$GITHUB_ENV"
      - name: Real native Qwen3 -> original Kernel -> two cold local drafts
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
        run: node --test tests/t3-d5-real-native-owner.browser.mjs

