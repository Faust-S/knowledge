name: t3-core-source-qualification

on:
  push:
    branches:
      - work/2026-11-10-t3-t2-activity-projection
    paths:
      - modules/t3-activity-projection/**
      - packages/t3-core/**
      - tools/import-qualified-t2.mjs
      - tests/t3-inherited-contract.test.mjs
      - .github/workflows/t3-activity-projection.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t3-activity-projection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check modules/t3-activity-projection/index.mjs
      - run: node --check modules/t3-activity-projection/kernel-reader.mjs
      - run: node --check modules/t3-activity-projection/live-iwxa-client.mjs
      - run: node --check modules/t3-activity-projection/t2-host-witness.mjs
      - run: node --check modules/t3-activity-projection/real-t2-host-acceptance.mjs
      - run: node --test modules/t3-activity-projection/test/*.test.mjs
      - run: node --experimental-strip-types --test tests/t3-inherited-contract.test.mjs
