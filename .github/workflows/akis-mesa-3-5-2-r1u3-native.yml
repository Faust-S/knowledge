name: AKIS Mesa 3.5.2 R1-U3 dissolution and reconstitution

on:
  push:
    branches:
      - work/2026-11-22-akis-r1u3-dissolution-reconstitution-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-mesa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native original Mesa 3.5.2
        run: |
          python -m pip install --disable-pip-version-check "mesa==3.5.2" "pytest>=8,<10"
          python -c "import mesa; assert mesa.__version__ == '3.5.2'; print('MESA_3_5_2_PASS')"
      - name: Compile original research model
        run: |
          python -m compileall -q qualifications/akis_2026_11_21/research
      - name: Full original AKIS Mesa and R1-U3 regression
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: |
          python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests
