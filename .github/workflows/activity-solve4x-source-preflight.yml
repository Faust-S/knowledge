name: IWXA Solve4X bounded source and pair inspection

on:
  workflow_dispatch:
  push:
    branches:
      - work/2026-11-03-unified-task-migration
    paths:
      - '.github/workflows/activity-solve4x-source-preflight.yml'
      - 'research/activity-research/solve4x_small_member_pair.py'
      - 'research/activity-research/solve4x_zip_range_probe.py'
      - 'research/activity-research/solve4x_same_case_audit.py'
      - 'research/activity-research/solve4x_global_itam_audit.py'
      - 'research/activity-research/solve4x_scene_ui_audit.py'
      - 'research/activity-research/solve4x_ui_ocel_time.py'
      - 'research/activity-research/tests/test_solve4x_ui_ocel_time.py'
      - 'research/activity-research/tests/test_solve4x_global_itam_audit.py'
      - 'research/activity-research/tests/test_solve4x_same_case_audit.py'

permissions:
  contents: read

jobs:
  source-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Offline ZIP-directory parsing and fail-closed tests
        run: python3 -m unittest discover -s research/activity-research/tests -p 'test_solve4x_zip_range_probe.py' -v
      - name: Request official article metadata, never media
        run: |
          python3 - <<'PY'
          import hashlib, json, socket, urllib.request, urllib.error
          from pathlib import Path

          url="https://api.figshare.com/v2/articles/25246291"
          result={
            "schema":"IWXA_SOLVE4X_DIRECT_METADATA_FEASIBILITY/0.1",
            "status":"SOURCE_ACCESS_HOLD",
            "source_url":url,
            "expected_article_id":25246291,
            "media_downloaded":False,
            "source_file_bytes_redistributed":False,
            "raw_video_processed":False,
            "case_level_multimodal_agreement":"NOT_MEASURED",
            "independent_task_quality":"NOT_MEASURED",
          }
          try:
              request=urllib.request.Request(url,headers={
                  "User-Agent":"IWXA-Research-Source-Preflight/0.1",
                  "Accept":"application/json",
              })
              with urllib.request.urlopen(request,timeout=16) as response:
                  raw=response.read(1024*1024+1)
              if not (0<len(raw)<=1024*1024):
                  result.update(status="METADATA_SIZE_HOLD")
              else:
                  obj=json.loads(raw)
                  files=obj.get("files")
                  if obj.get("id")!=25246291 or not isinstance(files,list):
                      result.update(status="METADATA_ID_OR_FILES_HOLD")
                  else:
                      eligible=[]
                      for f in files:
                          if not isinstance(f,dict):continue
                          name=f.get("name")
                          size=f.get("size")
                          if not isinstance(name,str) or not isinstance(size,int):continue
                          if (name in ("itam.ocelxml","itam_ocel.json","scene01_vid.json",
                                       "scene01_ocel.json","scene01_video_ocel.json") or
                              name.endswith("/scene01_vid.json") or
                              name.endswith("/scene01_ocel.json") or
                              name.lower().endswith(".zip")):
                              eligible.append({
                                  "name":name,
                                  "size_bytes":size,
                                  "file_id":f.get("id") if isinstance(f.get("id"),int) else None,
                                  "selective_under_8mb":size<=8*1024*1024,
                              })
                      result.update(
                          status="DIRECT_FIGSHARE_METADATA_PASS_NOT_CASE_ALIGNMENT",
                          article_id=obj["id"],
                          metadata_sha256=hashlib.sha256(raw).hexdigest(),
                          files_declared=len(files),
                          total_declared_bytes=sum(f.get("size",0) for f in files
                              if isinstance(f,dict) and isinstance(f.get("size"),int)),
                          target_name_candidates=eligible[:100],
                          file_listing_truncated=len(eligible)>100,
                          license_from_figshare_metadata=obj.get("defined_type_name"),
                          provider_license=obj.get("license"),
                      )
          except (OSError,ValueError,TimeoutError,socket.timeout,
                  urllib.error.HTTPError,urllib.error.URLError) as exc:
              result.update(status="SOURCE_ACCESS_HOLD",
                            failure_class=type(exc).__name__)
          Path("solve4x-source-preflight.json").write_text(json.dumps(
              result,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          print("SOLVE4X_SOURCE_PREFLIGHT",result["status"],
                "files",result.get("files_declared","UNKNOWN"),
                "target_candidates",len(result.get("target_name_candidates",[])),
                "case_alignment",result["case_level_multimodal_agreement"])
          PY
      - name: Upload source manifest only (no data files)
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-solve4x-source-availability-only
          path: solve4x-source-preflight.json
          retention-days: 7
          if-no-files-found: error

      - name: Probe HTTP range index only; do not download the ZIP archive
        run: |
          python3 research/activity-research/solve4x_zip_range_probe.py \
            --out solve4x-zip-range-index.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("solve4x-zip-range-index.json").read_text())
          assert result["schema"]=="IWXA_SOLVE4X_ZIP_RANGE_INDEX/0.1"
          assert result["full_archive_downloaded"] is False
          assert result["case_level_two_modalities_loaded"] is False
          assert result["accepted_tasks"] == 0
          print("SOLVE4X_ZIP_INDEX_RESULT",result["status"],
                "candidate_files",result.get("target_files_count","UNKNOWN"),
                "task_gold",result["human_task_gold"])
          PY
      - name: Upload ZIP directory file names and bounded source hashes only
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-solve4x-zip-range-index
          path: solve4x-zip-range-index.json
          retention-days: 7
          if-no-files-found: error

      - name: Verify bounded selective member extraction and no raw source leakage
        run: python3 -m unittest discover -s research/activity-research/tests -p 'test_solve4x_small_member_pair.py' -v
      - name: Fetch two tiny source members using exact ZIP byte ranges
        run: |
          python3 research/activity-research/solve4x_small_member_pair.py \
            --out solve4x-small-member-pair.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("solve4x-small-member-pair.json").read_text())
          assert r["schema"]=="IWXA_SOLVE4X_SMALL_MEMBER_PAIR/0.1"
          assert r["no_full_archive_download"] is True
          assert r["raw_member_content_exported"] is False
          assert r["two_modalities_case_alignment"]=="NOT_MEASURED"
          assert r["accepted_tasks"]==0
          print("SOLVE4X_SELECTIVE_PAIR",r["status"],"members",len(r.get("members",{})),
                "full_archive","NOT_DOWNLOADED")
          PY
      - name: Publish small JSON schema and SHA diagnostics only
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-solve4x-two-small-member-structure
          path: solve4x-small-member-pair.json
          retention-days: 7
          if-no-files-found: error

      - name: Run same-case identity and non-independence negative tests
        run: python3 -m unittest discover -s research/activity-research/tests -p 'test_solve4x_same_case_audit.py' -v
      - name: Compare author video activities with structurally marked OCEL events
        run: |
          python3 research/activity-research/solve4x_same_case_audit.py \
            --out solve4x-same-case-derived.json || true
          python3 - <<'PY'
          import json
          with open("solve4x-same-case-derived.json") as f: r=json.load(f)
          assert r["schema"]=="IWXA_SOLVE4X_SAME_CASE_EVIDENCE_AUDIT/0.1"
          assert r["raw_source_exported"] is False
          assert r["constraints"]["accepted_tasks"]==0
          assert r["constraints"]["independent_itam_raw_log_source"]=="NOT_LOADED"
          if r["status"]=="REAL_SCENE_DERIVATIVES_IDENTITY_COMPARISON_NOT_INDEPENDENT_TRUTH":
              c=r["counts"]
              assert c["author_annotation_nodes"]==26
              assert c["video_annotated_activity_segments"]==23
              assert c["ocel_registered_events"]==40
              assert c["ocel_events_with_end_time_marker"]==23
              assert c["ocel_events_without_end_time_marker"]==17
              assert c["literal_activity_multiset_match_with_end_time_marker"]==23
              assert c["literal_video_ocel_marked_activity_multisets_equal"] is True
              assert r["constraints"]["end_time_field_marker_origin"]=="STRUCTURAL_PROXY_NOT_INDEPENDENTLY_ATTESTED"
              assert r["source"]["video_annotation_sha256"]=="d698dc90741b359b9594cfc262887f180215d15434301a55d941e835621b5ff3"
              assert r["source"]["joined_ocel_sha256"]=="5de185ada7d0e8d82e3f43929e594c31a1c52aad334197557cc7c2550d3f1f15"
              print("SOLVE4X_VIDEO_JOINED_OCEL_MULTISETS_MATCH",23,"of",23,
                    "remaining_unmarked_events",17,
                    "INDEPENDENT_WORK_TRUTH_NOT_VERIFIED")
          print("SOLVE4X_SAME_CASE_COUNTS",r["status"],
                r.get("counts",{}).get("case_references_in_both","UNKNOWN"),
                "literal_activity_overlaps",
                r.get("counts",{}).get("shared_literal_activity_strings","UNKNOWN"))
          PY
      - name: Publish derived same-case comparison with no source event text
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-solve4x-same-case-identity-aggregates
          path: solve4x-same-case-derived.json
          retention-days: 7
          if-no-files-found: error

      - name: Validate scoped global ITAM source comparison on offline negative controls
        run: python3 -m unittest discover -s research/activity-research/tests -p 'test_solve4x_global_itam_audit.py' -v
      - name: Compare exact original global OCEL with scene OCEL, no event export
        run: |
          python3 research/activity-research/solve4x_global_itam_audit.py \
            --out solve4x-global-itam-derived.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("solve4x-global-itam-derived.json").read_text())
          assert r["schema"]=="IWXA_SOLVE4X_GLOBAL_ITAM_SCENE_COMPARISON/0.1"
          assert r["raw_source_events_exported"] is False
          assert r["limits"]["accepted_tasks"] == 0
          assert r["limits"]["human_task_gold"] == "NOT_MEASURED"
          if r["status"]=="DIRECT_GLOBAL_AND_SCENE_OCEL_RECORD_SCOPE_COMPARED":
              assert r["counts"]["scene_recorded_events"]==40
              assert r["counts"]["scene_marked_end_time_events"]==23
              assert r["counts"]["scene_unmarked_end_time_events"]==17
              assert r["source"]["scene_ocel_sha256"]=="5de185ada7d0e8d82e3f43929e594c31a1c52aad334197557cc7c2550d3f1f15"
              assert r["source"]["full_archive_downloaded"] is False
          print("SOLVE4X_GLOBAL_ITAM_CONSISTENCY",r["status"],
                "global_recorded",r.get("counts",{}).get("global_recorded_events","UNKNOWN"),
                "scene_unmarked_matched",r.get("counts",{}).get("scene_unmarked_matching_global_timestamp_activity","UNKNOWN"),
                "human_gold",r["limits"]["human_task_gold"])
          PY
      - name: Upload aggregate global-to-scene ITAM source comparison
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-solve4x-global-itam-scene-aggregates
          path: solve4x-global-itam-derived.json
          retention-days: 7
          if-no-files-found: error

      - name: Validate separate user interface CSV structure
        run: python3 -m unittest discover -s research/activity-research/tests -p 'test_solve4x_scene_ui_audit.py' -v
      - name: Inspect published UI CSV without exporting source values
        run: |
          python3 research/activity-research/solve4x_scene_ui_audit.py --out solve4x-ui-summary.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("solve4x-ui-summary.json").read_text())
          assert r["schema"]=="IWXA_SOLVE4X_SCENE_UI_CSV_SOURCE_AUDIT/0.1"
          assert r["source"]["original_rows_exported"] is False
          assert r["qualification"]["accepted_tasks"]==0
          print("SOLVE4X_UI_SCOPE",r["status"],"rows",r.get("scope",{}).get("row_count","UNKNOWN"))
          PY
      - name: Upload UI CSV schema and counts only
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-solve4x-ui-source-schema
          path: solve4x-ui-summary.json
          retention-days: 7
          if-no-files-found: error

      - name: Validate UI to scene event temporal proximity and negative controls
        run: python3 -m unittest discover -s research/activity-research/tests -p 'test_solve4x_ui_ocel_time.py' -v
      - name: Compare two time-stamped source types in bounded research
        run: |
          python3 research/activity-research/solve4x_ui_ocel_time.py --out solve4x-ui-time.json || true
          python3 - <<'PY'
          import json
          r=json.load(open("solve4x-ui-time.json"))
          assert r["schema"]=="IWXA_SOLVE4X_UI_OCEL_TEMPORAL_CO_OCCURRENCE/0.1"
          assert r["raw_values_exported"] is False
          assert r["limitations"]["accepted_tasks"]==0
          if r["status"]=="DIRECT_UI_OCEL_ABSOLUTE_TIME_PROXIMITY_NOT_EVENT_IDENTITY":
              assert r["counts"]["ui_rows"]==43
              assert r["counts"]["scene_system_candidate_events"]==17
              assert r["counts"]["scene_video_derived_events"]==23
              assert r["source"]["ui_csv_sha256"]=="653e0b52ec64c9f1629eb758091cdad5e5c3cb47d68531b2174ec0c6a6c0a1bb"
              assert r["limitations"]["aligned_clocks_proven"] is False
          if r["status"]=="TIMEZONE_ALIGNMENT_HOLD" and r.get("conditional_naive_wall_time"):
              p=r["clock_format_profile"]
              assert p["ui"]=={"aware":0,"naive":43,"invalid":0}
              assert p["ocel"]=={"aware":0,"naive":40,"invalid":0}
              conditional=r["conditional_naive_wall_time"]
              assert conditional["clock_time_zone_or_offset_verified"] is False
              assert conditional["window_counts"]["5s"]["ui_near_system"]==5
              assert conditional["window_counts"]["5s"]["system_near_ui"]==5
              assert conditional["window_counts"]["30s"]["system_near_ui"]==15
              print("SOLVE4X_CONDITIONAL_WALL_CLOCK_REPLAY_PASS",
                    "five_seconds_system_hits",5,"thirty_seconds",15,
                    "CLOCK_ALIGNMENT_HOLD")
          print("SOLVE4X_UI_TIME_STATUS",r["status"],"counts",r.get("counts",{}))
          PY
      - name: Publish UI-to-OCEL time window aggregates only
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-solve4x-ui-ocel-time-windows
          path: solve4x-ui-time.json
          retention-days: 7
          if-no-files-found: error
