name: d06-item-fleet-ui-qualification

# Tests current physical-item Workspace UI against a real static site build.
# All D06/domain sources, dist, screenshots and raw test logs stay on runner.
on:
  push:
    branches:
      - test/2026-11-18-d06-qualification
    paths:
      - .github/workflows/d06-item-fleet-ui-qualification.yml
permissions:
  contents: read
jobs:
  item-fleet-ui:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Read exact private D06 site
        uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod.ru
          ref: c7538391645cdde63557cbc038ef05a504322449
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - name: Read canonical domain item binding privately
        uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod
          ref: ce66412a32049701a241dcdf383a32fb7d1aeeb0
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/domain
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify contract and source compilation
        shell: pwsh
        working-directory: private/site
        timeout-minutes: 10
        run: |
          $canon = (& git -C ../domain rev-parse "HEAD:src/rules/item-result-binding.ts").Trim()
          $site = (& git rev-parse "HEAD:src/rules/item-result-binding.ts").Trim()
          if ($canon -ne $site) { Write-Host "D06_ITEM_CONTRACT_SYNC=FAIL"; exit 1 }
          Write-Host "D06_ITEM_CONTRACT_SYNC=PASS"
          $log = Join-Path $env:RUNNER_TEMP "d06-item-ci-private.txt"
          & npm ci --no-audit --no-fund *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_ITEM_NPM_CI=FAIL"; exit 1 }
          Write-Host "D06_ITEM_NPM_CI=PASS"
          & node ../domain/scripts/test-item-result-binding.mjs *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_ITEM_CANONICAL_TEST=FAIL"; exit 1 }
          Write-Host "D06_ITEM_CANONICAL_TEST=PASS"
          & npm run check:type *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_ITEM_TYPE=FAIL"; exit 1 }
          Write-Host "D06_ITEM_TYPE=PASS"
          & npm run test:item-lifecycle-view *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_ITEM_PROJECTION=FAIL"; exit 1 }
          Write-Host "D06_ITEM_PROJECTION=PASS"
          & npm run test:session *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_ITEM_SESSION_ADAPTER=FAIL"; exit 1 }
          Write-Host "D06_ITEM_SESSION_ADAPTER=PASS"
          & npm run test:native-item-binding *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_ITEM_NATIVE_ADAPTER=FAIL"; exit 1 }
          Write-Host "D06_ITEM_NATIVE_ADAPTER=PASS"
      - name: Build immutable static site and install test browser
        shell: pwsh
        working-directory: private/site
        timeout-minutes: 22
        run: |
          $log = Join-Path $env:RUNNER_TEMP "d06-item-build-private.txt"
          & npm run build:static *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_ITEM_BUILD=FAIL"; exit 1 }
          Write-Host "D06_ITEM_BUILD=PASS"
          & npm run setup:browser *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_ITEM_BROWSER=FAIL"; exit 1 }
          Write-Host "D06_ITEM_BROWSER=PASS"
      - name: Two-item ownership and lifecycle UI journeys
        shell: pwsh
        working-directory: private/site
        timeout-minutes: 15
        run: |
          $log = Join-Path $env:RUNNER_TEMP "d06-item-e2e-private.txt"
          $env:PLAYWRIGHT_JSON_OUTPUT_FILE = Join-Path $env:RUNNER_TEMP "d06-item-e2e-report.private.json"
          & npm run test:e2e -- tests/e2e/d06-item-context.spec.ts tests/e2e/d06-pd20-pd21-manual-save.spec.ts --reporter=json *> $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "D06_ITEM_E2E=FAIL"
            if (Test-Path -LiteralPath $env:PLAYWRIGHT_JSON_OUTPUT_FILE) {
              $js = 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const bad=new Set(["failed","timedOut","interrupted"]);function scan(s){for(const x of s.suites||[])scan(x);for(const sp of s.specs||[])for(const t of sp.tests||[])for(const z of t.results||[]){if(!bad.has(z.status))continue;const filename=String(sp.file||sp.location?.file||s.file||"");const which=filename.includes("d06-item-context")?1:filename.includes("d06-pd20-pd21-manual-save")?2:0;const trace=[...(z.errors||[]),z.error].filter(Boolean).map(e=>String(e.stack||e.message||"")).join(" ");const matches=[...trace.matchAll(/d06-(?:item-context|pd20-pd21-manual-save)\.spec\.ts:(\d+):/g)];console.log("D06_ITEM_PD21_CONTEXT_MASK="+(trace.match(/D06_PD21_CONTEXT_MASK=([01]{4})/)?.[1]||"NONE"));console.log("D06_ITEM_E2E_FAIL_SPEC="+which);console.log("D06_ITEM_E2E_FAIL_LINE="+(matches.length?matches[0][1]:0));console.log("D06_ITEM_E2E_FAIL_STATUS="+z.status);}}for(const x of r.suites||[])scan(x);'
              & node -e $js $env:PLAYWRIGHT_JSON_OUTPUT_FILE
              if ($LASTEXITCODE -ne 0) {
                Write-Host "D06_ITEM_E2E_JSON_DIAGNOSTICS=FAIL"
              }
            } else {
              Write-Host "D06_ITEM_E2E_JSON_DIAGNOSTICS=ABSENT"
            }
            $txt = Get-Content -LiteralPath $log -Raw
            Write-Host ("D06_ITEM_E2E_TIMEOUT_CLASS=" + [int]($txt -match "TimeoutError|Timeout [0-9]+ms exceeded"))
            Write-Host ("D06_ITEM_E2E_ASSERTION_CLASS=" + [int]($txt -match "AssertionError|expect\\(.*\\)\\.to"))
            Write-Host ("D06_ITEM_E2E_NO_TESTS=" + [int]($txt -match "No tests found|unknown option|unexpected argument"))
            Write-Host ("D06_ITEM_E2E_RUNTIME=" + [int]($txt -match "TypeError|ReferenceError|Cannot find module|ERR_MODULE_NOT_FOUND"))
            Write-Host ("D06_ITEM_E2E_NAVIGATION=" + [int]($txt -match "locator\\.(click|fill)|ERR_CONNECTION|ECONNREFUSED"))
            Write-Host ("D06_ITEM_E2E_EXPECT=" + [int]($txt -match "toHave|toBeVisible|toContainText|AssertionError"))
            Write-Host ("D06_ITEM_E2E_RUNNER=" + [int]($txt -match "Running [0-9]+ tests|\\[chromium\\]"))
            exit 1
          }
          Write-Host "D06_ITEM_E2E=PASS"
      - name: Confirm private source isolation
        if: always()
        shell: pwsh
        run: |
          Write-Host "D06_ITEM_PRIVATE_SOURCE_PUBLICATION=0"
          Write-Host "D06_ITEM_PRIVATE_DIST_PUBLICATION=0"
          Write-Host "D06_ITEM_PRIVATE_TEST_REPORT_PUBLICATION=0"
