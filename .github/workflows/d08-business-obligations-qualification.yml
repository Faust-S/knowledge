name: D08 business obligations private-source ephemeral qualification
on:
  push:
    branches: [work/2026-11-02-pipeline-foundation]
    paths: [.github/workflows/d08-business-obligations-qualification.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d08-business-obligations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualified:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact private subject-model commit without persistence
        uses: actions/checkout@v4
        with:
          repository: Faust-S/market-ops
          ref: 91ab36f32c00b4c89bd869f10c477fd406319638
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: logic
      - name: Checkout exact private website commit without persistence
        uses: actions/checkout@v4
        with:
          repository: Faust-S/market-ops.ru
          ref: 9d28d24bae9a6848595a690a676936384e277490
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - name: Verify private revisions, never emit private source
        run: |
          test "$(git -C logic rev-parse HEAD)" = "91ab36f32c00b4c89bd869f10c477fd406319638" || exit 1
          test "$(git -C site rev-parse HEAD)" = "9d28d24bae9a6848595a690a676936384e277490" || exit 1
          cmp logic/model/business-obligation.mjs site/t2-site-module/marketops/decision/business-obligation.mjs
          cmp logic/model/business-obligation.d.mts site/t2-site-module/marketops/decision/business-obligation.d.mts
          cmp logic/model/business-goods-cash-coordination.mjs site/t2-site-module/marketops/decision/business-goods-cash-coordination.mjs
          cmp logic/model/business-goods-cash-coordination.d.mts site/t2-site-module/marketops/decision/business-goods-cash-coordination.d.mts
          echo D08_SUBJECT_PARITY=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Subject-model regression suite
        working-directory: logic
        run: |
          node --test tests/business-obligation.test.mjs tests/business-goods-cash-coordination.test.mjs > "$RUNNER_TEMP/d08-model.log" 2>&1 || {
            echo D08_MODEL_TESTS=FAIL; exit 1;
          }
          echo D08_MODEL_TESTS=PASS
      - name: Install canonical site dependencies
        working-directory: site
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d08-install.log" 2>&1 || {
            echo D08_INSTALL=FAIL; exit 1;
          }
          echo D08_INSTALL=PASS
      - name: T2 obligations and UI contracts
        working-directory: site
        run: |
          node --import tsx --test tests/marketops-business-obligation.test.mjs tests/marketops-business-goods-cycle.test.mjs > "$RUNNER_TEMP/d08-obligations.log" 2>&1 || {
            echo D08_T2_OBLIGATIONS=FAIL; exit 1;
          }
          echo D08_T2_OBLIGATIONS=PASS
      - name: Whole site TypeScript and D08 adapters
        working-directory: site
        run: |
          npm run check:types > "$RUNNER_TEMP/d08-types.log" 2>&1 || {
            echo D08_TYPES=FAIL; exit 1;
          }
          echo D08_TYPES=PASS
          npm run test:d08:adapters > "$RUNNER_TEMP/d08-adapters.log" 2>&1 || {
            echo D08_ADAPTERS=FAIL
            grep -E '^not ok [0-9]+|^    not ok [0-9]+|^# (tests|pass|fail|cancelled) ' "$RUNNER_TEMP/d08-adapters.log" | tail -25 || true
            exit 1;
          }
          echo D08_ADAPTERS=PASS
      # No artifacts and no logs uploaded. Private source and dist stay ephemeral.
