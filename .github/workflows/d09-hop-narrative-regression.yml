name: D09 HOP canonical T2 Host and domain regression
on:
  push:
    branches: [work/2026-11-02-pipeline-foundation]
    paths: [.github/workflows/d09-hop-narrative-regression.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d09-narrative:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private site without publishing files
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop.iwxa.ru
          ref: work/2026-10-27-d09-t2-site-only
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact npm dependencies
        shell: bash
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-npm.log" 2>&1 || {
            echo "D09_NPM_CI=FAIL"; exit 1;
          }
          echo "D09_NPM_CI=PASS"
      - name: Record exact HOP revision and check Result source boundary
        shell: bash
        run: |
          echo "D09_SITE_HEAD=$(git rev-parse HEAD)"
          node --experimental-strip-types --test tests/d09-read-model-guards.test.mjs > "$RUNNER_TEMP/d09-result-source.log" 2>&1 || {
            echo "D09_RESULT_SOURCE_GUARD=FAIL"; exit 1;
          }
          echo "D09_RESULT_SOURCE_GUARD=PASS"
      - name: Check TypeScript
        shell: bash
        run: |
          npm run typecheck > "$RUNNER_TEMP/d09-types.log" 2>&1 || {
            echo "D09_TYPES=FAIL"
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/d09-types.log" | sed -E 's/: error (TS[0-9]+):.*/: \1/' | head -30 || true
            exit 1
          }
          echo "D09_TYPES=PASS"
      - name: Run semantic narrative tests
        shell: bash
        run: |
          npx vitest run src/lib/__tests__/narrative-brief-import.test.ts > "$RUNNER_TEMP/d09-narrative.log" 2>&1 || {
            echo "D09_NARRATIVE_TEST=FAIL"; exit 1;
          }
          echo "D09_NARRATIVE_TEST=PASS"
      - name: Run D09 host and copy tests
        shell: bash
        run: |
          npm run test:d09 > "$RUNNER_TEMP/d09-integration.log" 2>&1 || {
            echo "D09_HOST_TEST=FAIL"; exit 1;
          }
          echo "D09_HOST_TEST=PASS"
      - name: Checkout canonical private HOP logic
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop
          ref: work/2026-11-19-narrative-ai-import
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: canonical-hop
      - name: Verify subject-code parity with the website
        shell: bash
        run: |
          for file in src/lib/narrative-brief-import.ts src/lib/__tests__/narrative-brief-import.test.ts src/content-system/editorial.ts src/content-system/surfaces.ts src/product-system/registry.ts; do
            cmp "$file" "canonical-hop/$file" || { echo "D09_CANONICAL_PARITY=FAIL"; exit 1; }
          done
          echo "D09_CANONICAL_PARITY=PASS"
      - name: Check public UX and product contracts
        shell: bash
        run: |
          npm run check:consumer-ux > "$RUNNER_TEMP/d09-ux.log" 2>&1 || {
            echo "D09_CONSUMER_UX=FAIL"; exit 1;
          }
          echo "D09_CONSUMER_UX=PASS"
          npm run check:product-contracts > "$RUNNER_TEMP/d09-contracts.log" 2>&1 || {
            echo "D09_PRODUCT_CONTRACTS=FAIL"; exit 1;
          }
          echo "D09_PRODUCT_CONTRACTS=PASS"
      - name: Build standalone public HOP stage
        shell: bash
        run: |
          npm run build:public-stage > "$RUNNER_TEMP/d09-public-build.log" 2>&1 || {
            echo "D09_PUBLIC_STAGE=FAIL"; exit 1;
          }
          echo "D09_PUBLIC_STAGE=PASS"
      - name: Checkout normative T2 at the verified main revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: 9c64951cd78411283e8a416641c36d71e169fc1d
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          sparse-checkout: |
            t2/current/final-successor/canonical-source
          path: d09-temporary-t2
      - name: Prepare separate disposable T2 checkout
        shell: bash
        run: |
          mv d09-temporary-t2 "$RUNNER_TEMP/d09-canonical-t2"
          test -f "$RUNNER_TEMP/d09-canonical-t2/t2/current/final-successor/canonical-source/package.json"
          echo "D09_T2_REFERENCE=9c64951cd78411283e8a416641c36d71e169fc1d"
      - name: Compile HOP module for normative T2
        shell: bash
        run: |
          npm run build:host-module > "$RUNNER_TEMP/d09-module-build.log" 2>&1 || {
            echo "D09_MODULE_BUILD=FAIL"; exit 1;
          }
          echo "D09_MODULE_BUILD=PASS"
      - name: Install and stage original T2 Host
        shell: bash
        run: |
          host="$RUNNER_TEMP/d09-canonical-t2/t2/current/final-successor/canonical-source"
          (cd "$host" && npm ci --no-audit --no-fund) > "$RUNNER_TEMP/d09-host-npm.log" 2>&1 || {
            echo "D09_NORMATIVE_HOST_NPM=FAIL"; exit 1;
          }
          echo "D09_NORMATIVE_HOST_NPM=PASS"
          node scripts/stage-d09-t2-module.mjs "$host" https://localhost:8443 > "$RUNNER_TEMP/d09-host-stage.log" 2>&1 || {
            echo "D09_NORMATIVE_HOST_STAGE=FAIL"; exit 1;
          }
          echo "D09_NORMATIVE_HOST_STAGE=PASS"
      - name: Build unmodified normative T2 with HOP module
        shell: bash
        run: |
          host="$RUNNER_TEMP/d09-canonical-t2/t2/current/final-successor/canonical-source"
          (cd "$host" && npm run build) > "$RUNNER_TEMP/d09-host-build.log" 2>&1 || {
            echo "D09_NORMATIVE_HOST_BUILD=FAIL"; exit 1;
          }
          test -f "$host/dist/index.html"
          test -f "$host/dist/_iwxa/domain.json"
          echo "D09_NORMATIVE_HOST_BUILD=PASS"
      # No artifacts, private files, package, secrets or runtime are published.
