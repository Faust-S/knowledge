name: D09 HOP canonical T2 Host and domain regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d09-narrative:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private site without publishing files
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop.iwxa.ru
          ref: work/2026-10-27-d09-t2-site-only
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact npm dependencies
        shell: bash
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-npm.log" 2>&1 || {
            echo "D09_NPM_CI=FAIL"; exit 1;
          }
          echo "D09_NPM_CI=PASS"
      - name: Record exact HOP revision and check Result source boundary
        shell: bash
        run: |
          echo "D09_SITE_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "3378ea7c153c2b52524fc4f6df545703e0834583" || {
            echo "D09_SITE_REVISION_CHANGED=HOLD"; exit 1;
          }
          node --experimental-strip-types --test tests/d09-read-model-guards.test.mjs > "$RUNNER_TEMP/d09-result-source.log" 2>&1 || {
            echo "D09_RESULT_SOURCE_GUARD=FAIL"; exit 1;
          }
          echo "D09_RESULT_SOURCE_GUARD=PASS"
      - name: Check TypeScript
        shell: bash
        run: |
          npm run typecheck > "$RUNNER_TEMP/d09-types.log" 2>&1 || {
            echo "D09_TYPES=FAIL"
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/d09-types.log" | sed -E 's/: error (TS[0-9]+):.*/: \1/' | head -30 || true
            exit 1
          }
          echo "D09_TYPES=PASS"
      - name: Run semantic narrative tests
        shell: bash
        run: |
          npx vitest run src/lib/__tests__/narrative-brief-import.test.ts > "$RUNNER_TEMP/d09-narrative.log" 2>&1 || {
            echo "D09_NARRATIVE_TEST=FAIL"; exit 1;
          }
          echo "D09_NARRATIVE_TEST=PASS"
      - name: Run D09 host and copy tests
        shell: bash
        run: |
          npm run test:d09 > "$RUNNER_TEMP/d09-integration.log" 2>&1 || {
            grep -E 'not ok|AssertionError|at .*d09-.*test.mjs' "$RUNNER_TEMP/d09-integration.log" | tail -12 || true
            echo "D09_HOST_TEST=FAIL"; exit 1;
          }
          node --check tests/d09-strict-csp-host-witness.mjs || {
            echo "D09_BROWSER_WITNESS_SYNTAX=FAIL"; exit 1;
          }
          node --check scripts/assemble-d09-site-only.mjs || {
            echo "D09_SITE_ASSEMBLY_SYNTAX=FAIL"; exit 1;
          }
          echo "D09_HOST_TEST=PASS"
          ./node_modules/.bin/vitest run src/components/player/ResultContinuationPanel.t2.test.tsx src/integrations/t2/result-source-check.test.ts src/components/workspace/ImportPreviewDialog.t2.test.tsx > "$RUNNER_TEMP/d09-result-ui.log" 2>&1 || {
            grep -E 'FAIL|AssertionError|expected|Error:' "$RUNNER_TEMP/d09-result-ui.log" | tail -15 || true
            echo "D09_T2_RESULT_UI=FAIL"; exit 1;
          }
          echo "D09_T2_RESULT_UI=PASS"
      - name: Independently verify Project and source package guards
        shell: bash
        run: |
          node --experimental-strip-types --test tests/d09-read-model-guards.test.mjs tests/d09-source-package-integrity.test.mjs > "$RUNNER_TEMP/d09-project-guards.log" 2>&1 || {
            grep -E 'AssertionError|at .*d09-.*test\\.mjs|not ok|ERR_ASSERTION' "$RUNNER_TEMP/d09-project-guards.log" | tail -20 || true
            echo "D09_PROJECT_PACKAGE_GUARDS=FAIL"; exit 1;
          }
          echo "D09_PROJECT_PACKAGE_GUARDS=PASS"
          echo "D09_PROJECT_ZIP_ENVELOPE=PASS"
      - name: Checkout canonical private HOP logic
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop
          ref: 4c20c3c554eee53d75faf6b329b7053bcc81ecfd
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: canonical-hop
      - name: Verify subject-code parity with the website
        shell: bash
        run: |
          for file in src/lib/narrative-brief-import.ts src/lib/__tests__/narrative-brief-import.test.ts src/content-system/editorial.ts src/content-system/surfaces.ts src/product-system/registry.ts; do
            cmp "$file" "canonical-hop/$file" || { echo "D09_CANONICAL_PARITY=FAIL"; exit 1; }
          done
          echo "D09_CANONICAL_PARITY=PASS"
          # This is a temporary independent verification checkout, not site source.
          rm -rf canonical-hop
      - name: Check public UX and product contracts
        shell: bash
        run: |
          npm run check:consumer-ux > "$RUNNER_TEMP/d09-ux.log" 2>&1 || {
            echo "D09_CONSUMER_UX=FAIL"; exit 1;
          }
          echo "D09_CONSUMER_UX=PASS"
          npm run check:product-contracts > "$RUNNER_TEMP/d09-contracts.log" 2>&1 || {
            echo "D09_PRODUCT_CONTRACTS=FAIL"; exit 1;
          }
          echo "D09_PRODUCT_CONTRACTS=PASS"
      - name: Build standalone public HOP stage
        shell: bash
        run: |
          npm run build:public-stage > "$RUNNER_TEMP/d09-public-build.log" 2>&1 || {
            echo "D09_PUBLIC_STAGE=FAIL"
            # Bounded diagnostic signatures only. Never publish source content,
            # output files or full private build logs in the public repository.
            node --input-type=module - "$RUNNER_TEMP/d09-public-build.log" <<'NODE'
          import {readFileSync} from "node:fs";
          const log=readFileSync(process.argv[2],"utf8");
          const signals=[
            ["VITE","error during build"],
            ["MODULE_RESOLVE","Could not resolve"],
            ["MODULE_MISSING","Cannot find module"],
            ["ESBUILD","Transform failed"],
            ["PRERENDER","prerender"],
            ["NODE_OOM","heap out of memory"],
            ["CSP","Content Security Policy"],
          ];
          console.log("D09_PUBLIC_FAILURE_CLASSES="+signals.filter(([,term])=>log.includes(term)).map(([key])=>key).join(","));
          const errorLines=log.split("\n").filter(line=>
            /^\s*(?:Error:|TypeError:|ReferenceError:|SyntaxError:|RollupError:|✘ \[ERROR\]|error during build|failed to load config|Error \[ERR_[A-Z_]+\])/.test(line));
          const clean=line=>line.replace(/\/(?:home|tmp|mnt)\/[^\s:]*/g,"[private-path]").slice(0,180);
          for(const line of errorLines.slice(-6)) console.log("D09_PUBLIC_ERROR_SIGNATURE="+clean(line));
          NODE
            exit 1
          }
          echo "D09_PUBLIC_STAGE=PASS"
      - name: Checkout normative T2 at the verified main revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: 9c64951cd78411283e8a416641c36d71e169fc1d
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          sparse-checkout: |
            t2/current/final-successor/canonical-source
            t2/current/final-successor/kernel-successors/k036-same-store-event-history-20261019
          path: d09-temporary-t2
      - name: Prepare separate disposable T2 checkout
        shell: bash
        run: |
          mv d09-temporary-t2 "$RUNNER_TEMP/d09-canonical-t2"
          test -f "$RUNNER_TEMP/d09-canonical-t2/t2/current/final-successor/canonical-source/package.json"
          echo "D09_T2_REFERENCE=9c64951cd78411283e8a416641c36d71e169fc1d"
      - name: Verify and expand the T2-qualified Kernel release
        shell: bash
        run: |
          archive="$RUNNER_TEMP/d09-canonical-t2/t2/current/final-successor/kernel-successors/k036-same-store-event-history-20261019/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip"
          test -f "$archive"
          echo "7075b8b9590ef1283e34ecb3c21dd9d1b7342697287e1aa150cd4f4a60860b68  $archive" | sha256sum -c - > /dev/null || {
            echo "D09_QUALIFIED_KERNEL_ARCHIVE=FAIL"; exit 1;
          }
          mkdir -p "$RUNNER_TEMP/d09-qualified-kernel"
          unzip -q "$archive" -d "$RUNNER_TEMP/d09-qualified-kernel" || {
            echo "D09_QUALIFIED_KERNEL_UNPACK=FAIL"; exit 1;
          }
          test -f "$RUNNER_TEMP/d09-qualified-kernel/_iwxa/runtime/0.3.6/runtime.js" || {
            echo "D09_QUALIFIED_KERNEL_ROOT=FAIL"; exit 1;
          }
          echo "D09_QUALIFIED_KERNEL_ARCHIVE=PASS"
      - name: Build the single site with actual T2 Host and verified Kernel
        shell: bash
        env:
          D09_T2_CANONICAL_SOURCE: ${{ runner.temp }}/d09-canonical-t2/t2/current/final-successor/canonical-source
          D09_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/d09-qualified-kernel
          D09_ORIGIN: https://localhost:8443
        run: |
          npm run build > "$RUNNER_TEMP/d09-final-build.log" 2>&1 || {
            grep -oE 'D09_(SITE_ONLY|FULL_BUILD)_[A-Z0-9_:.-]+' "$RUNNER_TEMP/d09-final-build.log" | tail -6 || true
            echo "D09_INTEGRATED_STATIC_DIST=FAIL"; exit 1;
          }
          grep -q 'D09_ENGINEERING_STUDIO_JS_ENTRIES_REMOVED=1' "$RUNNER_TEMP/d09-final-build.log" || {
            echo "D09_ENGINEERING_STUDIO_JS_NOT_EXCLUDED=FAIL"; exit 1;
          }
          echo "D09_ENGINEERING_STUDIO_JS_ENTRIES_REMOVED=1"
          test -f dist/index.html
          test -f dist/workspace/index.html
          test -f dist/workspace/exchange/index.html
          test -f dist/workspace/lifecycle/index.html
          test -f dist/d09-site-owned.css
          jq -e '.layout.workspace_chrome == "site-owned"' dist/_iwxa/domain-shell.json > /dev/null || {
            echo "D09_PRODUCT_FIRST_CONFIGURATION=FAIL"; exit 1;
          }
          grep -q 'D09_PRODUCT_FIRST_FIRST_PAINT=PASS' "$RUNNER_TEMP/d09-final-build.log" || {
            echo "D09_PRODUCT_FIRST_FIRST_PAINT=FAIL"; exit 1;
          }
          echo "D09_PRODUCT_FIRST_FIRST_PAINT=PASS"
          test -f dist/_iwxa/runtime/0.3.6/runtime.js
          test ! -e dist/workspace/studio/index.html || { echo "D09_ENGINEERING_STUDIO_PUBLISHED=FAIL"; exit 1; }
          test ! -e dist/workspace/studio.html || { echo "D09_ENGINEERING_STUDIO_PUBLISHED=FAIL"; exit 1; }
          test ! -e dist/studio.html || { echo "D09_ENGINEERING_STUDIO_PUBLISHED=FAIL"; exit 1; }
          echo "D09_ENGINEERING_STUDIO_EXCLUDED=PASS"
          echo "D09_INTEGRATED_STATIC_DIST=PASS"
      - name: Check deployed Apache routing and mutable Kernel cache policy
        shell: bash
        run: |
          npm run check:htaccess > "$RUNNER_TEMP/d09-htaccess.log" 2>&1 || {
            echo "D09_APACHE_HOSTING_POLICY=FAIL"; exit 1;
          }
          echo "D09_APACHE_HOSTING_POLICY=PASS"
      - name: Verify real T2 Host under strict HTTPS CSP
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/d09-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" -keyout "$RUNNER_TEMP/d09-tls/key.pem" -out "$RUNNER_TEMP/d09-tls/cert.pem" > "$RUNNER_TEMP/d09-openssl.log" 2>&1
          if command -v google-chrome >/dev/null 2>&1; then
            export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome)"
          else
            npx puppeteer browsers install chrome > "$RUNNER_TEMP/d09-browser-install.log" 2>&1 || {
              echo "D09_CSP_BROWSER_UNAVAILABLE=FAIL"; exit 1;
            }
          fi
          export D09_PREVIEW_KEY_PATH="$RUNNER_TEMP/d09-tls/key.pem"
          export D09_PREVIEW_CERT_PATH="$RUNNER_TEMP/d09-tls/cert.pem"
          node tests/d09-strict-csp-host-witness.mjs
      # No artifacts, private files, package, secrets or runtime are published.

      - name: Report full lint independently of known upstream CSP failure
        if: always()
        shell: bash
        run: |
          if npm run lint > "$RUNNER_TEMP/d09-lint-full.log" 2>&1; then
            echo "D09_FULL_LINT=PASS"
          else
            echo "D09_FULL_LINT=FAIL"
            grep -E 'problems? \(' "$RUNNER_TEMP/d09-lint-full.log" | tail -2 || true
            grep -E 'error  |warning  ' "$RUNNER_TEMP/d09-lint-full.log" | sed -E 's/^.*(prettier|typescript-eslint|react-hooks|react-refresh).*$/\1/' | sort | uniq -c | tail -10 || true
            exit 1
          fi
