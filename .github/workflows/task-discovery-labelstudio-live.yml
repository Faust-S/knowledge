name: TASK-EXP-01 Label Studio 1.23.2 live synthetic API smoke

on:
  push:
    branches:
      - work/2026-11-03-unified-task-migration
    paths:
      - 'research/task-discovery/live_labelstudio_smoke.py'
      - 'research/task-discovery/labelstudio_project_setup.py'
      - '.github/workflows/task-discovery-labelstudio-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-labelstudio:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Start exact Label Studio 1.23.2 (disposable, no real source data)
        run: |
          docker run --detach --name iwxa-label-studio \
            --publish 127.0.0.1:8080:8080 \
            --env LABEL_STUDIO_USERNAME=iwxa-smoke@example.invalid \
            --env LABEL_STUDIO_PASSWORD=synthetic-credential-ci-only \
            --env LABEL_STUDIO_USER_TOKEN=synthetic-ci-legacy-token \
            --env LABEL_STUDIO_ENABLE_LEGACY_API_TOKEN=true \
            heartexlabs/label-studio:1.23.2
      - name: Verify actual authenticated Label Studio service is available
        env:
          LABEL_STUDIO_API_KEY: synthetic-ci-legacy-token
        run: |
          python3 - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          url = 'http://127.0.0.1:8080/api/current-user/whoami'
          for attempt in range(100):
              try:
                  request = Request(url, headers={'Authorization': 'Token ' + os.environ['LABEL_STUDIO_API_KEY']})
                  with urlopen(request, timeout=3) as response:
                      obj = json.loads(response.read(50000))
                  assert isinstance(obj.get('id'), int), 'Label Studio user ID absent'
                  print('ACTUAL_LABEL_STUDIO_AUTHENTICATED_API_READY')
                  break
              except (HTTPError, URLError, TimeoutError, OSError, ValueError, AssertionError):
                  time.sleep(2)
          else:
              raise SystemExit('LABEL_STUDIO_NATIVE_API_NOT_READY')
          PY
      - name: Actual project creation, 8+8 import and readback, 16 API annotations, export refusal
        env:
          LABEL_STUDIO_URL: http://127.0.0.1:8080
          LABEL_STUDIO_API_KEY: synthetic-ci-legacy-token
        run: python3 research/task-discovery/live_labelstudio_smoke.py
      - name: Real two-account synthetic HTTP route (ephemeral second user, no exported files)
        env:
          LABEL_STUDIO_URL: http://127.0.0.1:8080
          LABEL_STUDIO_API_KEY: synthetic-ci-legacy-token
        run: |
          python3 - <<'PY'
          import json
          import os
          import secrets
          import subprocess
          import sys
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          base = os.environ["LABEL_STUDIO_URL"]
          primary_token = os.environ["LABEL_STUDIO_API_KEY"]

          def api(credential, route, body=None):
              payload = json.dumps(body).encode("utf-8") if body is not None else None
              request = Request(
                  base + route, data=payload,
                  method="POST" if body is not None else "GET",
                  headers={"Authorization": credential, "Accept": "application/json",
                           "Content-Type": "application/json"},
              )
              try:
                  with urlopen(request, timeout=25) as response:
                      return json.loads(response.read(1_000_000))
              except HTTPError as error:
                  raise SystemExit("SECOND_ACCOUNT_PROVISION_HTTP_" + str(error.code)) from None

          first = api("Token " + primary_token, "/api/current-user/whoami")
          assert type(first.get("id")) is int, "PRIMARY_ID_NOT_VERIFIED"
          organization = first.get("active_organization")
          assert type(organization) is int, "PRIMARY_ORGANIZATION_NOT_VERIFIED"
          email = "iwxa-disposable-" + secrets.token_hex(12) + "@example.invalid"
          second = api("Token " + primary_token, "/api/users/", {
              "username": email, "email": email, "password": secrets.token_urlsafe(32),
              "active_organization": organization,
          })
          assert type(second.get("id")) is int and second["id"] != first["id"], \
              "SECOND_ACCOUNT_CREATION_NOT_VERIFIED"

          # Read a freshly created synthetic user token only inside the
          # disposable Docker process. stdout is captured, never logged.
          code = ("from users.models import User; "
                  "print(User.objects.get(email=" + repr(email) + ").get_token().key)")
          token_cli = subprocess.run(
              ["docker", "exec", "iwxa-label-studio", "python",
               "label_studio/manage.py", "shell", "-c", code],
              check=True, capture_output=True, text=True, timeout=40,
          )
          secondary_token = token_cli.stdout.strip().splitlines()[-1]
          assert len(secondary_token) >= 20 and secondary_token != primary_token, \
              "SECOND_ACCOUNT_TOKEN_UNAVAILABLE"

          second_whoami = api("Token " + secondary_token, "/api/current-user/whoami")
          assert second_whoami.get("id") == second["id"] and \
                 second_whoami.get("active_organization") == organization, \
                 "SECOND_ACCOUNT_AUTH_OR_ORGANIZATION_MISMATCH"
          sys.path.insert(0, "research/task-discovery")
          from live_labelstudio_smoke import exercise_local_server
          receipt = exercise_local_server(base, primary_token,
                                          second_token=secondary_token)
          assert receipt["two_synthetic_accounts_export_passed"] is True
          assert receipt["human_task_gold"] is False
          print(json.dumps(receipt, sort_keys=True))
          # M3b blind-review boundary: distinct accounts in one Label Studio
          # organization may still read each other's completed annotations.
          # Inspect real server access, never log annotation content or tokens.
          listing = api("Token " + primary_token, "/api/projects/")
          assert type(listing) is dict and type(listing.get("results")) is list, \
              "LABEL_STUDIO_PROJECT_INDEX_UNEXPECTED"
          a_projects = [item for item in listing["results"]
                        if type(item) is dict and
                        item.get("title") == "IWXA TASK-EXP-01 reviewer A" and
                        type(item.get("id")) is int]
          assert a_projects, "NATIVE_A_PROJECT_NOT_FOUND"
          other_pid = max(item["id"] for item in a_projects)
          request = Request(
              base + f"/api/projects/{other_pid}/export?exportType=JSON&download_all_tasks=true",
              headers={"Authorization": "Token " + secondary_token,
                       "Accept": "application/json"},
          )
          try:
              with urlopen(request, timeout=25) as response:
                  cross_export = json.loads(response.read(1_000_000))
              cross_readable = (
                  type(cross_export) is list and len(cross_export) == 8 and
                  all(type(item) is dict and
                      type(item.get("annotations")) is list and
                      len(item["annotations"]) == 1 and
                      item["annotations"][0].get("completed_by") == first["id"]
                      for item in cross_export)
              )
          except HTTPError as error:
              assert error.code in (401, 403, 404), "CROSS_PROJECT_PROBE_HTTP_UNEXPECTED"
              cross_readable = False
          print(json.dumps({
              "M3_SAME_ORGANIZATION_REVIEW_A_VISIBLE_TO_REVIEW_B": cross_readable,
              "M3_HUMAN_INDEPENDENCE_PROVEN": False,
              "M3_PROJECT_ISOLATION_CONTRACT_QUALIFIED": not cross_readable,
          }, sort_keys=True))
          PY
      - name: Two isolated native Label Studio databases, credentials and source-first exports
        env:
          LABEL_STUDIO_API_KEY: synthetic-ci-legacy-token
        run: |
          python3 - <<'PY'
          import json, os, secrets, subprocess, sys, tempfile, time
          from pathlib import Path
          sys.path.insert(0, 'research/task-discovery')
          import labelstudio_project_setup as setup
          from live_labelstudio_smoke import (synthetic_tasks, SYNTHETIC_XML,
              synthetic_annotation_result, verify_synthetic_region_roundtrip)

          a_base, b_base = 'http://127.0.0.1:8080', 'http://127.0.0.1:8081'
          container = 'iwxa-label-studio-isolated-b'
          a_token = os.environ['LABEL_STUDIO_API_KEY']
          b_admin_token = secrets.token_urlsafe(36)

          def require(condition, code):
              if not condition:
                  raise setup.SetupHold(code)

          def docker(args, timeout=60):
              result = subprocess.run(['docker', *args], capture_output=True,
                                      text=True, check=False, timeout=timeout)
              require(result.returncode == 0, 'ISOLATED_DOCKER_STEP_FAILED')
              return result.stdout.strip()

          def whoami(base, token):
              person = setup.api(base, token, '/api/current-user/whoami')
              require(type(person) is dict and
                      type(person.get('id')) is int and
                      type(person.get('active_organization')) is int,
                      'ISOLATED_WHOAMI_INVALID')
              return person

          def denied(base, token):
              try:
                  setup.api(base, token, '/api/current-user/whoami')
              except setup.SetupHold as error:
                  return str(error) in ('LABEL_STUDIO_HTTP_401', 'LABEL_STUDIO_HTTP_403')
              return False

          def annotate_and_export(base, token, pid, output, expected_id):
              tasks = synthetic_tasks()
              rows = setup.api(base, token,
                  f'/api/projects/{pid}/export?exportType=JSON&download_all_tasks=true')
              require(type(rows) is list and len(rows) == 8,
                      'ISOLATED_SOURCE_READBACK_INVALID')
              for row in rows:
                  task_id = row.get('id') if type(row) is dict else None
                  require(type(task_id) is int and task_id > 0,
                          'ISOLATED_TASK_ID_INVALID')
                  data = row.get('data') if type(row) is dict else None
                  require(type(data) is dict, 'ISOLATED_TASK_SOURCE_MISSING')
                  annotation = setup.api(base, token, f'/api/tasks/{task_id}/annotations/', {
                      'result': synthetic_annotation_result(
                          data['source_text'],
                          task_example=(data.get('source_sha256') ==
                                        tasks[0]['data']['source_sha256'])),
                      'was_cancelled': False})
                  require(type(annotation) is dict and type(annotation.get('id')) is int,
                          'ISOLATED_ANNOTATION_WRITE_FAILED')
              receipt = setup.export_single_reviewed_project(tasks, base, token, pid, output,
                  expected_xml=SYNTHETIC_XML)
              require(receipt['sources_per_export'] == 8 and
                      receipt['annotation_author_matches_authenticated_account'] is True and
                      receipt['human_gold'] is False, 'ISOLATED_SINGLE_EXPORT_FAILED')
              export = json.loads(output.read_text('utf-8'))
              verify_synthetic_region_roundtrip(export)
              require(len(export) == 8 and
                      all(len(entry.get('annotations', [])) == 1 and
                          entry['annotations'][0]['completed_by'] == expected_id
                          for entry in export), 'ISOLATED_NATIVE_AUTHOR_ID_CHANGED')
              return {r['data']['source_sha256'] for r in export}

          try:
              a_id = whoami(a_base, a_token)['id']
              b_email = 'isolated-admin-' + secrets.token_hex(12) + '@example.invalid'
              docker(['run', '--detach', '--name', container,
                      '--publish', '127.0.0.1:8081:8080',
                      '--env', 'LABEL_STUDIO_USERNAME=' + b_email,
                      '--env', 'LABEL_STUDIO_PASSWORD=' + secrets.token_urlsafe(36),
                      '--env', 'LABEL_STUDIO_USER_TOKEN=' + b_admin_token,
                      '--env', 'LABEL_STUDIO_ENABLE_LEGACY_API_TOKEN=true',
                      'heartexlabs/label-studio:1.23.2'], timeout=90)
              for attempt in range(110):
                  try:
                      b_admin = whoami(b_base, b_admin_token)
                      break
                  except (setup.SetupHold, OSError, TimeoutError):
                      time.sleep(1)
              else:
                  raise setup.SetupHold('SECOND_ISOLATED_SERVER_NOT_READY')
              b_reviewer_email = 'isolated-reviewer-' + secrets.token_hex(12) + '@example.invalid'
              created = setup.api(b_base, b_admin_token, '/api/users/', {
                  'username': b_reviewer_email, 'email': b_reviewer_email,
                  'password': secrets.token_urlsafe(36),
                  'active_organization': b_admin['active_organization']})
              require(type(created) is dict and type(created.get('id')) is int
                      and created['id'] != b_admin['id'],
                      'ISOLATED_REVIEWER_B_NOT_CREATED')
              code = ('from users.models import User; print(User.objects.get(email='
                      + repr(b_reviewer_email) + ').get_token().key)')
              stdout = docker(['exec', container, 'python', 'label_studio/manage.py',
                               'shell', '-c', code])
              b_token = stdout.splitlines()[-1] if stdout else ''
              require(len(b_token) >= 20 and b_token != a_token,
                      'ISOLATED_REVIEWER_B_TOKEN_INVALID')
              b_id = whoami(b_base, b_token)['id']
              require(b_id == created['id'] and b_id != a_id,
                      'ISOLATED_NATIVE_COMPLETED_BY_IDS_COLLIDE')
              preflight = setup.verify_isolated_reviewers(
                  a_base, 'Token ' + a_token, b_base, 'Token ' + b_token)
              require(preflight['cross_instance_credentials_rejected'] and
                      preflight['reviewer_id_claims_distinct'] and
                      preflight['human_gold'] is False and
                      denied(a_base, b_admin_token),
                      'ISOLATED_CROSS_INSTANCE_AUTH_UNEXPECTED')
              # On both real disposable servers, prove the complete M3b API
              # preflight BEFORE writing any annotations, not just whoami.
              # The same owner-local one-shot route also has a real native
              # two-server synthetic test here. Exact original XML is checked
              # by the owner-local contract, not copied into public CI.
              review_gate = setup.create_isolated_review_pair(
                  synthetic_tasks(), SYNTHETIC_XML,
                  a_base, 'Token ' + a_token,
                  b_base, 'Token ' + b_token)
              a_project = review_gate['project_a_id']
              b_project = review_gate['project_b_id']
              require(review_gate['sources_each'] == 8 and
                      review_gate['persisted_owner_forms_checked'] and
                      review_gate['unannotated_original_sources_checked'] and
                      review_gate['cross_instance_identity_and_export_denied'] and
                      review_gate['human_gold'] is False,
                      'ISOLATED_FULL_PROJECT_PREFLIGHT_FAILED')
              print(json.dumps({
                  'status': review_gate['status'],
                  'sources_each': 8,
                  'owner_exact_xml_exercised': False,
                  'human_gold': False,
              }, sort_keys=True))
              with tempfile.TemporaryDirectory(prefix='iwxa-m3b-isolated-synthetic-') as tmp:
                  source_a = annotate_and_export(
                      a_base, a_token, a_project, Path(tmp) / 'a.json', a_id)
                  source_b = annotate_and_export(
                      b_base, b_token, b_project, Path(tmp) / 'b.json', b_id)
                  require(len(source_a) == len(source_b) == 8 and source_a == source_b,
                          'ISOLATED_SOURCE_BYTES_DIFFER')
              # Read both reviewed projects with the same owner-local
              # read-only coverage adapter. This reports no human gold,
              # region text, author identity or reviewer-level resolution.
              progress = setup.paired_review_progress(
                  synthetic_tasks(), SYNTHETIC_XML,
                  a_base, 'Token ' + a_token, a_project,
                  b_base, 'Token ' + b_token, b_project)
              require(progress['status'] ==
                      'TWO_LOCAL_REVIEW_COVERAGE_COMPLETE_NOT_BRIDGE_QUALIFIED' and
                      progress['both_reached_final_coverage'] is True and
                      progress['reviewer_a']['final_coverage'] == 8 and
                      progress['reviewer_b']['final_coverage'] == 8 and
                      progress['human_gold'] is False,
                      'ISOLATED_PAIRED_COVERAGE_READBACK_FAILED')
              print(json.dumps({
                  'status': progress['status'],
                  'sources_each': progress['sources_each'],
                  'human_gold': False,
              }, sort_keys=True))
              print(json.dumps({
                  'status': 'TWO_NATIVE_ISOLATED_LABEL_STUDIO_SYNTHETIC_PASS',
                  'label_studio_version': '1.23.2',
                  'separate_database_containers': 2,
                  'cross_instance_tokens_rejected': True,
                  'original_completed_by_ids_distinct': True,
                  'synthetic_sources_each': 8, 'api_annotations_total': 16,
                  'task_region_interpretation_roundtrip': True,
                  'owner_exact_xml_exercised': False,
                  'human_review_independence_verified': False,
                  'human_task_gold': False,
                  'task_precision': None, 'task_recall': None, 'task_f1': None
              }, sort_keys=True))
          finally:
              # All tokens and exports stay in memory / temporary files.
              subprocess.run(['docker', 'rm', '-f', container],
                             capture_output=True, text=True, check=False, timeout=30)
          PY
      - name: Report native image and container status on failure
        if: failure()
        run: |
          docker ps -a --filter name=iwxa-label-studio --format 'name={{.Names}} status={{.Status}} image={{.Image}}'
          docker inspect iwxa-label-studio --format 'image={{.Image}} state={{.State.Status}} exit={{.State.ExitCode}}' || true
