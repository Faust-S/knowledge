name: TASK-EXP-01 Label Studio 1.23.2 live synthetic API smoke

on:
  push:
    branches:
      - work/2026-11-03-unified-task-migration
    paths:
      - 'research/task-discovery/live_labelstudio_smoke.py'
      - 'research/task-discovery/labelstudio_project_setup.py'
      - '.github/workflows/task-discovery-labelstudio-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-labelstudio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start exact Label Studio 1.23.2 (disposable, no real source data)
        run: |
          docker run --detach --name iwxa-label-studio \
            --publish 127.0.0.1:8080:8080 \
            --env LABEL_STUDIO_USERNAME=iwxa-smoke@example.invalid \
            --env LABEL_STUDIO_PASSWORD=synthetic-credential-ci-only \
            --env LABEL_STUDIO_USER_TOKEN=synthetic-ci-legacy-token \
            --env LABEL_STUDIO_ENABLE_LEGACY_API_TOKEN=true \
            heartexlabs/label-studio:1.23.2
      - name: Verify actual authenticated Label Studio service is available
        env:
          LABEL_STUDIO_API_KEY: synthetic-ci-legacy-token
        run: |
          python3 - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          url = 'http://127.0.0.1:8080/api/current-user/whoami'
          for attempt in range(100):
              try:
                  request = Request(url, headers={'Authorization': 'Token ' + os.environ['LABEL_STUDIO_API_KEY']})
                  with urlopen(request, timeout=3) as response:
                      obj = json.loads(response.read(50000))
                  assert isinstance(obj.get('id'), int), 'Label Studio user ID absent'
                  print('ACTUAL_LABEL_STUDIO_AUTHENTICATED_API_READY')
                  break
              except (HTTPError, URLError, TimeoutError, OSError, ValueError, AssertionError):
                  time.sleep(2)
          else:
              raise SystemExit('LABEL_STUDIO_NATIVE_API_NOT_READY')
          PY
      - name: Actual project creation, 8+8 import and readback, 16 API annotations, export refusal
        env:
          LABEL_STUDIO_URL: http://127.0.0.1:8080
          LABEL_STUDIO_API_KEY: synthetic-ci-legacy-token
        run: python3 research/task-discovery/live_labelstudio_smoke.py
      - name: Real two-account synthetic HTTP route (ephemeral second user, no exported files)
        env:
          LABEL_STUDIO_URL: http://127.0.0.1:8080
          LABEL_STUDIO_API_KEY: synthetic-ci-legacy-token
        run: |
          python3 - <<'PY'
          import json
          import os
          import secrets
          import subprocess
          import sys
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          base = os.environ["LABEL_STUDIO_URL"]
          primary_token = os.environ["LABEL_STUDIO_API_KEY"]

          def api(credential, route, body=None):
              payload = json.dumps(body).encode("utf-8") if body is not None else None
              request = Request(
                  base + route, data=payload,
                  method="POST" if body is not None else "GET",
                  headers={"Authorization": credential, "Accept": "application/json",
                           "Content-Type": "application/json"},
              )
              try:
                  with urlopen(request, timeout=25) as response:
                      return json.loads(response.read(1_000_000))
              except HTTPError as error:
                  raise SystemExit("SECOND_ACCOUNT_PROVISION_HTTP_" + str(error.code)) from None

          first = api("Token " + primary_token, "/api/current-user/whoami")
          assert type(first.get("id")) is int, "PRIMARY_ID_NOT_VERIFIED"
          organization = first.get("active_organization")
          assert type(organization) is int, "PRIMARY_ORGANIZATION_NOT_VERIFIED"
          email = "iwxa-disposable-" + secrets.token_hex(12) + "@example.invalid"
          second = api("Token " + primary_token, "/api/users/", {
              "username": email, "email": email, "password": secrets.token_urlsafe(32),
              "active_organization": organization,
          })
          assert type(second.get("id")) is int and second["id"] != first["id"], \
              "SECOND_ACCOUNT_CREATION_NOT_VERIFIED"

          # Read a freshly created synthetic user token only inside the
          # disposable Docker process. stdout is captured, never logged.
          code = ("from users.models import User; "
                  "print(User.objects.get(email=" + repr(email) + ").get_token().key)")
          token_cli = subprocess.run(
              ["docker", "exec", "iwxa-label-studio", "python",
               "label_studio/manage.py", "shell", "-c", code],
              check=True, capture_output=True, text=True, timeout=40,
          )
          secondary_token = token_cli.stdout.strip().splitlines()[-1]
          assert len(secondary_token) >= 20 and secondary_token != primary_token, \
              "SECOND_ACCOUNT_TOKEN_UNAVAILABLE"

          second_whoami = api("Token " + secondary_token, "/api/current-user/whoami")
          assert second_whoami.get("id") == second["id"] and \
                 second_whoami.get("active_organization") == organization, \
                 "SECOND_ACCOUNT_AUTH_OR_ORGANIZATION_MISMATCH"
          sys.path.insert(0, "research/task-discovery")
          from live_labelstudio_smoke import exercise_local_server
          receipt = exercise_local_server(base, primary_token,
                                          second_token=secondary_token)
          assert receipt["two_synthetic_accounts_export_passed"] is True
          assert receipt["human_task_gold"] is False
          print(json.dumps(receipt, sort_keys=True))
          # M3b blind-review boundary: distinct accounts in one Label Studio
          # organization may still read each other's completed annotations.
          # Inspect real server access, never log annotation content or tokens.
          listing = api("Token " + primary_token, "/api/projects/")
          assert type(listing) is dict and type(listing.get("results")) is list, \
              "LABEL_STUDIO_PROJECT_INDEX_UNEXPECTED"
          a_projects = [item for item in listing["results"]
                        if type(item) is dict and
                        item.get("title") == "IWXA TASK-EXP-01 reviewer A" and
                        type(item.get("id")) is int]
          assert a_projects, "NATIVE_A_PROJECT_NOT_FOUND"
          other_pid = max(item["id"] for item in a_projects)
          request = Request(
              base + f"/api/projects/{other_pid}/export?exportType=JSON&download_all_tasks=true",
              headers={"Authorization": "Token " + secondary_token,
                       "Accept": "application/json"},
          )
          try:
              with urlopen(request, timeout=25) as response:
                  cross_export = json.loads(response.read(1_000_000))
              cross_readable = (
                  type(cross_export) is list and len(cross_export) == 8 and
                  all(type(item) is dict and
                      type(item.get("annotations")) is list and
                      len(item["annotations"]) == 1 and
                      item["annotations"][0].get("completed_by") == first["id"]
                      for item in cross_export)
              )
          except HTTPError as error:
              assert error.code in (401, 403, 404), "CROSS_PROJECT_PROBE_HTTP_UNEXPECTED"
              cross_readable = False
          print(json.dumps({
              "M3_SAME_ORGANIZATION_REVIEW_A_VISIBLE_TO_REVIEW_B": cross_readable,
              "M3_HUMAN_INDEPENDENCE_PROVEN": False,
              "M3_PROJECT_ISOLATION_CONTRACT_QUALIFIED": not cross_readable,
          }, sort_keys=True))
          PY
      - name: Report native image and container status on failure
        if: failure()
        run: |
          docker ps -a --filter name=iwxa-label-studio --format 'name={{.Names}} status={{.Status}} image={{.Image}}'
          docker inspect iwxa-label-studio --format 'image={{.Image}} state={{.State.Status}} exit={{.State.ExitCode}}' || true
