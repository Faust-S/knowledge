name: D07 professional methodology V9.1 private-source qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d07-professional-methods-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-methodologies:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact private subject-model commit
        uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod
          ref: 5ba616f4b83d2deb451ccbfcd37a23bedc64f8f1
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: subject
      - name: Checkout exact private website commit
        uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: 46ef4454e09b1a4f09084c9586aa494cf2f386b1
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - name: Check revisions and source mirrors
        run: |
          test "$(git -C subject rev-parse HEAD)" = "5ba616f4b83d2deb451ccbfcd37a23bedc64f8f1"
          test "$(git -C site rev-parse HEAD)" = "46ef4454e09b1a4f09084c9586aa494cf2f386b1"
          for file in service-finalization-gate.ts service-external-gap-research.ts service-professional-gap-inventory.ts service-subject-protocols.ts service-professional-source-intake.ts service-method-fragment-assembly.ts service-professional-evidence.ts service-subject-logistics-b.ts service-subject-logistics-k.ts service-subject-plumbing-a.ts service-subject-moving-team.ts service-subject-flooring-a.ts service-methodology-conversion.ts; do
            cmp "subject/src/domain/$file" "site/src/domain/$file" >/dev/null || exit 2
          done
          echo D07_PROFESSIONAL_PARITY=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - name: Install exact Bun dependencies without publishing code
        working-directory: site
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/d07-install.log" 2>&1 || {
            echo D07_INSTALL=FAIL
            exit 1
          }
          echo D07_INSTALL=PASS
      - name: Syntax-check all service test files before execution
        working-directory: site
        run: |
          for file in scripts/tests/d07-*.test.mjs; do
            node --check "$file" >/dev/null
          done
          echo D07_TEST_SYNTAX=PASS
      - name: Report logistics catalogue and protocol coverage without user data
        working-directory: site
        run: |
          node --import tsx --input-type=module -e 'import {getServiceDirectory} from "./src/data/serviceDirectory.ts";import {SUBJECT_PROTOCOLS} from "./src/domain/service-subject-protocols.ts";const key="perevozki-dostavka-logistika";const d=getServiceDirectory().filter(x=>x.categorySlug===key);const p=SUBJECT_PROTOCOLS.filter(x=>x.categorySlug===key);console.log("D07_LOGISTICS_DIRECTORY="+d.length);console.log("D07_LOGISTICS_PROTOCOLS="+p.length);console.log("D07_LOGISTICS_MISSING="+d.filter(x=>!p.some(y=>y.serviceSlug===x.slug)).map(x=>x.slug).join(","));console.log("D07_LOGISTICS_EXTRA="+p.filter(x=>!d.some(y=>y.slug===x.serviceSlug)).map(x=>x.serviceSlug).join(","));'
      - name: Report conversion diagnostics without sharing private source
        working-directory: site
        run: |
          node --import tsx --input-type=module -e 'import {getServiceDirectory} from "./src/data/serviceDirectory.ts";import {getService} from "./src/data/services.ts";import {convertServiceMethodology} from "./src/domain/service-methodology-conversion.ts";for (const [category,slug] of [["perevozki-dostavka-logistika","pereezd-gruzchiki"],["remont-dom-mastera","zamena-smesitelya"],["remont-dom-mastera","ukladka-laminata"]]) {const row=getServiceDirectory().find(x=>x.categorySlug===category&&x.slug===slug);if(!row){console.log("D07_DIAG_ABSENT="+slug);continue;}try{const m=convertServiceMethodology(row,{service:getService(category,slug)});console.log("D07_DIAG="+slug+"|protocol="+(m.professional.subjectProtocol?.operations?.length??0)+"|works="+m.execution.works.length+"|acceptance="+m.quality.acceptance.length+"|costs="+m.finance.costComponents.length+"|resourceCandidates="+m.finance.resourceCandidates.length+"|sourceWorks="+m.execution.works.filter(w=>w.source==="d07-subject-protocol").length+"|established="+m.execution.works.filter(w=>w.source==="d07-workplan").length);}catch(e){console.log("D07_DIAG_EXCEPTION="+slug+"|"+String(e.message).slice(0,100));}}'
      - name: Run all source, gap, logistics and approval regressions
        working-directory: site
        run: |
          fail=0
          for f in \
            d07-external-gap-research.test.mjs \
            d07-professional-gap-inventory.test.mjs \
            d07-professional-finalization-gate.test.mjs \
            d07-professional-source-intake.test.mjs \
            d07-professional-fragment-assembly.test.mjs \
            d07-professional-evidence-closure.test.mjs \
            d07-method-fragment-batch.test.mjs \
            d07-logistics-professional-methods.test.mjs \
            d07-methodology-top500.test.mjs \
            d07-plumbing-professional-method.test.mjs \
            d07-flooring-professional-method.test.mjs \
            d07-professional-preview.test.mjs; do
            if node --import tsx --test "scripts/tests/$f" > "$RUNNER_TEMP/$f.log" 2>&1; then
              echo "D07_TEST_$(echo "$f" | tr '[:lower:].-' '[:upper:]__')=PASS"
            else
              echo "D07_TEST_$(echo "$f" | tr '[:lower:].-' '[:upper:]__')=FAIL"
              grep -E '^not ok [0-9]+|^# (tests|pass|fail)|^[[:space:]]+(actual|expected|code|error):|at TestContext' "$RUNNER_TEMP/$f.log" | tail -26 || true
              fail=1
            fi
          done
          exit "$fail"
      - name: Whole-site TypeScript compilation
        if: always()
        working-directory: site
        run: |
          if bun x tsc --noEmit > "$RUNNER_TEMP/d07-tsc.log" 2>&1; then
            echo D07_TYPES=PASS
          else
            echo D07_TYPES=FAIL
            grep -oE 'TS[0-9]+' "$RUNNER_TEMP/d07-tsc.log" | sort | uniq -c | head -15 || true
            exit 1
          fi
      - name: Generate all 500 and count actual readiness
        if: always()
        working-directory: site
        run: |
          if node --import tsx scripts/generate-d07-methodology-top500.mjs "$RUNNER_TEMP/d07-500" --as-of=2026-11-21 > "$RUNNER_TEMP/d07-500.log" 2>&1; then
            echo D07_GENERATE_TOP500=PASS
            node -e "const fs=require('fs');const p=process.env.RUNNER_TEMP+'/d07-500/';const f=JSON.parse(fs.readFileSync(p+'service-professional-finalization.top500.generated.json'));const q=JSON.parse(fs.readFileSync(p+'service-external-gap-research.top500.generated.json'));console.log('D07_TOP500_SELECTED='+f.counts.selected);console.log('D07_INDIVIDUAL_PROTOCOLS_SELECTED='+f.counts.editorialWithIndividualTechnology);console.log('D07_APPROVED_METHODS='+f.counts.independentlyApprovedMethodologies);console.log('D07_FINALIZED_T2='+f.counts.finalized);console.log('D07_RESEARCH_TASKS='+q.services.reduce((a,s)=>a+s.itemGaps.length+s.unresolved.length,0));"
          else
            echo D07_GENERATE_TOP500=FAIL
            grep -oE 'D07_[A-Z0-9_]+(:[a-z0-9/_-]+)?|^# (tests|pass|fail)' "$RUNNER_TEMP/d07-500.log" | sort -u | head -15 || true
            exit 1
          fi
      # No artifact/log upload. Private checkout is temporary on this public runner.
