name: T3 Windows native original corporate employee process
on:
  push:
    branches:
      - work/2026-11-10-t3-t2-activity-projection
    paths:
      - .github/workflows/t3-native-original-employee.yml
      - packages/t3-core/scripts/qualify-native-corporate-agent-process.mjs
      - packages/t3-core/scripts/qualify-original-agent-d3-port.mjs
      - packages/t3-core/tests/g4-original-agent-native-windows.mjs
      - packages/t3-core/tests/g4-original-agent-native-driver.py
      - packages/t3-core/tests/g4-original-employee-bootstrap-driver.py
      - packages/t3-core/tests/g4-original-employee-real-task-driver.py
      - packages/t3-core/tests/g4-production-original-kernel.browser.mjs
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: t3-native-original-employee-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signed-native-source-process:
    # One G4 qualification. Source Owner SHA MUST match the exact installed
    # Admin Owner; bounded parity preflight runs before any private GET.
    # Native Node/Python PASS is never installed Tauri Agent qualification.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qualify-native-d3]') }}
    runs-on: windows-2022
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public runner and driver source
        shell: pwsh
        run: |
          node --check packages/t3-core/scripts/qualify-native-corporate-agent-process.mjs
          node --check packages/t3-core/tests/g4-original-agent-native-windows.mjs
          node --test packages/t3-core/tests/g4-native-original-owner-pin-parity.test.mjs
          node --check packages/t3-core/tests/g4-production-original-kernel.browser.mjs
          python -m py_compile packages/t3-core/tests/g4-original-agent-native-driver.py
          python -m py_compile packages/t3-core/tests/g4-original-employee-bootstrap-driver.py
          python -m py_compile packages/t3-core/tests/g4-original-employee-real-task-driver.py
      - name: Stage the original qualified T2 Kernel and installed Edge adapter
        shell: pwsh
        run: |
          npm ci --prefix packages/t3-core --ignore-scripts --no-audit --no-fund
          $archive = Join-Path $PWD 'packages/t3-core/qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip'
          $qualified = Join-Path $env:RUNNER_TEMP 'iwxa-g4-original-t2'
          New-Item -ItemType Directory -Force -Path $qualified | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $qualified -Force
          if (!(Test-Path (Join-Path $qualified '_iwxa/runtime/0.3.6/runtime.js'))) {
            throw 'G4_QUALIFIED_T2_EXTRACT_INCOMPLETE'
          }
          if (!(Get-Command openssl -ErrorAction SilentlyContinue)) {
            $gitOpenSSL = 'C:\Program Files\Git\usr\bin'
            if (!(Test-Path (Join-Path $gitOpenSSL 'openssl.exe'))) {
              throw 'G4_EPHEMERAL_LOOPBACK_TLS_PROVIDER_MISSING'
            }
            $gitOpenSSL | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          "G4_ORIGINAL_QUALIFIED_T2_DIST=$qualified" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Separate original owner / Agent Node-Python Windows process
        env:
          T3_READ_TOKEN: ${{ secrets.T3 || secrets.DOMEN }}
          AGENT_READ_TOKEN: ${{ secrets.AGENT || secrets.DOMEN || secrets.T3 }}
        shell: pwsh
        run: node packages/t3-core/scripts/qualify-native-corporate-agent-process.mjs
