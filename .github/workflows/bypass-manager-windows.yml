name: Bypass Manager Windows qualification
on:
  workflow_dispatch:
  push:
    branches:
      - work/2026-11-15-bypass-manager-0-3-alpha
      - work/2026-11-20-bypass-manager-one-button
    paths:
      - tools/bypass-manager/**
      - .github/workflows/bypass-manager-windows.yml
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/bypass-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Run native Go tests
        shell: pwsh
        run: go test -count=1 ./...
      - name: Vet and build GUI executable
        shell: pwsh
        run: |
          go vet ./...
          go build -trimpath -ldflags='-H windowsgui -s -w' -o Bypass-Manager.exe .
          Get-FileHash Bypass-Manager.exe -Algorithm SHA256
      - name: Validate isolated PowerShell 5.1 scripts, native CLI and recovery
        shell: powershell
        run: |
          # Fixture scripts override global Get-Process/Get-NetTCPConnection.
          # Never let one mock process contaminate another native Windows test.
          $ErrorActionPreference='Stop'
          $scripts=@(
            'Verify-Windows.ps1',
            'Test-DnsExposure.ps1',
            'Test-VpnStatus.ps1',
            'Test-NetworkHealth.ps1',
            'Test-PathEvidence.ps1',
            'Test-AppSockets.ps1',
            'Test-LocalProxy-Mock.ps1',
            'Test-AppProxy-Sockets-Mock.ps1',
            'Test-TemporaryMTU.ps1',
            'Test-MTU-Rollback-Mock.ps1',
            'Test-OuterEndpoint-Mock.ps1',
            'Test-EndpointRoute.ps1',
            'Test-OwnRecovery.ps1'
          )
          foreach($name in $scripts) {
            $test=Join-Path '.\Tests' $name
            & "$PSHOME\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test
            if($LASTEXITCODE -ne 0) { throw "Isolated PowerShell test FAILED: $name" }
            if((Get-Command Get-Process).CommandType -ne 'Cmdlet') {
              throw "Unexpected process mock persisted in Windows qualification host"
            }
          }
          $p=Start-Process -FilePath .\Bypass-Manager.exe -ArgumentList '--status' -PassThru -Wait
          if($p.ExitCode -ne 0) { throw "CLI status failed $($p.ExitCode)" }
      - name: Smoke-test native Win32 window lifecycle
        shell: powershell
        run: .\Tests\Test-GuiSmoke.ps1
      - name: Capture product-first Win32 frames (visual inspection artifact)
        shell: powershell
        continue-on-error: false
        run: .\Tests\Capture-ProductUI.ps1 -OutputRoot $env:RUNNER_TEMP
      - name: Upload captured GUI frames for independent visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bypass-manager-native-ui-frames
          path: ${{ runner.temp }}/bypass-ui/*.png
          if-no-files-found: error
      - name: Download seven fixed official upstream files (test only)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sha='6b4375fa04f6bd7017eec379e16e462d3ea8df66'
          $engine=Join-Path $env:RUNNER_TEMP 'bypass-upstream'
          $files=@{
            'winws2.exe'='44f7d2400bdf9fbfb3b66d860fd11e8d9a1c9690'
            'WinDivert.dll'='2c55eeb6921351a6cad292a900f4b8d7d41c4bcc'
            'WinDivert64.sys'='218ccaf423ef0a67696226f9ef3a09149e4441d0'
            'cygwin1.dll'='1bb2e05c6d5458ad7987859a17172b635e87b9c5'
            'lua/zapret-lib.lua'='de290a71e2a02774494253d32279b44ad18ec387'
            'lua/zapret-antidpi.lua'='b768277b01114246503819d15a8ed1bb15011b5c'
            'lua/zapret-auto.lua'='2eb416f86d18f5854e1d29d17121340051430efa'
          }
          foreach ($entry in $files.GetEnumerator()) {
            $path=$entry.Key
            $dest=Join-Path $engine $path
            New-Item -Path (Split-Path $dest) -ItemType Directory -Force | Out-Null
            $url="https://raw.githubusercontent.com/bol-van/zapret-win-bundle/$sha/zapret-winws/$path"
            Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing -TimeoutSec 35
            $actual=(& git hash-object $dest).Trim()
            if($actual -ne $entry.Value) { throw "Upstream Git blob hash mismatch: $path" }
          }
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'engine-path.txt') -Value $engine
      - name: Validate original Lua and exact WinDivert filters (no traffic)
        shell: powershell
        run: |
          $engine=Get-Content (Join-Path $env:RUNNER_TEMP 'engine-path.txt')
          .\Tests\Verify-Windows.ps1 -WithUpstream -BundleRoot $engine
      - name: Native Direct TLS filter start, verify ownership, stop (no VPN)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $engine=Get-Content (Join-Path $env:RUNNER_TEMP 'engine-path.txt')
          $state=Join-Path $env:RUNNER_TEMP 'bypass-onebutton-native-trial'
          $native=Join-Path (Get-Location) 'runtime\Scripts\Start-Direct.ps1'
          $stop=Join-Path (Get-Location) 'runtime\Scripts\Start-Profile.ps1'
          try {
            & $native -Action Start -BundleRoot $engine -StateFolder $state
            $line=@(& $native -Action Status -StateFolder $state) | Select-Object -Last 1
            $v=$line | ConvertFrom-Json
            if($v.state -ne 'RUNNING' -or $v.mode -ne 'DIRECT_AUTO_TLS') {throw "Owned native process not running ($($v.state))"}
            Write-Host 'PASS owned Direct TLS native WinDivert process started and observed'
          } finally {
            & $stop -Action Stop -StateFolder $state
          }
          if(Test-Path (Join-Path $state 'winws2-owned.json')) {throw 'Owned WinDivert process state was not cleaned'}
          Write-Host 'PASS owned Direct TLS native WinDivert process cleanly stopped'
      - name: Upload unsigned Windows build and test assets
        uses: actions/upload-artifact@v4
        with:
          name: bypass-manager-0-3-alpha-win64-unsigned
          path: |
            tools/bypass-manager/Bypass-Manager.exe
            tools/bypass-manager/README-RU.md
          if-no-files-found: error

  publish-pinned-guidefix:
    name: Publish directly downloadable Alpha after Windows PASS
    needs: windows-native
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-alpha]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bypass-manager-0-3-alpha-win64-unsigned
          path: release/raw
      - name: Package exact Windows CI executable and corresponding sources
        shell: bash
        run: |
          set -euo pipefail
          test -s release/raw/Bypass-Manager.exe
          test -s release/raw/README-RU.md
          mkdir -p release/windows
          cp release/raw/Bypass-Manager.exe release/windows/
          cp release/raw/README-RU.md release/windows/
          cp tools/bypass-manager/MIGRATION_NEXT_CHAT_BYPASS_MANAGER_0_3_2026_11_16_RU.md release/windows/
          cp tools/bypass-manager/VALIDATION-MATRIX-2026-11-16-RU.md release/windows/
          cp tools/bypass-manager/MODEL-RESULTS-2026-11-17-RU.md release/windows/
          mkdir -p release/windows/model
          cp tools/bypass-manager/model/field-model-local-2026-11-17.json release/windows/model/
          (cd release/windows && zip -q -9 ../Bypass-Manager-0.3-Alpha-Local-Proxy-ABA-Windows-x64.zip Bypass-Manager.exe README-RU.md MIGRATION_NEXT_CHAT_BYPASS_MANAGER_0_3_2026_11_16_RU.md VALIDATION-MATRIX-2026-11-16-RU.md MODEL-RESULTS-2026-11-17-RU.md model/field-model-local-2026-11-17.json)
          git archive --format zip --prefix=bypass-manager-0.3-local-proxy-aba-source/ -o release/Bypass-Manager-0.3-Alpha-Local-Proxy-ABA-Source.zip HEAD:tools/bypass-manager
          cp tools/bypass-manager/MIGRATION_NEXT_CHAT_BYPASS_MANAGER_0_3_2026_11_16_RU.md release/
          cp tools/bypass-manager/VALIDATION-MATRIX-2026-11-16-RU.md release/
          cp tools/bypass-manager/MODEL-RESULTS-2026-11-17-RU.md release/
          cp tools/bypass-manager/model/field-model-local-2026-11-17.json release/
          (cd release && sha256sum Bypass-Manager-0.3-Alpha-Local-Proxy-ABA-Windows-x64.zip Bypass-Manager-0.3-Alpha-Local-Proxy-ABA-Source.zip MIGRATION_NEXT_CHAT_BYPASS_MANAGER_0_3_2026_11_16_RU.md VALIDATION-MATRIX-2026-11-16-RU.md MODEL-RESULTS-2026-11-17-RU.md field-model-local-2026-11-17.json > SHA256SUMS.txt)
      - name: Create immutable prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=bypass-manager-0.3-alpha-local-proxy-aba-2026-11-17
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists, refusing to replace files"
            exit 1
          fi
          gh release create "$TAG" \
            release/Bypass-Manager-0.3-Alpha-Local-Proxy-ABA-Windows-x64.zip \
            release/Bypass-Manager-0.3-Alpha-Local-Proxy-ABA-Source.zip \
            release/MIGRATION_NEXT_CHAT_BYPASS_MANAGER_0_3_2026_11_16_RU.md \
            release/VALIDATION-MATRIX-2026-11-16-RU.md \
            release/MODEL-RESULTS-2026-11-17-RU.md \
            release/field-model-local-2026-11-17.json \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Bypass Manager 0.3 Alpha | 53 local proxy and A/B/A models | Windows CI" \
            --notes "Windows native GUI, PowerShell and original winws2 Lua/WinDivert dry-run PASS required for release. 53 reproducible scenarios with loopback HTTP CONNECT and SOCKS5 TLS, VLESS with no TUN / Local Proxy, app-to-owned-loopback socket observations, correct VPN-off baseline and A/B/A rollback after owned DPI. Exact Windows binary built from the same commit. Includes Russian report and source JSON. Controlled manager-origin proxy HTTPS is NOT per-application public egress or a native Amnezia Premium handshake. A/B/A reversal remains correlation, not proven DPI causality. Real user video/network acceptance remains REAL_NETWORK_NOT_ACCEPTED. Unsigned Windows Alpha." \
            --prerelease
