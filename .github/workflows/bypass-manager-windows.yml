name: Bypass Manager Windows qualification
on:
  workflow_dispatch:
  push:
    branches:
      - work/2026-11-15-bypass-manager-0-3-alpha
      - work/2026-11-20-bypass-manager-one-button
    paths:
      - tools/bypass-manager/**
      - .github/workflows/bypass-manager-windows.yml
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/bypass-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Run native Go tests
        shell: pwsh
        run: go test -count=1 ./...
      - name: Vet and build GUI executable
        shell: pwsh
        run: |
          go vet ./...
          go build -trimpath -ldflags='-H windowsgui -s -w' -o Bypass-Manager.exe .
          Get-FileHash Bypass-Manager.exe -Algorithm SHA256
      - name: Validate isolated PowerShell 5.1 scripts, native CLI and recovery
        shell: powershell
        run: |
          # Fixture scripts override global Get-Process/Get-NetTCPConnection.
          # Never let one mock process contaminate another native Windows test.
          $ErrorActionPreference='Stop'
          $scripts=@(
            'Verify-Windows.ps1',
            'Test-DnsExposure.ps1',
            'Test-VpnStatus.ps1',
            'Test-NetworkHealth.ps1',
            'Test-PathEvidence.ps1',
            'Test-AppSockets.ps1',
            'Test-LocalProxy-Mock.ps1',
            'Test-AppProxy-Sockets-Mock.ps1',
            'Test-TemporaryMTU.ps1',
            'Test-MTU-Rollback-Mock.ps1',
            'Test-OuterEndpoint-Mock.ps1',
            'Test-EndpointRoute.ps1',
            'Test-OwnRecovery.ps1'
          )
          foreach($name in $scripts) {
            $test=Join-Path '.\Tests' $name
            & "$PSHOME\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test
            if($LASTEXITCODE -ne 0) { throw "Isolated PowerShell test FAILED: $name" }
            if((Get-Command Get-Process).CommandType -ne 'Cmdlet') {
              throw "Unexpected process mock persisted in Windows qualification host"
            }
          }
          $p=Start-Process -FilePath .\Bypass-Manager.exe -ArgumentList '--status' -PassThru -Wait
          if($p.ExitCode -ne 0) { throw "CLI status failed $($p.ExitCode)" }
      - name: Smoke-test native Win32 window lifecycle
        shell: powershell
        run: .\Tests\Test-GuiSmoke.ps1
      - name: Capture product-first Win32 frames (visual inspection artifact)
        shell: powershell
        continue-on-error: false
        run: .\Tests\Capture-ProductUI.ps1 -OutputRoot $env:RUNNER_TEMP
      - name: Upload captured GUI frames for independent visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bypass-manager-native-ui-frames
          path: ${{ runner.temp }}/bypass-ui/*.png
          if-no-files-found: error
      - name: Download seven fixed official upstream files (test only)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sha='6b4375fa04f6bd7017eec379e16e462d3ea8df66'
          $engine=Join-Path $env:RUNNER_TEMP 'bypass-upstream'
          $files=@{
            'winws2.exe'='44f7d2400bdf9fbfb3b66d860fd11e8d9a1c9690'
            'WinDivert.dll'='2c55eeb6921351a6cad292a900f4b8d7d41c4bcc'
            'WinDivert64.sys'='218ccaf423ef0a67696226f9ef3a09149e4441d0'
            'cygwin1.dll'='1bb2e05c6d5458ad7987859a17172b635e87b9c5'
            'lua/zapret-lib.lua'='de290a71e2a02774494253d32279b44ad18ec387'
            'lua/zapret-antidpi.lua'='b768277b01114246503819d15a8ed1bb15011b5c'
            'lua/zapret-auto.lua'='2eb416f86d18f5854e1d29d17121340051430efa'
          }
          foreach ($entry in $files.GetEnumerator()) {
            $path=$entry.Key
            $dest=Join-Path $engine $path
            New-Item -Path (Split-Path $dest) -ItemType Directory -Force | Out-Null
            $url="https://raw.githubusercontent.com/bol-van/zapret-win-bundle/$sha/zapret-winws/$path"
            Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing -TimeoutSec 35
            $actual=(& git hash-object $dest).Trim()
            if($actual -ne $entry.Value) { throw "Upstream Git blob hash mismatch: $path" }
          }
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'engine-path.txt') -Value $engine
      - name: Validate original Lua and exact WinDivert filters (no traffic)
        shell: powershell
        run: |
          $engine=Get-Content (Join-Path $env:RUNNER_TEMP 'engine-path.txt')
          .\Tests\Verify-Windows.ps1 -WithUpstream -BundleRoot $engine
      - name: Native Direct TLS filter start, verify ownership, stop (no VPN)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $engine=Get-Content (Join-Path $env:RUNNER_TEMP 'engine-path.txt')
          $state=Join-Path $env:RUNNER_TEMP 'bypass-onebutton-native-trial'
          $native=Join-Path (Get-Location) 'runtime\Scripts\Start-Direct.ps1'
          $stop=Join-Path (Get-Location) 'runtime\Scripts\Start-Profile.ps1'
          try {
            & $native -Action Start -BundleRoot $engine -StateFolder $state
            $line=@(& $native -Action Status -StateFolder $state) | Select-Object -Last 1
            $v=$line | ConvertFrom-Json
            if($v.state -ne 'RUNNING' -or $v.mode -ne 'DIRECT_AUTO_TLS') {throw "Owned native process not running ($($v.state))"}
            Write-Host 'PASS owned Direct TLS native WinDivert process started and observed'
          } finally {
            & $stop -Action Stop -StateFolder $state
          }
          if(Test-Path (Join-Path $state 'winws2-owned.json')) {throw 'Owned WinDivert process state was not cleaned'}
          Write-Host 'PASS owned Direct TLS native WinDivert process cleanly stopped'
      - name: Offline engine install from the exact original seven files
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:BYPASS_CI_ENGINE_ROOT=(Get-Content (Join-Path $env:RUNNER_TEMP 'engine-path.txt'))
          go test -count=1 -run '^TestPinnedBundleRealFiles$' -v .
          if($LASTEXITCODE -ne 0) {throw 'Offline original engine installation FAILED'}
      - name: Assemble complete offline engine and third-party license
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=Get-Content (Join-Path $env:RUNNER_TEMP 'engine-path.txt')
          $dest=Join-Path (Get-Location) 'engine'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          foreach($name in @('winws2.exe','WinDivert.dll','WinDivert64.sys','cygwin1.dll','lua/zapret-lib.lua','lua/zapret-antidpi.lua','lua/zapret-auto.lua')){
            $to=Join-Path $dest $name
            New-Item -ItemType Directory -Path (Split-Path $to) -Force | Out-Null
            Copy-Item -LiteralPath (Join-Path $src $name) -Destination $to
            if((git hash-object $to).Trim() -ne (git hash-object (Join-Path $src $name)).Trim()){throw "Offline binary changed: $name"}
          }
          $licenses=Join-Path (Get-Location) 'LICENSES'
          New-Item -ItemType Directory -Path $licenses -Force | Out-Null
          $license=Join-Path $licenses 'WinDivert-LICENSE.txt'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/basil00/WinDivert/v2.2.2/LICENSE' -OutFile $license -UseBasicParsing -TimeoutSec 35
          if((git hash-object $license).Trim() -ne '8489a8e773c33fd6f91eb67276e2d82a2d7547c3'){throw 'Pinned WinDivert license verification failed'}
          Write-Host 'PASS offline engine, original binaries and LGPL license ready'
      - name: Upload unsigned Windows build and test assets
        uses: actions/upload-artifact@v4
        with:
          name: bypass-manager-0-4-offline-https-win64-unsigned
          path: |
            tools/bypass-manager/Bypass-Manager.exe
            tools/bypass-manager/README-RU.md
            tools/bypass-manager/engine/**
            tools/bypass-manager/LICENSES/WinDivert-LICENSE.txt
            tools/bypass-manager/THIRD-PARTY-NOTICES-RU.md
            tools/bypass-manager/ONE-BUTTON-HTTPS-CHECK-2026-11-21-RU.md
          if-no-files-found: error

  publish-offline-https:
    name: Publish offline Windows Alpha after full native CI PASS
    needs: windows-native
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-alpha]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bypass-manager-0-4-offline-https-win64-unsigned
          path: release/raw
      - uses: actions/download-artifact@v4
        with:
          name: bypass-manager-native-ui-frames
          path: release/ui
      - name: Package verified original engine, EXE, reports and license
        shell: bash
        run: |
          set -euo pipefail
          test -s release/raw/Bypass-Manager.exe
          test -s release/raw/engine/winws2.exe
          test -s release/raw/engine/WinDivert64.sys
          test -s release/raw/LICENSES/WinDivert-LICENSE.txt
          test -s release/ui/main-one-button.png
          mkdir -p release/windows
          cp release/raw/Bypass-Manager.exe release/windows/
          cp release/raw/README-RU.md release/windows/
          cp tools/bypass-manager/PRODUCT-RESET-2026-11-20-RU.md release/windows/
          cp tools/bypass-manager/ONE-BUTTON-DEVELOPMENT-2026-11-21-RU.md release/windows/
          cp tools/bypass-manager/ONE-BUTTON-HTTPS-CHECK-2026-11-21-RU.md release/windows/
          cp tools/bypass-manager/THIRD-PARTY-NOTICES-RU.md release/windows/
          cp -R release/raw/engine release/windows/
          cp -R release/raw/LICENSES release/windows/
          (cd release/windows && zip -q -r -9 ../Bypass-Manager-0.4-One-Button-Offline-Windows-x64.zip Bypass-Manager.exe README-RU.md PRODUCT-RESET-2026-11-20-RU.md ONE-BUTTON-DEVELOPMENT-2026-11-21-RU.md ONE-BUTTON-HTTPS-CHECK-2026-11-21-RU.md THIRD-PARTY-NOTICES-RU.md engine LICENSES)
          git archive --format=zip --prefix=bypass-manager-0.4-offline-source/ --output=release/Bypass-Manager-0.4-One-Button-Offline-Source.zip HEAD:tools/bypass-manager
          cp release/ui/main-one-button.png release/Bypass-Manager-0.4-Native-Windows.png
          cp tools/bypass-manager/ONE-BUTTON-HTTPS-CHECK-2026-11-21-RU.md release/
          cp tools/bypass-manager/THIRD-PARTY-NOTICES-RU.md release/
          (cd release && sha256sum Bypass-Manager-0.4-One-Button-Offline-Windows-x64.zip Bypass-Manager-0.4-One-Button-Offline-Source.zip Bypass-Manager-0.4-Native-Windows.png ONE-BUTTON-HTTPS-CHECK-2026-11-21-RU.md THIRD-PARTY-NOTICES-RU.md > SHA256SUMS.txt)
      - name: Publish immutable GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=bypass-manager-0.4-alpha-offline-https-2026-11-21
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This version already exists, refusing to overwrite"
            exit 1
          fi
          gh release create "$TAG" \
            release/Bypass-Manager-0.4-One-Button-Offline-Windows-x64.zip \
            release/Bypass-Manager-0.4-One-Button-Offline-Source.zip \
            release/Bypass-Manager-0.4-Native-Windows.png \
            release/ONE-BUTTON-HTTPS-CHECK-2026-11-21-RU.md \
            release/THIRD-PARTY-NOTICES-RU.md \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Bypass Manager 0.4 Alpha | Offline engine + HTTPS evidence" \
            --notes "Full Windows ZIP includes original pinned unmodified winws2, WinDivert, Cygwin and Lua, third-party license texts and hash-pinned atomic offline install. One-button Enable checks three fixed public HTTPS probes before and after its own WinDivert startup. A general HTTPS change is NOT evidence of a recovered blocked site, DPI causality, browser traffic or hidden IP. Native Windows GUI, native driver ownership start/stop and offline installation pass CI. REAL_NETWORK_NOT_ACCEPTED. Unsigned Alpha." \
            --prerelease
