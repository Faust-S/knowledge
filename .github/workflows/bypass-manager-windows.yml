name: Bypass Manager Windows qualification
on:
  workflow_dispatch:
  push:
    branches:
      - work/2026-11-15-bypass-manager-0-3-alpha
    paths:
      - tools/bypass-manager/**
      - .github/workflows/bypass-manager-windows.yml
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/bypass-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Run native Go tests
        shell: pwsh
        run: go test -count=1 ./...
      - name: Vet and build GUI executable
        shell: pwsh
        run: |
          go vet ./...
          go build -trimpath -ldflags='-H windowsgui -s -w' -o Bypass-Manager.exe .
          Get-FileHash Bypass-Manager.exe -Algorithm SHA256
      - name: Validate PowerShell scripts and native CLI state
        shell: powershell
        run: |
          .\Tests\Verify-Windows.ps1
          .\Tests\Test-DnsExposure.ps1
          .\Tests\Test-VpnStatus.ps1
          .\Tests\Test-NetworkHealth.ps1
          .\Tests\Test-PathEvidence.ps1
          .\Tests\Test-AppSockets.ps1
          .\Tests\Test-TemporaryMTU.ps1
          .\Tests\Test-MTU-Rollback-Mock.ps1
          .\Tests\Test-OuterEndpoint-Mock.ps1
          .\Tests\Test-EndpointRoute.ps1
          .\Tests\Test-OwnRecovery.ps1
          $p=Start-Process -FilePath .\Bypass-Manager.exe -ArgumentList '--status' -PassThru -Wait
          if($p.ExitCode -ne 0) { throw "CLI status failed $($p.ExitCode)" }
      - name: Smoke-test native Win32 window lifecycle
        shell: powershell
        run: .\Tests\Test-GuiSmoke.ps1
      - name: Download seven fixed official upstream files (test only)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sha='6b4375fa04f6bd7017eec379e16e462d3ea8df66'
          $engine=Join-Path $env:RUNNER_TEMP 'bypass-upstream'
          $files=@{
            'winws2.exe'='44f7d2400bdf9fbfb3b66d860fd11e8d9a1c9690'
            'WinDivert.dll'='2c55eeb6921351a6cad292a900f4b8d7d41c4bcc'
            'WinDivert64.sys'='218ccaf423ef0a67696226f9ef3a09149e4441d0'
            'cygwin1.dll'='1bb2e05c6d5458ad7987859a17172b635e87b9c5'
            'lua/zapret-lib.lua'='de290a71e2a02774494253d32279b44ad18ec387'
            'lua/zapret-antidpi.lua'='b768277b01114246503819d15a8ed1bb15011b5c'
            'lua/zapret-auto.lua'='2eb416f86d18f5854e1d29d17121340051430efa'
          }
          foreach ($entry in $files.GetEnumerator()) {
            $path=$entry.Key
            $dest=Join-Path $engine $path
            New-Item -Path (Split-Path $dest) -ItemType Directory -Force | Out-Null
            $url="https://raw.githubusercontent.com/bol-van/zapret-win-bundle/$sha/zapret-winws/$path"
            Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing -TimeoutSec 35
            $actual=(& git hash-object $dest).Trim()
            if($actual -ne $entry.Value) { throw "Upstream Git blob hash mismatch: $path" }
          }
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'engine-path.txt') -Value $engine
      - name: Validate original Lua and exact WinDivert filters (no traffic)
        shell: powershell
        run: |
          $engine=Get-Content (Join-Path $env:RUNNER_TEMP 'engine-path.txt')
          .\Tests\Verify-Windows.ps1 -WithUpstream -BundleRoot $engine
      - name: Upload unsigned Windows build and test assets
        uses: actions/upload-artifact@v4
        with:
          name: bypass-manager-0-3-alpha-win64-unsigned
          path: |
            tools/bypass-manager/Bypass-Manager.exe
            tools/bypass-manager/README-RU.md
          if-no-files-found: error

  publish-pinned-guidefix:
    name: Publish directly downloadable Alpha after Windows PASS
    needs: windows-native
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-alpha]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bypass-manager-0-3-alpha-win64-unsigned
          path: release/raw
      - name: Package exact Windows CI executable and corresponding sources
        shell: bash
        run: |
          set -euo pipefail
          test -s release/raw/Bypass-Manager.exe
          test -s release/raw/README-RU.md
          mkdir -p release/windows
          cp release/raw/Bypass-Manager.exe release/windows/
          cp release/raw/README-RU.md release/windows/
          cp tools/bypass-manager/MIGRATION_NEXT_CHAT_BYPASS_MANAGER_0_3_2026_11_16_RU.md release/windows/
          (cd release/windows && zip -q -9 ../Bypass-Manager-0.3-Alpha-GuideFix-Windows-x64.zip Bypass-Manager.exe README-RU.md MIGRATION_NEXT_CHAT_BYPASS_MANAGER_0_3_2026_11_16_RU.md)
          git archive --format zip --prefix=bypass-manager-0.3-guidefix-source/ -o release/Bypass-Manager-0.3-Alpha-GuideFix-Source.zip HEAD:tools/bypass-manager
          cp tools/bypass-manager/MIGRATION_NEXT_CHAT_BYPASS_MANAGER_0_3_2026_11_16_RU.md release/
          (cd release && sha256sum Bypass-Manager-0.3-Alpha-GuideFix-Windows-x64.zip Bypass-Manager-0.3-Alpha-GuideFix-Source.zip MIGRATION_NEXT_CHAT_BYPASS_MANAGER_0_3_2026_11_16_RU.md > SHA256SUMS.txt)
      - name: Create immutable prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=bypass-manager-0.3-alpha-guidefix-hardstop-2026-11-16
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists, refusing to replace files"
            exit 1
          fi
          gh release create "$TAG" \
            release/Bypass-Manager-0.3-Alpha-GuideFix-Windows-x64.zip \
            release/Bypass-Manager-0.3-Alpha-GuideFix-Source.zip \
            release/MIGRATION_NEXT_CHAT_BYPASS_MANAGER_0_3_2026_11_16_RU.md \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Bypass Manager 0.3 Alpha | guide cancellation fix | Windows CI" \
            --notes "Windows Go/PowerShell/GUI qualification passed. In-window cancellable human prompts, 3-minute timeout, terminal guide report on early return. Unsigned executable. Amnezia Premium not included. REAL_NETWORK_NOT_ACCEPTED: native VPN handshake, independent app egress, and long video playback unverified." \
            --prerelease
