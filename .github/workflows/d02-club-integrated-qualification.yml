name: d02-club-integrated-qualification
on:
  push:
    branches:
      - work/2026-11-18-d02-club-qualification
    paths:
      - .github/workflows/d02-club-integrated-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d02-club-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated:
    name: Club source tests and integrated T2 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      SITE_SHA: 49b860c959d277576f7f2477fcf899843582367d
      DOMAIN_SHA: f5e045a5853dfccf2410df65dfcc4b86ef94712f
      T2_SHA: e70de29b72b83e2546f7ab74b17572685a728c17
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      CI: 'true'
    steps:
      - name: Ensure Git never rewrites qualified T2 LF blobs
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout private canonical Club domain (temporary runner only)
        uses: actions/checkout@v4
        with:
          repository: Faust-S/club
          ref: ${{ env.DOMAIN_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: domain

      - name: Checkout private Club site (temporary runner only)
        uses: actions/checkout@v4
        with:
          repository: Faust-S/club.iwxa.ru
          ref: ${{ env.SITE_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site

      - name: Checkout exact private normative T2 (temporary runner only)
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: ${{ env.T2_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: t2

      - name: Pin Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Check all three immutable source revisions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repos = @(
            @{ path='domain'; expected=$env:DOMAIN_SHA; label='DOMAIN' },
            @{ path='site'; expected=$env:SITE_SHA; label='SITE' },
            @{ path='t2'; expected=$env:T2_SHA; label='T2' }
          )
          foreach($r in $repos) {
            $found = (& git -C $r.path rev-parse HEAD).Trim()
            if($LASTEXITCODE -ne 0 -or $found -ne $r.expected) { throw "PIN_MISMATCH_$($r.label)" }
            $dirty = & git -C $r.path status --porcelain
            if($LASTEXITCODE -ne 0 -or $dirty) { throw "DIRTY_SOURCE_$($r.label)" }
            Write-Output "D02_SOURCE_$($r.label)=PINNED"
          }
          Write-Output "D02_NODE=$(& node --version)"
          Write-Output "D02_NPM=$(& npm --version)"

      - name: Run all canonical domain subject tests
        id: domain_test
        continue-on-error: true
        shell: pwsh
        working-directory: domain
        run: |
          $ErrorActionPreference='Stop'
          $log = Join-Path $env:RUNNER_TEMP 'club-domain-tests-private.log'
          $cases = @(Get-ChildItem -Path tests -Filter '*.test.mjs' -Recurse -File | Sort-Object FullName | ForEach-Object FullName)
          if($cases.Count -lt 20) { throw 'DOMAIN_CASE_TEST_DISCOVERY_INCOMPLETE' }
          & node --test @cases *> $log
          $code=$LASTEXITCODE
          if($code -ne 0) {
            Write-Output "D02_DOMAIN_TEST=FAIL count=$($cases.Count) exit=$code"
            Get-Content $log | Select-String -Pattern '^not ok\b|^# (tests|pass|fail)\b|^npm error (code|errno)' | Select-Object -Last 40 | ForEach-Object { Write-Output $_.Line }
            exit $code
          }
          Write-Output "D02_DOMAIN_TEST=PASS test_files=$($cases.Count)"

      - name: Install site dependencies in the temporary runner
        id: site_ci
        continue-on-error: true
        shell: pwsh
        working-directory: site
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'club-site-npm-install-private.log'
          & npm ci --no-audit --no-fund *> $log
          $code=$LASTEXITCODE
          if($code -ne 0) {
            Write-Output "D02_SITE_NPM_CI=FAIL exit=$code"
            Get-Content $log | Select-String -Pattern '^npm error (code|errno|Exit handler)|^npm ERR! code|^Error: [A-Z_]+|EACCES|ENOTCACHED' | Select-Object -Last 25 | ForEach-Object { Write-Output $_.Line }
            exit $code
          }
          Write-Output 'D02_SITE_NPM_CI=PASS'

      - name: Confirm all 25 services and three source algorithms exactly match canonical Club
        id: canon_parity
        if: steps.site_ci.outcome == 'success'
        continue-on-error: true
        working-directory: site
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'club-canonical-site-parity-private.log'
          & node scripts/check-club-domain-catalog-parity.mjs ../domain *> $log
          if($LASTEXITCODE -ne 0) {
            Write-Output 'D02_CANONICAL_DOMAIN_PARITY=FAIL'
            throw 'D02_CANONICAL_DOMAIN_PARITY_FAILED'
          }
          Write-Output 'D02_CANONICAL_DOMAIN_PARITY=PASS services=25 bridges=10'

      - name: Run each site source suite and identify failures without leaking private logs
        id: site_tests
        if: steps.site_ci.outcome == 'success'
        continue-on-error: true
        working-directory: site
        shell: pwsh
        run: |
          $suite = (Get-Content package.json -Raw | ConvertFrom-Json).scripts.test
          $commands = @([regex]::Split($suite, '\s+&&\s+'))
          if ($commands.Count -lt 35) { throw 'D02_SITE_SUITE_LIST_INCOMPLETE' }
          $failed = [System.Collections.Generic.List[string]]::new()
          $count = 0
          foreach ($command in $commands) {
            if ($command -notmatch '^npm run (test:[A-Za-z0-9-]+)$') { throw 'D02_SITE_TEST_COMMAND_INVALID' }
            $script = $Matches[1]
            $safe = $script.Replace(':','-')
            $log = Join-Path $env:RUNNER_TEMP ("club-private-" + $safe + ".log")
            & npm run $script *> $log
            $code = $LASTEXITCODE
            $count++
            if ($code -ne 0) {
              $failed.Add($script)
              Write-Output "D02_SITE_TEST_FAIL=$script exit=$code"
              # TAP failure titles and error codes are safe summaries, not private source.
              $titles = @(Get-Content $log | Select-String -Pattern '(?i)\bnot ok\s+\d+\s+-\s+[^\r\n]+' | Select-Object -Last 8)
              foreach ($item in $titles) {
                $title = [regex]::Match($item.Line, '(?i)\bnot ok\s+\d+\s+-\s+[^\r\n]+').Value
                Write-Output ("D02_SITE_TEST_ASSERTION=" + $title)
              }
              $codes = @(Get-Content $log | Select-String -Pattern '^[ ]{0,8}(failureType|code|operator): [A-Za-z0-9_\x27-]+' | Select-Object -Last 6)
              foreach ($item in $codes) { Write-Output ("D02_SITE_TEST_KIND=" + $item.Line.Trim()) }
            }
          }
          Write-Output "D02_SITE_TEST_SUITE_COUNT=$count"
          if ($failed.Count -gt 0) {
            Write-Output "D02_SITE_TESTS=FAIL failed_count=$($failed.Count)"
            exit 1
          }
          Write-Output 'D02_SITE_TESTS=PASS'

      - name: Build real unified T2 Host plus public Club site
        id: integrated_build
        if: steps.site_ci.outcome == 'success'
        continue-on-error: true
        working-directory: site
        shell: pwsh
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
          IWXA_T2_NPM_CACHE_DIR: ${{ runner.temp }}/club-npm-cache
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'club-integrated-build-private.log'
          & npm run build *> $log
          $code=$LASTEXITCODE
          if($code -ne 0) {
            Write-Output "D02_INTEGRATED_BUILD=FAIL exit=$code"
            Get-Content $log | Select-String -Pattern '^Error: (CLUB_|T2_|K03|K035)|^npm error (code|errno|Exit handler)|^CLUB_T2_.*(MISSING|INVALID|FAIL)|EACCES|ENOTCACHED|^fatal:|^error TS[0-9]+' | Select-Object -Last 30 | ForEach-Object { Write-Output $_.Line }
            # Public report: error titles and paths only, not source, files, or dist.
            $diagnostics = @(Get-Content $log | Select-String -Pattern '^(CURRENT STATIC SOURCE CHECK: FAIL|- [^\r\n]{1,180}: (?:broken local ref|long dash|internal Workspace|syntax error|missing)|SyntaxError:|Error: |npm error code )' | Select-Object -Last 18)
            foreach($item in $diagnostics) {
              Write-Output ('D02_BUILD_DIAGNOSTIC=' + $item.Line.Substring(0,[Math]::Min(220,$item.Line.Length)))
            }
            $tail=@(Get-Content $log | Select-Object -Last 12)
            if($diagnostics.Count -eq 0) {
              foreach($item in $tail) {
                if($item -match '^(?:[A-Z0-9_]+: FAIL|npm error [A-Z]+|Error: [A-Z_0-9]+)') {
                  Write-Output ('D02_BUILD_DIAGNOSTIC=' + $item.Substring(0,[Math]::Min(180,$item.Length)))
                }
              }
            }
            $safePatterns = @(
              @{id='NODE_EXEC_EXIT_HANDLER';value='Exit handler never called'},
              @{id='NPM_NOT_FOUND';value='ENOENT'},
              @{id='NPM_CACHE';value='ENOTCACHED'},
              @{id='NPM_ACCESS';value='EACCES'},
              @{id='NETWORK_TIMEOUT';value='ETIMEDOUT'},
              @{id='MODULE_NOT_FOUND';value='ERR_MODULE_NOT_FOUND'},
              @{id='TYPESCRIPT_ERROR';value='error TS'},
              @{id='STATIC_CHECK_FAILED';value='CURRENT STATIC SOURCE CHECK: FAIL'},
              @{id='CLUB_BUILD_ERROR';value='Error: CLUB_'},
              @{id='T2_BUILD_ERROR';value='Error: T2_'}
            )
            $fullLog = Get-Content $log -Raw
            foreach($signal in $safePatterns) {
              if($fullLog.Contains($signal.value)) {
                Write-Output ("D02_BUILD_ERROR_CLASS=" + $signal.id)
              }
            }
            exit $code
          }
          Write-Output 'D02_INTEGRATED_BUILD=PASS'
          $essential=@('index.html','workspace/index.html','workspace/exchange/index.html','workspace/lifecycle/index.html','_iwxa/runtime/0.3.6/runtime.js')
          foreach($rel in $essential) {
            if(-not (Test-Path -LiteralPath (Join-Path 'dist' $rel))) { throw "DIST_MISSING_$($rel.Replace('/','_'))" }
          }
          $files=(Get-ChildItem -LiteralPath dist -Recurse -File -Force | Measure-Object).Count
          $hash=(Get-FileHash -LiteralPath 'dist/workspace/index.html' -Algorithm SHA256).Hash
          Write-Output "D02_DIST_FILES=$files"
          Write-Output "D02_WORKSPACE_HTML_SHA256=$hash"
          # Portable, content-free output inventory: only section counts and
          # aggregate digest, never private paths, file bytes or dist artifacts.
          $root = (Resolve-Path dist).Path.TrimEnd([IO.Path]::DirectorySeparatorChar)
          $counts = @{}
          $inventory = [System.Collections.Generic.List[string]]::new()
          foreach($file in (Get-ChildItem -LiteralPath dist -Recurse -File -Force)) {
            $relative = $file.FullName.Substring($root.Length).TrimStart('/','\').Replace('\','/')
            $bucket = if($relative.StartsWith('_iwxa/runtime/')){'kernel-runtime'}
              elseif($relative.StartsWith('_iwxa/')){'kernel-other'}
              elseif($relative.StartsWith('workspace/assets/')){'host-assets'}
              elseif($relative.StartsWith('workspace/')){'host-other'}
              elseif($relative.StartsWith('assets/')){'site-assets'}
              elseif($relative.EndsWith('.html')){'public-html'}
              else{'public-other'}
            if(-not $counts.ContainsKey($bucket)){$counts[$bucket]=0}
            $counts[$bucket]++
            $digest = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
            $inventory.Add($relative + ':' + $digest)
          }
          foreach($name in @('kernel-runtime','kernel-other','host-assets','host-other','site-assets','public-html','public-other')) {
            Write-Output "D02_DIST_BUCKET_$($name.Replace('-','_'))=$($counts[$name])"
          }
          $inventory.Sort([StringComparer]::Ordinal)
          $combined = [Text.Encoding]::UTF8.GetBytes(($inventory -join "`n"))
          $combinedHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($combined))
          Write-Output "D02_DIST_MANIFEST_SHA256=$combinedHash"

      - name: Verify integrated release contract and all 40 routes
        id: release_gate
        if: steps.integrated_build.outcome == 'success'
        continue-on-error: true
        working-directory: site
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'club-release-gate-private.log'
          & npm run check:club-release *> $log
          $code=$LASTEXITCODE
          if($code -ne 0) {
            Write-Output "D02_RELEASE_GATE=FAIL exit=$code"
            Get-Content $log | Select-String -Pattern '^Error: (CLUB_|T2_)|CLUB_T2_RELEASE_GATE' | Select-Object -Last 20 | ForEach-Object { Write-Output $_.Line }
            exit $code
          }
          Write-Output 'D02_RELEASE_GATE=PASS routes=40'

      - name: Confirm all 40 routes work via real HTTP and refuse private paths
        id: http_preview
        if: steps.release_gate.outcome == 'success'
        continue-on-error: true
        working-directory: site
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'club-integrated-http-private.log'
          & node scripts/check-club-integrated-http-preview.mjs dist *> $log
          if($LASTEXITCODE -ne 0) {
            Write-Output 'D02_HTTP_PREVIEW=FAIL'
            Get-Content $log | Select-String -Pattern 'CLUB_HTTP_PREVIEW_[A-Z_]+|ERR_ASSERTION|ECONNREFUSED|ETIMEDOUT' | Select-Object -Last 8 | ForEach-Object { Write-Output $_.Line }
            exit 1
          }
          Write-Output 'D02_HTTP_PREVIEW=PASS routes=40 assets=12 real404=5'

      - name: Verify temporary physical ZIP from the exact integrated dist without publishing it
        id: archive_qualification
        if: steps.http_preview.outcome == 'success'
        continue-on-error: true
        working-directory: site
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'd02-candidate-preflight.zip'
          $log=Join-Path $env:RUNNER_TEMP 'd02-candidate-preflight.private.log'
          try{
            & node scripts/package-hosting.mjs dist $zip *> $log
            if($LASTEXITCODE -ne 0){throw 'D02_EPHEMERAL_ARCHIVE_PACKAGE_FAIL'}
            & node scripts/verify-club-hosting-archive.mjs dist $zip *>> $log
            if($LASTEXITCODE -ne 0){throw 'D02_EPHEMERAL_ARCHIVE_READBACK_FAIL'}
            Write-Output 'D02_EPHEMERAL_ARCHIVE_QUALIFIED=PASS'
            Write-Output 'D02_EPHEMERAL_ARCHIVE_PUBLISHED=FALSE'
          }finally{
            Remove-Item -LiteralPath $zip,($zip+'.sha256') -Force -ErrorAction SilentlyContinue
          }

      - name: Final private-source-safe status
        if: always()
        shell: pwsh
        run: |
          Write-Output "D02_CANDIDATE_SITE=$env:SITE_SHA"
          Write-Output "D02_DOMAIN_TESTS=${{ steps.domain_test.outcome }}"
          Write-Output "D02_SITE_INSTALL=${{ steps.site_ci.outcome }}"
          Write-Output "D02_CANONICAL_PARITY=${{ steps.canon_parity.outcome }}"
          Write-Output "D02_SITE_TESTS=${{ steps.site_tests.outcome }}"
          Write-Output "D02_INTEGRATED_BUILD=${{ steps.integrated_build.outcome }}"
          Write-Output "D02_RELEASE_GATE=${{ steps.release_gate.outcome }}"
          Write-Output "D02_HTTP_PREVIEW=${{ steps.http_preview.outcome }}"
          Write-Output "D02_EPHEMERAL_ARCHIVE=${{ steps.archive_qualification.outcome }}"
          if ('${{ steps.domain_test.outcome }}' -ne 'success' -or
              '${{ steps.site_ci.outcome }}' -ne 'success' -or
              '${{ steps.canon_parity.outcome }}' -ne 'success' -or
              '${{ steps.site_tests.outcome }}' -ne 'success' -or
              '${{ steps.integrated_build.outcome }}' -ne 'success' -or
              '${{ steps.release_gate.outcome }}' -ne 'success' -or
              '${{ steps.http_preview.outcome }}' -ne 'success' -or
               '${{ steps.archive_qualification.outcome }}' -ne 'success') {
            throw 'D02_QUALIFICATION_NOT_COMPLETE'
          }
          Write-Output 'D02_SOURCE_BUILD_QUALIFIED=PASS'
          Write-Output 'D02_GUI_KERNEL_RECEIPT_IWXA=NOT_RUN_NOT_PRODUCT_ACCEPTED'
