name: D07 T3 original assistant continuity
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d07-t3-assistant-continuity
  cancel-in-progress: false
jobs:
  original-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 5e3083788aa541921559de29d3457d4a52bbba00
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: assistant
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod
          ref: 79068637e424c8348ca5ca846d8b6d84bcddd274
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: domain
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original assistant source and all existing policy tests
        working-directory: assistant/browser-local-inference
        run: |
          node --check domain-assistant/main.mjs > "$RUNNER_TEMP/d07-assistant-syntax.log" 2>&1 || { echo D07_ASSISTANT_SYNTAX=FAIL; exit 1; }
          echo D07_ASSISTANT_SYNTAX=PASS
          node --test tests/domain-assistant-*.test.mjs > "$RUNNER_TEMP/d07-assistant-tests.log" 2>&1 || {
            echo D07_ASSISTANT_CONTINUITY=FAIL
            grep -E '^# (tests|pass|fail) [0-9]+$|^not ok [0-9]+ ' "$RUNNER_TEMP/d07-assistant-tests.log" | cut -c1-180 | head -40
            exit 1
          }
          echo D07_ASSISTANT_CONTINUITY=PASS
          grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/d07-assistant-tests.log"
      - name: Recheck the exact existing D07 field policy and canonical skills
        env:
          D07_ORIGINAL_ASSISTANT_DIR: ${{ github.workspace }}/assistant/browser-local-inference/domain-assistant
        run: |
          node --test domain/tests/assistant-skills.test.mjs domain/tests/assistant-skill-field-policy.test.mjs > "$RUNNER_TEMP/d07-assistant-domain.log" 2>&1 || {
            echo D07_ASSISTANT_DOMAIN_POLICY=FAIL
            grep -E '^# (tests|pass|fail) [0-9]+$|^not ok [0-9]+ ' "$RUNNER_TEMP/d07-assistant-domain.log" | cut -c1-180 | head -40
            exit 1
          }
          echo D07_ASSISTANT_DOMAIN_POLICY=PASS
          grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/d07-assistant-domain.log"
      # No private logs, source, compiled assets, model weights or user data are published.
