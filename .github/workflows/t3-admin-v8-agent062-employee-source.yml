name: Admin Center V8 and released Agent 0.6.2 original employee source qualification
on:
  push:
    branches:
      - work/2026-11-22-admin03-agent062-original-source
    paths:
      - .github/workflows/t3-admin-v8-agent062-employee-source.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin-v8-agent062-employee-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-employee-source:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage exact RELEASED Agent 0.6.2 source on public transient runner
        uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: 39a4f49ed9a5c0781c4a4769e9603ca8fb1e8d23
          token: ${{ secrets.AGENT || secrets.DOMEN || secrets.T3 }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            runtime
            tools
            tests
            config
          path: .private/agent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Agent release and original One Core product contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sha=(& git -C .private/agent rev-parse HEAD).Trim()
          if($sha -cne '39a4f49ed9a5c0781c4a4769e9603ca8fb1e8d23'){
            throw 'ADMIN_V8_AGENT062_RELEASE_SOURCE_CHANGED'
          }
          $profile=Get-Content -LiteralPath '.private/agent/config/original-t2-agent-product.json' -Raw | ConvertFrom-Json
          $sources=Get-Content -LiteralPath '.private/agent/config/public-module-sources.json' -Raw | ConvertFrom-Json
          $t3=@($sources.modules | Where-Object {$_.id -ceq 't3'})
          if($profile.productId -cne 'iwxa.personal-agent' -or
             $profile.authorizedNativeOwner -cne 'ORIGINAL_T3_SIGNED_EMPLOYEE' -or
             $profile.authorizedResultRecipient -ne $null -or
             $profile.installedAgentT3Mode -cne 'EXPLICIT_OPT_IN' -or
             $profile.kernelVersion -cne '0.3.6' -or
             $profile.runtimeContract -cne '1.3.0' -or
             $t3.Count -ne 1 -or
             $t3[0].revision -cne '2f65931cd70e0c64e29b31e1824b7af0c0baf6d1'){
            throw 'ADMIN_V8_AGENT062_ORIGINAL_T3_CONTRACT_CHANGED'
          }
          Write-Host 'ADMIN_V8_AGENT062_RELEASED_EMPLOYEE_SOURCE_PIN_PASS'
      - name: Run actual released Personal Agent corporate T3 employee source contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'agent062-corporate-original-employee-source.log'
          $previousPythonPath=$env:PYTHONPATH
          Push-Location '.private/agent'
          try {
            # Python script-path execution makes tests/ sys.path[0] and hides
            # sibling runtime/. Discover from the original repository root.
            $env:PYTHONPATH=(Get-Location).Path
            & python -B -m unittest discover -s tests -p 'test_agent06_corporate_t3_employee.py' *> $log
            $exit=$LASTEXITCODE
          } finally {
            if($null -ne $previousPythonPath){$env:PYTHONPATH=$previousPythonPath}
            else{Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue}
            Pop-Location
          }
          if($exit -ne 0){
            # Publish only a bounded failure class and numeric test count.
            # The private traceback, test names, assertions, fixture text and
            # installed paths stay in the runner temporary file.
            $lines=@(Get-Content -LiteralPath $log -ErrorAction SilentlyContinue)
            $ran=@($lines | Where-Object {$_ -match '^Ran [0-9]+ tests? in '})
            $count=0
            if($ran.Count){
              $hit=[regex]::Match([string]$ran[-1],'^Ran ([0-9]+) tests? in ')
              if($hit.Success){$count=[int]$hit.Groups[1].Value}
            }
            $classification='UNCLASSIFIED'
            if(@($lines | Where-Object {$_ -match 'ModuleNotFoundError|No module named'}).Count){
              $classification='MISSING_TEST_DEPENDENCY'
            }elseif(@($lines | Where-Object {$_ -match '^ImportError:'}).Count){
              $classification='IMPORT_CONTRACT_ERROR'
            }elseif(@($lines | Where-Object {$_ -match '^FAILED ('}).Count){
              $classification='TEST_ASSERTION_OR_ERROR'
            }elseif(@($lines | Where-Object {$_ -match '^ERROR:|^FAIL:'}).Count){
              $classification='TEST_RUNTIME_EXCEPTION'
            }elseif(@($lines | Where-Object {$_ -match 'FileNotFoundError'}).Count){
              $classification='MISSING_RUNTIME_FILE'
            }
            Write-Host "ADMIN_V8_AGENT062_ORIGINAL_EMPLOYEE_TEST_COUNT $count"
            Write-Host "ADMIN_V8_AGENT062_ORIGINAL_EMPLOYEE_FAILURE_CLASS $classification"
            Write-Host 'ADMIN_V8_AGENT062_ORIGINAL_EMPLOYEE_SOURCE_HOLD'
            throw 'ADMIN_V8_AGENT062_ORIGINAL_EMPLOYEE_SOURCE_TEST_FAILED'
          }
          $done=@(Get-Content -LiteralPath $log -ErrorAction SilentlyContinue)
          if(-not (@($done | Where-Object {$_ -match '^OK\s*$'}).Count -ge 1)){
            throw 'ADMIN_V8_AGENT062_ORIGINAL_EMPLOYEE_SOURCE_PASS_MISSING'
          }
          Write-Host 'ADMIN_V8_AGENT062_ORIGINAL_EMPLOYEE_SOURCE_PASS'
          Write-Host 'ADMIN_V8_AGENT062_NOT_INSTALLED_NOT_SIGNED_E2E'
