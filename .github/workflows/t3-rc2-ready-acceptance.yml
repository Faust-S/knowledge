name: T3 rc2 ready acceptance delivery
on:
  push:
    branches: [work/2026-11-24-t3-mobile-model-catalog]
    paths:
      - packages/t3-core/scripts/prepare-t3-rc2-acceptance.mjs
      - packages/t3-core/acceptance/rc2/**
      - .github/workflows/t3-rc2-ready-acceptance.yml
permissions:
  contents: read
concurrency:
  group: t3-rc2-ready-acceptance
  cancel-in-progress: true
jobs:
  windows-delivery:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: packages/t3-core
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          architecture: x64
      - name: Download exact already-qualified release (no platform rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ((git rev-parse HEAD:packages/t3-core/src) -ne 'edc97212c0ee6111dee2c8e6cc2f0d4211068d11') { throw 'QUALIFIED_EXECUTABLE_CHANGED' }
          gh release download t3-platform-v0.3.1-rc.2 --pattern platform-inputs.zip --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'DOWNLOAD_FAILED' }
          node scripts/prepare-t3-rc2-acceptance.mjs (Join-Path $env:RUNNER_TEMP 'platform-inputs.zip') (Join-Path $env:RUNNER_TEMP 'acceptance')
          if ($LASTEXITCODE -ne 0) { throw 'ASSEMBLY_FAILED' }
      - name: Include only local launch transport and official Node Windows runtime
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'acceptance'
          Copy-Item acceptance/rc2/serve-acceptance.mjs,acceptance/rc2/start-acceptance.ps1,acceptance/rc2/START.cmd,acceptance/rc2/README-RU.md -Destination $dest
          $runtime = New-Item -ItemType Directory -Path (Join-Path $dest 'runtime')
          $node = (Get-Command node.exe).Source
          Copy-Item $node (Join-Path $runtime.FullName 'node.exe')
          Copy-Item (Join-Path (Split-Path $node) 'LICENSE') (Join-Path $runtime.FullName 'LICENSE')
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $dest 'start-acceptance.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw 'WINDOWS_LAUNCHER_SYNTAX_FAILED' }
          & (Join-Path $runtime.FullName 'node.exe') --check (Join-Path $dest 'serve-acceptance.mjs')
          if ($LASTEXITCODE -ne 0) { throw 'SERVER_SYNTAX_FAILED' }
      - name: Exercise the exact assembled Host and create an original .iwxa example
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'TEST_DEPENDENCIES_FAILED' }
          npx --no-install playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'BROWSER_INSTALL_FAILED' }
          $dest=Join-Path $env:RUNNER_TEMP 'acceptance'
          $tls=New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'acceptance-tls')
          $cert=$null; $process=$null
          try {
            $cert=New-SelfSignedCertificate -DnsName 'localhost' -Type SSLServerAuthentication -CertStoreLocation 'Cert:\CurrentUser\My' -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -KeyExportPolicy Exportable -NotAfter (Get-Date).AddDays(1)
            $password=[Guid]::NewGuid().ToString('N')
            $env:IWXA_ACCEPTANCE_PFX=Join-Path $tls.FullName 'localhost.pfx'
            $env:IWXA_ACCEPTANCE_PFX_PASSWORD=$password
            $cer=Join-Path $tls.FullName 'localhost.cer'
            Export-PfxCertificate -Cert $cert -FilePath $env:IWXA_ACCEPTANCE_PFX -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
            Export-Certificate -Cert $cert -FilePath $cer | Out-Null
            $process=Start-Process -FilePath (Join-Path $dest 'runtime\node.exe') -ArgumentList 'serve-acceptance.mjs' -WorkingDirectory $dest -PassThru -RedirectStandardOutput (Join-Path $tls.FullName 'stdout.log') -RedirectStandardError (Join-Path $tls.FullName 'stderr.log')
            node acceptance/rc2/smoke.mjs $dest $cer
            if ($LASTEXITCODE -ne 0) { throw 'EXACT_DELIVERY_SMOKE_FAILED' }
          } finally {
            if ($process -and !$process.HasExited) { Stop-Process -Id $process.Id -Force }
            Get-Content (Join-Path $tls.FullName 'stdout.log'),(Join-Path $tls.FullName 'stderr.log') -ErrorAction SilentlyContinue
            Remove-Item Env:\IWXA_ACCEPTANCE_PFX -ErrorAction SilentlyContinue
            Remove-Item Env:\IWXA_ACCEPTANCE_PFX_PASSWORD -ErrorAction SilentlyContinue
            if ($cert) { Remove-Item ('Cert:\CurrentUser\My\'+$cert.Thumbprint) -ErrorAction SilentlyContinue }
            Remove-Item $tls.FullName -Recurse -Force
          }
      - name: Package the exact launched delivery and independently extract it
        run: |
          $dest=Join-Path $env:RUNNER_TEMP 'acceptance'
          $zip=Join-Path $env:RUNNER_TEMP 'acceptance-host-windows-x64.zip'
          Compress-Archive -Path (Join-Path $dest '*') -DestinationPath $zip -CompressionLevel Optimal
          $readback=Join-Path $env:RUNNER_TEMP 'readback'
          Expand-Archive -Path $zip -DestinationPath $readback
          $actual=Get-ChildItem -File -Recurse $dest
          $restored=Get-ChildItem -File -Recurse $readback
          if ($actual.Count -ne $restored.Count) { throw 'DELIVERY_FILE_COUNT_CHANGED' }
          foreach ($file in $actual) {
            $relative=[IO.Path]::GetRelativePath($dest,$file.FullName)
            if ((Get-FileHash $file.FullName).Hash -ne (Get-FileHash (Join-Path $readback $relative)).Hash) { throw "DELIVERY_READBACK_CHANGED: $relative" }
          }
          $r=Get-Content (Join-Path $dest 'acceptance-receipt.json') -Raw | ConvertFrom-Json
          $r | Add-Member -NotePropertyName deliveryCommit -NotePropertyValue $env:GITHUB_SHA
          $r | Add-Member -NotePropertyName deliveryRun -NotePropertyValue ([long]$env:GITHUB_RUN_ID)
          $r | Add-Member -NotePropertyName deliveryArchiveSha256 -NotePropertyValue (Get-FileHash $zip).Hash.ToLowerInvariant()
          $r | Add-Member -NotePropertyName exampleSha256 -NotePropertyValue (Get-FileHash (Join-Path $dest 'examples\workspace-original.iwxa')).Hash.ToLowerInvariant()
          $r | Add-Member -NotePropertyName fileCount -NotePropertyValue $actual.Count
          $r | Add-Member -NotePropertyName deliveryBrowserSmoke -NotePropertyValue 'PASS'
          $r | Add-Member -NotePropertyName physicalInference -NotePropertyValue 'NOT_RUN'
          $r | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8NoBOM (Join-Path $env:RUNNER_TEMP 'acceptance-host-receipt.json')
          Get-Content (Join-Path $env:RUNNER_TEMP 'acceptance-host-receipt.json')
      - uses: actions/upload-artifact@v4
        with:
          name: t3-rc2-ready-acceptance-windows-x64
          path: |
            ${{ runner.temp }}/acceptance-host-windows-x64.zip
            ${{ runner.temp }}/acceptance-host-receipt.json
          if-no-files-found: error
          retention-days: 90
  retain:
    needs: windows-delivery
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: t3-rc2-ready-acceptance-windows-x64
      - name: Add separately identified acceptance assets without replacing rc2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/tags/t3-platform-v0.3.1-rc.2" --jq .object.sha)" = 4dc21f8439b6988eed043bbe74dc34d8a7e7d875
          expected="$(jq -r .deliveryArchiveSha256 acceptance-host-receipt.json)"
          echo "$expected  acceptance-host-windows-x64.zip" | sha256sum -c -
          gh release upload t3-platform-v0.3.1-rc.2 acceptance-host-windows-x64.zip acceptance-host-receipt.json
