name: D09 HOP original normative T2 product witness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-t2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout only original private HOP source
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop.iwxa.ru
          ref: 7fdb2b21b56ed49b037752ca2938567c591eb990
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: npm ci (no private artifact uploads)
        shell: bash
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-install.log" 2>&1 || {
            echo D09_SITE_NPM=FAIL; exit 1;
          }
          echo "D09_SITE_HEAD=$(git rev-parse HEAD)"
          echo D09_SITE_NPM=PASS
      - name: Source, contract and HOP product checks
        shell: bash
        run: |
          npm run typecheck > "$RUNNER_TEMP/d09-types.log" 2>&1 || {
            echo D09_SITE_TYPES=FAIL
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/d09-types.log" | sed -E 's#/(home|tmp|mnt)/[^ ]+#<private-path>#g' | head -12 || true
            exit 1
          }
          echo D09_SITE_TYPES=PASS
          npm run test:d09 > "$RUNNER_TEMP/d09-tests.log" 2>&1 || {
            echo D09_SITE_CONTRACT_TESTS=FAIL
            for suite in tests/d09-*.test.mjs; do
              if node --experimental-strip-types --test "$suite" > "$RUNNER_TEMP/d09-single.log" 2>&1; then
                echo "D09_SUITE_PASS=$suite"
              else
                echo "D09_SUITE_FAIL=$suite"
                grep -oE 'D09_HOSTING_DIST_[A-Z0-9_]+' "$RUNNER_TEMP/d09-single.log" | sort -u | tail -10 || true
                grep -E 'not ok|# fail|ERR_ASSERTION|SyntaxError|Error \[' "$RUNNER_TEMP/d09-single.log" | tail -8 || true
              fi
            done
            exit 1
          }
          echo D09_SITE_CONTRACT_TESTS=PASS
          node --experimental-strip-types --test tests/d09-json-content-equality.test.mjs > "$RUNNER_TEMP/d09-json-equality.log" 2>&1 || {
            echo D09_HOST_JSON_READBACK_GUARD=FAIL; exit 1;
          }
          echo D09_HOST_JSON_READBACK_GUARD=PASS
          npx vitest run src/templates/__tests__/completion-event-contract.test.ts > "$RUNNER_TEMP/d09-completion.log" 2>&1 || {
            echo D09_COMPLETION_EVENT_CONTRACT=FAIL; exit 1;
          }
          echo D09_COMPLETION_EVENT_CONTRACT=PASS
          npx vitest run src/integrations/t2/result-source-check.test.ts > "$RUNNER_TEMP/d09-result-source.log" 2>&1 || {
            echo D09_RESULT_SOURCE_AUDIT_GUARD=FAIL; exit 1;
          }
          echo D09_RESULT_SOURCE_AUDIT_GUARD=PASS
          node --check tests/d09-strict-csp-host-witness.mjs
          node --check tests/d09-original-t2-production-first-run.browser.mjs
          node --check tests/d09-original-t2-project-save.browser.mjs
          node --check scripts/serve-d09-dist.mjs
          node --check scripts/check-d09-hosting-dist.mjs
          echo D09_BROWSER_WITNESS_SYNTAX=PASS
          npm run check:consumer-ux > "$RUNNER_TEMP/d09-ux.log" 2>&1 || {
            echo D09_CONSUMER_UX=FAIL; exit 1;
          }
          echo D09_CONSUMER_UX=PASS
          npm run check:product-contracts > "$RUNNER_TEMP/d09-product-contracts.log" 2>&1 || {
            echo D09_PRODUCT_CONTRACTS=FAIL; exit 1;
          }
          echo D09_PRODUCT_CONTRACTS=PASS
      - name: Qualify real native IWXA export of all 24 seed remixes
        shell: bash
        run: |
          npx tsx scripts/d09-seed-package-diagnostic.ts > "$RUNNER_TEMP/d09-seeds.log" 2>&1 || {
            grep -E 'D09_SEED_ERROR=|D09_SEEDS_(TOTAL|FAILED)=' "$RUNNER_TEMP/d09-seeds.log" | sort -u | head -28 || true
            echo D09_SEED_IWXA_ROUNDTRIPS=FAIL; exit 1;
          }
          grep -q '^D09_SEEDS_FAILED=0$' "$RUNNER_TEMP/d09-seeds.log" || {
            echo D09_SEED_IWXA_ROUNDTRIPS=FAIL; exit 1;
          }
          echo D09_SEED_IWXA_ROUNDTRIPS=PASS
      - name: Checkout exact normative T2 and accepted historical Kernel
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: 9c64951cd78411283e8a416641c36d71e169fc1d
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          sparse-checkout: |
            t2/current/final-successor/canonical-source
            t2/current/final-successor/kernel-successors/k036-same-store-event-history-20261019
          path: normative-t2
      - name: Verify qualified original runtime by exact hash
        shell: bash
        run: |
          mv normative-t2 "$RUNNER_TEMP/d09-normative-t2"
          archive="$RUNNER_TEMP/d09-normative-t2/t2/current/final-successor/kernel-successors/k036-same-store-event-history-20261019/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip"
          test -f "$archive" || { echo D09_QUALIFIED_ZIP_MISSING; exit 1; }
          echo "7075b8b9590ef1283e34ecb3c21dd9d1b7342697287e1aa150cd4f4a60860b68  $archive" | sha256sum -c - >/dev/null || {
            echo D09_QUALIFIED_ZIP_HASH=FAIL; exit 1;
          }
          mkdir -p "$RUNNER_TEMP/d09-kernel"
          unzip -q "$archive" -d "$RUNNER_TEMP/d09-kernel"
          echo "e1737245aba309e900203b458087ca07cb08d9ccc89901754e1122cbc9a01e78  $RUNNER_TEMP/d09-kernel/_iwxa/runtime/0.3.6/runtime.js" | sha256sum -c - >/dev/null || {
            echo D09_QUALIFIED_KERNEL_HASH=FAIL; exit 1;
          }
          echo D09_NORMATIVE_T2=9c64951cd78411283e8a416641c36d71e169fc1d
          echo D09_ORIGINAL_KERNEL_HASH=PASS
      - name: Build exactly one HOP dist with original T2
        shell: bash
        env:
          D09_ORIGIN: https://localhost:8443
          D09_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/d09-kernel
          D09_ASSEMBLY_ONLY: '1'
          D09_ASSEMBLY_ONLY_CONSENT: NO_NEW_TESTS_EXACT_QUALIFIED_INPUTS
        run: |
          export D09_T2_CANONICAL_SOURCE="$RUNNER_TEMP/d09-normative-t2/t2/current/final-successor/canonical-source"
          npm run build > "$RUNNER_TEMP/d09-build.log" 2>&1 || {
            echo D09_ORIGINAL_T2_BUILD=FAIL
            grep -oE '(D09|T2|IWXA)_[A-Z0-9_:.]+' "$RUNNER_TEMP/d09-build.log" | sort -u | tail -20 || true
            grep -Ei 'error|failed|could not|cannot|unexpected|unresolved|not found|missing|vite|prebuild|build:public-stage|build:host-module' "$RUNNER_TEMP/d09-build.log" | sed -E 's#/(home|tmp|mnt)/[^[:space:]]+#<private-path>#g' | cut -c1-210 | tail -22 || true
            exit 1
          }
          echo D09_ORIGINAL_T2_BUILD=PASS
          test -f dist/workspace/index.html
          test -f dist/workspace/exchange/index.html
          test -f dist/workspace/lifecycle/index.html
          test ! -e dist/workspace/studio/index.html
          npm run check:htaccess > "$RUNNER_TEMP/d09-apache.log" 2>&1 || {
            echo D09_APACHE_CONFIG=FAIL; exit 1;
          }
          echo D09_APACHE_CONFIG=PASS
      - name: Original T2 actual HTTPS browser and first Workspace
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/d09-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=localhost" \
            -keyout "$RUNNER_TEMP/d09-tls/key.pem" \
            -out "$RUNNER_TEMP/d09-tls/cert.pem" >/dev/null 2>&1
          if command -v google-chrome >/dev/null 2>&1; then
            export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome)"
          else
            npx puppeteer browsers install chrome > "$RUNNER_TEMP/d09-chrome.log" 2>&1 || {
              echo D09_BROWSER_INSTALL=FAIL; exit 1;
            }
          fi
          export D09_PREVIEW_CERT_PATH="$RUNNER_TEMP/d09-tls/cert.pem"
          export D09_PREVIEW_KEY_PATH="$RUNNER_TEMP/d09-tls/key.pem"
          node tests/d09-strict-csp-host-witness.mjs > "$RUNNER_TEMP/d09-browser.log" 2>&1 || {
            grep -E 'D09_(WORKSPACE|EXCHANGE|LIFECYCLE|T2_|PUBLIC_|ENGINEERING_|NATIVE_|HOP_)' "$RUNNER_TEMP/d09-browser.log" | tail -25 || true
            echo D09_ORIGINAL_T2_GUI=FAIL; exit 1;
          }
          grep -E 'D09_(WORKSPACE|EXCHANGE|LIFECYCLE|T2_REAL_BROWSER|ENGINEERING_)' "$RUNNER_TEMP/d09-browser.log" | tail -15 || true
          echo D09_ORIGINAL_T2_GUI=PASS
      - name: Build isolated production-identity HOP with original T2
        shell: bash
        env:
          D09_ORIGIN: https://hop.iwxa.ru:9443
          D09_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/d09-kernel
          D09_ASSEMBLY_ONLY: '1'
          D09_ASSEMBLY_ONLY_CONSENT: NO_NEW_TESTS_EXACT_QUALIFIED_INPUTS
        run: |
          export D09_T2_CANONICAL_SOURCE="$RUNNER_TEMP/d09-normative-t2/t2/current/final-successor/canonical-source"
          npm run build > "$RUNNER_TEMP/d09-production-build.log" 2>&1 || {
            echo D09_PRODUCTION_IDENTITY_BUILD=FAIL
            grep -oE '(D09|T2|IWXA)_[A-Z0-9_:.]+' "$RUNNER_TEMP/d09-production-build.log" | sort -u | tail -15 || true
            exit 1
          }
          node --input-type=module -e '
            import {readFileSync,existsSync} from "node:fs";
            import assert from "node:assert/strict";
            const c=JSON.parse(readFileSync("dist/_iwxa/domain.json","utf8"));
            assert.equal(c.origin,"https://hop.iwxa.ru:9443");
            assert.equal(c.status,"production-candidate-not-activated");
            assert.ok(!c.modules.some(m=>m.host_role==="workspace-first-run-provisioner"));
            assert.ok(!existsSync("dist/_iwxa/services/ru.iwxa.hop.first-run-provisioner.json"));
            const host=JSON.parse(readFileSync("dist/_iwxa/services/ru.iwxa.hop.host.json","utf8"));
            const auditor=JSON.parse(readFileSync("dist/_iwxa/services/ru.iwxa.hop.product-auditor.json","utf8"));
            assert.equal(host.permissions.workspace.create,true);
            assert.equal(auditor.permissions.workspace.create,false);
          ' || { echo D09_PRODUCTION_PASSPORT=FAIL; exit 1; }
          echo D09_PRODUCTION_IDENTITY_BUILD=PASS
          echo D09_PRODUCTION_PASSPORT=PASS
      - name: Original T2 production first Workspace and process-cold native readback
        shell: bash
        run: |
          export D09_PREVIEW_PRODUCTION_LOOPBACK=1
          export D09_PREVIEW_CERT_PATH="$RUNNER_TEMP/d09-tls/cert.pem"
          export D09_PREVIEW_KEY_PATH="$RUNNER_TEMP/d09-tls/key.pem"
          if command -v google-chrome >/dev/null 2>&1; then
            export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome)"
          fi
          node tests/d09-original-t2-production-first-run.browser.mjs > "$RUNNER_TEMP/d09-production-first-run.log" 2>&1 || {
            grep -E 'D09_PRODUCTION_[A-Z0-9_]+=(PASS|FAIL)' "$RUNNER_TEMP/d09-production-first-run.log" | tail -12 || true
            echo D09_ORIGINAL_PRODUCTION_FIRST_WORKSPACE=FAIL
            exit 1
          }
          grep -E 'D09_PRODUCTION_[A-Z0-9_]+=PASS' "$RUNNER_TEMP/d09-production-first-run.log" | tail -12 || true
          echo D09_ORIGINAL_PRODUCTION_FIRST_WORKSPACE=PASS
      - name: Real HOP authoring to original T2 Project and process-cold readback
        shell: bash
        run: |
          export D09_PREVIEW_PRODUCTION_LOOPBACK=1
          export D09_PREVIEW_CERT_PATH="$RUNNER_TEMP/d09-tls/cert.pem"
          export D09_PREVIEW_KEY_PATH="$RUNNER_TEMP/d09-tls/key.pem"
          if command -v google-chrome >/dev/null 2>&1; then
            export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome)"
          fi
          node tests/d09-original-t2-project-save.browser.mjs > "$RUNNER_TEMP/d09-product-flow.log" 2>&1 || {
            grep -E 'D09_(PRODUCT|PROJECT|ORIGINAL_T2_PROJECT_FLOW)_[A-Z0-9_]+=(PASS|FAIL)|D09_PROJECT_(UI|SAVE_CLICK)_DIAGNOSTICS=' "$RUNNER_TEMP/d09-product-flow.log" | tail -15 || true
            echo D09_NATIVE_HOP_PRODUCT_FLOW=FAIL
            exit 1
          }
          grep -E 'D09_(PRODUCT|PROJECT|ORIGINAL_T2_PROJECT_FLOW)_[A-Z0-9_]+=PASS' "$RUNNER_TEMP/d09-product-flow.log" | tail -15 || true
          echo D09_NATIVE_HOP_PRODUCT_FLOW=PASS
      # Never publish private source, runtime, ZIP, screenshots or browser profiles.
