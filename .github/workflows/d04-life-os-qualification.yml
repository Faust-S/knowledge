name: D04 full release qualification (private source, no artifacts)
on:
  push:
    branches:
      - work/2026-11-25-d04-local-time-qualification
    paths:
      - .github/workflows/d04-life-os-qualification.yml
      - scripts/d04-private-source-preflight.sh
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d04-life-os-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout public test harness only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify DOMEN access to the three requested private sources
        id: access
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          bash scripts/d04-private-source-preflight.sh D04_DOMEN_ACCESS Faust-S/bazmed.ru Faust-S/bazmed Faust-S/T2
          echo "D04_AUTHORIZED_PRIVATE_SOURCES=3/3"
      - name: Checkout exact private BazMed site revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/bazmed.ru
          ref: 612ca1c869de1cd8d686f96fb74030e7581bea79
          token: ${{ secrets.DOMEN }}
          path: d04-private/site
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact private BazMed subject revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/bazmed
          ref: b277a721135381813dfdc7333c7b8e8645610722
          token: ${{ secrets.DOMEN }}
          path: d04-private/model
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact normative private T2 revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: 9c64951cd78411283e8a416641c36d71e169fc1d
          token: ${{ secrets.DOMEN }}
          path: d04-private/t2
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable site / subject / T2 revisions
        run: |
          set -euo pipefail
          test "$(git -C d04-private/site rev-parse HEAD)" = "612ca1c869de1cd8d686f96fb74030e7581bea79"
          test "$(git -C d04-private/site rev-parse HEAD^{tree})" = "72b0684d3fad91bed00f12e53dc7fe9c269acbb7"
          test "$(git -C d04-private/model rev-parse HEAD)" = "b277a721135381813dfdc7333c7b8e8645610722"
          test "$(git -C d04-private/model rev-parse HEAD^{tree})" = "d4f8c393a11d199f9266766af7c4569401fbeaa6"
          test "$(git -C d04-private/t2 rev-parse HEAD)" = "9c64951cd78411283e8a416641c36d71e169fc1d"
          for path in d04-private/site d04-private/model d04-private/t2; do
            test -z "$(git -C "$path" status --porcelain --untracked-files=no)"
          done
          cmp d04-private/model/docs/life-os/PERSONAL_OBSERVATION_PROFILE_V0_1.mjs d04-private/site/t2-site-module/bazmed/PERSONAL_OBSERVATION_PROFILE_V0_1.mjs
          cmp d04-private/model/docs/life-os/PERSONAL_OBSERVATION_PROFILE_V0_1.d.mts d04-private/site/t2-site-module/bazmed/PERSONAL_OBSERVATION_PROFILE_V0_1.d.mts
          cmp d04-private/model/docs/life-os/PERSONAL_OBSERVATION_DYNAMICS_V0_1.mjs d04-private/site/t2-site-module/bazmed/PERSONAL_OBSERVATION_DYNAMICS_V0_1.mjs
          cmp d04-private/model/docs/life-os/PERSONAL_OBSERVATION_DYNAMICS_V0_1.d.mts d04-private/site/t2-site-module/bazmed/PERSONAL_OBSERVATION_DYNAMICS_V0_1.d.mts
          for name in LIFE_RETROSPECTIVE_V0_1.mjs LIFE_RETROSPECTIVE_V0_1.d.mts PERSONAL_STUDY_RESULT_V0_1.mjs PERSONAL_STUDY_RESULT_V0_1.d.mts LIFE_GOAL_RESULT_REFS_V0_1.mjs LIFE_GOAL_RESULT_REFS_V0_1.d.mts PERSONAL_MEDICAL_EVIDENCE_V0_1.mjs PERSONAL_MEDICAL_EVIDENCE_V0_1.d.mts PERSONAL_GOAL_PROFILE_V0_1.mjs PERSONAL_GOAL_PROFILE_V0_1.d.mts LIFE_DASHBOARD_SLEEP_SCHEDULE_V0_1.mjs LIFE_DASHBOARD_SLEEP_SCHEDULE_V0_1.d.mts LIFE_DASHBOARD_MODEL_V0_1.mjs LIFE_DASHBOARD_MODEL_V0_1.d.mts LIFE_DASHBOARD_PROJECTION_V0_1.mjs LIFE_DASHBOARD_PROJECTION_V0_1.d.mts PERSONAL_CUSTOM_MEASURE_V0_1.mjs PERSONAL_CUSTOM_MEASURE_V0_1.d.mts LIFE_PERIOD_COMPARISON_V0_1.mjs LIFE_PERIOD_COMPARISON_V0_1.d.mts LIFE_DIARY_BATCH_V0_1.mjs LIFE_DIARY_BATCH_V0_1.d.mts; do
            cmp "d04-private/model/docs/life-os/$name" "d04-private/site/t2-site-module/bazmed/$name"
          done
          echo "D04_UNIFIED_DASHBOARD_CANONICAL_PARITY=PASS"
          echo "D04_OBSERVATION_DYNAMICS_CANONICAL_PARITY=PASS"
          echo "D04_OBSERVATION_CANONICAL_PARITY=PASS"
          echo "D04_REVISIONS_AND_TREES=PASS"
      - name: Set up Node.js 22 (no dependency cache)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install site dependencies without emitting private logs
        id: install
        working-directory: d04-private/site
        run: |
          set -euo pipefail
          if npm ci --no-audit --no-fund --include=dev >"$RUNNER_TEMP/d04-install.log" 2>&1; then
            echo "D04_NPM_CI=PASS"
          else
            echo "D04_NPM_CI=FAIL"
            grep -Eo 'E[A-Z0-9_]{3,32}|ERR_[A-Z0-9_]+' "$RUNNER_TEMP/d04-install.log" | sort -u | head -12 || true
            exit 1
          fi
      - name: Verify pinned static-hosting release sources before qualification
        id: release-source
        working-directory: d04-private/site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/d04-private/t2
          BAZMED_SUBJECT_SOURCE_DIR: ${{ github.workspace }}/d04-private/model
          D04_RELEASE_SITE_SHA: 612ca1c869de1cd8d686f96fb74030e7581bea79
        run: |
          set -euo pipefail
          if npm run release:check-source >"$RUNNER_TEMP/d04-release-source.log" 2>&1; then
            echo "D04_HOSTING_SOURCE=PASS"
          else
            echo "D04_HOSTING_SOURCE=FAIL"
            grep -Eo 'D04_HOSTING_SOURCE_ERROR:[A-Z_]+' "$RUNNER_TEMP/d04-release-source.log" | sort -u | head -16 || true
            exit 1
          fi
      - name: Full canonical domain suite (all existing test files)
        id: domain
        continue-on-error: true
        working-directory: d04-private/model
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/d04-domain-full.log"
          if node --experimental-strip-types --test docs/life-os/tests/*.test.mjs >"$log" 2>&1; then
            echo "D04_FULL_DOMAIN_TESTS=PASS"
          else
            echo "D04_FULL_DOMAIN_TESTS=FAIL"
            grep -E '^not ok [0-9]+ - ' "$log" | head -20 || true
            grep -E '^# (tests|pass|fail|skipped|cancelled) [0-9]+$' "$log" | tail -7 || true
            exit 1
          fi
          grep -E '^# (tests|pass|fail|skipped|cancelled) [0-9]+$' "$log" | tail -7
      - name: Full site source and behavior suite (all existing test files)
        id: research
        continue-on-error: true
        working-directory: d04-private/site
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/d04-site-full.log"
          if node --import tsx --test tests/*.test.mjs >"$log" 2>&1; then
            echo "D04_FULL_SITE_TESTS=PASS"
          else
            echo "D04_FULL_SITE_TESTS=FAIL"
            grep -E '^not ok [0-9]+ - ' "$log" | head -25 || true
            grep -E '^# (tests|pass|fail|skipped|cancelled) [0-9]+$' "$log" | tail -7 || true
            python3 "$GITHUB_WORKSPACE/tools/ci/d04_safe_diagnostics.py" research "$log" || true
            exit 1
          fi
          grep -E '^# (tests|pass|fail|skipped|cancelled) [0-9]+$' "$log" | tail -7
      - name: Check all existing tool links
        id: links
        continue-on-error: true
        working-directory: d04-private/site
        run: |
          if npm run check:tool-links >"$RUNNER_TEMP/d04-links.log" 2>&1; then
            echo "D04_TOOL_LINKS=PASS"
          else
            echo "D04_TOOL_LINKS=FAIL"
            exit 1
          fi
      - name: Full TypeScript check
        id: types
        continue-on-error: true
        working-directory: d04-private/site
        run: |
          if npx tsc --noEmit --pretty false >"$RUNNER_TEMP/d04-types.log" 2>&1; then
            echo "D04_TYPESCRIPT=PASS"
          else
            echo "D04_TYPESCRIPT=FAIL"
            python3 "$GITHUB_WORKSPACE/tools/ci/d04_safe_diagnostics.py" types "$RUNNER_TEMP/d04-types.log" || true
            exit 1
          fi
      - name: Full lint with explicit classification of formatting-only debt
        id: lint
        continue-on-error: true
        working-directory: d04-private/site
        run: |
          set -uo pipefail
          set +e
          npm run lint --silent -- --format json >"$RUNNER_TEMP/d04-lint.json" 2>"$RUNNER_TEMP/d04-lint-stderr.log"
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            echo "D04_LINT_EXECUTION=FAIL"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/d04-lint.json" "$code" <<'PY'
          import json
          import sys
          from pathlib import Path
          try:
              reports = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              assert isinstance(reports, list) and reports
              errors = warnings = formatting = fatal = 0
              for report in reports:
                  messages = report["messages"]
                  actual = [message for message in messages if message.get("severity") == 2]
                  assert report["errorCount"] == len(actual)
                  errors += len(actual)
                  warnings += report["warningCount"]
                  fatal += report.get("fatalErrorCount", 0)
                  formatting += sum(message.get("ruleId") == "prettier/prettier" and not message.get("fatal", False) for message in actual)
              assert (int(sys.argv[2]) == 0) == (errors == 0)
          except (OSError, ValueError, TypeError, KeyError, AssertionError):
              print("D04_LINT_REPORT_INVALID")
              sys.exit(1)
          print(f"D04_LINT_ERRORS={errors}")
          print(f"D04_LINT_FORMAT_ERRORS={formatting}")
          print(f"D04_LINT_WARNINGS={warnings}")
          print(f"D04_LINT_FATAL_ERRORS={fatal}")
          if fatal or errors != formatting:
              print("D04_FULL_FORMAT_LINT=FAIL_NON_FORMAT")
              sys.exit(1)
          print("D04_FULL_FORMAT_LINT=" + ("DEBT_ONLY" if formatting else "PASS"))
          PY
      - name: Check semantic ESLint rules separately from existing Prettier debt
        id: semantic
        continue-on-error: true
        working-directory: d04-private/site
        run: |
          set +e
          npm run lint -- --rule 'prettier/prettier: off' >"$RUNNER_TEMP/d04-semantic-lint.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "D04_SEMANTIC_LINT=FAIL"
            python3 "$GITHUB_WORKSPACE/tools/ci/d04_safe_diagnostics.py" lint-semantic "$RUNNER_TEMP/d04-semantic-lint.log" || true
            exit "$code"
          fi
          echo "D04_SEMANTIC_LINT=PASS"
      - name: Assemble exact production dist with original T2 Host and qualified Kernel
        id: integrated
        if: steps.domain.outcome == 'success' && steps.research.outcome == 'success' && steps.links.outcome == 'success' && steps.types.outcome == 'success' && steps.semantic.outcome == 'success' && steps.lint.outcome == 'success'
        continue-on-error: true
        working-directory: d04-private/site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/d04-private/t2
          BAZMED_SUBJECT_SOURCE_DIR: ${{ github.workspace }}/d04-private/model
          D04_RELEASE_SITE_SHA: 612ca1c869de1cd8d686f96fb74030e7581bea79
        run: |
          set -uo pipefail
          set +e
          npm run release:build >"$RUNNER_TEMP/d04-integrated.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "D04_INTEGRATED_T2_BUILD=FAIL"
            grep -Eo 'BAZMED_[A-Z0-9_]+|D04_[A-Z0-9_]+|ERR_[A-Z0-9_]+' "$RUNNER_TEMP/d04-integrated.log" | sort -u | tail -25 || true
            grep -E '^D04_BROWSER_PROBLEM_[A-Z_]+=[0-9]+$' "$RUNNER_TEMP/d04-integrated.log" | head -10 || true
            grep -Eo 'error TS[0-9]+' "$RUNNER_TEMP/d04-integrated.log" | sort -u | head -15 || true
            exit "$code"
          fi
          for file in dist/index.html dist/workspace/index.html \
            dist/workspace/exchange/index.html dist/workspace/lifecycle/index.html \
            dist/_iwxa/current.json dist/_iwxa/runtime/0.3.6/runtime.js; do
            if [ ! -s "$file" ]; then
              echo "D04_REQUIRED_DIST_FILE_MISSING"
              exit 1
            fi
          done
          grep -qx 'D04_HOSTING_ASSEMBLY_ONLY=PASS' "$RUNNER_TEMP/d04-integrated.log" || exit 1
          echo "D04_INTEGRATED_T2_BUILD=PASS"
          echo "D04_HOSTING_ASSEMBLY_ONLY=PASS"
      - name: Production static interactivity, links and Chromium Workspace smoke
        id: production_smoke
        if: steps.integrated.outcome == 'success'
        continue-on-error: true
        working-directory: d04-private/site
        env:
          NODE_ENV: production
        run: |
          set -uo pipefail
          failed=0
          log="$RUNNER_TEMP/d04-integrated.log"
          for stage in check:static-interactions check:links check:t2:workspace-browser; do
            name="$(printf '%s' "$stage" | tr '[:lower:]' '[:upper:]' | sed 's/[^A-Z0-9]/_/g')"
            if npm run "$stage" >>"$log" 2>&1; then
              echo "D04_PRODUCTION_SMOKE_${name}=PASS"
            else
              echo "D04_PRODUCTION_SMOKE_${name}=FAIL"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            grep -Eo 'BAZMED_[A-Z0-9_]+|D04_[A-Z0-9_]+|ERR_[A-Z0-9_]+' "$log" | sort -u | tail -35 || true
            grep -E '^D04_BROWSER_PROBLEM_[A-Z_]+=[0-9]+$' "$log" | head -10 || true
            exit 1
          fi
          # Safe numeric diagnostics only, without private assets or personal data.
          grep -E '^D04_EMPTY_WORKSPACE_(HOST_FIRST_USABLE_MS|DOM_READY_MS|HOST_ASSET_REQUESTS|HOST_ASSET_DECODED_KIB)=[0-9]+$' "$RUNNER_TEMP/d04-integrated.log" | tail -4 || true
          responsive_count="$(grep -c '^BAZMED_NAVIGATION_PASS ' "$RUNNER_TEMP/d04-integrated.log" || true)"
          echo "D04_WORKSPACE_RESPONSIVE_VIEWPORTS=$responsive_count"
          if [ "$responsive_count" -ne 5 ]; then
            echo "D04_WORKSPACE_RESPONSIVE_VIEWPORTS_INCOMPLETE"
            exit 1
          fi
          for marker in D04_WORKSPACE_TOOL_RETURN_PATH D04_WORKSPACE_OVERVIEW_ENTRY; do
            if ! grep -qx "$marker=PASS" "$RUNNER_TEMP/d04-integrated.log"; then
              echo "$marker=FAIL"
              exit 1
            fi
            echo "$marker=PASS"
          done
          grep -E '^D04_WORKSPACE_(PUBLIC_RETURN_MS|OVERVIEW_COLD_MS)=[0-9]+$' "$RUNNER_TEMP/d04-integrated.log" | tail -2 || true
          home_count="$(grep -c '^D04_PUBLIC_HOME_ENTRY_PASS ' "$RUNNER_TEMP/d04-integrated.log" || true)"
          echo "D04_PUBLIC_HOME_VIEWPORTS=$home_count"
          if [ "$home_count" -ne 2 ]; then
            echo "D04_PUBLIC_HOME_VIEWPORTS_INCOMPLETE"
            exit 1
          fi
          echo "D04_NATIVE_KERNEL_AND_HOST_FILES=PASS"
          echo "D04_CHROMIUM_SMOKE=PASS_ON_HOSTING_DIST"
          # Do not upload private dist, private logs, browser profiles or files.
      - name: Public readability, hydration and all deployed routes at desktop and mobile widths
        id: public_runtime
        if: steps.integrated.outcome == 'success'
        continue-on-error: true
        working-directory: d04-private/site
        run: |
          set -uo pipefail
          failed=0
          for stage in check:readability check:hydration check:runtime; do
            name="$(printf '%s' "$stage" | tr '[:lower:]' '[:upper:]' | sed 's/[^A-Z0-9]/_/g')"
            log="$RUNNER_TEMP/d04-public-$name.log"
            if BAZMED_RUNTIME_STATIC=1 npm run "$stage" >"$log" 2>&1; then
              echo "D04_PUBLIC_${name}=PASS"
            else
              echo "D04_PUBLIC_${name}=FAIL"
              failed=1
              grep -Eo 'HORIZONTAL_OVERFLOW [0-9]+|D04_[A-Z0-9_]+|BAZMED_[A-Z0-9_]+|ERR_[A-Z0-9_]+' "$log" | sort -u | head -20 || true
              grep -E '^  - W(375|1440) /[a-zA-Z0-9/_-]*: ' "$log" | sed -E 's/^(  - W(375|1440) \/[a-zA-Z0-9/_-]*): .*/D04_RUNTIME_FAIL \1/' | head -20 || true
            fi
            grep -E '^D04_STATIC_(RUNTIME_W(375|1440)|HYDRATION)_(CHECKED|PASS)=[0-9]+$' "$log" || true
          done
          rm -f dist/readability-report.json dist/readability-check.txt
          exit "$failed"
      - name: Audit host-uploadable dist without publishing it
        id: hosting
        if: steps.integrated.outcome == 'success'
        continue-on-error: true
        working-directory: d04-private/site
        run: |
          set -uo pipefail
          failed=0
          for stage in release:check-dist check:production-urls check:no-localhost check:assets check:external-assets check:links check:seo check:htaccess; do
            name="$(printf '%s' "$stage" | tr '[:lower:]' '[:upper:]' | sed 's/[^A-Z0-9]/_/g')"
            log="$RUNNER_TEMP/d04-hosting-$name.log"
            if npm run "$stage" >"$log" 2>&1; then
              echo "D04_HOSTING_STAGE_${name}=PASS"
              if [ "$stage" = release:check-dist ]; then
                grep -E '^D04_(STATIC_ROUTES|STATIC_FILES|STATIC_BYTES|HOSTING_DIST_GATE)=' "$log" | tail -5 || true
              fi
            else
              echo "D04_HOSTING_STAGE_${name}=FAIL"
              grep -Eo 'D04_HOSTING_DIST_ERROR:[A-Z_]+' "$log" | sort -u | head -10 || true
              if [ "$stage" = check:seo ]; then
                # Publish bounded structural issue categories only. Never emit
                # private HTML, source excerpts, meta values, profiles, or logs.
                python3 - "$log" <<'PY'
          from collections import Counter
          from pathlib import Path
          import sys
          import re
          data=Path(sys.argv[1]).read_text(encoding="utf-8",errors="replace")
          counts=Counter()
          paths=set()
          for line in data.splitlines():
              if not line.startswith("  - "):
                  continue
              issue=line[4:]
              scope="HOST" if issue.startswith("workspace/") else ("SITEMAP" if issue.startswith("sitemap") else "PUBLIC")
              if "нет canonical" in issue: kind="MISSING_CANONICAL"
              elif "дублирующиеся canonical" in issue: kind="DUPLICATE_CANONICAL"
              elif "canonical=" in issue: kind="CANONICAL_MISMATCH"
              elif "без trailing slash" in issue: kind="TRAILING_SLASH"
              elif "нет og:url" in issue: kind="MISSING_OG_URL"
              elif "og:url=" in issue: kind="OG_URL_MISMATCH"
              elif "нет meta description" in issue: kind="MISSING_DESCRIPTION"
              elif "дублирующиеся <title>" in issue: kind="DUPLICATE_TITLE"
              elif "нет <title>" in issue or "пустой <title>" in issue: kind="TITLE"
              elif "noindex" in issue: kind="SITEMAP_NOINDEX"
              elif "lastmod" in issue: kind="LASTMOD"
              elif "sitemap" in issue: kind="SITEMAP"
              elif "robots" in issue: kind="ROBOTS"
              else: kind="OTHER"
              counts[(scope,kind)]+=1
              if scope=="PUBLIC" and kind in ("MISSING_CANONICAL","MISSING_OG_URL"):
                  name=issue.split(":",1)[0].strip()
                  if re.fullmatch(r"[A-Za-z0-9_./-]{1,100}",name):
                      paths.add(name)
          for name in sorted(paths)[:8]:
              print("D04_SEO_PUBLIC_STATIC_PATH="+name)
          for (scope,kind),count in sorted(counts.items()):
              print(f"D04_SEO_ISSUE_{scope}_{kind}={count}")
          print("D04_SEO_ISSUE_TOTAL="+str(sum(counts.values())))
          for code in ("SyntaxError","ReferenceError","TypeError","RangeError","ENOENT","EACCES","ERR_MODULE_NOT_FOUND","ERR_PACKAGE_PATH_NOT_EXPORTED","npm error","SIGKILL","Killed","Error:"):
              if code in data:
                  print("D04_SEO_RUNTIME_SIGNAL_"+re.sub(r"[^A-Z0-9]","_",code.upper())+"=YES")
          print("D04_SEO_HAS_VALIDATION_BANNER="+("YES" if "SEO check:" in data else "NO"))
          PY
              fi
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "D04_HOSTING_DIST_CHECKS=FAIL"
            exit 1
          fi
          echo "D04_HOSTING_DIST_CHECKS=PASS"
      - name: Separate native witness build, never deployable
        id: challenge
        if: steps.integrated.outcome == 'success'
        continue-on-error: true
        working-directory: d04-private/site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/d04-private/t2
        run: |
          set -euo pipefail
          umask 077
          openssl rand -hex 32 > "$RUNNER_TEMP/d04-release-challenge"
          export IWXA_T2_PRODUCT_CHALLENGE="$(cat "$RUNNER_TEMP/d04-release-challenge")"
          echo "::add-mask::$IWXA_T2_PRODUCT_CHALLENGE"
          mv dist "$RUNNER_TEMP/d04-production-dist"
          if npm run build:t2:site >"$RUNNER_TEMP/d04-witness-build.log" 2>&1; then
            echo "D04_WITNESS_DIST=PASS"
          else
            echo "D04_WITNESS_DIST=FAIL"
            grep -Eo 'BAZMED_[A-Z0-9_]+|D04_[A-Z0-9_]+|ERR_[A-Z0-9_]+' "$RUNNER_TEMP/d04-witness-build.log" | sort -u | tail -25 || true
            exit 1
          fi
      - name: Install the existing normative T2 browser witness dependencies once
        id: browser_deps
        if: steps.challenge.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          canonical="d04-private/t2/t2/current/final-successor/canonical-source"
          if (cd "$canonical" && npm ci --no-audit --no-fund --include=dev && npx playwright install chromium) >"$RUNNER_TEMP/d04-browser-install.log" 2>&1; then
            echo "D04_WITNESS_BROWSER_DEPS=PASS"
          else
            echo "D04_WITNESS_BROWSER_DEPS=FAIL"
            exit 1
          fi
      - name: All existing native product witnesses, original Kernel and physical IWXA
        id: native
        if: steps.browser_deps.outcome == 'success'
        continue-on-error: true
        working-directory: d04-private/site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/d04-private/t2
        run: |
          set -uo pipefail
          export IWXA_T2_PRODUCT_CHALLENGE="$(cat "$RUNNER_TEMP/d04-release-challenge")"
          echo "::add-mask::$IWXA_T2_PRODUCT_CHALLENGE"
          log="$RUNNER_TEMP/d04-release-native.log"
          node qualification/run-d04-consolidated-browser.mjs >"$log" 2>&1
          code=$?
          grep -E '^D04_[A-Z0-9_]{1,180}=(PASS|FAIL|[0-9]+|[A-Z0-9_]+(,[A-Z0-9_]+)+)$' "$log" | tail -180 || true
          grep -E '^D04_[A-Z0-9_]{1,220}$' "$log" | sort -u | head -45 || true
          if [ "$code" -ne 0 ]; then
            echo "D04_FULL_NATIVE_PRODUCT=FAIL"
            exit "$code"
          fi
          grep -qx 'D04_CONSOLIDATED_NATIVE_WITNESSES=PASS' "$log" || exit 1
          echo "D04_FULL_NATIVE_PRODUCT=PASS"
      - name: Enforce release qualification status without publishing private artifacts
        if: always()
        env:
          DOMAIN: ${{ steps.domain.outcome }}
          SITE: ${{ steps.research.outcome }}
          LINKS: ${{ steps.links.outcome }}
          TYPES: ${{ steps.types.outcome }}
          LINT: ${{ steps.lint.outcome }}
          SEMANTIC: ${{ steps.semantic.outcome }}
          INTEGRATED: ${{ steps.integrated.outcome }}
          PRODUCTION_SMOKE: ${{ steps.production_smoke.outcome }}
          PUBLIC_RUNTIME: ${{ steps.public_runtime.outcome }}
          HOSTING: ${{ steps.hosting.outcome }}
          CHALLENGE: ${{ steps.challenge.outcome }}
          BROWSER_DEPS: ${{ steps.browser_deps.outcome }}
          NATIVE: ${{ steps.native.outcome }}
        run: |
          echo "D04_STAGE_OUTCOMES=domain:$DOMAIN,site:$SITE,links:$LINKS,types:$TYPES,lint:$LINT,semantic:$SEMANTIC,integrated:$INTEGRATED,smoke:$PRODUCTION_SMOKE,public:$PUBLIC_RUNTIME,hosting:$HOSTING,challenge:$CHALLENGE,browser:$BROWSER_DEPS,native:$NATIVE"
          for outcome in "$DOMAIN" "$SITE" "$LINKS" "$TYPES" "$LINT" "$SEMANTIC" "$INTEGRATED" "$PRODUCTION_SMOKE" "$PUBLIC_RUNTIME" "$HOSTING" "$CHALLENGE" "$BROWSER_DEPS" "$NATIVE"; do
            if [ "$outcome" != "success" ]; then
              echo "D04_AUTOMATED_FULL_DOMAIN=FAIL"
              echo "D04_RELEASE_READINESS=HOLD"
              exit 1
            fi
          done
          echo "D04_AUTOMATED_FULL_DOMAIN=PASS"
          echo "D04_INDEPENDENT_VISUAL_ACCEPTANCE=NOT_RUN"
          echo "D04_RELEASE_READINESS=HOLD_VISUAL_ACCEPTANCE"
          # No private source, logs, test or production dist are uploaded.
