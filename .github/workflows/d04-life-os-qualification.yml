name: D04 BazMed Life OS qualification (private-source, no artifacts)
on:
  push:
    branches:
      - work/2026-11-24-d04-decision-cycle-qualification
    paths:
      - .github/workflows/d04-life-os-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d04-life-os-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout public test harness only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify DOMEN access to the three requested private sources
        id: access
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "D04_DOMEN_SECRET_UNAVAILABLE"
            exit 1
          fi
          for repo in Faust-S/bazmed.ru Faust-S/bazmed Faust-S/T2; do
            if ! gh api "repos/$repo" --jq '.id' >/dev/null 2>&1; then
              echo "D04_PRIVATE_REPOSITORY_ACCESS_DENIED:$repo"
              exit 1
            fi
          done
          echo "D04_AUTHORIZED_PRIVATE_SOURCES=3/3"
      - name: Checkout exact private BazMed site revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/bazmed.ru
          ref: 2a3512166c01139d723ca140e8cded2ad38e1d20
          token: ${{ secrets.DOMEN }}
          path: d04-private/site
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact private BazMed subject revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/bazmed
          ref: 33961074d298a125b6541dc2ddbe60217b9c3396
          token: ${{ secrets.DOMEN }}
          path: d04-private/model
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact normative private T2 revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: 9c64951cd78411283e8a416641c36d71e169fc1d
          token: ${{ secrets.DOMEN }}
          path: d04-private/t2
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable site / subject / T2 revisions
        run: |
          set -euo pipefail
          test "$(git -C d04-private/site rev-parse HEAD)" = "2a3512166c01139d723ca140e8cded2ad38e1d20"
          test "$(git -C d04-private/site rev-parse HEAD^{tree})" = "8114c53da0f0880af4b6aa230ff67d24e0854eeb"
          test "$(git -C d04-private/model rev-parse HEAD)" = "33961074d298a125b6541dc2ddbe60217b9c3396"
          test "$(git -C d04-private/model rev-parse HEAD^{tree})" = "60d80a7f463caf8b744583bd792d3c94525c7e8e"
          test "$(git -C d04-private/t2 rev-parse HEAD)" = "9c64951cd78411283e8a416641c36d71e169fc1d"
          for path in d04-private/site d04-private/model d04-private/t2; do
            test -z "$(git -C "$path" status --porcelain --untracked-files=no)"
          done
          cmp d04-private/model/docs/life-os/PERSONAL_OBSERVATION_PROFILE_V0_1.mjs d04-private/site/t2-site-module/bazmed/PERSONAL_OBSERVATION_PROFILE_V0_1.mjs
          cmp d04-private/model/docs/life-os/PERSONAL_OBSERVATION_PROFILE_V0_1.d.mts d04-private/site/t2-site-module/bazmed/PERSONAL_OBSERVATION_PROFILE_V0_1.d.mts
          cmp d04-private/model/docs/life-os/PERSONAL_OBSERVATION_DYNAMICS_V0_1.mjs d04-private/site/t2-site-module/bazmed/PERSONAL_OBSERVATION_DYNAMICS_V0_1.mjs
          cmp d04-private/model/docs/life-os/PERSONAL_OBSERVATION_DYNAMICS_V0_1.d.mts d04-private/site/t2-site-module/bazmed/PERSONAL_OBSERVATION_DYNAMICS_V0_1.d.mts
          for name in LIFE_RETROSPECTIVE_V0_1.mjs LIFE_RETROSPECTIVE_V0_1.d.mts PERSONAL_STUDY_RESULT_V0_1.mjs PERSONAL_STUDY_RESULT_V0_1.d.mts LIFE_GOAL_RESULT_REFS_V0_1.mjs LIFE_GOAL_RESULT_REFS_V0_1.d.mts PERSONAL_MEDICAL_EVIDENCE_V0_1.mjs PERSONAL_MEDICAL_EVIDENCE_V0_1.d.mts PERSONAL_GOAL_PROFILE_V0_1.mjs PERSONAL_GOAL_PROFILE_V0_1.d.mts LIFE_DASHBOARD_SLEEP_SCHEDULE_V0_1.mjs LIFE_DASHBOARD_SLEEP_SCHEDULE_V0_1.d.mts LIFE_DASHBOARD_MODEL_V0_1.mjs LIFE_DASHBOARD_MODEL_V0_1.d.mts LIFE_DASHBOARD_PROJECTION_V0_1.mjs LIFE_DASHBOARD_PROJECTION_V0_1.d.mts PERSONAL_CUSTOM_MEASURE_V0_1.mjs PERSONAL_CUSTOM_MEASURE_V0_1.d.mts LIFE_PERIOD_COMPARISON_V0_1.mjs LIFE_PERIOD_COMPARISON_V0_1.d.mts LIFE_DIARY_BATCH_V0_1.mjs LIFE_DIARY_BATCH_V0_1.d.mts; do
            cmp "d04-private/model/docs/life-os/$name" "d04-private/site/t2-site-module/bazmed/$name"
          done
          echo "D04_UNIFIED_DASHBOARD_CANONICAL_PARITY=PASS"
          echo "D04_OBSERVATION_DYNAMICS_CANONICAL_PARITY=PASS"
          echo "D04_OBSERVATION_CANONICAL_PARITY=PASS"
          echo "D04_REVISIONS_AND_TREES=PASS"
      - name: Set up Node.js 22 (no dependency cache)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install site dependencies without emitting private logs
        id: install
        working-directory: d04-private/site
        run: |
          set -euo pipefail
          if npm ci --no-audit --no-fund --include=dev >"$RUNNER_TEMP/d04-install.log" 2>&1; then
            echo "D04_NPM_CI=PASS"
          else
            echo "D04_NPM_CI=FAIL"
            grep -Eo 'E[A-Z0-9_]{3,32}|ERR_[A-Z0-9_]+' "$RUNNER_TEMP/d04-install.log" | sort -u | head -12 || true
            exit 1
          fi
      - name: Verify pinned static-hosting release sources before qualification
        id: release-source
        working-directory: d04-private/site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/d04-private/t2
          BAZMED_SUBJECT_SOURCE_DIR: ${{ github.workspace }}/d04-private/model
          D04_RELEASE_SITE_SHA: 2a3512166c01139d723ca140e8cded2ad38e1d20
        run: |
          set -euo pipefail
          if npm run release:check-source >"$RUNNER_TEMP/d04-release-source.log" 2>&1; then
            echo "D04_HOSTING_SOURCE=PASS"
          else
            echo "D04_HOSTING_SOURCE=FAIL"
            grep -Eo 'D04_HOSTING_SOURCE_ERROR:[A-Z_]+' "$RUNNER_TEMP/d04-release-source.log" | sort -u | head -16 || true
            exit 1
          fi
      - name: Test subject-owned independent observation dynamics without exposing source data
        working-directory: d04-private/model
        run: |
          if node --test docs/life-os/tests/personal-observation-dynamics.test.mjs docs/life-os/tests/life-dashboard-model.test.mjs docs/life-os/tests/life-dashboard-projection.test.mjs docs/life-os/tests/personal-medical-evidence.test.mjs >"$RUNNER_TEMP/d04-observation-domain.log" 2>&1; then
            echo "D04_OBSERVATION_DYNAMICS_DOMAIN_MODEL=PASS"
          else
            echo "D04_OBSERVATION_DYNAMICS_DOMAIN_MODEL=FAIL"
            grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/d04-observation-domain.log" | tail -3 || true
            exit 1
          fi
      - name: Run original Life OS source and behavioral test suite
        id: research
        continue-on-error: true
        working-directory: d04-private/site
        run: |
          set -uo pipefail
          set +e
          npm run check:life-os:research >"$RUNNER_TEMP/d04-research.log" 2>&1
          code=$?
          set -e
          grep -E '^# (tests|pass|fail|skipped|cancelled) ' "$RUNNER_TEMP/d04-research.log" | tail -7 || true
          if [ "$code" -ne 0 ]; then
            echo "D04_RESEARCH_TESTS=FAIL"
            python3 "$GITHUB_WORKSPACE/tools/ci/d04_safe_diagnostics.py" research "$RUNNER_TEMP/d04-research.log" || true
            exit "$code"
          fi
          echo "D04_RESEARCH_TESTS=PASS"
      - name: Verify original and full Waterlow command admission at exact site SHA
        working-directory: d04-private/site
        run: |
          set -euo pipefail
          if node --test tests/life-waterlow-full-admission.test.mjs \
            >"$RUNNER_TEMP/d04-waterlow-admission.log" 2>&1; then
            echo "D04_WATERLOW_ADMISSION_AND_LEGACY=PASS"
          else
            echo "D04_WATERLOW_ADMISSION_AND_LEGACY=FAIL"
            grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/d04-waterlow-admission.log" | tail -3 || true
            exit 1
          fi
      - name: Run original T2 entry and Host integration source tests
        id: entry
        continue-on-error: true
        working-directory: d04-private/site
        run: |
          set -uo pipefail
          set +e
          npm run check:t2:entry >"$RUNNER_TEMP/d04-entry.log" 2>&1
          code=$?
          set -e
          grep -E '^# (tests|pass|fail|skipped|cancelled) ' "$RUNNER_TEMP/d04-entry.log" | tail -7 || true
          if [ "$code" -ne 0 ]; then
            echo "D04_T2_ENTRY_TESTS=FAIL"
            grep '^not ok ' "$RUNNER_TEMP/d04-entry.log" | head -14 | sed -E 's/^not ok ([0-9]+) - /D04_FAILED_TEST_\1=/' || true
            exit "$code"
          fi
          echo "D04_T2_ENTRY_TESTS=PASS"
      - name: Check all existing tool links
        id: links
        continue-on-error: true
        working-directory: d04-private/site
        run: |
          if npm run check:tool-links >"$RUNNER_TEMP/d04-links.log" 2>&1; then
            echo "D04_TOOL_LINKS=PASS"
          else
            echo "D04_TOOL_LINKS=FAIL"
            exit 1
          fi
      - name: Full TypeScript check
        id: types
        continue-on-error: true
        working-directory: d04-private/site
        run: |
          if npx tsc --noEmit --pretty false >"$RUNNER_TEMP/d04-types.log" 2>&1; then
            echo "D04_TYPESCRIPT=PASS"
          else
            echo "D04_TYPESCRIPT=FAIL"
            python3 "$GITHUB_WORKSPACE/tools/ci/d04_safe_diagnostics.py" types "$RUNNER_TEMP/d04-types.log" || true
            exit 1
          fi
      - name: Lint
        id: lint
        continue-on-error: true
        working-directory: d04-private/site
        run: |
          if npm run lint >"$RUNNER_TEMP/d04-lint.log" 2>&1; then
            echo "D04_LINT=PASS"
          else
            echo "D04_LINT=FAIL"
            python3 "$GITHUB_WORKSPACE/tools/ci/d04_safe_diagnostics.py" lint "$RUNNER_TEMP/d04-lint.log" || true
            exit 1
          fi
      - name: Check semantic ESLint rules separately from existing Prettier debt
        id: semantic
        continue-on-error: true
        working-directory: d04-private/site
        run: |
          set +e
          npm run lint -- --rule 'prettier/prettier: off' >"$RUNNER_TEMP/d04-semantic-lint.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "D04_SEMANTIC_LINT=FAIL"
            python3 "$GITHUB_WORKSPACE/tools/ci/d04_safe_diagnostics.py" lint-semantic "$RUNNER_TEMP/d04-semantic-lint.log" || true
            exit "$code"
          fi
          echo "D04_SEMANTIC_LINT=PASS"
      - name: Build real original T2 Host, qualified Kernel, static site and Chromium smoke
        id: integrated
        if: steps.research.outcome == 'success' && steps.entry.outcome == 'success' && steps.links.outcome == 'success' && steps.types.outcome == 'success' && steps.semantic.outcome == 'success'
        continue-on-error: true
        working-directory: d04-private/site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/d04-private/t2
        run: |
          set -uo pipefail
          set +e
          npm run build:t2:site >"$RUNNER_TEMP/d04-integrated.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "D04_INTEGRATED_T2_BUILD=FAIL"
            grep -Eo 'BAZMED_[A-Z0-9_]+|D04_[A-Z0-9_]+|ERR_[A-Z0-9_]+' "$RUNNER_TEMP/d04-integrated.log" | sort -u | tail -25 || true
            grep -E '^D04_BROWSER_PROBLEM_[A-Z_]+=[0-9]+$' "$RUNNER_TEMP/d04-integrated.log" | head -10 || true
            grep -Eo 'error TS[0-9]+' "$RUNNER_TEMP/d04-integrated.log" | sort -u | head -15 || true
            exit "$code"
          fi
          for file in dist/index.html dist/workspace/index.html \
            dist/workspace/exchange/index.html dist/workspace/lifecycle/index.html \
            dist/_iwxa/current.json dist/_iwxa/runtime/0.3.6/runtime.js; do
            if [ ! -s "$file" ]; then
              echo "D04_REQUIRED_DIST_FILE_MISSING"
              exit 1
            fi
          done
          echo "D04_INTEGRATED_T2_BUILD=PASS"
          # Safe numeric diagnostics only, without private assets or personal data.
          grep -E '^D04_EMPTY_WORKSPACE_(HOST_FIRST_USABLE_MS|DOM_READY_MS|HOST_ASSET_REQUESTS|HOST_ASSET_DECODED_KIB)=[0-9]+$' "$RUNNER_TEMP/d04-integrated.log" | tail -4 || true
          responsive_count="$(grep -c '^BAZMED_NAVIGATION_PASS ' "$RUNNER_TEMP/d04-integrated.log" || true)"
          echo "D04_WORKSPACE_RESPONSIVE_VIEWPORTS=$responsive_count"
          if [ "$responsive_count" -ne 5 ]; then
            echo "D04_WORKSPACE_RESPONSIVE_VIEWPORTS_INCOMPLETE"
            exit 1
          fi
          for marker in D04_WORKSPACE_TOOL_RETURN_PATH D04_WORKSPACE_OVERVIEW_ENTRY; do
            if ! grep -qx "$marker=PASS" "$RUNNER_TEMP/d04-integrated.log"; then
              echo "$marker=FAIL"
              exit 1
            fi
            echo "$marker=PASS"
          done
          grep -E '^D04_WORKSPACE_(PUBLIC_RETURN_MS|OVERVIEW_COLD_MS)=[0-9]+$' "$RUNNER_TEMP/d04-integrated.log" | tail -2 || true
          home_count="$(grep -c '^D04_PUBLIC_HOME_ENTRY_PASS ' "$RUNNER_TEMP/d04-integrated.log" || true)"
          echo "D04_PUBLIC_HOME_VIEWPORTS=$home_count"
          if [ "$home_count" -ne 2 ]; then
            echo "D04_PUBLIC_HOME_VIEWPORTS_INCOMPLETE"
            exit 1
          fi
          echo "D04_NATIVE_KERNEL_AND_HOST_FILES=PASS"
          echo "D04_CHROMIUM_SMOKE=PASS_IN_BUILD"
          # Do not upload private dist, private logs, browser profiles or files.
      - name: Audit host-uploadable dist without publishing it
        id: hosting
        if: steps.integrated.outcome == 'success'
        continue-on-error: true
        working-directory: d04-private/site
        run: |
          set -uo pipefail
          failed=0
          for stage in release:check-dist check:production-urls check:no-localhost check:assets check:external-assets check:links check:seo check:htaccess; do
            name="$(printf '%s' "$stage" | tr '[:lower:]' '[:upper:]' | sed 's/[^A-Z0-9]/_/g')"
            log="$RUNNER_TEMP/d04-hosting-$name.log"
            if npm run "$stage" >"$log" 2>&1; then
              echo "D04_HOSTING_STAGE_${name}=PASS"
              if [ "$stage" = release:check-dist ]; then
                grep -E '^D04_(STATIC_ROUTES|STATIC_FILES|STATIC_BYTES|HOSTING_DIST_GATE)=' "$log" | tail -5 || true
              fi
            else
              echo "D04_HOSTING_STAGE_${name}=FAIL"
              grep -Eo 'D04_HOSTING_DIST_ERROR:[A-Z_]+' "$log" | sort -u | head -10 || true
              if [ "$stage" = check:seo ]; then
                # Publish bounded structural issue categories only. Never emit
                # private HTML, source excerpts, meta values, profiles, or logs.
                python3 - "$log" <<'PY'
          from collections import Counter
          from pathlib import Path
          import sys
          import re
          data=Path(sys.argv[1]).read_text(encoding="utf-8",errors="replace")
          counts=Counter()
          paths=set()
          for line in data.splitlines():
              if not line.startswith("  - "):
                  continue
              issue=line[4:]
              scope="HOST" if issue.startswith("workspace/") else ("SITEMAP" if issue.startswith("sitemap") else "PUBLIC")
              if "нет canonical" in issue: kind="MISSING_CANONICAL"
              elif "дублирующиеся canonical" in issue: kind="DUPLICATE_CANONICAL"
              elif "canonical=" in issue: kind="CANONICAL_MISMATCH"
              elif "без trailing slash" in issue: kind="TRAILING_SLASH"
              elif "нет og:url" in issue: kind="MISSING_OG_URL"
              elif "og:url=" in issue: kind="OG_URL_MISMATCH"
              elif "нет meta description" in issue: kind="MISSING_DESCRIPTION"
              elif "дублирующиеся <title>" in issue: kind="DUPLICATE_TITLE"
              elif "нет <title>" in issue or "пустой <title>" in issue: kind="TITLE"
              elif "noindex" in issue: kind="SITEMAP_NOINDEX"
              elif "lastmod" in issue: kind="LASTMOD"
              elif "sitemap" in issue: kind="SITEMAP"
              elif "robots" in issue: kind="ROBOTS"
              else: kind="OTHER"
              counts[(scope,kind)]+=1
              if scope=="PUBLIC" and kind in ("MISSING_CANONICAL","MISSING_OG_URL"):
                  name=issue.split(":",1)[0].strip()
                  if re.fullmatch(r"[A-Za-z0-9_./-]{1,100}",name):
                      paths.add(name)
          for name in sorted(paths)[:8]:
              print("D04_SEO_PUBLIC_STATIC_PATH="+name)
          for (scope,kind),count in sorted(counts.items()):
              print(f"D04_SEO_ISSUE_{scope}_{kind}={count}")
          print("D04_SEO_ISSUE_TOTAL="+str(sum(counts.values())))
          for code in ("SyntaxError","ReferenceError","TypeError","RangeError","ENOENT","EACCES","ERR_MODULE_NOT_FOUND","ERR_PACKAGE_PATH_NOT_EXPORTED","npm error","SIGKILL","Killed","Error:"):
              if code in data:
                  print("D04_SEO_RUNTIME_SIGNAL_"+re.sub(r"[^A-Z0-9]","_",code.upper())+"=YES")
          print("D04_SEO_HAS_VALIDATION_BANNER="+("YES" if "SEO check:" in data else "NO"))
          PY
              fi
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "D04_HOSTING_DIST_CHECKS=FAIL"
            exit 1
          fi
          echo "D04_HOSTING_DIST_CHECKS=PASS"
      - name: Enforce qualification status without uploading artifacts
        if: always()
        env:
          RESEARCH: ${{ steps.research.outcome }}
          ENTRY: ${{ steps.entry.outcome }}
          LINKS: ${{ steps.links.outcome }}
          TYPES: ${{ steps.types.outcome }}
          LINT: ${{ steps.lint.outcome }}
          SEMANTIC: ${{ steps.semantic.outcome }}
          INTEGRATED: ${{ steps.integrated.outcome }}
          HOSTING: ${{ steps.hosting.outcome }}
        run: |
          echo "D04_STAGE_OUTCOMES=research:$RESEARCH,entry:$ENTRY,links:$LINKS,types:$TYPES,lint:$LINT,semantic:$SEMANTIC,integrated:$INTEGRATED,hosting:$HOSTING"
          for outcome in "$RESEARCH" "$ENTRY" "$LINKS" "$TYPES" "$SEMANTIC" "$INTEGRATED" "$HOSTING"; do
            if [ "$outcome" != "success" ]; then
              echo "D04_PRODUCT_QUALIFICATION=INCOMPLETE"
              exit 1
            fi
          done
          echo "D04_SOURCE_AND_INTEGRATED_QUALIFICATION=PASS"
          echo "D04_HOSTING_RELEASE_CANDIDATE=SOURCE_AND_TEST_DIST_PASS"
          echo "D04_FINAL_PRODUCTION_BUILD=DELEGATED_TO_CODEX"
          if [ "$LINT" != "success" ]; then
            echo "D04_FULL_PRETTIER_LINT=FAIL_BASELINE"
            echo "D04_RELEASE_READINESS=HOLD"
          fi
          echo "D04_FULL_PRODUCT_ACCEPTANCE=NOT_YET_QUALIFIED"
