name: D09 HOP interactive pixel reactions qualification
on:
  push:
    branches: [work/2026-11-20-d09-cross-project-qualification]
    paths: [.github/workflows/d09-hop-pixel-motion.yml]
permissions:
  contents: read
jobs:
  pixel-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout exact private HOP development source
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop.iwxa.ru
          ref: 22782fe2388b7657d96d77147a02d9715103cee2
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        shell: bash
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/motion-install.log" 2>&1 || {
            echo D09_MOTION_NPM=FAIL
            exit 1
          }
          echo D09_MOTION_NPM=PASS
      - name: TypeScript and original validator generation
        shell: bash
        run: |
          npm run typecheck > "$RUNNER_TEMP/motion-types.log" 2>&1 || {
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/motion-types.log" | head -20 | cut -c1-230 || true
            echo D09_MOTION_TYPES=FAIL
            exit 1
          }
          echo D09_MOTION_TYPES=PASS
      - name: Native original HOP Workspace and IWXA animation roundtrip
        shell: bash
        run: |
          ./node_modules/.bin/tsx scripts/qualify-pixel-avatar-iwxa.ts > "$RUNNER_TEMP/motion-native.log" 2>&1 || {
            grep -E 'HOP_MOTION_|HOP_PIXEL_|Error|Assertion' "$RUNNER_TEMP/motion-native.log" | tail -20 | cut -c1-200 || true
            echo D09_MOTION_NATIVE_IWXA=FAIL
            exit 1
          }
          grep -E 'HOP_MOTION_.*=PASS|HOP_PIXEL_.*=PASS' "$RUNNER_TEMP/motion-native.log" | tail -12
          echo D09_MOTION_NATIVE_IWXA=PASS
          ./node_modules/.bin/tsx scripts/qualify-pixel-character-transfer.ts > "$RUNNER_TEMP/cross-native.log" 2>&1 || {
            grep -E 'HOP_CROSS_|Error:|AssertionError' "$RUNNER_TEMP/cross-native.log" | tail -20 | cut -c1-230 || true
            echo D09_CROSS_NATIVE_IWXA=FAIL
            exit 1
          }
          grep -E 'HOP_CROSS_.*=PASS' "$RUNNER_TEMP/cross-native.log" | tail -15
          echo D09_CROSS_NATIVE_IWXA=PASS
      - name: Generate genuine GIF fixture for Chrome decoder
        shell: bash
        run: |
          export D09_MOTION_GIF_OUTPUT="$RUNNER_TEMP/hop-motion.gif"
          ./node_modules/.bin/tsx scripts/qualify-pixel-motion-gif.ts > "$RUNNER_TEMP/motion-gif.log" 2>&1 || {
            echo D09_MOTION_GIF_GENERATION=FAIL; exit 1;
          }
          test -s "$D09_MOTION_GIF_OUTPUT" || { echo D09_MOTION_GIF_EMPTY=FAIL; exit 1; }
          echo D09_MOTION_GIF_GENERATION=PASS
      - name: Focused model, GIF and browser component tests
        shell: bash
        run: |
          ./node_modules/.bin/vitest run src/lib/__tests__/pixel-animation.test.ts src/lib/__tests__/pixel-animation-document.test.ts src/lib/__tests__/pixel-character.test.ts src/lib/__tests__/pixel-reaction-actions.test.ts src/lib/__tests__/workspace-runtime.test.ts src/lib/__tests__/action-rules.test.ts src/components/hop/__tests__/PixelAvatarMotionStudio.test.tsx src/components/workspace/__tests__/PixelSceneAnimation.test.tsx src/components/workspace/__tests__/SceneRenderer.motion.test.tsx src/components/player/__tests__/ProjectPlayer.pixel-reaction.test.tsx src/components/workspace/__tests__/ActionsInspector.pixel-reaction.test.tsx src/components/workspace/__tests__/ReusePixelCharacterDialog.test.tsx src/components/hop/__tests__/PixelAvatarEditor.test.tsx src/integrations/pixel/avatar-project.test.ts src/integrations/pixel/character-file.test.ts > "$RUNNER_TEMP/motion-vitest.log" 2>&1 || {
            grep -E 'CROSS_|EXTERNAL_|FAIL|AssertionError|Error:|expected|Actual|Expected' "$RUNNER_TEMP/motion-vitest.log" | tail -25 | cut -c1-200 || true
            echo D09_MOTION_UNIT=FAIL
            exit 1
          }
          echo D09_MOTION_UNIT=PASS
      - name: Normalize and lint only new files in isolated checkout
        shell: bash
        run: |
          ./node_modules/.bin/prettier --write src/lib/pixel-animation.ts src/lib/pixel-animation-document.ts src/lib/pixel-character.ts src/lib/pixel-character-transfer.ts src/integrations/pixel/character-file.ts src/integrations/pixel/character-file.test.ts src/lib/project-model.ts src/lib/project-vocabulary.ts src/lib/workspace-runtime.ts src/lib/action-rules.ts src/lib/project-validator.ts src/lib/__tests__/pixel-reaction-actions.test.ts src/lib/__tests__/pixel-animation.test.ts src/lib/__tests__/pixel-animation-document.test.ts src/lib/__tests__/pixel-character.test.ts src/lib/pixel-avatar-commit.ts src/components/hop/PixelAvatarEditor.tsx src/components/hop/PixelAvatarCreator.tsx src/components/hop/PixelAvatarMotionStudio.tsx src/components/hop/__tests__/PixelAvatarMotionStudio.test.tsx src/components/workspace/PixelAvatarDialog.tsx src/components/workspace/ReusePixelCharacterDialog.tsx src/components/workspace/ActionsInspector.tsx src/components/player/ProjectPlayer.tsx src/components/workspace/PixelSceneAnimation.tsx src/components/workspace/SceneRenderer.tsx src/components/workspace/__tests__/PixelSceneAnimation.test.tsx src/components/workspace/__tests__/SceneRenderer.motion.test.tsx src/components/player/__tests__/ProjectPlayer.pixel-reaction.test.tsx src/components/workspace/__tests__/ActionsInspector.pixel-reaction.test.tsx src/components/workspace/__tests__/ReusePixelCharacterDialog.test.tsx src/routes/avatars.tsx src/integrations/pixel/avatar-project.ts src/components/workspace/ElementsPanel.tsx src/components/workspace/WorkspacePage.tsx scripts/qualify-pixel-avatar-iwxa.ts > "$RUNNER_TEMP/motion-format.log" 2>&1 || {
            echo D09_MOTION_FORMAT=FAIL
            exit 1
          }
          ./node_modules/.bin/eslint src/lib/pixel-animation.ts src/lib/pixel-animation-document.ts src/lib/pixel-character.ts src/lib/pixel-character-transfer.ts src/integrations/pixel/character-file.ts src/integrations/pixel/character-file.test.ts src/lib/project-model.ts src/lib/project-vocabulary.ts src/lib/workspace-runtime.ts src/lib/action-rules.ts src/lib/project-validator.ts src/lib/__tests__/pixel-reaction-actions.test.ts src/lib/__tests__/pixel-animation.test.ts src/lib/__tests__/pixel-animation-document.test.ts src/lib/__tests__/pixel-character.test.ts src/lib/pixel-avatar-commit.ts src/components/hop/PixelAvatarEditor.tsx src/components/hop/PixelAvatarCreator.tsx src/components/hop/PixelAvatarMotionStudio.tsx src/components/hop/__tests__/PixelAvatarMotionStudio.test.tsx src/components/workspace/PixelAvatarDialog.tsx src/components/workspace/ReusePixelCharacterDialog.tsx src/components/workspace/ActionsInspector.tsx src/components/player/ProjectPlayer.tsx src/components/workspace/PixelSceneAnimation.tsx src/components/workspace/SceneRenderer.tsx src/components/workspace/__tests__/PixelSceneAnimation.test.tsx src/components/workspace/__tests__/SceneRenderer.motion.test.tsx src/components/player/__tests__/ProjectPlayer.pixel-reaction.test.tsx src/components/workspace/__tests__/ActionsInspector.pixel-reaction.test.tsx src/components/workspace/__tests__/ReusePixelCharacterDialog.test.tsx src/routes/avatars.tsx src/integrations/pixel/avatar-project.ts src/components/workspace/ElementsPanel.tsx src/components/workspace/WorkspacePage.tsx scripts/qualify-pixel-avatar-iwxa.ts > "$RUNNER_TEMP/motion-lint.log" 2>&1 || {
            grep -E 'error|warning' "$RUNNER_TEMP/motion-lint.log" | head -20 | cut -c1-200 || true
            echo D09_MOTION_LINT=FAIL
            exit 1
          }
          echo D09_MOTION_LINT=PASS
      - name: Build and prerender public creator
        shell: bash
        run: |
          npm run build:public-stage > "$RUNNER_TEMP/motion-build.log" 2>&1 || {
            if grep -q 'Timed out after 30000 ms while waiting for the WS endpoint URL' "$RUNNER_TEMP/motion-build.log"; then
              npm run build:public-stage > "$RUNNER_TEMP/motion-build-retry.log" 2>&1 || {
                echo D09_MOTION_PUBLIC_BUILD=FAIL
                exit 1
              }
            else
              grep -E 'error|Error|FAIL' "$RUNNER_TEMP/motion-build.log" | tail -15 | cut -c1-230 || true
              echo D09_MOTION_PUBLIC_BUILD=FAIL
              exit 1
            fi
          }
          test -f dist/avatars/index.html
          echo D09_MOTION_PUBLIC_BUILD=PASS
      - name: Real Chrome pixel motion creator and GIF decoder
        shell: bash
        run: |
          export D09_MOTION_GIF_OUTPUT="$RUNNER_TEMP/hop-motion.gif"
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome || true)"
          node tests/d09-pixel-motion-user.browser.mjs > "$RUNNER_TEMP/motion-browser.log" 2>&1 || {
            grep -E 'D09_MOTION_|AssertionError|Error:|GIF_DECODER_OBSERVATION' "$RUNNER_TEMP/motion-browser.log" | tail -18 | cut -c1-210 || true
            echo D09_MOTION_REAL_BROWSER=FAIL; exit 1;
          }
          grep 'D09_MOTION_.*=PASS' "$RUNNER_TEMP/motion-browser.log" | tail -12
          echo D09_MOTION_REAL_BROWSER=PASS
      - name: Report pinned verified product source
        run: |
          echo D09_MOTION_SOURCE=22782fe2388b7657d96d77147a02d9715103cee2
          echo D09_MOTION_PRIVATE_ARTIFACT_UPLOADS=NONE
