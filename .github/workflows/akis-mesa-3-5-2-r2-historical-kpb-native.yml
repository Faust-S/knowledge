name: AKIS Mesa 3.5.2 R2 historical strict KPB source revisions

on:
  push:
    branches:
      - work/2026-11-23-akis-r2-historical-kpb-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-original-mesa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install official Mesa 3.5.2 and pytest
        run: |
          python -m pip install --disable-pip-version-check "mesa==3.5.2" "pytest>=8,<10"
          python -c "import mesa; assert mesa.__version__ == '3.5.2'; print('ORIGINAL_MESA_3_5_2_PASS')"
      - name: Compile original AKIS
        run: python -m compileall -q qualifications/akis_2026_11_21/research
      - name: Complete original AKIS regression with R2 historical KPB
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests
      - name: Export strict economic Work evidence from original Mesa
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_r1r2_strict_economic_evidence.py
      - name: Export R2 cost and payment evidence from original Mesa
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_r2_strict_cost_payment_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: akis-r2-cost-payment-${{ matrix.os }}
          if-no-files-found: error
          path: qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r2_strict_original_cost_payment_evidence.json
      - name: Export original historical-versus-current KPB source evidence
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_r2_historical_kpb_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: akis-r2-historical-kpb-${{ matrix.os }}
          if-no-files-found: error
          path: qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r2_historical_kpb_evidence.json
