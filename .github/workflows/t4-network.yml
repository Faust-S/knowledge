name: T4 K148 original Vault multipart qualification
on:
  push:
    branches:
      - 'ci/once/t4-multipart/f9f5b5fe772593207b2d48db1b4bea4160972b5f'
permissions:
  contents: read
concurrency:
  group: t4-multipart-f9f5b5fe772593207b2d48db1b4bea4160972b5f
  cancel-in-progress: false
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source tree
        run: |
          test "$(git rev-parse HEAD^)" = 'f9f5b5fe772593207b2d48db1b4bea4160972b5f'
          test "$(git rev-parse HEAD:packages/t4-network)" = "$(git rev-parse f9f5b5fe772593207b2d48db1b4bea4160972b5f:packages/t4-network)"
      - name: Install locked dependencies
        run: npm ci --prefix packages/t4-network --ignore-scripts --no-audit --no-fund
      - name: Original Registry Vault and full multipart regression
        working-directory: packages/t4-network
        run: |
          node --experimental-strip-types --test tests/original-network-key-lifecycle.test.mjs tests/original-vault-node-signature.test.mjs tests/original-network-multipart-agreement.test.mjs tests/original-network-subject-apply.test.mjs tests/original-network-source-head-proof.test.mjs tests/original-asset-delta.test.mjs tests/original-host-recipient-dispatcher.test.mjs tests/original-network-publication-multipart-backing.test.mjs tests/original-network-publication.test.mjs tests/standard-network-multipart-opaque-chunks.test.mjs tests/standard-network-wire-candidate.test.mjs tests/standard-network-multipart-wire.test.mjs tests/standard-network-wire-independent-vectors.test.mjs
