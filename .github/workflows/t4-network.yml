name: t4-network-qualification
on:
  push:
    branches:
      - work/2026-11-22-t4-t3-0.3.0-integration
    paths:
      - packages/t4-network/**
      - packages/t3-core/src/t3/original-kernel-native-relay*
      - packages/t3-core/src/t3/control-loopback-owner*
      - packages/t3-core/src/t3/original-control-http-handler.mjs
      - packages/t3-core/src/t3/subject-access-binding.mjs
      - packages/t3-core/tests/t3-subject-kernel-scope.test.mjs
      - packages/t3-core/tests/support/t3-original-personal-authority.mjs
      - packages/t3-core/src/main-trusted-kernel-realm.ts
      - packages/t3-core/tests/t3-d1-original-control-http.test.mjs
      - .github/workflows/t4-network.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t4-network-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked T4 transport dependency
        run: npm ci --prefix packages/t4-network --ignore-scripts --no-audit --no-fund
      - name: Verify network and placement contracts
        working-directory: packages/t4-network
        run: |
          npm run check
          npm test
      - name: Existing original T3 Control and D3 regression
        run: node --test packages/t3-core/tests/t3-d1-original-control-http.test.mjs packages/t3-core/tests/t3-subject-kernel-scope.test.mjs

  webdav:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked T4 transport dependency
        run: npm ci --prefix packages/t4-network --ignore-scripts --no-audit --no-fund
      - name: Install isolated WebDAV test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2 apache2-utils openssl
      - name: Qualify real Apache HTTPS/WebDAV transport
        working-directory: packages/t4-network
        env:
          T4_TEST_OUTPUT_DIR: ${{ runner.temp }}/iwxa-t4-network-qualification
        run: npm run test:network
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t4-network-qualification
          path: ${{ runner.temp }}/iwxa-t4-network-qualification/
          if-no-files-found: ignore

  windows-contract:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked T4 transport dependency
        run: npm ci --prefix packages/t4-network --ignore-scripts --no-audit --no-fund
      - name: Verify T4 network contracts on Windows
        working-directory: packages/t4-network
        run: |
          node --check src/network/webdav-package-transfer.mjs
          node --check src/network/original-exchange-handoff.mjs
          node --check src/network/operator-connection.mjs
          npm test
      - name: Existing original T3 Control and D3 regression
        run: node --test packages/t3-core/tests/t3-d1-original-control-http.test.mjs packages/t3-core/tests/t3-subject-kernel-scope.test.mjs

  original-kernel-webdav:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked T4 transport dependency
        run: npm ci --prefix packages/t4-network --ignore-scripts --no-audit --no-fund
      - name: Install original T3 browser-test dependencies
        run: npm ci --prefix packages/t3-core --ignore-scripts --no-audit --no-fund
      - name: Typecheck original T3 trusted Kernel realm
        working-directory: packages/t3-core
        run: npx --no-install tsc --noEmit
      - name: Verify and stage original qualified T2 Kernel 0.3.6
        working-directory: packages/t3-core
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t4-original-kernel
        run: |
          set -eu
          archive=qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip
          echo "7075b8b9590ef1283e34ecb3c21dd9d1b7342697287e1aa150cd4f4a60860b68  $archive" | sha256sum -c -
          mkdir -p "$IWXA_T2_QUALIFIED_KERNEL_DIST"
          unzip -q "$archive" -d "$IWXA_T2_QUALIFIED_KERNEL_DIST"
          node --input-type=module -e 'import {assertQualifiedKernelArtifact} from "./src/factory2/products/domain-completion/independent-browser-witness.mjs";assertQualifiedKernelArtifact(process.env.IWXA_T2_QUALIFIED_KERNEL_DIST,{kernel:"0.3.6",contract:"1.3.0",artifactId:"iwxa-kernel-k036-same-store-history-20261019-qualified.1"});'
      - name: Install original browser
        working-directory: packages/t3-core
        run: npx --no-install playwright install chromium
      - name: Install ephemeral HTTPS/WebDAV dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2 apache2-utils openssl
      - name: Real original T2 Kernel to T4 WebDAV to independent recipient and two cold reads
        working-directory: packages/t4-network
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t4-original-kernel
          T4_TEST_OUTPUT_DIR: ${{ runner.temp }}/t4-original-kernel-webdav
        run: python3 scripts/qualify_webdav.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t4-original-kernel-webdav
          path: ${{ runner.temp }}/t4-original-kernel-webdav/
          if-no-files-found: ignore
