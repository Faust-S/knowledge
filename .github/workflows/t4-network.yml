name: T4 multipart K143-K144 targeted qualification
on:
  push:
    branches:
      - 'ci/once/t4-multipart/92dc7429a52209e99f2e179490c9143264c885da-fixed'
permissions:
  contents: read
concurrency:
  group: t4-multipart-92dc7429a52209e99f2e179490c9143264c885da
  cancel-in-progress: false
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact candidate tree
        run: |
          test "$(git rev-parse HEAD:packages/t4-network)" = "$(git rev-parse 92dc7429a52209e99f2e179490c9143264c885da:packages/t4-network)"
          git diff --name-only 92dc7429a52209e99f2e179490c9143264c885da HEAD
      - name: Install locked dependencies
        run: npm ci --prefix packages/t4-network --ignore-scripts --no-audit --no-fund
      - name: K140-K144 and original publication regression
        working-directory: packages/t4-network
        run: |
          node --experimental-strip-types --test tests/original-network-publication-multipart-backing.test.mjs tests/original-network-publication.test.mjs tests/standard-network-multipart-opaque-chunks.test.mjs tests/standard-network-wire-candidate.test.mjs tests/standard-network-multipart-wire.test.mjs
