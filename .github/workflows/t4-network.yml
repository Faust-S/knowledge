name: T4 multipart K145-K146 and compatibility
on:
  push:
    branches:
      - 'ci/once/t4-multipart/b13fb200e0cc8abf3a16fc9d99f0a625202372d2'
permissions:
  contents: read
concurrency:
  group: t4-multipart-b13fb200e0cc8abf3a16fc9d99f0a625202372d2
  cancel-in-progress: false
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source tree
        run: |
          test "$(git rev-parse HEAD^)" = 'b13fb200e0cc8abf3a16fc9d99f0a625202372d2'
          test "$(git rev-parse HEAD:packages/t4-network)" = "$(git rev-parse b13fb200e0cc8abf3a16fc9d99f0a625202372d2:packages/t4-network)"
      - name: Install locked dependencies
        run: npm ci --prefix packages/t4-network --ignore-scripts --no-audit --no-fund
      - name: Native agreement and indexed recovery with prior publication and wire regression
        working-directory: packages/t4-network
        run: |
          node --experimental-strip-types --test tests/original-network-multipart-agreement.test.mjs tests/original-network-publication-multipart-backing.test.mjs tests/original-network-publication.test.mjs tests/standard-network-multipart-opaque-chunks.test.mjs tests/standard-network-wire-candidate.test.mjs tests/standard-network-multipart-wire.test.mjs tests/standard-network-wire-independent-vectors.test.mjs
