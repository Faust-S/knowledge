name: T4 multipart K147 subject qualification
on:
  push:
    branches:
      - 'ci/once/t4-multipart/8788423bad8974c47fa66840f81c05400f31eb62'
permissions:
  contents: read
concurrency:
  group: t4-multipart-8788423bad8974c47fa66840f81c05400f31eb62
  cancel-in-progress: false
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source tree
        run: |
          test "$(git rev-parse HEAD^)" = '8788423bad8974c47fa66840f81c05400f31eb62'
          test "$(git rev-parse HEAD:packages/t4-network)" = "$(git rev-parse 8788423bad8974c47fa66840f81c05400f31eb62:packages/t4-network)"
      - name: Install locked dependencies
        run: npm ci --prefix packages/t4-network --ignore-scripts --no-audit --no-fund
      - name: Subject apply, source proofs, recipient and transport regression
        working-directory: packages/t4-network
        run: |
          node --experimental-strip-types --test tests/original-network-multipart-agreement.test.mjs tests/original-network-subject-apply.test.mjs tests/original-network-source-head-proof.test.mjs tests/original-asset-delta.test.mjs tests/original-host-recipient-dispatcher.test.mjs tests/original-network-publication-multipart-backing.test.mjs tests/original-network-publication.test.mjs tests/standard-network-multipart-opaque-chunks.test.mjs tests/standard-network-wire-candidate.test.mjs tests/standard-network-multipart-wire.test.mjs tests/standard-network-wire-independent-vectors.test.mjs
