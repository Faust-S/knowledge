name: D09 HOP T3 0.3.2 command profiles and verified hosting ZIP
on:
  push:
    branches: ['ci/once/d09-hop-t3-integration/**']
    paths: ['.github/ci-requests/d09-hop-t3-integration.json']
concurrency:
  group: d09-hop-t3-integration
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  product:
    if: github.event.created == false && github.event.deleted == false && github.event.forced == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: production
            runner: ubuntu-24.04
            origin: https://hop.iwxa.ru
            preview: '0'
          - lane: browser
            runner: ubuntu-24.04
            origin: https://hop.iwxa.ru:9443
            preview: '1'
          - lane: hardware
            runner: macos-latest
            origin: https://hop.iwxa.ru:9443
            preview: '1'
            profile: light
          - lane: hardware
            runner: macos-latest
            origin: https://hop.iwxa.ru:9443
            preview: '1'
            profile: balanced
    env:
      SITE_PIN: 4ae0335694485d6181bb4951c231c199d3042f6a
      SUBJECT_PIN: 24da92543502914ff5bac01269b82d4984788dae
      T3_PIN: 8e26076ce66f0c26693a647e061fcd568e055b77
      ASSISTANT_PIN: 2c247482306f218a7d5be668de11e98f168862d4
      D09_ORIGIN: ${{ matrix.origin }}
      D09_PREVIEW_PRODUCTION_LOOPBACK: ${{ matrix.preview }}
      D09_ASSEMBLY_ONLY: '0'
      D09_ASSEMBLY_ONLY_CONSENT: ''
    steps:
      - name: Checkout public request guard
        uses: actions/checkout@v4
        with:
          path: ci-harness
          fetch-depth: 2
          persist-credentials: false
      - name: Admit immutable domain request
        working-directory: ci-harness
        run: python3 tools/ci/verify_once_request.py --repository Faust-S/knowledge --workflow d09-hop-t3-integration --profile hop-original-t3-032 --revision site=4ae0335694485d6181bb4951c231c199d3042f6a --revision subject=24da92543502914ff5bac01269b82d4984788dae --revision platform=8e26076ce66f0c26693a647e061fcd568e055b77 --revision assistant=2c247482306f218a7d5be668de11e98f168862d4
      - name: Checkout HOP site
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop.iwxa.ru
          ref: ${{ env.SITE_PIN }}
          token: ${{ secrets.DOMEN }}
          path: private-site
          persist-credentials: false
          show-progress: false
      - name: Checkout released original T3 source
        uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: ${{ env.T3_PIN }}
          path: original-platform
          persist-credentials: false
          sparse-checkout: |
            packages/t3-core
      - name: Checkout original domain assistant
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: ${{ env.ASSISTANT_PIN }}
          token: ${{ secrets.DOMEN }}
          path: private-assistant
          persist-credentials: false
          show-progress: false
          sparse-checkout: |
            browser-local-inference/domain-assistant
      - name: Verify pins and download public platform release
        shell: bash
        run: |
          set -euo pipefail
          for spec in "private-site $SITE_PIN 71954250a5967e7eab46de723cd71bfbaa6bb60c" "original-platform $T3_PIN 6ffc44d4a633d958ac7a4e71ea14fb182f5f82c5" "private-assistant $ASSISTANT_PIN f7b331dc9334ae343975c33cff62f71a6980fccd"; do
            read -r dir sha tree <<< "$spec"
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
            test "$(git -C "$dir" rev-parse 'HEAD^{tree}')" = "$tree"
            echo "D09_T3_INPUT $dir PASS"
          done
          test "$(git -C private-site rev-parse HEAD:public/assets/hop-assistant-skills.json)" = ff1a1f8cfcf2854549f291f8ddee1964736915e4
          mkdir -p "$RUNNER_TEMP/d09-t3"
          curl --fail --silent --show-error --location --retry 2 'https://github.com/Faust-S/knowledge/releases/download/t3-platform-v0.3.2/platform-inputs.zip' -o "$RUNNER_TEMP/d09-t3/platform-inputs.zip"
          printf '%s  %s\n' '5624d8a899c99fc2c100f57023eaf6fb1140f6f39ad1e7bfb85c5f20faadd32b' "$RUNNER_TEMP/d09-t3/platform-inputs.zip" | (if command -v sha256sum >/dev/null 2>&1; then sha256sum -c -; else shasum -a 256 -c -; fi) >/dev/null
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=hop.iwxa.ru' -keyout "$RUNNER_TEMP/d09-t3/key.pem" -out "$RUNNER_TEMP/d09-t3/cert.pem" >/dev/null 2>&1
          {
            echo "D09_T3_CORE_SOURCE=$GITHUB_WORKSPACE/original-platform/packages/t3-core"
            echo "D09_T3_ASSISTANT_SOURCE=$GITHUB_WORKSPACE/private-assistant"
            echo "D09_T3_PLATFORM_ARCHIVE=$RUNNER_TEMP/d09-t3/platform-inputs.zip"
            echo "D09_PREVIEW_CERT_PATH=$RUNNER_TEMP/d09-t3/cert.pem"
            echo "D09_PREVIEW_KEY_PATH=$RUNNER_TEMP/d09-t3/key.pem"
            echo "npm_config_cache=$RUNNER_TEMP/d09-t3/npm-cache"
          } >> "$GITHUB_ENV"
          echo D09_T3_RELEASE_ARCHIVE=PASS
      - name: Node 22 (qualified T3 macOS environment)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.lane == 'hardware' && '22' || '24' }}
      - name: Locked HOP dependencies
        id: dependencies
        working-directory: private-site
        shell: bash
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-t3/npm.log" 2>&1 || { echo D09_T3_NPM=FAIL; exit 1; }
          if [ -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ]; then
            echo 'PUPPETEER_EXECUTABLE_PATH=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null 2>&1; then
            echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx --no-install puppeteer browsers install chrome > "$RUNNER_TEMP/d09-t3/browser-install.log" 2>&1 || { echo D09_T3_CHROME=FAIL; exit 1; }
          fi
          echo D09_T3_NPM=PASS
      - name: HOP TypeScript
        working-directory: private-site
        shell: bash
        run: |
          if npm run typecheck > "$RUNNER_TEMP/d09-t3/typecheck.log" 2>&1; then
            echo D09_T3_TYPECHECK=PASS
          else
            echo D09_T3_TYPECHECK=FAIL
            grep -E '^([[:alnum:]_./-]+\.(tsx?|mjs)\([0-9]+,[0-9]+\): error TS[0-9]+:)' "$RUNNER_TEMP/d09-t3/typecheck.log" | cut -c1-180 | head -30 || true
            exit 1
          fi
      - name: Prepare ONE original T3 Host with HOP editor and assistant
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        id: prepare
        working-directory: private-site
        shell: bash
        run: |
          set -eu
          for path in scripts/d09-t3-integration.mjs scripts/build-d09-site-only.mjs scripts/assemble-d09-site-only.mjs tests/d09-t3-user.browser.mjs; do
            node --check "$path"
          done
          if npm run t3:prepare > "$RUNNER_TEMP/d09-t3/prepare.log" 2>&1; then
            grep -E '^D09_T3_[A-Z0-9_]+=(PASS|[0-9]+)$' "$RUNNER_TEMP/d09-t3/prepare.log" | tail -20
            echo D09_T3_PREPARE=PASS
          else
            echo D09_T3_PREPARE=FAIL
            grep -E '^D09_T3_PREPARE_PHASE_[A-Z_]+=FAIL$' "$RUNNER_TEMP/d09-t3/prepare.log" | tail -5 || true
            grep -oE '(D09_[A-Z0-9_]+|T3_[A-Z0-9_]+|T2_[A-Z0-9_]+|ERR_[A-Z0-9_]+|error TS[0-9]+)' "$RUNNER_TEMP/d09-t3/prepare.log" | sort -u | head -50 || true
            # Only fixed diagnostic classes; no private source or raw paths.
            grep -oEi 'Cannot find module|Cannot find package|Cannot find native binding|EBADPLATFORM|EBADENGINE|EINTEGRITY|ERESOLVE|EACCES|ENOSPC|EEXIST|ENOENT|ETIMEDOUT|out of memory|Unsupported engine|npm ci can only install|Failed to resolve import|Invalid base in dist|Missing Vite entry' "$RUNNER_TEMP/d09-t3/prepare.log" | sort -u | head -20 || true
            exit 1
          fi
      - name: Build from local prepared T3 inputs only
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        id: build
        working-directory: private-site
        shell: bash
        run: |
          set -eu
          rm -rf "$GITHUB_WORKSPACE/original-platform" "$GITHUB_WORKSPACE/private-assistant"
          rm -f "$D09_T3_PLATFORM_ARCHIVE"
          unset D09_T3_CORE_SOURCE D09_T3_ASSISTANT_SOURCE D09_T3_PLATFORM_ARCHIVE
          if npm run build > "$RUNNER_TEMP/d09-t3/build.log" 2>&1; then
            echo D09_T3_BUILD=PASS
            grep -E '^D09_T3_ONE_DIST=' "$RUNNER_TEMP/d09-t3/build.log" | tail -1
          else
            echo D09_T3_BUILD=FAIL
            grep -oE '(D09_[A-Z0-9_]+|T3_[A-Z0-9_]+|T2_[A-Z0-9_]+|ERR_[A-Z0-9_]+|error TS[0-9]+)' "$RUNNER_TEMP/d09-t3/build.log" | sort -u | head -50 || true
            grep -E '^([[:alnum:]_./-]+\.(tsx?|mjs)\([0-9]+,[0-9]+\): error TS[0-9]+:|error during build:)' "$RUNNER_TEMP/d09-t3/build.log" | cut -c1-200 | head -20 || true
            exit 1
          fi
      - name: T3 assistant, actual canvas context, offline restart and Workspace
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.lane == 'browser' }}
        working-directory: private-site
        shell: bash
        run: |
          set -eu
          failed=0
          check() {
            local id="$1"; shift
            if "$@" > "$RUNNER_TEMP/d09-t3/$id.log" 2>&1; then
              echo "D09_T3_$id=PASS"
            else
              echo "D09_T3_$id=FAIL"
              grep -oE '(D09_[A-Z0-9_]+|T3_[A-Z0-9_]+|error TS[0-9]+|ERR_[A-Z0-9_]+)' "$RUNNER_TEMP/d09-t3/$id.log" | sort -u | head -30 || true
              failed=1
            fi
            grep -E '^D09_[A-Z0-9_]+=(PASS|FAIL)$|^D09_PRODUCT_ROUTE_FAIL [^ ]+' "$RUNNER_TEMP/d09-t3/$id.log" | cut -c1-200 | tail -30 || true
          }
          check USER node tests/d09-t3-user.browser.mjs
          check FIRST_WORKSPACE node tests/d09-original-t2-production-first-run.browser.mjs
          check PROJECT_RESULT_EXCHANGE node tests/d09-original-t2-project-save.browser.mjs
          grep -E '^D09_PROJECT_[A-Z0-9_]+=FAIL ' "$RUNNER_TEMP/d09-t3/PROJECT_RESULT_EXCHANGE.log" | cut -c1-200 | head -5 || true
          exit "$failed"
      - name: Existing product routes and contracts on T3
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.lane == 'browser' }}
        working-directory: private-site
        shell: bash
        run: |
          set -eu
          failed=0
          if npm run test:d09:user-routes > "$RUNNER_TEMP/d09-t3/USER_ROUTES.log" 2>&1; then
            echo D09_T3_USER_ROUTES=PASS
          else
            echo D09_T3_USER_ROUTES=FAIL
            failed=1
          fi
          grep -E '^D09_PRODUCT_ROUTE_PHASE |^D09_PRODUCT_ROUTE_STATE |^D09_PRODUCT_ROUTE_FAIL |^D09_PRODUCT_ROUTE_MATRIX=' "$RUNNER_TEMP/d09-t3/USER_ROUTES.log" | cut -c1-240 | tail -30 || true
          if NODE_OPTIONS="--test-reporter=tap" npm run test:d09 > "$RUNNER_TEMP/d09-t3/CONTRACTS.log" 2>&1; then
            echo D09_T3_CONTRACTS=PASS
          else
            echo D09_T3_CONTRACTS=FAIL
            grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/d09-t3/CONTRACTS.log" | cut -c1-160 | head -30 || true
            failed=1
          fi
          exit "$failed"
      - name: Validate actual production-origin dist
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.lane == 'production' }}
        working-directory: private-site
        shell: bash
        run: |
          set -eu
          if npm run check:d09:hosting-dist > "$RUNNER_TEMP/d09-t3/HOSTING.log" 2>&1; then
            echo D09_T3_HOSTING_DIST=PASS
            node --input-type=module - "$RUNNER_TEMP/d09-t3/HOSTING.log" <<'D09_SUMMARY'
          import {readFileSync} from 'node:fs';
          const raw=readFileSync(process.argv[2],'utf8');
          const report=JSON.parse(raw.slice(raw.indexOf('{')));
          if(report.status!=='D09_HOSTING_DIST_STRUCTURE_PASS'||report.platform!=='T3'||report.origin!=='https://hop.iwxa.ru')process.exit(1);
          const {status,platform,origin,files,bytes,inventorySha256,offline}=report;
          console.log('D09_T3_DIST_SUMMARY='+JSON.stringify({status,platform,origin,files,bytes,inventorySha256,offline:{pages:offline.pages,manifestEntries:offline.manifestEntries,manifestVersion:offline.manifestVersion}}));
          D09_SUMMARY
          else
            echo D09_T3_HOSTING_DIST=FAIL
            grep -oE '(D09_[A-Z0-9_]+|ERR_[A-Z0-9_]+)' "$RUNNER_TEMP/d09-t3/HOSTING.log" | sort -u | head -25 || true
            exit 1
          fi
      - name: Package actual production dist and verify extracted ZIP
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.lane == 'production' }}
        working-directory: private-site
        shell: bash
        run: |
          set -eu
          node --check scripts/package-d09-hosting.mjs
          if npm run package:d09:hosting -- --output "$RUNNER_TEMP/d09-t3/hosting-candidate" > "$RUNNER_TEMP/d09-t3/ZIP.log" 2>&1; then
            node --input-type=module - "$RUNNER_TEMP/d09-t3/hosting-candidate" <<'D09_ZIP'
          import {readdirSync,readFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          const dir=process.argv[2],files=readdirSync(dir);
          const receiptName=files.find(x=>x.endsWith('.zip.json'));
          if(!receiptName||files.length!==3)process.exit(1);
          const r=JSON.parse(readFileSync(join(dir,receiptName),'utf8'));
          const data=readFileSync(join(dir,r.archive)),sha256=createHash('sha256').update(data).digest('hex');
          if(r.status!=='D09_HOSTING_ZIP_ROUNDTRIP_PASS'||r.siteCommit!==process.env.SITE_PIN||r.subjectCommit!==process.env.SUBJECT_PIN||r.archiveSha256!==sha256||r.archiveBytes!==data.length||r.report.platform!=='T3')process.exit(1);
          console.log('D09_T3_HOSTING_ZIP=PASS');
          console.log('D09_T3_ZIP_SUMMARY='+JSON.stringify({archive:r.archive,archiveBytes:r.archiveBytes,archiveSha256:r.archiveSha256,files:r.report.files,inventorySha256:r.report.inventorySha256,productAcceptance:r.productAcceptance}));
          D09_ZIP
          else
            echo D09_T3_HOSTING_ZIP=FAIL
            grep -oE '(D09_HOSTING_[A-Z0-9_]+|ERR_[A-Z0-9_]+|AssertionError|TypeError|SyntaxError)' "$RUNNER_TEMP/d09-t3/ZIP.log" | sort -u | head -25 || true
            exit 1
          fi
      - name: Real local model and explicit HOP canvas command on macOS
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.lane == 'hardware' }}
        working-directory: private-site
        shell: bash
        env:
          D09_T3_MODEL_PROFILE: ${{ matrix.profile }}
          D09_T3_ALLOW_REAL_MODEL: '1'
          D09_T3_REQUIRE_HARDWARE_GPU: '1'
        run: |
          set -eu
          log="$RUNNER_TEMP/d09-t3/HARDWARE.log"
          failed=0
          node tests/d09-t3-user.browser.mjs > "$log" 2>&1 || failed=1
          # Finite evidence only: never print generated text or private source.
          grep -E '^D09_T3_[A-Z0-9_]+=(PASS|FAIL|NOT_RUN_AFTER_FIRST_FAILURE|[0-9]+)$|^D09_T3_MODEL_(DEVICE|ANSWER|PAGE_REQUESTS|CANVAS_STRUCTURE)=' "$log" | cut -c1-650 | tail -40 || true
          if [ "$failed" = 0 ]; then
            echo D09_T3_REAL_MODEL_FUNCTIONAL=PASS
          else
            echo D09_T3_REAL_MODEL_FUNCTIONAL=FAIL
            grep -oE 'D09_T3_[A-Z0-9_]{5,100}' "$log" | sort -u | tail -30 || true
          fi
          exit "$failed"
      - name: Separate model functional qualification
        if: ${{ !cancelled() && matrix.lane == 'browser' }}
        run: |
          echo D09_T3_REAL_MODEL_FUNCTIONAL=SEPARATE_HARDWARE_LANE
          echo D09_RELEASE_ACCEPTANCE=NOT_EVALUATED
      - name: Remove private inputs, site and evidence
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/private-site" "$GITHUB_WORKSPACE/private-assistant" "$GITHUB_WORKSPACE/original-platform" "$RUNNER_TEMP/d09-t3"
          echo D09_PRIVATE_ARTIFACT_UPLOADS=NONE
