name: D05 CehoVod one-click order handoff source check
on:
  push:
    branches: [work/2026-11-02-pipeline-foundation]
    paths: [.github/workflows/d05-cehovod-one-click-source.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d05-one-click-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout private site into disposable runner
        uses: actions/checkout@v4
        with:
          repository: Faust-S/cehovod.ru
          ref: 3a588c7df2f0a83f617d9b80196e4be6c3f47b0d
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - name: Confirm exact source without printing private files
        shell: bash
        run: |
          test "$(git -C site rev-parse HEAD)" = "3a588c7df2f0a83f617d9b80196e4be6c3f47b0d" || exit 1
          test -z "$(git -C site status --porcelain)" || exit 1
          echo D05_SOURCE_PIN=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies without public build or artifact
        working-directory: site
        shell: bash
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d05-install.log" 2>&1 || {
            echo D05_DEPENDENCIES=FAIL
            exit 1
          }
          echo D05_DEPENDENCIES=PASS
      - name: Check native witness and scoped tests
        working-directory: site
        shell: bash
        run: |
          node --check scripts/d05-first-use-real-kernel-witness.mjs || exit 1
          echo D05_WITNESS_SYNTAX=PASS
          node_modules/.bin/vitest run src/host/draft-kernel-handoff.test.ts src/host/CehovodHostApp.ui-regression.test.ts src/routes/zakaz-v-ceh.ui-regression.test.ts > "$RUNNER_TEMP/d05-targeted.log" 2>&1 || {
            echo D05_HANDOFF_TESTS=FAIL
            node - <<'NODE'
          const fs = require("node:fs");
          const text = fs.readFileSync(process.env.RUNNER_TEMP + "/d05-targeted.log", "utf8");
          const summary = text.match(/Tests\s+\d+\s+(?:failed|passed)[^\n]*/g) || [];
          for (const line of summary.slice(-2)) console.log("D05_TEST_SUMMARY=" + line.replace(/[^A-Za-z0-9 ./:-]/g,"").slice(0,100));
          NODE
            exit 1
          }
          echo D05_HANDOFF_TESTS=PASS
      - name: TypeScript check
        working-directory: site
        shell: bash
        run: |
          npm run typecheck > "$RUNNER_TEMP/d05-types.log" 2>&1 || {
            echo D05_TYPECHECK=FAIL
            node - <<'NODE'
          const fs = require("node:fs");
          const lines = fs.readFileSync(process.env.RUNNER_TEMP + "/d05-types.log", "utf8").split(/\r?\n/);
          for (const line of lines) {
            const match = line.match(/^(src\/[^\s(]+)\((\d+),(\d+)\): error (TS\d{4})/);
            if(match) console.log("D05_TYPE_DIAGNOSTIC=" + match.slice(1).join(":").slice(0,180));
          }
          NODE
            exit 1
          }
          echo D05_TYPECHECK=PASS
      - name: ESLint check
        working-directory: site
        shell: bash
        run: |
          node_modules/.bin/eslint . --format json > "$RUNNER_TEMP/d05-lint.json" 2> "$RUNNER_TEMP/d05-lint.err" || {
            echo D05_LINT=FAIL
            node - <<'NODE'
          const fs = require("node:fs");
          const file=process.env.RUNNER_TEMP + "/d05-lint.json";
          try {
            const rows=JSON.parse(fs.readFileSync(file,"utf8"));
            for(const row of rows.filter(x=>x.errorCount>0).slice(0,25)){
              const name=row.filePath.split(/[\\/]/).slice(-2).join("/");
              console.log("D05_LINT_FILE="+name.replace(/[^A-Za-z0-9_.-]/g,"").slice(0,80));
              for(const m of row.messages.filter(x=>x.severity===2).slice(0,5))
                console.log("D05_LINT_RULE="+String(m.ruleId||"unknown").replace(/[^A-Za-z0-9_/-]/g,"").slice(0,80)+":"+m.line);
            }
          } catch { console.log("D05_LINT_JSON_UNAVAILABLE"); }
          NODE
            exit 1
          }
          echo D05_LINT=PASS
      - name: Validate generated file consistency
        working-directory: site
        shell: bash
        run: |
          npm run verify:generated > "$RUNNER_TEMP/d05-generated.log" 2>&1 || {
            echo D05_GENERATED=FAIL
            exit 1
          }
          echo D05_GENERATED=PASS
      - name: Full source gate without private log publication
        working-directory: site
        shell: bash
        run: |
          npm run check:source > "$RUNNER_TEMP/d05-source.log" 2>&1 || {
            echo D05_CHECK_SOURCE=FAIL
            node - <<'NODE'
          const fs=require("node:fs");
          const log=fs.readFileSync(process.env.RUNNER_TEMP+"/d05-source.log","utf8");
          const stages=[...log.matchAll(/> (?:cehovod|[^\s]+)@[^\n]+\n> ([a-zA-Z:.-]+)/g)].map(m=>m[1]);
          console.log("D05_LAST_SOURCE_STAGE="+String(stages.at(-1)||"unknown").replace(/[^A-Za-z0-9:.-]/g,""));
          NODE
            exit 1
          }
          echo D05_CHECK_SOURCE=PASS
      # Private source, dist, logs, browser data, screenshots and secrets remain
      # only on the ephemeral runner. No artifact upload or cache of source.
