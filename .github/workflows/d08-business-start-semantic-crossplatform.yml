name: D08 MarketOps P1 semantic Windows Linux matrix
on:
  push:
    branches: [work/2026-11-18-d08-marketops-windows-qualification]
    paths: [.github/workflows/d08-business-start-semantic-crossplatform.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  DOMAIN_SHA: f4c3f37cd2531aae339b28a11e08801f5e3d8832
  SITE_SHA: 78a0a4d163f46ab94857093f8137bfeaf4c4b071
jobs:
  p1-models:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify minimal read permission for only D08 private sources
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "D08_P1_DOMEN_MISSING"; exit 1; }
          gh api repos/Faust-S/market-ops --jq '.id' >/dev/null 2>&1 || exit 1
          gh api repos/Faust-S/market-ops.ru --jq '.id' >/dev/null 2>&1 || exit 1
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/market-ops
          ref: ${{ env.DOMAIN_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/domain
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/market-ops.ru
          ref: ${{ env.SITE_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm exact owners and identical canonical source files
        run: |
          test "$(git -C private/domain rev-parse HEAD)" = "$DOMAIN_SHA"
          test "$(git -C private/site rev-parse HEAD)" = "$SITE_SHA"
          for name in business-start-overview.mjs business-start-overview.d.mts iwxa-domain-boundaries.mjs iwxa-domain-boundaries.d.mts affordable-loss-gate.mjs affordable-loss-gate.d.mts business-project.mjs business-project.d.mts business-edit-intent.mjs business-edit-intent.d.mts business-experiment-comparison.mjs business-experiment-comparison.d.mts business-opening-paths.mjs business-opening-paths.d.mts business-launch-review.mjs business-launch-review.d.mts; do
            cmp -s "private/domain/model/$name" "private/site/src/lib/$name" || { echo "D08_P1_CANONICAL_DRIFT"; exit 1; }
          done
          for name in business-opening-paths.mjs business-opening-paths.d.mts business-experiment-comparison.mjs business-experiment-comparison.d.mts business-launch-review.mjs business-launch-review.d.mts business-project.mjs business-project.d.mts business-edit-intent.mjs business-edit-intent.d.mts affordable-loss-gate.mjs affordable-loss-gate.d.mts iwxa-domain-boundaries.mjs iwxa-domain-boundaries.d.mts; do
            cmp -s "private/site/src/lib/$name" "private/site/t2-site-module/marketops/decision/$name" || { echo "D08_P1_T2_EMBEDDED_BYTE_DRIFT"; exit 1; }
          done
          echo "D08_P1_CANONICAL_BYTE_EQUAL=PASS"
      - name: Run domain negative and anti-duplication tests
        working-directory: private/domain
        run: |
          cases=(business-start-overview iwxa-domain-boundaries affordable-loss-gate business-project business-edit-intent business-experiment-comparison business-opening-paths business-launch-review business-management-decision)
          args=(); for testname in "${cases[@]}"; do args+=("tests/${testname}.test.mjs"); done
          if ! node --test "${args[@]}" > "$RUNNER_TEMP/d08-private-domain.log" 2>&1; then
            for testname in "${cases[@]}"; do
              if node --test --test-reporter=tap "tests/${testname}.test.mjs" > "$RUNNER_TEMP/d08-case-check.private.log" 2>&1; then
                echo "D08_PRIVATE_TEST_${testname}=PASS"
              else
                echo "D08_PRIVATE_TEST_${testname}=FAIL"
                if [[ "$testname" == "business-opening-paths" ]]; then
                  grep -E '^[[:space:]]*not ok [0-9]+ ' "$RUNNER_TEMP/d08-case-check.private.log" | awk '{print "D08_OPENING_FAILED_CASE_INDEX="$3}' || true
                  if grep -q ERR_MODULE_NOT_FOUND "$RUNNER_TEMP/d08-case-check.private.log"; then echo "D08_OPENING_FAILURE_CLASS=MODULE"; fi
                  if grep -q ERR_ASSERTION "$RUNNER_TEMP/d08-case-check.private.log"; then echo "D08_OPENING_FAILURE_CLASS=ASSERT"; fi
                fi
              fi
            done
            echo "D08_P1_DOMAIN_MODEL_TESTS_FAIL"; exit 1
          fi
          echo "D08_P1_DOMAIN_MODEL_TESTS=PASS"
      - name: Run independent website projection tests
        working-directory: private/site
        run: |
          node --test tests/business-start-overview.test.mjs tests/iwxa-domain-boundaries.test.mjs tests/affordable-loss-gate.test.mjs tests/business-project.test.mjs tests/business-experiment-comparison.test.mjs tests/business-opening-paths.test.mjs tests/business-management-decision.test.mjs tests/business-launch-review.test.mjs > "$RUNNER_TEMP/d08-private-site.log" 2>&1 || { echo "D08_P1_SITE_PROJECTION_TESTS_FAIL"; exit 1; }
          echo "D08_P1_SITE_PROJECTION_TESTS=PASS"
      - name: Keep runner logs and sources private
        if: always()
        run: |
          echo "D08_P1_PRIVATE_CODE_PUBLISHED=NO"
          echo "D08_P1_PRIVATE_LOGS_PUBLISHED=NO"
          echo "D08_P1_ARTIFACTS_UPLOADED=0"
