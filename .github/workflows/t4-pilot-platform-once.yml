name: T4 native pilot original Runtime platform lifetime
on:
  push:
    branches: ['ci/once/t4-pilot-platform/683b8c14adee']
permissions:
  contents: read
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 683b8c14adeef650d7eb5901f0ff1865267f68b6
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact public candidate and changed assembly contracts
        run: |
          test "$(git rev-parse HEAD)" = "683b8c14adeef650d7eb5901f0ff1865267f68b6"
          npm ci --prefix packages/t3-core --ignore-scripts --no-audit --no-fund
          timeout 120s node --test --test-timeout=90000 packages/t3-core/tests/installed-kernel-candidate.test.mjs packages/t3-core/tests/t3-d1-signed-control-dist.test.mjs packages/t4-network/tests/original-installed-product-passport.test.mjs
          npm --prefix packages/t3-core run build
      - name: Both native pilot passports and natural platform shutdown
        shell: bash
        run: |
          set -euo pipefail
          ZIP=packages/t3-core/qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip
          echo "7075b8b9590ef1283e34ecb3c21dd9d1b7342697287e1aa150cd4f4a60860b68  $ZIP" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/qualified-t2"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/qualified-t2"
          npm install --prefix "$RUNNER_TEMP/t4-platform" --ignore-scripts --no-audit --no-fund --save-exact fake-indexeddb@6.2.4
          export IWXA_COMPANY_TEST_QUALIFIED_T2="$RUNNER_TEMP/qualified-t2"
          export IWXA_COMPANY_TEST_IDB_MODULE="$RUNNER_TEMP/t4-platform/node_modules/fake-indexeddb/build/esm/index.js"
          export IWXA_COMPANY_TEST_COMPILED_T3="$GITHUB_WORKSPACE/packages/t3-core/dist"
          timeout 90s node --experimental-strip-types --test --test-timeout=60000 --test-name-pattern='native pilot passports' packages/t3-core/tests/t3-company-original-runtime-roundtrip.test.mjs
