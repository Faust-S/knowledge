name: AKIS Mesa 3.5.2 R1-V2B extended author subjects

on:
  push:
    branches:
      - work/2026-11-23-akis-r1v2b-sector-public-person-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-native-mesa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install official original Mesa 3.5.2
        run: |
          python -m pip install --disable-pip-version-check "mesa==3.5.2" "pytest>=8,<10"
          python -c "import mesa; assert mesa.__version__ == '3.5.2'; print('ORIGINAL_MESA_3_5_2_PASS')"
      - name: Compile original model and source-rights tests
        run: |
          python -m compileall -q qualifications/akis_2026_11_21/research
      - name: Full AKIS native regression and extended actor negative scenarios
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: |
          python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests
