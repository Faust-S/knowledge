name: D01 hosting freeze - original T2 and T3 candidate
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/once/d01-hosting-freeze/**'
    paths:
      - '.github/ci-requests/d01-hosting-freeze.json'
concurrency:
  group: d01-learn-t3-compile-diagnosis
  # Finish the running candidate. GitHub keeps at most one pending run in
  # this group, replacing an older pending candidate when a new one is queued.
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  t3:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false)
    name: T3 original platform and offline candidate qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    env:
      D01_T2_SOURCE: ${{ github.workspace }}/private/t2/t2/current/final-successor/canonical-source
    steps:
      - name: Checkout public request guard only
        uses: actions/checkout@v4
        with:
          path: ci-harness
          persist-credentials: false
          fetch-depth: 2
      - name: Verify deliberate immutable request before private checkout
        working-directory: ci-harness
        run: |
          python3 tools/ci/verify_once_request.py \
            --repository Faust-S/knowledge --workflow d01-hosting-freeze \
            --profile full-hosting-qualification \
            --revision site=b07665d98fcd87ef06be2edd907b8ad9470f745e \
            --revision subject=1e8700f4fd6f11c50db154f9f080b2406bef02ec \
            --revision t2=39a0b3205ea45a55c3db45b99f5bcf4f0283aef1 \
            --revision core=326f725c44d69ac99f6b912241e9e8a6c3d716a5 \
            --revision assistant=5e3083788aa541921559de29d3457d4a52bbba00
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/learn.iwxa.ru
          ref: b07665d98fcd87ef06be2edd907b8ad9470f745e
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 326f725c44d69ac99f6b912241e9e8a6c3d716a5
          persist-credentials: false
          path: original/core
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 5e3083788aa541921559de29d3457d4a52bbba00
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/assistant
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: 39a0b3205ea45a55c3db45b99f5bcf4f0283aef1
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/t2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Verify exact T3, assistant, site and browser-tool revisions
        shell: bash
        run: |
          set -eu
          test "$(git -C private/site rev-parse HEAD)" = b07665d98fcd87ef06be2edd907b8ad9470f745e
          test "$(git -C original/core rev-parse HEAD)" = 326f725c44d69ac99f6b912241e9e8a6c3d716a5
          test "$(git -C private/assistant rev-parse HEAD)" = 5e3083788aa541921559de29d3457d4a52bbba00
          test "$(git -C private/t2 rev-parse HEAD)" = 39a0b3205ea45a55c3db45b99f5bcf4f0283aef1
      - name: Obtain the original pinned portable T3 input
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Faust-S/knowledge
          run-id: 45395047723
          name: iwxa-t3-mobile-portable-candidate-326f725c44d69ac99f6b912241e9e8a6c3d716a5
          path: original/artifact
      - name: T3 source and original offline controller tests
        shell: bash
        run: |
          set -eu
          node --test --test-reporter=tap original/core/packages/t3-core/tests/t3-domain-offline.test.mjs >"$RUNNER_TEMP/d01-t3-core.log" 2>&1 || { grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-t3-core.log" | cut -c1-160 || true; echo D01_SOURCE_TEST_FAIL; exit 1; }
          grep -E '^(# |ℹ )(tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-t3-core.log" || true
          cd private/site
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/d01-t3-deps.log" 2>&1 || { echo D01_T3_DEPENDENCY_FAIL; exit 1; }
          npm run test:learn-t3-assembly >"$RUNNER_TEMP/d01-t3-tests.log" 2>&1 || { grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-t3-tests.log" | cut -c1-160 || true; echo D01_SOURCE_TEST_FAIL; exit 1; }
          npm run t3:skills:check >"$RUNNER_TEMP/d01-t3-skills.log" 2>&1 || { echo D01_T3_SKILLS_FAIL; exit 1; }
          grep -E '^(# |ℹ )(tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-t3-tests.log" || true
      - name: T3 prepare one compiled original Host and retained inputs
        id: prepare
        timeout-minutes: 45
        working-directory: private/site
        shell: bash
        run: |
          set -eu
          expected=b778474d011b34a77cd60b945f02295fb24654c833f3ab12ff36bd3c0bdd8863
          mapfile -t archives < <(find "$GITHUB_WORKSPACE/original/artifact" -type f -name '*.zip' -print0 | xargs -0 -r sha256sum | awk -v expected="$expected" '$1==expected {print substr($0,67)}')
          test "${#archives[@]}" = 1 || { echo D01_T3_EXACT_INNER_ARCHIVE_MISSING; exit 1; }
          archive="${archives[0]}"
          npm run t3:host:prepare -- "$GITHUB_WORKSPACE/original/core/packages/t3-core" "$RUNNER_TEMP/d01-t3-host" "$archive" "$GITHUB_WORKSPACE/private/assistant" >"$RUNNER_TEMP/d01-t3-host.log" 2>&1 || { echo D01_T3_PREPARE_FAILED; grep -Eo '[A-Za-z0-9_.-]+\.(tsx?|mts|cts)\([0-9]+,[0-9]+\): error TS[0-9]+' "$RUNNER_TEMP/d01-t3-host.log" | sort -u | head -40 || true; grep -Eo 'D01_[A-Z0-9_]+|T3_[A-Z0-9_]+|error TS[0-9]+' "$RUNNER_TEMP/d01-t3-host.log" | sort -u | tail -20 || true; exit 1; }
          npm run t3:inputs:retain -- "$RUNNER_TEMP/d01-t3-host" "$archive" >"$RUNNER_TEMP/d01-t3-retain.log" 2>&1 || { echo D01_T3_RETAIN_FAILED; exit 1; }
          echo D01_T3_EXACT_INPUTS_RETAINED
      - name: T3 exact complete hosting build and offline manifest
        id: t3build
        timeout-minutes: 25
        working-directory: private/site
        shell: bash
        run: |
          npm run build:product:t3 >"$RUNNER_TEMP/d01-t3-build.log" 2>&1 || {
            echo D01_T3_BUILD_FAILED
            grep '^D01_OFFLINE_LINK=' "$RUNNER_TEMP/d01-t3-build.log" | python3 -c 'import json,sys; pairs=set(); [pairs.add((x.get("tag"),x.get("target"),x.get("canonical"))) for line in sys.stdin if (x:=json.loads(line.split("=",1)[1])) and all(isinstance(x.get(k),str) and len(x[k])<200 and not any(c in x[k] for c in ("?","#","\n","\r")) for k in ("tag","target","canonical"))]; print(json.dumps(sorted(pairs),ensure_ascii=True))' || true
            grep -E '^(✖|not ok|ℹ (tests|pass|fail|skipped) |# (tests|pass|fail|skipped) )' "$RUNNER_TEMP/d01-t3-build.log" | cut -c1-160 | head -40 || true
            grep -Eo '(D01_|T3_|ERR_)[A-Z0-9_]+(:[A-Z0-9_]+)*|[A-Za-z0-9_.-]+\.(mjs|js|tsx?|mts|cts):[0-9]+:[0-9]+|AssertionError|TypeError|ReferenceError|SyntaxError|ENOENT|EACCES|MODULE_NOT_FOUND' "$RUNNER_TEMP/d01-t3-build.log" | sort -u | head -80 || true
            exit 1
          }
          npm run verify:hosting-dist
          npm run audit:links
      - name: T3 browser prerequisites
        id: t3browser
        timeout-minutes: 20
        shell: bash
        run: |
          cd "$D01_T2_SOURCE"
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/d01-t3-browser-deps.log" 2>&1 || { echo D01_T3_BROWSER_DEPS_FAIL; exit 1; }
          npx playwright install --with-deps chromium >"$RUNNER_TEMP/d01-t3-browser-install.log" 2>&1 || { echo D01_T3_BROWSER_INSTALL_FAIL; exit 1; }
      - name: T3 actual offline install, saved Study goal and cold browser restart
        timeout-minutes: 30
        working-directory: private/site
        shell: bash
        run: |
          node qa/d01-product-witness-2026-10-26/t3-offline-witness.mjs >"$RUNNER_TEMP/d01-t3-offline.log" 2>&1 || { grep -E '^D01_T3_|^AssertionError|^Error: D01_T3_' "$RUNNER_TEMP/d01-t3-offline.log" | cut -c1-200 | tail -15; exit 1; }
          grep '^D01_T3_' "$RUNNER_TEMP/d01-t3-offline.log"
      # Model installation and real WebGPU inference are separate user-consented
      # device qualifications. No claim of real-model or domain acceptance here.
