name: D01 exact local T3 hosting and browser diagnostic
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/once/d01-hosting-freeze/**'
    paths:
      - '.github/ci-requests/d01-hosting-freeze.json'
concurrency:
  group: d01-learn-t3-first-user-isolated
  # Finish the running candidate. GitHub keeps at most one pending run in
  # this group, replacing an older pending candidate when a new one is queued.
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  t3:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false)
    name: Exact local build and browser diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      D01_T2_SOURCE: ${{ github.workspace }}/private/t2/t2/current/final-successor/canonical-source
    steps:
      - name: Checkout public request guard only
        uses: actions/checkout@v4
        with:
          path: ci-harness
          persist-credentials: false
          fetch-depth: 2
      - name: Verify deliberate immutable request before private checkout
        working-directory: ci-harness
        run: |
          python3 tools/ci/verify_once_request.py \
            --repository Faust-S/knowledge --workflow d01-hosting-freeze \
            --profile exact-local-t3-hosting-and-browser-diagnostic \
            --revision site=ccca0e9580684558020fbe70689eb55313c969b3 \
            --revision subject=1e8700f4fd6f11c50db154f9f080b2406bef02ec \
            --revision t2=39a0b3205ea45a55c3db45b99f5bcf4f0283aef1 \
            --revision core=326f725c44d69ac99f6b912241e9e8a6c3d716a5 \
            --revision assistant=5e3083788aa541921559de29d3457d4a52bbba00
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/learn.iwxa.ru
          ref: ccca0e9580684558020fbe70689eb55313c969b3
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 326f725c44d69ac99f6b912241e9e8a6c3d716a5
          persist-credentials: false
          path: original/core
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 5e3083788aa541921559de29d3457d4a52bbba00
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/assistant
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: 39a0b3205ea45a55c3db45b99f5bcf4f0283aef1
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/t2
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/learn
          ref: 1e8700f4fd6f11c50db154f9f080b2406bef02ec
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/domain
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Verify exact T3, assistant, site and browser-tool revisions
        shell: bash
        run: |
          set -eu
          test "$(git -C private/site rev-parse HEAD)" = ccca0e9580684558020fbe70689eb55313c969b3
          test "$(git -C private/domain rev-parse HEAD)" = 1e8700f4fd6f11c50db154f9f080b2406bef02ec
          test "$(git -C original/core rev-parse HEAD)" = 326f725c44d69ac99f6b912241e9e8a6c3d716a5
          test "$(git -C private/assistant rev-parse HEAD)" = 5e3083788aa541921559de29d3457d4a52bbba00
          test "$(git -C private/t2 rev-parse HEAD)" = 39a0b3205ea45a55c3db45b99f5bcf4f0283aef1
      - name: Obtain the original pinned portable T3 input
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Faust-S/knowledge
          run-id: 45395047723
          name: iwxa-t3-mobile-portable-candidate-326f725c44d69ac99f6b912241e9e8a6c3d716a5
          path: original/artifact
      - name: T3 source and original offline controller tests
        shell: bash
        run: |
          set -eu
          node --test --test-reporter=tap original/core/packages/t3-core/tests/t3-domain-offline.test.mjs >"$RUNNER_TEMP/d01-t3-core.log" 2>&1 || { grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-t3-core.log" | cut -c1-160 || true; echo D01_SOURCE_TEST_FAIL; exit 1; }
          grep -E '^(# |ℹ )(tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-t3-core.log" || true
          cd private/site
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/d01-t3-deps.log" 2>&1 || { echo D01_T3_DEPENDENCY_FAIL; exit 1; }
          node --test --test-reporter=tap scripts/test-practice-model-write.mjs scripts/test-study-form-navigation.mjs scripts/test-practice-history.mjs scripts/test-learn-workspace-regression.mjs scripts/test-first-use-profile.mjs scripts/test-learn-exact-workspace.mjs scripts/test-practice-program-write.mjs scripts/test-practice-session-start.mjs scripts/test-practice-workspace-selection.mjs scripts/test-mind-complete-history.mjs scripts/test-custom-practice-launch.mjs scripts/test-browser-product-origin.mjs >"$RUNNER_TEMP/d01-t3-journey-regression.log" 2>&1 || { grep -E '^not ok|^# (tests|pass|fail) ' "$RUNNER_TEMP/d01-t3-journey-regression.log" | cut -c1-160 || true; echo D01_T3_JOURNEY_REGRESSION_FAIL; exit 1; }
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/d01-t3-journey-regression.log"
          npm run test:learn-t3-assembly >"$RUNNER_TEMP/d01-t3-tests.log" 2>&1 || { grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-t3-tests.log" | cut -c1-160 || true; echo D01_SOURCE_TEST_FAIL; exit 1; }
          npm run t3:skills:check >"$RUNNER_TEMP/d01-t3-skills.log" 2>&1 || { echo D01_T3_SKILLS_FAIL; exit 1; }
          grep -E '^(# |ℹ )(tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-t3-tests.log" || true
      - name: T3 prepare one compiled original Host and retained inputs
        id: prepare
        timeout-minutes: 45
        working-directory: private/site
        shell: bash
        run: |
          set -eu
          expected=b778474d011b34a77cd60b945f02295fb24654c833f3ab12ff36bd3c0bdd8863
          mapfile -t archives < <(find "$GITHUB_WORKSPACE/original/artifact" -type f -name '*.zip' -print0 | xargs -0 -r sha256sum | awk -v expected="$expected" '$1==expected {print substr($0,67)}')
          test "${#archives[@]}" = 1 || { echo D01_T3_EXACT_INNER_ARCHIVE_MISSING; exit 1; }
          archive="${archives[0]}"
          npm run t3:host:prepare -- "$GITHUB_WORKSPACE/original/core/packages/t3-core" "$RUNNER_TEMP/d01-t3-host" "$archive" "$GITHUB_WORKSPACE/private/assistant" >"$RUNNER_TEMP/d01-t3-host.log" 2>&1 || { echo D01_T3_PREPARE_FAILED; grep -Eo '[A-Za-z0-9_.-]+\.(tsx?|mts|cts)\([0-9]+,[0-9]+\): error TS[0-9]+' "$RUNNER_TEMP/d01-t3-host.log" | sort -u | head -40 || true; grep -Eo 'D01_[A-Z0-9_]+|T3_[A-Z0-9_]+|error TS[0-9]+' "$RUNNER_TEMP/d01-t3-host.log" | sort -u | tail -20 || true; exit 1; }
          npm run t3:inputs:retain -- "$RUNNER_TEMP/d01-t3-host" "$archive" >"$RUNNER_TEMP/d01-t3-retain.log" 2>&1 || { echo D01_T3_RETAIN_FAILED; exit 1; }
          echo D01_T3_EXACT_INPUTS_RETAINED
      - name: T3 exact complete hosting build and offline manifest
        id: t3build
        timeout-minutes: 25
        working-directory: private/site
        shell: bash
        run: |
          npm run build >"$RUNNER_TEMP/d01-t3-build.log" 2>&1 || {
            echo D01_T3_BUILD_FAILED
            grep '^D01_OFFLINE_LINK=' "$RUNNER_TEMP/d01-t3-build.log" | python3 -c 'import json,sys; pairs=set(); [pairs.add((x.get("tag"),x.get("target"),x.get("canonical"))) for line in sys.stdin if (x:=json.loads(line.split("=",1)[1])) and all(isinstance(x.get(k),str) and len(x[k])<200 and not any(c in x[k] for c in ("?","#","\n","\r")) for k in ("tag","target","canonical"))]; print(json.dumps(sorted(pairs),ensure_ascii=True))' || true
            grep -E '^(✖|not ok|ℹ (tests|pass|fail|skipped) |# (tests|pass|fail|skipped) )' "$RUNNER_TEMP/d01-t3-build.log" | cut -c1-160 | head -40 || true
            grep -Eo '(D01_|T3_|ERR_)[A-Z0-9_]+(:[A-Z0-9_]+)*|[A-Za-z0-9_.-]+\.(mjs|js|tsx?|mts|cts):[0-9]+:[0-9]+|AssertionError|TypeError|ReferenceError|SyntaxError|ENOENT|EACCES|MODULE_NOT_FOUND' "$RUNNER_TEMP/d01-t3-build.log" | sort -u | head -80 || true
            exit 1
          }
          grep '^D01_T3_ORIGINAL_KERNEL_PASSPORTS=' "$RUNNER_TEMP/d01-t3-build.log"
          npm run verify:hosting-dist
          npm run audit:links
      - name: Isolated retained-input build witness tests
        working-directory: private/site
        shell: bash
        run: |
          node --test --test-reporter=tap scripts/test-learn-t3-reproducibility.mjs >"$RUNNER_TEMP/d01-t3-repro-tests.log" 2>&1 || { echo D01_T3_REPRO_UNIT_FAIL; grep -E '^(not ok|# (tests|pass|fail) )' "$RUNNER_TEMP/d01-t3-repro-tests.log" | cut -c1-180; exit 1; }
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/d01-t3-repro-tests.log"
      - name: Two isolated ordinary builds with original checkouts unavailable
        working-directory: private/site
        timeout-minutes: 25
        shell: bash
        run: |
          set -eu
          # A private mount namespace masks the original source trees and
          # prepared temporary Host; the network namespace has loopback only.
          # The tested site keeps its own retained, verified inputs.
          sudo -n unshare --mount --net --propagation private -- bash -euc '
            ip link set lo up
            empty=$(mktemp -d)
            chmod 755 "$empty"
            trap "rmdir \"$empty\"" EXIT
            for p in "$3/original" "$3/private/assistant" "$3/private/t2" "$3/private/domain" "$4/d01-t3-host"; do
              test -d "$p" || exit 1
              mount --bind "$empty" "$p"
            done
            runuser -u "$1" -- "$2" scripts/verify-learn-t3-reproducibility.mjs
          ' _ "$(id -un)" "$(command -v node)" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" >"$RUNNER_TEMP/d01-t3-repro.log" 2>&1 || {
            echo D01_T3_REPRO_FAIL
            grep -Eo '(D01_|T3_|ERR_)[A-Z0-9_]+(:[A-Z0-9_]+)*|AssertionError|TypeError|ReferenceError|SyntaxError|ENOENT|EACCES|MODULE_NOT_FOUND|Operation not permitted' "$RUNNER_TEMP/d01-t3-repro.log" | sort -u | head -80 || true
            grep -Eo 'D01_T3_REPRO_DIST_MISMATCH:\{"added":[0-9]+,"removed":[0-9]+,"changed":[0-9]+\}' "$RUNNER_TEMP/d01-t3-repro.log" | head -5 || true
            exit 1
          }
          grep '^D01_T3_REPRODUCTION=' "$RUNNER_TEMP/d01-t3-repro.log"

      - name: Preserve verified build inputs only in the private Learn repository
        id: retained
        continue-on-error: true
        working-directory: private/site
        env:
          D01_SITE_TOKEN: ${{ secrets.DOMEN }}
          D01_SITE_REVISION: 'ccca0e9580684558020fbe70689eb55313c969b3'
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/ci-harness/tools/ci/retain-d01-private-inputs.py"
      - name: T3 browser prerequisites
        id: t3browser
        if: ${{ always() && !cancelled() && steps.t3build.outcome == 'success' }}
        timeout-minutes: 20
        shell: bash
        run: |
          cd "$D01_T2_SOURCE"
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/d01-t3-browser-deps.log" 2>&1 || { echo D01_T3_BROWSER_DEPS_FAIL; exit 1; }
          npx playwright install --with-deps chromium >"$RUNNER_TEMP/d01-t3-browser-install.log" 2>&1 || {
            echo D01_T3_BROWSER_INSTALL_FAIL
            grep -E '(^Error:|^E:|HTTP [45][0-9][0-9]|Download failure|ECONN|ETIMEDOUT)' "$RUNNER_TEMP/d01-t3-browser-install.log" | cut -c1-160 | tail -12 || true
            exit 1
          }
      - name: Desktop and mobile real browser audit on the unchanged current T3 candidate
        if: ${{ always() && !cancelled() && steps.t3browser.outcome == 'success' }}
        timeout-minutes: 75
        working-directory: private/site
        env:
          D01_BROWSER_AUDIT_BUDGET_MS: '3900000'
        shell: bash
        run: |
          set +e
          node scripts/audit-browser-navigation.mjs >"$RUNNER_TEMP/d01-navigation.log" 2>&1
          code=$?
          set -e
          grep -E '^D01_BROWSER_(REALM_COVERAGE|PAGE_COVERAGE|NAV_AUDIT|CHECKPOINT|NAV_FINDING|LINK_PROGRESS)=' "$RUNNER_TEMP/d01-navigation.log" | cut -c1-2400 | tail -150 || true
          grep -E '^D01_PRODUCT_ROUTE_TRANSIENT=' "$RUNNER_TEMP/d01-navigation.log" | cut -c1-250 | head -30 || true
          echo "D01_BROWSER_DIAGNOSTIC_EXIT=$code"
          exit "$code"
