name: D01 Learn assessment context declaration
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/once/d01-hosting-freeze/**'
    paths:
      - '.github/ci-requests/d01-hosting-freeze.json'
permissions:
  contents: read
jobs:
  source:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci-harness
          persist-credentials: false
          fetch-depth: 2
      - name: Verify deliberate immutable request before private checkout
        working-directory: ci-harness
        run: python3 tools/ci/verify_once_request.py --repository Faust-S/knowledge --workflow d01-hosting-freeze --profile learn-assessment-context-source --revision site=6e5a50dacece088ff604fb8435ea4016fd21522f
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/learn.iwxa.ru
          ref: 6e5a50dacece088ff604fb8435ea4016fd21522f
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Verify exact Learn assessment and knowledge contracts
        working-directory: private/site
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = 6e5a50dacece088ff604fb8435ea4016fd21522f
          node --test --test-reporter=tap scripts/test-learn-t3-assembly.mjs scripts/test-learn-assistant-skills.mjs >"$RUNNER_TEMP/learn.log" 2>&1 || { grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/learn.log" | cut -c1-160 || true; exit 1; }
          grep -E '^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/learn.log"
          echo D01_ASSESSMENT_DECLARATION=PASS
