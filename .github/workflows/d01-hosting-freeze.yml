name: D01 frozen T3 1.2.8 candidate complete qualification
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/once/d01-hosting-freeze/**'
    paths:
      - '.github/ci-requests/d01-hosting-freeze.json'
concurrency:
  group: d01-learn-frozen-candidate
  # Finish the running candidate. GitHub keeps at most one pending run in
  # this group, replacing an older pending candidate when a new one is queued.
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  t3:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false)
    name: Exact Learn T3 ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        lane: [functional, audit, model]
    permissions:
      contents: read
      actions: read
    env:
      D01_T3_REQUIRE_STABLE_HOST: '1'
      D01_T2_SOURCE: ${{ github.workspace }}/private/t2/t2/current/final-successor/canonical-source
    steps:
      - name: Checkout public request guard only
        uses: actions/checkout@v4
        with:
          path: ci-harness
          persist-credentials: false
          fetch-depth: 2
      - name: Verify deliberate immutable request before private checkout
        working-directory: ci-harness
        run: |
          python3 tools/ci/verify_once_request.py \
            --repository Faust-S/knowledge --workflow d01-hosting-freeze \
            --profile learn-frozen-t3-candidate-1-2-8 \
            --revision site=1057804a8ba68a1d3c9d0173aa615e1a53b51c46 \
            --revision subject=77336a8a481005dda0c10c0df9a9f56655fb3fc6 \
            --revision t2=39a0b3205ea45a55c3db45b99f5bcf4f0283aef1 \
            --revision core=8f55367b3c8f310aad4e3217fe0b53b6950ce220 \
            --revision assistant=5419dacf855d81ec089acc23bae0c7aa11713a54
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/learn.iwxa.ru
          ref: 1057804a8ba68a1d3c9d0173aa615e1a53b51c46
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 8f55367b3c8f310aad4e3217fe0b53b6950ce220
          persist-credentials: false
          path: original/core
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 5419dacf855d81ec089acc23bae0c7aa11713a54
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/assistant
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: 39a0b3205ea45a55c3db45b99f5bcf4f0283aef1
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/t2
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/learn
          ref: 77336a8a481005dda0c10c0df9a9f56655fb3fc6
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/domain
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Verify exact T3, assistant, site and browser-tool revisions
        shell: bash
        run: |
          set -eu
          test "$(git -C private/site rev-parse HEAD)" = 1057804a8ba68a1d3c9d0173aa615e1a53b51c46
          test "$(git -C private/domain rev-parse HEAD)" = 77336a8a481005dda0c10c0df9a9f56655fb3fc6
          test "$(git -C original/core rev-parse HEAD)" = 8f55367b3c8f310aad4e3217fe0b53b6950ce220
          test "$(git -C private/assistant rev-parse HEAD)" = 5419dacf855d81ec089acc23bae0c7aa11713a54
          test "$(git -C private/t2 rev-parse HEAD)" = 39a0b3205ea45a55c3db45b99f5bcf4f0283aef1
      - name: Original assistant complete regression
        working-directory: private/assistant
        shell: bash
        run: |
          node --check browser-local-inference/domain-assistant/main.mjs
          node --test --test-reporter=tap browser-local-inference/tests/domain-assistant-*.test.mjs >"$RUNNER_TEMP/d01-assistant-source.log" 2>&1 || { grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-assistant-source.log" | cut -c1-180; exit 1; }
          grep -E '^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-assistant-source.log"
      - name: Obtain the original pinned portable T3 input
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Faust-S/knowledge
          run-id: 45990975472
          name: iwxa-t3-mobile-portable-candidate-8f55367b3c8f310aad4e3217fe0b53b6950ce220
          path: original/artifact
      - name: Exact original subject knowledge and consultation corpus
        shell: bash
        run: |
          set -eu
          cd private/domain
          node --test --test-reporter=tap tests/assistant-skills.test.mjs >"$RUNNER_TEMP/d01-subject-assistant.log" 2>&1 || { grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-subject-assistant.log" | cut -c1-160 || true; exit 1; }
          grep -E '^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-subject-assistant.log"
          node scripts/learn-skill-authoring.mjs check >/dev/null
          cmp models/assistant-skills.json ../site/assets/learn-assistant-skills.json
          cmp models/assistant-service-scope.json ../site/scripts/t3-inputs/assistant-service-scope.json
          cmp models/assistant-query-routing-cases.json ../site/qa/d01-product-witness-2026-10-26/assistant-query-routing-cases.json
          cmp models/assistant-consultation-cases.json ../site/qa/d01-product-witness-2026-10-26/assistant-consultation-cases.json
          cmp verification/t3-assistant/skill-runtime.mjs ../assistant/browser-local-inference/domain-assistant/skill-runtime.mjs
          cmp verification/t3-assistant/skill-runtime.mjs ../site/scripts/t3-inputs/original-skill-runtime.mjs
          echo D01_ASSISTANT_EXACT_PROJECTION=PASS
      - name: T3 source and original offline controller tests
        shell: bash
        run: |
          set -eu
          node --test --test-reporter=tap original/core/packages/t3-core/tests/t3-domain-offline.test.mjs >"$RUNNER_TEMP/d01-t3-core.log" 2>&1 || { grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-t3-core.log" | cut -c1-160 || true; echo D01_SOURCE_TEST_FAIL; exit 1; }
          grep -E '^(# |ℹ )(tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-t3-core.log" || true
          cd private/site
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/d01-t3-deps.log" 2>&1 || { echo D01_T3_DEPENDENCY_FAIL; exit 1; }
          node --test --test-reporter=tap scripts/test-practice-model-write.mjs scripts/test-study-form-navigation.mjs scripts/test-practice-history.mjs scripts/test-learn-workspace-regression.mjs scripts/test-first-use-profile.mjs scripts/test-learn-exact-workspace.mjs scripts/test-practice-program-write.mjs scripts/test-practice-session-start.mjs scripts/test-practice-workspace-selection.mjs scripts/test-mind-complete-history.mjs scripts/test-custom-practice-launch.mjs scripts/test-browser-product-origin.mjs >"$RUNNER_TEMP/d01-t3-journey-regression.log" 2>&1 || { grep -E '^not ok|^# (tests|pass|fail) ' "$RUNNER_TEMP/d01-t3-journey-regression.log" | cut -c1-160 || true; echo D01_T3_JOURNEY_REGRESSION_FAIL; exit 1; }
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/d01-t3-journey-regression.log"
          npm run test:learn-t3-assembly >"$RUNNER_TEMP/d01-t3-tests.log" 2>&1 || { grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-t3-tests.log" | cut -c1-160 || true; echo D01_SOURCE_TEST_FAIL; exit 1; }
          npm run t3:skills:check >"$RUNNER_TEMP/d01-t3-skills.log" 2>&1 || { echo D01_T3_SKILLS_FAIL; exit 1; }
          grep -E '^(# |ℹ )(tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-t3-tests.log" || true
      - name: T3 prepare one compiled original Host and retained inputs
        id: prepare
        timeout-minutes: 45
        working-directory: private/site
        shell: bash
        run: |
          set -eu
          expected=c153df67ed0f4665d43404bb7952f2b86ffbb7ab6169b4838d10f008836684b6
          mapfile -t archives < <(find "$GITHUB_WORKSPACE/original/artifact" -type f -name '*.zip' -print0 | xargs -0 -r sha256sum | awk -v expected="$expected" '$1==expected {print substr($0,67)}')
          test "${#archives[@]}" = 1 || { echo D01_T3_EXACT_INNER_ARCHIVE_MISSING; exit 1; }
          archive="${archives[0]}"
          npm run t3:host:prepare -- "$GITHUB_WORKSPACE/original/core/packages/t3-core" "$RUNNER_TEMP/d01-t3-host" "$archive" "$GITHUB_WORKSPACE/private/assistant" >"$RUNNER_TEMP/d01-t3-host.log" 2>&1 || { echo D01_T3_PREPARE_FAILED; grep -Eo '[A-Za-z0-9_.-]+\.(tsx?|mts|cts)\([0-9]+,[0-9]+\): error TS[0-9]+' "$RUNNER_TEMP/d01-t3-host.log" | sort -u | head -40 || true; grep -Eo 'D01_[A-Z0-9_]+|T3_[A-Z0-9_]+|error TS[0-9]+' "$RUNNER_TEMP/d01-t3-host.log" | sort -u | tail -20 || true; exit 1; }
          npm run t3:inputs:retain -- "$RUNNER_TEMP/d01-t3-host" "$archive" >"$RUNNER_TEMP/d01-t3-retain.log" 2>&1 || { echo D01_T3_RETAIN_FAILED; exit 1; }
          echo D01_T3_EXACT_INPUTS_RETAINED
      - name: T3 exact complete hosting build and offline manifest
        id: t3build
        timeout-minutes: 25
        working-directory: private/site
        shell: bash
        run: |
          npm run build:product:t3 >"$RUNNER_TEMP/d01-t3-build.log" 2>&1 || {
            echo D01_T3_BUILD_FAILED
            grep '^D01_OFFLINE_LINK=' "$RUNNER_TEMP/d01-t3-build.log" | python3 -c 'import json,sys; pairs=set(); [pairs.add((x.get("tag"),x.get("target"),x.get("canonical"))) for line in sys.stdin if (x:=json.loads(line.split("=",1)[1])) and all(isinstance(x.get(k),str) and len(x[k])<200 and not any(c in x[k] for c in ("?","#","\n","\r")) for k in ("tag","target","canonical"))]; print(json.dumps(sorted(pairs),ensure_ascii=True))' || true
            grep -E '^(✖|not ok|ℹ (tests|pass|fail|skipped) |# (tests|pass|fail|skipped) )' "$RUNNER_TEMP/d01-t3-build.log" | cut -c1-160 | head -40 || true
            grep -Eo '(D01_|T3_|ERR_)[A-Z0-9_]+(:[A-Z0-9_]+)*|[A-Za-z0-9_.-]+\.(mjs|js|tsx?|mts|cts):[0-9]+:[0-9]+|AssertionError|TypeError|ReferenceError|SyntaxError|ENOENT|EACCES|MODULE_NOT_FOUND' "$RUNNER_TEMP/d01-t3-build.log" | sort -u | head -80 || true
            exit 1
          }
          grep -E '^(# |ℹ )(tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-t3-build.log" || true
          grep '^D01_T3_ORIGINAL_KERNEL_PASSPORTS=' "$RUNNER_TEMP/d01-t3-build.log"
          npm run verify:hosting-dist
          npm run audit:links
      - name: Isolated retained-input build witness tests
        if: matrix.lane == 'functional'
        working-directory: private/site
        shell: bash
        run: |
          node --test --test-reporter=tap scripts/test-learn-t3-reproducibility.mjs >"$RUNNER_TEMP/d01-t3-repro-tests.log" 2>&1 || { echo D01_T3_REPRO_UNIT_FAIL; grep -E '^(not ok|# (tests|pass|fail) )' "$RUNNER_TEMP/d01-t3-repro-tests.log" | cut -c1-180; exit 1; }
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/d01-t3-repro-tests.log"
      - name: Two isolated ordinary builds with original checkouts unavailable
        if: matrix.lane == 'functional'
        working-directory: private/site
        timeout-minutes: 25
        shell: bash
        run: |
          set -eu
          # A private mount namespace masks the original source trees and
          # prepared temporary Host; the network namespace has loopback only.
          # The tested site keeps its own retained, verified inputs.
          sudo -n unshare --mount --net --propagation private -- bash -euc '
            ip link set lo up
            empty=$(mktemp -d)
            chmod 755 "$empty"
            trap "rmdir \"$empty\"" EXIT
            for p in "$3/original" "$3/private/assistant" "$3/private/t2" "$3/private/domain" "$4/d01-t3-host"; do
              test -d "$p" || exit 1
              mount --bind "$empty" "$p"
            done
            runuser -u "$1" -- "$2" scripts/verify-learn-t3-reproducibility.mjs
          ' _ "$(id -un)" "$(command -v node)" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" >"$RUNNER_TEMP/d01-t3-repro.log" 2>&1 || {
            echo D01_T3_REPRO_FAIL
            grep -Eo '(D01_|T3_|ERR_)[A-Z0-9_]+(:[A-Z0-9_]+)*|AssertionError|TypeError|ReferenceError|SyntaxError|ENOENT|EACCES|MODULE_NOT_FOUND|Operation not permitted' "$RUNNER_TEMP/d01-t3-repro.log" | sort -u | head -80 || true
            grep -Eo 'D01_T3_REPRO_DIST_MISMATCH:\{"added":[0-9]+,"removed":[0-9]+,"changed":[0-9]+\}' "$RUNNER_TEMP/d01-t3-repro.log" | head -5 || true
            exit 1
          }
          grep '^D01_T3_REPRODUCTION=' "$RUNNER_TEMP/d01-t3-repro.log"

      - name: Preserve verified build inputs only in the private Learn repository
        if: matrix.lane == 'functional'
        id: retained
        continue-on-error: true
        working-directory: private/site
        env:
          D01_SITE_TOKEN: ${{ secrets.DOMEN }}
          D01_SITE_REVISION: '1057804a8ba68a1d3c9d0173aa615e1a53b51c46'
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/ci-harness/tools/ci/retain-d01-private-inputs.py"
      - name: Browser prerequisites for exact Learn runtime
        id: browser
        timeout-minutes: 12
        shell: bash
        run: |
          cd "$D01_T2_SOURCE"
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/d01-assistant-browser-deps.log" 2>&1 || { echo D01_ASSISTANT_BROWSER_DEPS_FAIL; exit 1; }
          npx playwright install --with-deps chromium >"$RUNNER_TEMP/d01-assistant-browser-install.log" 2>&1 || { echo D01_ASSISTANT_BROWSER_INSTALL_FAIL; exit 1; }
      - name: Actual Learn assistant, query routing, explicit form and result context
        if: matrix.lane == 'functional'
        timeout-minutes: 12
        working-directory: private/site
        shell: bash
        run: |
          set +e
          node qa/d01-product-witness-2026-10-26/t3-assistant-environment-witness.mjs >"$RUNNER_TEMP/d01-assistant-browser.log" 2>&1
          code=$?
          set -e
          grep -E '^D01_T3_ASSISTANT_' "$RUNNER_TEMP/d01-assistant-browser.log" | cut -c1-1000 || true
          exit "$code"
      - name: Every native first-user learning journey on both viewports
        id: journeys
        if: ${{ always() && !cancelled() && matrix.lane == 'functional' && steps.browser.outcome == 'success' }}
        timeout-minutes: 24
        working-directory: private/site
        shell: bash
        run: |
          set +e
          node scripts/audit-first-user.mjs >"$RUNNER_TEMP/d01-first-user.log" 2>&1
          code=$?
          set -e
          grep -E '^D01_FIRST_USER_(PASS|FAIL|RESULT)=' "$RUNNER_TEMP/d01-first-user.log" | cut -c1-1200 || true
          exit "$code"
      - name: Real autonomous T3, assistant proposal, cold restart and independent archive import
        id: offline
        if: ${{ always() && !cancelled() && matrix.lane == 'functional' && steps.browser.outcome == 'success' }}
        timeout-minutes: 18
        working-directory: private/site
        shell: bash
        run: |
          set +e
          node qa/d01-product-witness-2026-10-26/t3-offline-witness.mjs >"$RUNNER_TEMP/d01-offline.log" 2>&1
          code=$?
          set -e
          grep -E '^D01_T3_(OFFLINE_|STORE_METADATA|SNAPSHOT_INSTALLED|INDEPENDENT_RECIPIENT_INSTALLED|KERNEL_PROBE|ROUTE_TRANSIENT)' "$RUNNER_TEMP/d01-offline.log" | cut -c1-1200 || true
          exit "$code"
      - name: Full browser audit on the same immutable candidate in an isolated network
        if: matrix.lane == 'audit'
        timeout-minutes: 78
        working-directory: private/site
        env:
          D01_BROWSER_AUDIT_BUDGET_MS: '4200000'
        shell: bash
        run: |
          set -o pipefail
          set +e
          sudo -n unshare --net -- bash -euc '
            ip link set lo up
            runuser -u "$1" -- env CI=true D01_T3_REQUIRE_STABLE_HOST=1 D01_T2_SOURCE="$3" GITHUB_STEP_SUMMARY="$4" D01_BROWSER_AUDIT_BUDGET_MS="$5" "$2" scripts/audit-browser-navigation.mjs
          ' _ "$(id -un)" "$(command -v node)" "$D01_T2_SOURCE" "$GITHUB_STEP_SUMMARY" "$D01_BROWSER_AUDIT_BUDGET_MS" 2>&1 |
            tee "$RUNNER_TEMP/d01-navigation.log" |
            awk '/^D01_BROWSER_(REALM_COVERAGE|PAGE_COVERAGE|NAV_AUDIT|CHECKPOINT|NAV_FINDING|LINK_PLAN|LINK_PROGRESS|DIRECT_LOOPBACK_REQUESTS)=/ {print substr($0,1,2400); fflush()}'
          code=$?
          set -e
          echo "D01_BROWSER_DIAGNOSTIC_EXIT=$code"
          if [ "$code" -ne 0 ]; then
            grep -Eo 'D01_BROWSER_[A-Z0-9_]+|D01_PRODUCT_MOUNT_FAILED|Operation not permitted|TimeoutError' "$RUNNER_TEMP/d01-navigation.log" | sort -u | head -30 || true
          fi
          exit "$code"
      - name: Actual original local model installation and online plus cold-offline consultation
        if: matrix.lane == 'model'
        timeout-minutes: 65
        working-directory: private/site
        env:
          D01_T3_ALLOW_REAL_MODEL: '1'
          D01_T3_MODEL_PROFILE: 'light'
        shell: bash
        run: |
          set +e
          node qa/d01-product-witness-2026-10-26/t3-real-model-witness.mjs >"$RUNNER_TEMP/d01-real-model.log" 2>&1
          code=$?
          set -e
          grep -E '^D01_T3_(MODEL_DEVICE|REAL_MODEL_|CONSULTATION_GENERATED|CONSULTATION_QUALITY)=' "$RUNNER_TEMP/d01-real-model.log" | cut -c1-240 || true
          grep -E '^D01_T3_(REAL_MODEL_[A-Z_]+|MODEL_DEVICE|CONSULTATION_[A-Z_]+)=' "$RUNNER_TEMP/d01-real-model.log" | cut -c1-240 || true
          exit "$code"
