name: D01 hosting freeze - original T2 and T3 candidate
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/once/d01-hosting-freeze/**'
    paths:
      - '.github/ci-requests/d01-hosting-freeze.json'
concurrency:
  group: d01-learn-qualification
  # Finish the running candidate. GitHub keeps at most one pending run in
  # this group, replacing an older pending candidate when a new one is queued.
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  qualify:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false)
    # Use one runner and a single checkout of each product owner. All steps
    # before the T2 checkout are mandatory; a failed source gate stops the
    # expensive original-kernel build and browser journey.
    name: T2 hosting release qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      D01_T2_CHECKOUT: ${{ github.workspace }}/private/t2
      D01_EXPECTED_T2_HEAD: 39a0b3205ea45a55c3db45b99f5bcf4f0283aef1
      D01_EXPECTED_SITE_HEAD: 906328d9d4264eb6a1a7f63ca8ca626791426186
      D01_T2_SOURCE: ${{ github.workspace }}/private/t2/t2/current/final-successor/canonical-source
      D01_CASE_FILE: ${{ github.workspace }}/private/domain/learning-journey/case-001-workplace-numeracy.json
      D01_CASE_002_FILE: ${{ github.workspace }}/private/domain/learning-journey/case-002-price-label-check.json
    steps:
      - name: Checkout public request guard only
        uses: actions/checkout@v4
        with:
          path: ci-harness
          persist-credentials: false
          fetch-depth: 2
      - name: Verify deliberate immutable request before private checkout
        working-directory: ci-harness
        run: |
          python3 tools/ci/verify_once_request.py \
            --repository Faust-S/knowledge --workflow d01-hosting-freeze \
            --profile full-hosting-qualification \
            --revision site=906328d9d4264eb6a1a7f63ca8ca626791426186 \
            --revision subject=1e8700f4fd6f11c50db154f9f080b2406bef02ec \
            --revision t2=39a0b3205ea45a55c3db45b99f5bcf4f0283aef1 \
            --revision core=326f725c44d69ac99f6b912241e9e8a6c3d716a5 \
            --revision assistant=5e3083788aa541921559de29d3457d4a52bbba00
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/learn.iwxa.ru
          ref: 906328d9d4264eb6a1a7f63ca8ca626791426186
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/learn
          ref: 1e8700f4fd6f11c50db154f9f080b2406bef02ec
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/domain
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Exact revisions and canonical subject models
        shell: bash
        run: |
          set -eu
          test "$(git -C private/site rev-parse HEAD)" = 906328d9d4264eb6a1a7f63ca8ca626791426186
          test "$(git -C private/domain rev-parse HEAD)" = 1e8700f4fd6f11c50db154f9f080b2406bef02ec
          for path in study/services t2/domain-modules/learn; do
            for file in study-write-outcome.mjs study-write-outcome.d.mts; do
              cmp "private/domain/learning-journey/$file" "private/site/$path/$file"
            done
          done
          cmp private/domain/learning-journey/projection.ts private/site/t2/domain-modules/learn-results/learning-journey.ts
          for path in study/services t2/domain-modules/learn t2/domain-modules/learn-results; do
            cmp private/domain/learning-journey/study-sources.mjs "private/site/$path/study-sources.mjs"
            cmp private/domain/learning-journey/mind-sources.mjs "private/site/$path/mind-sources.mjs"
          done
          cmp private/domain/learning-journey/study-sources.d.mts private/site/t2/domain-modules/learn-results/study-sources.d.mts
          cmp private/domain/learning-journey/mind-sources.d.mts private/site/t2/domain-modules/learn-results/mind-sources.d.mts
          cmp private/domain/mind/services/persistence.mjs private/site/mind/app/services/persistence.mjs
          cmp private/site/study/services/goal-service.mjs private/site/t2/domain-modules/learn/goal-service.mjs
          cmp private/site/study/services/route-service.mjs private/site/t2/domain-modules/learn/route-service.mjs
          cmp private/domain/learning-journey/today.ts private/site/t2/domain-modules/learn-results/learning-today.ts
          cmp private/domain/learning-journey/continuation.mjs private/site/study/services/continuation.mjs
          cmp private/domain/learning-journey/continuation.mjs private/site/t2/domain-modules/learn-results/continuation.mjs
          cmp private/domain/learning-journey/continuation.d.mts private/site/t2/domain-modules/learn-results/continuation.d.mts
          cmp private/domain/learning-journey/career-review.mjs private/site/study/services/career-review.mjs
          cmp private/site/study/services/practice-session-link.mjs private/site/t2/domain-modules/learn-results/practice-session-link.mjs
          cmp private/domain/learning-journey/workplace-shifts.mjs private/site/practice/quick-arithmetic/engine/workplace-shifts.mjs
          cmp private/domain/learning-journey/price-check.mjs private/site/practice/quick-arithmetic/engine/price-check.mjs
          for model in private/domain/practice/models/*.v1.json; do
            test ! -f "private/site/practice/models/$(basename "$model")" || cmp "$model" "private/site/practice/models/$(basename "$model")"
          done
          for target in study/services t2/domain-modules/learn t2/domain-modules/learn-results; do
            for file in practice-associations.mjs practice-reviews.mjs practice-reviews.d.mts practice-study-reference.mjs practice-study-reference.d.mts; do
              cmp "private/domain/learning-journey/$file" "private/site/$target/$file"
            done
          done
          cmp private/site/study/services/study-evidence-service.mjs private/site/t2/domain-modules/learn/study-evidence-service.mjs
          cmp private/domain/learning-journey/route-review.mjs private/site/t2/domain-modules/learn-results/route-review.mjs
          cmp private/domain/learning-journey/route-review.d.mts private/site/t2/domain-modules/learn-results/route-review.d.mts
          for target in study/services t2/domain-modules/learn-results; do
            for file in practice-support.mjs practice-support.d.mts; do
              cmp "private/domain/learning-journey/$file" "private/site/$target/$file"
            done
          done
          for file in topic-work.mjs topic-lesson.mjs; do
            cmp "private/domain/learning-journey/$file" "private/site/t2/domain-modules/learn-results/$file"
          done
          cmp private/domain/practice/repeat-preparation.mjs private/site/practice/repeat-preparation.js
          for target in study/services t2/domain-modules/learn-results; do
            for file in topic-learning-history.mjs topic-learning-history.d.mts; do
              cmp "private/domain/learning-journey/$file" "private/site/$target/$file"
            done
          done
          cmp private/site/study/my-routes/practice-repeat.mjs private/site/t2/domain-modules/learn-results/practice-repeat.mjs
          for file in session-flow.mjs session-flow.d.mts topic-lesson.mjs topic-lesson.d.mts; do
            cmp "private/domain/learning-journey/$file" "private/site/study/services/$file"
            cmp "private/domain/learning-journey/$file" "private/site/t2/domain-modules/learn/$file"
          done
          for target in study/services t2/domain-modules/learn t2/domain-modules/learn-results; do
            for file in study-recall.mjs study-recall.d.mts study-answer-review.mjs study-answer-review.d.mts; do
              cmp "private/domain/learning-journey/$file" "private/site/$target/$file"
            done
          done
          cmp private/domain/learning-journey/topic-work.mjs private/site/study/services/topic-work.mjs
          node --input-type=module - <<'JS'
          import {readFileSync,existsSync} from 'node:fs';
          import {topicWorkTargets} from './private/domain/learning-journey/topic-work.mjs';
          import {SERVICE_IDS} from './private/domain/mind/services/core.mjs';
          import {practiceSupportTargets} from './private/domain/learning-journey/practice-support.mjs';
          const targets=topicWorkTargets();
          const support=practiceSupportTargets();
          for(const target of support){
            if(!target.path||!existsSync('private/site'+target.path+'index.html'))throw Error('D01_PREPARATION_TARGET_MISSING:'+target.slug);
            if(target.kind==='mind'&&!SERVICE_IDS.includes(target.slug))throw Error('D01_PREPARATION_MIND_MISMATCH:'+target.slug);
          }
          console.log('D01_PREPARATION_TARGETS='+support.length);
          for(const target of targets){
            if(!existsSync('private/site'+target.path+'index.html'))throw Error('D01_TOPIC_TARGET_MISSING:'+target.slug);
            if(target.kind==='practice'){
              const model=JSON.parse(readFileSync('private/domain/practice/models/'+target.slug+'.v1.json','utf8'));
              if(model.source.template_id!==target.modelId||model.title!==target.title)throw Error('D01_TOPIC_MODEL_MISMATCH:'+target.slug);
            }
            if(target.kind==='mind'&&!SERVICE_IDS.includes(target.slug))throw Error('D01_TOPIC_MIND_MISMATCH:'+target.slug);
          }
          console.log('D01_TOPIC_TARGETS='+targets.length);
          JS
          cmp private/domain/learning-journey/topic-lesson.mjs private/site/study/services/topic-lesson.mjs
          cmp private/domain/learning-journey/topic-lesson.mjs private/site/t2/domain-modules/learn/topic-lesson.mjs
          cmp private/site/study/services/study-session-service.mjs private/site/t2/domain-modules/learn/study-session-service.mjs
          cmp private/domain/learning-journey/route-edit.mjs private/site/study/services/route-edit.mjs
          cmp private/domain/learning-journey/route-edit.mjs private/site/t2/domain-modules/learn/route-edit.mjs
          cmp private/domain/learning-journey/topic-work.mjs private/site/t2/domain-modules/learn/topic-work.mjs
          cmp private/domain/learning-journey/study-sources.d.mts private/site/t2/domain-modules/learn/study-sources.d.mts
          cmp private/domain/learning-journey/mind-sources.d.mts private/site/t2/domain-modules/learn/mind-sources.d.mts
          for path in study/services t2/domain-modules/learn t2/domain-modules/learn-results; do
            cmp private/domain/learning-journey/prerequisites.mjs "private/site/$path/prerequisites.mjs"
            cmp private/domain/learning-journey/continuation.mjs "private/site/$path/continuation.mjs"
          done
          cmp private/domain/learning-journey/topic-progress.mjs private/site/t2/domain-modules/learn-results/topic-progress.mjs
          cmp private/domain/learning-journey/topic-progress.d.mts private/site/t2/domain-modules/learn-results/topic-progress.d.mts
          for file in daily-learning.mjs daily-learning.d.mts practice-study-reference.mjs practice-study-reference.d.mts; do
            cmp "private/domain/learning-journey/$file" "private/site/t2/domain-modules/learn-results/$file"
          done
          for file in practice-study-reference.mjs practice-study-reference.d.mts; do
            cmp "private/domain/learning-journey/$file" "private/site/study/services/$file"
          done
          cmp private/domain/mind/services/core.mjs private/site/mind/app/services/core.mjs
          cmp private/domain/mind/services/engines.mjs private/site/mind/app/services/engines.mjs
          cmp private/domain/practice/review-focus.mjs private/site/practice/review-focus.js
          cmp private/domain/practice/self-check-review.mjs private/site/practice/self-check-review.js
          cmp private/domain/verification/t3-assistant/skill-runtime.mjs private/site/scripts/t3-inputs/original-skill-runtime.mjs
          for target in study/services t2/domain-modules/learn t2/domain-modules/learn-results; do
            for file in goal-route-links.mjs schema-history-read.mjs; do
              cmp "private/domain/learning-journey/$file" "private/site/$target/$file"
            done
          done
          cmp private/domain/mind/services/schema-history-read.mjs private/site/mind/app/services/schema-history-read.mjs
          cmp private/site/study/services/study-history-read.mjs private/site/t2/domain-modules/learn/study-history-read.mjs
          cmp private/site/study/library-view.mjs private/site/t2/domain-modules/learn/library-view.mjs
          cmp private/site/study/services/study-calculator-links.mjs private/site/t2/domain-modules/learn/study-calculator-links.mjs
          echo D01_OWNER_PARITY_PASS
          set +e
          node --test --test-reporter=tap private/domain/learning-journey/study-sources.test.mjs private/domain/learning-journey/projection.test.mjs private/domain/learning-journey/continuation.test.mjs private/domain/learning-journey/large-session-history.test.mjs private/domain/learning-journey/goal-route-links.test.mjs private/domain/learning-journey/today.test.mjs private/domain/learning-journey/career-review.test.mjs private/domain/learning-journey/mind-sources.test.mjs private/domain/mind/services/persistence.test.mjs private/domain/learning-journey/route-review.test.mjs private/domain/learning-journey/session-flow.test.mjs private/domain/learning-journey/study-recall.test.mjs private/domain/learning-journey/topic-work.test.mjs private/domain/learning-journey/topic-lesson.test.mjs private/domain/learning-journey/route-edit.test.mjs private/domain/learning-journey/prerequisites.test.mjs private/domain/learning-journey/topic-mind.test.mjs private/domain/learning-journey/topic-progress.test.mjs private/domain/learning-journey/daily-learning.test.mjs private/domain/learning-journey/practice-study-reference.test.mjs private/domain/learning-journey/practice-repeat-reference.test.mjs private/domain/learning-journey/practice-support.test.mjs private/domain/learning-journey/practice-criterion-variants.test.mjs private/domain/learning-journey/practice-repeat-focus.test.mjs private/domain/practice/repeat-preparation.test.mjs private/domain/learning-journey/study-recall-progression.test.mjs private/domain/learning-journey/topic-learning-history.test.mjs private/domain/learning-journey/study-answer-review.test.mjs private/domain/learning-journey/practice-associations.test.mjs private/domain/tests/assistant-skills.test.mjs private/domain/mind/services/model-identities.test.mjs private/domain/learning-journey/practice-review-series.test.mjs private/domain/practice/review-focus.test.mjs private/domain/practice/self-check-review.test.mjs >"$RUNNER_TEMP/d01-domain.log" 2>&1
          code=$?
          grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-domain.log" | cut -c1-200 || true
          if [ "$code" -ne 0 ]; then echo D01_DOMAIN_SOURCE_LINK_TEST_FAIL; exit "$code"; fi
          echo D01_DOMAIN_SOURCE_LINK_TEST_PASS
      - name: Source syntax and navigation regressions
        working-directory: private/site
        shell: bash
        run: |
          set -eu
          for file in study/services/study-write-outcome.mjs t2/domain-modules/learn/study-write-outcome.mjs _iwxa/learn-profile-context-r6.js _iwxa/learn-link-context.js iwxa-learn-shell-r8-r6.js study/assets-r5/main-t2-9c777f34.js study/assets-r5/src-eldniVto.js calculators/assets-r5/index-CwKME0Vd.js calculators/workspace-selection.mjs career/assets-r5/MapPage-DT3PY6CS.js t2/domain-modules/learn/profile-area.mjs study/services/study-sources.mjs study/services/goal-service.mjs study/services/route-service.mjs study/source-panel.mjs study/goals/goals-app.mjs study/my-routes/routes-app.mjs study/sessions/sessions-app.mjs practice/workspace-selection.mjs mind/app/workspace-ui.mjs mind/app/app.mjs mind/app/services/tools.mjs mind/app/services/labs.mjs practice/assets-r6-clean/practice-capability-gate-BaTK15az.js practice/assets-r6-clean/catalog-BWIn6LRW.js practice/assets-r6-clean/model._slug-DZ9y8kMs.js practice/assets-r6-clean/index-D1kuNTQO.js practice/assets-r6-clean/practice-shell-ClcATzN9.js practice/assets-r6-clean/practice-workspace-picker-Cqs4_6K1.js practice/assets-r6-clean/create-SrNR54d1.js practice/assets-r6-clean/programs-ZGbS30w9.js scripts/copy-static.mjs scripts/fingerprint-editorial-assets.mjs scripts/verify-hosting-stage.mjs scripts/audit-product-links.mjs scripts/audit-browser-navigation.mjs scripts/audit-first-user.mjs scripts/browser-product-origin.mjs scripts/normalize-learn-navigation.mjs scripts/test-learn-navigation.mjs career/assets-r5/index-B6cIU7u-.js scripts/test-first-use-profile.mjs qa/d01-product-witness-2026-10-26/product-witness.mjs qa/d01-product-witness-2026-10-26/repeat-scenario-witness.mjs scripts/materialize-t2-local-preview.mjs assets-r5/index-C3JXOmeg.js career/assets-r5/HypothesesPage-DX3XrAWC.js career/assets-r5/TrialDetailPage-DFY0ijPi.js lad/assets-r5/index-DGThwVZ9.js study/services/continuation.mjs t2/domain-modules/learn-results/continuation.mjs study/form-navigation.mjs study/services/career-review.mjs study/services/practice-session-link.mjs t2/domain-modules/learn-results/practice-session-link.mjs career/assets-r5/learning-review-panel.js practice/assets-r6-clean/create-SrNR54d1.js study/services/practice-handoff.mjs mind/app/services/document-ui.mjs mind/app/services/persistence.mjs mind/app/route-context.mjs mind/app/session.mjs mind/app/storage.mjs study/services/mind-sources.mjs study/services/topic-work.mjs study/topic-work-panel.mjs study/services/topic-lesson.mjs study/services/route-edit.mjs study/services/prerequisites.mjs t2/domain-modules/learn/prerequisites.mjs study/source-panel.mjs study/lesson-brief-panel.mjs study/services/study-session-service.mjs t2/domain-modules/learn/study-session-service.mjs practice/study-context.mjs practice/assets-r6-clean/study-context-panel.js qa/d01-product-witness-2026-10-26/mind-journey-witness.mjs t2/domain-modules/learn-results/daily-learning.mjs t2/domain-modules/learn-results/learning-navigation.mjs t2/domain-modules/learn-results/linked-journey-read.mjs study/services/practice-study-reference.mjs practice/quick-arithmetic/engine/practice-session.mjs practice/quick-arithmetic/quick-arithmetic-app.mjs study/services/study-recall.mjs study/services/session-flow.mjs t2/domain-modules/learn/study-recall.mjs t2/domain-modules/learn/session-flow.mjs t2/domain-modules/learn-results/study-recall.mjs t2/domain-modules/learn-results/topic-progress.mjs scripts/test-study-recall-owner.mjs study/services/practice-reviews.mjs study/services/study-evidence-service.mjs study/my-routes/practice-link.mjs study/my-routes/practice-feedback.mjs study/services/practice-associations.mjs study/sessions/practice-panel.mjs study/study-owner.mjs practice/topic-pending.mjs practice/quick-arithmetic/engine/practice-result.mjs scripts/test-practice-study-feedback-owner.mjs scripts/test-practice-topic-feedback.mjs study/services/practice-support.mjs study/my-routes/practice-preparation-panel.mjs study/my-routes/practice-repeat.mjs practice/repeat-preparation.js practice/assets-r6-clean/practice-error-notice-CZjnex95.js t2/domain-modules/learn-results/practice-support.mjs t2/domain-modules/learn-results/route-review.mjs study/topic-history-panel.mjs study/services/topic-learning-history.mjs t2/domain-modules/learn-results/topic-learning-history.mjs t2/domain-modules/learn-results/daily-learning.mjs study/services/study-answer-review.mjs t2/domain-modules/learn/study-answer-review.mjs t2/domain-modules/learn-results/study-answer-review.mjs t2/domain-modules/learn/route-edit.mjs t2/domain-modules/learn/topic-work.mjs scripts/audit-external-links.mjs scripts/audit-internal-file-links.mjs scripts/test-practice-client-root.mjs scripts/test-external-links.mjs scripts/test-internal-file-links.mjs scripts/prepare-learn-t3-host.mjs scripts/retain-learn-t3-inputs.mjs scripts/install-learn-retained-host.mjs scripts/learn-assistant-skills.mjs scripts/t3-inputs/original-skill-runtime.mjs qa/d01-product-witness-2026-10-26/ci-real-screens.mjs; do
            if ! node --check "$file" >"$RUNNER_TEMP/d01-syntax.log" 2>&1; then echo "D01_SYNTAX_FAIL:$file"; exit 1; fi
          done
          echo D01_SYNTAX_PASS
          set +e
          log="$RUNNER_TEMP/d01-source.log"
          node --test --test-reporter=tap t2/domain-modules/learn-results/learning-navigation.test.mjs scripts/test-t2-host-frame-boundary.mjs scripts/test-practice-workspace-selection.mjs scripts/test-mind-workspace-ui.mjs scripts/test-t2-local-preview.mjs scripts/test-t2-owner-passports.mjs scripts/test-practice-handoff.mjs scripts/test-mind-route-context.mjs t2/domain-modules/learn-results/linked-journey-read.test.mjs scripts/test-study-prerequisite-owner.mjs scripts/test-study-recall-owner.mjs scripts/test-quick-arithmetic-study-context.mjs >"$log" 2>&1
          code=$?
          grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$log" | cut -c1-200 || true
          if [ "$code" -ne 0 ]; then echo D01_NAV_TEST_FAIL; exit "$code"; fi
          echo D01_NAV_TEST_PASS
      - name: Install site inputs and verify original assistant contract
        timeout-minutes: 15
        working-directory: private/site
        shell: bash
        run: |
          set -eu
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/d01-deps.log" 2>&1
          cmp ../domain/models/assistant-skills.json assets/learn-assistant-skills.json
          cmp ../domain/models/assistant-service-scope.json scripts/t3-inputs/assistant-service-scope.json
          if npm run t3:skills:check >"$RUNNER_TEMP/d01-assistant.log" 2>&1; then echo D01_ASSISTANT_PIN_PASS; else echo D01_ASSISTANT_PIN_FAIL; exit 1; fi
          echo D01_SITE_INPUTS_READY
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          # Fetch the real remote main ref. The following gate still requires
          # the pinned exact SHA; a detached SHA checkout alone has no origin/main.
          ref: main
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/t2
      - name: Verify exact owners
        shell: bash
        run: |
          set -eu
          test "$(git -C private/site rev-parse HEAD)" = 906328d9d4264eb6a1a7f63ca8ca626791426186
          test "$(git -C private/domain rev-parse HEAD)" = 1e8700f4fd6f11c50db154f9f080b2406bef02ec
          test "$(git -C private/t2 rev-parse HEAD)" = 39a0b3205ea45a55c3db45b99f5bcf4f0283aef1
          test "$(git -C private/t2 rev-parse refs/remotes/origin/main)" = 39a0b3205ea45a55c3db45b99f5bcf4f0283aef1
      - name: Qualification proof and all site regression suites
        working-directory: private/site
        timeout-minutes: 20
        shell: bash
        run: |
          set -eu
          node --test --test-reporter=tap qa/d01-product-witness-2026-10-26/qualification-build-proof.test.mjs >"$RUNNER_TEMP/d01-proof.log" 2>&1 || { echo D01_PROOF_TEST_FAIL; exit 1; }
          npm run test:navigation >"$RUNNER_TEMP/d01-navigation.log" 2>&1 || { grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-navigation.log" | cut -c1-160 || true; echo D01_SOURCE_TEST_FAIL; exit 1; }
          grep -E '^(# |ℹ )(tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-navigation.log" || true
          npm run check:editorial >"$RUNNER_TEMP/d01-editorial.log" 2>&1 || { echo D01_EDITORIAL_FAIL; exit 1; }
          echo D01_ALL_SOURCE_GATES_PASS
      - name: T2 exact complete hosting build
        id: compile
        timeout-minutes: 55
        env:
          D01_QUALIFICATION_PHASE: build
          D01_SCREENSHOT_OUTPUT: ${{ runner.temp }}/d01-real-screens
        run: node private/site/qa/d01-product-witness-2026-10-26/ci-real-screens.mjs
      - name: T2 static hosting and complete link audit
        id: links
        if: ${{ always() && !cancelled() && steps.compile.outcome == 'success' }}
