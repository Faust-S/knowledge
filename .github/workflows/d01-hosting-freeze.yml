name: D01 stable Host release witness source regression
on:
  push:
    branches:
      - 'ci/once/d01-hosting-freeze/**'
    paths:
      - '.github/ci-requests/d01-hosting-freeze.json'
permissions:
  contents: read
jobs:
  source:
    if: github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci-harness
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact single request before private checkout
        working-directory: ci-harness
        run: python3 tools/ci/verify_once_request.py --repository Faust-S/knowledge --workflow d01-hosting-freeze --profile stable-host-release-witness-source --revision site=a6622dd7f9008a142193d1481f902d61efbe12f6
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/learn.iwxa.ru
          ref: a6622dd7f9008a142193d1481f902d61efbe12f6
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Verify exact site and browser witness syntax
        working-directory: private/site
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = 'a6622dd7f9008a142193d1481f902d61efbe12f6'
          for file in scripts/browser-product-origin.mjs scripts/test-browser-product-origin.mjs scripts/audit-browser-navigation.mjs scripts/browser-audit-budget.mjs; do
            node --check "$file"
          done
          echo D01_WITNESS_SYNTAX=PASS
      - name: Strict release witness regression
        working-directory: private/site
        env:
          D01_T3_REQUIRE_STABLE_HOST: '1'
        run: |
          set -eu
          node --test --test-reporter=tap scripts/test-browser-product-origin.mjs scripts/test-browser-audit-budget.mjs >"$RUNNER_TEMP/d01-witness.log" 2>&1 || { grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-witness.log" | cut -c1-180 || true; exit 1; }
          grep -E '^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-witness.log"
      - name: Full public-stage source and navigation regression
        working-directory: private/site
        run: |
          set -eu
          npm ci --ignore-scripts --no-audit --no-fund >"$RUNNER_TEMP/d01-source-deps.log" 2>&1 || { echo D01_DEPENDENCIES_FAIL; exit 1; }
          npm run build:public-stage >"$RUNNER_TEMP/d01-public-stage.log" 2>&1 || { grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-public-stage.log" | cut -c1-180 || true; grep -Eo 'D01_[A-Z0-9_]+' "$RUNNER_TEMP/d01-public-stage.log" | sort -u | tail -20 || true; exit 1; }
          grep -E '^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-public-stage.log" || true
          node scripts/audit-product-links.mjs --dir .native-build/public --public-stage >"$RUNNER_TEMP/d01-stage-links.log" 2>&1 || { echo D01_STAGE_LINKS_FAIL; exit 1; }
          grep -E '^D01_LINK_AUDIT=|^D01_UNVERIFIED_FRAGMENT_GROUPS=' "$RUNNER_TEMP/d01-stage-links.log"
          echo D01_SOURCE_STAGE=PASS
