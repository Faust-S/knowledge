name: D01 original T3 assistant domain context qualification
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/once/d01-hosting-freeze/**'
    paths:
      - '.github/ci-requests/d01-hosting-freeze.json'
permissions:
  contents: read
jobs:
  original:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci-harness
          persist-credentials: false
          fetch-depth: 2
      - name: Verify deliberate immutable request before private checkout
        working-directory: ci-harness
        run: python3 tools/ci/verify_once_request.py --repository Faust-S/knowledge --workflow d01-hosting-freeze --profile assistant-domain-context-source --revision assistant=244ad469a71ae65910144c6918488a2d061eecce
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 244ad469a71ae65910144c6918488a2d061eecce
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          fetch-depth: 2
          path: private/assistant
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Original assistant complete regression
        working-directory: private/assistant
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = 244ad469a71ae65910144c6918488a2d061eecce
          node --check browser-local-inference/domain-assistant/main.mjs
          node --test --test-reporter=tap browser-local-inference/tests/domain-assistant-*.test.mjs >"$RUNNER_TEMP/assistant.log" 2>&1 || { grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/assistant.log" | cut -c1-160 || true; exit 1; }
          grep -E '^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/assistant.log"
      - name: Original baseline negative control for unbound domain voice
        working-directory: private/assistant
        shell: bash
        run: |
          set -eu
          file=browser-local-inference/domain-assistant/skill-runtime.mjs
          git show 5e3083788aa541921559de29d3457d4a52bbba00:$file > "$file"
          set +e
          node --test --test-reporter=tap --test-name-pattern='domain voice and its boundaries' browser-local-inference/tests/domain-assistant-skill-runtime.test.mjs > "$RUNNER_TEMP/negative.log" 2>&1
          code=$?
          set -e
          grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/negative.log" | cut -c1-160 || true
          test "$code" = 1
          grep -q '^not ok .*domain voice and its boundaries' "$RUNNER_TEMP/negative.log"
          grep -q '^# fail 1$' "$RUNNER_TEMP/negative.log"
          echo D01_ORIGINAL_UNBOUND_VOICE_NEGATIVE_CONTROL=PASS
