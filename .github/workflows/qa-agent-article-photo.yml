name: IWXA article photography current installed Personal Agent
on:
  push:
    branches:
      - qa/2026-11-20-software-agent-article-capture
    paths:
      - .github/workflows/qa-agent-article-photo.yml
      - tools/qa-patch-agent-editorial.py
      - tools/qa-agent-article-photos.ps1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: b5b9fda7ae5fac73de778f92dcfc6b0f607a8393
          token: ${{ secrets.AGENT || secrets.DOMEN || secrets.T3 }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /desktop/
            /runtime/
            /tools/
            /config/
            /adapters/
            /cells/
            /providers/
            /schemas/
            /profiles/
            /surfaces/
            /skills/
            /operational-skills/
            /automation/
            /authority/
            /Human/
            /scripts/
            /webui/
            /windows/
            /qualification/phase1/*.ps1
            /qualification/phase1/*.py
            /qualification/phase1/*.json
            /qualification/phase1/*.mjs
            /requirements.txt
            /requirements-ci.txt
            /.gitignore
          path: .private/agent
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: c10e193846a0ea4c73cabe3744aa7db82439d54e
          persist-credentials: false
          path: .private/center
      - name: Assert unchanged originals and prepare disposable documentary acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git -C .private/agent rev-parse HEAD).Trim() -cne 'b5b9fda7ae5fac73de778f92dcfc6b0f607a8393'){throw 'DOC_AGENT_HEAD_MISMATCH'}
          if((git -C .private/center rev-parse HEAD).Trim() -cne 'c10e193846a0ea4c73cabe3744aa7db82439d54e'){throw 'DOC_INSTALLER_HEAD_MISMATCH'}
          python tools/qa-patch-agent-editorial.py .private/agent
          if($LASTEXITCODE -ne 0){throw 'DOC_AGENT_TEMPORARY_WITNESS_MISSING'}
          Write-Host 'DOC_AGENT_PRIVATE_ORIGINALS_PINNED'
      - name: Build genuine current installed application package, not a release
        shell: pwsh
        timeout-minutes: 48
        run: |
          $ErrorActionPreference='Stop'
          $ps=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $agent=(Resolve-Path '.private/agent').Path
          $center=(Resolve-Path '.private/center').Path
          $work=Join-Path $env:RUNNER_TEMP 'editorial-agent-build'
          $cache=Join-Path $env:RUNNER_TEMP 'editorial-agent-cache'
          $log=Join-Path $env:RUNNER_TEMP 'editorial-agent-build.log'
          $build=Join-Path $agent 'tools/qa-editorial-build.ps1'
          & $ps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $build -CenterRoot $center -CenterCommit 'c10e193846a0ea4c73cabe3744aa7db82439d54e' -OutputRoot $work -ReleaseCacheRoot $cache *> $log
          if($LASTEXITCODE -ne 0){
            $text=if(Test-Path -LiteralPath $log){Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue}else{''}
            $codes=[regex]::Matches([string]$text,'(?i)(?:private_setup|agent_setup|original_t3|iwxa_setup|win32|os_error)_[a-z0-9_]{3,100}')
            foreach($code in @($codes | Select-Object -Unique | Select-Object -Last 12)){
              Write-Host ('DOC_AGENT_NATIVE_SAFE_FAILURE_CODE '+$code.Value.ToLowerInvariant())
            }
            $tsErrors=[regex]::Matches([string]$text,'(?<!\w)TS[0-9]{4}(?!\w)')
            foreach($code in @($tsErrors | Select-Object -Unique | Select-Object -Last 8)){
              Write-Host ('DOC_AGENT_NATIVE_SAFE_TYPESCRIPT_CODE '+$code.Value)
            }
            foreach($relative in @('logs/private-build-result.json','logs/native-desktop-build.log','logs/native-desktop-build.log.stderr','logs/native-desktop-test-compile.log','logs/native-desktop-test-compile.log.stderr','logs/package-build-only.json','logs/test-python-bootstrap.log')){
              $file=Join-Path $work $relative
              if(!(Test-Path -LiteralPath $file -PathType Leaf)){continue}
              $logText=Get-Content -LiteralPath $file -Raw -ErrorAction SilentlyContinue
              if([string]::IsNullOrWhiteSpace([string]$logText)){continue}
              foreach($match in [regex]::Matches([string]$logText,'(?i)(?<![a-z0-9_])(?:native_candidate|private_setup|original_t3|agent_native_gui)_[a-z0-9_]{4,100}(?![a-z0-9_])')){
                Write-Host ('DOC_AGENT_BUILD_CODE '+$match.Value.ToUpperInvariant())
              }
              $classes=[ordered]@{
                RUST_COMPILE='(?i)error\\[E[0-9]{4}\\]|error: could not compile'
                RUST_LINK='(?i)LNK[0-9]{4}|link.exe.*failed'
                RUST_NETWORK='(?i)failed to download|failed to fetch|network failure'
                FRONTEND_TYPES='(?i)error TS[0-9]{4}'
                FRONTEND_MODULE='(?i)module not found|cannot find module'
                NODE_INSTALL='(?i)npm ERR!|npm error'
                POWERSHELL='(?i)NativeCommandError|CommandNotFoundException'
              }
              foreach($class in $classes.Keys){if([regex]::IsMatch([string]$logText,[string]$classes[$class])){Write-Host ('DOC_AGENT_BUILD_CLASS '+$class)}}
            }
            foreach($code in [regex]::Matches([string]$text,'(?i)(?<![a-z0-9_])(?:native_candidate|private_setup|original_t3|agent_native_gui)_[a-z0-9_]{4,100}(?![a-z0-9_])')){Write-Host ('DOC_AGENT_OUTER_LOG_CODE '+$code.Value.ToUpperInvariant())}
            foreach($item in @('logs/native-desktop-build.log','build/package/IWXA-Personal-Agent-Windows-Explorer-Prototype.zip','IWXA-Private-SetupCore-Candidate.exe','logs/private-build-result.json')){
              if(Test-Path -LiteralPath (Join-Path $work $item) -PathType Leaf){
                Write-Host ('DOC_AGENT_NATIVE_SAFE_STAGE_PRESENT '+($item -replace '[^A-Za-z0-9]','_'))
              }
            }
            throw 'DOC_AGENT_NATIVE_BUILD_FAILED'
          }
          if(!(Test-Path -LiteralPath (Join-Path $work 'IWXA-Private-SetupCore-Candidate.exe'))){throw 'DOC_AGENT_PACKAGE_MISSING'}
          Write-Host 'DOC_AGENT_CURRENT_NATIVE_SETUP_READY'
      - name: Photograph genuine installed task draft, model and program screens
        shell: pwsh
        timeout-minutes: 14
        env:
          EDITORIAL_AGENT_SHA: b5b9fda7ae5fac73de778f92dcfc6b0f607a8393
        run: |
          $ErrorActionPreference='Stop'
          $ps=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $center=(Resolve-Path '.private/center').Path
          $agent=(Resolve-Path '.private/agent').Path
          $package=Join-Path $env:RUNNER_TEMP 'editorial-agent-build/IWXA-Private-SetupCore-Candidate.exe'
          $sandbox=Join-Path $env:RUNNER_TEMP 'editorial-agent-installed'
          $witness=Join-Path $agent 'tools/qa-editorial-gui-witness.ps1'
          $accept=Join-Path $center 'installer/windows/qualify-local-bundle.ps1'
          & $ps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $accept -Setup $package -ProductId 'iwxa.personal-agent' -SandboxRoot $sandbox -SourceCommit 'b5b9fda7ae5fac73de778f92dcfc6b0f607a8393' -WitnessScript $witness -WitnessTimeoutSeconds 700 *> (Join-Path $env:RUNNER_TEMP 'editorial-agent-install.log')
          if($LASTEXITCODE -ne 0){throw 'DOC_AGENT_REAL_GUI_WITNESS_FAILED'}
          Write-Host 'DOC_AGENT_NATIVE_THREE_GUI_STATES_CAPTURED'
      - name: Publish screenshots only, excluding private code and models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-editorial-agent-real-windows-photos
          path: artifacts/editorial-agent/
          if-no-files-found: ignore
          retention-days: 7
      - name: Purge all private product source and installed runtime
        if: always()
        shell: pwsh
        run: |
          foreach($p in @('.private/agent','.private/center',(Join-Path $env:RUNNER_TEMP 'editorial-agent-build'),(Join-Path $env:RUNNER_TEMP 'editorial-agent-cache'),(Join-Path $env:RUNNER_TEMP 'editorial-agent-installed'),(Join-Path $env:RUNNER_TEMP 'editorial-agent-build.log'),(Join-Path $env:RUNNER_TEMP 'editorial-agent-install.log'))){
            if(Test-Path -LiteralPath $p){Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue}
          }
          Write-Host 'DOC_AGENT_TEMPORARY_SOURCE_PURGED'
