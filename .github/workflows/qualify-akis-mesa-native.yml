# Public Mesa dependency smoke ONLY. AKIS model lives in private Faust-S/iwxa.
# Never attempt an unauthorised checkout of that repository in public Actions.
name: Mesa 3.5.2 public dependency smoke (AKIS source NOT_RUN)
on:
  push:
    branches:
      - work/2026-11-21-akis-mesa-native-qualification
permissions:
  contents: read
jobs:
  mesa-library-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned public Mesa wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'mesa==3.5.2'
          python -c 'from importlib.metadata import version; assert version("mesa")=="3.5.2"; print("MESA_NATIVE_LIBRARY_VERSION=3.5.2")'
      - name: Exercise original public Mesa 3.5.2 event scheduler
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import mesa
          from importlib.metadata import version
          assert version("mesa")=="3.5.2"
          class Mini(mesa.Model):
              def __init__(self):
                  super().__init__(seed=0)
                  self.actor=mesa.Agent(self)
                  self.observed=[]
                  self._callbacks=[]
                  for at,name in ((1,"offer"),(2,"decision"),(3,"accept")):
                      def callback(event=name):
                          self.observed.append(event)
                      self._callbacks.append(callback)
                      self.schedule_event(callback,at=float(at))
          model=Mini()
          assert len(model.agents)==1
          model.run_until(4.0)
          assert model.observed==["offer","decision","accept"]
          print("MESA_NATIVE_EVENT_SCHEDULER_PASS")
          PY
          echo 'AKIS_PRIVATE_SOURCE_TESTS=NOT_RUN'
          echo 'AKIS_AGENT_TOOLPROVIDER=NOT_RUN'
          echo 'AKIS_T3_INSTALLED=NOT_RUN'
          echo 'AKIS_PRODUCT_ACCEPTED=false'
      # No private repository checkout, no artifacts or cache.
