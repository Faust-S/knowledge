name: AKIS native Mesa 3.5.2 R3 three original Work periods

on:
  push:
    branches:
      - work/2026-11-23-akis-r3-three-period-owner-economics-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-r3:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Mesa 3.5.2
        run: |
          python -m pip install --disable-pip-version-check "mesa==3.5.2" "pytest>=8,<10"
          python -c "import mesa; assert mesa.__version__ == '3.5.2'"
      - name: Compile source
        run: python -m compileall -q qualifications/akis_2026_11_21/research
      - name: Targeted R3 multi-period regression
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r3_three_period_original_owner_economics_mesa.py
      - name: Full original Mesa regression
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests
      - name: Deterministic three original Work periods
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_r3_three_original_work_periods.py
      - uses: actions/upload-artifact@v4
        with:
          name: akis-r3-three-period-${{ matrix.os }}
          if-no-files-found: error
          path: qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r3_three_original_work_periods_evidence.json
