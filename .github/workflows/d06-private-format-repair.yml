name: d06-private-format-repair

# PUBLIC control-plane only. Checks out the PRIVATE D06 site on an ephemeral
# Windows runner. Logs, formatted private source, and dist stay PRIVATE.
on:
  push:
    branches:
      - test/2026-11-18-d06-qualification
    paths:
      - .github/workflows/d06-private-format-repair.yml

permissions:
  contents: read

concurrency:
  group: d06-private-format-repair
  cancel-in-progress: false

jobs:
  private-format:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact private D06 revision without retained credentials
        uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod.ru
          ref: 0613b8cdc0fc9636b967b8d18c1d9cab1abef8bf
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Repair only existing Prettier violations and verify before private push
        shell: bash
        env:
          DOMEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          cd private/site
          if [ -z "${DOMEN:-}" ]; then
            echo "D06_FORMAT_DOMEN=MISSING"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "0613b8cdc0fc9636b967b8d18c1d9cab1abef8bf" ]; then
            echo "D06_FORMAT_REVISION=UNEXPECTED"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "D06_FORMAT_CHECKOUT=DIRTY"
            exit 1
          fi
          if ! npm ci --no-audit --no-fund > "$RUNNER_TEMP/d06-format-ci-private.log" 2>&1; then
            echo "D06_FORMAT_INSTALL=FAIL"
            exit 1
          fi
          echo "D06_FORMAT_INSTALL=PASS"
          if ! npm run format:lint:plan > "$RUNNER_TEMP/d06-format-plan-private.log" 2>&1; then
            echo "D06_FORMAT_PLAN=FAIL"
            exit 1
          fi
          echo "D06_FORMAT_PLAN=PASS"
          if ! npm run format:lint:apply > "$RUNNER_TEMP/d06-format-apply-private.log" 2>&1; then
            echo "D06_FORMAT_APPLY=FAIL"
            exit 1
          fi
          echo "D06_FORMAT_APPLY=PASS"
          if ! git diff --check > "$RUNNER_TEMP/d06-format-diff-private.log" 2>&1; then
            echo "D06_FORMAT_DIFF=FAIL"
            exit 1
          fi
          changed="$(git diff --name-only | wc -l | tr -d '[:space:]')"
          echo "D06_FORMAT_CHANGED_FILES=$changed"
          if [ "$changed" -eq 0 ]; then
            echo "D06_FORMAT_NO_CHANGES=PASS"
            exit 0
          fi
          if ! npm run check > "$RUNNER_TEMP/d06-format-check-private.log" 2>&1; then
            echo "D06_FORMAT_CHECK=FAIL"
            exit 1
          fi
          echo "D06_FORMAT_CHECK=PASS"
          if ! npm run test > "$RUNNER_TEMP/d06-format-test-private.log" 2>&1; then
            echo "D06_FORMAT_TEST=FAIL"
            exit 1
          fi
          echo "D06_FORMAT_TEST=PASS"
          git add -u
          git config user.name "IWXA D06 Windows qualification"
          git config user.email "d06-windows@users.noreply.github.com"
          git commit -m "style(d06): apply verified existing Prettier rules to changed source" > "$RUNNER_TEMP/d06-format-commit-private.log" 2>&1
          auth="$(printf 'x-access-token:%s' "$DOMEN" | base64 | tr -d '\r\n')"
          if GIT_TERMINAL_PROMPT=0 git -c "http.extraheader=AUTHORIZATION: basic ${auth}" \
            push "https://github.com/Faust-S/komplektovod.ru.git" \
            "HEAD:refs/heads/work/2026-11-11-case-driven-entry-and-drill" \
            > "$RUNNER_TEMP/d06-format-push-private.log" 2>&1; then
            echo "D06_FORMAT_PRIVATE_PUSH=PASS"
          else
            echo "D06_FORMAT_PRIVATE_PUSH=DENIED_OR_REMOTE_ADVANCED"
            exit 1
          fi
      - name: Confirm closed code and logs were not uploaded
        if: always()
        shell: pwsh
        run: |
          Write-Host "D06_PUBLIC_PRIVATE_SOURCE_ARTIFACTS=0"
          Write-Host "D06_PUBLIC_FORMATTED_SOURCE_OUTPUT=0"
