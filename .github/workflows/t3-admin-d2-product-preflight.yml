name: T3 Admin D2 original public product and One Dist preflight
on:
  push:
    branches:
      - work/2026-11-22-admin03-original-d2-read
    paths:
      - .github/workflows/t3-admin-d2-product-preflight.yml
      - packages/t3-core/tests/g4-installed-original-center-first-use.ps1
      - packages/t3-core/src/workspace-host/bootstrap/SignedSelectedWorkspaceGate.tsx
      - packages/t3-core/src/main-isolated-signed-workspace.tsx
      - packages/t3-core/src/shell/AppShell.tsx
      - packages/t3-core/src/App.tsx
      - packages/t3-core/tests/t3-d1-signed-selected-workspace.dom.test.tsx
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-admin-product:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: 65cab2a85408d8899e8be00219f7b8afce6d894f
          persist-credentials: false
          sparse-checkout: |
            runtime/iwxa-admin-center-original-t2-profile.json
          path: .public-center
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check pinned original qualified Kernel source and exact product profile
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD:packages/t3-core/qualified-runtime)" = "1594274dbf5e38214b8422ba11e8c7114bd5425c"
          test "$(git -C .public-center rev-parse HEAD)" = "65cab2a85408d8899e8be00219f7b8afce6d894f"
          echo "D2_PUBLIC_EXACT_SOURCE_PINS_PASS"
      - name: Build only existing original One Core
        shell: bash
        run: |
          set -eu
          npm ci --prefix packages/t3-core --ignore-scripts --no-audit --no-fund
          npm run typecheck --prefix packages/t3-core
          npm run build --prefix packages/t3-core
      - name: Stage original qualified T2 and exact Admin Center owned product
        shell: bash
        run: |
          set -eu
          root="$RUNNER_TEMP/d2-original-admin"
          mkdir -p "$root/qualified"
          unzip -q packages/t3-core/qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip -d "$root/qualified"
          node packages/t3-core/scripts/materialize-original-admin-t2-product.mjs \
            "$root/qualified" .public-center/runtime/iwxa-admin-center-original-t2-profile.json \
            "$root/product" > "$root/product-stage.json"
          node -e 'const s=require(process.argv[1]);if(s.productId!=="iwxa.admin-center"||s.originalKernelBytesUnchanged!==true)process.exit(1)' "$root/product-stage.json"
          echo "D2_PUBLIC_CENTER_PRODUCT_STAGE_PASS"
      - name: Assemble real inherited One Dist with original Admin service
        shell: bash
        run: |
          set -eu
          root="$RUNNER_TEMP/d2-original-admin"
          node packages/t3-core/scripts/assemble-signed-control-dist.mjs \
            "$root/product" packages/t3-core/dist "$root/one-dist" \
            --installed-admin-d3-control-only > "$root/one-dist-result.json"
          node -e 'const s=require(process.argv[1]);if(s.schema!=="iwxa.t3.signed-control-one-dist/1"||s.original_admin_d3_schema_registered!==true||s.original_runtime_unchanged!==true)process.exit(1)' "$root/one-dist-result.json"
          echo "D2_PUBLIC_ORIGINAL_ONE_DIST_ASSEMBLED_PASS"
  native-uia-parser:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse independent native D2 UIA Windows witness without private owner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='packages/t3-core/tests/g4-installed-original-center-first-use.ps1'
          $tokens=[System.Management.Automation.Language.Token[]]@()
          $errors=[System.Management.Automation.Language.ParseError[]]@()
          $null=[System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path -LiteralPath $path).Path,[ref]$tokens,[ref]$errors)
          if($errors.Length -ne 0){
            throw 'D2_PUBLIC_NATIVE_UIA_SCRIPT_PARSE_FAILED'
          }
          $script=Get-Content -LiteralPath $path -Raw
          foreach($mark in @('RequireD2Read',
              'D2_INSTALLED_ORIGINAL_KERNEL_DATA_READ_UI_PASS',
              'D2_INSTALLED_ORIGINAL_KERNEL_TWO_MANAGER_PAGES_UI_PASS',
              'D2_INSTALLED_ORIGINAL_KERNEL_TWO_COLD_READS_PASS')){
            if(!$script.Contains($mark)){throw 'D2_PUBLIC_NATIVE_UIA_WITNESS_INCOMPLETE'}
          }
          Write-Host 'D2_PUBLIC_NATIVE_UIA_SCRIPT_PARSE_AND_WITNESS_PASS'
  signed-selected-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact original One Core test dependencies
        run: npm ci --prefix packages/t3-core --ignore-scripts --no-audit --no-fund
      - name: Qualify existing original signed Workspace first-run JIT and cold readback
        working-directory: packages/t3-core
        run: |
          npx vitest run --config vitest.config.ts tests/t3-d1-signed-selected-workspace.dom.test.tsx
          echo D2_ORIGINAL_SIGNED_WORKSPACE_CREATE_GRANT_AND_READBACK_PASS
