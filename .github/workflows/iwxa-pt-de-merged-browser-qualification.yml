name: IWXA PT-DE merged genuine browser and route qualification
on:
  push:
    branches: [work/2026-11-18-pt-66-qualification]
    paths:
      - .github/workflows/iwxa-pt-de-merged-browser-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-ru-1
          ref: a04eb584077999fa662976670d636f03894c3e44
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"
      - name: Build merged actual SSR
        shell: bash
        working-directory: site
        env:
          LOVABLE_BUILD_TARGET: static
          NITRO_PRESET: node-server
          SERVER_PRESET: node-server
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "a04eb584077999fa662976670d636f03894c3e44"
          bun install --frozen-lockfile > "$RUNNER_TEMP/merged-brow-install.log" 2>&1 || { echo "IWXA_BROWSER_INSTALL=FAIL"; exit 1; }
          echo "IWXA_BROWSER_INSTALL=PASS"
          bun run build > "$RUNNER_TEMP/merged-brow-build.log" 2>&1 || { echo "IWXA_BROWSER_SSR_BUILD=FAIL"; exit 1; }
          echo "IWXA_BROWSER_SSR_BUILD=PASS"
          test -f .output/server/index.mjs
      - name: All RU PT DE FR SSR routes and actual interactive PT controls
        shell: bash
        run: |
          set -eu
          PORT=4389 HOST=127.0.0.1 NODE_ENV=production node site/.output/server/index.mjs > "$RUNNER_TEMP/merged-server.log" 2>&1 &
          srv=$!
          trap 'kill "$srv" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 70); do
            if curl -fsS -o /dev/null http://127.0.0.1:4389/; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1 || { echo "IWXA_BROWSER_SERVER=FAIL"; exit 1; }
          echo "IWXA_BROWSER_SERVER=PASS"
          node site/scripts/pt-http-smoke.mjs --base=http://127.0.0.1:4389 --out="$RUNNER_TEMP/merged-pt-smoke" > "$RUNNER_TEMP/merged-smoke.log" 2>&1 || { echo "IWXA_BROWSER_PT_66=FAIL"; exit 1; }
          echo "IWXA_BROWSER_PT_66=PASS"
          PT_SITE_DIR="$GITHUB_WORKSPACE/site" PT_BASE=http://127.0.0.1:4389 node qa/tools/pt-2defects-browser.mjs > "$RUNNER_TEMP/merged-interactions.log" 2>&1 || { echo "IWXA_BROWSER_PT_ATLAS_ORBIT=FAIL"; grep '^PT_' "$RUNNER_TEMP/merged-interactions.log" | tail -n 12 || true; exit 1; }
          echo "IWXA_BROWSER_PT_ATLAS_ORBIT=PASS"
          PT_SITE_DIR="$GITHUB_WORKSPACE/site" PT_BASE=http://127.0.0.1:4389 node qa/tools/pt-ru-layout-diagnostics.mjs > "$RUNNER_TEMP/merged-layout.log" 2>&1 || { echo "IWXA_BROWSER_RU_PT_LAYOUT=FAIL"; grep -E '^(PT_LIFE_STYLE_|UNIVERSITY_READABILITY_)' "$RUNNER_TEMP/merged-layout.log" | tail -n 12 || true; exit 1; }
          echo "IWXA_BROWSER_RU_PT_LAYOUT=PASS"
