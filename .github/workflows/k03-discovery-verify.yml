name: K03 Activity and Task Discovery contract
on:
  push:
    branches:
      - work/2026-11-05-k03-activity-task-discovery
    paths:
      - 'modules/k03-activity-task-discovery/**'
      - 'research/activity-research/pilots/ADP-001.json'
      - '.github/workflows/k03-discovery-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k03-owner-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Offline source, revision, selection and negative tests
        run: python -W error::ResourceWarning -m unittest discover -s modules/k03-activity-task-discovery/tests -p 'test_*.py' -v
      - name: Host-neutral input and user-supplied evidence contract
        run: |
          python -W error::ResourceWarning -m unittest discover -s modules/k03-activity-task-discovery/tests -p 'test_host_discovery.py' -v
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, sys, tempfile
          file = pathlib.Path('modules/k03-activity-task-discovery/host_discovery.py')
          note = 'Нужно проверить заявки перед передачей смены.\\n'
          raw = note.encode('utf-8')
          record = {
              'source_id':'doc-1', 'revision':'v1', 'text':note,
              'epistemic':'reported',
              'manifest': {
                'schema':'IWXA_ENGINE_UNIVERSAL_EVIDENCE/0.1',
                'kind':'PERSONAL_NOTE_UTF8',
                'owner_ref':'synthetic-ci-person',
                'jurisdiction':'UNDETERMINED',
                'as_of':'2026-11-05',
                'retention_until':'2027-12-31',
                'purpose':'ENGINE_RESEARCH_AND_TEST',
                'disclosure':'PERSONAL',
                'access_basis':'OWNER_AUTHORIZATION_CLAIM',
                'authorization_ref':'synthetic-ci-permission',
                'permission_asserted':True,
                'authorized_actions':['LOCAL_ANALYSIS'],
                'revocation_status':'ACTIVE',
                'sha256':hashlib.sha256(raw).hexdigest(),
                'source_reference':'host://provided/doc-1',
              }
          }
          payload = {'request': {
            'mode':'NEED','text':'Хочу разобраться с заявками',
            'expected_revisions': {'doc-1':'v1'}},
            'sources':[record]}
          with tempfile.TemporaryDirectory() as d:
            target = pathlib.Path(d) / 'host-input.json'
            target.write_text(json.dumps(payload,ensure_ascii=False),encoding='utf-8')
            proc = subprocess.run([sys.executable,str(file),'--input-json',str(target)],
                                  capture_output=True,text=True,check=True)
            result = json.loads(proc.stdout)
            assert result['schema'] == 'IWXA_K03_HOST_DISCOVERY/0.2.0'
            assert result['route'] == 'QUALIFICATION_REQUIRED'
            assert len(result['task_hypotheses']) == 1
            assert result['source_count'] == 1
            assert result['accepted_task_count'] == 0
            assert result['task_created'] is False and result['result_created'] is False
            assert result['human_task_gold'] is False and result['task_f1'] is None
            print('K03_HOST_NEED_SOURCE_NATIVE_U1_PASS; P01_SELECTION_ONLY')
          PY
      - name: Reproducible ADP-001 desk corpus and abstention
        run: |
          python modules/k03-activity-task-discovery/k03.py --all > "$RUNNER_TEMP/k03-receipt.json"
          python - "$RUNNER_TEMP/k03-receipt.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          row = json.loads(Path(sys.argv[1]).read_text("utf-8"))
          assert row["schema"] == "IWXA_K03_DISCOVERY/0.1.0"
          assert row["cases"] == 5
          assert row["negative_no_source_cases"] == 1
          assert row["first_prior_unsupported_negative_count"] == 1
          assert row["all_trace_checks_pass"] is True
          assert row["task_instances_created"] == 0
          assert row["human_gold"] is False and row["task_f1"] is None
          print("K03_DESK_SOURCE_PASS; INDEPENDENT_TASK_QUALITY_NOT_MEASURED")
          PY
      - name: Targeted replay of one original source without full-corpus scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python modules/k03-activity-task-discovery/issue_replay.py --source-ref https://github.com/paperless-ngx/paperless-ngx/issues/14657 > "$RUNNER_TEMP/k03-one-issue.json"
          python - "$RUNNER_TEMP/k03-one-issue.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          row = json.loads(Path(sys.argv[1]).read_text("utf-8"))
          assert row["schema"] == "IWXA_K03_PUBLIC_ISSUE_DISCOVERY/0.1.0"
          assert row["source_ref"] == "https://github.com/paperless-ngx/paperless-ngx/issues/14657"
          assert row["source_verified"] is True
          assert row["accepted_task_count"] == 0
          assert row["human_task_gold"] is False
          assert row["source_text_exported"] is False
          assert row["owner_u1_git_blob"] == "eb15aec5ba1a749c29d7c40a868127e1a384b6bf"
          print("K03_TARGETED_ONE_SOURCE_NATIVE_U1_PASS")
          PY
      - name: Actual pinned native U1 on eight public issues, three baselines
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python modules/k03-activity-task-discovery/issue_replay.py --all > "$RUNNER_TEMP/k03-public-issue-replay.json"
          python - "$RUNNER_TEMP/k03-public-issue-replay.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          row = json.loads(Path(sys.argv[1]).read_text("utf-8"))
          assert row["schema"] == "IWXA_K03_PUBLIC_ISSUE_DISCOVERY/0.1.0"
          assert row["source_count"] == row["source_level_methods"]["source_first_full_review"] == 8
          assert row["sources_read_once"] is True
          assert row["frozen_manifest_git_blob"] == "4ecaa74522ba1c3fa4e8851e877200c7767ad0de"
          assert row["owner_u1_git_blob"] == "eb15aec5ba1a749c29d7c40a868127e1a384b6bf"
          assert row["frozen_u1_method_output_sha256"] == "93e76fc6983364c5718a8e26f797d7220ed51899cd90bf92f15731d3c5f94bf0"
          assert row["frozen_literal_output_sha256"] == "7512d8e85790cc4444214fc8757e3cb24c8214bfd54fe8a36e057f78aa16fec1"
          assert 0 <= row["investigation_candidates"] <= row["source_count"]
          assert row["investigation_candidates"] + row["clarification_only_sources"] == 8
          assert 0 <= row["source_level_methods"]["title_regex_cue_sources"] <= 8
          assert 0 <= row["source_level_methods"]["literal_full_source_hit_sources"] <= 8
          assert row["source_text_exported"] is False
          assert row["task_instances_created"] == 0
          assert row["human_task_gold"] is False and row["task_f1"] is None
          assert row["user_time_savings"] is None
          print("K03_PINNED_REAL_ISSUE_NATIVE_U1_PASS; THREE_BASELINES; NO_TASK_GOLD")
          PY
