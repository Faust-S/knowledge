name: D07 CASE-001-010 private-source source qualification
on:
  push:
    branches: [work/2026-11-18-d07-case10-qualification]
    paths: [.github/workflows/d07-cases-qualification.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d07-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    env:
      DOMAIN_SHA: 8aa740c44c57aa15452f647ebd7c8de5d506df7d
      SITE_SHA: 0a85e2a9a06c461569d74b710eaf7a7710853d18
      T2_SHA: e70de29b72b83e2546f7ab74b17572685a728c17
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      CI: 'true'
    steps:
      - name: Check DOMEN access for each private repo
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:GH_TOKEN)){throw 'D07_DOMEN_SECRET_MISSING'}
          foreach($repo in @('Faust-S/uslugovod','Faust-S/uslugovod.ru','Faust-S/T2')){
            $null=& gh api "repos/$repo" --jq '.id' 2>$null
            if($LASTEXITCODE -ne 0){throw 'D07_REPO_ACCESS_DENIED'}
          }
          git config --global core.autocrlf false
          git config --global core.eol lf
          Write-Host 'D07_REPO_ACCESS=PASS'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod
          ref: ${{ env.DOMAIN_SHA }}
          token: ${{ secrets.DOMEN }}
          path: domain
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: ${{ env.SITE_SHA }}
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: ${{ env.T2_SHA }}
          token: ${{ secrets.DOMEN }}
          path: t2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Pinned sources, domain mirrors and local-only tests/builds
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
        run: |
          $ErrorActionPreference='Continue'
          foreach($item in @(@('domain',$env:DOMAIN_SHA),@('site',$env:SITE_SHA),@('t2',$env:T2_SHA))){
            $sha=(& git -C $item[0] rev-parse HEAD).Trim()
            if($LASTEXITCODE -ne 0 -or $sha -ne $item[1]){throw 'D07_PIN_MISMATCH'}
          }
          for($i=1;$i -le 10;$i++){
            $n='{0:d3}' -f $i
            foreach($file in @('project.json','work-products.json')){
              $a=(& git -C domain rev-parse "HEAD:cases/D07-CASE-$n/$file").Trim()
              $b=(& git -C site rev-parse "HEAD:src/data/cases/d07-case-$n-$file").Trim()
              if(!$a -or $a -ne $b){throw 'D07_PROJECT_MIRROR_MISMATCH'}
            }
          }
          foreach($file in @('src/domain/brand-media-reconciliation.ts','src/data/services/foto-video-meropriyatiya/fotograf.ts')){
            $a=(& git -C domain rev-parse "HEAD:$file").Trim()
            $b=(& git -C site rev-parse "HEAD:$file").Trim()
            if(!$a -or $a -ne $b){throw 'D07_CODE_MIRROR_MISMATCH'}
          }
          Write-Host 'D07_SOURCE_PINS=PASS'
          Write-Host 'D07_MIRRORS=22/22'
          $failed=[System.Collections.Generic.List[string]]::new()
          function Gate([string]$name,[string]$folder,[string]$command,[string[]]$argv){
            $log=Join-Path $env:RUNNER_TEMP ("d07-"+$name+".log")
            Push-Location $folder
            try{& $command @argv *> $log; $code=$LASTEXITCODE}
            catch{$code=1}
            finally{Pop-Location}
            if($code -ne 0){
              $script:failed.Add($name)
              Write-Host "D07_$name=FAIL exit=$code"
              if($name -eq 'INSTALL'){
                $installLog=Get-Content $log -Raw -ErrorAction SilentlyContinue
                $reason='UNKNOWN'
                if($installLog -match '(?i)lockfile.{0,100}(frozen|changed|update)|frozen.{0,100}lockfile'){$reason='FROZEN_LOCK'}
                elseif($installLog -match '(?i)postinstall|generate-d07-route-tree|D07_GENERATED'){$reason='POSTINSTALL'}
                elseif($installLog -match '(?i)not found|command not found|is not recognized'){$reason='EXECUTABLE_NOT_FOUND'}
                elseif($installLog -match '(?i)could not resolve|failed to resolve|package not found'){$reason='RESOLUTION'}
                elseif($installLog -match '(?i)network|tls|certificate'){$reason='NETWORK'}
                Write-Host "D07_INSTALL_CLASS=$reason"
                Write-Host "D07_INSTALL_LOG_BYTES=$($installLog.Length)"
                Push-Location site
                try{
                  $repairLog=Join-Path $env:RUNNER_TEMP 'd07-lock-diagnostic-private.log'
                  & bun install --lockfile-only --ignore-scripts *> $repairLog
                  $repairCode=$LASTEXITCODE
                  Write-Host "D07_UNFROZEN_LOCK_DIAG_EXIT=$repairCode"
                  if($repairCode -eq 0){
                    $change=(& git status --porcelain -- bun.lock)
                    Write-Host "D07_LOCKFILE_NEEDS_REGENERATION=$([bool]$change)"
                  }
                }finally{Pop-Location}
              }elseif($name -eq 'TYPES'){
                Get-Content $log | Select-String -AllMatches 'TS[0-9]{4}' |
                  ForEach-Object {$_.Matches.Value} | Group-Object | Sort-Object Name |
                  ForEach-Object {Write-Host "D07_TYPE_CODE=$($_.Name) count=$($_.Count)"}
              }elseif($name -eq 'LINT_LOGIC'){
                Get-Content $log | Select-String -AllMatches 'react-hooks/[\w-]+|react-refresh/[\w-]+|@typescript-eslint/[\w-]+' |
                  ForEach-Object {$_.Matches.Value} | Group-Object | Sort-Object Name |
                  ForEach-Object {Write-Host "D07_LINT_RULE=$($_.Name) count=$($_.Count)"}
              }elseif($name -eq 'LINT'){
                $n=@(Get-Content $log | Select-String 'prettier/prettier').Count
                Write-Host "D07_PRETTIER_COUNT=$n"
              }elseif($name -eq 'DOMAIN' -or $name -eq 'SITE_TEST'){
                Get-Content $log | Select-String '^# (tests|pass|fail)\s+\d+$' |
                  ForEach-Object {Write-Host ("D07_"+$name+"_"+$_.Line.Trim().Replace('# ','').Replace(' ','='))}
              }else{
                Get-Content $log | Select-String -AllMatches 'D07_[A-Z0-9_]+|T2_[A-Z0-9_]+|ENOENT|EPERM|EACCES' |
                  ForEach-Object {$_.Matches.Value} | Sort-Object -Unique | Select-Object -Last 8 |
                  ForEach-Object {Write-Host "D07_FAILURE_CODE=$_"}
              }
            }else{Write-Host "D07_$name=PASS"}
            return $code -eq 0
          }
          $frozenInstall=Gate 'INSTALL' 'site' 'bun' @('install','--frozen-lockfile')
          if(-not $frozenInstall){
            # Continue diagnosing actual product, but retain failed immutable-install status.
            # The temporary repaired lockfile never leaves this runner.
            Write-Host 'D07_INSTALL_RECOVERY=EPHEMERAL_ONLY'
            if(-not (Gate 'INSTALL_REPAIRED' 'site' 'bun' @('install','--frozen-lockfile'))){
              throw 'D07_INSTALL_REPAIRED_FAILED'
            }
          }
          if(-not (Test-Path 'site/src/routeTree.gen.ts')){throw 'D07_ROUTE_TREE_MISSING'}
          $rt=Get-Content 'site/src/routeTree.gen.ts' -Raw
          $slugs=@('uborka-posle-remonta','remont-vannoy-ulan-ude','ofisnyy-pereezd-rostov',
            'internet-magazin-khozyayeva','buhgalterskiy-autsorsing-stroysouz',
            'remont-dvigatelya-nissan-pathfinder','sudebnoe-predstavitelstvo-spravedlivost',
            'muzykalnye-uroki-pervouralsk','fotosessiya-kalininskaya','brend-media-new-you')
          foreach($slug in $slugs){if(-not $rt.Contains("/keisy/$slug")){throw 'D07_TYPED_ROUTE_MISSING'}}
          Write-Host 'D07_TYPED_ROUTES=10/10'
          $tests=@(Get-ChildItem 'domain/tests' -Filter '*.test.mjs' -File | Sort-Object Name | ForEach-Object {$_.FullName})
          if($tests.Count -lt 21){throw 'D07_DOMAIN_TEST_INVENTORY_MISSING'}
          $domain=Gate 'DOMAIN' 'site' 'node' (@('--import','tsx','--test')+$tests)
          $site=Gate 'SITE_TEST' 'site' 'bun' @('run','test:product-first')
          $types=Gate 'TYPES' 'site' 'bun' @('run','check:types')
          $logic=Gate 'LINT_LOGIC' 'site' 'bun' @('run','lint:logic')
          $lint=Gate 'LINT' 'site' 'bun' @('run','lint')
          $public=Gate 'PUBLIC' 'site' 'bun' @('run','build:public')
          if($public){
            $integrated=Gate 'INTEGRATED' 'site' 'bun' @('run','build:t2-integrated')
            if($integrated){
              $preview=Gate 'PREVIEW' 'site' 'bun' @('run','preview:t2','--','--check')
              foreach($slug in $slugs){
                $path="site/dist/keisy/$slug/index.html"
                if(-not (Test-Path $path)){throw 'D07_CASE_HTML_MISSING'}
                if(-not (Get-Content $path -Raw).Contains('noindex,nofollow')){throw 'D07_CASE_NOINDEX_MISSING'}
              }
              foreach($rel in @('workspace/index.html','workspace/exchange/index.html',
                  'workspace/lifecycle/index.html','_iwxa/runtime/0.3.6/runtime.js')){
                if(-not (Test-Path ("site/dist/"+$rel))){throw 'D07_RUNTIME_ASSET_MISSING'}
              }
              Write-Host 'D07_CASE_HTML=10/10'
              Write-Host 'D07_ORIGINAL_T2_DIST=PASS'
            }
          }
          Write-Host 'D07_GUI_KERNEL_RECEIPT_PHYSICAL_IWXA=NOT_RUN'
          if($failed.Count -gt 0){throw 'D07_SOURCE_QUALIFICATION_INCOMPLETE'}
          Write-Host 'D07_SOURCE_QUALIFICATION=PASS'
          # No source, logs, archives, secrets or dist uploaded.
