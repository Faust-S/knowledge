name: D09 HOP T2 lint baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/hop.iwxa.ru
          ref: work/2026-10-27-d09-t2-site-only
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-lint-npm.log" 2>&1
      - name: Count existing lint failures without exposing source
        shell: bash
        run: |
          ./node_modules/.bin/eslint . --format json > "$RUNNER_TEMP/d09-lint-results.json" 2> "$RUNNER_TEMP/d09-lint-stderr.log" || true
          node --input-type=module - "$RUNNER_TEMP/d09-lint-results.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const totals = { files: report.length, errors: 0, warnings: 0 };
          const byRule = new Map();
          const byScope = new Map();
          for (const file of report) {
            totals.errors += file.errorCount;
            totals.warnings += file.warningCount;
            const path = file.filePath.replaceAll('\\', '/');
            const group = path.includes('/t2-site-module/') || path.includes('/src/integrations/t2/')
              ? 'D09_T2_INTEGRATION'
              : path.includes('/scripts/') || path.includes('/tests/')
                ? 'D09_BUILD_TEST_SCRIPTS' : 'HOP_SITE_OTHER';
            const old = byScope.get(group) ?? {errors: 0, warnings: 0};
            old.errors += file.errorCount; old.warnings += file.warningCount;
            byScope.set(group, old);
            for (const item of file.messages) {
              byRule.set(item.ruleId ?? 'parser', (byRule.get(item.ruleId ?? 'parser') ?? 0) + 1);
            }
          }
          console.log('D09_LINT_COUNTS=' + JSON.stringify(totals));
          console.log('D09_LINT_BY_SCOPE=' + JSON.stringify(Object.fromEntries(byScope)));
          console.log('D09_LINT_TOP_RULES=' + JSON.stringify([...byRule].sort((a,b) => b[1]-a[1]).slice(0, 12)));
          if (totals.errors > 0) process.exitCode = 1;
          NODE
