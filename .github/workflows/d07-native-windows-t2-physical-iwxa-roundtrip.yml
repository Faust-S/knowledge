name: D07 Lifecycle OS native Windows original T2 physical IWXA roundtrip
on:
  push:
    branches: [work/2026-11-18-d07-case10-qualification]
    paths: [.github/workflows/d07-native-windows-t2-physical-iwxa-roundtrip.yml]
permissions:
  contents: read
jobs:
  t2-edge-uia:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      SITE_SHA: 2f65d9c58581847e6dcb4d4017663dcf5336eb13
      T2_SHA: e70de29b72b83e2546f7ab74b17572685a728c17
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      CI: 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Confirm private source access
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:GH_TOKEN)){throw 'D07_GUI_TOKEN_MISSING'}
          foreach($repo in @('Faust-S/uslugovod.ru','Faust-S/T2')){
            $null=& gh api "repos/$repo" --jq '.id' 2>$null
            if($LASTEXITCODE -ne 0){throw 'D07_GUI_REPO_ACCESS_DENIED'}
          }
          git config --global core.autocrlf false
          git config --global core.eol lf
          Write-Output 'D07_GUI_SOURCE_ACCESS=PASS'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: ${{ env.SITE_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: ${{ env.T2_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: t2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Build real pinned T2 and site only inside temporary runner
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
        working-directory: site
        run: |
          if((git rev-parse HEAD).Trim() -ne $env:SITE_SHA){throw 'D07_GUI_SITE_SHA_MISMATCH'}
          if((git -C ../t2 rev-parse HEAD).Trim() -ne $env:T2_SHA){throw 'D07_GUI_T2_SHA_MISMATCH'}
          $installLog=Join-Path $env:RUNNER_TEMP 'd07-gui-install.private.log'
          & bun install --frozen-lockfile *> $installLog
          if($LASTEXITCODE -ne 0){throw 'D07_GUI_INSTALL_FAILED'}
          Write-Output 'D07_GUI_INSTALL=PASS'
          $buildLog=Join-Path $env:RUNNER_TEMP 'd07-gui-build.private.log'
          & bun run build:t2-integrated *> $buildLog
          if($LASTEXITCODE -ne 0){throw 'D07_GUI_INTEGRATED_BUILD_FAILED'}
          if(-not (Test-Path dist/workspace/index.html)){throw 'D07_GUI_T2_HOST_MISSING'}
          Write-Output 'D07_GUI_ONE_DIST_T2=PASS'
      - name: Test original T2 HTTPS with real Edge via Windows UIA
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
          IWXA_D07_PREVIEW_PORT: '55407'
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $site=Join-Path $env:GITHUB_WORKSPACE 'site'
          $candidates=@(
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Microsoft\Edge\Application\msedge.exe')
          )
          $edge=($candidates|Where-Object{Test-Path $_}|Select-Object -First 1)
          if(-not $edge){throw 'D07_GUI_EDGE_MISSING'}
          $origin='https://127.0.0.1:55407'
          $server=$null
          $started=[System.Collections.Generic.List[int]]::new()
          try{
            $server=Start-Process -FilePath 'node' -WorkingDirectory $site -ArgumentList @('scripts/preview-d07-integrated-site.mjs') -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'd07-gui-host.private.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'd07-gui-host-error.private.log') -PassThru
            $ready=$false
            for($i=0;$i -lt 45;$i++){
              Start-Sleep -Milliseconds 600
              try{
                $response=Invoke-WebRequest -Uri ($origin+'/workspace/') -SkipCertificateCheck -TimeoutSec 2
                if($response.StatusCode -eq 200){$ready=$true;break}
              }catch{}
            }
            if(-not $ready){throw 'D07_GUI_T2_HTTPS_UNAVAILABLE'}
            Write-Output 'D07_GUI_REAL_T2_HTTPS=PASS'
            $cases=@(
              [pscustomobject]@{
                number='001'
                slug='uborka-posle-remonta'
                heading='Уборка новой квартиры: реальный заказ, повреждения и спор с исполнителем'
              }
            )
            foreach($item in $cases){
              $num=$item.number;$slug=$item.slug;$headingText=$item.heading
              if($slug -ne 'uborka-posle-remonta'){throw 'D07_GUI_SINGLE_CASE_ARGUMENT_INVALID'}
              $url=$origin+'/keisy/'+$slug+'/'
              $response=Invoke-WebRequest -Uri $url -SkipCertificateCheck -TimeoutSec 10
              if($response.StatusCode -ne 200){throw 'D07_GUI_CASE_HTTP_FAILED'}
              $profile=Join-Path $env:RUNNER_TEMP ('d07-gui-profile-'+$num)
              $edgeProc=Start-Process -FilePath $edge -ArgumentList @(
                '--force-renderer-accessibility','--ignore-certificate-errors',
                '--no-first-run','--no-default-browser-check',"--user-data-dir=$profile","--app=$url") -PassThru
              if($edgeProc){$started.Add($edgeProc.Id)}
              $titleSeen=$false
              $caseButton=$null
              $buttonText=if($num -eq '001'){'Создать черновик заказа'}else{''}
              for($attempt=0;$attempt -lt 60;$attempt++){
                Start-Sleep -Milliseconds 600
                $windows=@(Get-Process msedge -ErrorAction SilentlyContinue|Where-Object{$_.MainWindowHandle -ne 0})
                foreach($proc in $windows){
                  $e=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
                  if(!$e){continue}
                  $scope=[System.Windows.Automation.TreeScope]::Descendants
                  $titleCondition=[System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::NameProperty,$headingText)
                  if($e.FindFirst($scope,$titleCondition)){$titleSeen=$true}
                  if($buttonText){
                    $btnCondition=[System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::NameProperty,$buttonText)
                    $candidate=$e.FindFirst($scope,$btnCondition)
                    if($candidate -and $candidate.Current.IsEnabled){$caseButton=$candidate}
                  }
                }
                if($titleSeen -and (!$buttonText -or $caseButton)){break}
              }
              if(-not $titleSeen){throw 'D07_GUI_H1_NOT_VISIBLE'}
              Write-Output ('D07_EDGE_UIA_CASE_'+$num+'=PASS')
              if($num -eq '001'){
                if(-not $caseButton){throw 'D07_GUI_CREATE_DRAFT_BUTTON_NOT_READY'}
                $invoke=[System.Windows.Automation.InvokePattern]$caseButton.GetCurrentPattern(
                  [System.Windows.Automation.InvokePattern]::Pattern)
                $invoke.Invoke()
                $draftCreated=$false
                for($step=0;$step -lt 25;$step++){
                  Start-Sleep -Milliseconds 500
                  $allWindows=@(Get-Process msedge -ErrorAction SilentlyContinue|Where-Object{$_.MainWindowHandle -ne 0})
                  foreach($checkProcess in $allWindows){
                    $view=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$checkProcess.MainWindowHandle)
                    if(!$view){continue}
                    $createdCondition=[System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::NameProperty,'Заказ создан')
                    $transferCondition=[System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::NameProperty,'Передать в T2')
                    if($view.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$createdCondition) -and
                       $view.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$transferCondition)){
                      $draftCreated=$true;break
                    }
                  }
                  if($draftCreated){break}
                }
                if(-not $draftCreated){throw 'D07_GUI_REACT_DRAFT_CREATION_NOT_CONFIRMED'}
                Write-Output 'D07_NATIVE_CASE_001_CREATE_DRAFT=PASS'
                $transferLink=$null
                for($step=0;$step -lt 25;$step++){
                  Start-Sleep -Milliseconds 400
                  $allWindows=@(Get-Process msedge -ErrorAction SilentlyContinue|Where-Object{$_.MainWindowHandle -ne 0})
                  foreach($checkProcess in $allWindows){
                    $view=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$checkProcess.MainWindowHandle)
                    if(!$view){continue}
                    $condition=[System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::NameProperty,'Передать в T2')
                    $candidate=$view.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$condition)
                    if($candidate -and $candidate.Current.IsEnabled){$transferLink=$candidate;break}
                  }
                  if($transferLink){break}
                }
                if(-not $transferLink){throw 'D07_T2_TRANSFER_LINK_NOT_ACCESSIBLE'}
                $transferInvoke=[System.Windows.Automation.InvokePattern]$transferLink.GetCurrentPattern(
                  [System.Windows.Automation.InvokePattern]::Pattern)
                $transferInvoke.Invoke()
                $hostVisible=$false
                for($step=0;$step -lt 80;$step++){
                  Start-Sleep -Milliseconds 500
                  $allWindows=@(Get-Process msedge -ErrorAction SilentlyContinue|Where-Object{$_.MainWindowHandle -ne 0})
                  foreach($checkProcess in $allWindows){
                    $view=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$checkProcess.MainWindowHandle)
                    if(!$view){continue}
                    $scope=[System.Windows.Automation.TreeScope]::Descendants
                    $domainTitle=[System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::NameProperty,'Рабочая область для сохранения')
                    $createButton=[System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::NameProperty,'Создать рабочую область')
                    if($view.FindFirst($scope,$domainTitle) -and $view.FindFirst($scope,$createButton)){
                      $hostVisible=$true;break
                    }
                  }
                  if($hostVisible){break}
                }
                if(-not $hostVisible){throw 'D07_LOCAL_ORDER_T2_HOST_ENTRY_NOT_CONFIRMED'}
                Write-Output 'D07_NATIVE_CASE_001_T2_HOST_ENTRY=PASS'
                function FindAction([string]$label) {
                  $nameCond=[System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::NameProperty,$label)
                  $buttonCond=[System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                    [System.Windows.Automation.ControlType]::Button)
                  $both=[System.Windows.Automation.AndCondition]::new($nameCond,$buttonCond)
                  foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                    if(!$window){continue}
                    $found=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$both)
                    if($found -and $found.Current.IsEnabled){return $found}
                  }
                  return $null
                }
                function ClickAction([string]$label) {
                  $action=$null
                  for($attempt=0;$attempt -lt 55;$attempt++){
                    $action=FindAction $label
                    if($action){break}
                    Start-Sleep -Milliseconds 400
                  }
                  if(!$action){throw 'D07_T2_NATIVE_ACTION_NOT_FOUND'}
                  $pattern=[System.Windows.Automation.InvokePattern]$action.GetCurrentPattern(
                    [System.Windows.Automation.InvokePattern]::Pattern)
                  $pattern.Invoke()
                  Start-Sleep -Milliseconds 300
                }
                # Choose the *dialog* confirmation. The base empty-state has
                # another identically named button earlier in the UIA tree.
                function ClickLastEnabledButton([string]$label) {
                  $nameCond=[System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::NameProperty,$label)
                  $typeCond=[System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                    [System.Windows.Automation.ControlType]::Button)
                  $both=[System.Windows.Automation.AndCondition]::new($nameCond,$typeCond)
                  for($attempt=0;$attempt -lt 50;$attempt++){
                    foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue |
                      Where-Object {$_.MainWindowHandle -ne 0})){
                      $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                      if(!$window){continue}
                      $buttons=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,$both)
                      for($index=$buttons.Count-1;$index -ge 0;$index--){
                        $button=$buttons.Item($index)
                        if(!$button.Current.IsEnabled -or $button.Current.IsOffscreen){continue}
                        $pattern=[System.Windows.Automation.InvokePattern]$button.GetCurrentPattern(
                          [System.Windows.Automation.InvokePattern]::Pattern)
                        $pattern.Invoke()
                        return
                      }
                    }
                    Start-Sleep -Milliseconds 400
                  }
                  throw 'D07_T2_NATIVE_DIALOG_CONFIRM_NOT_FOUND'
                }
                # All steps below are real UIAutomation actions in original T2.
                ClickAction 'Создать рабочую область'
                ClickAction 'Новая рабочая область'
                ClickLastEnabledButton 'Создать рабочую область'
                $created=$false
                for($attempt=0;$attempt -lt 70;$attempt++){
                  Start-Sleep -Milliseconds 500
                  foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                    if(!$window){continue}
                    $texts=$window.FindAll(
                      [System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.Condition]::TrueCondition)
                    foreach($item in $texts){
                      $name=$item.Current.Name
                      if($name.StartsWith('Рабочая область · ws-')){$created=$true;break}
                    }
                    if($created){break}
                  }
                  if($created){break}
                }
                if(!$created){throw 'D07_NATIVE_T2_CREATED_WORKSPACE_NOT_OBSERVED'}
                Write-Output 'D07_NATIVE_T2_CREATE_WORKSPACE=PASS'

                # Return through actual D07 Host navigation, not direct Kernel calls.
                function FindNative([string]$name, $controlType) {
                  $nameCond=[System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::NameProperty,$name)
                  $condition=if($controlType){
                    [System.Windows.Automation.AndCondition]::new(
                      $nameCond,[System.Windows.Automation.PropertyCondition]::new(
                        [System.Windows.Automation.AutomationElement]::ControlTypeProperty,$controlType))
                  }else{$nameCond}
                  foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                    if(!$window){continue}
                    $found=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$condition)
                    if($found){return $found}
                  }
                  return $null
                }
                function WaitNative([string]$name, $controlType) {
                  for($n=0;$n -lt 70;$n++){
                    $found=FindNative $name $controlType
                    if($found){return $found}
                    Start-Sleep -Milliseconds 500
                  }
                  throw 'D07_NATIVE_GUI_REQUIRED_ELEMENT_MISSING'
                }
                $return=WaitNative 'Мои услуги' ([System.Windows.Automation.ControlType]::Hyperlink)
                $returnPattern=[System.Windows.Automation.InvokePattern]$return.GetCurrentPattern(
                  [System.Windows.Automation.InvokePattern]::Pattern)
                $returnPattern.Invoke()
                $null=WaitNative 'Рабочая область для сохранения' $null
                Write-Output 'D07_NATIVE_T2_RETURN_TO_ORDERS=PASS'
                # T2 catalog navigation does not implicitly select the area for
                # D07. Select the new personal Workspace explicitly as a user.
                Add-Type -AssemblyName System.Windows.Forms
                $workspaceSelector=$null
                foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue |
                  Where-Object {$_.MainWindowHandle -ne 0})){
                  $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                  if(!$window){continue}
                  $comboItems=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                    [System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                      [System.Windows.Automation.ControlType]::ComboBox))
                  if($comboItems.Count -ge 2){
                    $workspaceSelector=$comboItems.Item(0);break
                  }
                }
                if(-not $workspaceSelector){throw 'D07_NATIVE_T2_WORKSPACE_SELECTOR_UNAVAILABLE'}
                $workspaceSelector.SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
                [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
                [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                $null=WaitNative 'Рабочая область выбрана' $null
                Write-Output 'D07_NATIVE_T2_PERSONAL_WORKSPACE_FOCUSED=PASS'
                # The browser draft was created on the same real Edge origin.
                # Select it through the accessible HTML combobox.
                $combo=FindNative 'Черновики заказов в браузере' ([System.Windows.Automation.ControlType]::ComboBox)
                if(-not $combo){
                  $combos=@()
                  foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                    $list=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.PropertyCondition]::new(
                        [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                        [System.Windows.Automation.ControlType]::ComboBox))
                    for($n=0;$n -lt $list.Count;$n++){$combos+=,$list.Item($n)}
                  }
                  if($combos.Count -lt 2){throw 'D07_NATIVE_T2_DRAFT_SELECTOR_UNAVAILABLE'}
                  $combo=$combos[$combos.Count-1]
                }
                $combo.SetFocus()
                Add-Type -AssemblyName System.Windows.Forms
                [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
                [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
                [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                $null=WaitNative 'Документы этого заказа: 9' $null
                Write-Output 'D07_NATIVE_T2_DRAFT_NINE_DOCUMENTS=PASS'
                $verify=FindAction 'Проверить заказ через Kernel'
                if($verify){
                  $verifyPattern=[System.Windows.Automation.InvokePattern]$verify.GetCurrentPattern(
                    [System.Windows.Automation.InvokePattern]::Pattern)
                  $verifyPattern.Invoke()
                  Write-Output 'D07_NATIVE_T2_MANUAL_KERNEL_PREFLIGHT_INVOKED=PASS'
                }
                $consent=WaitNative 'Я проверил заказ и разрешаю сохранить его в выбранную рабочую область T2. Это не принятие работ исполнителя.' ([System.Windows.Automation.ControlType]::CheckBox)
                $toggle=[System.Windows.Automation.TogglePattern]$consent.GetCurrentPattern(
                  [System.Windows.Automation.TogglePattern]::Pattern)
                if($toggle.Current.ToggleState -eq [System.Windows.Automation.ToggleState]::Off){$toggle.Toggle()}
                # Consent does not authorize saving by itself: the original Host
                # separately verifies the order via READ_ORDER and manages revision.
                ClickAction 'Сохранить заказ'
                $sawReceipt=$false
                $sawObject=$false
                for($attempt=0;$attempt -lt 70;$attempt++){
                  Start-Sleep -Milliseconds 500
                  foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                    if(!$window){continue}
                    $texts=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.PropertyCondition]::new(
                        [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                        [System.Windows.Automation.ControlType]::Text))
                    for($n=0;$n -lt $texts.Count;$n++){
                      $name=$texts.Item($n).Current.Name
                      if($name -match '^Заказ сохранён и повторно прочитан' -and
                          $name -match 'Редакция\s+1' -and
                          $name -match 'Событие:\s*(\S+)'){
                        $sawReceipt=$true
                      }
                      if($name -match '(?i)Object\s*ID\s*:\s*d07:order:[0-9a-f]{64}'){$sawObject=$true}
                    }
                  }
                  if($sawReceipt -and $sawObject){break}
                }
                # Native UIA exposes React text interpolations as adjacent text nodes.
                # Reassemble only short adjacent accessible fragments; do not log private IDs.
                if(-not $sawReceipt -or -not $sawObject){
                  foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                    if(!$window){continue}
                    $elements=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.PropertyCondition]::new(
                        [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                        [System.Windows.Automation.ControlType]::Text))
                    $names=[System.Collections.Generic.List[string]]::new()
                    for($n=0;$n -lt $elements.Count;$n++){
                      $value=$elements.Item($n).Current.Name
                      if(-not [string]::IsNullOrWhiteSpace($value)){$names.Add($value)}
                    }
                    for($n=0;$n -lt $names.Count;$n++){
                      if(-not $sawReceipt -and $names[$n] -match '^Заказ сохранён и повторно прочитан'){
                        $length=[Math]::Min(9,$names.Count-$n)
                        $part=[string]::Join(' ',$names.GetRange($n,$length))
                        if($part -match 'Заказ сохранён и повторно прочитан.*?Редакция\s+1\s*\..*?Событие\s*:\s*(\S+)'){
                          $eventToken=$Matches[1].TrimEnd('.')
                          if(-not [string]::IsNullOrWhiteSpace($eventToken)){$sawReceipt=$true}
                        }
                      }
                      if(-not $sawObject -and $names[$n] -match '(?i)Object\s*ID\s*:'){
                        $length=[Math]::Min(5,$names.Count-$n)
                        $part=[string]::Join(' ',$names.GetRange($n,$length))
                        if($part -match 'd07:order:[a-f0-9]{64}'){$sawObject=$true}
                      }
                    }
                  }
                  Write-Output ('D07_NATIVE_UI_JOINED_RECEIPT_MATCH='+$sawReceipt)
                  Write-Output ('D07_NATIVE_UI_JOINED_OBJECT_MATCH='+$sawObject)
                }
                if(-not $sawReceipt -or -not $sawObject){
                  # Whitelisted UI state only. Never print private order content.
                  $signals=[System.Collections.Generic.HashSet[string]]::new()
                  foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                    if(!$window){continue}
                    $texts=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.PropertyCondition]::new(
                        [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                        [System.Windows.Automation.ControlType]::Text))
                    for($n=0;$n -lt $texts.Count;$n++){
                      $name=$texts.Item($n).Current.Name
                      if($name -match 'Запись T2 не подтверждена:\s*(D07_[A-Z0-9_]+)'){
                        $null=$signals.Add('UNCONFIRMED_'+$Matches[1])
                      }elseif($name -match 'В этой рабочей области уже сохранён другой заказ'){
                        $null=$signals.Add('CASE_WORKSPACE_CONFLICT')
                      }elseif($name -match '^Сохранённые данные не менялись'){
                        $null=$signals.Add('UNCHANGED')
                      }elseif($name -match '^Предыдущая запись найдена в Kernel'){
                        $null=$signals.Add('RECOVERED')
                      }elseif($name -match '^Редакция записана, квитанция получена'){
                        $null=$signals.Add('WRITTEN_READBACK')
                      }elseif($name -match '^Заказ сохранён и повторно прочитан'){
                        $null=$signals.Add('RECEIPT_TEXT_UNMATCHED')
                      }elseif($name -match '^Kernel подтвердил конфликт редакций'){
                        $null=$signals.Add('REVISION_CONFLICT')
                      }elseif($name -match '^Не удалось проверить, существует ли заказ'){
                        $null=$signals.Add('KERNEL_PREFLIGHT_FAILED')
                      }elseif($name -match '^Запись T2 не подтверждена'){
                        $null=$signals.Add('UNCONFIRMED_UNRECOGNIZED_CODE')
                      }
                    }
                  }
                  # Structural flags only: no private text, event IDs or object IDs.
                  $struct=[System.Collections.Generic.HashSet[string]]::new()
                  foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                    if(!$window){continue}
                    $nodes=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.PropertyCondition]::new(
                        [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                        [System.Windows.Automation.ControlType]::Text))
                    for($n=0;$n -lt $nodes.Count;$n++){
                      $s=$nodes.Item($n).Current.Name
                      if($s -match '^Заказ сохранён и повторно прочитан'){
                        $null=$struct.Add('RECEIPT_PREFIX')
                        if($s -match 'Редакция\s+1'){$null=$struct.Add('REVISION_1')}
                        if($s -match 'Событие\s*:'){$null=$struct.Add('EVENT_LABEL')}
                        if($s -match 'Событие\s*:\s*\S'){$null=$struct.Add('EVENT_NONEMPTY')}
                        if($s -match '\.$'){$null=$struct.Add('ENDS_PERIOD')}
                      }
                      if($s -match '(?i)Object\s*ID\s*:'){$null=$struct.Add('OBJECT_LABEL')}
                      if($s -match 'd07:order:'){$null=$struct.Add('OBJECT_PREFIX')}
                      if($s -match 'd07:order:[a-f0-9]{64}'){$null=$struct.Add('OBJECT_ID_64_HEX')}
                    }
                  }
                  if($struct.Count -eq 0){Write-Output 'D07_NATIVE_UI_STRUCTURE=NO_MATCH'}
                  else{foreach($flag in @($struct | Sort-Object)){Write-Output ('D07_NATIVE_UI_STRUCTURE='+$flag)}}
                  if($signals.Count -eq 0){Write-Output 'D07_NATIVE_UI_SAVE_OUTCOME=NO_RECOGNIZED_STATUS'}
                  else{foreach($signal in @($signals | Sort-Object)){Write-Output ('D07_NATIVE_UI_SAVE_OUTCOME='+$signal)}}
                  Write-Output ('D07_NATIVE_UI_RECEIPT_MATCH='+$sawReceipt)
                  Write-Output ('D07_NATIVE_UI_OBJECT_MATCH='+$sawObject)
                }
                if(-not $sawReceipt){throw 'D07_NATIVE_T2_REAL_KERNEL_RECEIPT_NOT_OBSERVED'}
                if(-not $sawObject){throw 'D07_NATIVE_T2_REAL_KERNEL_OBJECT_ID_NOT_OBSERVED'}
                Write-Output 'D07_NATIVE_T2_KERNEL_RECEIPT_UI=PASS'
                Write-Output 'D07_NATIVE_T2_KERNEL_ORDER_READBACK_UI=PASS'
                # Navigate through the *original T2 Exchange UI* on the same
                # browser origin and Kernel session. No direct export API, no
                # substitute archive serialization and no browser automation.
                function NativeText {
                  $result=[System.Collections.Generic.List[string]]::new()
                  foreach($proc in @(Get-Process msedge -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
                    if(!$window){continue}
                    $nodes=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.PropertyCondition]::new(
                        [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                        [System.Windows.Automation.ControlType]::Text))
                    for($i=0;$i -lt $nodes.Count;$i++){
                      $value=$nodes.Item($i).Current.Name
                      if(-not [string]::IsNullOrWhiteSpace($value)){$result.Add($value)}
                    }
                  }
                  return [string]::Join(' ',$result)
                }
                function ActivateNative($item) {
                  if(!$item -or !$item.Current.IsEnabled){throw 'D07_NATIVE_ACTION_DISABLED'}
                  $pattern=$null
                  if($item.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern,[ref]$pattern)){
                    ([System.Windows.Automation.InvokePattern]$pattern).Invoke()
                  }else{
                    $item.SetFocus()
                    [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                  }
                  Start-Sleep -Milliseconds 350
                }
                $sourceWitness=NativeText
                if($sourceWitness -match '(?i)Object\s*ID\s*:\s*(d07:order:[a-f0-9]{64})'){
                  $originalObjectId=$Matches[1]
                }else{throw 'D07_NATIVE_IWXA_SOURCE_OBJECT_ID_NOT_FOUND'}
                $transfer=WaitNative 'Сохранить или перенести копию' ([System.Windows.Automation.ControlType]::Hyperlink)
                ActivateNative $transfer
                $null=WaitNative 'Перенос данных' $null
                Write-Output 'D07_NATIVE_ORIGINAL_T2_EXCHANGE_ENTRY=PASS'
                $exportTab=WaitNative 'Экспортировать' $null
                ActivateNative $exportTab
                $null=WaitNative 'Рабочие области' $null
                $historyCheck=FindNative 'История событий' ([System.Windows.Automation.ControlType]::CheckBox)
                if($historyCheck){
                  $toggle=[System.Windows.Automation.TogglePattern]$historyCheck.GetCurrentPattern(
                    [System.Windows.Automation.TogglePattern]::Pattern)
                  if($toggle.Current.ToggleState -eq [System.Windows.Automation.ToggleState]::Off){$toggle.Toggle()}
                }
                $previewButton=WaitNative 'Предпросмотр' ([System.Windows.Automation.ControlType]::Button)
                ActivateNative $previewButton
                $null=WaitNative 'Ориент. размер' $null
                $snapshot=NativeText
                if($snapshot -notmatch '(?s)Объектов\s+1'){
                  Write-Output 'D07_NATIVE_EXPORT_SINGLE_OBJECT=NOT_OBSERVED'
                  throw 'D07_NATIVE_IWXA_EXPORT_SCOPE_NOT_CONFIRMED'
                }
                if($snapshot -notmatch '(?s)Событий\s+([1-9][0-9]*)'){
                  Write-Output 'D07_NATIVE_EXPORT_EVENT_COUNT=NOT_OBSERVED'
                  throw 'D07_NATIVE_IWXA_EXPORT_HISTORY_NOT_CONFIRMED'
                }
                Write-Output 'D07_NATIVE_IWXA_EXPORT_ONE_OBJECT_AND_HISTORY=PASS'
                $packageButton=WaitNative 'Собрать архив' ([System.Windows.Automation.ControlType]::Button)
                ActivateNative $packageButton
                $null=WaitNative 'Архив' $null
                $downloadButton=WaitNative 'Скачать .iwxa' ([System.Windows.Automation.ControlType]::Button)
                ActivateNative $downloadButton
                $archive=$null
                for($attempt=0;$attempt -lt 80;$attempt++){
                  Start-Sleep -Milliseconds 450
                  $found=@()
                  foreach($folder in @((Join-Path $env:USERPROFILE 'Downloads'),$env:RUNNER_TEMP)){
                    if(Test-Path $folder){
                      $found+=@(Get-ChildItem -LiteralPath $folder -File -Filter '*.iwxa' -Recurse -ErrorAction SilentlyContinue |
                        Where-Object {$_.Length -gt 0})
                    }
                  }
                  if($found.Count -eq 1){$archive=$found[0];break}
                  if($found.Count -gt 1){throw 'D07_NATIVE_IWXA_DOWNLOAD_AMBIGUOUS'}
                }
                if(!$archive){throw 'D07_NATIVE_IWXA_DOWNLOAD_BYTES_NOT_FOUND'}
                $digest=Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256
                if($archive.Length -lt 128 -or !$digest.Hash -or $digest.Hash.Length -ne 64){
                  throw 'D07_NATIVE_IWXA_BYTES_INTEGRITY_INVALID'
                }
                Write-Output 'D07_NATIVE_IWXA_PHYSICAL_BYTES_AND_SHA256=PASS'
                $confirm=WaitNative 'Подтвердить приём' ([System.Windows.Automation.ControlType]::Button)
                ActivateNative $confirm
                $null=WaitNative 'Приём подтверждён' $null
                Write-Output 'D07_NATIVE_IWXA_EXPORT_RECEIPT_CONFIRMED=PASS'
                # Import the exact downloaded file in the original T2 Exchange
                # using native Windows file dialog, without injecting a fake archive.
                $importTab=WaitNative 'Импортировать' $null
                # React's role=tab accepts keyboard ENTER. SelectionItem.Select
                # alone changes the accessible selected state but does not keep
                # the file-input keyboard path that previously opened the dialog.
                ActivateNative $importTab
                Start-Sleep -Milliseconds 400
                $importPanelVisible=(NativeText) -match 'Выберите сохранённый пакет'
                Write-Output ('D07_NATIVE_IWXA_IMPORT_PANEL_VISIBLE='+$importPanelVisible)
                if(!$importPanelVisible){throw 'D07_NATIVE_IWXA_IMPORT_PANEL_NOT_SELECTED'}
                Write-Output 'D07_NATIVE_IWXA_IMPORT_TAB=PASS'
                # Native Edge exposes input[type=file] differently across
                # Windows runner versions. Locate a real chooser or navigate
                # from the accessible tab using actual keyboard focus.
                function FindOpenDialog {
                  $roots=[System.Windows.Automation.AutomationElement]::RootElement.FindAll(
                    [System.Windows.Automation.TreeScope]::Children,
                    [System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                      [System.Windows.Automation.ControlType]::Window))
                  for($i=0;$i -lt $roots.Count;$i++){
                    $win=$roots.Item($i)
                    try {
                      if($win.Current.ClassName -eq '#32770' -or
                         $win.Current.Name -match '(?i)^(Open|Открыть|Открытие|Select file|Choose file to upload|Выберите файл)$'){
                        return $win
                      }
                    }catch{}
                  }
                  return $null
                }
                $fileDialog=$null
                $upload=FindNative 'Выберите файл .iwxa' $null
                if(!$upload){
                  foreach($proc in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
                    if(!$window){continue}
                    foreach($type in @(
                      [System.Windows.Automation.ControlType]::Button,
                      [System.Windows.Automation.ControlType]::Edit,
                      [System.Windows.Automation.ControlType]::Custom)){
                      $controls=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                        [System.Windows.Automation.PropertyCondition]::new(
                          [System.Windows.Automation.AutomationElement]::ControlTypeProperty,$type))
                      for($n=0;$n -lt $controls.Count;$n++){
                        $candidate=$controls.Item($n)
                        if($candidate.Current.IsEnabled -and
                           $candidate.Current.Name -match '(?i)(choose file|browse|выбрать файл|обзор|выберите файл[.]iwxa)'){
                          $upload=$candidate;break
                        }
                      }
                      if($upload){break}
                    }
                    if($upload){break}
                  }
                }
                # Whitelisted accessibility metadata only; never log input
                # values, source strings, filenames or archive paths.
                try {
                  Write-Output ('D07_NATIVE_IWXA_IMPORT_TAB_CONTROL='+$importTab.Current.ControlType.ProgrammaticName)
                }catch{
                  Write-Output 'D07_NATIVE_IWXA_IMPORT_TAB_CONTROL=STALE'
                }
                if(!$upload){
                  foreach($proc in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
                    if(!$window){continue}
                    $nodes=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.Condition]::TrueCondition)
                    $seen=0
                    for($k=0;$k -lt $nodes.Count -and $seen -lt 6;$k++){
                      try {
                        $current=$nodes.Item($k).Current
                        if($current.Name -match '(?i)(выберите файл[.]iwxa|choose file|browse|выбрать файл|обзор)'){
                          Write-Output ('D07_NATIVE_IWXA_CHOOSER_CANDIDATE_CONTROL='+$current.ControlType.ProgrammaticName)
                          Write-Output ('D07_NATIVE_IWXA_CHOOSER_CANDIDATE_FOCUSABLE='+$current.IsKeyboardFocusable)
                          $seen++
                        }
                      }catch{}
                    }
                  }
                }
                if($upload){
                  Write-Output 'D07_NATIVE_IWXA_FILE_CHOOSER_UIA=PASS'
                  ActivateNative $upload
                  for($check=0;$check -lt 25;$check++){
                    $fileDialog=FindOpenDialog
                    if($fileDialog){break}
                    Start-Sleep -Milliseconds 250
                  }
                }else{
                  Write-Output 'D07_NATIVE_IWXA_FILE_CHOOSER_UIA=UNAVAILABLE'
                }
                if(!$fileDialog){
                  # Only the native tab key path: do not inject into the React
                  # DOM or replace the original T2 file import machinery.
                  for($tabSteps=1;$tabSteps -le 7 -and !$fileDialog;$tabSteps++){
                    # The activated Import tab can disappear from Edge's
                    # UIA tree while the tabpanel is rendered. Keep the native
                    # keyboard path; absence of a second tab handle is not
                    # evidence that the original T2 UI is unavailable.
                    $freshTab=FindNative 'Импортировать' $null
                    if($freshTab){
                      try{$freshTab.SetFocus()}catch{try{ActivateNative $freshTab}catch{}}
                      for($tab=0;$tab -lt $tabSteps;$tab++){
                        [System.Windows.Forms.SendKeys]::SendWait('{TAB}')
                      }
                    }else{
                      # Move one tabstop from the *current* browser focus.
                      # On the first pass this follows the just-activated tab.
                      [System.Windows.Forms.SendKeys]::SendWait('{TAB}')
                    }
                    if($tabSteps % 2 -eq 0){
                      [System.Windows.Forms.SendKeys]::SendWait(' ')
                    }else{
                      [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                    }
                    for($check=0;$check -lt 12;$check++){
                      $fileDialog=FindOpenDialog
                      if($fileDialog){break}
                      Start-Sleep -Milliseconds 250
                    }
                    if($fileDialog){
                      Write-Output ('D07_NATIVE_IWXA_DIALOG_TAB_DEPTH='+$tabSteps)
                    }
                  }
                }
                if(!$fileDialog){
                  # Edge can omit <input type=file> from UIA entirely.
                  # Use a real native Windows mouse click anchored to the
                  # visible import explanation just above that input, not
                  # synthetic DOM events or browser-side JS.
                  Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class D07NativePointer { [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hwnd); [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y); [DllImport("user32.dll")] public static extern void mouse_event(uint flags,uint x,uint y,uint data,UIntPtr extra); }'
                  $anchorRect=$null
                  foreach($edgeInstance in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $edgeWindow=[System.Windows.Automation.AutomationElement]::FromHandle(
                      [IntPtr]$edgeInstance.MainWindowHandle)
                    if(!$edgeWindow){continue}
                    $texts=$edgeWindow.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.PropertyCondition]::new(
                        [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                        [System.Windows.Automation.ControlType]::Text))
                    for($t=0;$t -lt $texts.Count;$t++){
                      try{
                        $item=$texts.Item($t)
                        if(!$item.Current.IsOffscreen -and
                          $item.Current.Name -match 'Выберите сохранённый пакет'){
                          $rect=$item.Current.BoundingRectangle
                          if($rect.Width -gt 60 -and $rect.Height -gt 8){
                            $anchorRect=$rect
                            $null=[D07NativePointer]::SetForegroundWindow(
                              [IntPtr]$edgeInstance.MainWindowHandle)
                            break
                          }
                        }
                      }catch{}
                    }
                    if($anchorRect){break}
                  }
                  Write-Output ('D07_NATIVE_IWXA_FILE_INPUT_ANCHOR_VISIBLE='+[bool]$anchorRect)
                  if($anchorRect){
                    foreach($deltaY in @(25,45,65)){
                      $clickX=[int]($anchorRect.Left+42)
                      $clickY=[int]($anchorRect.Bottom+$deltaY)
                      $null=[D07NativePointer]::SetCursorPos($clickX,$clickY)
                      Start-Sleep -Milliseconds 130
                      [D07NativePointer]::mouse_event([uint32]2,0,0,0,[UIntPtr]::Zero)
                      [D07NativePointer]::mouse_event([uint32]4,0,0,0,[UIntPtr]::Zero)
                      for($c=0;$c -lt 12;$c++){
                        Start-Sleep -Milliseconds 250
                        $fileDialog=FindOpenDialog
                        if($fileDialog){break}
                      }
                      if($fileDialog){
                        Write-Output ('D07_NATIVE_IWXA_CHOOSER_NATIVE_CLICK_OFFSET='+$deltaY)
                        break
                      }
                    }
                  }
                }
                if(!$fileDialog){throw 'D07_NATIVE_IWXA_WINDOWS_FILE_DIALOG_NOT_OPENED'}
                Write-Output 'D07_NATIVE_IWXA_WINDOWS_FILE_DIALOG=PASS'
                $dlgHwnd=[IntPtr]::new([int64]$fileDialog.Current.NativeWindowHandle)
                $edgePids=@(Get-Process msedge -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id)
                Write-Output ('D07_NATIVE_IWXA_DIALOG_IS_EDGE_PROCESS='+($edgePids -contains $fileDialog.Current.ProcessId))
                Write-Output ('D07_NATIVE_IWXA_DIALOG_IS_WIN32_CLASS='+($fileDialog.Current.ClassName -eq '#32770'))
                Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class D07DialogNative { [DllImport("user32.dll",SetLastError=true)] public static extern IntPtr GetDlgItem(IntPtr hDlg,int id); [DllImport("user32.dll",CharSet=CharSet.Unicode,SetLastError=true)] public static extern bool SetDlgItemText(IntPtr hDlg,int id,string value); [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr hWnd,uint msg,IntPtr wParam,IntPtr lParam); }'
                $win32FileNameHandle=[D07DialogNative]::GetDlgItem($dlgHwnd,1148)
                $win32OpenHandle=[D07DialogNative]::GetDlgItem($dlgHwnd,1)
                Write-Output ('D07_NATIVE_IWXA_DIALOG_WIN32_FILENAME_PRESENT='+($win32FileNameHandle -ne [IntPtr]::Zero))
                Write-Output ('D07_NATIVE_IWXA_DIALOG_WIN32_OPEN_PRESENT='+($win32OpenHandle -ne [IntPtr]::Zero))
                # Bring the actual modal to the Windows foreground. UIA
                # Window.SetFocus is not supported by this shell dialog.
                try {
                  Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class D07Win32Foreground { [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd); }' -ErrorAction Stop
                  $windowHandle=$fileDialog.Current.NativeWindowHandle
                  $foreground=($windowHandle -gt 0) -and
                    [D07Win32Foreground]::SetForegroundWindow([IntPtr]::new([int64]$windowHandle))
                  Write-Output ('D07_NATIVE_IWXA_DIALOG_FOREGROUND='+$foreground)
                }catch{
                  Write-Output 'D07_NATIVE_IWXA_DIALOG_FOREGROUND=UNAVAILABLE'
                }
                # Target the native File name edit, not the non-focusable
                # Windows dialog root. The exact local path never enters CI
                # console logs or uploaded artifacts.
                $fileNameEdit=$null
                $editControls=$fileDialog.FindAll(
                  [System.Windows.Automation.TreeScope]::Descendants,
                  [System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                    [System.Windows.Automation.ControlType]::Edit))
                Write-Output ('D07_NATIVE_IWXA_DIALOG_EDIT_COUNT='+$editControls.Count)
                for($n=0;$n -lt $editControls.Count;$n++){
                  $candidate=$editControls.Item($n)
                  if(!$candidate.Current.IsEnabled){continue}
                  if($candidate.Current.AutomationId -eq '1148' -or
                     $candidate.Current.Name -match '(?i)(file name|имя файла)'){
                    $fileNameEdit=$candidate;break
                  }
                }
                if(!$fileNameEdit -and $editControls.Count -eq 1){
                  $fileNameEdit=$editControls.Item(0)
                }
                $nativeValueSet=$false
                if($fileNameEdit){
                  $valuePattern=$null
                  try {
                    if($fileNameEdit.TryGetCurrentPattern(
                      [System.Windows.Automation.ValuePattern]::Pattern,
                      [ref]$valuePattern)){
                      ([System.Windows.Automation.ValuePattern]$valuePattern).SetValue($archive.FullName)
                      $nativeValueSet=$true
                      Write-Output 'D07_NATIVE_IWXA_FILE_NAME_VALUE_PATTERN=PASS'
                    }
                  }catch{}
                }
                if(!$nativeValueSet -and $win32FileNameHandle -ne [IntPtr]::Zero){
                  try {
                    $nativeValueSet=[D07DialogNative]::SetDlgItemText($dlgHwnd,1148,$archive.FullName)
                    Write-Output ('D07_NATIVE_IWXA_FILE_NAME_WIN32_SET='+$nativeValueSet)
                  }catch{
                    Write-Output 'D07_NATIVE_IWXA_FILE_NAME_WIN32_SET=UNAVAILABLE'
                  }
                }
                if(!$nativeValueSet){
                  # Windows en-US common dialog supports Alt+N to focus the
                  # File name edit. Only the ephemeral runner receives bytes.
                  if($fileNameEdit){
                    try{$fileNameEdit.SetFocus()}catch{}
                  }else{
                    [System.Windows.Forms.SendKeys]::SendWait('%n')
                  }
                  Set-Clipboard -Value $archive.FullName
                  [System.Windows.Forms.SendKeys]::SendWait('^a')
                  [System.Windows.Forms.SendKeys]::SendWait('^v')
                  Write-Output 'D07_NATIVE_IWXA_FILE_NAME_KEYBOARD=PASS'
                }
                $openButton=$null
                $buttons=$fileDialog.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                  [System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                    [System.Windows.Automation.ControlType]::Button))
                Write-Output ('D07_NATIVE_IWXA_DIALOG_BUTTON_COUNT='+$buttons.Count)
                for($n=0;$n -lt $buttons.Count;$n++){
                  $candidate=$buttons.Item($n)
                  if($candidate.Current.IsEnabled -and
                     ($candidate.Current.AutomationId -eq '1' -or
                      $candidate.Current.Name -match '(?i)^(&?Open|Открыть|Open\(&O\))$')){
                    $openButton=$candidate;break
                  }
                }
                $openByWin32=$false
                if(!$openButton -and $win32OpenHandle -ne [IntPtr]::Zero){
                  try {
                    $null=[D07DialogNative]::SendMessage(
                      $win32OpenHandle,[uint32]0x00F5,[IntPtr]::Zero,[IntPtr]::Zero)
                    $openByWin32=$true
                    Write-Output 'D07_NATIVE_IWXA_DIALOG_OPEN_WIN32=PASS'
                  }catch{}
                }
                if(!$openByWin32){
                  if($openButton){
                    ActivateNative $openButton
                    Write-Output 'D07_NATIVE_IWXA_DIALOG_OPEN_BUTTON=PASS'
                  }else{
                    [System.Windows.Forms.SendKeys]::SendWait('%o')
                    Write-Output 'D07_NATIVE_IWXA_DIALOG_OPEN_KEYBOARD=PASS'
                  }
                }
                $fileDialogClosed=$false
                for($attempt=0;$attempt -lt 24;$attempt++){
                  Start-Sleep -Milliseconds 250
                  if(!(FindOpenDialog)){$fileDialogClosed=$true;break}
                }
                if(!$fileDialogClosed){
                  # Native Windows may first consume Enter for a file-name
                  # autocomplete. Activate the Open shortcut explicitly.
                  [System.Windows.Forms.SendKeys]::SendWait('%o')
                  for($attempt=0;$attempt -lt 24;$attempt++){
                    Start-Sleep -Milliseconds 250
                    if(!(FindOpenDialog)){$fileDialogClosed=$true;break}
                  }
                }
                Write-Output ('D07_NATIVE_IWXA_DIALOG_CLOSED='+$fileDialogClosed)
                if(!$fileDialogClosed){throw 'D07_NATIVE_IWXA_DIALOG_REMAINS_OPEN'}
                Write-Output 'D07_NATIVE_IWXA_FILE_PATH_SUBMITTED=PASS'
                $importPreviewReady=$false
                for($attempt=0;$attempt -lt 70;$attempt++){
                  Start-Sleep -Milliseconds 500
                  $currentText=NativeText
                  if($currentText -match 'Режим импорта \(allowed_modes\)'){$importPreviewReady=$true;break}
                }
                if(!$importPreviewReady){
                  $currentText=NativeText
                  Write-Output ('D07_NATIVE_IWXA_PREVIEW_ERROR_VISIBLE='+
                    ($currentText -match '(?i)(импорт|пакет|файл).*(ошиб|не удалось|отклон|некоррект)'))
                  Write-Output ('D07_NATIVE_IWXA_PREVIEW_MISSING_PERMISSION='+ 
                    ($currentText -match 'Ядро разрешает только предпросмотр'))
                  throw 'D07_NATIVE_IWXA_PREVIEW_NOT_READY_AFTER_FILE_SELECTION'
                }
                Write-Output 'D07_NATIVE_IWXA_PHYSICAL_FILE_IMPORT_PREVIEW=PASS'
                # Import the source order into a fresh, separately identified
                # Workspace instead of silently merging with the original.
                $modeCombo=$null
                foreach($proc in @(Get-Process msedge -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowHandle -ne 0})){
                  $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
                  if(!$window){continue}
                  $combos=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                    [System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                      [System.Windows.Automation.ControlType]::ComboBox))
                  if($combos.Count -ge 2){
                    $modeCombo=$combos.Item($combos.Count-2)
                    break
                  }
                }
                if(!$modeCombo){throw 'D07_NATIVE_IWXA_MODE_COMBO_MISSING'}
                $modeCombo.SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
                [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
                [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
                [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                $null=WaitNative 'Новые workspace_id (создаются локально)' $null
                $edits=@()
                foreach($proc in @(Get-Process msedge -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowHandle -ne 0})){
                  $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
                  if(!$window){continue}
                  $inputs=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                    [System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                      [System.Windows.Automation.ControlType]::Edit))
                  for($k=0;$k -lt $inputs.Count;$k++){
                    $item=$inputs.Item($k)
                    if($item.Current.IsEnabled -and !$item.Current.IsOffscreen){$edits+=,$item}
                  }
                }
                if($edits.Count -lt 1){throw 'D07_NATIVE_IWXA_WORKSPACE_MAP_INPUT_MISSING'}
                $restoredName='d07-restored-native-case001'
                $edits[$edits.Count-1].SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait($restoredName)
                Start-Sleep -Milliseconds 500
                $historyToggle=FindNative 'История событий' ([System.Windows.Automation.ControlType]::CheckBox)
                if(!$historyToggle){throw 'D07_NATIVE_IWXA_IMPORT_HISTORY_CHECK_MISSING'}
                $toggle=[System.Windows.Automation.TogglePattern]$historyToggle.GetCurrentPattern(
                  [System.Windows.Automation.TogglePattern]::Pattern)
                if($toggle.Current.ToggleState -eq [System.Windows.Automation.ToggleState]::Off){$toggle.Toggle()}
                $commitButton=$null
                for($attempt=0;$attempt -lt 50;$attempt++){
                  $commitButton=FindNative 'Импортировать (1)' ([System.Windows.Automation.ControlType]::Button)
                  if($commitButton -and $commitButton.Current.IsEnabled){break}
                  Start-Sleep -Milliseconds 400
                }
                if(!$commitButton -or !$commitButton.Current.IsEnabled){
                  throw 'D07_NATIVE_IWXA_IMPORT_PLAN_NOT_ENABLED'
                }
                ActivateNative $commitButton
                $null=WaitNative 'Отчёт' $null
                $receiptText=NativeText
                if($receiptText -notmatch '(?s)Объектов создано\s+1'){
                  throw 'D07_NATIVE_IWXA_IMPORT_ONE_OBJECT_NOT_CONFIRMED'
                }
                if($receiptText -notmatch '(?s)Событий\s+[1-9][0-9]*'){
                  throw 'D07_NATIVE_IWXA_IMPORT_EVENTS_NOT_CONFIRMED'
                }
                if($receiptText -notmatch 'new-workspace'){
                  throw 'D07_NATIVE_IWXA_NEW_WORKSPACE_NOT_CONFIRMED'
                }
                # Verify the downloaded physical file has not been altered
                # during native file import. No digest or private bytes logged.
                $postImportHash=Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256
                if($postImportHash.Hash -ne $digest.Hash){
                  throw 'D07_NATIVE_IWXA_PHYSICAL_BYTES_CHANGED_DURING_IMPORT'
                }
                Write-Output 'D07_NATIVE_IWXA_SAME_FILE_SHA256_AFTER_IMPORT=PASS'
                Write-Output 'D07_NATIVE_IWXA_NEW_WORKSPACE_IMPORT_OBJECT_HISTORY=PASS'
                # An import receipt proves a commit, not user-accessible readback.
                # Return to the ORIGINAL T2 Host and open the order in the
                # newly created Workspace. Newer D07 UI exposes the exact
                # selected workspace ID rather than an ambiguous ordinal.
                $returnToService=WaitNative 'Мои услуги' ([System.Windows.Automation.ControlType]::Hyperlink)
                ActivateNative $returnToService
                $null=WaitNative 'Рабочая область для сохранения' $null
                $refreshAreas=FindNative 'Обновить' ([System.Windows.Automation.ControlType]::Button)
                if($refreshAreas){ActivateNative $refreshAreas}
                $workspaceSelector=$null
                for($attempt=0;$attempt -lt 40 -and !$workspaceSelector;$attempt++){
                  foreach($proc in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
                    if(!$window){continue}
                    $combos=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.PropertyCondition]::new(
                        [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                        [System.Windows.Automation.ControlType]::ComboBox))
                    if($combos.Count -ge 2){$workspaceSelector=$combos.Item(0);break}
                  }
                  if(!$workspaceSelector){Start-Sleep -Milliseconds 400}
                }
                if(!$workspaceSelector){throw 'D07_NATIVE_IWXA_RESTORED_HOST_PICKER_MISSING'}
                $workspaceSelector.SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait('{END}')
                [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                $restoredSelected=$false
                for($attempt=0;$attempt -lt 45;$attempt++){
                  Start-Sleep -Milliseconds 400
                  $visible=NativeText
                  if($visible -match [regex]::Escape('Идентификатор выбранной области: '+$restoredName)){
                    $restoredSelected=$true;break
                  }
                }
                if(!$restoredSelected){throw 'D07_NATIVE_IWXA_RESTORED_WORKSPACE_NOT_SELECTED'}
                Write-Output 'D07_NATIVE_IWXA_RESTORED_HOST_WORKSPACE_ID=PASS'
                $savedRestored=$null
                for($attempt=0;$attempt -lt 65 -and !$savedRestored;$attempt++){
                  foreach($proc in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
                    if(!$window){continue}
                    $buttons=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.PropertyCondition]::new(
                        [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                        [System.Windows.Automation.ControlType]::Button))
                    for($n=0;$n -lt $buttons.Count;$n++){
                      $candidate=$buttons.Item($n)
                      if($candidate.Current.IsEnabled -and $candidate.Current.Name -match 'Редакция\s+1\s*·'){
                        $savedRestored=$candidate;break
                      }
                    }
                    if($savedRestored){break}
                  }
                  if(!$savedRestored){Start-Sleep -Milliseconds 400}
                }
                if(!$savedRestored){throw 'D07_NATIVE_IWXA_RESTORED_ORDER_NOT_LISTED'}
                ActivateNative $savedRestored
                $null=WaitNative 'Документы этого заказа: 9' $null
                $readback=NativeText
                if(!$readback.Contains($originalObjectId) -or
                   $readback -notmatch 'редакция\s*:\s*1'){
                  throw 'D07_NATIVE_IWXA_RESTORED_OBJECT_REVISION_MISMATCH'
                }
                Write-Output 'D07_NATIVE_IWXA_RESTORED_HOST_OBJECT_DOCUMENTS=PASS'
                $importedHistory=$false
                for($attempt=0;$attempt -lt 50;$attempt++){
                  Start-Sleep -Milliseconds 400
                  if((NativeText) -match 'История Kernel: [1-9][0-9]* событий заказа'){
                    $importedHistory=$true;break
                  }
                }
                if(!$importedHistory){throw 'D07_NATIVE_IWXA_RESTORED_KERNEL_HISTORY_NOT_VISIBLE'}
                Write-Output 'D07_NATIVE_IWXA_RESTORED_HOST_KERNEL_HISTORY=PASS'
                Write-Output 'D07_NATIVE_IWXA_PHYSICAL_ROUNDTRIP=PASS'

              }
              # Browser profile is isolated to one case. Close its native Edge
              # process tree before opening the next to limit memory use.
              if($edgeProc){
                try{$edgeProc.Kill($true)}catch{}
              }
            }
            Write-Output 'D07_EDGE_UIA_CASES=1/1'
            Write-Output 'D07_REAL_KERNEL_RECEIPT_IWXA=NOT_RUN'
          }finally{
            foreach($edgeId in $started){Stop-Process -Id $edgeId -Force -ErrorAction SilentlyContinue}
            if($server){Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue}
          }
          # No private source, dist, screenshots, browser profiles or raw logs uploaded.
