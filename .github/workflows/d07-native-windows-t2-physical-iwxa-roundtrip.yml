name: D07 native Windows physical full Workspace IWXA roundtrip
on:
  push:
    branches: [work/2026-11-21-d07-workspace-quality]
    paths: [.github/workflows/d07-native-windows-t2-physical-iwxa-roundtrip.yml]
permissions:
  contents: read
jobs:
  native-uia:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SITE_SHA: be559ee1c866f23d5b5afcfd872dfa77cf54930c
      T2_SHA: e70de29b72b83e2546f7ab74b17572685a728c17
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      CI: 'true'
      IWXA_D07_PREVIEW_PORT: '55407'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Confirm private read access
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:GH_TOKEN)){throw 'D07_NATIVE_ACCESS_MISSING'}
          foreach($repo in @('Faust-S/uslugovod.ru','Faust-S/T2')){
            $null=& gh api "repos/$repo" --jq '.id' 2>$null
            if($LASTEXITCODE -ne 0){throw 'D07_NATIVE_ACCESS_DENIED'}
          }
          git config --global core.autocrlf false
          git config --global core.eol lf
          Write-Output 'D07_NATIVE_SOURCE_ACCESS=PASS'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: ${{ env.SITE_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: ${{ env.T2_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: t2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Build authentic T2 site privately
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -ne $env:SITE_SHA){throw 'D07_NATIVE_SITE_PIN_MISMATCH'}
          if((git -C ../t2 rev-parse HEAD).Trim() -ne $env:T2_SHA){throw 'D07_NATIVE_T2_PIN_MISMATCH'}
          & bun install --frozen-lockfile *> (Join-Path $env:RUNNER_TEMP 'd07-install.private.log')
          if($LASTEXITCODE -ne 0){throw 'D07_NATIVE_INSTALL_FAIL'}
          & bun run build:t2-integrated *> (Join-Path $env:RUNNER_TEMP 'd07-build.private.log')
          if($LASTEXITCODE -ne 0){throw 'D07_NATIVE_BUILD_FAIL'}
          if(-not (Test-Path 'dist/workspace/index.html')){throw 'D07_NATIVE_T2_ENTRY_MISSING'}
          Write-Output 'D07_NATIVE_ONE_DIST_T2=PASS'
      - name: Run native Edge UI Automation on original Host
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $origin='https://127.0.0.1:55407'
          $url=$origin+'/workspace/#/domain'
          $profile=Join-Path $env:RUNNER_TEMP 'd07-native-workspace-profile'
          $site=Join-Path $env:GITHUB_WORKSPACE 'site'
          $edge=@(
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Microsoft\Edge\Application\msedge.exe')
          )|Where-Object{Test-Path $_}|Select-Object -First 1
          if(-not $edge){throw 'D07_EDGE_NOT_INSTALLED'}
          $server=$null
          $edgeProc=$null
          function OpenEdge([string]$page){
            return Start-Process -FilePath $edge -ArgumentList @(
              '--force-renderer-accessibility','--ignore-certificate-errors',
              '--no-first-run','--no-default-browser-check','--disable-background-mode',
              "--user-data-dir=$profile","--app=$page"
            ) -PassThru
          }
          function CloseEdge {
            if($script:edgeProc){
              try{$script:edgeProc.Kill($true)}catch{}
              try{$script:edgeProc.WaitForExit(6000)}catch{}
            }
            Start-Sleep -Milliseconds 1200
          }
          function FindUIA([string]$label,[string]$kind){
            $name=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,$label)
            if($kind -eq 'button'){
              $type=[System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                [System.Windows.Automation.ControlType]::Button)
            }elseif($kind -eq 'link'){
              $type=[System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                [System.Windows.Automation.ControlType]::Hyperlink)
            }else{$type=$null}
            $condition=if($type){
              [System.Windows.Automation.AndCondition]::new($name,$type)
            }else{$name}
            foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue|
              Where-Object{$_.MainWindowHandle -ne 0})){
              try{
                $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                if(!$window){continue}
                $all=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,$condition)
                for($i=$all.Count-1;$i -ge 0;$i--){
                  $element=$all.Item($i)
                  if($element.Current.IsEnabled){return $element}
                }
              }catch{}
            }
            return $null
          }
          function WaitUIA([string]$label,[string]$kind,[int]$attempts=75){
            for($step=0;$step -lt $attempts;$step++){
              $found=FindUIA $label $kind
              if($found){return $found}
              Start-Sleep -Milliseconds 450
            }
            return $null
          }
          function ClickUIA([string]$label,[string]$kind='button'){
            $element=WaitUIA $label $kind
            if(!$element){throw ('D07_NATIVE_ACTION_NOT_FOUND: '+$label)}
            $pattern=[System.Windows.Automation.InvokePattern]$element.GetCurrentPattern(
              [System.Windows.Automation.InvokePattern]::Pattern)
            $pattern.Invoke()
            Start-Sleep -Milliseconds 250
          }
          function HasText([string]$part){
            foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue|
              Where-Object{$_.MainWindowHandle -ne 0})){
              try{
                $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                if(!$window){continue}
                $all=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                  [System.Windows.Automation.Condition]::TrueCondition)
                for($i=0;$i -lt $all.Count;$i++){
                  $label=$all.Item($i).Current.Name
                  if($label -and $label.Contains($part)){return $true}
                }
              }catch{}
            }
            return $false
          }
          function WaitText([string]$part,[int]$attempts=75){
            for($i=0;$i -lt $attempts;$i++){
              if(HasText $part){return $true}
              Start-Sleep -Milliseconds 500
            }
            return $false
          }
          try{
            # Run canonical preview's own preflight before attempting UIA.
            # Never expose internal source, dist, profiles or raw server logs.
            $preflight=Join-Path $env:RUNNER_TEMP 'd07-preview-preflight.private.log'
            & node scripts/preview-d07-integrated-site.mjs --check *> $preflight
            if($LASTEXITCODE -ne 0){
              $codes=@(Select-String -Path $preflight -Pattern 'D07_LOCAL_PREVIEW_[A-Z0-9_]+' -AllMatches |
                ForEach-Object {$_.Matches.Value} | Select-Object -Unique)
              if($codes.Count -gt 0){Write-Output ('D07_PREVIEW_CODE='+($codes -join ','))}
              throw 'D07_NATIVE_PREVIEW_PREFLIGHT_FAIL'
            }
            Write-Output 'D07_NATIVE_PREVIEW_PREFLIGHT=PASS'
            $server=Start-Process -FilePath 'node' -WorkingDirectory $site -ArgumentList @(
              'scripts/preview-d07-integrated-site.mjs'
            ) -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'd07-host.private.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'd07-host-error.private.log') -PassThru
            $ready=$false
            for($i=0;$i -lt 120;$i++){
              Start-Sleep -Milliseconds 600
              if($server.HasExited){break}
              try{
                $response=Invoke-WebRequest -Uri ($origin+'/workspace/') -SkipCertificateCheck -TimeoutSec 2
                if($response.StatusCode -eq 200){$ready=$true;break}
              }catch{}
            }
            if(!$ready){
              $errorFile=Join-Path $env:RUNNER_TEMP 'd07-host-error.private.log'
              if(Test-Path $errorFile){
                $codes=@(Select-String -Path $errorFile -Pattern 'D07_LOCAL_PREVIEW_[A-Z0-9_]+' -AllMatches |
                  ForEach-Object {$_.Matches.Value} | Select-Object -Unique)
                if($codes.Count -gt 0){Write-Output ('D07_PREVIEW_CODE='+($codes -join ','))}
              }
              if($server.HasExited){throw 'D07_NATIVE_HTTPS_PROCESS_EXITED'}
              throw 'D07_NATIVE_HTTPS_NOT_READY'
            }
            Write-Output 'D07_NATIVE_HTTPS_HOST=PASS'
            $edgeProc=OpenEdge $url
            $new=WaitUIA 'Новый заказ' 'button' 60
            if(!$new){
              $first=WaitUIA 'Создать рабочую область' 'button' 80
              if(!$first){
                # Report only static UI states from our clean, empty test
                # profile; never dump the accessibility tree or user data.
                $allowed=@(
                  'Мои услуги','Рабочая область','Создать рабочую область',
                  'Новая рабочая область','Новый заказ',
                  'Kernel session is not ready','T2: checking existing workspaces',
                  'T2 Capability','Список рабочих областей',
                  'Рабочих областей пока нет','Загрузка','Не удалось'
                )
                $windows=@(Get-Process msedge -ErrorAction SilentlyContinue |
                  Where-Object{$_.MainWindowHandle -ne 0})
                Write-Output ('D07_NATIVE_EDGE_WINDOWS='+$windows.Count)
                $markers=[System.Collections.Generic.HashSet[string]]::new()
                foreach($proc in $windows){
                  try{
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
                    if(!$window){continue}
                    $all=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.Condition]::TrueCondition)
                    for($i=0;$i -lt $all.Count;$i++){
                      $text=$all.Item($i).Current.Name
                      if(!$text){continue}
                      foreach($label in $allowed){
                        if($text.Contains($label)){$null=$markers.Add($label)}
                      }
                    }
                  }catch{}
                }
                foreach($label in $allowed){
                  if($markers.Contains($label)){Write-Output ('D07_NATIVE_UI_VISIBLE='+$label)}
                }
                throw 'D07_NATIVE_FIRST_RUN_ENTRY_MISSING'
              }
              ClickUIA 'Создать рабочую область'
              # The original Host may provision through its first-run gate
              # or expose its ordinary Workspaces list and confirmation.
              $route='unknown'
              for($i=0;$i -lt 55;$i++){
                if(FindUIA 'Новый заказ' 'button'){$route='gate';break}
                if(FindUIA 'Новая рабочая область' 'button'){$route='catalog';break}
                Start-Sleep -Milliseconds 450
              }
              if($route -eq 'catalog'){
                ClickUIA 'Новая рабочая область'
                ClickUIA 'Создать рабочую область'
                Start-Sleep -Seconds 2
              }elseif($route -ne 'gate'){
                throw 'D07_NATIVE_WORKSPACE_CREATE_NOT_CONFIRMED'
              }
              CloseEdge
              $edgeProc=OpenEdge $url
              if(!(WaitUIA 'Новый заказ' 'button' 90)){
                throw 'D07_NATIVE_WORKSPACE_RETURN_FAILED'
              }
              Write-Output 'D07_NATIVE_T2_FIRST_WORKSPACE=PASS'
            }else{
              Write-Output 'D07_NATIVE_T2_WORKSPACE_AVAILABLE=PASS'
            }
            ClickUIA 'Новый заказ'
            $save=WaitUIA 'Сохранить заказ' 'button' 90
            if(!$save){throw 'D07_NATIVE_SAVE_NOT_ENABLED'}
            ClickUIA 'Сохранить заказ'
            if(!(WaitText 'Заказ сохранён и повторно прочитан' 85)){
              throw 'D07_NATIVE_KERNEL_READBACK_NOT_VISIBLE'
            }
            Write-Output 'D07_NATIVE_ORDER_SAVE_RECEIPT=PASS'
            CloseEdge
            $edgeProc=OpenEdge $url
            if(!(WaitText 'Изменения сохранены в Workspace' 90)){
              throw 'D07_NATIVE_COLD_REOPEN_MISSING'
            }
            if(!(WaitText 'Редакция 1' 30)){
              throw 'D07_NATIVE_ORDER_REVISION_NOT_VISIBLE'
            }
            Write-Output 'D07_NATIVE_LAST_ORDER_COLD_REOPEN=PASS'
            ClickUIA 'Копия и перенос (.iwxa)' 'link'
            if(!(WaitText 'Сохранение и перенос заказов' 70)){
              throw 'D07_NATIVE_EXCHANGE_ROUTE_NOT_VISIBLE'
            }
            Write-Output 'D07_NATIVE_ORIGINAL_IWXA_EXCHANGE=PASS'

            Add-Type -AssemblyName System.Windows.Forms
            function FindNative([string]$name,$controlType){
              $nameCond=[System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::NameProperty,$name)
              $condition=if($controlType){
                [System.Windows.Automation.AndCondition]::new($nameCond,
                  [System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::ControlTypeProperty,$controlType))
              }else{$nameCond}
              foreach($proc in @(Get-Process msedge -ErrorAction SilentlyContinue |
                  Where-Object{$_.MainWindowHandle -ne 0})){
                try {
                  $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
                  if(!$window){continue}
                  $found=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,$condition)
                  for($i=$found.Count-1;$i -ge 0;$i--){
                    $item=$found.Item($i)
                    if($item.Current.IsEnabled){return $item}
                  }
                }catch{}
              }
              return $null
            }
            function WaitNative([string]$name,$controlType) {
              for($n=0;$n -lt 75;$n++){
                $element=FindNative $name $controlType
                if($element){return $element}
                Start-Sleep -Milliseconds 450
              }
              throw 'D07_NATIVE_IWXA_REQUIRED_CONTROL_MISSING'
            }
            function ActivateNative($item) {
              if(!$item -or !$item.Current.IsEnabled){throw 'D07_NATIVE_IWXA_CONTROL_DISABLED'}
              $pattern=$null
              if($item.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern,[ref]$pattern)){
                ([System.Windows.Automation.InvokePattern]$pattern).Invoke()
              }else{
                $select=$null
                if($item.TryGetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern,[ref]$select)){
                  ([System.Windows.Automation.SelectionItemPattern]$select).Select()
                }else{
                  $item.SetFocus()
                  [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                }
              }
              Start-Sleep -Milliseconds 350
            }
            function NativeText {
              $result=[System.Collections.Generic.List[string]]::new()
              foreach($proc in @(Get-Process msedge -ErrorAction SilentlyContinue |
                  Where-Object{$_.MainWindowHandle -ne 0})){
                try {
                  $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
                  if(!$window){continue}
                  $nodes=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                    [System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                      [System.Windows.Automation.ControlType]::Text))
                  for($i=0;$i -lt $nodes.Count;$i++){
                    $value=$nodes.Item($i).Current.Name
                    if(-not [string]::IsNullOrWhiteSpace($value)){$result.Add($value)}
                  }
                }catch{}
              }
              return [string]::Join(' ',$result)
            }


            # Download a real, complete Workspace archive using original T2
            # Exchange. Selection must contain the one fresh test Workspace.
            # The canonical T2 Exchange opens the Export tab by default.
            # Do not force focus onto an inaccessible TabItem.
            $null=WaitNative 'Экспортировать' $null
            $null=WaitNative 'Рабочие области' $null
            $historyCheck=FindNative 'История событий' ([System.Windows.Automation.ControlType]::CheckBox)
            if($historyCheck){
              $toggle=[System.Windows.Automation.TogglePattern]$historyCheck.GetCurrentPattern(
                [System.Windows.Automation.TogglePattern]::Pattern)
              if($toggle.Current.ToggleState -eq [System.Windows.Automation.ToggleState]::Off){$toggle.Toggle()}
            }
            ActivateNative (WaitNative 'Предпросмотр' ([System.Windows.Automation.ControlType]::Button))
            $null=WaitNative 'Ориент. размер' $null
            $snapshot=NativeText
            if($snapshot -notmatch '(?s)Объектов\s+1'){
              throw 'D07_NATIVE_IWXA_EXPORT_ONE_OBJECT_NOT_CONFIRMED'
            }
            if($snapshot -notmatch '(?s)Событий\s+[1-9][0-9]*'){
              throw 'D07_NATIVE_IWXA_EXPORT_HISTORY_NOT_CONFIRMED'
            }
            Write-Output 'D07_NATIVE_IWXA_WORKSPACE_PREVIEW=PASS'
            ActivateNative (WaitNative 'Собрать архив' ([System.Windows.Automation.ControlType]::Button))
            $null=WaitNative 'Архив' $null
            ActivateNative (WaitNative 'Скачать .iwxa' ([System.Windows.Automation.ControlType]::Button))
            $archive=$null
            for($attempt=0;$attempt -lt 100;$attempt++){
              Start-Sleep -Milliseconds 450
              $found=@()
              foreach($folder in @((Join-Path $env:USERPROFILE 'Downloads'),$env:RUNNER_TEMP)){
                if(Test-Path $folder){
                  $found+=@(Get-ChildItem -LiteralPath $folder -File -Filter '*.iwxa' -Recurse -ErrorAction SilentlyContinue |
                    Where-Object {$_.Length -gt 0})
                }
              }
              if($found.Count -eq 1){$archive=$found[0];break}
              if($found.Count -gt 1){throw 'D07_NATIVE_IWXA_DOWNLOAD_AMBIGUOUS'}
            }
            if(!$archive){throw 'D07_NATIVE_IWXA_DOWNLOAD_BYTES_NOT_FOUND'}
            $digest=Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256
            if($archive.Length -lt 128 -or !$digest.Hash -or $digest.Hash.Length -ne 64){
              throw 'D07_NATIVE_IWXA_BYTES_INTEGRITY_INVALID'
            }
            Write-Output 'D07_NATIVE_IWXA_PHYSICAL_BYTES_AND_SHA256=PASS'
            ActivateNative (WaitNative 'Подтвердить приём' ([System.Windows.Automation.ControlType]::Button))
            $null=WaitNative 'Приём подтверждён' $null
            Write-Output 'D07_NATIVE_IWXA_EXPORT_RECEIPT=PASS'
            # Import below uses the SAME downloaded file and the existing
            # original-T2 native Windows file dialog. Never create fake data.

                $importTab=WaitNative 'Импортировать' $null
                # React's role=tab accepts keyboard ENTER. SelectionItem.Select
                # alone changes the accessible selected state but does not keep
                # the file-input keyboard path that previously opened the dialog.
                ActivateNative $importTab
                Start-Sleep -Milliseconds 400
                $importPanelVisible=(NativeText) -match 'Выберите сохранённый пакет'
                Write-Output ('D07_NATIVE_IWXA_IMPORT_PANEL_VISIBLE='+$importPanelVisible)
                if(!$importPanelVisible){throw 'D07_NATIVE_IWXA_IMPORT_PANEL_NOT_SELECTED'}
                Write-Output 'D07_NATIVE_IWXA_IMPORT_TAB=PASS'
                # Native Edge exposes input[type=file] differently across
                # Windows runner versions. Locate a real chooser or navigate
                # from the accessible tab using actual keyboard focus.
                function FindOpenDialog {
                  $roots=[System.Windows.Automation.AutomationElement]::RootElement.FindAll(
                    [System.Windows.Automation.TreeScope]::Children,
                    [System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                      [System.Windows.Automation.ControlType]::Window))
                  $edgeIds=@(Get-Process msedge -ErrorAction SilentlyContinue |
                    Select-Object -ExpandProperty Id)
                  for($i=0;$i -lt $roots.Count;$i++){
                    $win=$roots.Item($i)
                    try {
                      $title=$win.Current.Name
                      $class=$win.Current.ClassName
                      $namedFileChooser=$title -match '(?i)^(Open|Открыть|Открытие|Select file|Choose file to upload|Выберите файл|File Upload)$'
                      # #32770 is shared by unrelated OS dialogs. Only
                      # accept one with a file-open title, or an Edge-owned
                      # window exposing real editable file controls.
                      if($namedFileChooser){return $win}
                      if($class -ne '#32770' -or $edgeIds -notcontains $win.Current.ProcessId){continue}
                      $edits=$win.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                        [System.Windows.Automation.PropertyCondition]::new(
                          [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                          [System.Windows.Automation.ControlType]::Edit))
                      if($edits.Count -gt 0){return $win}
                    }catch{}
                  }
                  return $null
                }
                $fileDialog=$null
                $upload=FindNative 'Выберите файл .iwxa' $null
                if(!$upload){
                  foreach($proc in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
                    if(!$window){continue}
                    foreach($type in @(
                      [System.Windows.Automation.ControlType]::Button,
                      [System.Windows.Automation.ControlType]::Edit,
                      [System.Windows.Automation.ControlType]::Custom)){
                      $controls=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                        [System.Windows.Automation.PropertyCondition]::new(
                          [System.Windows.Automation.AutomationElement]::ControlTypeProperty,$type))
                      for($n=0;$n -lt $controls.Count;$n++){
                        $candidate=$controls.Item($n)
                        if($candidate.Current.IsEnabled -and
                           $candidate.Current.Name -match '(?i)(choose file|browse|выбрать файл|обзор|выберите файл[.]iwxa)'){
                          $upload=$candidate;break
                        }
                      }
                      if($upload){break}
                    }
                    if($upload){break}
                  }
                }
                # Whitelisted accessibility metadata only; never log input
                # values, source strings, filenames or archive paths.
                try {
                  Write-Output ('D07_NATIVE_IWXA_IMPORT_TAB_CONTROL='+$importTab.Current.ControlType.ProgrammaticName)
                }catch{
                  Write-Output 'D07_NATIVE_IWXA_IMPORT_TAB_CONTROL=STALE'
                }
                if(!$upload){
                  foreach($proc in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
                    if(!$window){continue}
                    $nodes=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.Condition]::TrueCondition)
                    $seen=0
                    for($k=0;$k -lt $nodes.Count -and $seen -lt 6;$k++){
                      try {
                        $current=$nodes.Item($k).Current
                        if($current.Name -match '(?i)(выберите файл[.]iwxa|choose file|browse|выбрать файл|обзор)'){
                          Write-Output ('D07_NATIVE_IWXA_CHOOSER_CANDIDATE_CONTROL='+$current.ControlType.ProgrammaticName)
                          Write-Output ('D07_NATIVE_IWXA_CHOOSER_CANDIDATE_FOCUSABLE='+$current.IsKeyboardFocusable)
                          $seen++
                        }
                      }catch{}
                    }
                  }
                }
                if($upload){
                  Write-Output 'D07_NATIVE_IWXA_FILE_CHOOSER_UIA=PASS'
                  ActivateNative $upload
                  for($check=0;$check -lt 25;$check++){
                    $fileDialog=FindOpenDialog
                    if($fileDialog){break}
                    Start-Sleep -Milliseconds 250
                  }
                }else{
                  Write-Output 'D07_NATIVE_IWXA_FILE_CHOOSER_UIA=UNAVAILABLE'
                }
                if(!$fileDialog){
                  # Only the native tab key path: do not inject into the React
                  # DOM or replace the original T2 file import machinery.
                  for($tabSteps=1;$tabSteps -le 7 -and !$fileDialog;$tabSteps++){
                    # The activated Import tab can disappear from Edge's
                    # UIA tree while the tabpanel is rendered. Keep the native
                    # keyboard path; absence of a second tab handle is not
                    # evidence that the original T2 UI is unavailable.
                    $freshTab=FindNative 'Импортировать' $null
                    if($freshTab){
                      try{$freshTab.SetFocus()}catch{try{ActivateNative $freshTab}catch{}}
                      for($tab=0;$tab -lt $tabSteps;$tab++){
                        [System.Windows.Forms.SendKeys]::SendWait('{TAB}')
                      }
                    }else{
                      # Move one tabstop from the *current* browser focus.
                      # On the first pass this follows the just-activated tab.
                      [System.Windows.Forms.SendKeys]::SendWait('{TAB}')
                    }
                    if($tabSteps % 2 -eq 0){
                      [System.Windows.Forms.SendKeys]::SendWait(' ')
                    }else{
                      [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                    }
                    for($check=0;$check -lt 12;$check++){
                      $fileDialog=FindOpenDialog
                      if($fileDialog){break}
                      Start-Sleep -Milliseconds 250
                    }
                    if($fileDialog){
                      Write-Output ('D07_NATIVE_IWXA_DIALOG_TAB_DEPTH='+$tabSteps)
                    }
                  }
                }
                if(!$fileDialog){
                  # Edge can omit <input type=file> from UIA entirely.
                  # Use a real native Windows mouse click anchored to the
                  # visible import explanation just above that input, not
                  # synthetic DOM events or browser-side JS.
                  Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class D07NativePointer { [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hwnd); [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y); [DllImport("user32.dll")] public static extern void mouse_event(uint flags,uint x,uint y,uint data,UIntPtr extra); }'
                  $anchorRect=$null
                  foreach($edgeInstance in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $edgeWindow=[System.Windows.Automation.AutomationElement]::FromHandle(
                      [IntPtr]$edgeInstance.MainWindowHandle)
                    if(!$edgeWindow){continue}
                    $texts=$edgeWindow.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.PropertyCondition]::new(
                        [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                        [System.Windows.Automation.ControlType]::Text))
                    for($t=0;$t -lt $texts.Count;$t++){
                      try{
                        $item=$texts.Item($t)
                        if(!$item.Current.IsOffscreen -and
                          $item.Current.Name -match 'Выберите сохранённый пакет'){
                          $rect=$item.Current.BoundingRectangle
                          if($rect.Width -gt 60 -and $rect.Height -gt 8){
                            $anchorRect=$rect
                            $null=[D07NativePointer]::SetForegroundWindow(
                              [IntPtr]$edgeInstance.MainWindowHandle)
                            break
                          }
                        }
                      }catch{}
                    }
                    if($anchorRect){break}
                  }
                  Write-Output ('D07_NATIVE_IWXA_FILE_INPUT_ANCHOR_VISIBLE='+[bool]$anchorRect)
                  if($anchorRect){
                    foreach($deltaY in @(25,45,65)){
                      $clickX=[int]($anchorRect.Left+42)
                      $clickY=[int]($anchorRect.Bottom+$deltaY)
                      $null=[D07NativePointer]::SetCursorPos($clickX,$clickY)
                      Start-Sleep -Milliseconds 130
                      [D07NativePointer]::mouse_event([uint32]2,0,0,0,[UIntPtr]::Zero)
                      [D07NativePointer]::mouse_event([uint32]4,0,0,0,[UIntPtr]::Zero)
                      for($c=0;$c -lt 12;$c++){
                        Start-Sleep -Milliseconds 250
                        $fileDialog=FindOpenDialog
                        if($fileDialog){break}
                      }
                      if($fileDialog){
                        Write-Output ('D07_NATIVE_IWXA_CHOOSER_NATIVE_CLICK_OFFSET='+$deltaY)
                        break
                      }
                    }
                  }
                }
                if(!$fileDialog){
                  # The original T2 ImportView is a native input[type=file]
                  # after a paragraph inside the packages tabpanel. Edge can
                  # virtualize that input and its paragraph while scrolled.
                  # First scroll the real tab into view through Windows UIA.
                  $liveTab=FindNative 'Импортировать' ([System.Windows.Automation.ControlType]::TabItem)
                  if(!$liveTab){$liveTab=$importTab}
                  $tabBounds=$null
                  try{
                    $scrollPattern=$null
                    if($liveTab.TryGetCurrentPattern(
                      [System.Windows.Automation.ScrollItemPattern]::Pattern,
                      [ref]$scrollPattern)){
                      ([System.Windows.Automation.ScrollItemPattern]$scrollPattern).ScrollIntoView()
                    }
                    $liveTab.SetFocus()
                    $tabBounds=$liveTab.Current.BoundingRectangle
                    Write-Output ('D07_NATIVE_IWXA_IMPORT_TAB_ONSCREEN='+(!$liveTab.Current.IsOffscreen))
                  }catch{
                    Write-Output 'D07_NATIVE_IWXA_IMPORT_TAB_SCROLL=UNAVAILABLE'
                  }
                  Start-Sleep -Milliseconds 300
                  $scrolledChooser=FindNative 'Выберите файл .iwxa' $null
                  if($scrolledChooser){
                    try{
                      ActivateNative $scrolledChooser
                      for($check=0;$check -lt 12 -and !$fileDialog;$check++){
                        Start-Sleep -Milliseconds 250
                        $fileDialog=FindOpenDialog
                      }
                    }catch{}
                  }
                  if(!$fileDialog -and $tabBounds -and $tabBounds.Width -gt 40 -and
                     $tabBounds.Height -gt 12){
                    # Physically click in the original T2 file-input region.
                    # Use the visible tab's bounding rectangle, not guessed
                    # absolute screen coordinates. No DOM injection or mock.
                    $display=[System.Windows.Forms.SystemInformation]::VirtualScreen
                    $ownerHwnd=[IntPtr]::Zero
                    try{
                      $ownerPid=$liveTab.Current.ProcessId
                      $edgeOwner=Get-Process -Id $ownerPid -ErrorAction SilentlyContinue
                      if($edgeOwner -and $edgeOwner.MainWindowHandle -ne 0){
                        $ownerHwnd=[IntPtr]$edgeOwner.MainWindowHandle
                      }
                    }catch{}
                    if($ownerHwnd -eq [IntPtr]::Zero){
                      $firstEdge=@(Get-Process msedge -ErrorAction SilentlyContinue |
                        Where-Object {$_.MainWindowHandle -ne 0} | Select-Object -First 1)
                      if($firstEdge.Count -gt 0){
                        $ownerHwnd=[IntPtr]$firstEdge[0].MainWindowHandle
                      }
                    }
                    if($ownerHwnd -ne [IntPtr]::Zero){
                      $null=[D07NativePointer]::SetForegroundWindow($ownerHwnd)
                    }
                    $tabX=[int]($tabBounds.Left+[Math]::Min(36,$tabBounds.Width/2))
                    $tabY=[int]($tabBounds.Top+$tabBounds.Height/2)
                    if($tabX -ge $display.Left -and $tabX -lt $display.Right -and
                       $tabY -ge $display.Top -and $tabY -lt $display.Bottom){
                      $null=[D07NativePointer]::SetCursorPos($tabX,$tabY)
                      Start-Sleep -Milliseconds 200
                      [D07NativePointer]::mouse_event([uint32]2,0,0,0,[UIntPtr]::Zero)
                      [D07NativePointer]::mouse_event([uint32]4,0,0,0,[UIntPtr]::Zero)
                      Start-Sleep -Milliseconds 250
                      [System.Windows.Forms.SendKeys]::SendWait('{TAB}')
                      [System.Windows.Forms.SendKeys]::SendWait(' ')
                      for($check=0;$check -lt 12 -and !$fileDialog;$check++){
                        Start-Sleep -Milliseconds 250
                        $fileDialog=FindOpenDialog
                      }
                      if($fileDialog){Write-Output 'D07_NATIVE_IWXA_CHOOSER_FOCUSED_TAB=PASS'}
                    }
                    if(!$fileDialog){
                      foreach($offsetY in @(56,76,96,116,136,156,176)){
                        foreach($offsetX in @(30,100)){
                          $clickX=[int]($tabBounds.Left+$offsetX)
                          $clickY=[int]($tabBounds.Bottom+$offsetY)
                          if($clickX -lt $display.Left -or $clickX -ge $display.Right -or
                             $clickY -lt $display.Top -or $clickY -ge $display.Bottom){continue}
                          $null=[D07NativePointer]::SetCursorPos($clickX,$clickY)
                          Start-Sleep -Milliseconds 100
                          [D07NativePointer]::mouse_event([uint32]2,0,0,0,[UIntPtr]::Zero)
                          [D07NativePointer]::mouse_event([uint32]4,0,0,0,[UIntPtr]::Zero)
                          for($check=0;$check -lt 5 -and !$fileDialog;$check++){
                            Start-Sleep -Milliseconds 250
                            $fileDialog=FindOpenDialog
                          }
                          if($fileDialog){
                            Write-Output ('D07_NATIVE_IWXA_CHOOSER_TAB_RELATIVE_Y='+$offsetY)
                            break
                          }
                        }
                        if($fileDialog){break}
                      }
                    }
                  }else{
                    Write-Output 'D07_NATIVE_IWXA_IMPORT_TAB_GEOMETRY_UNAVAILABLE'
                  }
                }
                if(!$fileDialog){throw 'D07_NATIVE_IWXA_WINDOWS_FILE_DIALOG_NOT_OPENED'}
                Write-Output 'D07_NATIVE_IWXA_WINDOWS_FILE_DIALOG=PASS'
                $dlgHwnd=[IntPtr]::new([int64]$fileDialog.Current.NativeWindowHandle)
                $edgePids=@(Get-Process msedge -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id)
                Write-Output ('D07_NATIVE_IWXA_DIALOG_IS_EDGE_PROCESS='+($edgePids -contains $fileDialog.Current.ProcessId))
                Write-Output ('D07_NATIVE_IWXA_DIALOG_IS_WIN32_CLASS='+($fileDialog.Current.ClassName -eq '#32770'))
                Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class D07DialogNative { [DllImport("user32.dll",SetLastError=true)] public static extern IntPtr GetDlgItem(IntPtr hDlg,int id); [DllImport("user32.dll",CharSet=CharSet.Unicode,SetLastError=true)] public static extern bool SetDlgItemText(IntPtr hDlg,int id,string value); [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr hWnd,uint msg,IntPtr wParam,IntPtr lParam); }'
                $win32FileNameHandle=[D07DialogNative]::GetDlgItem($dlgHwnd,1148)
                $win32OpenHandle=[D07DialogNative]::GetDlgItem($dlgHwnd,1)
                Write-Output ('D07_NATIVE_IWXA_DIALOG_WIN32_FILENAME_PRESENT='+($win32FileNameHandle -ne [IntPtr]::Zero))
                Write-Output ('D07_NATIVE_IWXA_DIALOG_WIN32_OPEN_PRESENT='+($win32OpenHandle -ne [IntPtr]::Zero))
                # Bring the actual modal to the Windows foreground. UIA
                # Window.SetFocus is not supported by this shell dialog.
                try {
                  Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class D07Win32Foreground { [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd); }' -ErrorAction Stop
                  $windowHandle=$fileDialog.Current.NativeWindowHandle
                  $foreground=($windowHandle -gt 0) -and
                    [D07Win32Foreground]::SetForegroundWindow([IntPtr]::new([int64]$windowHandle))
                  Write-Output ('D07_NATIVE_IWXA_DIALOG_FOREGROUND='+$foreground)
                }catch{
                  Write-Output 'D07_NATIVE_IWXA_DIALOG_FOREGROUND=UNAVAILABLE'
                }
                # Target the native File name edit, not the non-focusable
                # Windows dialog root. The exact local path never enters CI
                # console logs or uploaded artifacts.
                $fileNameEdit=$null
                $editControls=$fileDialog.FindAll(
                  [System.Windows.Automation.TreeScope]::Descendants,
                  [System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                    [System.Windows.Automation.ControlType]::Edit))
                Write-Output ('D07_NATIVE_IWXA_DIALOG_EDIT_COUNT='+$editControls.Count)
                for($n=0;$n -lt $editControls.Count;$n++){
                  $candidate=$editControls.Item($n)
                  if(!$candidate.Current.IsEnabled){continue}
                  if($candidate.Current.AutomationId -eq '1148' -or
                     $candidate.Current.Name -match '(?i)(file name|имя файла)'){
                    $fileNameEdit=$candidate;break
                  }
                }
                if(!$fileNameEdit -and $editControls.Count -eq 1){
                  $fileNameEdit=$editControls.Item(0)
                }
                $nativeValueSet=$false
                if($fileNameEdit){
                  $valuePattern=$null
                  try {
                    if($fileNameEdit.TryGetCurrentPattern(
                      [System.Windows.Automation.ValuePattern]::Pattern,
                      [ref]$valuePattern)){
                      ([System.Windows.Automation.ValuePattern]$valuePattern).SetValue($archive.FullName)
                      $nativeValueSet=$true
                      Write-Output 'D07_NATIVE_IWXA_FILE_NAME_VALUE_PATTERN=PASS'
                    }
                  }catch{}
                }
                if(!$nativeValueSet -and $win32FileNameHandle -ne [IntPtr]::Zero){
                  try {
                    $nativeValueSet=[D07DialogNative]::SetDlgItemText($dlgHwnd,1148,$archive.FullName)
                    Write-Output ('D07_NATIVE_IWXA_FILE_NAME_WIN32_SET='+$nativeValueSet)
                  }catch{
                    Write-Output 'D07_NATIVE_IWXA_FILE_NAME_WIN32_SET=UNAVAILABLE'
                  }
                }
                if(!$nativeValueSet){
                  # Windows en-US common dialog supports Alt+N to focus the
                  # File name edit. Only the ephemeral runner receives bytes.
                  if($fileNameEdit){
                    try{$fileNameEdit.SetFocus()}catch{}
                  }else{
                    [System.Windows.Forms.SendKeys]::SendWait('%n')
                  }
                  Set-Clipboard -Value $archive.FullName
                  [System.Windows.Forms.SendKeys]::SendWait('^a')
                  [System.Windows.Forms.SendKeys]::SendWait('^v')
                  Write-Output 'D07_NATIVE_IWXA_FILE_NAME_KEYBOARD=PASS'
                }
                $openButton=$null
                $buttons=$fileDialog.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                  [System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                    [System.Windows.Automation.ControlType]::Button))
                Write-Output ('D07_NATIVE_IWXA_DIALOG_BUTTON_COUNT='+$buttons.Count)
                for($n=0;$n -lt $buttons.Count;$n++){
                  $candidate=$buttons.Item($n)
                  if($candidate.Current.IsEnabled -and
                     ($candidate.Current.AutomationId -eq '1' -or
                      $candidate.Current.Name -match '(?i)^(&?Open|Открыть|Open\(&O\))$')){
                    $openButton=$candidate;break
                  }
                }
                $openByWin32=$false
                if(!$openButton -and $win32OpenHandle -ne [IntPtr]::Zero){
                  try {
                    $null=[D07DialogNative]::SendMessage(
                      $win32OpenHandle,[uint32]0x00F5,[IntPtr]::Zero,[IntPtr]::Zero)
                    $openByWin32=$true
                    Write-Output 'D07_NATIVE_IWXA_DIALOG_OPEN_WIN32=PASS'
                  }catch{}
                }
                if(!$openByWin32){
                  if($openButton){
                    ActivateNative $openButton
                    Write-Output 'D07_NATIVE_IWXA_DIALOG_OPEN_BUTTON=PASS'
                  }else{
                    [System.Windows.Forms.SendKeys]::SendWait('%o')
                    Write-Output 'D07_NATIVE_IWXA_DIALOG_OPEN_KEYBOARD=PASS'
                  }
                }
                $fileDialogClosed=$false
                for($attempt=0;$attempt -lt 24;$attempt++){
                  Start-Sleep -Milliseconds 250
                  if(!(FindOpenDialog)){$fileDialogClosed=$true;break}
                }
                if(!$fileDialogClosed){
                  # Native Windows may first consume Enter for a file-name
                  # autocomplete. Activate the Open shortcut explicitly.
                  [System.Windows.Forms.SendKeys]::SendWait('%o')
                  for($attempt=0;$attempt -lt 24;$attempt++){
                    Start-Sleep -Milliseconds 250
                    if(!(FindOpenDialog)){$fileDialogClosed=$true;break}
                  }
                }
                Write-Output ('D07_NATIVE_IWXA_DIALOG_CLOSED='+$fileDialogClosed)
                if(!$fileDialogClosed){throw 'D07_NATIVE_IWXA_DIALOG_REMAINS_OPEN'}
                Write-Output 'D07_NATIVE_IWXA_FILE_PATH_SUBMITTED=PASS'
                $importPreviewReady=$false
                for($attempt=0;$attempt -lt 70;$attempt++){
                  Start-Sleep -Milliseconds 500
                  $currentText=NativeText
                  if($currentText -match 'Режим импорта \(allowed_modes\)'){$importPreviewReady=$true;break}
                }
                if(!$importPreviewReady){
                  $currentText=NativeText
                  Write-Output ('D07_NATIVE_IWXA_PREVIEW_ERROR_VISIBLE='+
                    ($currentText -match '(?i)(импорт|пакет|файл).*(ошиб|не удалось|отклон|некоррект)'))
                  Write-Output ('D07_NATIVE_IWXA_PREVIEW_MISSING_PERMISSION='+ 
                    ($currentText -match 'Ядро разрешает только предпросмотр'))
                  throw 'D07_NATIVE_IWXA_PREVIEW_NOT_READY_AFTER_FILE_SELECTION'
                }
                Write-Output 'D07_NATIVE_IWXA_PHYSICAL_FILE_IMPORT_PREVIEW=PASS'
                # Import the source order into a fresh, separately identified
                # Workspace instead of silently merging with the original.
                $modeCombo=$null
                foreach($proc in @(Get-Process msedge -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowHandle -ne 0})){
                  $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
                  if(!$window){continue}
                  $combos=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                    [System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                      [System.Windows.Automation.ControlType]::ComboBox))
                  if($combos.Count -ge 2){
                    $modeCombo=$combos.Item($combos.Count-2)
                    break
                  }
                }
                if(!$modeCombo){throw 'D07_NATIVE_IWXA_MODE_COMBO_MISSING'}
                $modeCombo.SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
                [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
                [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
                [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                $null=WaitNative 'Новые workspace_id (создаются локально)' $null
                $edits=@()
                foreach($proc in @(Get-Process msedge -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowHandle -ne 0})){
                  $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
                  if(!$window){continue}
                  $inputs=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                    [System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                      [System.Windows.Automation.ControlType]::Edit))
                  for($k=0;$k -lt $inputs.Count;$k++){
                    $item=$inputs.Item($k)
                    if($item.Current.IsEnabled -and !$item.Current.IsOffscreen){$edits+=,$item}
                  }
                }
                if($edits.Count -lt 1){throw 'D07_NATIVE_IWXA_WORKSPACE_MAP_INPUT_MISSING'}
                $restoredName='d07-restored-native-roundtrip'
                $edits[$edits.Count-1].SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait($restoredName)
                Start-Sleep -Milliseconds 500
                $historyToggle=FindNative 'История событий' ([System.Windows.Automation.ControlType]::CheckBox)
                if(!$historyToggle){throw 'D07_NATIVE_IWXA_IMPORT_HISTORY_CHECK_MISSING'}
                $toggle=[System.Windows.Automation.TogglePattern]$historyToggle.GetCurrentPattern(
                  [System.Windows.Automation.TogglePattern]::Pattern)
                if($toggle.Current.ToggleState -eq [System.Windows.Automation.ToggleState]::Off){$toggle.Toggle()}
                $commitButton=$null
                for($attempt=0;$attempt -lt 50;$attempt++){
                  $commitButton=FindNative 'Импортировать (1)' ([System.Windows.Automation.ControlType]::Button)
                  if($commitButton -and $commitButton.Current.IsEnabled){break}
                  Start-Sleep -Milliseconds 400
                }
                if(!$commitButton -or !$commitButton.Current.IsEnabled){
                  throw 'D07_NATIVE_IWXA_IMPORT_PLAN_NOT_ENABLED'
                }
                ActivateNative $commitButton
                $null=WaitNative 'Отчёт' $null
                $receiptText=NativeText
                if($receiptText -notmatch '(?s)Объектов создано\s+1'){
                  throw 'D07_NATIVE_IWXA_IMPORT_ONE_OBJECT_NOT_CONFIRMED'
                }
                if($receiptText -notmatch '(?s)Событий\s+[1-9][0-9]*'){
                  throw 'D07_NATIVE_IWXA_IMPORT_EVENTS_NOT_CONFIRMED'
                }
                if($receiptText -notmatch 'new-workspace'){
                  throw 'D07_NATIVE_IWXA_NEW_WORKSPACE_NOT_CONFIRMED'
                }
                # Verify the downloaded physical file has not been altered
                # during native file import. No digest or private bytes logged.
                $postImportHash=Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256
                if($postImportHash.Hash -ne $digest.Hash){
                  throw 'D07_NATIVE_IWXA_PHYSICAL_BYTES_CHANGED_DURING_IMPORT'
                }
                Write-Output 'D07_NATIVE_IWXA_SAME_FILE_SHA256_AFTER_IMPORT=PASS'
                Write-Output 'D07_NATIVE_IWXA_NEW_WORKSPACE_IMPORT_OBJECT_HISTORY=PASS'

            # The receipt is followed by real Host readback from the newly
            # imported Workspace. A successful receipt alone is insufficient.
            $serviceLink=WaitNative 'Мои услуги' ([System.Windows.Automation.ControlType]::Hyperlink)
            ActivateNative $serviceLink
            $null=WaitNative 'Рабочая область' $null
            ClickUIA 'Обновить'
            $workspacePicker=$null
            for($attempt=0;$attempt -lt 55 -and !$workspacePicker;$attempt++){
              foreach($proc in @(Get-Process msedge -ErrorAction SilentlyContinue |
                  Where-Object {$_.MainWindowHandle -ne 0})){
                $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
                if(!$window){continue}
                $combos=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                  [System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                    [System.Windows.Automation.ControlType]::ComboBox))
                if($combos.Count -gt 0){$workspacePicker=$combos.Item(0);break}
              }
              if(!$workspacePicker){Start-Sleep -Milliseconds 450}
            }
            if(!$workspacePicker){throw 'D07_NATIVE_IWXA_RESTORED_WORKSPACE_PICKER_MISSING'}
            $workspacePicker.SetFocus()
            [System.Windows.Forms.SendKeys]::SendWait('{END}')
            [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
            $details=FindNative 'Сведения о рабочей области' $null
            if($details){try{ActivateNative $details}catch{}}
            $selected=$false
            for($attempt=0;$attempt -lt 55;$attempt++){
              Start-Sleep -Milliseconds 450
              $stateText=NativeText
              if($stateText.Contains('Идентификатор: '+$restoredName)){$selected=$true;break}
            }
            if(!$selected){throw 'D07_NATIVE_IWXA_RESTORED_SCOPE_NOT_SELECTED'}
            Write-Output 'D07_NATIVE_IWXA_RESTORED_WORKSPACE_SELECTED=PASS'
            if(!(WaitText 'Изменения сохранены в Workspace' 90)){
              throw 'D07_NATIVE_IWXA_RESTORED_ORDER_NOT_OPENED'
            }
            if(!(WaitText 'Редакция 1' 45)){
              throw 'D07_NATIVE_IWXA_RESTORED_REVISION_NOT_READABLE'
            }
            $hasHistory=$false
            for($attempt=0;$attempt -lt 60;$attempt++){
              if((NativeText) -match 'История Kernel: [1-9][0-9]* событий заказа'){
                $hasHistory=$true;break
              }
              Start-Sleep -Milliseconds 450
            }
            if(!$hasHistory){throw 'D07_NATIVE_IWXA_RESTORED_HISTORY_UNAVAILABLE'}
            Write-Output 'D07_NATIVE_IWXA_RESTORED_ORDER_AND_HISTORY=PASS'
            Write-Output 'D07_NATIVE_IWXA_PHYSICAL_ROUNDTRIP=PASS'

          }finally{
            CloseEdge
            if($server){Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue}
          }
      # No source, dist, browser profile, reports, archives or images uploaded.
