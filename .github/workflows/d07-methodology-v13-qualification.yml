name: D07 V13 professional methodology and manual-variation qualification
on:
  push:
    branches: [work/2026-11-22-d07-methodology-v13]
    paths: [.github/workflows/d07-methodology-v13-qualification.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d07-v13-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify-methodology:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pinned private D07 domain
        uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod
          ref: 4b68c9e0ec8f441e2b8506610935c0117afbcb93
          token: ${{ secrets.DOMEN }}
          path: subject
          persist-credentials: false
      - name: Check out pinned private D07 website
        uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: 391801a4865e194afaf62f3b4da9ba00a43dc065
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - name: Verify pinned revision and domain/site parity
        run: |
          test "$(git -C subject rev-parse HEAD)" = "4b68c9e0ec8f441e2b8506610935c0117afbcb93"
          test "$(git -C site rev-parse HEAD)" = "391801a4865e194afaf62f3b4da9ba00a43dc065"
          for file in service-subject-protocols.ts service-subject-it-router.ts service-subject-it-printer.ts service-subject-it-wifi.ts service-subject-it-software.ts service-subject-code-audit.ts service-subject-it-batch-b.ts service-subject-antivirus-inspection.ts service-subject-video-surveillance.ts service-subject-database.ts service-subject-laptop-cleaning.ts service-subject-crm-setup.ts service-subject-laptop-repair.ts service-subject-domain-transfer.ts service-subject-seo.ts service-subject-desktop-pc-repair.ts service-subject-contextual-ads.ts service-subject-data-recovery.ts service-subject-it-batch-a.ts service-subject-plumbing-b.ts service-subject-plumbing-c.ts service-manual-variant-closure.ts service-professional-facet-coverage.ts service-original-corroboration.ts; do
            cmp "subject/src/domain/$file" "site/src/domain/$file"
          done
          cmp subject/src/data/services/kompyutery-it-sayty/nastroyka-routera.ts site/src/data/services/kompyutery-it-sayty/nastroyka-routera.ts
          cmp subject/src/data/services/kompyutery-it-sayty/nastroyka-printera.ts site/src/data/services/kompyutery-it-sayty/nastroyka-printera.ts
          cmp subject/src/data/services/kompyutery-it-sayty/nastroyka-wifi.ts site/src/data/services/kompyutery-it-sayty/nastroyka-wifi.ts
          cmp subject/src/data/services/kompyutery-it-sayty/ustanovka-po.ts site/src/data/services/kompyutery-it-sayty/ustanovka-po.ts
          cmp subject/src/data/services/kompyutery-it-sayty/audit-koda-sayta.ts site/src/data/services/kompyutery-it-sayty/audit-koda-sayta.ts
          cmp subject/src/data/services/kompyutery-it-sayty/antivirusnaya-proverka.ts site/src/data/services/kompyutery-it-sayty/antivirusnaya-proverka.ts
          cmp subject/src/data/services/kompyutery-it-sayty/nastroyka-videonablyudeniya.ts site/src/data/services/kompyutery-it-sayty/nastroyka-videonablyudeniya.ts
          cmp subject/src/data/services/kompyutery-it-sayty/baza-dannyh.ts site/src/data/services/kompyutery-it-sayty/baza-dannyh.ts
          cmp subject/src/data/services/kompyutery-it-sayty/chistka-noutbuka.ts site/src/data/services/kompyutery-it-sayty/chistka-noutbuka.ts
          cmp subject/src/data/services/kompyutery-it-sayty/nastroyka-crm.ts site/src/data/services/kompyutery-it-sayty/nastroyka-crm.ts
          cmp subject/src/data/services/kompyutery-it-sayty/remont-noutbuka.ts site/src/data/services/kompyutery-it-sayty/remont-noutbuka.ts
          cmp subject/src/data/services/kompyutery-it-sayty/perenos-domena.ts site/src/data/services/kompyutery-it-sayty/perenos-domena.ts
          cmp subject/src/data/services/kompyutery-it-sayty/seo-prodvizhenie.ts site/src/data/services/kompyutery-it-sayty/seo-prodvizhenie.ts
          cmp subject/src/data/services/kompyutery-it-sayty/remont-kompyutera.ts site/src/data/services/kompyutery-it-sayty/remont-kompyutera.ts
          cmp subject/src/data/services/kompyutery-it-sayty/vosstanovlenie-dannyh.ts site/src/data/services/kompyutery-it-sayty/vosstanovlenie-dannyh.ts
          cmp subject/src/data/services/marketing-reklama-prodazhi/kontekstnaya-reklama.ts site/src/data/services/marketing-reklama-prodazhi/kontekstnaya-reklama.ts
          echo D07_V13_DOMAIN_SITE_PARITY=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"
      - name: Install dependencies
        working-directory: site
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/d07-v13-install.log" 2>&1 || { echo D07_V13_DEPENDENCIES=FAIL; exit 1; }
          echo D07_V13_DEPENDENCIES=PASS
      - name: Load professional subject registry and report error code only
        working-directory: site
        run: |
          node --import tsx --input-type=module -e '
            try {
              const {SUBJECT_PROTOCOLS}=await import("./src/domain/service-subject-protocols.ts");
              if(!SUBJECT_PROTOCOLS.length)throw Error("D07_EMPTY_SUBJECT_REGISTRY");
              process.stdout.write("D07_SUBJECT_REGISTRY_IMPORT=PASS\\n");
            } catch(error) {
              const msg=String(error?.message??"");
              const code=msg.match(/D07_[A-Z0-9_]+/)?.[0]??String(error?.name??"UNKNOWN");
              process.stdout.write("D07_SUBJECT_REGISTRY_IMPORT=FAIL:"+code+"\\n");
              process.exit(1);
            }
          '
      - name: Preflight real 102nd service conversion without exposing private source
        working-directory: site
        run: |
          node --import tsx --input-type=module -e '
            try {
              const {getServiceDirectory}=await import("./src/data/serviceDirectory.ts");
              const {getService}=await import("./src/data/services.ts");
              const {convertServiceMethodology}=await import("./src/domain/service-methodology-conversion.ts");
              const row=getServiceDirectory().find(x=>x.categorySlug==="kompyutery-it-sayty"&&x.slug==="perenos-domena");
              if(!row)throw Error("D07_102_CATALOG_ROW_MISSING");
              const result=convertServiceMethodology(row,{service:getService(row.categorySlug,row.slug)});
              if(result.execution.works.length!==12)throw Error("D07_102_WORK_COUNT_NOT_12");
              process.stdout.write("D07_102_T2_METHOD_CONVERSION=PASS\\n");
            } catch(error) {
              const msg=String(error?.message??"");
              const code=msg.match(/D07_[A-Z0-9_]+/)?.[0]??String(error?.code??error?.name??"UNKNOWN");
              process.stdout.write("D07_102_T2_METHOD_CONVERSION=FAIL:"+code+"\\n");
              process.exit(1);
            }
          '
      - name: Run professional methods, independent evidence and manual branching tests
        working-directory: site
        run: |
          node --import tsx --test scripts/tests/d07-subject-protocols.test.mjs scripts/tests/d07-it-network-peripheral-methods.test.mjs scripts/tests/d07-it-software-method.test.mjs scripts/tests/d07-it-code-audit.test.mjs scripts/tests/d07-it-tls-variation.test.mjs scripts/tests/d07-it-antivirus-method.test.mjs scripts/tests/d07-it-mail-variation.test.mjs scripts/tests/d07-it-cctv-professional.test.mjs scripts/tests/d07-it-database-professional.test.mjs scripts/tests/d07-it-laptop-cleaning.test.mjs scripts/tests/d07-it-crm-professional.test.mjs scripts/tests/d07-it-laptop-repair.test.mjs scripts/tests/d07-domain-transfer-professional.test.mjs scripts/tests/d07-it-seo-professional.test.mjs scripts/tests/d07-it-desktop-repair-professional.test.mjs scripts/tests/d07-it-data-recovery-professional.test.mjs scripts/tests/d07-marketing-contextual-advertising-professional.test.mjs scripts/tests/d07-plumbing-b-professional-methods.test.mjs scripts/tests/d07-plumbing-c-professional-methods.test.mjs scripts/tests/d07-manual-variant-closure.test.mjs scripts/tests/d07-professional-facet-coverage.test.mjs scripts/tests/d07-original-corroboration.test.mjs scripts/tests/d07-original-source-fetch.test.mjs scripts/tests/d07-professional-finalization-gate.test.mjs scripts/tests/d07-professional-source-intake.test.mjs scripts/tests/d07-professional-fragment-assembly.test.mjs scripts/tests/d07-professional-gap-inventory.test.mjs scripts/tests/d07-methodology-top500.test.mjs > "$RUNNER_TEMP/d07-v13-tests.log" 2>&1 || {
            echo D07_V13_TESTS=FAIL
            # Print exception class/code only, never private repository paths or customer content.
            grep -oE 'D07_[A-Z0-9_]+|ERR_[A-Z0-9_]+|TypeError|SyntaxError|ReferenceError' "$RUNNER_TEMP/d07-v13-tests.log" | sort -u | head -25 | sed 's/^/D07_V13_ROOT_EXCEPTION=/' || true
            grep -E '^not ok|^# (tests|pass|fail)|^[[:space:]]+(actual|expected|error):|D07_TOP500_CHILD_FAILURE:' "$RUNNER_TEMP/d07-v13-tests.log" | tail -30 || true
            exit 1
          }
          echo D07_V13_TESTS=PASS
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/d07-v13-tests.log" | tail -4
      - name: TypeScript verification
        working-directory: site
        run: |
          bun x tsc --noEmit > "$RUNNER_TEMP/d07-v13-types.log" 2>&1 || {
            echo D07_V13_TYPES=FAIL
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/d07-v13-types.log" | head -10 || true
            exit 1
          }
          echo D07_V13_TYPES=PASS
      - name: Generate all 500 and verify exact manual-variant identities
        working-directory: site
        run: |
          node --import tsx scripts/generate-d07-methodology-top500.mjs "$RUNNER_TEMP/d07-v13-generated" --as-of=2026-11-22 > "$RUNNER_TEMP/d07-v13-generate.log" 2>&1 || {
            echo D07_V13_TOP500=FAIL
            grep -oE 'D07_[A-Z0-9_]+' "$RUNNER_TEMP/d07-v13-generate.log" | tail -8 || true
            exit 1
          }
          node - <<'NODE'
          const fs=require('fs');
          const p=process.env.RUNNER_TEMP+'/d07-v13-generated/';
          const methods=JSON.parse(fs.readFileSync(p+'service-methodology.top500.generated.json','utf8'));
          const manual=JSON.parse(fs.readFileSync(p+'service-manual-variant-queue.top500.generated.json','utf8'));
          const facets=JSON.parse(fs.readFileSync(p+'service-operation-facet-research.top500.generated.json','utf8'));
          const final=JSON.parse(fs.readFileSync(p+'service-professional-finalization.top500.generated.json','utf8'));
          if(methods.counts.selected!==500||manual.selected!==500||manual.services.length!==500||
             facets.services.length!==500||final.counts.independentlyApprovedMethodologies!==0)
             throw Error('D07_V13_COUNTS_OR_APPROVAL_INVALID');
          const registered=methods.counts.withIndividualSubjectProtocols;
          const targets=new Set(['zamena-unitaza','ustanovka-rakoviny','razvodka-trub','ustranenie-protechki','prochistka-kanalizacii']);
          const arrivals=manual.services.filter(s=>targets.has(s.serviceSlug)&&s.categorySlug==='remont-dom-mastera');
          if(arrivals.length!==5||arrivals.some(s=>s.manuallyRoutedBranches!==3||
            s.unresolvedBranches!==0||!s.protocolId||s.methodologyApproved))
            throw Error('D07_V13_MANUAL_PRODUCT_IDS_INVALID');
          const manualCount=manual.services.reduce((n,s)=>n+s.manuallyRoutedBranches,0);
          const unresolvedManual=manual.services.reduce((n,s)=>n+s.unresolvedBranches,0);
          if(!Number.isSafeInteger(unresolvedManual)||unresolvedManual<0)
            throw Error('D07_V13_VARIATION_BACKLOG_COUNTER_INVALID');
          if(registered<95||manualCount<48)throw Error('D07_V13_EXPECTED_EDITORIAL_COVERAGE_MISSING');
          console.log('D07_V13_500=PASS');
          console.log('D07_V13_INDIVIDUAL_TECHNOLOGIES='+registered);
          console.log('D07_V13_MANUAL_BRANCHES_RESOLVED='+manualCount);
          console.log('D07_V13_MANUAL_BRANCHES_STILL_OPEN='+unresolvedManual);
          console.log('D07_V13_INDIVIDUAL_TECHNOLOGIES_STILL_MISSING='+(500-registered));
          console.log('D07_V13_FINALIZED_METHODS='+final.counts.independentlyApprovedMethodologies);
          NODE
      # No private source, output, document content, tokens or artifacts uploaded.
