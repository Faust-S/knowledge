name: d06-acquisition-saved-workspace-qualification

# Temporary private checkout. Never upload private source, logs, screenshots or dist.
on:
  push:
    branches:
      - test/2026-11-18-d06-qualification
    paths:
      - .github/workflows/d06-acquisition-saved-workspace-qualification.yml

permissions:
  contents: read

jobs:
  acquisition:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact D06 candidate privately
        uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod.ru
          ref: 23c188a45c05df50a1603f55cc16a61cec6df165
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - name: Checkout exact canonical D06 subject rule privately
        uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod
          ref: a77e13f0e508f5a131d8df427c574d7c12503b36
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/domain
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify canonical binding and run domain rule tests
        shell: pwsh
        run: |
          $canon = (& git -C private/domain rev-parse "HEAD:src/rules/acquisition-source-binding.ts").Trim()
          $site = (& git -C private/site rev-parse "HEAD:src/rules/acquisition-source-binding.ts").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $canon -or $canon -ne $site) {
            Write-Host 'D06_ACQUISITION_CANONICAL_SYNC=FAIL'
            exit 1
          }
          $subjectRules = @('acquisition-source-binding', 'acquisition-demand-scope', 'acquisition-cost-evidence')
          foreach ($name in $subjectRules) {
            $path = "src/rules/$name.ts"
            $d = (& git -C private/domain rev-parse "HEAD:$path").Trim()
            $w = (& git -C private/site rev-parse "HEAD:$path").Trim()
            if (-not $d -or $d -ne $w) {
              Write-Host ('D06_SUBJECT_RULE_SYNC_' + $name + '=FAIL')
              exit 1
            }
          }
          Write-Host 'D06_ACQUISITION_CANONICAL_SYNC=PASS'
          Push-Location private/domain
          try {
            $log = Join-Path $env:RUNNER_TEMP 'd06-domain-binding.private.txt'
            foreach ($suite in @(
              'test-acquisition-source-binding.mjs',
              'test-acquisition-demand-scope.mjs',
              'test-acquisition-cost-evidence.mjs'
            )) {
              & node --experimental-strip-types ("scripts/" + $suite) *> $log
              if ($LASTEXITCODE -ne 0) {
                Write-Host 'D06_ACQUISITION_DOMAIN_RULE=FAIL'
                exit 1
              }
            }
          } finally {
            Pop-Location
          }
          Write-Host 'D06_ACQUISITION_DOMAIN_RULE=PASS'
      - name: Clean private dependencies
        working-directory: private/site
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'd06-acquisition-install.private.txt'
          & npm ci --no-audit --no-fund *> $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'D06_ACQUISITION_NPM_CI=FAIL'
            exit 1
          }
          Write-Host 'D06_ACQUISITION_NPM_CI=PASS'
      - name: Check PD09 saved Result scenario isolation
        working-directory: private/site
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'd06-acquisition-unit.private.txt'
          & npm run test:acquisition-saved-comparison *> $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'D06_ACQUISITION_UNIT=FAIL'
            Write-Host ('D06_ACQUISITION_ASSERTION_CLASS=' + [int]((Get-Content -LiteralPath $log -Raw) -match 'AssertionError|ERR_ASSERTION'))
            exit 1
          }
          Write-Host 'D06_ACQUISITION_UNIT=PASS'
      - name: Verify current public session documentation contract
        working-directory: private/site
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'd06-session-docs.private.txt'
          & npm run check:session-docs *> $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'D06_ACQUISITION_SESSION_DOCS=FAIL'
            exit 1
          }
          Write-Host 'D06_ACQUISITION_SESSION_DOCS=PASS'
      - name: Diagnose independent source check stages without private logs
        working-directory: private/site
        shell: pwsh
        timeout-minutes: 12
        run: |
          $failed = @()
          $checks = @(
            'check:package', 'check:playwright-cli', 'check:type', 'check:lint',
            'check:registry', 'check:schemas', 'check:session-docs', 'check:contracts',
            'check:adapter-boundary', 'check:service-save-api',
            'check:e2e-antipatterns', 'check:design-system', 'check:visual-contract'
          )
          foreach ($check in $checks) {
            $log = Join-Path $env:RUNNER_TEMP ('d06-' + $check.Replace(':', '-') + '.private.txt')
            & cmd.exe /d /c ('npm run ' + $check + ' > "' + $log + '" 2>&1')
            if ($LASTEXITCODE -eq 0) {
              Write-Host ('D06_INDIVIDUAL_' + $check.Replace(':', '_').ToUpperInvariant() + '=PASS')
            } else {
              $failed += $check
              Write-Host ('D06_INDIVIDUAL_' + $check.Replace(':', '_').ToUpperInvariant() + '=FAIL')
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host ('D06_INDIVIDUAL_FAILED_CHECKS=' + ($failed -join ','))
            exit 1
          }
          Write-Host 'D06_INDIVIDUAL_SOURCE_CHECKS=PASS'
      - name: Install browser for mandatory static product gate
        working-directory: private/site
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'd06-acquisition-browser.private.txt'
          & npm run setup:browser *> $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'D06_ACQUISITION_BROWSER_SETUP=FAIL'
            exit 1
          }
          Write-Host 'D06_ACQUISITION_BROWSER_SETUP=PASS'
      - name: Run full mandatory site and browser qualification
        working-directory: private/site
        shell: pwsh
        timeout-minutes: 45
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'd06-acquisition-static.private.txt'
          & npm run build:static:check *> $log
          if ($LASTEXITCODE -ne 0) {
            $body = Get-Content -LiteralPath $log -Raw
            $prettier = ([regex]::Matches($body, 'prettier/prettier')).Count
            $ts = ([regex]::Matches($body, 'error TS[0-9]+:')).Count
            Write-Host 'D06_ACQUISITION_FULL_STATIC=FAIL'
            Write-Host ('D06_ACQUISITION_PRETTIER_COUNT=' + $prettier)
            Write-Host ('D06_ACQUISITION_TS_COUNT=' + $ts)
            $subtasks = [regex]::Matches($body, '(?m)^> [^\r\n]+ (check(?::[a-z0-9:-]+)?)\s*$') |
              ForEach-Object { $_.Groups[1].Value }
            Write-Host ('D06_ACQUISITION_LAST_CHECK=' + ($subtasks | Select-Object -Last 1))
            $rules = [regex]::Matches($body, '(?m)^\s+- \[(\d{1,2})\] ') |
              ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
            Write-Host ('D06_ACQUISITION_VISUAL_RULE_IDS=' + ($rules -join ','))
            $files = @(& git ls-files -- "*.ts" "*.tsx" "*.mjs" | Sort-Object)
            $diagnostics = [System.Collections.Generic.List[string]]::new()
            $current = ""
            foreach ($entry in ($body -split '[\r\n]+')) {
              if ($entry -match '(?i)[\\/]((?:src|scripts|tests)[\\/][^:\r\n]+?\.(?:ts|tsx|mjs))\s*$') {
                $current = $Matches[1].Replace([char]92, [char]47)
              } elseif ($entry -match 'prettier/prettier' -and $current) {
                $line = [regex]::Match($entry, '^\s*(\d+):(\d+)\s+(?:error|warning)\s+')
                $fileNumber = [array]::IndexOf($files, $current) + 1
                if ($line.Success -and $fileNumber -gt 0) {
                  $diagnostics.Add($fileNumber.ToString() + ':' + $line.Groups[1].Value)
                }
              }
            }
            Write-Host ('D06_ACQUISITION_FORMAT_COORDINATES=' + (($diagnostics | Sort-Object -Unique) -join ','))
            exit 1
          }
          Write-Host 'D06_ACQUISITION_FULL_STATIC=PASS'
      - name: Privacy boundary
        if: always()
        shell: pwsh
        run: |
          Write-Host 'D06_PRIVATE_SOURCE_UPLOADS=0'
          Write-Host 'D06_PRIVATE_LOG_UPLOADS=0'
          Write-Host 'D06_PRIVATE_DIST_UPLOADS=0'
