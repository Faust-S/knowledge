name: D01 UX source, published links and original T2
on:
  push:
    branches: [work/2026-11-24-d01-ux-qualification]
    paths: [.github/workflows/d01-ux-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/learn.iwxa.ru
          ref: f2cc1232cdc9ea80f6ce027f2a09d385f5b4c723
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/learn
          ref: 667c4bdad8e149a7d62619760ecd58ab45caee2f
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/domain
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Exact revisions and canonical subject models
        shell: bash
        run: |
          set -eu
          test "$(git -C private/site rev-parse HEAD)" = f2cc1232cdc9ea80f6ce027f2a09d385f5b4c723
          test "$(git -C private/domain rev-parse HEAD)" = 667c4bdad8e149a7d62619760ecd58ab45caee2f
          cmp private/domain/learning-journey/projection.ts private/site/t2/domain-modules/learn-results/learning-journey.ts
          for path in study/services t2/domain-modules/learn t2/domain-modules/learn-results; do
            cmp private/domain/learning-journey/study-sources.mjs "private/site/$path/study-sources.mjs"
            cmp private/domain/learning-journey/mind-sources.mjs "private/site/$path/mind-sources.mjs"
          done
          cmp private/domain/learning-journey/study-sources.d.mts private/site/t2/domain-modules/learn-results/study-sources.d.mts
          cmp private/domain/learning-journey/mind-sources.d.mts private/site/t2/domain-modules/learn-results/mind-sources.d.mts
          cmp private/domain/mind/services/persistence.mjs private/site/mind/app/services/persistence.mjs
          cmp private/site/study/services/goal-service.mjs private/site/t2/domain-modules/learn/goal-service.mjs
          cmp private/site/study/services/route-service.mjs private/site/t2/domain-modules/learn/route-service.mjs
          cmp private/domain/learning-journey/today.ts private/site/t2/domain-modules/learn-results/learning-today.ts
          cmp private/domain/learning-journey/continuation.mjs private/site/study/services/continuation.mjs
          cmp private/domain/learning-journey/continuation.mjs private/site/t2/domain-modules/learn-results/continuation.mjs
          cmp private/domain/learning-journey/continuation.d.mts private/site/t2/domain-modules/learn-results/continuation.d.mts
          cmp private/domain/learning-journey/career-review.mjs private/site/study/services/career-review.mjs
          cmp private/site/study/services/practice-session-link.mjs private/site/t2/domain-modules/learn-results/practice-session-link.mjs
          cmp private/domain/learning-journey/workplace-shifts.mjs private/site/practice/quick-arithmetic/engine/workplace-shifts.mjs
          cmp private/domain/learning-journey/price-check.mjs private/site/practice/quick-arithmetic/engine/price-check.mjs
          for model in private/domain/practice/models/*.v1.json; do
            test ! -f "private/site/practice/models/$(basename "$model")" || cmp "$model" "private/site/practice/models/$(basename "$model")"
          done
          cmp private/domain/learning-journey/practice-reviews.mjs private/site/t2/domain-modules/learn-results/practice-reviews.mjs
          cmp private/domain/learning-journey/practice-reviews.d.mts private/site/t2/domain-modules/learn-results/practice-reviews.d.mts
          cmp private/domain/learning-journey/route-review.mjs private/site/t2/domain-modules/learn-results/route-review.mjs
          cmp private/domain/learning-journey/route-review.d.mts private/site/t2/domain-modules/learn-results/route-review.d.mts
          cmp private/site/study/my-routes/practice-repeat.mjs private/site/t2/domain-modules/learn-results/practice-repeat.mjs
          echo D01_OWNER_PARITY_PASS
          set +e
          node --test --test-reporter=tap private/domain/learning-journey/study-sources.test.mjs private/domain/learning-journey/projection.test.mjs private/domain/learning-journey/continuation.test.mjs private/domain/learning-journey/today.test.mjs private/domain/learning-journey/career-review.test.mjs private/domain/learning-journey/mind-sources.test.mjs private/domain/mind/services/persistence.test.mjs private/domain/learning-journey/route-review.test.mjs >"$RUNNER_TEMP/d01-domain.log" 2>&1
          code=$?
          grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-domain.log" | cut -c1-200 || true
          if [ "$code" -ne 0 ]; then echo D01_DOMAIN_SOURCE_LINK_TEST_FAIL; exit "$code"; fi
          echo D01_DOMAIN_SOURCE_LINK_TEST_PASS
      - name: Source syntax and navigation regressions
        working-directory: private/site
        shell: bash
        run: |
          set -eu
          for file in _iwxa/learn-profile-context-r6.js _iwxa/learn-link-context.js iwxa-learn-shell-r8-r6.js study/assets-r5/main-t2-9c777f34.js study/assets-r5/src-eldniVto.js calculators/assets-r5/index-CwKME0Vd.js calculators/workspace-selection.mjs career/assets-r5/MapPage-DT3PY6CS.js t2/domain-modules/learn/profile-area.mjs study/services/study-sources.mjs study/services/goal-service.mjs study/services/route-service.mjs study/source-panel.mjs study/goals/goals-app.mjs study/my-routes/routes-app.mjs study/sessions/sessions-app.mjs practice/workspace-selection.mjs mind/app/workspace-ui.mjs mind/app/app.mjs mind/app/services/tools.mjs mind/app/services/labs.mjs practice/assets-r6-clean/practice-capability-gate-BaTK15az.js practice/assets-r6-clean/catalog-BWIn6LRW.js practice/assets-r6-clean/model._slug-DZ9y8kMs.js practice/assets-r6-clean/index-D1kuNTQO.js practice/assets-r6-clean/practice-shell-ClcATzN9.js practice/assets-r6-clean/practice-workspace-picker-Cqs4_6K1.js practice/assets-r6-clean/create-SrNR54d1.js practice/assets-r6-clean/programs-ZGbS30w9.js scripts/copy-static.mjs scripts/fingerprint-editorial-assets.mjs scripts/verify-hosting-stage.mjs scripts/audit-product-links.mjs scripts/audit-browser-navigation.mjs qa/d01-product-witness-2026-10-26/product-witness.mjs qa/d01-product-witness-2026-10-26/repeat-scenario-witness.mjs scripts/materialize-t2-local-preview.mjs assets-r5/index-C3JXOmeg.js career/assets-r5/HypothesesPage-DX3XrAWC.js career/assets-r5/TrialDetailPage-DFY0ijPi.js lad/assets-r5/index-DGThwVZ9.js study/services/continuation.mjs t2/domain-modules/learn-results/continuation.mjs study/form-navigation.mjs study/services/career-review.mjs study/services/practice-session-link.mjs t2/domain-modules/learn-results/practice-session-link.mjs career/assets-r5/learning-review-panel.js practice/assets-r6-clean/create-SrNR54d1.js study/services/practice-handoff.mjs mind/app/services/document-ui.mjs mind/app/services/persistence.mjs mind/app/route-context.mjs mind/app/session.mjs mind/app/storage.mjs study/services/mind-sources.mjs qa/d01-product-witness-2026-10-26/mind-journey-witness.mjs; do
            if ! node --check "$file" >"$RUNNER_TEMP/d01-syntax.log" 2>&1; then echo "D01_SYNTAX_FAIL:$file"; exit 1; fi
          done
          echo D01_SYNTAX_PASS
          set +e
          log="$RUNNER_TEMP/d01-source.log"
          node --test --test-reporter=tap t2/domain-modules/learn-results/learning-navigation.test.mjs study/my-routes/practice-repeat.test.mjs scripts/test-learn-link-context.mjs scripts/test-t2-host-frame-boundary.mjs scripts/test-practice-workspace-selection.mjs scripts/test-calculator-workspace-selection.mjs scripts/test-mind-workspace-ui.mjs scripts/test-product-links.mjs scripts/test-t2-local-preview.mjs scripts/test-t2-owner-passports.mjs scripts/test-study-form-navigation.mjs scripts/test-practice-handoff.mjs scripts/test-mind-route-context.mjs scripts/test-mind-editors.mjs >"$log" 2>&1
          code=$?
          grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$log" | cut -c1-200 || true
          if [ "$code" -ne 0 ]; then echo D01_NAV_TEST_FAIL; exit "$code"; fi
          echo D01_NAV_TEST_PASS
      - name: Build public stage and count missing targets
        if: ${{ always() }}
        working-directory: private/site
        shell: bash
        run: |
          set -eu
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/d01-deps.log" 2>&1
          log="$RUNNER_TEMP/d01-stage.log"
          if npm run build:public-stage >"$log" 2>&1; then
            echo D01_PUBLIC_STAGE_PASS
            grep -E 'PASS:|contract OK:|Unified Learn shell|preloaded on|Single-Kernel Learn' "$log" | cut -c1-200 || true
            npm run audit:links:stage
          else
            grep -oE 'D01_[A-Z0-9_]+|STUDY_[A-Z0-9_]+|ERR_[A-Z0-9_]+' "$log" | sort -u | tail -20 || true
            grep -E 'Canonical Learn footer contract failed|TypeError:|ReferenceError:|Error: D01_|Error: STUDY_' "$log" | cut -c1-220 | tail -10 || true
            echo D01_PUBLIC_STAGE_FAIL
            exit 1
          fi
  original-t2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/learn.iwxa.ru
          ref: f2cc1232cdc9ea80f6ce027f2a09d385f5b4c723
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/learn
          ref: 667c4bdad8e149a7d62619760ecd58ab45caee2f
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/domain
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: main
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/t2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Verify exact owners
        shell: bash
        run: |
          set -eu
          test "$(git -C private/site rev-parse HEAD)" = f2cc1232cdc9ea80f6ce027f2a09d385f5b4c723
          test "$(git -C private/domain rev-parse HEAD)" = 667c4bdad8e149a7d62619760ecd58ab45caee2f
          test "$(git -C private/t2 rev-parse HEAD)" = 9c64951cd78411283e8a416641c36d71e169fc1d
      - name: Run actual Learn/T2 build and browser user journey
        shell: bash
        env:
          D01_T2_CHECKOUT: ${{ github.workspace }}/private/t2
          D01_EXPECTED_T2_HEAD: 9c64951cd78411283e8a416641c36d71e169fc1d
          D01_EXPECTED_SITE_HEAD: f2cc1232cdc9ea80f6ce027f2a09d385f5b4c723
          D01_SCREENSHOT_OUTPUT: ${{ runner.temp }}/d01-real-screens
          D01_CASE_FILE: ${{ github.workspace }}/private/domain/learning-journey/case-001-workplace-numeracy.json
          D01_CASE_002_FILE: ${{ github.workspace }}/private/domain/learning-journey/case-002-price-label-check.json
        run: node private/site/qa/d01-product-witness-2026-10-26/ci-real-screens.mjs
      - name: Audit links in complete original T2 product
        if: ${{ always() }}
        working-directory: private/site
        run: |
          if [ -d dist ]; then npm run audit:links; else echo D01_COMPLETE_DIST_NOT_AVAILABLE; fi
      - name: Browser sweep of every built page and mobile entry routes
        if: ${{ always() }}
        working-directory: private/site
        env:
          D01_T2_SOURCE: ${{ github.workspace }}/private/t2/t2/current/final-successor/canonical-source
          D01_BROWSER_AUDIT_OUTPUT: ${{ runner.temp }}/d01-browser-audit
        run: |
          if [ -d dist ]; then node scripts/audit-browser-navigation.mjs; else echo D01_BROWSER_SWEEP_NOT_RUN; fi
# Private inputs, raw logs and screenshots are never uploaded.
