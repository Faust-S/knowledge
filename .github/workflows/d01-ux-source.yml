name: D01 UX source, published links and original T2
on:
  push:
    branches: [work/2026-11-24-d01-ux-qualification]
    paths: [.github/workflows/d01-ux-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/learn.iwxa.ru
          ref: 888e21b41da464e7ec41d96483e15f87475dabee
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/learn
          ref: bebed42b40de5a04b3633628d10eb80f842f9dc5
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/domain
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Exact revisions and canonical subject models
        shell: bash
        run: |
          set -eu
          test "$(git -C private/site rev-parse HEAD)" = 888e21b41da464e7ec41d96483e15f87475dabee
          test "$(git -C private/domain rev-parse HEAD)" = bebed42b40de5a04b3633628d10eb80f842f9dc5
          cmp private/domain/learning-journey/projection.ts private/site/t2/domain-modules/learn-results/learning-journey.ts
          cmp private/domain/learning-journey/today.ts private/site/t2/domain-modules/learn-results/learning-today.ts
          cmp private/domain/learning-journey/workplace-shifts.mjs private/site/practice/quick-arithmetic/engine/workplace-shifts.mjs
          cmp private/domain/learning-journey/price-check.mjs private/site/practice/quick-arithmetic/engine/price-check.mjs
          for model in private/domain/practice/models/*.v1.json; do
            test ! -f "private/site/practice/models/$(basename "$model")" || cmp "$model" "private/site/practice/models/$(basename "$model")"
          done
          echo D01_OWNER_PARITY_PASS
      - name: Source syntax and navigation regressions
        working-directory: private/site
        shell: bash
        run: |
          set -eu
          for file in _iwxa/learn-profile-context-r6.js _iwxa/learn-link-context.js iwxa-learn-shell-r8-r6.js study/goals/goals-app.mjs study/my-routes/routes-app.mjs study/sessions/sessions-app.mjs practice/workspace-selection.mjs mind/app/workspace-ui.mjs mind/app/app.mjs mind/app/services/tools.mjs mind/app/services/labs.mjs practice/assets-r6-clean/practice-capability-gate-BaTK15az.js practice/assets-r6-clean/catalog-BWIn6LRW.js practice/assets-r6-clean/model._slug-DZ9y8kMs.js practice/assets-r6-clean/practice-workspace-picker-Cqs4_6K1.js practice/assets-r6-clean/create-SrNR54d1.js practice/assets-r6-clean/programs-ZGbS30w9.js scripts/copy-static.mjs scripts/audit-product-links.mjs scripts/audit-browser-navigation.mjs qa/d01-product-witness-2026-10-26/product-witness.mjs; do
            if ! node --check "$file" >"$RUNNER_TEMP/d01-syntax.log" 2>&1; then echo "D01_SYNTAX_FAIL:$file"; exit 1; fi
          done
          echo D01_SYNTAX_PASS
          set +e
          log="$RUNNER_TEMP/d01-source.log"
          node --test --test-reporter=tap t2/domain-modules/learn-results/learning-navigation.test.mjs study/my-routes/practice-repeat.test.mjs scripts/test-learn-link-context.mjs scripts/test-t2-host-frame-boundary.mjs scripts/test-practice-workspace-selection.mjs scripts/test-mind-workspace-ui.mjs scripts/test-product-links.mjs scripts/test-t2-local-preview.mjs >"$log" 2>&1
          code=$?
          grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$log" | cut -c1-200 || true
          if [ "$code" -ne 0 ]; then echo D01_NAV_TEST_FAIL; exit "$code"; fi
          echo D01_NAV_TEST_PASS
      - name: Build public stage and count missing targets
        if: ${{ always() }}
        working-directory: private/site
        shell: bash
        run: |
          set -eu
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/d01-deps.log" 2>&1
          log="$RUNNER_TEMP/d01-stage.log"
          if npm run build:public-stage >"$log" 2>&1; then
            echo D01_PUBLIC_STAGE_PASS
            grep -E 'PASS:|contract OK:|Unified Learn shell|preloaded on|Single-Kernel Learn' "$log" | cut -c1-200 || true
            npm run audit:links:stage
          else
            grep -oE 'D01_[A-Z0-9_]+|STUDY_[A-Z0-9_]+|ERR_[A-Z0-9_]+' "$log" | sort -u | tail -20 || true
            grep -E 'Canonical Learn footer contract failed|TypeError:|ReferenceError:|Error: D01_|Error: STUDY_' "$log" | cut -c1-220 | tail -10 || true
            echo D01_PUBLIC_STAGE_FAIL
            exit 1
          fi
  original-t2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/learn.iwxa.ru
          ref: 888e21b41da464e7ec41d96483e15f87475dabee
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/learn
          ref: bebed42b40de5a04b3633628d10eb80f842f9dc5
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/domain
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: main
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/t2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Verify exact owners
        shell: bash
        run: |
          set -eu
          test "$(git -C private/site rev-parse HEAD)" = 888e21b41da464e7ec41d96483e15f87475dabee
          test "$(git -C private/domain rev-parse HEAD)" = bebed42b40de5a04b3633628d10eb80f842f9dc5
          test "$(git -C private/t2 rev-parse HEAD)" = 9c64951cd78411283e8a416641c36d71e169fc1d
      - name: Run actual Learn/T2 build and browser user journey
        shell: bash
        env:
          D01_T2_CHECKOUT: ${{ github.workspace }}/private/t2
          D01_EXPECTED_T2_HEAD: 9c64951cd78411283e8a416641c36d71e169fc1d
          D01_EXPECTED_SITE_HEAD: 888e21b41da464e7ec41d96483e15f87475dabee
          D01_SCREENSHOT_OUTPUT: ${{ runner.temp }}/d01-real-screens
          D01_CASE_FILE: ${{ github.workspace }}/private/domain/learning-journey/case-001-workplace-numeracy.json
          D01_CASE_002_FILE: ${{ github.workspace }}/private/domain/learning-journey/case-002-price-label-check.json
        run: node private/site/qa/d01-product-witness-2026-10-26/ci-real-screens.mjs
      - name: Audit links in complete original T2 product
        if: ${{ always() }}
        working-directory: private/site
        run: |
          if [ -d dist ]; then npm run audit:links; else echo D01_COMPLETE_DIST_NOT_AVAILABLE; fi
      - name: Browser sweep of every built page and mobile entry routes
        if: ${{ always() }}
        working-directory: private/site
        env:
          D01_T2_SOURCE: ${{ github.workspace }}/private/t2/t2/current/final-successor/canonical-source
          D01_BROWSER_AUDIT_OUTPUT: ${{ runner.temp }}/d01-browser-audit
        run: |
          if [ -d dist ]; then node scripts/audit-browser-navigation.mjs; else echo D01_BROWSER_SWEEP_NOT_RUN; fi
# Private inputs, raw logs and screenshots are never uploaded.
