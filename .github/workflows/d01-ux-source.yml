name: D01 UX source, published links and original T2
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/once/d01-ux-source/**'
    paths:
      - '.github/ci-requests/d01-ux-source.json'
concurrency:
  group: d01-learn-qualification
  # Finish the running candidate. GitHub keeps at most one pending run in
  # this group, replacing an older pending candidate when a new one is queued.
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  qualify:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false)
    # Use one runner and a single checkout of each product owner. All steps
    # before the T2 checkout are mandatory; a failed source gate stops the
    # expensive original-kernel build and browser journey.
    name: Source, original T2 and browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout public request guard only
        uses: actions/checkout@v4
        with:
          path: ci-harness
          persist-credentials: false
          fetch-depth: 2
      - name: Verify deliberate immutable request before private checkout
        working-directory: ci-harness
        run: |
          python3 tools/ci/verify_once_request.py \
            --repository Faust-S/knowledge --workflow d01-ux-source \
            --profile full-product-qualification \
            --revision site=668c698248631471f267331b3ef795099b92d75d \
            --revision subject=ac65f7f4f29196c42bcd7aed93830e34cc5653ca \
            --revision t2=39a0b3205ea45a55c3db45b99f5bcf4f0283aef1
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/learn.iwxa.ru
          ref: 668c698248631471f267331b3ef795099b92d75d
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/learn
          ref: ac65f7f4f29196c42bcd7aed93830e34cc5653ca
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/domain
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Exact revisions and canonical subject models
        shell: bash
        run: |
          set -eu
          test "$(git -C private/site rev-parse HEAD)" = 668c698248631471f267331b3ef795099b92d75d
          test "$(git -C private/domain rev-parse HEAD)" = ac65f7f4f29196c42bcd7aed93830e34cc5653ca
          for path in study/services t2/domain-modules/learn; do
            for file in study-write-outcome.mjs study-write-outcome.d.mts; do
              cmp "private/domain/learning-journey/$file" "private/site/$path/$file"
            done
          done
          cmp private/domain/learning-journey/projection.ts private/site/t2/domain-modules/learn-results/learning-journey.ts
          for path in study/services t2/domain-modules/learn t2/domain-modules/learn-results; do
            cmp private/domain/learning-journey/study-sources.mjs "private/site/$path/study-sources.mjs"
            cmp private/domain/learning-journey/mind-sources.mjs "private/site/$path/mind-sources.mjs"
          done
          cmp private/domain/learning-journey/study-sources.d.mts private/site/t2/domain-modules/learn-results/study-sources.d.mts
          cmp private/domain/learning-journey/mind-sources.d.mts private/site/t2/domain-modules/learn-results/mind-sources.d.mts
          cmp private/domain/mind/services/persistence.mjs private/site/mind/app/services/persistence.mjs
          cmp private/site/study/services/goal-service.mjs private/site/t2/domain-modules/learn/goal-service.mjs
          cmp private/site/study/services/route-service.mjs private/site/t2/domain-modules/learn/route-service.mjs
          cmp private/domain/learning-journey/today.ts private/site/t2/domain-modules/learn-results/learning-today.ts
          cmp private/domain/learning-journey/continuation.mjs private/site/study/services/continuation.mjs
          cmp private/domain/learning-journey/continuation.mjs private/site/t2/domain-modules/learn-results/continuation.mjs
          cmp private/domain/learning-journey/continuation.d.mts private/site/t2/domain-modules/learn-results/continuation.d.mts
          cmp private/domain/learning-journey/career-review.mjs private/site/study/services/career-review.mjs
          cmp private/site/study/services/practice-session-link.mjs private/site/t2/domain-modules/learn-results/practice-session-link.mjs
          cmp private/domain/learning-journey/workplace-shifts.mjs private/site/practice/quick-arithmetic/engine/workplace-shifts.mjs
          cmp private/domain/learning-journey/price-check.mjs private/site/practice/quick-arithmetic/engine/price-check.mjs
          for model in private/domain/practice/models/*.v1.json; do
            test ! -f "private/site/practice/models/$(basename "$model")" || cmp "$model" "private/site/practice/models/$(basename "$model")"
          done
          for target in study/services t2/domain-modules/learn t2/domain-modules/learn-results; do
            for file in practice-associations.mjs practice-reviews.mjs practice-reviews.d.mts practice-study-reference.mjs practice-study-reference.d.mts; do
              cmp "private/domain/learning-journey/$file" "private/site/$target/$file"
            done
          done
          cmp private/site/study/services/study-evidence-service.mjs private/site/t2/domain-modules/learn/study-evidence-service.mjs
          cmp private/domain/learning-journey/route-review.mjs private/site/t2/domain-modules/learn-results/route-review.mjs
          cmp private/domain/learning-journey/route-review.d.mts private/site/t2/domain-modules/learn-results/route-review.d.mts
          for target in study/services t2/domain-modules/learn-results; do
            for file in practice-support.mjs practice-support.d.mts; do
              cmp "private/domain/learning-journey/$file" "private/site/$target/$file"
            done
          done
          for file in topic-work.mjs topic-lesson.mjs; do
            cmp "private/domain/learning-journey/$file" "private/site/t2/domain-modules/learn-results/$file"
          done
          cmp private/domain/practice/repeat-preparation.mjs private/site/practice/repeat-preparation.js
          for target in study/services t2/domain-modules/learn-results; do
            for file in topic-learning-history.mjs topic-learning-history.d.mts; do
              cmp "private/domain/learning-journey/$file" "private/site/$target/$file"
            done
          done
          cmp private/site/study/my-routes/practice-repeat.mjs private/site/t2/domain-modules/learn-results/practice-repeat.mjs
          for file in session-flow.mjs session-flow.d.mts topic-lesson.mjs topic-lesson.d.mts; do
            cmp "private/domain/learning-journey/$file" "private/site/study/services/$file"
            cmp "private/domain/learning-journey/$file" "private/site/t2/domain-modules/learn/$file"
          done
          for target in study/services t2/domain-modules/learn t2/domain-modules/learn-results; do
            for file in study-recall.mjs study-recall.d.mts study-answer-review.mjs study-answer-review.d.mts; do
              cmp "private/domain/learning-journey/$file" "private/site/$target/$file"
            done
          done
          cmp private/domain/learning-journey/topic-work.mjs private/site/study/services/topic-work.mjs
          node --input-type=module - <<'JS'
          import {readFileSync,existsSync} from 'node:fs';
          import {topicWorkTargets} from './private/domain/learning-journey/topic-work.mjs';
          import {SERVICE_IDS} from './private/domain/mind/services/core.mjs';
          import {practiceSupportTargets} from './private/domain/learning-journey/practice-support.mjs';
          const targets=topicWorkTargets();
          const support=practiceSupportTargets();
          for(const target of support){
            if(!target.path||!existsSync('private/site'+target.path+'index.html'))throw Error('D01_PREPARATION_TARGET_MISSING:'+target.slug);
            if(target.kind==='mind'&&!SERVICE_IDS.includes(target.slug))throw Error('D01_PREPARATION_MIND_MISMATCH:'+target.slug);
          }
          console.log('D01_PREPARATION_TARGETS='+support.length);
          for(const target of targets){
            if(!existsSync('private/site'+target.path+'index.html'))throw Error('D01_TOPIC_TARGET_MISSING:'+target.slug);
            if(target.kind==='practice'){
              const model=JSON.parse(readFileSync('private/domain/practice/models/'+target.slug+'.v1.json','utf8'));
              if(model.source.template_id!==target.modelId||model.title!==target.title)throw Error('D01_TOPIC_MODEL_MISMATCH:'+target.slug);
            }
            if(target.kind==='mind'&&!SERVICE_IDS.includes(target.slug))throw Error('D01_TOPIC_MIND_MISMATCH:'+target.slug);
          }
          console.log('D01_TOPIC_TARGETS='+targets.length);
          JS
          cmp private/domain/learning-journey/topic-lesson.mjs private/site/study/services/topic-lesson.mjs
          cmp private/domain/learning-journey/topic-lesson.mjs private/site/t2/domain-modules/learn/topic-lesson.mjs
          cmp private/site/study/services/study-session-service.mjs private/site/t2/domain-modules/learn/study-session-service.mjs
          cmp private/domain/learning-journey/route-edit.mjs private/site/study/services/route-edit.mjs
          cmp private/domain/learning-journey/route-edit.mjs private/site/t2/domain-modules/learn/route-edit.mjs
          cmp private/domain/learning-journey/topic-work.mjs private/site/t2/domain-modules/learn/topic-work.mjs
          cmp private/domain/learning-journey/study-sources.d.mts private/site/t2/domain-modules/learn/study-sources.d.mts
          cmp private/domain/learning-journey/mind-sources.d.mts private/site/t2/domain-modules/learn/mind-sources.d.mts
          for path in study/services t2/domain-modules/learn t2/domain-modules/learn-results; do
            cmp private/domain/learning-journey/prerequisites.mjs "private/site/$path/prerequisites.mjs"
            cmp private/domain/learning-journey/continuation.mjs "private/site/$path/continuation.mjs"
          done
          cmp private/domain/learning-journey/topic-progress.mjs private/site/t2/domain-modules/learn-results/topic-progress.mjs
          cmp private/domain/learning-journey/topic-progress.d.mts private/site/t2/domain-modules/learn-results/topic-progress.d.mts
          for file in daily-learning.mjs daily-learning.d.mts practice-study-reference.mjs practice-study-reference.d.mts; do
            cmp "private/domain/learning-journey/$file" "private/site/t2/domain-modules/learn-results/$file"
          done
          for file in practice-study-reference.mjs practice-study-reference.d.mts; do
            cmp "private/domain/learning-journey/$file" "private/site/study/services/$file"
          done
          echo D01_OWNER_PARITY_PASS
          set +e
          node --test --test-reporter=tap private/domain/learning-journey/study-sources.test.mjs private/domain/learning-journey/projection.test.mjs private/domain/learning-journey/continuation.test.mjs private/domain/learning-journey/today.test.mjs private/domain/learning-journey/career-review.test.mjs private/domain/learning-journey/mind-sources.test.mjs private/domain/mind/services/persistence.test.mjs private/domain/learning-journey/route-review.test.mjs private/domain/learning-journey/session-flow.test.mjs private/domain/learning-journey/study-recall.test.mjs private/domain/learning-journey/topic-work.test.mjs private/domain/learning-journey/topic-lesson.test.mjs private/domain/learning-journey/route-edit.test.mjs private/domain/learning-journey/prerequisites.test.mjs private/domain/learning-journey/topic-mind.test.mjs private/domain/learning-journey/topic-progress.test.mjs private/domain/learning-journey/daily-learning.test.mjs private/domain/learning-journey/practice-study-reference.test.mjs private/domain/learning-journey/practice-repeat-reference.test.mjs private/domain/learning-journey/practice-support.test.mjs private/domain/learning-journey/practice-criterion-variants.test.mjs private/domain/learning-journey/practice-repeat-focus.test.mjs private/domain/practice/repeat-preparation.test.mjs private/domain/learning-journey/study-recall-progression.test.mjs private/domain/learning-journey/topic-learning-history.test.mjs private/domain/learning-journey/study-answer-review.test.mjs private/domain/learning-journey/practice-associations.test.mjs private/domain/tests/assistant-skills.test.mjs >"$RUNNER_TEMP/d01-domain.log" 2>&1
          code=$?
          grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/d01-domain.log" | cut -c1-200 || true
          if [ "$code" -ne 0 ]; then echo D01_DOMAIN_SOURCE_LINK_TEST_FAIL; exit "$code"; fi
          echo D01_DOMAIN_SOURCE_LINK_TEST_PASS
      - name: Source syntax and navigation regressions
        working-directory: private/site
        shell: bash
        run: |
          set -eu
          for file in study/services/study-write-outcome.mjs t2/domain-modules/learn/study-write-outcome.mjs _iwxa/learn-profile-context-r6.js _iwxa/learn-link-context.js iwxa-learn-shell-r8-r6.js study/assets-r5/main-t2-9c777f34.js study/assets-r5/src-eldniVto.js calculators/assets-r5/index-CwKME0Vd.js calculators/workspace-selection.mjs career/assets-r5/MapPage-DT3PY6CS.js t2/domain-modules/learn/profile-area.mjs study/services/study-sources.mjs study/services/goal-service.mjs study/services/route-service.mjs study/source-panel.mjs study/goals/goals-app.mjs study/my-routes/routes-app.mjs study/sessions/sessions-app.mjs practice/workspace-selection.mjs mind/app/workspace-ui.mjs mind/app/app.mjs mind/app/services/tools.mjs mind/app/services/labs.mjs practice/assets-r6-clean/practice-capability-gate-BaTK15az.js practice/assets-r6-clean/catalog-BWIn6LRW.js practice/assets-r6-clean/model._slug-DZ9y8kMs.js practice/assets-r6-clean/index-D1kuNTQO.js practice/assets-r6-clean/practice-shell-ClcATzN9.js practice/assets-r6-clean/practice-workspace-picker-Cqs4_6K1.js practice/assets-r6-clean/create-SrNR54d1.js practice/assets-r6-clean/programs-ZGbS30w9.js scripts/copy-static.mjs scripts/fingerprint-editorial-assets.mjs scripts/verify-hosting-stage.mjs scripts/audit-product-links.mjs scripts/audit-browser-navigation.mjs scripts/audit-first-user.mjs scripts/browser-product-origin.mjs scripts/normalize-learn-navigation.mjs scripts/test-learn-navigation.mjs career/assets-r5/index-B6cIU7u-.js scripts/test-first-use-profile.mjs qa/d01-product-witness-2026-10-26/product-witness.mjs qa/d01-product-witness-2026-10-26/repeat-scenario-witness.mjs scripts/materialize-t2-local-preview.mjs assets-r5/index-C3JXOmeg.js career/assets-r5/HypothesesPage-DX3XrAWC.js career/assets-r5/TrialDetailPage-DFY0ijPi.js lad/assets-r5/index-DGThwVZ9.js study/services/continuation.mjs t2/domain-modules/learn-results/continuation.mjs study/form-navigation.mjs study/services/career-review.mjs study/services/practice-session-link.mjs t2/domain-modules/learn-results/practice-session-link.mjs career/assets-r5/learning-review-panel.js practice/assets-r6-clean/create-SrNR54d1.js study/services/practice-handoff.mjs mind/app/services/document-ui.mjs mind/app/services/persistence.mjs mind/app/route-context.mjs mind/app/session.mjs mind/app/storage.mjs study/services/mind-sources.mjs study/services/topic-work.mjs study/topic-work-panel.mjs study/services/topic-lesson.mjs study/services/route-edit.mjs study/services/prerequisites.mjs t2/domain-modules/learn/prerequisites.mjs study/source-panel.mjs study/lesson-brief-panel.mjs study/services/study-session-service.mjs t2/domain-modules/learn/study-session-service.mjs practice/study-context.mjs practice/assets-r6-clean/study-context-panel.js qa/d01-product-witness-2026-10-26/mind-journey-witness.mjs t2/domain-modules/learn-results/daily-learning.mjs t2/domain-modules/learn-results/learning-navigation.mjs t2/domain-modules/learn-results/linked-journey-read.mjs study/services/practice-study-reference.mjs practice/quick-arithmetic/engine/practice-session.mjs practice/quick-arithmetic/quick-arithmetic-app.mjs study/services/study-recall.mjs study/services/session-flow.mjs t2/domain-modules/learn/study-recall.mjs t2/domain-modules/learn/session-flow.mjs t2/domain-modules/learn-results/study-recall.mjs t2/domain-modules/learn-results/topic-progress.mjs scripts/test-study-recall-owner.mjs study/services/practice-reviews.mjs study/services/study-evidence-service.mjs study/my-routes/practice-link.mjs study/my-routes/practice-feedback.mjs study/services/practice-associations.mjs study/sessions/practice-panel.mjs study/study-owner.mjs practice/topic-pending.mjs practice/quick-arithmetic/engine/practice-result.mjs scripts/test-practice-study-feedback-owner.mjs scripts/test-practice-topic-feedback.mjs study/services/practice-support.mjs study/my-routes/practice-preparation-panel.mjs study/my-routes/practice-repeat.mjs practice/repeat-preparation.js practice/assets-r6-clean/practice-error-notice-CZjnex95.js t2/domain-modules/learn-results/practice-support.mjs t2/domain-modules/learn-results/route-review.mjs study/topic-history-panel.mjs study/services/topic-learning-history.mjs t2/domain-modules/learn-results/topic-learning-history.mjs t2/domain-modules/learn-results/daily-learning.mjs study/services/study-answer-review.mjs t2/domain-modules/learn/study-answer-review.mjs t2/domain-modules/learn-results/study-answer-review.mjs t2/domain-modules/learn/route-edit.mjs t2/domain-modules/learn/topic-work.mjs scripts/audit-external-links.mjs scripts/audit-internal-file-links.mjs scripts/test-practice-client-root.mjs scripts/test-external-links.mjs scripts/test-internal-file-links.mjs; do
            if ! node --check "$file" >"$RUNNER_TEMP/d01-syntax.log" 2>&1; then echo "D01_SYNTAX_FAIL:$file"; exit 1; fi
          done
          echo D01_SYNTAX_PASS
          set +e
          log="$RUNNER_TEMP/d01-source.log"
          node --test --test-reporter=tap t2/domain-modules/learn-results/learning-navigation.test.mjs scripts/test-t2-host-frame-boundary.mjs scripts/test-practice-workspace-selection.mjs scripts/test-mind-workspace-ui.mjs scripts/test-t2-local-preview.mjs scripts/test-t2-owner-passports.mjs scripts/test-practice-handoff.mjs scripts/test-mind-route-context.mjs scripts/test-mind-editors.mjs t2/domain-modules/learn-results/linked-journey-read.test.mjs scripts/test-study-prerequisite-owner.mjs scripts/test-study-recall-owner.mjs scripts/test-quick-arithmetic-study-context.mjs scripts/test-practice-study-feedback-owner.mjs >"$log" 2>&1
          code=$?
          grep -E '^not ok|^# (tests|pass|fail|skipped) ' "$log" | cut -c1-200 || true
          if [ "$code" -ne 0 ]; then echo D01_NAV_TEST_FAIL; exit "$code"; fi
          echo D01_NAV_TEST_PASS
      - name: Build public stage and count missing targets
        timeout-minutes: 15
        working-directory: private/site
        shell: bash
        run: |
          set -eu
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/d01-deps.log" 2>&1
          cmp ../domain/models/assistant-skills.json assets/learn-assistant-skills.json
          cmp ../domain/models/assistant-service-scope.json scripts/t3-inputs/assistant-service-scope.json
          if npm run t3:skills:check >"$RUNNER_TEMP/d01-assistant.log" 2>&1; then echo D01_ASSISTANT_PIN_PASS; else echo D01_ASSISTANT_PIN_FAIL; exit 1; fi
          log="$RUNNER_TEMP/d01-stage.log"
          if npm run build:public-stage >"$log" 2>&1; then
            echo D01_PUBLIC_STAGE_PASS
            grep -E 'PASS:|contract OK:|Unified Learn shell|preloaded on|Single-Kernel Learn|D01_NAVIGATION' "$log" | cut -c1-200 || true
            npm run audit:links:stage
          else
            grep -oE 'D01_[A-Z0-9_]+|STUDY_[A-Z0-9_]+|ERR_[A-Z0-9_]+' "$log" | sort -u | tail -20 || true
            grep -E 'Canonical Learn footer contract failed|TypeError:|ReferenceError:|Error: D01_|Error: STUDY_' "$log" | cut -c1-220 | tail -10 || true
            echo D01_PUBLIC_STAGE_FAIL
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          # Fetch the real remote main ref. The following gate still requires
          # the pinned exact SHA; a detached SHA checkout alone has no origin/main.
          ref: main
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/t2
      - name: Verify exact owners
        shell: bash
        run: |
          set -eu
          test "$(git -C private/site rev-parse HEAD)" = 668c698248631471f267331b3ef795099b92d75d
          test "$(git -C private/domain rev-parse HEAD)" = ac65f7f4f29196c42bcd7aed93830e34cc5653ca
          test "$(git -C private/t2 rev-parse HEAD)" = 39a0b3205ea45a55c3db45b99f5bcf4f0283aef1
          test "$(git -C private/t2 rev-parse refs/remotes/origin/main)" = 39a0b3205ea45a55c3db45b99f5bcf4f0283aef1
      - name: Run actual Learn/T2 build and browser user journey
        id: product
        timeout-minutes: 40
        shell: bash
        env:
          D01_T2_CHECKOUT: ${{ github.workspace }}/private/t2
          D01_EXPECTED_T2_HEAD: 39a0b3205ea45a55c3db45b99f5bcf4f0283aef1
          D01_EXPECTED_SITE_HEAD: 668c698248631471f267331b3ef795099b92d75d
          D01_SCREENSHOT_OUTPUT: ${{ runner.temp }}/d01-real-screens
          D01_CASE_FILE: ${{ github.workspace }}/private/domain/learning-journey/case-001-workplace-numeracy.json
          D01_CASE_002_FILE: ${{ github.workspace }}/private/domain/learning-journey/case-002-price-label-check.json
        run: node private/site/qa/d01-product-witness-2026-10-26/ci-real-screens.mjs
      - name: Audit links in complete original T2 product
        # Inspect the complete distribution even when a product journey fails.
        if: ${{ always() && !cancelled() && (steps.product.outcome == 'success' || steps.product.outcome == 'failure') }}
        working-directory: private/site
        run: |
          if [ -d dist ]; then
            npm run audit:links
            node scripts/audit-external-links.mjs --dir dist --report-only
          else echo D01_COMPLETE_DIST_NOT_AVAILABLE; exit 1; fi
      - name: Browser sweep of every built page and shared navigation at desktop and phone widths
        # Failed user journeys must not conceal other page defects.
        # Require an actual built distribution; never turn incomplete coverage
        # into a successful release.
        if: ${{ always() && !cancelled() && (steps.product.outcome == 'success' || steps.product.outcome == 'failure') }}
        timeout-minutes: 75
        working-directory: private/site
        env:
          D01_T2_SOURCE: ${{ github.workspace }}/private/t2/t2/current/final-successor/canonical-source
          D01_BROWSER_AUDIT_OUTPUT: ${{ runner.temp }}/d01-browser-audit
        run: |
          if [ -f dist/D01_SITE_BUILD_MANIFEST.json ]; then node scripts/audit-browser-navigation.mjs; else echo D01_BROWSER_SWEEP_NOT_RUN_NO_COMPLETE_BUILD; exit 1; fi
# Private inputs, raw logs and screenshots are never uploaded.
