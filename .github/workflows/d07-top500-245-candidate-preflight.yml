name: D07 N245 candidate identity preflight
on:
  push:
    branches: [work/2026-11-02-pipeline-foundation]
    paths: [.github/workflows/d07-top500-245-candidate-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: 6227c952a130b7f7d98f1baff43a7b707de16360
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - name: Confirm existing subject identities before selecting next thirty
        working-directory: site
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/d07-245-preflight.log" 2>&1
          node --import tsx scripts/d07-next500-candidate-preflight.mjs 30 | tee "$RUNNER_TEMP/d07-245-candidate-results.log"
          grep -qx 'D07_TOP500_SELECTED=500' "$RUNNER_TEMP/d07-245-candidate-results.log"
          grep -qx 'D07_INDIVIDUAL_TECHNOLOGIES=245' "$RUNNER_TEMP/d07-245-candidate-results.log"
          grep -qx 'D07_UNCOVERED_TECHNOLOGIES=255' "$RUNNER_TEMP/d07-245-candidate-results.log"
