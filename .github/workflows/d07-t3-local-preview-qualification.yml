name: D07 T3 local preview and retained byte portability
on:
  push:
    branches: [work/2026-11-02-pipeline-foundation]
    paths: [.github/workflows/d07-t3-local-preview-qualification.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d07-t3-local-preview-qualification
  cancel-in-progress: false
jobs:
  local-preview:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: 333f7a59c1aa3e13c0c65733a244e3917f2ddcc6
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual local HTTP, product gate and Git-byte regression
        working-directory: site
        run: |
          node --check scripts/preview-d07-t3-local.mjs > "$RUNNER_TEMP/d07-preview-syntax.log" 2>&1 || { echo D07_PREVIEW_SYNTAX=FAIL; exit 1; }
          node --experimental-strip-types --test scripts/tests/d07-brief-select-presentation.test.mjs scripts/tests/d07-acceptance-case-inputs.test.mjs scripts/tests/d07-documented-service-criteria-pure.test.mjs scripts/tests/d07-documented-case-replay-pure.test.mjs scripts/tests/d07-order-stage-draft.test.mjs scripts/tests/d07-t3-preview.test.mjs scripts/tests/d07-retained-byte-attributes.test.mjs scripts/tests/d07-retained-index.test.mjs scripts/tests/d07-private-release.test.mjs > "$RUNNER_TEMP/d07-preview-tests.log" 2>&1 || {
            echo D07_PREVIEW_TESTS=FAIL
            grep -E '^# (tests|pass|fail) [0-9]+$|^not ok [0-9]+ ' "$RUNNER_TEMP/d07-preview-tests.log" | cut -c1-160 | head -15
            grep -oE 'D07_(PRIVATE_RELEASE|T3_PREVIEW|ACCEPTANCE_PLAN|T3_RETAIN_INDEX)_[A-Z0-9_]+' "$RUNNER_TEMP/d07-preview-tests.log" | sort -u | head -20 || true
            exit 1
          }
          echo D07_PREVIEW_TESTS=PASS
          grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/d07-preview-tests.log"
      - name: Exact source checkout bytes with Windows-style line ending conversion
        working-directory: site
        run: |
          git -c core.autocrlf=true checkout-index --force --all > "$RUNNER_TEMP/d07-checkout-bytes.log" 2>&1 || { echo D07_PREVIEW_CHECKOUT=FAIL; exit 1; }
          node --input-type=module -e 'import {execFileSync} from "node:child_process";import {readFileSync} from "node:fs";import {createHash} from "node:crypto";const rows=execFileSync("git",["ls-tree","-r","-z","HEAD","--","src","t2-site-module/uslugovod","bun.lock","package.json","tsconfig.json","scripts/generate-d07-workspace-criteria.mjs","scripts/generate-d07-methodology-top500.mjs","scripts/lib/d07-stage-host-restore.mjs","scripts/prepare-d07-t3-host.mjs"],{encoding:"utf8",maxBuffer:8*1024*1024}).split("\0").filter(Boolean);let bad=0;for(const row of rows){const [meta,path]=row.split("\t");const expected=meta.split(" ")[2];const b=readFileSync(path);const got=createHash("sha1").update("blob "+b.length+"\0").update(b).digest("hex");if(got!==expected)bad++}console.log("D07_PREVIEW_CHECKOUT_FILES="+rows.length);console.log("D07_PREVIEW_CHECKOUT_MISMATCH="+bad);if(!rows.length||bad)process.exitCode=1'
          echo D07_PREVIEW_CHECKOUT=PASS
      # No private source, logs, dist or model weights are uploaded.
