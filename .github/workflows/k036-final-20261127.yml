# Dedicated existing allowlisted qualification ref; one new request only.
# No private Actions, no raw private logs/artifacts, no release activation.
name: K036 final native DB8 and original product qualification
on:
  push:
    branches: ['work/2026-11-25-k036-corporate-event-qualification']
    paths: ['.github/ci-requests/k036-final-20261127.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: k036-final-native-product-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.created && !github.event.deleted && !github.event.forced) }}
    strategy:
      fail-fast: false
      matrix:
        profile: [native]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Validate exact isolated one-shot request before private access
        run: node qualification/k036-final-20261127/verify-request.mjs
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: 'c4ae63d36d0ee64013b333368d930d477be0213c'
          path: private-t2
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/checkout@v4
        if: matrix.profile == 'native'
        with:
          repository: Faust-S/T2
          ref: '39a0b3205ea45a55c3db45b99f5bcf4f0283aef1'
          path: private-t2-main
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/checkout@v4
        if: matrix.profile == 'core'
        with:
          repository: Faust-S/knowledge
          ref: '99c61207a024cda6eac6aa5e39b2544540ec505d'
          path: public-one-core
          persist-credentials: false
          show-progress: false
      - uses: actions/checkout@v4
        if: matrix.profile == 'core'
        with:
          repository: Faust-S/T3
          ref: '0fb94b0273e429abcd5452484e8a81d269183f65'
          path: private-owner
          token: ${{ secrets.T3 || secrets.DOMEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute exact candidate profile (bounded diagnostics only)
        run: node qualification/k036-final-20261127/run.mjs ${{ matrix.profile }}
      - name: Remove all disposable private inputs and outputs
        if: always()
        shell: bash
        run: |
          rm -rf private-t2 private-t2-main private-owner public-one-core "$RUNNER_TEMP/k036-final-20261127-native" "$RUNNER_TEMP/k036-final-20261127-core"
