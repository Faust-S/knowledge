name: D05 T3 grouped release qualification
on:
  push:
    branches: [test/2026-11-24-d05-t3-integration]
    paths: [qualification/d05/t3-requests/release.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: d05-t3-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    uses: ./.github/workflows/d05-t3-dynamic.yml
    with:
      site_sha: 'bb8f1bd09c987879a003a90a09d3dd965acabd55'
      domain_sha: '7d44995b536bc57eb0acff63d876d255c034fb77'
      retained_base_sha: 'ba595ae901ea5af9b066a5e5f7cab88c15fdee8e'
      full_release: true
    secrets:
      DOMEN: ${{ secrets.DOMEN }}
  hardware:
    needs: linux
    if: ${{ !cancelled() && needs.linux.outputs.functional_ready == 'true' }}
    uses: ./.github/workflows/d05-t3-real-model.yml
    with:
      site_sha: 'bb8f1bd09c987879a003a90a09d3dd965acabd55'
      domain_sha: '7d44995b536bc57eb0acff63d876d255c034fb77'
      release_candidate: true
    secrets:
      DOMEN: ${{ secrets.DOMEN }}
