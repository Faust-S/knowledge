name: D05 T3 grouped release qualification
on:
  push:
    branches: [test/2026-11-24-d05-t3-integration]
    paths: [qualification/d05/t3-requests/release.json]
  workflow_dispatch:
    inputs:
      publication_recovery:
        description: Restore the already qualified 1.6.0 tree without repeating functional or hardware qualification
        type: boolean
        required: false
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: d05-t3-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    uses: ./.github/workflows/d05-t3-dynamic.yml
    with:
      site_sha: '823ded530e34bc5244d055f4d50a495dced931e3'
      domain_sha: '547148d8cd74838e0dd384c9da2f196e3595bf9d'
      assistant_sha: '1c6d077c45d0ccfa9f07f6718e475c1f2ee553fd'
      retained_base_sha: 'ba595ae901ea5af9b066a5e5f7cab88c15fdee8e'
      skills_version: '1.6.0'
      result_count: 15
      advice_count: 46
      detail_routes: 4
      grounded_advice: true
      full_release: true
      # This pinned release has completed its exact Linux qualification.
      publication_recovery: ${{ github.event_name == 'push' || inputs.publication_recovery }}
    secrets:
      DOMEN: ${{ secrets.DOMEN }}
  hardware:
    needs: linux
    if: ${{ !cancelled() && needs.linux.outputs.functional_ready == 'true' && needs.linux.outputs.reused_functional != 'true' }}
    uses: ./.github/workflows/d05-t3-real-model.yml
    with:
      site_sha: '823ded530e34bc5244d055f4d50a495dced931e3'
      domain_sha: '547148d8cd74838e0dd384c9da2f196e3595bf9d'
      witness_sha: 'd469f14e164d3d4d9ac7ec8f9b7faafacd4b25b0'
      evaluator_sha: 'd506577539a4ca530a02f548fa2b225221a6af11'
      assistant_sha: '1c6d077c45d0ccfa9f07f6718e475c1f2ee553fd'
      profile_id: 'light'
      grounded_advice: true
      cross_service: true
      release_candidate: true
    secrets:
      DOMEN: ${{ secrets.DOMEN }}
