name: D05 T3 grouped release qualification
# GitHub requires this path on the default branch for manual dispatch.
# Select test/2026-11-24-d05-t3-integration in the Run workflow branch dropdown.
# The actual pinned qualification lives only in that branch. A dispatch on
# this registration copy must not allocate a runner or execute private code.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Select the pinned D05 qualification branch before dispatch."
