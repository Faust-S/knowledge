name: D05 T3 grouped release qualification
on:
  workflow_dispatch:
  push:
    branches: ['ci/once/d05-t3-release/*']
    paths: ['.github/ci-requests/d05-t3-release.json']

permissions:
  contents: read
  actions: read
concurrency:
  group: d05-t3-release
  cancel-in-progress: false
jobs:
  admission:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/2026-11-24-d05-t3-integration') || (github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout only the public qualification harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit only the explicit exact one-time request
        shell: bash
        run: |
          python3 tools/ci/verify_once_request.py \
            --repository Faust-S/knowledge --workflow d05-t3-release \
            --profile 1.6.0-light-hardware-first \
            --revision site=64dcbe764ab05136bd6f9d4f4a3bf902897b06b7 \
            --revision subject=547148d8cd74838e0dd384c9da2f196e3595bf9d \
            --revision assistant=d27eaaecfff005bc788b6a04b5944526e4ba6f6f \
            --revision one-core=326f725c44d69ac99f6b912241e9e8a6c3d716a5 \
            --revision witness=273ddf175df30df40ba983444a4b94d4894eb0e4 \
            --revision evaluator=d506577539a4ca530a02f548fa2b225221a6af11 \
            --revision retained-base=ba595ae901ea5af9b066a5e5f7cab88c15fdee8e
  hardware:
    needs: admission
    if: ${{ needs.admission.result == 'success' }}
    uses: ./.github/workflows/d05-t3-real-model.yml
    with:
      site_sha: '64dcbe764ab05136bd6f9d4f4a3bf902897b06b7'
      domain_sha: '547148d8cd74838e0dd384c9da2f196e3595bf9d'
      witness_sha: '273ddf175df30df40ba983444a4b94d4894eb0e4'
      evaluator_sha: 'd506577539a4ca530a02f548fa2b225221a6af11'
      assistant_sha: 'd27eaaecfff005bc788b6a04b5944526e4ba6f6f'
      profile_id: 'light'
      grounded_advice: true
      cross_service: true
      release_candidate: true
    secrets:
      DOMEN: ${{ secrets.DOMEN }}
  linux:
    needs: hardware
    if: ${{ needs.hardware.result == 'success' }}
    uses: ./.github/workflows/d05-t3-dynamic.yml
    with:
      site_sha: '64dcbe764ab05136bd6f9d4f4a3bf902897b06b7'
      domain_sha: '547148d8cd74838e0dd384c9da2f196e3595bf9d'
      assistant_sha: 'd27eaaecfff005bc788b6a04b5944526e4ba6f6f'
      retained_base_sha: 'ba595ae901ea5af9b066a5e5f7cab88c15fdee8e'
      skills_version: '1.6.0'
      result_count: 15
      advice_count: 46
      detail_routes: 4
      grounded_advice: true
      full_release: true
      publication_recovery: false
    secrets:
      DOMEN: ${{ secrets.DOMEN }}
