name: D05 T3 grouped release qualification
on:
  push:
    branches: [test/2026-11-24-d05-t3-integration]
    paths: [qualification/d05/t3-requests/release.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: d05-t3-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    uses: ./.github/workflows/d05-t3-dynamic.yml
    with:
      site_sha: 'c31a6431105776dfdef8a5221f6fc04c867ad477'
      domain_sha: '53d3f79b6e3c1bc36f3c507c065283181c1c0132'
      retained_base_sha: 'ba595ae901ea5af9b066a5e5f7cab88c15fdee8e'
      full_release: true
    secrets:
      DOMEN: ${{ secrets.DOMEN }}
  hardware:
    needs: linux
    if: ${{ !cancelled() && needs.linux.outputs.functional_ready == 'true' }}
    uses: ./.github/workflows/d05-t3-real-model.yml
    with:
      site_sha: 'c31a6431105776dfdef8a5221f6fc04c867ad477'
      domain_sha: '53d3f79b6e3c1bc36f3c507c065283181c1c0132'
      witness_sha: 'a27b765e55dc5fea9fa15b2537b0f21ec1b2149a'
      evaluator_sha: '2f97a32d82231a5866cac80d44646e22015fc25c'
      profile_id: 'balanced'
      release_candidate: true
    secrets:
      DOMEN: ${{ secrets.DOMEN }}
