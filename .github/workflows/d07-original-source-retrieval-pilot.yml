name: D07 official original source retrieval pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d07-official-originals-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact private D07 site without persisting credentials
        uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: e156e3c7c40cd26f766c72275f45b442d5c905fb
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - name: Verify immutable private source revision
        run: |
          test "$(git -C site rev-parse HEAD)" = "e156e3c7c40cd26f766c72275f45b442d5c905fb"
          echo D07_ORIGINAL_PRIVATE_SOURCE=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"
      - name: Install immutable dependencies
        working-directory: site
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/d07-original-install.log" 2>&1 || {
            echo D07_ORIGINAL_INSTALL=FAIL
            exit 1
          }
          echo D07_ORIGINAL_INSTALL=PASS
      - name: Reject forged or unsafe source retrievals
        working-directory: site
        run: |
          node --test scripts/tests/d07-original-source-fetch.test.mjs > "$RUNNER_TEMP/d07-original-tests.log" 2>&1 || {
            echo D07_ORIGINAL_SECURITY_TESTS=FAIL
            grep -E '^not ok|^# (tests|pass|fail)|^[[:space:]]+(error|actual|expected):' "$RUNNER_TEMP/d07-original-tests.log" | tail -18 || true
            exit 1
          }
          echo D07_ORIGINAL_SECURITY_TESTS=PASS
      - name: Fetch actual publisher HTML and verify exact operation passages
        working-directory: site
        env:
          D07_RECEIPT_DEST: ${{ runner.temp }}/d07-official-original-receipts.json
        run: |
          node --import tsx scripts/d07-run-official-source-research.mjs --require-live > "$RUNNER_TEMP/d07-live-sources.log" 2>&1 || {
            echo D07_LIVE_ORIGINALS=FAIL
            grep -E '^D07_(ORIGINAL|RESEARCH)' "$RUNNER_TEMP/d07-live-sources.log" | tail -20 || true
            exit 1
          }
          echo D07_LIVE_ORIGINALS=PASS
          grep -E '^D07_(ORIGINAL|RESEARCH)' "$RUNNER_TEMP/d07-live-sources.log" | tail -20
          node -e "const f=require('fs');const x=JSON.parse(f.readFileSync(process.env.D07_RECEIPT_DEST,'utf8'));if(!x.receipts.every(r=>r.methodologyApproved===false&&r.rightsApproved===false&&r.applicabilityApproved===false))process.exit(2);if(x.counts.verifiedExactPassages<2)process.exit(3);console.log('D07_UNAPPROVED_RESEARCH_GUARD=PASS')"
      # Never upload proprietary source bytes, HTML, private source, dist, receipts or tokens.
