name: D07 T3 exact public order entry
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d07-t3-entry-qualification
  cancel-in-progress: false
jobs:
  exact-order-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: d948e1b15ccbaefaf9cbed05f4da7ab518cd7aa9
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - name: Source and entry regression on the actual 500-service catalogue
        working-directory: site
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/entry-install.log" 2>&1 || { echo D07_ENTRY_INSTALL=FAIL; exit 1; }
          node --import tsx --test scripts/tests/d07-tool-order-scope.test.mjs scripts/tests/d07-tool-directory-ref.test.mjs scripts/tests/d07-workspace-entry-public.test.mjs scripts/tests/d07-t3-professional-tool-criteria.test.mjs > "$RUNNER_TEMP/entry-tests.log" 2>&1 || {
            echo D07_ENTRY_EXACT=FAIL
            grep -E '^# (tests|pass|fail) [0-9]+$|^not ok [0-9]+ ' "$RUNNER_TEMP/entry-tests.log" | cut -c1-180 | head -35
            exit 1
          }
          echo D07_ENTRY_EXACT=PASS
          grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/entry-tests.log"
          bun run check:types > "$RUNNER_TEMP/entry-types.log" 2>&1 || {
            echo D07_ENTRY_TYPES=FAIL
            grep -oE 'error TS[0-9]+' "$RUNNER_TEMP/entry-types.log" | sort | uniq -c | head -20
            exit 1
          }
          echo D07_ENTRY_TYPES=PASS
          npm run test:product-first > "$RUNNER_TEMP/entry-product.log" 2>&1 || {
            echo D07_ENTRY_PRODUCT=FAIL
            grep -E '^# (tests|pass|fail) [0-9]+$|^not ok [0-9]+ ' "$RUNNER_TEMP/entry-product.log" | cut -c1-180 | head -35
            exit 1
          }
          echo D07_ENTRY_PRODUCT=PASS
          grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/entry-product.log"
      # The candidate is private; no artifact, full build log or source is uploaded.
