name: T3 rc.5 certificate-free loopback acceptance delivery
on:
  push:
    branches: ['ci/once/t3-rc5-ready-acceptance/**']
    paths: ['.github/ci-requests/t3-rc5-ready-acceptance.json']
permissions:
  contents: read
concurrency:
  group: t3-rc5-ready-acceptance
  cancel-in-progress: false
jobs:
  windows-delivery:
    if: ${{ github.event.created == false && github.event.deleted == false && github.event.forced == false }}
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: packages/t3-core
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          architecture: x64
      - name: Admit exact one-time request and frozen executable source
        shell: bash
        working-directory: .
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Faust-S/knowledge
          test "$GITHUB_REF_NAME" = "ci/once/t3-rc5-ready-acceptance/$BEFORE"
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $BEFORE"
          test "$(git diff-tree --no-commit-id --name-status -r HEAD)" = "$(printf 'A\t.github/ci-requests/t3-rc5-ready-acceptance.json')"
          git merge-base --is-ancestor a50d40dafc2e029fcc7668dece925f7fc38cc510 "$BEFORE"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('.github/ci-requests/t3-rc5-ready-acceptance.json','utf8'));
          assert.equal(r.preparedSha,process.env.BEFORE);
          delete r.preparedSha;
          assert.deepEqual(r,{"schema":"iwxa.ci.once/1","workflow":"t3-rc5-ready-acceptance","source":"a50d40dafc2e029fcc7668dece925f7fc38cc510","releaseTag":"t3-platform-v0.3.1-rc.5","archiveSha256":"381e9845fea164569d9363dd4e0983b5d9971347450e93246c1ebd5023fb98c4","reason":"DELIVER_CERTIFICATE_FREE_LOCALHOST_ORIGINAL_HOST_WITHOUT_REBUILD"});
          NODE
          test "$(git rev-parse HEAD:packages/t3-core/src)" = 3a391777a51012e51356b61b9d61bc94c511de67
          test "$(git rev-parse HEAD:packages/t3-core/qualified-runtime)" = 1594274dbf5e38214b8422ba11e8c7114bd5425c
      - name: Download exact already-qualified release (no platform rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ((git rev-parse HEAD:packages/t3-core/src) -ne '3a391777a51012e51356b61b9d61bc94c511de67') { throw 'QUALIFIED_EXECUTABLE_CHANGED' }
          gh release download t3-platform-v0.3.1-rc.5 --pattern platform-inputs.zip --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'DOWNLOAD_FAILED' }
          node scripts/prepare-t3-rc5-acceptance.mjs (Join-Path $env:RUNNER_TEMP 'platform-inputs.zip') (Join-Path $env:RUNNER_TEMP 'acceptance') 'http://localhost:18443'
          if ($LASTEXITCODE -ne 0) { throw 'ASSEMBLY_FAILED' }
      - name: Include only local launch transport and official Node Windows runtime
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'acceptance'
          Copy-Item acceptance/rc5/loopback/serve-acceptance.mjs,acceptance/rc5/loopback/START.cmd,acceptance/rc5/loopback/README-RU.md -Destination $dest
          $runtime = New-Item -ItemType Directory -Path (Join-Path $dest 'runtime')
          $node = (Get-Command node.exe).Source
          Copy-Item $node (Join-Path $runtime.FullName 'node.exe')
          Copy-Item (Join-Path (Split-Path $node) 'LICENSE') (Join-Path $runtime.FullName 'LICENSE')
          & (Join-Path $runtime.FullName 'node.exe') --check (Join-Path $dest 'serve-acceptance.mjs')
          if ($LASTEXITCODE -ne 0) { throw 'SERVER_SYNTAX_FAILED' }
      - name: Exercise the exact assembled Host and create an original .iwxa example
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'TEST_DEPENDENCIES_FAILED' }
          npx --no-install playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'BROWSER_INSTALL_FAILED' }
          $dest=Join-Path $env:RUNNER_TEMP 'acceptance'
          $logdir=New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'acceptance-logs')
          $process=$null
          try {
            # Launch the exact distributed START.cmd, without PS/Cert or browser overrides.
            $process=Start-Process -FilePath $env:ComSpec -ArgumentList '/d','/c','START.cmd' -WorkingDirectory $dest -PassThru -RedirectStandardOutput (Join-Path $logdir.FullName 'stdout.log') -RedirectStandardError (Join-Path $logdir.FullName 'stderr.log')
            node acceptance/rc5/loopback/smoke.mjs $dest
            if ($LASTEXITCODE -ne 0) { throw 'EXACT_LOOPBACK_DELIVERY_SMOKE_FAILED' }
          } finally {
            if ($process -and !$process.HasExited) { taskkill.exe /PID $process.Id /T /F | Out-Null }
            Get-Content (Join-Path $logdir.FullName 'stdout.log'),(Join-Path $logdir.FullName 'stderr.log') -ErrorAction SilentlyContinue
          }
      - name: Package the exact launched delivery and independently extract it
        run: |
          $dest=Join-Path $env:RUNNER_TEMP 'acceptance'
          $zip=Join-Path $env:RUNNER_TEMP 'acceptance-host-loopback-windows-x64.zip'
          Compress-Archive -Path (Join-Path $dest '*') -DestinationPath $zip -CompressionLevel Optimal
          $readback=Join-Path $env:RUNNER_TEMP 'readback'
          Expand-Archive -Path $zip -DestinationPath $readback
          $actual=Get-ChildItem -File -Recurse $dest
          $restored=Get-ChildItem -File -Recurse $readback
          if ($actual.Count -ne $restored.Count) { throw 'DELIVERY_FILE_COUNT_CHANGED' }
          foreach ($file in $actual) {
            $relative=[IO.Path]::GetRelativePath($dest,$file.FullName)
            if ((Get-FileHash $file.FullName).Hash -ne (Get-FileHash (Join-Path $readback $relative)).Hash) { throw "DELIVERY_READBACK_CHANGED: $relative" }
          }
          $r=Get-Content (Join-Path $dest 'acceptance-receipt.json') -Raw | ConvertFrom-Json
          $r | Add-Member -NotePropertyName deliveryCommit -NotePropertyValue $env:GITHUB_SHA
          $r | Add-Member -NotePropertyName deliveryRun -NotePropertyValue ([long]$env:GITHUB_RUN_ID)
          $r | Add-Member -NotePropertyName deliveryArchiveSha256 -NotePropertyValue (Get-FileHash $zip).Hash.ToLowerInvariant()
          $r | Add-Member -NotePropertyName exampleSha256 -NotePropertyValue (Get-FileHash (Join-Path $dest 'examples\workspace-original.iwxa')).Hash.ToLowerInvariant()
          $r | Add-Member -NotePropertyName fileCount -NotePropertyValue $actual.Count
          $r | Add-Member -NotePropertyName deliveryBrowserSmoke -NotePropertyValue 'PASS'
          $r | Add-Member -NotePropertyName physicalInference -NotePropertyValue 'NOT_RUN'
          $r | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8NoBOM (Join-Path $env:RUNNER_TEMP 'acceptance-host-loopback-receipt.json')
          Get-Content (Join-Path $env:RUNNER_TEMP 'acceptance-host-loopback-receipt.json')
      - uses: actions/upload-artifact@v4
        with:
          name: t3-rc5-ready-loopback-windows-x64
          path: |
            ${{ runner.temp }}/acceptance-host-loopback-windows-x64.zip
            ${{ runner.temp }}/acceptance-host-loopback-receipt.json
          if-no-files-found: error
          retention-days: 90
  retain:
    needs: windows-delivery
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: t3-rc5-ready-loopback-windows-x64
      - name: Add separately identified acceptance assets without replacing rc5
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/tags/t3-platform-v0.3.1-rc.5" --jq .object.sha)" = a50d40dafc2e029fcc7668dece925f7fc38cc510
          expected="$(jq -r .deliveryArchiveSha256 acceptance-host-loopback-receipt.json)"
          echo "$expected  acceptance-host-loopback-windows-x64.zip" | sha256sum -c -
          gh release upload t3-platform-v0.3.1-rc.5 acceptance-host-loopback-windows-x64.zip acceptance-host-loopback-receipt.json
          gh api "repos/$GH_REPO/releases/tags/t3-platform-v0.3.1-rc.5" --jq '{tag_name,target_commitish,assets:[.assets[]|{name,size,digest}]}'
