name: AKIS Mesa 3.5.2 R1-R2 strict registered economic source and work cycle

on:
  push:
    branches:
      - work/2026-11-23-akis-r1r2-strict-economic-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-original-mesa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install official Mesa 3.5.2 and pytest
        run: |
          python -m pip install --disable-pip-version-check "mesa==3.5.2" "pytest>=8,<10"
          python -c "import mesa; assert mesa.__version__ == '3.5.2'; print('ORIGINAL_MESA_3_5_2_PASS')"
      - name: Compile original AKIS
        run: python -m compileall -q qualifications/akis_2026_11_21/research
      - name: Complete original AKIS regression with R1-R2 strict economics
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests
      - name: Export strict economic Work evidence from original Mesa
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_r1r2_strict_economic_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: akis-r1r2-strict-economics-${{ matrix.os }}
          if-no-files-found: error
          path: qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r1r2_strict_registered_economic_evidence.json
