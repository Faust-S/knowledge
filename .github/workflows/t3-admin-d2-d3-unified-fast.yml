name: Admin Center 0.3 unified original D2 plus employee D3 (public isolated)
on:
  push:
    branches:
      - work/2026-11-22-admin03-d2-d3-unified-proof
    paths:
      - .github/workflows/t3-admin-d2-d3-unified-fast.yml
      - packages/t3-core/tests/t3-d2-original-native-workspace-jit.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin03-unified-original-d2-d3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-native-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 3f2ca23e4821e0c0d473f09bf8bc947dee6db751
          token: ${{ secrets.T3 || secrets.DOMEN }}
          persist-credentials: false
          path: .private/t3
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check original private unified D2 D3 owner pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .private/t3 rev-parse HEAD)" = '3f2ca23e4821e0c0d473f09bf8bc947dee6db751'
          node --check .private/t3/interop/native-admin-d3.mjs
          node --check .private/t3/interop/runtime.mjs
          node --check .private/t3/interop/provision.mjs
          node --check .private/t3/access-control/domain-registry.mjs
          echo "ADMIN03_UNIFIED_PRIVATE_ORIGINAL_SOURCE_CHECK_PASS"
      - name: Original signed employee and workspace-owner test contracts
        shell: bash
        run: |
          set -euo pipefail
          run_original() {
            local name="$1"; shift
            if ! "$@" > "$RUNNER_TEMP/${name}.log" 2>&1; then
              # Only bounded failure indexes / error classes. Never publish
              # private source, vault paths, traces or signed Task contents.
              awk '/^not ok [0-9]+/ {print "ADMIN03_ORIGINAL_NATIVE_CASE_INDEX " $3}' "$RUNNER_TEMP/${name}.log" | head -12 || true
              grep -oE '(T3|INTEROP|APPLICATION)_[A-Z0-9_]{4,99}' "$RUNNER_TEMP/${name}.log" | tail -7 | sed 's/^/ADMIN03_ORIGINAL_NATIVE_MACHINE_CODE /' || true
              if grep -q 'ERR_ASSERTION' "$RUNNER_TEMP/${name}.log"; then echo 'ADMIN03_ORIGINAL_NATIVE_ASSERTION_FAILED'; fi
              if grep -q 'TypeError' "$RUNNER_TEMP/${name}.log"; then echo 'ADMIN03_ORIGINAL_NATIVE_TYPE_ERROR'; fi
              if grep -q 'ReferenceError' "$RUNNER_TEMP/${name}.log"; then echo 'ADMIN03_ORIGINAL_NATIVE_REFERENCE_ERROR'; fi
              echo "ADMIN03_UNIFIED_${name}_HOLD"
              exit 1
            fi
            echo "ADMIN03_UNIFIED_${name}_PASS"
          }
          run_original ORIGINAL_D3_NATIVE_HOST node --test .private/t3/tests/admin-original-host-port.test.mjs
          run_original ORIGINAL_D3_APPLICATION node --test .private/t3/tests/admin-application-content.test.mjs
          run_original EMPLOYEE_MULTI_OWNER node --test .private/t3/tests/multi-employee-admin.test.mjs
          run_original EMPLOYEE_PROVISIONING node --test .private/t3/tests/multi-employee-provisioning.test.mjs
          run_original ORIGINAL_D2_DATA_GRANT node --test .private/t3/tests/t3-admin-activity-original-data-grant.test.mjs
          run_original COLD_CREATE_FENCE node packages/t3-core/tests/t3-d2-original-native-workspace-jit.mjs .private/t3
          grep -q '^D2_ORIGINAL_SIGNED_CREATE_COLD_REPLAY_FENCE_PASS$' "$RUNNER_TEMP/COLD_CREATE_FENCE.log"
          grep -q '^D2_ORIGINAL_COLD_READ_ONLY_RECOVERY_JIT_PASS$' "$RUNNER_TEMP/COLD_CREATE_FENCE.log"
          echo "ADMIN03_UNIFIED_ORIGINAL_SIGNED_D2_D3_CONTRACT_PASS"
      - name: Original One Core employee registry and Kernel evidence
        shell: bash
        run: |
          set -euo pipefail
          node --test packages/t3-core/tests/t3-d3-independent-employee-original-enrollment.test.mjs > "$RUNNER_TEMP/original-employee-kernel.log" 2>&1 || { echo "ADMIN03_UNIFIED_ORIGINAL_EMPLOYEE_KERNEL_HOLD"; exit 1; }
          echo "ADMIN03_UNIFIED_ORIGINAL_EMPLOYEE_KERNEL_PASS"
  original-windows-builder:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 3f2ca23e4821e0c0d473f09bf8bc947dee6db751
          token: ${{ secrets.T3 || secrets.DOMEN }}
          persist-credentials: false
          path: .private/t3
      - name: Parse private original compiled-owner Windows builder without running private Actions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((git -C .private/t3 rev-parse HEAD).Trim() -ne '3f2ca23e4821e0c0d473f09bf8bc947dee6db751') {throw 'ADMIN03_UNIFIED_PRIVATE_OWNER_PIN_CHANGED'}
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.private/t3/scripts/build-admin-center-d3-owner.ps1').Path,
            [ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -ne 0) {throw 'ADMIN03_UNIFIED_ORIGINAL_OWNER_BUILDER_PARSE_FAILED'}
          Write-Host 'ADMIN03_UNIFIED_ORIGINAL_BUILDER_PARSE_PASS'
