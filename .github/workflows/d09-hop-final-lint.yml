name: D09 HOP full lint (private source in public isolated runner)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout HOP pinned private source
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop.iwxa.ru
          ref: 92060a4ca0f819b6976f2a15772339a6dc7232e7
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact project dependencies
        shell: bash
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-lint-npm.log" 2>&1 || {
            echo D09_FULL_LINT_NPM=FAIL; exit 1;
          }
          echo "D09_FULL_LINT_HEAD=$(git rev-parse HEAD)"
          echo D09_FULL_LINT_NPM=PASS
      - name: Run eslint across full website, print only metadata
        shell: bash
        run: |
          set +e
          ./node_modules/.bin/eslint . --format json --output-file "$RUNNER_TEMP/d09-eslint.json" > "$RUNNER_TEMP/d09-eslint.log" 2>&1
          result=$?
          set -e
          node --input-type=module - "$RUNNER_TEMP/d09-eslint.json" <<'NODE'
          import {readFileSync,existsSync} from "node:fs";
          import {relative} from "node:path";
          const file=process.argv[2];
          if(!existsSync(file)){console.log("D09_LINT_REPORT_MISSING");process.exit(1);}
          const items=JSON.parse(readFileSync(file,"utf8"));
          let errors=0,warnings=0;
          const findings=[];
          const byRule=new Map(),byFile=[];
          for(const f of items){
            errors+=f.errorCount;warnings+=f.warningCount;
            if(f.errorCount) byFile.push([relative(process.cwd(),f.filePath),f.errorCount]);
            for(const m of f.messages.filter(x=>x.severity===2)){
              const k=m.ruleId??"parse-error";byRule.set(k,(byRule.get(k)??0)+1);
              if(findings.length<60)findings.push([
                relative(process.cwd(),f.filePath),
                m.line??0, m.ruleId??"parse-error"
              ].join(":"));
            }
          }
          console.log("D09_FULL_LINT_ERRORS="+errors);
          console.log("D09_FULL_LINT_WARNINGS="+warnings);
          for(const [k,v] of [...byRule].sort((a,b)=>b[1]-a[1])) console.log("D09_LINT_RULE="+k+":"+v);
          for(const [p,v] of byFile.sort((a,b)=>b[1]-a[1]).slice(0,40))console.log("D09_LINT_FILE="+p+":"+v);
          for(const f of findings) console.log("D09_LINT_LOCATION="+f);
          NODE
          if test "$result" -ne 0; then echo D09_FULL_LINT=FAIL; exit 1; fi
          echo D09_FULL_LINT=PASS
