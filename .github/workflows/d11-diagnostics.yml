name: D11 type and lint diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/advice-logistics.ru
          ref: work/2026-11-12-case001-logistics-engineering
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without exposing logs
        shell: pwsh
        run: |
          & npm ci --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP "install.txt")
          if ($LASTEXITCODE -ne 0) { throw "D11_NPM_CI_FAILED" }
      - name: Report compiler diagnostics without source
        continue-on-error: true
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP "typescript.txt"
          & npx tsc --noEmit --pretty false *> $log
          $errors=@(Get-Content $log | Select-String 'error TS[0-9]+:')
          Write-Output "D11_TYPES_COUNT=$($errors.Count)"
          foreach ($line in ($errors | Select-Object -First 48)) {
            if ($line.Line -match '^(.+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+): (.+)$') {
              $where=$Matches[1];$lineno=$Matches[2];$code=$Matches[4];$reason=$Matches[5]
              if ($reason.Length -gt 340) { $reason=$reason.Substring(0,340) }
              Write-Output "D11_TS_DIAG=$($where):$lineno $code $reason"
            }
          }
      - name: Report lint counts by file and rule without source
        continue-on-error: true
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP "eslint.json"
          & npx eslint . --format json *> $log
          $rows=Get-Content $log -Raw | ConvertFrom-Json
          $total=($rows | Measure-Object -Property errorCount -Sum).Sum
          $bad=@($rows | Where-Object {$_.errorCount -gt 0})
          Write-Output "D11_LINT_ERRORS=$total FILES=$($bad.Count)"
          $rules=$bad | ForEach-Object {$_.messages} | Where-Object {$_.severity -eq 2} |
            Group-Object ruleId | Sort-Object Count -Descending | Select-Object -First 12
          foreach ($r in $rules) { Write-Output "D11_LINT_RULE=$($r.Name):$($r.Count)" }
          foreach ($item in $bad) {
            foreach ($message in $item.messages) {
              if ($message.severity -eq 2 -and $message.ruleId -ne "prettier/prettier") {
                Write-Output "D11_LINT_SUBSTANTIVE=$([IO.Path]::GetFileName($item.filePath)):$($message.line):$($message.column) rule:$($message.ruleId)"
              }
            }
          }
          foreach ($item in ($bad | Sort-Object errorCount -Descending | Select-Object -First 12)) {
            Write-Output "D11_LINT_FILE=$([IO.Path]::GetFileName($item.filePath)):$($item.errorCount)"
          }
