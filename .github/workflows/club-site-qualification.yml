name: Club public site qualification (no private credentials)
on:
  push:
    branches: [work/2026-11-15-club-site-qualification]
    paths:
      - .github/workflows/club-site-qualification.yml
      - qualification/club/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect published Club routes and links
        run: node qualification/club/public-site-smoke.mjs
      - name: Save report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: club-public-site-report
          path: qualification/club/report.json
          if-no-files-found: warn
