name: D07 manufacturer PDF source qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d07-manufacturer-pdf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-manufacturer-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout private subject exact revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod
          ref: 38bd8b96c5d7920980e6a31b7db6d6a206ec125f
          token: ${{ secrets.DOMEN }}
          path: domain
          persist-credentials: false
      - name: Checkout private site exact revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: cc99957c8083951c03ffa6b8fc149624918bb552
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - name: Verify exact refs and original subject-protocol parity
        run: |
          test "$(git -C domain rev-parse HEAD)" = "38bd8b96c5d7920980e6a31b7db6d6a206ec125f"
          test "$(git -C site rev-parse HEAD)" = "cc99957c8083951c03ffa6b8fc149624918bb552"
          cmp domain/src/domain/service-subject-wallpaper-a.ts site/src/domain/service-subject-wallpaper-a.ts
          cmp domain/src/domain/service-subject-protocols.ts site/src/domain/service-subject-protocols.ts
          cmp domain/src/domain/service-original-corroboration.ts site/src/domain/service-original-corroboration.ts
          cmp domain/src/domain/service-external-gap-research.ts site/src/domain/service-external-gap-research.ts
          echo D07_WALLPAPER_SOURCE_PARITY=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"
      - name: Install frozen site dependencies and Poppler extraction tools
        working-directory: site
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/d07-pdf-install.log" 2>&1 || exit 1
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq > /dev/null
            sudo apt-get install -y -qq poppler-utils > /dev/null
          fi
          pdftotext -v 2>&1 | head -2
          node --check scripts/d07-original-pdf-fetch.mjs
          node --check scripts/d07-run-official-source-research.mjs
          echo D07_PDF_EXTRACTION_TOOLS=PASS
      - name: Validate PDF originals, method-specific work and software types
        working-directory: site
        run: |
          node --import tsx --test scripts/tests/d07-original-pdf-fetch.test.mjs scripts/tests/d07-wallpaper-professional-method.test.mjs > "$RUNNER_TEMP/d07-pdf-tests.log" 2>&1 || {
            echo D07_PDF_TESTS=FAIL
            grep -E '^not ok|^# (tests|pass|fail)|^[[:space:]]+(error|actual|expected):' "$RUNNER_TEMP/d07-pdf-tests.log" | tail -20 || true
            exit 1
          }
          echo D07_PDF_TESTS=PASS
          bun x tsc --noEmit > "$RUNNER_TEMP/d07-pdf-types.log" 2>&1 || {
            echo D07_PDF_TYPES=FAIL
            grep -oE 'TS[0-9]+' "$RUNNER_TEMP/d07-pdf-types.log" | sort | uniq -c | head -20 || true
            exit 1
          }
          echo D07_PDF_TYPES=PASS
      - name: Produce all 500 and count distinct individual method coverage
        working-directory: site
        run: |
          node --import tsx scripts/generate-d07-methodology-top500.mjs "$RUNNER_TEMP/d07-pdf-500" --as-of=2026-11-21 > "$RUNNER_TEMP/d07-pdf-top500.log" 2>&1 || {
            echo D07_PDF_TOP500_GENERATION=FAIL
            grep -oE 'D07_[A-Z0-9_]+' "$RUNNER_TEMP/d07-pdf-top500.log" | tail -12 || true
            exit 1
          }
          echo D07_PDF_TOP500_GENERATION=PASS
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d07-pdf-500/service-professional-finalization.top500.generated.json'));console.log('D07_PDF_TOP500_SELECTED='+d.counts.selected);console.log('D07_PDF_INDIVIDUAL_SUBJECTS='+d.counts.editorialWithIndividualTechnology);if(d.counts.selected!==500||d.counts.editorialWithIndividualTechnology<87||d.counts.independentlyApprovedMethodologies!==0)process.exit(1)"
      - name: Retrieve real Metylan PDF originals and verify exact operation passages
        working-directory: site
        env:
          D07_SOURCE_MANIFEST: scripts/research/d07-official-pdf-pilot.json
          D07_RECEIPT_DEST: ${{ runner.temp }}/d07-pdf-original-receipts.json
        run: |
          node --import tsx scripts/d07-run-official-source-research.mjs --require-live > "$RUNNER_TEMP/d07-pdf-live.log" 2>&1 || {
            echo D07_PDF_LIVE=FAIL
            grep -E '^D07_(ORIGINAL|RESEARCH|PDF_DIAG)' "$RUNNER_TEMP/d07-pdf-live.log" | tail -20 || true
            exit 1
          }
          echo D07_PDF_LIVE=PASS
          grep -E '^D07_(ORIGINAL|RESEARCH|PDF_DIAG)' "$RUNNER_TEMP/d07-pdf-live.log" | tail -24
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.env.D07_RECEIPT_DEST));console.log('D07_PDF_RETRIEVED='+x.counts.retrievedSources);console.log('D07_PDF_UNIQUE_FETCHES='+x.counts.uniquePdfOriginalsFetched);for(const r of x.receipts){console.log('D07_PDF_TEXT_SHA256='+r.sourceId+':'+r.textSha256);if(r.methodologyApproved||r.rightsApproved||r.applicabilityApproved)process.exit(1)}if(x.counts.uniquePdfOriginalsFetched!==2||x.counts.approvedMethodologies!==0||x.counts.verifiedExactPassages<2)process.exit(1)"
      # No private source, original technical PDFs, rendered pages, receipts or dist uploaded.
