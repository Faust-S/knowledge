name: d06-private-formatter-one-shot

# Private sources stay on the disposable runner and in the original private repository.
# Never run GitHub Actions in a private repository, print a source diff, or upload artifacts.
on:
  push:
    branches:
      - test/2026-11-18-d06-qualification
    paths:
      - .github/workflows/d06-private-formatter-one-shot.yml

permissions:
  contents: read

jobs:
  format-private-branch:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact private product branch
        uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod.ru
          ref: work/2026-11-11-case-driven-entry-and-drill
          token: ${{ secrets.DOMEN }}
          persist-credentials: true
          path: private/site
      - name: Verify the approved private work branch and source preconditions
        working-directory: private/site
        shell: pwsh
        run: |
          $current = (& git branch --show-current).Trim()
          $expected = "work/2026-11-11-case-driven-entry-and-drill"
          if ($current -ne $expected) {
            Write-Host "D06_FORMAT_PRECONDITION=WRONG_BRANCH"
            exit 1
          }
          if (-not (Test-Path -LiteralPath "src/workspace/configurationComparison.ts") -or
              -not (Test-Path -LiteralPath "src/workspace/itemHistoryDocument.ts") -or
              -not (Test-Path -LiteralPath "tests/e2e/task-entry.spec.ts")) {
            Write-Host "D06_FORMAT_PRECONDITION=SUBJECT_FILES_MISSING"
            exit 1
          }
          if (@(& git status --porcelain).Count -ne 0) {
            Write-Host "D06_FORMAT_PRECONDITION=DIRTY_CHECKOUT"
            exit 1
          }
          Write-Host "D06_FORMAT_PRECONDITION=PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Format only affected private files and push to same work branch
        shell: pwsh
        working-directory: private/site
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:RUNNER_TEMP "d06-private-format-only.log"
          & npm ci *> $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "D06_PRIVATE_FORMAT_INSTALL=FAIL"
            exit 1
          }
          Write-Host "D06_PRIVATE_FORMAT_INSTALL=PASS"
          $files = @(
            "scripts/test-item-history-document.ts",
            "src/components/workspace/ItemHistoryDownload.tsx",
            "src/workspace/itemAcceptanceHistory.ts",
            "src/workspace/itemHistoryDocument.ts",
            "tests/e2e/task-entry.spec.ts",
            "src/workspace/configurationComparison.ts",
            "src/components/workspace/WorkspaceConfigurationComparison.tsx",
            "scripts/test-configuration-comparison.ts"
          )
          & .\node_modules\.bin\prettier.cmd --write @files *> $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "D06_PRIVATE_FORMAT_EXECUTE=FAIL"
            exit 1
          }
          Write-Host "D06_PRIVATE_FORMAT_EXECUTE=PASS"
          & git add -- @files
          $changed = @(& git diff --cached --name-only)
          if ($changed.Count -eq 0) {
            Write-Host "D06_PRIVATE_FORMAT_CHANGED_FILES=0"
            exit 0
          }
          & git config user.name "IWXA D06 Source Format"
          & git config user.email "actions@users.noreply.github.com"
          & git commit -m "style(d06): normalize saved-item history and comparison source formatting" *> $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "D06_PRIVATE_FORMAT_COMMIT=FAIL"
            exit 1
          }
          & git push origin HEAD:refs/heads/work/2026-11-11-case-driven-entry-and-drill *> $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "D06_PRIVATE_FORMAT_PUSH=FAILED_OR_BRANCH_ADVANCED"
            exit 1
          }
          Write-Host ("D06_PRIVATE_FORMAT_CHANGED_FILES=" + $changed.Count)
          Write-Host ("D06_PRIVATE_FORMAT_NEW_SHA=" + (& git rev-parse HEAD).Trim())
          Write-Host "D06_PRIVATE_FORMAT_PRIVATE_SOURCE_UPLOADS=0"
          Write-Host "D06_PRIVATE_FORMAT_PRIVATE_ARTIFACT_UPLOADS=0"
