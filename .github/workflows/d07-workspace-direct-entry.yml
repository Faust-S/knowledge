name: D07 Workspace direct journey and canonical T2 build
on:
  push:
    branches:
      - work/2026-11-21-d07-workspace-quality
    paths:
      - .github/workflows/d07-workspace-direct-entry.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SITE_SHA: 15c552a88726ee44bbe68e3530b32bdddbcdf648
      SUBJECT_SHA: 96ebc683cd8ee506bc14fe1f58d06e3dedd9631f
      T2_SHA: e70de29b72b83e2546f7ab74b17572685a728c17
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      CI: 'true'
    steps:
      - name: Confirm private repositories are accessible
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'D07_PRIVATE_ACCESS_MISSING'; exit 1; }
          gh api repos/Faust-S/uslugovod.ru --jq .id >/dev/null
          gh api repos/Faust-S/uslugovod --jq .id >/dev/null
          gh api repos/Faust-S/T2 --jq .id >/dev/null
          echo 'D07_SOURCE_ACCESS=PASS'
      - name: Checkout private site only into ephemeral runner
        uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: ${{ env.SITE_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - name: Checkout canonical domain subject source
        uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod
          ref: ${{ env.SUBJECT_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: subject
      - name: Checkout original T2 only into ephemeral runner
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: ${{ env.T2_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: t2
      - name: Set Node.js and Bun
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Verify fixed private revisions and install
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C site rev-parse HEAD)" = "$SITE_SHA" || exit 1
          test "$(git -C subject rev-parse HEAD)" = "$SUBJECT_SHA" || exit 1
          cmp -s site/src/domain/service-lifecycle.ts subject/src/domain/service-lifecycle.ts || { echo 'D07_LIFECYCLE_DRIFT'; exit 1; }
          grep -q 'riskProgress' subject/src/domain/order-contract.ts || { echo 'D07_SUBJECT_RISK_PROGRESS_MISSING'; exit 1; }
          cmp -s site/src/data/serviceDirectory.ts subject/src/data/serviceDirectory.ts || { echo 'D07_DIRECTORY_MODEL_DRIFT'; exit 1; }
          cmp -s site/src/domain/service-order-starter.ts subject/src/domain/service-order-starter.ts || { echo 'D07_STARTER_MODEL_DRIFT'; exit 1; }
          cmp -s site/src/domain/service-source-adaptation.ts subject/src/domain/service-source-adaptation.ts || { echo 'D07_SOURCE_MODEL_DRIFT'; exit 1; }
          cmp -s site/src/domain/service-top500.ts subject/src/domain/service-top500.ts || { echo 'D07_TOP500_MODEL_DRIFT'; exit 1; }
          cmp -s site/src/domain/service-methodology-conversion.ts subject/src/domain/service-methodology-conversion.ts || { echo 'D07_CONVERSION_MODEL_DRIFT'; exit 1; }
          cmp -s site/src/domain/service-professional-workflows.ts subject/src/domain/service-professional-workflows.ts || { echo 'D07_WORKFLOWS_MODEL_DRIFT'; exit 1; }
          cmp -s site/src/data/types.ts subject/src/data/types.ts || { echo 'D07_TYPES_MODEL_DRIFT'; exit 1; }
          cmp -s site/src/data/services/_shared/createGenericService.ts subject/src/data/services/_shared/createGenericService.ts || { echo 'D07_GENERIC_MODEL_DRIFT'; exit 1; }
          for path in \
            src/data/services/avto-tehnika-oborudovanie/index.ts \
            src/data/services/avto-tehnika-oborudovanie/extended.ts \
            src/data/services/buhgalteriya-nalogi-biznes/index.ts \
            src/data/services/foto-video-meropriyatiya/extended.ts \
            src/data/services/krasota-zdorove-uhod/extended.ts \
            src/data/services/marketing-reklama-prodazhi/index.ts \
            src/data/services/obuchenie-repetitory/extended.ts \
            src/data/services/perevozki-dostavka-logistika/index.ts \
            src/data/services/uborka-hozyaystvo-pomosch/extended.ts \
            src/data/services/yuristy-dokumenty/index.ts \
            src/data/services/kompyutery-it-sayty/service-template.ts; do
            cmp -s "site/$path" "subject/$path" || { echo 'D07_SUBJECT_CATEGORY_MODEL_DRIFT'; exit 1; }
          done
          echo 'D07_SUBJECT_MODEL=PASS'
          test "$(git -C t2 rev-parse HEAD)" = "$T2_SHA" || exit 1
          cd site
          if ! bun install --frozen-lockfile >"$RUNNER_TEMP/d07-install.private.log" 2>&1; then
            if grep -Eqi 'unexpected token|syntaxerror|parse error|TS1005' "$RUNNER_TEMP/d07-install.private.log"; then
              echo 'D07_DEPS_CAUSE=ROUTE_GENERATION_PARSE'
            elif grep -Eqi 'frozen.lock|lockfile.*changed|lockfile.*out.of.date' "$RUNNER_TEMP/d07-install.private.log"; then
              echo 'D07_DEPS_CAUSE=LOCKFILE'
            elif grep -Eqi 'timed.out|connection|registry|http.5[0-9][0-9]|http.429|certificate' "$RUNNER_TEMP/d07-install.private.log"; then
              echo 'D07_DEPS_CAUSE=REGISTRY_OR_NETWORK'
            else
              echo 'D07_DEPS_CAUSE=UNCLASSIFIED'
            fi
            echo 'D07_DEPS=FAIL'
            exit 1
          fi
          echo 'D07_DEPS=PASS'
      - name: TypeScript and module syntax
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          if ! bun run check:types >"$RUNNER_TEMP/d07-types.private.log" 2>&1; then
            echo 'D07_TYPES=FAIL'
            grep -Eo 'TS[0-9]{4}' "$RUNNER_TEMP/d07-types.private.log" | sort -u | head -20 || true
            exit 1
          fi
          echo 'D07_TYPES=PASS'
      - name: Run product regression including new Workspace start
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          if ! bun run test:product-first >"$RUNNER_TEMP/d07-tests.private.log" 2>&1; then
            echo 'D07_TESTS=FAIL'
            grep -E '^not ok [0-9]+' "$RUNNER_TEMP/d07-tests.private.log" | sed -E 's/^not ok [0-9]+ - /D07_FAILED_TEST=/' | head -20 || true
            exit 1
          fi
          echo 'D07_TESTS=PASS'
      - name: Check official O*NET task dataset adaptation without publishing source
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          url='https://www.onetcenter.org/dl_files/database/db_31_0_json/task_statements.json'
          file="$RUNNER_TEMP/d07-onet-task-statements.json"
          if ! curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 120 --output "$file" "$url" >"$RUNNER_TEMP/d07-onet-fetch.private.log" 2>&1; then
            echo 'D07_ONET_OFFICIAL_DOWNLOAD=FAIL'
            exit 1
          fi
          if ! node --import tsx scripts/adapt-onet-task-statements.mjs "$file" --summary-only >"$RUNNER_TEMP/d07-onet-summary.private.log" 2>&1; then
            echo 'D07_ONET_OFFICIAL_IMPORT=FAIL'
            grep -Eo 'D07_[A-Z0-9_]+' "$RUNNER_TEMP/d07-onet-summary.private.log" | sort -u | head -10 || true
            exit 1
          fi
          grep -E '^D07_SOURCE_ONET_(DIRECTORY|LINKEDSERVICES|OCCUPATIONCODES|CORETASKS)=[0-9]+$' "$RUNNER_TEMP/d07-onet-summary.private.log" || true
          grep -q '^D07_SOURCE_ONET_REVIEW_ONLY=PASS$' "$RUNNER_TEMP/d07-onet-summary.private.log"
          mkdir -p "$RUNNER_TEMP/d07-method-with-external"
          if ! node --import tsx scripts/generate-d07-methodology-top500.mjs "$RUNNER_TEMP/d07-method-with-external" "--onet=$file" >"$RUNNER_TEMP/d07-method-with-external.private.log" 2>&1; then
            echo 'D07_ONET_TOP500_CONVERSION=FAIL'
            grep -Eo 'D07_[A-Z0-9_]+' "$RUNNER_TEMP/d07-method-with-external.private.log" | sort -u | head -10 || true
            exit 1
          fi
          grep -q '^D07_METHOD_WITHEXTERNALCANDIDATETASKS=13$' "$RUNNER_TEMP/d07-method-with-external.private.log" || exit 1
          grep -q '^D07_METHOD_PROPOSEDTASKCOUNT=250$' "$RUNNER_TEMP/d07-method-with-external.private.log" || exit 1
          echo 'D07_ONET_TOP500_CONVERSION=PASS'
          echo 'D07_ONET_OFFICIAL_IMPORT=PASS'
      - name: Build actual integrated site with canonical T2 Host
        shell: bash
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
        run: |
          set -euo pipefail
          if ! bun run build:t2-integrated >"$RUNNER_TEMP/d07-build.private.log" 2>&1; then
            echo 'D07_INTEGRATED_BUILD=FAIL'
            grep '^D07_PUBLIC_BUILD_STEP_FAIL=' "$RUNNER_TEMP/d07-build.private.log" | tail -1 || true
            grep -E '^D07_PUBLIC_BUILD_STEP_(START|PASS)=' "$RUNNER_TEMP/d07-build.private.log" | tail -8 || true
            grep -E '^D07_WORKSPACE_SUBJECT_(CRITERIA|DETAILED|STARTERS)=[0-9]+$' "$RUNNER_TEMP/d07-build.private.log" | tail -3 || true
            grep -Eo 'D07_[A-Z0-9_]+|T2_[A-Z0-9_]+|TS[0-9]{4}|ERR_[A-Z0-9_]+' "$RUNNER_TEMP/d07-build.private.log" | sort -u | head -30 || true
            exit 1
          fi
          test -s dist/workspace/index.html || { echo 'D07_ORIGINAL_HOST_MISSING'; exit 1; }
          grep -E '^D07_WORKSPACE_SUBJECT_(CRITERIA|DETAILED|STARTERS)=[0-9]+$' "$RUNNER_TEMP/d07-build.private.log" | tail -3 || true
          grep -E '^D07_METHOD_(SELECTED|DEFERRED|DETAILED|STARTERS|CONVERSION_BATCH)=' "$RUNNER_TEMP/d07-build.private.log" | tail -5 || true
          grep -q '^D07_METHOD_SELECTED=500$' "$RUNNER_TEMP/d07-build.private.log" || { echo 'D07_TOP500_BUILD_MISSING'; exit 1; }
          grep -q '^D07_METHOD_CONVERSION_BATCH=PASS$' "$RUNNER_TEMP/d07-build.private.log" || { echo 'D07_METHOD_BUILD_MISSING'; exit 1; }
          grep -q '^D07_METHOD_HOST_SUGGESTIONS=500$' "$RUNNER_TEMP/d07-build.private.log" || { echo 'D07_HOST_PLAN_STAGE_MISSING'; exit 1; }
          grep -E '^D07_METHOD_(MATCHEDWORKACCEPTANCE|STARTERWORKACCEPTANCE|SOURCEANCHOREDCHECKS|WORKFLOWSERVICES|WITHEXPLICITSUBJECTSEED|SERVICESWITHFIVEPHASES|WORKFLOWWORKACCEPTANCE)=[0-9]+$' "$RUNNER_TEMP/d07-build.private.log" | tail -7 || true
          grep -E '^D07_WORKSPACE_(PROFESSIONAL_FORMS|SOURCE_PROFILES)=[0-9]+$' "$RUNNER_TEMP/d07-build.private.log" | tail -2 || true
          grep -E '^D07_METHOD_HOST_(SUGGESTIONS|REVIEW_REQUIRED)=[0-9]+$' "$RUNNER_TEMP/d07-build.private.log" | tail -2 || true
          echo 'D07_ONE_DIST_ORIGINAL_T2=PASS'
      # Do not upload dist, private source, logs, archives, browser profiles or screenshots.
