name: D11 dashboard scoped UI and project services
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private site read-only for ephemeral checks
        uses: actions/checkout@v4
        with:
          repository: Faust-S/advice-logistics.ru
          ref: work/2026-11-12-case001-logistics-engineering
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install for syntax verification
        run: npm ci --no-audit --no-fund > /dev/null
      - name: Check custom network order audits and canonical dashboard projections
        run: node --experimental-strip-types --test tests/d11-operational-services.test.mjs tests/d11-dashboard-projection.test.mjs
      - name: Run every D11 site contract after service-first migration
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Typecheck integrated site source and typed operational APIs
        run: node_modules/.bin/tsc --noEmit --project tsconfig.json
      - name: Parse React project search and Windows Linux browser acceptance
        run: |
          node --check scripts/d11-live-t2-kernel-exchange-acceptance.mjs
          node --check scripts/d11-live-browser-acceptance.mjs
          node_modules/.bin/esbuild src/lib/logistics/operational-services.ts --bundle --platform=browser --format=esm --outfile=/tmp/d11-operational-services-bundle.mjs
          node_modules/.bin/esbuild runtime/d11-module/D11WorkspaceOverview.tsx --format=esm --outfile=/tmp/d11-dashboard-ui-check.mjs
          node_modules/.bin/esbuild runtime/d11-module/D11WorkspaceCard.tsx --format=esm --outfile=/tmp/d11-result-list-ui-check.mjs
          node_modules/.bin/esbuild runtime/d11-module/D11ProposalViewer.tsx --format=esm --outfile=/tmp/d11-result-viewer-ui-check.mjs
          node_modules/.bin/esbuild src/routes/index.tsx --format=esm --outfile=/tmp/d11-home-ui-check.mjs
          node_modules/.bin/esbuild src/components/tools/D11WorkspaceEntry.tsx --format=esm --outfile=/tmp/d11-workspace-link-check.mjs
          for name in delivery-network-planner depot-maintenance-supply distribution-network-expansion cold-chain-control inbound-yard-crossdock returnable-transport-packaging carrier-sla-invoices multimodal-container-control warehouse-peak-shifts logistics-order-execution; do
            node_modules/.bin/esbuild "src/routes/tools.$name.tsx" --format=esm --outfile="/tmp/d11-$name-parser.mjs"
          done
          grep -Fq "Выбрать JSON-файл" runtime/d11-module/D11WorkspaceCard.tsx
          grep -Fq "d11-customer-order-mobile.png" scripts/d11-live-browser-acceptance.mjs
          grep -Fq "D11_OWN_" scripts/d11-live-browser-acceptance.mjs
          grep -Fq 'desktop.page.$$eval("main select:not(:disabled)"' scripts/d11-live-browser-acceptance.mjs
          grep -Fq "Do not remove the temporary" scripts/d11-live-browser-acceptance.mjs
          grep -Fq "isExampleCase" src/routes/tools.warehouse-peak-shifts.tsx
          grep -Fq "_editorImportFromResult" src/routes/tools.warehouse-peak-shifts.tsx
          grep -Fq "d11-own-" scripts/d11-live-browser-acceptance.mjs
          grep -Fq "/workspace/#/overview" src/routes/index.tsx
          echo D11_DASHBOARD_SOURCE_CHECK=PASS
      # No artifact export: source and private build stay on the ephemeral runner.
