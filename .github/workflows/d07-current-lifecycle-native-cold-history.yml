                  $vp=$null
                  if(!$edit.TryGetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern,[ref]$vp)){
                    throw 'D07_NATIVE_REGULAR_INPUT_READBACK_UNAVAILABLE'
                  }
                  $current=([System.Windows.Automation.ValuePattern]$vp).Current.Value
                  $match=$current -ceq $value
                  Write-Output ('D07_NATIVE_REGULAR_'+$safeCode+'_VALUE_LENGTH='+$current.Length)
                  Write-Output ('D07_NATIVE_REGULAR_'+$safeCode+'_FOCUS_AFTER='+$edit.Current.HasKeyboardFocus)
                  Write-Output ('D07_NATIVE_REGULAR_'+$safeCode+'_TYPED='+$match)
                  if(!$match){
                    # Real OS clipboard paste is another accessible native path.
                    # It triggers browser paste/input, not JS DOM property writes.
                    try{
                      [System.Windows.Forms.Clipboard]::SetText($value)
                      $edit=WaitNative $label ([System.Windows.Automation.ControlType]::Edit)
                      $edit.SetFocus()
                      Start-Sleep -Milliseconds 160
                      [System.Windows.Forms.SendKeys]::SendWait('^a')
                      [System.Windows.Forms.SendKeys]::SendWait('^v')
                      Start-Sleep -Milliseconds 450
                      $fresh=WaitNative $label ([System.Windows.Automation.ControlType]::Edit)
                      $pattern=$null
                      if($fresh.TryGetCurrentPattern(
                        [System.Windows.Automation.ValuePattern]::Pattern,[ref]$pattern)){
                        $match=([System.Windows.Automation.ValuePattern]$pattern).Current.Value -ceq $value
                      }
                    }catch{
                      Write-Output ('D07_NATIVE_REGULAR_'+$safeCode+'_PASTE_EXCEPTION=YES')
                    }finally{
                      try{[System.Windows.Forms.Clipboard]::Clear()}catch{}
                    }
                    Write-Output ('D07_NATIVE_REGULAR_'+$safeCode+'_PASTED='+$match)
                  }
                  if(!$match){throw 'D07_NATIVE_REGULAR_KEYBOARD_VALUE_MISMATCH'}
                }
                EnterNativeText 'Наименование' 'Weekly premises service'
                EnterNativeText 'Что выполняется при посещении' 'Clean premises and inspect equipment every visit'
                EnterNativeText 'Как проверяется результат' 'Customer observes the cleaned zones and records any defects'
                # ValuePattern diagnostic checks React state via the native
                # accessibility tree, without logging test-entered or user data.
                foreach($inputLabel in @('Наименование','Что выполняется при посещении','Как проверяется результат')){
                  $field=FindNative $inputLabel ([System.Windows.Automation.ControlType]::Edit)
                  $ok=$false
                  if($field){
                    $vp=$null
                    if($field.TryGetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern,[ref]$vp)){
                      $ok=([System.Windows.Automation.ValuePattern]$vp).Current.Value.Length -gt 0
                    }
                  }
                  $safeCode=switch($inputLabel){
                    'Наименование' {'TITLE'} 
                    'Что выполняется при посещении' {'SCOPE'}
                    default {'CRITERIA'}
                  }
                  Write-Output ('D07_NATIVE_REGULAR_INPUT_'+$safeCode+'_NONEMPTY='+$ok)
                }
                $createNative=FindNative 'Добавить план регулярной услуги' ([System.Windows.Automation.ControlType]::Button)
                if(!$createNative){throw 'D07_NATIVE_REGULAR_CREATE_BUTTON_NOT_FOUND'}
                Write-Output ('D07_NATIVE_REGULAR_CREATE_BUTTON_ENABLED='+$createNative.Current.IsEnabled)
                if(-not $createNative.Current.IsEnabled){throw 'D07_NATIVE_REGULAR_CREATE_BUTTON_DISABLED'}
                ClickAction 'Добавить план регулярной услуги'
                $planVisible=$false
                for($attempt=0;$attempt -lt 55;$attempt++){
                  Start-Sleep -Milliseconds 350
                  if((AccessibleText) -match 'Weekly premises service'){
                    $planVisible=$true;break
                  }
                }
                if(!$planVisible){throw 'D07_NATIVE_REGULAR_PLAN_NOT_CREATED'}
                Write-Output 'D07_NATIVE_REGULAR_PLAN_CREATED_THROUGH_GUI=PASS'
                # The original Kernel requires two user-controlled decisions:
                # review of differences from the saved order and save consent.
                $review=WaitNative 'Я сравнил редакцию Kernel и черновик и разрешаю создать следующую редакцию с изменениями черновика.' ([System.Windows.Automation.ControlType]::CheckBox)
                $reviewToggle=[System.Windows.Automation.TogglePattern]$review.GetCurrentPattern(
                  [System.Windows.Automation.TogglePattern]::Pattern)
                if($reviewToggle.Current.ToggleState -eq [System.Windows.Automation.ToggleState]::Off){
                  $reviewToggle.Toggle()
                }
                $consent=WaitNative 'Я проверил заказ и разрешаю сохранить его в выбранную рабочую область T2. Это не принятие работ исполнителя.' ([System.Windows.Automation.ControlType]::CheckBox)
                $consentToggle=[System.Windows.Automation.TogglePattern]$consent.GetCurrentPattern(
                  [System.Windows.Automation.TogglePattern]::Pattern)
                if($consentToggle.Current.ToggleState -eq [System.Windows.Automation.ToggleState]::Off){
                  $consentToggle.Toggle()
                }
                ClickAction 'Сохранить заказ'
                $revisionTwo=$false
                for($attempt=0;$attempt -lt 75;$attempt++){
                  Start-Sleep -Milliseconds 350
                  $checked=AccessibleText
                  if($checked -match 'Заказ сохранён и повторно прочитан.*?Редакция\s+2.*?Событие' -and
                     $checked -match [regex]::Escape($beforeObject) -and
                     $checked -match 'Weekly premises service'){
                    $revisionTwo=$true;break
                  }
                }
                if(!$revisionTwo){throw 'D07_NATIVE_REGULAR_KERNEL_REVISION_TWO_NOT_CONFIRMED'}
                Write-Output 'D07_NATIVE_REGULAR_REAL_KERNEL_RECEIPT_READBACK=PASS'

                Write-Output 'D07_PHYSICAL_IWXA_INDEPENDENT_IMPORT=NOT_RUN'

              }
              # Browser profile is isolated to one case. Close its native Edge
              # process tree before opening the next to limit memory use.
              if($edgeProc){
                try{$edgeProc.Kill($true)}catch{}
              }
            }
            Write-Output 'D07_EDGE_UIA_CASES=1/1'
            Write-Output 'D07_REAL_KERNEL_RECEIPT_IWXA=NOT_RUN'
          }finally{
            foreach($edgeId in $started){Stop-Process -Id $edgeId -Force -ErrorAction SilentlyContinue}
            if($server){Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue}
          }
          # No private source, dist, screenshots, browser profiles or raw logs uploaded.
