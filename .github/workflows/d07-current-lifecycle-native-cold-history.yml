name: D07 Service Lifecycle OS real Edge and new services
on:
  push:
    branches: [work/2026-11-18-d07-case10-qualification]
    paths: [.github/workflows/d07-current-lifecycle-native-cold-history.yml]
permissions:
  contents: read
jobs:
  t2-edge-uia:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      SITE_SHA: 97a05c4d97e1ea5655b158dd190c741dbc7508e6
      T2_SHA: e70de29b72b83e2546f7ab74b17572685a728c17
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      CI: 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Confirm private source access
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:GH_TOKEN)){throw 'D07_GUI_TOKEN_MISSING'}
          foreach($repo in @('Faust-S/uslugovod.ru','Faust-S/T2')){
            $null=& gh api "repos/$repo" --jq '.id' 2>$null
            if($LASTEXITCODE -ne 0){throw 'D07_GUI_REPO_ACCESS_DENIED'}
          }
          git config --global core.autocrlf false
          git config --global core.eol lf
          Write-Output 'D07_GUI_SOURCE_ACCESS=PASS'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: ${{ env.SITE_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: ${{ env.T2_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: t2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Build real pinned T2 and site only inside temporary runner
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
        working-directory: site
        run: |
          if((git rev-parse HEAD).Trim() -ne $env:SITE_SHA){throw 'D07_GUI_SITE_SHA_MISMATCH'}
          if((git -C ../t2 rev-parse HEAD).Trim() -ne $env:T2_SHA){throw 'D07_GUI_T2_SHA_MISMATCH'}
          $installLog=Join-Path $env:RUNNER_TEMP 'd07-gui-install.private.log'
          & bun install --frozen-lockfile *> $installLog
          if($LASTEXITCODE -ne 0){throw 'D07_GUI_INSTALL_FAILED'}
          Write-Output 'D07_GUI_INSTALL=PASS'
          $buildLog=Join-Path $env:RUNNER_TEMP 'd07-gui-build.private.log'
          & bun run build:t2-integrated *> $buildLog
          if($LASTEXITCODE -ne 0){throw 'D07_GUI_INTEGRATED_BUILD_FAILED'}
          if(-not (Test-Path dist/workspace/index.html)){throw 'D07_GUI_T2_HOST_MISSING'}
          Write-Output 'D07_GUI_ONE_DIST_T2=PASS'
      - name: Test original T2 HTTPS with real Edge via Windows UIA
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
          IWXA_D07_PREVIEW_PORT: '55407'
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $site=Join-Path $env:GITHUB_WORKSPACE 'site'
          $candidates=@(
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Microsoft\Edge\Application\msedge.exe')
          )
          $edge=($candidates|Where-Object{Test-Path $_}|Select-Object -First 1)
          if(-not $edge){throw 'D07_GUI_EDGE_MISSING'}
          $origin='https://127.0.0.1:55407'
          $server=$null
          $started=[System.Collections.Generic.List[int]]::new()
          try{
            $server=Start-Process -FilePath 'node' -WorkingDirectory $site -ArgumentList @('scripts/preview-d07-integrated-site.mjs') -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'd07-gui-host.private.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'd07-gui-host-error.private.log') -PassThru
            $ready=$false
            for($i=0;$i -lt 45;$i++){
              Start-Sleep -Milliseconds 600
              try{
                $response=Invoke-WebRequest -Uri ($origin+'/workspace/') -SkipCertificateCheck -TimeoutSec 2
                if($response.StatusCode -eq 200){$ready=$true;break}
              }catch{}
            }
            if(-not $ready){throw 'D07_GUI_T2_HTTPS_UNAVAILABLE'}
            Write-Output 'D07_GUI_REAL_T2_HTTPS=PASS'
            $cases=@(
              [pscustomobject]@{
                number='001'
                slug='uborka-posle-remonta'
                heading='Уборка новой квартиры: реальный заказ, повреждения и спор с исполнителем'
              }
            )
            foreach($item in $cases){
              $num=$item.number;$slug=$item.slug;$headingText=$item.heading
              if($slug -ne 'uborka-posle-remonta'){throw 'D07_GUI_SINGLE_CASE_ARGUMENT_INVALID'}
              $url=$origin+'/keisy/'+$slug+'/'
              $response=Invoke-WebRequest -Uri $url -SkipCertificateCheck -TimeoutSec 10
              if($response.StatusCode -ne 200){throw 'D07_GUI_CASE_HTTP_FAILED'}
              $profile=Join-Path $env:RUNNER_TEMP ('d07-gui-profile-'+$num)
              $edgeProc=Start-Process -FilePath $edge -ArgumentList @(
                '--force-renderer-accessibility','--ignore-certificate-errors',
                '--no-first-run','--no-default-browser-check',"--user-data-dir=$profile","--app=$url") -PassThru
              if($edgeProc){$started.Add($edgeProc.Id)}
              $titleSeen=$false
              $caseButton=$null
              $buttonText=if($num -eq '001'){'Создать черновик заказа'}else{''}
              for($attempt=0;$attempt -lt 60;$attempt++){
                Start-Sleep -Milliseconds 600
                $windows=@(Get-Process msedge -ErrorAction SilentlyContinue|Where-Object{$_.MainWindowHandle -ne 0})
                foreach($proc in $windows){
                  $e=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$proc.MainWindowHandle)
                  if(!$e){continue}
                  $scope=[System.Windows.Automation.TreeScope]::Descendants
                  $titleCondition=[System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::NameProperty,$headingText)
                  if($e.FindFirst($scope,$titleCondition)){$titleSeen=$true}
                  if($buttonText){
                    $btnCondition=[System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::NameProperty,$buttonText)
                    $candidate=$e.FindFirst($scope,$btnCondition)
                    if($candidate -and $candidate.Current.IsEnabled){$caseButton=$candidate}
                  }
                }
                if($titleSeen -and (!$buttonText -or $caseButton)){break}
              }
              if(-not $titleSeen){throw 'D07_GUI_H1_NOT_VISIBLE'}
              Write-Output ('D07_EDGE_UIA_CASE_'+$num+'=PASS')
              if($num -eq '001'){
                if(-not $caseButton){throw 'D07_GUI_CREATE_DRAFT_BUTTON_NOT_READY'}
                $invoke=[System.Windows.Automation.InvokePattern]$caseButton.GetCurrentPattern(
                  [System.Windows.Automation.InvokePattern]::Pattern)
                $invoke.Invoke()
                $draftCreated=$false
                for($step=0;$step -lt 25;$step++){
                  Start-Sleep -Milliseconds 500
                  $allWindows=@(Get-Process msedge -ErrorAction SilentlyContinue|Where-Object{$_.MainWindowHandle -ne 0})
                  foreach($checkProcess in $allWindows){
                    $view=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$checkProcess.MainWindowHandle)
                    if(!$view){continue}
                    $createdCondition=[System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::NameProperty,'Заказ создан')
                    $transferCondition=[System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::NameProperty,'Передать в T2')
                    if($view.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$createdCondition) -and
                       $view.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$transferCondition)){
                      $draftCreated=$true;break
                    }
                  }
                  if($draftCreated){break}
                }
                if(-not $draftCreated){throw 'D07_GUI_REACT_DRAFT_CREATION_NOT_CONFIRMED'}
                Write-Output 'D07_NATIVE_CASE_001_CREATE_DRAFT=PASS'
                $transferLink=$null
                for($step=0;$step -lt 25;$step++){
                  Start-Sleep -Milliseconds 400
                  $allWindows=@(Get-Process msedge -ErrorAction SilentlyContinue|Where-Object{$_.MainWindowHandle -ne 0})
                  foreach($checkProcess in $allWindows){
                    $view=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$checkProcess.MainWindowHandle)
                    if(!$view){continue}
                    $condition=[System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::NameProperty,'Передать в T2')
                    $candidate=$view.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$condition)
                    if($candidate -and $candidate.Current.IsEnabled){$transferLink=$candidate;break}
                  }
                  if($transferLink){break}
                }
                if(-not $transferLink){throw 'D07_T2_TRANSFER_LINK_NOT_ACCESSIBLE'}
                $transferInvoke=[System.Windows.Automation.InvokePattern]$transferLink.GetCurrentPattern(
                  [System.Windows.Automation.InvokePattern]::Pattern)
                $transferInvoke.Invoke()
                $hostVisible=$false
                for($step=0;$step -lt 80;$step++){
                  Start-Sleep -Milliseconds 500
                  $allWindows=@(Get-Process msedge -ErrorAction SilentlyContinue|Where-Object{$_.MainWindowHandle -ne 0})
                  foreach($checkProcess in $allWindows){
                    $view=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$checkProcess.MainWindowHandle)
                    if(!$view){continue}
                    $scope=[System.Windows.Automation.TreeScope]::Descendants
                    $domainTitle=[System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::NameProperty,'Рабочая область для сохранения')
                    $createButton=[System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::NameProperty,'Создать рабочую область')
                    if($view.FindFirst($scope,$domainTitle) -and $view.FindFirst($scope,$createButton)){
                      $hostVisible=$true;break
                    }
                  }
                  if($hostVisible){break}
                }
                if(-not $hostVisible){throw 'D07_LOCAL_ORDER_T2_HOST_ENTRY_NOT_CONFIRMED'}
                Write-Output 'D07_NATIVE_CASE_001_T2_HOST_ENTRY=PASS'
                function FindAction([string]$label) {
                  $nameCond=[System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::NameProperty,$label)
                  $buttonCond=[System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                    [System.Windows.Automation.ControlType]::Button)
                  $both=[System.Windows.Automation.AndCondition]::new($nameCond,$buttonCond)
                  foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                    if(!$window){continue}
                    $found=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$both)
                    if($found -and $found.Current.IsEnabled){return $found}
                  }
                  return $null
                }
                function ClickAction([string]$label) {
                  $action=$null
                  for($attempt=0;$attempt -lt 55;$attempt++){
                    $action=FindAction $label
                    if($action){break}
                    Start-Sleep -Milliseconds 400
                  }
                  if(!$action){throw 'D07_T2_NATIVE_ACTION_NOT_FOUND'}
                  $pattern=[System.Windows.Automation.InvokePattern]$action.GetCurrentPattern(
                    [System.Windows.Automation.InvokePattern]::Pattern)
                  $pattern.Invoke()
                  Start-Sleep -Milliseconds 300
                }
                # Choose the *dialog* confirmation. The base empty-state has
                # another identically named button earlier in the UIA tree.
                function ClickLastEnabledButton([string]$label) {
                  $nameCond=[System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::NameProperty,$label)
                  $typeCond=[System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                    [System.Windows.Automation.ControlType]::Button)
                  $both=[System.Windows.Automation.AndCondition]::new($nameCond,$typeCond)
                  for($attempt=0;$attempt -lt 50;$attempt++){
                    foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue |
                      Where-Object {$_.MainWindowHandle -ne 0})){
                      $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                      if(!$window){continue}
                      $buttons=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,$both)
                      for($index=$buttons.Count-1;$index -ge 0;$index--){
                        $button=$buttons.Item($index)
                        if(!$button.Current.IsEnabled -or $button.Current.IsOffscreen){continue}
                        $pattern=[System.Windows.Automation.InvokePattern]$button.GetCurrentPattern(
                          [System.Windows.Automation.InvokePattern]::Pattern)
                        $pattern.Invoke()
                        return
                      }
                    }
                    Start-Sleep -Milliseconds 400
                  }
                  throw 'D07_T2_NATIVE_DIALOG_CONFIRM_NOT_FOUND'
                }
                # All steps below are real UIAutomation actions in original T2.
                ClickAction 'Создать рабочую область'
                ClickAction 'Новая рабочая область'
                ClickLastEnabledButton 'Создать рабочую область'
                $created=$false
                for($attempt=0;$attempt -lt 70;$attempt++){
                  Start-Sleep -Milliseconds 500
                  foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                    if(!$window){continue}
                    $texts=$window.FindAll(
                      [System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.Condition]::TrueCondition)
                    foreach($item in $texts){
                      $name=$item.Current.Name
                      if($name.StartsWith('Рабочая область · ws-')){$created=$true;break}
                    }
                    if($created){break}
                  }
                  if($created){break}
                }
                if(!$created){throw 'D07_NATIVE_T2_CREATED_WORKSPACE_NOT_OBSERVED'}
                Write-Output 'D07_NATIVE_T2_CREATE_WORKSPACE=PASS'

                # Return through actual D07 Host navigation, not direct Kernel calls.
                function FindNative([string]$name, $controlType) {
                  $nameCond=[System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::NameProperty,$name)
                  $condition=if($controlType){
                    [System.Windows.Automation.AndCondition]::new(
                      $nameCond,[System.Windows.Automation.PropertyCondition]::new(
                        [System.Windows.Automation.AutomationElement]::ControlTypeProperty,$controlType))
                  }else{$nameCond}
                  foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                    if(!$window){continue}
                    $found=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$condition)
                    if($found){return $found}
                  }
                  return $null
                }
                function WaitNative([string]$name, $controlType) {
                  for($n=0;$n -lt 70;$n++){
                    $found=FindNative $name $controlType
                    if($found){return $found}
                    Start-Sleep -Milliseconds 500
                  }
                  throw 'D07_NATIVE_GUI_REQUIRED_ELEMENT_MISSING'
                }
                $return=WaitNative 'Мои услуги' ([System.Windows.Automation.ControlType]::Hyperlink)
                $returnPattern=[System.Windows.Automation.InvokePattern]$return.GetCurrentPattern(
                  [System.Windows.Automation.InvokePattern]::Pattern)
                $returnPattern.Invoke()
                $null=WaitNative 'Рабочая область для сохранения' $null
                Write-Output 'D07_NATIVE_T2_RETURN_TO_ORDERS=PASS'
                # T2 catalog navigation does not implicitly select the area for
                # D07. Select the new personal Workspace explicitly as a user.
                Add-Type -AssemblyName System.Windows.Forms
                $workspaceSelector=$null
                foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue |
                  Where-Object {$_.MainWindowHandle -ne 0})){
                  $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                  if(!$window){continue}
                  $comboItems=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                    [System.Windows.Automation.PropertyCondition]::new(
                      [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                      [System.Windows.Automation.ControlType]::ComboBox))
                  if($comboItems.Count -ge 2){
                    $workspaceSelector=$comboItems.Item(0);break
                  }
                }
                if(-not $workspaceSelector){throw 'D07_NATIVE_T2_WORKSPACE_SELECTOR_UNAVAILABLE'}
                $workspaceSelector.SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
                [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
                [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                $null=WaitNative 'Рабочая область выбрана' $null
                Write-Output 'D07_NATIVE_T2_PERSONAL_WORKSPACE_FOCUSED=PASS'
                # The browser draft was created on the same real Edge origin.
                # Select it through the accessible HTML combobox.
                $combo=FindNative 'Черновики заказов в браузере' ([System.Windows.Automation.ControlType]::ComboBox)
                if(-not $combo){
                  $combos=@()
                  foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                    $list=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.PropertyCondition]::new(
                        [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                        [System.Windows.Automation.ControlType]::ComboBox))
                    for($n=0;$n -lt $list.Count;$n++){$combos+=,$list.Item($n)}
                  }
                  if($combos.Count -lt 2){throw 'D07_NATIVE_T2_DRAFT_SELECTOR_UNAVAILABLE'}
                  $combo=$combos[$combos.Count-1]
                }
                $combo.SetFocus()
                Add-Type -AssemblyName System.Windows.Forms
                [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
                [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
                [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                $null=WaitNative 'Документы этого заказа: 9' $null
                Write-Output 'D07_NATIVE_T2_DRAFT_NINE_DOCUMENTS=PASS'
                $verify=FindAction 'Проверить заказ через Kernel'
                if($verify){
                  $verifyPattern=[System.Windows.Automation.InvokePattern]$verify.GetCurrentPattern(
                    [System.Windows.Automation.InvokePattern]::Pattern)
                  $verifyPattern.Invoke()
                  Write-Output 'D07_NATIVE_T2_MANUAL_KERNEL_PREFLIGHT_INVOKED=PASS'
                }
                $consent=WaitNative 'Я проверил заказ и разрешаю сохранить его в выбранную рабочую область T2. Это не принятие работ исполнителя.' ([System.Windows.Automation.ControlType]::CheckBox)
                $toggle=[System.Windows.Automation.TogglePattern]$consent.GetCurrentPattern(
                  [System.Windows.Automation.TogglePattern]::Pattern)
                if($toggle.Current.ToggleState -eq [System.Windows.Automation.ToggleState]::Off){$toggle.Toggle()}
                # Consent does not authorize saving by itself: the original Host
                # separately verifies the order via READ_ORDER and manages revision.
                ClickAction 'Сохранить заказ'
                $sawReceipt=$false
                $sawObject=$false
                for($attempt=0;$attempt -lt 70;$attempt++){
                  Start-Sleep -Milliseconds 500
                  foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                    if(!$window){continue}
                    $texts=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.PropertyCondition]::new(
                        [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                        [System.Windows.Automation.ControlType]::Text))
                    for($n=0;$n -lt $texts.Count;$n++){
                      $name=$texts.Item($n).Current.Name
                      if($name -match '^Заказ сохранён и повторно прочитан' -and
                          $name -match 'Редакция\s+1' -and
                          $name -match 'Событие:\s*(\S+)'){
                        $sawReceipt=$true
                      }
                      if($name -match '(?i)Object\s*ID\s*:\s*d07:order:[0-9a-f]{64}'){$sawObject=$true}
                    }
                  }
                  if($sawReceipt -and $sawObject){break}
                }
                # Native UIA exposes React text interpolations as adjacent text nodes.
                # Reassemble only short adjacent accessible fragments; do not log private IDs.
                if(-not $sawReceipt -or -not $sawObject){
                  foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                    if(!$window){continue}
                    $elements=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.PropertyCondition]::new(
                        [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                        [System.Windows.Automation.ControlType]::Text))
                    $names=[System.Collections.Generic.List[string]]::new()
                    for($n=0;$n -lt $elements.Count;$n++){
                      $value=$elements.Item($n).Current.Name
                      if(-not [string]::IsNullOrWhiteSpace($value)){$names.Add($value)}
                    }
                    for($n=0;$n -lt $names.Count;$n++){
                      if(-not $sawReceipt -and $names[$n] -match '^Заказ сохранён и повторно прочитан'){
                        $length=[Math]::Min(9,$names.Count-$n)
                        $part=[string]::Join(' ',$names.GetRange($n,$length))
                        if($part -match 'Заказ сохранён и повторно прочитан.*?Редакция\s+1\s*\..*?Событие\s*:\s*(\S+)'){
                          $eventToken=$Matches[1].TrimEnd('.')
                          if(-not [string]::IsNullOrWhiteSpace($eventToken)){$sawReceipt=$true}
                        }
                      }
                      if(-not $sawObject -and $names[$n] -match '(?i)Object\s*ID\s*:'){
                        $length=[Math]::Min(5,$names.Count-$n)
                        $part=[string]::Join(' ',$names.GetRange($n,$length))
                        if($part -match 'd07:order:[a-f0-9]{64}'){$sawObject=$true}
                      }
                    }
                  }
                  Write-Output ('D07_NATIVE_UI_JOINED_RECEIPT_MATCH='+$sawReceipt)
                  Write-Output ('D07_NATIVE_UI_JOINED_OBJECT_MATCH='+$sawObject)
                }
                if(-not $sawReceipt -or -not $sawObject){
                  # Whitelisted UI state only. Never print private order content.
                  $signals=[System.Collections.Generic.HashSet[string]]::new()
                  foreach($process in @(Get-Process msedge -ErrorAction SilentlyContinue |
                    Where-Object {$_.MainWindowHandle -ne 0})){
                    $window=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle)
                    if(!$window){continue}
                    $texts=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                      [System.Windows.Automation.PropertyCondition]::new(
                        [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                        [System.Windows.Automation.ControlType]::Text))
                    for($n=0;$n -lt $texts.Count;$n++){
                      $name=$texts.Item($n).Current.Name
                      if($name -match 'Запись T2 не подтверждена:\s*(D07_[A-Z0-9_]+)'){
                        $null=$signals.Add('UNCONFIRMED_'+$Matches[1])
                      }elseif($name -match 'В этой рабочей области уже сохранён другой заказ'){
                        $null=$signals.Add('CASE_WORKSPACE_CONFLICT')
                      }elseif($name -match '^Сохранённые данные не менялись'){
                        $null=$signals.Add('UNCHANGED')
                      }elseif($name -match '^Предыдущая запись найдена в Kernel'){
                        $null=$signals.Add('RECOVERED')
                      }elseif($name -match '^Редакция записана, квитанция получена'){
                        $null=$signals.Add('WRITTEN_READBACK')
                      }elseif($name -match '^Заказ сохранён и повторно прочитан'){
                        $null=$signals.Add('RECEIPT_TEXT_UNMATCHED')
                      }elseif($name -match '^Kernel подтвердил конфликт редакций'){
                        $null=$signals.Add('REVISION_CONFLICT')
