name: d06-t3-release-gate
# A candidate is qualified only on an explicit request commit.
# Intermediate source and workflow edits do not start runners.
on:
  push:
    branches:
      - test/2026-11-24-d06-t3-preparation
    paths:
      - .github/d06/t3-release-request.json
concurrency:
  group: d06-t3-qualification-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/d06/t3-release-request.json
            .github/d06/e2e-report-summary.mjs
            .github/d06/e2e-report-summary.test.mjs
          sparse-checkout-cone-mode: false
          path: pipeline
      - name: Validate explicit release request
        id: request
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $request = Get-Content -LiteralPath pipeline/.github/d06/t3-release-request.json -Raw | ConvertFrom-Json
          if ($request.schema -ne "IWXA_D06_T3_QUALIFICATION/1") { throw "D06_RELEASE_REQUEST_SCHEMA" }
          foreach ($field in @("owner","site")) {
            $value = $request.$field
            if ($value -isnot [string] -or $value -cnotmatch '^[a-f0-9]{40}$') { throw "D06_RELEASE_REQUEST_SHA" }
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ($field + "=" + $value)
          }
          if (($request.attempt -isnot [int] -and $request.attempt -isnot [long]) -or $request.attempt -lt 1) { throw "D06_RELEASE_REQUEST_ATTEMPT" }
          Write-Host "D06_RELEASE_REQUEST=PASS"
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod
          ref: ${{ steps.request.outputs.owner }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/domain
      # The current domain revision and the published skill release are
      # deliberately separate inputs. Changing an unrelated domain rule
      # must not manufacture a new skill release or change its provenance.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod
          ref: 40e0965491819722dcf57c973e7d0c19b4cbcba0
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/skill-owner
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod.ru
          ref: ${{ steps.request.outputs.site }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 9f41447197251d41e69fbcb98e52ef1050754ec2
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/assistant
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod.ru
          ref: ffa31457ea7b29b9a0f65eafd7e44a2141da6e66
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/previous
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify immutable candidate revisions
        shell: pwsh
        env:
          EXPECTED_OWNER: ${{ steps.request.outputs.owner }}
          EXPECTED_SITE: ${{ steps.request.outputs.site }}
        run: |
          $ErrorActionPreference = "Stop"
          $owner = (git -C private/domain rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $owner -cne $env:EXPECTED_OWNER) { throw "D06_RELEASE_OWNER_SHA" }
          $site = (git -C private/site rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $site -cne $env:EXPECTED_SITE) { throw "D06_RELEASE_SITE_SHA" }
          Write-Host "D06_RELEASE_EXACT_PINS=PASS"
      - name: Prove exact canonical projection
        shell: pwsh
        env:
          EXPECTED_OWNER: ${{ steps.request.outputs.owner }}
        run: |
          $ErrorActionPreference = "Stop"
          switch ($env:EXPECTED_OWNER) {
            "607525f672c8631a59c27c7e0e621a7a6e0f4d1a" { $evidenceCases = 52; $selectionCases = 44 }
            "8471dca0037328dfee8689632df9c27866e89845" { $evidenceCases = 70; $selectionCases = 63 }
            default { throw "D06_RELEASE_UNQUALIFIED_CASE_INVENTORY" }
          }
          foreach ($path in @("src/evaluate-offers/comparison-evidence.mjs","src/evaluate-offers/comparison-evidence.d.mts","scripts/test-pd12-comparison-evidence.mjs","src/rules/replacement-comparison.ts","src/evaluate-offers/purchase-decision-readiness.ts","src/evaluate-offers/ordinary-selection-write.ts","scripts/test-pd12-ordinary-selection.mjs","src/evaluate-offers/current-purchase-decision.ts","scripts/test-current-purchase-decision.mjs","src/schemas/komplektovod/offer-comparison.schema.json","src/schemas/komplektovod/offer-assessment.schema.json")) {
            $a = (git -C private/domain rev-parse ("HEAD:" + $path)).Trim()
            $b = (git -C private/site rev-parse ("HEAD:" + $path)).Trim()
            if ($a -ne $b) { throw "D06_PD12_OWNER_PROJECTION_MISMATCH" }
          }
          Write-Host "D06_PD12_OWNER_PROJECTION=PASS"
          $log = Join-Path $env:RUNNER_TEMP "d06-pd12-canonical.private.log"
          & node private/domain/scripts/test-pd12-comparison-evidence.mjs *> $log
          if ($LASTEXITCODE -ne 0 -or (Get-Content $log -Raw) -notmatch ('(?m)^D06_PD12_COMPARISON_EVIDENCE_CASES=' + $evidenceCases + '\r?$')) { throw "D06_PD12_CANONICAL_CASES_FAILED" }
          Write-Host ("D06_PD12_CANONICAL_CASES=" + $evidenceCases)
          & node --experimental-strip-types private/domain/scripts/test-pd12-ordinary-selection.mjs *> $log
          if ($LASTEXITCODE -ne 0 -or (Get-Content $log -Raw) -notmatch ('(?m)^D06_PD12_SELECTION_CASES=' + $selectionCases + '\r?$')) { throw "D06_PD12_CANONICAL_SELECTION_FAILED" }
          Write-Host ("D06_PD12_CANONICAL_SELECTION_CASES=" + $selectionCases)
          & node --experimental-strip-types private/domain/scripts/test-current-purchase-decision.mjs *> $log
          if ($LASTEXITCODE -ne 0 -or (Get-Content $log -Raw) -notmatch '(?m)^D06_CURRENT_PURCHASE_DECISION_CASES=51\r?$') { throw "D06_CURRENT_PURCHASE_DECISION_FAILED" }
          Write-Host "D06_CURRENT_PURCHASE_DECISION_CASES=51"
      - name: Check exact original assistant files and owner pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pin = Get-Content private/site/runtime/t3-platform/0.3.1-rc.1/domain-assistant.json -Raw | ConvertFrom-Json
          if ((git -C private/assistant rev-parse HEAD).Trim() -ne $pin.sourceCommit) { throw "D06_T3_ORIGINAL_COMMIT" }
          foreach ($entry in $pin.files) {
            $blob = (git -C private/assistant rev-parse ("HEAD:" + $pin.sourceRoot + "/" + $entry.path)).Trim()
            if ($blob -ne $entry.blob) { throw "D06_T3_ORIGINAL_BLOB" }
          }
          $skillPin = Get-Content private/site/runtime/t3-platform/0.3.1-rc.1/domain-skills.json -Raw | ConvertFrom-Json
          if ($skillPin.version -ne "1.4.1" -or (git -C private/skill-owner rev-parse HEAD).Trim() -ne $skillPin.sourceCommit) { throw "D06_T3_SKILL_RELEASE_COMMIT" }
          $owner = (git -C private/domain rev-parse HEAD:models/assistant-skills.json).Trim()
          $released = (git -C private/skill-owner rev-parse HEAD:models/assistant-skills.json).Trim()
          $site = (git -C private/site rev-parse HEAD:public/assets/d06-assistant-skills.json).Trim()
          if ($owner -ne $site -or $released -ne $site -or $site -ne $skillPin.sourceBlob) { throw "D06_T3_SKILL_BYTES_MISMATCH" }
          foreach ($root in @("private/domain","private/skill-owner","private/site","private/previous")) {
            if ((git -C $root rev-parse HEAD:src/registry/services.json).Trim() -ne $skillPin.registryBlob) { throw "D06_T3_SKILL_REGISTRY_MISMATCH" }
          }
          Write-Host "D06_T3_SKILL_RELEASE_PIN=PASS"
          Write-Host "D06_T3_ORIGINAL_INPUTS=PASS"
      - name: Validate canonical procedures, original runtime and extraction
        working-directory: private/domain
        shell: pwsh
        run: |
          $env:IWXA_ORIGINAL_ASSISTANT_ROOT = Join-Path $env:GITHUB_WORKSPACE "private/assistant/browser-local-inference/domain-assistant"
          $log = Join-Path $env:RUNNER_TEMP "d06-t3-owner-private.txt"
          & node scripts/d06-skill-authoring.mjs check *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_T3_AUTHORING=FAIL"; exit 1 }
          & node scripts/test-assistant-skills.mjs *> $log
          if ($LASTEXITCODE -ne 0) {
            $data = Get-Content $log -Raw
            $codes = [regex]::Matches($data,'(?:D06_SKILL|T3_ASSISTANT_SKILLS)_[A-Z_]+') | ForEach-Object {$_.Value} | Select-Object -Unique -First 8
            $line = [regex]::Match($data,'test-assistant-skills\.mjs:(\d+):\d+').Groups[1].Value
            Write-Host ("D06_T3_SKILL_FAILURE_CODES=" + ($codes -join ","))
            Write-Host ("D06_T3_SKILL_FAILURE_LINE=" + $line)
            Write-Host "D06_T3_SKILLS_SOURCE=FAIL"
            exit 1
          }
          if ((Get-Content $log -Raw) -notmatch '(?m)^D06_T3_FACT_ABSTENTION_CASES=50\r?$') { Write-Host "D06_T3_FACT_ABSTENTION=FAIL"; exit 1 }
          Write-Host "D06_T3_FACT_ABSTENTION_CASES=50"
          if ((Get-Content $log -Raw) -notmatch '(?m)^D06_T3_RESULT_CONTEXT_CASES=119\r?$') { Write-Host "D06_T3_RESULT_CONTEXT=FAIL"; exit 1 }
          Write-Host "D06_T3_RESULT_CONTEXT_CASES=119"
          Write-Host "D06_T3_SKILLS_SOURCE=PASS"
      - name: Install site dependencies once
        working-directory: private/site
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "d06-release-install.private.log"
          & npm ci *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_RELEASE_NPM_CI=FAIL"; exit 1 }
          Write-Host "D06_RELEASE_NPM_CI=PASS"
      - name: Check original React source bindings and idempotent import
        working-directory: private/site
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "d06-t3-site-private.txt"
          & node scripts/d06-assistant-skills.mjs check *> $log
          if ($LASTEXITCODE -ne 0) {
            $codes = [regex]::Matches((Get-Content $log -Raw),'D06_SKILL_PROJECTION_[A-Z_]+') | ForEach-Object {$_.Value} | Select-Object -Unique -First 8
            Write-Host ("D06_T3_PROJECTION_CODES=" + ($codes -join ","))
            Write-Host "D06_T3_SKILLS_PROJECTION=FAIL"
            exit 1
          }
          Write-Host "D06_T3_SKILLS_PROJECTION=PASS"
          & node --test tests/t3/static-route-timestamps.test.mjs *> $log
          if ($LASTEXITCODE -ne 0) {
            $codes = [regex]::Matches((Get-Content $log -Raw),'D06_T3_STATIC_ROUTE_TIME_[A-Z_]+') | ForEach-Object {$_.Value} | Select-Object -Unique -First 8
            Write-Host ("D06_T3_SERIALIZER_CODES=" + ($codes -join ","))
            Write-Host "D06_T3_PINNED_SERIALIZER_TEST=FAIL"
            exit 1
          }
          Write-Host "D06_T3_PINNED_SERIALIZER_TEST=PASS"
          $domain = Join-Path $env:GITHUB_WORKSPACE "private/skill-owner"
          $before = (git status --porcelain --untracked-files=normal)
          & node scripts/d06-assistant-skills.mjs import $domain 40e0965491819722dcf57c973e7d0c19b4cbcba0 *> $log
          if ($LASTEXITCODE -ne 0 -or (Get-Content $log -Raw) -notmatch '"changed":false') { Write-Host "D06_T3_IMPORT_DRY_RUN=FAIL"; exit 1 }
          & node scripts/d06-assistant-skills.mjs import $domain 40e0965491819722dcf57c973e7d0c19b4cbcba0 --apply *> $log
          if ($LASTEXITCODE -ne 0 -or (Get-Content $log -Raw) -notmatch '"applied":false') { Write-Host "D06_T3_IMPORT_IDEMPOTENT=FAIL"; exit 1 }
          if ((git status --porcelain --untracked-files=normal) -or $before) { Write-Host "D06_T3_IMPORT_DIRTY=FAIL"; exit 1 }
          Write-Host "D06_T3_IMPORT_DRY_RUN=PASS"
          Write-Host "D06_T3_IMPORT_IDEMPOTENT=PASS"
      - name: Prove 1.3 to 1.4.1 upgrade only with exact new result bindings
        working-directory: private/site
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP "d06-skill-upgrade-private.mjs"
          @'
          import assert from "node:assert/strict";
          import { readFileSync, copyFileSync } from "node:fs";
          import { resolve, join } from "node:path";
          import { pathToFileURL } from "node:url";
          const { importSkills, verifyProjection } = await import(pathToFileURL(resolve("scripts/d06-assistant-skills.mjs")).href);
          const owner = resolve("../skill-owner");
          const previous = resolve("../previous");
          const commit = "40e0965491819722dcf57c973e7d0c19b4cbcba0";
          const files = ["public/assets/d06-assistant-skills.json", "runtime/t3-platform/0.3.1-rc.1/domain-skills.json"];
          const original = files.map(p=>readFileSync(join(previous,p)));
          assert.equal(JSON.parse(original[0]).version,"1.3.0");
          assert.throws(()=>importSkills(owner,commit,{dir:previous,apply:true}),/D06_SKILL_PROJECTION_RESULT_(?:HINT|BINDING|READINESS)/);
          for(let i=0;i<files.length;i++)assert.ok(original[i].equals(readFileSync(join(previous,files[i]))));
          // A skill update requiring new result scopes must be installed with
          // the corresponding exact owner-approved site source bindings.
          for(const service of ["capacity-quantity","compatibility-check","completeness-check","startup-cost","offer-comparison","acceptance-plan"]){
            const path="src/routes/services."+service+".index.tsx";
            copyFileSync(path,join(previous,path));
          }
          const dry = importSkills(owner, commit, {dir:previous});
          assert.equal(dry.version,"1.4.1");
          assert.equal(dry.changed,true);
          assert.equal(dry.applied,false);
          for(let i=0;i<files.length;i++)assert.ok(original[i].equals(readFileSync(join(previous,files[i]))));
          const applied = importSkills(owner, commit, {dir:previous,apply:true});
          assert.equal(applied.applied,true);
          assert.equal(verifyProjection(previous).version,"1.4.1");
          for(const path of files)assert.ok(readFileSync(join(previous,path)).equals(readFileSync(path)));
          assert.equal(importSkills(owner,commit,{dir:previous,apply:true}).applied,false);
          '@ | Set-Content -LiteralPath $script -Encoding utf8
          $log = Join-Path $env:RUNNER_TEMP "d06-skill-upgrade-private.log"
          & node $script *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_T3_SKILL_UPGRADE=FAIL"; exit 1 }
          Write-Host "D06_T3_SKILL_UPGRADE_REJECTS_MISSING_BINDINGS=PASS"
          Write-Host "D06_T3_SKILL_UPGRADE=PASS"
          Write-Host "D06_T3_SKILL_UPGRADE_COMMITTED_BYTES=PASS"
      - name: Verify bounded structured diagnostics
        shell: pwsh
        run: |
          node --test pipeline/.github/d06/e2e-report-summary.test.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Exact mandatory site gate
        id: static-gate
        shell: pwsh
        working-directory: private/site
        env:
          D06_CANONICAL_TASK_INTENTS_PATH: ${{ github.workspace }}/private/domain/src/registry/task-intents.json
        run: |
          $log = Join-Path $env:RUNNER_TEMP "d06-replacement-static-private.txt"
          $env:PLAYWRIGHT_JSON_OUTPUT_FILE = Join-Path $env:RUNNER_TEMP "d06-gate-e2e.private.json"
          foreach ($task in @("run setup:browser", "run build:static:check")) {
            & cmd.exe /d /c ("npm " + $task + " > """ + $log + """ 2>&1")
            $passed = $LASTEXITCODE -eq 0
            Write-Host ("D06_FULL_" + $task.Replace(" ","_").Replace(":","_").ToUpperInvariant() + "=" + $(if ($passed) {"PASS"} else {"FAIL"}))
            if ($task -eq "run build:static:check") {
              if (Test-Path -LiteralPath $env:PLAYWRIGHT_JSON_OUTPUT_FILE) {
                $summary = Join-Path $env:GITHUB_WORKSPACE "pipeline/.github/d06/e2e-report-summary.mjs"
                & node $summary $env:PLAYWRIGHT_JSON_OUTPUT_FILE
              } else {
                Write-Host "D06_E2E_STRUCTURED=UNAVAILABLE"
              }
            }
            if (-not $passed) {
              $body = Get-Content -LiteralPath $log -Raw
              if ($task -eq "run build:static:check" -and $body -match 'prettier/prettier') {
                Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "format-needed=true"
              }
              $stages = [regex]::Matches($body, '(?m)^>\s+\S+@\S+\s+((?:check|test|build)(?::[a-z0-9.-]+)*)\s*$')
              $names = @($stages | ForEach-Object { $_.Groups[1].Value })
              $remaining = @(@("test:session","test:workflow-progress","test:native") | Where-Object { $_ -notin $names })
              if ($remaining.Count -gt 0) {
                Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("remaining-subject=" + ($remaining -join ","))
              }
              foreach ($m in [regex]::Matches($body,'(?m)^D06_(?:SESSION|WORKFLOW)_ASSERT_FAIL=\d+\r?$')) {
                Write-Host $m.Value.Trim()
              }
              Write-Host ("D06_FULL_LAST_STAGES=" + (($names | Select-Object -Last 5) -join ","))
              foreach ($kind in @("TimeoutError","AssertionError","Test timeout","not ok","prettier/prettier","error TS")) {
                $count = ([regex]::Matches($body, [regex]::Escape($kind))).Count
                if ($count -gt 0) {
                  Write-Host ("D06_FULL_CLASS_" + $kind.Replace(" ","_").Replace("/","_").ToUpperInvariant() + "=" + $count)
                }
              }
              # Disclose only coordinates in the exact tracked test/source inventory.
              # TAP/tsx stack paths can use either URI or Windows separators.
              $tracked = @(& git ls-files -- scripts tests src t2-site-module | Sort-Object)
              $normalized = $body.Replace([char]92,[char]47)
              $sourceCoords = @()
              foreach ($match in [regex]::Matches($normalized,'(?<file>(?:scripts|tests|src|t2-site-module)/[A-Za-z0-9._/-]+\.(?:mjs|cjs|ts|tsx|js)):(?<line>\d+)(?::(?<col>\d+))?')) {
                $idx = [array]::IndexOf($tracked,$match.Groups['file'].Value) + 1
                if ($idx -gt 0) { $sourceCoords += ($idx.ToString() + ":" + $match.Groups['line'].Value + ":" + $match.Groups['col'].Value) }
              }
              Write-Host ("D06_FULL_SOURCE_COORDINATES=" + (($sourceCoords | Select-Object -Unique -Last 35) -join ","))
              foreach ($m in [regex]::Matches($normalized,'(?m)^not ok (\d+)(?: -|\s*$)')) {
                Write-Host ("D06_FULL_TAP_FAILURE_INDEX=" + $m.Groups[1].Value)
              }
              foreach ($m in [regex]::Matches($normalized,'(?m)^> npm run ([a-z][a-z0-9:.-]+)(?:\s|$)')) {
                if ($m.Groups[1].Value -match '^(check|test|build)(:[a-z0-9.-]+)*$') { Write-Host ("D06_FULL_SCRIPT_STAGE=" + $m.Groups[1].Value) }
              }
              $known = @(& git ls-files -- "tests/e2e/*.spec.ts" | Sort-Object)
              $coords = @()
              foreach ($match in [regex]::Matches($body, '(tests[/\\]e2e[/\\][^:\r\n]+\.spec\.ts):(\d+):(\d+)')) {
                $file = $match.Groups[1].Value.Replace([char]92,[char]47)
                $index = [array]::IndexOf($known,$file) + 1
                if ($index -gt 0) { $coords += ($index.ToString() + ":" + $match.Groups[2].Value + ":" + $match.Groups[3].Value) }
              }
              Write-Host ("D06_FULL_E2E_COORDINATES=" + (($coords | Select-Object -Unique -Last 20) -join ","))
              foreach ($kind in @("strict mode violation","ECONNREFUSED","EADDRINUSE","ENOENT","ELIFECYCLE","No tests found","Immutability violated","exited with code","failed","did not match")) {
                $count = ([regex]::Matches($body, [regex]::Escape($kind))).Count
                if ($count) { Write-Host ("D06_FULL_EXTRA_CLASS=" + $kind + ":" + $count) }
              }
              exit 1
            }
          }
      - name: Diagnose formatting only after a failed mandatory gate
        if: ${{ !cancelled() && steps.static-gate.outcome == 'failure' && steps.static-gate.outputs.format-needed == 'true' }}
        shell: pwsh
        working-directory: private/site
        run: |
          $script = Join-Path $env:RUNNER_TEMP "d06-format-coordinates.cjs"
          @'
          const { execFileSync, spawnSync } = require("node:child_process");
          const { createRequire } = require("node:module");
          const { createHash } = require("node:crypto");
          const path = require("node:path");
          const req = createRequire(path.resolve("package.json"));
          const prettier = req("prettier");
          const git = (...args) => execFileSync("git", args, { encoding: "utf8", maxBuffer: 32 * 1024 * 1024 });
          const files = git("ls-files", "-z").split("\0").filter(Boolean).sort();
          const lint = spawnSync(process.execPath, [path.resolve("node_modules/eslint/bin/eslint.js"), ".", "--format", "json"], {
            encoding: "utf8", maxBuffer: 64 * 1024 * 1024,
          });
          if (lint.status !== 0 && lint.status !== 1) throw Error("lint diagnostics unavailable");
          const reports = JSON.parse(lint.stdout);
          const flagged = reports.filter((report) =>
            report.messages.some((message) => message.ruleId === "prettier/prettier"));
          if (flagged.length > 32) throw Error("format scope limit");
          const formatting = new Set([9, 10, 13, 32, 34, 39, 40, 41, 44, 58, 59, 91, 92, 93, 96, 123, 125]);
          function parts(source) {
            const content = [];
            const gaps = [];
            let offset = 0;
            while (true) {
              const start = offset;
              while (offset < source.length && formatting.has(source.charCodeAt(offset))) offset++;
              gaps.push({ start, value: source.slice(start, offset) });
              if (offset === source.length) break;
              content.push(source[offset++]);
            }
            return { content: content.join(""), gaps };
          }
          function sha(source) {
            const bytes = Buffer.from(source, "utf8");
            return createHash("sha1").update("blob " + bytes.length + "\0").update(bytes).digest("hex");
          }
          (async () => {
            let count = 0;
            let unsupported = 0;
            let total = 0;
            for (const report of flagged) {
              const relative = path.relative(process.cwd(), report.filePath).replaceAll("\\", "/");
              const ordinal = files.indexOf(relative) + 1;
              if (!ordinal) throw Error("untracked format target");
              const source = git("show", "HEAD:" + relative);
              const sourceSha = git("rev-parse", "HEAD:" + relative).trim();
              if (sha(source) !== sourceSha) throw Error("source blob mismatch");
              const config = await prettier.resolveConfig(report.filePath);
              const output = await prettier.format(source, { ...config, filepath: report.filePath });
              const a = parts(source);
              const b = parts(output);
              if (a.content !== b.content || a.gaps.length !== b.gaps.length) {
                console.log("D06_FMT_UNSUPPORTED=" + ordinal);
                let prefix = 0;
                while (prefix < a.content.length && prefix < b.content.length && a.content[prefix] === b.content[prefix]) prefix++;
                let suffix = 0;
                while (suffix < a.content.length - prefix && suffix < b.content.length - prefix && a.content[a.content.length - 1 - suffix] === b.content[b.content.length - 1 - suffix]) suffix++;
                const pos = a.gaps[Math.min(prefix, a.gaps.length - 1)].start;
                const line = source.slice(0, pos).split("\n").length;
                const column = pos - source.lastIndexOf("\n", pos - 1);
                console.log("D06_FMT_MISMATCH=" + [ordinal, line, column, a.content.length - prefix - suffix, b.content.length - prefix - suffix].join(":"));
                unsupported++;
                continue;
              }
              const edits = [];
              for (let i = 0; i < a.gaps.length; i++) {
                if (a.gaps[i].value === b.gaps[i].value) continue;
                const codes = Array.from(b.gaps[i].value, (ch) => ch.charCodeAt(0));
                if (!codes.every((code) => formatting.has(code))) throw Error("nonformat characters");
                edits.push([a.gaps[i].start, a.gaps[i].value.length, codes]);
              }
              let replay = source;
              for (const [start, length, codes] of [...edits].reverse())
                replay = replay.slice(0, start) + String.fromCharCode(...codes) + replay.slice(start + length);
              if (replay !== output) throw Error("coordinate replay mismatch");
              if (!edits.length) continue;
              if (total + edits.length > 15000) throw Error("format coordinate limit");
              total += edits.length;
              count++;
              console.log("D06_FMT_BLOB=" + ordinal + ":" + sourceSha + ":" + sha(output) + ":" + edits.length);
              for (let start = 0; start < edits.length; start += 20)
                console.log("D06_FMT_COORD=" + ordinal + ":" + JSON.stringify(edits.slice(start, start + 20)));
            }
            console.log("D06_FMT_COORD_FILES=" + count);
            console.log("D06_FMT_COORD_TOTAL=" + total);
            console.log("D06_FMT_COORD_UNSUPPORTED=" + unsupported);
            if (unsupported) process.exitCode = 1;
          })().catch(() => { console.log("D06_FMT_COORD_ENGINE=FAIL"); process.exitCode = 1; });
          '@ | Set-Content -LiteralPath $script -Encoding utf8
          $out = Join-Path $env:RUNNER_TEMP "d06-format-coordinates.private.log"
          & node $script *> $out
          $code = $LASTEXITCODE
          foreach ($line in Get-Content -LiteralPath $out) {
            if ($line -match '^D06_FMT_BLOB=\d+:[a-f0-9]{40}:[a-f0-9]{40}:\d+$' -or
                $line -match '^D06_FMT_COORD=\d+:[\[\],0-9]+$' -or
                $line -match '^D06_FMT_MISMATCH=\d+:\d+:\d+:\d+:\d+$' -or
                $line -match '^D06_FMT_(?:COORD_FILES|COORD_TOTAL|COORD_UNSUPPORTED|UNSUPPORTED)=\d+$' -or
                $line -eq 'D06_FMT_COORD_ENGINE=FAIL') {
              Write-Host $line
            }
          }
          if ($code -ne 0) { Write-Host "D06_FMT_COORD_RESULT=FAIL"; exit 1 }
          Write-Host "D06_FMT_COORD_RESULT=PASS"
      - name: Collect only unexecuted subject witnesses after failed mandatory gate
        if: ${{ !cancelled() && steps.static-gate.outcome == 'failure' && steps.static-gate.outputs.remaining-subject != '' }}
        shell: pwsh
        working-directory: private/site
        env:
          REMAINING_SUBJECT: ${{ steps.static-gate.outputs.remaining-subject }}
        run: |
          $tasks = @($env:REMAINING_SUBJECT.Split(","))
          if ($tasks.Count -gt 3 -or @($tasks | Select-Object -Unique).Count -ne $tasks.Count) { throw "D06_DIAGNOSTIC_SCOPE" }
          $failed = 0
          foreach ($task in $tasks) {
            if ($task -notin @("test:session","test:workflow-progress","test:native")) { throw "D06_DIAGNOSTIC_SCOPE" }
            $log = Join-Path $env:RUNNER_TEMP "d06-remaining-subject.private.log"
            & cmd.exe /d /c ("npm run " + $task + " > """ + $log + """ 2>&1")
            $passed = $LASTEXITCODE -eq 0
            Write-Host ("D06_REMAINING_" + $task.Replace(":","_").Replace("-","_").ToUpperInvariant() + "=" + $(if ($passed) {"PASS"} else {"FAIL"}))
            if (-not $passed) {
              $failed++
              $body = Get-Content -LiteralPath $log -Raw
              foreach ($m in [regex]::Matches($body,'(?m)^D06_(?:SESSION|WORKFLOW)_ASSERT_FAIL=\d+\r?$')) {
                Write-Host $m.Value.Trim()
              }
              foreach ($m in [regex]::Matches($body,'(?m)^not ok (\d+)(?: -|\s*$)')) {
                Write-Host ("D06_REMAINING_TAP_FAILURE_INDEX=" + $m.Groups[1].Value)
              }
              $codes = [regex]::Matches($body,'TS\d{4}') | ForEach-Object {$_.Value} | Select-Object -Unique -First 10
              Write-Host ("D06_REMAINING_TYPE_CODES=" + ($codes -join ","))
            }
          }
          if ($failed -gt 0) { exit 1 }
      - name: Evidence boundary
        if: always()
        shell: pwsh
        run: |
          Write-Host "D06_T3_PRODUCT_ACCEPTED=false"
          Write-Host "D06_PRIVATE_SOURCE_UPLOADS=0"
          Write-Host "D06_PRIVATE_LOG_UPLOADS=0"
          Write-Host "D06_PRIVATE_DIST_UPLOADS=0"
  linux:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/d06/t3-release-request.json
          sparse-checkout-cone-mode: false
          path: pipeline
      - name: Validate explicit release request
        id: request
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $request = Get-Content -LiteralPath pipeline/.github/d06/t3-release-request.json -Raw | ConvertFrom-Json
          if ($request.schema -ne "IWXA_D06_T3_QUALIFICATION/1") { throw "D06_RELEASE_REQUEST_SCHEMA" }
          foreach ($field in @("owner","site")) {
            $value = $request.$field
            if ($value -isnot [string] -or $value -cnotmatch '^[a-f0-9]{40}$') { throw "D06_RELEASE_REQUEST_SHA" }
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ($field + "=" + $value)
          }
          if (($request.attempt -isnot [int] -and $request.attempt -isnot [long]) -or $request.attempt -lt 1) { throw "D06_RELEASE_REQUEST_ATTEMPT" }
          Write-Host "D06_RELEASE_REQUEST=PASS"
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod
          ref: ${{ steps.request.outputs.owner }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/domain
      # The current domain revision and the published skill release are
      # deliberately separate inputs. Changing an unrelated domain rule
      # must not manufacture a new skill release or change its provenance.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod
          ref: 40e0965491819722dcf57c973e7d0c19b4cbcba0
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/skill-owner
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod.ru
          ref: ${{ steps.request.outputs.site }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 9f41447197251d41e69fbcb98e52ef1050754ec2
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/assistant
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod.ru
          ref: ffa31457ea7b29b9a0f65eafd7e44a2141da6e66
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/previous
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 326f725c44d69ac99f6b912241e9e8a6c3d716a5
          persist-credentials: false
          path: original-core
      - name: Verify immutable candidate revisions
        shell: pwsh
        env:
          EXPECTED_OWNER: ${{ steps.request.outputs.owner }}
          EXPECTED_SITE: ${{ steps.request.outputs.site }}
        run: |
          $ErrorActionPreference = "Stop"
          $owner = (git -C private/domain rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $owner -cne $env:EXPECTED_OWNER) { throw "D06_RELEASE_OWNER_SHA" }
          $site = (git -C private/site rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $site -cne $env:EXPECTED_SITE) { throw "D06_RELEASE_SITE_SHA" }
          Write-Host "D06_RELEASE_EXACT_PINS=PASS"
      - name: Prove exact canonical projection
        shell: pwsh
        env:
          EXPECTED_OWNER: ${{ steps.request.outputs.owner }}
        run: |
          $ErrorActionPreference = "Stop"
          switch ($env:EXPECTED_OWNER) {
            "607525f672c8631a59c27c7e0e621a7a6e0f4d1a" { $evidenceCases = 52; $selectionCases = 44 }
            "8471dca0037328dfee8689632df9c27866e89845" { $evidenceCases = 70; $selectionCases = 63 }
            default { throw "D06_RELEASE_UNQUALIFIED_CASE_INVENTORY" }
          }
          foreach ($path in @("src/evaluate-offers/comparison-evidence.mjs","src/evaluate-offers/comparison-evidence.d.mts","scripts/test-pd12-comparison-evidence.mjs","src/rules/replacement-comparison.ts","src/evaluate-offers/purchase-decision-readiness.ts","src/evaluate-offers/ordinary-selection-write.ts","scripts/test-pd12-ordinary-selection.mjs","src/evaluate-offers/current-purchase-decision.ts","scripts/test-current-purchase-decision.mjs","src/schemas/komplektovod/offer-comparison.schema.json","src/schemas/komplektovod/offer-assessment.schema.json")) {
            $a = (git -C private/domain rev-parse ("HEAD:" + $path)).Trim()
            $b = (git -C private/site rev-parse ("HEAD:" + $path)).Trim()
            if ($a -ne $b) { throw "D06_PD12_OWNER_PROJECTION_MISMATCH" }
          }
          Write-Host "D06_PD12_OWNER_PROJECTION=PASS"
          $log = Join-Path $env:RUNNER_TEMP "d06-pd12-canonical.private.log"
          & node private/domain/scripts/test-pd12-comparison-evidence.mjs *> $log
          if ($LASTEXITCODE -ne 0 -or (Get-Content $log -Raw) -notmatch ('(?m)^D06_PD12_COMPARISON_EVIDENCE_CASES=' + $evidenceCases + '\r?$')) { throw "D06_PD12_CANONICAL_CASES_FAILED" }
          Write-Host ("D06_PD12_CANONICAL_CASES=" + $evidenceCases)
          & node --experimental-strip-types private/domain/scripts/test-pd12-ordinary-selection.mjs *> $log
          if ($LASTEXITCODE -ne 0 -or (Get-Content $log -Raw) -notmatch ('(?m)^D06_PD12_SELECTION_CASES=' + $selectionCases + '\r?$')) { throw "D06_PD12_CANONICAL_SELECTION_FAILED" }
          Write-Host ("D06_PD12_CANONICAL_SELECTION_CASES=" + $selectionCases)
          & node --experimental-strip-types private/domain/scripts/test-current-purchase-decision.mjs *> $log
          if ($LASTEXITCODE -ne 0 -or (Get-Content $log -Raw) -notmatch '(?m)^D06_CURRENT_PURCHASE_DECISION_CASES=51\r?$') { throw "D06_CURRENT_PURCHASE_DECISION_FAILED" }
          Write-Host "D06_CURRENT_PURCHASE_DECISION_CASES=51"
      - name: Check exact original assistant files and owner pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pin = Get-Content private/site/runtime/t3-platform/0.3.1-rc.1/domain-assistant.json -Raw | ConvertFrom-Json
          if ((git -C private/assistant rev-parse HEAD).Trim() -ne $pin.sourceCommit) { throw "D06_T3_ORIGINAL_COMMIT" }
          foreach ($entry in $pin.files) {
            $blob = (git -C private/assistant rev-parse ("HEAD:" + $pin.sourceRoot + "/" + $entry.path)).Trim()
            if ($blob -ne $entry.blob) { throw "D06_T3_ORIGINAL_BLOB" }
          }
          $skillPin = Get-Content private/site/runtime/t3-platform/0.3.1-rc.1/domain-skills.json -Raw | ConvertFrom-Json
          if ($skillPin.version -ne "1.4.1" -or (git -C private/skill-owner rev-parse HEAD).Trim() -ne $skillPin.sourceCommit) { throw "D06_T3_SKILL_RELEASE_COMMIT" }
          $owner = (git -C private/domain rev-parse HEAD:models/assistant-skills.json).Trim()
          $released = (git -C private/skill-owner rev-parse HEAD:models/assistant-skills.json).Trim()
          $site = (git -C private/site rev-parse HEAD:public/assets/d06-assistant-skills.json).Trim()
          if ($owner -ne $site -or $released -ne $site -or $site -ne $skillPin.sourceBlob) { throw "D06_T3_SKILL_BYTES_MISMATCH" }
          foreach ($root in @("private/domain","private/skill-owner","private/site","private/previous")) {
            if ((git -C $root rev-parse HEAD:src/registry/services.json).Trim() -ne $skillPin.registryBlob) { throw "D06_T3_SKILL_REGISTRY_MISMATCH" }
          }
          Write-Host "D06_T3_SKILL_RELEASE_PIN=PASS"
          Write-Host "D06_T3_ORIGINAL_INPUTS=PASS"
      - name: Validate canonical procedures, original runtime and extraction
        working-directory: private/domain
        shell: pwsh
        run: |
          $env:IWXA_ORIGINAL_ASSISTANT_ROOT = Join-Path $env:GITHUB_WORKSPACE "private/assistant/browser-local-inference/domain-assistant"
          $log = Join-Path $env:RUNNER_TEMP "d06-t3-owner-private.txt"
          & node scripts/d06-skill-authoring.mjs check *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_T3_AUTHORING=FAIL"; exit 1 }
          & node scripts/test-assistant-skills.mjs *> $log
          if ($LASTEXITCODE -ne 0) {
            $data = Get-Content $log -Raw
            $codes = [regex]::Matches($data,'(?:D06_SKILL|T3_ASSISTANT_SKILLS)_[A-Z_]+') | ForEach-Object {$_.Value} | Select-Object -Unique -First 8
            $line = [regex]::Match($data,'test-assistant-skills\.mjs:(\d+):\d+').Groups[1].Value
            Write-Host ("D06_T3_SKILL_FAILURE_CODES=" + ($codes -join ","))
            Write-Host ("D06_T3_SKILL_FAILURE_LINE=" + $line)
            Write-Host "D06_T3_SKILLS_SOURCE=FAIL"
            exit 1
          }
          if ((Get-Content $log -Raw) -notmatch '(?m)^D06_T3_FACT_ABSTENTION_CASES=50\r?$') { Write-Host "D06_T3_FACT_ABSTENTION=FAIL"; exit 1 }
          Write-Host "D06_T3_FACT_ABSTENTION_CASES=50"
          if ((Get-Content $log -Raw) -notmatch '(?m)^D06_T3_RESULT_CONTEXT_CASES=119\r?$') { Write-Host "D06_T3_RESULT_CONTEXT=FAIL"; exit 1 }
          Write-Host "D06_T3_RESULT_CONTEXT_CASES=119"
          Write-Host "D06_T3_SKILLS_SOURCE=PASS"
      - name: Install site dependencies once
        working-directory: private/site
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "d06-release-install.private.log"
          & npm ci *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_RELEASE_NPM_CI=FAIL"; exit 1 }
          Write-Host "D06_RELEASE_NPM_CI=PASS"
      - name: Check original React source bindings and idempotent import
        working-directory: private/site
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "d06-t3-site-private.txt"
          & node scripts/d06-assistant-skills.mjs check *> $log
          if ($LASTEXITCODE -ne 0) {
            $codes = [regex]::Matches((Get-Content $log -Raw),'D06_SKILL_PROJECTION_[A-Z_]+') | ForEach-Object {$_.Value} | Select-Object -Unique -First 8
            Write-Host ("D06_T3_PROJECTION_CODES=" + ($codes -join ","))
            Write-Host "D06_T3_SKILLS_PROJECTION=FAIL"
            exit 1
          }
          Write-Host "D06_T3_SKILLS_PROJECTION=PASS"
          & node --test tests/t3/static-route-timestamps.test.mjs *> $log
          if ($LASTEXITCODE -ne 0) {
            $codes = [regex]::Matches((Get-Content $log -Raw),'D06_T3_STATIC_ROUTE_TIME_[A-Z_]+') | ForEach-Object {$_.Value} | Select-Object -Unique -First 8
            Write-Host ("D06_T3_SERIALIZER_CODES=" + ($codes -join ","))
            Write-Host "D06_T3_PINNED_SERIALIZER_TEST=FAIL"
            exit 1
          }
          Write-Host "D06_T3_PINNED_SERIALIZER_TEST=PASS"
          $domain = Join-Path $env:GITHUB_WORKSPACE "private/skill-owner"
          $before = (git status --porcelain --untracked-files=normal)
          & node scripts/d06-assistant-skills.mjs import $domain 40e0965491819722dcf57c973e7d0c19b4cbcba0 *> $log
          if ($LASTEXITCODE -ne 0 -or (Get-Content $log -Raw) -notmatch '"changed":false') { Write-Host "D06_T3_IMPORT_DRY_RUN=FAIL"; exit 1 }
          & node scripts/d06-assistant-skills.mjs import $domain 40e0965491819722dcf57c973e7d0c19b4cbcba0 --apply *> $log
          if ($LASTEXITCODE -ne 0 -or (Get-Content $log -Raw) -notmatch '"applied":false') { Write-Host "D06_T3_IMPORT_IDEMPOTENT=FAIL"; exit 1 }
          if ((git status --porcelain --untracked-files=normal) -or $before) { Write-Host "D06_T3_IMPORT_DIRTY=FAIL"; exit 1 }
          Write-Host "D06_T3_IMPORT_DRY_RUN=PASS"
          Write-Host "D06_T3_IMPORT_IDEMPOTENT=PASS"
      - name: Prove 1.3 to 1.4.1 upgrade only with exact new result bindings
        working-directory: private/site
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP "d06-skill-upgrade-private.mjs"
          @'
          import assert from "node:assert/strict";
          import { readFileSync, copyFileSync } from "node:fs";
          import { resolve, join } from "node:path";
          import { pathToFileURL } from "node:url";
          const { importSkills, verifyProjection } = await import(pathToFileURL(resolve("scripts/d06-assistant-skills.mjs")).href);
          const owner = resolve("../skill-owner");
          const previous = resolve("../previous");
          const commit = "40e0965491819722dcf57c973e7d0c19b4cbcba0";
          const files = ["public/assets/d06-assistant-skills.json", "runtime/t3-platform/0.3.1-rc.1/domain-skills.json"];
          const original = files.map(p=>readFileSync(join(previous,p)));
          assert.equal(JSON.parse(original[0]).version,"1.3.0");
          assert.throws(()=>importSkills(owner,commit,{dir:previous,apply:true}),/D06_SKILL_PROJECTION_RESULT_(?:HINT|BINDING|READINESS)/);
          for(let i=0;i<files.length;i++)assert.ok(original[i].equals(readFileSync(join(previous,files[i]))));
          // A skill update requiring new result scopes must be installed with
          // the corresponding exact owner-approved site source bindings.
          for(const service of ["capacity-quantity","compatibility-check","completeness-check","startup-cost","offer-comparison","acceptance-plan"]){
            const path="src/routes/services."+service+".index.tsx";
            copyFileSync(path,join(previous,path));
          }
          const dry = importSkills(owner, commit, {dir:previous});
          assert.equal(dry.version,"1.4.1");
          assert.equal(dry.changed,true);
          assert.equal(dry.applied,false);
          for(let i=0;i<files.length;i++)assert.ok(original[i].equals(readFileSync(join(previous,files[i]))));
          const applied = importSkills(owner, commit, {dir:previous,apply:true});
          assert.equal(applied.applied,true);
          assert.equal(verifyProjection(previous).version,"1.4.1");
          for(const path of files)assert.ok(readFileSync(join(previous,path)).equals(readFileSync(path)));
          assert.equal(importSkills(owner,commit,{dir:previous,apply:true}).applied,false);
          '@ | Set-Content -LiteralPath $script -Encoding utf8
          $log = Join-Path $env:RUNNER_TEMP "d06-skill-upgrade-private.log"
          & node $script *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_T3_SKILL_UPGRADE=FAIL"; exit 1 }
          Write-Host "D06_T3_SKILL_UPGRADE_REJECTS_MISSING_BINDINGS=PASS"
          Write-Host "D06_T3_SKILL_UPGRADE=PASS"
          Write-Host "D06_T3_SKILL_UPGRADE_COMMITTED_BYTES=PASS"
      - name: Test actual projected calculators, saved evidence and purchase safeguards
        shell: pwsh
        working-directory: private/site
        run: |
          $log = Join-Path $env:RUNNER_TEMP "d06-pd12-projection.private.log"
          $failed = 0
          foreach ($task in @("test:pd11:editor-context", "test:pd12:evidence", "test:pd12:selection", "test:pd12:current-decision", "test:workflow:offers", "test:pd12:readiness", "test:replacement-procurement", "test:replacement-write-guard", "test:session", "test:workflow-progress", "test:native", "check:schemas", "check:type")) {
            & npm run $task *> $log
            $passed = $LASTEXITCODE -eq 0
            Write-Host ("D06_PD12_TASK_" + $task.Replace(":","_").Replace("-","_").ToUpperInvariant() + "=" + $(if ($passed) {"PASS"} else {"FAIL"}))
            if (-not $passed) {
              $failed++
              $raw = (Get-Content $log -Raw).Replace([char]92,[char]47)
              foreach ($m in [regex]::Matches($raw,'(?m)^D06_(?:SESSION|WORKFLOW)_ASSERT_FAIL=\d+\r?$')) {
                Write-Host $m.Value.Trim()
              }
              foreach ($m in [regex]::Matches($raw,'(?m)^not ok (\d+)(?: -|\s*$)')) {
                Write-Host ("D06_PD12_TAP_FAILURE_INDEX=" + $m.Groups[1].Value)
              }
              $tracked = @(& git ls-files -- scripts src tests | Sort-Object)
              foreach ($m in ([regex]::Matches($raw,'(?<file>(?:scripts|src|tests)/[A-Za-z0-9._/-]+\.(?:mjs|mts|ts|tsx))(?::|\()(?<line>\d+)(?::|,)(?<column>\d+)') | Select-Object -Last 20)) {
                $index = [array]::IndexOf($tracked,$m.Groups["file"].Value)+1
                if ($index -gt 0) { Write-Host ("D06_PD12_FAILURE_COORD=" + $index + ":" + $m.Groups["line"].Value + ":" + $m.Groups["column"].Value) }
              }
              $codes = [regex]::Matches($raw,'TS\d{4}') | ForEach-Object {$_.Value} | Select-Object -Unique -First 10
              Write-Host ("D06_PD12_TYPE_CODES=" + ($codes -join ","))
            }
          }
          if ($failed -gt 0) { exit 1 }
      - name: Verify original public portable input
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: private/site
        run: |
          set -euo pipefail
          gh api repos/Faust-S/knowledge/actions/artifacts/14920233669/zip > "$RUNNER_TEMP/platform-outer.zip"
          echo "96bb993383af31309b79dceb6f321ac5365ac7777362f512f9225226ee51904f  $RUNNER_TEMP/platform-outer.zip" | sha256sum --check --status
          unzip -p "$RUNNER_TEMP/platform-outer.zip" platform-inputs.zip > "$RUNNER_TEMP/platform-inputs.zip"
          node scripts/d06-t3-platform-inputs.mjs verify "$RUNNER_TEMP/platform-inputs.zip" > "$RUNNER_TEMP/platform-private.log" 2>&1 || { grep -Eo 'D06_T3_PLATFORM_[A-Z0-9_]+' "$RUNNER_TEMP/platform-private.log" | sort -u | head -10; exit 1; }
          echo D06_T3_ORIGINAL_PLATFORM_128_FILES=PASS
      - name: Prepare compiled loopback Host
        working-directory: private/site
        shell: bash
        run: |
