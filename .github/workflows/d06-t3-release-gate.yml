      - name: Run full D06 native Exchange and lifecycle witness at exact T3 origin
        if: ${{ !cancelled() && steps.preview-build.outcome == 'success' }}
        working-directory: private/site
        shell: bash
        env:
          IWXA_T2_CANONICAL_ROOT: ${{ github.workspace }}/original-core/packages/t3-core
        run: |
          set -euo pipefail
          oom_before="$(awk '$1=="oom_kill"{print $2}' /sys/fs/cgroup/memory.events 2>/dev/null || true)"
          DEBUG=pw:browser node --experimental-strip-types scripts/verify-native-transfer.mjs > "$RUNNER_TEMP/d06-t3-native-private.log" 2>&1 || {
            echo D06_T3_INHERITED_NATIVE_EXCHANGE=FAIL
            grep -E '^D06_NATIVE_STAGE=[A-Z0-9_]+$' "$RUNNER_TEMP/d06-t3-native-private.log" | tail -12 || true
