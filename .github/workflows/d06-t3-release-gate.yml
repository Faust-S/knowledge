name: d06-t3-release-gate
# One deliberate release request. No routine source, workflow or schedule triggers.
on:
  push:
    branches:
      - 'ci/once/d06-t3-release-gate/*'
    paths:
      - '.github/ci-requests/d06-t3-release-gate.json'
  workflow_dispatch:

concurrency:
  group: d06-t3-qualification
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  linux:
    name: final-release-closure
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            .github/ci-requests/d06-t3-release-gate.json
            .github/d06/verify-d06-once.mjs
            .github/d06/t3-release-request.json
            .github/d06/reuse-static-evidence.mjs
            scripts/d06-static-reconcile.sh
            scripts/d06-private-git-transport.sh
          sparse-checkout-cone-mode: false
          path: pipeline
      - name: Validate one-shot trigger before any private checkout
        working-directory: pipeline
        shell: bash
        run: node .github/d06/verify-d06-once.mjs
      - name: Validate explicit release request
        id: request
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $request = Get-Content -LiteralPath pipeline/.github/d06/t3-release-request.json -Raw | ConvertFrom-Json
          if ($request.schema -ne "IWXA_D06_T3_QUALIFICATION/1") { throw "D06_RELEASE_REQUEST_SCHEMA" }
          foreach ($field in @("owner","site")) {
            $value = $request.$field
            if ($value -isnot [string] -or $value -cnotmatch '^[a-f0-9]{40}$') { throw "D06_RELEASE_REQUEST_SHA" }
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ($field + "=" + $value)
          }
          if (($request.attempt -isnot [int] -and $request.attempt -isnot [long]) -or $request.attempt -lt 1) { throw "D06_RELEASE_REQUEST_ATTEMPT" }
          if ($request.owner -cne "8471dca0037328dfee8689632df9c27866e89845" -or $request.site -cne "8ee1f93603c95738333bc1489d68816ead870893" -or $request.attempt -ne 10) { throw "D06_RELEASE_REQUEST_FROZEN" }
          Write-Host "D06_RELEASE_REQUEST=PASS"
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod
          ref: ${{ steps.request.outputs.owner }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/domain
      # The current domain revision and the published skill release are
      # deliberately separate inputs. Changing an unrelated domain rule
      # must not manufacture a new skill release or change its provenance.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod
          ref: 40e0965491819722dcf57c973e7d0c19b4cbcba0
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/skill-owner
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod.ru
          ref: ${{ steps.request.outputs.site }}
          fetch-depth: 3
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 9f41447197251d41e69fbcb98e52ef1050754ec2
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/assistant
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 326f725c44d69ac99f6b912241e9e8a6c3d716a5
          persist-credentials: false
          path: original-core
      - name: Reuse exact successful hardware model witness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Faust-S/knowledge/actions/runs/45656504169 --jq .head_sha)" = "16a8c446a1dc61717ce9b80e6d7f38ee620ff458"
          gh api repos/Faust-S/knowledge/actions/jobs/139354504914 > "$RUNNER_TEMP/d06-model-witness.json"
          node --input-type=module - "$RUNNER_TEMP/d06-model-witness.json" <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const j=JSON.parse(readFileSync(process.argv[2],'utf8'));
          assert.equal(j.run_id,45656504169);
          assert.equal(j.name,'macos-model-exchange');
          assert.equal(j.status,'completed');
          for(const name of ['Prove exact release-blocker-only delta','Prepare compiled real D06 Host','Build exact HTTPS loopback candidate','Real Qwen on actual D06 subject and cold offline Kernel draft']){
            assert.equal(j.steps.find(s=>s.name===name)?.conclusion,'success');
          }
          NODE
          # Preserve the successful hardware witness: two exact test-only changes.
          test "$(git -C private/site rev-parse HEAD)" = "8ee1f93603c95738333bc1489d68816ead870893"
          test "$(git -C private/site rev-parse HEAD^)" = "750ad087f7b0626daafa1b2f7d46faa9c05e5595"
          test "$(git -C private/site rev-parse HEAD^^)" = "b386d5b4f8b8fa318c906e353fe75ed66e135641"
          test "$(git -C private/site diff --name-status HEAD^^ HEAD^)" = "$(printf 'M\tscripts/verify-native-transfer.mjs')"
          test "$(git -C private/site rev-parse HEAD^^:scripts/verify-native-transfer.mjs)" = "46699abdb2f93d70d334bc1b3a476a278501f1bd"
          test "$(git -C private/site rev-parse HEAD^:scripts/verify-native-transfer.mjs)" = "366b1a91c9c68271e23cab2b8a451e386835f10a"
          test "$(git -C private/site diff --name-status HEAD^ HEAD)" = "$(printf 'M\ttests/e2e/ux-audit-regressions.spec.ts')"
          test "$(git -C private/site rev-parse HEAD:tests/e2e/ux-audit-regressions.spec.ts)" = "990c6a8f9396c2abeed8f3defe10d78a78d60ef6"
          echo D06_FINAL_PRIOR_HARDWARE_TEST_ONLY_DELTA=PASS
          echo D06_FINAL_EXACT_PRIOR_HARDWARE_MODEL=PASS
      - name: Verify immutable candidate revisions
        shell: pwsh
        env:
          EXPECTED_OWNER: ${{ steps.request.outputs.owner }}
          EXPECTED_SITE: ${{ steps.request.outputs.site }}
        run: |
          $ErrorActionPreference = "Stop"
          $owner = (git -C private/domain rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $owner -cne $env:EXPECTED_OWNER) { throw "D06_RELEASE_OWNER_SHA" }
          $site = (git -C private/site rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $site -cne $env:EXPECTED_SITE) { throw "D06_RELEASE_SITE_SHA" }
          Write-Host "D06_RELEASE_EXACT_PINS=PASS"
      - name: Reuse exact completed product evidence
        id: static-evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Faust-S/knowledge/actions/runs/45669214673 > "$RUNNER_TEMP/d06-prior-run.private.json"
          gh api repos/Faust-S/knowledge/actions/jobs/139399590758 > "$RUNNER_TEMP/d06-prior-job.private.json"
          # Logs contain ANSI escapes. Write them only to a runner-local file, never the terminal.
          gh api --allow-escape-sequences repos/Faust-S/knowledge/actions/jobs/139399590758/logs > "$RUNNER_TEMP/d06-prior-job.private.log"
          node "$GITHUB_WORKSPACE/pipeline/.github/d06/reuse-static-evidence.mjs" "$RUNNER_TEMP/d06-prior-run.private.json" "$RUNNER_TEMP/d06-prior-job.private.json" "$RUNNER_TEMP/d06-prior-job.private.log"
      - name: Check exact original assistant files and owner pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pin = Get-Content private/site/runtime/t3-platform/0.3.1-rc.1/domain-assistant.json -Raw | ConvertFrom-Json
          if ((git -C private/assistant rev-parse HEAD).Trim() -ne $pin.sourceCommit) { throw "D06_T3_ORIGINAL_COMMIT" }
          foreach ($entry in $pin.files) {
            $blob = (git -C private/assistant rev-parse ("HEAD:" + $pin.sourceRoot + "/" + $entry.path)).Trim()
            if ($blob -ne $entry.blob) { throw "D06_T3_ORIGINAL_BLOB" }
          }
          $skillPin = Get-Content private/site/runtime/t3-platform/0.3.1-rc.1/domain-skills.json -Raw | ConvertFrom-Json
          if ($skillPin.version -ne "1.4.1" -or (git -C private/skill-owner rev-parse HEAD).Trim() -ne $skillPin.sourceCommit) { throw "D06_T3_SKILL_RELEASE_COMMIT" }
          $owner = (git -C private/domain rev-parse HEAD:models/assistant-skills.json).Trim()
          $released = (git -C private/skill-owner rev-parse HEAD:models/assistant-skills.json).Trim()
          $site = (git -C private/site rev-parse HEAD:public/assets/d06-assistant-skills.json).Trim()
          if ($owner -ne $site -or $released -ne $site -or $site -ne $skillPin.sourceBlob) { throw "D06_T3_SKILL_BYTES_MISMATCH" }
          foreach ($root in @("private/domain","private/skill-owner","private/site")) {
            if ((git -C $root rev-parse HEAD:src/registry/services.json).Trim() -ne $skillPin.registryBlob) { throw "D06_T3_SKILL_REGISTRY_MISMATCH" }
          }
          Write-Host "D06_T3_SKILL_RELEASE_PIN=PASS"
          Write-Host "D06_T3_ORIGINAL_INPUTS=PASS"
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod.ru
          ref: be7e994af3aba9837d6ee2c3ce17373e47dd1cdc
          fetch-depth: 2
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/retention
      - name: Check exact private retention authorization
        id: retention-permission
        continue-on-error: true
        working-directory: private/retention
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          bash "$GITHUB_WORKSPACE/pipeline/scripts/d06-private-git-transport.sh" preflight be7e994af3aba9837d6ee2c3ce17373e47dd1cdc
      - name: Install site dependencies once
        working-directory: private/site
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "d06-release-install.private.log"
          & npm ci *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_RELEASE_NPM_CI=FAIL"; exit 1 }
          Write-Host "D06_RELEASE_NPM_CI=PASS"
      - name: Install fixed Chromium only in the qualification environment
        id: fixed-browser
        shell: bash
        working-directory: private/site
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/d06-fixed-browser"
          mkdir -p "$prefix"
          npm install --prefix "$prefix" --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.64.0 > "$RUNNER_TEMP/d06-fixed-browser-private.log" 2>&1 || { echo D06_FINAL_BROWSER_INSTALL=FAIL; exit 1; }
          node "$prefix/node_modules/playwright-core/cli.js" install chromium >> "$RUNNER_TEMP/d06-fixed-browser-private.log" 2>&1 || { echo D06_FINAL_BROWSER_INSTALL=FAIL; exit 1; }
          executable="$(node --input-type=module - "$prefix" <<'NODE'
          import assert from 'node:assert/strict';
          import {existsSync,readFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {createRequire} from 'node:module';
          const req=createRequire(import.meta.url);
          const core=join(process.argv[2],'node_modules','playwright-core');
          const pkg=JSON.parse(readFileSync(join(core,'package.json'),'utf8'));
          const registry=JSON.parse(readFileSync(join(core,'browsers.json'),'utf8'));
          assert.equal(pkg.version,'1.64.0');
          assert.equal(registry.browsers.find(x=>x.name==='chromium')?.browserVersion,'156.0.8078.4');
          const path=req(core).chromium.executablePath();
          assert.ok(existsSync(path));
          process.stdout.write(path);
          NODE
          )"
          version="$("$executable" --version)"
          [[ "$version" == *156.0.8078.4* ]] || { echo D06_FINAL_BROWSER_VERSION=FAIL; exit 1; }
          printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE=%s\nPUPPETEER_EXECUTABLE_PATH=%s\n' "$executable" "$executable" >> "$GITHUB_ENV"
          test -z "$(git status --porcelain --untracked-files=normal)"
          echo D06_FINAL_BROWSER_VERSION=156.0.8078.4
          echo D06_FINAL_BROWSER_INSTALL=PASS
      - name: Reconcile static source integrity with prior 85 of 85 evidence
        id: static-gate
        working-directory: private/site
        shell: bash
        env:
          EXPECTED_SITE: ${{ steps.request.outputs.site }}
          D06_CANONICAL_TASK_INTENTS_PATH: ${{ github.workspace }}/private/domain/src/registry/task-intents.json
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/pipeline/scripts/d06-static-reconcile.sh" "$EXPECTED_SITE"
          echo D06_FINAL_STATIC_EVIDENCE_RECONCILED=PASS
      - name: Verify original public portable input
        id: original-input
        if: ${{ !cancelled() && steps.fixed-browser.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: private/site
        run: |
          set -euo pipefail
          gh api repos/Faust-S/knowledge/actions/artifacts/14920233669/zip > "$RUNNER_TEMP/platform-outer.zip"
          echo "96bb993383af31309b79dceb6f321ac5365ac7777362f512f9225226ee51904f  $RUNNER_TEMP/platform-outer.zip" | sha256sum --check --status
          unzip -p "$RUNNER_TEMP/platform-outer.zip" platform-inputs.zip > "$RUNNER_TEMP/platform-inputs.zip"
          node scripts/d06-t3-platform-inputs.mjs verify "$RUNNER_TEMP/platform-inputs.zip" > "$RUNNER_TEMP/platform-private.log" 2>&1 || { grep -Eo 'D06_T3_PLATFORM_[A-Z0-9_]+' "$RUNNER_TEMP/platform-private.log" | sort -u | head -10; exit 1; }
          echo D06_T3_ORIGINAL_PLATFORM_128_FILES=PASS
      - name: Prepare compiled loopback Host
        id: loopback-host
        if: ${{ !cancelled() && steps.original-input.outcome == 'success' }}
        working-directory: private/site
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8ee1f93603c95738333bc1489d68816ead870893"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo D06_LOOPBACK_PRISTINE_SOURCE=PASS
          npm run t3:prepare-host -- "$GITHUB_WORKSPACE/original-core/packages/t3-core" "$RUNNER_TEMP/d06-t3-host" "$RUNNER_TEMP/platform-inputs.zip" "$GITHUB_WORKSPACE/private/assistant" https://127.0.0.1:8443 > "$RUNNER_TEMP/d06-host-private.log" 2>&1 || {
            echo D06_T3_HOST_SOURCE_BUILD=FAIL
            grep -Eo 'D06_T3_(HOST|PLATFORM)_[A-Z0-9_]+|D06_SITE_ONLY_[A-Z0-9_]+|D06_BUILD_[A-Z0-9_]+|T2_EXTERNAL_MODULE_[A-Z_]+|T2_QUALIFIED_KERNEL_STAGE_[A-Z_]+|TS[0-9]{4}' "$RUNNER_TEMP/d06-host-private.log" | sort -u | head -25 || true
            node --input-type=module - "$RUNNER_TEMP/d06-host-private.log" <<'NODE'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const paths=execFileSync('git',['ls-files','--','src'],{encoding:'utf8'}).split(/\r?\n/).filter(Boolean).sort();
          const lines=readFileSync(process.argv[2],'utf8').split(/\r?\n/);
          const matches=lines.map(line=>line.match(/^(src\/[A-Za-z0-9_./-]+\.(?:ts|tsx|mts))\((\d+),(\d+)\): error (TS\d+):/)).filter(Boolean);
          console.log("D06_T3_COMPILE_DIAGNOSTICS="+matches.length);
          for(const m of matches.slice(0,40)){
            const ordinal=paths.indexOf(m[1])+1;
            if(ordinal>0)console.log("D06_T3_COMPILE_COORD="+m[4]+":"+ordinal+":"+m[2]+":"+m[3]);
          }
          NODE
            exit 1
          }
          echo D06_T3_HOST_SOURCE_BUILD=PASS
          node --input-type=module - "$RUNNER_TEMP/d06-t3-host" <<'NODE'
          import {verifyPreparedD06Host} from './scripts/prepare-d06-t3-host.mjs';
          const receipt=verifyPreparedD06Host(process.argv[2]);
          console.log("D06_T3_HOST_READBACK=PASS");
          console.log("D06_T3_HOST_FILES="+receipt.files.length);
          console.log("D06_T3_SHARED_WORKER_COUNT="+receipt.files.filter(x=>/^assets\/model-worker-[A-Za-z0-9_-]+\.js$/.test(x.path)).length);
          NODE
      - name: Build exact HTTPS loopback candidate
        id: preview-build
        if: ${{ !cancelled() && steps.loopback-host.outcome == 'success' }}
        working-directory: private/site
        shell: bash
        run: |
          set -euo pipefail
          test -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE"
          node --experimental-strip-types scripts/build-d06-t3-local-site.mjs "$RUNNER_TEMP/d06-t3-host" "$RUNNER_TEMP/platform-inputs.zip" > "$RUNNER_TEMP/d06-offline-build-private.log" 2>&1 || {
            echo D06_T3_OFFLINE_BUILD=FAIL
            grep -E '^D06_T3_LOCAL_STAGE_[A-Z0-9_]+=(PASS|FAIL)$' "$RUNNER_TEMP/d06-offline-build-private.log" || true
            grep -Eo 'D06_T3_[A-Z0-9_]+|T3_DOMAIN_OFFLINE_[A-Z0-9_]+|T3_D5_MODULE_[A-Z0-9_]+' "$RUNNER_TEMP/d06-offline-build-private.log" | sort -u | head -25 || true
            exit 1
          }
          echo D06_T3_OFFLINE_BUILD=PASS
      - name: Real original T3 offline install, native save, cold restart and readback
        if: ${{ !cancelled() && steps.preview-build.outcome == 'success' }}
        working-directory: private/site
        shell: bash
        env:
          IWXA_T3_ORIGINAL_CORE: ${{ github.workspace }}/original-core/packages/t3-core
        run: |
          set -euo pipefail
          node --experimental-strip-types tests/t3/verify-native-offline.mjs > "$RUNNER_TEMP/d06-offline-private.log" 2>&1 || {
            echo D06_T3_NATIVE_OFFLINE_NO_MODEL=FAIL
            grep -E '^D06_T3_OFFLINE_[A-Z0-9_]+=PASS$|^D06_T3_OFFLINE_CONTROL_FACTS=[0-9:]+$' "$RUNNER_TEMP/d06-offline-private.log" || true
            grep -Eo 'D06_T3_[A-Z0-9_]+' "$RUNNER_TEMP/d06-offline-private.log" | sort -u | head -20 || true
            for marker in 'TimeoutError' 'AssertionError' 'strict mode violation' 'toHaveCount' 'toBeVisible' 'toHaveValue' 'toBeEnabled' 'toBeChecked' 'net::ERR' 'TypeError'; do
              if grep -Fq "$marker" "$RUNNER_TEMP/d06-offline-private.log"; then echo "D06_T3_OFFLINE_FAILURE_CLASS=$marker"; fi
            done
            exit 1
          }
          grep -E '^D06_T3_(OFFLINE_[A-Z0-9_]+|NATIVE_OFFLINE_NO_MODEL)=PASS$' "$RUNNER_TEMP/d06-offline-private.log"
      - name: Independent recipient and physical .iwxa transfer with network disabled
        if: ${{ !cancelled() && steps.preview-build.outcome == 'success' }}
        working-directory: private/site
        shell: bash
        env:
          IWXA_T3_ORIGINAL_CORE: ${{ github.workspace }}/original-core/packages/t3-core
        run: |
          set -euo pipefail
          node --experimental-strip-types tests/t3/verify-native-offline.mjs --offline-exchange > "$RUNNER_TEMP/d06-offline-exchange-private.log" 2>&1 || {
            echo D06_T3_OFFLINE_INDEPENDENT_EXCHANGE=FAIL
            grep -E '^D06_T3_OFFLINE_[A-Z0-9_]+=PASS$|^D06_T3_OFFLINE_CONTROL_FACTS=[0-9:]+$' "$RUNNER_TEMP/d06-offline-exchange-private.log" || true
            grep -Eo 'D06_T3_[A-Z0-9_]+' "$RUNNER_TEMP/d06-offline-exchange-private.log" | sort -u | head -20 || true
            for marker in 'TimeoutError' 'AssertionError' 'strict mode violation' 'toHaveCount' 'toBeVisible' 'toHaveValue' 'toBeEnabled' 'toContainText' 'net::ERR' 'TypeError'; do
              if grep -Fq "$marker" "$RUNNER_TEMP/d06-offline-exchange-private.log"; then echo "D06_T3_OFFLINE_EXCHANGE_FAILURE_CLASS=$marker"; fi
            done
            exit 1
          }
          grep -E '^D06_T3_(OFFLINE_[A-Z0-9_]+|NATIVE_OFFLINE_NO_MODEL)=PASS$' "$RUNNER_TEMP/d06-offline-exchange-private.log"
      - name: Run full D06 native Exchange and lifecycle witness at exact T3 origin
        id: native-exchange
        if: ${{ !cancelled() && steps.preview-build.outcome == 'success' }}
        working-directory: private/site
        shell: bash
        env:
          IWXA_T2_CANONICAL_ROOT: ${{ github.workspace }}/original-core/packages/t3-core
        run: |
          set -euo pipefail
          oom_before="$(awk '$1=="oom_kill"{print $2}' /sys/fs/cgroup/memory.events 2>/dev/null || true)"
          DEBUG=pw:browser node --experimental-strip-types scripts/verify-native-transfer.mjs > "$RUNNER_TEMP/d06-t3-native-private.log" 2>&1 || {
            echo D06_T3_INHERITED_NATIVE_EXCHANGE=FAIL
            grep -E '^D06_NATIVE_STAGE=[A-Z0-9_]+$' "$RUNNER_TEMP/d06-t3-native-private.log" | tail -12 || true
            grep -E '^D06_T3_DOWNLOAD_FAILURE=[A-Z0-9_]+:(COMPLETION|BROWSER_FILE|SAVE_AS|BYTE_READBACK):(CANCELED|NO_SPACE|ACCESS|MISSING_FILE|TARGET_CLOSED|TIMEOUT|NETWORK|OTHER)$' "$RUNNER_TEMP/d06-t3-native-private.log" || true
            grep -E '^D06_T3_PORTABLE_(ARCHIVE_BYTES=[0-9]+|OPEN_PAGES=[0-9]+|DOWNLOAD_PAGE_CLOSED=(YES|NO)|DOWNLOAD_LIFECYCLE=(PAGE_CLOSED|PAGE_CRASHED|CONTEXT_CLOSED|BROWSER_DISCONNECTED))$' "$RUNNER_TEMP/d06-t3-native-private.log" || true
            grep -E '^D06_T3_PHYSICAL_DOWNLOAD=(ITEM_HISTORY|BACKUP|PD12_PORTABLE):PASS$' "$RUNNER_TEMP/d06-t3-native-private.log" || true
            grep -E '^D06_T3_PORTABLE_ACTIVATION=(EVENT|CLICK):(PASS|CANCELED|NO_SPACE|ACCESS|MISSING_FILE|TARGET_CLOSED|TIMEOUT|NETWORK|OTHER)$' "$RUNNER_TEMP/d06-t3-native-private.log" || true
            grep -Eo 'D06_[A-Z0-9_]+' "$RUNNER_TEMP/d06-t3-native-private.log" | sort -u | head -40 || true
            grep -Eo 'D06_T3_EXCHANGE_CONSENT_[A-Z0-9_]+' "$RUNNER_TEMP/d06-t3-native-private.log" | sort -u || true
            node --input-type=module - "$RUNNER_TEMP/d06-t3-native-private.log" <<'NODE'
          import {readFileSync} from 'node:fs';
          const body=readFileSync(process.argv[2],'utf8');
          const exits=[...body.matchAll(/<process did exit: exitCode=(-?\d+|null), signal=(SIG[A-Z0-9]+|null)>/g)];
          for(const m of exits.slice(-12)) console.log("D06_T3_BROWSER_EXIT="+m[1]+":"+m[2]);
          const browserFatal=[...body.matchAll(/(?:Out of memory|Received signal (?:6|9|11)|FATAL:|Unable to allocate)/gi)].length;
          console.log("D06_T3_BROWSER_FATAL_MARKERS="+browserFatal);
          // Keep diagnostics inside the private runner. Emit only bounded
          // categories and relative ordering, never browser messages or paths.
          const lines=body.split(/\r?\n/);
          const categories=[
            ["PROFILE_LOCK",/ProcessSingleton|SingletonLock|profile.{0,32}in use/i],
            ["MEMORY",/out of memory|unable to allocate|oom-kill/i],
            ["CRASH_SIGNAL",/received signal (?:6|9|11)|SIG(?:ABRT|SEGV|KILL)/i],
            ["DOWNLOAD",/download_(?:manager|item|file)|download manager/i],
            ["GPU",/GPU process|gpu_process_host/i],
            ["IPC",/bad message|Mojo.{0,32}(?:error|disconnect)/i],
            ["CRASHPAD",/crashpad|crash_reporter/i],
            ["CHECK_FAILED",/check failed:/i],
          ];
          const fatalLines=lines.filter(line=>/FATAL:|Out of memory|Received signal (?:6|9|11)|Unable to allocate/i.test(line));
          for(const [label,pattern] of categories){
            const count=fatalLines.filter(line=>pattern.test(line)).length;
            if(count)console.log("D06_T3_BROWSER_FATAL_CLASS="+label+":"+count);
          }
          const timeline=[];
          for(let i=0;i<lines.length;i++){
            const line=lines[i];
            let marker=null;
            const stage=/^D06_NATIVE_STAGE=(PD12_PORTABLE_[A-Z0-9_]+)$/.exec(line);
            const activity=/^D06_T3_PORTABLE_(?:ACTIVATION|DOWNLOAD_LIFECYCLE|DOWNLOAD_PAGE_CLOSED)=([A-Z_:]+)$/.exec(line);
            if(stage)marker=stage[1];
            else if(activity)marker=activity[1];
            else if(/^D06_T3_DOWNLOAD_FAILURE=PD12_PORTABLE:/.test(line))marker="DOWNLOAD_FAILURE";
            else if(/FATAL:|Out of memory|Received signal (?:6|9|11)|Unable to allocate/i.test(line))marker="BROWSER_FATAL";
            else if(/<gracefully close start>/i.test(line))marker="BROWSER_CLOSE_REQUESTED";
            else if(/<process did exit:/i.test(line))marker="BROWSER_EXIT";
            if(marker)timeline.push([i+1,marker]);
          }
          for(const [index,marker] of timeline.slice(-40))console.log("D06_T3_EXCHANGE_TIMELINE="+index+":"+marker);
          const hits=[...body.matchAll(/(?:scripts\/verify-native-transfer|tests\/t3\/exchange-consent)\.mjs:(\d+):(\d+)/g)];
          for(const m of hits.slice(-8)) console.log("D06_T3_EXCHANGE_COORD="+(m[0].startsWith("scripts/")?"TRANSFER":"CONSENT")+":"+m[1]+":"+m[2]);
          NODE
            oom_after="$(awk '$1=="oom_kill"{print $2}' /sys/fs/cgroup/memory.events 2>/dev/null || true)"
            if [[ "$oom_before" =~ ^[0-9]+$ && "$oom_after" =~ ^[0-9]+$ && "$oom_after" -ge "$oom_before" ]]; then
              echo "D06_T3_BROWSER_OOM_DELTA=$((oom_after-oom_before))"
            fi
            for marker in 'TimeoutError' 'AssertionError' 'strict mode violation' 'toBeVisible' 'toBeDisabled' 'toBeEnabled' 'toBeChecked' 'toHaveAttribute' 'toHaveCount' 'toHaveText' 'Timed out' 'waitForFunction' 'locator.waitFor' 'net::ERR' 'TypeError' 'EADDRINUSE'; do
              if grep -Fq "$marker" "$RUNNER_TEMP/d06-t3-native-private.log"; then echo "D06_T3_EXCHANGE_FAILURE_CLASS=$marker"; fi
            done
            exit 1
          }
          grep -E '^D06_NATIVE_STAGE=[A-Z0-9_]+$' "$RUNNER_TEMP/d06-t3-native-private.log" | tail -12 || true
          for phase in ITEM_HISTORY BACKUP PD12_PORTABLE; do
            grep -Fx "D06_T3_PHYSICAL_DOWNLOAD=$phase:PASS" "$RUNNER_TEMP/d06-t3-native-private.log"
          done
          echo D06_T3_INHERITED_NATIVE_EXCHANGE=PASS
