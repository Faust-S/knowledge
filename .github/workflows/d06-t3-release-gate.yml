              for marker in 'BROWSER_LAUNCH_FAILED' 'BROWSER_NOT_FOUND' 'BROWSER_NAVIGATION_BLOCKED' 'LOCAL_HTTP_BLOCKED' 'BROWSER_JAVASCRIPT_FAILED' 'Rollup failed to resolve import' 'Cannot find package' 'Could not resolve' 'Could not load' 'Could not load config' 'failed to load config' 'missing prerendered pages' 'ERR_UNSUPPORTED_DIR_IMPORT' 'ERR_MODULE_NOT_FOUND' 'Command failed' 'EACCES' 'EISDIR' 'ENOTDIR' 'SIGTERM' 'SIGKILL' 'ReferenceError' 'Hydration failed' 'Minified React error' 'Transform failed'; do
