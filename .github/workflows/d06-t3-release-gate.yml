            grep -Eo 'D06_T3_EXCHANGE_CONSENT_[A-Z0-9_]+' "$RUNNER_TEMP/d06-t3-native-private.log" | sort -u || true
            node --input-type=module - "$RUNNER_TEMP/d06-t3-native-private.log" <<'NODE'
          import {readFileSync} from 'node:fs';
          const body=readFileSync(process.argv[2],'utf8');
          const exits=[...body.matchAll(/<process did exit: exitCode=(-?\d+|null), signal=(SIG[A-Z0-9]+|null)>/g)];
          for(const m of exits.slice(-12)) console.log("D06_T3_BROWSER_EXIT="+m[1]+":"+m[2]);
          const browserFatal=[...body.matchAll(/(?:Out of memory|Received signal (?:6|9|11)|FATAL:|Unable to allocate)/gi)].length;
          console.log("D06_T3_BROWSER_FATAL_MARKERS="+browserFatal);
          // Keep diagnostics inside the private runner. Emit only bounded
          // categories and relative ordering, never browser messages or paths.
          const lines=body.split(/\r?\n/);
          const categories=[
            ["PROFILE_LOCK",/ProcessSingleton|SingletonLock|profile.{0,32}in use/i],
            ["MEMORY",/out of memory|unable to allocate|oom-kill/i],
            ["CRASH_SIGNAL",/received signal (?:6|9|11)|SIG(?:ABRT|SEGV|KILL)/i],
            ["DOWNLOAD",/download_(?:manager|item|file)|download manager/i],
            ["GPU",/GPU process|gpu_process_host/i],
            ["IPC",/bad message|Mojo.{0,32}(?:error|disconnect)/i],
            ["CRASHPAD",/crashpad|crash_reporter/i],
            ["CHECK_FAILED",/check failed:/i],
          ];
          const fatalLines=lines.filter(line=>/FATAL:|Out of memory|Received signal (?:6|9|11)|Unable to allocate/i.test(line));
          for(const [label,pattern] of categories){
            const count=fatalLines.filter(line=>pattern.test(line)).length;
            if(count)console.log("D06_T3_BROWSER_FATAL_CLASS="+label+":"+count);
          }
          const timeline=[];
          for(let i=0;i<lines.length;i++){
            const line=lines[i];
            let marker=null;
            const stage=/^D06_NATIVE_STAGE=(PD12_PORTABLE_[A-Z0-9_]+)$/.exec(line);
            const activity=/^D06_T3_PORTABLE_(?:ACTIVATION|DOWNLOAD_LIFECYCLE|DOWNLOAD_PAGE_CLOSED)=([A-Z_:]+)$/.exec(line);
            if(stage)marker=stage[1];
            else if(activity)marker=activity[1];
            else if(/^D06_T3_DOWNLOAD_FAILURE=PD12_PORTABLE:/.test(line))marker="DOWNLOAD_FAILURE";
            else if(/FATAL:|Out of memory|Received signal (?:6|9|11)|Unable to allocate/i.test(line))marker="BROWSER_FATAL";
            else if(/<gracefully close start>/i.test(line))marker="BROWSER_CLOSE_REQUESTED";
            else if(/<process did exit:/i.test(line))marker="BROWSER_EXIT";
            if(marker)timeline.push([i+1,marker]);
          }
          for(const [index,marker] of timeline.slice(-40))console.log("D06_T3_EXCHANGE_TIMELINE="+index+":"+marker);
          const hits=[...body.matchAll(/(?:scripts\/verify-native-transfer|tests\/t3\/exchange-consent)\.mjs:(\d+):(\d+)/g)];
          for(const m of hits.slice(-8)) console.log("D06_T3_EXCHANGE_COORD="+(m[0].startsWith("scripts/")?"TRANSFER":"CONSENT")+":"+m[1]+":"+m[2]);
          NODE
            oom_after="$(awk '$1=="oom_kill"{print $2}' /sys/fs/cgroup/memory.events 2>/dev/null || true)"
            if [[ "$oom_before" =~ ^[0-9]+$ && "$oom_after" =~ ^[0-9]+$ && "$oom_after" -ge "$oom_before" ]]; then
              echo "D06_T3_BROWSER_OOM_DELTA=$((oom_after-oom_before))"
            fi
            for marker in 'TimeoutError' 'AssertionError' 'strict mode violation' 'toBeVisible' 'toBeDisabled' 'toBeEnabled' 'toBeChecked' 'toHaveAttribute' 'toHaveCount' 'toHaveText' 'Timed out' 'waitForFunction' 'locator.waitFor' 'net::ERR' 'TypeError' 'EADDRINUSE'; do
              if grep -Fq "$marker" "$RUNNER_TEMP/d06-t3-native-private.log"; then echo "D06_T3_EXCHANGE_FAILURE_CLASS=$marker"; fi
            done
            exit 1
          }
          grep -E '^D06_NATIVE_STAGE=[A-Z0-9_]+$' "$RUNNER_TEMP/d06-t3-native-private.log" | tail -12 || true
          for phase in ITEM_HISTORY BACKUP PD12_PORTABLE; do
