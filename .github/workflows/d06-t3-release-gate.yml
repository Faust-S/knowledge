          const b=new Map(read("d06-second-private.json").map(x=>[x.path,x.sha256]));
          const groups=new Map();
          const group=p=>p==="t3-offline-manifest.json"?"OFFLINE_MANIFEST":
            p==="build-info.json"?"BUILD_INFO":p==="sitemap.xml"?"SITEMAP":
