              done
              grep -Eo 'D06_T3_[A-Z0-9_]+|T3_DOMAIN_OFFLINE_[A-Z0-9_]+|T3_D5_MODULE_[A-Z0-9_]+|TS[0-9]{4}' "$RUNNER_TEMP/d06-local-private.log" | sort -u | head -25 || true
