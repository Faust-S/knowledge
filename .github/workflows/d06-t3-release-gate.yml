              }
            }
            groups.set(g,v);
          }
          for(const [g,v] of groups){
            console.log("D06_T3_REBUILD_DIFF_"+g+"="+[v.missing,v.added,v.changed].join(":"));
            for(const [k,n] of Object.entries(v.classified))
