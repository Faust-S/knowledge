name: T3 original Windows DPAPI provider probe
on:
  push:
    branches:
      - work/2026-11-10-t3-t2-activity-projection
    paths:
      - .github/workflows/t3-original-windows-dpapi-probe.yml
      - packages/t3-core/scripts/probe-original-windows-dpapi.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe original Windows PowerShell, identity and DPAPI with synthetic bytes
        run: |
          node --check packages/t3-core/scripts/probe-original-windows-dpapi.mjs
          node packages/t3-core/scripts/probe-original-windows-dpapi.mjs
