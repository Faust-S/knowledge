name: D07 composite service blocks original T2 product
on:
  push:
    branches: [work/2026-11-18-d07-case10-qualification]
    paths: [.github/workflows/d07-composite-service-blocks.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-latest]
    env:
      SITE_SHA: d8d72b55712143dbde76f54ea7c04c9bc60dfbd5
      SUBJECT_SHA: 068d978a2b8cb7ce57c363804f22b7dd85063eee
      T2_SHA: e70de29b72b83e2546f7ab74b17572685a728c17
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      CI: 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Confirm private source access without printing secrets
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:GH_TOKEN)){throw 'D07_PRIVATE_ACCESS_NOT_CONFIGURED'}
          foreach($repo in @('Faust-S/uslugovod.ru','Faust-S/uslugovod','Faust-S/T2')){
            $null=& gh api "repos/$repo" --jq '.id' 2>$null
            if($LASTEXITCODE -ne 0){throw 'D07_PRIVATE_REPO_ACCESS_DENIED'}
          }
          git config --global core.autocrlf false
          git config --global core.eol lf
          Write-Output 'D07_SOURCE_ACCESS=PASS'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: ${{ env.SITE_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod
          ref: ${{ env.SUBJECT_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: subject
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: ${{ env.T2_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: t2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Verify exact canonical source parity without printing source
        run: |
          if((git -C site rev-parse HEAD).Trim() -ne $env:SITE_SHA){throw 'D07_SITE_SHA_MISMATCH'}
          if((git -C subject rev-parse HEAD).Trim() -ne $env:SUBJECT_SHA){throw 'D07_SUBJECT_SHA_MISMATCH'}
          if((git -C t2 rev-parse HEAD).Trim() -ne $env:T2_SHA){throw 'D07_T2_SHA_MISMATCH'}
          foreach($name in @('service-blocks.ts','service-execution.ts','service-changes.ts','service-plan-templates.ts','service-settlement.ts','service-aftercare.ts','service-regular.ts','service-links.ts','service-attention.ts','service-month-report.ts','service-commitments.ts','service-quality.ts')){
            $a=(Get-FileHash (Join-Path 'subject/src/domain' $name) -Algorithm SHA256).Hash
            $b=(Get-FileHash (Join-Path 'site/src/domain' $name) -Algorithm SHA256).Hash
            $c=(Get-FileHash (Join-Path 'site/t2-site-module/uslugovod' $name) -Algorithm SHA256).Hash
            if($a -ne $b -or $a -ne $c){throw 'D07_SERVICE_MODEL_SOURCE_DRIFT'}
          }
          Write-Output 'D07_CANONICAL_DOMAIN_TO_T2_PARITY=PASS'
      - name: Install exact site dependencies
        working-directory: site
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'd07-blocks-install.private.log'
          & bun install --frozen-lockfile *> $log
          if($LASTEXITCODE -ne 0){throw 'D07_BLOCKS_INSTALL_FAIL'}
          Write-Output 'D07_BLOCKS_INSTALL=PASS'
      - name: Test new composite model and legacy order compatibility
        working-directory: site
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'd07-blocks-tests.private.log'
          & node --import tsx --test --test-reporter=tap scripts/tests/d07-service-blocks.test.mjs scripts/tests/d07-service-execution.test.mjs scripts/tests/d07-service-plan-templates.test.mjs scripts/tests/d07-service-settlement.test.mjs scripts/tests/d07-service-aftercare.test.mjs scripts/tests/d07-service-regular.test.mjs scripts/tests/d07-service-correction-history.test.mjs ../subject/tests/service-correction-history.test.mjs scripts/tests/d07-composite-service-journey.test.mjs scripts/tests/d07-service-links.test.mjs scripts/tests/d07-service-attention.test.mjs scripts/tests/d07-service-month-report.test.mjs scripts/tests/d07-service-commitments.test.mjs scripts/tests/d07-service-quality.test.mjs ../subject/tests/service-quality.test.mjs scripts/tests/d07-host-module-tsx-parse.test.mjs *> $log
          if($LASTEXITCODE -ne 0){
            $failed=@(Get-Content $log -ErrorAction SilentlyContinue |
              Where-Object {$_ -match '^not ok [0-9]+ - '})
            foreach($line in $failed | Select-Object -First 20){
              $name=$line -replace '^not ok [0-9]+ - ',''
              Write-Output ('D07_EXECUTION_TEST_FAILURE='+$name)
            }
            foreach($line in @(Get-Content $log -ErrorAction SilentlyContinue |
              Where-Object {$_ -match 'D07_STAGED_SOURCE_PARSE_FAILURE='} | Select-Object -First 20)){
              if($line -match '(D07_STAGED_SOURCE_PARSE_FAILURE=[a-zA-Z0-9_.-]+:[0-9]+:[0-9]+)'){
                Write-Output $Matches[1]
              }
            }
            throw 'D07_BLOCKS_DOMAIN_TESTS_FAIL'
          }
          Write-Output 'D07_BLOCKS_DOMAIN_TESTS=PASS'
      - name: Check TypeScript and original T2 Host integration
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'd07-blocks-types.private.log'
          & bun run check:types *> $log
          if($LASTEXITCODE -ne 0){
            # No source text, contents or private diagnostics are published.
            # Only relative module basename, line and TS diagnostic code.
            $issues=@(Get-Content $log -ErrorAction SilentlyContinue |
              Where-Object { $_ -match 'TS[0-9]{4}' })
            Write-Output ('D07_TYPE_ISSUE_COUNT='+$issues.Count)
            foreach($issue in $issues | Select-Object -First 25){
              $code=([regex]::Match($issue,'TS[0-9]{4}')).Value
              $path=([regex]::Match($issue,'[a-zA-Z0-9_.-]+[.]tsx?')).Value
              $position=([regex]::Match($issue,'\\([0-9]+,[0-9]+\\)|:[0-9]+:[0-9]+')).Value
              Write-Output ('D07_TYPE_ISSUE='+$path+$position+':'+$code)
            }
            throw 'D07_BLOCKS_TYPES_FAIL'
          }
          Write-Output 'D07_BLOCKS_TYPES=PASS'
          $log=Join-Path $env:RUNNER_TEMP 'd07-blocks-build.private.log'
          & bun run build:t2-integrated *> $log
          if($LASTEXITCODE -ne 0){
            # Never publish source, secrets, complete paths, stack traces or build logs.
            $matches=@()
            foreach($line in @(Get-Content $log -ErrorAction SilentlyContinue)){
              foreach($candidate in [regex]::Matches($line,'D07_[A-Z0-9_]+|T2_[A-Z0-9_]+|TS[0-9]{4}|ERR_[A-Z0-9_]+|(?:MODULE_NOT_FOUND|ENOENT|EACCES|ENOMEM|ETIMEDOUT|EPERM)')){
                $matches+=($candidate.Value)
              }
            }
            $codes=@($matches|Sort-Object -Unique|Select-Object -First 25)
            Write-Output ('D07_BUILD_DIAGNOSTIC_CODES='+($codes -join ','))
            $knownFiles=@(Get-Content $log -ErrorAction SilentlyContinue |
              ForEach-Object {
                foreach($m in [regex]::Matches($_,'(?i)(?:ServiceAftercarePanel|ServiceSettlementPanel|UslugovodWorkspace|OrderViewer|service-aftercare|service-settlement|service-blocks|service-execution|service-changes|service-plan-templates)[.]tsx?')){
                  $m.Value
                }
              } | Sort-Object -Unique)
            $categories=@()
            foreach($line in @(Get-Content $log -ErrorAction SilentlyContinue)){
              if($line -match '(?i)(Failed to resolve import|Could not resolve|MODULE_NOT_FOUND|ERR_MODULE_NOT_FOUND)'){$categories+='UNRESOLVED_IMPORT'}
              if($line -match '(?i)(Expected .+ but found|Unexpected token|SyntaxError|Unterminated|Parse error)'){$categories+='SYNTAX'}
              if($line -match '(?i)(No matching export|not exported by)'){$categories+='EXPORT_MISMATCH'}
              if($line -match '(?i)(TS[0-9]{4})'){$categories+=$Matches[1]}
              if($line -match '(?i)(ENOMEM|out of memory|allocation failed)'){$categories+='MEMORY'}
              if($line -match '(?i)(EPERM|EACCES|permission denied|ENOENT)'){$categories+='FILE_IO'}
              if($line -match '(?i)(vite build failed|error during build|Build failed)'){$categories+='BUILD_FAILED'}
            }
            Write-Output ('D07_BUILD_COMPONENT_HINTS='+($knownFiles -join ','))
            Write-Output ('D07_BUILD_FAILURE_CATEGORIES='+((@($categories|Sort-Object -Unique|Select-Object -First 20)) -join ','))
            # Whitelist only component basenames, line/column and TypeScript diagnostics.
            $locations=@()
            foreach($line in @(Get-Content $log -ErrorAction SilentlyContinue)){
              foreach($m in [regex]::Matches($line,'(?i)(ServiceAftercarePanel|ServiceSettlementPanel|UslugovodWorkspace|OrderViewer|service-aftercare|service-settlement|order-model)[.]tsx?(?:[:(]([0-9]+)[,:]([0-9]+)[)]?)?')){
                $item=$m.Groups[1].Value
                if($m.Groups[2].Success){$item+=':'+ $m.Groups[2].Value +':'+$m.Groups[3].Value}
                $diagnostic=[regex]::Match($line,'TS[0-9]{4}')
                if($diagnostic.Success){$item+=':'+ $diagnostic.Value}
                $locations+=$item
              }
            }
            Write-Output ('D07_BUILD_COMPONENT_LOCATIONS='+((@($locations|Sort-Object -Unique|Select-Object -First 20)) -join ','))

            throw 'D07_BLOCKS_ORIGINAL_T2_BUILD_FAIL'
          }
          if(!(Test-Path dist/workspace/index.html)){throw 'D07_BLOCKS_HOST_MISSING'}
          Write-Output 'D07_BLOCKS_ORIGINAL_T2_INTEGRATED_BUILD=PASS'
      - name: Verify exact Apache hosting inventory before Codex release build
        working-directory: site
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'd07-hosting-inventory.private.log'
          & node scripts/audit-d07-hosting-package.mjs *> $log
          if($LASTEXITCODE -ne 0){
            $codes=@(Get-Content $log -ErrorAction SilentlyContinue |
              ForEach-Object {
                $match=[regex]::Match($_,'D07_HOSTING_[A-Z0-9_]+')
                if($match.Success){$match.Value}
              } | Sort-Object -Unique | Select-Object -First 15)
            Write-Output ('D07_HOSTING_AUDIT_CODES='+($codes -join ','))
            throw 'D07_HOSTING_PACKAGE_AUDIT_FAIL'
          }
          Write-Output 'D07_HOSTING_PACKAGE_AUDIT=PASS'
      - name: Test existing product-first and service-lifecycle regression
        working-directory: site
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'd07-blocks-product-tests.private.log'
          & bun run test:product-first *> $log
          if($LASTEXITCODE -ne 0){throw 'D07_BLOCKS_PRODUCT_REGRESSION_FAIL'}
          Write-Output 'D07_BLOCKS_PRODUCT_REGRESSION=PASS'
      # Private checkout, archive bytes, dist, test logs and browser profiles
      # remain inside the ephemeral runner; no upload-artifact steps.
