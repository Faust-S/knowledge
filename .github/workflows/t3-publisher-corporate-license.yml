name: T3 Publisher corporate license original Access qualification
on:
  push:
    branches:
      - work/2026-11-22-t3-corporate-license-publisher
    paths:
      - packages/t3-core/src/t3/access/corporate-product-license.mjs
      - packages/t3-core/tests/t3-corporate-product-license.test.mjs
      - packages/t3-core/src/t3/access/corporate-product-issuance.mjs
      - packages/t3-core/tests/t3-corporate-product-issuance.test.mjs
      - packages/t3-core/src/t3/publisher-license-handoff.mjs
      - packages/t3-core/tests/t3-d7-publisher-handoff.test.mjs
      - packages/t3-core/tests/t3-corporate-original-d7-interop.test.mjs
      - .github/workflows/t3-publisher-corporate-license.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t3-publisher-corporate-license-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-access-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate exact original T3 corporate source syntax
        run: node --check packages/t3-core/src/t3/access/corporate-product-license.mjs
      - name: Exercise original Ed25519 corporate LICENSE and independent STATUS
        run: node --test packages/t3-core/tests/t3-corporate-product-license.test.mjs
      - name: Test corporate licence durable ISSUE using original ledger, signed bytes and CAS
        run: node --test packages/t3-core/tests/t3-corporate-product-issuance.test.mjs
      - name: Verify D7 original holder accepts corporate STATUS/3 without activating rights
        run: node --test packages/t3-core/tests/t3-d7-publisher-handoff.test.mjs
      - name: Verify real original Ed25519 corporate LICENSE/STATUS crossing D7 source owner
        run: node --test packages/t3-core/tests/t3-corporate-original-d7-interop.test.mjs
      - name: Recheck original two-company signed Access without new IAM
        run: node --test packages/t3-core/tests/t3-d1-two-corporate-original-access.test.mjs
