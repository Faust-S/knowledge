          fi
          exit "$result"
      - name: Real CASE-008 geo-experiment and native CPL browser journey
        shell: bash
        run: |
          set +e
          cd site
          node scripts/tests/d10-case008-browser-smoke.mjs > "$RUNNER_TEMP/d10-case008-browser.log" 2>&1
          result=$?
          grep -E '^D10_CASE008_BROWSER_' "$RUNNER_TEMP/d10-case008-browser.log" || true
          if [ "$result" -eq 0 ]; then
            echo "D10_CASE008_BROWSER=PASS"
          else
            echo "::error::D10_CASE008_BROWSER=FAIL exit=$result"
            grep -E '^(Error|AssertionError|TypeError|TimeoutError):' "$RUNNER_TEMP/d10-case008-browser.log" | head -n 3 || true
          fi
          exit "$result"
      - name: Real CASE-009 B2B sales discipline article and funnel service
        shell: bash
        run: |
          set +e
          cd site
          node scripts/tests/d10-case009-browser-smoke.mjs > "$RUNNER_TEMP/d10-case009-browser.log" 2>&1
          result=$?
          grep -E '^D10_CASE009_BROWSER_' "$RUNNER_TEMP/d10-case009-browser.log" || true
          if [ "$result" -eq 0 ]; then
            echo "D10_CASE009_BROWSER=PASS"
          else
            echo "::error::D10_CASE009_BROWSER=FAIL exit=$result"
            grep -E '^(Error|AssertionError|SyntaxError|TypeError|TimeoutError):' "$RUNNER_TEMP/d10-case009-browser.log" | head -n 3 || true
          fi
          exit "$result"
      - name: Real CASE-010 Vesper quote economics and native CPL browser journey
        shell: bash
        run: |
          set +e
          cd site
          node scripts/tests/d10-case010-browser-smoke.mjs > "$RUNNER_TEMP/d10-case010-browser.log" 2>&1
          result=$?
          grep -E '^D10_CASE010_BROWSER_' "$RUNNER_TEMP/d10-case010-browser.log" || true
          if [ "$result" -eq 0 ]; then
            echo "D10_CASE010_BROWSER=PASS"
          else
            echo "::error::D10_CASE010_BROWSER=FAIL exit=$result"
            grep -E '^(Error|AssertionError|SyntaxError|TypeError|TimeoutError):' "$RUNNER_TEMP/d10-case010-browser.log" | head -n 3 || true
          fi
          exit "$result"
      - name: Mounted T2 Workspace commercial review scoping
        shell: bash
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
          ARTBAZI_LOCAL_PREVIEW_ORIGIN: http://127.0.0.1:4342
        run: |
          # Previous step already verified the standard integrated dist.
          # Make a separate disposable loopback qualification build; do not publish it.
          set +e
          preview_dir="$RUNNER_TEMP/d10-host-loopback"
          expected_head="$(git -C site rev-parse HEAD)"
          # Separate clean worktree: the first integrated builder generates
          # site-side build outputs; never weaken its checkout-clean gate.
          git -C site worktree add --detach "$preview_dir" "$expected_head" > "$RUNNER_TEMP/d10-worktree.log" 2>&1
          worktree_result=$?
          if [ "$worktree_result" -ne 0 ]; then
            echo "::error::D10_REVIEW_CLEAN_WORKTREE=FAIL"
            exit "$worktree_result"
          fi
          ln -s "$GITHUB_WORKSPACE/site/node_modules" "$preview_dir/node_modules"
          cd "$preview_dir"
          npm run build:t2:site > "$RUNNER_TEMP/d10-review-preview-build.log" 2>&1
          build_result=$?
          if [ "$build_result" -ne 0 ]; then
            echo "::error::D10_REVIEW_LOCAL_PREVIEW_BUILD=FAIL"
            # Only stable error codes; never print private source or build output.
            grep -Eo 'ARTBAZI_[A-Z0-9_]+|TS[0-9]+' "$RUNNER_TEMP/d10-review-preview-build.log" | sort -u | head -n 16 | sed 's/^/D10_PREVIEW_ERROR_CODE=/' || true
            exit "$build_result"
          fi
          echo "D10_REVIEW_LOCAL_PREVIEW_BUILD=PASS"
          node scripts/tests/d10-commercial-review-browser-smoke.mjs > "$RUNNER_TEMP/d10-review-browser.log" 2>&1
          result=$?
          grep -E '^D10_REVIEW_' "$RUNNER_TEMP/d10-review-browser.log" || true
          if [ "$result" -eq 0 ]; then
            echo "D10_REVIEW_WORKSPACE_BROWSER=PASS"
          else
            echo "::error::D10_REVIEW_WORKSPACE_BROWSER=FAIL exit=$result"
            grep -E '^(Error|AssertionError|TimeoutError|TypeError):' "$RUNNER_TEMP/d10-review-browser.log" | head -n 4 || true
          fi
          exit "$result"
      - name: Real CASE-008 native Promotion Kernel campaign and read-only experiment
        shell: bash
        run: |
          set +e
          cd "$RUNNER_TEMP/d10-host-loopback"
          node scripts/tests/d10-case008-promotion-kernel-browser.mjs > "$RUNNER_TEMP/d10-case008-promotion.log" 2>&1
          result=$?
