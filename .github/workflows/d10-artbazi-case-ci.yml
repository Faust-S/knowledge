name: D10 ArtBazi private-source product qualification
on:
  push:
    branches:
      - work/2026-11-18-d10-case-ci
    paths:
      - .github/workflows/d10-artbazi-case-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d10-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout public orchestration
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout D10 site source (no publishing)
        uses: actions/checkout@v4
        with:
          repository: Faust-S/artbazi.ru
          ref: 6d3fb34e9f6ae99f79ae1df191ff6d8dccff785f
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - name: Checkout canonical domain source (no publishing)
        uses: actions/checkout@v4
        with:
          repository: Faust-S/artbazi
          ref: c786166495ce880bd2ebf9543e31eb3e7f114b95
          token: ${{ secrets.DOMEN }}
          path: domain
          persist-credentials: false
      - name: Checkout normative T2
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: e70de29b72b83e2546f7ab74b17572685a728c17
          token: ${{ secrets.DOMEN }}
          path: t2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Domain CASE-001-010 semantic regressions
        shell: bash
        run: |
          set +e
          cd domain
          npm install --no-save --no-package-lock --ignore-scripts > "$RUNNER_TEMP/d10-domain-install.log" 2>&1
          install_result=$?
          if [ "$install_result" -ne 0 ]; then echo "::error::D10_DOMAIN_DEPENDENCIES=FAIL"; exit "$install_result"; fi
          npm run test:d10:cases > "$RUNNER_TEMP/d10-domain.log" 2>&1
          result=$?
          if [ "$result" -eq 0 ]; then echo "D10_DOMAIN_CASES=PASS"; else echo "::error::D10_DOMAIN_CASES=FAIL exit=$result"; grep -E "^(not ok |# (tests|pass|fail|cancelled))" "$RUNNER_TEMP/d10-domain.log" | head -n 30 || true; fi
          exit "$result"
      - name: Frozen site dependencies
        shell: bash
        run: |
          set +e
          cd site
          bun install --frozen-lockfile > "$RUNNER_TEMP/d10-install.log" 2>&1
          result=$?
          if [ "$result" -eq 0 ]; then echo "D10_INSTALL=PASS"; else echo "::error::D10_INSTALL=FAIL exit=$result"; fi
          exit "$result"
      - name: Existing specialist Sales workflows and seller package regression
        shell: bash
        run: |
          # Execute the exact tracked sales:test chain, exposing only the stage
          # number, never private source, source paths, failing assertions or data.
          set +e
          cd site
          mapfile -t cmds < <(node -e 'const p=require("./package.json"); const x=p.scripts["sales:test"]; if(!x)process.exit(2); console.log(x.split(" && ").join("\n"))')
          if [ "${#cmds[@]}" -lt 15 ]; then echo "::error::D10_SALES_CHAIN_INCOMPLETE"; exit 1; fi
          for i in "${!cmds[@]}"; do
            bash -c "${cmds[$i]}" > "$RUNNER_TEMP/d10-sales-stage-$i.log" 2>&1
            result=$?
            if [ "$result" -ne 0 ]; then
              echo "::error::D10_SALES_STAGE_FAILED_INDEX=$i exit=$result"
              if [ "$i" -eq 0 ]; then
                # The source scanner returns JSON. Publish only relative paths
                # and error classes, not offending code, snippets or source map.
                node - "$RUNNER_TEMP/d10-sales-stage-$i.log" <<'NODE'
          const fs=require("node:fs");
          const log=fs.readFileSync(process.argv[2],"utf8");
          const start=log.indexOf('{\n  "ok"');
          try {
            const parsed=JSON.parse(log.slice(start));
            const errors=[...(parsed.errors??[]),...(parsed.stagedT2Domain?.errors??[])];
            console.log("D10_SALES_SOURCE_ERRORS="+errors.length);
            for(const e of errors.slice(0,10)){
              console.log("D10_SALES_SOURCE_FILE="+String(e.file??"unknown").replace(/[^a-zA-Z0-9_.\\/-]/g,"_"));
              console.log("D10_SALES_SOURCE_CLASS="+(String(e.message).startsWith("Missing export")?"MISSING_EXPORT":
                String(e.message).startsWith("Missing local module")?"MISSING_MODULE":"SYNTAX_OR_OTHER"));
            }
          }catch{console.log("D10_SALES_SOURCE_ERROR_CLASS=OUTPUT_UNPARSEABLE")}
          NODE
              fi
              echo "::error::D10_SALES_FUNCTIONAL_REGRESSION=FAIL"
              exit "$result"
            fi
            echo "D10_SALES_STAGE_$i=PASS"
          done
          echo "D10_SALES_FUNCTIONAL_REGRESSION=PASS"
      - name: Site source, Group E, Host, types
        shell: bash
        run: |
          set -e
          cd site
          for gate in check:commercial check:crm check:t2-host-route check:group-e check:types; do
            label="${gate//:/_}"
            if npm run "$gate" > "$RUNNER_TEMP/d10-$label.log" 2>&1; then
              echo "D10_$label=PASS"
            else
              echo "::error::D10_$label=FAIL"
              # Only test names and TypeScript error identifiers: no code or fixture output.
              grep -E '^(not ok |# (tests|pass|fail|cancelled))' "$RUNNER_TEMP/d10-$label.log" | head -n 35 || true
              grep -E 'error TS[0-9]+:' "$RUNNER_TEMP/d10-$label.log" | sed -E 's/: error TS([0-9]+):.*/: TS\1/' | head -n 12 || true
              grep -Eo 'TS[0-9]+' "$RUNNER_TEMP/d10-$label.log" | sort -u | head -n 15 | sed 's/^/D10_TYPESCRIPT_CODE=/' || true
              exit 1
            fi
          done
      - name: Reproduce integrated T2 site in one dist
        shell: bash
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
        run: |
          set +e
          cd site
          npm run build > "$RUNNER_TEMP/d10-build.log" 2>&1
          result=$?
          if [ "$result" -eq 0 ] && [ -d dist ]; then
            echo "D10_INTEGRATED_DIST=PASS"
          else
            echo "::error::D10_INTEGRATED_DIST=FAIL exit=$result"
            # Stable stage and diagnostic categories only; never expose source,
            # private paths, stack traces or a full build log.
            grep -Eo 'ARTBAZI_SITE_T2_[A-Z0-9_]+|error TS[0-9]+:|D10_WINDOWS_BUILD_PHASE=[A-Z_]+' "$RUNNER_TEMP/d10-build.log" |
              sort -u | head -n 16 | sed 's/^/D10_BUILD_DIAGNOSTIC=/' || true
            if grep -q 'error TS[0-9][0-9]*:' "$RUNNER_TEMP/d10-build.log"; then
              echo "D10_BUILD_FAILURE_CLASS=TYPESCRIPT"
            elif grep -q -E 'Cannot find module|Module not found' "$RUNNER_TEMP/d10-build.log"; then
              echo "D10_BUILD_FAILURE_CLASS=MISSING_MODULE"
            elif grep -q -E 'Error:|Build failed' "$RUNNER_TEMP/d10-build.log"; then
              echo "D10_BUILD_FAILURE_CLASS=BUILD_ERROR"
            else
              echo "D10_BUILD_FAILURE_CLASS=UNKNOWN"
            fi
            exit 1
          fi
      - name: Verify hosting candidate is the original T2 static product
        shell: bash
        run: |
          set -e
          cd site
          if node scripts/check-d10-hosting-release.mjs > "$RUNNER_TEMP/d10-release-inventory.log" 2>&1; then
            echo "D10_HOSTING_INVENTORY=PASS"
          else
            echo "::error::D10_HOSTING_INVENTORY=FAIL"
            grep -Eo 'D10_HOSTING_[A-Z0-9_]+' "$RUNNER_TEMP/d10-release-inventory.log" | sort -u | head -n 5 || true
            exit 1
          fi
          for gate in check:no-localhost check:assets check:external-assets check:links check:seo check:htaccess; do
            label="${gate//:/_}"
            if npm run "$gate" > "$RUNNER_TEMP/d10-host-${label}.log" 2>&1; then
              echo "D10_HOSTING_${label}=PASS"
            else
              echo "::error::D10_HOSTING_${label}=FAIL"
              exit 1
            fi
          done
          echo "D10_HOSTING_RELEASE_STATIC_GATES=PASS"
      - name: Real browser case and public service smoke
        shell: bash
        run: |
          set +e
          cd site
          node scripts/tests/d10-case004-browser-smoke.mjs > "$RUNNER_TEMP/d10-browser.log" 2>&1
          result=$?
          grep -E '^D10_' "$RUNNER_TEMP/d10-browser.log" || true
          grep -E '^D10_' "$RUNNER_TEMP/d10-browser.log" || true
          if [ "$result" -eq 0 ]; then
            echo "D10_BROWSER_TARGETED=PASS"
          else
            echo "::error::D10_BROWSER_TARGETED=FAIL exit=$result"
            grep -E '^(Error|AssertionError|TypeError|TimeoutError):' "$RUNNER_TEMP/d10-browser.log" | head -n 3 || true
          fi
          exit "$result"
      - name: All 23 public services real input result and T2 handoff review
        shell: bash
        run: |
          set +e
          cd site
          node scripts/tests/d10-public-23-journey-browser.mjs > "$RUNNER_TEMP/d10-public-journeys.log" 2>&1
          result=$?
          grep -E '^D10_PUBLIC_JOURNEY_' "$RUNNER_TEMP/d10-public-journeys.log" || true
          if [ "$result" -eq 0 ]; then
            echo "D10_PUBLIC_23_BROWSER=PASS"
          else
            echo "::error::D10_PUBLIC_23_BROWSER=FAIL exit=$result"
            # Synthetic service IDs and stage only. Never log private sources or DOM values.
          fi
          exit "$result"
      - name: Real browser delayed attribution and native payback case
        shell: bash
        run: |
          set +e
          cd site
          node scripts/tests/d10-case005-browser-smoke.mjs > "$RUNNER_TEMP/d10-case005-browser.log" 2>&1
          result=$?
          grep -E '^D10_CASE005_' "$RUNNER_TEMP/d10-case005-browser.log" || true
          if [ "$result" -eq 0 ]; then
            echo "D10_CASE005_BROWSER=PASS"
          else
            echo "::error::D10_CASE005_BROWSER=FAIL exit=$result"
            # Error classes only, not private source, stack traces or DOM values.
            grep -E '^(Error|AssertionError|SyntaxError|TypeError|TimeoutError|ReferenceError|RangeError):' "$RUNNER_TEMP/d10-case005-browser.log" | head -n 4 || true
            if grep -q '^Node.js' "$RUNNER_TEMP/d10-case005-browser.log"; then echo "D10_CASE005_NODE_EXIT=FAIL"; fi
          fi
          exit "$result"
      - name: Real browser seasonal budget and ad-load case
        shell: bash
        run: |
          set +e
          cd site
          node scripts/tests/d10-case006-browser-smoke.mjs > "$RUNNER_TEMP/d10-case006-browser.log" 2>&1
          result=$?
          grep -E '^D10_CASE006_' "$RUNNER_TEMP/d10-case006-browser.log" || true
          if [ "$result" -eq 0 ]; then
            echo "D10_CASE006_BROWSER=PASS"
          else
            echo "::error::D10_CASE006_BROWSER=FAIL exit=$result"
