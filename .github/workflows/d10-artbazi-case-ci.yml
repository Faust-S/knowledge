      - name: Require both independent qualifications
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.cold.outcome }}" != "success" ] ||
             [ "${{ steps.multi.outcome }}" != "success" ]; then
            echo "::error::D10_HOST_OR_EXCHANGE_QUALIFICATION_INCOMPLETE"
            exit 1
          fi
          echo "D10_HOST_AND_MULTI_IWXA=PASS"
      - name: Inspect artifact without publishing private bytes
        shell: bash
        run: |
          test -d site/dist
          echo "D10_PRIVATE_DIST_EXISTENCE=PASS"
          echo "D10_PRIVATE_CODE_AND_DIST_ARTIFACTS=NOT_PUBLISHED"
