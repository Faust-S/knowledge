          fi
          exit "$result"
      - name: Real browser Rebel Aromas retention and repeat payback case
        shell: bash
        run: |
          set +e
          cd site
          node scripts/tests/d10-case007-browser-smoke.mjs > "$RUNNER_TEMP/d10-case007-browser.log" 2>&1
          result=$?
          grep -E '^D10_CASE007_' "$RUNNER_TEMP/d10-case007-browser.log" || true
          if [ "$result" -eq 0 ]; then
