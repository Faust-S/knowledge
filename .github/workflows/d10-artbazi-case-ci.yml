name: D10 ArtBazi private-source product qualification
on:
  push:
    branches:
      - work/2026-11-18-d10-case-ci
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d10-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout public orchestration
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout D10 site source (no publishing)
        uses: actions/checkout@v4
        with:
          repository: Faust-S/artbazi.ru
          ref: aeb9e8d1dfd638ad93ac6ed6f0a02e753ef13d62
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - name: Checkout canonical domain source (no publishing)
        uses: actions/checkout@v4
        with:
          repository: Faust-S/artbazi
          ref: a30e72d6e4ddf877c14b046947b97c78f8ce1e3c
          token: ${{ secrets.DOMEN }}
          path: domain
          persist-credentials: false
      - name: Checkout normative T2
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: e70de29b72b83e2546f7ab74b17572685a728c17
          token: ${{ secrets.DOMEN }}
          path: t2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
      - name: Domain CASE-001-007 semantic regressions
        shell: bash
        run: |
          set +e
          cd domain
          npm install --no-save --no-package-lock --ignore-scripts > "$RUNNER_TEMP/d10-domain-install.log" 2>&1
          install_result=$?
          if [ "$install_result" -ne 0 ]; then echo "::error::D10_DOMAIN_DEPENDENCIES=FAIL"; exit "$install_result"; fi
          npm run test:d10:cases > "$RUNNER_TEMP/d10-domain.log" 2>&1
          result=$?
          if [ "$result" -eq 0 ]; then echo "D10_DOMAIN_CASES=PASS"; else echo "::error::D10_DOMAIN_CASES=FAIL exit=$result"; grep -E "^(not ok |# (tests|pass|fail|cancelled))" "$RUNNER_TEMP/d10-domain.log" | head -n 30 || true; fi
          exit "$result"
      - name: Frozen site dependencies
        shell: bash
        run: |
          set +e
          cd site
          bun install --frozen-lockfile > "$RUNNER_TEMP/d10-install.log" 2>&1
          result=$?
          if [ "$result" -eq 0 ]; then echo "D10_INSTALL=PASS"; else echo "::error::D10_INSTALL=FAIL exit=$result"; fi
          exit "$result"
      - name: Site source, Group E, Host, types
        shell: bash
        run: |
          set -e
          cd site
          for gate in check:commercial check:crm check:t2-host-route check:group-e check:types; do
            label="${gate//:/_}"
            if npm run "$gate" > "$RUNNER_TEMP/d10-$label.log" 2>&1; then
              echo "D10_$label=PASS"
            else
              echo "::error::D10_$label=FAIL"
              # Only test names and TypeScript error identifiers: no code or fixture output.
              grep -E '^(not ok |# (tests|pass|fail|cancelled))' "$RUNNER_TEMP/d10-$label.log" | head -n 35 || true
              grep -E 'error TS[0-9]+:' "$RUNNER_TEMP/d10-$label.log" | sed -E 's/: error TS([0-9]+):.*/: TS\1/' | head -n 12 || true
              grep -Eo 'TS[0-9]+' "$RUNNER_TEMP/d10-$label.log" | sort -u | head -n 15 | sed 's/^/D10_TYPESCRIPT_CODE=/' || true
              exit 1
            fi
          done
      - name: Reproduce integrated T2 site in one dist
        shell: bash
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
        run: |
          set +e
          cd site
          npm run build:t2:site > "$RUNNER_TEMP/d10-build.log" 2>&1
          result=$?
          if [ "$result" -eq 0 ] && [ -d dist ]; then
            echo "D10_INTEGRATED_DIST=PASS"
          else
            echo "::error::D10_INTEGRATED_DIST=FAIL exit=$result"
            exit 1
          fi
      - name: Real browser case and public service smoke
        shell: bash
        run: |
          set +e
          cd site
          node scripts/tests/d10-case004-browser-smoke.mjs > "$RUNNER_TEMP/d10-browser.log" 2>&1
          result=$?
          grep -E '^D10_' "$RUNNER_TEMP/d10-browser.log" || true
          if [ "$result" -eq 0 ]; then
            echo "D10_BROWSER_TARGETED=PASS"
          else
            echo "::error::D10_BROWSER_TARGETED=FAIL exit=$result"
          fi
          exit "$result"
      - name: All 23 public services real input result and T2 handoff review
        shell: bash
        run: |
          set +e
          cd site
          node scripts/tests/d10-public-23-journey-browser.mjs > "$RUNNER_TEMP/d10-public-journeys.log" 2>&1
          result=$?
          grep -E '^D10_PUBLIC_JOURNEY_' "$RUNNER_TEMP/d10-public-journeys.log" || true
          if [ "$result" -eq 0 ]; then
            echo "D10_PUBLIC_23_BROWSER=PASS"
          else
            echo "::error::D10_PUBLIC_23_BROWSER=FAIL exit=$result"
            # Synthetic service IDs and stage only. Never log private sources or DOM values.
          fi
          exit "$result"
      - name: Real browser delayed attribution and native payback case
        shell: bash
        run: |
          set +e
          cd site
          node scripts/tests/d10-case005-browser-smoke.mjs > "$RUNNER_TEMP/d10-case005-browser.log" 2>&1
          result=$?
          grep -E '^D10_CASE005_' "$RUNNER_TEMP/d10-case005-browser.log" || true
          if [ "$result" -eq 0 ]; then
            echo "D10_CASE005_BROWSER=PASS"
          else
            echo "::error::D10_CASE005_BROWSER=FAIL exit=$result"
            # Error classes only, not private source, stack traces or DOM values.
            grep -E '^(Error|AssertionError|SyntaxError|TypeError|TimeoutError|ReferenceError|RangeError):' "$RUNNER_TEMP/d10-case005-browser.log" | head -n 4 || true
            if grep -q '^Node.js' "$RUNNER_TEMP/d10-case005-browser.log"; then echo "D10_CASE005_NODE_EXIT=FAIL"; fi
          fi
          exit "$result"
      - name: Real browser seasonal budget and ad-load case
        shell: bash
        run: |
          set +e
          cd site
          node scripts/tests/d10-case006-browser-smoke.mjs > "$RUNNER_TEMP/d10-case006-browser.log" 2>&1
          result=$?
          grep -E '^D10_CASE006_' "$RUNNER_TEMP/d10-case006-browser.log" || true
          if [ "$result" -eq 0 ]; then
            echo "D10_CASE006_BROWSER=PASS"
          else
            echo "::error::D10_CASE006_BROWSER=FAIL exit=$result"
            grep -E '^(Error|AssertionError|SyntaxError|TypeError|TimeoutError|ReferenceError|RangeError):' "$RUNNER_TEMP/d10-case006-browser.log" | head -n 4 || true
          fi
          exit "$result"
      - name: Real browser Rebel Aromas retention and repeat payback case
        shell: bash
        run: |
          set +e
          cd site
          node scripts/tests/d10-case007-browser-smoke.mjs > "$RUNNER_TEMP/d10-case007-browser.log" 2>&1
          result=$?
          grep -E '^D10_CASE007_' "$RUNNER_TEMP/d10-case007-browser.log" || true
          if [ "$result" -eq 0 ]; then
            echo "D10_CASE007_BROWSER=PASS"
          else
            echo "::error::D10_CASE007_BROWSER=FAIL exit=$result"
            grep -E '^(Error|AssertionError|SyntaxError|TypeError|TimeoutError|ReferenceError|RangeError):' "$RUNNER_TEMP/d10-case007-browser.log" | head -n 4 || true
          fi
          exit "$result"
      - name: Real CASE-008 geo-experiment and native CPL browser journey
        shell: bash
        run: |
          set +e
          cd site
          node scripts/tests/d10-case008-browser-smoke.mjs > "$RUNNER_TEMP/d10-case008-browser.log" 2>&1
          result=$?
          grep -E '^D10_CASE008_BROWSER_' "$RUNNER_TEMP/d10-case008-browser.log" || true
          if [ "$result" -eq 0 ]; then
            echo "D10_CASE008_BROWSER=PASS"
          else
            echo "::error::D10_CASE008_BROWSER=FAIL exit=$result"
            grep -E '^(Error|AssertionError|TypeError|TimeoutError):' "$RUNNER_TEMP/d10-case008-browser.log" | head -n 3 || true
          fi
          exit "$result"
      - name: Mounted T2 Workspace commercial review scoping
        shell: bash
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
          ARTBAZI_LOCAL_PREVIEW_ORIGIN: http://127.0.0.1:4342
        run: |
          # Previous step already verified the standard integrated dist.
          # Make a separate disposable loopback qualification build; do not publish it.
          set +e
          preview_dir="$RUNNER_TEMP/d10-host-loopback"
          expected_head="$(git -C site rev-parse HEAD)"
          # Separate clean worktree: the first integrated builder generates
          # site-side build outputs; never weaken its checkout-clean gate.
          git -C site worktree add --detach "$preview_dir" "$expected_head" > "$RUNNER_TEMP/d10-worktree.log" 2>&1
          worktree_result=$?
          if [ "$worktree_result" -ne 0 ]; then
            echo "::error::D10_REVIEW_CLEAN_WORKTREE=FAIL"
            exit "$worktree_result"
          fi
          ln -s "$GITHUB_WORKSPACE/site/node_modules" "$preview_dir/node_modules"
          cd "$preview_dir"
          npm run build:t2:site > "$RUNNER_TEMP/d10-review-preview-build.log" 2>&1
          build_result=$?
          if [ "$build_result" -ne 0 ]; then
            echo "::error::D10_REVIEW_LOCAL_PREVIEW_BUILD=FAIL"
            # Only stable error codes; never print private source or build output.
            grep -Eo 'ARTBAZI_[A-Z0-9_]+|TS[0-9]+' "$RUNNER_TEMP/d10-review-preview-build.log" | sort -u | head -n 16 | sed 's/^/D10_PREVIEW_ERROR_CODE=/' || true
            exit "$build_result"
          fi
          echo "D10_REVIEW_LOCAL_PREVIEW_BUILD=PASS"
          node scripts/tests/d10-commercial-review-browser-smoke.mjs > "$RUNNER_TEMP/d10-review-browser.log" 2>&1
          result=$?
          grep -E '^D10_REVIEW_' "$RUNNER_TEMP/d10-review-browser.log" || true
          if [ "$result" -eq 0 ]; then
            echo "D10_REVIEW_WORKSPACE_BROWSER=PASS"
          else
            echo "::error::D10_REVIEW_WORKSPACE_BROWSER=FAIL exit=$result"
            grep -E '^(Error|AssertionError|TimeoutError|TypeError):' "$RUNNER_TEMP/d10-review-browser.log" | head -n 4 || true
          fi
          exit "$result"
      - name: Real CASE-008 native Promotion Kernel campaign and read-only experiment
        shell: bash
        run: |
          set +e
          cd "$RUNNER_TEMP/d10-host-loopback"
          node scripts/tests/d10-case008-promotion-kernel-browser.mjs > "$RUNNER_TEMP/d10-case008-promotion.log" 2>&1
          result=$?
          grep -E '^D10_CASE008_KERNEL_' "$RUNNER_TEMP/d10-case008-promotion.log" || true
          if [ "$result" -eq 0 ]; then
            echo "D10_CASE008_KERNEL_PANEL=PASS"
          else
            echo "::error::D10_CASE008_KERNEL_PANEL=FAIL exit=$result"
            grep -E '^(Error|AssertionError|TypeError|TimeoutError):' "$RUNNER_TEMP/d10-case008-promotion.log" | head -n 3 || true
          fi
          exit "$result"
      - name: Real RevOps decision to saved Kernel action and cold readback
        shell: bash
        run: |
          set +e
          cd "$RUNNER_TEMP/d10-host-loopback"
          node scripts/tests/d10-revops-action-kernel-browser.mjs > "$RUNNER_TEMP/d10-revops-live.log" 2>&1
          result=$?
          grep -E '^D10_REVOPS_LIVE_' "$RUNNER_TEMP/d10-revops-live.log" || true
          if [ "$result" -eq 0 ]; then
            echo "D10_REVOPS_KERNEL_END_TO_END=PASS"
          else
            echo "::error::D10_REVOPS_KERNEL_END_TO_END=FAIL exit=$result"
            grep -E '^(Error|AssertionError|TimeoutError|TypeError):' "$RUNNER_TEMP/d10-revops-live.log" | head -n 4 || true
          fi
          exit "$result"
      - name: Real public Result and independent native Exchange archive import into clean T2 profile
        shell: bash
        run: |
          set +e
          cd "$RUNNER_TEMP/d10-host-loopback"
          node scripts/tests/d10-public-kernel-transfer-browser.mjs > "$RUNNER_TEMP/d10-public-kernel.log" 2>&1
          result=$?
          grep -E '^D10_(PUBLIC_KERNEL_|IWXA_DEBUG_STEP=|IWXA_)' "$RUNNER_TEMP/d10-public-kernel.log" || true
          if [ "$result" -eq 0 ]; then
            echo "D10_PUBLIC_T2_KERNEL_TRANSFER=PASS"
          else
            echo "::error::D10_PUBLIC_T2_KERNEL_TRANSFER=FAIL exit=$result"
            grep -E '^(Error|AssertionError|TimeoutError|TypeError|ProtocolError):' "$RUNNER_TEMP/d10-public-kernel.log" | head -n 4 || true
          fi
          exit "$result"
      - name: Inspect artifact without publishing private bytes
        shell: bash
        run: |
          test -d site/dist
          echo "D10_PRIVATE_DIST_EXISTENCE=PASS"
          echo "D10_PRIVATE_CODE_AND_DIST_ARTIFACTS=NOT_PUBLISHED"
