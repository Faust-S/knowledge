name: D07 TOP500 490 original T2 qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d07-top500-490
  cancel-in-progress: true
jobs:
  method-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
