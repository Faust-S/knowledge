      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod
          ref: 4920e9609cf272332b0880802c12b6347fda8b28
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: domain
      - uses: actions/checkout@v4
