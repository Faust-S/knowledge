          node --check scripts/tests/d07-next500-five-bi-html.test.mjs
          node --import tsx --input-type=module -e 'import {SUBJECT_PROTOCOLS} from "./src/domain/service-subject-protocols.ts";const p=SUBJECT_PROTOCOLS.filter(p=>["kontent-marketing","kopirayting","marketingovaya-strategiya","postroenie-otdela-prodazh","prezentaciya"].includes(p.serviceSlug));if(p.length!==5||p.some(x=>x.manualResolutions.some(y=>y.fallbackIfMissing.includes("самостоятельной практики"))))process.exit(1);console.log("D07_N400_FALLBACK=PASS");'
