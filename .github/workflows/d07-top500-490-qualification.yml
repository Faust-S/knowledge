          repository: Faust-S/uslugovod.ru
          ref: 94d9f0991de173d460b495f235c04573d74caec7
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - name: Verify exact HEADs and domain parity
        shell: bash
        run: |
          test "$(git -C domain rev-parse HEAD)" = "4920e9609cf272332b0880802c12b6347fda8b28"
          test "$(git -C site rev-parse HEAD)" = "94d9f0991de173d460b495f235c04573d74caec7"
          for path in domain/src/domain/service-subject*.ts; do
            f="$(basename "$path")"
            cmp "$path" "site/src/domain/$f" || { echo D07_DOMAIN_PARITY=FAIL; exit 2; }
          done
          echo D07_DOMAIN_PARITY=PASS
      - name: Install exact site dependencies
        working-directory: site
        shell: bash
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/d07-install.log" 2>&1 || { echo D07_INSTALL=FAIL; exit 1; }
          echo D07_INSTALL=PASS
