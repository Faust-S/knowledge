name: D07 native original T2 GUI script syntax preflight
on:
  push:
    branches: [work/2026-11-22-d07-methodology-v13]
    paths: [.github/workflows/d07-native-scripts-syntax.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parse:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse exact native PowerShell tests without browsers or private code
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($file in @('scripts/d07-native-card-t2.ps1','scripts/d07-native-card-iwxa-export.ps1','scripts/d07-native-card-iwxa-import.ps1')){
            $tokens=$null;$issues=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tokens,[ref]$issues)
            if($issues.Count -gt 0){
              Write-Output ('D07_NATIVE_PARSER_FAILED_FILE='+[IO.Path]::GetFileName($file))
              Write-Output ('D07_NATIVE_PARSER_ERROR_COUNT='+$issues.Count)
              exit 1
            }
            Write-Output ('D07_NATIVE_PARSER_PASS='+[IO.Path]::GetFileName($file))
          $source=Get-Content 'scripts/d07-native-card-t2.ps1' -Raw
          $import=Get-Content 'scripts/d07-native-card-iwxa-import.ps1' -Raw
          if(!$source.Contains('D07_NATIVE_CARD_KERNEL_OBJECT_ID_WITNESSED=PASS') -or
             !$import.Contains('D07_IWXA_NATIVE_ORIGINAL_OBJECT_ID_ROUNDTRIP=PASS') -or
             !$source.Contains('d07-native-card-order-identity.private.json') -or
             !$import.Contains('d07-native-card-order-identity.private.json')){
            throw 'D07_NATIVE_IWXA_ORIGINAL_OBJECT_ID_CONTRACT_MISSING'
          }
          if(!$import.Contains('D07_IMPORT_OBJECT_IDENTITY_MISMATCH') -or
             !$import.Contains('D07_IMPORT_SOURCE_IDENTITY_WITNESS_INVALID')){
            throw 'D07_NATIVE_IWXA_IDENTITY_PROOF_MISSING'
          }
          Write-Output 'D07_NATIVE_IWXA_IDENTITY_CONTRACT=PASS'
          if(!$source.Contains('D07_NATIVE_CARD_PRIVATE_PROTOCOL_UNAVAILABLE') -or
             $source.Contains('Осмотр оборудования и доступа')){
            throw 'D07_NATIVE_EXPECTED_METHOD_PRIVATE_BOUNDARY_INVALID'
          }
          Write-Output 'D07_NATIVE_PRIVATE_PROTOCOL_BOUNDARY=PASS'
          if(!$source.Contains('D07_NATIVE_CARD_UI_ACTION_NOT_ENABLED') -or
             !$source.Contains('if($node.Current.IsEnabled){return $node}')){
            throw 'D07_NATIVE_T2_ASYNC_BUTTON_GUARD_MISSING'
          }
          Write-Output 'D07_NATIVE_T2_ASYNC_BUTTON_GUARD=PASS'
          if(!$import.Contains('D07_IWXA_NATIVE_EXACT_SUBJECT_WORKS_ROUNDTRIP=PASS') -or
             !$import.Contains('D07_IMPORT_EXACT_TEN_WORKS_NOT_PRESERVED') -or
             $import.Contains('Осмотр оборудования и доступа')){
            throw 'D07_NATIVE_IMPORTED_PRIVATE_PROTOCOL_COVERAGE_INVALID'
          }
          Write-Output 'D07_NATIVE_IMPORT_SUBJECT_WORKS_GUARD=PASS'
          if(!$import.Contains("D07_IMPORT_WORKSPACE_FOCUS_ROUTE=EXPLICIT") -or
             !$import.Contains("'Рабочая область Услуговода'") -or
             !$import.Contains('D07_IMPORT_EXPECTED_SERVICE_ORDER_NOT_LISTED') -or
             $import.Contains("if(`$name -match 'Сохранённых заказов:") -or
             !$source.Contains('$matchedOperations=@($exactTitles')){
            throw 'D07_NATIVE_IMPORT_EXACT_ORDER_READBACK_GUARD_INVALID'
          }
          Write-Output 'D07_NATIVE_IMPORT_EXACT_ORDER_READBACK_GUARD=PASS'
          if(!$import.Contains('D07_IMPORT_NATIVE_FIRST_TAB_FOCUS_TYPE=') -or
             !$import.Contains('D07_IMPORT_NATIVE_FILE_CHOOSER_USED=TRUE') -or
             !$import.Contains('D07_IMPORT_NATIVE_FILE_CONTROL_NOT_ACTIVATED') -or
             !$import.Contains('D07_IMPORT_NATIVE_FILE_FOCUS_WRONG_CONTROL')){
            throw 'D07_NATIVE_IWXA_REAL_FILE_CHOOSER_GUARD_MISSING'
          }
          Write-Output 'D07_NATIVE_IWXA_REAL_FILE_CHOOSER_GUARD=PASS'
          & node --check 'scripts/d07-verify-integrated-all-service-cards.mjs'
          if($LASTEXITCODE -ne 0){throw 'D07_INTEGRATED_ALL_CARDS_CHECKER_SYNTAX_FAILED'}
          Write-Output 'D07_INTEGRATED_ALL_CARDS_CHECKER_SYNTAX=PASS'
          & node --check 'scripts/d07-verify-subject-t2-proposals.mjs'
          if($LASTEXITCODE -ne 0){throw 'D07_T2_SUBJECT_PLAN_PARITY_CHECKER_SYNTAX_FAILED'}
          Write-Output 'D07_T2_SUBJECT_PLAN_PARITY_CHECKER_SYNTAX=PASS'
          }
