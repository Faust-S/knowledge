name: IWXA PR6 screenshot log cleanup
on:
  push:
    branches:
      - qa/2026-11-22-iwxa-pr6-chat-shots
    paths:
      - .github/workflows/qa-iwxa-pr6-chat-shots.yml
permissions:
  contents: read
  actions: write
jobs:
  purge-image-log:
    runs-on: ubuntu-latest
    steps:
      - name: Delete screenshot-bearing run after chat transfer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X DELETE repos/Faust-S/knowledge/actions/runs/45038233750
          echo IWXA_PR6_SCREENSHOT_LOG_DELETED
