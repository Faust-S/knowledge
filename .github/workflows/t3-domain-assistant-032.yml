name: T3 0.3.2 domain assistant candidate and Cehovod native site
on:
  push:
    branches: ['ci/once/t3-domain-assistant-032/51439e7f0a83e62cfb63d494a43429250b13986f']
    paths: ['.github/ci-requests/t3-domain-assistant-032.json']
permissions:
  contents: read
  actions: read
jobs:
  platform:
    if: ${{ github.event.created == false && github.event.deleted == false && github.event.forced == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.retain.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: '51439e7f0a83e62cfb63d494a43429250b13986f'
      STABLE: 'd7f439fe974fab1709270e515721da72d887240f'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Check deliberate exact successor and unchanged executable boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Faust-S/knowledge
          test "${{ github.event.before }}" = "$SOURCE"
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $SOURCE"
          git checkout --detach "$SOURCE"
          git diff --quiet "$STABLE" HEAD -- packages/t3-core/integration-sources packages/t3-core/qualified-runtime packages/t3-core/vite.config.ts
          test "$(git diff --name-only "$STABLE" HEAD -- packages/t3-core/src)" = "packages/t3-core/src/t3/domain-mode/t3-domain-mode.mjs"
          node --check packages/t3-core/src/t3/domain-mode/t3-domain-mode.mjs
          node --test packages/t3-core/tests/t3-domain-offline.test.mjs packages/t3-core/tests/t3-pwa-install.test.mjs packages/t3-core/tests/t3-mobile-model-catalog.test.mjs
      - name: Existing browser installation and weekly update route with site theme
        working-directory: packages/t3-core
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium
          node --test tests/t3-domain-switch.browser.mjs
      - name: Package original stable Host with exact domain UI successor
        working-directory: packages/t3-core
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/stable" "$RUNNER_TEMP/stable-input"
          gh release download t3-platform-v0.3.1 --repo "$GITHUB_REPOSITORY" --pattern platform-inputs.zip --dir "$RUNNER_TEMP/stable"
          echo 'd926739f94d54f3f2015b5d249687a3e8d67f588e850e15eb17012e33959879e  '"$RUNNER_TEMP/stable/platform-inputs.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/stable/platform-inputs.zip" -d "$RUNNER_TEMP/stable-input"
          (cd "$RUNNER_TEMP/stable-input"; echo '36675db908e61f261af722f59b115616e4860c7dd459ba2d8db78ef481a1d05e  t3-platform-inputs.json' | sha256sum -c -; sha256sum -c t3-platform-inputs.sha256)
          test ! -e dist
          cp -a "$RUNNER_TEMP/stable-input/dist" dist
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          for(const name of ['package.json','package-lock.json']){
            const old=readFileSync(join(process.env.RUNNER_TEMP,'stable-input',name),'utf8');
            assert.equal(old.split('"version": "0.3.1"').length-1,name==='package.json'?1:2);
            writeFileSync(name,old.replaceAll('"version": "0.3.1"','"version": "0.3.2-rc.1"'));
          }
          NODE
          node scripts/package-t3-portable-platform.mjs "$RUNNER_TEMP/candidate" "$SOURCE" "$GITHUB_RUN_ID"
          mkdir "$RUNNER_TEMP/candidate-input"
          unzip -q "$RUNNER_TEMP/candidate/platform-inputs.zip" -d "$RUNNER_TEMP/candidate-input"
          (cd "$RUNNER_TEMP/candidate-input"; sha256sum -c t3-platform-inputs.sha256)
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']);a=t/'stable-input';b=t/'candidate-input'
          m=json.loads((a/'t3-platform-inputs.json').read_text());n=json.loads((b/'t3-platform-inputs.json').read_text())
          r=json.loads((t/'candidate/candidate-receipt.json').read_text())
          assert m['sourceCommit']==os.environ['STABLE'] and n['sourceCommit']==r['sourceCommit']==os.environ['SOURCE']
          assert n['version']==r['version']=='0.3.2-rc.1' and n['status']=='TECHNOLOGY_CANDIDATE_NOT_RELEASED'
          old={f['path']:f for f in m['files']};new={f['path']:f for f in n['files']}
          assert set(old)==set(new) and len(new)==174
          changed=sorted(k for k in new if old[k]!=new[k])
          assert changed==sorted(['package.json','package-lock.json','docs/t3-consolidation-sources.json','src/t3/domain-mode/t3-domain-mode.mjs']),changed
          assert n['originalKernel']=='0.3.6' and n['runtimeContract']=='1.3.0'
          assert n['modelWeightsIncluded']==n['nativeSignerIncluded']==n['installedProductAccepted']==n['domainMigrationAutoAuthorized']==False
          assert hashlib.sha256((t/'candidate/platform-inputs.zip').read_bytes()).hexdigest()==r['archiveSha256']
          assert hashlib.sha256((b/'t3-platform-inputs.json').read_bytes()).hexdigest()==r['manifestSha256']
          print('T3_032_CANDIDATE_EXACT_UI_DELTA_PASS '+json.dumps({'files':len(new),'unchanged':len(new)-len(changed),'changed':changed,'receipt':r}))
          PY
          cp "$RUNNER_TEMP/candidate-input/t3-platform-inputs.json" "$RUNNER_TEMP/candidate-input/t3-platform-inputs.sha256" "$RUNNER_TEMP/candidate/"
      - uses: actions/upload-artifact@v4
        id: retain
        with:
          name: iwxa-t3-platform-inputs-0.3.2-rc.1-51439e7f0a83e62cfb63d494a43429250b13986f
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30

  original-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 'ce79b696739efb7183cc52b281009fddeab95949'
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private-assistant
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing original assistant source regressions
        working-directory: private-assistant/browser-local-inference
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ce79b696739efb7183cc52b281009fddeab95949"
          node --check domain-assistant/main.mjs > "$RUNNER_TEMP/assistant-syntax.log" 2>&1 || { echo ASSISTANT_SYNTAX_FAIL; exit 1; }
          if node --test tests/domain-assistant-*.test.mjs > "$RUNNER_TEMP/assistant-regression.log" 2>&1; then
            grep -E '^# (tests|pass|fail|skipped) [0-9]+$' "$RUNNER_TEMP/assistant-regression.log"
            echo ASSISTANT_EXISTING_SOURCE_REGRESSION_PASS
          else
            grep -E '^# (tests|pass|fail|skipped) [0-9]+$' "$RUNNER_TEMP/assistant-regression.log" || true
            echo ASSISTANT_EXISTING_SOURCE_REGRESSION_FAIL
            exit 1
          fi

  cehovod:
    needs: [platform, original-assistant]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SOURCE: '51439e7f0a83e62cfb63d494a43429250b13986f'
      ASSISTANT: 'ce79b696739efb7183cc52b281009fddeab95949'
      SITE: 'c8f6ba983230c4c0448e3f108edb07a7a5b44f55'
      PLATFORM_ARTIFACT: ${{ needs.platform.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '51439e7f0a83e62cfb63d494a43429250b13986f'
          persist-credentials: false
          path: original-core
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 'ce79b696739efb7183cc52b281009fddeab95949'
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private-assistant
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/cehovod.ru
          ref: 'c8f6ba983230c4c0448e3f108edb07a7a5b44f55'
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private-site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: iwxa-t3-platform-inputs-0.3.2-rc.1-51439e7f0a83e62cfb63d494a43429250b13986f
          path: ${{ runner.temp }}/platform
      - name: Explicit candidate input import, exact owner bytes
        working-directory: private-site
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SITE"
          test "$(git -C ../original-core rev-parse HEAD)" = "$SOURCE"
          test "$(git -C ../private-assistant rev-parse HEAD)" = "$ASSISTANT"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,mkdirSync,copyFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          const root='runtime/t3-platform',old=join(root,'0.3.1-rc.1'),version='0.3.2-rc.1',next=join(root,version);
          const archive=join(process.env.RUNNER_TEMP,'platform','platform-inputs.zip');
          const r=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,'platform','candidate-receipt.json'),'utf8'));
          assert.equal(r.sourceCommit,process.env.SOURCE);assert.equal(r.version,version);
          assert.equal(r.status,'TECHNOLOGY_CANDIDATE_DOMAIN_NOT_ACCEPTED');
          assert.equal(createHash('sha256').update(readFileSync(archive)).digest('hex'),r.archiveSha256);
          const pin=JSON.parse(readFileSync(join(old,'release.json'),'utf8'));
          assert.equal(pin.kernelArchiveSha256,r.kernelArchiveSha256);
          mkdirSync(next,{recursive:false});
          writeFileSync(join(next,'release.json'),JSON.stringify({...pin,...r,portableArtifactId:Number(process.env.PLATFORM_ARTIFACT)},null,2)+'\n');
          const ap=JSON.parse(readFileSync(join(old,'domain-assistant.json'),'utf8'));
          assert.equal(ap.sourceCommit,process.env.ASSISTANT);
          ap.sharedEngineSource=r.sourceCommit;
          writeFileSync(join(next,'domain-assistant.json'),JSON.stringify(ap,null,2)+'\n');
          copyFileSync(join(old,'domain-skills.json'),join(next,'domain-skills.json'));
          writeFileSync(join(root,'active.json'),JSON.stringify({schema:'IWXA_CEHOVOD_T3_ACTIVE_INPUT/1',version},null,2)+'\n');
          NODE
          echo CEHOVOD_EXPLICIT_CANDIDATE_INPUT_PIN_READY
          echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Existing site build and original shared Host
        working-directory: private-site
        shell: bash
        run: |
          set -euo pipefail
          run_private() {
            local label="$1"; shift
            local log="$RUNNER_TEMP/cehovod-$label.log"
            if "$@" > "$log" 2>&1; then
              echo "CEHOVOD_${label}_PASS"
            else
              grep -Eo 'CEHOVOD_[A-Z0-9_]{5,100}|T3_PORTABLE_PLATFORM_[A-Z0-9_]+|error TS[0-9]+' "$log" | sort -u | tail -40 || true
              echo "CEHOVOD_${label}_FAIL"
              exit 1
            fi
          }
          run_private DEPENDENCIES npm ci --ignore-scripts --no-audit --no-fund
          run_private SOURCE_TYPES npm run typecheck
          run_private SKILLS npm run verify:t3-skills
          run_private PLATFORM_IMPORT npm run import:t3-platform -- "$RUNNER_TEMP/platform/platform-inputs.zip"
          run_private HOST npm run prepare:t3-host -- "$GITHUB_WORKSPACE/original-core/packages/t3-core" "$RUNNER_TEMP/domain-host" "$RUNNER_TEMP/platform/platform-inputs.zip" "$GITHUB_WORKSPACE/private-assistant"
          run_private RETAIN npm run retain:t3-inputs -- "$RUNNER_TEMP/domain-host" "$RUNNER_TEMP/platform/platform-inputs.zip"
          run_private ONE_DIST npm run build:product:t3
          run_private PRODUCT_STRUCTURE npm run verify:product:t3
      - name: Existing actual form and result route, domain design, full-site cold offline
        working-directory: private-site
        shell: bash
        run: |
          set -euo pipefail
          for route in check-t3-assistant-dynamic check-t3-public-offline; do
            log="$RUNNER_TEMP/$route.log"
            if node node_modules/tsx/dist/cli.mjs "scripts/$route.ts" > "$log" 2>&1; then
              grep -Eo 'CEHOVOD_T3_[A-Z0-9_]{5,100}' "$log" | sort -u
              echo "$route PASS"
            else
              grep -Eo 'CEHOVOD_[A-Z0-9_]{5,100}|TimeoutError|AssertionError|TypeError' "$log" | sort -u | tail -40 || true
              echo "$route FAIL"
              exit 1
            fi
          done
          echo CEHOVOD_SOURCE_AND_BROWSER_NO_REAL_INFERENCE_NOT_FINAL_ACCEPTANCE
