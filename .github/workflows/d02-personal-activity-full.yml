name: d02-personal-activity-full
on:
  push:
    branches:
      - work/2026-11-24-d02-personal-activity-qualification
    paths:
      - .github/workflows/d02-personal-activity-full.yml
      - packages/t3-core/tests/t3-club-full-site-roundtrip.mjs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Exact public qualification harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: qualification
      - name: Preserve original Git LF bytes
        run: git config --global core.autocrlf false
      - name: Checkout exact public T3 platform candidate
        uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 326f725c44d69ac99f6b912241e9e8a6c3d716a5
          persist-credentials: false
          path: one-core
      - name: Checkout exact private Club candidate
        uses: actions/checkout@v4
        with:
          repository: Faust-S/club.iwxa.ru
          ref: c9cd8f7bd9201259856699649e86031e16d94efe
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - name: Checkout exact canonical Club skills and semantics
        uses: actions/checkout@v4
        with:
          repository: Faust-S/club
          ref: 9bfb2a6fd6f8c09cd8b2f6c94c7ca30538321aec
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: owner
      - name: Checkout original T2 for one-time migration qualification only
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: e70de29b72b83e2546f7ab74b17572685a728c17
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: t2
      - name: Checkout original private BLI domain-assistant candidate
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 9f41447197251d41e69fbcb98e52ef1050754ec2
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: bli-owner
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify and import exact canonical skills through the official importer
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          if ! (cd ../owner && node scripts/club-skill-authoring.mjs generate && git diff --exit-code && node scripts/club-skill-authoring.mjs check && node --test tests/personal-week-plan.test.mjs tests/today-overview.test.mjs tests/assistant-skills.test.mjs tests/goal-portfolio.test.mjs tests/personal-cash-calendar.test.mjs) > "$RUNNER_TEMP/private-owner-fact.log" 2>&1; then
            echo D02_T3_CANONICAL_FACT_AND_SKILLS=FAIL
            grep -E '^not ok [0-9]+ - |^# (tests|pass|fail) ' "$RUNNER_TEMP/private-owner-fact.log" | head -20 || true
            exit 1
          fi
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/private-owner-fact.log"
          echo D02_T3_CANONICAL_FACT_AND_SKILLS=PASS
          if ! (npm run t3:skills:import -- "$GITHUB_WORKSPACE/owner" 9bfb2a6fd6f8c09cd8b2f6c94c7ca30538321aec && npm run t3:skills:import -- "$GITHUB_WORKSPACE/owner" 9bfb2a6fd6f8c09cd8b2f6c94c7ca30538321aec --apply && npm run t3:skills:check) > "$RUNNER_TEMP/private-fact-import.log" 2>&1; then
            echo D02_T3_OFFICIAL_FACT_SKILLS_IMPORT=FAIL
            grep -Eo 'CLUB_(SKILL_IMPORT|T3_SKILLS)_[A-Z0-9_]+' "$RUNNER_TEMP/private-fact-import.log" | sort -u | head -20 || true
            exit 1
          fi
          echo "D02_IMPORTED_SKILL_BLOB=$(git hash-object assets/club-assistant-skills.json)"
          echo "D02_IMPORTED_PIN_BLOB=$(git hash-object runtime/t3-platform/0.3.1-rc.1/domain-skills.json)"
          echo D02_T3_OFFICIAL_FACT_SKILLS_IMPORT=PASS
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          for(const name of ['personal-week-plan','today-overview','personal-cash-calendar','goal-portfolio']){
            const canonical=readFileSync('../owner/logic/'+name+'.mjs','utf8').replaceAll("from './","from './club-");
            assert.equal(readFileSync('assets/club-'+name+'.mjs','utf8'),canonical);
          }
          console.log('D02_T3_CANONICAL_FACT_PROJECTION=PASS');
          NODE
      - name: Verify original assistant field and source policy
        working-directory: bli-owner/browser-local-inference
        shell: bash
        run: |
          set -euo pipefail
          if ! (node --check domain-assistant/main.mjs && node --check domain-assistant/field-policy.mjs && node --test tests/domain-assistant-field-policy.test.mjs) > "$RUNNER_TEMP/private-assistant-owner.log" 2>&1; then
            echo D02_ORIGINAL_ASSISTANT_SOURCE=FAIL
            exit 1
          fi
          echo D02_ORIGINAL_ASSISTANT_SOURCE=PASS
      - name: Download and verify exact public portable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Faust-S/knowledge/actions/artifacts/14920233669/zip > "$RUNNER_TEMP/t3-platform-outer.zip"
          echo "96bb993383af31309b79dceb6f321ac5365ac7777362f512f9225226ee51904f  $RUNNER_TEMP/t3-platform-outer.zip" | sha256sum --check --status
          unzip -p "$RUNNER_TEMP/t3-platform-outer.zip" platform-inputs.zip > "$RUNNER_TEMP/t3-platform.zip"
          echo "b778474d011b34a77cd60b945f02295fb24654c833f3ab12ff36bd3c0bdd8863  $RUNNER_TEMP/t3-platform.zip" | sha256sum --check --status
          echo D02_T3_PUBLIC_RELEASE_ARCHIVE=PASS
      - name: Verify pinned release and explicit assistant boundary
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          export IWXA_T3_PLATFORM_ARCHIVE="$RUNNER_TEMP/t3-platform.zip"
          node scripts/t3-platform-inputs.mjs verify "$IWXA_T3_PLATFORM_ARCHIVE" > "$RUNNER_TEMP/verify.json" 2> "$RUNNER_TEMP/verify.log"
          if ! node --test scripts/test-club-t3-platform.mjs > "$RUNNER_TEMP/private-test.log" 2>&1; then
            echo D02_T3_PLATFORM_TEST=FAIL
            exit 1
          fi
          echo D02_T3_PLATFORM_128_FILES_AND_SOURCE_TESTS=PASS
      - name: Verify existing profile, route and restoration regressions
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          for suite in test:club-native-edit-route test:club-native-project-restoration test:club-native-restore-preselect test:club-profile-field-consistency test:club-native-profile-family test:club-personal-space-start test:club-hub test:club-native-today test:club-personal-economy test:club-assistant-skills; do
            if ! npm run "$suite" > "$RUNNER_TEMP/private-regression.log" 2>&1; then
              echo "D02_T3_PRESERVATION_SUITE=FAIL $suite"
              exit 1
            fi
            echo "D02_T3_PRESERVATION_SUITE=PASS $suite"
          done
      - name: Compile existing Club module into exact original T3 Host candidate
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          if ! npm run t3:host:prepare -- "$GITHUB_WORKSPACE/one-core/packages/t3-core" "$RUNNER_TEMP/club-t3-host" "$RUNNER_TEMP/t3-platform.zip" "$GITHUB_WORKSPACE/bli-owner" > "$RUNNER_TEMP/private-build.log" 2>&1; then
            echo D02_T3_HOST_SOURCE_BUILD=FAIL
            grep -Eo 'CLUB_T3_(HOST|PLATFORM)_[A-Z0-9_]+|T2_EXTERNAL_MODULE_[A-Z_]+|T2_ACTIVE_RUNTIME_CONTRACT_HOLD|TS[0-9]{4}' "$RUNNER_TEMP/private-build.log" | sort -u | head -15 || true
            # Expose only compile diagnostics coordinates and a fixed category,
            # not private source, actual values, paths outside the stage or logs.
            node --input-type=module - "$RUNNER_TEMP/private-build.log" <<'NODE'
          import {readFileSync} from 'node:fs';
          const lines=readFileSync(process.argv[2],'utf8').split(/\r?\n/);
          const pattern=/^(src\/modules\/club\/[A-Za-z0-9_./-]+\.(?:ts|tsx|mts))\((\d+),(\d+)\): error (TS\d+):/;
          const publicPattern=/^(src\/[A-Za-z0-9_./-]+\.(?:ts|tsx|mts))\((\d+),(\d+)\): error (TS\d+):/;
          const hits=[];
          for(const line of lines){
            const m=line.match(pattern)||line.match(publicPattern);
            if(!m)continue;
            // Coordinates refer only to files already known to their owner.
            // No message text or private file contents is emitted.
            hits.push('D02_T3_DIAGNOSTIC='+m[4]+' '+m[1]+':'+m[2]+':'+m[3]);
          }
          for(const row of [...new Set(hits)].slice(0,120))console.log(row);
          console.log('D02_T3_DIAGNOSTICS_COUNT='+hits.length);
          NODE
            exit 1
          fi
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(p.schema!=="IWXA_CLUB_COMPILED_HOST_INPUT/1"||p.moduleId!=="iwxa.domain.club"||p.state!=="SOURCE_BUILD_NOT_PRODUCT_ACCEPTED"||p.sourceCommit!=="326f725c44d69ac99f6b912241e9e8a6c3d716a5")process.exit(1);console.log("D02_T3_HOST_SOURCE_BUILD=PASS; files="+p.files.length+"; module_source_files="+p.moduleSourceFiles.length)' "$RUNNER_TEMP/club-t3-host/club-t3-host-input.json"
          node --input-type=module - "$RUNNER_TEMP/club-t3-host/club-t3-host-input.json" <<'NODE'
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync(process.argv[2],'utf8'));
          if(p.assistant?.sourceCommit!=='9f41447197251d41e69fbcb98e52ef1050754ec2'||
             p.assistant.webllm!=='0.2.87'||!p.assistant.sharedEngine||!p.assistant.entry||
             p.files.filter(x=>/^assets\/model-worker-[A-Za-z0-9_-]+\.js$/.test(x.path)).length!==1)process.exit(1);
          console.log('D02_T3_ORIGINAL_DOMAIN_ASSISTANT_SHARED_ENGINE=PASS; workers=1');
          NODE
          echo D02_T3_DOMAIN_ACCEPTED=false
      - name: Verify domain-owned migration adapter and build unchanged Club T2 baseline
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
          IWXA_T2_NPM_CACHE_DIR: ${{ runner.temp }}/club-npm-cache
        shell: bash
        run: |
          set -euo pipefail
          if ! npm ci --no-audit --no-fund > "$RUNNER_TEMP/private-baseline.log" 2>&1; then
            echo D02_T3_BASELINE_INSTALL=FAIL; exit 1
          fi
          if ! npm run test:club-t3-assembly > "$RUNNER_TEMP/private-assembly-test.log" 2>&1; then
            echo D02_T3_ASSEMBLY_UNIT=FAIL
            grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/private-assembly-test.log" | head -10 || true
            exit 1
          fi
          echo D02_T3_ASSEMBLY_UNIT=PASS
          if ! npm run build > "$RUNNER_TEMP/private-baseline.log" 2>&1; then
            echo D02_T3_BASELINE_BUILD=FAIL
            grep -Eo 'CLUB_T2_[A-Z0-9_]+|T2_EXTERNAL_MODULE_[A-Z_]+|CURRENT STATIC SOURCE CHECK: FAIL' "$RUNNER_TEMP/private-baseline.log" | sort -u | tail -25 || true
            exit 1
          fi
          if ! node scripts/check-club-release.mjs > "$RUNNER_TEMP/private-baseline.log" 2>&1; then
            echo D02_T3_BASELINE_GATE=FAIL
            grep -Eo 'CLUB_T2_RELEASE_GATE_[A-Z0-9_]+' "$RUNNER_TEMP/private-baseline.log" | sort -u || true
            exit 1
          fi
          echo D02_T3_BASELINE_ORIGINAL_PRODUCT=PASS
      - name: Assemble and qualify single Club T3 dist without replacing domain shell
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/club-t3-candidate/dist"
          if ! npm run t3:assemble:candidate -- "$GITHUB_WORKSPACE/site/dist" "$RUNNER_TEMP/club-t3-host" "$OUT" "$RUNNER_TEMP/t3-platform.zip" > "$RUNNER_TEMP/private-assembly.log" 2>&1; then
            echo D02_T3_PRODUCT_DIST=FAIL
            grep -Eo '(CLUB_T3_ASSEMBLY_|CLUB_T3_HOST_|T3_DOMAIN_OFFLINE_|T3_D5_MODULE_|CLUB_T2_RELEASE_GATE_)[A-Z0-9_]+' "$RUNNER_TEMP/private-assembly.log" | sort -u | tail -25 || true
            exit 1
          fi
          node --input-type=module - "$RUNNER_TEMP/private-assembly.log" <<'NODE'
          import {readFileSync} from 'node:fs';
          const lines=readFileSync(process.argv[2],'utf8').trim().split(/\r?\n/);
          const result=JSON.parse(lines.at(-1));
          const {expectedClubAssistantScope}=await import('./scripts/assemble-club-t3-dist.mjs');
          const scope=expectedClubAssistantScope();
          if(result.schema!=='IWXA_CLUB_T3_ASSEMBLY/1'||result.publicRoutes!==scope.publicRoutes||
             result.hostingProofsUnchanged!==2||result.preservedSiteAssets!==true||
             result.localInferenceRegistered!==true||result.domainAssistantPages!==scope.pages.length||result.domainAssistantFormShortcuts!==scope.forms||result.domainAssistantSharedEngine!==true||result.domainAccepted!==false)
            process.exit(1);
          console.log('D02_T3_PRODUCT_DIST=PASS; public_routes='+result.publicRoutes+
            '; application_pages='+result.applicationPages+'; offline_files='+result.offlineFiles+
            '; hosting_proofs_unchanged='+result.hostingProofsUnchanged);
          NODE
          if ! (cd "$RUNNER_TEMP/club-t3-candidate" && node "$GITHUB_WORKSPACE/site/scripts/check-club-release.mjs" && node "$GITHUB_WORKSPACE/site/scripts/check-htaccess.mjs") > "$RUNNER_TEMP/private-assembly.log" 2>&1; then
            echo D02_T3_PREVIOUS_RELEASE_GATE=FAIL
            grep -Eo 'CLUB_T2_RELEASE_GATE_[A-Z0-9_]+' "$RUNNER_TEMP/private-assembly.log" | sort -u || true
            exit 1
          fi
          echo D02_T3_PREVIOUS_RELEASE_GATE=PASS
          echo D02_T3_DOMAIN_ASSISTANT_PUBLIC_PAGES_AND_CANONICAL_FORM_SHORTCUTS=PASS
          if ! (node scripts/check-current-static-routing.mjs "$OUT" && node scripts/test-current-preview.mjs "$OUT" && node scripts/check-club-integrated-http-preview.mjs "$OUT") > "$RUNNER_TEMP/private-http.log" 2>&1; then
            echo D02_T3_HTTP_40_ROUTES=FAIL; exit 1
          fi
          echo D02_T3_HTTP_40_ROUTES=PASS
          grep '^CLUB_T3_OFFLINE_SNAPSHOT_HTTP: PASS' "$RUNNER_TEMP/private-http.log"
          echo D02_T3_NATIVE_GUI_AND_OFFLINE_NOT_RUN=true
      - name: Verify the actual deployable snapshot under isolated Apache
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v apache2 >/dev/null; then
            sudo apt-get update -qq > "$RUNNER_TEMP/private-apache-install.log" 2>&1
            sudo apt-get install -y -qq apache2 > "$RUNNER_TEMP/private-apache-install.log" 2>&1
          fi
          if ! node scripts/check-club-t3-apache.mjs "$RUNNER_TEMP/club-t3-candidate/dist" > "$RUNNER_TEMP/private-apache.log" 2>&1; then
            echo D02_T3_APACHE_SNAPSHOT=FAIL
            exit 1
          fi
          grep '^CLUB_T3_APACHE_HTTP: PASS' "$RUNNER_TEMP/private-apache.log"
          echo D02_T3_APACHE_SNAPSHOT=PASS
      - name: Run complete existing Club source regression
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          export IWXA_T3_PLATFORM_ARCHIVE="$RUNNER_TEMP/t3-platform.zip"
          if ! npm test > "$RUNNER_TEMP/private-all-regression.log" 2>&1; then
            echo D02_T3_COMPLETE_CLUB_REGRESSION=FAIL
            grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/private-all-regression.log" | head -15 || true
            exit 1
          fi
          echo D02_T3_COMPLETE_CLUB_REGRESSION=PASS
          node -e 'const fs=require("node:fs");const s=fs.readFileSync(process.argv[1],"utf8");const rows=[...s.matchAll(/^# tests (\d+)$/gm)];console.log("D02_T3_COMPLETE_CLUB_TESTS="+rows.reduce((n,x)=>n+Number(x[1]),0))' "$RUNNER_TEMP/private-all-regression.log"
          echo D02_T3_PWA_BRAND_ICONS=PASS
      - name: Retain verified local original Kernel support
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          if ! npm run t3:kernel-support:prepare -- "$GITHUB_WORKSPACE/site/dist" "$GITHUB_WORKSPACE/t2" "$RUNNER_TEMP/club-kernel-support" > "$RUNNER_TEMP/private-local-input.log" 2>&1; then
            echo D02_T3_LOCAL_KERNEL_SUPPORT=FAIL
            grep -Eo 'CLUB_T3_LOCAL_KERNEL_[A-Z0-9_]+|CLUB_T2_RELEASE_GATE_[A-Z0-9_]+' "$RUNNER_TEMP/private-local-input.log" | sort -u | tail -20 || true
            exit 1
          fi
          echo D02_T3_LOCAL_KERNEL_SUPPORT=PASS
      - name: Build local T3 twice with unavailable source checkouts and no Git or npm commands in build
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          mv "$GITHUB_WORKSPACE/t2" "$RUNNER_TEMP/unused-t2"
          mv "$GITHUB_WORKSPACE/one-core" "$RUNNER_TEMP/unused-one-core"
          mv "$GITHUB_WORKSPACE/bli-owner" "$RUNNER_TEMP/unused-bli-owner"
          export IWXA_T2_SOURCE_DIR="$RUNNER_TEMP/nonexistent-t2"
          export IWXA_T2_NPM_OFFLINE=1
          mkdir -p "$RUNNER_TEMP/blocked-build-tools"
          printf '#!/bin/sh\nexit 87\n' > "$RUNNER_TEMP/blocked-build-tools/git"
          printf '#!/bin/sh\nexit 87\n' > "$RUNNER_TEMP/blocked-build-tools/npm"
          chmod +x "$RUNNER_TEMP/blocked-build-tools/"*
          export PATH="$RUNNER_TEMP/blocked-build-tools:$PATH"
          for attempt in 1 2; do
            if ! node scripts/build-club-t3-local-site.mjs "$RUNNER_TEMP/club-t3-host" "$RUNNER_TEMP/club-kernel-support" "$RUNNER_TEMP/t3-platform.zip" > "$RUNNER_TEMP/private-local-build.log" 2>&1; then
              echo D02_T3_LOCAL_SITE_BUILD=FAIL
              grep -Eo 'CLUB_T3_[A-Z0-9_]+|CLUB_T2_[A-Z0-9_]+|CURRENT_STATIC_[A-Z0-9_]+' "$RUNNER_TEMP/private-local-build.log" | sort -u | tail -25 || true
              exit 1
            fi
            find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/local-rebuild-$attempt.private"
          done
          if ! cmp -s "$RUNNER_TEMP/local-rebuild-1.private" "$RUNNER_TEMP/local-rebuild-2.private"; then
            echo D02_T3_LOCAL_REPRODUCIBLE_BYTES=FAIL; exit 1
          fi
          echo D02_T3_LOCAL_REPRODUCIBLE_BYTES=PASS
          node scripts/check-club-release.mjs > "$RUNNER_TEMP/private-local-check.log" 2>&1
          node scripts/check-club-integrated-http-preview.mjs dist > "$RUNNER_TEMP/private-local-check.log" 2>&1
          node scripts/test-current-preview.mjs dist > "$RUNNER_TEMP/private-local-http.log" 2>&1
          grep '^CLUB_T3_OFFLINE_SNAPSHOT_HTTP: PASS' "$RUNNER_TEMP/private-local-http.log"
          if ! node scripts/check-club-t3-apache.mjs dist > "$RUNNER_TEMP/private-apache.log" 2>&1; then
            echo D02_T3_LOCAL_APACHE=FAIL; exit 1
          fi
          grep '^CLUB_T3_APACHE_HTTP: PASS' "$RUNNER_TEMP/private-apache.log"
          echo D02_T3_LOCAL_SINGLE_DIST=PASS
          echo D02_T3_LOCAL_BUILD_WITHOUT_SOURCE_CHECKOUTS=PASS
          # A damaged local input must stop before changing the last good dist.
          cp "$RUNNER_TEMP/club-kernel-support/_iwxa/loader.js" "$RUNNER_TEMP/loader-original.private"
          printf '\n// damaged test input\n' >> "$RUNNER_TEMP/club-kernel-support/_iwxa/loader.js"
          if node scripts/build-club-t3-local-site.mjs "$RUNNER_TEMP/club-t3-host" "$RUNNER_TEMP/club-kernel-support" "$RUNNER_TEMP/t3-platform.zip" > "$RUNNER_TEMP/private-local-damage.log" 2>&1; then
            echo D02_T3_REJECT_DAMAGED_SUPPORT=FAIL; exit 1
          fi
          grep -q 'CLUB_T3_LOCAL_KERNEL_RETAINED_BYTES_MISMATCH' "$RUNNER_TEMP/private-local-damage.log"
          mv "$RUNNER_TEMP/loader-original.private" "$RUNNER_TEMP/club-kernel-support/_iwxa/loader.js"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/local-damage-readback.private"
          cmp -s "$RUNNER_TEMP/local-rebuild-2.private" "$RUNNER_TEMP/local-damage-readback.private"
          echo D02_T3_REJECT_DAMAGED_SUPPORT_AND_RETAIN_DIST=PASS
          # Restore checkout paths for the checkout action's own post steps.
          mv "$RUNNER_TEMP/unused-t2" "$GITHUB_WORKSPACE/t2"
          mv "$RUNNER_TEMP/unused-one-core" "$GITHUB_WORKSPACE/one-core"
          mv "$RUNNER_TEMP/unused-bli-owner" "$GITHUB_WORKSPACE/bli-owner"
      - name: Full built Club assistant, original Kernel and independent Exchange offline roundtrip
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/club-dist-browser"
          mkdir -p "$stage"
          cp "$GITHUB_WORKSPACE/qualification/packages/t3-core/tests/t3-club-full-site-roundtrip.mjs" "$stage/"
          cd "$stage"
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.61.1
          npx --no-install playwright install --with-deps chromium
          if ! node t3-club-full-site-roundtrip.mjs "$GITHUB_WORKSPACE/site" "$GITHUB_WORKSPACE/site/dist" > "$RUNNER_TEMP/private-dist-browser.log" 2>&1; then
            grep -E '^CLUB_DIST_[A-Z_]+=PASS$|^CLUB_DIST_ROUNDTRIP_FAIL ' "$RUNNER_TEMP/private-dist-browser.log" || true
            exit 1
          fi
          grep -E '^CLUB_DIST_[A-Z_]+=PASS$|^CLUB_DIST_ROUNDTRIP=PASS ' "$RUNNER_TEMP/private-dist-browser.log"
      - name: Remove temporary private compilation and logs
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/unused-t2" ] && [ ! -e "$GITHUB_WORKSPACE/t2" ]; then mv "$RUNNER_TEMP/unused-t2" "$GITHUB_WORKSPACE/t2"; fi
          if [ -d "$RUNNER_TEMP/unused-one-core" ] && [ ! -e "$GITHUB_WORKSPACE/one-core" ]; then mv "$RUNNER_TEMP/unused-one-core" "$GITHUB_WORKSPACE/one-core"; fi
          if [ -d "$RUNNER_TEMP/unused-bli-owner" ] && [ ! -e "$GITHUB_WORKSPACE/bli-owner" ]; then mv "$RUNNER_TEMP/unused-bli-owner" "$GITHUB_WORKSPACE/bli-owner"; fi
