# Deliberate milestone qualification; editing harness files alone is not a trigger.
# Milestone 2026-11-25: saved goal horizon, cash risks, exact fact observations.
name: d02-personal-activity-full
# Release qualification: complete canonical tests, all site projections, desktop and phone routes, native offline and Exchange.
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/once/d02-personal-activity-full/**'
    paths:
      - '.github/ci-requests/d02-personal-activity-full.json'

permissions:
  contents: read
  actions: read
concurrency:
  # All immutable request branches share the existing D02 release lane.
  group: d02-personal-activity-full-refs/heads/work/2026-11-24-d02-personal-activity-qualification
  cancel-in-progress: false
jobs:
  host:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Exact public qualification harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          path: qualification
      - name: Verify the deliberate immutable request before private access
        working-directory: qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/verify_once_request.py \
            --repository Faust-S/knowledge --workflow d02-personal-activity-full \
            --profile full-release-after-404-and-navigation-audit \
            --revision site=e6760c6069f74eb7695f6118c7613e1fa2a56dea \
            --revision subject=76ed326b21392836f4ff0ed376baea7b3f555ac5 \
            --revision t2=e70de29b72b83e2546f7ab74b17572685a728c17 \
            --revision platform=326f725c44d69ac99f6b912241e9e8a6c3d716a5 \
            --revision bli=9f41447197251d41e69fbcb98e52ef1050754ec2
      - name: Preserve original Git LF bytes
        run: git config --global core.autocrlf false
      - name: Checkout exact public T3 platform candidate
        uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 326f725c44d69ac99f6b912241e9e8a6c3d716a5
          persist-credentials: false
          path: one-core
      - name: Checkout exact private Club candidate
        uses: actions/checkout@v4
        with:
          repository: Faust-S/club.iwxa.ru
          ref: e6760c6069f74eb7695f6118c7613e1fa2a56dea
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - name: Checkout exact canonical Club skills and semantics
        uses: actions/checkout@v4
        with:
          repository: Faust-S/club
          ref: 76ed326b21392836f4ff0ed376baea7b3f555ac5
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: owner
      - name: Checkout original T2 for one-time migration qualification only
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: e70de29b72b83e2546f7ab74b17572685a728c17
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: t2
      - name: Checkout original private BLI domain-assistant candidate
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 9f41447197251d41e69fbcb98e52ef1050754ec2
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: bli-owner
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify and import exact canonical skills through the official importer
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          if ! (cd ../owner && node scripts/club-skill-authoring.mjs generate && git diff --exit-code && node scripts/club-skill-authoring.mjs check && node --test tests/*.test.mjs tests/projects/*.test.mjs) > "$RUNNER_TEMP/private-owner-fact.log" 2>&1; then
            echo D02_T3_CANONICAL_FACT_AND_SKILLS=FAIL
            grep -E '^not ok [0-9]+ - |^# (tests|pass|fail) ' "$RUNNER_TEMP/private-owner-fact.log" | head -20 || true
            exit 1
          fi
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/private-owner-fact.log"
          echo D02_T3_CANONICAL_FACT_AND_SKILLS=PASS
          if ! (npm run t3:skills:import -- "$GITHUB_WORKSPACE/owner" 76ed326b21392836f4ff0ed376baea7b3f555ac5 && npm run t3:skills:import -- "$GITHUB_WORKSPACE/owner" 76ed326b21392836f4ff0ed376baea7b3f555ac5 --apply && npm run t3:skills:check) > "$RUNNER_TEMP/private-fact-import.log" 2>&1; then
            echo D02_T3_OFFICIAL_FACT_SKILLS_IMPORT=FAIL
            grep -oE 'CLUB_(SKILL_IMPORT|T3_SKILLS|SKILL_AUTHORING)_[A-Z_]+' "$RUNNER_TEMP/private-fact-import.log" | sort -u || true
            grep -Eo 'CLUB_(SKILL_IMPORT|T3_SKILLS)_[A-Z0-9_]+' "$RUNNER_TEMP/private-fact-import.log" | sort -u | head -20 || true
            exit 1
          fi
          echo "D02_IMPORTED_SKILL_BLOB=$(git hash-object assets/club-assistant-skills.json)"
          echo "D02_IMPORTED_PIN_BLOB=$(git hash-object runtime/t3-platform/0.3.1-rc.1/domain-skills.json)"
          echo D02_T3_OFFICIAL_FACT_SKILLS_IMPORT=PASS
          if ! node scripts/check-club-domain-catalog-parity.mjs "$GITHUB_WORKSPACE/owner" > "$RUNNER_TEMP/private-domain-parity.log" 2>&1; then
            echo D02_T3_COMPLETE_DOMAIN_CATALOG_AND_PROJECTION=FAIL
            exit 1
          fi
          grep -E '^CLUB_DOMAIN_.*: PASS' "$RUNNER_TEMP/private-domain-parity.log"
          echo D02_T3_CANONICAL_FACT_PROJECTION=PASS
          node --check assets/site.js > "$RUNNER_TEMP/private-projection-syntax.log" 2>&1
      - name: Validate imported bytes with exact original shared T3 runtime
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {loadSkillPack,validateSkillPack,rankSkills,skillPrompt} from '../bli-owner/browser-local-inference/domain-assistant/skill-runtime.mjs';
          const raw=readFileSync('assets/club-assistant-skills.json','utf8');
          const origin='https://club.iwxa.ru';
          const loaded=await loadSkillPack('/assets/club-assistant-skills.json',{
            origin,request:async url=>({ok:true,redirected:false,url,text:async()=>raw})
          });
          const original=JSON.parse(raw);
          assert.equal(loaded.version,original.version);
          assert.equal(loaded.skills.length,original.skills.length);
          assert.equal(loaded.formHints.length,original.formHints.length);
          assert.equal(loaded.resultHints.length,original.resultHints.length);
          const bad=structuredClone(original);
          bad.skills[0].limit='a'.repeat(451);
          assert.throws(()=>validateSkillPack(bad),/T3_ASSISTANT_SKILLS_ENTRY/);
          for(const [query,id] of [['какие цели проверить','goal-map'],['проверить с запасом','goal-map'],['план и факт расходов','personal-economy'],['пересмотреть результат цели','evidence-portfolio']]){
            assert.equal(rankSkills(loaded,query,{limit:1})[0]?.id,id);
          }
          const skill=loaded.skills.find(x=>x.id==='goal-map'),hint=loaded.resultHints.find(x=>x.marker==='data-club-goal-resource-result');
          const prompt=skillPrompt(loaded,skill,'Проверить с запасом',{resultHint:hint});
          assert.match(prompt,/не прогноз и не гарантия/);
          assert.match(prompt,/К проверке/);
          for(const [query,id] of [['сверить обязательства цели','goal-map'],['что изменить в плане цели','goal-map'],['записать отсутствующее время','route-30-days'],['сверить ожидаемое поступление','personal-economy']]){
            assert.equal(rankSkills(loaded,query,{limit:1})[0]?.id,id);
          }
          const worklistHint=loaded.resultHints.find(x=>x.marker==='data-club-goal-list');
          assert.match(skillPrompt(loaded,skill,'Сверить обязательства цели',{resultHint:worklistHint}),/Дела и деньги для сверки/);
          console.log('D02_ORIGINAL_T3_EXACT_REVIEW_WORKLIST_SKILL=PASS');
          console.log('D02_ORIGINAL_T3_REVIEW_SKILL_SELECTION_AND_PROMPT=PASS');

          for(const query of ['итоги недели','итоги прошлой недели','пересмотр недели']){
            assert.equal(rankSkills(loaded,query,{limit:1})[0]?.id,'goal-map');
          }
          const periodHint=loaded.resultHints.find(x=>x.marker==='data-club-activity-review-result');
          const periodPrompt=skillPrompt(loaded,skill,'Итоги недели',{resultHint:periodHint});
          assert.match(periodPrompt,/Что проверить перед новым планом/);
          assert.match(periodPrompt,/исправление в текущей вкладке ещё не сохранено/i);
          assert.match(periodPrompt,/Все сохранённые итоги/);
          assert.match(periodPrompt,/Отмена плана требует решения человека/);
          console.log('D02_ORIGINAL_T3_WEEKLY_REVIEW_SKILL=PASS');
          for(const query of ['обязательства по всем целям','пересечения между целями','распределить время между целями','распределить расходы между целями']){
            assert.equal(rankSkills(loaded,query,{limit:1})[0]?.id,'goal-map');
          }
          const horizonHint=loaded.resultHints.find(x=>x.marker==='data-club-goal-horizon-result');
          const horizonPrompt=skillPrompt(loaded,skill,'Сопоставить обязательства по всем целям',{resultHint:horizonHint});
          assert.match(horizonPrompt,/Пересечения дел разных целей/);
          assert.match(horizonPrompt,/Ожидаемые поступления не считаются полученными/);
          assert.match(horizonPrompt,/Не назначайте рейтинг целей/);
          assert.match(horizonPrompt,/сохранённую рабочую область/);
          assert.match(horizonPrompt,/списания до поступлений/);
          assert.match(skillPrompt(loaded,skill,'Разобрать факты цели',{resultHint:worklistHint}),/Факты, из которых получены итоги/);
          assert.match(prompt,/Отделите новые риски от существующих/);
          assert.match(prompt,/30, 90 или 365 дней/);
          assert.match(prompt,/только время, только деньги или оба/);
          assert.match(prompt,/Невыбранная часть не рассчитана и не меняется/);
          assert.match(horizonPrompt,/Вернитесь к горизонту 7 или 30 дней/);
          console.log('D02_ORIGINAL_T3_HORIZON_AND_DECISION_SKILL=PASS');
          console.log('D02_ORIGINAL_T3_IMPORTED_SKILL_RUNTIME=PASS');
          NODE
      - name: Verify original assistant field and source policy
        working-directory: bli-owner/browser-local-inference
        shell: bash
        run: |
          set -euo pipefail
          if ! (node --check domain-assistant/main.mjs && node --check domain-assistant/field-policy.mjs && node --test tests/domain-assistant-field-policy.test.mjs) > "$RUNNER_TEMP/private-assistant-owner.log" 2>&1; then
            echo D02_ORIGINAL_ASSISTANT_SOURCE=FAIL
            exit 1
          fi
          echo D02_ORIGINAL_ASSISTANT_SOURCE=PASS
      - name: Download and verify exact public portable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Faust-S/knowledge/actions/artifacts/14920233669/zip > "$RUNNER_TEMP/t3-platform-outer.zip"
          echo "96bb993383af31309b79dceb6f321ac5365ac7777362f512f9225226ee51904f  $RUNNER_TEMP/t3-platform-outer.zip" | sha256sum --check --status
          unzip -p "$RUNNER_TEMP/t3-platform-outer.zip" platform-inputs.zip > "$RUNNER_TEMP/t3-platform.zip"
          echo "b778474d011b34a77cd60b945f02295fb24654c833f3ab12ff36bd3c0bdd8863  $RUNNER_TEMP/t3-platform.zip" | sha256sum --check --status
          echo D02_T3_PUBLIC_RELEASE_ARCHIVE=PASS
      - name: Verify pinned release and explicit assistant boundary
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          export IWXA_T3_PLATFORM_ARCHIVE="$RUNNER_TEMP/t3-platform.zip"
          node scripts/t3-platform-inputs.mjs verify "$IWXA_T3_PLATFORM_ARCHIVE" > "$RUNNER_TEMP/verify.json" 2> "$RUNNER_TEMP/verify.log"
          if ! node --test scripts/test-club-t3-platform.mjs > "$RUNNER_TEMP/private-test.log" 2>&1; then
            echo D02_T3_PLATFORM_TEST=FAIL
            exit 1
          fi
          echo D02_T3_PLATFORM_128_FILES_AND_SOURCE_TESTS=PASS
      - name: Compile existing Club module into exact original T3 Host candidate
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          if ! npm run t3:host:prepare -- "$GITHUB_WORKSPACE/one-core/packages/t3-core" "$RUNNER_TEMP/club-t3-host" "$RUNNER_TEMP/t3-platform.zip" "$GITHUB_WORKSPACE/bli-owner" > "$RUNNER_TEMP/private-build.log" 2>&1; then
            echo D02_T3_HOST_SOURCE_BUILD=FAIL
            grep -Eo 'CLUB_T3_(HOST|PLATFORM)_[A-Z0-9_]+|T2_EXTERNAL_MODULE_[A-Z_]+|T2_ACTIVE_RUNTIME_CONTRACT_HOLD|TS[0-9]{4}' "$RUNNER_TEMP/private-build.log" | sort -u | head -15 || true
            # Expose only compile diagnostics coordinates and a fixed category,
            # not private source, actual values, paths outside the stage or logs.
            node --input-type=module - "$RUNNER_TEMP/private-build.log" <<'NODE'
          import {readFileSync} from 'node:fs';
          const lines=readFileSync(process.argv[2],'utf8').split(/\r?\n/);
          const pattern=/^(src\/modules\/club\/[A-Za-z0-9_./-]+\.(?:ts|tsx|mts))\((\d+),(\d+)\): error (TS\d+):/;
          const publicPattern=/^(src\/[A-Za-z0-9_./-]+\.(?:ts|tsx|mts))\((\d+),(\d+)\): error (TS\d+):/;
          const hits=[];
          for(const line of lines){
            const m=line.match(pattern)||line.match(publicPattern);
            if(!m)continue;
            // Coordinates refer only to files already known to their owner.
            // No message text or private file contents is emitted.
            hits.push('D02_T3_DIAGNOSTIC='+m[4]+' '+m[1]+':'+m[2]+':'+m[3]);
          }
          for(const row of [...new Set(hits)].slice(0,120))console.log(row);
          console.log('D02_T3_DIAGNOSTICS_COUNT='+hits.length);
          NODE
            exit 1
          fi
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(p.schema!=="IWXA_CLUB_COMPILED_HOST_INPUT/1"||p.moduleId!=="iwxa.domain.club"||p.state!=="SOURCE_BUILD_NOT_PRODUCT_ACCEPTED"||p.sourceCommit!=="326f725c44d69ac99f6b912241e9e8a6c3d716a5")process.exit(1);console.log("D02_T3_HOST_SOURCE_BUILD=PASS; files="+p.files.length+"; module_source_files="+p.moduleSourceFiles.length)' "$RUNNER_TEMP/club-t3-host/club-t3-host-input.json"
          node --input-type=module - "$RUNNER_TEMP/club-t3-host/club-t3-host-input.json" <<'NODE'
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync(process.argv[2],'utf8'));
          if(p.assistant?.sourceCommit!=='9f41447197251d41e69fbcb98e52ef1050754ec2'||
             p.assistant.webllm!=='0.2.87'||!p.assistant.sharedEngine||!p.assistant.entry||
             p.files.filter(x=>/^assets\/model-worker-[A-Za-z0-9_-]+\.js$/.test(x.path)).length!==1)process.exit(1);
          console.log('D02_T3_ORIGINAL_DOMAIN_ASSISTANT_SHARED_ENGINE=PASS; workers=1');
          NODE
          echo D02_T3_DOMAIN_ACCEPTED=false
      - name: Verify domain-owned migration adapter and build unchanged Club T2 baseline
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
          IWXA_T2_NPM_CACHE_DIR: ${{ runner.temp }}/club-npm-cache
        shell: bash
        run: |
          set -euo pipefail
          if ! npm ci --no-audit --no-fund > "$RUNNER_TEMP/private-baseline.log" 2>&1; then
            echo D02_T3_BASELINE_INSTALL=FAIL; exit 1
          fi
          if ! npm run test:club-t3-assembly > "$RUNNER_TEMP/private-assembly-test.log" 2>&1; then
            echo D02_T3_ASSEMBLY_UNIT=FAIL
            grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/private-assembly-test.log" | head -10 || true
            exit 1
          fi
          echo D02_T3_ASSEMBLY_UNIT=PASS
          if ! npm run build > "$RUNNER_TEMP/private-baseline.log" 2>&1; then
            echo D02_T3_BASELINE_BUILD=FAIL
            grep -Eo 'CLUB_T2_[A-Z0-9_]+|T2_EXTERNAL_MODULE_[A-Z_]+|CURRENT STATIC SOURCE CHECK: FAIL' "$RUNNER_TEMP/private-baseline.log" | sort -u | tail -25 || true
            exit 1
          fi
          if ! node scripts/check-club-release.mjs > "$RUNNER_TEMP/private-baseline.log" 2>&1; then
            echo D02_T3_BASELINE_GATE=FAIL
            grep -Eo 'CLUB_T2_RELEASE_GATE_[A-Z0-9_]+' "$RUNNER_TEMP/private-baseline.log" | sort -u || true
            exit 1
          fi
          echo D02_T3_BASELINE_ORIGINAL_PRODUCT=PASS
      - name: Assemble and qualify single Club T3 dist without replacing domain shell
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/club-t3-candidate/dist"
          if ! npm run t3:assemble:candidate -- "$GITHUB_WORKSPACE/site/dist" "$RUNNER_TEMP/club-t3-host" "$OUT" "$RUNNER_TEMP/t3-platform.zip" > "$RUNNER_TEMP/private-assembly.log" 2>&1; then
            echo D02_T3_PRODUCT_DIST=FAIL
            grep -Eo '(CLUB_T3_ASSEMBLY_|CLUB_T3_HOST_|T3_DOMAIN_OFFLINE_|T3_D5_MODULE_|CLUB_T2_RELEASE_GATE_)[A-Z0-9_]+' "$RUNNER_TEMP/private-assembly.log" | sort -u | tail -25 || true
            exit 1
          fi
          node --input-type=module - "$RUNNER_TEMP/private-assembly.log" <<'NODE'
          import {readFileSync} from 'node:fs';
          const lines=readFileSync(process.argv[2],'utf8').trim().split(/\r?\n/);
          const result=JSON.parse(lines.at(-1));
          const {expectedClubAssistantScope}=await import('./scripts/assemble-club-t3-dist.mjs');
          const scope=expectedClubAssistantScope();
          if(result.schema!=='IWXA_CLUB_T3_ASSEMBLY/1'||result.publicRoutes!==scope.publicRoutes||
             result.hostingProofsUnchanged!==2||result.preservedSiteAssets!==true||
             result.localInferenceRegistered!==true||result.domainAssistantPages!==scope.pages.length||result.domainAssistantFormShortcuts!==scope.forms||result.domainAssistantSharedEngine!==true||result.domainAccepted!==false)
            process.exit(1);
          console.log('D02_T3_PRODUCT_DIST=PASS; public_routes='+result.publicRoutes+
            '; application_pages='+result.applicationPages+'; offline_files='+result.offlineFiles+
            '; hosting_proofs_unchanged='+result.hostingProofsUnchanged);
          NODE
          if ! (cd "$RUNNER_TEMP/club-t3-candidate" && node "$GITHUB_WORKSPACE/site/scripts/check-club-release.mjs" && node "$GITHUB_WORKSPACE/site/scripts/check-htaccess.mjs") > "$RUNNER_TEMP/private-assembly.log" 2>&1; then
            echo D02_T3_PREVIOUS_RELEASE_GATE=FAIL
            grep -Eo 'CLUB_T2_RELEASE_GATE_[A-Z0-9_]+' "$RUNNER_TEMP/private-assembly.log" | sort -u || true
            exit 1
          fi
          echo D02_T3_PREVIOUS_RELEASE_GATE=PASS
          echo D02_T3_DOMAIN_ASSISTANT_PUBLIC_PAGES_AND_CANONICAL_FORM_SHORTCUTS=PASS
          if ! (node scripts/check-current-static-routing.mjs "$OUT" && node scripts/test-current-preview.mjs "$OUT" && node scripts/check-club-integrated-http-preview.mjs "$OUT") > "$RUNNER_TEMP/private-http.log" 2>&1; then
            echo D02_T3_HTTP_40_ROUTES=FAIL; exit 1
          fi
          echo D02_T3_HTTP_40_ROUTES=PASS
          grep '^CLUB_T3_OFFLINE_SNAPSHOT_HTTP: PASS' "$RUNNER_TEMP/private-http.log"
          echo D02_T3_NATIVE_GUI_AND_OFFLINE_NOT_RUN=true
      - name: Verify the actual deployable snapshot under isolated Apache
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v apache2 >/dev/null; then
            sudo apt-get update -qq > "$RUNNER_TEMP/private-apache-install.log" 2>&1
            sudo apt-get install -y -qq apache2 > "$RUNNER_TEMP/private-apache-install.log" 2>&1
          fi
          if ! node scripts/check-club-t3-apache.mjs "$RUNNER_TEMP/club-t3-candidate/dist" > "$RUNNER_TEMP/private-apache.log" 2>&1; then
            echo D02_T3_APACHE_SNAPSHOT=FAIL
            exit 1
          fi
          grep '^CLUB_T3_APACHE_HTTP: PASS' "$RUNNER_TEMP/private-apache.log"
          echo D02_T3_APACHE_SNAPSHOT=PASS
      - name: Run complete existing Club source regression
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          export IWXA_T3_PLATFORM_ARCHIVE="$RUNNER_TEMP/t3-platform.zip"
          # The consolidated suite must retain all previously separate checks.
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const test=JSON.parse(readFileSync('package.json','utf8')).scripts.test;
          const active=new Set([...test.matchAll(/npm run (\S+)/g)].map(x=>x[1]));
          const required=["test:club-activity-review","test:club-assistant-skills","test:club-author-voice","test:club-case-02-route-integration","test:club-case-03-native-tools","test:club-case-route-integration","test:club-cash-calendar-route","test:club-evidence-portfolio","test:club-expense-options","test:club-family-options-ui","test:club-goal-map","test:club-goal-resource-review","test:club-hub","test:club-native-edit-route","test:club-native-profile-family","test:club-native-project-restoration","test:club-native-restore-preselect","test:club-native-today","test:club-personal-cash-calendar","test:club-personal-cash-calendar-ui","test:club-personal-decision","test:club-personal-economy","test:club-personal-evidence","test:club-personal-space-start","test:club-personal-week-plan","test:club-profile-field-consistency","test:club-project-delete-integrity","test:club-save-readiness","test:club-today-overview","test:club-tool-groups","test:club-unified-ux","test:club-work-ledger-integration"];
          for(const name of required)assert.ok(active.has(name),'Missing consolidated suite: '+name);
          console.log('D02_CONSOLIDATED_SOURCE_COVERAGE=PASS; unique_previous_suites='+required.length);
          NODE
          # Run the exact npm test chain once, but collect all failing suites
          # rather than stopping at the first failed command. No weaker gate.
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,appendFileSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          import {join} from 'node:path';
          const scripts=JSON.parse(readFileSync('package.json','utf8')).scripts;
          assert.ok(!scripts.pretest&&!scripts.posttest,'Unexpected npm test lifecycle hooks');
          const commands=scripts.test.split(' && ');
          assert.ok(commands.length>0&&commands.every(c=>/^npm run test:[a-z0-9-]+$/.test(c)));
          const names=commands.map(c=>c.slice('npm run '.length));
          assert.equal(new Set(names).size,names.length);
          const log=join(process.env.RUNNER_TEMP,'private-all-regression.log');
          writeFileSync(log,'');
          let tests=0,failed=0;
          for(const name of names){
           const result=spawnSync('npm',['run',name],{encoding:'utf8',maxBuffer:32*1024*1024,env:process.env});
           const output=(result.stdout||'')+'\n'+(result.stderr||'');
           appendFileSync(log,'\nSUITE '+name+'\n'+output);
           tests+=[...output.matchAll(/^# tests (\d+)$/gm)].reduce((n,x)=>n+Number(x[1]),0);
           if(result.status!==0||result.error){
            failed++;
            console.log('D02_REGRESSION_SUITE_FAIL='+name);
            // Output only existing TAP labels; detailed private logs never leave the runner.
            for(const line of output.split('\n').filter(x=>/^not ok \d+ - /.test(x)).slice(0,15))
             console.log(line);
           }
          }
          console.log('D02_T3_COMPLETE_CLUB_SUITES='+names.length+'; failed='+failed);
          console.log('D02_T3_COMPLETE_CLUB_TESTS='+tests);
          console.log('D02_T3_COMPLETE_CLUB_REGRESSION='+(failed?'FAIL':'PASS'));
          if(failed)process.exitCode=1;
          NODE
          echo D02_T3_PWA_BRAND_ICONS=PASS
