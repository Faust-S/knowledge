name: D05 T3 consolidated dynamic context qualification
on:
  push:
    branches: [test/2026-11-24-d05-t3-integration]
    paths: [qualification/d05/t3-requests/dynamic.json]
  workflow_dispatch:
  workflow_call:
    inputs:
      site_sha:
        type: string
        default: 'a0961a1d88dcedd68809c66f327d7e417c77a744'
      domain_sha:
        type: string
        default: '7d44995b536bc57eb0acff63d876d255c034fb77'
      full_release:
        type: boolean
        default: false
      retained_base_sha:
        type: string
        default: 'ba595ae901ea5af9b066a5e5f7cab88c15fdee8e'
    secrets:
      DOMEN:
        required: true
    outputs:
      functional_ready:
        description: Exact Linux functional and local retained snapshot qualification
        value: ${{ jobs.source.outputs.functional_ready }}
permissions:
  contents: read
  actions: read
concurrency:
  group: d05-t3-dynamic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full_release && 90 || 45 }}
    outputs:
      functional_ready: ${{ steps.functional_gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/cehovod
          ref: ${{ inputs.domain_sha || '7d44995b536bc57eb0acff63d876d255c034fb77' }}
          token: ${{ secrets.DOMEN }}
          path: domain
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/cehovod.ru
          ref: ${{ inputs.site_sha || 'a0961a1d88dcedd68809c66f327d7e417c77a744' }}
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 5e3083788aa541921559de29d3457d4a52bbba00
          token: ${{ secrets.DOMEN }}
          path: assistant
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 326f725c44d69ac99f6b912241e9e8a6c3d716a5
          path: one-core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify owner pack and original runtime contract
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-owner.log"
          if ! (cd domain && node scripts/cehovod-skill-authoring.mjs check && node --test tests/assistant-skills.test.mjs) >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_[A-Z0-9_]+' "$log" | sort -u | head -20 || true
            echo D05_T3_OWNER_SKILLS_FAIL
            exit 1
          fi
          cmp -s domain/models/assistant-skills.json site/public/assets/cehovod-assistant-skills.json
          cmp -s domain/src/lib/iwps/registry-snapshot.generated.json site/src/lib/iwps/registry-snapshot.generated.json
          node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          import {validateSkillPack} from "./assistant/browser-local-inference/domain-assistant/skill-runtime.mjs";
          const pack=validateSkillPack(JSON.parse(readFileSync("site/public/assets/cehovod-assistant-skills.json","utf8")));
          if(pack.skills.length!==11||pack.formHints.length!==11||pack.resultHints.length!==12)throw Error("D05_T3_PACK_COUNTS");
          console.log("D05_T3_ORIGINAL_RUNTIME_SKILLS_PASS");
          JS
          if ! (cd domain && T3_ASSISTANT_SOURCE="$GITHUB_WORKSPACE/assistant/browser-local-inference/domain-assistant" node --test tests/assistant-field-policy.test.mjs) >"$log" 2>&1; then
            grep -Eo '^not ok [0-9]+' "$log" | head -40 || true
            echo D05_T3_FIELD_POLICY_FAIL
            exit 1
          fi
          echo D05_T3_FIELD_POLICY_35_PASS
          echo D05_T3_OWNER_PROJECTION_PASS
      - name: Install dependencies without exporting private sources
        working-directory: site
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/d05-t3-npm.log" 2>&1 || { echo D05_T3_NPM_FAIL; exit 1; }
      - name: Verify opaque Git input retention
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-retained-git.log"
          if ! npm run check:t3-retained-git >"$log" 2>&1; then
            echo D05_T3_RETAINED_GIT_FAIL
            exit 1
          fi
          echo D05_T3_RETAINED_GIT_PASS
      - name: Verify hardware classification and local retained commit tests
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/lib/t3-webgpu-probe.test.mjs scripts/prepare-t3-retained-commit.test.mjs scripts/check-t3-preview.test.mjs
          node --check scripts/verify-cehovod-t3-product.mjs
          node --experimental-strip-types --test scripts/lib/t3-assistant-vite-config.test.mjs
          node --check public/assets/cehovod-t3-bootstrap.mjs
          node --check scripts/check-t3-hardware-webgpu.mjs
      - name: Verify deterministic static hydration and model witness syntax
        id: ssr
        continue-on-error: true
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-ssr-test.log"
          code=0
          npm run check:t3-ssr-determinism -- --reporter=json --outputFile="$RUNNER_TEMP/d05-t3-ssr.json" >"$log" 2>&1 || code=$?
          if test -f "$RUNNER_TEMP/d05-t3-ssr.json"; then
            node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          const report=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/d05-t3-ssr.json","utf8"));
          const categorize=m=>{
            if(/cannot (read properties|access)|undefined is not a function|is not a function/i.test(m))return "API_TYPE";
            if(/cannot find|failed to load|no test files|cannot resolve/i.test(m))return "MODULE_RESOLUTION";
            if(/AssertionError|expected .* to (be|equal|throw)/i.test(m))return "ASSERTION";
            return "OTHER";
          };
          console.log("D05_T3_SSR_COUNTS "+JSON.stringify({total:report.numTotalTests,passed:report.numPassedTests,failed:report.numFailedTests}));
          for(const suite of report.testResults||[]){
            if(suite.status==="failed"&&!(suite.assertionResults||[]).length){
              const m=String(suite.message||"");
              console.log("D05_T3_SSR_SUITE_FAIL "+JSON.stringify({kind:categorize(m)}));
            }
            for(const [index,t] of (suite.assertionResults||[]).entries()){
              if(t.status!=="failed")continue;
              const m=(t.failureMessages||[]).join("\n");
              const locations=[...m.matchAll(/(static-router-freshness(?:\.test)?\.ts|router-core\/[a-zA-Z0-9_./-]+\.(?:js|ts)):(\d+):(\d+)/g)].slice(0,4).map(a=>[a[1],Number(a[2]),Number(a[3])]);
              console.log("D05_T3_SSR_ASSERTION_FAIL "+JSON.stringify({index:index+1,kind:categorize(m),locations}));
            }
          }
          JS
          fi
          if test "$code" -ne 0; then
            grep -Eo 'CEHOVOD_T3_SSR_[A-Z0-9_]+|TypeError|AssertionError|SyntaxError|ERR_MODULE_NOT_FOUND|ERR_PACKAGE_PATH_NOT_EXPORTED' "$log" | sort -u | head -20 || true
            echo D05_T3_SSR_TEST_FAIL
            exit 1
          fi
          node --check scripts/d05-t3-real-model-witness.mjs >"$RUNNER_TEMP/d05-t3-model-syntax.log" 2>&1 || { echo D05_T3_MODEL_SYNTAX_FAIL; exit 1; }
          echo D05_T3_SSR_TEST_PASS
          echo D05_T3_MODEL_SYNTAX_PASS
      - name: Check actual TSX syntax with no source disclosure
        working-directory: site
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import ts from "typescript";
          import {readFileSync} from "node:fs";
          const pack=JSON.parse(readFileSync("public/assets/cehovod-assistant-skills.json","utf8"));
          let errors=0;
          for(const skill of pack.skills){
            const path="src/routes/"+skill.route.slice(1,-1).replaceAll("/",".")+".tsx";
            const file=ts.createSourceFile(path,readFileSync(path,"utf8"),ts.ScriptTarget.Latest,true,ts.ScriptKind.TSX);
            for(const d of file.parseDiagnostics){
              const loc=file.getLineAndCharacterOfPosition(d.start??0);
              console.log("D05_T3_TSX_PARSE_DIAG "+JSON.stringify({skill:skill.id,code:d.code,line:loc.line+1,column:loc.character+1}));
              errors++;
            }
          }
          if(errors)process.exitCode=1;
          else console.log("D05_T3_TSX_PARSE_11_PASS");
          JS
      - name: Verify eleven native form scopes and twelve result scopes
        id: native_context
        continue-on-error: true
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-native-context.log"
          if ! node scripts/check-t3-native-context.mjs >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_T3_NATIVE_[A-Za-z0-9_-]+' "$log" | sort -u | head -20 || true
            echo D05_T3_NATIVE_CONTEXT_FAIL
            exit 1
          fi
          grep -Fqx '{"status":"CEHOVOD_T3_NATIVE_CONTEXT_SOURCE_PASS","forms":11,"results":12,"productAccepted":false}' "$log"
          echo D05_T3_NATIVE_CONTEXT_PASS
      - name: Verify real JSX bindings and source types
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-site.log"
          if ! node scripts/cehovod-assistant-skills.mjs >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_SKILL_PROJECTION_[A-Za-z0-9_-]+' "$log" | sort -u | head -20 || true
            echo D05_T3_BINDINGS_SOURCE_FAIL
            exit 1
          fi
          echo D05_T3_BINDINGS_SOURCE_PASS
          if ! node --test scripts/cehovod-assistant-skills.test.mjs >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_SKILL_PROJECTION_[A-Z0-9_a-z-]+|^not ok [0-9]+|CEHOVOD_[A-Z0-9_]+' "$log" | sort -u | head -20 || true
            echo D05_T3_BINDINGS_FAIL
            exit 1
          fi
          echo D05_T3_BINDINGS_PASS
      - name: Typecheck site and diagnose exact source locations
        id: site_types
        continue-on-error: true
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-site-types.log"
          if ! npm run typecheck -- --pretty false >"$log" 2>&1; then
            node --input-type=module <<'JS'
          import ts from "typescript";
          import {relative} from "node:path";
          const config=ts.readConfigFile("tsconfig.json",ts.sys.readFile);
          const parsed=ts.parseJsonConfigFileContent(config.config,ts.sys,process.cwd());
          const program=ts.createProgram(parsed.fileNames,parsed.options);
          const diagnostics=[...parsed.errors,...ts.getPreEmitDiagnostics(program)];
          let total=0,shown=0;
          for(const d of diagnostics){
            if(d.category!==ts.DiagnosticCategory.Error)continue;
            total++;
            if(!d.file||d.start===undefined||shown>=100)continue;
            const file=relative(process.cwd(),d.file.fileName).replaceAll("\\","/");
            if(!/^(?:src|scripts|t2-site-module)\/[A-Za-z0-9_.$/-]{1,220}$/.test(file)&&file!=="vite.config.ts")continue;
            const loc=d.file.getLineAndCharacterOfPosition(d.start);
            console.log("D05_T3_SITE_TYPE_DIAG "+JSON.stringify({file,line:loc.line+1,column:loc.character+1,code:"TS"+d.code}));
            shown++;
          }
          console.log("D05_T3_SITE_TYPE_COUNT "+JSON.stringify({total,shown}));
          JS
            grep -Eo 'TS[0-9]{4,6}' "$log" | sort -u | head -20 || true
            echo D05_T3_TYPES_FAIL
            exit 1
          fi
          echo D05_T3_TYPES_PASS
      - name: Verify the existing domain module contracts
        id: module
        continue-on-error: true
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-module.log"
          if ! npm run verify:t2-module >"$log" 2>&1; then
            grep -Eo '^not ok [0-9]+|CEHOVOD_[A-Z0-9_]+|TS[0-9]{4,6}' "$log" | sort -u | head -30 || true
            echo D05_T3_EXISTING_MODULE_FAIL
            exit 1
          fi
          echo D05_T3_EXISTING_MODULE_PASS
      - name: Lint exact candidate and emit source-free diagnostics
        id: lint
        continue-on-error: true
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          code=0
          npx eslint . -f json -o "$RUNNER_TEMP/d05-t3-lint.json" >"$RUNNER_TEMP/d05-t3-lint.log" 2>&1 || code=$?
          node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          import {basename,relative} from "node:path";
          const rows=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/d05-t3-lint.json","utf8"));
          const errors=rows.filter(r=>r.errorCount);
          for(const row of errors.slice(0,30)){
            const ruleCounts={};
            for(const msg of row.messages.filter(m=>m.severity===2)){
              const key=msg.ruleId||"parse";
              ruleCounts[key]=(ruleCounts[key]||0)+1;
            }
            console.log("D05_T3_LINT_DIAG "+JSON.stringify({file:basename(row.filePath),count:row.errorCount,rules:ruleCounts}));
          }
          JS
          if [ "$code" -ne 0 ]; then echo D05_T3_LINT_FAIL; exit "$code"; fi
          echo D05_T3_LINT_PASS
      - name: Produce bounded formatting-only edit coordinates
        working-directory: site
        shell: bash
        if: steps.lint.outcome == 'failure'
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          import {createHash} from "node:crypto";
          import {relative} from "node:path";
          import * as prettier from "prettier";
          const rows=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/d05-t3-lint.json","utf8"));
          // Only allow whitespace and common formatting punctuation. Never publish source,
          // strings, identifiers, patches containing code, or formatter diagnostics.
          const layout=/^[ \t\r\n"'\x60,;(){}\[\]\\]*$/u;
          const isLayout=c=>c!==undefined&&layout.test(c);
          const allow=new Set(["scripts/check-htaccess.ts","scripts/lib/cehovod-apache-assets.mjs","scripts/lib/cehovod-apache-assets.test.mjs","scripts/check-t3-preview.mjs","scripts/check-t3-preview.test.mjs","public/assets/cehovod-t3-bootstrap.mjs","scripts/build-cehovod-t3-local-site.mjs","scripts/cehovod-assistant-skills.mjs","scripts/cehovod-assistant-skills.test.mjs","scripts/prepare-cehovod-host-build.mjs","scripts/prepare-cehovod-t3-host.mjs","scripts/t3-platform-inputs.mjs","src/routes/instrumenty.pasport-izdeliya.tsx","src/routes/instrumenty.zadanie-podryadchiku.tsx","src/routes/instrumenty.karta-kachestva.tsx","src/routes/instrumenty.plan-fakt.tsx","src/routes/zakaz-v-ceh.tsx","src/routes/instrumenty.gotovnost-k-zapusku.tsx","src/routes/povtornyy-zakaz.tsx","src/router.tsx","src/routes/__root.tsx","src/routes/situacii.$slug.tsx","src/routes/tipy-proizvodstva.$slug.tsx","t2-site-module/cehovod/site-host-port.ts","t2-site-module/cehovod/vendor/cehovod-lifecycle.d.ts","scripts/retain-cehovod-t3-inputs.mjs","scripts/check-t3-assistant-browser.ts","t2-site-module/cehovod/commands.ts","t2-site-module/cehovod/operation-command.ts","t2-site-module/cehovod/operation-baseline.ts","t2-site-module/cehovod/evidence-guard.ts","src/components/home/MainRouteMap.tsx","src/components/home/ProductionTypesMatrix.tsx","src/components/home/SituationSignals.tsx","src/components/home/StartOrderCTA.tsx","src/components/home/ToolsDesk.tsx","src/components/site/NotFoundPage.tsx","src/components/site/ProductionTypeCard.tsx","src/components/site/SituationCard.tsx","src/components/site/ToolLayout.tsx","src/components/workspace/WorkspaceOrderRow.tsx","src/routes/index.tsx","src/routes/instrumenty.index.tsx","src/routes/metodika.tsx","src/routes/o-proekte.tsx","src/routes/privacy.tsx","src/routes/workspace.tsx","src/routes/zakaz.tsx","scripts/check-t3-dist-reproducibility.mjs","scripts/check-t3-public-offline.ts","scripts/d05-first-use-real-kernel-witness.mjs","scripts/d05-t3-real-model-witness.mjs","scripts/prerender.ts","src/lib/static-router-freshness.ts","src/lib/static-router-freshness.test.ts","scripts/lib/loopback-tls-pin.mjs","scripts/lib/t3-webgpu-probe.mjs","scripts/lib/t3-webgpu-probe.test.mjs","scripts/lib/cehovod-product-invocation.mjs","scripts/lib/cehovod-product-invocation.test.mjs","scripts/serve-cehovod-t2.mjs","scripts/serve-cehovod-t2.test.mjs","scripts/verify-cehovod-t3-product.mjs","scripts/lib/t3-assistant-vite-config.mjs","scripts/lib/t3-assistant-vite-config.test.mjs","scripts/prepare-t3-retained-commit.test.mjs","scripts/prepare-t3-retained-commit.mjs","src/styles.css","scripts/check-t3-retained-checkout.mjs","scripts/check-t3-assistant-dynamic.ts","scripts/check-t3-native-context.mjs","src/components/site/T3ContextActions.tsx","src/routes/instrumenty.sebestoimost-zakaza.tsx","src/routes/instrumenty.marshrut-i-srok.tsx","src/routes/instrumenty.make-or-buy.tsx"]);
          for(const row of rows.filter(r=>r.errorCount)){
            const path=relative(process.cwd(),row.filePath);
            if(!allow.has(path)||row.messages.some(m=>m.severity===2&&m.ruleId!=="prettier/prettier"))continue;
            const before=readFileSync(row.filePath,"utf8");
            const after=await prettier.format(before,{...await prettier.resolveConfig(row.filePath),filepath:row.filePath});
            let i=0,j=0;const edits=[];let safe=true;
            while(i<before.length||j<after.length){
              const start=i,begin=j;
              while(isLayout(before[i]))i++;
              while(isLayout(after[j]))j++;
              if(before.slice(start,i)!==after.slice(begin,j))edits.push([start,i-start,after.slice(begin,j)]);
              if(before[i]!==after[j]){safe=false;break;}
              if(i===before.length)break;
              i++;j++;
            }
            if(safe){
              let check=before;
              for(const [at,n,replacement] of [...edits].reverse()){
                if(!layout.test(check.slice(at,at+n))||!layout.test(replacement)){safe=false;break;}
                check=check.slice(0,at)+replacement+check.slice(at+n);
              }
              safe=safe&&check===after;
            }
            if(!safe||edits.length>2500){console.log("D05_T3_FORMAT_COORDINATES_UNAVAILABLE "+path);continue;}
            const hash=s=>createHash("sha256").update(s).digest("hex");
            console.log("D05_T3_FORMAT_HEADER "+JSON.stringify({path,before:hash(before),after:hash(after),count:edits.length}));
            for(let k=0;k<edits.length;k+=60)console.log("D05_T3_FORMAT_EDITS "+JSON.stringify({path,start:k,edits:edits.slice(k,k+60)}));
          }
          JS
      - name: Run existing production subject regression
        id: subject
        continue-on-error: true
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-subject.log"
          if ! npm run test -- --reporter=json --outputFile="$RUNNER_TEMP/d05-t3-subject.json" >"$log" 2>&1; then
            grep -Eo 'Tests[[:space:]]+[0-9]+ failed|CEHOVOD_[A-Z0-9_]+' "$log" | sort -u | head -30 || true
            echo D05_T3_SUBJECT_FAIL
            exit 1
          fi
          node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/d05-t3-subject.json","utf8"));
          const counts={total:r.numTotalTests,passed:r.numPassedTests,failed:r.numFailedTests,pending:r.numPendingTests};
          if(!Object.values(counts).every(Number.isSafeInteger)||counts.failed!==0||counts.total!==counts.passed+counts.pending)throw Error("D05_T3_SUBJECT_RESULT");
          console.log("D05_T3_SUBJECT_COUNTS "+JSON.stringify(counts));
          JS
          echo D05_T3_SUBJECT_PASS
      - name: Require source qualification before downloading or building the platform
        id: source_gate
        shell: bash
        env:
          NATIVE_CONTEXT_OUTCOME: ${{ steps.native_context.outcome }}
          SSR_OUTCOME: ${{ steps.ssr.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPES_OUTCOME: ${{ steps.site_types.outcome }}
          MODULE_OUTCOME: ${{ steps.module.outcome }}
          SUBJECT_OUTCOME: ${{ steps.subject.outcome }}
        run: |
          set -euo pipefail
          for result in "$NATIVE_CONTEXT_OUTCOME" "$SSR_OUTCOME" "$LINT_OUTCOME" "$TYPES_OUTCOME" "$MODULE_OUTCOME" "$SUBJECT_OUTCOME"; do
            test "$result" = success || { echo D05_T3_SOURCE_GATE_FAIL; exit 1; }
          done
          echo D05_T3_SOURCE_GATE_PASS
      - name: Verify exact portable common platform
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Faust-S/knowledge/actions/artifacts/14920233669/zip > "$RUNNER_TEMP/t3-artifact.zip"
          unzip -p "$RUNNER_TEMP/t3-artifact.zip" platform-inputs.zip > "$RUNNER_TEMP/platform-inputs.zip"
          if ! node scripts/t3-platform-inputs.mjs verify "$RUNNER_TEMP/platform-inputs.zip" > "$RUNNER_TEMP/d05-t3-platform.log" 2>&1; then
            grep -Eo 'CEHOVOD_T3_PLATFORM_[A-Z0-9_]+' "$RUNNER_TEMP/d05-t3-platform.log" | sort -u | head -20 || true
            echo D05_T3_PLATFORM_FAIL
            exit 1
          fi
          echo D05_T3_PLATFORM_PASS
      - name: Prepare original Host for a fixed HTTPS loopback origin
        if: inputs.full_release
        working-directory: site
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-protected-host.log"
          if ! npm run prepare:t3-host -- "$GITHUB_WORKSPACE/one-core/packages/t3-core" "$RUNNER_TEMP/d05-t3-protected-host" "$RUNNER_TEMP/platform-inputs.zip" "$GITHUB_WORKSPACE/assistant" https://127.0.0.1:34567 >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_T3_HOST_[A-Z0-9_]+|TS[0-9]{4,6}' "$log" | sort -u | head -30 || true
            echo D05_T3_PROTECTED_HOST_FAIL
            exit 1
          fi
          echo D05_T3_PROTECTED_HOST_PASS
      - name: Assemble the real loopback T3 product
        if: inputs.full_release
        working-directory: site
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-protected-build.log"
