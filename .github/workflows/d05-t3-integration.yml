name: D05 T3 source and platform qualification
on:
  push:
    branches: [test/2026-11-24-d05-t3-integration]
    paths: [.github/workflows/d05-t3-integration.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/cehovod
          ref: 74157ffaf21c322d0f89a53a61ec3cfad63d44e5
          token: ${{ secrets.DOMEN }}
          path: domain
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/cehovod.ru
          ref: 1d0fe563ae195697d29a7cd7b3e75c2f4b5cf8f0
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 9f41447197251d41e69fbcb98e52ef1050754ec2
          token: ${{ secrets.DOMEN }}
          path: assistant
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 326f725c44d69ac99f6b912241e9e8a6c3d716a5
          path: one-core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify owner pack and original runtime contract
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-owner.log"
          if ! (cd domain && node scripts/cehovod-skill-authoring.mjs check && node --test tests/assistant-skills.test.mjs) >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_[A-Z0-9_]+' "$log" | sort -u | head -20 || true
            echo D05_T3_OWNER_SKILLS_FAIL
            exit 1
          fi
          cmp -s domain/models/assistant-skills.json site/public/assets/cehovod-assistant-skills.json
          cmp -s domain/src/lib/iwps/registry-snapshot.generated.json site/src/lib/iwps/registry-snapshot.generated.json
          node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          import {validateSkillPack} from "./assistant/browser-local-inference/domain-assistant/skill-runtime.mjs";
          const pack=validateSkillPack(JSON.parse(readFileSync("site/public/assets/cehovod-assistant-skills.json","utf8")));
          if(pack.skills.length!==11||pack.formHints.length!==11||pack.resultHints.length!==11)throw Error("D05_T3_PACK_COUNTS");
          console.log("D05_T3_ORIGINAL_RUNTIME_SKILLS_PASS");
          JS
          if ! (cd domain && T3_ASSISTANT_SOURCE="$GITHUB_WORKSPACE/assistant/browser-local-inference/domain-assistant" node --test tests/assistant-field-policy.test.mjs) >"$log" 2>&1; then
            grep -Eo '^not ok [0-9]+' "$log" | head -40 || true
            echo D05_T3_FIELD_POLICY_FAIL
            exit 1
          fi
          echo D05_T3_FIELD_POLICY_35_PASS
          echo D05_T3_OWNER_PROJECTION_PASS
      - name: Install dependencies without exporting private sources
        working-directory: site
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/d05-t3-npm.log" 2>&1 || { echo D05_T3_NPM_FAIL; exit 1; }
      - name: Check actual TSX syntax with no source disclosure
        working-directory: site
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import ts from "typescript";
          import {readFileSync} from "node:fs";
          const pack=JSON.parse(readFileSync("public/assets/cehovod-assistant-skills.json","utf8"));
          let errors=0;
          for(const skill of pack.skills){
            const path="src/routes/"+skill.route.slice(1,-1).replaceAll("/",".")+".tsx";
            const file=ts.createSourceFile(path,readFileSync(path,"utf8"),ts.ScriptTarget.Latest,true,ts.ScriptKind.TSX);
            for(const d of file.parseDiagnostics){
              const loc=file.getLineAndCharacterOfPosition(d.start??0);
              console.log("D05_T3_TSX_PARSE_DIAG "+JSON.stringify({skill:skill.id,code:d.code,line:loc.line+1,column:loc.character+1}));
              errors++;
            }
          }
          if(errors)process.exitCode=1;
          else console.log("D05_T3_TSX_PARSE_11_PASS");
          JS
      - name: Verify real JSX bindings and source types
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-site.log"
          if ! node scripts/cehovod-assistant-skills.mjs >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_SKILL_PROJECTION_[A-Za-z0-9_-]+' "$log" | sort -u | head -20 || true
            echo D05_T3_BINDINGS_SOURCE_FAIL
            exit 1
          fi
          echo D05_T3_BINDINGS_SOURCE_PASS
          if ! node --test scripts/cehovod-assistant-skills.test.mjs >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_SKILL_PROJECTION_[A-Z0-9_a-z-]+|^not ok [0-9]+|CEHOVOD_[A-Z0-9_]+' "$log" | sort -u | head -20 || true
            echo D05_T3_BINDINGS_FAIL
            exit 1
          fi
          echo D05_T3_BINDINGS_PASS
      - name: Typecheck site and diagnose exact source locations
        id: site_types
        continue-on-error: true
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-site-types.log"
          if ! npm run typecheck -- --pretty false >"$log" 2>&1; then
            node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          const rows=readFileSync(process.env.RUNNER_TEMP+"/d05-t3-site-types.log","utf8").split("\n");
          const found=new Set();
          for(const row of rows){
            const m=row.match(/^\s*((?:src|scripts|t2-site-module)\/[A-Za-z0-9_./-]{1,180})\((\d{1,6}),(\d{1,6})\): error (TS\d{4,6}):/);
            if(!m)continue;
            const key=JSON.stringify({file:m[1],line:Number(m[2]),column:Number(m[3]),code:m[4]});
            if(!found.has(key)&&found.size<60){found.add(key);console.log("D05_T3_SITE_TYPE_DIAG "+key);}
          }
          JS
            grep -Eo 'TS[0-9]{4,6}' "$log" | sort -u | head -20 || true
            echo D05_T3_TYPES_FAIL
            exit 1
          fi
          echo D05_T3_TYPES_PASS
      - name: Verify the existing domain module contracts
        id: module
        continue-on-error: true
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-module.log"
          if ! npm run verify:t2-module >"$log" 2>&1; then
            grep -Eo '^not ok [0-9]+|CEHOVOD_[A-Z0-9_]+|TS[0-9]{4,6}' "$log" | sort -u | head -30 || true
            echo D05_T3_EXISTING_MODULE_FAIL
            exit 1
          fi
          echo D05_T3_EXISTING_MODULE_PASS
      - name: Lint exact candidate and emit source-free diagnostics
        id: lint
        continue-on-error: true
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          code=0
          npx eslint . -f json -o "$RUNNER_TEMP/d05-t3-lint.json" >"$RUNNER_TEMP/d05-t3-lint.log" 2>&1 || code=$?
          node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          import {basename,relative} from "node:path";
          const rows=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/d05-t3-lint.json","utf8"));
          const errors=rows.filter(r=>r.errorCount);
          for(const row of errors.slice(0,30)){
            const ruleCounts={};
            for(const msg of row.messages.filter(m=>m.severity===2)){
              const key=msg.ruleId||"parse";
              ruleCounts[key]=(ruleCounts[key]||0)+1;
            }
            console.log("D05_T3_LINT_DIAG "+JSON.stringify({file:basename(row.filePath),count:row.errorCount,rules:ruleCounts}));
          }
          JS
          if [ "$code" -ne 0 ]; then echo D05_T3_LINT_FAIL; exit "$code"; fi
          echo D05_T3_LINT_PASS
      - name: Produce bounded formatting-only edit coordinates
        working-directory: site
        shell: bash
        if: steps.lint.outcome == 'failure'
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          import {createHash} from "node:crypto";
          import {relative} from "node:path";
          import * as prettier from "prettier";
          const rows=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/d05-t3-lint.json","utf8"));
          // Only allow whitespace and common formatting punctuation. Never publish source,
          // strings, identifiers, patches containing code, or formatter diagnostics.
          const layout=/^[ \t\r\n"'\x60,;(){}\[\]\\]*$/u;
          const isLayout=c=>c!==undefined&&layout.test(c);
          const allow=new Set(["public/assets/cehovod-t3-bootstrap.mjs","scripts/build-cehovod-t3-local-site.mjs","scripts/cehovod-assistant-skills.mjs","scripts/cehovod-assistant-skills.test.mjs","scripts/prepare-cehovod-host-build.mjs","scripts/prepare-cehovod-t3-host.mjs","scripts/t3-platform-inputs.mjs","src/routes/instrumenty.pasport-izdeliya.tsx","src/routes/instrumenty.zadanie-podryadchiku.tsx","src/routes/instrumenty.karta-kachestva.tsx","src/routes/instrumenty.plan-fakt.tsx","src/routes/zakaz-v-ceh.tsx","src/routes/instrumenty.gotovnost-k-zapusku.tsx","src/routes/povtornyy-zakaz.tsx","src/router.tsx","src/routes/__root.tsx","src/routes/situacii.$slug.tsx","src/routes/tipy-proizvodstva.$slug.tsx","t2-site-module/cehovod/site-host-port.ts","t2-site-module/cehovod/vendor/cehovod-lifecycle.d.ts","scripts/retain-cehovod-t3-inputs.mjs","scripts/check-t3-assistant-browser.ts","t2-site-module/cehovod/commands.ts","t2-site-module/cehovod/operation-command.ts","t2-site-module/cehovod/operation-baseline.ts","t2-site-module/cehovod/evidence-guard.ts","src/components/home/MainRouteMap.tsx","src/components/home/ProductionTypesMatrix.tsx","src/components/home/SituationSignals.tsx","src/components/home/StartOrderCTA.tsx","src/components/home/ToolsDesk.tsx","src/components/site/NotFoundPage.tsx","src/components/site/ProductionTypeCard.tsx","src/components/site/SituationCard.tsx","src/components/site/ToolLayout.tsx","src/components/workspace/WorkspaceOrderRow.tsx","src/routes/index.tsx","src/routes/instrumenty.index.tsx","src/routes/metodika.tsx","src/routes/o-proekte.tsx","src/routes/privacy.tsx","src/routes/workspace.tsx","src/routes/zakaz.tsx","scripts/check-t3-dist-reproducibility.mjs","scripts/check-t3-public-offline.ts"]);
          for(const row of rows.filter(r=>r.errorCount)){
            const path=relative(process.cwd(),row.filePath);
            if(!allow.has(path)||row.messages.some(m=>m.severity===2&&m.ruleId!=="prettier/prettier"))continue;
            const before=readFileSync(row.filePath,"utf8");
            const after=await prettier.format(before,{...await prettier.resolveConfig(row.filePath),filepath:row.filePath});
            let i=0,j=0;const edits=[];let safe=true;
            while(i<before.length||j<after.length){
              const start=i,begin=j;
              while(isLayout(before[i]))i++;
              while(isLayout(after[j]))j++;
              if(before.slice(start,i)!==after.slice(begin,j))edits.push([start,i-start,after.slice(begin,j)]);
              if(before[i]!==after[j]){safe=false;break;}
              if(i===before.length)break;
              i++;j++;
            }
            if(safe){
              let check=before;
              for(const [at,n,replacement] of [...edits].reverse()){
                if(!layout.test(check.slice(at,at+n))||!layout.test(replacement)){safe=false;break;}
                check=check.slice(0,at)+replacement+check.slice(at+n);
              }
              safe=safe&&check===after;
            }
            if(!safe||edits.length>2500){console.log("D05_T3_FORMAT_COORDINATES_UNAVAILABLE "+path);continue;}
            const hash=s=>createHash("sha256").update(s).digest("hex");
            console.log("D05_T3_FORMAT_HEADER "+JSON.stringify({path,before:hash(before),after:hash(after),count:edits.length}));
            for(let k=0;k<edits.length;k+=60)console.log("D05_T3_FORMAT_EDITS "+JSON.stringify({path,start:k,edits:edits.slice(k,k+60)}));
          }
          JS
      - name: Run existing production subject regression
        id: subject
        continue-on-error: true
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-subject.log"
          if ! npm run test >"$log" 2>&1; then
            grep -Eo 'Tests[[:space:]]+[0-9]+ failed|CEHOVOD_[A-Z0-9_]+' "$log" | sort -u | head -30 || true
            echo D05_T3_SUBJECT_FAIL
            exit 1
          fi
          grep -E '^[[:space:]]*(Test Files|Tests)[[:space:]]+[0-9]+ passed' "$log" | tail -2 || true
          echo D05_T3_SUBJECT_PASS
      - name: Verify exact portable common platform
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Faust-S/knowledge/actions/artifacts/14920233669/zip > "$RUNNER_TEMP/t3-artifact.zip"
          unzip -p "$RUNNER_TEMP/t3-artifact.zip" platform-inputs.zip > "$RUNNER_TEMP/platform-inputs.zip"
          if ! node scripts/t3-platform-inputs.mjs verify "$RUNNER_TEMP/platform-inputs.zip" > "$RUNNER_TEMP/d05-t3-platform.log" 2>&1; then
            grep -Eo 'CEHOVOD_T3_PLATFORM_[A-Z0-9_]+' "$RUNNER_TEMP/d05-t3-platform.log" | sort -u | head -20 || true
            echo D05_T3_PLATFORM_FAIL
            exit 1
          fi
          echo D05_T3_PLATFORM_PASS
      - name: Compile original T3 Host with current domain module and shared assistant
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-host.log"
          if ! npm run prepare:t3-host -- "$GITHUB_WORKSPACE/one-core/packages/t3-core" "$RUNNER_TEMP/cehovod-host" "$RUNNER_TEMP/platform-inputs.zip" "$GITHUB_WORKSPACE/assistant" https://cehovod.ru >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_T3_HOST_PHASE_[A-Z0-9_]+' "$log" | tail -5 || true
            grep -Eo 'CEHOVOD_[A-Z0-9_]+|IWXA_[A-Z0-9_]+|T[23]_[A-Z0-9_]+|TS[0-9]{4,6}|ERR_[A-Z0-9_]+' "$log" | sort -u | head -50 || true
            node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          import {basename} from "node:path";
          const rows=readFileSync(process.env.RUNNER_TEMP+"/d05-t3-host.log","utf8").split("\n");
          const found=new Set();
          for(const row of rows){
            const match=row.match(/^\s*([A-Za-z0-9_./-]{1,240})\((\d{1,6}),(\d{1,6})\): error (TS\d{4,6}):/);
            if(!match)continue;
            const key=JSON.stringify({file:basename(match[1]),line:Number(match[2]),column:Number(match[3]),code:match[4],area:match[1].includes("cehovod/")?"domain":match[1].includes("node_modules")?"dependency":"core"});
            if(!found.has(key)&&found.size<60){found.add(key);console.log("D05_T3_HOST_TYPE_DIAG "+key);}
          }
          JS
            echo D05_T3_HOST_BUILD_FAIL
            exit 1
          fi
          echo D05_T3_HOST_BUILD_PASS
      - name: Retain verified original Host and platform in the local version directory
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-retain.log"
          if ! npm run retain:t3-inputs -- "$RUNNER_TEMP/cehovod-host" "$RUNNER_TEMP/platform-inputs.zip" >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_T3_[A-Z0-9_]+' "$log" | sort -u | head -30 || true
            echo D05_T3_RETAIN_FAIL
            exit 1
          fi
          if ! npm run retain:t3-inputs -- "$RUNNER_TEMP/cehovod-host" "$RUNNER_TEMP/platform-inputs.zip" >"$log" 2>&1; then
            echo D05_T3_RETAIN_REPEAT_FAIL
            exit 1
          fi
          grep -Eq '"added":0' "$log"
          echo D05_T3_RETAIN_PASS
      - name: Remove disposable original source checkouts before ordinary assembly
        shell: bash
        run: |
          set -euo pipefail
          for name in domain assistant one-core; do
            test -d "$GITHUB_WORKSPACE/$name"
            test ! -L "$GITHUB_WORKSPACE/$name"
            rm -rf "$GITHUB_WORKSPACE/$name"
            test ! -e "$GITHUB_WORKSPACE/$name"
          done
          echo D05_T3_NO_EXTERNAL_SOURCE_CHECKOUTS_PASS
      - name: Build complete local T3 dist from retained inputs
        working-directory: site
        shell: bash
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-product.log"
          if ! node scripts/build-cehovod-t3-local-site.mjs >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_[A-Z0-9_]+|IWXA_[A-Z0-9_]+|T3_[A-Z0-9_]+|TS[0-9]{4,6}' "$log" | sort -u | head -30 || true
            echo D05_T3_DIST_BUILD_FAIL
            exit 1
          fi
          echo D05_T3_DIST_BUILD_PASS
      - name: Exercise actual no-model assistant and existing React forms
        id: browser
        continue-on-error: true
        working-directory: site
        shell: bash
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-browser.log"
          if ! npm run check:t3-assistant-browser >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_T3_ASSISTANT_[A-Za-z0-9_-]+|TimeoutError|AssertionError|TS[0-9]{4,6}' "$log" | sort -u | head -30 || true
            echo D05_T3_ASSISTANT_BROWSER_FAIL
            exit 1
          fi
          grep -E '^\{"status":"CEHOVOD_T3_ASSISTANT_NO_MODEL_PASS","routes":[0-9]+,"forms":[0-9]+,"costRoutes":[0-9]+,"orderRoutes":[0-9]+,"actualInference":false,"productAccepted":false\}$' "$log"
          echo D05_T3_ASSISTANT_BROWSER_PASS
      - name: Cold offline public site using original worker and persistent browser profile
        id: offline
        continue-on-error: true
        working-directory: site
        shell: bash
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-offline.log"
          if ! npm run check:t3-public-offline >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_T3_OFFLINE_[A-Za-z0-9_-]+|TimeoutError|AssertionError' "$log" | sort -u | head -30 || true
            echo D05_T3_PUBLIC_OFFLINE_FAIL
            exit 1
          fi
          grep -E '^\{"status":"CEHOVOD_T3_PUBLIC_COLD_OFFLINE_PASS","routes":11,"files":[0-9]+,"serverStopped":true,"browserRestarted":true,"actualInference":false,"protectedWorkspaceAccepted":false\}$' "$log"
          echo D05_T3_PUBLIC_OFFLINE_PASS
      - name: Exact repeat build and damaged-input rollback from retained bytes
        id: repro
        continue-on-error: true
        working-directory: site
        shell: bash
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-repro.log"
          if ! node scripts/check-t3-dist-reproducibility.mjs >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_[A-Z0-9_]+|IWXA_[A-Z0-9_]+|T3_[A-Z0-9_]+|AssertionError' "$log" | sort -u | head -30 || true
            echo D05_T3_REPRO_FAIL
            exit 1
          fi
          grep -E '^\{"status":"CEHOVOD_T3_REPRO_PASS","files":[0-9]+,"invalidInputPreservedDist":true,"exactBytes":true,"productAccepted":false\}$' "$log"
          echo D05_T3_REPRO_PASS
      - name: Require exact-source qualification
        if: always()
        shell: bash
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPES_OUTCOME: ${{ steps.site_types.outcome }}
          MODULE_OUTCOME: ${{ steps.module.outcome }}
          SUBJECT_OUTCOME: ${{ steps.subject.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          OFFLINE_OUTCOME: ${{ steps.offline.outcome }}
          REPRO_OUTCOME: ${{ steps.repro.outcome }}
        run: test "$LINT_OUTCOME" = success && test "$TYPES_OUTCOME" = success && test "$MODULE_OUTCOME" = success && test "$SUBJECT_OUTCOME" = success && test "$BROWSER_OUTCOME" = success && test "$OFFLINE_OUTCOME" = success && test "$REPRO_OUTCOME" = success
      - name: Clear private diagnostics
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/d05-t3-*.log "$RUNNER_TEMP"/d05-t3-lint.json
          rm -rf "$RUNNER_TEMP/cehovod-host" "$RUNNER_TEMP/t3-artifact.zip" "$RUNNER_TEMP/platform-inputs.zip" "$GITHUB_WORKSPACE/site/dist" "$GITHUB_WORKSPACE/site/.native-build" "$GITHUB_WORKSPACE/site/runtime/t3-platform/0.3.1-rc.1/cehovod-host" "$GITHUB_WORKSPACE/site/runtime/t3-platform/0.3.1-rc.1/platform-inputs.zip"
