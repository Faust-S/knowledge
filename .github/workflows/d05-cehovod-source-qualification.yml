name: d05-cehovod-private-source-qualification
on:
  push:
    branches:
      - test/2026-11-18-d05-source-qualification
    paths:
      - .github/workflows/d05-cehovod-source-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d05-source-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: D05 source gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact private sources without publishing files
        env:
          DOMEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOMEN:-}" ]; then
            echo "D05_DOMEN=UNAVAILABLE"
            exit 1
          fi
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DOMEN" | base64 | tr -d '\r\n')"
          fetch_private() {
            local repo="$1" branch="$2" expected="$3" destination="$4"
            if ! GIT_TERMINAL_PROMPT=0 git -c "http.extraheader=$header" ls-remote --exit-code "https://github.com/Faust-S/${repo}.git" "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "D05_READ_${destination}=FAIL"
              return 1
            fi
            echo "D05_READ_${destination}=PASS"
            if ! GIT_TERMINAL_PROMPT=0 git -c "http.extraheader=$header" clone --quiet --depth 1 --single-branch --branch "$branch" --no-tags "https://github.com/Faust-S/${repo}.git" "$destination" >/dev/null 2>&1; then
              echo "D05_CLONE_${destination}=FAIL"
              return 1
            fi
            local actual
            actual="$(git -C "$destination" rev-parse HEAD)"
            if [ "$actual" != "$expected" ]; then
              echo "D05_REVISION_${destination}=FAIL"
              return 1
            fi
            echo "D05_REVISION_${destination}=PASS"
          }
          fetch_private "cehovod.ru" "work/2026-10-23-t2-site-only" "f97388621bb4982e774cb777c01c5df8b548c60a" "site"
          fetch_private "cehovod" "work/2026-11-23-d05-capacity-scenarios" "100e9495d4a79d034181af97114d0cc9004ff203" "domain"
          unset header DOMEN
          # Use committed Git blobs, not CRLF-converted Windows checkout bytes.
          # The workflow reports only PASS/FAIL; no private source leaves CI.
          capacity_match=true
          for relative in src/lib/shop-capacity.ts src/lib/shop-capacity.test.ts src/lib/capacity-decision.ts src/lib/capacity-decision.test.ts src/lib/capacity-resource-scope.ts src/lib/capacity-resource-scope.test.ts; do
            site_blob="$(git -C site rev-parse "HEAD:$relative")"
            domain_blob="$(git -C domain rev-parse "HEAD:$relative")"
            if [ "$site_blob" != "$domain_blob" ]; then
              capacity_match=false
            fi
          done
          if [ "$capacity_match" = true ]; then
            echo "D05_CAPACITY_CANONICAL_BLOB_MATCH=PASS"
          else
            echo "D05_CAPACITY_CANONICAL_BLOB_MATCH=FAIL"
            exit 1
          fi
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Check Windows Git path normalization on synthetic files
        if: runner.os == 'Windows'
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const os = require("node:os");
          const cp = require("node:child_process");
          const root = fs.mkdtempSync(path.join(os.tmpdir(), "d05-ci-git-fixture-"));
          try {
            cp.execFileSync("git", ["init", "-q", root]);
            const requested = fs.realpathSync(root);
            const raw = cp.execFileSync("git", ["-C", requested, "rev-parse", "--show-toplevel"], {encoding:"utf8"}).trim();
            const checkout = fs.realpathSync(raw);
            const rel = path.relative(checkout, requested);
            console.log("D05_WIN_GIT_TOP_ABSOLUTE="+path.isAbsolute(raw));
            console.log("D05_WIN_REALPATH_IDENTITY="+(requested === checkout));
            console.log("D05_WIN_RELATIVE_IDENTITY="+(rel === ""));
            console.log("D05_WIN_RELATIVE_OUTSIDE="+(rel === ".." || rel.startsWith(".."+path.sep) || path.isAbsolute(rel)));
            console.log("D05_WIN_REQ_DRIVE="+path.parse(requested).root.slice(0,2).toUpperCase());
            console.log("D05_WIN_GIT_DRIVE="+path.parse(checkout).root.slice(0,2).toUpperCase());
          } finally {
            fs.rmSync(root,{recursive:true,force:true});
          }
          NODE
      - name: Install site dependencies privately
        run: |
          set -euo pipefail
          cd site
          if npm ci --no-audit --no-fund > "$RUNNER_TEMP/d05-npm-ci.log" 2>&1; then
            echo "D05_NPM_CI=PASS"
          else
            echo "D05_NPM_CI=FAIL"
            exit 1
          fi
      - name: Check changed file formatting privately
        run: |
          set -euo pipefail
          cd site
          format_failure=0
          for file in src/host/CehovodHostApp.tsx src/host/CehovodHostApp.ui-regression.test.ts src/host/production-progress.ts src/host/production-progress.test.ts src/host/order-close-overview.ts src/host/order-close-overview.test.ts src/host/CehovodDispatchQueue.tsx src/host/CehovodDispatchQueue.ui-regression.test.ts src/host/dispatch-queue.ts src/host/dispatch-queue.test.ts src/lib/shop-capacity.ts src/lib/shop-capacity.test.ts src/lib/capacity-decision.ts src/lib/capacity-decision.test.ts src/lib/capacity-resource-scope.ts src/lib/capacity-resource-scope.test.ts src/host/dispatch-capacity.ts src/host/dispatch-capacity.test.ts src/lib/capacity-resource-scope.ts src/lib/capacity-resource-scope.test.ts src/host/dispatch-capacity.test.ts src/host/CehovodCapacityPanel.tsx src/host/CehovodCapacityPanel.regression.test.ts src/host/capacity-date.ts src/host/native-port.ts t2-site-module/cehovod/site-host-port.ts t2-site-module/cehovod/vendor/cehovod-host.d.ts scripts/d05-first-use-real-kernel-witness.mjs; do
            if npx --no-install prettier --check "$file" > "$RUNNER_TEMP/d05-prettier.log" 2>&1; then
              echo "D05_FORMAT_$(basename "$file")=PASS"
            else
              echo "D05_FORMAT_$(basename "$file")=FAIL"
              format_failure=1
            fi
          done
          echo "D05_FORMAT_DIAGNOSTIC_FAILURE=$format_failure"
          test "$format_failure" -eq 0 || exit 1
      - name: Run complete source gate privately
        run: |
          set -euo pipefail
          cd site
          if npm run check:source > "$RUNNER_TEMP/d05-source.log" 2>&1; then
            echo "D05_CHECK_SOURCE=PASS"
          else
            echo "D05_CHECK_SOURCE=FAIL"
            # Emit only ESLint rule IDs and line numbers, never private code.
            npx --no-install eslint src/host/dispatch-queue.ts src/host/CehovodDispatchQueue.tsx src/host/dispatch-queue.test.ts scripts/d05-first-use-real-kernel-witness.mjs scripts/check-htaccess.ts scripts/check-htaccess.test.ts scripts/verify-cehovod-product.mjs scripts/prepare-cehovod-host-build.mjs scripts/prepare-cehovod-host-build.test.mjs src/lib/temporary-workspace.ts src/host/draft-source-handoff.ts src/host/CehovodHostApp.tsx src/host/CehovodHostApp.ui-regression.test.ts src/host/production-progress.ts src/host/production-progress.test.ts src/host/order-close-overview.ts src/host/order-close-overview.test.ts src/host/CehovodDispatchQueue.tsx src/host/CehovodDispatchQueue.ui-regression.test.ts src/host/dispatch-queue.ts src/host/dispatch-queue.test.ts src/lib/shop-capacity.ts src/lib/shop-capacity.test.ts src/lib/capacity-decision.ts src/lib/capacity-decision.test.ts src/lib/capacity-resource-scope.ts src/lib/capacity-resource-scope.test.ts src/host/dispatch-capacity.ts src/host/dispatch-capacity.test.ts src/lib/capacity-resource-scope.ts src/lib/capacity-resource-scope.test.ts src/host/dispatch-capacity.test.ts src/host/CehovodCapacityPanel.tsx src/host/CehovodCapacityPanel.regression.test.ts src/host/capacity-date.ts src/host/native-port.ts t2-site-module/cehovod/site-host-port.ts t2-site-module/cehovod/vendor/cehovod-host.d.ts src/host/case-001-source-handoff.test.ts src/host/CehovodWorkspaceLabels.test.ts src/routes/instrumenty.karta-kachestva.tsx scripts/check-navigation-a11y.ts --format json > "$RUNNER_TEMP/d05-dispatch-eslint.json" 2>/dev/null || true
            node -e 'const fs=require("node:fs");try{const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/d05-dispatch-eslint.json","utf8"));for(const f of data){const name=f.filePath.replace(/\\/g,"/").split("/").at(-1);for(const m of f.messages)console.log("D05_DISPATCH_LINT="+name+":"+(m.ruleId||"parse")+":"+m.line+":"+m.column)}}catch{console.log("D05_DISPATCH_LINT_REPORT=UNAVAILABLE")}'
            # Print only the failing gate and error-category counts.
            # No private source text, test stack, npm log or artifact is published.
            node -e '
            const fs=require("node:fs");
            const t=fs.readFileSync(process.env.RUNNER_TEMP+"/d05-source.log","utf8");
            const stages=[...t.matchAll(/^> (?:cehovod[^\n]* )?(verify:[^\n]*|check:[^\n]*|typecheck|lint|test(?::coverage)?|build:[^\n]*)$/gm)].map(m=>m[1]);
            console.log("D05_LAST_COMMAND="+(stages.at(-1)||"unclassified").replace(/[^-a-zA-Z0-9: ]/g,"").slice(0,80));
            console.log("D05_TYPESCRIPT_ERRORS="+(t.match(/error TS\d+/g)||[]).length);
            console.log("D05_TYPESCRIPT_LOCATIONS="+[...t.matchAll(/([A-Za-z0-9_./-]+\.tsx?)\((\d+),(\d+)\): error (TS\d+)/g)].map(x=>x[1].split("/").at(-1)+":"+x[2]+":"+x[3]+":"+x[4]).slice(0,12).join(","));
            console.log("D05_TEST_FAILURE_LINES="+(t.match(/(?:FAIL|not ok) /g)||[]).length);
            console.log("D05_VENDOR_MISSING="+(/ERR_MODULE_NOT_FOUND[^\n]*cehovod-lifecycle|Cannot find module[^\n]*cehovod-lifecycle/.test(t)));
            console.log("D05_TAP_SESSIONS="+(t.match(/TAP version 13/g)||[]).length);
            console.log("D05_NODE_TEST_FAILURE_COUNT="+(t.match(/^not ok [0-9]+/gm)||[]).length);
            console.log("D05_NODE_TEST_FAILURE_ORDINALS="+[...t.matchAll(/^not ok ([0-9]+)/gm)].map(x=>x[1]).join(","));
            const codes=[...new Set(t.match(/\b(?:ERR_[A-Z0-9_]+|CEHOVOD_[A-Z0-9_]+|ENOENT|EPERM|EACCES)\b/g)||[])];
            console.log("D05_DIAGNOSTIC_CODES="+codes.slice(-12).join(","));
            console.log("D05_VITE_BUILD_FAILURE="+(/\bbuild failed\b|\bCould not resolve\b/i.test(t)));
            console.log("D05_TEST_RUN_ABORTED="+(/ERR_MODULE_NOT_FOUND|Cannot find module/i.test(t)));
            const failLines=t.split(/\r?\n/).filter(line=>/^\s*(?:FAIL|❯|×)\s/.test(line));
            const failPaths=[...new Set(failLines.flatMap(line=>[...line.matchAll(/(src\/[A-Za-z0-9_./$-]+\.test\.[jt]sx?)/g)].map(m=>m[1])))];
            console.log("D05_VITEST_FAILED_FILES="+failPaths.slice(0,15).join(","));
            const failureClasses=[...new Set(t.match(/(?:AssertionError|ReferenceError|TypeError|SyntaxError|ENOENT|ERR_TEST_FAILURE)/g)||[])];
            console.log("D05_FAILURE_CLASSES="+failureClasses.join(","));
            const testFileSummary=t.split(/\r?\n/).filter(line=>/(?:Test Files|Tests  |Test Suites)/.test(line)).slice(-2);
            console.log("D05_VITEST_HAS_SUMMARY="+(testFileSummary.length>0));
            const plain=t.replace(/\x1B\[[0-9;]*[A-Za-z]/g,"").replace(/\r/g,"");
            const rawMatches=[...plain.matchAll(/(?:^|\n)\s*(?:FAIL|❯|✗|×)\s+((?:src|scripts)\/[A-Za-z0-9_./$-]+\.test\.[cm]?[jt]sx?)/gm)];
            console.log("D05_VITEST_FAILURE_PATHS="+[...new Set(rawMatches.map(m=>m[1]))].slice(0,20).join(","));
            '
            # JSON reporter isolates failing file and test ordinal without copying
            # private source, assertion text or test names into a public log.
            if npx --no-install vitest run --reporter=json --outputFile="$RUNNER_TEMP/d05-vitest-results.json" > "$RUNNER_TEMP/d05-vitest-rerun.log" 2>&1; then
              echo "D05_VITEST_RERUN=PASS"
            else
              echo "D05_VITEST_RERUN=FAIL"
            fi
            if [ -f "$RUNNER_TEMP/d05-vitest-results.json" ]; then
              node -e '
            const fs=require("node:fs");const path=require("node:path");
            const report=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/d05-vitest-results.json","utf8"));
            const bad=[];
            for(const file of report.testResults||[]){
              const rel=path.relative(process.cwd(),file.name||"").replace(/\\/g,"/");
              const safe=/^(src|scripts)\/[A-Za-z0-9_./$-]+\.test\.[cm]?[jt]sx?$/.test(rel)?rel:"UNCLASSIFIED";
              const cases=file.assertionResults||[];
              const indexes=cases.flatMap((a,i)=>a.status==="failed"?[i+1]:[]);
              if(indexes.length||file.status==="failed")bad.push({file:safe,indexes,loadError:!indexes.length});
            }
            console.log("D05_FAILED_TEST_LOCATIONS="+bad.map(x=>x.file+":"+x.indexes.join(".")+(x.loadError?"L":"")).join(","));
            console.log("D05_FAILED_TEST_FILE_COUNT="+bad.length);
              '
            else
              echo "D05_VITEST_REPORT=UNAVAILABLE"
            fi
            exit 1
          fi
      - name: Build site source without browser automation
        run: |
          set -euo pipefail
          cd site
          if npm run build:source > "$RUNNER_TEMP/d05-build-source.log" 2>&1; then
            echo "D05_BUILD_SOURCE=PASS"
          else
            echo "D05_BUILD_SOURCE=FAIL"
            exit 1
          fi
      - name: Report qualified source-only result
        run: |
          echo "D05_SOURCE_ONLY=PASS"
          echo "D05_KERNEL_RECEIPTS=NOT_RUN"
          echo "D05_ONE_DIST=NOT_RUN"
          echo "D05_BROWSER_GUI=NOT_RUN"
