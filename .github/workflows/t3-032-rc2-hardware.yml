name: T3 0.3.2-rc.2 exact assistant inputs and hardware consultation
on:
  push:
    branches: ['ci/once/t3-032-rc2-hardware/0a2cd84af5d56e148e003326bada030da8fb62e2']
    paths: ['.github/ci-requests/t3-032-rc2-hardware.json']
permissions:
  contents: read
  actions: read
jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.retain.outputs.artifact-id }}
    env:
      SOURCE: '0a2cd84af5d56e148e003326bada030da8fb62e2'
      PRIOR: '51439e7f0a83e62cfb63d494a43429250b13986f'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '0a2cd84af5d56e148e003326bada030da8fb62e2'
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - uses: actions/download-artifact@v4
        with:
          name: iwxa-t3-platform-inputs-0.3.2-rc.1-51439e7f0a83e62cfb63d494a43429250b13986f
          path: ${{ runner.temp }}/prior
          github-token: ${{ github.token }}
          run-id: 46056058954
      - name: Reuse qualified platform, package exact assistant source pin
        working-directory: packages/t3-core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git diff --quiet "$PRIOR" HEAD -- src integration-sources qualified-runtime scripts tests vite.config.ts
          echo 'c47d78e503eaccd769b4024b3685e7d93c420272acafa5436409f7756bfdfc98  '"$RUNNER_TEMP/prior/platform-inputs.zip" | sha256sum -c -
          mkdir "$RUNNER_TEMP/prior-input"
          unzip -q "$RUNNER_TEMP/prior/platform-inputs.zip" -d "$RUNNER_TEMP/prior-input"
          (cd "$RUNNER_TEMP/prior-input"; echo '2166ec01816cbaa657208e73113d27c91d27625e269fa62c227c6c30feb36310  t3-platform-inputs.json' | sha256sum -c -; sha256sum -c t3-platform-inputs.sha256)
          test ! -e dist
          cp -a "$RUNNER_TEMP/prior-input/dist" dist
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          for(const name of ['package.json','package-lock.json']){
            const old=readFileSync(join(process.env.RUNNER_TEMP,'prior-input',name),'utf8');
            assert.equal(old.split('"version": "0.3.2-rc.1"').length-1,name==='package.json'?1:2);
            writeFileSync(name,old.replaceAll('"version": "0.3.2-rc.1"','"version": "0.3.2-rc.2"'));
          }
          NODE
          node scripts/package-t3-portable-platform.mjs "$RUNNER_TEMP/candidate" "$SOURCE" "$GITHUB_RUN_ID"
          mkdir "$RUNNER_TEMP/candidate-input"
          unzip -q "$RUNNER_TEMP/candidate/platform-inputs.zip" -d "$RUNNER_TEMP/candidate-input"
          (cd "$RUNNER_TEMP/candidate-input"; sha256sum -c t3-platform-inputs.sha256)
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']);a=t/'prior-input';b=t/'candidate-input'
          m=json.loads((a/'t3-platform-inputs.json').read_text());n=json.loads((b/'t3-platform-inputs.json').read_text())
          r=json.loads((t/'candidate/candidate-receipt.json').read_text())
          assert m['sourceCommit']==os.environ['PRIOR'] and n['sourceCommit']==r['sourceCommit']==os.environ['SOURCE']
          assert n['version']==r['version']=='0.3.2-rc.2' and n['status']=='TECHNOLOGY_CANDIDATE_NOT_RELEASED'
          old={f['path']:f for f in m['files']};new={f['path']:f for f in n['files']}
          assert set(old)==set(new) and len(new)==174
          changed=sorted(k for k in new if old[k]!=new[k])
          assert changed==sorted(['package.json','package-lock.json','docs/t3-consolidation-sources.json']),changed
          owners=json.loads((b/'docs/t3-consolidation-sources.json').read_text())
          assert owners['originalAssistant']['commit']=='8b5a62fcaf2ac2cd714dc8af4468d5ac4e4f5922'
          assert owners['domainAssistantUi']['qualifiedSource']['run']==46060488224
          assert n['modelWeightsIncluded']==n['nativeSignerIncluded']==n['installedProductAccepted']==n['domainMigrationAutoAuthorized']==False
          assert hashlib.sha256((t/'candidate/platform-inputs.zip').read_bytes()).hexdigest()==r['archiveSha256']
          assert hashlib.sha256((b/'t3-platform-inputs.json').read_bytes()).hexdigest()==r['manifestSha256']
          print('T3_032_RC2_EXACT_ASSISTANT_INPUTS_PASS '+json.dumps({'files':len(new),'unchanged':len(new)-len(changed),'changed':changed,'receipt':r}))
          PY
          cp "$RUNNER_TEMP/candidate-input/t3-platform-inputs.json" "$RUNNER_TEMP/candidate-input/t3-platform-inputs.sha256" "$RUNNER_TEMP/candidate/"
      - uses: actions/upload-artifact@v4
        id: retain
        with:
          name: iwxa-t3-platform-inputs-0.3.2-rc.2-0a2cd84af5d56e148e003326bada030da8fb62e2
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30

  hardware-light-profile:
    needs: [platform]
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      SOURCE: '0a2cd84af5d56e148e003326bada030da8fb62e2'
      ASSISTANT: '8b5a62fcaf2ac2cd714dc8af4468d5ac4e4f5922'
      SITE: '004b90f1f50b19ca402e3846b36aa1af3df7ec9b'
      PLATFORM_ARTIFACT: ${{ needs.platform.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '0a2cd84af5d56e148e003326bada030da8fb62e2'
          persist-credentials: false
          path: original-core
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: '8b5a62fcaf2ac2cd714dc8af4468d5ac4e4f5922'
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private-assistant
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/cehovod.ru
          ref: '004b90f1f50b19ca402e3846b36aa1af3df7ec9b'
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private-site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/cehovod
          ref: '6852d55ae8e7100b480b2d5c0a10b92de1c7d467'
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private-subject
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: iwxa-t3-platform-inputs-0.3.2-rc.2-0a2cd84af5d56e148e003326bada030da8fb62e2
          path: ${{ runner.temp }}/platform
      - name: Explicit candidate input import, exact owner bytes
        working-directory: private-site
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SITE"
          test "$(git -C ../original-core rev-parse HEAD)" = "$SOURCE"
          test "$(git -C ../private-assistant rev-parse HEAD)" = "$ASSISTANT"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,mkdirSync,copyFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          const root='runtime/t3-platform',old=join(root,'0.3.2-rc.1'),version='0.3.2-rc.2',next=join(root,version);
          const active=JSON.parse(readFileSync(join(root,'active.json'),'utf8'));
          assert.equal(active.version,'0.3.2-rc.1');
          const prior=JSON.parse(readFileSync(join(old,'release.json'),'utf8'));
          const ap=JSON.parse(readFileSync(join(old,'domain-assistant.json'),'utf8'));
          const sp=JSON.parse(readFileSync(join(old,'domain-skills.json'),'utf8'));
          const r=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,'platform','candidate-receipt.json'),'utf8'));
          assert.equal(r.sourceCommit,process.env.SOURCE);assert.equal(r.version,version);
          assert.equal(r.status,'TECHNOLOGY_CANDIDATE_DOMAIN_NOT_ACCEPTED');
          assert.equal(prior.kernelArchiveSha256,r.kernelArchiveSha256);
          assert.equal(ap.sourceCommit,process.env.ASSISTANT);assert.equal(ap.sharedEngineSource,'51439e7f0a83e62cfb63d494a43429250b13986f');
          assert.equal(sp.sourceCommit,'6852d55ae8e7100b480b2d5c0a10b92de1c7d467');assert.equal(sp.sourceBlob,'15c4e99fbbf2a5c842bcbc810da03effff725230');
          assert.equal(createHash('sha256').update(readFileSync(join(process.env.RUNNER_TEMP,'platform','platform-inputs.zip'))).digest('hex'),r.archiveSha256);
          mkdirSync(next);
          const write=(path,value)=>writeFileSync(path,JSON.stringify(value,null,2)+'\n');
          write(join(next,'release.json'),{...prior,...r,portableArtifactId:Number(process.env.PLATFORM_ARTIFACT)});
          write(join(next,'domain-assistant.json'),{...ap,sharedEngineSource:r.sourceCommit});
          copyFileSync(join(old,'domain-skills.json'),join(next,'domain-skills.json'));
          write(join(root,'active.json'),{...active,version});
          NODE
          echo CEHOVOD_EXPLICIT_CANDIDATE_INPUT_PIN_READY
          if [ -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ]; then
            echo 'PUPPETEER_EXECUTABLE_PATH=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' >> "$GITHUB_ENV"
          fi
      - name: Existing site build and original shared Host
        working-directory: private-site
        shell: bash
        run: |
          set -euo pipefail
          run_private() {
            local label="$1"; shift
            local log="$RUNNER_TEMP/cehovod-$label.log"
            if "$@" > "$log" 2>&1; then
              echo "CEHOVOD_${label}_PASS"
            else
              grep -Eo 'CEHOVOD_[A-Z0-9_]{5,100}|T3_PORTABLE_PLATFORM_[A-Z0-9_]+|error TS[0-9]+' "$log" | sort -u | tail -40 || true
              echo "CEHOVOD_${label}_FAIL"
              exit 1
            fi
          }
          run_private DEPENDENCIES npm ci --ignore-scripts --no-audit --no-fund
          run_private SOURCE_TYPES npm run typecheck
          run_private SKILLS npm run verify:t3-skills
          run_private PLATFORM_IMPORT npm run import:t3-platform -- "$RUNNER_TEMP/platform/platform-inputs.zip"
          run_private HOST npm run prepare:t3-host -- "$GITHUB_WORKSPACE/original-core/packages/t3-core" "$RUNNER_TEMP/domain-host" "$RUNNER_TEMP/platform/platform-inputs.zip" "$GITHUB_WORKSPACE/private-assistant" https://127.0.0.1:18443
          run_private RETAIN npm run retain:t3-inputs -- "$RUNNER_TEMP/domain-host" "$RUNNER_TEMP/platform/platform-inputs.zip"
          run_private ONE_DIST npm run build:product:t3
          run_private PRODUCT_STRUCTURE npm run verify:product:t3
      - name: Prepare existing genuine WebGPU model witness
        working-directory: original-core/packages/t3-core
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/model-browser-deps.log" 2>&1 || { echo MODEL_BROWSER_DEPENDENCIES_FAIL; exit 1; }
          npx --no-install playwright install chromium
          if ! brew list --versions openssl@3 >/dev/null 2>&1; then brew install openssl@3; fi
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Existing real local Qwen light profile, source-bound consultation and cold offline inference
        working-directory: private-site
        shell: bash
        env:
          D05_T2_WITNESS_COPY: ${{ github.workspace }}/original-core/packages/t3-core
          D05_T3_MODEL_EVALUATION_SOURCE: ${{ github.workspace }}/private-subject/tests/assistant-answer-diagnostic.mjs
          D05_T3_MODEL_PROFILE: light
          D05_T3_REQUIRE_HARDWARE_GPU: '1'
          D05_T3_MODEL_GROUNDED_ADVICE: '0'
          D05_T3_MODEL_CROSS_SERVICE: '0'
        run: |
          set -euo pipefail
          test "$(git -C ../private-subject rev-parse HEAD)" = "6852d55ae8e7100b480b2d5c0a10b92de1c7d467"
          node --check scripts/d05-t3-real-model-witness.mjs
          # Only the existing finite evidence records, never private code,
          # raw prompts, user data or raw generated text, leave the runner.
          set +e
          node scripts/d05-t3-real-model-witness.mjs 2>&1 | grep -E '^D05_T3_(MODEL_[A-Z_]+|REAL_MODEL_[A-Z_]+)( |$)'
          outcome=${PIPESTATUS[0]}
          set -e
          exit "$outcome"
