name: D11 private formatting preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/advice-logistics.ru
          ref: work/2026-11-12-case001-logistics-engineering
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies privately
        shell: pwsh
        run: |
          & npm ci --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP "npm.txt")
          if ($LASTEXITCODE -ne 0) { throw "D11_FORMAT_NPM_FAILED" }
      - name: Apply ESLint fixes in temporary checkout ONLY
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP "format.txt"
          & npx eslint . --fix *> $log
          $changed=@(git status --porcelain)
          Write-Output "D11_AUTOFORMAT_CHANGED_FILES=$($changed.Count)"
          $eslint=Join-Path $env:RUNNER_TEMP "eslint.json"
          & npx eslint . --format json *> $eslint
          $rows=Get-Content $eslint -Raw | ConvertFrom-Json
          $total=($rows | Measure-Object -Property errorCount -Sum).Sum
          Write-Output "D11_AFTER_AUTOFORMAT_ERRORS=$total"
          foreach($group in ($rows | ForEach-Object {$_.messages} | Where-Object {$_.severity -eq 2} | Group-Object ruleId)) {
            Write-Output "D11_AFTER_RULE=$($group.Name):$($group.Count)"
          }
          foreach($file in ($rows | Where-Object {$_.errorCount -gt 0} | Select-Object -First 8)) {
            foreach($m in ($file.messages | Where-Object {$_.severity -eq 2} | Select-Object -First 2)) {
              Write-Output "D11_AFTER_FILE=$([IO.Path]::GetFileName($file.filePath)):$($m.line) $($m.ruleId)"
            }
          }
      - name: Check formatted source type consistency
        shell: pwsh
        run: |
          & npx tsc --noEmit --pretty false *> (Join-Path $env:RUNNER_TEMP "types.txt")
          if ($LASTEXITCODE -ne 0) { throw "D11_FORMAT_TYPECHECK_FAILED" }
          Write-Output "D11_FORMAT_TYPECHECK=PASS"
      - name: Run contracts against formatting changes
        shell: pwsh
        run: |
          $tests=@(Get-ChildItem ./tests -Filter "d11-case*.test.mjs" -File | ForEach-Object {$_.FullName})
          $log=Join-Path $env:RUNNER_TEMP "contract.txt"
          & node --experimental-strip-types --test --test-reporter=tap @tests *> $log
          $code=$LASTEXITCODE
          Get-Content $log | Select-String -Pattern '^# (tests|pass|fail)\s+\d+$' | ForEach-Object {$_.Line}
          foreach($m in (Get-Content $log | Select-String '^not ok \d+ - ' | Select-Object -First 20)) {
            Write-Output "D11_FORMAT_CONTRACT_FAIL=$($m.Line)"
          }
          if ($code -ne 0) { throw "D11_FORMAT_CONTRACT_FAILED" }
          Write-Output "D11_FORMAT_CONTRACT=PASS"
      # Deliberately discard private formatted changes. No push or upload.
