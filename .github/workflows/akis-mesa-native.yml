name: AKIS official Mesa 3.5.2 native qualification

# Only run on demand while private read authorization is unavailable.
# This avoids repeated known 403 failures on every CI definition update.
on:
  workflow_dispatch:

# Native tests of an exact private IWXA source commit, without publishing
# source files, logs, runtime payloads, Python wheels, or test artifacts.
permissions:
  contents: read

concurrency:
  group: akis-mesa-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mesa-3-5-2:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the official pinned Mesa release
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q mesa==3.5.2 pytest
          python -c "import importlib.metadata as m; assert m.version('mesa') == '3.5.2'; print('MESA_INSTALLED=3.5.2')"
      - name: Prove official Mesa event scheduling works on the native runner
        shell: bash
        run: |
          python - <<'PY'
          import mesa
          from importlib.metadata import version
          assert version("mesa") == "3.5.2"
          class EconomicPrincipal(mesa.Agent):
              pass
          class QualitativeClock(mesa.Model):
              def __init__(self):
                  super().__init__(seed=0)
                  self.principal = EconomicPrincipal(self)
                  self.seen = []
                  def event():
                      self.seen.append((self.time, len(self.agents)))
                  self.callback = event
                  self.schedule_event(event, at=1.0)
          model = QualitativeClock()
          model.run_until(2.0)
          assert model.seen == [(1.0, 1)], model.seen
          print("MESA_OFFICIAL_EVENT_API=PASS 3.5.2")
          PY
      - name: Select an existing scoped token that can read private IWXA
        shell: bash
        env:
          AKIS_IWXA_TOKEN: ${{ secrets.IWXA }}
          AKIS_SOURCE_TOKEN: ${{ secrets.SOURCE }}
          AKIS_DOMEN_TOKEN: ${{ secrets.DOMEN }}
          AKIS_T3_TOKEN: ${{ secrets.T3 }}
          AKIS_AGENT_TOKEN: ${{ secrets.AGENT }}
          AKIS_CENTER_TOKEN: ${{ secrets.CENTER }}
        run: |
          set -euo pipefail
          for name in AKIS_IWXA_TOKEN AKIS_SOURCE_TOKEN AKIS_DOMEN_TOKEN AKIS_T3_TOKEN AKIS_AGENT_TOKEN AKIS_CENTER_TOKEN; do
            candidate="${!name}"
            if [ -z "$candidate" ]; then continue; fi
            status=$(curl --silent --show-error --max-time 8 --output /dev/null --write-out "%{http_code}" \
              -H "Authorization: Bearer $candidate" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/Faust-S/iwxa)
            if [ "$status" = "200" ]; then
              echo "AKIS_PRIVATE_READ_TOKEN=$candidate" >> "$GITHUB_ENV"
              echo "AKIS_PRIVATE_SOURCE_ACCESS=GRANTED"
              exit 0
            fi
          done
          echo "AKIS_PRIVATE_SOURCE_ACCESS=NOT_AUTHORIZED"
          exit 1
      - name: Check out only the pinned qualitative model, never export its source
        uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa
          ref: 3bed87fe4cac578b44677c54362bebea95b16b54
          path: private-iwxa
          token: ${{ env.AKIS_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/akis/qualitative_mesa/
      - name: Run real Mesa tests and existing source-rule tests
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/private-iwxa
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set +e
          python -m pytest -q -ra --disable-warnings private-iwxa/research/akis/qualitative_mesa/tests > "$RUNNER_TEMP/akis-native-pytest.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "AKIS_NATIVE_MESA=FAIL exit_code=$result"
            grep -E '^FAILED .*::' "$RUNNER_TEMP/akis-native-pytest.log" | sed 's/ .*//' || true
            grep -E '^=+ .* (failed|error|skipped) .* =+$' "$RUNNER_TEMP/akis-native-pytest.log" | tail -n 1 || true
            exit "$result"
          fi
          if grep -Eq '(^|[^0-9])[1-9][0-9]* skipped' "$RUNNER_TEMP/akis-native-pytest.log"; then
            echo "AKIS_NATIVE_MESA=FAIL unexpected skipped test"
            exit 1
          fi
          summary=$(tail -n 1 "$RUNNER_TEMP/akis-native-pytest.log")
          echo "AKIS_NATIVE_MESA=PASS $summary"
      - name: Run local CLI with real Mesa and verify research-only result
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/private-iwxa
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m research.akis.qualitative_mesa.cli --input private-iwxa/research/akis/qualitative_mesa/fixtures/sole_flow.json > "$RUNNER_TEMP/akis-cli-result.json"
          python -c "import json,os; d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'akis-cli-result.json'),encoding='utf-8')); assert d['schema']=='IWXA_AKIS_QUALITATIVE_RESULT/0.1'; assert d['evidence']=='MODEL_ONLY'; assert d['profit']['operator']=='UNKNOWN'; assert d['counts']=={'applied':8,'blocked':0}; assert d['works']['w1']['result']=='ACCEPTED_BY_ORIGINAL_RECIPIENT'; print('AKIS_NATIVE_CLI=PASS MODEL_ONLY, 8 applied, 0 blocked')"
          python -m research.akis.qualitative_mesa.cli --input private-iwxa/research/akis/qualitative_mesa/fixtures/dynamic_need_and_resource_hold.json > "$RUNNER_TEMP/akis-cli-dynamic.json"
          python -c "import json,os; p=os.path.join(os.environ['RUNNER_TEMP'],'akis-cli-dynamic.json'); d=json.load(open(p,encoding='utf-8')); assert d['schema']=='IWXA_AKIS_QUALITATIVE_RESULT/0.1'; assert d['evidence']=='MODEL_ONLY'; assert d['counts']=={'applied':12,'blocked':2}; assert [e['reason'] for e in d['trace'] if e['outcome']=='BLOCKED']==['RESOURCE_READINESS_UNKNOWN','RESOURCE_NOT_AVAILABLE']; assert d['works']['w1']['result']=='ACCEPTED_BY_ORIGINAL_RECIPIENT'; assert d['profit']['operator']=='UNKNOWN'; print('AKIS_NATIVE_DYNAMIC_CLI=PASS MODEL_ONLY, 12 applied, 2 blocked')"
          python -m research.akis.qualitative_mesa.cli --input private-iwxa/research/akis/qualitative_mesa/fixtures/portfolio_economics_unknown.json > "$RUNNER_TEMP/akis-cli-economics.json"
          python -c "import json,os; p=os.path.join(os.environ['RUNNER_TEMP'],'akis-cli-economics.json'); d=json.load(open(p,encoding='utf-8')); e=d['economics']; assert d['evidence']=='MODEL_ONLY'; assert d['counts']=={'applied':18,'blocked':5}; assert d['works']['w2']['result']=='ACCEPTED_BY_ORIGINAL_RECIPIENT'; assert e['source_authority']=='DECLARED_UNVERIFIED'; assert e['source_count']==0; assert e['consolidated_scope_complete_declared'] is False; assert e['consolidated_cash_difference_claimed_scope'] is None; assert e['profit']=='UNKNOWN'; assert e['economic_value_added']=='NOT_IDENTIFIABLE'; assert d['profit']['operator']=='UNKNOWN'; print('AKIS_NATIVE_ECONOMICS_CLI=PASS no fictional money or automated economic advantage')"
          python -m research.akis.qualitative_mesa.cli --input private-iwxa/research/akis/qualitative_mesa/fixtures/portfolio_correction_cascade.json > "$RUNNER_TEMP/akis-cli-portfolio.json"
          python -c "import json,os; p=os.path.join(os.environ['RUNNER_TEMP'],'akis-cli-portfolio.json'); d=json.load(open(p,encoding='utf-8')); assert d['evidence']=='MODEL_ONLY'; assert d['counts']=={'applied':18,'blocked':5}; assert [e['reason'] for e in d['trace'] if e['outcome']=='BLOCKED']==['DEPENDENCY_AWAITING_ACCEPTANCE','UPSTREAM_RESULT_REJECTED','CORRECTION_OWNER_OR_REJECTED_RESULT_REQUIRED','NEW_MODEL_ONLY_EVIDENCE_REQUIRED','DEPENDENCY_AWAITING_ACCEPTANCE']; assert d['works']['w2']['result']=='ACCEPTED_BY_ORIGINAL_RECIPIENT'; assert d['portfolio']['institutional_change']=='NO_AUTOMATIC_CHANGE'; assert d['profit']['system_increment']=='UNKNOWN'; assert len(d['result_history']['w1'])==4; print('AKIS_NATIVE_PORTFOLIO_CLI=PASS MODEL_ONLY 18 applied 5 blocked')"
