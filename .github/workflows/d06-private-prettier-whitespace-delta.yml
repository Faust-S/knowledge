name: d06-private-prettier-whitespace-delta

# Formatter diagnostics ONLY. No code, file paths, patch contents, dist,
# credentials or artifacts leave the Windows runner. Deltas describe only
# spacing positions and whitespace kind, keyed by private Git blob SHA.
on:
  push:
    branches: [test/2026-11-18-d06-qualification]
    paths: [.github/workflows/d06-private-prettier-whitespace-delta.yml]

permissions:
  contents: read

jobs:
  whitespace-delta:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod.ru
          ref: 0613b8cdc0fc9636b967b8d18c1d9cab1abef8bf
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compute only whitespace changes without private text
        shell: bash
        run: |
          set -euo pipefail
          cd private/site
          if [ -n "$(git status --porcelain)" ]; then
            echo "D06_WS_ORIGINAL_TREE=DIRTY"
            exit 1
          fi
          if ! npm ci --no-audit --no-fund > "$RUNNER_TEMP/d06-ws-ci.private.log" 2>&1; then
            echo "D06_WS_INSTALL=FAIL"
            exit 1
          fi
          if ! npm run format:lint:apply > "$RUNNER_TEMP/d06-ws-format.private.log" 2>&1; then
            echo "D06_WS_PRETTIER=FAIL"
            exit 1
          fi
          echo "D06_WS_PRETTIER=PASS"
          python - <<'PY'
          import pathlib
          import subprocess
          import json
          import sys
          def original(path):
              return subprocess.check_output(
                  ["git", "show", "HEAD:" + path], stderr=subprocess.DEVNULL
              ).decode("utf-8")
          def split(s):
              letters=[]
              runs=[""]
              for char in s:
                  if char.isspace():
                      runs[-1] += char
                  else:
                      letters.append(char)
                      runs.append("")
              return "".join(letters),runs
          changed = subprocess.check_output(
              ["git","diff","--name-only"],text=True
          ).splitlines()
          print("D06_WS_CHANGED_FILE_COUNT="+str(len(changed)))
          for path in changed:
              before = original(path)
              after = pathlib.Path(path).read_text(encoding="utf-8")
              orig_symbols, a = split(before)
              new_symbols, b = split(after)
              oldblob=subprocess.check_output(
                  ["git","rev-parse","HEAD:"+path],text=True
              ).strip()
              newblob=subprocess.check_output(
                  ["git","hash-object",path],text=True
              ).strip()
              if orig_symbols != new_symbols:
                  print("D06_WS_NON_WHITESPACE_CHANGE="+oldblob)
                  continue
              delta=[]
              for i in range(len(a)):
                  if a[i]!=b[i]:
                      # Encode exclusively whitespace symbols, never text.
                      ws="".join(
                          {" ":"s", "\n":"n", "\r":"r", "\t":"t"}.get(ch,"x")
                          for ch in b[i]
                      )
                      if "x" in ws:
                          print("D06_WS_UNSUPPORTED_SPACE="+oldblob)
                          break
                      delta.append([i,ws])
              else:
                  print("D06_WS_DELTA="+json.dumps(
                      {"old":oldblob,"new":newblob,"ops":delta},
                      separators=(",",":"),ensure_ascii=True
                  ))
          PY
      - name: Confirm private artifacts remain private
        if: always()
        shell: pwsh
        run: |
          Write-Host "D06_PRIVATE_SOURCE_LOGGED=NO"
          Write-Host "D06_PRIVATE_ARTIFACT_UPLOADS=0"
