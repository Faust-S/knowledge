name: d05-case003-generate-validate
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact private D05 site using authorized token
        env:
          DOMEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          test -n "${DOMEN:-}" || { echo "D05_DOMEN=UNAVAILABLE"; exit 1; }
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DOMEN" | base64 | tr -d '\r\n')"
          if ! GIT_TERMINAL_PROMPT=0 git -c "http.extraheader=$header" clone --depth 1 --single-branch --branch work/2026-10-23-t2-site-only --no-tags --quiet https://github.com/Faust-S/cehovod.ru.git site > "$RUNNER_TEMP/d05-fetch.log" 2>&1; then
            echo "D05_SITE_READ=FAIL"
            exit 1
          fi
          if [ "$(git -C site rev-parse HEAD)" != "24ce9e7f6e4e2af2dea46a9bc96e8bd6af03ce82" ]; then
            echo "D05_SITE_PIN=FAIL"
            exit 1
          fi
          echo "D05_SITE_PIN=PASS"
          unset header DOMEN
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install dependencies
        run: |
          if (cd site && npm ci --no-audit --no-fund) > "$RUNNER_TEMP/d05-install.log" 2>&1; then
            echo "D05_NPM_CI=PASS"
          else
            echo "D05_NPM_CI=FAIL"
            exit 1
          fi
      - name: Generate public metadata and format only new CASE-003 changes
        run: |
          set -euo pipefail
          cd site
          if npm run generate > "$RUNNER_TEMP/d05-generate.log" 2>&1; then
            echo "D05_GENERATE=PASS"
          else
            echo "D05_GENERATE=FAIL"
            exit 1
          fi
          npx --no-install prettier --write \
            src/cases/cabinet-shop-003/quality.ts \
            src/cases/cabinet-shop-003/order-draft.ts \
            src/cases/cabinet-shop-003/order-draft.test.ts \
            src/components/cases/Case001PrefillControl.tsx \
            src/components/cases/Case001PrefillControl.test.tsx \
            src/components/cases/CaseArticleUI.tsx \
            src/routes/keisy.48-tumb.tsx \
            src/routes/instrumenty.materialy-i-specifikaciya.tsx \
            src/routes/instrumenty.make-or-buy.tsx \
            src/routes/instrumenty.marshrut-i-srok.tsx \
            src/routes/instrumenty.sebestoimost-zakaza.tsx \
            src/routes/instrumenty.karta-kachestva.tsx \
            src/routes/zakaz-v-ceh.tsx \
            scripts/check-functional-ui.ts \
            scripts/stage-cehovod-host.mjs \
            scripts/verify-cehovod-product.mjs \
            scripts/d05-first-use-real-kernel-witness.mjs > "$RUNNER_TEMP/d05-format.log" 2>&1
          echo "D05_PRETTIER=PASS"
          # Vite's TanStack Router plugin refreshes its tracked route tree.
          if npm run build:source > "$RUNNER_TEMP/d05-build-source.log" 2>&1; then
            echo "D05_BUILD_SOURCE=PASS"
          else
            echo "D05_BUILD_SOURCE=FAIL"
            exit 1
          fi
          grep -q "'/keisy/48-tumb'" src/routeTree.gen.ts || { echo "D05_ROUTE_TREE=FAIL"; exit 1; }
          grep -q "https://cehovod.ru/keisy/48-tumb/" public/sitemap.xml || { echo "D05_SITEMAP=FAIL"; exit 1; }
          grep -q "https://cehovod.ru/keisy/48-tumb/" public/llms.txt || { echo "D05_LLMS=FAIL"; exit 1; }
          echo "D05_ROUTE_TREE=PASS"
          echo "D05_SITEMAP=PASS"
          echo "D05_LLMS=PASS"
          git add -- \
            src/cases/cabinet-shop-003/quality.ts \
            src/cases/cabinet-shop-003/order-draft.ts \
            src/cases/cabinet-shop-003/order-draft.test.ts \
            src/components/cases/Case001PrefillControl.tsx \
            src/components/cases/Case001PrefillControl.test.tsx \
            src/components/cases/CaseArticleUI.tsx \
            src/routes/keisy.48-tumb.tsx \
            src/routes/instrumenty.materialy-i-specifikaciya.tsx \
            src/routes/instrumenty.make-or-buy.tsx \
            src/routes/instrumenty.marshrut-i-srok.tsx \
            src/routes/instrumenty.sebestoimost-zakaza.tsx \
            src/routes/instrumenty.karta-kachestva.tsx \
            src/routes/zakaz-v-ceh.tsx \
            scripts/check-functional-ui.ts \
            scripts/stage-cehovod-host.mjs \
            scripts/verify-cehovod-product.mjs \
            scripts/d05-first-use-real-kernel-witness.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "D05_GENERATED_DIFF=UNCHANGED"
          else
            echo "D05_GENERATED_DIFF=PREPARED"
          fi
      - name: Export formatting-only edit instructions (no private source)
        run: |
          set -euo pipefail
          cd site
          node - <<'NODE'
          const fs = require("node:fs");
          const cp = require("node:child_process");
          const paths = [
            "src/cases/cabinet-shop-003/quality.ts",
            "src/cases/cabinet-shop-003/order-draft.ts",
            "src/cases/cabinet-shop-003/order-draft.test.ts",
            "src/components/cases/Case001PrefillControl.tsx",
            "src/components/cases/Case001PrefillControl.test.tsx",
            "src/components/cases/CaseArticleUI.tsx",
            "src/routes/keisy.48-tumb.tsx",
            "src/routes/instrumenty.materialy-i-specifikaciya.tsx",
            "src/routes/instrumenty.make-or-buy.tsx",
            "src/routes/instrumenty.marshrut-i-srok.tsx",
            "src/routes/instrumenty.sebestoimost-zakaza.tsx",
            "src/routes/instrumenty.karta-kachestva.tsx",
            "src/routes/zakaz-v-ceh.tsx",
            "scripts/check-functional-ui.ts",
            "scripts/stage-cehovod-host.mjs",
            "scripts/verify-cehovod-product.mjs",
            "scripts/d05-first-use-real-kernel-witness.mjs",
          ];
          const format = (c) => /[\s,;()*]/u.test(c);
          function separate(s) {
            const chars = [], gaps = [];
            let run = "";
            for(const c of s) {
              if(format(c)) run += c;
              else { gaps.push(run); chars.push(c); run = ""; }
            }
            gaps.push(run);
            return {chars,gaps};
          }
          for(let i=0;i<paths.length;i++){
            const file=paths[i], a=cp.execFileSync("git",["show","HEAD:"+file],{encoding:"utf8"});
            const b=fs.readFileSync(file,"utf8"), old=separate(a), next=separate(b);
            const label="F"+String(i).padStart(2,"0");
            if(old.chars.join("")!==next.chars.join("")){
              console.log("D05_FORMAT_MODE_"+label+"=NONFORMAT_CHANGES");
              console.log("D05_FORMAT_NONWHITE_OLD_"+label+"="+old.chars.length);
              console.log("D05_FORMAT_NONWHITE_NEW_"+label+"="+next.chars.length);
              continue;
            }
            const changes=[];
            for(let j=0;j<next.gaps.length;j++){
              if(old.gaps[j]!==next.gaps[j])changes.push([j,next.gaps[j]]);
            }
            const encoded=Buffer.from(JSON.stringify(changes),"utf8").toString("base64url");
            console.log("D05_FORMAT_MODE_"+label+"=WHITESPACE_ONLY");
            console.log("D05_FORMAT_PATCH_"+label+"="+encoded);
            console.log("D05_FORMAT_SHA_"+label+"="+cp.execFileSync("git",["hash-object",file],{encoding:"utf8"}).trim());
          }
          for(const [name,path] of [
            ["SITEMAP","public/sitemap.xml"],
            ["LLMS","public/llms.txt"],
            ["ROUTETREE","src/routeTree.gen.ts"]
          ]) console.log("D05_GENERATED_SHA_"+name+"="+cp.execFileSync("git",["hash-object",path],{encoding:"utf8"}).trim());
          NODE
      - name: Run CASE-003 TypeScript and Vitest
        run: |
          set -euo pipefail
          cd site
          if npm run typecheck > "$RUNNER_TEMP/d05-type.log" 2>&1; then
            echo "D05_TYPECHECK=PASS"
          else
            echo "D05_TYPECHECK=FAIL"
            node -e '
            const fs=require("node:fs");const t=fs.readFileSync(process.env.RUNNER_TEMP+"/d05-type.log","utf8");
            const codes=[...new Set([...t.matchAll(/error (TS[0-9]+)/g)].map(x=>x[1]))];
            const files=[...new Set([...t.matchAll(/(src\\/[^:( ]+)[(:]/g)].map(x=>x[1]))];
            console.log("D05_TYPE_CODES="+codes.join(","));
            console.log("D05_TYPE_FILES="+files.filter(x=>/cabinet|keisy|site-routes/.test(x)).slice(0,12).join(","));
            console.log("D05_TYPE_ERRORS="+(t.match(/error TS[0-9]+/g)||[]).length);
            '
            exit 1
          fi
          if npx --no-install vitest run src/cases/cabinet-shop-003 src/components/cases/cabinet-article.test.ts src/components/cases/Case001PrefillControl.test.tsx src/site-routes.test.ts > "$RUNNER_TEMP/d05-vitest.log" 2>&1; then
            echo "D05_CASE003_TESTS=PASS"
          else
            echo "D05_CASE003_TESTS=FAIL"
            node -e '
            const fs=require("node:fs");const t=fs.readFileSync(process.env.RUNNER_TEMP+"/d05-vitest.log","utf8");
            console.log("D05_TEST_ERROR_CODES="+[...new Set(t.match(/CEHOVOD_CASE_003_[A-Z0-9_]+/g)||[])].join(","));
            console.log("D05_TEST_ASSERT_ERRORS="+(t.match(/AssertionError|Error:/g)||[]).length);
            console.log("D05_TEST_FAIL_LINES="+(t.match(/(?:FAIL|❯) /g)||[]).length);
            '
            exit 1
          fi
          echo "D05_CASE003_SOURCE_GATE=PASS"
      - name: Diagnose native CASE-003 UI in disposable static preview
        env:
          IWXA_CEHOVOD_HOST_ORIGIN: https://127.0.0.1:8443
        run: |
          set -euo pipefail
          cd site
          if npm run prerender -- --diagnostic-ssr-only > "$RUNNER_TEMP/d05-article-ssr.log" 2>&1; then
            echo "D05_CASE003_SSR_ONLY=PASS"
          else
            echo "D05_CASE003_SSR_ONLY=FAIL"
            exit 1
          fi
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "D05_CASE003_BROWSER_NOT_AVAILABLE=TRUE"
            exit 1
          fi
          export PUPPETEER_EXECUTABLE_PATH="$chrome"
          if npm run check:functional-ui > "$RUNNER_TEMP/d05-article-browser.log" 2>&1; then
            echo "D05_CASE003_NATIVE_BROWSER=PASS"
          else
            echo "D05_CASE003_NATIVE_BROWSER=FAIL"
            node -e '
            const fs=require("node:fs");
            const t=fs.readFileSync(process.env.RUNNER_TEMP+"/d05-article-browser.log","utf8");
            const codes=[...new Set(t.match(/CASE003_[A-Z0-9_]+/g)||[])];
            console.log("D05_CASE003_FAILURE_CODES="+codes.join(","));
            const frames=[...new Set([...t.matchAll(/check-functional-ui\.ts:(\d+):(\d+)/g)].map(m=>m[1]))];
            console.log("D05_CASE003_FAILURE_LINE="+frames.slice(0,10).join(","));
            const kinds=["TimeoutError","AssertionError","ProtocolError","TypeError","SyntaxError","Error: Navigation","waiting for selector","waiting for function"];
            console.log("D05_CASE003_FAILURE_CLASS="+kinds.filter(k=>t.includes(k)).join(","));
            const markers=t.split(/\r?\n/).filter(s=>s.includes("check-functional-ui: OK"));
            console.log("D05_CASE003_LAST_COMPLETED_GATE="+markers.slice(-1).map(m=>m.replace(/[^A-Za-z0-9:/_ .-]/g,"").slice(0,110)).join(","));
            '
            exit 1
          fi
