name: D04 native T2 3-family Kernel witness
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d04-t2-families-${{ github.ref }}
  cancel-in-progress: true
jobs:
  family-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify DOMEN authorization for three private source repositories
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "D04_DOMEN_SECRET_MISSING"; exit 1; fi
          for repo in Faust-S/bazmed.ru Faust-S/bazmed Faust-S/T2; do
            if ! gh api "repos/$repo" --jq '.id' >/dev/null 2>&1; then
              echo "D04_PRIVATE_SOURCE_ACCESS_DENIED:$repo"
              exit 1
            fi
          done
          echo "D04_NATIVE_PRIVATE_SOURCE_ACCESS=3/3"
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/bazmed.ru
          ref: 2c29c5032d883207ba3ee880db7ae407dafe0a6c
          token: ${{ secrets.DOMEN }}
          path: d04-private/site
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/bazmed
          ref: d0f6ec9d50c01891ed1001fb872ac2d5770e8f0d
          token: ${{ secrets.DOMEN }}
          path: d04-private/model
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: 9c64951cd78411283e8a416641c36d71e169fc1d
          token: ${{ secrets.DOMEN }}
          path: d04-private/t2
          fetch-depth: 0
          persist-credentials: false
      - name: Check immutable source pins
        run: |
          set -euo pipefail
          test "$(git -C d04-private/site rev-parse HEAD)" = "2c29c5032d883207ba3ee880db7ae407dafe0a6c"
          test "$(git -C d04-private/model rev-parse HEAD)" = "d0f6ec9d50c01891ed1001fb872ac2d5770e8f0d"
          test "$(git -C d04-private/t2 rev-parse HEAD)" = "9c64951cd78411283e8a416641c36d71e169fc1d"
          echo "D04_NATIVE_EXACT_REVISIONS=PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install genuine site dependencies, normative T2 and Chromium
        run: |
          set -euo pipefail
          (cd d04-private/site && npm ci --no-audit --no-fund --include=dev) >"$RUNNER_TEMP/d04-site-install.log" 2>&1 || { echo "D04_NATIVE_SITE_INSTALL=FAIL"; exit 1; }
          canonical="d04-private/t2/t2/current/final-successor/canonical-source"
          (cd "$canonical" && npm ci --no-audit --no-fund --include=dev) >"$RUNNER_TEMP/d04-t2-install.log" 2>&1 || { echo "D04_NATIVE_T2_INSTALL=FAIL"; exit 1; }
          (cd "$canonical" && npx playwright install --with-deps chromium) >"$RUNNER_TEMP/d04-chromium.log" 2>&1 || { echo "D04_NATIVE_BROWSER_INSTALL=FAIL"; exit 1; }
          echo "D04_NATIVE_DEPENDENCIES=PASS"
      - name: Build exact original T2 Host and qualified Kernel with isolated read-only auditor
        working-directory: d04-private/site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/d04-private/t2
        run: |
          set -euo pipefail
          export IWXA_T2_PRODUCT_CHALLENGE="$(openssl rand -hex 32)"
          if npm run build:t2:site >"$RUNNER_TEMP/d04-native-build.log" 2>&1; then
            test -s dist/_iwxa/runtime/0.3.6/runtime.js
            test -s dist/workspace/workspace.config.json
            echo "D04_NATIVE_ORIGINAL_T2_BUILD=PASS"
          else
            echo "D04_NATIVE_ORIGINAL_T2_BUILD=FAIL"
            grep -Eo 'BAZMED_[A-Z0-9_]+|D04_[A-Z0-9_]+' "$RUNNER_TEMP/d04-native-build.log" | sort -u | tail -15 || true
            exit 1
          fi
      - name: Run T2-owned independent UI to Kernel to receipt to restart for all three families
        working-directory: d04-private/site
        run: |
          set +e
          node --input-type=module >"$RUNNER_TEMP/d04-native-families.log" 2>&1 <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          import {resolve,join} from 'node:path';
          import {pathToFileURL} from 'node:url';
          const site=process.cwd();
          const canonical=resolve(process.env.GITHUB_WORKSPACE,'d04-private/t2/t2/current/final-successor/canonical-source');
          const {bazmedWitnessContract,BAZMED_FAMILIES,BAZMED_ROUTES,BAZMED_SERVICE}=
            await import(pathToFileURL(join(site,'qualification/product-journeys.mjs')).href);
          const {runIndependentSiteWitness}=await import(pathToFileURL(join(canonical,
            'src/factory2/products/domain-completion/independent-browser-witness.mjs')).href);
          const conf='workspace/workspace.config.json';
          const hash=createHash('sha256').update(readFileSync(join(site,'dist',conf))).digest('hex');
          const witness=bazmedWitnessContract();
          if(witness.journeys.length!==BAZMED_FAMILIES.length)
            throw Error('D04_NATIVE_FAMILY_CONTRACT_COUNT_INVALID');
          // The product deliberately creates exactly one personal Life OS per
          // browser profile. Each independent family witness must therefore
          // start in a fresh T2 profile. Reusing the profile would ask the UI
          // for an impossible second "Create my Life OS" button.
          for(const [index,family] of BAZMED_FAMILIES.entries()){
            const journey=witness.journeys[index];
            if(journey.family!==family||journey.route!==BAZMED_ROUTES[index])
              throw Error('D04_NATIVE_FAMILY_ROUTE_IDENTITY_INVALID');
            const inventory={
              serviceIds:[BAZMED_SERVICE],
              routes:[journey.route],
              persistentFamilies:[family]
            };
            const contract={
              runtime:{kernel:'0.3.6',contract:'1.3.0',
                artifactId:'iwxa-kernel-k036-same-store-history-20261019-qualified.1',
                hostConfiguration:{path:conf,sha256:hash}},
              witness:{...witness,journeys:[journey]},
              inventory,buildDirectory:'dist'
            };
            console.log('D04_NATIVE_FAMILY_START='+family);
            const result=await runIndependentSiteWitness({
              siteRoot:site,contract,inventory,buildDirectory:'dist'
            });
            if(result.status!=='PASS'||result.runner!=='T2_OWNED_PLAYWRIGHT'||
               result.observations.length!==1)
              throw Error('D04_NATIVE_SINGLE_FAMILY_COUNT_INVALID');
            const o=result.observations[0];
            if(o.family!==family||!o.afterKernelRestart||!o.afterPageReload||
               !o.historyPreserved||!o.deniedWriteRejected||
               !o.independentReader||!o.freshUiChallenge||
               !o.unrelatedObjectsPreserved||!o.noUndeclaredObjects||
               o.nativeOperation!=='putObject')
              throw Error('D04_NATIVE_FAMILY_WITNESS_INCOMPLETE');
            console.log('D04_NATIVE_FAMILY_PASS='+family);
          }
          console.log('D04_NATIVE_T2_THREE_RESULT_FAMILIES=PASS');
          NODE
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "D04_NATIVE_THREE_FAMILIES=FAIL"
            python3 "$GITHUB_WORKSPACE/tools/ci/d04_recovery_safe_diagnostics.py" "$RUNNER_TEMP/d04-native-families.log" || true
            # Disclose only a bounded stage code for a known, public test selector.
            # Never echo raw playwright logs, challenge, health inputs, IDs or URLs.
            python3 "$GITHUB_WORKSPACE/tools/ci/d04_native_wait_stage.py" "$RUNNER_TEMP/d04-native-families.log" || true
            exit "$code"
          fi
          grep '^D04_NATIVE_' "$RUNNER_TEMP/d04-native-families.log" | tail -6
          echo "D04_NATIVE_THREE_FAMILIES=PASS"
          # No private dist, source, raw logs, browser profiles or archives uploaded.
      - name: Actual 320/375/768/1440 px entry, map, six-answer UI on original T2
        working-directory: d04-private/site
        run: |
          set +e
          node --input-type=module >"$RUNNER_TEMP/d04-public-entry.log" 2>&1 <<'NODE'
          import {createRequire} from 'node:module';
          import {resolve,join} from 'node:path';
          import {pathToFileURL} from 'node:url';
          const site=process.cwd();
          const canonical=resolve(process.env.GITHUB_WORKSPACE,
            'd04-private/t2/t2/current/final-successor/canonical-source');
          const {chromium}=createRequire(join(canonical,'package.json'))('playwright');
          const {serveRealKernelHost}=await import(pathToFileURL(
            join(canonical,'scripts/real-kernel-e2e.mjs')).href);
          const {runLifeOsEntryResponsiveBrowser}=await import(pathToFileURL(
            join(site,'qualification/life-os-entry-responsive.browser.mjs')).href);
          const live=await serveRealKernelHost(join(site,'dist'),{
            independentWitness:true,previewOrigin:true
          });
          try {
            const result=await runLifeOsEntryResponsiveBrowser({chromium,origin:live.origin});
            if(result.status!=='PASS'||result.viewports.length!==4||
              result.viewports.some(v=>v.quizSteps!==6||v.modeLinks!==8||v.mapPhases!==10))
              throw new Error('D04_UI_INCOMPLETE_RESULT');
            for(const value of result.viewports){
              console.log('D04_PUBLIC_ENTRY_WIDTH_'+value.width+'=PASS');
            }
            console.log('D04_PUBLIC_ENTRY_BROWSER=PASS');
          }finally{
            await new Promise(done=>live.server.close(done));
          }
          NODE
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "D04_PUBLIC_ENTRY_BROWSER=FAIL"
            python3 "$GITHUB_WORKSPACE/tools/ci/d04_recovery_safe_diagnostics.py" "$RUNNER_TEMP/d04-public-entry.log" || true
            exit "$code"
          fi
          grep '^D04_PUBLIC_' "$RUNNER_TEMP/d04-public-entry.log" | tail -4
          echo "D04_PUBLIC_ENTRY_DESKTOP_MOBILE=PASS"
          # No private source, dist, personal browser profiles or logs uploaded.
      - name: Actual 13 tools and 10 protocol checklists at four responsive widths
        working-directory: d04-private/site
        run: |
          set +e
          node --input-type=module >"$RUNNER_TEMP/d04-tool-protocol-ui.log" 2>&1 <<'NODE'
          import {createRequire} from 'node:module';
          import {resolve,join} from 'node:path';
          import {pathToFileURL} from 'node:url';
          const site=process.cwd();
          const canonical=resolve(process.env.GITHUB_WORKSPACE,
            'd04-private/t2/t2/current/final-successor/canonical-source');
          const {chromium}=createRequire(join(canonical,'package.json'))('playwright');
          const {serveRealKernelHost}=await import(pathToFileURL(join(canonical,
            'scripts/real-kernel-e2e.mjs')).href);
          const {runLifeOsToolsProtocolsBrowser}=await import(pathToFileURL(join(site,
            'qualification/life-os-tools-protocols.browser.mjs')).href);
          const live=await serveRealKernelHost(join(site,'dist'),{
            independentWitness:true,previewOrigin:true
          });
          try{
            const result=await runLifeOsToolsProtocolsBrowser({chromium,origin:live.origin});
            if(result.status!=='PASS'||result.viewports.length!==4||
               result.viewports.some(v=>v.tools!==13||v.protocols!==10))
              throw new Error('D04_COVERAGE_INCOMPLETE_RESULT');
            for(const view of result.viewports)
              console.log('D04_COVERAGE_WIDTH_'+view.width+'_13_TOOLS_10_PROTOCOLS=PASS');
            console.log('D04_ALL_TOOLS_AND_PROTOCOLS=PASS');
          }finally{
            await new Promise(done=>live.server.close(done));
          }
          NODE
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "D04_ALL_TOOLS_AND_PROTOCOLS=FAIL"
            python3 "$GITHUB_WORKSPACE/tools/ci/d04_recovery_safe_diagnostics.py" "$RUNNER_TEMP/d04-tool-protocol-ui.log" || true
            exit "$code"
          fi
          grep '^D04_COVERAGE_' "$RUNNER_TEMP/d04-tool-protocol-ui.log" | tail -3
          echo "D04_ALL_TOOLS_AND_PROTOCOLS=PASS"
          # No private browser files, dist, user data, source or logs uploaded.
