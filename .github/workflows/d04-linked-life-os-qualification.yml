name: D04 remaining service goal-link native qualification (private source)
on:
  push:
    branches:
      - work/2026-11-18-d04-life-os-qualification
    paths:
      - .github/workflows/d04-linked-life-os-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d04-linked-life-os-${{ github.ref }}
  cancel-in-progress: true
jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify authorized source access, without revealing credentials
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "D04_HOME_PRIVATE_ACCESS=UNAVAILABLE"; exit 1; }
          for repo in Faust-S/bazmed.ru Faust-S/T2; do
            gh api "repos/$repo" --jq '.id' >/dev/null 2>&1 ||
              { echo "D04_HOME_PRIVATE_ACCESS=DENIED"; exit 1; }
          done
          echo "D04_HOME_PRIVATE_ACCESS=PASS"
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/bazmed.ru
          ref: bd7866868c9ff0c2571310183e2bfd5843edb60a
          token: ${{ secrets.DOMEN }}
          path: d04-private/site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: 9c64951cd78411283e8a416641c36d71e169fc1d
          token: ${{ secrets.DOMEN }}
          path: d04-private/t2
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact private code identity
        run: |
          set -euo pipefail
          test "$(git -C d04-private/site rev-parse HEAD)" = bd7866868c9ff0c2571310183e2bfd5843edb60a
          test "$(git -C d04-private/t2 rev-parse HEAD)" = 9c64951cd78411283e8a416641c36d71e169fc1d
          test "$(git -C d04-private/site rev-parse HEAD^{tree})" = d08c5a9f78a34a567641368f7f338d3fc9f2e2f0
          echo "D04_HOME_PINNED_SOURCES=PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install private site dependencies in ephemeral runner
        working-directory: d04-private/site
        run: |
          set -euo pipefail
          if npm ci --no-audit --no-fund >"$RUNNER_TEMP/d04-home-npm.log" 2>&1; then
            echo "D04_HOME_NPM_CI=PASS"
          else
            echo "D04_HOME_NPM_CI=FAIL"
            exit 1
          fi
      - name: Test dashboard, navigation, scope and T2 original Host
        working-directory: d04-private/site
        run: |
          set -euo pipefail
          if node --test \
               tests/life-os-home-dashboard.test.mjs \
               tests/life-action-board.test.mjs \
               tests/life-os-pending-intent.test.mjs \
               tests/d04-navigation-workspace-ux.test.mjs \
               tests/bazmed-site-owned.test.mjs \
               tests/bazmed-site-controls.test.mjs \
               tests/life-os-workspace-integration.test.mjs \
               tests/life-os-entry-overview.test.mjs \
               tests/life-os-entry-links.test.mjs \
               tests/life-os-entry-usability.test.mjs \
               tests/life-os-overview-focus.test.mjs \
               >"$RUNNER_TEMP/d04-home-tests.log" 2>&1; then
            echo "D04_HOME_TARGETED_TESTS=PASS"
            grep -E '^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/d04-home-tests.log" |
              sed 's/^# /D04_HOME_TARGETED_/' | tail -3 || true
          else
            echo "D04_HOME_TARGETED_TESTS=FAIL"
            grep -E '^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/d04-home-tests.log" |
              sed 's/^# /D04_HOME_TARGETED_/' | tail -3 || true
            grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/d04-home-tests.log" |
              sed -E 's/^not ok ([0-9]+) - (.{0,110}).*/D04_HOME_FAILED_TEST_\1=\2/' | head -8 || true
            exit 1
          fi
      - name: Verify original T2 entry contracts
        working-directory: d04-private/site
        run: |
          if npm run check:t2:entry >"$RUNNER_TEMP/d04-home-entry.log" 2>&1; then
            echo "D04_HOME_T2_ENTRY=PASS"
          else
            echo "D04_HOME_T2_ENTRY=FAIL"
            grep -E '^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/d04-home-entry.log" |
              sed 's/^# /D04_HOME_ENTRY_/' | tail -3 || true
            exit 1
          fi
      - name: Type-check site and native dashboard
        working-directory: d04-private/site
        run: |
          if npx tsc --noEmit --pretty false >"$RUNNER_TEMP/d04-home-types.log" 2>&1; then
            echo "D04_HOME_TYPESCRIPT=PASS"
          else
            echo "D04_HOME_TYPESCRIPT=FAIL"
            grep -Eo 'error TS[0-9]+' "$RUNNER_TEMP/d04-home-types.log" | sort -u | head -10 || true
            exit 1
          fi
      - name: Prepare isolated independent T2 auditor challenge
        run: |
          set -euo pipefail
          umask 077
          openssl rand -hex 32 > "$RUNNER_TEMP/d04-home-challenge"
          echo "D04_HOME_WITNESS_CHALLENGE=SET"
      - name: Build the original integrated T2 site (no uploads)
        working-directory: d04-private/site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/d04-private/t2
        run: |
          set -euo pipefail
          export IWXA_T2_PRODUCT_CHALLENGE="$(cat "$RUNNER_TEMP/d04-home-challenge")"
          if npm run build:t2:site >"$RUNNER_TEMP/d04-home-build.log" 2>&1; then
            echo "D04_HOME_INTEGRATED_BUILD=PASS"
          else
            echo "D04_HOME_INTEGRATED_BUILD=FAIL"
            grep -Eo 'BAZMED_[A-Z0-9_]+|D04_[A-Z0-9_]+|error TS[0-9]+' "$RUNNER_TEMP/d04-home-build.log" |
              sort -u | head -18 || true
            exit 1
          fi
          test -s dist/index.html
          test -s dist/workspace/index.html
          test -s dist/workspace/exchange/index.html
          test -s dist/_iwxa/current.json
          grep -RqF 'life-os-demo-dashboard' dist/assets ||
            { echo "D04_HOME_PUBLIC_BUNDLE=MISSING"; exit 1; }
          grep -RqF 'life-os-personal-dashboard' dist/workspace/assets ||
            { echo "D04_HOME_PERSONAL_HOST_BUNDLE=MISSING"; exit 1; }
          test -s dist/dlya-sebya/index.html || { echo "D04_HOME_PUBLIC_TOOLS_HTML=MISSING"; exit 1; }
          grep -RqF 'life-os-public-medical-history' dist/assets ||
            { echo "D04_HOME_MEDICAL_ENTRY_BUNDLE=MISSING"; exit 1; }
          echo "D04_HOME_BOTH_DASHBOARDS_IN_DIST=PASS"
      - name: Install browser in runner for viewport and interactive entry check
        run: |
          set -euo pipefail
          canonical="d04-private/t2/t2/current/final-successor/canonical-source"
          if (cd "$canonical" && npm ci --no-audit --no-fund --include=dev && npx playwright install chromium) >"$RUNNER_TEMP/d04-home-browser-install.log" 2>&1; then
            echo "D04_HOME_BROWSER_INSTALL=PASS"
          else
            echo "D04_HOME_BROWSER_INSTALL=FAIL"
            exit 1
          fi
      - name: Check native witness source syntax
        working-directory: d04-private/site
        run: |
          node --check qualification/life-os-goal-service-refs.browser.mjs
          echo "D04_SERVICE_NATIVE_WITNESS_SYNTAX=PASS"
      - name: Test actual desktop/mobile T2 Host site entry
        working-directory: d04-private/site
        run: |
          set -uo pipefail
          set +e
          export IWXA_T2_PRODUCT_CHALLENGE="$(cat "$RUNNER_TEMP/d04-home-challenge")"
          node --input-type=module >"$RUNNER_TEMP/d04-home-browser.log" 2>&1 <<'NODE'
          import {createRequire} from 'node:module';
          import {resolve,join} from 'node:path';
          import {pathToFileURL} from 'node:url';
          const site=process.cwd();
          const canonical=resolve(process.env.GITHUB_WORKSPACE,'d04-private/t2/t2/current/final-successor/canonical-source');
          const {chromium}=createRequire(join(canonical,'package.json'))('playwright');
          const {serveRealKernelHost}=await import(pathToFileURL(join(canonical,'scripts/real-kernel-e2e.mjs')).href);
          const {selectWitnessOption}=await import(pathToFileURL(join(canonical,'src/factory2/products/domain-completion/independent-browser-witness.mjs')).href);
          const {runLifeOsGoalServiceRefsBrowser}=await import(pathToFileURL(join(site,'qualification/life-os-goal-service-refs.browser.mjs')).href);
          console.log('D04_SERVICE_BROWSER_STAGE=SERVER_BOOT');
          let server;
          try{
            server=await serveRealKernelHost(join(site,'dist'),{independentWitness:true,previewOrigin:true});
            console.log('D04_SERVICE_BROWSER_STAGE=SERVER_READY');
            const result=await runLifeOsGoalServiceRefsBrowser({chromium,origin:server.origin,selectWitnessOption});
            if(result.status!=='PASS'||result.viewports.length!==2||result.viewports.some(v=>v.objects!==5||v.resultEvents!==11||v.linkedActivity!==true||v.stalePinPreserved!==true||v.activityReselected!==true||v.jointHistory!==true||v.configuration!==true||v.protocol!==true||v.recovery!==true||v.reverse!==true||(v.width===1440&&v.exchange!=='PASS')))throw Error('D04_GOAL_SERVICE_WITNESS_RESULT_INCOMPLETE');
            console.log('D04_SERVICE_GOAL_CONFIGURATION=PASS');
            console.log('D04_SERVICE_GOAL_PROTOCOL=PASS');
            console.log('D04_SERVICE_GOAL_RECOVERY=PASS');
            console.log('D04_SERVICE_GOAL_REVERSE=PASS');
            console.log('D04_SERVICE_COLD_EXCHANGE=PASS');
            console.log('D04_SERVICE_JOINT_HISTORY=PASS');
            console.log('D04_SERVICE_EXCHANGE_OBJECTS=5');
            console.log('D04_SERVICE_EXCHANGE_RESULT_EVENTS=9');
          }catch(e){
            console.log('D04_SERVICE_ERROR_CLASS='+ (e instanceof Error && /^[A-Za-z]+Error$/.test(e.name)?e.name:'ERROR'));
            console.log('D04_SERVICE_ERROR_CODE='+ (typeof e?.code==='string'&&/^[A-Z0-9_]+$/.test(e.code)?e.code:'UNKNOWN'));
            throw e;
          }finally{
            if(server)await new Promise(done=>server.server.close(done));
          }
          NODE
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "D04_SERVICE_REAL_BROWSER=FAIL"
            grep -E '^D04_(SERVICE_BROWSER_STAGE|SERVICE_ERROR_CLASS|SERVICE_ERROR_CODE|GOAL_SERVICE_WITNESS_OUTER_|GOAL_SERVICE_WITNESS_STAGE_|GOAL_SERVICE_WITNESS_ERROR_CLASS_|GOAL_SERVICE_WITNESS_SAFE_CAUSE_)' "$RUNNER_TEMP/d04-home-browser.log" | tail -10 || true
            grep -Eo 'D04_GOAL_SERVICE_WITNESS_[A-Z0-9_]+|D04_OBSERVATION_EXCHANGE_[A-Z0-9_]+' "$RUNNER_TEMP/d04-home-browser.log" | sort -u | head -12 || true
            exit "$code"
          fi
          grep -E '^D04_SERVICE_(GOAL_(CONFIGURATION|PROTOCOL|RECOVERY|REVERSE)|COLD_EXCHANGE)=PASS$|^D04_SERVICE_EXCHANGE_(OBJECTS|RESULT_EVENTS)=[0-9]+$' "$RUNNER_TEMP/d04-home-browser.log"
          echo "D04_SERVICE_REAL_BROWSER=PASS"
      # No public artifact, private dist, screenshots, code, or private logs are uploaded.
