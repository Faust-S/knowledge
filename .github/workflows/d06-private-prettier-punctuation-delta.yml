name: d06-private-prettier-punctuation-delta

# Narrowly encode formatter-only punctuation/spacing edits, keyed by Git blob
# hashes. Never expose private text, identifiers, paths, secrets or artifacts.
on:
  push:
    branches: [test/2026-11-18-d06-qualification]
    paths: [.github/workflows/d06-private-prettier-punctuation-delta.yml]

permissions:
  contents: read

jobs:
  punctuation-delta:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod.ru
          ref: 0613b8cdc0fc9636b967b8d18c1d9cab1abef8bf
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compute punctuation-only edits
        shell: bash
        run: |
          set -euo pipefail
          cd private/site
          if ! npm ci --no-audit --no-fund > "$RUNNER_TEMP/d06-punct-ci.private.log" 2>&1; then
            echo "D06_PUNCT_INSTALL=FAIL"
            exit 1
          fi
          if ! npm run format:lint:apply > "$RUNNER_TEMP/d06-punct-format.private.log" 2>&1; then
            echo "D06_PUNCT_PRETTIER=FAIL"
            exit 1
          fi
          python - <<'PY'
          import pathlib
          import subprocess
          import json
          import string
          allowed = set(string.punctuation + " \t\r\n")
          def split(s):
              immutable=[]
              separators=[""]
              for ch in s:
                  if ch.isalnum() or ch in "_$" or ord(ch)>=128:
                      immutable.append(ch)
                      separators.append("")
                  else:
                      separators[-1]+=ch
              return "".join(immutable), separators
          changed=subprocess.check_output(
              ["git","diff","--name-only"],text=True
          ).splitlines()
          print("D06_PUNCT_CHANGED_FILE_COUNT="+str(len(changed)))
          for path in changed:
              original = subprocess.check_output(
                  ["git","show","HEAD:"+path],stderr=subprocess.DEVNULL
              ).decode("utf-8")
              formatted = pathlib.Path(path).read_text(encoding="utf-8")
              before, oldRuns=split(original)
              after, newRuns=split(formatted)
              oldsha=subprocess.check_output(
                  ["git","rev-parse","HEAD:"+path],text=True
              ).strip()
              newsha=subprocess.check_output(
                  ["git","hash-object",path],text=True
              ).strip()
              if before!=after:
                  print("D06_PUNCT_IMMUTABLE_DIFFERENCE="+oldsha)
                  continue
              ops=[]
              for i,(a,b) in enumerate(zip(oldRuns,newRuns)):
                  if a!=b:
                      if any(c not in allowed for c in b):
                          print("D06_PUNCT_UNSUPPORTED="+oldsha)
                          break
                      ops.append([i,b])
              else:
                  print("D06_PUNCT_DELTA="+json.dumps(
                      {"old":oldsha,"new":newsha,"ops":ops},
                      separators=(",",":"),ensure_ascii=True
                  ))
          PY
      - name: Assert no private code artifacts were published
        if: always()
        shell: pwsh
        run: |
          Write-Host "D06_PRIVATE_SOURCE_EXPORTED=NO"
          Write-Host "D06_PRIVATE_ARTIFACT_UPLOADS=0"
