name: Publish exact qualified public T3 rc.5 portable input
on:
  push:
    branches: ['ci/once/t3-portable-rc5-publication/**']
    paths: ['.github/ci-requests/t3-portable-rc5-publication.json']
permissions:
  actions: read
  contents: write
concurrency:
  group: t3-portable-rc5-publication
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event.created == false && github.event.deleted == false && github.event.forced == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BEFORE: ${{ github.event.before }}
      GH_TOKEN: ${{ github.token }}
      SOURCE: 'a50d40dafc2e029fcc7668dece925f7fc38cc510'
      RUN: '46012582910'
      ARTIFACT: '15203239524'
      TAG: 't3-platform-v0.3.1-rc.5'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate deliberate immutable public artifact publication
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Faust-S/knowledge
          test "$GITHUB_REF_NAME" = "ci/once/t3-portable-rc5-publication/$BEFORE"
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $BEFORE"
          test "$(git rev-list --parents -n 1 "$BEFORE")" = "$BEFORE $SOURCE"
          test "$(git diff-tree --no-commit-id --name-status -r HEAD)" = "$(printf 'A\t.github/ci-requests/t3-portable-rc5-publication.json')"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('.github/ci-requests/t3-portable-rc5-publication.json').read_text())
          import os
          assert r.pop('preparedSha')==os.environ['BEFORE']
          assert r==json.loads('{"schema":"iwxa.ci.once/1","workflow":"t3-portable-rc5-publication","source":"a50d40dafc2e029fcc7668dece925f7fc38cc510","qualificationRun":46012582910,"qualificationHead":"4c6061f9fbf5452b0f10ba8f34375dbda2a4d73d","artifactId":15203239524,"artifactName":"iwxa-t3-mobile-portable-candidate-a50d40dafc2e029fcc7668dece925f7fc38cc510","artifactSha256":"4d397282cc704f61fd7966394ddbbffe88e124c2d3e5a75d12bdc726f9ae0dd4","archiveSha256":"381e9845fea164569d9363dd4e0983b5d9971347450e93246c1ebd5023fb98c4","manifestSha256":"ef5824279883296d836eacb7ba00f352be357d0dd5c49e26b32ec1a02a336e48","tag":"t3-platform-v0.3.1-rc.5"}')
          PY
          # Observe the already running exact qualification; never start another one.
          for attempt in $(seq 1 36); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" > "$RUNNER_TEMP/t3-run.json"
            test "$(jq -r '.head_sha' "$RUNNER_TEMP/t3-run.json")" = 4c6061f9fbf5452b0f10ba8f34375dbda2a4d73d
            test "$(jq -r '.run_attempt' "$RUNNER_TEMP/t3-run.json")" = 1
            if test "$(jq -r '.status' "$RUNNER_TEMP/t3-run.json")" = completed; then break; fi
            sleep 10
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs?per_page=100" > "$RUNNER_TEMP/t3-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT" > "$RUNNER_TEMP/t3-artifact.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])
          r=json.loads((t/'t3-run.json').read_text())
          assert r['status']=='completed' and r['conclusion']=='success' and r['run_attempt']==1
          assert r['head_sha']=='4c6061f9fbf5452b0f10ba8f34375dbda2a4d73d'
          assert r['head_branch']=='ci/once/t3-consolidated-candidate/'+os.environ['SOURCE']
          j=json.loads((t/'t3-jobs.json').read_text())['jobs']
          assert {x['name'] for x in j}=={'request','platform','exact-k036-mapping-probe','shared-host','canonical-source','assistant'}
          assert len(j)==6 and all(x['conclusion']=='success' for x in j)
          a=json.loads((t/'t3-artifact.json').read_text())
          assert a['id']==15203239524 and a['name']=='iwxa-t3-mobile-portable-candidate-'+os.environ['SOURCE'] and not a['expired']
          assert a['workflow_run']['id']==r['id']
          assert a['digest']=='sha256:4d397282cc704f61fd7966394ddbbffe88e124c2d3e5a75d12bdc726f9ae0dd4'
          print('T3_PUBLICATION_EXACT_QUALIFICATION_PASS')
          PY
      - name: Download and independently verify existing archive without rebuilding
        run: |
          set -euo pipefail
          curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT/zip" -o "$RUNNER_TEMP/t3-actions.zip"
          python - <<'PY'
          import hashlib, io, json, os, zipfile
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])
          out=t/'t3-release'
          out.mkdir()
          sha=lambda b: hashlib.sha256(b).hexdigest()
          outer=(t/'t3-actions.zip').read_bytes()
          assert sha(outer)=='4d397282cc704f61fd7966394ddbbffe88e124c2d3e5a75d12bdc726f9ae0dd4'
          with zipfile.ZipFile(io.BytesIO(outer)) as z:
              assert sorted(z.namelist())==['candidate-receipt.json','platform-inputs.zip']
              receipt_bytes=z.read('candidate-receipt.json')
              archive=z.read('platform-inputs.zip')
          r=json.loads(receipt_bytes)
          assert r['version']=='0.3.1-rc.5' and r['sourceCommit']==os.environ['SOURCE'] and r['qualificationRun']==int(os.environ['RUN'])
          assert r['repositoryGitTree']=='d375181e1fd79953cdb9ef4e414936e76b584100' and r['sourceTree']=='3a391777a51012e51356b61b9d61bc94c511de67' and r['sourcePackageGitTree']=='372c6cb67f1167ba43c08322c86bfce861db1831'
          assert sha(archive)==r['archiveSha256']=='381e9845fea164569d9363dd4e0983b5d9971347450e93246c1ebd5023fb98c4'
          assert r['privateDomainIncluded'] is False and r['modelWeightsIncluded'] is False
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              manifest=z.read('t3-platform-inputs.json')
              checks=z.read('t3-platform-inputs.sha256')
              m=json.loads(manifest)
              assert sha(manifest)==r['manifestSha256']=='ef5824279883296d836eacb7ba00f352be357d0dd5c49e26b32ec1a02a336e48'
              assert m['sourceCommit']==r['sourceCommit'] and m['version']==r['version']
              assert m['sourceTree']==r['sourceTree'] and m['sourcePackageGitTree']==r['sourcePackageGitTree'] and m['repositoryGitTree']==r['repositoryGitTree']
              assert m['nativeSignerIncluded'] is False and m['modelWeightsIncluded'] is False and m['installedProductAccepted'] is False
              f=m['files']
              assert len(f)==r['manifestFiles']==174 and len({x['path'] for x in f})==174
              assert sorted(z.namelist())==sorted([x['path'] for x in f]+['t3-platform-inputs.json','t3-platform-inputs.sha256'])
              for x in f:
                  b=z.read(x['path'])
                  assert len(b)==x['bytes'] and sha(b)==x['sha256'], x['path']
              expected=''.join(x['sha256']+'  '+x['path']+'\n' for x in f)+sha(manifest)+'  t3-platform-inputs.json\n'
              assert checks.decode()==expected
              assert sha(z.read('qualified-runtime/'+r['kernelArtifact']+'.zip'))==r['kernelArchiveSha256']=='7075b8b9590ef1283e34ecb3c21dd9d1b7342697287e1aa150cd4f4a60860b68'
              assert sha(z.read('package-lock.json'))==r['lockSha256']
          for name,b in [('candidate-receipt.json',receipt_bytes),('platform-inputs.zip',archive),('t3-platform-inputs.json',manifest),('t3-platform-inputs.sha256',checks)]:
              (out/name).write_bytes(b)
              print(name,len(b),sha(b))
          print('T3_INDEPENDENT_PORTABLE_BYTE_VERIFICATION_PASS')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Final engineering acceptance of the downloaded delivery (no rebuild)
        working-directory: packages/t3-core
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/t3-final-input" "$RUNNER_TEMP/t3-final-kernel"
          unzip -q "$RUNNER_TEMP/t3-release/platform-inputs.zip" -d "$RUNNER_TEMP/t3-final-input"
          unzip -q "$RUNNER_TEMP/t3-final-input/qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip" -d "$RUNNER_TEMP/t3-final-kernel"
          test ! -e dist
          cp -a "$RUNNER_TEMP/t3-final-input/dist" dist
          cp "$RUNNER_TEMP/t3-final-input/package.json" "$RUNNER_TEMP/t3-final-input/package-lock.json" .
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium
          export IWXA_T2_QUALIFIED_KERNEL_DIST="$RUNNER_TEMP/t3-final-kernel"
          export T3_PWA_COMPILED_HOST_DIR="$PWD/dist"
          node --test tests/t3-pwa-original-kernel.browser.mjs
          node tests/t3-d5-full-bli.browser.mjs
          echo T3_FINAL_DELIVERED_ARTIFACT_BROWSER_PASS
      - name: Publish only the exact candidate as immutable prerelease
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --tags origin "refs/tags/$TAG")"
          gh release create "$TAG" "$RUNNER_TEMP/t3-release/"* --repo "$GITHUB_REPOSITORY" --target "$SOURCE" --title "IWXA T3 portable platform 0.3.1-rc.5" --prerelease --draft --notes "Consolidated public platform candidate. Engineering qualification: https://github.com/Faust-S/knowledge/actions/runs/46012582910. Exact accepted Kernel 0.3.6 / Runtime Contract 1.3.0 / WebLLM 0.2.87; Exchange receipt and BLI live generation fixes, Workflow W05.49. Cold offline Workspace and independent .iwxa recovery PASS. The delivered archive also passes final engineering browser execution on a fresh runner without rebuilding. Physical GPU generation on this exact build, independent end-user acceptance, corporate A-B-A and installed product acceptance remain separate. No private signer, private domain sources or model weights. Not a stable release or automatic domain migration."
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name=="t3-platform-v0.3.1-rc.5")' > "$RUNNER_TEMP/t3-draft.json"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])
          r=json.loads((t/'t3-draft.json').read_text())
          assert r['draft'] and r['prerelease'] and r['target_commitish']==os.environ['SOURCE']
          a={x['name']:x for x in r['assets']}
          files=list((t/'t3-release').iterdir())
          assert set(a)=={p.name for p in files}
          for p in files:
              assert a[p.name]['state']=='uploaded' and a[p.name]['size']==p.stat().st_size and a[p.name]['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          print('T3_PUBLICATION_ASSET_DIGESTS_PASS')
          PY
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '{tag_name,target_commitish,draft,prerelease,html_url,assets:[.assets[]|{name,size,digest}]}'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE"
          echo T3_EXACT_PUBLIC_PRERELEASE_PUBLISHED
