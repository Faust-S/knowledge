name: IWXA software articles visual acceptance
on:
  push:
    branches:
      - qa/2026-11-19-software-site-source-qualification
    paths:
      - .github/workflows/qa-software-site-visual.yml
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-ru-1
          ref: 107d1bb9ac10e18e09c5c39a9834a3edcdba137c
          token: ${{ secrets.DOMEN || secrets.IWXA_SITE || secrets.T3 }}
          persist-credentials: false
          path: .private/site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install exact frontend dependencies
        working-directory: .private/site
        run: bun install --frozen-lockfile > "$RUNNER_TEMP/editorial-visual-install.log" 2>&1
      - name: Start original Vite site
        working-directory: .private/site
        shell: bash
        run: |
          bunx vite --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/editorial-visual-vite.log" 2>&1 &
          for n in $(seq 1 80); do
            curl --fail --silent http://127.0.0.1:4173/software/ > /dev/null && exit 0
            sleep 1
          done
          echo 'SITE_VISUAL_VITE_START_FAIL'
          exit 1
      - name: Verify four articles and contextual illustrations at desktop and mobile widths
        working-directory: .private/site
        shell: bash
        run: |
          mkdir -p ../../artifacts/software-pages
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer';
          import {mkdirSync,writeFileSync} from 'node:fs';
          const output='../../artifacts/software-pages';
          mkdirSync(output,{recursive:true});
          const binary=process.env.PUPPETEER_EXECUTABLE_PATH||'/usr/bin/google-chrome';
          const browser=await puppeteer.launch({headless:true,executablePath:binary,args:['--no-sandbox','--disable-setuid-sandbox']});
          const records=[];
          try{
            const routes=[['overview','/software/'],['platform','/software/platform/'],['desktop','/software/desktop/'],['domains','/software/domains/']];
            for(const [name,route] of routes){
              const page=await browser.newPage();
              await page.setViewport({width:1440,height:900,deviceScaleFactor:1});
              const response=await page.goto('http://127.0.0.1:4173'+route,{waitUntil:'networkidle2',timeout:45000});
              await page.waitForSelector('h1',{timeout:20000});
              if(!response?.ok())throw new Error('Bad route: '+route);
              if(name==='desktop'){
                const expected=[['agent',3],['atlas',3],['admin',3],['analyzer',1],['publisher',1]];
                const observed=await page.evaluate(()=>({
                  anchors:[...document.querySelectorAll('.sw-article-index a')].map(a=>a.getAttribute('href')),
                  chapters:[...document.querySelectorAll('article.sw-chapter')].map(x=>({id:x.id,count:x.querySelectorAll('.sw-article-scene .sw-article-figure img').length,
                    allInline:[...x.querySelectorAll('.sw-article-figure')].every(f=>f.closest('.sw-article-scene')?.querySelector('h4'))})),
                  retiredGallery:!!document.querySelector('.sw-screenshot-grid,.sw-gallery-head,[data-selection-group]'),
                }));
                if(observed.retiredGallery || observed.chapters.length!==5)throw new Error('Old gallery still present: '+JSON.stringify(observed));
                for(const [id,count] of expected){
                  const x=observed.chapters.find(x=>x.id==='desktop-'+id);
                  if(!x||x.count!==count||!x.allInline||!observed.anchors.includes('#desktop-'+id))throw new Error('Article figure misplaced: '+id+' '+JSON.stringify(observed));
                }
                await page.evaluate(()=>{for(const img of document.querySelectorAll('.sw-article-figure img'))img.loading='eager'});
                await page.waitForFunction(()=>[...document.querySelectorAll('.sw-article-figure img')].every(i=>i.complete&&i.naturalWidth>0),{timeout:20000});
                const images=await page.evaluate(()=>[...document.querySelectorAll('.sw-article-figure img')].map(x=>({src:x.getAttribute('src'),alt:x.alt,naturalWidth:x.naturalWidth})));
                if(images.length!==11 || images.some(x=>x.alt.length<25||x.naturalWidth<750))throw new Error('Eleven images did not load: '+JSON.stringify(images));
                for(const [id] of expected){
                  const chapter=await page.$('#desktop-'+id);
                  if(!chapter)throw new Error('Missing chapter '+id);
                  await chapter.screenshot({path:output+'/'+id+'-article-desktop.png'});
                }
                records.push({name:'inline-editorial-images',chapters:observed.chapters,images});
              }
              const info=await page.evaluate(()=>({title:document.querySelector('h1')?.textContent||'',width:document.documentElement.scrollWidth,viewport:window.innerWidth}));
              if(!info.title.trim()||info.width>info.viewport+12)throw new Error('Desktop overflow '+name+' '+JSON.stringify(info));
              records.push({route,name,title:info.title});
              if(name!=='desktop')await page.screenshot({path:output+'/'+name+'-desktop.png',fullPage:true});
              await page.setViewport({width:375,height:812,deviceScaleFactor:1,isMobile:true,hasTouch:true});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+12);
              if(overflow)throw new Error('Mobile horizontal overflow: '+name);
              if(name==='desktop'){
                const fit=await page.evaluate(()=>[...document.querySelectorAll('.sw-article-figure img')].every(x=>x.getBoundingClientRect().width<=window.innerWidth));
                if(!fit)throw new Error('Mobile inline image exceeds viewport');
              }
              await page.screenshot({path:output+'/'+name+'-mobile.png',fullPage:true});
              await page.close();
            }
            writeFileSync(output+'/manifest.json',JSON.stringify({exactSiteSha:'107d1bb9ac10e18e09c5c39a9834a3edcdba137c',records},null,2));
            console.log('IWXA_SOFTWARE_ARTICLES_INLINE_ELEVEN_IMAGES_PASS',records.length);
          }finally{await browser.close()}
          JS      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iwxa-software-article-mobile-desktop-visuals
          path: artifacts/software-pages/
          retention-days: 7
          if-no-files-found: ignore
      - name: Erase private website checkout
        if: always()
        shell: bash
        run: |
          rm -rf .private/site
          rm -f "$RUNNER_TEMP/editorial-visual-"*.log
