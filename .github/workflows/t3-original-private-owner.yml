name: T3 original private owner bounded source qualification

on:
  push:
    branches:
      - work/2026-11-10-t3-t2-activity-projection
    paths:
      - .github/workflows/t3-original-private-owner.yml
      - packages/t3-core/scripts/qualify-original-private-d3-owner.mjs
      - packages/t3-core/tests/qualify-original-private-d3-owner.test.mjs
  workflow_dispatch:

# This runs ONLY in public knowledge. No private workflow, whole clone, raw
# fixture output, source artifact, logs, cache or private signer export.
permissions:
  contents: read

concurrency:
  group: t3-original-private-owner-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  original-private-d3-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bounded private-source reader without private credentials
        run: node --test packages/t3-core/tests/qualify-original-private-d3-owner.test.mjs
      - name: Original signed D3 owner contract on an exact private T3 commit
        # Owner has allowed read-only testing from public knowledge, not whole
        # checkout. T3 is the direct scoped secret; DOMEN is a legacy fallback.
        env:
          T3_READ_TOKEN: ${{ secrets.T3 || secrets.DOMEN }}
        run: node packages/t3-core/scripts/qualify-original-private-d3-owner.mjs
