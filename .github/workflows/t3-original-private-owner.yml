name: T3 original D3 and Agent bounded private source qualification

on:
  workflow_dispatch:
    inputs:
      qualify_agent:
        description: 'Verify separately granted private Agent D3 source'
        type: boolean
        required: false
        default: false

# This runs ONLY in public knowledge. No private workflow, whole clone, raw
# fixture output, source artifact, logs, cache or private signer export.
permissions:
  contents: read

concurrency:
  group: t3-original-private-owner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The previous 15/15 source suite was on an older private signer.
  # Requalify the SAME exact Owner as installed Admin and original Agent,
  # including the one-shot native Human ACCEPT regression.
  # An explicit trusted marker runs the current central Agent06 employee test
  # suite on the corrected central Agent task binding without changing
  # the accepted original private D3 signer.
  original-private-d3-source:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qualify-original-d3]') || contains(github.event.head_commit.message, '[qualify-final-d3]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bounded private-source reader without private credentials
        run: |
          node --test packages/t3-core/tests/g4-native-original-owner-pin-parity.test.mjs
          node --test packages/t3-core/tests/qualify-original-private-d3-owner.test.mjs
      - name: Original signed D3 owner contract on an exact private T3 commit
        # Owner has allowed read-only testing from public knowledge, not whole
        # checkout. T3 is the direct scoped secret; DOMEN is a legacy fallback.
        env:
          T3_READ_TOKEN: ${{ secrets.T3 }}
          DOMEN_PRIVATE_READ_TOKEN: ${{ secrets.DOMEN }}
        run: node packages/t3-core/scripts/qualify-original-private-d3-owner.mjs
      - name: Reuse original native signed D3 suite on final D3/PERSON candidate
        if: ${{ contains(github.event.head_commit.message, '[qualify-final-d3]') }}
        env:
          T3_READ_TOKEN: ${{ secrets.T3 }}
          DOMEN_PRIVATE_READ_TOKEN: ${{ secrets.DOMEN }}
        run: node packages/t3-core/scripts/qualify-original-private-d3-owner.mjs --candidate --company-graph

  # Agent is a separately private product. Its own read grant has not been
  # confirmed by knowledge, so do not turn core source PASS into job FAILURE.
  # An explicit owner-enabled flag or workflow_dispatch qualifies this source.
  original-private-agent-d3-source:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.qualify_agent) || contains(github.event.head_commit.message, '[qualify-agent-d3]') || contains(github.event.head_commit.message, '[qualify-company-next]') || vars.IWXA_AGENT_D3_SOURCE_CI_ENABLED == 'true' }}
    name: Agent original D3 employee port, bounded source (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify two-file Agent loader without any private credentials
        run: node --test packages/t3-core/tests/qualify-original-agent-d3-port.test.mjs
      - name: Qualify ORIGINAL employee Agent D3 Python contract without cloning
        env:
          AGENT_PRIVATE_READ_TOKEN: ${{ secrets.AGENT }}
          DOMEN_PRIVATE_READ_TOKEN: ${{ secrets.DOMEN }}
          T3_PRIVATE_READ_TOKEN: ${{ secrets.T3 }}
        run: node packages/t3-core/scripts/qualify-original-agent-d3-port.mjs
      - name: Qualify latest company Workspace / one-Result SOURCE candidate
        if: ${{ contains(github.event.head_commit.message, '[qualify-company-next]') }}
        env:
          AGENT_PRIVATE_READ_TOKEN: ${{ secrets.AGENT }}
          DOMEN_PRIVATE_READ_TOKEN: ${{ secrets.DOMEN }}
        run: |
          node --input-type=module -e "import {qualifyOriginalAgentCompanyCandidate} from './packages/t3-core/scripts/qualify-original-agent-d3-port.mjs'; await qualifyOriginalAgentCompanyCandidate({token:process.env.AGENT_PRIVATE_READ_TOKEN||process.env.DOMEN_PRIVATE_READ_TOKEN,python:process.env.PYTHON_COMMAND??'python'})"


  # Exact current original PERSON issuer+consumer test, not a second IAM or
  # a public copy of the original private T3 owner.
  original-person-d7-source:
    if: ${{ contains(github.event.head_commit.message, '[qualify-t3-d7]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual original PERSON issuer holder STATUS renewal and cold recovery
        env:
          T3_READ_TOKEN: ${{ secrets.T3 }}
          DOMEN_PRIVATE_READ_TOKEN: ${{ secrets.DOMEN }}
        run: node packages/t3-core/scripts/qualify-original-person-final-owner.mjs
