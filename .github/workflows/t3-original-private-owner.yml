name: T3 original D3 and Agent bounded private source qualification

on:
  push:
    branches:
      - work/2026-11-10-t3-t2-activity-projection
    paths:
      - .github/workflows/t3-original-private-owner.yml
      - packages/t3-core/scripts/qualify-original-private-d3-owner.mjs
      - packages/t3-core/tests/qualify-original-private-d3-owner.test.mjs
      - packages/t3-core/scripts/qualify-original-agent-d3-port.mjs
      - packages/t3-core/tests/qualify-original-agent-d3-port.test.mjs
  workflow_dispatch:
    inputs:
      qualify_agent:
        description: 'Verify separately granted private Agent D3 source'
        type: boolean
        required: false
        default: false

# This runs ONLY in public knowledge. No private workflow, whole clone, raw
# fixture output, source artifact, logs, cache or private signer export.
permissions:
  contents: read

concurrency:
  group: t3-original-private-owner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Exact private owner source was accepted on pin 19be10c5 (15/15).
  # Avoid exhausting the owner's GitHub API quota on ordinary harness pushes.
  # An explicit trusted commit marker or manual dispatch reruns private source.
  original-private-d3-source:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qualify-original-d3]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bounded private-source reader without private credentials
        run: node --test packages/t3-core/tests/qualify-original-private-d3-owner.test.mjs
      - name: Original signed D3 owner contract on an exact private T3 commit
        # Owner has allowed read-only testing from public knowledge, not whole
        # checkout. T3 is the direct scoped secret; DOMEN is a legacy fallback.
        env:
          T3_READ_TOKEN: ${{ secrets.T3 }}
          DOMEN_PRIVATE_READ_TOKEN: ${{ secrets.DOMEN }}
        run: node packages/t3-core/scripts/qualify-original-private-d3-owner.mjs

  # Agent is a separately private product. Its own read grant has not been
  # confirmed by knowledge, so do not turn core source PASS into job FAILURE.
  # An explicit owner-enabled flag or workflow_dispatch qualifies this source.
  original-private-agent-d3-source:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.qualify_agent) || contains(github.event.head_commit.message, '[qualify-agent-d3]') || vars.IWXA_AGENT_D3_SOURCE_CI_ENABLED == 'true' }}
    name: Agent original D3 employee port, bounded source (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify two-file Agent loader without any private credentials
        run: node --test packages/t3-core/tests/qualify-original-agent-d3-port.test.mjs
      - name: Qualify ORIGINAL employee Agent D3 Python contract without cloning
        env:
          AGENT_PRIVATE_READ_TOKEN: ${{ secrets.AGENT }}
          DOMEN_PRIVATE_READ_TOKEN: ${{ secrets.DOMEN }}
          T3_PRIVATE_READ_TOKEN: ${{ secrets.T3 }}
        run: node packages/t3-core/scripts/qualify-original-agent-d3-port.mjs
