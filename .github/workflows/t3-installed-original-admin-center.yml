name: T3 G4 installed original Admin Center Windows (opt-in)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t3-g4-installed-original-admin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-one-dist:
    # Fail BEFORE accessing either private repository when the qualified
    # inherited T2 + publicly built One Core cannot form installed Admin D3.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qualify-installed-d3]') }}
    runs-on: windows-2022
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f65931cd70e0c64e29b31e1824b7af0c0baf6d1
          persist-credentials: false
      - name: Verify exact release One Core SHA before installed Admin
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $head=(& git rev-parse HEAD).Trim()
          if($head -cne '2f65931cd70e0c64e29b31e1824b7af0c0baf6d1'){
            throw 'G4_INSTALLED_ADMIN_ONE_CORE_PIN_MISMATCH'
          }
          # Qualification is tied to the exact new executable source and
          # inherited original T2 archive tree, not an old installed receipt.
          $source=(& git rev-parse 'HEAD:packages/t3-core/src').Trim()
          $t2=(& git rev-parse 'HEAD:packages/t3-core/qualified-runtime').Trim()
          if($source -cne '1bd96668e7264e1eb7775ca750cd007ac33b4827' -or
             $t2 -cne '1594274dbf5e38214b8422ba11e8c7114bd5425c'){
            throw 'T3_INSTALLED_ADMIN_NEW_CANDIDATE_ORIGINAL_SOURCE_TREE_CHANGED'
          }
          Write-Output 'T3_INSTALLED_ADMIN_EXACT_ORIGINAL_T2_AND_COMPANY_T3_SOURCE_PASS'
      - name: Parse installed native UIA and compile Win32 helper before private checkout
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'packages/t3-core/tests/g4-installed-original-center-first-use.ps1',
            'packages/t3-core/tests/g4-installed-original-center-smoke.ps1')
          foreach($file in $files){
            $tokens=[System.Management.Automation.Language.Token[]]@()
            $parseErrors=[System.Management.Automation.Language.ParseError[]]@()
            $null=[System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,[ref]$parseErrors)
            if($parseErrors.Length -ne 0){
              Write-Host ("G4_INSTALLED_PUBLIC_NATIVE_UIA_PARSE_LOCATION {0} {1} {2}" -f
                [IO.Path]::GetFileName($file),
                $parseErrors[0].Extent.StartLineNumber,
                $parseErrors[0].Extent.StartColumnNumber)
              throw 'G4_INSTALLED_PUBLIC_NATIVE_UIA_PARSER_FAILED'
            }
          }
          Write-Host 'G4_INSTALLED_PUBLIC_NATIVE_UIA_PARSER_PASS'
          $script=Get-Content -LiteralPath $files[0] -Raw
          $opening="Add-Type -TypeDefinition @'"
          $first=$script.IndexOf($opening,[StringComparison]::Ordinal)
          if($first -lt 0){throw 'G4_INSTALLED_PUBLIC_NATIVE_UIA_HELPER_NOT_FOUND'}
          $first+=$opening.Length
          $end=$script.IndexOf("'@", $first,[StringComparison]::Ordinal)
          if($end -lt 0){throw 'G4_INSTALLED_PUBLIC_NATIVE_UIA_HELPER_NOT_CLOSED'}
          $source=$script.Substring($first,$end-$first).Trim()
          try{
            Add-Type -TypeDefinition $source -ErrorAction Stop
          }catch{
            throw 'G4_INSTALLED_PUBLIC_NATIVE_UIA_HELPER_BUILD_FAILED'
          }
          Write-Host 'G4_INSTALLED_PUBLIC_NATIVE_UIA_WIN32_HELPER_BUILD_PASS'
          if(-not $script.Contains('RequireDialogDismissed $dialog') -or
             -not $script.Contains('G4_INSTALLED_FIRST_USE_NATIVE_DIALOG_DECISION_CONFIRMED') -or
             -not $script.Contains('G4_INSTALLED_FIRST_USE_NATIVE_OWNER_ERROR_CODE')){
            throw 'G4_INSTALLED_PUBLIC_NATIVE_HUMAN_WITNESS_INCOMPLETE'
          }
          Write-Host 'G4_INSTALLED_PUBLIC_NATIVE_HUMAN_DECISION_WITNESS_PASS'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Assemble qualified original T2 and exact signed Admin One Dist
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node packages/t3-core/tests/g4-compiled-owner-diagnostics.mjs --selftest
          if($LASTEXITCODE -ne 0){throw 'G4_COMPILED_OWNER_DIAGNOSTIC_CLASSIFIER_TEST_FAILED'}
          & npm ci --prefix packages/t3-core --ignore-scripts --no-audit --no-fund *> $null
          if($LASTEXITCODE -ne 0){throw 'G4_INSTALLED_PUBLIC_T3_DEPENDENCIES_FAILED'}
          & npm run build --prefix packages/t3-core *> $null
          if($LASTEXITCODE -ne 0){throw 'G4_INSTALLED_PUBLIC_T3_BUILD_FAILED'}
          $q=Join-Path $env:RUNNER_TEMP 'g4-original-qualified-t2-public'
          New-Item -ItemType Directory -Path $q -Force | Out-Null
          Expand-Archive -LiteralPath 'packages/t3-core/qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip' -DestinationPath $q -Force
          $env:G4_INSTALLED_QUALIFIED_T2_DIST=$q
          node packages/t3-core/tests/g4-installed-original-one-dist-preflight.mjs
          if($LASTEXITCODE -ne 0){throw 'G4_INSTALLED_PUBLIC_ONE_DIST_PREFLIGHT_FAILED'}
  installed-original-admin:
    needs: public-one-dist
    # Exact signer source is pinned with Agent/source D3 parity.
    # The native Human ACCEPT test changed, not the issuer's production code.
    # Checkout remains SPARSE; no private EXE/source enters public artifacts.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qualify-installed-d3]') }}
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f65931cd70e0c64e29b31e1824b7af0c0baf6d1
          persist-credentials: false
      - name: Verify exact release One Core SHA before installed Admin
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $head=(& git rev-parse HEAD).Trim()
          if($head -cne '2f65931cd70e0c64e29b31e1824b7af0c0baf6d1'){
            throw 'G4_INSTALLED_ADMIN_ONE_CORE_PIN_MISMATCH'
          }
          # Qualification is tied to the exact new executable source and
          # inherited original T2 archive tree, not an old installed receipt.
          $source=(& git rev-parse 'HEAD:packages/t3-core/src').Trim()
          $t2=(& git rev-parse 'HEAD:packages/t3-core/qualified-runtime').Trim()
          if($source -cne '1bd96668e7264e1eb7775ca750cd007ac33b4827' -or
             $t2 -cne '1594274dbf5e38214b8422ba11e8c7114bd5425c'){
            throw 'T3_INSTALLED_ADMIN_NEW_CANDIDATE_ORIGINAL_SOURCE_TREE_CHANGED'
          }
          Write-Output 'T3_INSTALLED_ADMIN_EXACT_ORIGINAL_T2_AND_COMPANY_T3_SOURCE_PASS'
      - name: Stage selected original T3 owner code at exact private revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 162f699d69f63e1d54bc002465c28c9781bf62ae
          token: ${{ secrets.T3 || secrets.DOMEN }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            access-control
            interop
            reconciliation
            scripts
            package.json
          path: .private/t3
      - name: Stage selected original Center application at exact private revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: 5da2473f5e13df58cd715b0109c29b7707a97847
          token: ${{ secrets.CENTER || secrets.DOMEN }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            src-tauri
            src
            native
            installer
            runtime
            scripts
            tests
            index.html
            package.json
            package-lock.json
            tsconfig.json
            vite.config.ts
          path: .private/center
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: c225e1b8d35e87e5de55dbb9c0c8dbe564d8fb08
          persist-credentials: false
          path: .private/center/vendor/atlas
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Br-test
          ref: 07df66ab6bd3e1b87036c33b90e49d228d5ab820
          persist-credentials: false
          path: .private/center/vendor/brtest
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact sources and original qualified T2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $t3=(& git -C .private/t3 rev-parse HEAD).Trim()
          $center=(& git -C .private/center rev-parse HEAD).Trim()
          if($t3 -ne '162f699d69f63e1d54bc002465c28c9781bf62ae' -or
             $center -ne '5da2473f5e13df58cd715b0109c29b7707a97847'){
            throw 'G4_ORIGINAL_INSTALLED_PRIVATE_SOURCE_PIN_MISMATCH'
          }
          $q=Join-Path $env:RUNNER_TEMP 'g4-installed-original-k036'
          New-Item -ItemType Directory -Force -Path $q | Out-Null
          $zip='packages/t3-core/qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip'
          Expand-Archive -LiteralPath $zip -DestinationPath $q -Force
          if(!(Test-Path -LiteralPath (Join-Path $q '_iwxa/runtime/0.3.6/runtime.js'))){
            throw 'G4_ORIGINAL_INSTALLED_T2_DIST_MISSING'
          }
          "G4_INSTALLED_QUALIFIED_T2_DIST=$q" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'G4_INSTALLED_EXACT_SPARSE_SOURCE_AND_NORMATIVE_T2_PASS'
      - name: Build existing One Core and private Center dependencies
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          & npm ci --prefix packages/t3-core --ignore-scripts --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'G4_INSTALLED_ONE_CORE_NPM_FAILED'}
          & npm run build --prefix packages/t3-core
          if($LASTEXITCODE -ne 0){throw 'G4_INSTALLED_ONE_CORE_BUILD_FAILED'}
          Push-Location .private/center
          try{
            $log=Join-Path $env:RUNNER_TEMP 'g4-center-npm-private.log'
            & npm install --no-audit --no-fund *> $log
            if($LASTEXITCODE -ne 0){throw 'G4_INSTALLED_CENTER_NPM_FAILED'}
          } finally{Pop-Location}
          Write-Host 'G4_INSTALLED_ONE_CORE_AND_CENTER_DEPS_PASS'
      - name: Inspect exact public signed T2 and compiled T3 One Dist before private owner
        shell: pwsh
        run: |
          node packages/t3-core/tests/g4-installed-original-one-dist-preflight.mjs
          if($LASTEXITCODE -ne 0){throw 'G4_INSTALLED_PUBLIC_ONE_DIST_PREFLIGHT_FAILED'}
      - name: Check original native builder syntax and clean exact source trees
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # .private is a TEMPORARY sparse test fixture inside this public
          # checkout, not One Core source. Keep the original T3 builder's
          # strict clean-source assertion without treating this fixture as
          # a dirty change to the public implementation.
          Add-Content -LiteralPath '.git/info/exclude' -Value '/.private/'
          $builder=(Resolve-Path '.private/t3/scripts/build-admin-center-d3-owner.ps1').Path
          $tokens=[System.Management.Automation.Language.Token[]]@()
          $parseErrors=[System.Management.Automation.Language.ParseError[]]@()
          $null=[System.Management.Automation.Language.Parser]::ParseFile(
            $builder,[ref]$tokens,[ref]$parseErrors)
          if($parseErrors.Length -ne 0){throw 'G4_ORIGINAL_PRIVATE_BUILDER_PARSE_INVALID'}
          Write-Host 'G4_PRIVATE_BUILDER_PARSER_PASS'
          $public=@(& git status --porcelain)
          $original=@(& git -C .private/t3 status --porcelain)
          Write-Host ("G4_ORIGINAL_KNOWLEDGE_TREE_CLEAN " + ($public.Count -eq 0))
          Write-Host ("G4_ORIGINAL_PRIVATE_T3_TREE_CLEAN " + ($original.Count -eq 0))
      - name: Build genuine original T3 signed owner, Center and Setup Core
        shell: pwsh
        timeout-minutes: 40
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'g4-private-owner-build.log'
          try{
            & ./.private/t3/scripts/build-admin-center-d3-owner.ps1 `
              -CenterRoot '.private/center' `
              -OneCoreRoot '.' `
              -QualifiedT2Dist $env:G4_INSTALLED_QUALIFIED_T2_DIST `
              -BunCommand bun -BuildCenter *> $log
            if($LASTEXITCODE -ne 0){throw 'G4_INSTALLED_ORIGINAL_PRIVATE_OWNER_BUILD_FAILED'}
            $required=@('T3_D3_ORIGINAL_ADMIN_T2_PRODUCT_STAGE_CONFIRMED',
              'ORIGINAL_T3_D3_ONE_DIST_ASSEMBLED',
              'ORIGINAL_T3_D3_OWNER_BUILD_DONE',
              'T3_D3_ORIGINAL_COMPILED_ENROLL_ENTRY_VERIFIED',
              'T3_D3_ORIGINAL_AGE_CANONICAL_LICENSE_TAG_VERIFIED',
              'CENTER_PRIVATE_T3_D3_SETUP_CORE_READY')
            $lines=@(Get-Content -LiteralPath $log -ErrorAction Stop)
            foreach($marker in $required){
              if(!($lines | Where-Object {$_ -match "^$marker(?:\s|$)"})){
                throw 'G4_INSTALLED_PRIVATE_BUILD_RECEIPT_MISSING'
              }
            }
            Write-Host 'G4_INSTALLED_ORIGINAL_SIGNED_OWNER_CENTER_SETUP_BUILT_PASS'
          }catch{
            # Print only bounded canonical machine codes: NEVER print private
            # source excerpts, local paths, Rust errors or the raw build log.
            $codes=@()
            node packages/t3-core/tests/g4-compiled-owner-diagnostics.mjs $log
            if(Test-Path -LiteralPath $log){
              foreach($line in (Get-Content -LiteralPath $log -ErrorAction SilentlyContinue)){
                # Only bounded non-sensitive builder scalars are published.
                $safe=[string]$line
                if($safe -match '^T3_D3_COMPILED_ENROLL_PREFLIGHT_(NONZERO|ENOENT) (True|False)$'){
                  Write-Host ("G4_COMPILED_ENROLL_{0} {1}" -f $Matches[1],$Matches[2])
                }elseif($safe -match '^T3_D3_COMPILED_ENROLL_PREFLIGHT_LINE_COUNT ([0-9]{1,4})$'){
                  Write-Host ("G4_COMPILED_ENROLL_LINE_COUNT " + $Matches[1])
                }elseif($safe -match '^T3_D3_COMPILED_ENROLL_PREFLIGHT_MACHINE_CODE ((?:T3_D3|INTEROP|WINDOWS|DPAPI|PRODUCT_OWNER)_[A-Z0-9_]{4,90})$'){
                  Write-Host ("G4_COMPILED_ENROLL_MACHINE_CODE " + $Matches[1])
                }elseif($safe -match '^T3_D3_COMPILED_ENROLL_PREFLIGHT_ORIGIN_(BUN_VIRTUAL|BUILD_SHIM|ORIGINAL_CLI|SIGNED_INTEROP|T2_ASSET) (True|False)$'){
                  Write-Host ("G4_COMPILED_ENROLL_ORIGIN_{0} {1}" -f $Matches[1],$Matches[2])
                }elseif($safe -match '^T3_D3_COMPILED_IMPORT_PROBE_([A-Z0-9_]{3,36})_(COMPILED|RAN) (True|False)$'){
                  # Bounded original private Bun import outcome, no text paths/EXE.
                  Write-Host ("G4_COMPILED_IMPORT_{0}_{1} {2}" -f $Matches[1],$Matches[2],$Matches[3])
                }
                foreach($hit in [regex]::Matches($safe,
                    '(?<![A-Z0-9_])(?:T3_D3|G4|CEN_D3|ORIGINAL_T3|CENTER_PRIVATE)_[A-Z0-9_]{4,90}(?![A-Z0-9_])')){
                  $codes+=([string]$hit.Value)
                }
              }
            }
            # The PowerShell call itself may fail before native stderr can
            # be redirected; classify its exception without exposing text.
            $captured=[string]$_.Exception.Message
            foreach($hit in [regex]::Matches($captured,
                '(?<![A-Z0-9_])(?:T3_D3|G4|CEN_D3|ORIGINAL_T3|CENTER_PRIVATE)_[A-Z0-9_]{4,90}(?![A-Z0-9_])')){
              $codes+=([string]$hit.Value)
            }
            $last=if($codes.Count){$codes[-1]}else{'UNCLASSIFIED'}
            $errClass=$_.Exception.GetType().Name
            if($errClass -notin @('RuntimeException',
                'CommandNotFoundException','ParseException',
                'ParameterBindingException','ParentContainsErrorRecordException')){
              $errClass='UNCLASSIFIED'
            }
            Write-Host "G4_INSTALLED_PRIVATE_BUILD_FAILURE_CODE $last"
            Write-Host "G4_INSTALLED_PRIVATE_BUILD_FAILURE_CLASS $errClass"
            throw 'G4_INSTALLED_ORIGINAL_PRIVATE_BUILD_HOLD'
          }
      - name: Install original signed Owner and One Dist via Setup Core and check real Windows GUI
        shell: pwsh
        timeout-minutes: 6
        run: |
          ./packages/t3-core/tests/g4-installed-original-center-smoke.ps1 `
            -CenterRoot '.private/center' -OriginalT3Root '.private/t3' `
            -ExpectedCenterSha '5da2473f5e13df58cd715b0109c29b7707a97847' `
            -ExpectedT3Sha '162f699d69f63e1d54bc002465c28c9781bf62ae'
      - name: Native UIA first-use cancel, real signed organization enrollment and cold restart
        shell: pwsh
        timeout-minutes: 9
        run: |
          if([string]::IsNullOrWhiteSpace($env:G4_INSTALLED_CENTER_ROOT)){
            throw 'G4_INSTALLED_CENTER_ROOT_NOT_ATTESTED'
          }
          ./packages/t3-core/tests/g4-installed-original-center-first-use.ps1 `
            -InstallRoot $env:G4_INSTALLED_CENTER_ROOT
      - name: Destroy private source, native binaries and build logs
        if: always()
        shell: pwsh
        run: |
          $targets=@('.private',
            (Join-Path $env:RUNNER_TEMP 'g4-installed-original-k036'),
            (Join-Path $env:RUNNER_TEMP 'g4-center-npm-private.log'),
            (Join-Path $env:RUNNER_TEMP 'g4-private-owner-build.log'))
          foreach($path in $targets){
            if(Test-Path -LiteralPath $path){
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Host 'G4_INSTALLED_PRIVATE_SOURCE_AND_BINARIES_NOT_PUBLISHED'
