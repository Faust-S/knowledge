name: D07 T3 original-platform integration
on:
  push:
    branches: [work/2026-11-02-pipeline-foundation]
    paths: [.github/workflows/d07-t3-integration.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: d07-t3-integration
  # One-time replacement of the queued read-only predecessor. Subsequent
  # workflow changes must not cancel a qualified private publication in progress.
  cancel-in-progress: ${{ github.event_name == 'push' && github.event.before == 'ec6788c9ea0a3d42a63e8039df03b47ef8ac6704' }}
jobs:
  private-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: pipeline
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: 873573fc5ff0f0336a468849730ab15b5dfa1b53
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - name: Classify Git transport failures without exposing logs
        run: bash pipeline/scripts/test-d07-private-git-transport.sh
      - name: Verify existing token and exact private receive-pack without writes
        working-directory: site
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: bash ../pipeline/scripts/d07-private-git-transport.sh preflight 873573fc5ff0f0336a468849730ab15b5dfa1b53
  t3-source:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod
          ref: 79068637e424c8348ca5ca846d8b6d84bcddd274
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: domain
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: 873573fc5ff0f0336a468849730ab15b5dfa1b53
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 5e3083788aa541921559de29d3457d4a52bbba00
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: assistant
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - name: Preserve exact T2 subject and Workspace module
        run: |
          test "$(git -C domain rev-parse HEAD)" = "79068637e424c8348ca5ca846d8b6d84bcddd274"
          test "$(git -C site rev-parse HEAD)" = "873573fc5ff0f0336a468849730ab15b5dfa1b53"
          cmp domain/models/assistant-skills.json site/public/assets/d07-assistant-skills.json
          for path in domain/src/domain/service-subject*.ts domain/src/domain/service-blocks.ts domain/src/domain/service-changes.ts domain/src/domain/service-execution.ts; do
            cmp "$path" "site/src/domain/$(basename "$path")"
          done
          cmp domain/src/domain/order-contract.ts site/src/domain/order-contract.ts
          cmp domain/src/domain/service-criteria-projection.mjs site/src/domain/service-criteria-projection.mjs
          cmp domain/src/domain/service-criteria-projection.d.mts site/src/domain/service-criteria-projection.d.mts
          cmp domain/src/domain/service-brief-text.ts site/src/domain/service-brief-text.ts
          cmp domain/src/data/serviceDirectory.ts site/src/data/serviceDirectory.ts
          for f in service-blocks.ts service-changes.ts service-execution.ts service-order-identity.ts service-money.ts service-attention.ts; do cmp "domain/src/domain/$f" "site/t2-site-module/uslugovod/$f"; done
          echo D07_T3_DOMAIN_PARITY=PASS
      - name: Original shared assistant validates canonical skill package
        run: |
          node domain/scripts/d07-skill-authoring.mjs --check > "$RUNNER_TEMP/skills.log" 2>&1 || { echo D07_T3_SKILL_GENERATION=FAIL; exit 1; }
          node --test domain/tests/assistant-skills.test.mjs > "$RUNNER_TEMP/skill-tests.log" 2>&1 || { echo D07_T3_SKILL_TESTS=FAIL; grep -E '^not ok|^# (tests|pass|fail)' "$RUNNER_TEMP/skill-tests.log" | cut -c1-180; exit 1; }
          node --input-type=module -e 'import fs from "node:fs";import {validateSkillPack} from "./assistant/browser-local-inference/domain-assistant/skill-runtime.mjs";const p=JSON.parse(fs.readFileSync("domain/models/assistant-skills.json","utf8"));validateSkillPack(p);console.log("D07_T3_SKILLS="+p.skills.length);console.log("D07_T3_FORM_HINTS="+p.formHints.length);console.log("D07_T3_RESULT_HINTS="+p.resultHints.length)' > "$RUNNER_TEMP/skill-schema.log" 2>&1 || { echo D07_T3_SHARED_SCHEMA=FAIL; grep -E '^Error: [A-Z0-9_]+' "$RUNNER_TEMP/skill-schema.log" | cut -c1-180; exit 1; }
          D07_ORIGINAL_ASSISTANT_DIR="$GITHUB_WORKSPACE/assistant/browser-local-inference/domain-assistant" node --test domain/tests/assistant-skill-field-policy.test.mjs > "$RUNNER_TEMP/exact-policy.log" 2>&1 || { echo D07_T3_EXACT_POLICY=FAIL; grep -E '^not ok|^# (tests|pass|fail) ' "$RUNNER_TEMP/exact-policy.log" | cut -c1-180 | head -30; exit 1; }
          echo D07_T3_EXACT_POLICY=PASS
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/exact-policy.log"
          node --check assistant/browser-local-inference/domain-assistant/main.mjs
          node --test assistant/browser-local-inference/tests/domain-assistant-*.test.mjs > "$RUNNER_TEMP/shared-assistant.log" 2>&1 || { echo D07_T3_SHARED_ASSISTANT=FAIL; grep -E '^not ok|^# (tests|pass|fail) ' "$RUNNER_TEMP/shared-assistant.log" | cut -c1-180 | head -30; exit 1; }
          echo D07_T3_SHARED_ASSISTANT=PASS
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/shared-assistant.log"
          echo D07_T3_SHARED_SCHEMA=PASS
          grep -E '^D07_T3_[A-Z_]+=[0-9]+$' "$RUNNER_TEMP/skill-schema.log"
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/skill-tests.log"
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: 6906829da95d2d2366f294a3f567aa760db02d59
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: baseline-site
      - name: Locked dependencies, native product tests, TypeScript
        working-directory: site
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/d07-install.log" 2>&1 || { echo D07_T3_INSTALL=FAIL; exit 1; }
          npm run test:product-first > "$RUNNER_TEMP/d07-regression.log" 2>&1 || { echo D07_T3_ORIGINAL_REGRESSION=FAIL; grep -E '^not ok|^# (tests|pass|fail)' "$RUNNER_TEMP/d07-regression.log" | cut -c1-220 | head -60; exit 1; }
          node --import tsx --test scripts/tests/d07-t3-professional-tool-criteria.test.mjs scripts/tests/d07-brief-fidelity.test.mjs scripts/tests/d07-professional-card-release.test.mjs > "$RUNNER_TEMP/d07-t3-tools.log" 2>&1 || { echo D07_T3_PROFESSIONAL_TOOLS=FAIL; grep -E '^not ok|^# (tests|pass|fail)|^  (error|code|operator):' "$RUNNER_TEMP/d07-t3-tools.log" | cut -c1-220 | head -40; exit 1; }
          echo D07_T3_PROFESSIONAL_TOOLS=PASS
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/d07-t3-tools.log"
          mkdir -p "$RUNNER_TEMP/criteria-old" "$RUNNER_TEMP/criteria-new"
          cp t2-site-module/uslugovod/manifest.json "$RUNNER_TEMP/criteria-old/manifest.json"
          cp t2-site-module/uslugovod/manifest.json "$RUNNER_TEMP/criteria-new/manifest.json"
          cp ../baseline-site/scripts/generate-d07-workspace-criteria.mjs scripts/.qualification-previous-criteria.mjs
          trap 'rm -f scripts/.qualification-previous-criteria.mjs' EXIT
          node --import tsx scripts/.qualification-previous-criteria.mjs "$RUNNER_TEMP/criteria-old" > "$RUNNER_TEMP/criteria-old.log" 2>&1 || { echo D07_T3_PREVIOUS_CRITERIA=FAIL; exit 1; }
          node --import tsx scripts/generate-d07-workspace-criteria.mjs "$RUNNER_TEMP/criteria-new" > "$RUNNER_TEMP/criteria-new.log" 2>&1 || { echo D07_T3_NEW_CRITERIA=FAIL; exit 1; }
          cmp "$RUNNER_TEMP/criteria-old/service-criteria.generated.json" "$RUNNER_TEMP/criteria-new/service-criteria.generated.json"
          echo D07_T3_CRITERIA_BYTE_PARITY=PASS
          grep -E '^D07_WORKSPACE_[A-Z_]+=[0-9]+$' "$RUNNER_TEMP/criteria-new.log"
          rm scripts/.qualification-previous-criteria.mjs
          trap - EXIT
          echo D07_T3_ORIGINAL_REGRESSION=PASS
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/d07-regression.log"
          bun run check:types > "$RUNNER_TEMP/d07-types.log" 2>&1 || { echo D07_T3_TYPES=FAIL; grep -E 'error TS[0-9]+' "$RUNNER_TEMP/d07-types.log" | cut -c1-220 | head -35; exit 1; }
          echo D07_T3_TYPES=PASS
          node --check scripts/prepare-d07-t3-host.mjs
          node --check scripts/assemble-d07-t3-dist.mjs
          node --check scripts/t3-platform-inputs.mjs
          node --check scripts/build-d07-t3-local-site.mjs
          node --check scripts/prepare-d07-local-kernel-input.mjs
          node --check scripts/retain-d07-t3-inputs.mjs
          node --check scripts/build-d07-integrated-site.mjs
          node --check scripts/build-d07-clean.mjs
          node --check scripts/audit-d07-t3-context.mjs
          npm run t3:test-local > "$RUNNER_TEMP/local-tests.log" 2>&1 || { echo D07_T3_LOCAL_TESTS=FAIL; grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/local-tests.log"; exit 1; }
          node --test scripts/tests/d07-t3-preview.test.mjs scripts/tests/d07-retained-byte-attributes.test.mjs scripts/tests/d07-retained-index.test.mjs scripts/tests/d07-private-release.test.mjs > "$RUNNER_TEMP/preview-tests.log" 2>&1 || {
            echo D07_T3_PREVIEW_TESTS=FAIL
            grep -E '^# (tests|pass|fail) [0-9]+$|^not ok [0-9]+ ' "$RUNNER_TEMP/preview-tests.log" | cut -c1-160 | head -20
            exit 1
          }
          echo D07_T3_PREVIEW_TESTS=PASS
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/preview-tests.log"
          echo D07_T3_LOCAL_TESTS=PASS
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/local-tests.log"
          echo D07_T3_ASSEMBLY_SYNTAX=PASS
  original-t3-integration:
    needs: [t3-source, private-transport]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      retained_commit: ${{ steps.release-push.outputs.retained_commit }}
      dist_sha256: ${{ steps.release-push.outputs.dist_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: pipeline
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: 873573fc5ff0f0336a468849730ab15b5dfa1b53
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: e70de29b72b83e2546f7ab74b17572685a728c17
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: T2
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 5e3083788aa541921559de29d3457d4a52bbba00
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: assistant
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 326f725c44d69ac99f6b912241e9e8a6c3d716a5
          persist-credentials: false
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - name: Retrieve and authenticate exact published common platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/platform"
          gh run download 45395047723 --repo Faust-S/knowledge --name iwxa-t3-mobile-portable-candidate-326f725c44d69ac99f6b912241e9e8a6c3d716a5 --dir "$RUNNER_TEMP/platform" > "$RUNNER_TEMP/platform-download.log" 2>&1 || { echo D07_T3_PLATFORM_DOWNLOAD=FAIL; exit 1; }
          archive="$(find "$RUNNER_TEMP/platform" -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          node site/scripts/t3-platform-inputs.mjs verify "$archive" > "$RUNNER_TEMP/platform-verify.log" 2>&1 || { echo D07_T3_PLATFORM_VERIFY=FAIL; grep -E '^Error: D07_T3_PLATFORM_[A-Z0-9_]+' "$RUNNER_TEMP/platform-verify.log" | cut -c1-160; exit 1; }
          echo "D07_PLATFORM_ZIP=$archive" >> "$GITHUB_ENV"
          echo D07_T3_PLATFORM_VERIFY=PASS
      - name: Build complete D07 public site without changing native T2 orders
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/T2
          VITE_D07_T3: '1'
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/install.log" 2>&1 || { echo D07_T3_INSTALL=FAIL; exit 1; }
          node scripts/build-d07-integrated-site.mjs > "$RUNNER_TEMP/baseline.log" 2>&1 || { echo D07_T3_BASELINE=FAIL; grep -E '^D07_PUBLIC_BUILD_STEP_(START|PASS|FAIL)=(generate:sitemap|generate:prerender-routes|quality:gate:pre|build:app|flatten:dist|prerender|quality:gate:post)(:[A-Z_0-9]+(:SIGNAL_[A-Z_0-9]+)?|:[0-9]+s)?$|^D07_BUILD_(SITE|HOST|KERNEL)_WORKER_FAILED$|^D07_PUBLIC_BUILD_GATE_CRITICAL=[a-z0-9-]+:[0-9]+$|^D07_PUBLIC_BUILD_GATE_REPORT=(CRITICAL|NO_CRITICAL_CODES|UNAVAILABLE)$|^D07_[A-Z0-9_]+=(FAIL|PASS)$' "$RUNNER_TEMP/baseline.log" | tail -60 || true; grep -oE '^Error: D07_[A-Z0-9_]+' "$RUNNER_TEMP/baseline.log" | tail -10 || true; exit 1; }
          npm run hosting:verify > "$RUNNER_TEMP/base-audit.log" 2>&1 || { echo D07_T3_BASELINE_AUDIT=FAIL; grep -E '^D07_HOSTING_' "$RUNNER_TEMP/base-audit.log" | cut -c1-200 | tail -5; exit 1; }
          grep -E '^D07_STATIC_ROUTER_NORMALIZED=\{"pages":[0-9]+,"slots":[0-9]+,"changed":[0-9]+,"changedPages":[0-9]+,"staticFreshnessTime":[0-9]+\}$' "$RUNNER_TEMP/baseline.log"
          echo D07_T3_BASELINE_AUDIT=PASS
          grep '^D07_HOSTING_PACKAGE_AUDIT=PASS ' "$RUNNER_TEMP/base-audit.log"
          # Generated routeTree is ignored, not tracked. Never reset source to mask drift.
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Verify every rendered professional context against canonical protocol
        working-directory: site
        run: |
          node --import tsx scripts/audit-d07-t3-context.mjs "$PWD/dist" "$GITHUB_WORKSPACE/assistant" > "$RUNNER_TEMP/context-base.log" 2>&1 || {
            echo D07_T3_RENDERED_CONTEXT=FAIL
            grep -oE 'D07_CONTEXT_[A-Z0-9_]+' "$RUNNER_TEMP/context-base.log" | sort -u | tail -20 || true
            exit 1
          }
          grep -E '^D07_T3_RENDERED_CONTEXT=PASS \{' "$RUNNER_TEMP/context-base.log"
      - name: Compile original T3 Host with exact D07 module and shared BLI
        working-directory: site
        run: |
          npm run t3:prepare-host -- "$GITHUB_WORKSPACE/core/packages/t3-core" "$RUNNER_TEMP/d07-host" "$D07_PLATFORM_ZIP" "$GITHUB_WORKSPACE/assistant" > "$RUNNER_TEMP/prepare-host.log" 2>&1 || {
            echo D07_T3_HOST=FAIL
            grep -E '^Error: (D07_|T3_)|error TS[0-9]+|^npm error code' "$RUNNER_TEMP/prepare-host.log" | cut -c1-220 | tail -35 || true
            exit 1
          }
          echo D07_T3_HOST=PASS
          grep '^{"status":"D07_T3_HOST_SOURCE_BUILT"' "$RUNNER_TEMP/prepare-host.log"
      - name: One isolated candidate; original Kernel, permissions and full offline tree
        working-directory: site
        run: |
          npm run t3:assemble -- "$PWD/dist" "$RUNNER_TEMP/d07-host" "$RUNNER_TEMP/d07-t3-dist" "$D07_PLATFORM_ZIP" > "$RUNNER_TEMP/assembly.log" 2>&1 || {
            echo D07_T3_ASSEMBLY=FAIL
            grep -E '^Error: (D07_|T3_|T2_)' "$RUNNER_TEMP/assembly.log" | cut -c1-200 | tail -20 || true
            exit 1
          }
          echo D07_T3_ASSEMBLY=PASS
          grep '^{"status":"D07_T3_CANDIDATE_BUILT_NOT_ACCEPTED"' "$RUNNER_TEMP/assembly.log"
      - name: Recheck complete integrated T3 context and native Workspace boundary
        working-directory: site
        run: |
          node --import tsx scripts/audit-d07-t3-context.mjs "$RUNNER_TEMP/d07-t3-dist" "$GITHUB_WORKSPACE/assistant" > "$RUNNER_TEMP/context-candidate.log" 2>&1 || {
            echo D07_T3_RENDERED_CONTEXT=FAIL
            grep -oE 'D07_CONTEXT_[A-Z0-9_]+' "$RUNNER_TEMP/context-candidate.log" | sort -u | tail -20 || true
            exit 1
          }
          grep -E '^D07_T3_RENDERED_CONTEXT=PASS \{' "$RUNNER_TEMP/context-candidate.log"
      - name: Retain verified original platform inputs in the disposable private checkout
        working-directory: site
        run: |
          node --import tsx scripts/prepare-d07-local-kernel-input.mjs "$PWD/dist" "$GITHUB_WORKSPACE/T2" "$RUNNER_TEMP/d07-support" > "$RUNNER_TEMP/support.log" 2>&1 || {
            echo D07_T3_LOCAL_SUPPORT=FAIL
            grep -oE '^Error: D07_[A-Z0-9_]+' "$RUNNER_TEMP/support.log" | tail -10 || true
            exit 1
          }
          node --import tsx scripts/retain-d07-t3-inputs.mjs "$RUNNER_TEMP/d07-host" "$RUNNER_TEMP/d07-support" "$D07_PLATFORM_ZIP" > "$RUNNER_TEMP/retain.log" 2>&1 || {
            echo D07_T3_RETAIN=FAIL
            grep -oE '^Error: D07_[A-Z0-9_]+' "$RUNNER_TEMP/retain.log" | tail -10 || true
            exit 1
          }
          echo D07_T3_LOCAL_INPUTS=PASS
      - name: Two ordinary builds with no original checkouts, no Git/npm and no external network
        working-directory: site
        run: |
          # Keep only the authenticated private validator for the separate post-build audit.
          validator="$RUNNER_TEMP/validator/browser-local-inference/domain-assistant"
          mkdir -p "$validator"
          cp "$GITHUB_WORKSPACE/assistant/browser-local-inference/domain-assistant/skill-runtime.mjs" "$validator/"
          # Disposable runner copies only. The original remote repositories are untouched.
          rm -rf "$GITHUB_WORKSPACE/T2" "$GITHUB_WORKSPACE/core" "$GITHUB_WORKSPACE/assistant"
          guard="$RUNNER_TEMP/d07-no-build-tools"
          mkdir -p "$guard"
          for name in git npm npx bun; do
            printf '#!/bin/sh\necho D07_FORBIDDEN_ORDINARY_BUILD_TOOL >&2\nexit 73\n' > "$guard/$name"
            chmod +x "$guard/$name"
          done
          nodebin="$(command -v node)"
          # Keep loopback for the existing local TanStack prerender server.
          # Run the product builder as the ordinary runner user, not root.
          isolated() {
            sudo unshare --net -- bash -c 'ip link set lo up && exec setpriv --reuid "$1" --regid "$2" --init-groups env PATH="$3" "$4" --import tsx scripts/build-d07-t3-local-site.mjs "${@:5}"' -- "$(id -u)" "$(id -g)" "$guard:$PATH" "$nodebin" "$@"
          }
          manifest() {
            (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum)
          }
          for pass in 1 2; do
            isolated > "$RUNNER_TEMP/d07-local-$pass.log" 2>&1 || {
              echo D07_T3_LOCAL_REBUILD=FAIL
              grep -E '^D07_PUBLIC_BUILD_STEP_(START|PASS|FAIL)=(generate:sitemap|generate:prerender-routes|quality:gate:pre|build:app|flatten:dist|prerender|quality:gate:post)(:[A-Z_0-9]+(:SIGNAL_[A-Z_0-9]+)?|:[0-9]+s)?$|^D07_PUBLIC_BUILD_GATE_CRITICAL=[a-z0-9-]+:[0-9]+$|^D07_PUBLIC_BUILD_GATE_REPORT=(CRITICAL|NO_CRITICAL_CODES|UNAVAILABLE)$|^D07_FORBIDDEN_ORDINARY_BUILD_TOOL$' "$RUNNER_TEMP/d07-local-$pass.log" | tail -20 || true
              grep -oE '^Error: D07_[A-Z0-9_]+' "$RUNNER_TEMP/d07-local-$pass.log" | tail -10 || true
              exit 1
            }
            grep -E '^D07_STATIC_ROUTER_NORMALIZED=\{"pages":[0-9]+,"slots":[0-9]+,"changed":[0-9]+,"changedPages":[0-9]+,"staticFreshnessTime":[0-9]+\}$' "$RUNNER_TEMP/d07-local-$pass.log"
            manifest > "$RUNNER_TEMP/d07-local-$pass.sha"
            if test "$pass" = 1; then cp -a dist "$RUNNER_TEMP/d07-repro-first-dist"; fi
            echo "D07_T3_LOCAL_REBUILD_$pass=PASS"
          done
          if ! cmp -s "$RUNNER_TEMP/d07-local-1.sha" "$RUNNER_TEMP/d07-local-2.sha"; then
            echo D07_T3_LOCAL_BYTE_REPRODUCIBILITY=FAIL
            node scripts/diagnose-d07-reproducibility.mjs "$RUNNER_TEMP/d07-repro-first-dist" "$PWD/dist" > "$RUNNER_TEMP/d07-repro-shape.log" 2>&1 || true
            grep '^D07_REPRO_DIAGNOSIS=' "$RUNNER_TEMP/d07-repro-shape.log" || true
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/d07-repro-first-dist"
          echo D07_T3_LOCAL_BYTE_REPRODUCIBILITY=PASS
          # Final rendered forms are audited against the exact validator, after the isolated build.
          node --import tsx scripts/audit-d07-t3-context.mjs "$PWD/dist" "$RUNNER_TEMP/validator" > "$RUNNER_TEMP/context-local.log" 2>&1 || {
            echo D07_T3_RENDERED_CONTEXT=FAIL
            grep -oE 'D07_CONTEXT_[A-Z0-9_]+' "$RUNNER_TEMP/context-local.log" | sort -u | tail -20 || true
            exit 1
          }
          grep -E '^D07_T3_RENDERED_CONTEXT=PASS \{' "$RUNNER_TEMP/context-local.log"
          local="$PWD/runtime/t3-platform/0.3.1-rc.1"
          cp "$local/platform-inputs.zip" "$RUNNER_TEMP/d07-bad.zip"
          node -e 'const fs=require("node:fs"),p=process.argv[1],b=fs.readFileSync(p);b[0]^=1;fs.writeFileSync(p,b)' "$RUNNER_TEMP/d07-bad.zip"
          if isolated "$local/d07-host" "$local/kernel-support" "$RUNNER_TEMP/d07-bad.zip" > "$RUNNER_TEMP/d07-corrupt.log" 2>&1; then
            echo D07_T3_CORRUPT_INPUT=FAIL
            exit 1
          fi
          grep -q 'D07_T3_PLATFORM_ARCHIVE_SHA256_MISMATCH' "$RUNNER_TEMP/d07-corrupt.log"
          manifest > "$RUNNER_TEMP/d07-after-corrupt.sha"
          cmp -s "$RUNNER_TEMP/d07-local-2.sha" "$RUNNER_TEMP/d07-after-corrupt.sha"
          echo D07_T3_CORRUPT_INPUT_PRESERVES_DIST=PASS
      - name: Actual HTTP qualification of every integrated offline resource
        working-directory: site
        run: |
          node scripts/preview-d07-t3-local.mjs --http-audit > "$RUNNER_TEMP/d07-http.log" 2>&1 || {
            echo D07_T3_PREVIEW_HTTP=FAIL
            grep -oE 'D07_T3_PREVIEW_[A-Z0-9_]+' "$RUNNER_TEMP/d07-http.log" | sort -u | head -20 || true
            exit 1
          }
          grep -E '^D07_T3_PREVIEW_HTTP=PASS \{' "$RUNNER_TEMP/d07-http.log"
      - name: Verify staged retained bytes and fresh checkout in a disposable local index
        if: ${{ success() && needs.t3-source.result == 'success' }}
        working-directory: site
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "873573fc5ff0f0336a468849730ab15b5dfa1b53"
          test -z "$(git status --porcelain --untracked-files=no)"
          local="runtime/t3-platform/0.3.1-rc.1"
          node --import tsx --input-type=module -e 'import {verifyPreparedD07Host} from "./scripts/prepare-d07-t3-host.mjs";import {verifyPreparedKernelSupport} from "./scripts/prepare-d07-local-kernel-input.mjs";import {verifyPlatformArchive} from "./scripts/t3-platform-inputs.mjs";const root=process.argv[1];verifyPreparedD07Host(root+"/d07-host");verifyPreparedKernelSupport(root+"/kernel-support");verifyPlatformArchive(root+"/platform-inputs.zip")' "$local" > "$RUNNER_TEMP/d07-retain-recheck.log" 2>&1 || {
            echo D07_T3_RETAIN_RECHECK=FAIL
            exit 1
          }
          if test -n "$(find "$local/d07-host" "$local/kernel-support" "$local/platform-inputs.zip" -type f -size +95M -print -quit)"; then
            echo D07_T3_RETAIN_GIT_SIZE_LIMIT=FAIL
            exit 1
          fi
          # Authenticate the exact index before any private retention commit.
          # No private compiled bytes are uploaded as public artifacts.
          git add -f -- "$local/d07-host" "$local/kernel-support" "$local/platform-inputs.zip"
          node scripts/verify-d07-retained-index.mjs > "$RUNNER_TEMP/d07-retain-index.log" 2>&1 || {
            echo D07_T3_RETAIN_INDEX=FAIL
            grep -oE 'D07_T3_RETAIN_INDEX_[A-Z0-9_]+' "$RUNNER_TEMP/d07-retain-index.log" | sort -u | head -15 || true
            exit 1
          }
          grep -E '^D07_T3_RETAIN_INDEX=PASS \{' "$RUNNER_TEMP/d07-retain-index.log"
      - name: Qualify ordinary release command switch before publication
        working-directory: site
        run: |
          set -euo pipefail
          # Only the release command is excluded from the exact Host receipt.
          # Exercise the actual npm entrypoint in this disposable checkout.
          # The enclosing npm CLI dispatches once; no Git/npm/npx/bun is
          # available to the build itself and no external network is allowed.
          trap 'git restore --worktree -- package.json' EXIT
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs";const p="package.json",m=JSON.parse(readFileSync(p,"utf8"));if(m.scripts.build!=="node scripts/build-d07-integrated-site.mjs"||m.scripts["t3:build"]!=="node --import tsx scripts/build-d07-t3-local-site.mjs")process.exit(1);m.scripts.build=m.scripts["t3:build"];writeFileSync(p,JSON.stringify(m,null,2)+"\n")'
          nodebin="$(command -v node)"
          npmcli="$(readlink -f "$(command -v npm)")"
          test -f "$npmcli"
          guard="$RUNNER_TEMP/d07-no-build-tools"
          sudo unshare --net -- bash -c 'ip link set lo up && exec setpriv --reuid "$1" --regid "$2" --init-groups env PATH="$3" "$4" "$5" run build' -- "$(id -u)" "$(id -g)" "$guard:$PATH" "$nodebin" "$npmcli" > "$RUNNER_TEMP/d07-ordinary-command.log" 2>&1 || {
            echo D07_T3_ORDINARY_COMMAND=FAIL
            grep -oE 'D07_(T3|STATIC|PUBLIC|FORBIDDEN)_[A-Z0-9_]+' "$RUNNER_TEMP/d07-ordinary-command.log" | sort -u | head -20 || true
            exit 1
          }
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/d07-ordinary-command.sha"
          cmp -s "$RUNNER_TEMP/d07-local-2.sha" "$RUNNER_TEMP/d07-ordinary-command.sha" || {
            echo D07_T3_ORDINARY_COMMAND_BYTE_PARITY=FAIL
            exit 1
          }
          echo D07_T3_ORDINARY_COMMAND_BYTE_PARITY=PASS
          echo D07_T3_RELEASE_COMMAND_VERIFIED=PASS
      - name: Commit only the exact qualified private inputs and tested release command
        working-directory: site
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "873573fc5ff0f0336a468849730ab15b5dfa1b53"
          test -z "$(git diff --name-only)"
          node scripts/verify-d07-retained-index.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --quiet -m 'D07: retain qualified local T3 platform inputs [skip ci] [skip actions]'
          echo "D07_T3_RETAINED_INPUT_PARENT=$(git rev-parse HEAD)"
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs";const p="package.json",m=JSON.parse(readFileSync(p,"utf8"));if(m.scripts.build!=="node scripts/build-d07-integrated-site.mjs"||m.scripts["t3:build"]!=="node --import tsx scripts/build-d07-t3-local-site.mjs")process.exit(1);m.scripts.build=m.scripts["t3:build"];writeFileSync(p,JSON.stringify(m,null,2)+"\n")'
          git add -- package.json
          test "$(git diff --cached --name-only)" = package.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --quiet -m 'D07: activate qualified self-contained T3 build in work branch [skip ci] [skip actions]'
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Authorized private branch retention and exact remote readback
        id: release-push
        working-directory: site
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          candidate="$(git rev-parse HEAD)"
          bash ../pipeline/scripts/d07-private-git-transport.sh publish 873573fc5ff0f0336a468849730ab15b5dfa1b53 "$candidate"
          echo "retained_commit=$candidate" >> "$GITHUB_OUTPUT"
          echo "dist_sha256=$(sha256sum "$RUNNER_TEMP/d07-local-2.sha" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      # Never upload private source, prepared inputs, dist, logs or model data.
  retained-private-readback:
    needs: original-t3-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: ${{ needs.original-t3-integration.outputs.retained_commit }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - name: Rebuild from actually retained private commit without IWXA source or network
        working-directory: site
        env:
          EXPECTED_RETAINED: ${{ needs.original-t3-integration.outputs.retained_commit }}
          EXPECTED_DIST_SHA: ${{ needs.original-t3-integration.outputs.dist_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RETAINED" =~ ^[0-9a-f]{40}$ && "$EXPECTED_DIST_SHA" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_RETAINED"
          node --input-type=module -e 'import {readFileSync} from "node:fs";const p=JSON.parse(readFileSync("package.json","utf8"));if(p.scripts.build!=="node --import tsx scripts/build-d07-t3-local-site.mjs"||p.scripts.build!==p.scripts["t3:build"])process.exit(1)'
          bun install --frozen-lockfile > "$RUNNER_TEMP/readback-install.log" 2>&1 || { echo D07_T3_READBACK_INSTALL=FAIL; exit 1; }
          guard="$RUNNER_TEMP/d07-no-build-tools"
          mkdir -p "$guard"
          for name in git npm npx bun; do
            printf '#!/bin/sh\necho D07_FORBIDDEN_ORDINARY_BUILD_TOOL >&2\nexit 73\n' > "$guard/$name"
            chmod +x "$guard/$name"
          done
          nodebin="$(command -v node)"
          npmcli="$(readlink -f "$(command -v npm)")"
          sudo unshare --net -- bash -c 'ip link set lo up && exec setpriv --reuid "$1" --regid "$2" --init-groups env PATH="$3" "$4" "$5" run build' -- "$(id -u)" "$(id -g)" "$guard:$PATH" "$nodebin" "$npmcli" > "$RUNNER_TEMP/readback-build.log" 2>&1 || {
            echo D07_T3_RETAINED_BUILD=FAIL
            grep -oE 'D07_(T3|STATIC|PUBLIC|FORBIDDEN)_[A-Z0-9_]+' "$RUNNER_TEMP/readback-build.log" | sort -u | head -20 || true
            exit 1
          }
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/readback-dist.sha"
          test "$(sha256sum "$RUNNER_TEMP/readback-dist.sha" | cut -d ' ' -f 1)" = "$EXPECTED_DIST_SHA"
          echo D07_T3_RETAINED_BUILD_BYTES=PASS
          node scripts/preview-d07-t3-local.mjs --http-audit > "$RUNNER_TEMP/readback-http.log" 2>&1 || {
            echo D07_T3_RETAINED_HTTP=FAIL
            grep -oE 'D07_T3_PREVIEW_[A-Z0-9_]+' "$RUNNER_TEMP/readback-http.log" | sort -u | head -20 || true
            exit 1
          }
          grep -E '^D07_T3_PREVIEW_HTTP=PASS \{' "$RUNNER_TEMP/readback-http.log"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo D07_T3_RETAINED_READBACK=PASS
      # Never upload private sources, files, build artifacts or private logs.
