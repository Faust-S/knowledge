name: D07 T3 original-platform integration
on:
  push:
    branches:
      - 'ci/once/d07-t3-integration/*'
    paths:
      - '.github/ci-requests/d07-t3-integration.json'
  workflow_dispatch:
    inputs:
      mode:
        description: "Release qualifies the navigation-corrected candidate and retains its inputs; build-only is diagnostic"
        type: choice
        required: true
        default: release
        options: [release, transport-only, source-only, build-only]
permissions:
  contents: read
  actions: read
concurrency:
  group: d07-t3-integration
  # Never cancel a qualified private publication in progress.
  cancel-in-progress: false
jobs:
  private-transport:
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.mode == 'release' || inputs.mode == 'transport-only')) || (github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          path: pipeline
      - name: Verify the single explicit CI request before private checkout
        working-directory: pipeline
        run: |
          python3 tools/ci/verify_once_request.py \
            --repository Faust-S/knowledge --workflow d07-t3-integration \
            --profile release-navigation-corrected \
            --reason 'Qualify the corrected print route and retain exact private release inputs' \
            --revision site=20ca06ee2f07b430dbd6b59f72822b45f0527bd4 \
            --revision domain=11ec43898d025107174df0b2cde6024c340c1cc0 \
            --revision t2=e70de29b72b83e2546f7ab74b17572685a728c17 \
            --revision assistant=5e3083788aa541921559de29d3457d4a52bbba00 \
            --revision core=326f725c44d69ac99f6b912241e9e8a6c3d716a5 \
            --revision baseline_site=6906829da95d2d2366f294a3f567aa760db02d59 \
            --revision qualification=903f2bb3b9e7b75fe4b8bbbe60f552428c5ae831
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: 20ca06ee2f07b430dbd6b59f72822b45f0527bd4
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - name: Classify Git transport failures without exposing logs
        run: bash pipeline/scripts/test-d07-private-git-transport.sh
      - name: Verify exact private receive-pack and diagnose existing token permissions
        working-directory: site
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: bash ../pipeline/scripts/d07-private-git-transport.sh preflight 20ca06ee2f07b430dbd6b59f72822b45f0527bd4
  t3-source:
    needs: private-transport
    # Only unchanged source scopes inherit the prior qualification. The print route needs a new build.
    # Do not spend runner time reconstructing private inputs without write access.
    # Explicit source/build-only diagnostics remain independent of publication.
    if: ${{ !cancelled() && ((needs.private-transport.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'release')) || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'source-only' || inputs.mode == 'build-only'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod
          ref: 11ec43898d025107174df0b2cde6024c340c1cc0
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: domain
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: 20ca06ee2f07b430dbd6b59f72822b45f0527bd4
          fetch-depth: 4
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 5e3083788aa541921559de29d3457d4a52bbba00
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: assistant
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - name: Reuse only unchanged source qualification for the exact navigation correction
        id: prior-source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'release' }}
        run: |
          set -euo pipefail
          # The exact successor changes the legacy print journey and existing link audit.
          # All changed navigation and release gates are qualified separately.
          if [[ "$REQUEST_MODE" == source-only || "$(git -C site rev-parse HEAD)" != "20ca06ee2f07b430dbd6b59f72822b45f0527bd4" ]]; then exit 0; fi
          test "$(git -C site rev-parse HEAD^)" = "16f437f2c1402be7cdd30bbc30b533f31856af19"
          test "$(git -C site rev-parse HEAD^^)" = "121916241d16f12ecb65c05bfe497335ab37d5dc"
          test "$(git -C site rev-parse HEAD^^^)" = "482fc878b4ac365241877fc03a9eeee84ae012a0"
          test "$(git -C site diff --name-only --no-renames HEAD^^^ HEAD | LC_ALL=C sort)" = "$(printf '%s\n' scripts/audit-d07-hosting-package.mjs scripts/check-links.ts scripts/tests/d07-hosting-package.test.mjs scripts/tests/d07-hosting-seo-legacy.test.mjs scripts/tests/d07-legacy-workspace-nav.test.mjs src/components/WorkspacePanel.tsx src/routes/rabochaya-oblast.pechat.tsx src/routes/rabochaya-oblast_.pechat.tsx src/site-routes.ts vite.config.ts)"
          test "$(git -C domain rev-parse HEAD)" = "11ec43898d025107174df0b2cde6024c340c1cc0"
          test "$(git -C assistant rev-parse HEAD)" = "5e3083788aa541921559de29d3457d4a52bbba00"
          if [[ "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45663645049 --jq .head_sha 2>/dev/null || true)" != "903f2bb3b9e7b75fe4b8bbbe60f552428c5ae831" ]]; then exit 0; fi
          if [[ "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45663645049/jobs --jq 'any(.jobs[]; .id == 139379941479 and .name == "t3-source" and .conclusion == "success")' 2>/dev/null || true)" != true ]]; then exit 0; fi
          echo "reuse=true" >> "$GITHUB_OUTPUT"
          echo D07_T3_SOURCE_QUALIFICATION_REUSED=PASS
          echo D07_T3_SOURCE_QUALIFICATION_RUN=45663645049
      - name: Qualify changed navigation and link resolution without dependencies
        if: ${{ steps.prior-source.outputs.reuse == 'true' }}
        working-directory: site
        run: |
          node --experimental-strip-types --test scripts/tests/d07-legacy-workspace-nav.test.mjs > "$RUNNER_TEMP/d07-print-nav.log" 2>&1 || {
            echo D07_T3_PRINT_NAV_SOURCE=FAIL
            grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/d07-print-nav.log" || true
            exit 1
          }
          echo D07_T3_PRINT_NAV_SOURCE=PASS
          grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/d07-print-nav.log"
      - name: Preserve exact T2 subject and Workspace module
        if: ${{ steps.prior-source.outputs.reuse != 'true' }}
        run: |
          test "$(git -C domain rev-parse HEAD)" = "11ec43898d025107174df0b2cde6024c340c1cc0"
          test "$(git -C site rev-parse HEAD)" = "20ca06ee2f07b430dbd6b59f72822b45f0527bd4"
          cmp domain/models/assistant-skills.json site/public/assets/d07-assistant-skills.json
          for path in domain/src/domain/service-subject*.ts domain/src/domain/service-blocks.ts domain/src/domain/service-changes.ts domain/src/domain/service-execution.ts; do
            cmp "$path" "site/src/domain/$(basename "$path")"
          done
          cmp domain/src/domain/order-contract.ts site/src/domain/order-contract.ts
          cmp domain/src/domain/service-criteria-projection.mjs site/src/domain/service-criteria-projection.mjs
          cmp domain/src/domain/service-criteria-projection.d.mts site/src/domain/service-criteria-projection.d.mts
          cmp domain/src/domain/service-brief-text.ts site/src/domain/service-brief-text.ts
          cmp domain/src/domain/documented-service-criteria.ts site/src/domain/documented-service-criteria.ts
          cmp domain/src/domain/documented-case-replay.ts site/src/domain/documented-case-replay.ts
          cmp domain/src/domain/order-stage-draft.ts site/src/domain/order-stage-draft.ts
          cmp domain/src/domain/order-stage-replacement.ts site/src/domain/order-stage-replacement.ts
          cmp domain/src/domain/risk-stage-revision.ts site/src/domain/risk-stage-revision.ts
          cmp domain/src/domain/tool-stage-version.ts site/src/domain/tool-stage-version.ts
          cmp domain/src/domain/risk-stage-revision.ts site/t2-site-module/uslugovod/risk-stage-revision.ts
          for f in proposal-answer-state.ts service-lifecycle.ts universal-service-criteria.ts; do
            cmp "domain/src/domain/$f" "site/src/domain/$f"
            cmp "domain/src/domain/$f" "site/t2-site-module/uslugovod/$f"
          done
          cmp domain/src/data/documented-service-fields.ts site/src/data/documented-service-fields.ts
          node --experimental-strip-types --test domain/tests/documented-service-criteria.test.mjs domain/tests/documented-case-replay.test.mjs domain/tests/order-stage-draft.test.mjs domain/tests/order-stage-replacement.test.mjs domain/tests/tool-stage-version.test.mjs domain/tests/proposal-answer-state.test.mjs domain/tests/current-lifecycle-coverage.test.mjs domain/tests/universal-stage-continuity.test.mjs > "$RUNNER_TEMP/documented-criteria.log" 2>&1 || { echo D07_DOCUMENTED_DOMAIN_TESTS=FAIL; grep -E '^not ok|^# (tests|pass|fail)' "$RUNNER_TEMP/documented-criteria.log" | cut -c1-180; exit 1; }
          echo D07_DOCUMENTED_DOMAIN_TESTS=PASS
          grep -E '^# (tests|pass|fail)' "$RUNNER_TEMP/documented-criteria.log"
          cmp domain/src/data/serviceDirectory.ts site/src/data/serviceDirectory.ts
          for f in service-blocks.ts service-changes.ts service-execution.ts service-order-identity.ts service-money.ts service-attention.ts service-month-report.ts; do cmp "domain/src/domain/$f" "site/t2-site-module/uslugovod/$f"; done
          cmp domain/src/domain/service-attention.ts site/src/domain/service-attention.ts
          cmp domain/src/domain/service-month-report.ts site/src/domain/service-month-report.ts
          echo D07_T3_DOMAIN_PARITY=PASS
      - name: Original shared assistant validates canonical skill package
        if: ${{ steps.prior-source.outputs.reuse != 'true' }}
        run: |
          node domain/scripts/d07-skill-authoring.mjs --check > "$RUNNER_TEMP/skills.log" 2>&1 || { echo D07_T3_SKILL_GENERATION=FAIL; exit 1; }
          node --test domain/tests/assistant-skills.test.mjs > "$RUNNER_TEMP/skill-tests.log" 2>&1 || { echo D07_T3_SKILL_TESTS=FAIL; grep -E '^not ok|^# (tests|pass|fail)' "$RUNNER_TEMP/skill-tests.log" | cut -c1-180; exit 1; }
          node --input-type=module -e 'import fs from "node:fs";import {validateSkillPack} from "./assistant/browser-local-inference/domain-assistant/skill-runtime.mjs";const p=JSON.parse(fs.readFileSync("domain/models/assistant-skills.json","utf8"));validateSkillPack(p);console.log("D07_T3_SKILLS="+p.skills.length);console.log("D07_T3_FORM_HINTS="+p.formHints.length);console.log("D07_T3_RESULT_HINTS="+p.resultHints.length)' > "$RUNNER_TEMP/skill-schema.log" 2>&1 || { echo D07_T3_SHARED_SCHEMA=FAIL; grep -E '^Error: [A-Z0-9_]+' "$RUNNER_TEMP/skill-schema.log" | cut -c1-180; exit 1; }
          D07_ORIGINAL_ASSISTANT_DIR="$GITHUB_WORKSPACE/assistant/browser-local-inference/domain-assistant" node --test domain/tests/assistant-skill-field-policy.test.mjs > "$RUNNER_TEMP/exact-policy.log" 2>&1 || { echo D07_T3_EXACT_POLICY=FAIL; grep -E '^not ok|^# (tests|pass|fail) ' "$RUNNER_TEMP/exact-policy.log" | cut -c1-180 | head -30; exit 1; }
          echo D07_T3_EXACT_POLICY=PASS
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/exact-policy.log"
          node --check assistant/browser-local-inference/domain-assistant/main.mjs
          node --test assistant/browser-local-inference/tests/domain-assistant-*.test.mjs > "$RUNNER_TEMP/shared-assistant.log" 2>&1 || { echo D07_T3_SHARED_ASSISTANT=FAIL; grep -E '^not ok|^# (tests|pass|fail) ' "$RUNNER_TEMP/shared-assistant.log" | cut -c1-180 | head -30; exit 1; }
          echo D07_T3_SHARED_ASSISTANT=PASS
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/shared-assistant.log"
          echo D07_T3_SHARED_SCHEMA=PASS
          grep -E '^D07_T3_[A-Z_]+=[0-9]+$' "$RUNNER_TEMP/skill-schema.log"
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/skill-tests.log"
      - uses: actions/checkout@v4
        if: ${{ steps.prior-source.outputs.reuse != 'true' }}
        with:
          repository: Faust-S/uslugovod.ru
          ref: 6906829da95d2d2366f294a3f567aa760db02d59
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: baseline-site
      - name: Locked dependencies, native product tests, TypeScript
        if: ${{ steps.prior-source.outputs.reuse != 'true' }}
        working-directory: site
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/d07-install.log" 2>&1 || { echo D07_T3_INSTALL=FAIL; exit 1; }
          # Run independent source suites even if another suite fails. Print only
          # test names, aggregate counts and bounded product error identifiers.
          failed=0
          qualify() {
            local name="$1"
            shift
            local log="$RUNNER_TEMP/d07-$name.log"
            if "$@" > "$log" 2>&1; then
              echo "D07_T3_${name}=PASS"
            else
              echo "D07_T3_${name}=FAIL"
              failed=1
              grep -E '^not ok [0-9]+ |^# (tests|pass|fail|skipped) [0-9]+$' "$log" | cut -c1-180 | head -60 || true
              grep -oE '(D07|T3)_[A-Z][A-Z0-9_]+' "$log" | sort -u | head -30 || true
              grep -oE 'TS[0-9]{4}' "$log" | sort | uniq -c || true
              # Only diagnostic location and code, never private source lines,
              # exception payloads or dependency contents.
              if test "$name" = TYPES; then
                grep -oE '^([a-zA-Z0-9_./$-]+\([0-9]+,[0-9]+\): error TS[0-9]{4})' "$log" | head -20 || true
              fi
              return 0
            fi
            grep -E '^# (tests|pass|fail|skipped) [0-9]+$' "$log" || true
          }
          qualify ACCEPTANCE_SOURCE node --import tsx --test scripts/tests/d07-brief-select-presentation.test.mjs scripts/tests/d07-brief-select-render.test.mjs scripts/tests/d07-acceptance-case-inputs.test.mjs scripts/tests/d07-acceptance-case-plan.test.mjs scripts/tests/d07-documented-service-criteria-pure.test.mjs scripts/tests/d07-documented-service-criteria.test.mjs scripts/tests/d07-documented-case-replay-pure.test.mjs scripts/tests/d07-current-documented-case-replay.test.mjs
          qualify STAGE_CONTINUITY npm run test:t3-stage-continuity
          qualify ORIGINAL_REGRESSION npm run test:product-first
          qualify RESTORED_PROFESSIONAL_WX node --import tsx --test scripts/tests/d07-next500-five-w-professional.test.mjs scripts/tests/d07-next500-five-x-professional.test.mjs
          qualify PROFESSIONAL_TOOLS node --import tsx --test scripts/tests/d07-t3-professional-tool-criteria.test.mjs scripts/tests/d07-brief-fidelity.test.mjs scripts/tests/d07-professional-card-release.test.mjs
          qualify TYPES bun run check:types
          test "$failed" -eq 0
          mkdir -p "$RUNNER_TEMP/criteria-old" "$RUNNER_TEMP/criteria-new"
          cp t2-site-module/uslugovod/manifest.json "$RUNNER_TEMP/criteria-old/manifest.json"
          cp t2-site-module/uslugovod/manifest.json "$RUNNER_TEMP/criteria-new/manifest.json"
          cp ../baseline-site/scripts/generate-d07-workspace-criteria.mjs scripts/.qualification-previous-criteria.mjs
          trap 'rm -f scripts/.qualification-previous-criteria.mjs' EXIT
          node --import tsx scripts/.qualification-previous-criteria.mjs "$RUNNER_TEMP/criteria-old" > "$RUNNER_TEMP/criteria-old.log" 2>&1 || { echo D07_T3_PREVIOUS_CRITERIA=FAIL; exit 1; }
          node --import tsx scripts/generate-d07-workspace-criteria.mjs "$RUNNER_TEMP/criteria-new" > "$RUNNER_TEMP/criteria-new.log" 2>&1 || { echo D07_T3_NEW_CRITERIA=FAIL; exit 1; }
          cmp "$RUNNER_TEMP/criteria-old/service-criteria.generated.json" "$RUNNER_TEMP/criteria-new/service-criteria.generated.json"
          echo D07_T3_CRITERIA_BYTE_PARITY=PASS
          grep -E '^D07_WORKSPACE_[A-Z_]+=[0-9]+$' "$RUNNER_TEMP/criteria-new.log"
          rm scripts/.qualification-previous-criteria.mjs
          trap - EXIT
          node --check scripts/prepare-d07-t3-host.mjs
          node --check scripts/assemble-d07-t3-dist.mjs
          node --check scripts/t3-platform-inputs.mjs
          node --check scripts/build-d07-t3-local-site.mjs
          node --check scripts/lib/d07-local-build-environment.mjs
          node --check scripts/lib/d07-qualified-build-command.mjs
          node --check scripts/prepare-d07-local-kernel-input.mjs
          node --check scripts/retain-d07-t3-inputs.mjs
          node --check scripts/build-d07-integrated-site.mjs
          node --check scripts/build-d07-clean.mjs
          node --check scripts/audit-d07-t3-context.mjs
          npm run t3:test-local > "$RUNNER_TEMP/local-tests.log" 2>&1 || { echo D07_T3_LOCAL_TESTS=FAIL; grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/local-tests.log"; exit 1; }
          node --test scripts/tests/d07-local-build-environment.test.mjs scripts/tests/d07-qualified-build-command.test.mjs scripts/tests/d07-t3-preview.test.mjs scripts/tests/d07-retained-byte-attributes.test.mjs scripts/tests/d07-retained-index.test.mjs scripts/tests/d07-private-release.test.mjs > "$RUNNER_TEMP/preview-tests.log" 2>&1 || {
            echo D07_T3_PREVIEW_TESTS=FAIL
            grep -E '^# (tests|pass|fail) [0-9]+$|^not ok [0-9]+ ' "$RUNNER_TEMP/preview-tests.log" | cut -c1-160 | head -20
            exit 1
          }
          echo D07_T3_PREVIEW_TESTS=PASS
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/preview-tests.log"
          echo D07_T3_LOCAL_TESTS=PASS
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/local-tests.log"
          echo D07_T3_ASSEMBLY_SYNTAX=PASS
  original-t3-integration:
    needs: [t3-source, private-transport]
    # Release builds the corrected candidate once before retention and compares its fresh checkout.
    # Build-only preserves the complete independent qualification route.
    if: ${{ !cancelled() && needs.t3-source.result == 'success' && ((needs.private-transport.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'release')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'build-only')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      retained_commit: ${{ steps.release-push.outputs.retained_commit }}
      dist_sha256: ${{ steps.release-push.outputs.dist_sha256 }}
      dist_tree_sha256: ${{ steps.case-plan.outputs.dist_tree_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: pipeline
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: 20ca06ee2f07b430dbd6b59f72822b45f0527bd4
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: e70de29b72b83e2546f7ab74b17572685a728c17
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: T2
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 5e3083788aa541921559de29d3457d4a52bbba00
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: assistant
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 326f725c44d69ac99f6b912241e9e8a6c3d716a5
          persist-credentials: false
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - name: Confirm unchanged original platform evidence and exact successor
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C site rev-parse HEAD)" = "20ca06ee2f07b430dbd6b59f72822b45f0527bd4"
          test "$(git -C T2 rev-parse HEAD)" = "e70de29b72b83e2546f7ab74b17572685a728c17"
          test "$(git -C assistant rev-parse HEAD)" = "5e3083788aa541921559de29d3457d4a52bbba00"
          test "$(git -C core rev-parse HEAD)" = "326f725c44d69ac99f6b912241e9e8a6c3d716a5"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45663645049 --jq .head_sha)" = "903f2bb3b9e7b75fe4b8bbbe60f552428c5ae831"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45663645049/jobs --jq 'any(.jobs[]; .id == 139380128465 and .name == "original-t3-integration" and .conclusion == "success")')" = true
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45663645049/jobs --jq 'any(.jobs[]; .id == 139379941479 and .name == "t3-source" and .conclusion == "success")')" = true
          echo D07_T3_PREVIOUS_PLATFORM_EVIDENCE=45663645049
      - name: Retrieve and authenticate exact published common platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/platform"
          gh run download 45395047723 --repo Faust-S/knowledge --name iwxa-t3-mobile-portable-candidate-326f725c44d69ac99f6b912241e9e8a6c3d716a5 --dir "$RUNNER_TEMP/platform" > "$RUNNER_TEMP/platform-download.log" 2>&1 || { echo D07_T3_PLATFORM_DOWNLOAD=FAIL; exit 1; }
          archive="$(find "$RUNNER_TEMP/platform" -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          node site/scripts/t3-platform-inputs.mjs verify "$archive" > "$RUNNER_TEMP/platform-verify.log" 2>&1 || { echo D07_T3_PLATFORM_VERIFY=FAIL; grep -E '^Error: D07_T3_PLATFORM_[A-Z0-9_]+' "$RUNNER_TEMP/platform-verify.log" | cut -c1-160; exit 1; }
          echo "D07_PLATFORM_ZIP=$archive" >> "$GITHUB_ENV"
          echo D07_T3_PLATFORM_VERIFY=PASS
      - name: Build complete D07 public site without changing native T2 orders
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/T2
          VITE_D07_T3: '1'
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/install.log" 2>&1 || { echo D07_T3_INSTALL=FAIL; exit 1; }
          # The source job already ran the exact navigation and link tests.
          # Run only the remaining changed gates requiring site dependencies.
