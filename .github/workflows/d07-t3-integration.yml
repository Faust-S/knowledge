          test "$tree" = "$EXPECTED_TREE_SHA"
          echo D07_T3_RETAINED_TREE_IDENTITY=PASS
          node --import tsx scripts/d07-t3-acceptance-case-plan.mjs --check dist > "$RUNNER_TEMP/readback-case-plan.log" 2>&1 || {
            echo D07_T3_RETAINED_CASE_PLAN=FAIL
            grep -oE 'D07_(ACCEPTANCE_PLAN|T3_PREVIEW|PRIVATE_RELEASE)_[A-Z0-9_]+' "$RUNNER_TEMP/readback-case-plan.log" | sort -u | head -10 || true
            exit 1
