name: IWXA PT main integration dryrun
on:
  push:
    branches: [work/2026-11-18-pt-66-qualification]
    paths: [.github/workflows/iwxa-pt-main-integration-dryrun.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check private access and capability
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          test -n "$GH_TOKEN" || exit 1
          gh api repos/Faust-S/iwxa-ru-1 >/dev/null 2>&1 || exit 1
          cap="$(gh api repos/Faust-S/iwxa-ru-1 -q '.permissions.push' 2>/dev/null || echo unknown)"
          echo "PT_INTEGRATION_TOKEN_PUSH=$cap"
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-ru-1
          ref: e93b9c1c49b2d6030da692142b77c3edba8f098e
          token: ${{ secrets.DOMEN }}
          fetch-depth: 0
          persist-credentials: false
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"
      - name: Deterministic non-destructive merge in memory
        shell: bash
        working-directory: site
        run: |
          test "$(git rev-parse HEAD)" = "e93b9c1c49b2d6030da692142b77c3edba8f098e" || exit 1
          test "$(git merge-base HEAD b840ebfd57d086a65c4474136a3c334eda07f5c4)" = "fd491f1bf289923821c69b7f0653c521a115d0e1" || exit 1
          git config user.name "IWXA Merge Qualification"
          git config user.email "iwxa-merge-qa@users.noreply.github.com"
          git -c merge.conflictStyle=merge merge -q -X ours --no-commit --no-ff b840ebfd57d086a65c4474136a3c334eda07f5c4 > "$RUNNER_TEMP/merge.log" 2>&1 || {
            echo "PT_MERGE_WITH_OURS=FAIL"
            grep -E "^(fatal|error|CONFLICT)" "$RUNNER_TEMP/merge.log" | tail -n 10 || true
            exit 1
          }
          if test -n "$(git diff --name-only --diff-filter=U)"; then echo "PT_MERGE_UNRESOLVED=FAIL"; exit 1; fi
          echo "PT_MERGE_WITH_OURS=PASS"
          echo "PT_MERGED_CHANGED_PATHS=$(git diff --cached --name-only | wc -l | tr -d ' ')"
          if git diff --exit-code e93b9c1c49b2d6030da692142b77c3edba8f098e -- src/routes/fr.* src/routes/de.* src/routes/es.* src/routes/ar.* src/routes/zh.* src/styles/home.css >/dev/null; then echo "MAIN_LOCALE_SURFACES_RETAINED=PASS"; else echo "MAIN_LOCALE_SURFACES_RETAINED=FAIL"; exit 1; fi
          if ! test -f src/routes/pt.life-plus.tsx || ! test -f src/styles/university-mobile-article-ru-pt.css; then echo "PT_MERGE_NEW_FILES=FAIL"; exit 1; fi
          echo "PT_MERGE_NEW_FILES=PASS"
          node - <<'JS'
          const fs=require('fs'),cp=require('child_process');
          const f='translation/coverage.json';
          const c=JSON.parse(fs.readFileSync(f,'utf8'));
          const pt=JSON.parse(cp.execFileSync('git',['show','b840ebfd57d086a65c4474136a3c334eda07f5c4:'+f],{encoding:'utf8'}));
          if(c.routes.length!==66 || pt.routes.length!==66 ||
             c.routes.some((r,i)=>r.route!==pt.routes[i].route))throw new Error("PT_COVERAGE_SOURCE_ROUTES_CHANGED");
          if(!pt.routes.every(r=>r.available.includes('pt-BR')))throw new Error("PT_COVERAGE_INCOMPLETE");
          const orig=c.routes.map(r=>[r.route,r.available.filter(l=>l!=='pt-BR')]);
          c.locales=[...new Set([...c.locales,'pt-BR'])];
          c.routes=c.routes.map(r=>({...r,available:[...new Set([...r.available,'pt-BR'])]}));
          c.pt_unified=pt.pt_unified;
          if(c.routes.some((r,i)=>JSON.stringify([r.route,r.available.filter(l=>l!=='pt-BR')])!==JSON.stringify(orig[i]))) throw new Error("OTHER_LOCALES_CHANGED");
          fs.writeFileSync(f,JSON.stringify(c,null,2)+String.fromCharCode(10));
          console.log("INTEGRATED_PT_REGISTERED="+c.routes.filter(r=>r.available.includes("pt-BR")).length);
          console.log("INTEGRATED_LOCALES="+c.locales.join(","));
          JS
      - name: Resolve narrow DE and PT type/404 conflicts
        working-directory: site
        shell: bash
        run: |
          node - <<'JS'
          const fs=require('fs'),cp=require('child_process');
          const PT='b840ebfd57d086a65c4474136a3c334eda07f5c4';
          const read=p=>fs.readFileSync(p,'utf8');
          const write=(p,s)=>fs.writeFileSync(p,s);
          const orbit='src/components/site/OrbitalMap.tsx';
          let s=read(orbit);
          const old='|"de-DE"})';
          if(!s.includes(old)||s.includes('|"de-DE"|"pt-BR"})')) throw new Error('INTEGRATED_ORBIT_TYPE_ANCHOR_CHANGED');
          write(orbit,s.replace(old,'|"de-DE"|"pt-BR"})'));
          const root='src/routes/__root.tsx';
          s=read(root);
          const predicate='  const german = locale === "de-DE";';
          if(s.split(predicate).length-1!==2)throw new Error('INTEGRATED_ROOT_LOCALE_ANCHOR_CHANGED');
          write(root,s.replaceAll(predicate,predicate+String.fromCharCode(10)+'  const portuguese = locale === "pt-BR";'));
          const legacy='src/components/life-plus/legacy-banner.tsx';
          s=read(legacy);
          const p=cp.execFileSync('git',['show',PT+':'+legacy],{encoding:'utf8'});
          const candidates=[...p.matchAll(/: locale === "pt-BR" \? "[^"]*"/g)].map(x=>x[0]);
          if(candidates.length!==2)throw new Error('INTEGRATED_LEGACY_PT_STRINGS_MISSING');
          if(!s.includes(' | "de-DE" };'))throw new Error('INTEGRATED_LEGACY_TYPE_ANCHOR_CHANGED');
          s=s.replace(' | "de-DE" };',' | "de-DE" | "pt-BR" };');
          let ix=0;
          s=s.replace(/: locale === "ar" \?/g,()=>{
            const pt=candidates[ix++];
            if(!pt)throw new Error('INTEGRATED_LEGACY_AR_ANCHOR_COUNT_CHANGED');
            return pt+' : locale === "ar" ?';
          });
          if(ix!==2)throw new Error('INTEGRATED_LEGACY_AR_ANCHOR_COUNT_CHANGED');
          write(legacy,s);
          const common=['src/components/site/OrbitalMap.tsx','src/components/site/MeaningHierarchy.tsx','src/components/site/ui.tsx','src/i18n/site-copy.ts','src/routes/__root.tsx','src/components/life-plus/article.tsx','src/components/life-plus/connections.tsx','src/components/life-plus/lab.tsx','src/components/life-plus/legacy-banner.tsx','src/components/life-plus/controls/LifeNextRoute.tsx','src/components/life-plus/controls/LifeResultPanel.tsx'];
          const count=(v,re)=>(v.match(re)||[]).length;
          for(const path of common){
            const actual=read(path),source=cp.execFileSync('git',['show',PT+':'+path],{encoding:'utf8'});
            const n=count(actual,/pt-BR|portuguese|Português|ORBITAL_PT|PT_/gi),expected=count(source,/pt-BR|portuguese|Português|ORBITAL_PT|PT_/gi);
            console.log('INTEGRATED_LOCALE_ELEMENTS='+path+' PT '+n+'/'+expected);
          }
          console.log('INTEGRATED_TYPE_UNION_REPAIR=PASS');
          JS
      - name: Qualify integrated TSC then build
        shell: bash
        working-directory: site
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/install.log" 2>&1 || { echo "INTEGRATED_INSTALL=FAIL"; exit 1; }
          echo "INTEGRATED_INSTALL=PASS"
          node scripts/sync-route-tree.mjs > "$RUNNER_TEMP/sync.log" 2>&1 || { echo "INTEGRATED_ROUTE_TREE=FAIL"; exit 1; }
          echo "INTEGRATED_ROUTE_TREE=PASS"
          set +e
          ./node_modules/.bin/tsc --noEmit > "$RUNNER_TEMP/typecheck.log" 2>&1
          code=$?
          set -e
          echo "INTEGRATED_TSC_EXIT=$code"
          if [ "$code" -ne 0 ]; then
            grep -E 'error TS[0-9]+:' "$RUNNER_TEMP/typecheck.log" |
              sed -E 's/(error TS[0-9]+:).*/\\1 <diagnostic redacted>/' |
              tail -n 45 || true
            echo "INTEGRATED_TSC_TOTAL_ERRORS=$(grep -c 'error TS[0-9]*:' "$RUNNER_TEMP/typecheck.log")"
            echo "INTEGRATED_TYPES=FAIL"
            exit 1
          fi
          echo "INTEGRATED_TYPES=PASS"
          export LOVABLE_BUILD_TARGET=static NITRO_PRESET=node-server SERVER_PRESET=node-server
          bun run build > "$RUNNER_TEMP/build.log" 2>&1 || {
            echo "INTEGRATED_BUILD=FAIL"
            grep -Ei 'error|failed|cannot|unable|missing' "$RUNNER_TEMP/build.log" |
              sed -E 's#(/home/runner/)[^ :]+#<private-path>#g' |
              tail -n 6 || true
            exit 1
          }
          echo "INTEGRATED_BUILD=PASS"
