name: AKIS Mesa 3.5.2 R2 original owner economic outlook and KPB

on:
  push:
    branches:
      - work/2026-11-23-akis-r2-owner-outlook-kpb-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-mesa-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install original Mesa
        run: |
          python -m pip install --disable-pip-version-check "mesa==3.5.2" "pytest>=8,<10"
          python -c "import mesa; assert mesa.__version__ == '3.5.2'"
      - name: Compile original research
        run: python -m compileall -q qualifications/akis_2026_11_21/research
      - name: Targeted owner-outlook KPB tests
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r2_original_owner_outlook_kpb_mesa.py
      - name: Full original Mesa regression
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests
      - name: Export source-qualified owner outlook experiment
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_r2_owner_outlook_kpb_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: akis-r2-owner-outlook-${{ matrix.os }}
          if-no-files-found: error
          path: qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r2_owner_outlook_original_strict_kpb_evidence.json
