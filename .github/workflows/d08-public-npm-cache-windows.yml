name: D08 public npm offline cache for Windows
on:
  push:
    branches:
      - work/2026-11-18-d08-marketops-windows-qualification
    paths:
      - .github/workflows/d08-public-npm-cache-windows.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-cache:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SITE_SHA: b082750ec0fdb99d4b4c512f8adfc1e4e323c999
      npm_config_registry: https://registry.npmjs.org/
      PUPPETEER_SKIP_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout exact private site without persisted credentials
        uses: actions/checkout@v4
        with:
          repository: Faust-S/market-ops.ru
          ref: ${{ env.SITE_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install public packages and independently confirm offline replay
        shell: pwsh
        working-directory: private/site
        run: |
          $ErrorActionPreference='Stop'
          if ((& git rev-parse HEAD).Trim() -ne $env:SITE_SHA) {throw 'D08_CACHE_SITE_SHA_MISMATCH'}
          $env:npm_config_cache=Join-Path $env:RUNNER_TEMP 'd08-public-npm-cache'
          & npm run check:npm-lock *> (Join-Path $env:RUNNER_TEMP 'd08-cache-lock.private.log')
          if($LASTEXITCODE -ne 0){throw 'D08_CACHE_LOCK_GUARD_FAILED'}
          & npm ci --include=dev --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP 'd08-cache-install.private.log')
          if($LASTEXITCODE -ne 0){throw 'D08_CACHE_INSTALL_FAILED'}
          Write-Host 'D08_CACHE_PUBLIC_INSTALL=PASS'
          $offline=Join-Path $env:RUNNER_TEMP 'd08-cache-offline-verify'
          New-Item -ItemType Directory -Force -Path $offline | Out-Null
          Copy-Item package.json (Join-Path $offline 'package.json')
          Copy-Item package-lock.json (Join-Path $offline 'package-lock.json')
          Push-Location $offline
          try{
            & npm ci --offline --include=dev --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP 'd08-cache-offline.private.log')
            if($LASTEXITCODE -ne 0){throw 'D08_CACHE_OFFLINE_REPLAY_FAILED'}
          } finally {Pop-Location}
          Write-Host 'D08_CACHE_OFFLINE_REPLAY=PASS'
          $cachePart=Join-Path $env:npm_config_cache '_cacache'
          if(-not (Test-Path -LiteralPath $cachePart -PathType Container)){throw 'D08_CACHE_CONTENT_MISSING'}
          $zip=Join-Path $env:RUNNER_TEMP 'd08-public-npm-cache-win64.zip'
          Compress-Archive -LiteralPath $cachePart -DestinationPath $zip -CompressionLevel Optimal
          $manifest=@{
            contents='PUBLIC_NPM_PACKAGES_ONLY'
            site_sha=$env:SITE_SHA
            lock_sha256=(Get-FileHash -Algorithm SHA256 -LiteralPath 'package-lock.json').Hash.ToLowerInvariant()
            archive_sha256=(Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
            offline_replay='PASS'
            no_private_source_or_dist_in_archive=$true
          }
          ($manifest | ConvertTo-Json -Depth 3) | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'd08-public-npm-cache.manifest.json')
          Write-Host 'D08_PUBLIC_DEPENDENCIES_CACHE=PASS'
      - name: Upload public npm tarball cache only, never site source or dist
        uses: actions/upload-artifact@v4
        with:
          name: d08-public-npm-cache-win64
          path: |
            ${{ runner.temp }}/d08-public-npm-cache-win64.zip
            ${{ runner.temp }}/d08-public-npm-cache.manifest.json
          if-no-files-found: error
          retention-days: 4
          compression-level: 0
