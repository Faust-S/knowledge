name: d05-capacity-multi-workspace-qualify
on:
  push:
    branches:
      - test/2026-11-18-d05-source-qualification
    paths:
      - .github/workflows/d05-capacity-multi-workspace-qualify-20261123.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Read pinned private sources ephemerally
        env:
          DOMEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          test -n "${DOMEN:-}" || { echo "D05_MULTI_READ=FAIL"; exit 1; }
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DOMEN" | base64 | tr -d '\r\n')"
          GIT_TERMINAL_PROMPT=0 git -c "http.extraheader=$header" clone --quiet --depth 1 --single-branch --branch work/2026-10-23-t2-site-only https://github.com/Faust-S/cehovod.ru.git site >/dev/null 2>&1 || { echo "D05_MULTI_READ=FAIL"; exit 1; }
          test "$(git -C site rev-parse HEAD)" = "ee798b737430a78bc5243828432e0132c6797df2" || { echo "D05_MULTI_SITE_PIN=FAIL"; exit 1; }
          unset header DOMEN
          echo "D05_MULTI_SITE_PIN=PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Format temporary copy and export non-source patch
        run: |
          set -euo pipefail
          cd site
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d05-multi-install.log" 2>&1 || { echo "D05_MULTI_INSTALL=FAIL"; exit 1; }
          echo "D05_MULTI_INSTALL=PASS"
          ./node_modules/.bin/prettier --write src/lib/capacity-decision.ts src/lib/capacity-decision.test.ts src/host/CehovodCapacityPanel.tsx src/host/CehovodCapacityPanel.regression.test.ts > "$RUNNER_TEMP/d05-multi-prettier.log" 2>&1 || { echo "D05_MULTI_FORMAT=FAIL"; exit 1; }
          python3 - <<'PY'
          import base64, difflib, hashlib, json, pathlib, subprocess
          names = [
              "src/lib/capacity-decision.ts",
              "src/lib/capacity-decision.test.ts",
              "src/host/CehovodCapacityPanel.tsx",
              "src/host/CehovodCapacityPanel.regression.test.ts",
          ]
          punctuation = set('.,;:!?()[]{}\'"=<>+*/|&-')
          def partition(source):
              chars, gaps = [], ['']
              for char in source:
                  if char.isspace(): gaps[-1] += char
                  else:
                      chars.append(char)
                      gaps.append('')
              return chars, gaps
          for name in names:
              original = subprocess.check_output(["git", "show", "HEAD:" + name]).decode()
              formatted = pathlib.Path(name).read_text()
              a, ag = partition(original)
              b, bg = partition(formatted)
              edits = []
              for tag, i1, i2, j1, j2 in difflib.SequenceMatcher(None, a, b, autojunk=True).get_opcodes():
                  if tag == "equal": continue
                  removed, inserted = ''.join(a[i1:i2]), ''.join(b[j1:j2])
                  if len(removed) > 24 or len(inserted) > 24 or not set(removed+inserted) <= punctuation:
                      print("D05_MULTI_NONPUNCTUATION_CHANGE=" + name)
                      raise SystemExit(2)
                  edits.append([i1, removed, inserted])
              aa, aa_gaps = list(a), list(ag)
              for pos, remove, insert in reversed(edits):
                  if ''.join(aa[pos:pos+len(remove)]) != remove: raise SystemExit(3)
                  aa[pos:pos+len(remove)] = list(insert)
                  aa_gaps[pos+1:pos+len(remove)+1] = [""]*len(insert)
              if aa != b: raise SystemExit(4)
              gaps = [[i,v] for i,v in enumerate(bg) if aa_gaps[i] != v]
              if bg[0] + ''.join(x + bg[i+1] for i,x in enumerate(aa)) != formatted: raise SystemExit(5)
              patch = {
                  "path": name,
                  "base": hashlib.sha256(original.encode()).hexdigest(),
                  "formatted": hashlib.sha256(formatted.encode()).hexdigest(),
                  "punct": edits,
                  "gaps": gaps,
              }
              print("D05_MULTI_SAFE_PATCH=" + base64.b64encode(json.dumps(patch,ensure_ascii=True,separators=(',',':')).encode()).decode())
              print("D05_MULTI_DELTA=" + name + ":" + str(len(edits)) + ":" + str(len(gaps)))
          print("D05_MULTI_PRIVATE_CODE_DISCLOSED=NO")
          PY
      - name: Execute subject tests, type check and lint
        run: |
          set -euo pipefail
          cd site
          if ./node_modules/.bin/vitest run src/lib/capacity-decision.test.ts src/lib/shop-capacity.test.ts src/host/CehovodCapacityPanel.regression.test.ts src/host/dispatch-capacity.test.ts --reporter=json --outputFile="$RUNNER_TEMP/d05-multi-tests.json" > "$RUNNER_TEMP/d05-multi-tests.log" 2>&1; then
            echo "D05_MULTI_VITEST=PASS"
          else
            echo "D05_MULTI_VITEST=FAIL"
            if test -f "$RUNNER_TEMP/d05-multi-tests.json"; then
              node - <<'NODE'
          const fs=require("node:fs"), path=require("node:path");
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/d05-multi-tests.json","utf8"));
          for(const f of x.testResults||[]){
            const nums=(f.assertionResults||[]).flatMap((t,i)=>t.status==="failed"?[i+1]:[]);
            if(nums.length)console.log("D05_MULTI_FAILED_ORDINALS="+path.basename(f.name||"unknown")+":"+nums.join(","));
          }
          NODE
            fi
            exit 1
          fi
          if npm run typecheck > "$RUNNER_TEMP/d05-multi-typecheck.log" 2>&1; then
            echo "D05_MULTI_TYPECHECK=PASS"
          else
            echo "D05_MULTI_TYPECHECK=FAIL"
            python3 - <<'PY'
          import os,pathlib,re
          s=pathlib.Path(os.environ["RUNNER_TEMP"]+"/d05-multi-typecheck.log").read_text(errors="replace")
          matches=re.findall(r"(src/[A-Za-z0-9_./-]+)\((\d+),(\d+)\): error (TS\d+)",s)
          print("D05_MULTI_TYPE_CODES="+",".join(f"{a}:{b}:{c}:{d}" for a,b,c,d in matches[:20]))
          PY
            exit 1
          fi
          if ./node_modules/.bin/eslint src/lib/capacity-decision.ts src/lib/capacity-decision.test.ts src/host/CehovodCapacityPanel.tsx src/host/CehovodCapacityPanel.regression.test.ts > "$RUNNER_TEMP/d05-multi-eslint.log" 2>&1; then
            echo "D05_MULTI_ESLINT=PASS"
          else
            echo "D05_MULTI_ESLINT=FAIL"
            exit 1
          fi
