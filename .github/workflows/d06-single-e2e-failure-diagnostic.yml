name: d06-single-e2e-failure-diagnostic

# Public control plane. Private checkout and JSON report stay on ephemeral Windows runner.
on:
  push:
    branches:
      - test/2026-11-18-d06-qualification
    paths:
      - .github/workflows/d06-single-e2e-failure-diagnostic.yml
permissions:
  contents: read
jobs:
  e2e-diagnosis:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact private D06 candidate
        uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod.ru
          ref: 7bb7095d9e4cdb56237d241ca1093523a2d5decf
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and build unchanged private static candidate
        shell: pwsh
        working-directory: private/site
        run: |
          foreach ($task in @("ci", "run format:lint:apply", "run setup:browser", "run build:static")) {
            $slug = $task.Replace(" ", "_").Replace(":", "_")
            $log = Join-Path $env:RUNNER_TEMP ("d06-isolate-" + $slug + ".private.log")
            & cmd.exe /d /c ("npm " + $task + " > """ + $log + """ 2>&1")
            if ($LASTEXITCODE -ne 0) {
              Write-Host ("D06_E2E_PREP_" + $slug + "=FAIL")
              exit 1
            }
            Write-Host ("D06_E2E_PREP_" + $slug + "=PASS")
          }
      - name: Run original E2E suite with local-only machine-readable report
        shell: pwsh
        working-directory: private/site
        timeout-minutes: 28
        run: |
          $ErrorActionPreference = "Stop"
          $env:PLAYWRIGHT_JSON_OUTPUT_FILE = Join-Path $env:RUNNER_TEMP "d06-e2e-structured.private.json"
          $log = Join-Path $env:RUNNER_TEMP "d06-e2e-structured.private.log"
          & cmd.exe /d /c ("npm run test:e2e -- --reporter=json > """ + $log + """ 2>&1")
          $exitCode = $LASTEXITCODE
          Write-Host ("D06_E2E_FULL=" + $(if ($exitCode -eq 0) { "PASS" } else { "FAIL" }))
          $reportPath = $env:PLAYWRIGHT_JSON_OUTPUT_FILE
          if (-not (Test-Path -LiteralPath $reportPath)) {
            Write-Host "D06_E2E_JSON=UNAVAILABLE"
            exit 1
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          Write-Host ("D06_E2E_JSON_PARSED=YES")
          Write-Host ("D06_E2E_UNEXPECTED_TESTS=" + [int]$report.stats.unexpected)
          $known = @(git ls-files "tests/e2e/*.spec.ts" | Sort-Object)
          $failureIndices = [System.Collections.Generic.HashSet[int]]::new()
          $failingTestCount = 0
          $failureLines = [System.Collections.Generic.List[int]]::new()
          $failureKinds = [System.Collections.Generic.HashSet[string]]::new()
          function Scan-Suite($suite, $inheritedFile) {
            if ($null -eq $suite) { return }
            $suiteFile = if ($suite.file) { [string]$suite.file } elseif ([string]$suite.title -match '\.spec\.ts') { [string]$suite.title } else { [string]$inheritedFile }
            foreach ($spec in @($suite.specs)) {
              if ($null -eq $spec) { continue }
              foreach ($case in @($spec.tests)) {
                if ($null -eq $case) { continue }
                $bad = $case.status -eq "unexpected" -or @($case.results | Where-Object { $_.status -in @("failed", "timedOut", "interrupted") }).Count -gt 0
                if (-not $bad) { continue }
                $script:failingTestCount++
                # Extract only the failed assertion's test line from its stack.
                # Do not publish the stack, paths, assertions, or private data.
                $privateStacks = @($case.results | ForEach-Object { $_.errors } | Where-Object { $_ } | ForEach-Object { $_.stack }) -join "`n"
                $at = [regex]::Match($privateStacks, 'tests[/\\]e2e[/\\][^:/\\]+\.spec\.ts:(\d+):\d+')
                $line = if ($at.Success) { [int]$at.Groups[1].Value } elseif ($spec.line) { [int]$spec.line } else { 0 }
                $script:failureLines.Add($line)
                $messages = @($case.results | ForEach-Object { $_.errors } | Where-Object { $_ } | ForEach-Object { $_.message }) -join "`n"
                $kind = if ($messages -match 'toBeVisible') { 'VISIBLE' } elseif ($messages -match 'toBeChecked') { 'CHECKED' } elseif ($messages -match 'waitForURL') { 'NAVIGATION' } elseif ($messages -match 'locator\.click|\.click\(') { 'CLICK' } elseif ($messages -match 'TimeoutError') { 'TIMEOUT' } elseif ($messages -match 'AssertionError|expect\(') { 'ASSERTION' } else { 'OTHER' }
                [void]$script:failureKinds.Add($kind)
                $fileName = if ($spec.file) { [string]$spec.file } elseif ($spec.location.file) { [string]$spec.location.file } else { $suiteFile }
                $fileName = $fileName.Replace([char]92, [char]47)
                $index = [array]::IndexOf($known, $fileName)
                if ($index -lt 0 -and $fileName.Contains("tests/e2e/")) {
                  $fileName = "tests/e2e/" + ($fileName -split "tests/e2e/")[-1]
                  $index = [array]::IndexOf($known, $fileName)
                }
                if ($index -lt 0 -and $fileName) {
                  $leaf = ($fileName -split "/")[-1]
                  for ($i = 0; $i -lt $known.Count; $i++) {
                    if (($known[$i] -split "/")[-1] -eq $leaf) { $index = $i; break }
                  }
                }
                if ($index -ge 0) { [void]$script:failureIndices.Add($index + 1) }
              }
            }
            foreach ($child in @($suite.suites)) {
              if ($null -ne $child) { Scan-Suite $child $suiteFile }
            }
          }
          foreach ($top in @($report.suites)) { if ($null -ne $top) { Scan-Suite $top "" } }
          Write-Host ("D06_E2E_FAILURE_TEST_LINE_NUMBERS=" + (($failureLines | Sort-Object -Unique) -join ","))
          Write-Host ("D06_E2E_FAILURE_ASSERTION_KINDS=" + ((@($failureKinds) | Sort-Object) -join ","))
          Write-Host "D06_E2E_JSON=PASS"
          Write-Host ("D06_E2E_FAILING_TESTS=" + $failingTestCount)
          Write-Host ("D06_E2E_FAILING_SPEC_ORDINALS=" + ((@($failureIndices) | Sort-Object) -join ","))
          Write-Host ("D06_E2E_EXPECTED_TESTS=" + [int]$report.stats.expected)
          Write-Host ("D06_E2E_UNEXPECTED_TESTS=" + [int]$report.stats.unexpected)
          Write-Host ("D06_E2E_FLAKY_TESTS=" + [int]$report.stats.flaky)
          if ($exitCode -ne 0) { exit 1 }
      - name: Confirm private data boundary
        if: always()
        shell: pwsh
        run: |
          Write-Host "D06_E2E_PRIVATE_LOGS=RUNNER_ONLY"
          Write-Host "D06_E2E_PRIVATE_SOURCES=RUNNER_ONLY"
          Write-Host "D06_E2E_PRIVATE_ARTIFACT_UPLOADS=0"
