name: Activity base native desktop checks
on:
  push:
    branches:
      - work/2026-11-10-activity-base-anonymizer
    paths:
      - modules/activity-base-anonymizer/**
      - desktop/**
      - tests/test_activity_base_a1.mjs
      - tests/test_activity_ocel2_evidence.mjs
      - tests/test_activity_t3_selected_host.mjs
      - tests/test_activity_t3_review_controller.mjs
      - tests/test_activity_t3_control_host_link.mjs
      - tests/test_activity_t3_original_reader.mjs
      - tests/test_activity_t3_owner_local_stage.mjs
      - tests/test_activity_t3_real_t2_host.browser.mjs
      - tests/test_activity_host_surface.mjs
      - tests/test_activity_desktop_contract.py
      - .github/workflows/activity-base-desktop.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Windows UI witness syntax before Rust build
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path desktop/tests/installed-windows-ui.ps1).Path,
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -gt 0) {
            foreach ($issue in $errors) { Write-Host $issue.Message }
            throw 'WINDOWS_UI_WITNESS_SYNTAX_INVALID'
          }
      - run: node --test tests/test_activity_base_a1.mjs tests/test_activity_base_a2.mjs tests/test_activity_graph_layout.mjs tests/test_activity_ocel2_evidence.mjs tests/test_activity_t3_selected_host.mjs tests/test_activity_t3_review_controller.mjs tests/test_activity_t3_control_host_link.mjs tests/test_activity_host_surface.mjs
      - run: python -m unittest discover -s tests -p 'test_activity_desktop_contract.py' -v
      - run: python -m unittest discover -s tests -p 'test_activity_base_a0.py' -v
      - name: Typecheck and bundle Activity UI before any native Rust build
        if: matrix.os == 'ubuntu-latest'
        working-directory: desktop
        run: |
          npm install --no-fund --no-audit
          npm run build
          npm run build:host-surface
          test -s dist-host-surface/iwxa-activity-host-surface.js
          test -s dist-host-surface/iwxa-activity-host-surface.css
          test -s dist-host-surface/brand.svg
  t3-original-d2-owner-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    needs: source-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read exact original public T3 core (no private checkout)
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Faust-S/knowledge.git ../t3-public-core
          git -C ../t3-public-core checkout --detach ed0252749c1693bd5d86aef6bb5ad0abdb118b64
          test "$(git -C ../t3-public-core rev-parse HEAD)" = "ed0252749c1693bd5d86aef6bb5ad0abdb118b64"
          test "$(git -C ../t3-public-core rev-parse HEAD^{tree})" = "6ffb6293a2ea1fe7c856242cff0c4e2ac9eaa56e"
      - name: Exercise ORIGINAL T3 Workspace D1/D2 reader with synthetic Host owner
        env:
          IWXA_T3_PUBLIC_CORE_DIR: ../t3-public-core/packages/t3-core
        run: node --test tests/test_activity_t3_original_reader.mjs tests/test_activity_t3_owner_local_stage.mjs
  t2-original-review-passport-runtime:
    # Real original Kernel/Store and cold browser restart, NOT a fake adapter.
    runs-on: ubuntu-latest
    timeout-minutes: 22
    needs: t3-original-d2-owner-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse exact original public T3 and original qualified T2 artifact
        shell: bash
        run: |
          set -eu
          git clone --filter=blob:none --no-checkout https://github.com/Faust-S/knowledge.git ../t3-public-core
          git -C ../t3-public-core checkout --detach ed0252749c1693bd5d86aef6bb5ad0abdb118b64
          test "$(git -C ../t3-public-core rev-parse HEAD^{tree})" = "6ffb6293a2ea1fe7c856242cff0c4e2ac9eaa56e"
          archive=../t3-public-core/packages/t3-core/qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip
          echo "7075b8b9590ef1283e34ecb3c21dd9d1b7342697287e1aa150cd4f4a60860b68  $archive" | sha256sum -c -
          mkdir -p "$IWXA_T2_QUALIFIED_KERNEL_DIST"
          unzip -q "$archive" -d "$IWXA_T2_QUALIFIED_KERNEL_DIST"
        env:
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
      - name: Reuse original Host browser test dependencies
        run: npm ci --prefix ../t3-public-core/packages/t3-core --ignore-scripts --no-audit --no-fund
      - name: Install existing original T2 Host browser test runtime
        working-directory: ../t3-public-core/packages/t3-core
        run: npx --no-install playwright install chromium
      - name: Register Activity reviewer in original T2 Host and cold-reopen Kernel
        env:
          IWXA_T3_PUBLIC_CORE_DIR: ../t3-public-core/packages/t3-core
          IWXA_T2_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/iwxa-t3-kernel
        run: node tests/test_activity_t3_real_t2_host.browser.mjs
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 50
    needs: [source-tests, t3-original-d2-owner-contract]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned frontend dependencies
        working-directory: desktop
        run: npm install --no-fund --no-audit
      - name: Build UI and Rust Tauri executable without browser
        working-directory: desktop
        run: npm run desktop:build
      - name: Fetch only public, pinned IWXA Setup Core
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Faust-S/Center.git setup-core-source
          if ($LASTEXITCODE -ne 0) { throw 'PUBLIC_SETUP_SOURCE_UNAVAILABLE' }
          git -C setup-core-source checkout 24d6a0d898e18fef29012735e0ff59da0d3ee182
          if ($LASTEXITCODE -ne 0) { throw 'SETUP_CORE_PIN_UNAVAILABLE' }
      - name: Package and qualify single-exe Setup Core installer
        shell: powershell
        run: desktop/installer/build-setup-core.ps1 -SetupCoreRoot setup-core-source -Output artifacts/IWXA-Activity-0.1.0-dev.1-Setup.exe -InstallForQualification
      - name: Installed native window and synthetic first-use witness (no browser)
        shell: powershell
        run: desktop/tests/installed-windows-ui.ps1 -Executable "$env:LOCALAPPDATA\Programs\IWXA Activity\iwxa-activity-base-desktop.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: iwxa-activity-desktop-setup-windows
          path: |
            artifacts/IWXA-Activity-0.1.0-dev.1-Setup.exe
            artifacts/IWXA-Activity-0.1.0-dev.1-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7