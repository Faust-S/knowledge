name: Public knowledge pilot
on:
  push:
    branches: ['work/**']
    paths: ['bootstrap/**','quality/**','scope/**','.github/workflows/check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-windows:
    if: github.repository == 'Faust-S/knowledge'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Restore pinned public source
        run: python bootstrap/restore_public_source.py --target restored
      - name: Standard library integration tests and offline installation pilot
        working-directory: restored
        run: python tools/run_pilot.py --out build
      - name: L1 evidence and mutation tests
        run: python -m unittest discover -s quality -p 'test_*.py' -v
      - name: Scope-limited first-level certificate
        run: python quality/quality_gate.py --report restored/build/report.json --reviews restored/review/completed.json --scope scope/l1-pilot.json --snapshot restored/build/snapshot.json --out restored/build/l1-certificate.json
      - name: Save reproducible evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knowledge-pilot-${{ matrix.os }}
          path: restored/build/
          retention-days: 7
