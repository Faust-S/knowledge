name: Activity original ARX and OpenDP
on:
  push:
    branches: [work/2026-11-24-activity-0-4-domain-routes]
    paths:
      - tools/ActivityArxCohort.java
      - tools/activity-observation-review.py
      - tests/test_activity_observation_worker.py
      - .github/workflows/activity-observation-upstream.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-boundaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_activity_observation_worker.py -v
  arx-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch exact original ARX 3.9.2 library with upstream digest
        shell: bash
        run: |
          set -eu
          jar="$RUNNER_TEMP/libarx-3.9.2.jar"
          curl --fail --location --retry 2 --output "$jar" https://github.com/arx-deidentifier/arx/releases/download/v3.9.2/libarx-3.9.2.jar
          echo "18040108e95ca7955d806bf32354b20601d664495653b8ee169d249f43f58d44  $jar" | sha256sum -c -
          echo "IWXA_ACTIVITY_ARX_JAR=$jar" >> "$GITHUB_ENV"
      - name: Execute actual ARX generalization and protected-column case
        env:
          IWXA_ACTIVITY_REAL_ARX: '1'
        run: python -m unittest discover -s tests -p test_activity_observation_worker.py -v
  opendp-upstream:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original pinned OpenDP wheel
        run: python -m pip install --only-binary=:all: opendp==0.16.0
      - name: Execute actual OpenDP measurement and privacy map
        env:
          IWXA_ACTIVITY_REAL_OPENDP: '1'
        run: python -m unittest discover -s tests -p test_activity_observation_worker.py -v
