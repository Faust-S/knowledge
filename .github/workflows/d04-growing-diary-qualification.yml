name: D04 growing diary 520 original Results (private source)
on:
  push:
    branches:
      - work/2026-11-25-d04-diary-picker-qualification
    paths:
      - .github/workflows/d04-growing-diary-qualification.yml
      - scripts/d04-private-source-preflight.sh
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d04-growing-diary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  growing:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify authorized source access, without revealing credentials
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          bash scripts/d04-private-source-preflight.sh D04_GROWING_PRIVATE_ACCESS Faust-S/bazmed.ru Faust-S/T2
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/bazmed.ru
          ref: 745158965cab3556bddb5c3d9f9cb7162e0f7d27
          token: ${{ secrets.DOMEN }}
          path: d04-private/site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: 9c64951cd78411283e8a416641c36d71e169fc1d
          token: ${{ secrets.DOMEN }}
          path: d04-private/t2
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact private code identity
        run: |
          set -euo pipefail
          test "$(git -C d04-private/site rev-parse HEAD)" = 745158965cab3556bddb5c3d9f9cb7162e0f7d27
          test "$(git -C d04-private/site rev-parse HEAD^{tree})" = 0cf3ca2da38245f4b69e89554e085ce28ae0c0df
          test "$(git -C d04-private/t2 rev-parse HEAD)" = 9c64951cd78411283e8a416641c36d71e169fc1d
          echo "D04_GROWING_PINNED_SOURCES=PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install private site dependencies in ephemeral runner
        working-directory: d04-private/site
        run: |
          set -euo pipefail
          if npm ci --no-audit --no-fund >"$RUNNER_TEMP/d04-growing-npm.log" 2>&1; then
            echo "D04_GROWING_NPM_CI=PASS"
          else
            echo "D04_GROWING_NPM_CI=FAIL"
            exit 1
          fi
      - name: Test dashboard, navigation, scope and T2 original Host
        working-directory: d04-private/site
        run: |
          set -euo pipefail
          if node --test \
               tests/life-os-home-dashboard.test.mjs \
               tests/life-os-pending-intent.test.mjs \
               tests/d04-navigation-workspace-ux.test.mjs \
               tests/bazmed-site-owned.test.mjs \
               tests/bazmed-site-controls.test.mjs \
               tests/life-os-workspace-integration.test.mjs \
               tests/life-os-entry-overview.test.mjs \
               tests/life-os-entry-links.test.mjs \
               tests/life-os-entry-usability.test.mjs \
               tests/life-os-overview-focus.test.mjs \
               >"$RUNNER_TEMP/d04-growing-tests.log" 2>&1; then
            echo "D04_GROWING_TARGETED_TESTS=PASS"
            grep -E '^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/d04-growing-tests.log" |
              sed 's/^# /D04_GROWING_TARGETED_/' | tail -3 || true
          else
            echo "D04_GROWING_TARGETED_TESTS=FAIL"
            grep -E '^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/d04-growing-tests.log" |
              sed 's/^# /D04_GROWING_TARGETED_/' | tail -3 || true
            grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/d04-growing-tests.log" |
              sed -E 's/^not ok ([0-9]+) - (.{0,110}).*/D04_GROWING_FAILED_TEST_\1=\2/' | head -8 || true
            exit 1
          fi
      - name: Verify original T2 entry contracts
        working-directory: d04-private/site
        run: |
          if npm run check:t2:entry >"$RUNNER_TEMP/d04-growing-entry.log" 2>&1; then
            echo "D04_GROWING_T2_ENTRY=PASS"
          else
            echo "D04_GROWING_T2_ENTRY=FAIL"
            grep -E '^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/d04-growing-entry.log" |
              sed 's/^# /D04_GROWING_ENTRY_/' | tail -3 || true
            exit 1
          fi
      - name: Type-check site and native dashboard
        working-directory: d04-private/site
        run: |
          if npx tsc --noEmit --pretty false >"$RUNNER_TEMP/d04-growing-types.log" 2>&1; then
            echo "D04_GROWING_TYPESCRIPT=PASS"
          else
            echo "D04_GROWING_TYPESCRIPT=FAIL"
            grep -Eo 'error TS[0-9]+' "$RUNNER_TEMP/d04-growing-types.log" | sort -u | head -10 || true
            exit 1
          fi
      - name: Prepare isolated independent T2 auditor challenge
        run: |
          set -euo pipefail
          umask 077
          openssl rand -hex 32 > "$RUNNER_TEMP/d04-growing-challenge"
          echo "D04_GROWING_WITNESS_CHALLENGE=SET"
      - name: Build the original integrated T2 site (no uploads)
        working-directory: d04-private/site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/d04-private/t2
        run: |
          set -euo pipefail
          export IWXA_T2_PRODUCT_CHALLENGE="$(cat "$RUNNER_TEMP/d04-growing-challenge")"
          if npm run build:t2:site >"$RUNNER_TEMP/d04-growing-build.log" 2>&1; then
            echo "D04_GROWING_INTEGRATED_BUILD=PASS"
          else
            echo "D04_GROWING_INTEGRATED_BUILD=FAIL"
            grep -Eo 'BAZMED_[A-Z0-9_]+|D04_[A-Z0-9_]+|error TS[0-9]+' "$RUNNER_TEMP/d04-growing-build.log" |
              sort -u | head -18 || true
            exit 1
          fi
          test -s dist/index.html
          test -s dist/workspace/index.html
          test -s dist/workspace/exchange/index.html
          test -s dist/_iwxa/current.json
          grep -RqF 'life-os-demo-dashboard' dist/assets ||
            { echo "D04_GROWING_PUBLIC_BUNDLE=MISSING"; exit 1; }
          grep -RqF 'life-os-personal-dashboard' dist/workspace/assets ||
            { echo "D04_GROWING_PERSONAL_HOST_BUNDLE=MISSING"; exit 1; }
          echo "D04_GROWING_BOTH_DASHBOARDS_IN_DIST=PASS"
      - name: Install browser in runner for viewport and interactive entry check
        run: |
          set -euo pipefail
          canonical="d04-private/t2/t2/current/final-successor/canonical-source"
          if (cd "$canonical" && npm ci --no-audit --no-fund --include=dev && npx playwright install chromium) >"$RUNNER_TEMP/d04-growing-browser-install.log" 2>&1; then
            echo "D04_GROWING_BROWSER_INSTALL=PASS"
          else
            echo "D04_GROWING_BROWSER_INSTALL=FAIL"
            exit 1
          fi
      - name: Qualify 520 actual observations in original T2
        working-directory: d04-private/site
        run: |
          set -uo pipefail
          set +e
          export IWXA_T2_PRODUCT_CHALLENGE="$(cat "$RUNNER_TEMP/d04-growing-challenge")"
          node --check qualification/life-os-growing-diary.browser.mjs
          node --input-type=module >"$RUNNER_TEMP/d04-growing-browser.log" 2>&1 <<'NODE'
          import {createRequire} from 'node:module';
          import {resolve,join} from 'node:path';
          import {pathToFileURL} from 'node:url';
          const site=process.cwd();
          const canonical=resolve(process.env.GITHUB_WORKSPACE,'d04-private/t2/t2/current/final-successor/canonical-source');
          const {chromium}=createRequire(join(canonical,'package.json'))('playwright');
          const {serveRealKernelHost}=await import(pathToFileURL(join(canonical,'scripts/real-kernel-e2e.mjs')).href);
          const {runGrowingDiaryBrowser}=await import(pathToFileURL(join(site,'qualification/life-os-growing-diary.browser.mjs')).href);
          const server=await serveRealKernelHost(join(site,'dist'),{independentWitness:true,previewOrigin:true});
          try{
            const result=await runGrowingDiaryBrowser({chromium,origin:server.origin});
            if(result.status!=='PASS'||result.objects!==520||result.events!==520||!result.cold||!result.historyPaging||!result.search||!result.monthReview||result.reviewedDays!==13||result.reviewedObservations!==520)
              throw Error('D04_GROWING_DIARY_INCOMPLETE');
            console.log('D04_GROWING_DIARY_520_OBJECTS_EVENTS=PASS');
            console.log('D04_GROWING_DIARY_COLD_HISTORY_SEARCH=PASS');
            console.log('D04_GROWING_DIARY_MONTH_520=PASS');
            console.log('D04_GROWING_DIARY_MONTH_OPEN_MS='+Math.round(result.monthOpenMs));
          }finally{await new Promise(done=>server.server.close(done));}
          NODE
          code=$?
          set -e
          grep -E '^D04_GROWING_DIARY_.*=PASS$' "$RUNNER_TEMP/d04-growing-browser.log" || true
          if [ "$code" -ne 0 ]; then
            echo "D04_GROWING_DIARY_REAL_BROWSER=FAIL"
            grep -Eo 'D04_GROWING_DIARY_[A-Za-z0-9_]+' "$RUNNER_TEMP/d04-growing-browser.log" | sort -u | head -12 || true
            exit "$code"
          fi
          # Do not upload private sources, logs, profiles or dist.
