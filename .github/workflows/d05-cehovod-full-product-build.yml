          export PUPPETEER_EXECUTABLE_PATH="$chrome"
          echo "D05_BROWSER_EXECUTABLE=AVAILABLE"
          if npm run build > "$RUNNER_TEMP/d05-product-diagnostic.log" 2>&1; then
            echo "D05_FULL_T2_PRODUCT_BUILD=PASS"
