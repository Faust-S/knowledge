name: d05-cehovod-full-product-build
on:
  push:
    branches:
      - test/2026-11-18-d05-source-qualification
    paths:
      - .github/workflows/d05-cehovod-full-product-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: D05 full browser-qualified product (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact private site and immutable T2 inputs
        env:
          DOMEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          test -n "${DOMEN:-}" || { echo "D05_DOMEN=UNAVAILABLE"; exit 1; }
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DOMEN" | base64 | tr -d '\r\n')"
          git init --quiet site
          if ! GIT_TERMINAL_PROMPT=0 git -C site -c "http.extraheader=$header" fetch --quiet --depth 1 --no-tags https://github.com/Faust-S/cehovod.ru.git a4e3af3e80ee2a4ac046644c4c1df4553cce9f5d >/dev/null 2>&1; then
            echo "D05_SITE_ACCESS=FAIL"
            exit 1
          fi
          git -C site checkout --quiet --detach FETCH_HEAD
          test "$(git -C site rev-parse HEAD)" = "a4e3af3e80ee2a4ac046644c4c1df4553cce9f5d" || { echo "D05_SITE_PIN=FAIL"; exit 1; }
          echo "D05_SITE_PIN=PASS"
          git init --quiet t2
          if ! GIT_TERMINAL_PROMPT=0 git -C t2 -c "http.extraheader=$header" fetch --quiet --depth 1 --no-tags https://github.com/Faust-S/T2.git e70de29b72b83e2546f7ab74b17572685a728c17 >/dev/null 2>&1; then
            echo "D05_T2_READ_PIN=FAIL"
            exit 1
          fi
          git -C t2 checkout --quiet --detach FETCH_HEAD
          test "$(git -C t2 rev-parse HEAD)" = "e70de29b72b83e2546f7ab74b17572685a728c17" || { echo "D05_T2_PIN=FAIL"; exit 1; }
          echo "D05_T2_PIN=PASS"
          unset header DOMEN
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install site dependencies
        run: |
          set -euo pipefail
          if (cd site && npm ci --no-audit --no-fund) > "$RUNNER_TEMP/d05-site-install.log" 2>&1; then
            echo "D05_SITE_NPM_CI=PASS"
          else
            echo "D05_SITE_NPM_CI=FAIL"
            exit 1
          fi
      - name: Verify the exact accepted T2 Kernel archive and stage
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/t2/t2/current/final-successor/kernel-successors/k036-same-store-event-history-20261019/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip"
          node - "$archive" <<'NODE'
          const fs=require("node:fs");
          const crypto=require("node:crypto");
          const archive=process.argv[2];
          const expected="7075b8b9590ef1283e34ecb3c21dd9d1b7342697287e1aa150cd4f4a60860b68";
          const actual=crypto.createHash("sha256").update(fs.readFileSync(archive)).digest("hex");
          if(actual!==expected) {console.log("D05_KERNEL_ARCHIVE_SHA=FAIL"); process.exit(1);}
          console.log("D05_KERNEL_ARCHIVE_SHA=PASS");
          NODE
          mkdir -p "$RUNNER_TEMP/qualified-kernel" "$RUNNER_TEMP/verified-kernel"
          unzip -qq "$archive" -d "$RUNNER_TEMP/qualified-kernel"
          test -f "$RUNNER_TEMP/qualified-kernel/_iwxa/runtime/0.3.6/runtime.js" || { echo "D05_KERNEL_LAYOUT=FAIL"; exit 1; }
          verifier="$GITHUB_WORKSPACE/t2/t2/current/final-successor/canonical-source/scripts/stage-verified-kernel.mjs"
          if node "$verifier" "$RUNNER_TEMP/qualified-kernel" "$RUNNER_TEMP/verified-kernel" --qualification-only --artifact-id iwxa-kernel-k036-same-store-history-20261019-qualified.1 > "$RUNNER_TEMP/d05-kernel-verification.log" 2>&1; then
            echo "D05_KERNEL_QUALIFIED_STAGING=PASS"
          else
            echo "D05_KERNEL_QUALIFIED_STAGING=FAIL"
            exit 1
          fi
      - name: Verify formatted D05 sources as committed
        run: |
          set -euo pipefail
          cd site
          ./node_modules/.bin/prettier --check src/lib/shop-capacity.ts src/lib/shop-capacity.test.ts src/host/CehovodCapacityPanel.tsx src/lib/capacity-finance.ts src/lib/capacity-finance.test.ts src/lib/capacity-cash.ts src/lib/capacity-cash.test.ts src/lib/capacity-management.ts src/lib/capacity-management.test.ts src/host/CehovodManagementComparison.tsx src/host/CehovodCommonCashEditor.tsx src/host/CehovodCashDelayPanel.tsx src/host/CehovodCashPanel.tsx src/host/dispatch-capacity.ts src/host/dispatch-capacity.test.ts scripts/d05-first-use-real-kernel-witness.mjs scripts/d05-management-ui-witness.ts scripts/fixtures/d05-management-ui-harness.tsx > /dev/null
          echo "D05_FORMATTED_SOURCE_CHECK=PASS"
      - name: Verify positive cash and decision GUI without publishing fixtures
        run: |
          set -euo pipefail
          cd site
          if node --import tsx scripts/d05-management-ui-witness.ts > "$RUNNER_TEMP/d05-management-ui.log" 2>&1; then
            grep -E '^D05_MANAGEMENT_UI_[A-Z_]+=PASS
        env:
          IWXA_T2_CANONICAL_ROOT: ${{ github.workspace }}/t2/t2/current/final-successor/canonical-source
          IWXA_CEHOVOD_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/qualified-kernel
          IWXA_CEHOVOD_HOST_ORIGIN: https://127.0.0.1:8443
        run: |
          set -euo pipefail
          cd site
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "D05_BROWSER_EXECUTABLE=UNAVAILABLE"
            exit 1
          fi
          export PUPPETEER_EXECUTABLE_PATH="$chrome"
          echo "D05_BROWSER_EXECUTABLE=AVAILABLE"
          if npm run build > "$RUNNER_TEMP/d05-product-diagnostic.log" 2>&1; then
            echo "D05_FULL_T2_PRODUCT_BUILD=PASS"
          else
            echo "D05_FULL_T2_PRODUCT_BUILD=FAIL"
            node -e '
            const fs=require("node:fs");
            const t=fs.readFileSync(process.env.RUNNER_TEMP+"/d05-product-diagnostic.log","utf8");
            const phases=["build:static:check","check:hydration","check:runtime","check:functional-ui","check:workspace-responsive","check:navigation-a11y","verify:product:t2"];
            console.log("D05_REACHED_PHASES="+phases.filter(x=>t.includes(x)).join(","));
            const codes=[...new Set(t.match(/\\b(?:CEHOVOD_[A-Z0-9_]+|T2_[A-Z0-9_]+|ERR_[A-Z0-9_]+)\\b/g)||[])];
            console.log("D05_FAILURE_CODES="+codes.slice(-16).join(","));
            const browserCases=[...new Set(t.match(/CASE003_[A-Z0-9_]+/g)||[])];
            console.log("D05_CASE003_ERROR_CODES="+browserCases.slice(-12).join(","));
            const terminalMessages=t.split(/\r?\n/).filter(x=>/check-functional-ui: FAIL/.test(x));
            console.log("D05_FUNCTIONAL_GATE_FAILED="+(terminalMessages.length>0));
            const states=[...t.matchAll(/(?:check-hydration|check-runtime|check-functional-ui|check-workspace-responsive|check-navigation-a11y): (?:OK|FAIL)/g)].map(x=>x[0]);
            console.log("D05_BROWSER_GATE_STATES="+states.slice(-7).join(";"));
            console.log("D05_BROWSER_ERROR_COUNT="+(t.match(/(?:FAIL|Error:|Failed:)/g)||[]).length);
            const lines=t.split(/\r?\n/);
            const errors=lines.filter(x=>/(error TS\d+|prettier\/prettier|\bFAIL\b|\bError:|\bFailed:|\bproblems? \()/i.test(x));
            console.log("D05_DIAGNOSTIC_MATCHES="+errors.length);
            console.log("D05_TYPESCRIPT_CODES="+[...new Set((t.match(/TS\d{4,5}/g)||[]))].join(","));
            console.log("D05_PRETTIER_COUNT="+(t.match(/prettier\/prettier/g)||[]).length);
            console.log("D05_FAILURE_CLASSES="+errors.slice(0,14).map(x=>x.replace(/.*?(TS\d+:|prettier\/prettier|Error:|FAIL|Failed:)/i,"$1").slice(0,120)).join(" | "));

            const navCategories=[
              ["NAV_TRIGGER_MISSING",/trigger button not found/],
              ["NAV_DIALOG_TOO_FEW_FOCUSABLE",/too few focusable inside dialog/],
              ["NAV_FOCUS_ESCAPED_TAB",/focus escaped dialog after repeated Tab/],
              ["NAV_FOCUS_ESCAPED_SHIFT_TAB",/focus escaped dialog after Shift\+Tab from first/],
              ["NAV_FOCUS_NOT_RETURNED",/focus did not return to trigger after Escape/],
              ["NAV_MENU_NOT_CLOSED",/menu did not close after in-app navigation/],
              ["NAV_LINK_MISSING",/no link inside dialog/],
              ["NAV_TIMEOUT",/(?:TimeoutError|waiting for selector .* failed|waiting for function failed)/],
            ];
            console.log("D05_NAV_A11Y_FAILURE_CLASSES="+navCategories.filter(x=>x[1].test(t)).map(x=>x[0]).join(","));
            console.log("D05_NAV_A11Y_THROWN="+(/check-navigation-a11y: ERROR/.test(t)));

            '
            exit 1
          fi
          test -f dist/_iwxa/current.json || { echo "D05_KERNEL_IN_DIST=FAIL"; exit 1; }
          for file in keisy/index.html keisy/120-kronshteynov/index.html keisy/240-fartukov/index.html keisy/48-tumb/index.html workspace/index.html; do
            test -f "dist/$file" || { echo "D05_STATIC_ROUTE_IN_DIST=FAIL"; exit 1; }
          done
          echo "D05_STATIC_ROUTES_IN_DIST=PASS"
          echo "D05_DIST_PUBLISHED=NO"
          echo "D05_BROWSER_STATIC_GATES=RUN_BY_FULL_BUILD"
          echo "D05_USER_GUI_JOURNEY=NOT_RUN"
          echo "D05_KERNEL_RECEIPTS=DEFERRED_TO_NEXT_STAGE"

      - name: Run real T2 first-use provisioner and independent domain Result readback
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/t2/t2/current/final-successor/canonical-source"
          witness="$RUNNER_TEMP/d05-t2-witness-source"
          cp -a "$source" "$witness"
          cmp -s "$source/src/factory2/products/domain-completion/independent-browser-witness.mjs" "$witness/src/factory2/products/domain-completion/independent-browser-witness.mjs" || { echo "D05_T2_WITNESS_SOURCE=FAIL"; exit 1; }
          echo "D05_T2_WITNESS_SOURCE=PASS"
          if (cd "$witness" && npm ci --include=dev --no-audit --no-fund) > "$RUNNER_TEMP/d05-t2-witness-install.log" 2>&1; then
            echo "D05_T2_WITNESS_DEPENDENCIES=PASS"
          else
            echo "D05_T2_WITNESS_DEPENDENCIES=FAIL"
            exit 1
          fi
          if (cd "$witness" && npx --no-install playwright install chromium) > "$RUNNER_TEMP/d05-t2-witness-browser.log" 2>&1; then
            echo "D05_T2_PLAYWRIGHT_BROWSER=PASS"
          else
            echo "D05_T2_PLAYWRIGHT_BROWSER=FAIL"
            exit 1
          fi
          cd "$GITHUB_WORKSPACE/site"
          node --check scripts/d05-first-use-real-kernel-witness.mjs
          secondary="$RUNNER_TEMP/d05-independent-customer-active.iwxa"
          test ! -e "$secondary" || { echo "D05_SECONDARY_ARCHIVE_PREEXISTS=FAIL"; exit 1; }
          D05_T2_WITNESS_COPY="$witness" D05_FIRST_USE_CASE001=1 D05_FIRST_USE_EXPORT_INDEPENDENT_ACTIVE=1 D05_INDEPENDENT_ACTIVE_IWXA="$secondary" node scripts/d05-first-use-real-kernel-witness.mjs
          test -s "$secondary" || { echo "D05_INDEPENDENT_CUSTOMER_EXPORT=FAIL"; exit 1; }
          D05_T2_WITNESS_COPY="$witness" D05_FIRST_USE_CASE001=1 D05_FIRST_USE_MULTIPROJECT_CAPACITY=1 D05_FIRST_USE_IMPORT_INDEPENDENT_ACTIVE=1 D05_INDEPENDENT_ACTIVE_IWXA="$secondary" node scripts/d05-first-use-real-kernel-witness.mjs
          rm -f "$secondary"
          echo "D05_TWO_INDEPENDENT_CUSTOMER_T2_RESULT_JOURNEY=PASS"
          D05_T2_WITNESS_COPY="$witness" node scripts/d05-first-use-real-kernel-witness.mjs
          D05_T2_WITNESS_COPY="$witness" D05_FIRST_USE_CASE001=1 D05_FIRST_USE_CASE001_EXCHANGE=1 node scripts/d05-first-use-real-kernel-witness.mjs
          D05_T2_WITNESS_COPY="$witness" D05_FIRST_USE_CASE002=1 node scripts/d05-first-use-real-kernel-witness.mjs
          D05_T2_WITNESS_COPY="$witness" D05_FIRST_USE_CASE001=1 D05_FIRST_USE_MULTIPROJECT_CAPACITY=1 node scripts/d05-first-use-real-kernel-witness.mjs
          echo "D05_MULTIPROJECT_REAL_T2_BROWSER_WITNESS=PASS"
          echo "D05_CASE002_TWO_RESULT_WITNESS=PASS"
          echo "D05_CASE001_REQUEST_TWO_RESULTS=PASS"
          echo "D05_FULL_26_FAMILY_WITNESS=NOT_RUN"
          echo "D05_IWXA_EXCHANGE=PASS"

 "$RUNNER_TEMP/d05-management-ui.log"
            grep -qx 'D05_MANAGEMENT_UI_WITNESS=PASS' "$RUNNER_TEMP/d05-management-ui.log"
          else
            grep -E '^D05_MANAGEMENT_UI_(FAILURE_(PHASE|CLASS|CODE)|[A-Z_]+)=([A-Za-z_][A-Za-z0-9_-]{0,80})
        env:
          IWXA_T2_CANONICAL_ROOT: ${{ github.workspace }}/t2/t2/current/final-successor/canonical-source
          IWXA_CEHOVOD_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/qualified-kernel
          IWXA_CEHOVOD_HOST_ORIGIN: https://127.0.0.1:8443
        run: |
          set -euo pipefail
          cd site
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "D05_BROWSER_EXECUTABLE=UNAVAILABLE"
            exit 1
          fi
          export PUPPETEER_EXECUTABLE_PATH="$chrome"
          echo "D05_BROWSER_EXECUTABLE=AVAILABLE"
          if npm run build > "$RUNNER_TEMP/d05-product-diagnostic.log" 2>&1; then
            echo "D05_FULL_T2_PRODUCT_BUILD=PASS"
          else
            echo "D05_FULL_T2_PRODUCT_BUILD=FAIL"
            node -e '
            const fs=require("node:fs");
            const t=fs.readFileSync(process.env.RUNNER_TEMP+"/d05-product-diagnostic.log","utf8");
            const phases=["build:static:check","check:hydration","check:runtime","check:functional-ui","check:workspace-responsive","check:navigation-a11y","verify:product:t2"];
            console.log("D05_REACHED_PHASES="+phases.filter(x=>t.includes(x)).join(","));
            const codes=[...new Set(t.match(/\\b(?:CEHOVOD_[A-Z0-9_]+|T2_[A-Z0-9_]+|ERR_[A-Z0-9_]+)\\b/g)||[])];
            console.log("D05_FAILURE_CODES="+codes.slice(-16).join(","));
            const browserCases=[...new Set(t.match(/CASE003_[A-Z0-9_]+/g)||[])];
            console.log("D05_CASE003_ERROR_CODES="+browserCases.slice(-12).join(","));
            const terminalMessages=t.split(/\r?\n/).filter(x=>/check-functional-ui: FAIL/.test(x));
            console.log("D05_FUNCTIONAL_GATE_FAILED="+(terminalMessages.length>0));
            const states=[...t.matchAll(/(?:check-hydration|check-runtime|check-functional-ui|check-workspace-responsive|check-navigation-a11y): (?:OK|FAIL)/g)].map(x=>x[0]);
            console.log("D05_BROWSER_GATE_STATES="+states.slice(-7).join(";"));
            console.log("D05_BROWSER_ERROR_COUNT="+(t.match(/(?:FAIL|Error:|Failed:)/g)||[]).length);
            const lines=t.split(/\r?\n/);
            const errors=lines.filter(x=>/(error TS\d+|prettier\/prettier|\bFAIL\b|\bError:|\bFailed:|\bproblems? \()/i.test(x));
            console.log("D05_DIAGNOSTIC_MATCHES="+errors.length);
            console.log("D05_TYPESCRIPT_CODES="+[...new Set((t.match(/TS\d{4,5}/g)||[]))].join(","));
            console.log("D05_PRETTIER_COUNT="+(t.match(/prettier\/prettier/g)||[]).length);
            console.log("D05_FAILURE_CLASSES="+errors.slice(0,14).map(x=>x.replace(/.*?(TS\d+:|prettier\/prettier|Error:|FAIL|Failed:)/i,"$1").slice(0,120)).join(" | "));

            const navCategories=[
              ["NAV_TRIGGER_MISSING",/trigger button not found/],
              ["NAV_DIALOG_TOO_FEW_FOCUSABLE",/too few focusable inside dialog/],
              ["NAV_FOCUS_ESCAPED_TAB",/focus escaped dialog after repeated Tab/],
              ["NAV_FOCUS_ESCAPED_SHIFT_TAB",/focus escaped dialog after Shift\+Tab from first/],
              ["NAV_FOCUS_NOT_RETURNED",/focus did not return to trigger after Escape/],
              ["NAV_MENU_NOT_CLOSED",/menu did not close after in-app navigation/],
              ["NAV_LINK_MISSING",/no link inside dialog/],
              ["NAV_TIMEOUT",/(?:TimeoutError|waiting for selector .* failed|waiting for function failed)/],
            ];
            console.log("D05_NAV_A11Y_FAILURE_CLASSES="+navCategories.filter(x=>x[1].test(t)).map(x=>x[0]).join(","));
            console.log("D05_NAV_A11Y_THROWN="+(/check-navigation-a11y: ERROR/.test(t)));

            '
            exit 1
          fi
          test -f dist/_iwxa/current.json || { echo "D05_KERNEL_IN_DIST=FAIL"; exit 1; }
          for file in keisy/index.html keisy/120-kronshteynov/index.html keisy/240-fartukov/index.html keisy/48-tumb/index.html workspace/index.html; do
            test -f "dist/$file" || { echo "D05_STATIC_ROUTE_IN_DIST=FAIL"; exit 1; }
          done
          echo "D05_STATIC_ROUTES_IN_DIST=PASS"
          echo "D05_DIST_PUBLISHED=NO"
          echo "D05_BROWSER_STATIC_GATES=RUN_BY_FULL_BUILD"
          echo "D05_USER_GUI_JOURNEY=NOT_RUN"
          echo "D05_KERNEL_RECEIPTS=DEFERRED_TO_NEXT_STAGE"

      - name: Run real T2 first-use provisioner and independent domain Result readback
