          echo "D05_IWXA_EXCHANGE=PASS"

 "$RUNNER_TEMP/d05-management-ui.log" || true
            echo "D05_MANAGEMENT_UI_WITNESS=FAIL"
            exit 1
          fi
      - name: Assemble full static T2 product with native Chrome browser gates
        env:
          IWXA_T2_CANONICAL_ROOT: ${{ github.workspace }}/t2/t2/current/final-successor/canonical-source
