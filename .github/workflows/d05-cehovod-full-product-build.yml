          cmp -s "$source/src/factory2/products/domain-completion/independent-browser-witness.mjs" "$witness/src/factory2/products/domain-completion/independent-browser-witness.mjs" || { echo "D05_T2_WITNESS_SOURCE=FAIL"; exit 1; }
          echo "D05_T2_WITNESS_SOURCE=PASS"
          if (cd "$witness" && npm ci --include=dev --no-audit --no-fund) > "$RUNNER_TEMP/d05-t2-witness-install.log" 2>&1; then
