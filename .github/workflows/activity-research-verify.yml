name: IWXA Activity Research migrated sources verification

on:
  push:
    branches:
      - work/2026-11-03-unified-task-migration
    paths:
      - 'research/activity-research/**'
      - '.github/workflows/activity-research-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-open-research-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source blobs and research-only contract
        run: node --test research/activity-research/tests/*.test.mjs
      - name: Fetch exact PET v1.1 public corpus without redistributing source
        run: |
          curl --fail --location --retry 2 --max-time 90 --silent --show-error \
            'https://raw.githubusercontent.com/patriziobellan86/PETv1.1/4bcacf71b5b191840789bb307c1a7f288a274ded/PETv1.1-entities.jsonl' \
            -o "$RUNNER_TEMP/PETv1.1-entities.jsonl"
      - name: Real PET leave-one-family-out activity benchmark
        run: |
          node research/activity-research/pet_activity_benchmark.mjs \
            "$RUNNER_TEMP/PETv1.1-entities.jsonl" family metrics \
            > "$RUNNER_TEMP/pet-activity-metrics.json"
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/pet-activity-metrics.json')); if(r.status!=='EXPLORATORY_GROUPED_EVALUATION_NOT_TASK_DISCOVERY_QUALIFICATION'||!r.evaluation.train_and_test_family_disjoint||r.counts.documents<2||r.counts.gold_activity_spans<1||r.counts.gold_activity_tokens<1||!r.source?.sha256||!r.methods?.document_heldout_perceptron?.token)process.exit(1);console.log('PET_REAL_CORPUS_EXPLORATORY_PASS',r.counts.documents,'documents',r.counts.gold_activity_spans,'gold spans','spanF1',r.methods.document_heldout_perceptron.exact_span.f1,'tokenF1',r.methods.document_heldout_perceptron.token.f1)"
      - name: Publish derived research metrics only
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-pet-activity-exploratory-metrics
          path: ${{ runner.temp }}/pet-activity-metrics.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: ATUS diary conversion synthetic contract tests
        run: python -m unittest discover -s research/activity-research/tests -p 'test_atus_*.py' -v
      - name: BPI XES synthetic contract and pinned U1 integration tests
        run: python -m unittest discover -s research/activity-research/tests -p 'test_bpi13_xes_u1_replay.py' -v
      - name: Fetch Git-blob-pinned public BPI 2013 open-problems XES copy
        run: |
          curl --fail --location --retry 2 --max-time 90 --silent --show-error \
            'https://raw.githubusercontent.com/ziaridoy20/Smart-Process-Analytics-on-Business-Process-Intelligence-Challenge/8c3dddac389eae0a222d5506f0474bc1641121d6/BPI_Challenge_2013_open_problems.xes.gz' \
            -o "$RUNNER_TEMP/bpi13-open-problems.xes.gz"
      - name: Real registered corporate events through pinned U1
        run: |
          python research/activity-research/bpi13_xes_u1_replay.py \
            --xes-gz "$RUNNER_TEMP/bpi13-open-problems.xes.gz" \
            --max-traces 12 --out "$RUNNER_TEMP/bpi13-scoped-receipt.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'bpi13-scoped-receipt.json').read_text())
          assert r['schema']=='IWXA_BPI13_OPEN_PROBLEMS_U1_REPLAY/0.1'
          assert r['status']=='THIRD_PARTY_MIRROR_REAL_WORLD_EVENT_REPLAY_PROVENANCE_HOLD'
          assert r['sample']['traces']==12
          assert r['sample']['registered_events']>=24
          assert r['sample']['raw_case_ids_or_actor_ids_exported'] is False
          assert r['sample']['real_world_activity_truth']=='UNKNOWN'
          assert r['source']['original_4tu_file_sha_match']=='NOT_VERIFIED'
          assert r['u1']['task_type_ids_assigned']==0
          assert r['u1']['engine_accepted'] is False
          print('BPI13_REGISTERED_EVENTS_U1_ENGINEERING_PASS',r['source_population']['recorded_traces'],'cases',
                r['source_population']['registered_events'],'registered events',
                r['sample']['registered_events'],'sample events',
                'source_sha256='+r['source']['mirror_sha256'])
          PY
      - name: Upload derived BPI scoped receipt only
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-bpi13-registered-events-u1-scoped-receipt
          path: ${{ runner.temp }}/bpi13-scoped-receipt.json
          retention-days: 7
          if-no-files-found: error
      - name: BPI source-bound controlled mutation tests
        run: python -m unittest discover -s research/activity-research/tests -p 'test_bpi13_mutation_*.py' -v
      - name: Real BPI registered-event sample with synthetic semantic perturbations
        run: |
          python research/activity-research/bpi13_mutation_stress.py \
            --xes-gz "$RUNNER_TEMP/bpi13-open-problems.xes.gz" \
            --max-traces 12 \
            --out "$RUNNER_TEMP/bpi13-mutation-receipt.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'bpi13-mutation-receipt.json').read_text())
          assert r['schema']=='IWXA_BPI13_ACTIVITY_MUTATION_STRESS/0.1'
          assert r['status']=='REAL_LOG_WITH_SYNTHETIC_MUTATIONS_SCOPED_EXPERIMENT'
          assert r['summary']['cases']==7
          assert r['summary']['accepted_as_formally_valid_reported_logs']==6
          assert r['summary']['rejected_as_formally_invalid_logs']==1
          assert r['baseline']['registered_event_rows']==50
          assert r['summary']['independent_task_quality']=='NOT_MEASURED'
          assert r['summary']['without_baseline_real_world_integrity']=='NOT_DETERMINED'
          assert all(x['task_type_ids_assigned']==0 and x['engine_accepted'] is False
                     and x['real_world_activity_truth']=='UNKNOWN'
                     for x in r['scenarios'])
          print('BPI13_MUTATION_STRESS_SCOPED_PASS',
                r['summary']['cases'],'synthetic interventions',
                r['summary']['accepted_as_formally_valid_reported_logs'],'formally valid',
                r['summary']['rejected_as_formally_invalid_logs'],'rejected')
          PY
      - name: Upload derived mutation comparison receipt only
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-bpi13-controlled-mutation-u1-receipt
          path: ${{ runner.temp }}/bpi13-mutation-receipt.json
          retention-days: 7
          if-no-files-found: error
      - name: Real BPI process-owner published questions evidence audit tests
        run: python -m unittest discover -s research/activity-research/tests -p 'test_bpi13_owner_questions_*.py' -v
      - name: Published process-owner questions vs real registered BPI event evidence
        run: |
          python research/activity-research/bpi13_owner_questions_audit.py \
            --xes-gz "$RUNNER_TEMP/bpi13-open-problems.xes.gz" \
            --max-traces 12 --out "$RUNNER_TEMP/bpi13-owner-question-audit.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'bpi13-owner-question-audit.json').read_text())
          assert r['schema']=='IWXA_ACTIVITY_OWNER_QUESTIONS_EVIDENCE_AUDIT/0.1'
          assert r['question_count']==4
          assert r['reported_baseline']['reported_cases']==819
          assert r['reported_baseline']['reported_events']==2351
          assert r['accepted_task_count']==0 and r['accepted_task_type_count']==0
          assert not r['sources']['independent_real_world_event_confirmation']
          assert r['quality_of_task_discovery']=='NOT_MEASURED'
          assert r['u1_sample']['reported_events']==50
          assert all(x['required_but_not_verified'] and not x['can_conclude_misconduct_or_fault_exists']
                     for x in r['questions'])
          print('BPI13_PUBLISHED_OWNER_QUESTIONS_SCOPED_PASS',
                r['question_count'],'published questions',
                r['reported_baseline']['reported_cases'],'reported cases',
                r['reported_baseline']['activity_A_B_A_motifs_in_declared_timestamp_order'],
                'registered-label A-B-A motifs (NOT team ping-pong)')
          PY
      - name: Upload derived problem-evidence audit only
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-bpi13-owner-question-evidence-audit
          path: ${{ runner.temp }}/bpi13-owner-question-audit.json
          retention-days: 7
          if-no-files-found: error

      - name: Official BPI13 Incidents source-fit adapter tests
        run: python -m unittest discover -s research/activity-research/tests -p 'test_bpi13_incidents_*.py' -v
      - name: Attempt direct official 4TU Incidents source and audit registered fields
        run: |
          if curl --fail --location --retry 1 --max-time 80 --silent --show-error \
            'https://data.4tu.nl/file/0fc5c579-e544-4fab-9143-fab1f5192432/aa51ffbb-25fd-4b5a-b0b8-9aba659b7e8c' \
            -o "$RUNNER_TEMP/bpi13-incidents.xes.gz"; then
            if python research/activity-research/bpi13_incidents_applicability.py \
              --xes-gz "$RUNNER_TEMP/bpi13-incidents.xes.gz" \
              --sample-cases 12 --out bpi13-incidents-fit.json; then
              python - <<'PY'
          import json
          r=json.load(open('bpi13-incidents-fit.json'))
          assert r['schema']=='IWXA_BPI13_OFFICIAL_INCIDENTS_APPLICABILITY/0.1'
          assert r['population']['catalogue_counts_match']
          assert r['question_count']==4
          assert r['u1_sample']['native_owner_git_blob']=='eb15aec5ba1a749c29d7c40a868127e1a384b6bf'
          assert not r['u1_sample']['engine_accepted']
          assert r['qualification']['accepted_user_tasks']==0
          assert not r['source_independence']['different_exports_are_independent_real_world_observations']
          print('BPI13_OFFICIAL_INCIDENTS_SOURCE_SCOPE_PASS',
                r['population']['recorded_cases'],'cases',
                r['population']['registered_events'],'registered events',
                'group_changes',r['field_applicability']['consecutive_registered_group_changes'],
                'wait_user_labels',r['field_applicability']['wait_user_label_events'],
                'sha256',r['source']['file_sha256'])
          PY
            else
              echo "BPI13_OFFICIAL_INCIDENTS_SOURCE_CONTENT_HOLD"
              if [ ! -f bpi13-incidents-fit.json ]; then
                printf '{"source_access":"SOURCE_CONTENT_HOLD","accepted_tasks":0}\n' \
                  > bpi13-incidents-fit.json
              fi
            fi
          else
            printf '{"source_access":"SOURCE_ACCESS_HOLD","accepted_tasks":0}\n' \
              > bpi13-incidents-fit.json
            echo "BPI13_OFFICIAL_INCIDENTS_SOURCE_ACCESS_HOLD"
          fi
      - name: Upload aggregate official Incidents source-fit report only
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-bpi13-official-incidents-source-fit
          path: bpi13-incidents-fit.json
          retention-days: 7
          if-no-files-found: error
