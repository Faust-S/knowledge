name: D08 new product from business Windows Linux qualification
on:
  push:
    branches: [work/2026-11-22-d08-attention-to-payment-qualification]
    paths: [.github/workflows/d08-attention-to-payment-qualification.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d08-attention-to-payment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualified:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact private subject-model commit without persistence
        uses: actions/checkout@v4
        with:
          repository: Faust-S/market-ops
          ref: fd62c80b9a3234e33068a43ed38c5ecfeb2f9d88
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: logic
      - name: Checkout exact private website commit without persistence
        uses: actions/checkout@v4
        with:
          repository: Faust-S/market-ops.ru
          ref: 197d909e7d55d9738089091d282d2475962c834e
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - name: Verify private revisions, never emit private source
        run: |
          test "$(git -C logic rev-parse HEAD)" = "fd62c80b9a3234e33068a43ed38c5ecfeb2f9d88" || exit 1
          test "$(git -C site rev-parse HEAD)" = "197d909e7d55d9738089091d282d2475962c834e" || exit 1
          cmp logic/model/new-purchase-cash-review.mjs site/t2-site-module/marketops/decision/new-purchase-cash-review.mjs
          cmp logic/model/new-purchase-cash-review.d.mts site/t2-site-module/marketops/decision/new-purchase-cash-review.d.mts
          cmp logic/model/business-attention-queue.mjs site/t2-site-module/marketops/decision/business-attention-queue.mjs
          cmp logic/model/business-attention-queue.d.mts site/t2-site-module/marketops/decision/business-attention-queue.d.mts
          cmp logic/model/business-product-return.mjs site/t2-site-module/marketops/decision/business-product-return.mjs
          cmp logic/model/business-product-return.d.mts site/t2-site-module/marketops/decision/business-product-return.d.mts
          cmp logic/model/business-product-return.mjs site/src/lib/business-product-return.mjs
          cmp logic/model/business-product-return.d.mts site/src/lib/business-product-return.d.mts
          cmp logic/model/business-obligation.mjs site/t2-site-module/marketops/decision/business-obligation.mjs
          cmp logic/model/business-obligation.d.mts site/t2-site-module/marketops/decision/business-obligation.d.mts
          cmp logic/model/business-goods-cash-coordination.mjs site/t2-site-module/marketops/decision/business-goods-cash-coordination.mjs
          cmp logic/model/business-goods-cash-coordination.d.mts site/t2-site-module/marketops/decision/business-goods-cash-coordination.d.mts
          echo D08_SUBJECT_PARITY=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Subject-model regression suite
        working-directory: logic
        run: |
          node --test tests/business-obligation.test.mjs tests/business-goods-cash-coordination.test.mjs tests/business-attention-queue.test.mjs tests/new-purchase-cash-review.test.mjs tests/business-payment-continuity.test.mjs tests/business-attention-navigation.test.mjs tests/business-product-return.test.mjs tests/business-obligation-allocation-passport.test.mjs > "$RUNNER_TEMP/d08-model.log" 2>&1 || {
            echo D08_MODEL_TESTS=FAIL
          grep -E '^not ok [0-9]+|^[[:space:]]*error:|^[[:space:]]*code:|^# (tests|pass|fail) ' "$RUNNER_TEMP/d08-model.log" | head -30 || true
          exit 1;
          }
          echo D08_MODEL_TESTS=PASS
      - name: Install canonical site dependencies
        working-directory: site
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d08-install.log" 2>&1 || {
            echo D08_INSTALL=FAIL; exit 1;
          }
          echo D08_INSTALL=PASS
      - name: Classify generated checkout changes without printing private source
        working-directory: site
        run: |
          npx tsx scripts/build-partners-index.ts > "$RUNNER_TEMP/d08-generate-partners.log" 2>&1 || exit 1
          npx tsx scripts/generate-sitemap.ts > "$RUNNER_TEMP/d08-generate-sitemap.log" 2>&1 || exit 1
          node scripts/refresh-route-tree.mjs > "$RUNNER_TEMP/d08-route-tree.log" 2>&1 || exit 1
          node - <<'NODE'
          const cp=require("node:child_process");
          const lines=cp.execFileSync("git",["status","--porcelain"],{encoding:"utf8"})
            .split(String.fromCharCode(10)).map(x=>x.trimEnd()).filter(Boolean);
          const allowed={
            ROUTES:"src/routeTree.gen.ts",
            PARTNERS:"src/data/partners-index.generated.ts",
            SITEMAP:"public/sitemap.xml",
          };
          for(const [name,path] of Object.entries(allowed)){
            const flag=lines.some(x=>x.slice(3)===path);
            console.log("D08_GENERATED_"+name+"_DIRTY="+Number(flag));
          }
          console.log("D08_GENERATED_UNKNOWN_COUNT="+lines.filter(x=>
            !Object.values(allowed).includes(x.slice(3))).length);
          NODE
      - name: Reconcile only checked build-generated derivatives
        working-directory: site
        run: |
          node - <<'NODE'
          const cp=require("node:child_process");
          const changed=cp.execFileSync("git",["status","--porcelain","-z"],
            {encoding:"utf8"}).split(String.fromCharCode(0)).filter(Boolean);
          const allowed=new Set(["src/routeTree.gen.ts","public/sitemap.xml",
            "src/data/partners-index.generated.ts"]);
          if(changed.some(x=>x.slice(0,3)!==" M "||!allowed.has(x.slice(3)))){
            console.log("D08_GENERATED_RECONCILE=FAIL");
            process.exit(1);
          }
          NODE
          git restore --source=HEAD --worktree -- src/routeTree.gen.ts public/sitemap.xml src/data/partners-index.generated.ts
          if test -n "$(git status --porcelain)"; then
            echo D08_GENERATED_RECONCILE=FAIL
            exit 1
          fi
          echo D08_GENERATED_RECONCILE=PASS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Production archive rules prevent stale obligation-less dist
        working-directory: site
        run: |
          python -m unittest discover -s tests -p test_package_hosting.py > "$RUNNER_TEMP/d08-packager.log" 2>&1 || {
            echo D08_HOSTING_PACKAGER_TESTS=FAIL
            grep -E "^FAILED|^ERROR|^FAIL|^Ran [0-9]+ tests?" "$RUNNER_TEMP/d08-packager.log" | head -8 || true
            exit 1
          }
          echo D08_HOSTING_PACKAGER_TESTS=PASS
      - name: Native Windows original T2 witness source syntax and exchange coverage
        working-directory: site
        run: |
          node --check tests/d08-obligation-native-t2-roundtrip.mjs || exit 1
          node --test tests/marketops-t2-obligation-passport.test.mjs > "$RUNNER_TEMP/d08-native-passport.log" 2>&1 || {
            echo D08_NATIVE_WITNESS_CONTRACT=FAIL; exit 1;
          }
          node --import tsx --test tests/marketops-recovery-intent.test.mjs > "$RUNNER_TEMP/d08-recovery-intent.log" 2>&1 || {
            echo D08_OBLIGATION_RECOVERY_INTENT=FAIL; exit 1;
          }
          echo D08_OBLIGATION_RECOVERY_INTENT=PASS
          echo D08_NATIVE_WITNESS_CONTRACT=PASS
      - name: T2 obligations and UI contracts
        working-directory: site
        run: |
          node --import tsx --test tests/marketops-business-obligation.test.mjs tests/marketops-business-goods-cycle.test.mjs tests/marketops-business-attention.test.mjs tests/marketops-new-purchase-review.test.mjs tests/marketops-obligation-return-flow.test.mjs tests/marketops-attention-navigation.test.mjs tests/marketops-obligation-allocation-passport.test.mjs tests/marketops-trading-native-witness.test.mjs tests/marketops-workspace-create-readback.test.mjs tests/marketops-business-product-return.test.mjs > "$RUNNER_TEMP/d08-obligations.log" 2>&1 || {
            echo D08_T2_OBLIGATIONS=FAIL
            grep -E '^not ok [0-9]+|^# (tests|pass|fail) ' "$RUNNER_TEMP/d08-obligations.log" | head -25 || true
            exit 1;
          }
          echo D08_T2_OBLIGATIONS=PASS
      - name: Whole site TypeScript and D08 adapters
        working-directory: site
        run: |
          npm run check:types > "$RUNNER_TEMP/d08-types.log" 2>&1 || {
            echo D08_TYPES=FAIL; exit 1;
          }
          echo D08_TYPES=PASS
          npm run test:d08:adapters > "$RUNNER_TEMP/d08-adapters.log" 2>&1 || {
            echo D08_ADAPTERS=FAIL
            grep -E '^not ok [0-9]+|^    not ok [0-9]+|^# (tests|pass|fail|cancelled) ' "$RUNNER_TEMP/d08-adapters.log" | tail -25 || true
            exit 1;
          }
          echo D08_ADAPTERS=PASS
      # No artifacts and no logs uploaded. Private source and dist stay ephemeral.
