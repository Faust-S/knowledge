name: T4 original empty Exchange event sequence diagnostic
on:
  push:
    branches: ['ci/once/t4-original-empty-exchange-event-types/ee94c259489c']
permissions:
  contents: read
jobs:
  original-exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - working-directory: packages/t3-core
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/t4-idb" --no-audit --no-fund --ignore-scripts --save-exact fake-indexeddb@6.2.4
          mkdir -p "$RUNNER_TEMP/t4-qualified"
          unzip -q qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip -d "$RUNNER_TEMP/t4-qualified"
          IWXA_COMPANY_TEST_QUALIFIED_T2="$RUNNER_TEMP/t4-qualified" IWXA_COMPANY_TEST_IDB_MODULE="$RUNNER_TEMP/t4-idb/node_modules/fake-indexeddb/build/esm/index.js" node --test --test-reporter=tap --test-timeout=180000 --test-name-pattern="original empty Workspace roundtrip" tests/t3-company-original-runtime-roundtrip.test.mjs
