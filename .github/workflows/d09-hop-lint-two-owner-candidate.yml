name: D09 HOP complete lint-normalization candidate without private source export
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact private HOP site working branch
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop.iwxa.ru
          ref: work/2026-10-27-d09-t2-site-only
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - name: Checkout original subject owner in separate private repository
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop
          ref: work/2026-11-19-narrative-ai-import
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: canonical-hop
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pin both branch contents, do not publish source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "425320a7da226ab8e90ca3eb5131003f87317032" || {
            echo D09_TWO_OWNER_LINT_SITE_SHA_CHANGED=HOLD; exit 1;
          }
          mv canonical-hop "$RUNNER_TEMP/d09-canonical-hop"
          test "$(git -C "$RUNNER_TEMP/d09-canonical-hop" rev-parse HEAD)" = "4c20c3c554eee53d75faf6b329b7053bcc81ecfd" || {
            echo D09_TWO_OWNER_LINT_SUBJECT_SHA_CHANGED=HOLD; exit 1;
          }
          echo D09_TWO_OWNER_LINT_EXACT_INPUT=PASS
          node --check scripts/d09-normalize-lint.mjs || {
            echo D09_TWO_OWNER_LINT_SCRIPT_SYNTAX=FAIL; exit 1;
          }
          echo D09_TWO_OWNER_LINT_SCRIPT_SYNTAX=PASS
      - name: Install pinned site dependencies
        shell: bash
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-two-owner-npm.log" 2>&1 || {
            echo D09_TWO_OWNER_LINT_NPM=FAIL; exit 1;
          }
          echo D09_TWO_OWNER_LINT_NPM=PASS
      - name: Normalize paired owner files and verify all code and lint in disposable clones
        shell: bash
        run: |
          node scripts/d09-normalize-lint.mjs "$RUNNER_TEMP/d09-canonical-hop" --apply > "$RUNNER_TEMP/d09-two-owner-result.log" 2>&1 || {
            echo D09_TWO_OWNER_LINT_NORMALIZE=FAIL
            grep -E 'D09_LINT_(FAILED_GATE|FAILED_TEST_SIGNATURE|NORMALIZED_[A-Z_]+|NORMALIZATION)' "$RUNNER_TEMP/d09-two-owner-result.log" | tail -25 || true
            grep -oE 'error TS[0-9]+|AssertionError|ERR_[A-Z0-9_]+' "$RUNNER_TEMP/d09-two-owner-result.log" | sort -u | tail -10 || true
            exit 1
          }
          grep '^D09_LINT_' "$RUNNER_TEMP/d09-two-owner-result.log" | tail -18
          echo D09_TWO_OWNER_LINT_NORMALIZE=PASS
          # The public runner does not write to either private repository:
          # review and promotion must use a private authorized checkout.
          echo D09_TWO_OWNER_PRIVATE_REPOSITORIES_UNMODIFIED=true
      # Never upload diffs, sources, binaries, environment secrets or logs.
