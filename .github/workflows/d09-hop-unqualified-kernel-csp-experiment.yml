name: D09 HOP CSP unqualified Kernel experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d09-narrative:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private site without publishing files
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop.iwxa.ru
          ref: work/2026-10-27-d09-t2-site-only
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact npm dependencies
        shell: bash
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-npm.log" 2>&1 || {
            echo "D09_NPM_CI=FAIL"; exit 1;
          }
          echo "D09_NPM_CI=PASS"
      - name: Record exact HOP revision and check Result source boundary
        shell: bash
        run: |
          echo "D09_SITE_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "65a4c1598561797a13e64be5b58e986343a3e385" || {
            echo "D09_SITE_REVISION_CHANGED=HOLD"; exit 1;
          }
          node --experimental-strip-types --test tests/d09-read-model-guards.test.mjs > "$RUNNER_TEMP/d09-result-source.log" 2>&1 || {
            echo "D09_RESULT_SOURCE_GUARD=FAIL"; exit 1;
          }
          echo "D09_RESULT_SOURCE_GUARD=PASS"
      - name: Check TypeScript
        shell: bash
        run: |
          npm run typecheck > "$RUNNER_TEMP/d09-types.log" 2>&1 || {
            echo "D09_TYPES=FAIL"
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/d09-types.log" | sed -E 's/: error (TS[0-9]+):.*/: \1/' | head -30 || true
            exit 1
          }
          echo "D09_TYPES=PASS"
      - name: Run semantic narrative tests
        shell: bash
        run: |
          npx vitest run src/lib/__tests__/narrative-brief-import.test.ts > "$RUNNER_TEMP/d09-narrative.log" 2>&1 || {
            echo "D09_NARRATIVE_TEST=FAIL"; exit 1;
          }
          echo "D09_NARRATIVE_TEST=PASS"
      - name: Run D09 host and copy tests
        shell: bash
        run: |
          npm run test:d09 > "$RUNNER_TEMP/d09-integration.log" 2>&1 || {
            grep -E 'not ok|AssertionError|at .*d09-.*test.mjs|^# (fail|tests)|^Error:|^SyntaxError:|^TypeError:' "$RUNNER_TEMP/d09-integration.log" | sed -E 's#/(home|tmp|mnt)/[^[:space:]]+#<private-path>#g' | tail -16 || true
            echo "D09_HOST_TEST=FAIL"; exit 1;
          }
          node --check tests/d09-strict-csp-host-witness.mjs || {
            echo "D09_BROWSER_WITNESS_SYNTAX=FAIL"; exit 1;
          }
          node --check scripts/assemble-d09-site-only.mjs || {
            echo "D09_SITE_ASSEMBLY_SYNTAX=FAIL"; exit 1;
          }
          echo "D09_HOST_TEST=PASS"
          ./node_modules/.bin/vitest run src/components/player/ResultContinuationPanel.t2.test.tsx src/integrations/t2/result-source-check.test.ts src/components/workspace/ImportPreviewDialog.t2.test.tsx > "$RUNNER_TEMP/d09-result-ui.log" 2>&1 || {
            grep -E 'FAIL|AssertionError|expected|Error:' "$RUNNER_TEMP/d09-result-ui.log" | tail -15 || true
            echo "D09_T2_RESULT_UI=FAIL"; exit 1;
          }
          echo "D09_T2_RESULT_UI=PASS"
      - name: Independently verify Project and source package guards
        shell: bash
        run: |
          node --experimental-strip-types --test tests/d09-read-model-guards.test.mjs tests/d09-source-package-integrity.test.mjs > "$RUNNER_TEMP/d09-project-guards.log" 2>&1 || {
            grep -E 'AssertionError|at .*d09-.*test\\.mjs|not ok|ERR_ASSERTION' "$RUNNER_TEMP/d09-project-guards.log" | tail -20 || true
            echo "D09_PROJECT_PACKAGE_GUARDS=FAIL"; exit 1;
          }
          echo "D09_PROJECT_PACKAGE_GUARDS=PASS"
          echo "D09_PROJECT_ZIP_ENVELOPE=PASS"
      - name: Checkout canonical private HOP logic
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop
          ref: 4c20c3c554eee53d75faf6b329b7053bcc81ecfd
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: canonical-hop
      - name: Verify subject-code parity with the website
        shell: bash
        run: |
          for file in src/lib/narrative-brief-import.ts src/lib/__tests__/narrative-brief-import.test.ts src/content-system/editorial.ts src/content-system/surfaces.ts src/product-system/registry.ts; do
            cmp "$file" "canonical-hop/$file" || { echo "D09_CANONICAL_PARITY=FAIL"; exit 1; }
          done
          echo "D09_CANONICAL_PARITY=PASS"
          # This is a temporary independent verification checkout, not site source.
          rm -rf canonical-hop
      - name: Check public UX and product contracts
        shell: bash
        run: |
          npm run check:consumer-ux > "$RUNNER_TEMP/d09-ux.log" 2>&1 || {
            echo "D09_CONSUMER_UX=FAIL"; exit 1;
          }
          echo "D09_CONSUMER_UX=PASS"
          npm run check:product-contracts > "$RUNNER_TEMP/d09-contracts.log" 2>&1 || {
            echo "D09_PRODUCT_CONTRACTS=FAIL"; exit 1;
          }
          echo "D09_PRODUCT_CONTRACTS=PASS"
      # The subsequent npm run build performs the same public-stage build once.
      # Avoid rendering the complete website a second time in this witness.
      - name: Checkout isolated T2 issue14 CSP candidate
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: 2d50a50b1a5ffda3395046da146efad3636732d1
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          sparse-checkout: |
            t2/current/final-successor/canonical-source
            t2/current/final-successor/kernel-successors/k036-same-store-event-history-20261019
            t2/current/final-successor/canonical-source-inputs/k035-rc20
            t2/current/final-successor/kernel-successors/k036-atomic-graph
          path: d09-temporary-t2
      - name: Prepare separate disposable T2 checkout
        shell: bash
        run: |
          mv d09-temporary-t2 "$RUNNER_TEMP/d09-canonical-t2"
          test -f "$RUNNER_TEMP/d09-canonical-t2/t2/current/final-successor/canonical-source/package.json"
          echo "D09_T2_CSP_CANDIDATE=2d50a50b1a5ffda3395046da146efad3636732d1"
      - name: Qualify standalone Host validators against reference AJV
        shell: bash
        run: |
          cd "$RUNNER_TEMP/d09-canonical-t2/t2/current/final-successor/canonical-source"
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-t2-candidate-npm.log" 2>&1 || {
            echo "T2_CSP_CANDIDATE_NPM=FAIL"; exit 1;
          }
          npm run typecheck > "$RUNNER_TEMP/d09-t2-candidate-types.log" 2>&1 || {
            echo "T2_CSP_CANDIDATE_TYPES=FAIL"
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/d09-t2-candidate-types.log" | sed -E 's/: error (TS[0-9]+):.*/: \\1/' | head -12 || true
            exit 1
          }
          echo "T2_CSP_CANDIDATE_TYPES=PASS"
          ./node_modules/.bin/vitest run tests/ajv-standalone-parity.test.ts tests/host-config-schema-validation.test.ts tests/base-module-manifest.test.ts > "$RUNNER_TEMP/d09-t2-candidate-parity.log" 2>&1 || {
            echo "T2_CSP_CANDIDATE_AJV_PARITY=FAIL"
            grep -E 'FAIL|Error:|AssertionError' "$RUNNER_TEMP/d09-t2-candidate-parity.log" | tail -10 || true
            exit 1
          }
          echo "T2_CSP_CANDIDATE_AJV_PARITY=PASS"
          git status --porcelain | sed -E 's#^.*(src/config/generated/normative-validators.mjs)$#GENERATED_AJV_ONLY#'
          test -f src/config/generated/normative-validators.mjs
          echo "T2_CSP_CANDIDATE_GENERATED=PASS"
      - name: Verify and expand the T2-qualified Kernel release
        shell: bash
        run: |
          archive="$RUNNER_TEMP/d09-canonical-t2/t2/current/final-successor/kernel-successors/k036-same-store-event-history-20261019/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip"
          test -f "$archive"
          echo "7075b8b9590ef1283e34ecb3c21dd9d1b7342697287e1aa150cd4f4a60860b68  $archive" | sha256sum -c - > /dev/null || {
            echo "D09_QUALIFIED_KERNEL_ARCHIVE=FAIL"; exit 1;
          }
          mkdir -p "$RUNNER_TEMP/d09-qualified-kernel"
          unzip -q "$archive" -d "$RUNNER_TEMP/d09-qualified-kernel" || {
            echo "D09_QUALIFIED_KERNEL_UNPACK=FAIL"; exit 1;
          }
          test -f "$RUNNER_TEMP/d09-qualified-kernel/_iwxa/runtime/0.3.6/runtime.js" || {
            echo "D09_QUALIFIED_KERNEL_ROOT=FAIL"; exit 1;
          }
          echo "D09_QUALIFIED_KERNEL_ARCHIVE=PASS"
      - name: Build the single site with actual T2 Host and verified Kernel
        shell: bash
        env:
          D09_T2_CANONICAL_SOURCE: ${{ runner.temp }}/d09-canonical-t2/t2/current/final-successor/canonical-source
          D09_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/d09-qualified-kernel
          D09_ORIGIN: https://localhost:8443
        run: |
          npm run build > "$RUNNER_TEMP/d09-final-build.log" 2>&1 || {
            grep -oE 'D09_(SITE_ONLY|FULL_BUILD)_[A-Z0-9_:.-]+' "$RUNNER_TEMP/d09-final-build.log" | tail -6 || true
            echo "D09_INTEGRATED_STATIC_DIST=FAIL"; exit 1;
          }
          grep -q 'D09_ENGINEERING_STUDIO_JS_ENTRIES_REMOVED=1' "$RUNNER_TEMP/d09-final-build.log" || {
            echo "D09_ENGINEERING_STUDIO_JS_NOT_EXCLUDED=FAIL"; exit 1;
          }
          echo "D09_ENGINEERING_STUDIO_JS_ENTRIES_REMOVED=1"
          test -f dist/index.html
          test -f dist/workspace/index.html
          test -f dist/workspace/exchange/index.html
          test -f dist/workspace/lifecycle/index.html
          test -f dist/d09-site-owned.css
          jq -e '.layout.workspace_chrome == "site-owned"' dist/_iwxa/domain-shell.json > /dev/null || {
            echo "D09_PRODUCT_FIRST_CONFIGURATION=FAIL"; exit 1;
          }
          grep -q 'D09_PRODUCT_FIRST_FIRST_PAINT=PASS' "$RUNNER_TEMP/d09-final-build.log" || {
            echo "D09_PRODUCT_FIRST_FIRST_PAINT=FAIL"; exit 1;
          }
          echo "D09_PRODUCT_FIRST_FIRST_PAINT=PASS"
          test -f dist/_iwxa/runtime/0.3.6/runtime.js
          test ! -e dist/workspace/studio/index.html || { echo "D09_ENGINEERING_STUDIO_PUBLISHED=FAIL"; exit 1; }
          test ! -e dist/workspace/studio.html || { echo "D09_ENGINEERING_STUDIO_PUBLISHED=FAIL"; exit 1; }
          test ! -e dist/studio.html || { echo "D09_ENGINEERING_STUDIO_PUBLISHED=FAIL"; exit 1; }
          echo "D09_ENGINEERING_STUDIO_EXCLUDED=PASS"
          echo "D09_INTEGRATED_STATIC_DIST=PASS"
      - name: Check deployed Apache routing and mutable Kernel cache policy
        shell: bash
        run: |
          npm run check:htaccess > "$RUNNER_TEMP/d09-htaccess.log" 2>&1 || {
            echo "D09_APACHE_HOSTING_POLICY=FAIL"; exit 1;
          }
          echo "D09_APACHE_HOSTING_POLICY=PASS"

      - name: Reconstruct exact Kernel source and build CSP-only successor in disposable root
        shell: bash
        run: |
          repo="$RUNNER_TEMP/d09-canonical-t2"
          core="$repo/t2/current/final-successor/canonical-source"
          node "$core/scripts/materialize-k035-atomic-graph-successor.mjs" \
            "$repo/t2/current/final-successor/canonical-source-inputs/k035-rc20/SOURCE_AUTHORITY.json" \
            "$repo" "$RUNNER_TEMP/d09-experimental-k035" > "$RUNNER_TEMP/d09-k035-recover.log" 2>&1 || {
            echo D09_EXPERIMENT_EXACT_K035=FAIL; exit 1;
          }
          echo D09_EXPERIMENT_EXACT_K035=PASS
          node "$core/scripts/materialize-k036-atomic-graph-qualified.mjs" \
            "$RUNNER_TEMP/d09-experimental-k035" "$RUNNER_TEMP/d09-experimental-k036" > "$RUNNER_TEMP/d09-k036-recover.log" 2>&1 || {
            echo D09_EXPERIMENT_EXACT_K036=FAIL; exit 1;
          }
          echo D09_EXPERIMENT_EXACT_K036=PASS
          node "$core/scripts/create-k036-import-time-candidate.mjs" \
            "$RUNNER_TEMP/d09-experimental-k036" "$RUNNER_TEMP/d09-experimental-k036-timestamp" > "$RUNNER_TEMP/d09-timestamp-patch.log" 2>&1 || {
            echo D09_EXPERIMENT_TIMESTAMP_LINEAGE=FAIL
            grep -oE 'K036_IMPORT_TIME_[A-Z0-9_]+' "$RUNNER_TEMP/d09-timestamp-patch.log" | tail -6 || true
            exit 1
          }
          echo D09_EXPERIMENT_TIMESTAMP_LINEAGE=PASS
          node "$core/scripts/create-k036-same-store-history-candidate.mjs" \
            "$RUNNER_TEMP/d09-experimental-k036-timestamp" "$RUNNER_TEMP/d09-experimental-k036-same-store" > "$RUNNER_TEMP/d09-same-store-patch.log" 2>&1 || {
            echo D09_EXPERIMENT_SAME_STORE_LINEAGE=FAIL
            grep -oE 'K036_SAME_STORE_[A-Z0-9_]+' "$RUNNER_TEMP/d09-same-store-patch.log" | tail -6 || true
            exit 1
          }
          echo D09_EXPERIMENT_SAME_STORE_LINEAGE=PASS
          cd "$RUNNER_TEMP/d09-experimental-k036-same-store"
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-k036-install.log" 2>&1 || {
            echo D09_EXPERIMENT_KERNEL_NPM=FAIL; exit 1;
          }
          node "$core/scripts/issue14-generate-kernel-static-validators.mjs" \
            "$RUNNER_TEMP/d09-experimental-k036-same-store" > "$RUNNER_TEMP/d09-experimental-static.log" 2>&1 || {
            echo D09_EXPERIMENT_KERNEL_GENERATE=FAIL; exit 1;
          }
          echo D09_EXPERIMENT_KERNEL_GENERATE=PASS
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @cfworker/json-schema@4.1.1 > "$RUNNER_TEMP/d09-experimental-interpreter-npm.log" 2>&1 || {
            echo D09_EXPERIMENT_INTERPRETER_INSTALL=FAIL; exit 1;
          }
          node "$core/scripts/issue14-kernel-interpreted-runtime.mjs" "$RUNNER_TEMP/d09-experimental-k036-same-store" > "$RUNNER_TEMP/d09-experimental-interpreted.log" 2>&1 || {
            echo D09_EXPERIMENT_DYNAMIC_INTERPRETER_PATCH=FAIL
            grep -oE 'D09_KERNEL_[A-Z0-9_]+|Error: [A-Z0-9_]+' "$RUNNER_TEMP/d09-experimental-interpreted.log" | tail -7 || true
            exit 1
          }
          echo D09_EXPERIMENT_DYNAMIC_INTERPRETER_PATCH=PASS
          node "$core/scripts/issue14-audit-ajv-after-patch.mjs" "$RUNNER_TEMP/d09-experimental-k036-same-store" > "$RUNNER_TEMP/d09-ajv-remaining-audit.log" 2>&1 || {
            echo D09_EXPERIMENT_AJV_CONSTRUCTOR_AUDIT=FAIL; exit 1;
          }
          grep '^D09_KERNEL_REMAINING_AJV_CTORS=' "$RUNNER_TEMP/d09-ajv-remaining-audit.log"
          node "$core/scripts/issue14-remove-runtime-ajv.mjs" "$RUNNER_TEMP/d09-experimental-k036-same-store" > "$RUNNER_TEMP/d09-experimental-remove-ajv.log" 2>&1 || {
            echo D09_EXPERIMENT_AJV_RUNTIME_REMOVAL=FAIL
            grep -oE 'D09_AJV_[A-Z0-9_]+' "$RUNNER_TEMP/d09-experimental-remove-ajv.log" | tail -7 || true
            exit 1
          }
          echo D09_EXPERIMENT_AJV_RUNTIME_REMOVAL=PASS
          node "$core/scripts/issue14-zod-csp-jitless.mjs" "$RUNNER_TEMP/d09-experimental-k036-same-store" > "$RUNNER_TEMP/d09-experimental-zod-csp.log" 2>&1 || {
            echo D09_EXPERIMENT_ZOD_JITLESS=FAIL
            grep -oE 'D09_ZOD_[A-Z0-9_]+' "$RUNNER_TEMP/d09-experimental-zod-csp.log" | tail -6 || true
            exit 1
          }
          echo D09_EXPERIMENT_ZOD_JITLESS=PASS
          npm run typecheck > "$RUNNER_TEMP/d09-experimental-types.log" 2>&1 || {
            echo D09_EXPERIMENT_KERNEL_TYPES=FAIL; exit 1;
          }
          echo D09_EXPERIMENT_KERNEL_TYPES=PASS
          npm run build > "$RUNNER_TEMP/d09-experimental-build.log" 2>&1 || {
            echo D09_EXPERIMENT_KERNEL_BUILD=FAIL; exit 1;
          }
          echo D09_EXPERIMENT_KERNEL_BUILD=PASS
          npm run test:built > "$RUNNER_TEMP/d09-experimental-built-tests.log" 2>&1 || {
            echo D09_EXPERIMENT_KERNEL_BUILT_TESTS=FAIL; exit 1;
          }
          echo D09_EXPERIMENT_KERNEL_BUILT_TESTS=PASS
          test -s dist/_iwxa/runtime/0.3.6/runtime.js
      - name: Make explicitly unqualified mirror without touching the integrated dist
        shell: bash
        run: |
          mirror="$RUNNER_TEMP/d09-csp-unqualified-issue14"
          test ! -e "$mirror"
          cp -a dist "$mirror"
          kernel="$RUNNER_TEMP/d09-experimental-k036-same-store/dist/_iwxa/runtime/0.3.6/runtime.js"
          cp "$kernel" "$mirror/_iwxa/runtime/0.3.6/runtime.js"
          node --input-type=module - "$mirror" <<'NODE'
          import {readFileSync,writeFileSync} from "node:fs";
          import {join} from "node:path";
          const root=process.argv[2],p=join(root,"_iwxa/domain.json"),doc=JSON.parse(readFileSync(p,"utf8"));
          if(doc.status!=="local-candidate"||doc.origin!=="https://localhost:8443")throw Error("D09_EXPERIMENT_LOCAL_CONFIG_REQUIRED");
          doc.runtime.artifactId="d09-csp-unqualified-issue14-experiment-only";
          writeFileSync(p,JSON.stringify(doc,null,2)+"\n");
          NODE
          echo "D09_EXPERIMENT_UNQUALIFIED_RUNTIME_SHA=$(sha256sum "$kernel" | cut -d ' ' -f1)"
          echo D09_EXPERIMENT_MIRROR_ONLY=PASS
      - name: Verify exact test-only Kernel in three HOP routes under original strict HTTPS CSP
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/d09-experimental-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -keyout "$RUNNER_TEMP/d09-experimental-tls/key.pem" \
            -out "$RUNNER_TEMP/d09-experimental-tls/cert.pem" > "$RUNNER_TEMP/d09-experimental-openssl.log" 2>&1
          if command -v google-chrome >/dev/null 2>&1; then
            export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome)"
          else
            npx puppeteer browsers install chrome > "$RUNNER_TEMP/d09-experimental-chrome-install.log" 2>&1 || {
              echo D09_EXPERIMENT_BROWSER_UNAVAILABLE=FAIL; exit 1;
            }
          fi
          export D09_CSP_EXPERIMENT_ROOT="$RUNNER_TEMP/d09-csp-unqualified-issue14"
          export D09_CSP_EXPERIMENT_SHA256="$(sha256sum "$RUNNER_TEMP/d09-experimental-k036-same-store/dist/_iwxa/runtime/0.3.6/runtime.js" | cut -d ' ' -f1)"
          export D09_PREVIEW_KEY_PATH="$RUNNER_TEMP/d09-experimental-tls/key.pem"
          export D09_PREVIEW_CERT_PATH="$RUNNER_TEMP/d09-experimental-tls/cert.pem"
          if node tests/d09-experimental-kernel-csp-witness.mjs > "$RUNNER_TEMP/d09-experimental-browser.log" 2>&1; then
            grep -E 'D09_CSP_EXPERIMENT_(WORKSPACE|EXCHANGE|LIFECYCLE|TOTAL)' "$RUNNER_TEMP/d09-experimental-browser.log" | tail -12 || true
            echo D09_EXPERIMENT_THREE_ROUTES=PASS_UNQUALIFIED
          else
            grep -E 'D09_CSP_EXPERIMENT_(WORKSPACE|EXCHANGE|LIFECYCLE|TOTAL)' "$RUNNER_TEMP/d09-experimental-browser.log" | tail -12 || true
            echo D09_EXPERIMENT_THREE_ROUTES=FAIL_UNQUALIFIED
            exit 1
          fi
      # No code, ZIP, Runtime candidate or private test artifacts are published.
