name: IWXA Software site independent source and build qualification
on:
  push:
    branches:
      - qa/2026-11-19-software-site-source-qualification
    paths:
      - .github/workflows/qa-site-software-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-private-site-public-output:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-ru-1
          ref: bb92c3e6d45c2061baf0e5ae65922b01b4f3adcf
          token: ${{ secrets.DOMEN || secrets.IWXA_SITE || secrets.T3 }}
          persist-credentials: false
          path: .private/site
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact site HEAD without showing source in public CI
        shell: bash
        run: |
          set -eu
          actual=$(git -C .private/site rev-parse HEAD)
          test "$actual" = 'bb92c3e6d45c2061baf0e5ae65922b01b4f3adcf' || { echo 'SITE_EXACT_OWNER_SOURCE_MISMATCH'; exit 1; }
          echo 'SITE_EXACT_OWNER_SOURCE_PIN_PASS'
      - uses: oven-sh/setup-bun@v2
      - name: Run independent software article and asset integrity check before dependency setup
        working-directory: .private/site
        shell: bash
        run: |
          node scripts/check-software-publications.mjs > "$RUNNER_TEMP/iwxa-software-check.log" 2>&1 || { echo 'SITE_SOFTWARE_CHECK_FAIL'; exit 1; }
          echo 'SITE_SOFTWARE_CHECK_PASS'
      - name: Install site dependencies in private source checkout
        working-directory: .private/site
        shell: bash
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/iwxa-software-npm.log" 2>&1 || { echo 'SITE_BUN_INSTALL_FAIL'; exit 1; }
          echo 'SITE_BUN_INSTALL_PASS'
      - name: Build current site with new real Windows screenshots
        working-directory: .private/site
        shell: bash
        run: |
          bun run build > "$RUNNER_TEMP/iwxa-software-build.log" 2>&1 || { echo 'SITE_SOFTWARE_BUILD_FAIL'; exit 1; }
          echo 'SITE_SOFTWARE_BUILD_PASS'
      - name: Assemble actual static shared-hosting output
        working-directory: .private/site
        shell: bash
        run: |
          bun run build:static > "$RUNNER_TEMP/iwxa-software-static.log" 2>&1 || { echo 'SITE_SOFTWARE_STATIC_PRERENDER_FAIL'; exit 1; }
          echo 'SITE_SOFTWARE_STATIC_PRERENDER_PASS'
      - name: Confirm all five current screenshots are present unchanged in hosting build
        working-directory: .private/site
        shell: bash
        run: |
          set -euo pipefail
          test -d dist-static
          while read -r file expected; do
            found=$(find dist-static -type f -path "*/assets/software/$file" -print -quit)
            test -n "$found" || { echo 'SITE_SOFTWARE_DIST_IMAGE_MISSING'; exit 1; }
            actual=$(sha256sum "$found" | cut -d ' ' -f 1)
            test "$actual" = "$expected" || { echo 'SITE_SOFTWARE_DIST_IMAGE_HASH_MISMATCH'; exit 1; }
          done <<'EOF_IMAGES'
          atlas09-current-verified.webp 67e4bcbbe5addd84406220c9131fbccd02857b0243900c116bfe7dc936202e35
          activity-current-verified.webp 8ad32aaafb0a7a60854e0c7cbfe6a0eb067ae43ae9b840064866229a4014c564
          admin03-current-verified.webp eac497db00b5af9baf1f61f47eef889a467a62c2f29e8bbf43663032a2e64257
          publisher05-current-verified.webp fc6c741e4f33244cfd747de2061d51441b39e4ff75f53eb0c9dba61a9d38874a
          setup-core-1-current-verified.webp 885ef484c4e65a0873763fd69b0a2d788e8df36484863eb16ed966affae8ba61
          EOF_IMAGES
          echo 'SITE_SOFTWARE_FIVE_CURRENT_IMAGES_IN_DIST_PASS'
      - name: Typecheck only current private source without emitting code
        working-directory: .private/site
        shell: bash
        run: |
          bunx tsc --noEmit > "$RUNNER_TEMP/iwxa-software-types.log" 2>&1 || { echo 'SITE_SOFTWARE_TYPECHECK_FAIL'; exit 1; }
          echo 'SITE_SOFTWARE_TYPECHECK_PASS'
      - name: Remove private checkout and logs
        if: always()
        shell: bash
        run: |
          rm -rf .private/site
          rm -f "$RUNNER_TEMP/iwxa-software-"*.log
          echo 'SITE_SOFTWARE_PRIVATE_SOURCE_AND_LOGS_PURGED'
