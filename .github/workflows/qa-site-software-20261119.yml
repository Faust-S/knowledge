name: IWXA Software site independent source and build qualification
on:
  push:
    branches:
      - qa/2026-11-19-software-site-source-qualification
    paths:
      - .github/workflows/qa-site-software-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-private-site-public-output:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-ru-1
          ref: 0b76b123f40a92a02387e51dc5b9976924868a5e
          token: ${{ secrets.DOMEN || secrets.IWXA_SITE || secrets.T3 }}
          persist-credentials: false
          path: .private/site
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact site HEAD without showing source in public CI
        shell: bash
        run: |
          set -eu
          actual=$(git -C .private/site rev-parse HEAD)
          test "$actual" = '0b76b123f40a92a02387e51dc5b9976924868a5e' || { echo 'SITE_EXACT_OWNER_SOURCE_MISMATCH'; exit 1; }
          echo 'SITE_EXACT_OWNER_SOURCE_PIN_PASS'
      - uses: oven-sh/setup-bun@v2
      - name: Run independent software article and asset integrity check before dependency setup
        working-directory: .private/site
        shell: bash
        run: |
          node scripts/check-software-publications.mjs > "$RUNNER_TEMP/iwxa-software-check.log" 2>&1 || { echo 'SITE_SOFTWARE_CHECK_FAIL'; exit 1; }
          echo 'SITE_SOFTWARE_CHECK_PASS'
      - name: Install site dependencies in private source checkout
        working-directory: .private/site
        shell: bash
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/iwxa-software-npm.log" 2>&1 || { echo 'SITE_BUN_INSTALL_FAIL'; exit 1; }
          echo 'SITE_BUN_INSTALL_PASS'
      - name: Provide actual Chrome for the site's original prerender engine
        working-directory: .private/site
        shell: bash
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          if test -n "$chrome"; then
            printf 'PUPPETEER_EXECUTABLE_PATH=%s\n' "$chrome" >> "$GITHUB_ENV"
            echo 'SITE_NATIVE_PRERENDER_SYSTEM_CHROME_READY'
          else
            bunx puppeteer browsers install chrome > "$RUNNER_TEMP/iwxa-software-browser.log" 2>&1 || { echo 'SITE_PRERENDER_BROWSER_INSTALL_FAILED'; exit 1; }
            echo 'SITE_NATIVE_PRERENDER_BROWSER_DOWNLOADED'
          fi
      - name: Build current site with new real Windows screenshots
        working-directory: .private/site
        shell: bash
        run: |
          bun run build > "$RUNNER_TEMP/iwxa-software-build.log" 2>&1 || { echo 'SITE_SOFTWARE_BUILD_FAIL'; exit 1; }
          echo 'SITE_SOFTWARE_BUILD_PASS'
      - name: Qualify full merged static hosting output, AKIS and software checks
        working-directory: .private/site
        shell: bash
        run: |
          bun run build:static:check > "$RUNNER_TEMP/iwxa-software-static.log" 2>&1 || { echo 'SITE_SOFTWARE_STATIC_PRERENDER_FAIL'; exit 1; }
          echo 'SITE_SOFTWARE_STATIC_PRERENDER_PASS'
      - name: Diagnose static packaging using only public-safe failure classes
        if: failure()
        working-directory: .private/site
        shell: bash
        run: |
          log="$RUNNER_TEMP/iwxa-software-static.log"
          if test -f "$log"; then
            grep -Eq '\[prerender\] FAILED' "$log" && echo 'SITE_STATIC_PRERENDER_READING_FAIL' || true
            grep -Eq '\[prerender\] done' "$log" && echo 'SITE_STATIC_PRERENDER_DONE_OBSERVED' || true
            grep -Eq 'browser navigation failed' "$log" && echo 'SITE_STATIC_NAVIGATION_FAIL' || true
            grep -Eq 'does not exist|not found' "$log" && echo 'SITE_STATIC_INPUT_MISSING' || true
            grep -Eq 'EADDRINUSE|ECONNREFUSED|ETIMEDOUT|timed out' "$log" && echo 'SITE_STATIC_LOCAL_SERVER_FAIL' || true
            grep -Eq 'ERR_MODULE_NOT_FOUND|Cannot find package|MODULE_NOT_FOUND' "$log" && echo 'SITE_STATIC_DEPENDENCY_FAIL' || true
            grep -Eq 'JavaScript heap out of memory|Killed|SIGKILL' "$log" && echo 'SITE_STATIC_RESOURCE_FAIL' || true
            grep -Eq 'Could not find Chrome|Browser was not found|Could not find Chromium|Chromium revision' "$log" && echo 'SITE_STATIC_PRERENDER_CHROME_NOT_FOUND' || true
            grep -Eq 'Failed to launch the browser process|Running as root without --no-sandbox' "$log" && echo 'SITE_STATIC_BROWSER_LAUNCH_FAILED' || true
            grep -Eq 'server didn.t start|server startup|listen EADDRINUSE' "$log" && echo 'SITE_STATIC_SSR_NOT_STARTED' || true
            grep -Eq '\[prerender\] preparing' "$log" && echo 'SITE_STATIC_PRERENDER_STARTED' || true
            grep -Eq 'vite.*built|built in' "$log" && echo 'SITE_STATIC_VITE_COMPILED' || true
            count=$(grep -Eo '[0-9]+/[0-9]+ page\(s\)' "$log" | tail -n 1 || true)
            if test -n "$count"; then
              count=$(printf '%s' "$count" | tr -cd '0-9/')
              echo "SITE_STATIC_FAILED_PAGES_RATIO=$count"
            fi
          else
            echo 'SITE_STATIC_LOG_NOT_CREATED'
          fi
          test -d dist-static || { echo 'SITE_STATIC_OUTPUT_DIR_MISSING'; exit 1; } && echo 'SITE_STATIC_OUTPUT_DIR_EXISTS' || true
          test -d .output/public && echo 'SITE_STATIC_NITRO_PUBLIC_EXISTS' || true
          test -d dist/client && echo 'SITE_STATIC_CLOUDFLARE_CLIENT_EXISTS' || true
      - name: Confirm all eleven current article photographs are unchanged in hosting build
        if: always()
        working-directory: .private/site
        shell: bash
        run: |
          set -euo pipefail
          test -d dist-static
          while read -r file expected; do
            found=$(find dist-static -type f -path "*/assets/software/$file" -print -quit)
            test -n "$found" || { echo 'SITE_SOFTWARE_DIST_IMAGE_MISSING'; exit 1; }
            actual=$(sha256sum "$found" | cut -d ' ' -f 1)
            test "$actual" = "$expected" || { echo 'SITE_SOFTWARE_DIST_IMAGE_HASH_MISMATCH'; exit 1; }
          done <<'EOF_IMAGES'
          agent-01-home-request.webp b27599757d61b02c46489a353ce70d09f22c57d9fb63e2b1d5742b2e4f8fcc44
          agent-02-dialogs.webp 994fd5ba8c2682864922b40db389fc071a082267802ae7ccbf056d2a5c94b16b
          agent-03-basic-programs.webp 297cb7d9dc6b1d74c3f187f0e1054aa0cc98cc2ffe3e330c0006335817762f4d
          atlas-01-portfolio.webp f4fa6504b5f80aca9bdacdfdc2bfa024ad2392d710fc49424cacbeb0207e03dd
          atlas-02-works.webp b6efca79418177d2c2b18d9025df770d6cb09eb1e3763ce3ed52d551cf9b787c
          atlas-03-impact.webp 71b7ad3d0f7bacd1e2b3d1cd76ca42db2349744a07fd0082b97b372c68dfcd2c
          admin-01-atlas-work.webp 95c37df7ed76cb95ee331a487ae02785965ed3192ffdb7838516367b4eb33cf5
          admin-02-assignment-editor.webp aa922197896f9feb78e0d7a8867bf9072daaf14469a0de12b403c4caf9d1c2f4
          admin-03-roles-seats.webp f40babaa29dfe38fc06aa401deb4ef747679c6198f4d38aed2f11baef887dc0c
          activity-current-verified.webp 8ad32aaafb0a7a60854e0c7cbfe6a0eb067ae43ae9b840064866229a4014c564
          publisher05-current-verified.webp fc6c741e4f33244cfd747de2061d51441b39e4ff75f53eb0c9dba61a9d38874a
          EOF_IMAGES
          echo 'SITE_SOFTWARE_ELEVEN_IMAGES_IN_DIST_PASS'
      - name: Typecheck only current private source without emitting code
        if: always()
        working-directory: .private/site
        shell: bash
        run: |
          bunx tsc --noEmit > "$RUNNER_TEMP/iwxa-software-types.log" 2>&1 || { echo 'SITE_SOFTWARE_TYPECHECK_FAIL'; exit 1; }
          echo 'SITE_SOFTWARE_TYPECHECK_PASS'
      - name: Remove private checkout and logs
        if: always()
        shell: bash
        run: |
          rm -rf .private/site
          rm -f "$RUNNER_TEMP/iwxa-software-"*.log
          echo 'SITE_SOFTWARE_PRIVATE_SOURCE_AND_LOGS_PURGED'
