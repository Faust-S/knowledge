name: D09 HOP isolated private lint normalization
on:
  push:
    branches: [work/2026-11-02-pipeline-foundation]
    paths: [.github/workflows/d09-hop-lint-normalization.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  normalized-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated private HOP branch
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop.iwxa.ru
          ref: work/2026-11-19-d09-lint-candidate
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact dependencies and frozen source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "b79323988f3a54eee2d44c95e22dc235d27474c7"
          test -z "$(git status --porcelain)"
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-lint-npm.log" 2>&1
          echo D09_LINT_NORMALIZE_INPUT=PASS
      - name: Apply fixable lint rules in private checkout only
        shell: bash
        run: |
          npm run typecheck > "$RUNNER_TEMP/d09-lint-original-types.log" 2>&1 || {
            echo D09_PRE_FORMAT_TYPES=FAIL; exit 1;
          }
          ./node_modules/.bin/eslint . --fix > "$RUNNER_TEMP/d09-lint-fix.log" 2>&1 || true
          # Exact source-parity witnesses have a different canonical owner;
          # preserve their original bytes instead of diverging from Faust-S/hop.
          for file in \
            src/lib/narrative-brief-import.ts \
            src/lib/__tests__/narrative-brief-import.test.ts \
            src/content-system/editorial.ts \
            src/content-system/surfaces.ts \
            src/product-system/registry.ts; do
              git restore -- "$file"
          done
          changed="$(git diff --name-only | wc -l)"
          echo "D09_FORMAT_CANDIDATE_FILES=$changed"
          git diff --shortstat
          if test "$changed" -gt 180; then
            echo D09_FORMAT_CHANGESET_TOO_LARGE=HOLD; exit 1;
          fi
          git diff --check || { echo D09_FORMAT_WHITESPACE=FAIL; exit 1; }
          echo D09_FORMAT_CANDIDATE_PREPARED=PASS
      - name: Check type safety and product behavior after formatting
        shell: bash
        run: |
          npm run typecheck > "$RUNNER_TEMP/d09-lint-types.log" 2>&1 || {
            echo D09_LINT_CANDIDATE_TYPES=FAIL; exit 1;
          }
          npm run test:d09 > "$RUNNER_TEMP/d09-lint-domain.log" 2>&1 || {
            echo D09_LINT_CANDIDATE_DOMAIN_TESTS=FAIL
            grep -E "not ok|✖|# fail|# tests|# pass|HOP_AJV_|ERR_ASSERTION|AssertionError|D09_SITE_" "$RUNNER_TEMP/d09-lint-domain.log" | tail -35 || true
            exit 1
          }
          ./node_modules/.bin/vitest run src/components/player/ResultContinuationPanel.t2.test.tsx src/integrations/t2/result-source-check.test.ts src/components/workspace/ImportPreviewDialog.t2.test.tsx > "$RUNNER_TEMP/d09-lint-ui.log" 2>&1 || {
            echo D09_LINT_CANDIDATE_UI_TESTS=FAIL; exit 1;
          }
          npm run check:consumer-ux > "$RUNNER_TEMP/d09-lint-consumer.log" 2>&1 || {
            echo D09_LINT_CANDIDATE_CONSUMER_UX=FAIL; exit 1;
          }
          npm run check:product-contracts > "$RUNNER_TEMP/d09-lint-contracts.log" 2>&1 || {
            echo D09_LINT_CANDIDATE_PRODUCT_CONTRACTS=FAIL; exit 1;
          }
          echo D09_LINT_CANDIDATE_TYPES=PASS
          echo D09_LINT_CANDIDATE_DOMAIN_TESTS=PASS
          echo D09_LINT_CANDIDATE_UI_TESTS=PASS
          echo D09_LINT_CANDIDATE_CONSUMER_UX=PASS
          echo D09_LINT_CANDIDATE_PRODUCT_CONTRACTS=PASS
      - name: Report remaining lint without source snippets
        shell: bash
        run: |
          ./node_modules/.bin/eslint . -f json > "$RUNNER_TEMP/d09-lint-after.json" 2> "$RUNNER_TEMP/d09-lint-after-stderr.log" || true
          node --input-type=module - "$RUNNER_TEMP/d09-lint-after.json" <<'NODE'
          import {readFileSync} from "node:fs";
          const rows=JSON.parse(readFileSync(process.argv[2],"utf8"));
          let errors=0,warnings=0;const rules=new Map();
          for(const row of rows) for(const m of row.messages??[]){
            errors+=(m.severity===2);warnings+=(m.severity===1);
            const k=m.ruleId??"unclassified";
            rules.set(k,(rules.get(k)??0)+1);
          }
          console.log("D09_LINT_AFTER="+JSON.stringify({errors,warnings,byRule:[...rules].sort((a,b)=>b[1]-a[1])}));
          NODE
      - name: Commit tested changes to isolated private branch only
        shell: bash
        env:
          D09_PRIVATE_PUSH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          git diff --check || exit 1
          git add -u
          if git diff --cached --quiet; then
            echo D09_LINT_NO_SOURCE_CHANGES; exit 0;
          fi
          git -c user.name="IWXA Qualification" -c user.email="iwxa-qualification@users.noreply.github.com" commit -qm "style(d09): normalize fixable lint in isolated HOP candidate"
          auth="$(printf 'x-access-token:%s' "$D09_PRIVATE_PUSH_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push -q origin HEAD:refs/heads/work/2026-11-19-d09-lint-candidate
          echo "D09_LINT_PRIVATE_CANDIDATE_COMMIT=$(git rev-parse HEAD)"
          echo D09_LINT_PRIVATE_CANDIDATE_PUSH=PASS
      # Never upload private source, lint JSON, diffs, Node dependencies or build output.
