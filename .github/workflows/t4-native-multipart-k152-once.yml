name: T4 original multipart source and recipient tasks
on:
  push:
    branches: ['ci/once/t4-native-multipart-k152/54e07a3500f69c5bd8d464e48cbb816f1c8551b9']
permissions:
  contents: read
concurrency:
  group: t4-multipart-k152-54e07a3500f69c5bd8d464e48cbb816f1c8551b9
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact candidate source
        run: |
          test "$(git rev-parse HEAD^)" = "54e07a3500f69c5bd8d464e48cbb816f1c8551b9"
          test "$(git rev-parse HEAD:packages)" = "$(git rev-parse HEAD^:packages)"
      - run: npm ci --prefix packages/t4-network --ignore-scripts --no-audit --no-fund
      - name: Existing compact task and recipient owner regression
        run: node --experimental-strip-types --test --test-concurrency=2 packages/t4-network/tests/original-host-dispatch-task-binding.test.mjs packages/t4-network/tests/original-host-native-recipient-step.test.mjs
      - name: New offer denial, compact compatibility and explicit opt-in
        run: node --experimental-strip-types --test --test-name-pattern='K151 original native SOURCE refuses|K152 original recipient must|K152 new recipient profile' packages/t4-network/tests/original-network-multipart-agreement.test.mjs
  multipart:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact candidate source
        run: |
          test "$(git rev-parse HEAD^)" = "54e07a3500f69c5bd8d464e48cbb816f1c8551b9"
          test "$(git rev-parse HEAD:packages)" = "$(git rev-parse HEAD^:packages)"
      - run: npm ci --prefix packages/t4-network --ignore-scripts --no-audit --no-fund
      - name: One full original task chain with signed frames and cold recovery
        run: node --experimental-strip-types --test --test-concurrency=1 --test-name-pattern='K152 existing SOURCE and RECIPIENT owner tasks' packages/t4-network/tests/original-network-multipart-agreement.test.mjs
