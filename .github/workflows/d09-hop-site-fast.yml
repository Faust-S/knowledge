name: D09 HOP site-only fast integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d09-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private HOP site without persistence or artifacts
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop.iwxa.ru
          ref: work/2026-10-27-d09-t2-site-only
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Lock actual revision to observable log
        shell: bash
        run: |
          echo "D09_SITE_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "6dd675953a56aa8acc602e67706610e1b8fd0981" || {
            echo "D09_SITE_REVISION_CHANGED=HOLD"; exit 1;
          }
      - name: Install exact dependencies
        shell: bash
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-fast-npm.log" 2>&1 || {
            echo "D09_FAST_INSTALL=FAIL"; exit 1;
          }
          echo "D09_FAST_INSTALL=PASS"
      - name: Check source typing
        shell: bash
        run: |
          npm run typecheck > "$RUNNER_TEMP/d09-fast-types.log" 2>&1 || {
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/d09-fast-types.log" | sed -E 's/: error (TS[0-9]+):.*/: \1/' | head -25 || true
            echo "D09_FAST_TYPES=FAIL"; exit 1;
          }
          echo "D09_FAST_TYPES=PASS"
      - name: Verify ZIP integrity and same-tab Workspace navigation regressions
        shell: bash
        run: |
          npm run test:d09 > "$RUNNER_TEMP/d09-fast-tests.log" 2>&1 || {
            grep -E 'not ok|AssertionError|at .*d09-.*test.mjs' "$RUNNER_TEMP/d09-fast-tests.log" | tail -20 || true
            echo "D09_FAST_TESTS=FAIL"; exit 1;
          }
          echo "D09_FAST_TESTS=PASS"
      - name: Exercise real React Result receipt and rejection UI
        shell: bash
        run: |
          ./node_modules/.bin/vitest run src/components/player/ResultContinuationPanel.t2.test.tsx src/integrations/t2/result-source-check.test.ts src/components/workspace/ImportPreviewDialog.t2.test.tsx > "$RUNNER_TEMP/d09-t2-result-ui.log" 2>&1 || {
            grep -E 'FAIL|AssertionError|expected|Error:' "$RUNNER_TEMP/d09-t2-result-ui.log" | tail -14 || true
            echo "D09_T2_RESULT_UI=FAIL"; exit 1;
          }
          echo "D09_T2_RESULT_UI=PASS"
      - name: Compile the real Host-facing HOP module
        shell: bash
        run: |
          npm run build:host-module > "$RUNNER_TEMP/d09-fast-module.log" 2>&1 || {
            echo "D09_FAST_HOST_MODULE=FAIL"; exit 1;
          }
          echo "D09_FAST_HOST_MODULE=PASS"
          echo "D09_FAST_GATE=PASS"
      # No private source, patches, dist or binaries are uploaded.
