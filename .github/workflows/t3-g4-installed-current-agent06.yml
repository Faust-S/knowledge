                    Write-Host ('G4_AGENT06_PACKAGE_GATE_STAGE ' + $safeStage.ToUpperInvariant())
                  }
                  foreach ($field in @('error_code','error_detail')) {
                    foreach ($match in [regex]::Matches([string]$failure.$field,
                      '(?<![A-Za-z0-9_])(?:native_candidate|agent06_t3|phase1_package)_[a-z0-9_]{3,90}(?![A-Za-z0-9_])')) {
                      Write-Host ('G4_AGENT06_PACKAGE_GATE_CODE ' + $match.Value.ToUpperInvariant())
                    }
                  }
                } catch {
                  Write-Host 'G4_AGENT06_PACKAGE_GATE_JSON_UNCLASSIFIED'
                }
              }
            }
            # The existing product package builder emits a private Python
            # traceback/exception only inside this runner. Safely extract the
            # first machine-token following its fixed error prefix, NEVER
            # arbitrary stderr, paths, source names, or user content.
            $packageDiagnosticInputs = @(
              $log,
              (Join-Path $output 'logs/package-build-only.json'),
              (Join-Path $output 'logs/package/package-gate-failure.json')
            )
            foreach ($sourceLog in $packageDiagnosticInputs) {
              if (-not (Test-Path -LiteralPath $sourceLog -PathType Leaf)) { continue }
              $sourceText = Get-Content -LiteralPath $sourceLog -Raw -ErrorAction SilentlyContinue
              if (-not $sourceText) { continue }
              $messages = [regex]::Matches($sourceText,
                '(?i)IWXA_EXPLORER_BUILD_FAIL:\s*([a-z][a-z0-9_]{3,95})(?![a-z0-9_])')
              foreach ($message in @($messages | Select-Object -Last 3)) {
                Write-Host ('G4_AGENT06_PYTHON_PACKAGE_FAILURE_TOKEN ' +
                  $message.Groups[1].Value.ToUpperInvariant())
              }
              if ($sourceText -match '(?i)IWXA_EXPLORER_BUILD_FAIL' -and
                  $messages.Count -eq 0) {
                Write-Host 'G4_AGENT06_PYTHON_PACKAGE_FAILURE_UNCLASSIFIED'
              }
              $preciseCodes = [regex]::Matches($sourceText,
                '(?<![a-zA-Z0-9_])(?:agent06_original_t3|agent06_original_t2|original_agent_d6|desktop_native|release_worktree|release_payload|git_command|u01_pinned|k03_pinned)_[a-z0-9_]{3,96}(?![a-zA-Z0-9_])')
              foreach ($code in @($preciseCodes | Select-Object -Unique | Select-Object -Last 4)) {
                Write-Host ('G4_AGENT06_PYTHON_PACKAGE_SAFE_CODE ' +
                  $code.Value.ToUpperInvariant())
              }
            }
            $originalPipelineLog = Join-Path $output 'logs/private-build-result.json'
            if (Test-Path -LiteralPath $originalPipelineLog -PathType Leaf) {
              $nativeRaw = Get-Content -LiteralPath $originalPipelineLog -Raw -ErrorAction SilentlyContinue
              if ($nativeRaw) {
                $foundNativeCodes = [regex]::Matches($nativeRaw,
                  '(?<![A-Za-z0-9_])native_candidate_[a-z0-9_]{4,90}(?![A-Za-z0-9_])')
                foreach ($match in @($foundNativeCodes | Select-Object -Last 5)) {
                  Write-Host ('G4_AGENT06_NATIVE_PACKAGE_FAILURE_CODE ' + $match.Value.ToUpperInvariant())
                }
                $categories = [ordered]@{
                  POWERSHELL_NATIVE_COMMAND = 'NativeCommandError|NativeCommandException'
                  UNQUALIFIED_GIT_SOURCE = 'git\.exe.*(?:fatal:|error:)'
                  MISSING_ORIGINAL_TOOL = 'CommandNotFoundException|The term .* is not recognized'
                  RUST_BUILD_FAILURE = 'cargo.*(?:error|failed)|error\[E[0-9]{4}\]'
                  NODE_BUILD_FAILURE = 'npm error|npm ERR!|vite.*error'
                  WINDOWS_PRIVILEGE = 'access is denied|UnauthorizedAccessException'
                }
                foreach ($category in $categories.Keys) {
                  if ($nativeRaw -match $categories[$category]) {
                    Write-Host ('G4_AGENT06_NATIVE_PACKAGE_FAILURE_CLASS ' + $category)
                  }
                }
              }
            }
            if (Test-Path -LiteralPath $log -PathType Leaf) {
              $rawInfo = Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
              if ($rawInfo) {
                $classMatchers = [ordered]@{
                  POWERSHELL_PARSER = 'ParserError|ParseException'
                  COMMAND_MISSING = 'CommandNotFoundException|is not recognized as the name of a cmdlet'
                  ARGUMENT_BINDING = 'ParameterBindingException|NamedParameterNotFound'
                  GIT_COMMAND = 'git.exe|git identity failed'
                  PATH_MISSING = 'ItemNotFoundException|Cannot find path|does not exist'
                  ACCESS_DENIED = 'UnauthorizedAccessException|Access is denied'
                  NODE_TOOL = 'npm ERR!|npm error|Node.js'
                  PYTHON_TOOL = 'ModuleNotFoundError|ImportError'
                }
                foreach ($name in $classMatchers.Keys) {
                  if ($rawInfo -match $classMatchers[$name]) {
                    Write-Host ('G4_AGENT06_PRIVATE_BUILD_ERROR_CLASS ' + $name)
                  }
                }
              }
            }
            $safeCodes = @()
            if (Test-Path -LiteralPath $log -PathType Leaf) {
              foreach ($line in (Get-Content -LiteralPath $log -ErrorAction SilentlyContinue)) {
                foreach ($m in [regex]::Matches([string]$line,
                  '(?<![A-Za-z0-9_])(?:private_setup|original_t3|original_t2|agent_native|setup_core|private_package|native_candidate)_[a-z0-9_]{4,115}(?![A-Za-z0-9_])')) {
                  $safeCodes += [string]$m.Value
                }
              }
            }
            $uniqueCodes = @($safeCodes | Select-Object -Unique | Select-Object -Last 4)
            if ($uniqueCodes.Count -eq 0) {
              Write-Host 'G4_AGENT06_ORIGINAL_SETUP_FAILURE_CODE UNCLASSIFIED'
            } else {
              foreach ($item in $uniqueCodes) {
                Write-Host ('G4_AGENT06_ORIGINAL_SETUP_FAILURE_CODE ' + $item.ToUpperInvariant())
              }
            }
            throw 'G4_AGENT06_CURRENT_ORIGINAL_NATIVE_SETUP_BUILD_NOT_ACCEPTED'
          }
          $installed = Join-Path $output 'temporary-installed-fixture/installed-witness.json'
          $rollback = Join-Path $output 'temporary-rollback-fixture/rollback-witness.json'
          $package = Join-Path $output 'IWXA-Private-SetupCore-Candidate.exe'
          if (-not (Test-Path -LiteralPath $package -PathType Leaf) -or
              -not (Test-Path -LiteralPath $installed -PathType Leaf) -or
              -not (Test-Path -LiteralPath $rollback -PathType Leaf)) {
            throw 'G4_AGENT06_INSTALLED_NATIVE_PACKAGE_RECEIPT_MISSING'
          }
          $gui = Get-Content -LiteralPath $installed -Raw | ConvertFrom-Json
          $rb = Get-Content -LiteralPath $rollback -Raw | ConvertFrom-Json
          if ($gui.status -ne 'PASS' -or
              $gui.installed_native_cold_launch_verified -ne $true -or
              $gui.installed_real_qwen_native_gui_result_verified -ne $true -or
              $gui.installed_real_qwen_native_gui_submit_review_verified -ne $true -or
              $gui.installed_core_readbacks_after_restart_verified -ne $true -or
              $rb.status -ne 'PASS' -or
              $rb.installed_file_identity_after_rollback -ne $true) {
