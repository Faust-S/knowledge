              MANAGED_PYTHON = (Test-Path -LiteralPath (Join-Path $output 'build/test-python/current-python.txt') -PathType Leaf)
              NATIVE_ICON = (Test-Path -LiteralPath (Join-Path $output 'logs/native-desktop-icon.json') -PathType Leaf)
              U04_PREPARED = (Test-Path -LiteralPath (Join-Path $output 'logs/u04-source-preparation.json') -PathType Leaf)
              U04_STAGED = (Test-Path -LiteralPath (Join-Path $output 'logs/u04-stage.json') -PathType Leaf)
              DESKTOP_NPM = (Test-Path -LiteralPath (Join-Path $output 'logs/native-desktop-dependencies.log') -PathType Leaf)
              DESKTOP_TAURI = (Test-Path -LiteralPath (Join-Path $output 'logs/native-desktop-build.log') -PathType Leaf)
              RUST_TEST = (Test-Path -LiteralPath (Join-Path $output 'logs/native-rust-test-compile.log') -PathType Leaf)
              AGENT_PACKAGE_MANIFEST = (Test-Path -LiteralPath (Join-Path $output 'build/package/bootstrap/package-manifest.json') -PathType Leaf)
              AGENT_SETUP_BUNDLE = (Test-Path -LiteralPath (Join-Path $output 'build/IWXA-Personal-Agent-Windows-Setup.exe') -PathType Leaf)
            }
            foreach ($key in $nativeFlags.Keys) {
              if ($nativeFlags[$key]) {
                Write-Host ('G4_AGENT06_NATIVE_PACKAGE_PHASE_REACHED ' + $key)
              }
            }
