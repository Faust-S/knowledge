name: T3 G4 installed pinned current Personal Agent 0.6 Windows
on:
  push:
    branches:
      - work/2026-11-10-t3-t2-activity-projection
      - qa/2026-11-19-software-agent-current
      - qa/2026-11-20-agent06-current-native-capture
    paths:
      - .github/workflows/t3-g4-installed-current-agent06.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t3-g4-installed-current-agent06-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed-current-agent06:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qualify-installed-agent-g4]') }}
    runs-on: windows-2022
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Stage exact central Agent 0.6 source without historical binary evidence
        uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: ffa56fee6f971afa74b6b49ccfb891fca0e97225
          token: ${{ secrets.AGENT || secrets.DOMEN || secrets.T3 }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /desktop/
            /runtime/
            /tools/
            /config/
            /adapters/
            /cells/
            /providers/
            /schemas/
            /profiles/
            /surfaces/
            /skills/
            /operational-skills/
            /automation/
            /authority/
            /Human/
            /scripts/
            /webui/
            /windows/
            /qualification/phase1/*.ps1
            /qualification/phase1/*.py
            /qualification/phase1/*.json
            /qualification/phase1/*.mjs
            /requirements.txt
            /requirements-ci.txt
            /.gitignore
            /AGENTS.md
          path: .private/agent
      - name: Stage exact original product-neutral Setup Core owner
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: c10e193846a0ea4c73cabe3744aa7db82439d54e
          token: ${{ secrets.CENTER || secrets.DOMEN || secrets.T3 }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            installer
          path: .private/setup-core
      - name: Stage exact source-qualified original One Core G4 candidate
        uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: f42e53cd28c881b2b8e04199595f9d7991f34414
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            packages/t3-core
          path: .g4-pinned-one-core
      - name: Verify all three exact pinned sources before native build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $agent = (& git -C .private/agent rev-parse HEAD).Trim()
          $setup = (& git -C .private/setup-core rev-parse HEAD).Trim()
          $core = (& git -C .g4-pinned-one-core rev-parse HEAD).Trim()
          if ($agent -ne 'ffa56fee6f971afa74b6b49ccfb891fca0e97225' -or
              $setup -ne 'c10e193846a0ea4c73cabe3744aa7db82439d54e' -or
              $core -ne 'f42e53cd28c881b2b8e04199595f9d7991f34414') {
            throw 'G4_AGENT_EXACT_INSTALLED_SOURCE_PIN_MISMATCH'
          }
          $ignoreFile = '.private/agent/.gitignore'
          if (-not (Test-Path -LiteralPath $ignoreFile -PathType Leaf)) {
            throw 'G4_INSTALLED_AGENT_TRACKED_GITIGNORE_MISSING'
          }
          $ignoreRules = @(Get-Content -LiteralPath $ignoreFile)
          if (-not ($ignoreRules -ccontains 'build/') -or
              -not ($ignoreRules -ccontains 'dist/') -or
              -not ($ignoreRules -ccontains '*.log')) {
            throw 'G4_INSTALLED_AGENT_RELEASE_IGNORE_RULES_MISMATCH'
          }
          Write-Host 'G4_INSTALLED_AGENT_SPARSE_RELEASE_IGNORE_GUARD_PASS'
          $lock = Get-Content -LiteralPath '.private/agent/config/public-module-sources.json' -Raw | ConvertFrom-Json
          $entries = @($lock.modules | Where-Object { $_.id -ceq 't3' })
          if ($entries.Count -ne 1 -or $entries[0].revision -cne $core) {
            throw 'G4_AGENT_INSTALLED_ONE_CORE_OWNER_PIN_MISMATCH'
          }
          $archive = '.g4-pinned-one-core/packages/t3-core/qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw 'G4_AGENT_ORIGINAL_T2_PINNED_ARCHIVE_MISSING'
          }
          $profile = Get-Content -LiteralPath '.private/agent/config/original-t2-agent-product.json' -Raw | ConvertFrom-Json
          if ($profile.schema -cne 'IWXA_AGENT_ORIGINAL_T2_PRODUCT_PROFILE/1' -or
              $profile.productId -cne 'iwxa.personal-agent' -or
              $null -ne $profile.authorizedResultRecipient -or
              $profile.installedAgentT3Mode -cne 'EXPLICIT_OPT_IN') {
            throw 'G4_INSTALLED_AGENT_DEFAULT_ATLAS_RECIPIENT_FORBIDDEN'
          }
          Write-Host 'G4_INSTALLED_AGENT_PRODUCT_NEUTRAL_NO_DEFAULT_RECIPIENT_PASS'
          Write-Host 'G4_INSTALLED_AGENT06_CURRENT_SOURCES_AND_T2_PREFLIGHT_PASS'
      - name: Check original Agent and Setup Git integrity in WindowsPowerShell 5.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIT_NO_LAZY_FETCH = '1'
          $source = @'
          param([string]$AgentRoot,[string]$SetupRoot)
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $git = Get-Command git.exe -ErrorAction Stop
          function ExactGitCheck([string]$root) {
            $head = @(& $git.Source -C $root rev-parse HEAD 2>$null)
            if ($LASTEXITCODE -ne 0 -or @($head).Count -ne 1 -or
                [string]$head[0] -cnotmatch '^[0-9a-f]{40}$') {
              throw 'G4_INSTALLED_SOURCE_GIT_IDENTITY_NOT_READABLE'
            }
            $dirty = @(& $git.Source -C $root status --porcelain --untracked-files=all 2>$null)
            if ($LASTEXITCODE -ne 0) { throw 'G4_INSTALLED_SOURCE_GIT_STATUS_UNAVAILABLE' }
            if (@($dirty | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count -gt 0) {
              throw 'G4_INSTALLED_SOURCE_GIT_DIRTY'
            }
          }
          ExactGitCheck $AgentRoot
          ExactGitCheck $SetupRoot
          Write-Output 'G4_INSTALLED_WINDOWS_PS51_GIT_PREFLIGHT_PASS'
          '@
          $probe = Join-Path $env:RUNNER_TEMP 'g4-ps51-original-git-preflight.ps1'
          [IO.File]::WriteAllText($probe,$source,[Text.UTF8Encoding]::new($false))
          $ps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          try {
            & $ps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $probe -AgentRoot (Resolve-Path '.private/agent').Path -SetupRoot (Resolve-Path '.private/setup-core').Path
            if ($LASTEXITCODE -ne 0) { throw 'G4_INSTALLED_WINDOWS_PS51_GIT_PREFLIGHT_FAILED' }
          } finally {
            Remove-Item -LiteralPath $probe -Force -ErrorAction SilentlyContinue
          }
      - name: Assert source owner and product-scoped storage authority paths
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $file=Join-Path $env:GITHUB_WORKSPACE '.private/agent/tools/qualify_setup_core_runtime.ps1'
          if(!(Test-Path -LiteralPath $file -PathType Leaf)){throw 'QA_AGENT_RUNTIME_WITNESS_ABSENT'}
          $raw=Get-Content -LiteralPath $file -Raw -Encoding UTF8
          if(-not $raw.Contains("IWXA\PersonalAgent\current-install.json") -or
             -not $raw.Contains("IWXA\PersonalAgent\storage-authority.json")){
            throw 'QA_AGENT_PRODUCT_SCOPED_AUTHORITY_PATH_NOT_UPDATED'
          }
          Write-Host 'QA_AGENT_LIVE_OWNER_PRODUCT_SCOPED_AUTHORITY_PIN_PASS'
      - name: Start independent read-only watcher for current installed Agent first screen
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'artifacts/agent-current'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $file = Join-Path $env:GITHUB_WORKSPACE 'tools/qa-agent-current-first-screen.ps1'
          $ps = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          if (!(Test-Path -LiteralPath $file)) { throw 'QA_AGENT_CAPTURE_WATCHER_MISSING' }
          $args = '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "' + $file + '" -OutputDir "' + $root + '"'
          $watcher = Start-Process -FilePath $ps -ArgumentList $args -PassThru -WindowStyle Hidden
          Write-Host 'QA_AGENT_NATIVE_FIRST_SCREEN_WATCHER_STARTED'
      - name: Build install and cold-qualify genuine current Agent Tauri with original T2/T3 One Dist
        shell: pwsh
        timeout-minutes: 72
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIT_NO_LAZY_FETCH = '1'
          $agent = (Resolve-Path -LiteralPath '.private/agent').Path
          $center = (Resolve-Path -LiteralPath '.private/setup-core').Path
          $core = (Resolve-Path -LiteralPath '.g4-pinned-one-core/packages/t3-core').Path
          $output = Join-Path $env:RUNNER_TEMP 'g4-installed-original-agent06'
          $cache = Join-Path $env:RUNNER_TEMP 'g4-installed-original-agent06-cache'
          $log = Join-Path $env:RUNNER_TEMP 'g4-installed-original-agent06-private-build.log'
          $script = Join-Path $agent 'tools/build_setup_core_windows_candidate.ps1'
          $powershell = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          if (-not (Test-Path -LiteralPath $script -PathType Leaf) -or
              -not (Test-Path -LiteralPath $powershell -PathType Leaf)) {
            throw 'G4_AGENT_ORIGINAL_SETUP_BUILDER_MISSING'
          }
          & $powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -CenterRoot $center -CenterCommit 'c10e193846a0ea4c73cabe3744aa7db82439d54e' -OutputRoot $output -ReleaseCacheRoot $cache -PublicT3CoreRoot $core -RequireOriginalT3 *> $log
          if ($LASTEXITCODE -ne 0) {
            # Only exact lower-case machine codes leave the private build log.
            # Do not print private source lines, stderr, paths, payloads or EXE.
            $stageFlags = [ordered]@{
              OUTPUT_ROOT = (Test-Path -LiteralPath $output -PathType Container)
              T2_EXTRACT = (Test-Path -LiteralPath (Join-Path $output 'build/qualified-original-t2') -PathType Container)
              T3_DEPENDENCIES = (Test-Path -LiteralPath (Join-Path $output 'logs/original-t3-dependencies.log') -PathType Leaf)
              T3_BUILD = (Test-Path -LiteralPath (Join-Path $output 'logs/original-t3-compiled-host.log') -PathType Leaf)
              ORIGINAL_ONE_DIST = (Test-Path -LiteralPath (Join-Path $output 'build/original-agent-one-dist-receipt.json') -PathType Leaf)
              AGENT_PACKAGE = (Test-Path -LiteralPath (Join-Path $output 'logs/private-build-result.json') -PathType Leaf)
              SETUP_BUILT = (Test-Path -LiteralPath (Join-Path $output 'IWXA-Private-SetupCore-Candidate.exe') -PathType Leaf)
            }
            foreach ($name in $stageFlags.Keys) {
              if ($stageFlags[$name]) { Write-Host ('G4_AGENT06_PRIVATE_BUILD_STAGE_REACHED ' + $name) }
            }
            # Fixed safe phase flags and machine codes only: the original
            # build log, Tauri compiler output and private absolute paths
            # remain inside the disposable Windows runner.
            $nativeFlags = [ordered]@{
              SETUP_STUB = (Test-Path -LiteralPath (Join-Path $output 'build/IWXA Personal Setup.stub.exe') -PathType Leaf)
              MANAGED_PYTHON = (Test-Path -LiteralPath (Join-Path $output 'build/test-python/current-python.txt') -PathType Leaf)
              NATIVE_ICON = (Test-Path -LiteralPath (Join-Path $output 'logs/native-desktop-icon.json') -PathType Leaf)
              U04_PREPARED = (Test-Path -LiteralPath (Join-Path $output 'logs/u04-source-preparation.json') -PathType Leaf)
              U04_STAGED = (Test-Path -LiteralPath (Join-Path $output 'logs/u04-stage.json') -PathType Leaf)
              DESKTOP_NPM = (Test-Path -LiteralPath (Join-Path $output 'logs/native-desktop-dependencies.log') -PathType Leaf)
              DESKTOP_TAURI = (Test-Path -LiteralPath (Join-Path $output 'logs/native-desktop-build.log') -PathType Leaf)
              RUST_TEST = (Test-Path -LiteralPath (Join-Path $output 'logs/native-rust-test-compile.log') -PathType Leaf)
              AGENT_PACKAGE_MANIFEST = (Test-Path -LiteralPath (Join-Path $output 'build/package/bootstrap/package-manifest.json') -PathType Leaf)
              AGENT_SETUP_BUNDLE = (Test-Path -LiteralPath (Join-Path $output 'build/IWXA-Personal-Agent-Windows-Setup.exe') -PathType Leaf)
            }
            foreach ($key in $nativeFlags.Keys) {
              if ($nativeFlags[$key]) {
                Write-Host ('G4_AGENT06_NATIVE_PACKAGE_PHASE_REACHED ' + $key)
              }
            }
            # Existing Agent release compiles native Rust tests AFTER
            # Tauri EXE. Report only compiler diagnostic IDs and safe phase
            # categories. Full Rust logs, paths, private symbols, and source
            # code must not appear in the public job log.
            foreach ($suffix in @('native-rust-test-compile.log.stderr',
                                  'native-desktop-build.log.stderr',
                                  'package/package-gate-failure.json')) {
              $candidateFile = Join-Path (Join-Path $output 'logs') $suffix
              if (-not (Test-Path -LiteralPath $candidateFile -PathType Leaf)) { continue }
              $raw = Get-Content -LiteralPath $candidateFile -Raw -ErrorAction SilentlyContinue
              if (-not $raw) { continue }
              $kind = if ($suffix -like 'native-rust*') { 'RUST_TEST' } elseif ($suffix -like 'native-desktop*') { 'TAURI' } else { 'PACKAGE' }
              $compilerCodes = @([regex]::Matches($raw, 'error\[(E[0-9]{4})\]') |
                ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique)
              foreach ($code in $compilerCodes) {
                Write-Host ('G4_AGENT06_COMPILER_ERROR_ID ' + $kind + ' ' + $code)
              }
              $classes = [ordered]@{
                RUST_COMPILE_FAILED = '(?:error: could not compile|error: aborting due to|compilation failed)'
                RUST_FEATURE_CONFLICT = 'failed to select a version|failed to resolve patches|conflicting versions'
                RUST_DEPENDENCY_DOWNLOAD = 'failed to download|failed to fetch|timed out|network failure'
                RUST_LINK_FAILED = '(?:linking with .* failed|fatal error LNK[0-9]{4}|link.exe.*failed)'
                MISSING_PROJECT_FILE = 'file not found|could not find|No such file or directory'
                WINDOWS_SHELL_FAILURE = 'NativeCommandError|CommandNotFoundException'
              }
              foreach ($name in $classes.Keys) {
                if ($raw -match $classes[$name]) {
                  Write-Host ('G4_AGENT06_COMPILER_ERROR_CLASS ' + $kind + ' ' + $name)
                }
              }
              if ($kind -eq 'PACKAGE') {
                try {
                  $failure = $raw | ConvertFrom-Json -ErrorAction Stop
                  $safeStage = [string]$failure.stage
                  if ($safeStage -match '^[a-z_]{3,60}$') {
                    Write-Host ('G4_AGENT06_PACKAGE_GATE_STAGE ' + $safeStage.ToUpperInvariant())
                  }
                  foreach ($field in @('error_code','error_detail')) {
                    foreach ($match in [regex]::Matches([string]$failure.$field,
                      '(?<![A-Za-z0-9_])(?:native_candidate|agent06_t3|phase1_package)_[a-z0-9_]{3,90}(?![A-Za-z0-9_])')) {
                      Write-Host ('G4_AGENT06_PACKAGE_GATE_CODE ' + $match.Value.ToUpperInvariant())
                    }
                  }
                } catch {
                  Write-Host 'G4_AGENT06_PACKAGE_GATE_JSON_UNCLASSIFIED'
                }
              }
            }
            # The existing product package builder emits a private Python
            # traceback/exception only inside this runner. Safely extract the
            # first machine-token following its fixed error prefix, NEVER
            # arbitrary stderr, paths, source names, or user content.
            $packageDiagnosticInputs = @(
              $log,
              (Join-Path $output 'logs/package-build-only.json'),
              (Join-Path $output 'logs/package/package-gate-failure.json')
            )
            foreach ($sourceLog in $packageDiagnosticInputs) {
              if (-not (Test-Path -LiteralPath $sourceLog -PathType Leaf)) { continue }
              $sourceText = Get-Content -LiteralPath $sourceLog -Raw -ErrorAction SilentlyContinue
              if (-not $sourceText) { continue }
              $messages = [regex]::Matches($sourceText,
                '(?i)IWXA_EXPLORER_BUILD_FAIL:\s*([a-z][a-z0-9_]{3,95})(?![a-z0-9_])')
              foreach ($message in @($messages | Select-Object -Last 3)) {
                Write-Host ('G4_AGENT06_PYTHON_PACKAGE_FAILURE_TOKEN ' +
                  $message.Groups[1].Value.ToUpperInvariant())
              }
              if ($sourceText -match '(?i)IWXA_EXPLORER_BUILD_FAIL' -and
                  $messages.Count -eq 0) {
                Write-Host 'G4_AGENT06_PYTHON_PACKAGE_FAILURE_UNCLASSIFIED'
              }
              $preciseCodes = [regex]::Matches($sourceText,
                '(?<![a-zA-Z0-9_])(?:agent06_original_t3|agent06_original_t2|original_agent_d6|desktop_native|release_worktree|release_payload|git_command|u01_pinned|k03_pinned)_[a-z0-9_]{3,96}(?![a-zA-Z0-9_])')
              foreach ($code in @($preciseCodes | Select-Object -Unique | Select-Object -Last 4)) {
                Write-Host ('G4_AGENT06_PYTHON_PACKAGE_SAFE_CODE ' +
                  $code.Value.ToUpperInvariant())
              }
            }
            $originalPipelineLog = Join-Path $output 'logs/private-build-result.json'
            if (Test-Path -LiteralPath $originalPipelineLog -PathType Leaf) {
              $nativeRaw = Get-Content -LiteralPath $originalPipelineLog -Raw -ErrorAction SilentlyContinue
              if ($nativeRaw) {
                $foundNativeCodes = [regex]::Matches($nativeRaw,
                  '(?<![A-Za-z0-9_])native_candidate_[a-z0-9_]{4,90}(?![A-Za-z0-9_])')
                foreach ($match in @($foundNativeCodes | Select-Object -Last 5)) {
                  Write-Host ('G4_AGENT06_NATIVE_PACKAGE_FAILURE_CODE ' + $match.Value.ToUpperInvariant())
                }
                $categories = [ordered]@{
                  POWERSHELL_NATIVE_COMMAND = 'NativeCommandError|NativeCommandException'
                  UNQUALIFIED_GIT_SOURCE = 'git\.exe.*(?:fatal:|error:)'
                  MISSING_ORIGINAL_TOOL = 'CommandNotFoundException|The term .* is not recognized'
                  RUST_BUILD_FAILURE = 'cargo.*(?:error|failed)|error\[E[0-9]{4}\]'
                  NODE_BUILD_FAILURE = 'npm error|npm ERR!|vite.*error'
                  WINDOWS_PRIVILEGE = 'access is denied|UnauthorizedAccessException'
                }
                foreach ($category in $categories.Keys) {
                  if ($nativeRaw -match $categories[$category]) {
                    Write-Host ('G4_AGENT06_NATIVE_PACKAGE_FAILURE_CLASS ' + $category)
                  }
                }
              }
            }
            if (Test-Path -LiteralPath $log -PathType Leaf) {
              $rawInfo = Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
              if ($rawInfo) {
                $classMatchers = [ordered]@{
                  POWERSHELL_PARSER = 'ParserError|ParseException'
                  COMMAND_MISSING = 'CommandNotFoundException|is not recognized as the name of a cmdlet'
                  ARGUMENT_BINDING = 'ParameterBindingException|NamedParameterNotFound'
                  GIT_COMMAND = 'git.exe|git identity failed'
                  PATH_MISSING = 'ItemNotFoundException|Cannot find path|does not exist'
                  ACCESS_DENIED = 'UnauthorizedAccessException|Access is denied'
                  NODE_TOOL = 'npm ERR!|npm error|Node.js'
                  PYTHON_TOOL = 'ModuleNotFoundError|ImportError'
                }
                foreach ($name in $classMatchers.Keys) {
                  if ($rawInfo -match $classMatchers[$name]) {
                    Write-Host ('G4_AGENT06_PRIVATE_BUILD_ERROR_CLASS ' + $name)
                  }
                }
              }
            }
            $safeCodes = @()
            if (Test-Path -LiteralPath $log -PathType Leaf) {
              foreach ($line in (Get-Content -LiteralPath $log -ErrorAction SilentlyContinue)) {
                foreach ($m in [regex]::Matches([string]$line,
                  '(?<![A-Za-z0-9_])(?:private_setup|original_t3|original_t2|agent_native|setup_core|private_package|native_candidate)_[a-z0-9_]{4,115}(?![A-Za-z0-9_])')) {
                  $safeCodes += [string]$m.Value
                }
              }
            }
            $uniqueCodes = @($safeCodes | Select-Object -Unique | Select-Object -Last 4)
            if ($uniqueCodes.Count -eq 0) {
              Write-Host 'G4_AGENT06_ORIGINAL_SETUP_FAILURE_CODE UNCLASSIFIED'
            } else {
              foreach ($item in $uniqueCodes) {
                Write-Host ('G4_AGENT06_ORIGINAL_SETUP_FAILURE_CODE ' + $item.ToUpperInvariant())
              }
            }
            throw 'G4_AGENT06_CURRENT_ORIGINAL_NATIVE_SETUP_BUILD_NOT_ACCEPTED'
          }
          $installed = Join-Path $output 'temporary-installed-fixture/installed-witness.json'
          $rollback = Join-Path $output 'temporary-rollback-fixture/rollback-witness.json'
          $package = Join-Path $output 'IWXA-Private-SetupCore-Candidate.exe'
          if (-not (Test-Path -LiteralPath $package -PathType Leaf) -or
              -not (Test-Path -LiteralPath $installed -PathType Leaf) -or
              -not (Test-Path -LiteralPath $rollback -PathType Leaf)) {
            throw 'G4_AGENT06_INSTALLED_NATIVE_PACKAGE_RECEIPT_MISSING'
          }
          $gui = Get-Content -LiteralPath $installed -Raw | ConvertFrom-Json
          $rb = Get-Content -LiteralPath $rollback -Raw | ConvertFrom-Json
          if ($gui.status -ne 'PASS' -or
              $gui.installed_native_cold_launch_verified -ne $true -or
              $gui.installed_real_qwen_native_gui_result_verified -ne $true -or
              $gui.installed_real_qwen_native_gui_submit_review_verified -ne $true -or
              $gui.installed_core_readbacks_after_restart_verified -ne $true -or
              $rb.status -ne 'PASS' -or
              $rb.installed_file_identity_after_rollback -ne $true) {
            throw 'G4_AGENT06_ORIGINAL_T2_NATIVE_GUI_RECEIPT_INVALID'
          }
          Write-Host 'G4_AGENT06_INSTALLED_GENUINE_SETUP_AND_ONE_CORE_PASS'
          Write-Host 'G4_AGENT06_INSTALLED_NATIVE_GUI_QWEN_REVIEW_COLD_PASS'
          Write-Host 'G4_AGENT06_INSTALLED_SETUP_CORE_REPAIR_ROLLBACK_PASS'
          Write-Host 'G4_AGENT06_INSTALLED_NOT_CROSS_USER_ADMIN_ACCEPT_APPLY'
      - name: Independently qualify real Agent GUI image even when full Setup fails
        if: always()
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:GITHUB_WORKSPACE 'artifacts/agent-current'
          $image = Join-Path $folder 'agent-native-current-first-screen.png'
          $manifest = Join-Path $folder 'capture-manifest.json'
          for ($n=0;$n -lt 18;$n++) {
            if ((Test-Path -LiteralPath $image -PathType Leaf) -and (Test-Path -LiteralPath $manifest -PathType Leaf)) { break }
            Start-Sleep -Seconds 1
          }
          if (!(Test-Path -LiteralPath $image -PathType Leaf) -or !(Test-Path -LiteralPath $manifest -PathType Leaf)) {
            Write-Host 'QA_AGENT_NATIVE_FIRST_SCREEN_NOT_OBSERVED'
          } else {
            $proof = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
            $sha = (Get-FileHash -LiteralPath $image -Algorithm SHA256).Hash.ToLowerInvariant()
            $nativeDraft = Join-Path $env:RUNNER_TEMP 'g4-installed-original-agent06/temporary-installed-fixture/native-gui-draft.json'
            $draftAccepted = $false
            if (Test-Path -LiteralPath $nativeDraft -PathType Leaf) {
              try {
                $saved = Get-Content -LiteralPath $nativeDraft -Raw | ConvertFrom-Json
                $draftAccepted = ($saved.status -ceq 'PASS' -and $saved.input -ceq 'NATIVE_WINDOWS_UI_AUTOMATION')
              } catch {}
            }
            $stateFile=Join-Path $folder 'capture-state.json'
            $stateOk=$false
            if (Test-Path -LiteralPath $stateFile -PathType Leaf) {
              try {
                $observed=Get-Content -LiteralPath $stateFile -Raw | ConvertFrom-Json
                $stateOk=($observed.exactInstalledExeVerified -and $observed.titledWindowSeen -and $observed.genuineUiControlsSeen)
              } catch {}
            }
            if (!$draftAccepted -or !$stateOk) {
              Write-Host 'QA_AGENT_NATIVE_SCREEN_NOT_LINKED_TO_VERIFIED_GUI_DRAFT'
            } elseif ($proof.originalAgentSha -cne 'ffa56fee6f971afa74b6b49ccfb891fca0e97225' -or
                $proof.screenshotSha256 -cne $sha -or
                $proof.windowTitle -cne 'IWXA Personal' -or
                $proof.status -cne 'CAPTURED_REQUIRES_VISUAL_REVIEW' -or
                (Get-Item -LiteralPath $image).Length -lt 6000) {
              Write-Host 'QA_AGENT_NATIVE_FIRST_SCREEN_REJECTED'
            } else {
              Add-Content -LiteralPath $env:GITHUB_ENV -Value 'QA_AGENT_SCREEN_ACCEPTED=1'
              Write-Host ('QA_AGENT_GUI_IMAGE_PROVENANCE_PASS sha256=' + $sha)
              Write-Host 'QA_AGENT_GUI_IMAGE_NOT_RELEASE_ACCEPTANCE'
            }
          }
      - name: Classify original Setup Core failure by allowlisted code and stage only
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'g4-installed-original-agent06'
          $sources = @(
            (Join-Path $dir 'logs/public-test-local-result.txt'),
            (Join-Path $env:RUNNER_TEMP 'g4-installed-original-agent06-private-build.log')
          )
          $codes = @()
          foreach ($log in $sources) {
            if (!(Test-Path -LiteralPath $log -PathType Leaf)) { continue }
            $raw = Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
            if (!$raw) { continue }
            $pattern = '(?i)(?<![A-Za-z0-9_])(?:SETUP_LOCAL|AGENT_SETUP|AGENT_NATIVE_GUI|IWXA_SETUP_LOCAL)_[A-Z0-9_]{3,100}(?![A-Za-z0-9_])'
            foreach ($match in [regex]::Matches($raw, $pattern)) {
              $codes += $match.Value.ToUpperInvariant()
            }
          }
          foreach ($code in @($codes | Select-Object -Unique | Select-Object -Last 15)) {
            Write-Host ('QA_AGENT_SETUP_SAFE_ERROR_CODE ' + $code)
          }
          $root = Join-Path $dir 'temporary-installed-fixture'
          foreach ($part in @('native-gui-draft','installed-real-qwen-proof')) {
            $present=(Test-Path -LiteralPath (Join-Path $root ($part+'.json')) -PathType Leaf)
            Write-Host ('QA_AGENT_NATIVE_PROOF_FILE ' + $part.ToUpperInvariant() + ' ' + $(if($present){'PRESENT'}else{'ABSENT'}))
          }
          $local = Join-Path $root 'isolated-profile/AppData/Local/IWXA'
          foreach ($name in @('current-install.json','storage-authority.json')) {
            $present=(Test-Path -LiteralPath (Join-Path $local $name) -PathType Leaf)
            $category=if($name -like 'current-*'){'INSTALL_MARKER'}else{'STORAGE_MARKER'}
            Write-Host ('QA_AGENT_AUTHORITY_STAGE ' + $category + ' ' + $(if($present){'PRESENT'}else{'ABSENT'}))
          }
          foreach ($part in @('identity','preflight','installed','verified','locations-readback','installed-witness','repair','verified-after-repair','confirmed','removed')) {
            $file = Join-Path $root ($part + '.json')
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { continue }
            try {
              $record = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
              $status = [string]$record.status
              if ($status -notmatch '^[A-Z0-9_]{2,100}$') { $status = 'REDACTED' }
              Write-Host ('QA_AGENT_SETUP_SAFE_STAGE ' + $part.ToUpperInvariant() + ' ' + $status)
              if ($part -ceq 'installed-witness') {
                foreach ($field in @('phase','failure_code','last_operation','last_checkpoint')) {
                  $value = [string]$record.$field
                  if ($value -match '^[A-Z0-9_]{2,100}$') {
                    Write-Host ('QA_AGENT_WITNESS_SAFE_' + $field.ToUpperInvariant() + ' ' + $value)
                  }
                }
              }
            } catch {
              Write-Host ('QA_AGENT_SETUP_SAFE_STAGE ' + $part.ToUpperInvariant() + ' INVALID')
            }
          }
      - name: Erase private source model caches logs and native binaries
        if: always()
        shell: pwsh
        run: |
          $targets = @('.private','.g4-pinned-one-core',
            (Join-Path $env:RUNNER_TEMP 'g4-installed-original-agent06'),
            (Join-Path $env:RUNNER_TEMP 'g4-installed-original-agent06-cache'),
            (Join-Path $env:RUNNER_TEMP 'g4-installed-original-agent06-private-build.log'))
          foreach ($path in $targets) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Force -Recurse -ErrorAction SilentlyContinue
            }
          }
          Write-Host 'G4_AGENT06_PRIVATE_SOURCE_AND_NATIVE_ARTIFACTS_NOT_PUBLISHED'
      - name: Retain independently verified real Agent first-screen image only
        if: always() && env.QA_AGENT_SCREEN_ACCEPTED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: agent06-current-native-first-screen
          path: artifacts/agent-current/
          if-no-files-found: error
          retention-days: 5

  agent-source-mutation-probe:
    if: contains(github.event.head_commit.message, '[qualify-agent-package-source]')
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage exact central Agent 0.6 source without historical binary evidence
        uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: ffa56fee6f971afa74b6b49ccfb891fca0e97225
          token: ${{ secrets.AGENT || secrets.DOMEN || secrets.T3 }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /desktop/
            /runtime/
            /tools/
            /config/
            /adapters/
            /cells/
            /providers/
            /schemas/
            /profiles/
            /surfaces/
            /skills/
            /operational-skills/
            /automation/
            /authority/
            /Human/
            /scripts/
            /webui/
            /windows/
            /qualification/phase1/*.ps1
            /qualification/phase1/*.py
            /qualification/phase1/*.json
            /qualification/phase1/*.mjs
            /requirements.txt
            /requirements-ci.txt
            /.gitignore
            /AGENTS.md
          path: .private/agent
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify private Agent source remains clean across public module staging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIT_NO_LAZY_FETCH = '1'
          $repo = (Resolve-Path -LiteralPath '.private/agent').Path
          function Verify([string]$stage) {
            $lines = @(& git -C $repo status --porcelain=v1 --untracked-files=all 2>$null)
            if ($LASTEXITCODE -ne 0) { throw 'G4_AGENT_GIT_STATUS_UNAVAILABLE' }
            $dirty = @($lines | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            if ($dirty.Count) {
              Write-Host ('G4_AGENT_SOURCE_DIRTY_STAGE ' + $stage)
              Write-Host ('G4_AGENT_SOURCE_DIRTY_TRACKED_COUNT ' + @($dirty | Where-Object { $_ -notmatch '^\?\?' }).Count)
              Write-Host ('G4_AGENT_SOURCE_DIRTY_UNTRACKED_COUNT ' + @($dirty | Where-Object { $_ -match '^\?\?' }).Count)
              throw 'G4_AGENT_SOURCE_MUTATION_REPRODUCED'
            }
            Write-Host ('G4_AGENT_SOURCE_CLEAN_STAGE ' + $stage)
          }
          function Execute([string]$stage,[string[]]$nodeArgs) {
            Push-Location $repo
            try {
              & node @nodeArgs *> (Join-Path $env:RUNNER_TEMP ('g4-agent-' + $stage + '.log'))
              if ($LASTEXITCODE -ne 0) { throw ('G4_AGENT_MODULE_STAGE_FAILED_' + $stage) }
            } finally { Pop-Location }
            Verify $stage
          }
          Verify 'CHECKOUT'
          Execute 'U04_FETCH' @('scripts/prepare-public-modules.mjs','--only-u04','--fetch')
          Execute 'U04_STAGE' @('scripts/stage-u04-desktop.mjs',(Join-Path $repo 'build/u04-owner-sources'),(Join-Path $env:RUNNER_TEMP 'g4-agent-u04-desktop'))
          Execute 'K03_FETCH' @('scripts/prepare-public-modules.mjs','--only-k03','--fetch')
          Execute 'U01_FETCH' @('scripts/prepare-public-modules.mjs','--only-u01','--fetch')
          Write-Host 'G4_AGENT_PUBLIC_MODULE_STAGING_CLEAN_PASS'
      - name: Purge private source and temporary logs
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.private' -Force -Recurse -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'g4-agent-*' -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host 'G4_AGENT_SOURCE_PROBE_NO_PRIVATE_ARTIFACTS_PUBLISHED'
