name: d02-personal-activity-source
on:
  push:
    branches:
      - work/2026-11-24-d02-personal-activity-qualification
    paths:
      - .github/workflows/d02-personal-activity-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Exact canonical Club source
        uses: actions/checkout@v4
        with:
          repository: Faust-S/club
          ref: cd6c0e9d1038e1abeaa9b4b57c17364e0fa6039d
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: owner
      - name: Exact Club website source
        uses: actions/checkout@v4
        with:
          repository: Faust-S/club.iwxa.ru
          ref: 9df9869dd17fc524296ce5e157daa9c6cc9c485d
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - name: Checkout exact original shared assistant validator
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 9f41447197251d41e69fbcb98e52ef1050754ec2
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: bli-owner
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify canonical semantics and generated skills
        working-directory: owner
        shell: bash
        run: |
          set -euo pipefail
          if ! (node scripts/club-skill-authoring.mjs generate && git diff --exit-code && node scripts/club-skill-authoring.mjs check && node --test tests/personal-economy.test.mjs tests/assistant-skills.test.mjs tests/personal-week-plan.test.mjs tests/today-overview.test.mjs tests/personal-cash-calendar.test.mjs tests/goal-portfolio.test.mjs tests/personal-evidence.test.mjs tests/personal-evidence-portfolio.test.mjs tests/evidence-portfolio.test.mjs tests/activity-review.test.mjs tests/week-change-preview.test.mjs) > "$RUNNER_TEMP/d02-owner.private" 2>&1; then
            echo D02_CANONICAL_FINANCE_AND_SKILLS=FAIL
            grep -E '^not ok [0-9]+ - |^# (tests|pass|fail) ' "$RUNNER_TEMP/d02-owner.private" | head -20 || true
            exit 1
          fi
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/d02-owner.private"
          echo D02_CANONICAL_FINANCE_AND_SKILLS=PASS
      - name: Execute official skills import and verify exact resulting blobs
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          if ! (npm run t3:skills:import -- "$GITHUB_WORKSPACE/owner" cd6c0e9d1038e1abeaa9b4b57c17364e0fa6039d && npm run t3:skills:import -- "$GITHUB_WORKSPACE/owner" cd6c0e9d1038e1abeaa9b4b57c17364e0fa6039d --apply && npm run t3:skills:check) > "$RUNNER_TEMP/d02-import.private" 2>&1; then
            echo D02_OFFICIAL_SKILLS_IMPORT=FAIL
            grep -Eo 'CLUB_(SKILL_IMPORT|T3_SKILLS)_[A-Z0-9_]+' "$RUNNER_TEMP/d02-import.private" | sort -u | head -20 || true
            exit 1
          fi
          echo "D02_IMPORTED_SKILL_BLOB=$(git hash-object assets/club-assistant-skills.json)"
          echo "D02_IMPORTED_PIN_BLOB=$(git hash-object runtime/t3-platform/0.3.1-rc.1/domain-skills.json)"
          echo D02_OFFICIAL_SKILLS_IMPORT=PASS
      - name: Validate imported bytes with exact original shared T3 runtime
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {loadSkillPack,validateSkillPack} from '../bli-owner/browser-local-inference/domain-assistant/skill-runtime.mjs';
          const raw=readFileSync('assets/club-assistant-skills.json','utf8');
          const origin='https://club.iwxa.ru';
          const loaded=await loadSkillPack('/assets/club-assistant-skills.json',{
            origin,request:async url=>({ok:true,redirected:false,url,text:async()=>raw})
          });
          const original=JSON.parse(raw);
          assert.equal(loaded.version,original.version);
          assert.equal(loaded.skills.length,original.skills.length);
          assert.equal(loaded.formHints.length,original.formHints.length);
          assert.equal(loaded.resultHints.length,original.resultHints.length);
          const bad=structuredClone(original);
          bad.skills[0].limit='a'.repeat(451);
          assert.throws(()=>validateSkillPack(bad),/T3_ASSISTANT_SKILLS_ENTRY/);
          console.log('D02_ORIGINAL_T3_IMPORTED_SKILL_RUNTIME=PASS');
          NODE
      - name: Verify exact economic logic projection and targeted regression
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const owner=readFileSync('../owner/logic/personal-economy.mjs','utf8').split('export ')[1].trim();
          const source=readFileSync('assets/site.js','utf8');
          const a=source.indexOf('// BEGIN CLUB_CANONICAL_PERSONAL_ECONOMY'),b=source.indexOf('// END CLUB_CANONICAL_PERSONAL_ECONOMY',a);
          assert.ok(a>=0&&b>a);
          assert.equal(source.slice(source.indexOf('\n',a)+1,b).trim(),owner);
          for(const name of ['personal-week-plan','today-overview','personal-cash-calendar','goal-portfolio','personal-evidence','evidence-portfolio','goal-lifecycle','activity-review','week-change-preview']){
            const canonical=readFileSync('../owner/logic/'+name+'.mjs','utf8').replaceAll("from './","from './club-");
            assert.equal(readFileSync('assets/club-'+name+'.mjs','utf8'),canonical);
          }
          console.log('D02_CANONICAL_FINANCE_AND_WEEK_PROJECTIONS=PASS');
          NODE
          if ! node --check assets/site.js > "$RUNNER_TEMP/d02-syntax.private" 2>&1; then
            echo D02_SITE_SYNTAX=FAIL
            exit 1
          fi
          failed=0
          for suite in test:club-personal-economy test:club-cash-calendar-route test:club-case-03-native-tools test:club-case-route-integration test:club-case-02-route-integration test:club-work-ledger-integration test:club-unified-ux test:club-author-voice test:club-assistant-skills test:club-personal-week-plan test:club-today-overview test:club-native-today test:club-native-project-restoration test:club-native-restore-preselect test:club-hub test:club-personal-cash-calendar test:club-personal-cash-calendar-ui test:club-family-options-ui test:club-tool-groups test:club-goal-map test:club-project-delete-integrity test:club-native-edit-route test:club-personal-evidence test:club-evidence-portfolio test:club-activity-review; do
            if ! npm run "$suite" > "$RUNNER_TEMP/d02-site.private" 2>&1; then
              echo "D02_TARGETED_SUITE=FAIL $suite"
              grep -E '^not ok [0-9]+ - |^# (tests|pass|fail) ' "$RUNNER_TEMP/d02-site.private" | head -15 || true
              failed=1
            else
              echo "D02_TARGETED_SUITE=PASS $suite"
              grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/d02-site.private"
            fi
          done
          test "$failed" = 0
      - name: Remove private logs
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/d02-*.private
