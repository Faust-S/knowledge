name: K05 Agent 0.6 effectiveness source qualification

on:
  push:
    branches:
      - work/2026-11-15-agent06-effectiveness-evaluation
    paths:
      - 'research/cross-lab/k05_agent06_effectiveness.py'
      - 'research/cross-lab/k05_agent06_admission.py'
      - 'research/cross-lab/tests/test_k05_agent06_admission.py'
      - 'research/cross-lab/k05_agent06_otlp.py'
      - 'research/cross-lab/k05_agent06_owner_port.py'
      - 'research/cross-lab/k05_agent06_t3_process.mjs'
      - 'research/cross-lab/k05_agent06_atlas_planning.mjs'
      - 'research/cross-lab/tests/test_k05_agent06_atlas_planning.test.mjs'
      - 'research/cross-lab/tests/test_k05_agent06_t3_process.test.mjs'
      - 'research/cross-lab/tests/test_k05_agent06_owner_port.py'
      - 'research/cross-lab/tests/test_k05_agent06_effectiveness.py'
      - '.github/workflows/k05-agent06-effectiveness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python syntax validation
        run: python -m compileall -q research/cross-lab/k05_agent06_effectiveness.py research/cross-lab/k05_agent06_admission.py research/cross-lab/k05_agent06_otlp.py research/cross-lab/k05_agent06_owner_port.py research/cross-lab/tests/test_k05_agent06_effectiveness.py research/cross-lab/tests/test_k05_agent06_owner_port.py
      - name: New source-bound measurement and negative tests
        run: python -W error::ResourceWarning -m unittest research/cross-lab/tests/test_k05_agent06_effectiveness.py -v
      - name: Source replay, verified process exposure, ROI and negative tests
        run: python -W error::ResourceWarning -m unittest research/cross-lab/tests/test_k05_agent06_admission.py -v
      - name: Original owner-port readback and forged-receipt negative tests
        run: python -W error::ResourceWarning -m unittest research/cross-lab/tests/test_k05_agent06_owner_port.py -v
      - name: Full existing K05 Python regression
        run: python -W error::ResourceWarning -m unittest discover -s research/cross-lab/tests -p 'test_*.py' -v
      - name: Existing K05 Agent graph and source gates
        run: |
          python -W error::ResourceWarning -m unittest research/cross-lab/tests/test_k05_agent05_final_result_binding.py -v
          python -W error::ResourceWarning -m unittest research/cross-lab/tests/test_k05_agent05_graph_readback.py -v
          python -W error::ResourceWarning -m unittest research/cross-lab/tests/test_k05_agent05_observations.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout exact public T3 Process Intelligence owner
        uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: work/2026-11-10-t3-t2-activity-projection
          path: .t3-owner
          persist-credentials: false
      - name: Record exact current original T3 HEAD and TREE
        run: |
          test -f .t3-owner/packages/t3-core/src/modules/base/features/project-process/process-intelligence.mjs
          echo "K05_T3_OWNER_HEAD=$(git -C .t3-owner rev-parse HEAD)"
          echo "K05_T3_OWNER_TREE=$(git -C .t3-owner rev-parse 'HEAD^{tree}')"
      - name: K05 read-only projection from actual original T3 code
        env:
          K05_T3_OWNER_ROOT: .t3-owner/packages/t3-core
        run: node --test research/cross-lab/tests/test_k05_agent06_t3_process.test.mjs
      - name: Checkout public original Atlas planning owner, read-only
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: work/2026-11-14-atlas-0-8
          path: .atlas-owner
          persist-credentials: false
      - name: Record actual original Atlas HEAD and TREE
        run: |
          test -f .atlas-owner/src/planning.mjs
          echo "K05_ATLAS_OWNER_HEAD=$(git -C .atlas-owner rev-parse HEAD)"
          echo "K05_ATLAS_OWNER_TREE=$(git -C .atlas-owner rev-parse 'HEAD^{tree}')"
      - name: Atlas plan does not become actual ROI
        env:
          K05_ATLAS_OWNER_ROOT: .atlas-owner
        run: node --test research/cross-lab/tests/test_k05_agent06_atlas_planning.test.mjs
      - name: No private input or external services
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('research/cross-lab/k05_agent06_otlp.py').read_text()
          assert 'requests' not in source and 'urllib' not in source
          assert 'http.client' not in source and 'socket' not in source
          print('K05_AGENT06_PUBLIC_CONTRACT_ONLY_NO_PRIVATE_CHECKOUT')
          PY
