name: D07 professional service cards and T2 order launch
on:
  push:
    branches: [work/2026-11-22-d07-methodology-v13]
    paths: [.github/workflows/d07-service-card-qualification.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d07-card-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify-card:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact domain revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod
          ref: 03293f3f2807ed8ed5ac20846c133c836f8566e8
          token: ${{ secrets.DOMEN }}
          path: subject
          persist-credentials: false
      - name: Checkout exact website revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: 57af20a8c534ba7b2ffa2fbd101a04d7ad77f72e
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - name: Verify private revisions, directory and technology parity
        run: |
          test "$(git -C subject rev-parse HEAD)" = "03293f3f2807ed8ed5ac20846c133c836f8566e8"
          test "$(git -C site rev-parse HEAD)" = "57af20a8c534ba7b2ffa2fbd101a04d7ad77f72e"
          for f in service-subject-protocols.ts service-subject-it-router.ts service-subject-it-printer.ts service-subject-it-wifi.ts service-subject-it-software.ts service-subject-code-audit.ts service-subject-it-batch-b.ts service-subject-antivirus-inspection.ts service-subject-video-surveillance.ts service-subject-database.ts service-subject-laptop-cleaning.ts service-subject-crm-setup.ts service-subject-laptop-repair.ts service-subject-domain-transfer.ts service-subject-seo.ts service-subject-desktop-pc-repair.ts service-subject-plumbing-b.ts service-subject-plumbing-c.ts service-manual-variant-closure.ts service-site-release-gate.ts; do
            cmp "subject/src/domain/$f" "site/src/domain/$f"
          done
          cmp subject/src/data/serviceDirectory.ts site/src/data/serviceDirectory.ts
          cmp subject/src/data/services/kompyutery-it-sayty/nastroyka-routera.ts site/src/data/services/kompyutery-it-sayty/nastroyka-routera.ts
          cmp subject/src/data/services/kompyutery-it-sayty/nastroyka-printera.ts site/src/data/services/kompyutery-it-sayty/nastroyka-printera.ts
          cmp subject/src/data/services/kompyutery-it-sayty/nastroyka-wifi.ts site/src/data/services/kompyutery-it-sayty/nastroyka-wifi.ts
          cmp subject/src/data/services/kompyutery-it-sayty/ustanovka-po.ts site/src/data/services/kompyutery-it-sayty/ustanovka-po.ts
          cmp subject/src/data/services/kompyutery-it-sayty/audit-koda-sayta.ts site/src/data/services/kompyutery-it-sayty/audit-koda-sayta.ts
          cmp subject/src/data/services/kompyutery-it-sayty/antivirusnaya-proverka.ts site/src/data/services/kompyutery-it-sayty/antivirusnaya-proverka.ts
          cmp subject/src/data/services/kompyutery-it-sayty/nastroyka-videonablyudeniya.ts site/src/data/services/kompyutery-it-sayty/nastroyka-videonablyudeniya.ts
          cmp subject/src/data/services/kompyutery-it-sayty/baza-dannyh.ts site/src/data/services/kompyutery-it-sayty/baza-dannyh.ts
          cmp subject/src/data/services/kompyutery-it-sayty/chistka-noutbuka.ts site/src/data/services/kompyutery-it-sayty/chistka-noutbuka.ts
          cmp subject/src/data/services/kompyutery-it-sayty/nastroyka-crm.ts site/src/data/services/kompyutery-it-sayty/nastroyka-crm.ts
          cmp subject/src/data/services/kompyutery-it-sayty/remont-noutbuka.ts site/src/data/services/kompyutery-it-sayty/remont-noutbuka.ts
          cmp subject/src/data/services/kompyutery-it-sayty/perenos-domena.ts site/src/data/services/kompyutery-it-sayty/perenos-domena.ts
          cmp subject/src/data/services/kompyutery-it-sayty/seo-prodvizhenie.ts site/src/data/services/kompyutery-it-sayty/seo-prodvizhenie.ts
          cmp subject/src/data/services/kompyutery-it-sayty/remont-kompyutera.ts site/src/data/services/kompyutery-it-sayty/remont-kompyutera.ts
          echo D07_SITE_CARD_PARITY=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"
      - name: Frozen dependencies
        working-directory: site
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/d07-card-install.log" 2>&1 || {
            echo D07_CARD_INSTALL=FAIL; exit 1;
          }
          echo D07_CARD_INSTALL=PASS
      - name: Regression for all individual professional cards and real T2 routes
        working-directory: site
        run: |
          node --import tsx --test --test-reporter=tap \
            scripts/tests/d07-professional-card-release.test.mjs \
            scripts/tests/d07-professional-form-release.test.mjs \
            scripts/tests/d07-service-site-release-gate.test.mjs \
            scripts/tests/d07-startable-catalog.test.mjs \
            scripts/tests/d07-public-navigation-integrity.test.mjs \
            scripts/tests/d07-subject-protocols.test.mjs \
            scripts/tests/d07-methodology-top500.test.mjs \
            scripts/tests/d07-manual-variant-closure.test.mjs \
            scripts/tests/d07-plumbing-b-professional-methods.test.mjs \
            scripts/tests/d07-plumbing-c-professional-methods.test.mjs \
            scripts/tests/d07-it-network-peripheral-methods.test.mjs \
            scripts/tests/d07-it-software-method.test.mjs scripts/tests/d07-it-code-audit.test.mjs scripts/tests/d07-it-tls-variation.test.mjs scripts/tests/d07-it-antivirus-method.test.mjs scripts/tests/d07-it-mail-variation.test.mjs scripts/tests/d07-it-cctv-professional.test.mjs scripts/tests/d07-it-database-professional.test.mjs scripts/tests/d07-it-laptop-cleaning.test.mjs scripts/tests/d07-it-crm-professional.test.mjs scripts/tests/d07-it-laptop-repair.test.mjs scripts/tests/d07-domain-transfer-professional.test.mjs scripts/tests/d07-it-seo-professional.test.mjs scripts/tests/d07-it-desktop-repair-professional.test.mjs \
            scripts/tests/d07-generated-service-plans.test.mjs \
            scripts/tests/d07-workspace-direct-entry.test.mjs \
            > "$RUNNER_TEMP/d07-card-tests.log" 2>&1 || {
              echo D07_CARD_REGRESSION=FAIL
              grep -A 19 -E '^not ok' "$RUNNER_TEMP/d07-card-tests.log" | head -105 || true; grep -E '^# (tests|pass|fail)' "$RUNNER_TEMP/d07-card-tests.log" | tail -4 || true
              exit 1
            }
          echo D07_CARD_REGRESSION=PASS
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/d07-card-tests.log" | tail -3
      - name: Static TypeScript
        working-directory: site
        run: |
          bun x tsc --noEmit > "$RUNNER_TEMP/d07-card-types.log" 2>&1 || {
            echo D07_CARD_TYPES=FAIL
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/d07-card-types.log" | head -15 || true
            exit 1
          }
          echo D07_CARD_TYPES=PASS
      - name: Build actual deep-link HTML for all professional cards
        working-directory: site
        run: |
          node scripts/build-d07-clean.mjs > "$RUNNER_TEMP/d07-card-build.log" 2>&1 || {
            echo D07_CARD_PRERENDER=FAIL
            grep -E 'D07_PUBLIC_BUILD_STEP_FAIL|quality:gate:.*FAILED|Error:|error TS[0-9]+|\[check-|\[prerender\]' "$RUNNER_TEMP/d07-card-build.log" | tail -20 || true
            exit 1
          }
          echo D07_CARD_PRERENDER=PASS
          grep 'D07_PUBLIC_BUILD_STEP_PASS=' "$RUNNER_TEMP/d07-card-build.log" | tail -7
      - name: Inspect every physical HTML page and launch link
        working-directory: site
        run: |
          node --import tsx --input-type=module - <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          import {SUBJECT_PROTOCOLS} from './src/domain/service-subject-protocols.ts';
          import {siteRoutes} from './src/site-routes.ts';
          let direct=0,seo=0;
          for(const p of SUBJECT_PROTOCOLS){
            const route='/uslugi/'+p.categorySlug+'/'+p.serviceSlug+'/';
            const file='dist'+route+'index.html';
            if(!existsSync(file))throw Error('D07_CARD_MISSING_PHYSICAL_HTML:'+route);
            const html=readFileSync(file,'utf8');
            if(!/<h1[ >]/i.test(html))throw Error('D07_CARD_H1_MISSING:'+route);
            if(!siteRoutes.includes(route)){
              if(!html.includes('d07-professional-service-card')||
                 !html.includes('d07-professional-start-order')||
                 !html.includes('/workspace/?new=1')||
                 !html.includes('noindex'))
                 throw Error('D07_CARD_NO_T2_LINK_OR_CONTENT:'+route);
              for(const op of p.operations)
                if(!html.includes('data-operation-id="'+op.id+'"'))
                  throw Error('D07_CARD_OPERATION_LOST:'+p.id+'/'+op.id);
              direct++;
            }else seo++;
          }
          if(direct+seo!==SUBJECT_PROTOCOLS.length||direct<70)
            throw Error('D07_CARD_PHYSICAL_COUNT_MISMATCH');
          console.log('D07_CARD_PHYSICAL_HTML=PASS');
          console.log('D07_CARD_NEW_DIRECT_ROUTES='+direct);
          console.log('D07_CARD_EXISTING_EDITORIAL_ROUTES='+seo);
          console.log('D07_CARD_UNIQUE_SUBJECT_TECHNOLOGIES='+SUBJECT_PROTOCOLS.length);
          NODE
      # Private source and rendered pages never leave the ephemeral runner;
      # no artifact upload, secrets exposure or Actions inside private repos.
