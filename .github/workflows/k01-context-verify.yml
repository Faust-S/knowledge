name: K01 Context Kit verification
on:
  push:
    branches:
      - work/2026-11-04-k01-knowledge-context-kit
    paths:
      - 'modules/k01-context/**'
      - '.github/workflows/k01-context-verify.yml'
  workflow_dispatch:
jobs:
  k01:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: 81b4ce3fc19a3c0adab7150459846152f61c2d85
          path: atlas-public
          persist-credentials: false
          sparse-checkout: src
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test modules/k01-context/tests/*.test.mjs
