name: D07 N330 candidate identity preflight
on:
  push:
    branches: [work/2026-11-02-pipeline-foundation]
    paths: [.github/workflows/d07-top500-330-candidate-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: a17e6b833bd80d61d115c2ef92d232d87887524b
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - name: Confirm existing subject identities before selecting all remaining
        working-directory: site
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/d07-330-preflight.log" 2>&1
          node --import tsx scripts/d07-next500-candidate-preflight.mjs 170 | tee "$RUNNER_TEMP/d07-330-candidate-results.log"
          grep -qx 'D07_TOP500_SELECTED=500' "$RUNNER_TEMP/d07-330-candidate-results.log"
          grep -qx 'D07_INDIVIDUAL_TECHNOLOGIES=330' "$RUNNER_TEMP/d07-330-candidate-results.log"
          grep -qx 'D07_UNCOVERED_TECHNOLOGIES=170' "$RUNNER_TEMP/d07-330-candidate-results.log"
