name: D10 ArtBazi T3 source and standalone build
on:
  push:
    branches: [work/2026-11-18-d10-case-ci]
    paths: [.github/workflows/d10-artbazi-t3-source-ci.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  d10-t3:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact D10 candidate
        uses: actions/checkout@v4
        with:
          repository: Faust-S/artbazi.ru
          ref: 1e79578802363bb0cea5ac251a5a76a62b80dcfa
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - name: Checkout exact canonical D10 domain
        uses: actions/checkout@v4
        with:
          repository: Faust-S/artbazi
          ref: 0f6af238719a34ff2bc73bb797dddc8153d22575
          token: ${{ secrets.DOMEN }}
          path: domain
          persist-credentials: false
      - name: Checkout last qualified T2 site for existing profile migration
        uses: actions/checkout@v4
        with:
          repository: Faust-S/artbazi.ru
          ref: e626f93f96e8545a0a9438faf2934687be1982c7
          token: ${{ secrets.DOMEN }}
          path: previous-site
          persist-credentials: false
      - name: Checkout original qualified T2 for migration
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: e70de29b72b83e2546f7ab74b17572685a728c17
          token: ${{ secrets.DOMEN }}
          path: previous-t2
          persist-credentials: false
      - name: Checkout original T3 release source
        uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 326f725c44d69ac99f6b912241e9e8a6c3d716a5
          path: original
          persist-credentials: false
      - name: Obtain original public T3 candidate
        uses: actions/download-artifact@v4
        with:
          name: iwxa-t3-mobile-portable-candidate-326f725c44d69ac99f6b912241e9e8a6c3d716a5
          run-id: 45395047723
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/d10-portable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Canonical domain CASE-001-010 and original assistant skills
        working-directory: domain
        shell: bash
        run: |
          if npm install --no-save --no-package-lock --ignore-scripts > "$RUNNER_TEMP/d10-t3-domain-install.log" 2>&1 &&
             npm run test:d10:cases > "$RUNNER_TEMP/d10-t3-domain.log" 2>&1 &&
             npm run test:crm > "$RUNNER_TEMP/d10-t3-domain-crm.log" 2>&1 &&
             node --test tests/d10-t3-assistant-skills.test.mjs > "$RUNNER_TEMP/d10-t3-domain-skills.log" 2>&1; then
            echo "D10_T3_DOMAIN_CASES_AND_SKILLS=PASS"
          else
            echo "::error::D10_T3_DOMAIN_CASES_AND_SKILLS=FAIL"; exit 1
          fi
          cmp -s models/assistant-skills.json ../site/public/assets/d10-assistant-skills.json
          echo "D10_T3_CANONICAL_SKILL_PROJECTION=PASS"
          cmp -s src/commercial/company-monthly-plan.mjs ../site/runtime/artbazi-module/runtime/company-monthly-plan.mjs
          cmp -s src/commercial/campaign-month.mjs ../site/runtime/artbazi-module/runtime/campaign-month.mjs
          for model in commercial-review-context commercial-review-signals revops-cycle plan-action; do
            cmp -s "src/commercial/$model.mjs" "../site/runtime/artbazi-module/runtime/$model.mjs"
          done
          cmp -s src/crm/deal-pipeline-review.mjs ../site/runtime/artbazi-module/runtime/deal-pipeline-review.mjs
          cmp -s src/crm/crm-objects.mjs ../site/runtime/artbazi-module/runtime/crm-objects.mjs
          echo "D10_T3_CANONICAL_MONTH_PROJECTIONS=PASS"
      - name: Build last qualified T2 site at the exact future T3 origin
        working-directory: previous-site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/previous-t2
          ARTBAZI_LOCAL_HTTPS_ORIGIN: https://127.0.0.1:4342
        shell: bash
        run: |
          if bun install --frozen-lockfile > "$RUNNER_TEMP/d10-t3-previous-install.log" 2>&1 &&
             npm run build:t2:site > "$RUNNER_TEMP/d10-t3-previous-build.log" 2>&1; then
            echo "D10_T3_PREVIOUS_EXACT_T2_BUILD=PASS"
          else
            echo "::error::D10_T3_PREVIOUS_EXACT_T2_BUILD=FAIL"
            grep -oE 'ARTBAZI_SITE_T2_[A-Z0-9_]+|ARTBAZI_LOCAL_HTTPS_ORIGIN_INVALID|TS[0-9]+' "$RUNNER_TEMP/d10-t3-previous-build.log" | sort -u | head -20 || true
            exit 1
          fi
          mv dist "$RUNNER_TEMP/d10-t2-before-t3-dist"
          test -f "$RUNNER_TEMP/d10-t2-before-t3-dist/artbazi-t2-build.json"
          echo "D10_T3_PREVIOUS_BUILD_RETAINED=PASS"
      - name: Frozen D10 dependencies
        working-directory: site
        shell: bash
        run: |
          if bun install --frozen-lockfile > "$RUNNER_TEMP/d10-t3-install.log" 2>&1; then
            echo "D10_T3_INSTALL=PASS"
          else
            echo "::error::D10_T3_INSTALL=FAIL"; exit 1
          fi
      - name: Exact source and metadata regressions
        working-directory: site
        shell: bash
        run: |
          failed=0
          for gate in check:t3:source check:types check:commercial check:crm check:group-e check:t2-host-route check:search-metadata sales:test; do
            log="$RUNNER_TEMP/d10-t3-${gate//:/-}.log"
            if npm run "$gate" > "$log" 2>&1; then
              echo "$gate=PASS"
              if [[ "$gate" != "sales:test" ]]; then
                grep -E '^# (tests|pass|fail) [0-9]+$' "$log" || true
              fi
            else
              echo "::error::$gate=FAIL"
              grep -oE 'TS[0-9]{4}|D10_T3_INPUT_[A-Z0-9_]+' "$log" | sort | uniq -c | head -30 || true
              grep -E '^# (tests|pass|fail) [0-9]+$' "$log" || true
              # Only numeric TAP failure ordinals, never test data or private code.
              grep -E '^not ok [0-9]+ ' "$log" | sed -E 's/^not ok ([0-9]+) .*/D10_SOURCE_FAILED_TEST_ORDINAL=\1/' | head -25 || true
              failed=1
            fi
          done
          exit "$failed"
      - name: Compile original T3 Host with D10 and one original BLI engine
        working-directory: site
        shell: bash
        run: |
          if npm run prepare:t3:host -- "$GITHUB_WORKSPACE/original" "$RUNNER_TEMP/d10-portable/platform-inputs.zip" "$RUNNER_TEMP/d10-prepared-host" > "$RUNNER_TEMP/d10-t3-prepare.log" 2>&1; then
            echo "D10_ORIGINAL_T3_HOST_COMPILE=PASS"
          else
            echo "::error::D10_ORIGINAL_T3_HOST_COMPILE=FAIL"
            grep -oE 'TS[0-9]{4}|D10_T3_INPUT_[A-Z0-9_]+|ERR_[A-Z0-9_]+|MODULE_NOT_FOUND|ENOENT|ERESOLVE' "$RUNNER_TEMP/d10-t3-prepare.log" | sort | uniq -c | head -40 || true
            exit 1
          fi
      - name: Retain verified inputs within temporary D10 checkout
        working-directory: site
        shell: bash
        run: |
          if python3 scripts/verify-d10-t3-inputs.py "$RUNNER_TEMP/d10-portable/platform-inputs.zip" --retain > "$RUNNER_TEMP/d10-t3-retain.log" 2>&1; then
            mv "$RUNNER_TEMP/d10-prepared-host" runtime/t3-platform/0.3.1-rc.1/prepared-host
            echo "D10_LOCAL_ORIGINAL_INPUTS=PASS"
          else
            echo "::error::D10_LOCAL_ORIGINAL_INPUTS=FAIL"; exit 1
          fi
      - name: Remove preparation checkout and downloaded archive
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/original" "$RUNNER_TEMP/d10-portable" "$GITHUB_WORKSPACE/previous-site" "$GITHUB_WORKSPACE/previous-t2" "$GITHUB_WORKSPACE/domain"
          test ! -e "$GITHUB_WORKSPACE/original"
          test ! -e "$RUNNER_TEMP/d10-portable"
          echo "D10_EXTERNAL_PREPARATION_INPUTS_REMOVED=PASS"
      - name: Assemble standalone ArtBazi T3 site from local inputs
        working-directory: site
        shell: bash
        run: |
          if npm run build:t3:site > "$RUNNER_TEMP/d10-t3-build.log" 2>&1; then
            echo "D10_T3_ONE_REPO_DIST=PASS"
          else
            echo "::error::D10_T3_ONE_REPO_DIST=FAIL"
            grep -oE 'D10_T3_(BUILD|ASSEMBLY)_PHASE=[A-Z_]+|\[prerender:ssr-fail\]|\[prerender\] SSR done\. ok=[0-9]+ fail=[0-9]+' "$RUNNER_TEMP/d10-t3-build.log" | tail -30 || true
            grep -oE 'TS[0-9]{4}|D10_T3_(INPUT|SHELL)_[A-Z0-9_]+|T3_DOMAIN_OFFLINE_[A-Z0-9_]+|T3_PWA_[A-Z0-9_]+|ERR_[A-Z0-9_]+|MODULE_NOT_FOUND|ENOENT|ERESOLVE' "$RUNNER_TEMP/d10-t3-build.log" | sort | uniq -c | head -40 || true
            exit 1
          fi
      - name: Confirm exact original runtime and complete static snapshot
        working-directory: site
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          import {createHash} from "node:crypto";
          import assert from "node:assert/strict";
          const hash=p=>createHash("sha256").update(readFileSync(p)).digest("hex");
          const manifest=JSON.parse(readFileSync("dist/t3-offline-manifest.json","utf8"));
          assert.equal(hash("dist/_iwxa/runtime/0.3.6/runtime.js"),"e1737245aba309e900203b458087ca07cb08d9ccc89901754e1122cbc9a01e78");
          assert.equal(manifest.complete_static_tree,true);
          assert.equal(manifest.domain_origin,"https://artbazi.ru");
          console.log("D10_T3_ORIGINAL_RUNTIME=PASS");
          console.log("D10_T3_OFFLINE_MANIFEST_ROWS="+manifest.files.length);
          console.log("D10_T3_OFFLINE_MANIFEST_BYTES="+manifest.total_bytes);
          console.log("D10_T3_BUILD_CANDIDATE=PASS");
          console.log("D10_T3_INDEPENDENT_PRODUCT_ACCEPTANCE=NOT_RUN");
          NODE
      - name: Exact production snapshot on real Apache
        working-directory: site
        shell: bash
        run: |
          if ! command -v apache2 >/dev/null; then
            sudo apt-get update > "$RUNNER_TEMP/d10-t3-apache-install.log" 2>&1
            sudo apt-get install -y apache2 >> "$RUNNER_TEMP/d10-t3-apache-install.log" 2>&1
          fi
          if python3 scripts/tests/d10-t3-apache-http.py dist > "$RUNNER_TEMP/d10-t3-apache.log" 2>&1; then
            grep -E '^D10_T3_APACHE(_PHYSICAL|_ALIASES)?=(PASS|[0-9]+)$' "$RUNNER_TEMP/d10-t3-apache.log"
          else
            echo "::error::D10_T3_APACHE=FAIL"
            grep -oE 'D10_T3_APACHE_[A-Z_]+' "$RUNNER_TEMP/d10-t3-apache.log" | sort -u | head -20 || true
            exit 1
          fi
          if npm run check:htaccess > "$RUNNER_TEMP/d10-t3-htaccess.log" 2>&1; then
            echo "D10_T3_HTACCESS_GATE=PASS"
          else
            echo "::error::D10_T3_HTACCESS_GATE=FAIL"; exit 1
          fi
      - name: Build disposable HTTPS qualification dist
        id: https_dist
        working-directory: site
        shell: bash
        env:
          ARTBAZI_LOCAL_HTTPS_ORIGIN: https://127.0.0.1:4342
        run: |
          if npm run build:t3:site > "$RUNNER_TEMP/d10-t3-https.log" 2>&1; then
            echo "D10_T3_HTTPS_BUILD=PASS"
          else
            echo "::error::D10_T3_HTTPS_BUILD=FAIL"
            grep -oE 'D10_T3_(BUILD|ASSEMBLY)_PHASE=[A-Z_]+|D10_T3_(INPUT|SHELL)_[A-Z0-9_]+|T3_DOMAIN_OFFLINE_[A-Z0-9_]+|T3_PWA_[A-Z0-9_]+' "$RUNNER_TEMP/d10-t3-https.log" | tail -35 || true
            exit 1
          fi
      - name: Original assistant, decision history, independent analytics and cold offline readback
        if: ${{ !cancelled() && steps.https_dist.outcome == 'success' }}
        working-directory: site
        shell: bash
        run: |
          if node scripts/tests/d10-t3-original-browser.mjs > "$RUNNER_TEMP/d10-t3-browser.log" 2>&1; then
            grep -E '^D10_T3_(BROWSER_[A-Z0-9_]+|REAL_MODEL_INFERENCE|ANALYTICS_(CORE|ALL_PROJECTIONS)_MS)=(PASS|NOT_RUN|[0-9]+)$' "$RUNNER_TEMP/d10-t3-browser.log" || true
          else
            grep -E '^D10_T3_(BROWSER_[A-Z0-9_]+|ANALYTICS_(CORE|ALL_PROJECTIONS)_MS)=(PASS|[A-Z0-9_]+|[A-Za-z]*Error)$' "$RUNNER_TEMP/d10-t3-browser.log" || true
            echo "::error::D10_T3_BROWSER_REGRESSION=FAIL"; exit 1
          fi
      - name: All 16 existing product journeys against exact T3 HTTPS dist
        if: ${{ !cancelled() && steps.https_dist.outcome == 'success' }}
        working-directory: site
        shell: bash
        env:
          D10_T3_PRODUCT_HTTPS: "1"
        run: |
          failed=0
          passed=0
          scripts=(
            d10-case004-browser-smoke
            d10-public-23-journey-browser
            d10-case005-browser-smoke
            d10-case006-browser-smoke
            d10-case007-browser-smoke
            d10-case008-browser-smoke
            d10-case009-browser-smoke
            d10-case010-browser-smoke
            d10-commercial-review-browser-smoke
            d10-case008-promotion-kernel-browser
            d10-case009-pipeline-kernel-browser
            d10-case010-quotes-kernel-browser
            d10-revops-action-kernel-browser
            d10-public-kernel-transfer-browser
            d10-case010-real-cold-host-browser
            d10-multifamily-iwxa-browser
          )
          for script in "${scripts[@]}"; do
            log="$RUNNER_TEMP/d10-t3-$script.log"
            if timeout 300s node "scripts/tests/$script.mjs" > "$log" 2>&1; then
              echo "D10_T3_PRODUCT_JOURNEY_$script=PASS"
              passed=$((passed+1))
            else
              echo "::error::D10_T3_PRODUCT_JOURNEY_$script=FAIL"
              grep -E '^D10_[A-Z0-9_]+=(PASS|NOT_RUN|[0-9]+)$' "$log" | tail -20 || true
              grep -E '^D10_PUBLIC_JOURNEY_[a-z0-9-]+=(PASS|FAIL stage=(open|input|save) reason=[A-Za-z0-9_-]+)$' "$log" | tail -23 || true
              grep -E '^D10_CASE009_(FAILED_PHASE|ERROR_CLASS)=([A-Z_]+|[A-Za-z]*Error)$' "$log" || true
              grep -oE '(TimeoutError|AssertionError|TypeError|ReferenceError|ERR_[A-Z0-9_]+)' "$log" | sort -u | head -10 || true
              failed=1
            fi
          done
          echo "D10_T3_PRODUCT_JOURNEYS_PASSED=$passed"
          if [[ "$passed" == "16" ]]; then echo "D10_T3_PRODUCT_JOURNEYS=PASS"; fi
          exit "$failed"
      - name: Existing T2 browser profile to T3 with new CRM write
        if: ${{ !cancelled() && steps.https_dist.outcome == 'success' }}
        working-directory: site
        shell: bash
        env:
          D10_T3_PRODUCT_HTTPS: "1"
          D10_T2_BEFORE_T3_DIST: ${{ runner.temp }}/d10-t2-before-t3-dist
        run: |
          if timeout 300s node scripts/tests/d10-case010-real-cold-host-browser.mjs > "$RUNNER_TEMP/d10-t3-migration.log" 2>&1; then
            grep -E '^D10_T2_T3_[A-Z_]+=PASS$' "$RUNNER_TEMP/d10-t3-migration.log"
            grep -q '^D10_T2_T3_EXISTING_PROFILE_MIGRATION=PASS$' "$RUNNER_TEMP/d10-t3-migration.log"
          else
            grep -E '^D10_(COLD_|T2_T3_|CASE010_KERNEL_|NATIVE_)[A-Z_]+=(PASS|[0-9]+)$' "$RUNNER_TEMP/d10-t3-migration.log" | tail -30 || true
            grep -oE '(TimeoutError|AssertionError|TypeError|ReferenceError|ERR_[A-Z0-9_]+)' "$RUNNER_TEMP/d10-t3-migration.log" | sort -u | head -10 || true
            echo "::error::D10_T2_T3_EXISTING_PROFILE_MIGRATION=FAIL"; exit 1
          fi
      - name: Delete private build logs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/d10-t3-*.log
          rm -rf "$RUNNER_TEMP/d10-t2-before-t3-dist" "$RUNNER_TEMP/d10-prepared-host" "$RUNNER_TEMP/d10-portable"
