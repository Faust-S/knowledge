name: D12 IWXA AKIS research hub full-site qualification
on:
  push:
    branches: [work/2026-11-02-pipeline-foundation]
    paths: [.github/workflows/d12-akis-case-articles-qualification.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d12-akis-hub-full-v4-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    name: AKIS public article qualification ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout private D12 source in runner only
        uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-ru-1
          ref: 72ae81e2213f25b8d24d37b7c085109012edfeb5
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - name: Verify exact source and private checkout
        run: |
          test "$(git rev-parse HEAD)" = "72ae81e2213f25b8d24d37b7c085109012edfeb5" || { echo "AKIS_HEAD_MISMATCH"; exit 1; }
          test -f src/routes/science.akis-production.tsx || exit 1
          test -f src/routes/science.akis-operator.tsx || exit 1
          test -f src/routes/science.akis-interfirm.tsx || exit 1
          test -f src/routes/science.akis.tsx || exit 1
          test -f scripts/check-akis-hub.test.ts || exit 1
          test -f scripts/check-akis-interfirm-article.test.ts || exit 1
          test -f scripts/check-akis-interfirm-dependence.test.ts || exit 1
          test -f scripts/check-akis-production-article.test.ts || exit 1
          test -f scripts/check-akis-operator-article.test.ts || exit 1
          echo "AKIS_EXACT_SOURCE=PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Exact dependency installation with private logs
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/akis-install.log" 2>&1 || {
            echo "AKIS_FROZEN_INSTALL=FAIL"; exit 1;
          }
          echo "AKIS_FROZEN_INSTALL=PASS"
      - name: Original article, research hub and organizational acceptance suites
        run: |
          for task in check:akis:production check:akis:article check:akis:interfirm check:akis:dependence check:akis:hub; do
            safe="${task//:/-}"
            bun run "$task" > "$RUNNER_TEMP/akis-$safe.log" 2>&1 || {
              echo "AKIS_TEST=FAIL task=$task"; exit 1;
            }
            echo "AKIS_TEST=PASS task=$task"
          done
      - name: TypeScript check using the site's original route-generation prerequisite
        run: |
          npm run typecheck > "$RUNNER_TEMP/akis-types.log" 2>&1 || {
            echo "AKIS_TYPES=FAIL"
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/akis-types.log" |
              sed -E 's/(error TS[0-9]+):.*/\1/' | head -20 || true
            exit 1
          }
          echo "AKIS_TYPES=PASS"
      - name: Prepare Chromium for site's original static prerender
        run: |
          bunx puppeteer browsers install chrome > "$RUNNER_TEMP/akis-browser-install.log" 2>&1 || {
            echo "AKIS_CHROME_INSTALL=FAIL"; exit 1;
          }
          echo "AKIS_CHROME_INSTALL=PASS"
      - name: Full original site static build and prerender
        run: |
          bun run build:static > "$RUNNER_TEMP/akis-build.log" 2>&1 || {
            echo "AKIS_STATIC_BUILD=FAIL"
            # Show last attempted public URL, never private source or raw build logs.
            grep '^\[prerender\] visiting /' "$RUNNER_TEMP/akis-build.log" | tail -1 || true
            exit 1;
          }
          test -f dist-static/science/akis/index.html || exit 1
          test -f dist-static/science/akis-production/index.html || exit 1
          test -f dist-static/science/akis-operator/index.html || exit 1
          test -f dist-static/science/akis-interfirm/index.html || exit 1
          echo "AKIS_STATIC_BUILD=PASS"
          echo "AKIS_SCIENCE_HTML=4/4"
      - name: Full original IWXA static, accessibility and research guards
        run: |
          for task in check:atlas check:routes check:readability check:schema check:llms check:seo check:no-localhost check:hosting-clean check:links check:runtime check:a11y check:responsive check:performance check:htaccess check:akis:static check:akis:hub:static; do
            safe="${task//:/-}"
            bun run "$task" > "$RUNNER_TEMP/akis-$safe.log" 2>&1 || {
              echo "AKIS_STATIC_GUARD=FAIL task=$task"; exit 1;
            }
            echo "AKIS_STATIC_GUARD=PASS task=$task"
          done
      - name: Hydrated real browser article interactions, overflow and themes
        run: |
          bun run check:akis:browser > "$RUNNER_TEMP/akis-interactions.log" 2>&1 || {
            echo "AKIS_REAL_BROWSER=FAIL"; exit 1;
          }
          echo "AKIS_REAL_BROWSER=PASS"
      # No uploads: private sources, raw logs, build outputs and screenshots stay in runner TEMP.
