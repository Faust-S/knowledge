name: AKIS original Mesa 3.5.2 R4 independent demand lifecycle

on:
  push:
    branches:
      - work/2026-11-23-akis-r4-outside-demand-lifecycle-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-independent-buyer-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install official original Mesa 3.5.2
        run: |
          python -m pip install --disable-pip-version-check "mesa==3.5.2" "pytest>=8,<10"
          python -c "import mesa; assert mesa.__version__ == '3.5.2'"
      - name: Compile original research
        run: python -m compileall -q qualifications/akis_2026_11_21/research
      - name: Test independent buyer source and original demand lifecycle
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: |
          python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r4_original_buyer_demand_withdrawal_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r4_independent_external_buyer_demand_mesa.py
      - name: Full original Mesa regression
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests
      - name: Deterministic buyer demand lifecycle with owner-minimized evidence
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_r4_original_buyer_demand_lifecycle.py
      - uses: actions/upload-artifact@v4
        with:
          name: akis-r4-independent-demand-lifecycle-${{ matrix.os }}
          if-no-files-found: error
          path: qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r4_independent_buyer_demand_lifecycle_evidence.json
