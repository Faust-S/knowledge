name: D04 unified Life OS source checks (private source, no artifacts)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d04-unified-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test access preflight transport without credentials
        run: bash scripts/test-d04-private-source-preflight.sh
      - name: Preflight exact permitted source access
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          bash scripts/d04-private-source-preflight.sh D04_UNIFIED_ACCESS Faust-S/bazmed.ru Faust-S/bazmed
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/bazmed.ru
          ref: bc6f5c82964eacead0fa5b7c725b3fda0d81279c
          token: ${{ secrets.DOMEN }}
          path: d04-private/site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/bazmed
          ref: e5d201da976aa6fce7aaabd32d99fd2e5ea0d472
          token: ${{ secrets.DOMEN }}
          path: d04-private/model
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact revisions and canonical model
        run: |
          set -euo pipefail
          test "$(git -C d04-private/site rev-parse HEAD)" = "bc6f5c82964eacead0fa5b7c725b3fda0d81279c"
          test "$(git -C d04-private/site rev-parse HEAD^{tree})" = "5db71c69b28662574b8b282de53bb07b7e7cbb45"
          test "$(git -C d04-private/model rev-parse HEAD)" = "e5d201da976aa6fce7aaabd32d99fd2e5ea0d472"
          for name in LIFE_RETROSPECTIVE_V0_1.mjs LIFE_RETROSPECTIVE_V0_1.d.mts PERSONAL_STUDY_RESULT_V0_1.mjs PERSONAL_STUDY_RESULT_V0_1.d.mts LIFE_GOAL_RESULT_REFS_V0_1.mjs LIFE_GOAL_RESULT_REFS_V0_1.d.mts PERSONAL_CUSTOM_MEASURE_V0_1.mjs PERSONAL_CUSTOM_MEASURE_V0_1.d.mts LIFE_PERIOD_COMPARISON_V0_1.mjs LIFE_PERIOD_COMPARISON_V0_1.d.mts LIFE_ACTION_BOARD_V0_1.mjs LIFE_ACTION_BOARD_V0_1.d.mts PERSONAL_MEDICAL_EVIDENCE_V0_1.mjs PERSONAL_MEDICAL_EVIDENCE_V0_1.d.mts LIFE_DASHBOARD_SLEEP_SCHEDULE_V0_1.mjs LIFE_DASHBOARD_SLEEP_SCHEDULE_V0_1.d.mts PERSONAL_GOAL_PROFILE_V0_1.mjs PERSONAL_GOAL_PROFILE_V0_1.d.mts PERSONAL_OBSERVATION_PROFILE_V0_1.mjs PERSONAL_OBSERVATION_PROFILE_V0_1.d.mts PERSONAL_OBSERVATION_DYNAMICS_V0_1.mjs PERSONAL_OBSERVATION_DYNAMICS_V0_1.d.mts LIFE_DASHBOARD_MODEL_V0_1.mjs LIFE_DASHBOARD_MODEL_V0_1.d.mts LIFE_DASHBOARD_PROJECTION_V0_1.mjs LIFE_DASHBOARD_PROJECTION_V0_1.d.mts LIFE_DASHBOARD_CALCULATIONS_V0_1.mjs LIFE_DASHBOARD_CALCULATIONS_V0_1.d.mts LIFE_DIARY_BATCH_V0_1.mjs LIFE_DIARY_BATCH_V0_1.d.mts; do
            cmp "d04-private/model/docs/life-os/$name" "d04-private/site/t2-site-module/bazmed/$name"
          done
          test "$(git -C d04-private/model rev-parse HEAD^{tree})" = "11a5d13248f8ca5fe36cf4ed7fc0c804a99ace90"
          cmp d04-private/model/docs/life-os/RECOVERY_PROCESS_PROFILE_V0_7.ts d04-private/site/src/lib/life-os-recovery-process.ts
          # The release preflight must pin the same subject as this qualification.
          grep -Fqx 'const expectedSubject="e5d201da976aa6fce7aaabd32d99fd2e5ea0d472";' d04-private/site/scripts/check-hosting-source.mjs || { echo "D04_RELEASE_SUBJECT_PIN=FAIL"; exit 1; }
          echo "D04_RELEASE_SUBJECT_PIN=PASS"
          echo "D04_UNIFIED_PINNED_PARITY=PASS"
          if (cd d04-private/model && node --experimental-strip-types --test docs/life-os/tests/life-retrospective.test.mjs docs/life-os/tests/recovery-process-profile.test.mjs docs/life-os/tests/personal-study-result.test.mjs docs/life-os/tests/life-dashboard-model.test.mjs docs/life-os/tests/life-dashboard-selection.test.mjs docs/life-os/tests/life-dashboard-projection.test.mjs docs/life-os/tests/personal-observation-dynamics.test.mjs docs/life-os/tests/life-dashboard-calculations.test.mjs docs/life-os/tests/life-diary-batch.test.mjs docs/life-os/tests/life-observation-methods.test.mjs docs/life-os/tests/personal-goal-profile.test.mjs docs/life-os/tests/life-dashboard-sleep-schedule.test.mjs docs/life-os/tests/personal-medical-evidence.test.mjs docs/life-os/tests/life-action-board.test.mjs docs/life-os/tests/life-period-comparison.test.mjs docs/life-os/tests/personal-custom-measure.test.mjs docs/life-os/tests/goal-observation-refs.test.mjs docs/life-os/tests/goal-result-refs.test.mjs docs/life-os/tests/life-daily-study.test.mjs) >"$RUNNER_TEMP/d04-domain.log" 2>&1; then
            echo "D04_UNIFIED_DOMAIN=PASS"
          else
            echo "D04_UNIFIED_DOMAIN=FAIL"
            grep -E '^not ok [0-9]+ - |^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/d04-domain.log" | head -15 || true
            exit 1
          fi
          grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/d04-domain.log" | tail -3
      - name: Site dependencies
        id: dependencies
        working-directory: d04-private/site
        run: |
          npm ci --no-audit --no-fund --include=dev >"$RUNNER_TEMP/d04-npm.log" 2>&1 || { echo "D04_UNIFIED_NPM=FAIL"; exit 1; }
          echo "D04_UNIFIED_NPM=PASS"
      - name: Site source and behavior tests
        working-directory: d04-private/site
        run: |
          set -uo pipefail
          code=0
          for suite in check:life-os:research check:t2:entry check:tool-links; do
            log="$RUNNER_TEMP/d04-${suite//:/-}.log"
            if npm run "$suite" >"$log" 2>&1; then
              echo "D04_UNIFIED_${suite}=PASS"
            else
              echo "D04_UNIFIED_${suite}=FAIL"
              grep -E '^not ok [0-9]+ - ' "$log" | head -20 || true
              grep -Eo 'D04_SERVICE_MATRIX_[A-Z0-9_]+|BAZMED_[A-Z0-9_]+' "$log" | sort -u | head -15 || true
              code=1
            fi
            grep -E '^# (tests|pass|fail) [0-9]+$' "$log" | tail -3 || true
          done
          log="$RUNNER_TEMP/d04-home-source.log"
          if node --test tests/life-os-home-dashboard.test.mjs >"$log" 2>&1; then
            echo "D04_UNIFIED_HOME_SOURCE=PASS"
          else
            echo "D04_UNIFIED_HOME_SOURCE=FAIL"
            grep -E '^not ok [0-9]+ - ' "$log" | head -20 || true
            code=1
          fi
          grep -E '^# (tests|pass|fail) [0-9]+$' "$log" | tail -3 || true
          exit "$code"
      - name: TypeScript and semantic lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: d04-private/site
        run: |
          code=0
          if npx tsc --noEmit --pretty false >"$RUNNER_TEMP/d04-ts.log" 2>&1; then
            echo "D04_UNIFIED_TYPESCRIPT=PASS"
          else
            echo "D04_UNIFIED_TYPESCRIPT=FAIL"
            grep -Eo 'error TS[0-9]+' "$RUNNER_TEMP/d04-ts.log" | sort -u | head -15 || true
            grep -Eo '(LifeRevisionTimeline\.tsx|LifeRetrospectiveContext\.tsx|LifeMonthReviewPanel\.tsx|read-life-revision-history\.ts|life-revision-admission\.ts|LifePeriodComparisonPanel\.tsx|SavedStudyDetails\.tsx|BazmedResultViewer\.tsx|LifeDailyStudyPanel\.tsx|GoalResultEvidence\.tsx|goal-result-admission\.ts|GoalObservationEvidence\.tsx|BazmedGoalEditor\.tsx|commands\.ts|LifeDashboard\.tsx|life-dashboard-demo\.ts|BazmedObservationEditor\.tsx|BazmedOverviewCard\.tsx|BazmedNativeWorkspace\.tsx|BazmedDiaryEditor\.tsx|ObservationMethodEditor\.tsx)\([0-9]+,[0-9]+\): error TS[0-9]+' "$RUNNER_TEMP/d04-ts.log" | head -15 || true
            code=1
          fi
          if npm run lint -- --rule 'prettier/prettier: off' >"$RUNNER_TEMP/d04-lint.log" 2>&1; then
            echo "D04_UNIFIED_SEMANTIC=PASS"
          else
            echo "D04_UNIFIED_SEMANTIC=FAIL"
            python3 "$GITHUB_WORKSPACE/tools/ci/d04_safe_diagnostics.py" lint-semantic "$RUNNER_TEMP/d04-lint.log" || true
            code=1
          fi
          exit "$code"
      # Never upload source, private logs, profiles or dist.
