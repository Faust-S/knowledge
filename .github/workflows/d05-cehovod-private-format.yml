name: d05-cehovod-whitespace-patch
on:
  push:
    branches:
      - test/2026-11-18-d05-source-qualification
    paths:
      - .github/workflows/d05-cehovod-private-format.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch exact private working branch, never upload source
        env:
          DOMEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          test -n "${DOMEN:-}" || { echo "D05_READ_TOKEN_MISSING"; exit 1; }
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DOMEN" | base64 | tr -d '\r\n')"
          GIT_TERMINAL_PROMPT=0 git -c "http.extraheader=$header" clone --quiet --depth 1 --single-branch --branch work/2026-10-23-t2-site-only https://github.com/Faust-S/cehovod.ru.git site >/dev/null 2>&1 || { echo "D05_READ=FAIL"; exit 1; }
          echo "D05_SITE_SHA=$(git -C site rev-parse HEAD)"
          unset header DOMEN
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install locked formatter without exposing private output
        run: |
          set -euo pipefail
          (cd site && npm ci --no-audit --no-fund) > "$RUNNER_TEMP/d05-format-install.log" 2>&1 || { echo "D05_FORMAT_INSTALL=FAIL"; exit 1; }
          echo "D05_FORMAT_INSTALL=PASS"
      - name: Compute whitespace positions only
        run: |
          set -euo pipefail
          cd site
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";
          import prettier from "prettier";
          const paths = [
            "src/lib/shop-capacity.ts",
            "src/lib/shop-capacity.test.ts",
            "src/host/CehovodCapacityPanel.tsx"
          ];
          const sha = value => crypto.createHash("sha256").update(value, "utf8").digest("hex");
          const partition = value => {
            let chars = "";
            const gaps = [""];
            for (const character of value) {
              if (/\s/u.test(character)) gaps[gaps.length - 1] += character;
              else { chars += character; gaps.push(""); }
            }
            return { chars, gaps };
          };
          let failures = 0;
          for (const path of paths) {
            const before = fs.readFileSync(path, "utf8");
            const options = await prettier.resolveConfig(path);
            const after = await prettier.format(before, { ...options, filepath: path });
            const left = partition(before), right = partition(after);
            const repaired = { chars: Array.from(left.chars), gaps: [...left.gaps] };
            let punctuation = null;
            if (left.chars !== right.chars) {
              const original = Array.from(left.chars), target = Array.from(right.chars);
              let prefix = 0, suffix = 0;
              while (prefix < original.length && prefix < target.length && original[prefix] === target[prefix]) prefix++;
              while (suffix < original.length - prefix && suffix < target.length - prefix &&
                original[original.length - 1 - suffix] === target[target.length - 1 - suffix]) suffix++;
              const remove = original.slice(prefix, original.length - suffix).join("");
              const insert = target.slice(prefix, target.length - suffix).join("");
              const allowed = new Set(Array.from(".,;:!?()[]{}'\"=<>+*/|&-"));
              if (remove.length > 12 || insert.length > 12 || !Array.from(remove).every(c => allowed.has(c)) || !Array.from(insert).every(c => allowed.has(c))) {
                console.log("D05_PUNCTUATION_DIFFERENCE_UNSAFE=" + path + ":" + remove.length + ":" + insert.length);
                failures++;
                continue;
              }
              punctuation = { at: prefix, remove, insert };
              repaired.chars.splice(prefix, remove.length, ...Array.from(insert));
              repaired.gaps.splice(prefix + 1, remove.length, ...Array(insert.length).fill(""));
              console.log("D05_PUNCTUATION_DIFFERENCE_SAFE=" + path + ":" + remove.length + ":" + insert.length);
            }
            const edits = [];
            for (let i = 0; i < repaired.gaps.length; i++) {
              if (repaired.gaps[i] !== right.gaps[i]) edits.push([i, right.gaps[i]]);
            }
            const payload = JSON.stringify({
              path,
              base: sha(before),
              formatted: sha(after),
              punctuation,
              edits
            });
            // The payload contains only offsets, whitespace and digests.
            if (/[^\x20-\x7e]/.test(payload)) throw Error("D05_NON_ASCII_PATCH");
            console.log("D05_WHITESPACE_PATCH=" + Buffer.from(payload).toString("base64"));
            console.log("D05_FORMAT_EDIT_COUNT=" + path + ":" + edits.length);
          }
          if (failures) process.exit(2);
          console.log("D05_PRIVATE_SOURCE_EXPOSURE=NONE");
          NODE
