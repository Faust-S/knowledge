name: d02-club-native-kernel-receipt
on:
  push:
    branches: [work/2026-11-18-d02-club-qualification]
    paths: [.github/workflows/d02-club-native-kernel-receipt.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-receipt:
    runs-on: windows-latest
    timeout-minutes: 65
    defaults:
      run:
        shell: pwsh
    env:
      SITE_SHA: 98a3fbc4132502708b805a6b4eb21e7d5ecd72d7
      T2_SHA: e70de29b72b83e2546f7ab74b17572685a728c17
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      CI: 'true'
    steps:
      - name: Preserve LF and checkout exact private site only in disposable runner
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/club.iwxa.ru
          ref: ${{ env.SITE_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: ${{ env.T2_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: t2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Assemble unmodified original T2 and complete Club site
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
          IWXA_T2_NPM_CACHE_DIR: ${{ runner.temp }}/d02-receipt-npm-cache
        run: |
          if((git rev-parse HEAD).Trim() -ne $env:SITE_SHA){throw 'D02_RECEIPT_SITE_PIN_CHANGED'}
          if((git -C ../t2 rev-parse HEAD).Trim() -ne $env:T2_SHA){throw 'D02_RECEIPT_T2_PIN_CHANGED'}
          & npm ci --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP 'd02-receipt-install.private.log')
          if($LASTEXITCODE -ne 0){throw 'D02_RECEIPT_SITE_INSTALL_FAILED'}
          & npm run build *> (Join-Path $env:RUNNER_TEMP 'd02-receipt-build.private.log')
          if($LASTEXITCODE -ne 0){throw 'D02_RECEIPT_ORIGINAL_T2_BUILD_FAILED'}
          if(-not (Test-Path dist/workspace/index.html) -or
             -not (Test-Path dist/projects/index.html)){throw 'D02_RECEIPT_DIST_INCOMPLETE'}
          Write-Output 'D02_RECEIPT_ORIGINAL_T2_SITE_BUILD=PASS'
      - name: Real Edge creates personal Workspace then writes and reads original Kernel Result
        id: native_profile
        continue-on-error: true
        working-directory: site
        env:
          PORT: '55444'
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $site=(Resolve-Path .).Path
          $origin='http://localhost:55444'
          $edge=@(
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Microsoft\Edge\Application\msedge.exe')
          )|Where-Object{Test-Path $_}|Select-Object -First 1
          if(!$edge){throw 'D02_RECEIPT_EDGE_NOT_FOUND'}
          $server=$null;$b1=$null;$b2=$null;$b3=$null
          $profile=Join-Path $env:RUNNER_TEMP 'd02-receipt-persistent-profile'
          $scope=[System.Windows.Automation.TreeScope]::Descendants
          function Locate([string]$name,[string]$type){
            $condition=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,$name)
            if($type -eq 'button' -or $type -eq 'edit' -or $type -eq 'combo'){
              $ctl=if($type -eq 'button'){[System.Windows.Automation.ControlType]::Button}
                elseif($type -eq 'combo'){[System.Windows.Automation.ControlType]::ComboBox}
                else{[System.Windows.Automation.ControlType]::Edit}
              $condition=[System.Windows.Automation.AndCondition]::new(
                $condition,[System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::ControlTypeProperty,$ctl))
            }
            foreach($p in @(Get-Process msedge -ErrorAction SilentlyContinue|
              Where-Object {$_.MainWindowHandle -ne 0})){
              $root=[System.Windows.Automation.AutomationElement]::FromHandle(
               [IntPtr]$p.MainWindowHandle)
              if(!$root){continue}
              $r=$root.FindFirst($scope,$condition)
              if($r -and $r.Current.IsEnabled){return $r}
            }
            return $null
          }
          function Await([string]$name,[string]$type,[string]$errorCode){
            for($i=0;$i -lt 80;$i++){
              $found=Locate $name $type
              if($found){return $found}
              Start-Sleep -Milliseconds 500
            }
            throw $errorCode
          }
          function Invoke([string]$label,[string]$errorCode){
            $control=Await $label 'button' $errorCode
            try{
              $pattern=[System.Windows.Automation.InvokePattern]$control.GetCurrentPattern(
               [System.Windows.Automation.InvokePattern]::Pattern)
              $pattern.Invoke()
            }catch{throw $errorCode}
          }
          function Enter([string]$label,[string]$value,[string]$errorCode){
            $control=Await $label 'edit' $errorCode
            try{
              # ValuePattern.SetValue can alter the DOM without React onChange.
              # Real keyboard paste must reach the app before any Kernel write.
              Add-Type -AssemblyName System.Windows.Forms
              $control.SetFocus()
              Set-Clipboard -Value $value -ErrorAction Stop
              [System.Windows.Forms.SendKeys]::SendWait('^a')
              [System.Windows.Forms.SendKeys]::SendWait('^v')
              $matched=$false
              for($i=0;$i -lt 25;$i++){
                Start-Sleep -Milliseconds 120
                $current=Locate $label 'edit'
                if(!$current){continue}
                $pattern=[System.Windows.Automation.ValuePattern]$current.GetCurrentPattern(
                 [System.Windows.Automation.ValuePattern]::Pattern)
                if($pattern.Current.Value -ceq $value){$matched=$true;break}
              }
              if(!$matched){throw $errorCode}
            }catch{throw $errorCode}
          }
          function AwaitPrefix([string]$prefix,[string]$errorCode){
            for($i=0;$i -lt 100;$i++){
              foreach($p in @(Get-Process msedge -ErrorAction SilentlyContinue|
                Where-Object {$_.MainWindowHandle -ne 0})){
                $root=[System.Windows.Automation.AutomationElement]::FromHandle(
                  [IntPtr]$p.MainWindowHandle)
                if(!$root){continue}
                $all=$root.FindAll($scope,[System.Windows.Automation.Condition]::TrueCondition)
                foreach($r in $all){
                  $name=$r.Current.Name
                  if($name -and $name.StartsWith($prefix)){return $name}
                }
              }
              Start-Sleep -Milliseconds 500
            }
            throw $errorCode
          }
          function HasPrefix([string]$prefix){
            foreach($p in @(Get-Process msedge -ErrorAction SilentlyContinue|
              Where-Object {$_.MainWindowHandle -ne 0})){
              $root=[System.Windows.Automation.AutomationElement]::FromHandle(
                [IntPtr]$p.MainWindowHandle)
              if(!$root){continue}
              $all=$root.FindAll($scope,[System.Windows.Automation.Condition]::TrueCondition)
              foreach($row in $all){
                $name=$row.Current.Name
                if($name -and $name.StartsWith($prefix)){return $true}
              }
            }
            return $false
          }
          function Activate([string]$label,[string]$code){
            $button=Await $label 'button' $code
            try{
              Add-Type -AssemblyName System.Windows.Forms
              $button.SetFocus()
              [System.Windows.Forms.SendKeys]::SendWait(' ')
            }catch{throw $code}
          }
          function VerifyProfileFromKernel([string]$code){
            # The Host never grants authority based on an old browser session.
            # Use the visible human action to reopen the single existing area.
            if(Locate 'Открыть мою рабочую область' 'button'){
              Activate 'Открыть мою рабочую область' 'D02_RECEIPT_COLD_RESUME_BUTTON_FAILED'
              Write-Output 'D02_RECEIPT_REOPEN_PERSONAL_WORKSPACE=USER_CONFIRMED'
            }
            Activate 'Мой профиль' 'D02_RECEIPT_PROFILE_SHORTCUT_NOT_AVAILABLE'
            # Host focus, the domain inventory, and the 7-family readback are
            # asynchronous after a cold start. A one-shot UIA lookup can
            # mistakenly report data loss while the Kernel is still loading.
            $open=$null
            for($i=0;$i -lt 90;$i++){
              $open=Locate 'Редактировать профиль здесь' 'button'
              if(!$open){$open=Locate 'Создать профиль в рабочей области' 'button'}
              if($open){break}
              if(Locate 'Чтение рабочих областей не разрешено Kernel.' ''){
                throw 'D02_RECEIPT_RESTART_KERNEL_READ_DENIED'
              }
              if(Locate 'Host не подтвердил выбранную рабочую область. Запись в Kernel недоступна.' ''){
                throw 'D02_RECEIPT_RESTART_HOST_FOCUS_DENIED'
              }
              Start-Sleep -Milliseconds 500
            }
            if(!$open){
              $visible=HasPrefix 'Сохранённых результатов пока нет.'
              Write-Output ('D02_RECEIPT_RESTART_NO_EDITOR_EMPTY_FAMILY='+$visible)
              throw $code
            }
            Write-Output 'D02_RECEIPT_RESTART_PROFILE_EDITOR_READY=PASS'
            if($open.Current.Name -eq 'Создать профиль в рабочей области'){
              Write-Output 'D02_RECEIPT_RESTART_EDITOR_STATE=NO_PROFILE_IN_FAMILY'
            }else{
              Write-Output 'D02_RECEIPT_RESTART_EDITOR_STATE=FOUND_SAVED_PROFILE'
            }
            Activate $open.Current.Name $code
            # The status message is advisory and its UIA exposure can lag the
            # form. After a cold browser start, this editor begins with EMPTY
            # fields; only original Kernel getObject can restore the alias.
            # Require actual native input readback, not an informational text.
            $confirmed=$false
            for($attempt=0;$attempt -lt 100;$attempt++){
              $field=Locate 'Как к вам обращаться' 'edit'
              if($field){
                try{
                  $value=[System.Windows.Automation.ValuePattern]$field.GetCurrentPattern(
                    [System.Windows.Automation.ValuePattern]::Pattern)
                  if($value.Current.Value -ceq 'Club проверка пользовательской записи'){
                    $confirmed=$true;break
                  }
                }catch{}
              }
              if(Locate 'Не удалось проверить сохранённый профиль. Запись отключена, чтобы не потерять данные.' ''){
                throw 'D02_RECEIPT_KERNEL_PROFILE_LOAD_ERROR'
              }
              Start-Sleep -Milliseconds 300
            }
            if(!$confirmed){throw $code}
            Write-Output 'D02_RECEIPT_NATIVE_KERNEL_PROFILE_FIELD_VALUE=PASS'
            Write-Output ('D02_RECEIPT_KERNEL_STATUS_TEXT_VISIBLE='+[bool](
              Locate 'Сохранённый профиль загружен через Kernel.' ''))
          }
          try {
            $server=Start-Process -FilePath node -WorkingDirectory $site -ArgumentList @(
              'scripts/serve-current-static.mjs','dist','--t2-loopback'
            ) -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'd02-receipt-http.private.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'd02-receipt-http-error.private.log') -PassThru
            $ready=$false
            for($i=0;$i -lt 60;$i++){
              Start-Sleep -Milliseconds 500
              try{
                if((Invoke-WebRequest -Uri ('http://127.0.0.1:55444/workspace/') -TimeoutSec 2).StatusCode -eq 200){
                  $ready=$true;break
                }
              }catch{}
            }
            if(!$ready){
              Write-Output ("D02_RECEIPT_HTTP_SERVER_RUNNING=" + (-not $server.HasExited))
              throw 'D02_RECEIPT_HOST_HTTP_UNAVAILABLE'
            }
            $b1=Start-Process -FilePath $edge -PassThru -ArgumentList @(
              '--force-renderer-accessibility','--no-first-run','--no-default-browser-check',
              "--user-data-dir=$profile","--app=$origin/workspace/#/workspaces"
            )
            Invoke 'Новая рабочая область' 'D02_RECEIPT_NEW_WORKSPACE_BUTTON_MISSING'
            # Host's empty catalog ALSO exposes "Создать рабочую область":
            # the modal confirmation is later in the UIA tree. Choose the
            # LAST visible matching button, not the catalog's first button.
            $matched=[System.Collections.Generic.List[object]]::new()
            $buttonCondition=[System.Windows.Automation.AndCondition]::new(
              [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::NameProperty,'Создать рабочую область'),
              [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                [System.Windows.Automation.ControlType]::Button))
            # React modal rendering and the Windows UIA tree are asynchronous.
            # A single scan after Invoking the header button can observe zero
            # controls even though the modal is about to appear.
            for($attempt=0;$attempt -lt 70;$attempt++){
              $matched.Clear()
              foreach($p in @(Get-Process msedge -ErrorAction SilentlyContinue|
                Where-Object {$_.MainWindowHandle -ne 0})){
                $root=[System.Windows.Automation.AutomationElement]::FromHandle(
                  [IntPtr]$p.MainWindowHandle)
                if(!$root){continue}
                $all=$root.FindAll($scope,$buttonCondition)
                foreach($candidate in $all){
                  if($candidate.Current.IsEnabled -and !$candidate.Current.IsOffscreen){
                    $matched.Add($candidate)
                  }
                }
              }
              if($matched.Count -gt 0){break}
              if($attempt -eq 25){
                # If UIA InvokePattern was accepted but did not dispatch a
                # DOM click in Edge, retry with a real keyboard activation.
                $entry=Locate 'Новая рабочая область' 'button'
                if($entry){
                  try{
                    $entry.SetFocus()
                    Add-Type -AssemblyName System.Windows.Forms
                    [System.Windows.Forms.SendKeys]::SendWait(' ')
                    Write-Output 'D02_RECEIPT_CREATE_MODAL_KEYBOARD_RETRY=TRUE'
                  }catch{
                    Write-Output 'D02_RECEIPT_CREATE_MODAL_KEYBOARD_RETRY=UNAVAILABLE'
                  }
                }
              }
              Start-Sleep -Milliseconds 250
            }
            Write-Output "D02_RECEIPT_CREATE_BUTTON_CHOICES=$($matched.Count)"
            if($matched.Count -eq 0){throw 'D02_RECEIPT_CREATE_NOT_AVAILABLE'}
            try{
              $button=[System.Windows.Automation.InvokePattern]$matched[$matched.Count-1].GetCurrentPattern(
                [System.Windows.Automation.InvokePattern]::Pattern)
              $button.Invoke()
            }catch{throw 'D02_RECEIPT_CREATE_MODAL_CONFIRM_FAILED'}
            # The same button also exists on Host's empty-catalog page.
            # Its continued visibility does not prove that create failed.
            # Verify creation from an independent personal Workspace inventory.
            Write-Output 'D02_RECEIPT_NATIVE_CREATE_CLICK_SENT=TRUE'
            $b2=Start-Process -FilePath $edge -PassThru -ArgumentList @(
              '--force-renderer-accessibility','--no-first-run','--no-default-browser-check',
              "--user-data-dir=$profile","--app=$origin/workspace/#/domain"
            )
            $null=Await 'Моя работа' '' 'D02_RECEIPT_DOMAIN_NOT_VISIBLE'
            $create=Locate 'Мой профиль' 'button'
            if(!$create){
              if(Locate 'Чтение рабочих областей не разрешено Kernel.' ''){
                throw 'D02_RECEIPT_T2_CAPABILITY_READ_DENIED'
              }
              $selector=Await 'Личная рабочая область' 'combo' 'D02_RECEIPT_PERSONAL_AREA_SELECTOR_NOT_FOUND'
              Write-Output 'D02_RECEIPT_NATIVE_PERSONAL_AREA_SELECTOR=PASS'
              $usedSelectionItem=$false
              $options=[System.Collections.Generic.List[object]]::new()
              try{
                $expand=[System.Windows.Automation.ExpandCollapsePattern]$selector.GetCurrentPattern(
                  [System.Windows.Automation.ExpandCollapsePattern]::Pattern)
                $expand.Expand()
              }catch{}
              $listItems=$selector.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                  [System.Windows.Automation.ControlType]::ListItem))
              foreach($item in $listItems){
                $label=$item.Current.Name
                if($label -and $label.StartsWith('Личная область ')){$options.Add($item)}
              }
              Write-Output "D02_RECEIPT_PERSONAL_AREA_OPTIONS_UIA=$($options.Count)"
              if($options.Count -eq 0){
                # Chromium-backed HTML select sometimes exposes no ListItem
                # children in UIA even when the control has options. Use the
                # same keyboard selection a person would perform.
                Write-Output 'D02_RECEIPT_SELECT_OPTIONS_UIA_VIRTUALIZED=TRUE'
                Add-Type -AssemblyName System.Windows.Forms
                $selector.SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
                [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
                [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                Write-Output 'D02_RECEIPT_PERSONAL_AREA_FALLBACK_KEYBOARD=USED'
              }else{
                try{
                  $choice=[System.Windows.Automation.SelectionItemPattern]$options[0].GetCurrentPattern(
                    [System.Windows.Automation.SelectionItemPattern]::Pattern)
                  $choice.Select()
                  $usedSelectionItem=$true
                  Write-Output 'D02_RECEIPT_PERSONAL_AREA_SELECTED_BY_UIA=PASS'
                }catch{
                  Add-Type -AssemblyName System.Windows.Forms
                  $selector.SetFocus()
                  [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
                  [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
                  [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                  Write-Output 'D02_RECEIPT_PERSONAL_AREA_FALLBACK_KEYBOARD=USED'
                }
              }
              $editorVisible=$false
              for($i=0;$i -lt 36;$i++){
                if(Locate 'Мой профиль' 'button'){
                  $editorVisible=$true;break
                }
                Start-Sleep -Milliseconds 500
              }
              if($editorVisible){Write-Output 'D02_RECEIPT_NATIVE_PERSONAL_AREA_CONFIRMED=PASS'}
              if(!$editorVisible){
                if(Locate 'Host не подтвердил выбранную рабочую область. Запись в Kernel недоступна.' ''){
                  throw 'D02_RECEIPT_HOST_FOCUS_REJECTED'
                }
                if(Locate 'Чтение рабочих областей не разрешено Kernel.' ''){
                  throw 'D02_RECEIPT_T2_CAPABILITY_READ_DENIED'
                }
                if(Locate 'Сохранённых результатов пока нет.' ''){
                  Write-Output 'D02_RECEIPT_WORKSPACE_VIEW_RENDERED_NO_EDITOR=TRUE'
                }
                throw 'D02_RECEIPT_NATIVE_WORKSPACE_NOT_FOCUSED'
              }
            }
            # Open the profile on demand instead of showing seven technical
            # families and an editor to every new visitor.
            Activate 'Мой профиль' 'D02_RECEIPT_PROFILE_SHORTCUT_MISSING'
            try {
              Invoke 'Создать профиль в рабочей области' 'D02_RECEIPT_PROFILE_EDITOR_UNAVAILABLE'
            }catch{
              # Edge can expose a genuine button without InvokePattern.
              # Use the actual focused control and keyboard, then require
              # the editor to become visible before recording any success.
              if(!(Locate 'Как к вам обращаться' 'edit')){
                $editorButton=Await 'Создать профиль в рабочей области' 'button' 'D02_RECEIPT_PROFILE_EDITOR_UNAVAILABLE'
                try{
                  Add-Type -AssemblyName System.Windows.Forms
                  $editorButton.SetFocus()
                  [System.Windows.Forms.SendKeys]::SendWait(' ')
                  Write-Output 'D02_RECEIPT_PROFILE_EDITOR_NATIVE_KEYBOARD=USED'
                }catch{throw 'D02_RECEIPT_PROFILE_EDITOR_KEYBOARD_FAILED'}
              }
            }
            $null=Await 'Как к вам обращаться' 'edit' 'D02_RECEIPT_PROFILE_EDITOR_NOT_OPEN'
            Write-Output 'D02_RECEIPT_PROFILE_EDITOR_VISIBLE=PASS'
            Enter 'Как к вам обращаться' 'Club проверка пользовательской записи' 'D02_RECEIPT_ALIAS_INPUT_FAILED'
            Enter 'Цели' 'Сохранить собственную запись между запусками' 'D02_RECEIPT_GOAL_INPUT_FAILED'
            Write-Output 'D02_RECEIPT_NATIVE_REACT_INPUT_EVENTS=PASS'
            Invoke 'Сохранить профиль в IWXA' 'D02_RECEIPT_NATIVE_SAVE_FAILED'
            $null=AwaitPrefix 'Профиль сохранён. Подтверждена версия ' 'D02_RECEIPT_ORIGINAL_KERNEL_READBACK_MISSING'
            Write-Output 'D02_RECEIPT_NATIVE_ORIGINAL_KERNEL_WRITE_READBACK=PASS'
            # Initial receipt is confirmed. Full independent Kernel
            # readback will be required after the new-profile .iwxa import.
            Write-Output 'D02_RECEIPT_PROFILE_READY_FOR_EXCHANGE=PASS'
          }finally{
            foreach($p in @($b3,$b2,$b1)){
              if($p){try{$p.Kill($true)}catch{}}
            }
            if($server){try{$server.Kill($true)}catch{}}
          }
      - name: Native user goal goes from Club form into original Project Result and survives cold restart
        id: native_goal
        if: steps.native_profile.outcome == 'success'
        continue-on-error: true
        working-directory: site
        env:
          PORT: '55444'
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Windows.Forms
          $site=(Resolve-Path .).Path
          $origin='http://localhost:55444'
          $profile=Join-Path $env:RUNNER_TEMP 'd02-receipt-persistent-profile'
          if(!(Test-Path $profile)){throw 'D02_GOAL_ORIGINAL_PROFILE_MISSING'}
          $edge=@(
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Microsoft\Edge\Application\msedge.exe')
          )|Where-Object{Test-Path $_}|Select-Object -First 1
          if(!$edge){throw 'D02_GOAL_EDGE_MISSING'}
          $scope=[System.Windows.Automation.TreeScope]::Descendants
          function Locate([string]$name,[string]$kind){
            $cond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,$name)
            if($kind -eq 'button' -or $kind -eq 'edit' -or $kind -eq 'link' -or $kind -eq 'combo'){
              $ctl=if($kind -eq 'button'){[System.Windows.Automation.ControlType]::Button}
                elseif($kind -eq 'edit'){[System.Windows.Automation.ControlType]::Edit}
                elseif($kind -eq 'link'){[System.Windows.Automation.ControlType]::Hyperlink}
                else{[System.Windows.Automation.ControlType]::ComboBox}
              $cond=[System.Windows.Automation.AndCondition]::new(
                $cond,[System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::ControlTypeProperty,$ctl))
            }
            foreach($p in @(Get-Process msedge -ErrorAction SilentlyContinue|
              Where-Object {$_.MainWindowHandle -ne 0})){
              try{
                $root=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$p.MainWindowHandle)
                if(!$root){continue}
                $found=$root.FindFirst($scope,$cond)
                if($found -and $found.Current.IsEnabled){return $found}
              }catch{}
            }
            return $null
          }
          function Await([string]$name,[string]$kind,[string]$code){
            for($k=0;$k -lt 110;$k++){
              $x=Locate $name $kind
              if($x){return $x}
              Start-Sleep -Milliseconds 350
            }
            throw $code
          }
          function Prefix([string]$prefix,[string]$kind){
            foreach($p in @(Get-Process msedge -ErrorAction SilentlyContinue|
              Where-Object {$_.MainWindowHandle -ne 0})){
              try{
                $root=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$p.MainWindowHandle)
                if(!$root){continue}
                foreach($x in $root.FindAll($scope,[System.Windows.Automation.Condition]::TrueCondition)){
                  if($x.Current.Name -and $x.Current.Name.StartsWith($prefix) -and $x.Current.IsEnabled -and
                     (!$kind -or $x.Current.ControlType.ProgrammaticName -match $kind)){return $x}
                }
              }catch{}
            }
            return $null
          }
          function AwaitPrefix([string]$prefix,[string]$kind,[string]$code){
            for($k=0;$k -lt 110;$k++){
              $x=Prefix $prefix $kind
              if($x){return $x}
              Start-Sleep -Milliseconds 350
            }
            throw $code
          }
          function Press($node,[string]$code){
            try{
              $pattern=[System.Windows.Automation.InvokePattern]$node.GetCurrentPattern(
                [System.Windows.Automation.InvokePattern]::Pattern)
              $pattern.Invoke()
            }catch{
              try{
                $node.SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
              }catch{throw $code}
            }
          }
          function Enter([string]$name,[string]$value,[string]$code){
            for($attempt=0;$attempt -lt 3;$attempt++){
              $node=Await $name 'edit' $code
              try{
                $node.SetFocus()
                Start-Sleep -Milliseconds 150
                Set-Clipboard -Value $value
                [System.Windows.Forms.SendKeys]::SendWait('^a')
                [System.Windows.Forms.SendKeys]::SendWait('^v')
                for($k=0;$k -lt 20;$k++){
                  Start-Sleep -Milliseconds 140
                  $current=Locate $name 'edit'
                  if(!$current){continue}
                  $v=[System.Windows.Automation.ValuePattern]$current.GetCurrentPattern(
                    [System.Windows.Automation.ValuePattern]::Pattern)
                  if($v.Current.Value -ceq $value){return}
                }
              }catch{}
              Start-Sleep -Milliseconds 350
            }
            throw $code
          }
          $server=$null;$browser=$null;$reopened=$null
          try{
            $server=Start-Process -FilePath node -WorkingDirectory $site -ArgumentList @(
              'scripts/serve-current-static.mjs','dist','--t2-loopback'
            ) -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'd02-goal-http.private.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'd02-goal-error.private.log') -PassThru
            $ready=$false
            for($k=0;$k -lt 80;$k++){
              Start-Sleep -Milliseconds 300
              try{
                if((Invoke-WebRequest -Uri 'http://127.0.0.1:55444/projects/' -TimeoutSec 2).StatusCode -eq 200){
                  $ready=$true;break
                }
              }catch{}
            }
            if(!$ready){throw 'D02_GOAL_HOST_NOT_READY'}
            $browser=Start-Process -FilePath $edge -PassThru -ArgumentList @(
              '--force-renderer-accessibility','--no-first-run','--no-default-browser-check',
              "--user-data-dir=$profile","--app=$origin/projects/#club-goal-map"
            )
            $null=Await 'Мои цели и следующие действия' '' 'D02_GOAL_EDITOR_NOT_VISIBLE'
            Enter 'Какую цель выбираете' 'Сохранить семейный резерв' 'D02_GOAL_NAME_INPUT_FAILED'
            Enter 'Какой результат хотите получить' 'Запас на три месяца' 'D02_GOAL_RESULT_INPUT_FAILED'
            Enter 'Что сделаете вначале' 'Сверю ближайшие платежи' 'D02_GOAL_NEXT_STEP_FAILED'
            Enter 'Как поймёте, что цель достигнута' 'Денег хватит на 90 дней' 'D02_GOAL_CRITERION_FAILED'
            Press (Await 'Записать цель' 'button' 'D02_GOAL_SUBMIT_MISSING') 'D02_GOAL_SUBMIT_FAILED'
            $null=AwaitPrefix 'Цель записана.' '' 'D02_GOAL_LOCAL_RESULT_NOT_CONFIRMED'
            Write-Output 'D02_GOAL_NATIVE_PUBLIC_FORM_SAVED=PASS'
            Press (Await 'Сохранить в IWXA' 'link' 'D02_GOAL_EXPLICIT_HANDOFF_LINK_MISSING') 'D02_GOAL_HANDOFF_LINK_FAILED'
            $null=Await 'Перенести результаты из Клуба' '' 'D02_GOAL_ORIGINAL_HOST_IMPORT_CARD_MISSING'
            # The status message is not an authority. The real in-page source
            # preview is only constructed after original Host has accepted the
            # exact one-Result proposal and validated its session envelope.
            $preview=$null
            for($i=0;$i -lt 70;$i++){
              # Chromium accessibility splits the "Файл:" wrapper from its
              # static filename span. The exact live one-Result source label
              # exists only after Host accepted and parsed the proposal.
              $preview=Prefix 'Результат из текущей страницы' ''
              if($preview){break}
              Start-Sleep -Milliseconds 350
            }
            if(!$preview){
              foreach($entry in @(
                @{label='CLUB_T2_CREATE_SOURCE_INVALID';id='INVALID_CREATE_SELECTION'},
                @{label='CLUB_T2_ORIGIN_DENIED';id='ORIGIN_DENIED'},
                @{label='CLUB_T2_SOURCE_DISCONNECTED';id='SOURCE_DISCONNECTED'},
                @{label='Выберите копию данных, сохранённую на сайте Клуба.';id='NO_PREVIEW'},
                @{label='Защищённая рабочая область не подключена.';id='PROPOSAL_NOT_ACCEPTED'},
                @{label='Результат из текущей страницы';id='SOURCE_LABEL_PRESENT'}
              )){
                if(Prefix $entry.label ''){Write-Output "D02_GOAL_PREVIEW_DIAGNOSTIC=$($entry.id)"}
              }
              throw 'D02_GOAL_ORIGINAL_T2_PROPOSAL_PREVIEW_MISSING'
            }
            Write-Output 'D02_GOAL_NATIVE_ORIGINAL_HOST_PREVIEW=PASS'
            $target=AwaitPrefix 'Личная область 1' 'Button' 'D02_GOAL_TARGET_WORKSPACE_MISSING'
            Press $target 'D02_GOAL_TARGET_FOCUS_FAILED'
            $checkbox=Await 'Подтверждаю запись перечисленных результатов в выбранную область T2.' '' 'D02_GOAL_CONSENT_NOT_FOUND'
            try{
              $toggle=[System.Windows.Automation.TogglePattern]$checkbox.GetCurrentPattern(
                [System.Windows.Automation.TogglePattern]::Pattern)
              if($toggle.Current.ToggleState -ne [System.Windows.Automation.ToggleState]::On){$toggle.Toggle()}
            }catch{
              $checkbox.SetFocus()
              [System.Windows.Forms.SendKeys]::SendWait(' ')
            }
            $null=Await 'Перенести в T2' 'button' 'D02_GOAL_NATIVE_COMMIT_NOT_READY'
            Press (Await 'Перенести в T2' 'button' 'D02_GOAL_NATIVE_COMMIT_NOT_READY') 'D02_GOAL_NATIVE_COMMIT_FAILED'
            Write-Output 'D02_GOAL_NATIVE_EXPLICIT_COMMIT_INVOKED=TRUE'
            # The Host only reaches this notice AFTER the original Kernel
            # command returned an identity-checked receipt and the live Club
            # in-page event acknowledged its source snapshot. The transient
            # source status is inside a CLOSED session dialog and UIA does
            # not expose it until that dialog is opened.
            $hostAck=AwaitPrefix 'Kernel сохранил результат.' '' 'D02_GOAL_ORIGINAL_HOST_ACK_MISSING'
            $verified=AwaitPrefix 'Проект: CREATED' '' 'D02_GOAL_PROJECT_CREATED_WITNESS_MISSING'
            if(!$hostAck -or !$verified){throw 'D02_GOAL_KERNEL_RECEIPT_EVIDENCE_INCOMPLETE'}
            Write-Output 'D02_GOAL_NATIVE_T2_KERNEL_COMMIT_RECEIPT=PASS'
            Write-Output 'D02_GOAL_NATIVE_EXPLICIT_SOURCE_ACK=PASS'
            try{$browser.Kill($true)}catch{}
            Start-Sleep -Milliseconds 900
            $reopened=Start-Process -FilePath $edge -PassThru -ArgumentList @(
              '--force-renderer-accessibility','--no-first-run','--no-default-browser-check',
              "--user-data-dir=$profile","--app=$origin/workspace/#/domain"
            )
            $null=Await 'Моя работа' '' 'D02_GOAL_COLD_HOST_NOT_VISIBLE'
            $selector=Await 'Личная рабочая область' 'combo' 'D02_GOAL_COLD_SELECTOR_NOT_VISIBLE'
            $selector.SetFocus()
            [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
            [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
            [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
            # The saved project is now visible first in "Мои дела и планы".
            # The seven technical families remain available but folded away.
            $null=Await 'Сохранить семейный резерв' '' 'D02_GOAL_COLD_KERNEL_RESULT_MISSING'
            Write-Output 'D02_GOAL_NATIVE_PROJECT_KERNEL_COLD_READBACK=PASS'
            # One real weekly commitment, saved through the existing
            # Club Project Result and original T2 Host, not a test-only writer.
            if($reopened){try{$reopened.Kill($true)}catch{}}
            Start-Sleep -Milliseconds 800
            $weekBrowser=Start-Process -FilePath $edge -PassThru -ArgumentList @(
              '--force-renderer-accessibility','--no-first-run','--no-default-browser-check',
              "--user-data-dir=$profile","--app=$origin/tools/action-route/#club-week-plan"
            )
            $null=Await 'Моя неделя: дела, смены и договорённости' '' 'D02_WEEK_EDITOR_NOT_VISIBLE'
            Enter 'Что нужно сделать' 'Забрать документы для семейного бюджета' 'D02_WEEK_TITLE_INPUT_FAILED'
            # A UIA InvokePattern return is not reliable confirmation that
            # a native Edge button dispatched a form submit. Use keyboard.
            $weekSave=Await 'Добавить дело' 'button' 'D02_WEEK_SUBMIT_MISSING'
            $weekSave.SetFocus()
            [System.Windows.Forms.SendKeys]::SendWait(' ')
            Write-Output 'D02_WEEK_NATIVE_KEYBOARD_SUBMIT=TRUE'
            $written=$false
            for($k=0;$k -lt 65;$k++){
              if(Prefix 'Дело обновлено в этой вкладке.' ''){$written=$true;break}
              if(Prefix 'Не удалось записать дело.' ''){throw 'D02_WEEK_SITE_WRITE_REJECTED'}
              if(Prefix 'Сначала проверьте текущий план' ''){throw 'D02_WEEK_SOURCE_NEEDS_REVIEW'}
              Start-Sleep -Milliseconds 450
            }
            if(!$written){
              Write-Output ('D02_WEEK_STATUS_UNCHANGED='+[bool](
                Prefix 'Записи остаются в этой вкладке до сохранения' ''))
              Write-Output ('D02_WEEK_LOCAL_SAVED_EXISTS='+[bool](
                Prefix 'Забрать документы для семейного бюджета' ''))
              throw 'D02_WEEK_LOCAL_WRITE_NOT_CONFIRMED'
            }
            $null=Await 'Забрать документы для семейного бюджета' '' 'D02_WEEK_ITEM_NOT_VISIBLE'
            Write-Output 'D02_WEEK_NATIVE_USER_CREATION=PASS'
            Press (Await 'Сохранить план в рабочей области' 'link' 'D02_WEEK_SAVE_LINK_MISSING') 'D02_WEEK_SAVE_LINK_FAILED'
            $null=Await 'Перенести результаты из Клуба' '' 'D02_WEEK_T2_HOST_NOT_VISIBLE'
            $null=AwaitPrefix 'Результат из текущей страницы' '' 'D02_WEEK_SOURCE_PREVIEW_MISSING'
            $target=AwaitPrefix 'Личная область 1' 'Button' 'D02_WEEK_WORKSPACE_CHOICE_MISSING'
            Press $target 'D02_WEEK_WORKSPACE_CHOICE_FAILED'
            $checkbox=Await 'Подтверждаю запись перечисленных результатов в выбранную область T2.' '' 'D02_WEEK_CONSENT_MISSING'
            try{
              $toggle=[System.Windows.Automation.TogglePattern]$checkbox.GetCurrentPattern(
                [System.Windows.Automation.TogglePattern]::Pattern)
              if($toggle.Current.ToggleState -ne [System.Windows.Automation.ToggleState]::On){$toggle.Toggle()}
            }catch{
              $checkbox.SetFocus()
              [System.Windows.Forms.SendKeys]::SendWait(' ')
            }
            Press (Await 'Перенести в T2' 'button' 'D02_WEEK_COMMIT_NOT_READY') 'D02_WEEK_COMMIT_FAILED'
            $null=AwaitPrefix 'Kernel сохранил результат.' '' 'D02_WEEK_KERNEL_RECEIPT_NOT_VISIBLE'
            $null=AwaitPrefix 'Проект: CREATED' '' 'D02_WEEK_NATIVE_CREATE_NOT_CONFIRMED'
            Write-Output 'D02_WEEK_ORIGINAL_T2_KERNEL_RECEIPT=PASS'
            if($weekBrowser){try{$weekBrowser.Kill($true)}catch{}}
            Start-Sleep -Milliseconds 900
            $weekReopened=Start-Process -FilePath $edge -PassThru -ArgumentList @(
              '--force-renderer-accessibility','--no-first-run','--no-default-browser-check',
              "--user-data-dir=$profile","--app=$origin/workspace/#/domain"
            )
            $null=Await 'Моя работа' '' 'D02_WEEK_COLD_HOST_MISSING'
            $selector=Await 'Личная рабочая область' 'combo' 'D02_WEEK_COLD_WORKSPACE_SELECT_MISSING'
            $selector.SetFocus()
            [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
            [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
            [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
            $null=Await 'Моя неделя' '' 'D02_WEEK_COLD_RESULT_NOT_VISIBLE'
            $null=Await 'Дел в недельном плане: 1' '' 'D02_WEEK_COLD_TASK_COUNT_MISMATCH'
            Write-Output 'D02_WEEK_NATIVE_KERNEL_COLD_READBACK=PASS'
          }finally{
            if($browser){try{$browser.Kill($true)}catch{}}
            if($reopened){try{$reopened.Kill($true)}catch{}}
            if($weekBrowser){try{$weekBrowser.Kill($true)}catch{}}
            if($weekReopened){try{$weekReopened.Kill($true)}catch{}}
            if($server){try{$server.Kill($true)}catch{}}
          }

      - name: Real Edge authors cooperation scenario and reads native Kernel after restart
        id: native_scenario
        if: steps.native_goal.outcome == 'success' && steps.native_profile.outcome == 'success'
        continue-on-error: true
        working-directory: site
        env:
          PORT: '55444'
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Windows.Forms
          $site=(Resolve-Path .).Path
          $origin='http://localhost:55444'
          $profile=Join-Path $env:RUNNER_TEMP 'd02-receipt-persistent-profile'
          if(!(Test-Path $profile)){throw 'D02_SCENE_PROFILE_MISSING'}
          $edge=@(
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Microsoft\Edge\Application\msedge.exe')
          )|Where-Object{Test-Path $_}|Select-Object -First 1
          if(!$edge){throw 'D02_SCENE_EDGE_MISSING'}
          $scope=[System.Windows.Automation.TreeScope]::Descendants
          function Locate([string]$name,[string]$kind){
            $cond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,$name)
            if($kind -eq 'button' -or $kind -eq 'edit' -or $kind -eq 'link' -or $kind -eq 'combo'){
              $ctl=if($kind -eq 'button'){[System.Windows.Automation.ControlType]::Button}
                elseif($kind -eq 'edit'){[System.Windows.Automation.ControlType]::Edit}
                elseif($kind -eq 'link'){[System.Windows.Automation.ControlType]::Hyperlink}
                else{[System.Windows.Automation.ControlType]::ComboBox}
              $cond=[System.Windows.Automation.AndCondition]::new(
                $cond,[System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::ControlTypeProperty,$ctl))
            }
            foreach($p in @(Get-Process msedge -ErrorAction SilentlyContinue|
              Where-Object {$_.MainWindowHandle -ne 0})){
              try{
                $root=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$p.MainWindowHandle)
                if(!$root){continue}
                $found=$root.FindFirst($scope,$cond)
                if($found -and $found.Current.IsEnabled){return $found}
              }catch{}
            }
            return $null
          }
          function Await([string]$name,[string]$kind,[string]$code){
            for($k=0;$k -lt 110;$k++){
              $x=Locate $name $kind
              if($x){return $x}
              Start-Sleep -Milliseconds 350
            }
            throw $code
          }
          function Prefix([string]$prefix,[string]$kind){
            foreach($p in @(Get-Process msedge -ErrorAction SilentlyContinue|
              Where-Object {$_.MainWindowHandle -ne 0})){
              try{
                $root=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$p.MainWindowHandle)
                if(!$root){continue}
                foreach($x in $root.FindAll($scope,[System.Windows.Automation.Condition]::TrueCondition)){
                  if($x.Current.Name -and $x.Current.Name.StartsWith($prefix) -and $x.Current.IsEnabled -and
                     (!$kind -or $x.Current.ControlType.ProgrammaticName -match $kind)){return $x}
                }
              }catch{}
            }
            return $null
          }
          function AwaitPrefix([string]$prefix,[string]$kind,[string]$code){
            for($k=0;$k -lt 110;$k++){
              $x=Prefix $prefix $kind
              if($x){return $x}
              Start-Sleep -Milliseconds 350
            }
            throw $code
          }
          function Press($node,[string]$code){
            try{
              $pattern=[System.Windows.Automation.InvokePattern]$node.GetCurrentPattern(
                [System.Windows.Automation.InvokePattern]::Pattern)
              $pattern.Invoke()
            }catch{
              try{
                $node.SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
              }catch{throw $code}
            }
          }
          function Enter([string]$name,[string]$value,[string]$code){
            for($attempt=0;$attempt -lt 3;$attempt++){
              $node=Await $name 'edit' $code
              try{
                $node.SetFocus()
                Start-Sleep -Milliseconds 150
                Set-Clipboard -Value $value
                [System.Windows.Forms.SendKeys]::SendWait('^a')
                [System.Windows.Forms.SendKeys]::SendWait('^v')
                for($k=0;$k -lt 20;$k++){
                  Start-Sleep -Milliseconds 140
                  $current=Locate $name 'edit'
                  if(!$current){continue}
                  $v=[System.Windows.Automation.ValuePattern]$current.GetCurrentPattern(
                    [System.Windows.Automation.ValuePattern]::Pattern)
                  if($v.Current.Value -ceq $value){return}
                }
              }catch{}
              Start-Sleep -Milliseconds 350
            }
            throw $code
          }

          # Browser number inputs may expose UIA Spinner/RangeValue instead
          # of Edit/ValuePattern. Use real keyboard input, then inspect the
          # actual native control (including a nested Edit) before continuing.
          function EnterNumber([string]$name,[string]$value,[string]$code){
            $target=$null
            for($search=0;$search -lt 65;$search++){
              $target=Locate $name ''
              if($target){break}
              Start-Sleep -Milliseconds 200
            }
            if(!$target){throw ($code+'_CONTROL_NOT_FOUND')}
            for($attempt=0;$attempt -lt 3;$attempt++){
              try{
                $target.SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait('^a')
                [System.Windows.Forms.SendKeys]::SendWait($value)
                [System.Windows.Forms.SendKeys]::SendWait('{TAB}')
                Start-Sleep -Milliseconds 250
                $current=Locate $name ''
                if(!$current){continue}
                $candidates=@($current)
                foreach($child in $current.FindAll($scope,
                    [System.Windows.Automation.Condition]::TrueCondition)){
                  $candidates+=@($child)
                }
                foreach($candidate in $candidates){
                  try{
                    $p=[System.Windows.Automation.ValuePattern]$candidate.GetCurrentPattern(
                      [System.Windows.Automation.ValuePattern]::Pattern)
                    if($p.Current.Value -ceq $value){return}
                  }catch{}
                  try{
                    $p=[System.Windows.Automation.RangeValuePattern]$candidate.GetCurrentPattern(
                      [System.Windows.Automation.RangeValuePattern]::Pattern)
                    if([Math]::Abs($p.Current.Value-[double]$value) -lt 0.001){return}
                  }catch{}
                }
              }catch{}
              Start-Sleep -Milliseconds 250
            }
            Write-Output ('D02_SCENE_NUMERIC_UIA_CONTROL='+$target.Current.ControlType.ProgrammaticName)
            throw $code
          }
          $server=$null;$browser=$null;$reopened=$null
          try{
            $server=Start-Process -FilePath node -WorkingDirectory $site -ArgumentList @(
              'scripts/serve-current-static.mjs','dist','--t2-loopback'
            ) -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'd02-scene-http.private.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'd02-scene-errors.private.log') -PassThru
            $ready=$false
            for($k=0;$k -lt 80;$k++){
              Start-Sleep -Milliseconds 300
              try{
                if((Invoke-WebRequest -Uri ($origin+'/projects/') -TimeoutSec 2).StatusCode -eq 200){
                  $ready=$true;break
                }
              }catch{}
            }
            if(!$ready){throw 'D02_SCENE_LOCAL_SITE_NOT_READY'}
            $browser=Start-Process -FilePath $edge -PassThru -ArgumentList @(
              '--force-renderer-accessibility','--no-first-run','--no-default-browser-check',
              "--user-data-dir=$profile","--app=$origin/projects/#club-cooperation-scenario"
            )
            $null=Await 'Как организовать работу вместе' '' 'D02_SCENE_FORM_MISSING'
            Enter 'Сценарий: Как назовём совместную задачу' 'Покупки соседям' 'D02_SCENE_TITLE_INPUT_FAILED'
            Enter 'Сценарий: Какого результата хотите получить' 'Собрать и доставить десять наборов' 'D02_SCENE_OUTCOME_INPUT_FAILED'
            EnterNumber 'Сценарий: Срок в неделях' '2' 'D02_SCENE_WEEKS_INPUT_FAILED'
            EnterNumber 'Сценарий: Бюджет, руб.' '1000' 'D02_SCENE_BUDGET_INPUT_FAILED'
            Enter 'Сценарий: Если участник откажется или не сможет продолжить' 'Согласовать замену до следующего заказа' 'D02_SCENE_FALLBACK_INPUT_FAILED'
            Enter 'Сценарий: При каких условиях можно прекратить участие' 'Предупредить до следующей доставки' 'D02_SCENE_EXIT_INPUT_FAILED'
            Enter 'Сценарий: Предлагаемая роль' 'Организатор' 'D02_SCENE_ROLE_INPUT_FAILED'
            Enter 'Сценарий: Что человек должен сделать' 'Сверить список продуктов' 'D02_SCENE_CONTRIBUTION_INPUT_FAILED'
            EnterNumber 'Сценарий: Доступно часов в неделю' '4' 'D02_SCENE_CAPACITY_INPUT_FAILED'
            Enter 'Сценарий: Что нужно сделать' 'Сверить десять покупок' 'D02_SCENE_TASK_INPUT_FAILED'
            Enter 'Сценарий: Как проверить результат' 'Десять покупок совпали с чеком' 'D02_SCENE_CHECK_INPUT_FAILED'
            EnterNumber 'Сценарий: План, часов' '2' 'D02_SCENE_HOURS_INPUT_FAILED'
            EnterNumber 'Сценарий: Предполагаемые расходы, руб.' '150' 'D02_SCENE_COST_INPUT_FAILED'
            $save=Await 'Записать сценарий' 'button' 'D02_SCENE_SAVE_BUTTON_MISSING'
            $save.SetFocus()
            [System.Windows.Forms.SendKeys]::SendWait(' ')
            $null=AwaitPrefix 'Сценарий записан в этой вкладке.' '' 'D02_SCENE_LOCAL_WRITE_MISSING'
            Write-Output 'D02_SCENE_NATIVE_USER_CREATION=PASS'
            # A native HTML hyperlink must activate by Enter/Invoke.
            # Space is for buttons/checkboxes and may only scroll the page.
            Press (Await 'Сохранить в IWXA' 'link' 'D02_SCENE_HANDOFF_MISSING') 'D02_SCENE_HANDOFF_FAILED'
            $null=Await 'Перенести результаты из Клуба' '' 'D02_SCENE_T2_HOST_MISSING'
            $null=AwaitPrefix 'Результат из текущей страницы' '' 'D02_SCENE_PREVIEW_MISSING'
            $workspace=AwaitPrefix 'Личная область 1' 'Button' 'D02_SCENE_WORKSPACE_MISSING'
            Press $workspace 'D02_SCENE_WORKSPACE_SELECT_FAILED'
            $checkbox=Await 'Подтверждаю запись перечисленных результатов в выбранную область T2.' '' 'D02_SCENE_CONSENT_MISSING'
            try{
              $toggle=[System.Windows.Automation.TogglePattern]$checkbox.GetCurrentPattern(
                [System.Windows.Automation.TogglePattern]::Pattern)
              if($toggle.Current.ToggleState -ne [System.Windows.Automation.ToggleState]::On){$toggle.Toggle()}
            }catch{
              $checkbox.SetFocus()
              [System.Windows.Forms.SendKeys]::SendWait(' ')
            }
            Press (Await 'Перенести в T2' 'button' 'D02_SCENE_COMMIT_NOT_READY') 'D02_SCENE_COMMIT_FAILED'
            $null=AwaitPrefix 'Kernel сохранил результат.' '' 'D02_SCENE_T2_RECEIPT_MISSING'
            $null=AwaitPrefix 'Проект: CREATED' '' 'D02_SCENE_NATIVE_CREATE_NOT_CONFIRMED'
