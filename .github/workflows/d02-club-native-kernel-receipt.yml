      - name: Real Edge records personal contribution and evidence in original T2
        id: native_contribution
        if: steps.native_scenario.outcome == 'success'
        continue-on-error: true
        working-directory: site
        env:
          PORT: '55444'
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Windows.Forms
          $site=(Resolve-Path .).Path
          $origin='http://localhost:55444'
          $profile=Join-Path $env:RUNNER_TEMP 'd02-receipt-persistent-profile'
          if(!(Test-Path $profile)){throw 'D02_CONTRIBUTION_ORIGINAL_PROFILE_MISSING'}
          $edge=@(
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Microsoft\Edge\Application\msedge.exe')
          )|Where-Object{Test-Path $_}|Select-Object -First 1
          if(!$edge){throw 'D02_CONTRIBUTION_EDGE_MISSING'}
          $scope=[System.Windows.Automation.TreeScope]::Descendants
          function Locate([string]$name,[string]$kind){
            $cond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,$name)
            if($kind -eq 'button' -or $kind -eq 'edit' -or $kind -eq 'link' -or $kind -eq 'combo'){
              $ctl=if($kind -eq 'button'){[System.Windows.Automation.ControlType]::Button}
                elseif($kind -eq 'edit'){[System.Windows.Automation.ControlType]::Edit}
                elseif($kind -eq 'link'){[System.Windows.Automation.ControlType]::Hyperlink}
                else{[System.Windows.Automation.ControlType]::ComboBox}
              $cond=[System.Windows.Automation.AndCondition]::new(
                $cond,[System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::ControlTypeProperty,$ctl))
            }
            foreach($p in @(Get-Process msedge -ErrorAction SilentlyContinue|
              Where-Object {$_.MainWindowHandle -ne 0})){
              try{
                $root=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$p.MainWindowHandle)
                if(!$root){continue}
                $found=$root.FindFirst($scope,$cond)
                if($found -and $found.Current.IsEnabled){return $found}
              }catch{}
            }
            return $null
          }
          function Await([string]$name,[string]$kind,[string]$code){
            for($k=0;$k -lt 110;$k++){
              $x=Locate $name $kind
              if($x){return $x}
              Start-Sleep -Milliseconds 350
            }
            throw $code
          }
          function Prefix([string]$prefix,[string]$kind){
            foreach($p in @(Get-Process msedge -ErrorAction SilentlyContinue|
              Where-Object {$_.MainWindowHandle -ne 0})){
              try{
                $root=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$p.MainWindowHandle)
                if(!$root){continue}
                foreach($x in $root.FindAll($scope,[System.Windows.Automation.Condition]::TrueCondition)){
                  if($x.Current.Name -and $x.Current.Name.StartsWith($prefix) -and $x.Current.IsEnabled -and
                     (!$kind -or $x.Current.ControlType.ProgrammaticName -match $kind)){return $x}
                }
              }catch{}
            }
            return $null
          }
          function AwaitPrefix([string]$prefix,[string]$kind,[string]$code){
            for($k=0;$k -lt 110;$k++){
              $x=Prefix $prefix $kind
              if($x){return $x}
              Start-Sleep -Milliseconds 350
            }
            throw $code
          }
          function Press($node,[string]$code){
            try{
              $pattern=[System.Windows.Automation.InvokePattern]$node.GetCurrentPattern(
                [System.Windows.Automation.InvokePattern]::Pattern)
              $pattern.Invoke()
            }catch{
              try{
                $node.SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
              }catch{throw $code}
            }
          }
          function Enter([string]$name,[string]$value,[string]$code){
            for($attempt=0;$attempt -lt 3;$attempt++){
              $node=Await $name 'edit' $code
              try{
                $node.SetFocus()
                Start-Sleep -Milliseconds 150
                Set-Clipboard -Value $value
                [System.Windows.Forms.SendKeys]::SendWait('^a')
                [System.Windows.Forms.SendKeys]::SendWait('^v')
                for($k=0;$k -lt 20;$k++){
                  Start-Sleep -Milliseconds 140
                  $current=Locate $name 'edit'
                  if(!$current){continue}
                  $v=[System.Windows.Automation.ValuePattern]$current.GetCurrentPattern(
                    [System.Windows.Automation.ValuePattern]::Pattern)
                  if($v.Current.Value -ceq $value){return}
                }
              }catch{}
              Start-Sleep -Milliseconds 350
            }
            throw $code
          }

          # Browser number inputs may expose UIA Spinner/RangeValue instead
          # of Edit/ValuePattern. Use real keyboard input, then inspect the
          # actual native control (including a nested Edit) before continuing.
          function EnterNumber([string]$name,[string]$value,[string]$code){
            $target=$null
            for($search=0;$search -lt 65;$search++){
              $target=Locate $name ''
              if($target){break}
              Start-Sleep -Milliseconds 200
            }
            if(!$target){throw ($code+'_CONTROL_NOT_FOUND')}
            for($attempt=0;$attempt -lt 3;$attempt++){
              try{
                $target.SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait('^a')
                [System.Windows.Forms.SendKeys]::SendWait($value)
                [System.Windows.Forms.SendKeys]::SendWait('{TAB}')
                Start-Sleep -Milliseconds 250
                $current=Locate $name ''
                if(!$current){continue}
                $candidates=@($current)
                foreach($child in $current.FindAll($scope,
                    [System.Windows.Automation.Condition]::TrueCondition)){
                  $candidates+=@($child)
                }
                foreach($candidate in $candidates){
                  try{
                    $p=[System.Windows.Automation.ValuePattern]$candidate.GetCurrentPattern(
                      [System.Windows.Automation.ValuePattern]::Pattern)
                    if($p.Current.Value -ceq $value){return}
                  }catch{}
                  try{
                    $p=[System.Windows.Automation.RangeValuePattern]$candidate.GetCurrentPattern(
                      [System.Windows.Automation.RangeValuePattern]::Pattern)
                    if([Math]::Abs($p.Current.Value-[double]$value) -lt 0.001){return}
                  }catch{}
                }
              }catch{}
              Start-Sleep -Milliseconds 250
            }
            Write-Output ('D02_SCENE_NUMERIC_UIA_CONTROL='+$target.Current.ControlType.ProgrammaticName)
            throw $code
          }

          $server=$null;$browser=$null;$reopened=$null
          try{
            $server=Start-Process -FilePath node -WorkingDirectory $site -ArgumentList @(
              'scripts/serve-current-static.mjs','dist','--t2-loopback'
            ) -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'd02-contribution-http.private.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'd02-contribution-errors.private.log') -PassThru
            $ready=$false
            for($k=0;$k -lt 80;$k++){
              Start-Sleep -Milliseconds 300
              try{
                if((Invoke-WebRequest -Uri ($origin+'/projects/') -TimeoutSec 2).StatusCode -eq 200){
                  $ready=$true;break
                }
              }catch{}
            }
            if(!$ready){throw 'D02_CONTRIBUTION_LOCAL_SITE_NOT_READY'}
            $browser=Start-Process -FilePath $edge -PassThru -ArgumentList @(
              '--force-renderer-accessibility','--no-first-run','--no-default-browser-check',
              "--user-data-dir=$profile","--app=$origin/projects/#club-contribution-case"
            )
            $null=Await 'Что обещал, что сделал и чем подтвердить' '' 'D02_CONTRIBUTION_FORM_NOT_VISIBLE'
            Enter 'Название вклада' 'Сверка покупки' 'D02_CONTRIBUTION_TITLE_INVALID'
            Enter 'В какой роли участвую' 'Организатор' 'D02_CONTRIBUTION_ROLE_INVALID'
            Enter 'Что обещаю сделать' 'Проверить десять продуктовых наборов' 'D02_CONTRIBUTION_PROMISE_INVALID'
            Enter 'Как проверить результат' 'Все товары и чеки совпали' 'D02_CONTRIBUTION_CRITERION_INVALID'
            EnterNumber 'План времени, часов' '2' 'D02_CONTRIBUTION_PLANNED_HOURS_INVALID'
            EnterNumber 'План расходов, руб.' '150' 'D02_CONTRIBUTION_PLANNED_COST_INVALID'
            $state=Await 'Моё состояние' 'combo' 'D02_CONTRIBUTION_STATE_NOT_FOUND'
            $state.SetFocus()
            [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
            [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
            [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
            Enter 'Что сделал' 'Проверил десять наборов' 'D02_CONTRIBUTION_ACTUAL_RESULT_INVALID'
            Enter 'Основание результата или уже понесённых затрат' 'Товарная накладная и чек номер 115' 'D02_CONTRIBUTION_BASIS_INVALID'
            EnterNumber 'Фактически потрачено часов' '2.5' 'D02_CONTRIBUTION_ACTUAL_HOURS_INVALID'
            EnterNumber 'Фактические расходы, руб.' '160' 'D02_CONTRIBUTION_ACTUAL_COST_INVALID'
            Enter 'Кто должен проверить результат' 'Координатор' 'D02_CONTRIBUTION_REVIEWER_INVALID'
            Enter 'Что нужно проверить' 'Сверить покупки с накладной' 'D02_CONTRIBUTION_REVIEW_QUESTION_INVALID'
            Press (Await 'Записать вклад' 'button' 'D02_CONTRIBUTION_SUBMIT_NOT_FOUND') 'D02_CONTRIBUTION_SUBMIT_FAILED'
            $null=AwaitPrefix 'Вклад записан в этой вкладке.' '' 'D02_CONTRIBUTION_LOCAL_WRITE_NOT_CONFIRMED'
            Write-Output 'D02_CONTRIBUTION_NATIVE_USER_CREATION=PASS'
            Press (Await 'Сохранить в IWXA' 'link' 'D02_CONTRIBUTION_SAVE_LINK_MISSING') 'D02_CONTRIBUTION_HANDOFF_FAILED'
            $null=Await 'Перенести результаты из Клуба' '' 'D02_CONTRIBUTION_ORIGINAL_HOST_MISSING'
            $null=AwaitPrefix 'Результат из текущей страницы' '' 'D02_CONTRIBUTION_SOURCE_PREVIEW_MISSING'
            Press (AwaitPrefix 'Личная область 1' 'Button' 'D02_CONTRIBUTION_WORKSPACE_MISSING') 'D02_CONTRIBUTION_WORKSPACE_SELECT_FAILED'
            $checkbox=Await 'Подтверждаю запись перечисленных результатов в выбранную область T2.' '' 'D02_CONTRIBUTION_CONSENT_MISSING'
            try{
              $toggle=[System.Windows.Automation.TogglePattern]$checkbox.GetCurrentPattern(
                [System.Windows.Automation.TogglePattern]::Pattern)
              if($toggle.Current.ToggleState -ne [System.Windows.Automation.ToggleState]::On){$toggle.Toggle()}
            }catch{
              $checkbox.SetFocus()
              [System.Windows.Forms.SendKeys]::SendWait(' ')
            }
            Press (Await 'Перенести в T2' 'button' 'D02_CONTRIBUTION_KERNEL_COMMIT_NOT_READY') 'D02_CONTRIBUTION_KERNEL_COMMIT_FAILED'
            $null=AwaitPrefix 'Kernel сохранил результат.' '' 'D02_CONTRIBUTION_KERNEL_RECEIPT_MISSING'
            $null=AwaitPrefix 'Проект: CREATED' '' 'D02_CONTRIBUTION_NATIVE_CREATE_NOT_CONFIRMED'
            Write-Output 'D02_CONTRIBUTION_ORIGINAL_T2_KERNEL_RECEIPT=PASS'
            if($browser){try{$browser.Kill($true)}catch{}}
            Start-Sleep -Milliseconds 900
            $reopened=Start-Process -FilePath $edge -PassThru -ArgumentList @(
              '--force-renderer-accessibility','--no-first-run','--no-default-browser-check',
              "--user-data-dir=$profile","--app=$origin/workspace/#/domain"
            )
            $null=Await 'Моя работа' '' 'D02_CONTRIBUTION_COLD_HOST_MISSING'
            $selector=Await 'Личная рабочая область' 'combo' 'D02_CONTRIBUTION_COLD_WORKSPACE_SELECT_MISSING'
            $selector.SetFocus()
            [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
            [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
            [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
            $null=Await 'Мой вклад: Сверка покупки' '' 'D02_CONTRIBUTION_COLD_RESULT_MISSING'
            Write-Output 'D02_CONTRIBUTION_NATIVE_KERNEL_COLD_READBACK=PASS'
          }finally{
            foreach($p in @($browser,$reopened)){if($p){try{$p.Kill($true)}catch{}}}
            if($server){try{$server.Kill($true)}catch{}}
          }

      - name: Original T2 Exchange exports the saved profile, goal and week in one physical .iwxa
        id: physical_export
        if: steps.native_profile.outcome == 'success' && steps.native_goal.outcome == 'success' && steps.native_scenario.outcome == 'success' && steps.native_contribution.outcome == 'success'
        continue-on-error: true
        working-directory: site
        env:
          PORT: '55444'
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $site=(Resolve-Path .).Path
          $origin='http://localhost:55444'
          $edge=@(
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Microsoft\Edge\Application\msedge.exe')
          )|Where-Object{Test-Path $_}|Select-Object -First 1
          if(!$edge){throw 'D02_EXCHANGE_EDGE_MISSING'}
          $profile=Join-Path $env:RUNNER_TEMP 'd02-receipt-persistent-profile'
          $download=Join-Path ([Environment]::GetFolderPath('UserProfile')) 'Downloads'
          New-Item -Path $download -ItemType Directory -Force | Out-Null
          $server=$null;$browser=$null
          $scope=[System.Windows.Automation.TreeScope]::Descendants
          function Roots(){
            foreach($p in @(Get-Process msedge -ErrorAction SilentlyContinue|
              Where-Object {$_.MainWindowHandle -ne 0})){
              $root=[System.Windows.Automation.AutomationElement]::FromHandle(
                [IntPtr]$p.MainWindowHandle)
              if($root){Write-Output $root}
            }
          }
          function Locate([string]$name,[string]$kind){
            $cond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,$name)
            if($kind -eq 'button'){
              $cond=[System.Windows.Automation.AndCondition]::new(
                $cond,[System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                  [System.Windows.Automation.ControlType]::Button))
            }
            foreach($root in @(Roots)){
              $match=$root.FindFirst($scope,$cond)
              if($match -and $match.Current.IsEnabled){return $match}
            }
            return $null
          }
          function Await([string]$label,[string]$kind,[string]$code){
            for($i=0;$i -lt 75;$i++){
              $found=Locate $label $kind
              if($found){return $found}
              Start-Sleep -Milliseconds 500
            }
            throw $code
          }
          function Activate([string]$name,[string]$code){
            $control=Await $name 'button' $code
            try{
              $pattern=[System.Windows.Automation.InvokePattern]$control.GetCurrentPattern(
                [System.Windows.Automation.InvokePattern]::Pattern)
              $pattern.Invoke()
            }catch{throw $code}
          }
          try{
            $server=Start-Process -FilePath node -WorkingDirectory $site -ArgumentList @(
              'scripts/serve-current-static.mjs','dist','--t2-loopback'
            ) -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'd02-exchange-http.private.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'd02-exchange-error.private.log') -PassThru
            $ready=$false
            for($i=0;$i -lt 60;$i++){
              Start-Sleep -Milliseconds 500
              try{
                if((Invoke-WebRequest -Uri ('http://127.0.0.1:55444/workspace/exchange/') -TimeoutSec 2).StatusCode -eq 200){$ready=$true;break}
              }catch{}
            }
            if(!$ready){throw 'D02_EXCHANGE_ORIGINAL_HOST_HTTP_UNAVAILABLE'}
            $browser=Start-Process -FilePath $edge -PassThru -ArgumentList @(
              '--force-renderer-accessibility','--no-first-run','--no-default-browser-check',
              "--user-data-dir=$profile","--app=$origin/workspace/exchange/#/home"
            )
            $null=Await 'Перенос данных' '' 'D02_EXCHANGE_NATIVE_HOST_NOT_VISIBLE'
            if(Locate 'Операция «Перенос данных» не предоставлена ядром в текущем режиме.' ''){
              throw 'D02_EXCHANGE_ORIGINAL_CAPABILITY_NOT_GRANTED'
            }
            $null=Await 'Экспортировать' '' 'D02_EXCHANGE_EXPORT_TAB_MISSING'
            $controls=[System.Collections.Generic.List[object]]::new()
            $condition=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
              [System.Windows.Automation.ControlType]::CheckBox)
            for($i=0;$i -lt 50;$i++){
              $controls.Clear()
              foreach($root in @(Roots)){
                $found=$root.FindAll($scope,$condition)
                foreach($node in $found){
                  if(!$node.Current.IsOffscreen -and $node.Current.IsEnabled){
                    $name=$node.Current.Name
                    if($name -and $name -notmatch '^(?:История событий|Ассеты$|Связи$|Схемы$)'){

                      $controls.Add($node)
                    }
                  }
                }
              }
              if($controls.Count -gt 0){break}
              Start-Sleep -Milliseconds 500
            }
            Write-Output ('D02_EXCHANGE_NATIVE_WORKSPACE_CHOICES='+$controls.Count)
            if($controls.Count -ne 1){throw 'D02_EXCHANGE_NATIVE_WORKSPACE_SELECTION_AMBIGUOUS'}
            try{
              $toggle=[System.Windows.Automation.TogglePattern]$controls[0].GetCurrentPattern(
                [System.Windows.Automation.TogglePattern]::Pattern)
              if($toggle.Current.ToggleState -ne [System.Windows.Automation.ToggleState]::On){
                $toggle.Toggle()
              }
            }catch{throw 'D02_EXCHANGE_NATIVE_WORKSPACE_SELECTION_FAILED'}
            Activate 'Предпросмотр' 'D02_EXCHANGE_PREVIEW_BUTTON_DISABLED'
            Activate 'Собрать архив' 'D02_EXCHANGE_ORIGINAL_PACKAGING_FAILED'
            # Numeric count only; never print archive contents or a user profile.
            $previewObjects='UNOBSERVED'
            try{
              $label=Locate 'Объектов' ''
              if($label){
                $next=[System.Windows.Automation.TreeWalker]::ControlViewWalker.GetNextSibling($label)
                if($next -and $next.Current.Name -match '^[0-9]+$'){$previewObjects=$next.Current.Name}
              }
            }catch{}
            Write-Output ('D02_EXCHANGE_PREVIEW_OBJECTS='+$previewObjects)
            if($previewObjects -notmatch '^[0-9]+$' -or [int]$previewObjects -lt 5){
              throw 'D02_EXCHANGE_CONTRIBUTION_NOT_INCLUDED'
            }
            Activate 'Скачать .iwxa' 'D02_EXCHANGE_DOWNLOAD_NOT_AVAILABLE'
            $file=$null
            for($i=0;$i -lt 60;$i++){
              $files=@(Get-ChildItem -Path $download -Filter '*.iwxa' -File -ErrorAction SilentlyContinue |
                Where-Object {$_.Length -gt 128})
              if($files.Count -eq 1){$file=$files[0];break}
              Start-Sleep -Milliseconds 500
            }
            if(!$file){throw 'D02_EXCHANGE_PHYSICAL_ARCHIVE_NOT_FOUND'}
            $data=[System.IO.File]::ReadAllBytes($file.FullName)
            $digest=[System.Security.Cryptography.SHA256]::HashData($data)
            if($digest.Length -ne 32 -or $data.Length -lt 129){throw 'D02_EXCHANGE_PHYSICAL_ARCHIVE_CORRUPT'}
            Write-Output 'D02_EXCHANGE_NATIVE_PHYSICAL_EXPORT=PASS'
            Activate 'Подтвердить приём' 'D02_EXCHANGE_CONFIRM_NOT_AVAILABLE'
            $null=Await 'Приём подтверждён' '' 'D02_EXCHANGE_ORIGINAL_RECEIPT_MISSING'
            Write-Output 'D02_EXCHANGE_NATIVE_ORIGINAL_CONFIRM_RECEIPT=PASS'
            Write-Output 'D02_EXCHANGE_INDEPENDENT_IMPORT=NOT_RUN'
          }finally{
            if($browser){try{$browser.Kill($true)}catch{}}
            if($server){try{$server.Kill($true)}catch{}}
          }
      - name: Independently import the physical archive with original Exchange into fresh Edge profile
        id: independent_import
        if: steps.physical_export.outcome == 'success'
        continue-on-error: true
        working-directory: site
        env:
          PORT: '55444'
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Windows.Forms
          $site=(Resolve-Path .).Path
          $origin='http://localhost:55444'
          $download=Join-Path ([Environment]::GetFolderPath('UserProfile')) 'Downloads'
          $files=@(Get-ChildItem -Path $download -Filter '*.iwxa' -File -ErrorAction SilentlyContinue |
            Where-Object {$_.Length -gt 128})
          if($files.Count -ne 1){throw 'D02_IMPORT_ORIGINAL_ARCHIVE_NOT_UNIQUE'}
          $archive=$files[0]
          $profile=Join-Path $env:RUNNER_TEMP 'd02-independent-import-profile'
          if(Test-Path $profile){throw 'D02_IMPORT_PROFILE_NOT_FRESH'}
          $edge=@(
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Microsoft\Edge\Application\msedge.exe')
          )|Where-Object{Test-Path $_}|Select-Object -First 1
          if(!$edge){throw 'D02_IMPORT_EDGE_MISSING'}
          $scope=[System.Windows.Automation.TreeScope]::Descendants
          function Roots(){
            # Edge may retain older exporter windows during its profile
            # handoff. Only inspect the fresh independent importer profile:
            # otherwise an exact title from the old workspace can give a
            # false successful focus in the wrong browser window.
            $pids=@(Get-CimInstance Win32_Process -Filter "Name='msedge.exe'" |
              Where-Object {$_.CommandLine -and
                $_.CommandLine.Contains("--user-data-dir=$profile")} |
              ForEach-Object {[int]$_.ProcessId})
            foreach($p in @(Get-Process msedge -ErrorAction SilentlyContinue |
              Where-Object {$_.MainWindowHandle -ne 0 -and
                $pids -contains [int]$_.Id})){
              try{
                $root=[System.Windows.Automation.AutomationElement]::FromHandle(
                  [IntPtr]$p.MainWindowHandle)
                if($root){Write-Output $root}
              }catch{}
            }
          }
          function Locate([string]$name,[string]$type){
            $cond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,$name)
            if($type -eq 'button' -or $type -eq 'combo' -or $type -eq 'tab' -or $type -eq 'edit'){
              $control=if($type -eq 'combo'){
                [System.Windows.Automation.ControlType]::ComboBox
              }elseif($type -eq 'tab'){
                [System.Windows.Automation.ControlType]::TabItem
              }elseif($type -eq 'edit'){
                [System.Windows.Automation.ControlType]::Edit
              }else{[System.Windows.Automation.ControlType]::Button}
              $cond=[System.Windows.Automation.AndCondition]::new(
                $cond,[System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                  $control))
            }
            foreach($root in @(Roots)){
              $found=$root.FindFirst($scope,$cond)
              if($found -and $found.Current.IsEnabled){return $found}
            }
            return $null
          }
          function Await([string]$name,[string]$type,[string]$code){
            for($i=0;$i -lt 100;$i++){
              $found=Locate $name $type
              if($found){return $found}
              Start-Sleep -Milliseconds 500
            }
            throw $code
          }
          function Click([string]$name,[string]$code){
            $node=Await $name 'button' $code
            try{
              $pattern=[System.Windows.Automation.InvokePattern]$node.GetCurrentPattern(
                [System.Windows.Automation.InvokePattern]::Pattern)
              $pattern.Invoke()
            }catch{throw $code}
          }
          # Actual Windows mouse input to the real Edge window. The UIA
          # TabItem can receive focus without dispatching a DOM click.
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class D02NativeMouse {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extraInfo);
          }
          '@
          function NativeClick($control,[string]$code){
            try{
              try{$control.SetFocus()}catch{}
              $point=$control.GetClickablePoint()
              $x=[int][Math]::Round($point.X)
              $y=[int][Math]::Round($point.Y)
              if(-not [D02NativeMouse]::SetCursorPos($x,$y)){throw $code}
              Start-Sleep -Milliseconds 100
              [D02NativeMouse]::mouse_event(0x0002,0,0,0,[UIntPtr]::Zero)
              [D02NativeMouse]::mouse_event(0x0004,0,0,0,[UIntPtr]::Zero)
            }catch{throw $code}
          }
          function ExistsUIName([string]$name){
            # Unlike Locate, this includes disabled buttons. Export Download
            # is disabled on an empty export panel, but still visible there.
            $cond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,$name)
            foreach($root in @(Roots)){
              if($root.FindFirst($scope,$cond)){return $true}
            }
            return $false
          }
          function ImportTabSelected($tab){
            try{
              $pattern=[System.Windows.Automation.SelectionItemPattern]$tab.GetCurrentPattern(
                [System.Windows.Automation.SelectionItemPattern]::Pattern)
              return [bool]$pattern.Current.IsSelected
            }catch{return $false}
          }
          function ActivateTab([string]$name,[string]$code){
            # Edge exposes HTML <button role="tab"> as UIA TabItem. Mouse
            # GetClickablePoint may be unavailable in a Windows CI session;
            # use accessible UI actions and real keyboard events first.
            $tab=Await $name 'tab' $code
            $method='none'
            try{
              $pattern=[System.Windows.Automation.SelectionItemPattern]$tab.GetCurrentPattern(
                [System.Windows.Automation.SelectionItemPattern]::Pattern)
              $pattern.Select()
              $method='uia-selection'
            }catch{
              Write-Output 'D02_IMPORT_TAB_UIA_SELECTION_UNAVAILABLE=TRUE'
            }
            Start-Sleep -Milliseconds 200
            if(-not (ImportTabSelected $tab)){
              try{
                $legacy=[System.Windows.Automation.LegacyIAccessiblePattern]$tab.GetCurrentPattern(
                  [System.Windows.Automation.LegacyIAccessiblePattern]::Pattern)
                $legacy.DoDefaultAction()
                $method='legacy-default-action'
              }catch{
                Write-Output 'D02_IMPORT_TAB_LEGACY_DEFAULT_UNAVAILABLE=TRUE'
              }
            }
            Start-Sleep -Milliseconds 200
            if(-not (ImportTabSelected $tab)){
              try{
                $tab.SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                Start-Sleep -Milliseconds 100
                [System.Windows.Forms.SendKeys]::SendWait(' ')
                $method='native-keyboard'
              }catch{
                Write-Output 'D02_IMPORT_TAB_KEYBOARD_UNAVAILABLE=TRUE'
              }
            }
            Start-Sleep -Milliseconds 250
            if(-not (ImportTabSelected $tab) -and (ExistsUIName 'Скачать .iwxa')){
              # Final native pointer fallback; its absence is a CI desktop
              # limitation, not evidence that the original Kernel denied import.
              try{
                NativeClick $tab $code
                $method='native-pointer'
              }catch{
                Write-Output 'D02_IMPORT_TAB_POINTER_UNAVAILABLE=TRUE'
              }
            }
            Start-Sleep -Milliseconds 250
            $selected=ImportTabSelected $tab
            Write-Output "D02_IMPORT_NATIVE_TAB_ACTION=$method"
            Write-Output "D02_IMPORT_NATIVE_TAB_SELECTED=$selected"
            Write-Output ("D02_IMPORT_EXPORT_PANEL_PRESENT=" + (ExistsUIName 'Скачать .iwxa'))
            if(-not $selected -and (ExistsUIName 'Скачать .iwxa')){
              throw 'D02_IMPORT_TAB_DID_NOT_SWITCH'
            }
          }
          function AwaitPrefix([string]$prefix,[string]$code){
            for($i=0;$i -lt 100;$i++){
              foreach($root in @(Roots)){
                foreach($node in $root.FindAll($scope,
                  [System.Windows.Automation.Condition]::TrueCondition)){
                  $name=$node.Current.Name
                  if($name -and $name.StartsWith($prefix)){return $name}
                }
              }
              Start-Sleep -Milliseconds 500
            }
            throw $code
          }
          $server=$null;$browser=$null;$reopened=$null;$weekBrowser=$null;$weekReopened=$null
          try{
            $server=Start-Process -FilePath node -WorkingDirectory $site -ArgumentList @(
              'scripts/serve-current-static.mjs','dist','--t2-loopback'
            ) -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'd02-import-http.private.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'd02-import-error.private.log') -PassThru
            $ready=$false
            for($i=0;$i -lt 60;$i++){
              Start-Sleep -Milliseconds 500
              try{
                if((Invoke-WebRequest -Uri ('http://127.0.0.1:55444/workspace/exchange/') -TimeoutSec 2).StatusCode -eq 200){$ready=$true;break}
              }catch{}
            }
            if(!$ready){throw 'D02_IMPORT_ORIGINAL_HOST_HTTP_UNAVAILABLE'}
            $browser=Start-Process -FilePath $edge -PassThru -ArgumentList @(
              '--force-renderer-accessibility','--no-first-run','--no-default-browser-check',
              "--user-data-dir=$profile","--app=$origin/workspace/exchange/#/home"
            )
            $null=Await 'Перенос данных' '' 'D02_IMPORT_NATIVE_EXCHANGE_NOT_VISIBLE'
            if(Locate 'Операция «Перенос данных» не предоставлена ядром в текущем режиме.' ''){
              throw 'D02_IMPORT_ORIGINAL_CAPABILITY_NOT_GRANTED'
            }
            ActivateTab 'Импортировать' 'D02_IMPORT_NATIVE_TAB_MISSING'
            $choose=$null
            for($i=0;$i -lt 50;$i++){
              foreach($label in @('Выберите файл .iwxa','Выбрать файл','Choose File','Choose file','Browse...')){
                $choose=Locate $label ''
                if($choose){break}
              }
              if($choose){break}
              Start-Sleep -Milliseconds 250
            }
            if($choose){
              Write-Output 'D02_IMPORT_NATIVE_FILE_CONTROL_FOUND=PASS'
              try{
                $pattern=[System.Windows.Automation.InvokePattern]$choose.GetCurrentPattern(
                  [System.Windows.Automation.InvokePattern]::Pattern)
                $pattern.Invoke()
              }catch{
                try{
                  $choose.SetFocus()
                  [System.Windows.Forms.SendKeys]::SendWait(' ')
                  Write-Output 'D02_IMPORT_FILE_PICKER_TRIGGER=KEYBOARD_ON_CONTROL'
                }catch{NativeClick $choose 'D02_IMPORT_NATIVE_FILE_PICKER_NOT_OPENED'}
              }
            }else{
              # Chromium may expose <input type=file> as a nested OS chooser
              # without its HTML aria-label. The first keyboard Tab after
              # the selected Import tab goes to that native file input.
              # Do not inspect or print filenames or profile contents.
              $tab=Locate 'Импортировать' 'tab'
              if(!$tab -or !(ImportTabSelected $tab) -or
                 (ExistsUIName 'Скачать .iwxa')){
                throw 'D02_IMPORT_TAB_OR_PANEL_NOT_CONFIRMED'
              }
              try{
                $tab.SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait('{TAB}')
                Start-Sleep -Milliseconds 200
                $focus=[System.Windows.Automation.AutomationElement]::FocusedElement
                if(!$focus){throw 'D02_IMPORT_FILE_FOCUS_MISSING'}
                $focusType=$focus.Current.ControlType.ProgrammaticName
                Write-Output "D02_IMPORT_FIRST_FOCUS_TYPE=$focusType"
                if($focusType -notmatch 'Button|Edit|Group|SplitButton'){
                  throw 'D02_IMPORT_FOCUSED_NON_FILE_CONTROL'
                }
                [System.Windows.Forms.SendKeys]::SendWait(' ')
                Write-Output 'D02_IMPORT_FILE_PICKER_TRIGGER=KEYBOARD_TAB_FROM_IMPORT'
              }catch{
                throw 'D02_IMPORT_NATIVE_FILE_PICKER_KEYBOARD_FAILED'
              }
            }
            Start-Sleep -Milliseconds 700
            # The standard Windows file chooser belongs to Edge. Entering an
            # actual file path here is a genuine native user operation; no
            # page.evaluate, simulated Kernel command or fabricated package.
            Set-Clipboard -Value $archive.FullName
            [System.Windows.Forms.SendKeys]::SendWait('%n')
            Start-Sleep -Milliseconds 300
            [System.Windows.Forms.SendKeys]::SendWait('^v')
            [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
            Write-Output 'D02_IMPORT_NATIVE_FILE_CHOOSER_USED=TRUE'
            $null=Await 'Импортировать (1)' 'button' 'D02_IMPORT_PREVIEW_OR_PLAN_NOT_READY'
            Write-Output 'D02_IMPORT_ORIGINAL_PREVIEW=PASS'
            Click 'Импортировать (1)' 'D02_IMPORT_COMMIT_BUTTON_DISABLED'
            $null=Await 'Отчёт' '' 'D02_IMPORT_ORIGINAL_RECEIPT_MISSING'
            if(Locate 'Импорт выполнен не полностью' ''){
              throw 'D02_IMPORT_PARTIAL_COMMIT'
            }
            $null=Await 'Объектов создано' '' 'D02_IMPORT_OBJECT_COUNT_MISSING'
            Write-Output 'D02_IMPORT_NATIVE_ORIGINAL_COMMIT_RECEIPT=PASS'
            try{$browser.Kill($true)}catch{}
            Start-Sleep -Milliseconds 1200
            $reopened=Start-Process -FilePath $edge -PassThru -ArgumentList @(
              '--force-renderer-accessibility','--no-first-run','--no-default-browser-check',
              "--user-data-dir=$profile","--app=$origin/workspace/#/domain"
            )
            $null=Await 'Моя работа' '' 'D02_IMPORT_REOPEN_DOMAIN_MISSING'
            # Host never assumes focus merely because one imported workspace
            # exists. Select it explicitly through the original native UI.
            $resume=Locate 'Открыть мою рабочую область' 'button'
            if($resume){
              Click 'Открыть мою рабочую область' 'D02_IMPORT_WORKSPACE_FOCUS_FAILED'
              Write-Output 'D02_IMPORT_NEW_WORKSPACE_SELECTED_BY_USER=PASS'
            }else{
              $selector=Await 'Личная рабочая область' 'combo' 'D02_IMPORT_WORKSPACE_SELECTOR_MISSING'
              try{
                $selector.SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
                [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
                [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                Write-Output 'D02_IMPORT_NEW_WORKSPACE_SELECTED_BY_USER=PASS'
              }catch{throw 'D02_IMPORT_WORKSPACE_FOCUS_FAILED'}
            }
            # The separate Kernel-backed profile editor is the actual readback.
            # A transient UIA failure on this optional refresh must not suppress
            # or fake that mandatory independent read.
            if(Locate 'Обновить результаты' 'button'){
              try{
                Click 'Обновить результаты' 'D02_IMPORT_READBACK_REFRESH_FAILED'
              }catch{
                Write-Output 'D02_IMPORT_OPTIONAL_REFRESH=UNAVAILABLE_USE_KERNEL_EDITOR'
              }
            }
            # Evidence about the imported Host surface, not about private
            # values; errors remain visible instead of being ignored.
            Write-Output ('D02_IMPORT_FRESH_PROFILE_EDGE_WINDOWS='+
              @((Roots)).Count)
            Write-Output ('D02_IMPORT_FRESH_DOMAIN_VISIBLE='+
              [bool](Locate 'Моя работа' ''))
            Write-Output ('D02_IMPORT_FRESH_OVERVIEW_VISIBLE='+
              [bool](Locate 'Показать все 7 разделов' ''))
            Write-Output ('D02_IMPORT_FRESH_FOCUS_ERROR='+
              [bool](Locate 'Host не подтвердил выбранную рабочую область. Запись в Kernel недоступна.' ''))
            # T2's seven-family overview is a fresh original Kernel
            # listObjects/getObject projection. Verify imported personal
            # data from it instead of relying on the optional edit form,
            # which may not be offered until Host focus settles.
            $families=Await 'Показать все 7 разделов' '' 'D02_IMPORT_FAMILY_OVERVIEW_MISSING'
            $families.SetFocus()
            [System.Windows.Forms.SendKeys]::SendWait(' ')
            $null=AwaitPrefix 'Последний: Club проверка пользовательской записи' '' 'D02_IMPORT_PROFILE_KERNEL_FAMILY_READBACK_MISSING'
            Write-Output 'D02_IMPORT_PROFILE_ORIGINAL_KERNEL_FAMILY_GETOBJECT=PASS'
            Write-Output 'D02_IMPORT_INDEPENDENT_WORKSPACE_COLD_READBACK=PASS'
            $null=Await 'Моя неделя' '' 'D02_IMPORT_WEEK_RESULT_MISSING_AFTER_COLD_OPEN'
            $null=Await 'Дел в недельном плане: 1' '' 'D02_IMPORT_WEEK_TASK_LOST_IN_IWXA'
            Write-Output 'D02_IMPORT_WEEK_IWXA_INDEPENDENT_COLD_READBACK=PASS'
            # Read the actual imported task in the original T2 Result viewer.
            # Locate the View action in the same week card, not any project's
            # similarly named button. No temporary tab-state is reused.
            $weekHeading=Await 'Моя неделя' '' 'D02_IMPORT_WEEK_CARD_NOT_ACCESSIBLE'
            $walker=[System.Windows.Automation.TreeWalker]::ControlViewWalker
            $cursor=$weekHeading
            $weekView=$null
            for($level=0;$level -lt 12;$level++){
              if(!$cursor){break}
              try{
                $resume=$cursor.FindFirst($scope,[System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::NameProperty,'Продолжить неделю'))
                $viewCondition=[System.Windows.Automation.AndCondition]::new(
                  [System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::NameProperty,'Посмотреть'),
                  [System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                    [System.Windows.Automation.ControlType]::Button))
                $viewer=$cursor.FindFirst($scope,$viewCondition)
                if($resume -and $viewer){$weekView=$viewer;break}
                $cursor=$walker.GetParent($cursor)
              }catch{break}
            }
            if(!$weekView){throw 'D02_IMPORT_WEEK_VIEW_ACTION_NOT_FOUND'}
            $weekView.SetFocus()
            [System.Windows.Forms.SendKeys]::SendWait(' ')
            $null=Await 'Забрать документы для семейного бюджета' '' 'D02_IMPORT_WEEK_TASK_CONTENT_LOST'
            Write-Output 'D02_IMPORT_WEEK_EXACT_TASK_IN_T2_VIEWER=PASS'
            $sceneHeading=Await 'Совместная работа: Покупки соседям' '' 'D02_IMPORT_SCENE_COLD_RESULT_MISSING'
            Write-Output 'D02_IMPORT_SCENARIO_IWXA_COLD_READBACK=PASS'
            # Open the exact imported Project Result in the original
            # read-only T2 viewer and confirm its real user-authored task.
            $cursor=$sceneHeading
            $sceneView=$null
            for($level=0;$level -lt 12;$level++){
              if(!$cursor){break}
              try{
                $resume=$cursor.FindFirst($scope,[System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::NameProperty,'Продолжить дело'))
                $viewCondition=[System.Windows.Automation.AndCondition]::new(
                  [System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::NameProperty,'Посмотреть'),
                  [System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                    [System.Windows.Automation.ControlType]::Button))
                $view=$cursor.FindFirst($scope,$viewCondition)
                if($resume -and $view){$sceneView=$view;break}
                $cursor=$walker.GetParent($cursor)
              }catch{break}
            }
            if(!$sceneView){throw 'D02_IMPORT_SCENE_VIEW_ACTION_NOT_FOUND'}
            $sceneView.SetFocus()
            [System.Windows.Forms.SendKeys]::SendWait(' ')
            $null=Await 'Сверить десять покупок' '' 'D02_IMPORT_SCENE_TASK_CONTENT_LOST'
            Write-Output 'D02_IMPORT_SCENARIO_EXACT_TASK_IN_T2_VIEWER=PASS'
            $contribHeading=Await 'Мой вклад: Сверка покупки' '' 'D02_IMPORT_CONTRIBUTION_COLD_RESULT_MISSING'
            Write-Output 'D02_IMPORT_CONTRIBUTION_IWXA_COLD_READBACK=PASS'
            # Read the exact contribution's evidence from the unchanged
            # original T2 Result viewer. A self-record is not peer acceptance.
            $cursor=$contribHeading
            $claimView=$null
            for($level=0;$level -lt 12;$level++){
              if(!$cursor){break}
              try{
                $resume=$cursor.FindFirst($scope,[System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::NameProperty,'Продолжить дело'))
                $cond=[System.Windows.Automation.AndCondition]::new(
                  [System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::NameProperty,'Посмотреть'),
                  [System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                    [System.Windows.Automation.ControlType]::Button))
                $view=$cursor.FindFirst($scope,$cond)
                if($resume -and $view){$claimView=$view;break}
                $cursor=$walker.GetParent($cursor)
              }catch{break}
            }
            if(!$claimView){throw 'D02_IMPORT_CONTRIBUTION_VIEW_ACTION_NOT_FOUND'}
            $claimView.SetFocus()
            [System.Windows.Forms.SendKeys]::SendWait(' ')
            $null=AwaitPrefix 'Основание: Товарная накладная и чек номер 115' '' 'D02_IMPORT_CONTRIBUTION_EVIDENCE_LOST'
            $null=AwaitPrefix 'Записанный результат: Проверил десять наборов' '' 'D02_IMPORT_CONTRIBUTION_RESULT_LOST'
            Write-Output 'D02_IMPORT_CONTRIBUTION_EXACT_EVIDENCE_IN_T2_VIEWER=PASS'
            Write-Output 'D02_IMPORT_PRIVATE_ARCHIVE_UPLOAD=FALSE'
          }finally{
            foreach($p in @($reopened,$browser)){if($p){try{$p.Kill($true)}catch{}}}
            if($server){try{$server.Kill($true)}catch{}}
          }
      - name: Final independent native Windows verdict
        if: always()
        run: |
          $profile='${{ steps.native_profile.outcome }}'
          $export='${{ steps.physical_export.outcome }}'
          $import='${{ steps.independent_import.outcome }}'
          $goal='${{ steps.native_goal.outcome }}'
          $scenario='${{ steps.native_scenario.outcome }}'
          $contribution='${{ steps.native_contribution.outcome }}'
          Write-Output "D02_NATIVE_PROFILE_STEP=$profile"
          Write-Output "D02_NATIVE_PHYSICAL_EXPORT_STEP=$export"
          Write-Output "D02_NATIVE_INDEPENDENT_IMPORT_STEP=$import"
          Write-Output "D02_NATIVE_GOAL_KERNEL_STEP=$goal"
          Write-Output "D02_NATIVE_SCENARIO_STEP=$scenario"
          Write-Output "D02_NATIVE_CONTRIBUTION_STEP=$contribution"
          if($profile -ne 'success' -or $export -ne 'success' -or $import -ne 'success' -or $goal -ne 'success' -or $scenario -ne 'success' -or $contribution -ne 'success'){
            throw 'D02_NATIVE_END_TO_END_NOT_ACCEPTED'
          }
          Write-Output 'D02_NATIVE_FULL_INDEPENDENT_ROUNDTRIP=PASS'
          Write-Output 'D02_NATIVE_WEEK_IWXA_INDEPENDENT_ROUNDTRIP=PASS'
          Write-Output 'D02_NATIVE_SCENARIO_IWXA_INDEPENDENT_ROUNDTRIP=PASS'
          Write-Output 'D02_NATIVE_CONTRIBUTION_IWXA_INDEPENDENT_ROUNDTRIP=PASS'
      - name: Never upload private sources, profile or generated dist
        if: always()
        run: |
          Write-Output 'D02_RECEIPT_PRIVATE_DATA_UPLOAD=FALSE'
          Write-Output 'D02_RECEIPT_DIST_UPLOAD=FALSE'
