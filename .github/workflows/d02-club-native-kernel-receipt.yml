name: d02-club-native-kernel-receipt
on:
  push:
    branches: [work/2026-11-18-d02-club-qualification]
    paths: [.github/workflows/d02-club-native-kernel-receipt.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-receipt:
    runs-on: windows-latest
    timeout-minutes: 65
    defaults:
      run:
        shell: pwsh
    env:
      SITE_SHA: e0a78dd60d3262cbd4beb54dde8b7eacd0c6d97b
      T2_SHA: e70de29b72b83e2546f7ab74b17572685a728c17
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      CI: 'true'
    steps:
      - name: Preserve LF and checkout exact private site only in disposable runner
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/club.iwxa.ru
          ref: ${{ env.SITE_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: ${{ env.T2_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: t2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Assemble unmodified original T2 and complete Club site
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
          IWXA_T2_NPM_CACHE_DIR: ${{ runner.temp }}/d02-receipt-npm-cache
        run: |
          if((git rev-parse HEAD).Trim() -ne $env:SITE_SHA){throw 'D02_RECEIPT_SITE_PIN_CHANGED'}
          if((git -C ../t2 rev-parse HEAD).Trim() -ne $env:T2_SHA){throw 'D02_RECEIPT_T2_PIN_CHANGED'}
          & npm ci --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP 'd02-receipt-install.private.log')
          if($LASTEXITCODE -ne 0){throw 'D02_RECEIPT_SITE_INSTALL_FAILED'}
          & npm run build *> (Join-Path $env:RUNNER_TEMP 'd02-receipt-build.private.log')
          if($LASTEXITCODE -ne 0){throw 'D02_RECEIPT_ORIGINAL_T2_BUILD_FAILED'}
          if(-not (Test-Path dist/workspace/index.html) -or
             -not (Test-Path dist/projects/index.html)){throw 'D02_RECEIPT_DIST_INCOMPLETE'}
          Write-Output 'D02_RECEIPT_ORIGINAL_T2_SITE_BUILD=PASS'
      - name: Real Edge creates personal Workspace then writes and reads original Kernel Result
        id: native_profile
        continue-on-error: true
        working-directory: site
        env:
          PORT: '55444'
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $site=(Resolve-Path .).Path
          $origin='http://localhost:55444'
          $edge=@(
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Microsoft\Edge\Application\msedge.exe')
          )|Where-Object{Test-Path $_}|Select-Object -First 1
          if(!$edge){throw 'D02_RECEIPT_EDGE_NOT_FOUND'}
          $server=$null;$b1=$null;$b2=$null;$b3=$null
          $profile=Join-Path $env:RUNNER_TEMP 'd02-receipt-persistent-profile'
          $scope=[System.Windows.Automation.TreeScope]::Descendants
          function Locate([string]$name,[string]$type){
            $condition=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,$name)
            if($type -eq 'button' -or $type -eq 'edit' -or $type -eq 'combo'){
              $ctl=if($type -eq 'button'){[System.Windows.Automation.ControlType]::Button}
                elseif($type -eq 'combo'){[System.Windows.Automation.ControlType]::ComboBox}
                else{[System.Windows.Automation.ControlType]::Edit}
              $condition=[System.Windows.Automation.AndCondition]::new(
                $condition,[System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::ControlTypeProperty,$ctl))
            }
            foreach($p in @(Get-Process msedge -ErrorAction SilentlyContinue|
              Where-Object {$_.MainWindowHandle -ne 0})){
              $root=[System.Windows.Automation.AutomationElement]::FromHandle(
               [IntPtr]$p.MainWindowHandle)
              if(!$root){continue}
              $r=$root.FindFirst($scope,$condition)
              if($r -and $r.Current.IsEnabled){return $r}
            }
            return $null
          }
          function Await([string]$name,[string]$type,[string]$errorCode){
            for($i=0;$i -lt 80;$i++){
              $found=Locate $name $type
              if($found){return $found}
              Start-Sleep -Milliseconds 500
            }
            throw $errorCode
          }
          function Invoke([string]$label,[string]$errorCode){
            $control=Await $label 'button' $errorCode
            try{
              $pattern=[System.Windows.Automation.InvokePattern]$control.GetCurrentPattern(
               [System.Windows.Automation.InvokePattern]::Pattern)
              $pattern.Invoke()
            }catch{throw $errorCode}
          }
          function Enter([string]$label,[string]$value,[string]$errorCode){
            $control=Await $label 'edit' $errorCode
            try{
              # ValuePattern.SetValue can alter the DOM without React onChange.
              # Real keyboard paste must reach the app before any Kernel write.
              Add-Type -AssemblyName System.Windows.Forms
              $control.SetFocus()
              Set-Clipboard -Value $value -ErrorAction Stop
              [System.Windows.Forms.SendKeys]::SendWait('^a')
              [System.Windows.Forms.SendKeys]::SendWait('^v')
              $matched=$false
              for($i=0;$i -lt 25;$i++){
                Start-Sleep -Milliseconds 120
                $current=Locate $label 'edit'
                if(!$current){continue}
                $pattern=[System.Windows.Automation.ValuePattern]$current.GetCurrentPattern(
                 [System.Windows.Automation.ValuePattern]::Pattern)
                if($pattern.Current.Value -ceq $value){$matched=$true;break}
              }
              if(!$matched){throw $errorCode}
            }catch{throw $errorCode}
          }
          function AwaitPrefix([string]$prefix,[string]$errorCode){
            for($i=0;$i -lt 100;$i++){
              foreach($p in @(Get-Process msedge -ErrorAction SilentlyContinue|
                Where-Object {$_.MainWindowHandle -ne 0})){
                $root=[System.Windows.Automation.AutomationElement]::FromHandle(
                  [IntPtr]$p.MainWindowHandle)
                if(!$root){continue}
                $all=$root.FindAll($scope,[System.Windows.Automation.Condition]::TrueCondition)
                foreach($r in $all){
                  $name=$r.Current.Name
                  if($name -and $name.StartsWith($prefix)){return $name}
                }
              }
              Start-Sleep -Milliseconds 500
            }
            throw $errorCode
          }
          function HasPrefix([string]$prefix){
            foreach($p in @(Get-Process msedge -ErrorAction SilentlyContinue|
              Where-Object {$_.MainWindowHandle -ne 0})){
              $root=[System.Windows.Automation.AutomationElement]::FromHandle(
                [IntPtr]$p.MainWindowHandle)
              if(!$root){continue}
              $all=$root.FindAll($scope,[System.Windows.Automation.Condition]::TrueCondition)
              foreach($row in $all){
                $name=$row.Current.Name
                if($name -and $name.StartsWith($prefix)){return $true}
              }
            }
            return $false
          }
          function Activate([string]$label,[string]$code){
            $button=Await $label 'button' $code
            try{
              Add-Type -AssemblyName System.Windows.Forms
              $button.SetFocus()
              [System.Windows.Forms.SendKeys]::SendWait(' ')
            }catch{throw $code}
          }
          function VerifyProfileFromKernel([string]$code){
            # Host focus, the domain inventory, and the 7-family readback are
            # asynchronous after a cold start. A one-shot UIA lookup can
            # mistakenly report data loss while the Kernel is still loading.
            $open=$null
            for($i=0;$i -lt 90;$i++){
              $open=Locate 'Редактировать профиль здесь' 'button'
              if(!$open){$open=Locate 'Создать профиль в рабочей области' 'button'}
              if($open){break}
              if(Locate 'Чтение рабочих областей не разрешено Kernel.' ''){
                throw 'D02_RECEIPT_RESTART_KERNEL_READ_DENIED'
              }
              if(Locate 'Host не подтвердил выбранную рабочую область. Запись в Kernel недоступна.' ''){
                throw 'D02_RECEIPT_RESTART_HOST_FOCUS_DENIED'
              }
              Start-Sleep -Milliseconds 500
            }
            if(!$open){
              $visible=HasPrefix 'Сохранённых результатов пока нет.'
              Write-Output ('D02_RECEIPT_RESTART_NO_EDITOR_EMPTY_FAMILY='+$visible)
              throw $code
            }
            Write-Output 'D02_RECEIPT_RESTART_PROFILE_EDITOR_READY=PASS'
            if($open.Current.Name -eq 'Создать профиль в рабочей области'){
              Write-Output 'D02_RECEIPT_RESTART_EDITOR_STATE=NO_PROFILE_IN_FAMILY'
            }else{
              Write-Output 'D02_RECEIPT_RESTART_EDITOR_STATE=FOUND_SAVED_PROFILE'
            }
            Activate $open.Current.Name $code
            # The status message is advisory and its UIA exposure can lag the
            # form. After a cold browser start, this editor begins with EMPTY
            # fields; only original Kernel getObject can restore the alias.
            # Require actual native input readback, not an informational text.
            $confirmed=$false
            for($attempt=0;$attempt -lt 100;$attempt++){
              $field=Locate 'Как к вам обращаться' 'edit'
              if($field){
                try{
                  $value=[System.Windows.Automation.ValuePattern]$field.GetCurrentPattern(
                    [System.Windows.Automation.ValuePattern]::Pattern)
                  if($value.Current.Value -ceq 'Club проверка пользовательской записи'){
                    $confirmed=$true;break
                  }
                }catch{}
              }
              if(Locate 'Не удалось проверить сохранённый профиль. Запись отключена, чтобы не потерять данные.' ''){
                throw 'D02_RECEIPT_KERNEL_PROFILE_LOAD_ERROR'
              }
              Start-Sleep -Milliseconds 300
            }
            if(!$confirmed){throw $code}
            Write-Output 'D02_RECEIPT_NATIVE_KERNEL_PROFILE_FIELD_VALUE=PASS'
            Write-Output ('D02_RECEIPT_KERNEL_STATUS_TEXT_VISIBLE='+[bool](
              Locate 'Сохранённый профиль загружен через Kernel.' ''))
          }
          try {
            $server=Start-Process -FilePath node -WorkingDirectory $site -ArgumentList @(
              'scripts/serve-current-static.mjs','dist','--t2-loopback'
            ) -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'd02-receipt-http.private.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'd02-receipt-http-error.private.log') -PassThru
            $ready=$false
            for($i=0;$i -lt 60;$i++){
              Start-Sleep -Milliseconds 500
              try{
                if((Invoke-WebRequest -Uri ('http://127.0.0.1:55444/workspace/') -TimeoutSec 2).StatusCode -eq 200){
                  $ready=$true;break
                }
              }catch{}
            }
            if(!$ready){
              Write-Output ("D02_RECEIPT_HTTP_SERVER_RUNNING=" + (-not $server.HasExited))
              throw 'D02_RECEIPT_HOST_HTTP_UNAVAILABLE'
            }
            $b1=Start-Process -FilePath $edge -PassThru -ArgumentList @(
              '--force-renderer-accessibility','--no-first-run','--no-default-browser-check',
              "--user-data-dir=$profile","--app=$origin/workspace/#/workspaces"
            )
            Invoke 'Новая рабочая область' 'D02_RECEIPT_NEW_WORKSPACE_BUTTON_MISSING'
            # Host's empty catalog ALSO exposes "Создать рабочую область":
            # the modal confirmation is later in the UIA tree. Choose the
            # LAST visible matching button, not the catalog's first button.
            $matched=[System.Collections.Generic.List[object]]::new()
            $buttonCondition=[System.Windows.Automation.AndCondition]::new(
              [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::NameProperty,'Создать рабочую область'),
              [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                [System.Windows.Automation.ControlType]::Button))
            foreach($p in @(Get-Process msedge -ErrorAction SilentlyContinue|
              Where-Object {$_.MainWindowHandle -ne 0})){
              $root=[System.Windows.Automation.AutomationElement]::FromHandle(
                [IntPtr]$p.MainWindowHandle)
              if(!$root){continue}
              $all=$root.FindAll($scope,$buttonCondition)
              foreach($candidate in $all){
                if($candidate.Current.IsEnabled -and !$candidate.Current.IsOffscreen){
                  $matched.Add($candidate)
                }
              }
            }
            Write-Output "D02_RECEIPT_CREATE_BUTTON_CHOICES=$($matched.Count)"
            if($matched.Count -eq 0){throw 'D02_RECEIPT_CREATE_NOT_AVAILABLE'}
            try{
              $button=[System.Windows.Automation.InvokePattern]$matched[$matched.Count-1].GetCurrentPattern(
                [System.Windows.Automation.InvokePattern]::Pattern)
              $button.Invoke()
            }catch{throw 'D02_RECEIPT_CREATE_MODAL_CONFIRM_FAILED'}
            # The same button also exists on Host's empty-catalog page.
            # Its continued visibility does not prove that create failed.
            # Verify creation from an independent personal Workspace inventory.
            Write-Output 'D02_RECEIPT_NATIVE_CREATE_CLICK_SENT=TRUE'
            $b2=Start-Process -FilePath $edge -PassThru -ArgumentList @(
              '--force-renderer-accessibility','--no-first-run','--no-default-browser-check',
              "--user-data-dir=$profile","--app=$origin/workspace/#/domain"
            )
            $null=Await 'Моя рабочая область' '' 'D02_RECEIPT_DOMAIN_NOT_VISIBLE'
            $create=Locate 'Создать профиль в рабочей области' 'button'
            if(!$create){
              if(Locate 'Чтение рабочих областей не разрешено Kernel.' ''){
                throw 'D02_RECEIPT_T2_CAPABILITY_READ_DENIED'
              }
              $selector=Locate 'Личная рабочая область' 'combo'
              if(!$selector){throw 'D02_RECEIPT_PERSONAL_AREA_SELECTOR_NOT_FOUND'}
              Write-Output 'D02_RECEIPT_NATIVE_PERSONAL_AREA_SELECTOR=PASS'
              $usedSelectionItem=$false
              $options=[System.Collections.Generic.List[object]]::new()
              try{
                $expand=[System.Windows.Automation.ExpandCollapsePattern]$selector.GetCurrentPattern(
                  [System.Windows.Automation.ExpandCollapsePattern]::Pattern)
                $expand.Expand()
              }catch{}
              $listItems=$selector.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                  [System.Windows.Automation.ControlType]::ListItem))
              foreach($item in $listItems){
                $label=$item.Current.Name
                if($label -and $label.StartsWith('Личная область ')){$options.Add($item)}
              }
              Write-Output "D02_RECEIPT_PERSONAL_AREA_OPTIONS_UIA=$($options.Count)"
              if($options.Count -eq 0){
                # Chromium-backed HTML select sometimes exposes no ListItem
                # children in UIA even when the control has options. Use the
                # same keyboard selection a person would perform.
                Write-Output 'D02_RECEIPT_SELECT_OPTIONS_UIA_VIRTUALIZED=TRUE'
                Add-Type -AssemblyName System.Windows.Forms
                $selector.SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
                [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
                [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                Write-Output 'D02_RECEIPT_PERSONAL_AREA_FALLBACK_KEYBOARD=USED'
              }else{
                try{
                  $choice=[System.Windows.Automation.SelectionItemPattern]$options[0].GetCurrentPattern(
                    [System.Windows.Automation.SelectionItemPattern]::Pattern)
                  $choice.Select()
                  $usedSelectionItem=$true
                  Write-Output 'D02_RECEIPT_PERSONAL_AREA_SELECTED_BY_UIA=PASS'
                }catch{
                  Add-Type -AssemblyName System.Windows.Forms
                  $selector.SetFocus()
                  [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
                  [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
                  [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                  Write-Output 'D02_RECEIPT_PERSONAL_AREA_FALLBACK_KEYBOARD=USED'
                }
              }
              $editorVisible=$false
              for($i=0;$i -lt 36;$i++){
                if(Locate 'Создать профиль в рабочей области' 'button'){
                  $editorVisible=$true;break
                }
                Start-Sleep -Milliseconds 500
              }
              if($editorVisible){Write-Output 'D02_RECEIPT_NATIVE_PERSONAL_AREA_CONFIRMED=PASS'}
              if(!$editorVisible){
                if(Locate 'Host не подтвердил выбранную рабочую область. Запись в Kernel недоступна.' ''){
                  throw 'D02_RECEIPT_HOST_FOCUS_REJECTED'
                }
                if(Locate 'Чтение рабочих областей не разрешено Kernel.' ''){
                  throw 'D02_RECEIPT_T2_CAPABILITY_READ_DENIED'
                }
                if(Locate 'Сохранённых результатов пока нет.' ''){
                  Write-Output 'D02_RECEIPT_WORKSPACE_VIEW_RENDERED_NO_EDITOR=TRUE'
                }
                throw 'D02_RECEIPT_NATIVE_WORKSPACE_NOT_FOCUSED'
              }
            }
            try {
              Invoke 'Создать профиль в рабочей области' 'D02_RECEIPT_PROFILE_EDITOR_UNAVAILABLE'
            }catch{
              # Edge can expose a genuine button without InvokePattern.
              # Use the actual focused control and keyboard, then require
              # the editor to become visible before recording any success.
              if(!(Locate 'Как к вам обращаться' 'edit')){
                $editorButton=Await 'Создать профиль в рабочей области' 'button' 'D02_RECEIPT_PROFILE_EDITOR_UNAVAILABLE'
                try{
                  Add-Type -AssemblyName System.Windows.Forms
                  $editorButton.SetFocus()
                  [System.Windows.Forms.SendKeys]::SendWait(' ')
                  Write-Output 'D02_RECEIPT_PROFILE_EDITOR_NATIVE_KEYBOARD=USED'
                }catch{throw 'D02_RECEIPT_PROFILE_EDITOR_KEYBOARD_FAILED'}
              }
            }
            $null=Await 'Как к вам обращаться' 'edit' 'D02_RECEIPT_PROFILE_EDITOR_NOT_OPEN'
            Write-Output 'D02_RECEIPT_PROFILE_EDITOR_VISIBLE=PASS'
            Enter 'Как к вам обращаться' 'Club проверка пользовательской записи' 'D02_RECEIPT_ALIAS_INPUT_FAILED'
            Enter 'Цели' 'Сохранить собственную запись между запусками' 'D02_RECEIPT_GOAL_INPUT_FAILED'
            Write-Output 'D02_RECEIPT_NATIVE_REACT_INPUT_EVENTS=PASS'
            Invoke 'Сохранить профиль в IWXA' 'D02_RECEIPT_NATIVE_SAVE_FAILED'
            $null=AwaitPrefix 'Профиль сохранён. Подтверждена версия ' 'D02_RECEIPT_ORIGINAL_KERNEL_READBACK_MISSING'
            Write-Output 'D02_RECEIPT_NATIVE_ORIGINAL_KERNEL_WRITE_READBACK=PASS'
            # The profile editor read is fresh getObject, after React unmount.
            # The family list is a separate listObjects plus getObject check.
            $overviewFound=$false
            for($i=0;$i -lt 8;$i++){
              if(HasPrefix 'Последний: Club проверка пользовательской записи'){
                $overviewFound=$true;break
              }
              Start-Sleep -Milliseconds 250
            }
            if(!$overviewFound){
              Activate 'Обновить результаты' 'D02_RECEIPT_OVERVIEW_REFRESH_NOT_AVAILABLE'
              for($i=0;$i -lt 20;$i++){
                if(HasPrefix 'Последний: Club проверка пользовательской записи'){
                  $overviewFound=$true;break
                }
                Start-Sleep -Milliseconds 250
              }
            }
            Write-Output ('D02_RECEIPT_FAMILY_ALIAS_VISIBLE='+$overviewFound)
            Activate 'Закрыть редактор' 'D02_RECEIPT_PROFILE_EDITOR_NOT_CLOSED'
            VerifyProfileFromKernel 'D02_RECEIPT_REOPENED_PROFILE_FIELDS_MISMATCH'
            Write-Output 'D02_RECEIPT_NATIVE_PROFILE_REOPENED_FROM_KERNEL=PASS'
            if($b2){try{$b2.Kill($true)}catch{}}
            if($b1){try{$b1.Kill($true)}catch{}}
            Start-Sleep -Seconds 2
            $b3=Start-Process -FilePath $edge -PassThru -ArgumentList @(
              '--force-renderer-accessibility','--no-first-run','--no-default-browser-check',
              "--user-data-dir=$profile","--app=$origin/workspace/#/domain"
            )
            $null=Await 'Моя рабочая область' '' 'D02_RECEIPT_RESTART_DOMAIN_NOT_VISIBLE'
            # Host focus is intentionally not stored as cross-session authority.
            # Re-select the same user-owned Workspace after a cold browser
            # open, then require the original user alias from Kernel readback.
            $selector=Locate 'Личная рабочая область' 'combo'
            if($selector){
              Add-Type -AssemblyName System.Windows.Forms
              try{
                $selector.SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
                [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
                [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                Write-Output 'D02_RECEIPT_RESTART_WORKSPACE_SELECTED_BY_USER=TRUE'
              }catch{throw 'D02_RECEIPT_RESTART_WORKSPACE_SELECT_FAILED'}
            }
            # Refresh only after the person's explicit workspace selection;
            # this does not modify data, authority or any saved Result.
            if(Locate 'Обновить результаты' 'button'){
              Activate 'Обновить результаты' 'D02_RECEIPT_RESTART_REFRESH_FAILED'
              Write-Output 'D02_RECEIPT_RESTART_RESULT_REFRESH_REQUESTED=TRUE'
            }
            VerifyProfileFromKernel 'D02_RECEIPT_COLD_RESTART_LOST_RESULT'
            Write-Output 'D02_RECEIPT_NATIVE_ORIGINAL_KERNEL_COLD_RESTART=PASS'
            # The general result summary is asynchronous and may not have
            # finished while the profile editor was open. Verify it again
            # after the full browser restart, against one accessible status
            # backed by the independently verified Kernel record.
            $afterRestartFound=$false
            for($i=0;$i -lt 40;$i++){
              if(HasPrefix 'Последний: Club проверка пользовательской записи'){
                $afterRestartFound=$true;break
              }
              Start-Sleep -Milliseconds 250
            }
            if(!$afterRestartFound){
              Write-Output ('D02_RECEIPT_FAMILY_GENERIC_LAST_VISIBLE='+
               (HasPrefix 'Последний:'))
              Write-Output ('D02_RECEIPT_FAMILY_SAVE_COUNT_VISIBLE='+
               (HasPrefix '1 сохранено'))
              Write-Output ('D02_RECEIPT_FAMILY_ERROR_VISIBLE='+
               (HasPrefix 'Kernel не подтвердил чтение этого направления.'))
              throw 'D02_RECEIPT_FAMILY_VIEW_NOT_UPDATED'
            }
            Write-Output 'D02_RECEIPT_NATIVE_SAVED_ALIAS_FAMILY=PASS'
            Write-Output 'D02_RECEIPT_NATIVE_IWXA_EXPORT_IMPORT=NOT_RUN'
          }finally{
            foreach($p in @($b3,$b2,$b1)){
              if($p){try{$p.Kill($true)}catch{}}
            }
            if($server){try{$server.Kill($true)}catch{}}
          }
      - name: Original T2 Exchange exports a real physical .iwxa after the native profile receipt
        id: physical_export
        continue-on-error: true
        working-directory: site
        env:
          PORT: '55444'
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $site=(Resolve-Path .).Path
          $origin='http://localhost:55444'
          $edge=@(
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Microsoft\Edge\Application\msedge.exe')
          )|Where-Object{Test-Path $_}|Select-Object -First 1
          if(!$edge){throw 'D02_EXCHANGE_EDGE_MISSING'}
          $profile=Join-Path $env:RUNNER_TEMP 'd02-receipt-persistent-profile'
          $download=Join-Path ([Environment]::GetFolderPath('UserProfile')) 'Downloads'
          New-Item -Path $download -ItemType Directory -Force | Out-Null
          $server=$null;$browser=$null
          $scope=[System.Windows.Automation.TreeScope]::Descendants
          function Roots(){
            foreach($p in @(Get-Process msedge -ErrorAction SilentlyContinue|
              Where-Object {$_.MainWindowHandle -ne 0})){
              $root=[System.Windows.Automation.AutomationElement]::FromHandle(
                [IntPtr]$p.MainWindowHandle)
              if($root){Write-Output $root}
            }
          }
          function Locate([string]$name,[string]$kind){
            $cond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,$name)
            if($kind -eq 'button'){
              $cond=[System.Windows.Automation.AndCondition]::new(
                $cond,[System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                  [System.Windows.Automation.ControlType]::Button))
            }
            foreach($root in @(Roots)){
              $match=$root.FindFirst($scope,$cond)
              if($match -and $match.Current.IsEnabled){return $match}
            }
            return $null
          }
          function Await([string]$label,[string]$kind,[string]$code){
            for($i=0;$i -lt 75;$i++){
              $found=Locate $label $kind
              if($found){return $found}
              Start-Sleep -Milliseconds 500
            }
            throw $code
          }
          function Activate([string]$name,[string]$code){
            $control=Await $name 'button' $code
            try{
              $pattern=[System.Windows.Automation.InvokePattern]$control.GetCurrentPattern(
                [System.Windows.Automation.InvokePattern]::Pattern)
              $pattern.Invoke()
            }catch{throw $code}
          }
          try{
            $server=Start-Process -FilePath node -WorkingDirectory $site -ArgumentList @(
              'scripts/serve-current-static.mjs','dist','--t2-loopback'
            ) -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'd02-exchange-http.private.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'd02-exchange-error.private.log') -PassThru
            $ready=$false
            for($i=0;$i -lt 60;$i++){
              Start-Sleep -Milliseconds 500
              try{
                if((Invoke-WebRequest -Uri ('http://127.0.0.1:55444/workspace/exchange/') -TimeoutSec 2).StatusCode -eq 200){$ready=$true;break}
              }catch{}
            }
            if(!$ready){throw 'D02_EXCHANGE_ORIGINAL_HOST_HTTP_UNAVAILABLE'}
            $browser=Start-Process -FilePath $edge -PassThru -ArgumentList @(
              '--force-renderer-accessibility','--no-first-run','--no-default-browser-check',
              "--user-data-dir=$profile","--app=$origin/workspace/exchange/#/home"
            )
            $null=Await 'Перенос данных' '' 'D02_EXCHANGE_NATIVE_HOST_NOT_VISIBLE'
            if(Locate 'Операция «Перенос данных» не предоставлена ядром в текущем режиме.' ''){
              throw 'D02_EXCHANGE_ORIGINAL_CAPABILITY_NOT_GRANTED'
            }
            $null=Await 'Экспортировать' '' 'D02_EXCHANGE_EXPORT_TAB_MISSING'
            $controls=[System.Collections.Generic.List[object]]::new()
            $condition=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
              [System.Windows.Automation.ControlType]::CheckBox)
            for($i=0;$i -lt 50;$i++){
              $controls.Clear()
              foreach($root in @(Roots)){
                $found=$root.FindAll($scope,$condition)
                foreach($node in $found){
                  if(!$node.Current.IsOffscreen -and $node.Current.IsEnabled){
                    $name=$node.Current.Name
                    if($name -and $name -notmatch '^(?:История событий|Ассеты$|Связи$|Схемы$)'){

                      $controls.Add($node)
                    }
                  }
                }
              }
              if($controls.Count -gt 0){break}
              Start-Sleep -Milliseconds 500
            }
            Write-Output ('D02_EXCHANGE_NATIVE_WORKSPACE_CHOICES='+$controls.Count)
            if($controls.Count -ne 1){throw 'D02_EXCHANGE_NATIVE_WORKSPACE_SELECTION_AMBIGUOUS'}
            try{
              $toggle=[System.Windows.Automation.TogglePattern]$controls[0].GetCurrentPattern(
                [System.Windows.Automation.TogglePattern]::Pattern)
              if($toggle.Current.ToggleState -ne [System.Windows.Automation.ToggleState]::On){
                $toggle.Toggle()
              }
            }catch{throw 'D02_EXCHANGE_NATIVE_WORKSPACE_SELECTION_FAILED'}
            Activate 'Предпросмотр' 'D02_EXCHANGE_PREVIEW_BUTTON_DISABLED'
            Activate 'Собрать архив' 'D02_EXCHANGE_ORIGINAL_PACKAGING_FAILED'
            Activate 'Скачать .iwxa' 'D02_EXCHANGE_DOWNLOAD_NOT_AVAILABLE'
            $file=$null
            for($i=0;$i -lt 60;$i++){
              $files=@(Get-ChildItem -Path $download -Filter '*.iwxa' -File -ErrorAction SilentlyContinue |
                Where-Object {$_.Length -gt 128})
              if($files.Count -eq 1){$file=$files[0];break}
              Start-Sleep -Milliseconds 500
            }
            if(!$file){throw 'D02_EXCHANGE_PHYSICAL_ARCHIVE_NOT_FOUND'}
            $data=[System.IO.File]::ReadAllBytes($file.FullName)
            $digest=[System.Security.Cryptography.SHA256]::HashData($data)
            if($digest.Length -ne 32 -or $data.Length -lt 129){throw 'D02_EXCHANGE_PHYSICAL_ARCHIVE_CORRUPT'}
            Write-Output 'D02_EXCHANGE_NATIVE_PHYSICAL_EXPORT=PASS'
            Activate 'Подтвердить приём' 'D02_EXCHANGE_CONFIRM_NOT_AVAILABLE'
            $null=Await 'Приём подтверждён' '' 'D02_EXCHANGE_ORIGINAL_RECEIPT_MISSING'
            Write-Output 'D02_EXCHANGE_NATIVE_ORIGINAL_CONFIRM_RECEIPT=PASS'
            Write-Output 'D02_EXCHANGE_INDEPENDENT_IMPORT=NOT_RUN'
          }finally{
            if($browser){try{$browser.Kill($true)}catch{}}
            if($server){try{$server.Kill($true)}catch{}}
          }
      - name: Independently import the physical archive with original Exchange into fresh Edge profile
        id: independent_import
        continue-on-error: true
        working-directory: site
        env:
          PORT: '55444'
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Windows.Forms
          $site=(Resolve-Path .).Path
          $origin='http://localhost:55444'
          $download=Join-Path ([Environment]::GetFolderPath('UserProfile')) 'Downloads'
          $files=@(Get-ChildItem -Path $download -Filter '*.iwxa' -File -ErrorAction SilentlyContinue |
            Where-Object {$_.Length -gt 128})
          if($files.Count -ne 1){throw 'D02_IMPORT_ORIGINAL_ARCHIVE_NOT_UNIQUE'}
          $archive=$files[0]
          $profile=Join-Path $env:RUNNER_TEMP 'd02-independent-import-profile'
          if(Test-Path $profile){throw 'D02_IMPORT_PROFILE_NOT_FRESH'}
          $edge=@(
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Microsoft\Edge\Application\msedge.exe')
          )|Where-Object{Test-Path $_}|Select-Object -First 1
          if(!$edge){throw 'D02_IMPORT_EDGE_MISSING'}
          $scope=[System.Windows.Automation.TreeScope]::Descendants
          function Roots(){
            foreach($p in @(Get-Process msedge -ErrorAction SilentlyContinue |
              Where-Object {$_.MainWindowHandle -ne 0})){
              $root=[System.Windows.Automation.AutomationElement]::FromHandle(
                [IntPtr]$p.MainWindowHandle)
              if($root){Write-Output $root}
            }
          }
          function Locate([string]$name,[string]$type){
            $cond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,$name)
            if($type -eq 'button' -or $type -eq 'combo' -or $type -eq 'tab'){
              $control=if($type -eq 'combo'){
                [System.Windows.Automation.ControlType]::ComboBox
              }elseif($type -eq 'tab'){
                [System.Windows.Automation.ControlType]::TabItem
              }else{[System.Windows.Automation.ControlType]::Button}
              $cond=[System.Windows.Automation.AndCondition]::new(
                $cond,[System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                  $control))
            }
            foreach($root in @(Roots)){
              $found=$root.FindFirst($scope,$cond)
              if($found -and $found.Current.IsEnabled){return $found}
            }
            return $null
          }
          function Await([string]$name,[string]$type,[string]$code){
            for($i=0;$i -lt 100;$i++){
              $found=Locate $name $type
              if($found){return $found}
              Start-Sleep -Milliseconds 500
            }
            throw $code
          }
          function Click([string]$name,[string]$code){
            $node=Await $name 'button' $code
            try{
              $pattern=[System.Windows.Automation.InvokePattern]$node.GetCurrentPattern(
                [System.Windows.Automation.InvokePattern]::Pattern)
              $pattern.Invoke()
            }catch{throw $code}
          }
          # Actual Windows mouse input to the real Edge window. The UIA
          # TabItem can receive focus without dispatching a DOM click.
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class D02NativeMouse {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extraInfo);
          }
          '@
          function NativeClick($control,[string]$code){
            try{
              try{$control.SetFocus()}catch{}
              $point=$control.GetClickablePoint()
              $x=[int][Math]::Round($point.X)
              $y=[int][Math]::Round($point.Y)
              if(-not [D02NativeMouse]::SetCursorPos($x,$y)){throw $code}
              Start-Sleep -Milliseconds 100
              [D02NativeMouse]::mouse_event(0x0002,0,0,0,[UIntPtr]::Zero)
              [D02NativeMouse]::mouse_event(0x0004,0,0,0,[UIntPtr]::Zero)
            }catch{throw $code}
          }
          function ExistsUIName([string]$name){
            # Unlike Locate, this includes disabled buttons. Export Download
            # is disabled on an empty export panel, but still visible there.
            $cond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,$name)
            foreach($root in @(Roots)){
              if($root.FindFirst($scope,$cond)){return $true}
            }
            return $false
          }
          function ImportTabSelected($tab){
            try{
              $pattern=[System.Windows.Automation.SelectionItemPattern]$tab.GetCurrentPattern(
                [System.Windows.Automation.SelectionItemPattern]::Pattern)
              return [bool]$pattern.Current.IsSelected
            }catch{return $false}
          }
          function ActivateTab([string]$name,[string]$code){
            # Edge exposes HTML <button role="tab"> as UIA TabItem. Mouse
            # GetClickablePoint may be unavailable in a Windows CI session;
            # use accessible UI actions and real keyboard events first.
            $tab=Await $name 'tab' $code
            $method='none'
            try{
              $pattern=[System.Windows.Automation.SelectionItemPattern]$tab.GetCurrentPattern(
                [System.Windows.Automation.SelectionItemPattern]::Pattern)
              $pattern.Select()
              $method='uia-selection'
            }catch{
              Write-Output 'D02_IMPORT_TAB_UIA_SELECTION_UNAVAILABLE=TRUE'
            }
            Start-Sleep -Milliseconds 200
            if(-not (ImportTabSelected $tab)){
              try{
                $legacy=[System.Windows.Automation.LegacyIAccessiblePattern]$tab.GetCurrentPattern(
                  [System.Windows.Automation.LegacyIAccessiblePattern]::Pattern)
                $legacy.DoDefaultAction()
                $method='legacy-default-action'
              }catch{
                Write-Output 'D02_IMPORT_TAB_LEGACY_DEFAULT_UNAVAILABLE=TRUE'
              }
            }
            Start-Sleep -Milliseconds 200
            if(-not (ImportTabSelected $tab)){
              try{
                $tab.SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                Start-Sleep -Milliseconds 100
                [System.Windows.Forms.SendKeys]::SendWait(' ')
                $method='native-keyboard'
              }catch{
                Write-Output 'D02_IMPORT_TAB_KEYBOARD_UNAVAILABLE=TRUE'
              }
            }
            Start-Sleep -Milliseconds 250
            if(-not (ImportTabSelected $tab) -and (ExistsUIName 'Скачать .iwxa')){
              # Final native pointer fallback; its absence is a CI desktop
              # limitation, not evidence that the original Kernel denied import.
              try{
                NativeClick $tab $code
                $method='native-pointer'
              }catch{
                Write-Output 'D02_IMPORT_TAB_POINTER_UNAVAILABLE=TRUE'
              }
            }
            Start-Sleep -Milliseconds 250
            $selected=ImportTabSelected $tab
            Write-Output "D02_IMPORT_NATIVE_TAB_ACTION=$method"
            Write-Output "D02_IMPORT_NATIVE_TAB_SELECTED=$selected"
            Write-Output ("D02_IMPORT_EXPORT_PANEL_PRESENT=" + (ExistsUIName 'Скачать .iwxa'))
            if(-not $selected -and (ExistsUIName 'Скачать .iwxa')){
              throw 'D02_IMPORT_TAB_DID_NOT_SWITCH'
            }
          }
          function AwaitPrefix([string]$prefix,[string]$code){
            for($i=0;$i -lt 100;$i++){
              foreach($root in @(Roots)){
                foreach($node in $root.FindAll($scope,
                  [System.Windows.Automation.Condition]::TrueCondition)){
                  $name=$node.Current.Name
                  if($name -and $name.StartsWith($prefix)){return $name}
                }
              }
              Start-Sleep -Milliseconds 500
            }
            throw $code
          }
          $server=$null;$browser=$null;$reopened=$null
          try{
            $server=Start-Process -FilePath node -WorkingDirectory $site -ArgumentList @(
              'scripts/serve-current-static.mjs','dist','--t2-loopback'
            ) -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'd02-import-http.private.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'd02-import-error.private.log') -PassThru
            $ready=$false
            for($i=0;$i -lt 60;$i++){
              Start-Sleep -Milliseconds 500
              try{
                if((Invoke-WebRequest -Uri ('http://127.0.0.1:55444/workspace/exchange/') -TimeoutSec 2).StatusCode -eq 200){$ready=$true;break}
              }catch{}
            }
            if(!$ready){throw 'D02_IMPORT_ORIGINAL_HOST_HTTP_UNAVAILABLE'}
            $browser=Start-Process -FilePath $edge -PassThru -ArgumentList @(
              '--force-renderer-accessibility','--no-first-run','--no-default-browser-check',
              "--user-data-dir=$profile","--app=$origin/workspace/exchange/#/home"
            )
            $null=Await 'Перенос данных' '' 'D02_IMPORT_NATIVE_EXCHANGE_NOT_VISIBLE'
            if(Locate 'Операция «Перенос данных» не предоставлена ядром в текущем режиме.' ''){
              throw 'D02_IMPORT_ORIGINAL_CAPABILITY_NOT_GRANTED'
            }
            ActivateTab 'Импортировать' 'D02_IMPORT_NATIVE_TAB_MISSING'
            $choose=$null
            for($i=0;$i -lt 50;$i++){
              foreach($label in @('Выберите файл .iwxa','Выбрать файл','Choose File','Choose file','Browse...')){
                $choose=Locate $label ''
                if($choose){break}
              }
              if($choose){break}
              Start-Sleep -Milliseconds 250
            }
            if($choose){
              Write-Output 'D02_IMPORT_NATIVE_FILE_CONTROL_FOUND=PASS'
              try{
                $pattern=[System.Windows.Automation.InvokePattern]$choose.GetCurrentPattern(
                  [System.Windows.Automation.InvokePattern]::Pattern)
                $pattern.Invoke()
              }catch{
                try{
                  $choose.SetFocus()
                  [System.Windows.Forms.SendKeys]::SendWait(' ')
                  Write-Output 'D02_IMPORT_FILE_PICKER_TRIGGER=KEYBOARD_ON_CONTROL'
                }catch{NativeClick $choose 'D02_IMPORT_NATIVE_FILE_PICKER_NOT_OPENED'}
              }
            }else{
              # Chromium may expose <input type=file> as a nested OS chooser
              # without its HTML aria-label. The first keyboard Tab after
              # the selected Import tab goes to that native file input.
              # Do not inspect or print filenames or profile contents.
              $tab=Locate 'Импортировать' 'tab'
              if(!$tab -or !(ImportTabSelected $tab) -or
                 (ExistsUIName 'Скачать .iwxa')){
                throw 'D02_IMPORT_TAB_OR_PANEL_NOT_CONFIRMED'
              }
              try{
                $tab.SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait('{TAB}')
                Start-Sleep -Milliseconds 200
                $focus=[System.Windows.Automation.AutomationElement]::FocusedElement
                if(!$focus){throw 'D02_IMPORT_FILE_FOCUS_MISSING'}
                $focusType=$focus.Current.ControlType.ProgrammaticName
                Write-Output "D02_IMPORT_FIRST_FOCUS_TYPE=$focusType"
                if($focusType -notmatch 'Button|Edit|Group|SplitButton'){
                  throw 'D02_IMPORT_FOCUSED_NON_FILE_CONTROL'
                }
                [System.Windows.Forms.SendKeys]::SendWait(' ')
                Write-Output 'D02_IMPORT_FILE_PICKER_TRIGGER=KEYBOARD_TAB_FROM_IMPORT'
              }catch{
                throw 'D02_IMPORT_NATIVE_FILE_PICKER_KEYBOARD_FAILED'
              }
            }
            Start-Sleep -Milliseconds 700
            # The standard Windows file chooser belongs to Edge. Entering an
            # actual file path here is a genuine native user operation; no
            # page.evaluate, simulated Kernel command or fabricated package.
            Set-Clipboard -Value $archive.FullName
            [System.Windows.Forms.SendKeys]::SendWait('%n')
            Start-Sleep -Milliseconds 300
            [System.Windows.Forms.SendKeys]::SendWait('^v')
            [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
            Write-Output 'D02_IMPORT_NATIVE_FILE_CHOOSER_USED=TRUE'
            $null=Await 'Импортировать (1)' 'button' 'D02_IMPORT_PREVIEW_OR_PLAN_NOT_READY'
            Write-Output 'D02_IMPORT_ORIGINAL_PREVIEW=PASS'
            Click 'Импортировать (1)' 'D02_IMPORT_COMMIT_BUTTON_DISABLED'
            $null=Await 'Отчёт' '' 'D02_IMPORT_ORIGINAL_RECEIPT_MISSING'
            if(Locate 'Импорт выполнен не полностью' ''){
              throw 'D02_IMPORT_PARTIAL_COMMIT'
            }
            $null=Await 'Объектов создано' '' 'D02_IMPORT_OBJECT_COUNT_MISSING'
            Write-Output 'D02_IMPORT_NATIVE_ORIGINAL_COMMIT_RECEIPT=PASS'
            try{$browser.Kill($true)}catch{}
            Start-Sleep -Milliseconds 1200
            $reopened=Start-Process -FilePath $edge -PassThru -ArgumentList @(
              '--force-renderer-accessibility','--no-first-run','--no-default-browser-check',
              "--user-data-dir=$profile","--app=$origin/workspace/#/domain"
            )
            $null=Await 'Моя рабочая область' '' 'D02_IMPORT_REOPEN_DOMAIN_MISSING'
            # Host never assumes focus merely because one imported workspace
            # exists. Select it explicitly through the original native UI.
            $selector=Await 'Личная рабочая область' 'combo' 'D02_IMPORT_WORKSPACE_SELECTOR_MISSING'
            try{
              $selector.SetFocus()
              [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
              [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
              [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
              Write-Output 'D02_IMPORT_NEW_WORKSPACE_SELECTED_BY_USER=PASS'
            }catch{throw 'D02_IMPORT_WORKSPACE_FOCUS_FAILED'}
            if(Locate 'Обновить результаты' 'button'){
              Click 'Обновить результаты' 'D02_IMPORT_READBACK_REFRESH_FAILED'
            }
            $null=AwaitPrefix 'Последний: Club проверка пользовательской записи' 'D02_IMPORT_FRESH_PROFILE_COLD_READBACK_MISSING'
            Write-Output 'D02_IMPORT_INDEPENDENT_WORKSPACE_COLD_READBACK=PASS'
            Write-Output 'D02_IMPORT_PRIVATE_ARCHIVE_UPLOAD=FALSE'
          }finally{
            foreach($p in @($reopened,$browser)){if($p){try{$p.Kill($true)}catch{}}}
            if($server){try{$server.Kill($true)}catch{}}
          }
      - name: Final independent native Windows verdict
        if: always()
        run: |
          $profile='${{ steps.native_profile.outcome }}'
          $export='${{ steps.physical_export.outcome }}'
          $import='${{ steps.independent_import.outcome }}'
          Write-Output "D02_NATIVE_PROFILE_STEP=$profile"
          Write-Output "D02_NATIVE_PHYSICAL_EXPORT_STEP=$export"
          Write-Output "D02_NATIVE_INDEPENDENT_IMPORT_STEP=$import"
          if($profile -ne 'success' -or $export -ne 'success' -or $import -ne 'success'){
            throw 'D02_NATIVE_END_TO_END_NOT_ACCEPTED'
          }
          Write-Output 'D02_NATIVE_FULL_INDEPENDENT_ROUNDTRIP=PASS'
      - name: Never upload private sources, profile or generated dist
        if: always()
        run: |
          Write-Output 'D02_RECEIPT_PRIVATE_DATA_UPLOAD=FALSE'
          Write-Output 'D02_RECEIPT_DIST_UPLOAD=FALSE'
