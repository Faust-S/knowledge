name: D07 native Edge file chooser isolated diagnostic
on:
  push:
    branches: [work/2026-11-22-d07-methodology-v13]
    paths:
      - .github/workflows/d07-windows-file-chooser-probe.yml
      - scripts/d07-probe-windows-file-dialog.ps1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-dialog:
    runs-on: windows-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Parse native UIA probe
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/d07-probe-windows-file-dialog.ps1').Path,[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){throw 'D07_DIALOG_PROBE_PARSER_FAILED'}
          Write-Output 'D07_DIALOG_PROBE_PARSER=PASS'
      - name: Open native Edge file chooser without site, private code or customer files
        shell: pwsh
        run: |
          & pwsh -NoProfile -File './scripts/d07-probe-windows-file-dialog.ps1'
          if($LASTEXITCODE -ne 0){throw 'D07_DIALOG_PROBE_FAILED'}
