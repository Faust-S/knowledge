name: Corporate Result Exchange source qualification
on:
  push:
    branches:
      - work/2026-11-24-corporate-result-exchange
permissions:
  contents: read
jobs:
  original-enrollment:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test packages/t3-core/tests/t3-d3-independent-employee-original-enrollment.test.mjs
