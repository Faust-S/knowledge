name: D07 T3 exact-field and skill-update qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d07-t3-skill-qualification
  cancel-in-progress: true
jobs:
  exact-original-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod
          ref: 3b9c2cfbb6b7a005ef42d60efa16f7adf2b46eea
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: domain
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: 0e07725def4c881417aa83da5fbddfa448e463f6
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 3a17199515dfcef4871e99eaa4f4361fa47eab3f
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: assistant
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - name: Exact field-policy scenarios and generated skills
        env:
          D07_ORIGINAL_ASSISTANT_DIR: ${{ github.workspace }}/assistant/browser-local-inference/domain-assistant
        run: |
          node --test domain/tests/assistant-skills.test.mjs domain/tests/assistant-skill-field-policy.test.mjs > "$RUNNER_TEMP/skill-policy.log" 2>&1 || {
            echo D07_T3_EXACT_POLICY=FAIL
            grep -E '^not ok|^# (tests|pass|fail)|^  (error|code|operator):|^    (T3_ASSISTANT_[A-Z_]+|AssertionError)' "$RUNNER_TEMP/skill-policy.log" | cut -c1-180 | head -30
            exit 1
          }
          echo D07_T3_EXACT_POLICY=PASS
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/skill-policy.log"
      - name: Original common assistant regression including dynamic context
        working-directory: assistant/browser-local-inference
        run: |
          node --check domain-assistant/main.mjs
          node --test tests/domain-assistant-*.test.mjs > "$RUNNER_TEMP/shared-assistant.log" 2>&1 || {
            echo D07_T3_SHARED_ASSISTANT=FAIL
            grep -E '^not ok|^# (tests|pass|fail)|^  (error|code|operator):|^    (T3_ASSISTANT_[A-Z_]+|AssertionError)' "$RUNNER_TEMP/shared-assistant.log" | cut -c1-200 | head -50
            exit 1
          }
          echo D07_T3_SHARED_ASSISTANT=PASS
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/shared-assistant.log"
      - name: Preview and reapply identical canonical package without mutation
        working-directory: site
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/skill-install.log" 2>&1
          cmp ../domain/models/assistant-skills.json public/assets/d07-assistant-skills.json
          before="$(sha256sum public/assets/d07-assistant-skills.json runtime/t3-platform/0.3.1-rc.1/domain-skills.json)"
          for mode in --preview --apply; do
            npm run t3:skills -- "$mode" ../domain 3b9c2cfbb6b7a005ef42d60efa16f7adf2b46eea ../assistant > "$RUNNER_TEMP/skill-import.log" 2>&1 || {
              echo D07_T3_SKILL_IMPORT=FAIL
              grep -E '^Error: (D07_|T3_)' "$RUNNER_TEMP/skill-import.log" | cut -c1-180
              exit 1
            }
            grep -q '"state":"UNCHANGED"' "$RUNNER_TEMP/skill-import.log"
            test "$before" = "$(sha256sum public/assets/d07-assistant-skills.json runtime/t3-platform/0.3.1-rc.1/domain-skills.json)"
          done
          echo D07_T3_SKILL_PREVIEW_NO_WRITE=PASS
          echo D07_T3_SKILL_REIMPORT_IDEMPOTENT=PASS
      - name: Verify native product and TypeScript after contextual adaptation
        working-directory: site
        run: |
          npm run test:product-first > "$RUNNER_TEMP/context-product.log" 2>&1 || { echo D07_T3_CONTEXT_PRODUCT=FAIL; grep -E '^not ok|^# (tests|pass|fail)' "$RUNNER_TEMP/context-product.log" | cut -c1-200 | head -60; exit 1; }
          echo D07_T3_CONTEXT_PRODUCT=PASS
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/context-product.log"
          bun run check:types > "$RUNNER_TEMP/context-types.log" 2>&1 || { echo D07_T3_CONTEXT_TYPES=FAIL; grep -E 'error TS[0-9]+' "$RUNNER_TEMP/context-types.log" | cut -c1-220 | head -40; exit 1; }
          echo D07_T3_CONTEXT_TYPES=PASS
      # Do not publish private source, logs, or build artifacts.
