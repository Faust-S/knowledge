name: D04 ten protocol Results original T2 revisions and cold restore
on:
  push:
    branches:
      - work/2026-11-18-d04-life-os-qualification
    paths:
      - .github/workflows/d04-ten-protocol-revisions.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d04-ten-protocol-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery-exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm authorized private source reads before checkout
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "D04_DOMEN_SECRET_MISSING"; exit 1; fi
          for repo in Faust-S/bazmed.ru Faust-S/bazmed Faust-S/T2; do
            if ! gh api "repos/$repo" --jq '.id' >/dev/null 2>&1; then
              echo "D04_PRIVATE_REPOSITORY_ACCESS_DENIED:$repo"
              exit 1
            fi
          done
          echo "D04_RECOVERY_SOURCES_AUTHORIZED=3/3"
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/bazmed.ru
          ref: 2c29c5032d883207ba3ee880db7ae407dafe0a6c
          token: ${{ secrets.DOMEN }}
          path: d04-private/site
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/bazmed
          ref: d0f6ec9d50c01891ed1001fb872ac2d5770e8f0d
          token: ${{ secrets.DOMEN }}
          path: d04-private/model
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: 9c64951cd78411283e8a416641c36d71e169fc1d
          token: ${{ secrets.DOMEN }}
          path: d04-private/t2
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source identity
        run: |
          set -euo pipefail
          test "$(git -C d04-private/site rev-parse HEAD)" = "2c29c5032d883207ba3ee880db7ae407dafe0a6c"
          test "$(git -C d04-private/model rev-parse HEAD)" = "d0f6ec9d50c01891ed1001fb872ac2d5770e8f0d"
          test "$(git -C d04-private/t2 rev-parse HEAD)" = "9c64951cd78411283e8a416641c36d71e169fc1d"
          test "$(git hash-object d04-private/site/src/lib/life-calculation-admission.mjs)" = "$(git hash-object d04-private/model/docs/life-os/LIFE_CALCULATION_ADMISSION_V0_1.mjs)"
          test "$(git hash-object d04-private/site/src/lib/life-calculation-admission.d.mts)" = "$(git hash-object d04-private/model/docs/life-os/LIFE_CALCULATION_ADMISSION_V0_1.d.mts)"
          echo "D04_CAREGIVER_CANONICAL_RUNTIME_PARITY=PASS"
          echo "D04_RECOVERY_EXACT_SOURCE=PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check both original private witness module syntaxes
        working-directory: d04-private/site
        run: |
          set -euo pipefail
          node --check qualification/life-os-ten-protocol-revisions.browser.mjs
          node --check qualification/life-os-ten-protocol-exchange.browser.mjs
          echo "D04_TEN_PROTOCOL_WITNESS_SYNTAX=PASS"
      - name: Install private site and normative T2 dependencies without publishing logs
        run: |
          set -euo pipefail
          if (cd d04-private/site && npm ci --no-audit --no-fund --include=dev) >"$RUNNER_TEMP/d04-site-install.log" 2>&1; then
            echo "D04_RECOVERY_SITE_NPM_CI=PASS"
          else
            echo "D04_RECOVERY_SITE_NPM_CI=FAIL"
            exit 1
          fi
          canonical="d04-private/t2/t2/current/final-successor/canonical-source"
          if (cd "$canonical" && npm ci --no-audit --no-fund --include=dev) >"$RUNNER_TEMP/d04-t2-install.log" 2>&1; then
            echo "D04_RECOVERY_NORMATIVE_T2_NPM_CI=PASS"
          else
            echo "D04_RECOVERY_NORMATIVE_T2_NPM_CI=FAIL"
            exit 1
          fi
      - name: Verify source tests and TypeScript before original T2 browser qualification
        working-directory: d04-private/site
        run: |
          set -euo pipefail
          if npm run check:life-os:research >"$RUNNER_TEMP/d04-research.log" 2>&1; then
            echo "D04_TEN_PROTOCOL_RESEARCH=PASS"
          else
            echo "D04_TEN_PROTOCOL_RESEARCH=FAIL"
            # Public logs show only synthetic test names and counters, never
            # private source, medical input values, assertions or stack traces.
            grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/d04-research.log" |
              sed -E 's/^not ok ([0-9]+) - (.{0,90}).*/D04_RESEARCH_FAILED_TEST_\1=\2/' |
              head -12 || true
            grep -E '^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/d04-research.log" |
              tail -3 | sed 's/^# /D04_RESEARCH_TOTAL_/' || true
            grep -Eo 'ERR_[A-Z0-9_]+' "$RUNNER_TEMP/d04-research.log" |
              sort -u | head -8 || true
            exit 1
          fi
          if npm run check:t2:entry >"$RUNNER_TEMP/d04-entry.log" 2>&1; then
            echo "D04_TEN_PROTOCOL_T2_ENTRY=PASS"
          else
            echo "D04_TEN_PROTOCOL_T2_ENTRY=FAIL"
            # Only stable synthetic test titles and counters may reach public logs.
            grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/d04-entry.log" |
              sed -E 's/^not ok ([0-9]+) - (.{0,100}).*/D04_ENTRY_FAILED_TEST_\1=\2/' |
              head -12 || true
            grep -E '^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/d04-entry.log" |
              tail -3 | sed 's/^# /D04_ENTRY_TOTAL_/' || true
            exit 1
          fi
          if npx tsc --noEmit >"$RUNNER_TEMP/d04-typecheck.log" 2>&1; then
            echo "D04_TEN_PROTOCOL_TYPESCRIPT=PASS"
          else
            echo "D04_TEN_PROTOCOL_TYPESCRIPT=FAIL"
            exit 1
          fi
      - name: Run canonical subject regression for protocol / calculator identity
        working-directory: d04-private/model
        run: |
          set -euo pipefail
          if node --test docs/life-os/tests/life-calculation-admission.test.mjs >"$RUNNER_TEMP/d04-canonical-calculator.log" 2>&1; then
            echo "D04_CANONICAL_CAREGIVER_REGRESSION=PASS"
          else
            echo "D04_CANONICAL_CAREGIVER_REGRESSION=FAIL"
            exit 1
          fi
      - name: Install normative T2 Chromium from exact Playwright package
        timeout-minutes: 5
        run: |
          set -euo pipefail
          canonical="d04-private/t2/t2/current/final-successor/canonical-source"
          if (cd "$canonical" && timeout 210s npx playwright install chromium) >"$RUNNER_TEMP/d04-browser-install.log" 2>&1; then
            echo "D04_NORMATIVE_T2_BROWSER=PASS"
          else
            echo "D04_NORMATIVE_T2_BROWSER=FAIL"
            exit 1
          fi
      - name: Generate new isolated witness challenge
        run: |
          umask 077
          openssl rand -hex 32 > "$RUNNER_TEMP/d04-ten-protocol-challenge"
          echo "D04_FRESH_WITNESS_CHALLENGE=SET"
      - name: Build exact T2 and BazMed with qualification-only read-only auditor
        working-directory: d04-private/site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/d04-private/t2
        run: |
          set -uo pipefail
          set +e
          export IWXA_T2_PRODUCT_CHALLENGE="$(cat "$RUNNER_TEMP/d04-ten-protocol-challenge")"
          npm run build:t2:site >"$RUNNER_TEMP/d04-recovery-build.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "D04_RECOVERY_INTEGRATED_BUILD=FAIL"
            grep -Eo 'BAZMED_[A-Z0-9_]+|D04_[A-Z0-9_]+' "$RUNNER_TEMP/d04-recovery-build.log" | sort -u | tail -20 || true
            exit "$code"
          fi
          test -s dist/workspace/index.html
          test -s dist/workspace/exchange/index.html
          test -s dist/_iwxa/current.json
          echo "D04_RECOVERY_INTEGRATED_BUILD=PASS"
      - name: Run all ten protocol checklists through real UI, original Kernel revisions and cold readback
        working-directory: d04-private/site
        run: |
          set -uo pipefail
          set +e
          export IWXA_T2_PRODUCT_CHALLENGE="$(cat "$RUNNER_TEMP/d04-ten-protocol-challenge")"
          node --input-type=module >"$RUNNER_TEMP/d04-ten-protocol-e2e.log" 2>&1 <<'NODE'
          import {createRequire} from 'node:module';
          import {resolve,join} from 'node:path';
          import {pathToFileURL} from 'node:url';
          const site=process.cwd();
          const canonical=resolve(process.env.GITHUB_WORKSPACE,
            'd04-private/t2/t2/current/final-successor/canonical-source');
          const {chromium}=createRequire(join(canonical,'package.json'))('playwright');
          const {serveRealKernelHost}=await import(pathToFileURL(join(canonical,'scripts/real-kernel-e2e.mjs')).href);
          const {selectWitnessOption}=await import(pathToFileURL(
            join(canonical,'src/factory2/products/domain-completion/independent-browser-witness.mjs')).href);
          const {runTenProtocolNativeRevisions}=await import(pathToFileURL(
            join(site,'qualification/life-os-ten-protocol-revisions.browser.mjs')).href);
          const server=await serveRealKernelHost(join(site,'dist'),{
            independentWitness:true,previewOrigin:true
          });
          try {
            const result=await runTenProtocolNativeRevisions({
              chromium,origin:server.origin,challenge:process.env.IWXA_T2_PRODUCT_CHALLENGE,
              selectWitnessOption
            });
            if(result.status!=='PASS'||result.protocols!==10||result.results!==10||
               result.revisions!==2||result.events!==20||
               !result.coldRestart||!result.independentReadback||
               result.exchange?.status!=='PASS'||result.exchange?.objects!==10||
               result.exchange?.events!==20||!result.exchange?.coldImported||
               !result.exchange?.sourceUnchanged)
              throw new Error('D04_PROTOCOL_NATIVE_RESULT_INCOMPLETE');
            console.log('D04_TEN_PROTOCOL_NATIVE_REVISIONS=PASS');
            console.log('D04_TEN_PROTOCOL_KERNEL_OBJECTS=10');
            console.log('D04_TEN_PROTOCOL_KERNEL_EVENTS=20');
            console.log('D04_TEN_PROTOCOL_COLD_READBACK=PASS');
            console.log('D04_TEN_PROTOCOL_IWXA_INDEPENDENT_IMPORT=PASS');
            console.log('D04_TEN_PROTOCOL_IWXA_COLD_READBACK=PASS');
          }finally{
            await new Promise(done=>server.server.close(done));
          }
          NODE
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "D04_TEN_PROTOCOL_NATIVE_E2E=FAIL"
            grep -Eo 'D04_PROTOCOL_(STAGE|CAUSE_CLASS|SAVE_STEP|SAVE_UI|OVERVIEW_STATE)_[A-Za-z0-9_]+' "$RUNNER_TEMP/d04-ten-protocol-e2e.log" | sort -u | tail -8 || true
            python3 "$GITHUB_WORKSPACE/tools/ci/d04_recovery_safe_diagnostics.py" "$RUNNER_TEMP/d04-ten-protocol-e2e.log" || true
            exit "$code"
          fi
          grep '^D04_' "$RUNNER_TEMP/d04-ten-protocol-e2e.log" | tail -10
          echo "D04_TEN_PROTOCOL_NATIVE_E2E=PASS"
          # Private dist/browser data/logs never enter public artifacts.
