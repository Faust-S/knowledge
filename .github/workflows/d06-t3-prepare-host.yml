name: d06-t3-prepare-host
on:
  push:
    branches:
      - test/2026-11-24-d06-t3-preparation
    paths:
      - .github/workflows/d06-t3-prepare-host.yml
permissions:
  contents: read
  actions: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 326f725c44d69ac99f6b912241e9e8a6c3d716a5
          persist-credentials: false
          path: original-core
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 9f41447197251d41e69fbcb98e52ef1050754ec2
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private-assistant
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod.ru
          ref: ae31f9963b80713235be60a768c45961b290fcd2
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private-site
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify original public portable input
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: private-site
        run: |
          set -euo pipefail
          gh api repos/Faust-S/knowledge/actions/artifacts/14920233669/zip > "$RUNNER_TEMP/platform-outer.zip"
          echo "96bb993383af31309b79dceb6f321ac5365ac7777362f512f9225226ee51904f  $RUNNER_TEMP/platform-outer.zip" | sha256sum --check --status
          unzip -p "$RUNNER_TEMP/platform-outer.zip" platform-inputs.zip > "$RUNNER_TEMP/platform-inputs.zip"
          node scripts/d06-t3-platform-inputs.mjs verify "$RUNNER_TEMP/platform-inputs.zip" > "$RUNNER_TEMP/platform-private.log" 2>&1 || { grep -Eo 'D06_T3_PLATFORM_[A-Z0-9_]+' "$RUNNER_TEMP/platform-private.log" | sort -u | head -10; exit 1; }
          echo D06_T3_ORIGINAL_PLATFORM_128_FILES=PASS
      - name: Prepare compiled real D06 Host
        working-directory: private-site
        shell: bash
        run: |
          set -euo pipefail
          npm ci > "$RUNNER_TEMP/d06-site-install-private.log" 2>&1 || { echo D06_T3_SITE_INSTALL=FAIL; exit 1; }
          echo D06_T3_SITE_INSTALL=PASS
          npm run t3:prepare-host -- "$GITHUB_WORKSPACE/original-core/packages/t3-core" "$RUNNER_TEMP/d06-t3-host" "$RUNNER_TEMP/platform-inputs.zip" "$GITHUB_WORKSPACE/private-assistant" https://komplektovod.ru > "$RUNNER_TEMP/d06-host-private.log" 2>&1 || {
            echo D06_T3_HOST_SOURCE_BUILD=FAIL
            grep -Eo 'D06_T3_(HOST|PLATFORM)_[A-Z0-9_]+|D06_SITE_ONLY_[A-Z0-9_]+|D06_BUILD_[A-Z0-9_]+|T2_EXTERNAL_MODULE_[A-Z_]+|T2_QUALIFIED_KERNEL_STAGE_[A-Z_]+|TS[0-9]{4}' "$RUNNER_TEMP/d06-host-private.log" | sort -u | head -25 || true
            node --input-type=module - "$RUNNER_TEMP/d06-host-private.log" <<'NODE'
          import {readFileSync} from 'node:fs';
          const lines=readFileSync(process.argv[2],'utf8').split(/\r?\n/);
          const matches=lines.map(line=>line.match(/^(src\/[A-Za-z0-9_./-]+\.(?:ts|tsx|mts))\((\d+),(\d+)\): error (TS\d+):/)).filter(Boolean);
          console.log("D06_T3_COMPILE_DIAGNOSTICS="+matches.length);
          for(const m of matches.slice(0,40))console.log("D06_T3_COMPILE_COORD="+m[4]+" "+m[1]+":"+m[2]+":"+m[3]);
          NODE
            exit 1
          }
          echo D06_T3_HOST_SOURCE_BUILD=PASS
          node --input-type=module - "$RUNNER_TEMP/d06-t3-host" <<'NODE'
          import {verifyPreparedD06Host} from './scripts/prepare-d06-t3-host.mjs';
          const receipt=verifyPreparedD06Host(process.argv[2]);
          console.log("D06_T3_HOST_READBACK=PASS");
          console.log("D06_T3_HOST_FILES="+receipt.files.length);
          console.log("D06_T3_SHARED_WORKER_COUNT="+receipt.files.filter(x=>/^assets\/model-worker-[A-Za-z0-9_-]+\.js$/.test(x.path)).length);
          NODE
      - name: Retain exact input, remove external source checkouts
        working-directory: private-site
        shell: bash
        run: |
          set -euo pipefail
          node scripts/d06-assistant-skills.mjs check > "$RUNNER_TEMP/d06-projection-private.log" 2>&1 || { echo D06_T3_PROJECTION=FAIL; exit 1; }
          echo D06_T3_PROJECTION=PASS
          node scripts/retain-d06-t3-inputs.mjs "$RUNNER_TEMP/d06-t3-host" "$RUNNER_TEMP/platform-inputs.zip" > "$RUNNER_TEMP/d06-retain-private.log" 2>&1 || {
            echo D06_T3_RETAIN=FAIL
            grep -Eo 'D06_T3_[A-Z0-9_]+' "$RUNNER_TEMP/d06-retain-private.log" | sort -u | head -20 || true
            exit 1
          }
          echo D06_T3_RETAIN=PASS
          rm -rf -- "$RUNNER_TEMP/d06-t3-host" "$RUNNER_TEMP/platform-inputs.zip" "$GITHUB_WORKSPACE/original-core" "$GITHUB_WORKSPACE/private-assistant"
          test ! -e "$GITHUB_WORKSPACE/original-core"
          test ! -e "$GITHUB_WORKSPACE/private-assistant"
          echo D06_T3_EXTERNAL_SOURCE_CHECKOUTS_REMOVED=PASS
          npm run setup:browser > "$RUNNER_TEMP/d06-browser-install-private.log" 2>&1 || { echo D06_T3_BROWSER_INSTALL=FAIL; exit 1; }
          echo D06_T3_BROWSER_INSTALL=PASS
      - name: Rebuild twice solely from retained local inputs and preserve last good dist on corruption
        working-directory: private-site
        shell: bash
        run: |
          set -euo pipefail
          node_bin="$(command -v node)"
          mkdir -p "$RUNNER_TEMP/d06-deny-tools"
          for tool in git npm npx bun bunx; do
            printf '#!/bin/sh\nprintf "attempt\n" >> "$D06_FORBIDDEN_TOOL_LOG"\nexit 98\n' > "$RUNNER_TEMP/d06-deny-tools/$tool"
            chmod +x "$RUNNER_TEMP/d06-deny-tools/$tool"
          done
          export D06_FORBIDDEN_TOOL_LOG="$RUNNER_TEMP/d06-forbidden-tools.log"
          export PATH="$RUNNER_TEMP/d06-deny-tools:$PATH"
          local_build() {
            "$node_bin" --experimental-strip-types scripts/build-d06-t3-local-site.mjs > "$RUNNER_TEMP/d06-local-private.log" 2>&1 || {
              echo "D06_T3_LOCAL_BUILD_$1=FAIL"
              grep -E '^D06_T3_LOCAL_STAGE_[A-Z0-9_]+=(PASS|FAIL)              grep -Eo 'D06_T3_[A-Z0-9_]+|T3_DOMAIN_OFFLINE_[A-Z0-9_]+|T3_D5_MODULE_[A-Z0-9_]+|TS[0-9]{4}' "$RUNNER_TEMP/d06-local-private.log" | sort -u | head -25 || true
              for marker in 'ERR_MODULE_NOT_FOUND' 'Cannot find module' 'ENOENT' 'SyntaxError' 'TypeError' 'missing local asset' 'not in site-routes' 'unexpected external asset origin' 'references forbidden host'; do
                if grep -Fq "$marker" "$RUNNER_TEMP/d06-local-private.log"; then echo "D06_T3_LOCAL_FAILURE_CLASS=$marker"; fi
              done
              exit 1
            }
            echo "D06_T3_LOCAL_BUILD_$1=PASS"
          }
          snapshot() {
            "$node_bin" --experimental-strip-types --input-type=module - "$1" <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {snapshotD06Dist} from './scripts/assemble-d06-t3-dist.mjs';
          const snapshot=snapshotD06Dist('dist');
          writeFileSync(process.argv[2],JSON.stringify(snapshot));
          console.log("D06_T3_DIST_FILES="+snapshot.length);
          NODE
          }
          local_build FIRST
          snapshot "$RUNNER_TEMP/d06-first-private.json"
          local_build SECOND
          snapshot "$RUNNER_TEMP/d06-second-private.json"
          cmp -s "$RUNNER_TEMP/d06-first-private.json" "$RUNNER_TEMP/d06-second-private.json" || { echo D06_T3_BYTE_IDENTICAL_REBUILD=FAIL; exit 1; }
          echo D06_T3_BYTE_IDENTICAL_REBUILD=PASS
          archive="runtime/t3-platform/0.3.1-rc.1/platform-inputs.zip"
          cp -- "$archive" "$RUNNER_TEMP/d06-good-input.zip"
          trap 'mv -f -- "$RUNNER_TEMP/d06-good-input.zip" "$archive"' EXIT
          printf 'corrupted' >> "$archive"
          if "$node_bin" --experimental-strip-types scripts/build-d06-t3-local-site.mjs > "$RUNNER_TEMP/d06-corrupt-private.log" 2>&1; then
            echo D06_T3_CORRUPTION_REJECTED=FAIL
            exit 1
          fi
          grep -Fq D06_T3_PLATFORM_ARCHIVE_SHA256_MISMATCH "$RUNNER_TEMP/d06-corrupt-private.log" || { echo D06_T3_CORRUPTION_EXPECTED_REASON=FAIL; exit 1; }
          snapshot "$RUNNER_TEMP/d06-after-corrupt-private.json"
          cmp -s "$RUNNER_TEMP/d06-second-private.json" "$RUNNER_TEMP/d06-after-corrupt-private.json" || { echo D06_T3_PREVIOUS_DIST_RETAINED=FAIL; exit 1; }
          test ! -s "$D06_FORBIDDEN_TOOL_LOG" || { echo D06_T3_NO_GIT_OR_PACKAGE_MANAGER=FAIL; exit 1; }
          echo D06_T3_CORRUPTION_REJECTED=PASS
          echo D06_T3_PREVIOUS_DIST_RETAINED=PASS
          echo D06_T3_NO_GIT_OR_PACKAGE_MANAGER=PASS
      - name: Real public assistant without installing a model
        working-directory: private-site
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types tests/t3/verify-public-assistant.mjs > "$RUNNER_TEMP/d06-t3-public-private.log" 2>&1 || {
            echo D06_T3_PUBLIC_ASSISTANT_SMOKE=FAIL
            grep -E '^D06_T3_PUBLIC_NO_MODEL_[A-Z_]+=PASS
        if: always()
        run: |
          echo D06_T3_PRODUCT_ACCEPTED=false
          echo D06_T3_PRIVATE_OUTPUT_UPLOADS=0
          echo D06_T3_PRIVATE_LOGS_UPLOADED=0
 "$RUNNER_TEMP/d06-local-private.log" || true
              if test -f "$D06_FORBIDDEN_TOOL_LOG"; then echo "D06_T3_FORBIDDEN_TOOL_ATTEMPTS=$(wc -l < "$D06_FORBIDDEN_TOOL_LOG")"; fi
              for marker in 'BROWSER_LAUNCH_FAILED' 'BROWSER_NOT_FOUND' 'BROWSER_NAVIGATION_BLOCKED' 'LOCAL_HTTP_BLOCKED' 'BROWSER_JAVASCRIPT_FAILED' 'Rollup failed to resolve import' 'Cannot find package' 'Could not resolve' 'Could not load' 'Could not load config' 'failed to load config' 'missing prerendered pages' 'ERR_UNSUPPORTED_DIR_IMPORT' 'ERR_MODULE_NOT_FOUND' 'Command failed' 'EACCES' 'EISDIR' 'ENOTDIR' 'SIGTERM' 'SIGKILL' 'ReferenceError' 'Hydration failed' 'Minified React error' 'Transform failed'; do
                if grep -Fq "$marker" "$RUNNER_TEMP/d06-local-private.log"; then echo "D06_T3_LOCAL_STAGE_CLASS=$marker"; fi
              done
              grep -Eo 'D06_T3_[A-Z0-9_]+|T3_DOMAIN_OFFLINE_[A-Z0-9_]+|T3_D5_MODULE_[A-Z0-9_]+|TS[0-9]{4}' "$RUNNER_TEMP/d06-local-private.log" | sort -u | head -25 || true
              for marker in 'ERR_MODULE_NOT_FOUND' 'Cannot find module' 'ENOENT' 'SyntaxError' 'TypeError' 'missing local asset' 'not in site-routes' 'unexpected external asset origin' 'references forbidden host'; do
                if grep -Fq "$marker" "$RUNNER_TEMP/d06-local-private.log"; then echo "D06_T3_LOCAL_FAILURE_CLASS=$marker"; fi
              done
              exit 1
            }
            echo "D06_T3_LOCAL_BUILD_$1=PASS"
          }
          snapshot() {
            "$node_bin" --experimental-strip-types --input-type=module - "$1" <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {snapshotD06Dist} from './scripts/assemble-d06-t3-dist.mjs';
          const snapshot=snapshotD06Dist('dist');
          writeFileSync(process.argv[2],JSON.stringify(snapshot));
          console.log("D06_T3_DIST_FILES="+snapshot.length);
          NODE
          }
          local_build FIRST
          snapshot "$RUNNER_TEMP/d06-first-private.json"
          local_build SECOND
          snapshot "$RUNNER_TEMP/d06-second-private.json"
          cmp -s "$RUNNER_TEMP/d06-first-private.json" "$RUNNER_TEMP/d06-second-private.json" || { echo D06_T3_BYTE_IDENTICAL_REBUILD=FAIL; exit 1; }
          echo D06_T3_BYTE_IDENTICAL_REBUILD=PASS
          archive="runtime/t3-platform/0.3.1-rc.1/platform-inputs.zip"
          cp -- "$archive" "$RUNNER_TEMP/d06-good-input.zip"
          trap 'mv -f -- "$RUNNER_TEMP/d06-good-input.zip" "$archive"' EXIT
          printf 'corrupted' >> "$archive"
          if "$node_bin" --experimental-strip-types scripts/build-d06-t3-local-site.mjs > "$RUNNER_TEMP/d06-corrupt-private.log" 2>&1; then
