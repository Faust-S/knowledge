        if: always()
        run: |
          echo D06_T3_PRODUCT_ACCEPTED=false
          echo D06_T3_PRIVATE_OUTPUT_UPLOADS=0
          echo D06_T3_PRIVATE_LOGS_UPLOADED=0
 "$RUNNER_TEMP/d06-t3-public-private.log"
      - name: Privacy and evidence boundary
