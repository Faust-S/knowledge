          echo D06_T3_PRIVATE_LOGS_UPLOADED=0
 "$RUNNER_TEMP/d06-t3-public-private.log" || true
            grep -Eo 'D06_T3_[A-Z0-9_]+' "$RUNNER_TEMP/d06-t3-public-private.log" | sort -u | head -15 || true
            for marker in 'TimeoutError' 'AssertionError' 'strict mode violation' 'toHaveCount' 'toBeVisible' 'toBeHidden' 'toHaveValue' 'toBeEnabled' 'toContainText'; do
              if grep -Fq "$marker" "$RUNNER_TEMP/d06-t3-public-private.log"; then echo "D06_T3_PUBLIC_FAILURE_CLASS=$marker"; fi
            done
            exit 1
          }
          grep -E '^D06_T3_PUBLIC_(NO_MODEL_[A-Z_]+|ASSISTANT_SMOKE)=PASS
        if: always()
        run: |
          echo D06_T3_PRODUCT_ACCEPTED=false
          echo D06_T3_PRIVATE_OUTPUT_UPLOADS=0
          echo D06_T3_PRIVATE_LOGS_UPLOADED=0
 "$RUNNER_TEMP/d06-local-private.log" || true
