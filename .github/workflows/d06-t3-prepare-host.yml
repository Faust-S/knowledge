          test ! -s "$D06_FORBIDDEN_TOOL_LOG" || { echo D06_T3_NO_GIT_OR_PACKAGE_MANAGER=FAIL; exit 1; }
          echo D06_T3_CORRUPTION_REJECTED=PASS
          echo D06_T3_PREVIOUS_DIST_RETAINED=PASS
          echo D06_T3_NO_GIT_OR_PACKAGE_MANAGER=PASS
