name: d02-club-offline-t2-windows-qualification
on:
  push:
    branches:
      - work/2026-11-18-d02-club-qualification
    paths:
      - .github/workflows/d02-club-offline-t2-windows-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-build:
    name: Full pinned T2 offline dependency and build qualification
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      SITE_SHA: 17548f2b7f5f781d9dbf4113fd7e30a6589b40aa
      T2_SHA: e70de29b72b83e2546f7ab74b17572685a728c17
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Disable CRLF rewriting for exact T2 bytes
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout private Club build code only on temporary runner
        uses: actions/checkout@v4
        with:
          repository: Faust-S/club.iwxa.ru
          ref: ${{ env.SITE_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site

      - name: Checkout exact private normative T2 only on temporary runner
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: ${{ env.T2_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: t2

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install private site CLI dependencies
        shell: pwsh
        working-directory: site
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'd02-offline-site-install-private.log'
          & npm ci --no-audit --no-fund *> $log
          if($LASTEXITCODE -ne 0) {
            Write-Output 'D02_OFFLINE_SITE_CI=FAIL'
            throw 'D02_OFFLINE_SITE_CI_FAILED'
          }
          Write-Output 'D02_OFFLINE_SITE_CI=PASS'

      - name: Online warm-up then actual offline install of both original T2 lockfiles
        shell: pwsh
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
          IWXA_T2_NPM_CACHE_DIR: ${{ runner.temp }}/club-t2-offline-dependencies
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'd02-offline-preparation-private.log'
          & npm run t2:cache:prepare *> $log
          if($LASTEXITCODE -ne 0) {
            Write-Output 'D02_OFFLINE_CACHE_PREPARE=FAIL'
            Get-Content $log | Select-String -Pattern 'CLUB_T2_NPM_CACHE_[A-Z_]+|^npm error (code|errno)|^Error: [A-Z_]+' | Select-Object -Last 12 | ForEach-Object { Write-Output $_.Line }
            throw 'D02_OFFLINE_CACHE_PREPARE_FAILED'
          }
          Write-Output 'D02_OFFLINE_CACHE_PREPARE=PASS kernel_and_host'

      - name: Independently verify pinned T2 cache offline without installing packages
        shell: pwsh
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
          IWXA_T2_NPM_CACHE_DIR: ${{ runner.temp }}/club-t2-offline-dependencies
          npm_config_offline: 'true'
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'd02-offline-verify-private.log'
          & npm run t2:cache:verify *> $log
          if($LASTEXITCODE -ne 0) {
            Write-Output 'D02_OFFLINE_CACHE_VERIFY=FAIL'
            Get-Content $log | Select-String -Pattern 'CLUB_T2_NPM_CACHE_[A-Z_]+|^npm error (code|errno)|^Error: [A-Z_]+' | Select-Object -Last 12 | ForEach-Object { Write-Output $_.Line }
            throw 'D02_OFFLINE_CACHE_VERIFY_FAILED'
          }
          Write-Output 'D02_OFFLINE_CACHE_VERIFY=PASS'

      - name: Force the exact original Kernel and Host installs offline and build integrated Club
        shell: pwsh
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
          IWXA_T2_NPM_CACHE_DIR: ${{ runner.temp }}/club-t2-offline-dependencies
          IWXA_T2_NPM_OFFLINE: '1'
          npm_config_offline: 'true'
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'd02-offline-build-private.log'
          & npm run build *> $log
          if($LASTEXITCODE -ne 0) {
            Write-Output 'D02_OFFLINE_BUILD=FAIL'
            $body = Get-Content $log -Raw
            # Only derived booleans/whitelisted failure codes can reach public logs.
            foreach($marker in @('MATERIALIZED_UNMODIFIED_SUCCESSOR_BASE','EXACT_SUCCESSOR_MATERIALIZED','CLUB_T2_QUALIFIED_KERNEL_RELEASE','CLUB_T2_INTEGRATED_DIST_BUILT')){
              Write-Output ("D02_OFFLINE_STAGE_" + $marker + "=" + $body.Contains($marker))
            }
            foreach($code in @('ENOTCACHED','EACCES','ENOENT','EPERM','E404','ERR_MODULE_NOT_FOUND','CLUB_T2_OFFLINE_CACHE_NOT_PREPARED','CLUB_T2_QUALIFIED_KERNEL_RELEASE_MISMATCH','CLUB_T2_PRODUCTION_CONFIG_INVALID','CLUB_T2_BUILD_MARKER_INVALID')){
              if($body.Contains($code)) { Write-Output ("D02_OFFLINE_FAILURE_CODE=" + $code) }
            }
            if($body -match 'npm-cli\\.js ci') { Write-Output 'D02_OFFLINE_FAILURE_EXEC=NODE_NPM_CI' }
            if($body -match 'npm-cli\\.js run build') { Write-Output 'D02_OFFLINE_FAILURE_EXEC=NODE_NPM_BUILD' }
            if($body -match 'Error: Command failed') { Write-Output 'D02_OFFLINE_FAILURE_CLASS=CHILD_COMMAND_FAILED' }
            if($body -match 'Error: (CLUB_[A-Z0-9_]+)') { Write-Output ("D02_OFFLINE_FAILURE_CLASS=" + $Matches[1]) }
            if($body -match '(?m)^npm error code ([A-Z0-9_]+)') { Write-Output ("D02_OFFLINE_NPM_CODE=" + $Matches[1]) }
            if($body -match '(?m)^npm error Exit handler never called') { Write-Output 'D02_OFFLINE_NPM_EXIT_HANDLER=FAIL' }
            throw 'D02_OFFLINE_BUILD_FAILED'
          }
          Write-Output 'D02_OFFLINE_BUILD=PASS'
          $gate=Join-Path $env:RUNNER_TEMP 'd02-offline-release-gate-private.log'
          & npm run check:club-release *> $gate
          if($LASTEXITCODE -ne 0) { throw 'D02_OFFLINE_RELEASE_GATE_FAILED' }
          Write-Output 'D02_OFFLINE_RELEASE_GATE=PASS public_routes_40'
          $count=(Get-ChildItem dist -Recurse -File | Measure-Object).Count
          Write-Output "D02_OFFLINE_DIST_FILES=$count"
          Write-Output 'D02_OFFLINE_PRODUCT_GUI_RECEIPT_IWXA=NOT_RUN'

      - name: Confirm no private build artifacts are published
        if: always()
        shell: pwsh
        run: |
          Write-Output 'D02_PRIVATE_CHECKOUTS_RUNNER_TEMPORARY=TRUE'
          Write-Output 'D02_CLOSED_SOURCE_DIST_CACHE_ARTIFACTS_UPLOADED=FALSE'
