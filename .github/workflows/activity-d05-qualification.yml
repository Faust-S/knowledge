name: Activity original CehoVod recipient
on:
  push:
    branches:
      - test/2026-11-24-activity-d05-recipient
    paths:
      - .github/workflows/activity-d05-qualification.yml
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Fetch exact private D05 revision using existing D05 qualification grant
        shell: bash
        env:
          DOMEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          test -n "${DOMEN:-}" || { echo D05_DOMEN=UNAVAILABLE; exit 1; }
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DOMEN" | base64 | tr -d '\r\n')"
          git init --quiet private-d05
          if ! GIT_TERMINAL_PROMPT=0 git -C private-d05 -c "http.extraheader=$header" fetch --quiet --depth 1 --no-tags https://github.com/Faust-S/cehovod.ru.git 6fbc651eca94e7ec11266831b78cc382d7f5d228 >/dev/null 2>&1; then
            echo D05_SITE_ACCESS=FAIL
            exit 1
          fi
          git -C private-d05 checkout --quiet --detach FETCH_HEAD
          unset header DOMEN
          echo D05_SITE_ACCESS=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify pinned source and shared Activity contract
        shell: bash
        run: |
          set -euo pipefail
          cd private-d05
          test "$(git rev-parse HEAD)" = "6fbc651eca94e7ec11266831b78cc382d7f5d228"
          test "$(git rev-parse 'HEAD^{tree}')" = "ad9bdae3653f4856777d6d40f6d49d8f3252d1e5"
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const root='src/lib/activity-technology/';
          const pins=JSON.parse(readFileSync(root+'source-pin.json','utf8'));
          for(const [p,sha] of Object.entries(pins.git_blobs)){
            if(execFileSync('git',['rev-parse','HEAD:'+root+p],{encoding:'utf8'}).trim()!==sha)throw Error('ACTIVITY_VENDOR_PIN_CHANGED');
          }
          console.log('ACTIVITY_VENDOR_PIN=PASS');
          NODE
          echo SOURCE_PIN=PASS
      - name: Install dependencies and qualify existing domain services
        shell: bash
        run: |
          set -u
          cd private-d05
          log="$RUNNER_TEMP/activity-d05-install.log"
          if ! npm ci --no-audit --no-fund > "$log" 2>&1; then echo NPM_CI=FAIL; exit 1; fi
          echo NPM_CI=PASS
          export CI=true
          npm run typecheck > "$RUNNER_TEMP/activity-d05-type.log" 2>&1; type=$?
          npx --no-install vitest run src/host/activity-technology-recipient.test.ts src/lib/operation-route.test.ts src/lib/quality-plan.session.test.ts src/lib/quality-plan.route-sources.test.ts src/host/draft-source-handoff.test.ts > "$RUNNER_TEMP/activity-d05-tests.log" 2>&1; tests=$?
          npm run build:host-module > "$RUNNER_TEMP/activity-d05-build.log" 2>&1; build=$?
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          import {join} from 'node:path';
          const read=n=>readFileSync(join(process.env.RUNNER_TEMP,'activity-d05-'+n+'.log'),'utf8').replace(/\x1b\[[0-9;]*m/g,'');
          const types=read('type'),tests=read('tests'),build=read('build');
          for(const m of types.matchAll(/([A-Za-z0-9_./-]+\.tsx?)\((\d+),(\d+)\): error (TS\d+)/g))console.log('TYPE_DIAGNOSTIC='+m[1].split('/').at(-1)+':'+m[2]+':'+m[3]+':'+m[4]);
          for(const line of tests.split(/\r?\n/)) {
            if(/^\s*(?:Test Files|Tests)\s+/.test(line))console.log(line.trim().replace(/[^A-Za-z0-9 ()|]/g,''));
            if(/activity-technology-recipient\.test\.ts:\d+:\d+/.test(line))console.log('TRACE='+line.match(/activity-technology-recipient\.test\.ts:\d+:\d+/)[0]);
          }
          for(const code of new Set((tests+'\n'+build).match(/\b(?:CEHOVOD_ACTIVITY_[A-Z_]+|TECHNOLOGY_D05_[A-Z_]+|TECHNOLOGY_[A-Z_]+|TypeError|AssertionError|ReferenceError)\b/g)||[]))console.log('FIXED_DIAGNOSTIC='+code);
          NODE
          echo "TYPECHECK=$([ "$type" -eq 0 ] && echo PASS || echo FAIL)"
          echo "ADDRESSED_TESTS=$([ "$tests" -eq 0 ] && echo PASS || echo FAIL)"
          echo "HOST_BUNDLE=$([ "$build" -eq 0 ] && echo PASS || echo FAIL)"
          test "$type" -eq 0 && test "$tests" -eq 0 && test "$build" -eq 0
      - name: Remove private source and logs
        if: always()
        shell: bash
        run: |
          rm -rf private-d05
          rm -f "$RUNNER_TEMP"/activity-d05-*.log
