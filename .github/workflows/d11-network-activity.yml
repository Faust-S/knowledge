name: D11 network activity source and integrated build
on:
  workflow_dispatch:
  push:
    branches: ['ci/once/d11-network-activity/**']
    paths: ['.github/ci-requests/d11-network-activity.json']
permissions:
  contents: read
concurrency:
  group: d11-network-activity
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Admit one exact request
        run: |
          python3 tools/ci/verify_once_request.py --repository Faust-S/knowledge --workflow d11-network-activity --profile source-build --revision domain=c4406c29abd639862fc21edf417c5d049184e926 --revision site=a9a26b795e40b44ff2d5217eb4e748291c285412 --revision t2=e70de29b72b83e2546f7ab74b17572685a728c17
      - name: Verify existing approved read scope
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        shell: bash
        run: |
          test -n "$GH_TOKEN" || { echo D11_DOMEN_UNAVAILABLE; exit 1; }
          for repository in Faust-S/advice-logistics Faust-S/advice-logistics.ru Faust-S/T2; do
            gh api "repos/$repository" --jq '.id' >/dev/null 2>&1 || { echo D11_READ_SCOPE_UNAVAILABLE; exit 1; }
          done
          echo D11_READ_SCOPE=PASS
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/advice-logistics
          ref: c4406c29abd639862fc21edf417c5d049184e926
          token: ${{ secrets.DOMEN }}
          path: domain
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/advice-logistics.ru
          ref: a9a26b795e40b44ff2d5217eb4e748291c285412
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: e70de29b72b83e2546f7ab74b17572685a728c17
          token: ${{ secrets.DOMEN }}
          path: t2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact source pins and canonical mirrors
        run: |
          test "$(git -C domain rev-parse HEAD)" = "c4406c29abd639862fc21edf417c5d049184e926"
          test "$(git -C site rev-parse HEAD)" = "a9a26b795e40b44ff2d5217eb4e748291c285412"
          test "$(git -C t2 rev-parse HEAD)" = "e70de29b72b83e2546f7ab74b17572685a728c17"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const load=path=>JSON.parse(fs.readFileSync('site/'+path,'utf8'));
          const operations=load('runtime/d11-module/operations/source.json');
          const methods=load('src/lib/logistics/professional-methods-source.json');
          const areas=load('runtime/d11-module/os-work-areas-source.json');
          if(operations.sourceCommit!=='59a60c0be5a267ebc969187ca1bf065fda21b5c9'||operations.files.length!==52||
             methods.sourceCommit!=='c4406c29abd639862fc21edf417c5d049184e926'||methods.files.length!==3||
             areas.sourceCommit!=='c2abca447f84b19623740fe428b0dba95aafbc89') throw Error('D11_SOURCE_MANIFEST_INVALID');
          const files=[...operations.files,...methods.files,{sourcePath:areas.sourcePath,localPath:areas.localPath,blob:areas.sourceBlob}];
          if(files.length!==56||new Set(files.map(f=>f.sourcePath)).size!==56||new Set(files.map(f=>f.localPath)).size!==56) throw Error('D11_SOURCE_MANIFEST_INVALID');
          const blob=(repo,path)=>execFileSync('git',['-C',repo,'rev-parse','HEAD:'+path],{encoding:'utf8',stdio:['ignore','pipe','ignore']}).trim();
          for(const f of files){
            if(!/^[0-9a-f]{40}$/.test(f.blob)||blob('domain',f.sourcePath)!==f.blob||blob('site',f.localPath)!==f.blob) throw Error('D11_SOURCE_MIRROR_DIFF');
          }
          console.log('D11_SOURCE_MIRRORS=56/56 PASS');
          NODE
      - name: Original canonical regression
        id: domain_regression
        working-directory: domain
        run: |
          log="$RUNNER_TEMP/d11-domain-tests.log"
          status=0
          node --experimental-strip-types --test --test-reporter=tap tests/*.test.mjs >"$log" 2>&1 || status=$?
          grep -E '^# (tests|pass|fail|skipped) [0-9]+$' "$log" || true
          if [ "$status" -ne 0 ]; then
            grep -E '^not ok [0-9]+ - ' "$log" | sed -E 's/^not ok ([0-9]+).*/D11_DOMAIN_FAILED_TEST_NUMBER=\1/' | head -30 || true
            echo D11_DOMAIN_TESTS_FAILED; exit 1
          fi
          echo D11_DOMAIN_TESTS=PASS
      - name: Install site dependencies
        if: ${{ !cancelled() && steps.domain_regression.outcome != 'skipped' }}
        id: site_install
        working-directory: site
        run: |
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/d11-install.log" 2>&1 || { echo D11_NPM_INSTALL_FAILED; exit 1; }
          echo D11_NPM_INSTALL=PASS
      - name: Full site source regression
        if: ${{ !cancelled() && steps.site_install.outcome == 'success' }}
        id: site_regression
        working-directory: site
        run: |
          status=0
          node --experimental-strip-types --test --test-reporter=tap tests/*.test.mjs >"$RUNNER_TEMP/d11-site-tests.log" 2>&1 || status=$?
          grep -E '^# (tests|pass|fail|skipped) [0-9]+$' "$RUNNER_TEMP/d11-site-tests.log" || true
          if [ "$status" -ne 0 ]; then
            grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/d11-site-tests.log" | sed -E 's/^not ok ([0-9]+).*/D11_FAILED_TEST_NUMBER=\1/' | head -30 || true
            echo D11_SITE_TESTS_FAILED
            exit 1
          fi
          echo D11_SITE_TESTS=PASS
      - name: TypeScript
        if: ${{ !cancelled() && steps.site_install.outcome == 'success' }}
        working-directory: site
        run: |
          npx --no-install tsc --noEmit --pretty false >"$RUNNER_TEMP/d11-types.log" 2>&1 || {
            grep -oE 'error TS[0-9]+' "$RUNNER_TEMP/d11-types.log" | sort | uniq -c | head -20 || true
            echo D11_TYPES_FAILED
            exit 1
          }
          echo D11_TYPES=PASS
      - name: Integrated original T2 and site build
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
        run: |
          status=0
          npm run build:t2:site >"$RUNNER_TEMP/d11-build.log" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            # Output only sanitized diagnostic codes and D11 filenames/locations.
            python3 - "$RUNNER_TEMP/d11-build.log" <<'PY'
          import re, sys
          text=open(sys.argv[1],encoding="utf-8",errors="replace").read()
          codes=list(dict.fromkeys(re.findall(r"\b(?:D11_[A-Z0-9_]+|ERR_[A-Z0-9_]+)\b",text)))
          for code in codes[-30:]:
              print("D11_BUILD_CODE="+code)
          for line in text.splitlines():
              if re.fullmatch(r"D11_(?:SUBBUILD_(?:HOST|KERNEL|SITE)|HOST_TYPECHECK_ON_ERROR|HOST_INSTALL)=(?:PASS|FAIL)",line.strip()):
                  print(line.strip())
              m=re.search(r"(D11[A-Za-z0-9_-]+\.tsx?|(?:network|resource|dispatch)[a-z0-9-]*\.d\.mts)\((\d+),(\d+)\): error (TS\d+):",line)
              if m:
                  print("D11_HOST_TYPE_ERROR="+m[4]+" "+m[1]+":"+m[2]+":"+m[3])
          PY
            echo D11_T2_BUILD_FAILED
            exit 1
          fi
          test -f dist/workspace/index.html
          echo D11_ONE_DIST=PASS
      - name: Static product integrity
        working-directory: site
        run: |
          status=0
          for check in readability no-localhost assets external-assets links seo htaccess; do
            if npm run "check:$check" >"$RUNNER_TEMP/d11-$check.log" 2>&1; then echo "D11_STATIC_PASS=$check"; else echo "D11_STATIC_FAILED=$check"; status=1; fi
          done
          test "$status" -eq 0
          echo D11_STATIC_CHECKS=7/7 PASS
      - name: Public route hydration and runtime smoke
        working-directory: site
        run: |
          status=0
          for check in hydration runtime; do
            if npm run "check:$check" >"$RUNNER_TEMP/d11-$check.log" 2>&1; then
              echo "D11_BROWSER_SMOKE_PASS=$check"
            else
              echo "D11_BROWSER_SMOKE_FAIL=$check"
              status=1
            fi
          done
          exit "$status"
      - name: Remove private worktrees and diagnostics
        if: always()
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/domain" "$GITHUB_WORKSPACE/site" "$GITHUB_WORKSPACE/t2"
          rm -f -- "$RUNNER_TEMP"/d11-*.log
      # No private code, raw logs, test data, build output or artifacts are uploaded.
      # This source/build check is not browser product acceptance or a deployment.
