# Domain CI in the authorized public knowledge repository.
# Exact one-shot request; no private source or plaintext delivery published.
name: D03 ArtBazy integrated site release
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/once/d03-artbazy-site-release/**'
    paths:
      - '.github/ci-requests/d03-artbazy-site-release.json'
concurrency:
  group: d03-artbazy-site-release
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      SITE_PIN: bab2e91d4bef1525aadaaef0b5c247be5d939722
      SITE_TREE: b0726a284894dfdc664f6f2432d4fa32e74ffebb
      T2_PIN: e70de29b72b83e2546f7ab74b17572685a728c17
      T2_TREE: b36ed00dcd7c518b593cb4794bfabf85e7eab049
      T3_PIN: 4dc21f8439b6988eed043bbe74dc34d8a7e7d875
      T3_TREE: ae2542cdc0dd24c6effed34c6b5a21a3318f9d68
      ASSISTANT_PIN: 244ad469a71ae65910144c6918488a2d061eecce
      ASSISTANT_TREE: 3ca093b94c81c1adea06d2f33dbc24d468315d92
      PLATFORM_SHA: c142597c759d6689c0298d0ec6abc7ee66b2eefbb1d5abb086efff6f0dea891e
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout public request guard only
        uses: actions/checkout@v4
        with:
          path: ci-harness
          persist-credentials: false
          fetch-depth: 2
      - name: Verify deliberate immutable request before private checkout
        working-directory: ci-harness
        run: |
          python3 tools/ci/verify_once_request.py --repository Faust-S/knowledge --workflow d03-artbazy-site-release --profile artbazy-integrated-site-release --revision site=bab2e91d4bef1525aadaaef0b5c247be5d939722 --revision subject=b3e6614aeace087b66a7b25e3d881fab074e4d8e --revision t2=e70de29b72b83e2546f7ab74b17572685a728c17 --revision core=4dc21f8439b6988eed043bbe74dc34d8a7e7d875 --revision assistant=244ad469a71ae65910144c6918488a2d061eecce --revision skills=829d9ea85ec2cc96e83f7b4acf5184559de1fcc5
      - name: Require successful exact predecessor before delivery rebuild
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          predecessor="$(gh api repos/Faust-S/knowledge/actions/runs/46033174183 --jq '[.status,.conclusion,.head_sha] | join(":")')"
          if [[ "$predecessor" != 'completed:success:263e61c63dc662edbf15d7230f4ac76e6eb8b88c' ]]; then
            echo D03_PREDECESSOR_NOT_SUCCESSFUL
            exit 1
          fi
          echo D03_PREDECESSOR=PASS
      - name: Identify exact private GitHub source access before build
        shell: bash
        env:
          PRIVATE_SOURCE_READ_TOKEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "$PRIVATE_SOURCE_READ_TOKEN" ]]; then
            echo PRIVATE_SOURCE_TOKEN=ABSENT
            exit 1
          fi
          echo PRIVATE_SOURCE_TOKEN=PRESENT
          # Report only HTTP statuses for explicitly pinned source resources.
          # No response bodies, private source bytes or credential output.
          status() {
            local code
            code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $PRIVATE_SOURCE_READ_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/Faust-S/$1")" || code=000
            printf '%s' "$code"
          }
          required_failed=0
          check_source() {
            local repo="$1" commit="$2" file="$3" required="$4"
            local metadata pinned contents
            metadata="$(status "$repo")"
            pinned="$(status "$repo/git/commits/$commit")"
            contents="$(status "$repo/contents/$file?ref=$commit")"
            printf 'GITHUB_SOURCE repo=%s metadata=%s commit=%s contents=%s required_for_build=%s\n' \
              "$repo" "$metadata" "$pinned" "$contents" "$required"
            if [[ "$required" == yes && ( "$metadata" != 200 || "$pinned" != 200 || "$contents" != 200 ) ]]; then
              required_failed=1
            fi
          }
          check_source artbazy.ru "$SITE_PIN" package.json yes
          check_source artbazy b3e6614aeace087b66a7b25e3d881fab074e4d8e AGENTS.md no
          check_source artbazy 829d9ea85ec2cc96e83f7b4acf5184559de1fcc5 models/assistant-skills.json no
          check_source T2 "$T2_PIN" t2/current/final-successor/canonical-source-inputs/k035-rc20/SOURCE_AUTHORITY.json yes
          check_source T3 "$ASSISTANT_PIN" browser-local-inference/domain-assistant/main.mjs yes
          if [[ "$required_failed" != 0 ]]; then
            echo PRIVATE_SOURCE_API=BLOCKED
            exit 1
          fi
          echo PRIVATE_SOURCE_API=PASS
      - name: Checkout exact private ArtBazy site candidate
        uses: actions/checkout@v4
        with:
          repository: Faust-S/artbazy.ru
          ref: bab2e91d4bef1525aadaaef0b5c247be5d939722
          token: ${{ secrets.DOMEN }}
          path: private-site
          persist-credentials: false
          show-progress: false
      - name: Checkout exact original T2 support source
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: e70de29b72b83e2546f7ab74b17572685a728c17
          token: ${{ secrets.DOMEN }}
          path: original-t2
          persist-credentials: false
          show-progress: false
      - name: Checkout exact public original T3
        uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 4dc21f8439b6988eed043bbe74dc34d8a7e7d875
          path: original-t3
          sparse-checkout: packages/t3-core
          persist-credentials: false
          show-progress: false
      - name: Checkout exact original T3 dynamic domain assistant
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 244ad469a71ae65910144c6918488a2d061eecce
          token: ${{ secrets.DOMEN }}
          path: original-assistant
          sparse-checkout: browser-local-inference/domain-assistant
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Verify encrypted ZIP transport on generated test fixtures
        run: node --test ci-harness/tools/ci/sealed-release-zip.test.mjs
      - name: Verify source trees and exact original release archive
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          verify_pin() {
            test "$(git -C "$1" rev-parse HEAD)" = "$2"
            test "$(git -C "$1" rev-parse 'HEAD^{tree}')" = "$3"
          }
          verify_pin private-site "$SITE_PIN" "$SITE_TREE"
          verify_pin original-t2 "$T2_PIN" "$T2_TREE"
          verify_pin original-t3 "$T3_PIN" "$T3_TREE"
          verify_pin original-assistant "$ASSISTANT_PIN" "$ASSISTANT_TREE"
          stage="$RUNNER_TEMP/artbazy-release"
          mkdir -p "$stage"
          curl -fsSL --retry 2 -o "$stage/platform-inputs.zip" \
            https://github.com/Faust-S/knowledge/releases/download/t3-platform-v0.3.1-rc.2/platform-inputs.zip
          printf '%s  %s\n' "$PLATFORM_SHA" "$stage/platform-inputs.zip" | sha256sum --check --status
          cd private-site
          node scripts/t3-platform-inputs.mjs verify "$stage/platform-inputs.zip" >"$stage/platform.json" 2>"$stage/platform.log"
          echo EXACT_ORIGINAL_INPUTS=PASS
      - name: Native projections and integrated release build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          stage="$RUNNER_TEMP/artbazy-release"
          cd private-site
          phase() {
            local label="$1"; shift
            if "$@" >"$stage/$label.log" 2>&1; then
              echo "$label=PASS"
            else
              echo "$label=FAIL"
              node --input-type=module - "$stage/$label.log" <<'JS'
          import {readFileSync} from 'node:fs';
          const s=readFileSync(process.argv[2],'utf8');
          const codes=[...new Set(s.match(/\b(?:ARTBAZY_[A-Z0-9_]{3,100}|T3_[A-Z0-9_]{3,100}|T2_[A-Z0-9_]{3,100}|TS[0-9]{4}|ERR_[A-Z0-9_]{3,80})\b/g)||[])].slice(0,30);
          for(const c of codes)console.log('ERROR_CODE='+c);
          // Emit actionable, bounded build diagnostics, never the private log.
          const categories=[
            ['NODE_HEAP_EXHAUSTED',/heap out of memory|Reached heap limit|Ineffective mark-compacts/i],
            ['PROCESS_KILLED',/(?:^|\n)\s*Killed(?:\s|$)|SIGKILL|exit code 137/i],
            ['PROCESS_ABORTED',/SIGABRT|Aborted \(core dumped\)/i],
            ['CHROME_LAUNCH',/Failed to launch (?:the )?browser|Could not find Chrome|Browser was not found|Browser is not installed|Failed to launch the browser process/i],
            ['CHROME_LIBRARY',/error while loading shared libraries|cannot open shared object file/i],
            ['BROWSER_TIMEOUT',/TimeoutError|Navigation timeout|Waiting failed:.*ms exceeded/i],
            ['VITE_ROLLUP',/Rollup failed to resolve import|Could not resolve|RollupError|UNRESOLVED_IMPORT/i],
            ['VITE_TRANSFORM',/Transform failed|vite:esbuild|vite:react-babel|Parse failure|Unexpected token/i],
            ['VITE_BUILD_ERROR',/error during build:|Build failed in|error when starting dev server/i],
            ['PRE_RENDER_STARTED',/\[prerender\] rendering \d+ routes/],
            ['PRE_RENDER_SERVER',/\[prerender\] static server:/],
            ['PRE_RENDER_COMPLETE',/\[prerender\] done\. ok=\d+ fail=0/],
            ['PUBLIC_LINK_CHECK_STARTED',/\[check:links\] inspecting/],
            ['APACHE_LINK_GATE',/\[htaccess:fail\]/],
            ['FILE_SPACE',/ENOSPC|no space left on device/i],
            ['NODE_INSTALL',/npm error|npm ERR!|ERR_PNPM_/i],
            ['COMMAND_FAILED',/Command failed:/],
          ];
          for(const [name,pattern] of categories)if(pattern.test(s))console.log('BUILD_CATEGORY='+name);
          for(const m of s.matchAll(/(?:^|\n)\[prerender\] rendering (\d+) routes/g))console.log('PRERENDER_EXPECTED='+m[1]);
          const rendered=[...s.matchAll(/(?:^|\n)\[prerender:(?:ok|fail)\] (\/[a-z0-9/_-]*)/g)];
          if(rendered.length)console.log('PRERENDER_OBSERVED='+rendered.length);
          for(const m of [...s.matchAll(/(?:^|\n)\[prerender:fail\] (\/[a-z0-9/_-]*)/g)].slice(0,20))console.log('PRERENDER_FAILED_ROUTE='+m[1]);
          for(const m of [...s.matchAll(/(?:^|\n)\[links:fail\] (no-slash|broken): (\/[a-z0-9/._-]+)/g)].slice(0,50))console.log('BUILT_LINK_KIND='+m[1]+' TARGET='+m[2]);
          for(const m of [...s.matchAll(/(?:^|\n)\[og:fail\] (\/[a-z0-9/._-]*)/g)].slice(0,20))console.log('OG_MISMATCH_ROUTE='+m[1]);
          for(const m of [...s.matchAll(/(?:Could not resolve|failed to resolve import) ["']([@A-Za-z0-9_./-]+)["']/gi)].slice(0,20))console.log('UNRESOLVED_IMPORT='+m[1].split('/').slice(-5).join('/'));
          for(const m of [...s.matchAll(/(?:^|\n)(?:file:\s*)?(?:[^\n]*?\/)?(src\/[A-Za-z0-9_./$-]+\.(?:tsx?|mjs|js|css)):(\d+):(\d+)/g)].slice(0,20))console.log('BUILD_SOURCE_LOCATION='+m[1]+':'+m[2]+':'+m[3]);
          for(const m of [...s.matchAll(/(?:^|\n)\s*(?:status|signal|code):\s*(?:'|")?(SIG[A-Z]+|[0-9]+|ERR_[A-Z0-9_]+)(?:'|")?,?/g)].slice(0,15))console.log('PROCESS_STATUS='+m[1]);
          for(const m of [...s.matchAll(/(?:^|\n)> (?:[A-Za-z0-9@._/-]+ )?(build:release|build:static|generate:catalog-stats|generate:glossary-slugs|check:links)(?:\s|$)/g)].slice(0,20))console.log('NPM_PHASE='+m[1]);
          for(const m of s.matchAll(/(?:^|\n).*?(\d+) modules transformed\./g))console.log('VITE_TRANSFORMED='+m[1]);
          if(/built in \d/.test(s))console.log('VITE_BUILD_COMPLETED=OBSERVED');

          // Only bounded diagnostic categories, public-route paths, and
          // source file/line identities. Never print raw private source.
          for(const code of [...new Set(s.match(/\b(?:SyntaxError|TypeError|ReferenceError|AssertionError|AggregateError|MODULE_NOT_FOUND|ENOENT|EACCES|ENOSPC)\b/g)||[])])console.log('ERROR_CLASS='+code);
          for(const m of [...s.matchAll(/(?:^|\n)\[source-link:fail\] (\/[a-z0-9/-]+): (\d+) occurrence\(s\)/g)].slice(0,50))console.log('SOURCE_LINK_TARGET='+m[1]+' COUNT='+m[2]);
          for(const m of [...s.matchAll(/(?:^|\n)  (src\/[A-Za-z0-9_./$-]+\.(?:tsx?|mjs|js)):(\d+) \[(literal|glossary-bridge)\]/g)].slice(0,50))console.log('SOURCE_LINK_LOCATION='+m[1]+':'+m[2]+' KIND='+m[3]);
          for(const m of [...s.matchAll(/(?:^|\n)(?:\[links:fail\] (?:no-slash|broken):) (\/[a-z0-9/._-]+)/g)].slice(0,50))console.log('BUILT_LINK_TARGET='+m[1]);
          for(const m of [...s.matchAll(/(?:^|\n)([A-Za-z0-9_./$-]+\.(?:tsx?|mts|cts))\((\d+),(\d+)\): error (TS\d{4})/g)].slice(0,60))console.log('TYPESCRIPT_LOCATION='+m[1]+':'+m[2]+':'+m[3]+' '+m[4]);
          for(const m of [...s.matchAll(/(?:Cannot find module|Cannot find package) ['"]([@A-Za-z0-9_./-]+)['"]/g)].slice(0,15))console.log('MISSING_MODULE='+m[1].split('/').slice(-3).join('/'));
          for(const m of [...s.matchAll(/(?:^|\n)# (tests|pass|fail|skipped) (\d+)/g)].slice(-12))console.log('TEST_'+m[1].toUpperCase()+'='+m[2]);
          for(const m of s.matchAll(/^\[(prerender|readability|hydration)\] done\. (?:ok=(\d+) )?fail=(\d+)$/gm))
            console.log(m[1].toUpperCase()+'_OK='+(m[2]||'NA')+' FAIL='+m[3]);
          JS
              return 1
            fi
          }
          phase SITE_DEPENDENCIES bun install --frozen-lockfile --ignore-scripts
          # Only static Vite alias and preservation receipt changed since
          # the native checks in 46014756925. Rebuild final delivery.
          failures=()
          echo D03_PREVIOUS_SOURCE_CHECKS_RUN=46014756925
          echo D03_PREVIOUS_SOURCE_CHECKS=PASS_ON_PARENT
          phase SOURCE_LINKS npm run check:source-links
          phase SOURCE_LINK_TESTS npm run test:source-links
          host_ok=yes
          kernel_ok=yes
          phase ORIGINAL_HOST npm run prepare:t3:host -- \
            "$GITHUB_WORKSPACE/original-t3/packages/t3-core" "$stage/host" "$stage/platform-inputs.zip" "$GITHUB_WORKSPACE/original-assistant" || { failures+=(ORIGINAL_HOST); host_ok=no; }
          phase ORIGINAL_KERNEL_SUPPORT npm run prepare:t3:kernel-support -- \
            "$GITHUB_WORKSPACE/original-t2" "$stage/kernel" "$stage/platform-inputs.zip" || { failures+=(ORIGINAL_KERNEL_SUPPORT); kernel_ok=no; }
          echo "RUNNER_MEMORY_KIB=$(awk '/^MemTotal:/{print $2}' /proc/meminfo)"
          node -e 'console.log("NODE_HEAP_LIMIT_MIB="+Math.round(require("node:v8").getHeapStatistics().heap_size_limit/1048576))'
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome || command -v chromium)"
          test -x "$PUPPETEER_EXECUTABLE_PATH"
          if [[ "$host_ok" == yes && "$kernel_ok" == yes ]]; then
          phase ARTBAZY_ONE_DIST npm run build:release -- "$stage/host" "$stage/kernel" "$stage/platform-inputs.zip" || failures+=(ARTBAZY_ONE_DIST)
          else
            echo ARTBAZY_ONE_DIST=BLOCKED_PREPARED_INPUTS
            failures+=(ARTBAZY_ONE_DIST)
          fi
          if ((${#failures[@]})); then
            printf 'D03_FAILED_PHASE=%s\n' "${failures[@]}"
            exit 1
          fi
          # build:release checks the existing links before replacing dist.
          phase ARTBAZY_PACKAGE npm run package:release -- "$stage/ArtBazy-site.zip"
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          import {readFileSync,existsSync} from 'node:fs';
          const read=p=>JSON.parse(readFileSync(p,'utf8'));
          const manifest=read('dist/t3-offline-manifest.json');
          const catalog=read('runtime/artbazy-module/service-catalog.json');
          const routes=[...catalog.calculators.map(x=>x.route),...catalog.methods.filter(x=>x.public_service===true).map(x=>x.route)];
          if(routes.length!==496||new Set(routes).size!==496||routes.some(p=>!existsSync('dist'+p+'index.html')))throw Error('ARTBAZY_RELEASE_ROUTE_COUNT');
          for(const p of ['index.html','404.html','workspace/index.html','workspace/exchange/index.html','workspace/lifecycle/index.html','workspace/studio/index.html','t3-sw.js','t3-domain-mode.mjs','assets/artbazy-assistant-skills.json'])
            if(!existsSync('dist/'+p))throw Error('ARTBAZY_RELEASE_ENTRY_MISSING');
          if(manifest.complete_static_tree!==true||manifest.domain_origin!=='https://artbazy.ru')throw Error('ARTBAZY_RELEASE_OFFLINE_MANIFEST');
          const runtime=readFileSync('dist/_iwxa/runtime/0.3.6/runtime.js');
          if(createHash('sha256').update(runtime).digest('hex')!=='e1737245aba309e900203b458087ca07cb08d9ccc89901754e1122cbc9a01e78')throw Error('ARTBAZY_RELEASE_ORIGINAL_KERNEL');
          const pack=readFileSync('dist/assets/artbazy-assistant-skills.json');
          const expected=read('runtime/t3-platform/0.3.1-rc.2/domain-assistant.json').skills.packBlob;
          if(createHash('sha1').update('blob '+pack.length+'\0').update(pack).digest('hex')!==expected)throw Error('ARTBAZY_RELEASE_ASSISTANT_PROJECTION');
          if(!manifest.files.some(x=>x.path==='/assets/artbazy-assistant-skills.json'))throw Error('ARTBAZY_RELEASE_ASSISTANT_OFFLINE');
          console.log('ASSISTANT_SKILL_PACK=PASS');
          console.log('PUBLIC_ROUTES=496/496');
          console.log('OFFLINE_RESOURCES='+manifest.files.length);
          console.log('ORIGINAL_KERNEL_BYTES=PASS');
          console.log('ARTBAZY_ONE_DIST=BUILT_NOT_PRODUCT_ACCEPTED');
          JS
      - name: Seal only the verified ArtBazy delivery ZIP
        shell: bash
        env:
          D03_TRANSIT_PUBLIC_KEY: ''
        run: |
          set -euo pipefail
          umask 077
          stage="$RUNNER_TEMP/artbazy-release"
          node ci-harness/tools/ci/sealed-release-zip.mjs seal "$stage/ArtBazy-site.zip" "$stage/handoff" "$SITE_PIN" "$GITHUB_RUN_ID" "$D03_TRANSIT_PUBLIC_KEY"
      - name: Retain only encrypted release bytes for owner handoff
        uses: actions/upload-artifact@v4
        with:
          name: d03-artbazy-sealed-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/artbazy-release/handoff/header.json
            ${{ runner.temp }}/artbazy-release/handoff/payload.bin
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Record release handoff
        run: echo D03_ENCRYPTED_HANDOFF=PASS
      - name: Remove private source, builds and diagnostics
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/private-site" "$GITHUB_WORKSPACE/original-t2" \
            "$GITHUB_WORKSPACE/original-t3" "$GITHUB_WORKSPACE/original-assistant" "$RUNNER_TEMP/artbazy-release"
