name: Activity A4.2 real Rust4PM local discovery
on:
  push:
    branches: [work/2026-11-24-activity-0-4-r4pm, work/2026-11-24-activity-0-4-domain-routes]
    paths:
      - modules/activity-base-anonymizer/ocel2-evidence.mjs
      - modules/activity-base-anonymizer/r4pm-comparison.mjs
      - tools/activity-ocel-r4pm-review.mjs
      - tools/activity-r4pm-worker.py
      - tools/activity-r4pm-requirements.txt
      - tests/test_activity_r4pm_discovery.mjs
      - tests/probe_activity_r4pm.py
      - .github/workflows/activity-r4pm-local.yml
permissions:
  contents: read
jobs:
  actual-engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact published Rust4PM wheels
        run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r tools/activity-r4pm-requirements.txt
      - name: Inspect real binding on an alias-only synthetic fixture
        shell: bash
        run: |
          node --input-type=module -e "import {buildSyntheticOcel2Example,prepareLocalOcel2Discovery} from './modules/activity-base-anonymizer/ocel2-evidence.mjs';const x=await buildSyntheticOcel2Example();const p=await prepareLocalOcel2Discovery(x.ocel2);process.stdout.write(JSON.stringify(p.ocel2));" | python -I tests/probe_activity_r4pm.py
      - name: Compare real Rust4PM with original Activity OCEL reader
        run: node --test tests/test_activity_ocel2_evidence.mjs tests/test_activity_r4pm_discovery.mjs
