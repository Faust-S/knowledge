name: D09 HOP isolated typed-contract qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typed-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact private HOP site candidate
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop.iwxa.ru
          ref: e4c6528de3bc5de956f5b74ea62e391ff83d9bca
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install, TypeScript and D09 tests
        shell: bash
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-npm.log" 2>&1 || {
            echo D09_TYPED_NPM_CI=FAIL; exit 1;
          }
          echo D09_TYPED_NPM_CI=PASS
          npm run typecheck > "$RUNNER_TEMP/d09-types.log" 2>&1 || {
            echo D09_TYPED_TYPES=FAIL
            grep -E "error TS[0-9]+" "$RUNNER_TEMP/d09-types.log" | sed -E "s/: error (TS[0-9]+):.*/: \1/" | head -12 || true
            exit 1
          }
          echo D09_TYPED_TYPES=PASS
          npm run test:d09 > "$RUNNER_TEMP/d09-domain.log" 2>&1 || {
            echo D09_TYPED_DOMAIN=FAIL
            grep -E "not ok|✖|# fail" "$RUNNER_TEMP/d09-domain.log" | tail -15 || true
            exit 1
          }
          echo D09_TYPED_DOMAIN=PASS
          ./node_modules/.bin/vitest run src/lib/__tests__/narrative-brief-import.test.ts src/components/player/ResultContinuationPanel.t2.test.tsx src/integrations/t2/result-source-check.test.ts src/components/workspace/ImportPreviewDialog.t2.test.tsx > "$RUNNER_TEMP/d09-ui.log" 2>&1 || {
            echo D09_TYPED_UI=FAIL; exit 1;
          }
          echo D09_TYPED_UI=PASS
      - name: Checkout exact private subject owner
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop
          ref: 4c20c3c554eee53d75faf6b329b7053bcc81ecfd
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: canonical-hop
      - name: Verify subject model parity
        shell: bash
        run: |
          for file in src/lib/narrative-brief-import.ts src/lib/__tests__/narrative-brief-import.test.ts src/content-system/editorial.ts src/content-system/surfaces.ts src/product-system/registry.ts; do
            cmp "$file" "canonical-hop/$file" || { echo D09_TYPED_CANONICAL_PARITY=FAIL; exit 1; }
          done
          echo D09_TYPED_CANONICAL_PARITY=PASS
      # No private source, source diffs, files, artifacts or tokens published.
