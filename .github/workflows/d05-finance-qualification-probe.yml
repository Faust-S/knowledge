name: d05-finance-qualification-probe
on:
  push:
    branches:
      - test/2026-11-18-d05-source-qualification
    paths:
      - .github/workflows/d05-finance-qualification-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Read pinned private sources ephemerally
        env:
          DOMEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          test -n "${DOMEN:-}" || { echo "D05_MULTI_READ=FAIL"; exit 1; }
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DOMEN" | base64 | tr -d '\r\n')"
          git init --quiet site
          GIT_TERMINAL_PROMPT=0 git -C site -c "http.extraheader=$header" fetch --quiet --depth 1 --no-tags https://github.com/Faust-S/cehovod.ru.git 467552cf72f361c72eecf2ba46c9e5712b9705bb >/dev/null 2>&1 || { echo "D05_MULTI_READ=FAIL"; exit 1; }
          git -C site checkout --quiet --detach FETCH_HEAD
          test "$(git -C site rev-parse HEAD)" = "467552cf72f361c72eecf2ba46c9e5712b9705bb" || { echo "D05_MULTI_SITE_PIN=FAIL"; exit 1; }
          unset header DOMEN
          echo "D05_MULTI_SITE_PIN=PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Format temporary copy and export non-source patch
        run: |
          set -euo pipefail
          cd site
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d05-multi-install.log" 2>&1 || { echo "D05_MULTI_INSTALL=FAIL"; exit 1; }
          echo "D05_MULTI_INSTALL=PASS"
          node --check scripts/d05-first-use-real-kernel-witness.mjs
          echo "D05_INDEPENDENT_WITNESS_SYNTAX=PASS"
          ./node_modules/.bin/prettier --write src/lib/shop-capacity.ts src/lib/capacity-subcontract.ts src/lib/capacity-subcontract.test.ts src/lib/capacity-cash.ts src/lib/capacity-work-plan.ts src/lib/capacity-work-revision.ts src/host/CehovodSubcontractEditor.tsx src/host/CehovodCapacityPanel.tsx src/host/CehovodPreparedWorkPanel.tsx src/host/CehovodWorkRevisionPanel.tsx src/host/CehovodCapacityPanel.regression.test.ts scripts/d05-management-ui-witness.ts scripts/fixtures/d05-remaining-ui-harness.tsx src/lib/capacity-shift.ts src/lib/capacity-shift.test.ts src/host/CehovodShiftEditor.tsx src/lib/capacity-auxiliary-choice.ts src/lib/capacity-auxiliary-choice.test.ts src/host/CehovodAuxiliaryChoiceEditor.tsx src/lib/capacity-outsource-choice.ts src/lib/capacity-outsource-choice.test.ts src/host/CehovodOutsourceChoiceEditor.tsx src/lib/capacity-decision.ts src/lib/capacity-management.ts src/host/CehovodManagementComparison.tsx src/lib/capacity-combination.ts src/lib/capacity-combination.test.ts src/host/CehovodCombinationEditor.tsx > "$RUNNER_TEMP/d05-multi-prettier.log" 2>&1 || { echo "D05_MULTI_FORMAT=FAIL"; exit 1; }
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          names = ["src/lib/shop-capacity.ts","src/lib/capacity-subcontract.ts","src/lib/capacity-subcontract.test.ts","src/lib/capacity-cash.ts","src/lib/capacity-work-plan.ts","src/lib/capacity-work-revision.ts","src/host/CehovodSubcontractEditor.tsx","src/host/CehovodCapacityPanel.tsx","src/host/CehovodPreparedWorkPanel.tsx","src/host/CehovodWorkRevisionPanel.tsx","src/host/CehovodCapacityPanel.regression.test.ts","scripts/d05-management-ui-witness.ts","scripts/fixtures/d05-remaining-ui-harness.tsx","src/lib/capacity-shift.ts","src/lib/capacity-shift.test.ts","src/host/CehovodShiftEditor.tsx","src/lib/capacity-auxiliary-choice.ts","src/lib/capacity-auxiliary-choice.test.ts","src/host/CehovodAuxiliaryChoiceEditor.tsx","src/lib/capacity-outsource-choice.ts","src/lib/capacity-outsource-choice.test.ts","src/host/CehovodOutsourceChoiceEditor.tsx","src/lib/capacity-decision.ts","src/lib/capacity-management.ts","src/host/CehovodManagementComparison.tsx","src/lib/capacity-combination.ts","src/lib/capacity-combination.test.ts","src/host/CehovodCombinationEditor.tsx"]
          punctuation = set('.,;:!?()[]{}\'"=<>+*/|&-')
          def partition(source):
              anchors, gaps = [], ['']
              for char in source:
                  if char.isspace() or char in punctuation:
                      gaps[-1] += char
                  else:
                      anchors.append(char)
                      gaps.append('')
              return anchors, gaps
          for name in names:
              original = subprocess.check_output(["git", "show", "HEAD:" + name]).decode("utf-8")
              formatted = pathlib.Path(name).read_text(encoding="utf-8")
              a, ag = partition(original)
              b, bg = partition(formatted)
              if a != b:
                  print("D05_SEPARATOR_ANCHORS_CHANGED="+name)
                  raise SystemExit(2)
              deltas = [[i, old, new] for i, (old, new) in enumerate(zip(ag, bg)) if old != new]
              if len(deltas) > 3000:
                  print("D05_SEPARATOR_EXCESS_DELTA="+name)
                  raise SystemExit(3)
              rebuilt = bg[0] + ''.join(char + bg[i + 1] for i, char in enumerate(a))
              if rebuilt != formatted:
                  raise SystemExit("D05_SEPARATOR_RECONSTRUCTION_INVALID")
              payload = json.dumps({
                  "path": name,
                  "before": hashlib.sha256(original.encode()).hexdigest(),
                  "after": hashlib.sha256(formatted.encode()).hexdigest(),
                  "separatorEdits": deltas,
              }, ensure_ascii=True, separators=(',',':'))
              print("D05_SEPARATOR_PATCH="+base64.b64encode(payload.encode()).decode())
              print("D05_SEPARATOR_EDIT_COUNT="+name+":"+str(len(deltas)))
          print("D05_PRIVATE_CODE_DISCLOSED=NO")
          PY

      - name: Run focused financial and capacity tests, types and lint
        run: |
          set -euo pipefail
          cd site
          status=0
          if ./node_modules/.bin/vitest run src/lib/capacity-management.test.ts src/lib/capacity-cash.test.ts src/lib/capacity-finance.test.ts src/lib/capacity-decision.test.ts src/lib/shop-capacity.test.ts src/host/dispatch-capacity.test.ts src/host/CehovodCapacityPanel.regression.test.ts src/lib/capacity-work-plan.test.ts src/host/dispatch-work-plan.test.ts src/lib/capacity-work-revision.test.ts src/host/CehovodHostApp.ui-regression.test.ts src/host/CehovodDispatchQueue.ui-regression.test.ts src/lib/capacity-remaining.test.ts src/lib/capacity-readiness.test.ts src/lib/capacity-resource-scope.test.ts src/lib/capacity-subcontract.test.ts src/lib/capacity-shift.test.ts src/lib/capacity-auxiliary-choice.test.ts src/lib/capacity-outsource-choice.test.ts src/lib/capacity-combination.test.ts --reporter=json --outputFile="$RUNNER_TEMP/d05-finance-tests.json" > "$RUNNER_TEMP/d05-finance-tests.log" 2>&1; then
            echo "D05_FINANCE_TESTS=PASS"
          else
            echo "D05_FINANCE_TESTS=FAIL"
            status=1
          fi
          if test -f "$RUNNER_TEMP/d05-finance-tests.json"; then
            node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/d05-finance-tests.json","utf8"));
          console.log("D05_FINANCE_TEST_COUNT="+r.numTotalTests);
          console.log("D05_FINANCE_TEST_PASSED="+r.numPassedTests);
          for (const f of r.testResults || []) {
            const n = (f.assertionResults || []).flatMap((a,i)=>a.status==="failed"?[i+1]:[]);
            if(n.length) console.log("D05_FINANCE_FAILED_ORDINALS="+path.basename(f.name||"unknown")+":"+n.join(","));
          }
          NODE
          fi
          if npm run typecheck > "$RUNNER_TEMP/d05-finance-types.log" 2>&1; then
            echo "D05_FINANCE_TYPECHECK=PASS"
          else
            echo "D05_FINANCE_TYPECHECK=FAIL"
            status=1
            python3 - <<'PY'
          import os,pathlib,re
          text=pathlib.Path(os.environ["RUNNER_TEMP"]+"/d05-finance-types.log").read_text(errors="replace")
          for path,line,col,code in re.findall(r"((?:src|scripts)/[A-Za-z0-9_./-]+)\((\d+),(\d+)\): error (TS\d+)",text)[:25]:
              print("D05_FINANCE_TYPE_LOCATION="+path+":"+line+":"+col+":"+code)
          PY
          fi
          if ./node_modules/.bin/eslint src/lib/capacity-cash.ts src/lib/capacity-cash.test.ts src/lib/capacity-decision.ts src/lib/capacity-management.ts src/lib/capacity-management.test.ts src/host/dispatch-capacity.ts src/host/dispatch-capacity.test.ts src/host/CehovodCashPanel.tsx src/host/CehovodCapacityPanel.tsx src/host/CehovodCapacityPanel.regression.test.ts src/host/CehovodManagementComparison.tsx src/host/CehovodCommonCashEditor.tsx src/host/CehovodCashDelayPanel.tsx scripts/d05-first-use-real-kernel-witness.mjs scripts/d05-management-ui-witness.ts scripts/fixtures/d05-management-ui-harness.tsx src/lib/capacity-work-plan.ts src/lib/capacity-work-plan.test.ts src/host/dispatch-work-plan.ts src/host/CehovodPreparedWorkPanel.tsx src/host/CehovodDispatchQueue.tsx src/host/CehovodHostApp.tsx src/host/dispatch-work-plan.test.ts src/lib/capacity-work-revision.ts src/lib/capacity-work-revision.test.ts src/lib/capacity-decision.test.ts src/host/CehovodWorkRevisionPanel.tsx src/host/CehovodHostApp.ui-regression.test.ts src/host/CehovodDispatchQueue.ui-regression.test.ts src/lib/shop-capacity.ts src/lib/shop-capacity.test.ts src/lib/capacity-remaining.ts src/lib/capacity-remaining.test.ts src/host/CehovodRemainingWorkEditor.tsx scripts/fixtures/d05-remaining-ui-harness.tsx src/lib/capacity-resource-scope.ts src/lib/capacity-readiness.ts src/lib/capacity-readiness.test.ts src/host/CehovodReadinessEditor.tsx src/lib/capacity-subcontract.ts src/lib/capacity-subcontract.test.ts src/host/CehovodSubcontractEditor.tsx src/lib/capacity-shift.ts src/lib/capacity-shift.test.ts src/host/CehovodShiftEditor.tsx src/lib/capacity-auxiliary-choice.ts src/lib/capacity-auxiliary-choice.test.ts src/host/CehovodAuxiliaryChoiceEditor.tsx src/lib/capacity-outsource-choice.ts src/lib/capacity-outsource-choice.test.ts src/host/CehovodOutsourceChoiceEditor.tsx src/lib/capacity-combination.ts src/lib/capacity-combination.test.ts src/host/CehovodCombinationEditor.tsx --format json > "$RUNNER_TEMP/d05-finance-lint.json" 2>/dev/null; then
            echo "D05_FINANCE_ESLINT=PASS"
          else
            echo "D05_FINANCE_ESLINT=FAIL"
            status=1
            node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          try {
            const files = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/d05-finance-lint.json","utf8"));
            for (const f of files) for (const m of f.messages) console.log("D05_FINANCE_LINT_LOCATION="+path.basename(f.filePath)+":"+(m.ruleId||"parse")+":"+m.line+":"+m.column);
          } catch { console.log("D05_FINANCE_LINT_REPORT_UNAVAILABLE"); }
          NODE
          fi
          exit "$status"
      - name: Run positive browser qualification of the existing cash and management panels
        run: |
          set -euo pipefail
          cd site
          if node --import tsx scripts/d05-management-ui-witness.ts > "$RUNNER_TEMP/d05-management-ui.log" 2>&1; then
            grep -E '^D05_MANAGEMENT_UI_[A-Z_]+=PASS$' "$RUNNER_TEMP/d05-management-ui.log"
            grep -qx 'D05_MANAGEMENT_UI_WITNESS=PASS' "$RUNNER_TEMP/d05-management-ui.log"
          else
            grep -E '^D05_MANAGEMENT_UI_(FAILURE_(PHASE|CLASS|CODE)|[A-Z_]+)=([A-Za-z_][A-Za-z0-9_-]{0,80})$' "$RUNNER_TEMP/d05-management-ui.log" || true
            echo "D05_MANAGEMENT_UI_WITNESS=FAIL"
            exit 1
          fi
