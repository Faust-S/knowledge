name: d05-finance-qualification-probe
on:
  push:
    branches:
      - test/2026-11-18-d05-source-qualification
    paths:
      - .github/workflows/d05-finance-qualification-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Read pinned private sources ephemerally
        env:
          DOMEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          test -n "${DOMEN:-}" || { echo "D05_MULTI_READ=FAIL"; exit 1; }
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DOMEN" | base64 | tr -d '\r\n')"
          git init --quiet site
          GIT_TERMINAL_PROMPT=0 git -C site -c "http.extraheader=$header" fetch --quiet --depth 1 --no-tags https://github.com/Faust-S/cehovod.ru.git fa49666491d5c49e23770c16f34cb55407e7592f >/dev/null 2>&1 || { echo "D05_MULTI_READ=FAIL"; exit 1; }
          git -C site checkout --quiet --detach FETCH_HEAD
          test "$(git -C site rev-parse HEAD)" = "fa49666491d5c49e23770c16f34cb55407e7592f" || { echo "D05_MULTI_SITE_PIN=FAIL"; exit 1; }
          unset header DOMEN
          echo "D05_MULTI_SITE_PIN=PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install and check exact sources without exporting source or patches
        id: install
        run: |
          set -euo pipefail
          cd site
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d05-install.log" 2>&1 || { echo "D05_MULTI_INSTALL=FAIL"; exit 1; }
          echo "D05_MULTI_INSTALL=PASS"
          node --check scripts/d05-first-use-real-kernel-witness.mjs
          echo "D05_INDEPENDENT_WITNESS_SYNTAX=PASS"
          for file in src/lib/capacity-funding-availability.ts src/lib/capacity-management.ts src/lib/capacity-funding-stress.ts src/lib/capacity-payment-limit.ts src/lib/capacity-work-plan.ts src/lib/capacity-queue-search.ts src/lib/capacity-management.test.ts src/lib/capacity-queue-search.test.ts src/lib/capacity-combination.test.ts src/host/CehovodManagementComparison.tsx src/host/CehovodCashDelayPanel.tsx src/host/CehovodFundingStressPanel.tsx src/host/CehovodPreparedWorkPanel.tsx scripts/d05-management-ui-witness.ts scripts/d05-first-use-real-kernel-witness.mjs; do
            if ./node_modules/.bin/prettier --check "$file" > "$RUNNER_TEMP/d05-format.log" 2>&1; then
              echo "D05_FORMAT_$(basename "$file")=PASS"
            else
              echo "D05_FORMAT_$(basename "$file")=FAIL"
            fi
          done
          echo "D05_SOURCE_AND_PATCH_EXPORT=DISABLED"

      - name: Run focused financial and capacity tests, types and lint
        run: |
          set -euo pipefail
          cd site
          status=0
          if ./node_modules/.bin/vitest run src/lib/capacity-management.test.ts src/lib/capacity-cash.test.ts src/lib/capacity-finance.test.ts src/lib/capacity-decision.test.ts src/lib/shop-capacity.test.ts src/host/dispatch-capacity.test.ts src/host/CehovodCapacityPanel.regression.test.ts src/lib/capacity-work-plan.test.ts src/host/dispatch-work-plan.test.ts src/lib/capacity-work-revision.test.ts src/host/CehovodHostApp.ui-regression.test.ts src/host/CehovodDispatchQueue.ui-regression.test.ts src/lib/capacity-remaining.test.ts src/lib/capacity-readiness.test.ts src/lib/capacity-resource-scope.test.ts src/lib/capacity-subcontract.test.ts src/lib/capacity-shift.test.ts src/lib/capacity-auxiliary-choice.test.ts src/lib/capacity-outsource-choice.test.ts src/lib/capacity-combination.test.ts src/lib/capacity-resource-diagnostic.test.ts src/lib/capacity-queue-search.test.ts --reporter=json --outputFile="$RUNNER_TEMP/d05-finance-tests.json" > "$RUNNER_TEMP/d05-finance-tests.log" 2>&1; then
            echo "D05_FINANCE_TESTS=PASS"
          else
            echo "D05_FINANCE_TESTS=FAIL"
            status=1
          fi
          if test -f "$RUNNER_TEMP/d05-finance-tests.json"; then
            node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/d05-finance-tests.json","utf8"));
          console.log("D05_FINANCE_TEST_COUNT="+r.numTotalTests);
          console.log("D05_FINANCE_TEST_PASSED="+r.numPassedTests);
          for (const f of r.testResults || []) {
            const n = (f.assertionResults || []).flatMap((a,i)=>a.status==="failed"?[i+1]:[]);
            if(n.length) console.log("D05_FINANCE_FAILED_ORDINALS="+path.basename(f.name||"unknown")+":"+n.join(","));
          }
          NODE
          fi
          if npm run typecheck > "$RUNNER_TEMP/d05-finance-types.log" 2>&1; then
            echo "D05_FINANCE_TYPECHECK=PASS"
          else
            echo "D05_FINANCE_TYPECHECK=FAIL"
            status=1
            python3 - <<'PY'
          import os,pathlib,re
          text=pathlib.Path(os.environ["RUNNER_TEMP"]+"/d05-finance-types.log").read_text(errors="replace")
          for path,line,col,code in re.findall(r"((?:src|scripts)/[A-Za-z0-9_./-]+)\((\d+),(\d+)\): error (TS\d+)",text)[:25]:
              print("D05_FINANCE_TYPE_LOCATION="+path+":"+line+":"+col+":"+code)
          PY
          fi
          if ./node_modules/.bin/eslint src/lib/capacity-cash.ts src/lib/capacity-cash.test.ts src/lib/capacity-decision.ts src/lib/capacity-management.ts src/lib/capacity-management.test.ts src/host/dispatch-capacity.ts src/host/dispatch-capacity.test.ts src/host/CehovodCashPanel.tsx src/host/CehovodCapacityPanel.tsx src/host/CehovodCapacityPanel.regression.test.ts src/host/CehovodManagementComparison.tsx src/host/CehovodCommonCashEditor.tsx src/host/CehovodCashDelayPanel.tsx scripts/d05-first-use-real-kernel-witness.mjs scripts/d05-management-ui-witness.ts scripts/fixtures/d05-management-ui-harness.tsx src/lib/capacity-work-plan.ts src/lib/capacity-work-plan.test.ts src/host/dispatch-work-plan.ts src/host/CehovodPreparedWorkPanel.tsx src/host/CehovodDispatchQueue.tsx src/host/CehovodHostApp.tsx src/host/dispatch-work-plan.test.ts src/lib/capacity-work-revision.ts src/lib/capacity-work-revision.test.ts src/lib/capacity-decision.test.ts src/host/CehovodWorkRevisionPanel.tsx src/host/CehovodHostApp.ui-regression.test.ts src/host/CehovodDispatchQueue.ui-regression.test.ts src/lib/shop-capacity.ts src/lib/shop-capacity.test.ts src/lib/capacity-remaining.ts src/lib/capacity-remaining.test.ts src/host/CehovodRemainingWorkEditor.tsx scripts/fixtures/d05-remaining-ui-harness.tsx src/lib/capacity-resource-scope.ts src/lib/capacity-readiness.ts src/lib/capacity-readiness.test.ts src/host/CehovodReadinessEditor.tsx src/lib/capacity-subcontract.ts src/lib/capacity-subcontract.test.ts src/host/CehovodSubcontractEditor.tsx src/lib/capacity-shift.ts src/lib/capacity-shift.test.ts src/host/CehovodShiftEditor.tsx src/lib/capacity-auxiliary-choice.ts src/lib/capacity-auxiliary-choice.test.ts src/host/CehovodAuxiliaryChoiceEditor.tsx src/lib/capacity-outsource-choice.ts src/lib/capacity-outsource-choice.test.ts src/host/CehovodOutsourceChoiceEditor.tsx src/lib/capacity-combination.ts src/lib/capacity-combination.test.ts src/host/CehovodCombinationEditor.tsx src/lib/capacity-payment-limit.ts src/lib/capacity-resource-diagnostic.ts src/lib/capacity-resource-diagnostic.test.ts src/host/CehovodResourceDiagnosticPanel.tsx src/lib/capacity-queue-search.ts src/lib/capacity-queue-search.test.ts src/lib/capacity-funding-stress.ts src/lib/capacity-funding-availability.ts src/host/CehovodFundingStressPanel.tsx --format json > "$RUNNER_TEMP/d05-finance-lint.json" 2>/dev/null; then
            echo "D05_FINANCE_ESLINT=PASS"
          else
            echo "D05_FINANCE_ESLINT=FAIL"
            status=1
            node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          try {
            const files = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/d05-finance-lint.json","utf8"));
            for (const f of files) for (const m of f.messages) console.log("D05_FINANCE_LINT_LOCATION="+path.basename(f.filePath)+":"+(m.ruleId||"parse")+":"+m.line+":"+m.column);
          } catch { console.log("D05_FINANCE_LINT_REPORT_UNAVAILABLE"); }
          NODE
          fi
          exit "$status"
      - name: Run positive browser qualification of the existing cash and management panels
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          cd site
          if node --import tsx scripts/d05-management-ui-witness.ts > "$RUNNER_TEMP/d05-management-ui.log" 2>&1; then
            grep -E '^D05_MANAGEMENT_UI_[A-Z_]+=PASS$' "$RUNNER_TEMP/d05-management-ui.log"
            grep -qx 'D05_MANAGEMENT_UI_WITNESS=PASS' "$RUNNER_TEMP/d05-management-ui.log"
          else
            grep -E '^D05_MANAGEMENT_UI_(FAILURE_(PHASE|CLASS|CODE)|[A-Z_]+)=([A-Za-z_][A-Za-z0-9_-]{0,80})$' "$RUNNER_TEMP/d05-management-ui.log" || true
            echo "D05_MANAGEMENT_UI_WITNESS=FAIL"
            exit 1
          fi
