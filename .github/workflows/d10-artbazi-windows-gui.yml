name: D10 ArtBazi Windows Edge UIA qualification baseline
on:
  push:
    branches: [work/2026-11-18-d10-case-ci]
    paths: [.github/workflows/d10-artbazi-windows-gui.yml, windows/d10-edge-uia.ps1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d10-edge-uia:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout public Windows orchestration
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout private D10 site for isolated Windows runner
        uses: actions/checkout@v4
        with:
          repository: Faust-S/artbazi.ru
          ref: 2122e11dc7ba73ea1e10d208c6978ddcd0efd85a
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - name: Checkout original normative T2
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: e70de29b72b83e2546f7ab74b17572685a728c17
          token: ${{ secrets.DOMEN }}
          path: t2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Verify pinned private and T2 source in runner
        run: |
          if ((git -C site rev-parse HEAD).Trim() -ne "2122e11dc7ba73ea1e10d208c6978ddcd0efd85a") { throw "D10_WINDOWS_SITE_PIN_MISMATCH" }
          if ((git -C t2 rev-parse HEAD).Trim() -ne "e70de29b72b83e2546f7ab74b17572685a728c17") { throw "D10_WINDOWS_T2_PIN_MISMATCH" }
          Write-Output "D10_WINDOWS_SOURCE_PINS=PASS"
      - name: Install site dependencies privately
        working-directory: site
        run: |
          bun install --frozen-lockfile *> "$env:RUNNER_TEMP\d10-win-install.log"
          if($LASTEXITCODE -ne 0){throw "D10_WINDOWS_BUN_INSTALL_FAILED"}
          Write-Output "D10_WINDOWS_BUN_INSTALL=PASS"
      - name: TypeScript Windows gate
        working-directory: site
        run: |
          npm run check:types *> "$env:RUNNER_TEMP\d10-win-types.log"
          if($LASTEXITCODE -ne 0){throw "D10_WINDOWS_TYPECHECK_FAILED"}
          Write-Output "D10_WINDOWS_TYPES=PASS"
      - name: Validate native Windows UIAutomation script syntax
        run: |
          # Windows PowerShell 5.1 reads UTF-8 without BOM as ANSI. Copy the
          # public-only UIA script to an ephemeral UTF-8-BOM file so Cyrillic
          # accessible labels survive native Windows UIAutomation.
          $source=Join-Path $env:GITHUB_WORKSPACE "windows/d10-edge-uia.ps1"
          $target=Join-Path $env:RUNNER_TEMP "d10-edge-uia-utf8.ps1"
          $utf8=[System.IO.File]::ReadAllText($source,[System.Text.Encoding]::UTF8)
          [System.IO.File]::WriteAllText($target,$utf8,(New-Object System.Text.UTF8Encoding($true)))
          $tokens=$null
          $errorsFound=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $target,[ref]$tokens,[ref]$errorsFound) | Out-Null
          if($errorsFound.Count -gt 0){
            foreach($entry in $errorsFound){
              Write-Output "D10_WINDOWS_UIA_PARSE_LINE=$($entry.Extent.StartLineNumber)"
              Write-Output "D10_WINDOWS_UIA_PARSE_ERROR_ID=$($entry.ErrorId)"
            }
            throw "D10_WINDOWS_UIA_PARSER_FAILED"
          }
          Write-Output "D10_WINDOWS_UIA_SCRIPT_SYNTAX=PASS"
      - name: Original T2 plus site in one Windows dist
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
        run: |
          $log="$env:RUNNER_TEMP\d10-win-build.log"
          $errLog="$env:RUNNER_TEMP\d10-win-build-err.log"
          Write-Output "D10_WINDOWS_BUILD_RUNNER_STARTED=PASS"
          # Windows PowerShell 5.1 treats native stderr as a terminating
          # NativeCommandError with Stop, even when the child is progressing.
          # Let the child finish, capture both streams privately and inspect
          # its real process exit code without publishing its source output.
          $proc=Start-Process -FilePath "$env:ComSpec" -ArgumentList @("/d","/c","npm run build") -Wait -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError $errLog
          $exitCode=$proc.ExitCode
          Write-Output "D10_WINDOWS_BUILD_PROCESS_REAPED=PASS"
          if($exitCode -ne 0){
            if(Test-Path $errLog){Get-Content $errLog | Add-Content $log}
            Get-Content $log | Select-String -Pattern 'D10_WINDOWS_BUILD_PHASE=[A-Z_]+' |
              Select-Object -Last 12 | ForEach-Object {
                if($_.Line -match 'D10_WINDOWS_BUILD_PHASE=([A-Z_]+)'){
                  Write-Output "D10_WINDOWS_BUILD_PHASE=$($Matches[1])"
                }
              }
            $full=Get-Content $log -Raw
            foreach($pattern in @(
              @{code="CANNOT_FIND_MODULE";expr="Cannot find module"},
              @{code="MODULE_NOT_FOUND";expr="MODULE_NOT_FOUND"},
              @{code="NPM_FAILURE";expr="npm error|npm ERR!"},
              @{code="TAR_EXTRACTION";expr="tar: "},
              @{code="ACCESS_DENIED";expr="Access is denied|EACCES"},
              @{code="GIT_CHECKOUT";expr="fatal: "},
              @{code="RUNTIME_TYPE_ERROR";expr="TypeError:"},
              @{code="TIMEOUT";expr="timed out|ETIMEDOUT"}
            )){
              if($full -match $pattern.expr){Write-Output "D10_WINDOWS_BUILD_CLASS=$($pattern.code)"}
            }
            Get-Content $log | Select-String -AllMatches -Pattern 'ARTBAZI_[A-Z0-9_]+|IWXA_[A-Z0-9_]+|T2_[A-Z0-9_]+|ERR_[A-Z0-9_]+|TS[0-9]{4}|ENOENT|EPERM|EACCES|ETIMEDOUT' |
              ForEach-Object {$_.Matches | ForEach-Object {$_.Value}} |
              Select-Object -Unique -First 18 | ForEach-Object {Write-Output "D10_WINDOWS_BUILD_ERROR_CODE=$_"}
            throw "D10_WINDOWS_INTEGRATED_BUILD_FAILED"
          }
          if(-not (Test-Path "dist/workspace/index.html")){throw "D10_WINDOWS_WORKSPACE_MISSING"}
          if(-not (Test-Path "dist/cases/vesper-quote-to-deal/index.html")){throw "D10_WINDOWS_CASE010_HTML_MISSING"}
          Write-Output "D10_WINDOWS_INTEGRATED_DIST=PASS"
      - name: Verify production-hosting candidate inventory and static rules
        working-directory: site
        run: |
          # Source and dist remain only in this ephemeral runner.
          # Publish stable gate names and exit codes, never private source text.
          $gates=@(
            @{ code="INVENTORY"; cmd="node scripts/check-d10-hosting-release.mjs" },
            @{ code="LOCALHOST"; cmd="npm run check:no-localhost" },
            @{ code="ASSETS"; cmd="npm run check:assets" },
            @{ code="EXTERNAL_ASSETS"; cmd="npm run check:external-assets" },
            @{ code="LINKS"; cmd="npm run check:links" },
            @{ code="SEO"; cmd="npm run check:seo" },
            @{ code="APACHE"; cmd="npm run check:htaccess" }
          )
          foreach($gate in $gates){
            $out=Join-Path $env:RUNNER_TEMP ("d10-release-"+$gate.code+"-out.log")
            $err=Join-Path $env:RUNNER_TEMP ("d10-release-"+$gate.code+"-err.log")
            $p=Start-Process -FilePath "$env:ComSpec" -ArgumentList @("/d","/c",$gate.cmd) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
            if($p.ExitCode -ne 0){
              Write-Output "D10_HOSTING_$($gate.code)=FAIL"
              # Only release-checker error identifiers, never private file contents.
              $failure=(Get-Content $out -Raw -ErrorAction SilentlyContinue) + (Get-Content $err -Raw -ErrorAction SilentlyContinue)
              [regex]::Matches($failure,"D10_HOSTING_[A-Z0-9_]+") |
                ForEach-Object {$_.Value} | Select-Object -Unique -First 5 |
                ForEach-Object {Write-Output "D10_HOSTING_CAUSE=$_"}
              throw "D10_HOSTING_GATE_FAILED_$($gate.code)"
            }
            Write-Output "D10_HOSTING_$($gate.code)=PASS"
          }
          Write-Output "D10_HOSTING_RELEASE_STATIC_GATES=PASS"
      - name: Native Microsoft Edge Windows UIAutomation ten article routes
        run: |
          $log="$env:RUNNER_TEMP\d10-win-uia.log"
          $errLog="$env:RUNNER_TEMP\d10-win-uia-err.log"
          $script="$env:RUNNER_TEMP\d10-edge-uia-utf8.ps1"
          $proc=Start-Process -FilePath "$PSHOME\powershell.exe" -ArgumentList @("-NoProfile","-ExecutionPolicy","Bypass","-File",$script) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError $errLog
          $result=$proc.ExitCode
          Get-Content $log | Select-String -Pattern "^D10_WINDOWS_" | ForEach-Object {$_.Line}
          if($result -ne 0){
            $failure=Get-Content $errLog -Raw
            foreach($class in @("ParserError","MethodInvocationException","InvalidOperation","RuntimeException","ArgumentException","NullReferenceException")){
              if($failure -match $class){Write-Output "D10_WINDOWS_UIA_FAILURE_CLASS=$class"}
            }
            if($failure -match 'd10-edge-uia(?:-utf8)?\\.ps1:(\\d+) char:(\\d+)'){
              Write-Output "D10_WINDOWS_UIA_FAILURE_LINE=$($Matches[1])"
            }
            # Only bounded sanitized UIA diagnostic tokens; no closed source/DOM dumps.
            $failureCodes=[regex]::Matches($failure,'D10_WINDOWS_[A-Z0-9_-]+') |
              ForEach-Object {$_.Value} | Select-Object -Unique -Last 5
            foreach($failureCode in $failureCodes){Write-Output "D10_WINDOWS_UIA_CAUSE=$failureCode"}
            $errors=Get-Content $errLog | Select-String -Pattern "D10_WINDOWS_[A-Z0-9_]+" | Select-Object -Last 3
            foreach($diagnostic in $errors){Write-Output "D10_WINDOWS_UIA_DIAG=$($diagnostic.Matches[0].Value)"}
            throw "D10_WINDOWS_UIA_NATIVE_INTERACTION_FAILED"
          }
          if(-not (Select-String -Path $log -Pattern "D10_WINDOWS_CASE010_NATIVE_METRIC_INTERACTION=PASS" -Quiet)){
            throw "D10_WINDOWS_CASE010_NATIVE_RESULT_NOT_CONFIRMED"
          }
      - name: No private artifacts published
        run: |
          Write-Output "D10_WINDOWS_CODE_AND_DIST=NOT_PUBLISHED"
          Write-Output "D10_WINDOWS_GUI_BASELINE_IS_NOT_FULL_PRODUCT_ACCEPTANCE=TRUE"
