name: K04 Agent Solution Composer open-host
on:
  push:
    branches:
      - work/2026-11-05-k04-agent-solution-composer
    paths:
      - modules/k04-composer/**
      - .github/workflows/k04-composer.yml
  pull_request:
    paths:
      - modules/k04-composer/**
      - .github/workflows/k04-composer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  k04-open-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JS source
        run: |
          node --check modules/k04-composer/index.mjs
          node --check modules/k04-composer/meeting-process.mjs
          node --check modules/k04-composer/meeting-document-host.mjs
          node --check modules/k04-composer/sample/run-complex-meeting.mjs
      - name: Execute K04 contract tests
        run: node --test modules/k04-composer/tests/*.test.mjs
      - name: Checkout pinned public K02 peer
        uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 1914680c40cdbd44b8b925e72a1edbbe2e0a79f5
          path: .k02-peer
          persist-credentials: false
      - name: Verify per-step requests with actual K02 functions
        run: node --test modules/k04-composer/integration/*.test.mjs
      - name: Execute real open-host sample
        run: node modules/k04-composer/sample/open-host.mjs
      - name: Execute complete meeting and produce actual documents
        run: node modules/k04-composer/sample/run-complex-meeting.mjs
        env:
          K04_OUTPUT_DIRECTORY: ${{ runner.temp }}/k04-meeting-documents
      - name: Upload authored sample documents for independent inspection
        uses: actions/upload-artifact@v4
        with:
          name: k04-meeting-documents-${{ matrix.os }}
          path: ${{ runner.temp }}/k04-meeting-documents/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve existing meeting attribution checks
        run: python -m unittest discover -s tests -p "test_meeting_followup_attribution.py" -v
