name: d06-source-gate

# Full source quality on private checkout, ephemeral public Windows runner.
on:
  push:
    branches:
      - test/2026-11-18-d06-qualification
    paths:
      - .github/workflows/d06-source-gate.yml
permissions:
  contents: read
jobs:
  source-check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod.ru
          ref: f63399ce1f8027f8bcf7ce5fd9558a8c971ea756
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - name: Checkout canonical D06 item Result rule privately
        uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod
          ref: ce66412a32049701a241dcdf383a32fb7d1aeeb0
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/domain
      - name: Execute standalone domain item history contract tests
        shell: pwsh
        working-directory: private/domain
        run: |
          $log = Join-Path $env:RUNNER_TEMP "d06-domain-item-binding-private.txt"
          & node scripts/test-item-result-binding.mjs *> $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "D06_CANONICAL_ITEM_BINDING_TESTS=FAIL"
            exit 1
          }
          Write-Host "D06_CANONICAL_ITEM_BINDING_TESTS=PASS"
      - name: Verify canonical item rule matches site implementation
        shell: pwsh
        run: |
          # Git blob identity compares the exact canonical source,
          # unaffected by repository-specific Windows CRLF checkout settings.
          $canon = (& git -C private/domain rev-parse "HEAD:src/rules/item-result-binding.ts").Trim()
          $site = (& git -C private/site rev-parse "HEAD:src/rules/item-result-binding.ts").Trim()
          if ($LASTEXITCODE -ne 0 -or $canon -ne $site) {
            Write-Host "D06_ITEM_BINDING_CANONICAL_SYNC=FAIL"
            exit 1
          }
          Write-Host "D06_ITEM_BINDING_CANONICAL_SYNC=PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and run complete source gate
        shell: pwsh
        working-directory: private/site
        run: |
          $failed = $false
          foreach ($task in @("ci", "run check", "run test:unit", "run test:native", "run test:case040:procurement", "run test")) {
            $code = $task.Replace(" ","-").Replace(":","-")
            $log = Join-Path $env:RUNNER_TEMP ("d06-" + $code + "-private.log")
            & cmd.exe /d /c ("npm " + $task + " > """ + $log + """ 2>&1")
            $passed = $LASTEXITCODE -eq 0
            $value = if ($passed) { "PASS" } else { "FAIL" }
            Write-Host ("D06_SOURCE_" + $code.ToUpperInvariant() + "=" + $value)
            if (-not $passed) {
              $failed = $true
              # Machine-readable classes only: never print private file paths
              # or error messages into the public Actions log.
              $logText = Get-Content -LiteralPath $log -Raw
              $prettier = ([regex]::Matches($logText, "prettier/prettier")).Count
              $ts = ([regex]::Matches($logText, "error TS[0-9]+:")).Count
              Write-Host ("D06_SOURCE_" + $code.ToUpperInvariant() + "_TS_COUNT=" + $ts)
              Write-Host ("D06_SOURCE_" + $code.ToUpperInvariant() + "_PRETTIER_COUNT=" + $prettier)
              # Report only numeric coordinates and compiler codes, never private filenames.
              if ($ts -gt 0) {
                $knownTs = @(& git ls-files -- "*.ts" "*.tsx" "*.mjs")
                $coord = @()
                foreach ($match in [regex]::Matches($logText, '(?m)((?:src|scripts|tests)[/\\][^():\r\n]+)\((\d+),(\d+)\):\s*error\s+TS(\d+):')) {
                  $file = $match.Groups[1].Value.Replace([char]92, [char]47)
                  $ordinal = [array]::IndexOf($knownTs, $file) + 1
                  $coord += ($ordinal.ToString() + ":" + $match.Groups[2].Value + ":TS" + $match.Groups[4].Value)
                }
                Write-Host ("D06_SOURCE_TS_ORDINAL_LINES=" + (($coord | Select-Object -Unique -First 12) -join ","))
              }
              # Public output is ordinal-only, not private paths or code.
              if ($task -eq "run check") {
                $known = @(& git ls-files -- "*.ts" "*.tsx" "*.mjs" | Sort-Object)
                $perFile = @{}
                $prettierCoords = [System.Collections.Generic.List[string]]::new()
                $activeFile = ""
                foreach ($entry in ($logText -split '[\r\n]+')) {
                  if ($entry -match '(?i)[\\/]((?:src|scripts|tests)[\\/][^:\r\n]+?\.(?:ts|tsx|mjs))\s*$') {
                    $activeFile = $Matches[1].Replace([char]92, [char]47)
                  } elseif ($entry -match 'prettier/prettier' -and $activeFile) {
                    $perFile[$activeFile] = 1 + [int]($perFile[$activeFile])
                    # Only a file ordinal and the ESLint diagnostic line leave the runner.
                    $lineMatch = [regex]::Match($entry, '^\s*(\d+):(\d+)\s+(?:error|warning)\s+')
                    $ordinal = [array]::IndexOf($known, $activeFile) + 1
                    if ($lineMatch.Success -and $ordinal -gt 0) {
                      $prettierCoords.Add($ordinal.ToString() + ":" + $lineMatch.Groups[1].Value)
                    }
                  }
                }
                $summary = @($perFile.Keys | ForEach-Object {
                  $index = [array]::IndexOf($known, $_)
                  ($index + 1).ToString() + ":" + $perFile[$_]
                } | Sort-Object) -join ","
                Write-Host ("D06_SOURCE_PRETTIER_FILE_ORDINAL_COUNTS=" + $summary)
                Write-Host ("D06_SOURCE_PRETTIER_FILES=" + $perFile.Count)
                Write-Host ("D06_SOURCE_PRETTIER_ORDINAL_LINES=" + (($prettierCoords | Sort-Object -Unique | Select-Object -First 30) -join ","))
              }

              if ($task -eq "run test" -or $task -eq "run test:unit" -or $task -eq "run test:native" -or $task -eq "run test:case040:procurement") {
                $failureCount = ([regex]::Matches($logText, "(?m)^\s*not ok\s")).Count
                Write-Host ("D06_SOURCE_TEST_FAILED_COUNT=" + $failureCount)
                $testCodes = [regex]::Matches($logText, "D06_(?:PD18|WORKFLOW|RESULT)_[A-Z0-9_]+") | ForEach-Object { $_.Value } | Select-Object -Unique -First 14
                Write-Host ("D06_SOURCE_TEST_ERROR_CODES=" + ($testCodes -join ","))
                $types = @()
                foreach ($kind in @("AssertionError", "TypeError", "SyntaxError", "MODULE_NOT_FOUND", "ERR_MODULE_NOT_FOUND")) {
                  if ($logText.Contains($kind)) { $types += $kind }
                }
                Write-Host ("D06_SOURCE_TEST_FAILURE_CLASSES=" + ($types -join ","))
                if ($task -eq "run test:case040:procurement") {
                  # Only source line numbers. Never expose private error text,
                  # stack paths, observations or test fixture data.
                  $positions = [regex]::Matches($logText, "test-d06-case040-procurement-continuity\.ts:(\d+):(\d+)") |
                    ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique -First 4
                  Write-Host ("D06_CASE040_FAILURE_LINE_NUMBERS=" + ($positions -join ","))
                  $caseOrdinal = [regex]::Match($logText, 'D06_CASE040_ASSERTION_ORDINAL=(\d+)')
                  Write-Host ("D06_CASE040_ASSERTION_ORDINAL=" + $(if ($caseOrdinal.Success) { $caseOrdinal.Groups[1].Value } else { "0" }))
                  $frame = [regex]::Matches($logText, '(?:src|scripts|tests)[/\\][^:\r\n]+\.(?:ts|tsx|mjs):(\d+):(\d+)')
                  Write-Host ("D06_CASE040_FRAME_LINES=" + ((@($frame | ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique -First 8)) -join ","))

                }
                # Script identifiers are non-secret, unlike the private
                # assertion text. This identifies the failed unit stage.
                $stage = $null
                foreach ($line in ($logText -split "`n")) {
                  if ($line.Trim() -match '^> [^ ]+ (test:[a-z0-9:.-]+)$') {
                    $stage = $Matches[1]
                  }
                }
                if ($stage) { Write-Host ("D06_SOURCE_TEST_LAST_SCRIPT=" + $stage) }
                if ($task -eq "run test") {
                  $positions = [regex]::Matches($logText, 'test-d06-case040-procurement-continuity\.ts:(\d+):(\d+)')
                  Write-Host ("D06_SOURCE_PROCUREMENT_LINES=" + ((@($positions | ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique -Last 5)) -join ","))
                  Write-Host ("D06_SOURCE_ASSERTION_CLASS=" + [int]($logText -match 'AssertionError|ERR_ASSERTION'))
                  $caseOrdinal = [regex]::Match($logText, 'D06_CASE040_ASSERTION_ORDINAL=(\d+)')
                  Write-Host ("D06_SOURCE_CASE040_ASSERTION_ORDINAL=" + $(if ($caseOrdinal.Success) { $caseOrdinal.Groups[1].Value } else { "0" }))
                }
                if ($task -eq "run test" -or $task -eq "run test:unit") {
                  $matches = [regex]::Matches($logText, '(?m)^> [^\r\n]+\s+(test(?::[a-z0-9:.-]+)?)\s*$')
                  $nested = @($matches | ForEach-Object { $_.Groups[1].Value })
                  Write-Host ("D06_SOURCE_TEST_NESTED_TRAIL=" + (($nested | Select-Object -Last 8) -join ","))
                }
              }
            }
          }
          if ($failed) { exit 1 }
      - name: Privacy boundary
        if: always()
        shell: pwsh
        run: |
          Write-Host "D06_PRIVATE_SOURCE_ARTIFACTS=0"
          Write-Host "D06_PRIVATE_LOGS_UPLOADED=0"
