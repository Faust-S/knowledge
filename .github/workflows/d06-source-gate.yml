name: d06-source-gate

# Full source quality on private checkout, ephemeral public Windows runner.
on:
  push:
    branches:
      - test/2026-11-18-d06-qualification
    paths:
      - .github/workflows/d06-source-gate.yml
permissions:
  contents: read
jobs:
  source-check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod.ru
          ref: de6668f362a3f98ac61fab7296a1e76a957a4102
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and run complete source gate
        shell: pwsh
        working-directory: private/site
        run: |
          $failed = $false
          foreach ($task in @("ci", "run check", "run test")) {
            $code = $task.Replace(" ","-")
            $log = Join-Path $env:RUNNER_TEMP ("d06-" + $code + "-private.log")
            & cmd.exe /d /c ("npm " + $task + " > """ + $log + """ 2>&1")
            $passed = $LASTEXITCODE -eq 0
            $value = if ($passed) { "PASS" } else { "FAIL" }
            Write-Host ("D06_SOURCE_" + $code.ToUpperInvariant() + "=" + $value)
            if (-not $passed) {
              $failed = $true
              # Machine-readable classes only: never print private file paths
              # or error messages into the public Actions log.
              $logText = Get-Content -LiteralPath $log -Raw
              $prettier = ([regex]::Matches($logText, "prettier/prettier")).Count
              $ts = ([regex]::Matches($logText, "error TS[0-9]+:")).Count
              Write-Host ("D06_SOURCE_" + $code.ToUpperInvariant() + "_TS_COUNT=" + $ts)
              Write-Host ("D06_SOURCE_" + $code.ToUpperInvariant() + "_PRETTIER_COUNT=" + $prettier)
            }
          }
          if ($failed) { exit 1 }
      - name: Privacy boundary
        if: always()
        shell: pwsh
        run: |
          Write-Host "D06_PRIVATE_SOURCE_ARTIFACTS=0"
          Write-Host "D06_PRIVATE_LOGS_UPLOADED=0"
