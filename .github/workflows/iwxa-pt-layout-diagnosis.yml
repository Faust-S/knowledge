name: IWXA PT Life+ stylesheet and RU clipping classification
on:
  push:
    branches: [work/2026-11-18-pt-66-qualification]
    paths:
      - .github/workflows/iwxa-pt-layout-diagnosis.yml
      - tools/pt-ru-layout-diagnostics.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iwxa-pt-layout-diagnosis-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnosis:
    name: Browser genuine RU PT parity at 375 and 1440
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check private source authorization
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          test -n "$GH_TOKEN" || exit 1
          gh api repos/Faust-S/iwxa-ru-1 >/dev/null 2>&1 || exit 1
      - uses: actions/checkout@v4
        with:
          path: qa
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-ru-1
          ref: a29342519466961dc1a1a8f44713323ebb0268f1
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          fetch-depth: 0
          path: pt-site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"
      - name: Real source typecheck and SSR build
        working-directory: pt-site
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "a29342519466961dc1a1a8f44713323ebb0268f1" || exit 1
          bun install --frozen-lockfile > "$RUNNER_TEMP/pt-install.log" 2>&1 || { echo "PT_INSTALL=FAIL"; exit 1; }
          echo "PT_INSTALL=PASS"
          node scripts/check-portuguese-source.mjs > "$RUNNER_TEMP/pt-guard.log" 2>&1 || {
            echo "PT_SOURCE_GUARD=FAIL"
            grep -E '(FAIL|Error:|unexpected)' "$RUNNER_TEMP/pt-guard.log" | tail -n 12 |
              sed -E 's#/home/runner/[^ ]+#<private-path>#g' || true
            exit 1
          }
          echo "PT_SOURCE_GUARD=PASS"
          bun run typecheck > "$RUNNER_TEMP/pt-types.log" 2>&1 || {
            echo "PT_TYPECHECK=FAIL"
            grep -E 'error TS|error' "$RUNNER_TEMP/pt-types.log" | sed -E 's#/home/runner/[^ ]+#<private-path>#g' | tail -n 5 || true
            exit 1
          }
          echo "PT_TYPECHECK=PASS"
          export LOVABLE_BUILD_TARGET=static NITRO_PRESET=node-server SERVER_PRESET=node-server
          bun run build > "$RUNNER_TEMP/pt-build.log" 2>&1 || { echo "PT_BUILD=FAIL"; exit 1; }
          test -f .output/server/index.mjs || { echo "PT_SSR_MISSING"; exit 1; }
          echo "PT_BUILD=PASS"
      - name: Browser test Life+ stylesheet and diagnose RU clipping
        shell: bash
        run: |
          PORT=4397 HOST=127.0.0.1 NODE_ENV=production node pt-site/.output/server/index.mjs > "$RUNNER_TEMP/pt-server.log" 2>&1 &
          server="$!"
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:4397/; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then echo "PT_SERVER=FAIL"; exit 1; fi
          if PT_SITE_DIR="$GITHUB_WORKSPACE/pt-site" PT_BASE=http://127.0.0.1:4397/ node qa/tools/pt-ru-layout-diagnostics.mjs > "$RUNNER_TEMP/pt-layout.log" 2>&1; then
            grep -E '^(PT_LIFE_STYLE_|UNIVERSITY_READABILITY_)' "$RUNNER_TEMP/pt-layout.log" || true
            echo "PT_LAYOUT=PASS"
          else
            grep -E '^(PT_LIFE_STYLE_|UNIVERSITY_READABILITY_)' "$RUNNER_TEMP/pt-layout.log" | tail -n 12 || true
            echo "PT_LAYOUT=FAIL"
            exit 1
          fi
