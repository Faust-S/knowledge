name: T3 G4 current release ledger and exact owner pins
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t3-g4-current-ledger-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-current-release-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate one current G4 verdict and source/installed pins
        run: node --test packages/t3-core/tests/g4-current-release-ledger.test.mjs
