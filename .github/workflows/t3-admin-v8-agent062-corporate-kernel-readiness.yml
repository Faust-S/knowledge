name: Admin Center V8 Agent 0.6.2 original corporate Kernel readiness candidate
on:
  push:
    branches:
      - work/2026-11-23-admin03-agent062-corporate-readiness
    paths:
      - .github/workflows/t3-admin-v8-agent062-corporate-kernel-readiness.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin03-agent062-corporate-readiness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  private-agent-source:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout exact private Agent 0.6.2 corporate readiness candidate
        uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: 04ae96eb07da7f0f22cdb013ffa94e1b00ecaa54
          token: ${{ secrets.AGENT || secrets.DOMEN || secrets.T3 }}
          persist-credentials: false
          sparse-checkout: |
            desktop
            config
            runtime
          path: .private/agent
      - name: Verify immutable source and version
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $head=(& git -C .private/agent rev-parse HEAD).Trim()
          if($head -cne '04ae96eb07da7f0f22cdb013ffa94e1b00ecaa54') { throw 'ADMIN_AGENT062_EXACT_SOURCE_CHANGED' }
          $package=Get-Content -LiteralPath '.private/agent/desktop/package.json' -Raw | ConvertFrom-Json
          if($package.version -cne '0.6.2'){
            throw 'ADMIN_AGENT062_PRODUCT_VERSION_CHANGED'
          }
          if(!(Test-Path -LiteralPath '.private/agent/desktop/tests/corporate-kernel-readiness.test.mjs')){
            throw 'ADMIN_AGENT062_ORIGINAL_KERNEL_READINESS_TEST_MISSING'
          }
          Write-Host 'ADMIN_AGENT062_CORPORATE_KERNEL_EXACT_SOURCE_PASS'
      - name: Install actual released desktop dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm ci --prefix '.private/agent/desktop' --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'ADMIN_AGENT062_DESKTOP_DEPENDENCIES_FAILED'}
      - name: Execute original corporate Kernel identity tests and full desktop build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm run verify:desktop --prefix '.private/agent/desktop'
          if($LASTEXITCODE -ne 0){throw 'ADMIN_AGENT062_CORPORATE_KERNEL_DESKTOP_FAILED'}
          Write-Host 'ADMIN_AGENT062_CORPORATE_KERNEL_NODE_TESTS_AND_TSC_VITE_PASS'
          Write-Host 'ADMIN_AGENT062_NOT_YET_SIGNED_CROSS_APP_TASK_RESULT'
