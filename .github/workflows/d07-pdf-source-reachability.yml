name: D07 public manufacturer PDF network reachability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe-public-pdf-publishers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe actual official publisher endpoints without fetching full PDFs
        shell: bash
        run: |
          set +e
          echo D07_PUBLIC_PDF_NETWORK_START
          for url in \
            https://www.bostik.com/files/live/sites/shared_bostik/files/documents-brochures/Russia/Documents/TDS/bostik-russia-multi-fliz-tds%28rus%29.pdf \
            https://www.bostik.com/files/live/sites/shared_bostik/files/documents-brochures/Russia/Documents/TDS/Quelyd_Spets%20Flizelin_TDS%28RUS%29.pdf \
            https://www.bostik.com/russia/ru/catalog/product/construction/emea/russia/product-bostik-quelyd-flizmulti/ \
            https://www.quick-step.ru/laminate/installation/; do
            host=$(echo "$url" | cut -d/ -f3)
            printf 'D07_CURL_PROBE_HOST=%s\n' "$host"
            curl -I --connect-timeout 6 --max-time 12 --max-redirs 0 -sS \
              -o /dev/null -w 'D07_CURL_STATUS=%{http_code} TLS=%{ssl_verify_result} ERR=%{errormsg}\n' "$url"
            printf 'D07_CURL_EXIT=%s\n' "$?"
          done
          node - <<'NODE'
          const host="https://www.bostik.com/";
          const c=new AbortController();setTimeout(()=>c.abort(),10000);
          fetch(host,{method:"HEAD",signal:c.signal}).then(r=>
            console.log("D07_NODE_FETCH="+r.status)).catch(e=>
            console.log("D07_NODE_FETCH_ERROR="+e.name+
             ":CAUSE="+(e.cause?.code??"none")+
             ":DETAIL="+String(e.cause?.message??"").slice(0,120)));
          NODE
          echo D07_PUBLIC_PDF_NETWORK_FINISH
