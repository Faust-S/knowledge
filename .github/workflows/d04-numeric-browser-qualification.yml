name: D04 numeric verification of all 13 original Life OS calculator interfaces
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d04-numeric-all-13-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery-exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm authorized private source reads before checkout
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "D04_DOMEN_SECRET_MISSING"; exit 1; fi
          for repo in Faust-S/bazmed.ru Faust-S/bazmed Faust-S/T2; do
            if ! gh api "repos/$repo" --jq '.id' >/dev/null 2>&1; then
              echo "D04_PRIVATE_REPOSITORY_ACCESS_DENIED:$repo"
              exit 1
            fi
          done
          echo "D04_RECOVERY_SOURCES_AUTHORIZED=3/3"
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/bazmed.ru
          ref: 15021a0343032aaeaef6b1cee98387a00c052389
          token: ${{ secrets.DOMEN }}
          path: d04-private/site
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/bazmed
          ref: d0f6ec9d50c01891ed1001fb872ac2d5770e8f0d
          token: ${{ secrets.DOMEN }}
          path: d04-private/model
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: 9c64951cd78411283e8a416641c36d71e169fc1d
          token: ${{ secrets.DOMEN }}
          path: d04-private/t2
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source identity
        run: |
          set -euo pipefail
          test "$(git -C d04-private/site rev-parse HEAD)" = "15021a0343032aaeaef6b1cee98387a00c052389"
          test "$(git -C d04-private/model rev-parse HEAD)" = "d0f6ec9d50c01891ed1001fb872ac2d5770e8f0d"
          test "$(git -C d04-private/t2 rev-parse HEAD)" = "9c64951cd78411283e8a416641c36d71e169fc1d"
          echo "D04_RECOVERY_EXACT_SOURCE=PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check both original private witness module syntaxes
        working-directory: d04-private/site
        run: |
          set -euo pipefail
          node --check qualification/life-os-numeric-browser.browser.mjs
          echo "D04_NUMERIC_WITNESS_SYNTAX=PASS"
      - name: Install private site and normative T2 dependencies without publishing logs
        run: |
          set -euo pipefail
          if (cd d04-private/site && npm ci --no-audit --no-fund --include=dev) >"$RUNNER_TEMP/d04-site-install.log" 2>&1; then
            echo "D04_RECOVERY_SITE_NPM_CI=PASS"
          else
            echo "D04_RECOVERY_SITE_NPM_CI=FAIL"
            exit 1
          fi
          canonical="d04-private/t2/t2/current/final-successor/canonical-source"
          if (cd "$canonical" && npm ci --no-audit --no-fund --include=dev) >"$RUNNER_TEMP/d04-t2-install.log" 2>&1; then
            echo "D04_RECOVERY_NORMATIVE_T2_NPM_CI=PASS"
          else
            echo "D04_RECOVERY_NORMATIVE_T2_NPM_CI=FAIL"
            exit 1
          fi
      - name: Install normative T2 Chromium from exact Playwright package
        timeout-minutes: 5
        run: |
          set -euo pipefail
          canonical="d04-private/t2/t2/current/final-successor/canonical-source"
          if (cd "$canonical" && timeout 210s npx playwright install chromium) >"$RUNNER_TEMP/d04-browser-install.log" 2>&1; then
            echo "D04_NORMATIVE_T2_BROWSER=PASS"
          else
            echo "D04_NORMATIVE_T2_BROWSER=FAIL"
            exit 1
          fi
      - name: Generate new isolated witness challenge
        run: |
          umask 077
          openssl rand -hex 32 > "$RUNNER_TEMP/d04-eight-mode-challenge"
          echo "D04_FRESH_WITNESS_CHALLENGE=SET"
      - name: Build exact T2 and BazMed with qualification-only read-only auditor
        working-directory: d04-private/site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/d04-private/t2
        run: |
          set -uo pipefail
          set +e
          export IWXA_T2_PRODUCT_CHALLENGE="$(cat "$RUNNER_TEMP/d04-eight-mode-challenge")"
          npm run build:t2:site >"$RUNNER_TEMP/d04-recovery-build.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "D04_RECOVERY_INTEGRATED_BUILD=FAIL"
            grep -Eo 'BAZMED_[A-Z0-9_]+|D04_[A-Z0-9_]+' "$RUNNER_TEMP/d04-recovery-build.log" | sort -u | tail -20 || true
            exit "$code"
          fi
          test -s dist/workspace/index.html
          test -s dist/workspace/exchange/index.html
          test -s dist/_iwxa/current.json
          echo "D04_RECOVERY_INTEGRATED_BUILD=PASS"
      - name: Run all 13 numerical calculators with true browser controls on 375 and 1440 px
        working-directory: d04-private/site
        run: |
          set -uo pipefail
          set +e
          export IWXA_T2_PRODUCT_CHALLENGE="$(cat "$RUNNER_TEMP/d04-eight-mode-challenge")"
          node --input-type=module >"$RUNNER_TEMP/d04-numeric-13-browser.log" 2>&1 <<'NODE'
          import {createRequire} from 'node:module';
          import {resolve,join} from 'node:path';
          import {pathToFileURL} from 'node:url';
          const site=process.cwd();
          const canonical=resolve(process.env.GITHUB_WORKSPACE,
            'd04-private/t2/t2/current/final-successor/canonical-source');
          const {chromium}=createRequire(join(canonical,'package.json'))('playwright');
          const {serveRealKernelHost}=await import(pathToFileURL(
            join(canonical,'scripts/real-kernel-e2e.mjs')).href);
          const {runLifeOsNumericBrowser}=await import(pathToFileURL(
            join(site,'qualification/life-os-numeric-browser.browser.mjs')).href);
          const server=await serveRealKernelHost(join(site,'dist'),{
            independentWitness:true,previewOrigin:true
          });
          try{
            const result=await runLifeOsNumericBrowser({chromium,origin:server.origin});
            if(result.status!=='PASS'||result.realUiCalculators!==13||
               result.viewports.length!==4||!result.methodsRecomputed||
               !result.stagedResultVerified||result.missingKernelClaim!==false||
               result.viewports.some(v=>v.calculationCount!==13||v.invalidGuards!==4||!v.fullWaterlow)||
               ![320,375,768,1440].every(w=>result.viewports.some(v=>v.width===w)))
              throw Error('D04_NUMERIC_MATRIX_INCOMPLETE');
            console.log('D04_NUMERIC_13_METHODS_W320=PASS');
            console.log('D04_NUMERIC_13_METHODS_W375=PASS');
            console.log('D04_NUMERIC_13_METHODS_W768=PASS');
            console.log('D04_NUMERIC_13_METHODS_W1440=PASS');
            console.log('D04_NUMERIC_16_NEGATIVE_BOUNDS=PASS');
            console.log('D04_NUMERIC_STAGED_ADMISSION=PASS');
            console.log('D04_NUMERIC_FULL_WATERLOW_2005=PASS');
          }finally{await new Promise(done=>server.server.close(done))}
          NODE
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "D04_NUMERIC_BROWSER_E2E=FAIL"
            grep -Eo 'D04_NUMERIC_[A-Za-z0-9_]+' "$RUNNER_TEMP/d04-numeric-13-browser.log" | sort -u | tail -12 || true
            python3 "$GITHUB_WORKSPACE/tools/ci/d04_recovery_safe_diagnostics.py" "$RUNNER_TEMP/d04-numeric-13-browser.log" || true
            exit "$code"
          fi
          grep '^D04_NUMERIC_' "$RUNNER_TEMP/d04-numeric-13-browser.log" | tail -8
          echo "D04_NUMERIC_BROWSER_E2E=PASS"
          # No private source, medical inputs, dist or archive in public artifacts.
