name: D12 AKIS CASE-001-002 targeted independent qualification
on:
  push:
    branches: [work/2026-11-02-pipeline-foundation]
    paths: [.github/workflows/d12-akis-articles-fast-qualification.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d12-akis-fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    name: Independent source and browser ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact private article source
        uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-ru-1
          ref: 40b124d232204c313155fe1a1b9b87e76bd95cbd
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - name: Verify source identity without printing private code
        run: |
          test "$(git rev-parse HEAD)" = "40b124d232204c313155fe1a1b9b87e76bd95cbd" || exit 1
          test -f src/routes/science.akis-production.tsx || exit 1
          test -f src/routes/science.akis-operator.tsx || exit 1
          echo "AKIS_PRIVATE_SOURCE_IDENTITIES=PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Frozen dependencies
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/akis-install.log" 2>&1 || {
            echo "AKIS_INSTALL=FAIL"; exit 1;
          }
          echo "AKIS_INSTALL=PASS"
      - name: Real Node tests on both models
        run: |
          bun run check:akis:production > "$RUNNER_TEMP/akis-001.log" 2>&1 || {
            echo "AKIS_001_TESTS=FAIL"; exit 1;
          }
          bun run check:akis:article > "$RUNNER_TEMP/akis-002.log" 2>&1 || {
            echo "AKIS_002_TESTS=FAIL"; exit 1;
          }
          echo "AKIS_CASE_UNIT=PASS"
      - name: TypeScript via original Vite route generator
        run: |
          npm run typecheck > "$RUNNER_TEMP/akis-tsc.log" 2>&1 || {
            echo "AKIS_TYPECHECK=FAIL"; exit 1;
          }
          echo "AKIS_TYPECHECK=PASS"
      - name: Install Chromium for original browser engine
        run: |
          bunx puppeteer browsers install chrome > "$RUNNER_TEMP/akis-puppeteer.log" 2>&1 || {
            echo "AKIS_BROWSER_INSTALL=FAIL"; exit 1;
          }
          echo "AKIS_BROWSER_INSTALL=PASS"
      - name: Verify original website assets
        run: |
          npx tsx scripts/verify-assets.ts > "$RUNNER_TEMP/akis-assets.log" 2>&1 || {
            echo "AKIS_ASSETS=FAIL"; exit 1;
          }
          echo "AKIS_ASSETS=PASS"
      - name: Generate original public sitemap
        run: |
          npx tsx scripts/generate-sitemap.ts > "$RUNNER_TEMP/akis-sitemap.log" 2>&1 || {
            echo "AKIS_SITEMAP=FAIL"; exit 1;
          }
          echo "AKIS_SITEMAP=PASS"
      - name: Original Vite static-target SSR compilation
        env:
          LOVABLE_BUILD_TARGET: static
          NITRO_PRESET: node-server
          SERVER_PRESET: node-server
        run: |
          npx vite build > "$RUNNER_TEMP/akis-vite.log" 2>&1 || {
            echo "AKIS_VITE_SSR=FAIL"; exit 1;
          }
          echo "AKIS_VITE_SSR=PASS"
      - name: Original SSR prerender for two selected scientific articles
        env:
          LOVABLE_BUILD_TARGET: static
          NITRO_PRESET: node-server
          SERVER_PRESET: node-server
          IWXA_PRERENDER_ROUTES: /science/akis-production/,/science/akis-operator/
        run: |
          npx tsx scripts/prerender.ts > "$RUNNER_TEMP/akis-prerender.log" 2>&1 || {
            # Only error classifications, never raw source or local runner paths.
            node -e 'const fs=require("node:fs");const x=fs.readFileSync(process.env.RUNNER_TEMP+"/akis-prerender.log","utf8");const lines=x.split(/\r?\n/);const groups=[["SSR_NOT_FOUND",/no SSR build found|not found/i],["SSR_SPAWN",/spawn|ENOENT|not recognized|is not recognized/i],["SSR_BROWSER",/browser|chromium|puppeteer|Failed to launch/i],["SSR_PORT",/EADDRINUSE|didn.t start|ECONNREFUSED/i],["SSR_ROUTE",/route|unregistered|404|readability/i],["SSR_PERMISSIONS",/EACCES|EPERM|permission/i],["SSR_MODULE",/ERR_MODULE|Cannot find module|MODULE_NOT_FOUND/i],["SSR_RUNTIME",/TypeError|SyntaxError|ReferenceError|Error:/i],["SSR_EXEC",/command not found|npx|tsx|npm error/i]];for(const [n,re] of groups){if(re.test(lines.slice(-40).join("\n")))console.log("AKIS_PRERENDER_DIAGNOSTIC="+n)}console.log("AKIS_PRERENDER_OUTPUT_LINES="+lines.length);for(const x of lines.slice(-8)){let y=x.replace(/(?:[A-Za-z]:)?[\\/][^\s"'()<>\[\]]+/g,"<PATH>").replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g,"<EMAIL>");if(!/[A-Za-z]/.test(y))continue;console.log("AKIS_PRERENDER_TAIL="+y.slice(0,180))}' || true
            echo "AKIS_TWO_PAGE_PRERENDER=FAIL"; exit 1;
          }
          test -f dist-static/science/akis-production/index.html || exit 1
          test -f dist-static/science/akis-operator/index.html || exit 1
          echo "AKIS_TWO_PAGE_PRERENDER=PASS"
      - name: Check original HTML, canonical, schema and reciprocal research links
        run: |
          bun run check:akis:static > "$RUNNER_TEMP/akis-ssr-check.log" 2>&1 || {
            grep -oE 'AKIS_STATIC_FAIL:[A-Za-z0-9_-]+:[A-Za-z0-9_-]+' "$RUNNER_TEMP/akis-ssr-check.log" |
              head -3 || true
            echo "AKIS_ARTICLE_SSR=FAIL"; exit 1;
          }
          bun run check:schema > "$RUNNER_TEMP/akis-schema.log" 2>&1 || {
            echo "AKIS_ARTICLE_SCHEMA=FAIL"; exit 1;
          }
          echo "AKIS_ARTICLE_SSR=PASS"
          echo "AKIS_ARTICLE_SCHEMA=PASS"
      - name: Native click, math, mobile overflow, dark light, interactive browser scenario
        run: |
          bun run check:akis:browser > "$RUNNER_TEMP/akis-browser.log" 2>&1 || {
            grep -oE 'AKIS_BROWSER_(ASSERT_FAILED|ACTION_MISSING):[^[:space:]]+|TimeoutError|Waiting failed|net::ERR_[A-Z_]+' "$RUNNER_TEMP/akis-browser.log" | sort -u | head -5 || true
            echo "AKIS_BROWSER=FAIL"; exit 1;
          }
          echo "AKIS_BROWSER=PASS"
      # Original Faust-S/iwxa checkout is deliberately excluded: the public runner token
      # lacks read permission (403). Its source parity is an independent owner-tool check.
      # Private site, generated HTML, logs and screenshots stay on the runner.
