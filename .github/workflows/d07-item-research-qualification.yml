name: D07 item-targeted external evidence qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d07-item-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-external-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact private D07 subject model
        uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod
          ref: 4321541e312aa0e4e33d362af1c8d34cb808a91b
          token: ${{ secrets.DOMEN }}
          path: subject
          persist-credentials: false
      - name: Checkout exact private D07 website
        uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: 089ea95fd63a1e6d2554a7cb21797cdaa75a2e41
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - name: Verify exact revisions and business logic parity
        run: |
          test "$(git -C subject rev-parse HEAD)" = "4321541e312aa0e4e33d362af1c8d34cb808a91b"
          test "$(git -C site rev-parse HEAD)" = "089ea95fd63a1e6d2554a7cb21797cdaa75a2e41"
          cmp subject/src/domain/service-external-gap-research.ts site/src/domain/service-external-gap-research.ts
          cmp subject/src/domain/service-professional-gap-inventory.ts site/src/domain/service-professional-gap-inventory.ts
          cmp subject/src/domain/service-subject-plumbing-a.ts site/src/domain/service-subject-plumbing-a.ts
          cmp subject/src/domain/service-subject-flooring-a.ts site/src/domain/service-subject-flooring-a.ts
          cmp subject/src/domain/service-original-corroboration.ts site/src/domain/service-original-corroboration.ts
          cmp subject/src/domain/service-professional-facet-coverage.ts site/src/domain/service-professional-facet-coverage.ts
          cmp subject/src/domain/service-subject-wallpaper-a.ts site/src/domain/service-subject-wallpaper-a.ts
          cmp subject/src/domain/service-subject-protocols.ts site/src/domain/service-subject-protocols.ts
          echo D07_ITEM_RESEARCH_PARITY=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"
      - name: Install frozen dependencies and validate test syntax
        working-directory: site
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/d07-item-install.log" 2>&1 || exit 1
          node --check scripts/d07-run-official-source-research.mjs
          node --check scripts/d07-original-source-fetch.mjs
          node --check scripts/d07-original-pdf-fetch.mjs
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq > /dev/null
            sudo apt-get install -y -qq poppler-utils > /dev/null
          fi
          echo D07_ITEM_POPPLER=PASS
          for t in scripts/tests/d07-external-gap-research.test.mjs scripts/tests/d07-original-source-fetch.test.mjs scripts/tests/d07-professional-gap-inventory.test.mjs scripts/tests/d07-original-corroboration.test.mjs scripts/tests/d07-professional-facet-coverage.test.mjs scripts/tests/d07-original-pdf-fetch.test.mjs scripts/tests/d07-mixed-original-sources.test.mjs scripts/tests/d07-wallpaper-professional-method.test.mjs; do node --check "$t"; done
          echo D07_ITEM_RESEARCH_INSTALL_AND_SYNTAX=PASS
      - name: Test independent per-operation evidence and anti-fabrication checks
        working-directory: site
        run: |
          node --import tsx --test scripts/tests/d07-external-gap-research.test.mjs scripts/tests/d07-professional-gap-inventory.test.mjs scripts/tests/d07-original-source-fetch.test.mjs scripts/tests/d07-original-corroboration.test.mjs scripts/tests/d07-professional-facet-coverage.test.mjs scripts/tests/d07-original-pdf-fetch.test.mjs scripts/tests/d07-mixed-original-sources.test.mjs scripts/tests/d07-wallpaper-professional-method.test.mjs scripts/tests/d07-plumbing-professional-method.test.mjs scripts/tests/d07-flooring-professional-method.test.mjs scripts/tests/d07-professional-preview.test.mjs scripts/tests/d07-methodology-top500.test.mjs > "$RUNNER_TEMP/d07-item-tests.log" 2>&1 || {
            echo D07_ITEM_RESEARCH_TESTS=FAIL
            grep -E '^not ok|^# (tests|pass|fail)|^[[:space:]]+(actual|expected|error):|D07_TOP500_CHILD_FAILURE:' "$RUNNER_TEMP/d07-item-tests.log" | tail -24 || true
            exit 1
          }
          echo D07_ITEM_RESEARCH_TESTS=PASS
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/d07-item-tests.log" | tail -4
      - name: Full-site TypeScript and TOP-500 generation
        working-directory: site
        run: |
          bun x tsc --noEmit > "$RUNNER_TEMP/d07-item-types.log" 2>&1 || {
            echo D07_ITEM_RESEARCH_TYPES=FAIL
            grep -oE 'TS[0-9]+' "$RUNNER_TEMP/d07-item-types.log" | sort | uniq -c | head -15 || true
            exit 1
          }
          echo D07_ITEM_RESEARCH_TYPES=PASS
          node --import tsx scripts/generate-d07-methodology-top500.mjs "$RUNNER_TEMP/d07-item-500" --as-of=2026-11-21 > "$RUNNER_TEMP/d07-item-generate.log" 2>&1 || {
            echo D07_ITEM_RESEARCH_GENERATION=FAIL
            grep -oE 'D07_[A-Z0-9_]+' "$RUNNER_TEMP/d07-item-generate.log" | tail -6 || true
            exit 1
          }
          echo D07_ITEM_RESEARCH_GENERATION=PASS
          node -e "const f=require('fs');const p=process.env.RUNNER_TEMP+'/d07-item-500/service-professional-finalization.top500.generated.json';const d=JSON.parse(f.readFileSync(p,'utf8'));if(d.counts.selected!==500||d.counts.independentlyApprovedMethodologies!==0)process.exit(1);console.log('D07_ITEM_RESEARCH_500_CANDIDATES=PASS')"
          node -e "const fs=require('fs');const base=process.env.RUNNER_TEMP+'/d07-item-500/';const data=JSON.parse(fs.readFileSync(base+'service-external-gap-research.top500.generated.json','utf8'));const facet=JSON.parse(fs.readFileSync(base+'service-operation-facet-research.top500.generated.json','utf8'));const methods=data.services.filter(x=>x.technologyResearchStage==='per-operation-original-facets').length;const tasks=facet.services.reduce((n,x)=>n+x.jobs.length,0);const legacy=data.services.reduce((n,x)=>n+x.itemGaps.length,0);console.log('D07_500_INDIVIDUAL_METHODOLOGIES='+methods);console.log('D07_500_TECHNOLOGY_REQUIRED='+(500-methods));console.log('D07_500_FACET_RESEARCH_TASKS='+tasks);console.log('D07_500_ORIGINAL_ITEM_GAPS='+legacy);if(methods!==87||tasks<1000||data.services.length!==500)process.exit(1)"
      - name: Live verify pinned mixed HTML and PDF originals by item
        working-directory: site
        env:
          D07_RECEIPT_DEST: ${{ runner.temp }}/d07-item-research-receipt.json
          D07_SOURCE_MANIFEST: scripts/research/d07-official-mixed-pilot.json
        run: |
          node --import tsx scripts/d07-run-official-source-research.mjs --require-live > "$RUNNER_TEMP/d07-item-live.log" 2>&1 || {
            echo D07_ITEM_LIVE_ORIGINALS=FAIL
            grep -E '^D07_(ORIGINAL|RESEARCH)' "$RUNNER_TEMP/d07-item-live.log" | tail -20 || true
            exit 1
          }
          echo D07_ITEM_LIVE_ORIGINALS=PASS
          grep -E '^D07_(ORIGINAL|RESEARCH)' "$RUNNER_TEMP/d07-item-live.log" | tail -20
          node -e "const f=require('fs');const x=JSON.parse(f.readFileSync(process.env.D07_RECEIPT_DEST,'utf8'));for(const r of x.receipts)console.log('D07_SOURCE_TEXT_SHA256='+r.sourceId+':'+r.textSha256);const n=x.research.reduce((s,r)=>s+r.individualTargetsSearched,0);console.log('D07_INDIVIDUAL_GAP_TARGETS='+n);if(n!==12||x.counts.approvedMethodologies!==0||x.counts.uniqueOriginalUrlsFetched!==8||x.counts.uniquePdfOriginalsFetched!==2||x.counts.verifiedExactPassages!==15||x.counts.corroboratedClaims!==14||x.counts.corroboratedOperations!==12||x.counts.sourceFacetAssignments!==14||x.counts.sourceFacetCompleteOperations!==0||x.counts.remainingRequiredFacetLinks<70||x.counts.sourceDriftRejections!==0||x.counts.foreignJurisdictionRejected!==1||x.corroborations.some(r=>r.methodContentComplete||r.methodologyApproved)||x.research.some(r=>!r.unresolvedItems.length))process.exit(1);console.log('D07_FOREIGN_GUIDANCE_JURISDICTION_CHECK='+x.counts.foreignJurisdictionRejected);console.log('D07_ITEM_RESEARCH_NO_FALSE_FINALIZATION=PASS')"
      # Private checkouts are ephemeral, no artifacts/source HTML/results uploaded.
