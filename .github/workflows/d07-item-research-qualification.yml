name: D07 item-targeted external evidence qualification
on:
  push:
    branches: [work/2026-11-02-pipeline-foundation]
    paths: [.github/workflows/d07-item-research-qualification.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d07-item-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-external-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact private D07 subject model
        uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod
          ref: 49e92a23ddd2622c60965928226c9354402c9049
          token: ${{ secrets.DOMEN }}
          path: subject
          persist-credentials: false
      - name: Checkout exact private D07 website
        uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: 1c437f1b53236d9982ab3e871bbf56f7b197662e
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - name: Verify exact revisions and business logic parity
        run: |
          test "$(git -C subject rev-parse HEAD)" = "49e92a23ddd2622c60965928226c9354402c9049"
          test "$(git -C site rev-parse HEAD)" = "1c437f1b53236d9982ab3e871bbf56f7b197662e"
          cmp subject/src/domain/service-external-gap-research.ts site/src/domain/service-external-gap-research.ts
          cmp subject/src/domain/service-professional-gap-inventory.ts site/src/domain/service-professional-gap-inventory.ts
          cmp subject/src/domain/service-subject-plumbing-a.ts site/src/domain/service-subject-plumbing-a.ts
          cmp subject/src/domain/service-subject-flooring-a.ts site/src/domain/service-subject-flooring-a.ts
          cmp subject/src/domain/service-original-corroboration.ts site/src/domain/service-original-corroboration.ts
          echo D07_ITEM_RESEARCH_PARITY=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"
      - name: Install frozen dependencies and validate test syntax
        working-directory: site
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/d07-item-install.log" 2>&1 || exit 1
          node --check scripts/d07-run-official-source-research.mjs
          node --check scripts/d07-original-source-fetch.mjs
          for t in scripts/tests/d07-external-gap-research.test.mjs scripts/tests/d07-original-source-fetch.test.mjs scripts/tests/d07-professional-gap-inventory.test.mjs scripts/tests/d07-original-corroboration.test.mjs; do node --check "$t"; done
          echo D07_ITEM_RESEARCH_INSTALL_AND_SYNTAX=PASS
      - name: Test independent per-operation evidence and anti-fabrication checks
        working-directory: site
        run: |
          node --import tsx --test scripts/tests/d07-external-gap-research.test.mjs scripts/tests/d07-professional-gap-inventory.test.mjs scripts/tests/d07-original-source-fetch.test.mjs scripts/tests/d07-original-corroboration.test.mjs scripts/tests/d07-plumbing-professional-method.test.mjs scripts/tests/d07-flooring-professional-method.test.mjs scripts/tests/d07-professional-preview.test.mjs scripts/tests/d07-methodology-top500.test.mjs > "$RUNNER_TEMP/d07-item-tests.log" 2>&1 || {
            echo D07_ITEM_RESEARCH_TESTS=FAIL
            grep -E '^not ok|^# (tests|pass|fail)|^[[:space:]]+(actual|expected|error):' "$RUNNER_TEMP/d07-item-tests.log" | tail -24 || true
            exit 1
          }
          echo D07_ITEM_RESEARCH_TESTS=PASS
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/d07-item-tests.log" | tail -4
      - name: Full-site TypeScript and TOP-500 generation
        working-directory: site
        run: |
          bun x tsc --noEmit > "$RUNNER_TEMP/d07-item-types.log" 2>&1 || {
            echo D07_ITEM_RESEARCH_TYPES=FAIL
            grep -oE 'TS[0-9]+' "$RUNNER_TEMP/d07-item-types.log" | sort | uniq -c | head -15 || true
            exit 1
          }
          echo D07_ITEM_RESEARCH_TYPES=PASS
          node --import tsx scripts/generate-d07-methodology-top500.mjs "$RUNNER_TEMP/d07-item-500" --as-of=2026-11-21 > "$RUNNER_TEMP/d07-item-generate.log" 2>&1 || {
            echo D07_ITEM_RESEARCH_GENERATION=FAIL
            grep -oE 'D07_[A-Z0-9_]+' "$RUNNER_TEMP/d07-item-generate.log" | tail -6 || true
            exit 1
          }
          echo D07_ITEM_RESEARCH_GENERATION=PASS
          node -e "const f=require('fs');const p=process.env.RUNNER_TEMP+'/d07-item-500/service-professional-finalization.top500.generated.json';const d=JSON.parse(f.readFileSync(p,'utf8'));if(d.counts.selected!==500||d.counts.independentlyApprovedMethodologies!==0)process.exit(1);console.log('D07_ITEM_RESEARCH_500_CANDIDATES=PASS')"
      - name: Live verify item-scoped original fragments
        working-directory: site
        env:
          D07_RECEIPT_DEST: ${{ runner.temp }}/d07-item-research-receipt.json
        run: |
          node --import tsx scripts/d07-run-official-source-research.mjs --require-live > "$RUNNER_TEMP/d07-item-live.log" 2>&1 || {
            echo D07_ITEM_LIVE_ORIGINALS=FAIL
            grep -E '^D07_(ORIGINAL|RESEARCH)' "$RUNNER_TEMP/d07-item-live.log" | tail -20 || true
            exit 1
          }
          echo D07_ITEM_LIVE_ORIGINALS=PASS
          grep -E '^D07_(ORIGINAL|RESEARCH)' "$RUNNER_TEMP/d07-item-live.log" | tail -20
          node -e "const f=require('fs');const x=JSON.parse(f.readFileSync(process.env.D07_RECEIPT_DEST,'utf8'));for(const r of x.receipts)console.log('D07_SOURCE_TEXT_SHA256='+r.sourceId+':'+r.textSha256);const n=x.research.reduce((s,r)=>s+r.individualTargetsSearched,0);console.log('D07_INDIVIDUAL_GAP_TARGETS='+n);if(n<8||x.counts.approvedMethodologies!==0||x.counts.uniqueOriginalUrlsFetched!==6||x.counts.corroboratedClaims!==9||x.counts.corroboratedOperations!==8||x.counts.sourceDriftRejections!==0||x.corroborations.some(r=>r.methodContentComplete||r.methodologyApproved)||x.research.some(r=>!r.unresolvedItems.length))process.exit(1);console.log('D07_FOREIGN_GUIDANCE_JURISDICTION_CHECK='+x.counts.foreignJurisdictionRejected);console.log('D07_ITEM_RESEARCH_NO_FALSE_FINALIZATION=PASS')"
      # Private checkouts are ephemeral, no artifacts/source HTML/results uploaded.
