# Deliberate retention after qualified internal navigation and exact external-only delta.
# No private Actions; no private artifacts or logs published.
name: d02-club-qualified-input-retention
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/once/d02-club-qualified-input-retention/**'
    paths:
      - '.github/ci-requests/d02-club-qualified-input-retention.json'

permissions:
  contents: read
  actions: read
concurrency:
  group: d02-personal-activity-full-refs/heads/work/2026-11-24-d02-personal-activity-qualification
  cancel-in-progress: false
jobs:
  retain:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Exact public qualification harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          path: qualification
      - name: Verify deliberate retention request before private access
        working-directory: qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/verify_once_request.py \
            --repository Faust-S/knowledge --workflow d02-club-qualified-input-retention \
            --profile external-reference-delta-and-final-retention \
            --revision site=c1b02ba9f2b65175be91faa6476fd8d079b62e1f \
            --revision qualified_site=8301f94aa86444bb3b70a4823dd79f0a15e4727a \
            --revision subject=76ed326b21392836f4ff0ed376baea7b3f555ac5 \
            --revision t2=e70de29b72b83e2546f7ab74b17572685a728c17 \
            --revision platform=326f725c44d69ac99f6b912241e9e8a6c3d716a5 \
            --revision bli=9f41447197251d41e69fbcb98e52ef1050754ec2
      - name: Verify exact previous functional and navigation evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Faust-S/knowledge/actions/runs/45694601972 > "$RUNNER_TEMP/previous-run.json"
          jq -e '.status == "completed" and .conclusion == "failure" and .head_sha == "dabb94491b8ed6ad792649a3533295783e73b7cf"' "$RUNNER_TEMP/previous-run.json" >/dev/null
          gh api repos/Faust-S/knowledge/actions/jobs/139488593591/logs > "$RUNNER_TEMP/previous-evidence.log"
          python3 - "$RUNNER_TEMP/previous-evidence.log" <<'PY'
          import json, re, sys
          from pathlib import Path
          body = re.sub(r'\x1b\[[0-9;]*m', '', Path(sys.argv[1]).read_text(encoding='utf-8'))
          def evidence(prefix):
              return [line.split('Z ', 1)[1] for line in body.splitlines()
                      if 'Z ' in line and line.split('Z ', 1)[1].startswith(prefix)]
          def need(condition):
              if not condition:
                  raise SystemExit('D02_PREVIOUS_FUNCTIONAL_EVIDENCE=FAIL')
          summaries = evidence('CLUB_NAV_SUMMARY ')
          need(len(summaries) == 1)
          row = json.loads(summaries[0][len('CLUB_NAV_SUMMARY '):])
          expected = {'pageInventory':90, 'pageLoads':4636, 'internalClicked':1922, 'failures':0,
                      'notRun':0, 'guardedExport':4, 'assistantSkills':44,
                      'firstStepTools':36, 'firstStepPlans':36, 'externalBroken':1,
                      'externalUnverified':3}
          need(all(row.get(k) == v for k, v in expected.items()))
          need(evidence('CLUB_DIST_FUNCTIONAL_ROUNDTRIP=') == ['CLUB_DIST_FUNCTIONAL_ROUNDTRIP=PASS'])
          need(evidence('D02_T3_COMPLETE_CLUB_SUITES=') == ['D02_T3_COMPLETE_CLUB_SUITES=98; failed=0'])
          need(evidence('D02_T3_COMPLETE_CLUB_TESTS=') == ['D02_T3_COMPLETE_CLUB_TESTS=929'])
          need(evidence('D02_NAVIGATION_AUDIT_EXIT=') == ['D02_NAVIGATION_AUDIT_EXIT=1; D02_ROUNDTRIP_EXIT=0'])
          need(evidence('CLUB_HOSTING_ARCHIVE_VERIFIED=PASS entries=286 '))
          need(not evidence('CLUB_NAV_FAILURE '))
          print('D02_PREVIOUS_FUNCTIONAL_EVIDENCE=PASS; internal_failures=0; site_tests=929')
          PY
      - name: Confirm exact precreated private retention destination
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
          GIT_TERMINAL_PROMPT: '0'
        shell: bash
        run: |
          set -euo pipefail
          [ "$(gh api repos/Faust-S/club.iwxa.ru --jq '.private' 2> "$RUNNER_TEMP/private-ref-check.log")" = true ]
          [ "$(gh api repos/Faust-S/club.iwxa.ru/git/ref/heads/work/2026-11-25-club-t3-final-qualified-inputs --jq '.object.sha' 2>> "$RUNNER_TEMP/private-ref-check.log")" = "c1b02ba9f2b65175be91faa6476fd8d079b62e1f" ]
          echo D02_RETENTION_PRIVATE_REF_AT_QUALIFIED_SOURCE=PASS
      - name: Preserve original Git LF bytes
        run: git config --global core.autocrlf false
      - name: Checkout exact public T3 platform candidate
        uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 326f725c44d69ac99f6b912241e9e8a6c3d716a5
          persist-credentials: false
          path: one-core
      - name: Checkout exact private Club candidate
        uses: actions/checkout@v4
        with:
          repository: Faust-S/club.iwxa.ru
          ref: c1b02ba9f2b65175be91faa6476fd8d079b62e1f
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          fetch-depth: 3
          path: site
      - name: Checkout original T2 for one-time migration qualification only
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: e70de29b72b83e2546f7ab74b17572685a728c17
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: t2
      - name: Checkout original private BLI domain-assistant candidate
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 9f41447197251d41e69fbcb98e52ef1050754ec2
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: bli-owner
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Prove the only deployable source changes are two reviewed reference anchors
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          if ! node --input-type=module > "$RUNNER_TEMP/private-reference-delta.log" 2>&1 <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const base='8301f94aa86444bb3b70a4823dd79f0a15e4727a';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'});
          const rows=git('diff','--no-renames','--name-status',base,'HEAD').trim().split('\n').sort();
          const docs='handoff/D02_CLUB_FINAL_RELEASE_QUALIFICATION_2026_11_25_RU.md';
          const changes=[
            ['publications/warehouse-shifts/index.html','scripts/test-club-case-04-article.mjs',
             '<a href="https://www.nalog.gov.ru/nu/">ФНС: НДФЛ и налоговые пороги</a>',
             '<a href="https://www.consultant.ru/document/cons_doc_LAW_28165/3e4bbd6dd9fb5dd4e9394f447653506e1d6fa3a9/">НК РФ, статья 224: ставки НДФЛ</a>',
             'warehouse tax reference cites the actual rates and thresholds'],
            ['publications/cleaning-work-income/index.html','scripts/test-club-case-06-article.mjs',
             '<a href="https://www.nalog.gov.ru/rn77/taxation/taxes/npd/">ФНС: применение НПД и ставки</a>',
             '<a href="https://www.consultant.ru/document/cons_doc_LAW_311977/e08381c7bc85397c1661bdeaa62be996df822d6e/">Закон № 422-ФЗ, статья 10: ставки НПД</a>',
             'cleaning case links directly to the underlying NPD rates']
          ];
          assert.deepEqual(rows,[docs,...changes.flatMap(r=>r.slice(0,2))].map(p=>'M\t'+p).sort());
          assert.ok(readFileSync(docs,'utf8').startsWith(git('show',base+':'+docs).trimEnd()));
          for(const [page,test,old,next,name] of changes){
            const before=git('show',base+':'+page);
            assert.equal(before.split(old).length,2);
            assert.equal(readFileSync(page,'utf8'),before.replace(old,next));
            const oldTest=git('show',base+':'+test);
            const add='\ntest('+JSON.stringify(name)+',()=>{\n assert.ok(html.includes('+JSON.stringify(next)+'));\n assert.ok(!html.includes('+JSON.stringify(old)+'));\n});\n';
            assert.equal(readFileSync(test,'utf8'),oldTest.trimEnd()+'\n'+add);
          }
          NODE
          then echo D02_REFERENCE_ONLY_DELTA=FAIL; exit 1; fi
          echo D02_REFERENCE_ONLY_DELTA=PASS
      - name: Download and verify exact public portable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Faust-S/knowledge/actions/artifacts/14920233669/zip > "$RUNNER_TEMP/t3-platform-outer.zip"
          echo "96bb993383af31309b79dceb6f321ac5365ac7777362f512f9225226ee51904f  $RUNNER_TEMP/t3-platform-outer.zip" | sha256sum --check --status
          unzip -p "$RUNNER_TEMP/t3-platform-outer.zip" platform-inputs.zip > "$RUNNER_TEMP/t3-platform.zip"
          echo "b778474d011b34a77cd60b945f02295fb24654c833f3ab12ff36bd3c0bdd8863  $RUNNER_TEMP/t3-platform.zip" | sha256sum --check --status
          echo D02_T3_PUBLIC_RELEASE_ARCHIVE=PASS
      - name: Compile existing Club module into exact original T3 Host candidate
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          if ! npm run t3:host:prepare -- "$GITHUB_WORKSPACE/one-core/packages/t3-core" "$RUNNER_TEMP/club-t3-host" "$RUNNER_TEMP/t3-platform.zip" "$GITHUB_WORKSPACE/bli-owner" > "$RUNNER_TEMP/private-build.log" 2>&1; then
            echo D02_T3_HOST_SOURCE_BUILD=FAIL
            grep -Eo 'CLUB_T3_(HOST|PLATFORM)_[A-Z0-9_]+|T2_EXTERNAL_MODULE_[A-Z_]+|T2_ACTIVE_RUNTIME_CONTRACT_HOLD|TS[0-9]{4}' "$RUNNER_TEMP/private-build.log" | sort -u | head -15 || true
            # Expose only compile diagnostics coordinates and a fixed category,
            # not private source, actual values, paths outside the stage or logs.
            node --input-type=module - "$RUNNER_TEMP/private-build.log" <<'NODE'
          import {readFileSync} from 'node:fs';
          const lines=readFileSync(process.argv[2],'utf8').split(/\r?\n/);
          const pattern=/^(src\/modules\/club\/[A-Za-z0-9_./-]+\.(?:ts|tsx|mts))\((\d+),(\d+)\): error (TS\d+):/;
          const publicPattern=/^(src\/[A-Za-z0-9_./-]+\.(?:ts|tsx|mts))\((\d+),(\d+)\): error (TS\d+):/;
          const hits=[];
          for(const line of lines){
            const m=line.match(pattern)||line.match(publicPattern);
            if(!m)continue;
            // Coordinates refer only to files already known to their owner.
            // No message text or private file contents is emitted.
            hits.push('D02_T3_DIAGNOSTIC='+m[4]+' '+m[1]+':'+m[2]+':'+m[3]);
          }
          for(const row of [...new Set(hits)].slice(0,120))console.log(row);
          console.log('D02_T3_DIAGNOSTICS_COUNT='+hits.length);
          NODE
            exit 1
          fi
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(p.schema!=="IWXA_CLUB_COMPILED_HOST_INPUT/1"||p.moduleId!=="iwxa.domain.club"||p.state!=="SOURCE_BUILD_NOT_PRODUCT_ACCEPTED"||p.sourceCommit!=="326f725c44d69ac99f6b912241e9e8a6c3d716a5")process.exit(1);console.log("D02_T3_HOST_SOURCE_BUILD=PASS; files="+p.files.length+"; module_source_files="+p.moduleSourceFiles.length)' "$RUNNER_TEMP/club-t3-host/club-t3-host-input.json"
          node --input-type=module - "$RUNNER_TEMP/club-t3-host/club-t3-host-input.json" <<'NODE'
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync(process.argv[2],'utf8'));
          if(p.assistant?.sourceCommit!=='9f41447197251d41e69fbcb98e52ef1050754ec2'||
             p.assistant.webllm!=='0.2.87'||!p.assistant.sharedEngine||!p.assistant.entry||
             p.files.filter(x=>/^assets\/model-worker-[A-Za-z0-9_-]+\.js$/.test(x.path)).length!==1)process.exit(1);
          console.log('D02_T3_ORIGINAL_DOMAIN_ASSISTANT_SHARED_ENGINE=PASS; workers=1');
          NODE
          echo D02_T3_DOMAIN_ACCEPTED=false
      - name: Prepare original Kernel support from unchanged source
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
          IWXA_T2_NPM_CACHE_DIR: ${{ runner.temp }}/club-npm-cache
        shell: bash
        run: |
          set -euo pipefail
          if ! (npm ci --no-audit --no-fund && npm run build && npm run t3:kernel-support:prepare -- "$GITHUB_WORKSPACE/site/dist" "$GITHUB_WORKSPACE/t2" "$RUNNER_TEMP/club-kernel-support") > "$RUNNER_TEMP/private-retention-build.log" 2>&1; then
            echo D02_RETENTION_ORIGINAL_SUPPORT=FAIL
            grep -Eo 'CLUB_(T2|T3)_[A-Z0-9_]+' "$RUNNER_TEMP/private-retention-build.log" | sort -u | head -20 || true
            exit 1
          fi
          echo D02_RETENTION_ORIGINAL_SUPPORT=PASS
      - name: Run only the changed article regressions
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          if ! node --test scripts/test-club-case-04-article.mjs scripts/test-club-case-06-article.mjs > "$RUNNER_TEMP/private-reference-tests.log" 2>&1; then
            echo D02_REFERENCE_ARTICLE_REGRESSION=FAIL
            grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/private-reference-tests.log" || true
            exit 1
          fi
          grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/private-reference-tests.log"
          echo D02_REFERENCE_ARTICLE_REGRESSION=PASS
      - name: Retain qualified local build inputs only in private Club candidate branch
        working-directory: site
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          # Do not upload the domain dist or generated private files to public Actions.
          # Use the existing scoped credential only if the intended repository is private
          # and the credential already grants push. Only fast-forward the isolated target.
          [ "$(gh api repos/Faust-S/club.iwxa.ru --jq '.private')" = true ]
          [ "$(git rev-parse HEAD)" = "c1b02ba9f2b65175be91faa6476fd8d079b62e1f" ]
          case "$(git remote get-url origin)" in
            https://github.com/Faust-S/club.iwxa.ru|https://github.com/Faust-S/club.iwxa.ru.git) ;;
            *) echo D02_T3_PRIVATE_RETENTION_REMOTE=FAIL; exit 1 ;;
          esac
          git diff --exit-code --quiet
          if ! node scripts/retain-club-t3-inputs.mjs "$RUNNER_TEMP/club-t3-host" "$RUNNER_TEMP/club-kernel-support" "$RUNNER_TEMP/t3-platform.zip" > "$RUNNER_TEMP/private-retain.log" 2>&1; then
            echo D02_T3_PRIVATE_RETENTION_PREPARE=FAIL; exit 1
          fi
          # Verify the actual no-argument hosting assembly from retained inputs
          # before committing those inputs. No repeat browser or domain suite.
          if ! (node scripts/build-club-t3-hosting.mjs && node scripts/check-links.mjs) > "$RUNNER_TEMP/private-final-hosting.log" 2>&1; then
            echo D02_FINAL_HOSTING_BUILD=FAIL
            exit 1
          fi
          (cd release && sha256sum --check --status CLUB_HOSTING_STATIC.zip.sha256)
          unzip -tq release/CLUB_HOSTING_STATIC.zip > "$RUNNER_TEMP/private-final-zip.log"
          [ "$(zipinfo -1 release/CLUB_HOSTING_STATIC.zip | wc -l)" = 286 ]
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const zip='release/CLUB_HOSTING_STATIC.zip';
          const expected=[
            ['publications/warehouse-shifts/index.html','https://www.consultant.ru/document/cons_doc_LAW_28165/3e4bbd6dd9fb5dd4e9394f447653506e1d6fa3a9/','https://www.nalog.gov.ru/nu/'],
            ['publications/cleaning-work-income/index.html','https://www.consultant.ru/document/cons_doc_LAW_311977/e08381c7bc85397c1661bdeaa62be996df822d6e/','https://www.nalog.gov.ru/rn77/taxation/taxes/npd/']
          ];
          for(const [page,next,old] of expected){
            const bytes=readFileSync('dist/'+page);
            const packed=execFileSync('unzip',['-p',zip,page]);
            assert.ok(bytes.equals(packed));
            const html=bytes.toString('utf8');
            assert.ok(html.includes('href="'+next+'"')&&!html.includes('href="'+old+'"'));
          }
          console.log('D02_FINAL_REFERENCE_ARCHIVE=PASS; changed_pages=2; archive_entries=286');
          NODE
          echo D02_FINAL_HOSTING_BUILD=PASS
          target=refs/heads/work/2026-11-25-club-t3-final-qualified-inputs
          root=runtime/t3-platform/0.3.1-rc.1
          git add -- "$root/club-host" "$root/kernel-support" "$root/platform-inputs.zip"
          # Limit the new private commit to the original retained build inputs.
          # Abort before push if an unexpected path, secret-like file, symlink,
          # oversized Git file, or non-addition appears.
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {lstatSync} from 'node:fs';
          const base='runtime/t3-platform/0.3.1-rc.1/';
          const rows=execFileSync('git',['diff','--cached','--name-status','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          assert.ok(rows.length>0&&rows.length%2===0,'empty or invalid retained inputs');
          const roots=new Set();
          for(let i=0;i<rows.length;i+=2){
            const p=rows[i+1],name=p.slice(base.length),top=name.split('/')[0];
            assert.equal(rows[i],'A');
            assert.ok(p.startsWith(base)&&['club-host','kernel-support','platform-inputs.zip'].includes(top));
            assert.ok(!p.split('/').some(x=>/^\.env|^\.git$|^node_modules$|^\.npmrc$|^\.ssh$/.test(x)));
            assert.ok(!/\.(?:map|log|iwxa|pem|key|pfx|gguf|safetensors)$/i.test(p));
            const stat=lstatSync(p);assert.ok(stat.isFile()&&!stat.isSymbolicLink()&&stat.size<=95*1024*1024);
            roots.add(top);
          }
          assert.equal(roots.size,3);
          console.log('D02_T3_PRIVATE_RETENTION_INPUTS_READY=PASS; files='+rows.length/2);
          NODE
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Retain qualified Club T3 local inputs for run $GITHUB_RUN_ID [skip ci]" > "$RUNNER_TEMP/private-retain-commit.log" 2>&1
          # The authorized connector created the isolated branch at the qualified source.
          # Verify the exact parent and use an ordinary non-force fast-forward.
          [ "$(gh api repos/Faust-S/club.iwxa.ru/git/ref/heads/work/2026-11-25-club-t3-final-qualified-inputs --jq '.object.sha')" = "c1b02ba9f2b65175be91faa6476fd8d079b62e1f" ]
          [ "$(git rev-parse HEAD^)" = "c1b02ba9f2b65175be91faa6476fd8d079b62e1f" ]
          # Explicitly use gh's standard credential setup, local to this disposable checkout.
          gh auth setup-git --hostname github.com > "$RUNNER_TEMP/private-retain-credential.log" 2>&1
          if ! git push --porcelain origin "HEAD:$target" > "$RUNNER_TEMP/private-retain-push.log" 2>&1; then
            if grep -Eqi '403|permission|denied|not authorized|not accessible' "$RUNNER_TEMP/private-retain-push.log"; then
              echo D02_RETENTION_PUSH_ACCESS=DENIED
            elif grep -Eqi 'non-fast-forward|fetch first|stale info' "$RUNNER_TEMP/private-retain-push.log"; then
              echo D02_RETENTION_PUSH_CONFLICT=FAIL
            elif grep -Eqi 'protected branch|repository rule|GH013|GH006' "$RUNNER_TEMP/private-retain-push.log"; then
              echo D02_RETENTION_PUSH_RULE=REJECTED
            elif grep -Eqi 'could not read Username|Authentication failed|terminal prompts disabled' "$RUNNER_TEMP/private-retain-push.log"; then
              echo D02_RETENTION_PUSH_AUTH=FAIL
            else
              echo D02_RETENTION_PUSH_OTHER=FAIL
            fi
            exit 1
          fi
          [ "$(gh api repos/Faust-S/club.iwxa.ru/git/ref/heads/work/2026-11-25-club-t3-final-qualified-inputs --jq '.object.sha')" = "$(git rev-parse HEAD)" ]
          echo "D02_T3_QUALIFIED_INPUT_COMMIT=$(git rev-parse HEAD)"
          echo D02_T3_PRIVATE_RETENTION=PASS
      - name: Check the two corrected external references separately from retention
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const refs=[
            ['NDFL_224','https://www.consultant.ru/document/cons_doc_LAW_28165/3e4bbd6dd9fb5dd4e9394f447653506e1d6fa3a9/',/Статья\s+224/i],
            ['NPD_422_10','https://www.consultant.ru/document/cons_doc_LAW_311977/e08381c7bc85397c1661bdeaa62be996df822d6e/',/Статья\s+10/i]
          ];
          let broken=0,partial=0;
          for(const [id,url,pattern] of refs){
            try{
              const r=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(20000),headers:{'user-agent':'Club-IWXA-Link-Check/1.0','accept':'text/html'}});
              if(r.status===404||r.status===410){broken++;console.log('D02_FINAL_EXTERNAL='+id+'; BROKEN; HTTP='+r.status);await r.body?.cancel();continue}
              if(!r.ok){partial++;console.log('D02_FINAL_EXTERNAL='+id+'; UNVERIFIED; HTTP='+r.status);await r.body?.cancel();continue}
              const body=await r.text();
              if(!pattern.test(body)){partial++;console.log('D02_FINAL_EXTERNAL='+id+'; UNVERIFIED_CONTENT');continue}
              console.log('D02_FINAL_EXTERNAL='+id+'; PASS');
            }catch{partial++;console.log('D02_FINAL_EXTERNAL='+id+'; UNVERIFIED_NETWORK')}
          }
          console.log('D02_FINAL_EXTERNAL_REFERENCES='+(broken?'FAIL':partial?'PARTIAL':'PASS'));
          if(broken)process.exitCode=1;
          NODE
      - name: Remove private generated outputs and private logs
        if: always()
