name: Admin Center 0.4.1 original applied Result reuse source proof
on:
  push:
    branches:
      - work/2026-11-24-admin-center-041-reuse-original-proof
    paths:
      - .github/workflows/admin-center-041-original-applied-reuse-proof.yml
      - packages/t3-core/tests/admin-center-original-applied-reuse.browser.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin-center-original-reuse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-signed-result-real-t2:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin original public One Core and qualified T2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((& git rev-parse 'HEAD:packages/t3-core/src').Trim() -cne '7cc22a3540fc26e5a2d29ee0f654e2bf9f2cff0c' -or
             (& git rev-parse 'HEAD:packages/t3-core/qualified-runtime').Trim() -cne '1594274dbf5e38214b8422ba11e8c7114bd5425c'){
            throw 'CENTER_REUSE_ONE_CORE_OR_T2_PIN_CHANGED'
          }
      - name: Stage exact original private T3 transiently
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 790c9dd270a2e7a11aead6a9ee7666c6d7b677fc
          token: ${{ secrets.T3 || secrets.DOMEN }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            access-control
            interop
            reconciliation
            package.json
          path: .private/t3
      - name: Stage exact public Center read-only reuse adapter
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: acdcf7cdc1b41a28cf134bf58592097c45778b3a
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            runtime
            package.json
          path: .private/center
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Prepare original runtime and existing source qualification tooling
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((& git -C .private/t3 rev-parse HEAD).Trim() -cne '790c9dd270a2e7a11aead6a9ee7666c6d7b677fc' -or
             (& git -C .private/center rev-parse HEAD).Trim() -cne 'acdcf7cdc1b41a28cf134bf58592097c45778b3a'){
            throw 'CENTER_REUSE_EXACT_SOURCE_PIN_CHANGED'
          }
          & node --check packages/t3-core/tests/admin-center-original-applied-reuse.browser.mjs
          if($LASTEXITCODE -ne 0){throw 'CENTER_REUSE_PUBLIC_TEST_SYNTAX_FAILED'}
          & npm ci --prefix packages/t3-core --ignore-scripts --no-audit --no-fund *> $null
          if($LASTEXITCODE -ne 0){throw 'CENTER_REUSE_ORIGINAL_HARNESS_DEPS_FAILED'}
          $openssl=Get-Command openssl -ErrorAction SilentlyContinue
          if(!$openssl){
            $gitOpenSSL='C:/Program Files/Git/usr/bin'
            if(!(Test-Path (Join-Path $gitOpenSSL 'openssl.exe'))){throw 'CENTER_REUSE_LOOPBACK_TLS_UNAVAILABLE'}
            $gitOpenSSL | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          }
          $q=Join-Path $env:RUNNER_TEMP 'center-original-reuse-qualified-t2'
          Expand-Archive -LiteralPath 'packages/t3-core/qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip' -DestinationPath $q -Force
          if(!(Test-Path -LiteralPath (Join-Path $q '_iwxa/runtime/0.3.6/runtime.js'))){throw 'CENTER_REUSE_ORIGINAL_T2_MISSING'}
          "CENTER_REUSE_ORIGINAL_T2=$q" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'CENTER_REUSE_THREE_ORIGINAL_INPUTS_PINNED_PASS'
      - name: Real signed Result, actual original T2 Object and Event, cold reuse, continued signed Task
        shell: pwsh
        timeout-minutes: 7
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'center-original-reuse-private.log'
          & node packages/t3-core/tests/admin-center-original-applied-reuse.browser.mjs '.private/t3' '.private/center' $env:CENTER_REUSE_ORIGINAL_T2 *> $log
          $status=$LASTEXITCODE
          $markers=@()
          foreach($line in (Get-Content -LiteralPath $log -ErrorAction SilentlyContinue)){
            $clean=([string]$line).Trim()
            if($clean -match '^CENTER_ORIGINAL_(?:REUSE_[A-Z0-9_]+_PASS|APPLIED_REUSE_SOURCE_QUALIFICATION_PASS|REUSE_FAILURE_(?:PHASE|CODE) [A-Z][A-Z0-9_]{3,99})$'){
              $markers+=$clean
              Write-Host $clean
            }
          }
          if($status -ne 0 -or $markers -notcontains 'CENTER_ORIGINAL_APPLIED_REUSE_SOURCE_QUALIFICATION_PASS'){
            throw 'CENTER_ORIGINAL_APPLIED_REUSE_SOURCE_QUALIFICATION_HOLD'
          }
      - name: Destroy original source, test data, and private logs
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.private' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'center-original-reuse-private.log') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'center-original-reuse-qualified-t2') -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host 'CENTER_REUSE_NO_PRIVATE_SOURCE_OR_TEST_DATA_ARTIFACTS'
