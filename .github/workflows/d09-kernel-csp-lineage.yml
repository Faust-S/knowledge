name: D09 Kernel CSP source lineage and codegen probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout accepted T2 source authority
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: 2d50a50b1a5ffda3395046da146efad3636732d1
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          sparse-checkout: |
            t2/current/final-successor/canonical-source
            t2/current/final-successor/canonical-source-inputs/k035-rc20
            t2/current/final-successor/kernel-successors/k036-atomic-graph
            t2/current/final-successor/kernel-successors/k036-same-store-event-history-20261019
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recover the exact accepted predecessor before modifying anything
        shell: bash
        run: |
          root="$GITHUB_WORKSPACE"
          core="$root/t2/current/final-successor/canonical-source"
          node "$core/scripts/materialize-k035-atomic-graph-successor.mjs" \
            "$root/t2/current/final-successor/canonical-source-inputs/k035-rc20/SOURCE_AUTHORITY.json" \
            "$root" "$RUNNER_TEMP/d09-k035" > "$RUNNER_TEMP/k035-materialize.json" 2>&1 || {
            echo D09_K035_EXACT_RECOVERY=FAIL
            grep -oE 'K035_[A-Z0-9_]+|Error: [A-Z0-9_]+' "$RUNNER_TEMP/k035-materialize.json" | tail -6 || true
            exit 1
          }
          echo D09_K035_EXACT_RECOVERY=PASS
          node "$core/scripts/materialize-k036-atomic-graph-qualified.mjs" \
            "$RUNNER_TEMP/d09-k035" "$RUNNER_TEMP/d09-k036" > "$RUNNER_TEMP/k036-materialize.json" 2>&1 || {
            echo D09_K036_EXACT_RECOVERY=FAIL
            grep -oE '[A-Z0-9_]+_MISMATCH|Error: [A-Z0-9_]+' "$RUNNER_TEMP/k036-materialize.json" | tail -6 || true
            exit 1
          }
          echo D09_K036_EXACT_RECOVERY=PASS
          node "$core/scripts/create-k036-import-time-candidate.mjs" "$RUNNER_TEMP/d09-k036" "$RUNNER_TEMP/d09-k036-timestamp" > "$RUNNER_TEMP/d09-timestamp-rebuild.log" 2>&1 || {
            echo D09_DB8_TIMESTAMP_RECOVERY=FAIL; exit 1;
          }
          node "$core/scripts/create-k036-same-store-history-candidate.mjs" "$RUNNER_TEMP/d09-k036-timestamp" "$RUNNER_TEMP/d09-k036-same-store" > "$RUNNER_TEMP/d09-db8-rebuild.log" 2>&1 || {
            echo D09_DB8_SAME_STORE_RECOVERY=FAIL; exit 1;
          }
          echo D09_DB8_EXACT_LINEAGE=PASS
      - name: Check the restored Kernel's AJV call shapes
        shell: bash
        run: |
          cd "$RUNNER_TEMP/d09-k036-same-store"
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-k036-npm.log" 2>&1 || {
            echo D09_K036_SOURCE_NPM=FAIL
            grep -oE 'npm ERR! [A-Z0-9_:-]+' "$RUNNER_TEMP/d09-k036-npm.log" | tail -6 || true
            exit 1
          }
          echo D09_K036_SOURCE_NPM=PASS
          node "$GITHUB_WORKSPACE/t2/current/final-successor/canonical-source/scripts/issue14-kernel-ajv-structure.mjs" "$RUNNER_TEMP/d09-k036-same-store"
      - name: Analyze source and exact qualified package without publishing source
        shell: bash
        run: |
          node --input-type=module - "$RUNNER_TEMP/d09-k036-same-store" <<'NODE'
          import {readFileSync,readdirSync,statSync} from "node:fs";
          import {join,relative} from "node:path";
          const root=process.argv[2], all=[];
          function walk(dir) {for(const name of readdirSync(dir)) {
            const p=join(dir,name),st=statSync(p);
            if(st.isDirectory() && name!=="node_modules")walk(p);
            else if(st.isFile()&&/\.(?:ts|tsx|mjs|js)$/.test(name))all.push(p);
          }}
          walk(root);
          const patterns=[
            ["AJV_IMPORT",/from\s+["']ajv(?:\/[^"']+)?["']/g],
            ["AJV_NEW",/\bnew\s+Ajv(?:2020|2019)?\s*\(/g],
            ["AJV_COMPILE",/\b(?:ajv|validator|Ajv)\s*\.\s*compile(?:Async)?\s*\(/g],
            ["EVAL",/\beval\s*\(/g],
            ["NEW_FUNCTION",/\bnew\s+Function\s*\(/g],
            ["ESBUILD",/esbuild/g],
            ["STANDALONE",/standaloneCode/g],
          ];
          const summary={scannedSourceFiles:all.length,features:[]};
          for(const [name,regex] of patterns) {
            const records=[];
            for(const file of all) {
              const s=readFileSync(file,"utf8");
              const hits=[...s.matchAll(regex)].length;
              if(hits)records.push({group:relative(root,file).split("/").slice(0,2).join("/"),count:hits});
            }
            if(records.length)summary.features.push({name,total:records.reduce((n,x)=>n+x.count,0),
              byGroup:Object.entries(Object.groupBy(records,x=>x.group)).map(([group,rows])=>({group,files:rows.length,hits:rows.reduce((n,x)=>n+x.count,0)}))});
          }
          const pkg=JSON.parse(readFileSync(join(root,"package.json"),"utf8"));
          summary.buildScripts=Object.keys(pkg.scripts??{}).filter(x=>/build|validate|test:built|contract|check:generated/.test(x));
          summary.hasAjv=pkg.dependencies?.ajv!==undefined || pkg.devDependencies?.ajv!==undefined;
          console.log("D09_KERNEL_SOURCE_CODEGEN="+JSON.stringify(summary));
          NODE
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          p=Path("t2/current/final-successor/kernel-successors/k036-same-store-event-history-20261019/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip")
          with ZipFile(p) as z:
              names=z.namelist()
              groups={"runtime":0,"source":0,"manifest":0,"other":0}
              for name in names:
                  if name.endswith("/"):continue
                  if name.endswith("/runtime.js"): groups["runtime"]+=1
                  elif "/src/" in name or name.startswith("src/"):groups["source"]+=1
                  elif name.endswith(".json"):groups["manifest"]+=1
                  else:groups["other"]+=1
              print("D09_QUALIFIED_KERNEL_ARCHIVE_CONTENTS="+str(groups))
          PY
      - name: Build and typecheck a disposable Kernel with CSP-safe startup schemas
        shell: bash
        run: |
          core="$GITHUB_WORKSPACE/t2/current/final-successor/canonical-source"
          cd "$RUNNER_TEMP/d09-k036-same-store"
          node "$core/scripts/issue14-generate-kernel-static-validators.mjs" "$RUNNER_TEMP/d09-k036-same-store" \
            > "$RUNNER_TEMP/d09-static-generate.log" 2>&1 || {
            echo D09_K036_CSP_STATIC_GENERATION=FAIL
            grep -oE 'CSP_STATIC_[A-Z0-9_]+|D09_KERNEL_[A-Z0-9_]+|Error: [A-Z0-9_]+' "$RUNNER_TEMP/d09-static-generate.log" | tail -8 || true
            node --input-type=module - "$RUNNER_TEMP/d09-static-generate.log" <<'NODE'
          import {readFileSync} from "node:fs";
          const lines=readFileSync(process.argv[2],"utf8").split("\n");
          const candidate=lines.find(x=>/^\s*(?:Error|TypeError|SyntaxError|ReferenceError|TransformError|✘ \[ERROR\]):/.test(x))??lines.find(x=>/Error:/i.test(x))??"UNKNOWN";
          const sanitize=x=>x.trim().slice(0,180)
            .replace(/\/[^\s():'"]+/g,"[private-path]")
            .replace(/["'][^"']{8,}["']/g,"[private-value]");
          console.log("D09_K036_CSP_STATIC_FAILURE_SIGNATURE="+sanitize(candidate));
          NODE
            exit 1
          }
          echo D09_K036_CSP_STATIC_GENERATION=PASS
          grep 'D09_KERNEL_CSP_STATIC_GENERATED=' "$RUNNER_TEMP/d09-static-generate.log" || true
          npm run typecheck > "$RUNNER_TEMP/d09-static-typecheck.log" 2>&1 || {
            echo D09_K036_CSP_STATIC_TYPES=FAIL
            grep -oE 'error TS[0-9]+' "$RUNNER_TEMP/d09-static-typecheck.log" | sort -u | tail -15 || true
            node --input-type=module - "$RUNNER_TEMP/d09-static-typecheck.log" <<'NODE'
          import {readFileSync} from "node:fs";
          const lines=readFileSync(process.argv[2],"utf8").split("\n");
          const relevant=lines.filter(x=>/error TS[0-9]+|ERR_|Error:|npm error|failed|Cannot|Invalid/.test(x)).slice(-9);
          for(const row of relevant){
            const safe=row.trim().slice(0,210)
             .replace(/\/[^\s:()]+/g,"[private-path]")
             .replace(/["'][^"']{8,}["']/g,"[private-value]");
            console.log("D09_K036_TYPECHECK_SIGNATURE="+safe);
          }
          NODE
            exit 1
          }
          echo D09_K036_CSP_STATIC_TYPES=PASS
          npm run build > "$RUNNER_TEMP/d09-static-build.log" 2>&1 || {
            echo D09_K036_CSP_STATIC_BUILD=FAIL
            grep -oE 'Error: [A-Z0-9_]+|error [A-Z0-9_]+|Could not resolve|failed to build|Build failed' "$RUNNER_TEMP/d09-static-build.log" | tail -12 || true
            exit 1
          }
          echo D09_K036_CSP_STATIC_BUILD=PASS
          test -f dist/_iwxa/runtime/0.3.6/runtime.js || {
            echo D09_K036_CSP_STATIC_RUNTIME=FAIL; exit 1;
          }
          echo D09_K036_CSP_STATIC_RUNTIME=BUILT_UNQUALIFIED
          npm run test:built > "$RUNNER_TEMP/d09-k036-built-tests.log" 2>&1 || {
            echo D09_K036_CSP_STATIC_BUILT_TESTS=FAIL
            grep -oE 'FAIL [A-Za-z0-9_.-]+|Tests?[[:space:]]+[0-9]+ failed|Error: [A-Z0-9_]+' "$RUNNER_TEMP/d09-k036-built-tests.log" | tail -10 || true
            exit 1
          }
          echo D09_K036_CSP_STATIC_BUILT_TESTS=PASS
      - name: Compare CSP-safe interpreter against Ajv on real private Kernel schemas
        shell: bash
        run: |
          cd "$RUNNER_TEMP/d09-k036-same-store"
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund \
            @cfworker/json-schema@4.1.1 > "$RUNNER_TEMP/d09-interpreter-npm.log" 2>&1 || {
            echo D09_KERNEL_CSP_INTERPRETER_NPM=FAIL; exit 1;
          }
          echo D09_KERNEL_CSP_INTERPRETER_NPM=PASS
          node "$GITHUB_WORKSPACE/t2/current/final-successor/canonical-source/scripts/issue14-kernel-interpreter-parity.mjs" \
            "$RUNNER_TEMP/d09-k036-same-store" > "$RUNNER_TEMP/d09-interpreter-parity.log" 2>&1 || {
            grep '^D09_KERNEL_CSP_INTERPRETER_PARITY=' "$RUNNER_TEMP/d09-interpreter-parity.log" || true
            grep -oE 'D09_CSP_INTERPRETER_[A-Z0-9_]+|Error: [A-Z0-9_]+' "$RUNNER_TEMP/d09-interpreter-parity.log" | tail -6 || true
            echo D09_KERNEL_CSP_INTERPRETER_PARITY=FAIL
            exit 1
          }
          grep '^D09_KERNEL_CSP_INTERPRETER_PARITY=' "$RUNNER_TEMP/d09-interpreter-parity.log"
          echo D09_KERNEL_CSP_INTERPRETER_PARITY=PASS
      - name: Qualify both static and dynamic CSP-safe Kernel validator transforms in disposable source
        shell: bash
        run: |
          cd "$RUNNER_TEMP/d09-k036-same-store"
          core="$GITHUB_WORKSPACE/t2/current/final-successor/canonical-source"
          node "$core/scripts/issue14-kernel-interpreted-runtime.mjs" "$RUNNER_TEMP/d09-k036-same-store" \
            > "$RUNNER_TEMP/d09-dynamic-patch.log" 2>&1 || {
            echo D09_KERNEL_CSP_DYNAMIC_PATCH=FAIL
            grep -oE 'D09_KERNEL_[A-Z0-9_]+|Error: [A-Z0-9_]+' "$RUNNER_TEMP/d09-dynamic-patch.log" | tail -12 || true
            exit 1
          }
          grep '^D09_KERNEL_CSP_INTERPRETED_PATCH=' "$RUNNER_TEMP/d09-dynamic-patch.log"
          echo D09_KERNEL_CSP_DYNAMIC_PATCH=PASS
          node "$core/scripts/issue14-audit-ajv-after-patch.mjs" "$RUNNER_TEMP/d09-k036-same-store" > "$RUNNER_TEMP/d09-ajv-csp-audit.log" 2>&1 || {
            echo D09_AJV_AUDIT=FAIL
            grep -E '^(TypeError|Error|ReferenceError|SyntaxError):' "$RUNNER_TEMP/d09-ajv-csp-audit.log" | sed -E "s#/(home|tmp|mnt)/[^[:space:]]+#<private-path>#g" | tail -3 || true
            exit 1
          }
          grep '^D09_KERNEL_REMAINING_AJV_CTORS=' "$RUNNER_TEMP/d09-ajv-csp-audit.log"
          node "$core/scripts/issue14-remove-runtime-ajv.mjs" "$RUNNER_TEMP/d09-k036-same-store" > "$RUNNER_TEMP/d09-remove-ajv.log" 2>&1 || {
            echo D09_KERNEL_AJV_REMOVAL=FAIL
            grep -E 'D09_AJV_UNSUPPORTED_CONTEXT=|D09_AJV_[A-Z0-9_]+' "$RUNNER_TEMP/d09-remove-ajv.log" | tail -9 || true
            exit 1
          }
          grep '^D09_KERNEL_AJV_CONSTRUCTORS_REMOVED=' "$RUNNER_TEMP/d09-remove-ajv.log"
          node "$core/scripts/issue14-zod-csp-jitless.mjs" "$RUNNER_TEMP/d09-k036-same-store" > "$RUNNER_TEMP/d09-zod-jitless.log" 2>&1 || {
            echo D09_KERNEL_ZOD_CSP_BOOTSTRAP=FAIL
            grep -oE 'D09_ZOD_[A-Z0-9_]+' "$RUNNER_TEMP/d09-zod-jitless.log" | tail -5 || true
            exit 1
          }
          grep '^D09_KERNEL_ZOD_CSP_BOOTSTRAP=' "$RUNNER_TEMP/d09-zod-jitless.log"
          npm run typecheck > "$RUNNER_TEMP/d09-dynamic-types.log" 2>&1 || {
            echo D09_KERNEL_CSP_DYNAMIC_TYPES=FAIL
            grep -oE 'error TS[0-9]+' "$RUNNER_TEMP/d09-dynamic-types.log" | sort -u | tail -12 || true
            exit 1
          }
          echo D09_KERNEL_CSP_DYNAMIC_TYPES=PASS
          npm run build > "$RUNNER_TEMP/d09-dynamic-build.log" 2>&1 || {
            echo D09_KERNEL_CSP_DYNAMIC_BUILD=FAIL
            grep -oE 'Error: [A-Z0-9_]+|Could not resolve|Build failed' "$RUNNER_TEMP/d09-dynamic-build.log" | tail -12 || true
            exit 1
          }
          echo D09_KERNEL_CSP_DYNAMIC_BUILD=PASS
          node --input-type=module - "$RUNNER_TEMP/d09-k036-same-store/dist/_iwxa/runtime/0.3.6/runtime.js" <<'NODE'
          import {readFileSync} from "node:fs";
          const lines=readFileSync(process.argv[2],"utf8").split("\n");
          const sites=[];
          const normalizePackage=(s)=>{
            const match=s.match(/node_modules\/(?:@[^/]+\/)?[^/]+/);
            return match ? match[0].replace("node_modules/","") : "KERNEL_OR_UNMAPPED";
          };
          for(let i=0;i<lines.length;i++){
            if(!/\bnew\s+Function\s*\(/.test(lines[i]))continue;
            let source="UNMAPPED";
            for(let k=i;k>=Math.max(0,i-1000);k--){
              if(/node_modules\/|src\/.*\.(ts|js)/.test(lines[k])){
                source=normalizePackage(lines[k]);break;
              }
            }
            sites.push({line:i+1,module:source});
          }
          console.log("D09_KERNEL_NEW_FUNCTION_PROVENANCE="+JSON.stringify({
            count:sites.length,sites:sites.slice(0,28)
          }));
          const frames=[1969,1805,4817,2594,19168,2622,19222].map(line=>{
            const row=lines[line-1]??"";
            let source="UNMAPPED";
            for(let i=line-1;i>=Math.max(0,line-2200);i--){
              if(/node_modules\//.test(lines[i])){source=normalizePackage(lines[i]);break;}
            }
            return {line,source,lexical:{
              functionWord:/\bFunction\b/.test(row),evalWord:/\beval\b/.test(row),
              newWord:/\bnew\b/.test(row),codegen:/compile|codegen|CodeGen/i.test(row)
            }};
          });
          console.log("D09_KERNEL_RUNTIME_STACK_LINEAGE="+JSON.stringify({lines:lines.length,frames}));
          NODE
          npm run test:built > "$RUNNER_TEMP/d09-dynamic-tests.log" 2>&1 || {
            echo D09_KERNEL_CSP_DYNAMIC_BUILT_TESTS=FAIL
            grep -oE 'FAIL [A-Za-z0-9_.-]+|Error: [A-Z0-9_]+' "$RUNNER_TEMP/d09-dynamic-tests.log" | tail -12 || true
            exit 1
          }
          echo D09_KERNEL_CSP_DYNAMIC_BUILT_TESTS=PASS
          echo D09_KERNEL_CSP_TWO_STAGE_RUNTIME=BUILT_UNQUALIFIED
      # No source, zip, generated files or private code is copied to public artifacts.
