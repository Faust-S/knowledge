name: d06-private-format-candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-format:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Private checkout pinned to approved D06 working source
        uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod.ru
          ref: 5057e77c012feb5d974216eabd704d52e722ded0
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Format tracked source locally and push ONLY to private candidate
        working-directory: private/site
        shell: pwsh
        env:
          DOMEN: ${{ secrets.DOMEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $scratch = Join-Path $env:RUNNER_TEMP "d06-private-format-log.txt"
          & npm ci --no-audit --no-fund *> $scratch
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_FMT_INSTALL=FAIL"; exit 1 }
          Write-Host "D06_FMT_INSTALL=PASS"
          $base = (& git rev-parse HEAD).Trim()
          if ($base -ne "5057e77c012feb5d974216eabd704d52e722ded0") {
            Write-Host "D06_FMT_PIN=FAIL"; exit 1
          }
          & node scripts/format-eslint-violations.mjs --apply *> $scratch
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_FMT_APPLY=FAIL"; exit 1 }
          Write-Host "D06_FMT_APPLY=PASS"
          $stages = @(
            "check:package", "check:playwright-cli", "check:type",
            "check:lint", "check:registry", "check:schemas",
            "check:session-docs", "check:contracts", "check:adapter-boundary",
            "check:service-save-api", "check:e2e-antipatterns",
            "check:design-system", "check:visual-contract"
          )
          foreach ($stage in $stages) {
            & npm run $stage *> $scratch
            if ($LASTEXITCODE -ne 0) {
              Write-Host ("D06_FMT_FAILED_STAGE=" + $stage)
              if ($stage -eq "check:lint") {
                $lintPath = Join-Path $env:RUNNER_TEMP "d06-format-remaining-private.json"
                & node node_modules/eslint/bin/eslint.js . --format json > $lintPath 2> $scratch
                $diagnostics = Get-Content -LiteralPath $lintPath -Raw | ConvertFrom-Json
                $allMessages = @($diagnostics | ForEach-Object { $_.messages } | Where-Object { $_ })
                $fmt = @($allMessages | Where-Object { $_.ruleId -eq "prettier/prettier" })
                $other = @($allMessages | Where-Object { $_.severity -eq 2 -and $_.ruleId -ne "prettier/prettier" })
                $warn = @($allMessages | Where-Object { $_.severity -eq 1 })
                Write-Host ("D06_FMT_POST_PRETTIER=" + $fmt.Count)
                Write-Host ("D06_FMT_POST_OTHER_ERRORS=" + $other.Count)
                Write-Host ("D06_FMT_POST_WARNINGS=" + $warn.Count)
                foreach ($group in ($other | Group-Object ruleId | Sort-Object Name)) {
                  $safeRule = [string]$group.Name
                  if ($safeRule -match "^[A-Za-z0-9/@_-]+$") {
                    Write-Host ("D06_FMT_POST_RULE=" + $safeRule + ":" + $group.Count)
                  }
                }
              }
              $plan = & node scripts/format-eslint-violations.mjs --plan 2> $scratch
              if ($LASTEXITCODE -eq 0) {
                foreach ($line in $plan) {
                  if ($line -match "^D06-WIN-003: [0-9]+ Prettier violations in [0-9]+ tracked files\\.$" -or
                      $line -match "^Other ESLint errors: [0-9]+; warnings: [0-9]+\\.$") {
                    Write-Host ("D06_FMT_CLASS=" + $line)
                  }
                }
              }
              exit 1
            }
            Write-Host ("D06_FMT_STAGE_PASS=" + $stage)
          }
          Write-Host "D06_FMT_CHECK=PASS"
          & npm run setup:browser *> $scratch
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_FMT_BROWSER_SETUP=FAIL"; exit 1 }
          Write-Host "D06_FMT_BROWSER_SETUP=PASS"
          & npm run build:static:check *> $scratch
          if ($LASTEXITCODE -ne 0) {
            Write-Host "D06_FMT_FULL_STATIC_CHECK=FAIL"
            exit 1
          }
          Write-Host "D06_FMT_FULL_STATIC_CHECK=PASS"
          & git diff --check *> $scratch
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_FMT_DIFF_CHECK=FAIL"; exit 1 }
          $changed = @(& git diff --name-only)
          Write-Host ("D06_FMT_FILES=" + $changed.Count)
          if ($changed.Count -eq 0) { Write-Host "D06_FMT_CANDIDATE=NO_CHANGES"; exit 0 }
          if (-not $env:DOMEN) { Write-Host "D06_FMT_CANDIDATE=NO_AUTH"; exit 1 }
          $remote = "https://github.com/Faust-S/komplektovod.ru.git"
          $auth = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:" + $env:DOMEN)
          )
          $work = "refs/heads/work/2026-11-11-case-driven-entry-and-drill"
          $current = & git -c ("http.extraheader=AUTHORIZATION: basic " + $auth) ls-remote $remote $work 2> $scratch
          if ($LASTEXITCODE -ne 0 -or -not $current) {
            Write-Host "D06_FMT_REMOTE_READ=FAIL"; exit 1
          }
          $remoteSha = (($current | Select-Object -First 1) -split '\s+')[0]
          if ($remoteSha -ne $base) { Write-Host "D06_FMT_SOURCE_MOVED=YES"; exit 1 }
          & git config user.name "IWXA D06 private format"
          & git config user.email "d06-ci@users.noreply.github.com"
          & git add -u
          & git commit -m "style(d06): apply canonical formatting to private source" *> $scratch
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_FMT_COMMIT=FAIL"; exit 1 }
          $dest = "refs/heads/work/2026-11-19-d06-format-candidate"
          & git -c ("http.extraheader=AUTHORIZATION: basic " + $auth) push $remote ("HEAD:" + $dest) *> $scratch
          if ($LASTEXITCODE -ne 0) {
            $reply = Get-Content -LiteralPath $scratch -Raw -ErrorAction SilentlyContinue
            $reason = if ($reply -match "403|Write access to repository not granted|Permission.*denied") {
              "NO_WRITE_PERMISSION"
            } elseif ($reply -match "protected branch|rule.?set|ruleset") {
              "BRANCH_POLICY"
            } elseif ($reply -match "non-fast-forward|fetch first") {
              "REF_MOVED"
            } else {
              "UNCLASSIFIED"
            }
            Write-Host ("D06_FMT_WRITE_FAILURE_CLASS=" + $reason)
            Write-Host "D06_FMT_CANDIDATE=WRITE_DENIED"
            exit 1
          }
          Write-Host "D06_FMT_CANDIDATE=PRIVATE_BRANCH_WRITTEN"
      - name: No private artifacts or logs leave the runner
        if: always()
        shell: pwsh
        run: |
          Write-Host "D06_PRIVATE_SOURCE_PUBLICATION=0"
          Write-Host "D06_PRIVATE_DIST_PUBLICATION=0"
          Write-Host "D06_PRIVATE_DIFF_PUBLICATION=0"
          Write-Host "D06_PRIVATE_LOG_UPLOAD=0"
