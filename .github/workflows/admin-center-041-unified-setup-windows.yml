          $ErrorActionPreference='Stop'
          & ./packages/t3-core/tests/admin-center-04-upgrade-03.ps1 -CandidateSetup '.candidate-04/IWXA-Admin-Center-0.4.1-Setup.exe'
          Write-Host 'ADMIN04_SETUP_CORE_04_MIGRATION_FINAL_ACCEPTANCE_PASS'
