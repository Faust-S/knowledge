name: AKIS Mesa 3.5.2 R4 bilateral external buyer and supplier source evidence

on:
  push:
    branches:
      - work/2026-11-23-akis-r4-bilateral-outside-offer-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-original-mesa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install official Mesa 3.5.2
        run: |
          python -m pip install --disable-pip-version-check "mesa==3.5.2" "pytest>=8,<10"
          python -c "import mesa; assert mesa.__version__ == '3.5.2'"
      - name: Compile all original research
        run: python -m compileall -q qualifications/akis_2026_11_21/research
      - name: Target independent seller and original buyer evidence
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: |
          python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r4_independent_supplier_offer_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r4_original_buyer_demand_withdrawal_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r4_independent_external_buyer_demand_mesa.py
      - name: Full native original Mesa 3.5.2 regression
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests
      - name: Export deterministic bilateral evidence
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_r4_original_bilateral_offer_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: akis-r4-bilateral-original-offer-${{ matrix.os }}
          if-no-files-found: error
          path: qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r4_original_bilateral_outside_offer_evidence.json
