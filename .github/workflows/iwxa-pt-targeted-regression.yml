name: IWXA PT F02 Atlas B targeted browser regression
on:
  push:
    branches: [work/2026-11-18-pt-66-qualification]
    paths:
      - .github/workflows/iwxa-pt-targeted-regression.yml
      - tools/pt-2defects-browser.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iwxa-pt-targeted-${{ github.ref }}
  cancel-in-progress: true
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Verify private repository access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          test -n "$GH_TOKEN" || exit 1
          gh api repos/Faust-S/iwxa-ru-1 >/dev/null 2>&1 || { echo "PT_REPO_NO_ACCESS"; exit 1; }
          echo "PT_REPO_ACCESS=PASS"
      - uses: actions/checkout@v4
        with:
          path: qa-scripts
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-ru-1
          ref: 2f3f0f20b17655d5ed2c0bfe0954ea9186878b96
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: pt-site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"
      - name: Run exact source SSR
        shell: bash
        working-directory: pt-site
        run: |
          echo "PT_QA_SHA=$(git rev-parse HEAD)"
          bun install --frozen-lockfile > "$RUNNER_TEMP/pt-install.log" 2>&1 || { echo "PT_INSTALL=FAIL"; exit 1; }
          export LOVABLE_BUILD_TARGET=static NITRO_PRESET=node-server SERVER_PRESET=node-server
          bun run build > "$RUNNER_TEMP/pt-build.log" 2>&1 || { echo "PT_BUILD=FAIL"; exit 1; }
          echo "PT_BUILD=PASS"
      - name: Observe targeted F02 and Atlas B
        shell: bash
        run: |
          PORT=4389 HOST=127.0.0.1 NODE_ENV=production node pt-site/.output/server/index.mjs > "$RUNNER_TEMP/pt-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:4389/; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then echo "PT_SERVER_NOT_READY"; exit 1; fi
          if PT_SITE_DIR="$GITHUB_WORKSPACE/pt-site" PT_BASE=http://127.0.0.1:4389 node qa-scripts/tools/pt-2defects-browser.mjs > "$RUNNER_TEMP/pt-targeted.log" 2>&1; then
            grep '^PT_' "$RUNNER_TEMP/pt-targeted.log" || true
            echo "PT_TARGETED_BOTH=PASS"
          else
            grep '^PT_' "$RUNNER_TEMP/pt-targeted.log" | head -n 100 || true
            echo "PT_TARGETED_BOTH=FAIL"
            exit 1
          fi
