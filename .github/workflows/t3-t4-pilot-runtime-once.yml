name: Original K036 native pilot passport witness
on:
  push:
    branches: ['ci/once/t3-t4-pilot-runtime/3eaf02f3a611']
permissions:
  contents: read
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3eaf02f3a611fc8716b7a55b3fb9c0d8f536d150
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact public source and real compiled One Core
        run: |
          test "$(git rev-parse HEAD)" = "3eaf02f3a611fc8716b7a55b3fb9c0d8f536d150"
          npm ci --prefix packages/t3-core --ignore-scripts --no-audit --no-fund
          npm --prefix packages/t3-core run build
      - name: Both native pilot passports on immutable original Kernel (not the failed return archive)
        shell: bash
        run: |
          set -euo pipefail
          ZIP=packages/t3-core/qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip
          echo "7075b8b9590ef1283e34ecb3c21dd9d1b7342697287e1aa150cd4f4a60860b68  $ZIP" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/qualified-t2"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/qualified-t2"
          npm install --prefix "$RUNNER_TEMP/t4-platform" --ignore-scripts --no-audit --no-fund --save-exact fake-indexeddb@6.2.4
          export IWXA_COMPANY_TEST_QUALIFIED_T2="$RUNNER_TEMP/qualified-t2"
          export IWXA_COMPANY_TEST_IDB_MODULE="$RUNNER_TEMP/t4-platform/node_modules/fake-indexeddb/build/esm/index.js"
          export IWXA_COMPANY_TEST_COMPILED_T3="$GITHUB_WORKSPACE/packages/t3-core/dist"
          timeout 180s node --experimental-strip-types --test --test-timeout=150000 --test-name-pattern='native pilot passports' packages/t3-core/tests/t3-company-original-runtime-roundtrip.test.mjs
