name: D09 HOP private lint inventory (no file export)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Read private HOP candidate without publishing code
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop.iwxa.ru
          ref: work/2026-11-19-d09-lint-candidate
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pin source and install dependencies
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "d4edebbb1cf99ce5750db84c8584c788f944d6a7"
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-npm-lint.log" 2>&1
          echo D09_LINT_DEPENDENCIES=PASS
      - name: Collect counts without exposing source or output files
        shell: bash
        run: |
          ./node_modules/.bin/eslint . -f json > "$RUNNER_TEMP/d09-lint-inventory.json" 2> "$RUNNER_TEMP/d09-lint-stderr.log" || true
          node --input-type=module - "$RUNNER_TEMP/d09-lint-inventory.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { relative } from "node:path";
          const results=JSON.parse(readFileSync(process.argv[2],"utf8"));
          const dirs=new Map(), rules=new Map(), nonFixable=[];
          let errors=0,warnings=0,fixable=0,files=0;
          for(const record of results){
            if(!record.messages?.length) continue;
            files++;
            const path=relative(process.cwd(),record.filePath).replaceAll("\\","/");
            const parts=path.split("/");
            const group=parts.slice(0,parts[0]==="src"?3:2).join("/");
            const stats=dirs.get(group)??{errors:0,warnings:0,fixable:0,files:0};
            stats.files++;
            for(const m of record.messages){
              stats.errors+=(m.severity===2);
              stats.warnings+=(m.severity===1);
              stats.fixable+=Boolean(m.fix);
              errors+=(m.severity===2);
              warnings+=(m.severity===1);
              fixable+=Boolean(m.fix);
              if(m.severity===2&&!m.fix) nonFixable.push({path,line:m.line,rule:m.ruleId});
              const key=m.ruleId??"unclassified";
              rules.set(key,(rules.get(key)??0)+1);
            }
            dirs.set(group,stats);
          }
          console.log("D09_LINT_INVENTORY="+JSON.stringify({files,errors,warnings,fixable,
            byRule:[...rules].sort((a,b)=>b[1]-a[1]).slice(0,16),
            byDirectory:[...dirs].sort((a,b)=>b[1].errors-a[1].errors).slice(0,25)}));
          console.log("D09_LINT_NONFIXABLE="+JSON.stringify(nonFixable));
          NODE
          test -z "$(git status --porcelain)" || { echo D09_SOURCE_MUTATED=FAIL; exit 1; }
          echo D09_LINT_INVENTORY_READ_ONLY=PASS
      # No source, diffs, lint JSON or build artifacts are published.
