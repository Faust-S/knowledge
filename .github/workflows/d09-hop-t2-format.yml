name: D09 format site-owned T2 integration only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact private HOP candidate
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop.iwxa.ru
          ref: work/2026-10-27-d09-t2-site-only
          token: ${{ secrets.DOMEN }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Lock candidate before formatting
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "011c2a8ec20055569ec044483bcfbcbb5f5bda27" || {
            echo "D09_FORMAT_BRANCH_ADVANCED=HOLD"; exit 1;
          }
          test -z "$(git status --porcelain)" || {
            echo "D09_FORMAT_NOT_CLEAN=HOLD"; exit 1;
          }
      - name: Install and format T2 adapter only
        shell: bash
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-format-npm.log" 2>&1
          ./node_modules/.bin/prettier --write t2-site-module/hop src/integrations/t2 > "$RUNNER_TEMP/d09-format.log" 2>&1 || {
            echo "D09_T2_PRETTIER=FAIL"; exit 1;
          }
          git diff --check || {
            echo "D09_T2_FORMAT_DIFF=FAIL"; exit 1;
          }
          bad="$(git diff --name-only | grep -Ev '^(t2-site-module/hop/|src/integrations/t2/)' || true)"
          test -z "$bad" || {
            echo "D09_FORMAT_OUTSIDE_T2_SCOPE=FAIL"; exit 1;
          }
          echo "D09_T2_FORMATTED_FILES=$(git diff --name-only | wc -l)"
      - name: Verify T2 lint without weakening rules
        shell: bash
        run: |
          ./node_modules/.bin/eslint t2-site-module/hop src/integrations/t2 --format json > "$RUNNER_TEMP/d09-format-lint.json" 2>&1 || {
            node --input-type=module - "$RUNNER_TEMP/d09-format-lint.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const files = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const counts = new Map();
          const names = [];
          for (const file of files) {
            if (file.errorCount) names.push({file: file.filePath.split('/').slice(-2).join('/'), count: file.errorCount});
            for (const entry of file.messages) counts.set(entry.ruleId ?? 'parser', (counts.get(entry.ruleId ?? 'parser') ?? 0) + 1);
          }
          console.log('D09_T2_LINT_REMAINING=' + JSON.stringify({rules: [...counts], files:names.slice(0,20)}));
          NODE
            echo "D09_T2_SCOPED_LINT=FAIL"; exit 1;
          }
          echo "D09_T2_SCOPED_LINT=PASS"
      - name: Verify code unchanged semantically
        shell: bash
        run: |
          npm run typecheck > "$RUNNER_TEMP/d09-format-types.log" 2>&1 || {
            echo "D09_T2_FORMAT_TYPES=FAIL"; exit 1;
          }
          npm run test:d09 > "$RUNNER_TEMP/d09-format-tests.log" 2>&1 || {
            grep -E 'AssertionError|at .*d09-.*test\\.mjs|at .*tests/|not ok|ERR_ASSERTION' "$RUNNER_TEMP/d09-format-tests.log" | tail -25 || true
            echo "D09_T2_FORMAT_TESTS=FAIL"; exit 1;
          }
          npm run build:host-module > "$RUNNER_TEMP/d09-format-build.log" 2>&1 || {
            echo "D09_T2_FORMAT_HOST_BUILD=FAIL"; exit 1;
          }
          git diff --check
          test -z "$(git diff --name-only | grep -Ev '^(t2-site-module/hop/|src/integrations/t2/)' || true)"
          echo "D09_T2_FORMAT_ACCEPTANCE=PASS"
      - name: Commit only checked T2 formatting to private working branch
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "011c2a8ec20055569ec044483bcfbcbb5f5bda27"
          git add -- t2-site-module/hop src/integrations/t2
          if git diff --cached --quiet; then
            echo "D09_T2_FORMAT_NO_CHANGES"
          else
            git config user.name "IWXA D09 CI"
            git config user.email "d09-ci@users.noreply.github.com"
            git commit -m "style(d09): format only T2 Host bridge and site adapter" > "$RUNNER_TEMP/d09-commit.log"
            git push origin "HEAD:refs/heads/work/2026-10-27-d09-t2-site-only" > "$RUNNER_TEMP/d09-push.log" 2>&1 || {
              sed -E 's/(gh[pousr]_[A-Za-z0-9_]+)/[REDACTED]/g; s/(github_pat_[A-Za-z0-9_]+)/[REDACTED]/g' "$RUNNER_TEMP/d09-push.log" | tail -12
              echo "D09_T2_FORMAT_PUSH=FAIL"; exit 1;
            }
            echo "D09_T2_FORMAT_PUSH=PASS"
          fi
      # No private source, patch, dist, binaries or secrets are uploaded as artifacts.
