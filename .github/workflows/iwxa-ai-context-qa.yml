name: IWXA AI context isolated public QA
on:
  push:
    branches: [work/2026-11-21-iwxa-ai-context-public-qa]
    paths:
      - "experiments/ai-context-qa/**"
      - ".github/workflows/iwxa-ai-context-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s experiments/ai-context-qa/tests -p "test_*.py" -v
  windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s experiments/ai-context-qa/tests -p "test_*.py" -v
