name: D08 isolated original Kernel schema probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d08-kernel-schema-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualified-kernel:
    name: Real T2 Kernel passport and Result schema, disposable Windows browser
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
      PUPPETEER_SKIP_DOWNLOAD: "1"
      CI: "true"
    steps:
      - name: Windows long-path safe checkout
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - name: Checkout private site at exact tested commit
        uses: actions/checkout@v4
        with:
          repository: Faust-S/market-ops.ru
          ref: 342fbbd15bd46158d5afd21a45f9114e5ec61a69
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - name: Checkout original accepted T2 source
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: 49b5aa53e7441793f957b4f874ad0b7a9ae0f0f7
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: t2
      - name: Exact identity and test syntax
        run: |
          test "$(git -C site rev-parse HEAD)" = "342fbbd15bd46158d5afd21a45f9114e5ec61a69" || exit 1
          test "$(git -C t2 rev-parse HEAD)" = "49b5aa53e7441793f957b4f874ad0b7a9ae0f0f7" || exit 1
          test -z "$(git -C t2 status --porcelain)" || exit 1
          node --check site/tests/d08-original-kernel-schema-probe.mjs || exit 1
          echo D08_ORIGINAL_KERNEL_PROBE_SYNTAX=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install reproducible site test dependencies
        working-directory: site
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d08-kernel-probe-install.log" 2>&1 || {
            echo D08_ORIGINAL_KERNEL_PROBE_INSTALL=FAIL; exit 1;
          }
          echo D08_ORIGINAL_KERNEL_PROBE_INSTALL=PASS
      - name: Use installed Chrome or acquire disposable test browser
        working-directory: site
        run: |
          CHROME="C:\Program Files\Google\Chrome\Application\chrome.exe"
          if test -f "$CHROME"; then
            echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
          else
            unset PUPPETEER_SKIP_DOWNLOAD
            node_modules/.bin/puppeteer browsers install chrome > "$RUNNER_TEMP/d08-probe-browser.log" 2>&1 || {
              echo D08_ORIGINAL_KERNEL_PROBE_BROWSER=FAIL; exit 1;
            }
          fi
          echo D08_ORIGINAL_KERNEL_PROBE_BROWSER=PASS
      - name: Test real qualified runtime against exact business and obligation schema
        working-directory: site
        run: |
          node --import tsx tests/d08-original-kernel-schema-probe.mjs > "$RUNNER_TEMP/d08-kernel-schema-probe.log" 2>&1 || {
            grep -E '^D08_ORIGINAL_KERNEL_DIAG_' "$RUNNER_TEMP/d08-kernel-schema-probe.log" | head -8 || true
            echo D08_ORIGINAL_KERNEL_SCHEMA_PROBE=FAIL
            exit 1
          }
          grep -E '^D08_ORIGINAL_KERNEL_DIAG_' "$RUNNER_TEMP/d08-kernel-schema-probe.log" | head -8
          grep -q '^D08_ORIGINAL_KERNEL_DIAG_BUSINESS=PASS$' "$RUNNER_TEMP/d08-kernel-schema-probe.log" || exit 1
          grep -q '^D08_ORIGINAL_KERNEL_DIAG_DATED=PASS,CODE=NONE,PATH=NONE$' "$RUNNER_TEMP/d08-kernel-schema-probe.log" || exit 1
          grep -q '^D08_ORIGINAL_KERNEL_DIAG_UNDATED=PASS,CODE=NONE,PATH=NONE$' "$RUNNER_TEMP/d08-kernel-schema-probe.log" || exit 1
          grep -q '^D08_ORIGINAL_KERNEL_DIAG_DATED_READBACK=PASS$' "$RUNNER_TEMP/d08-kernel-schema-probe.log" || exit 1
          grep -q '^D08_ORIGINAL_KERNEL_DIAG_DATED_RELATION=PASS$' "$RUNNER_TEMP/d08-kernel-schema-probe.log" || exit 1
          grep -q '^D08_ORIGINAL_KERNEL_DIAG_UNDATED_READBACK=PASS$' "$RUNNER_TEMP/d08-kernel-schema-probe.log" || exit 1
          grep -q '^D08_ORIGINAL_KERNEL_DIAG_UNDATED_RELATION=PASS$' "$RUNNER_TEMP/d08-kernel-schema-probe.log" || exit 1
          grep -q '^D08_ORIGINAL_KERNEL_DIAG_COMMAND_SAVE=PASS$' "$RUNNER_TEMP/d08-kernel-schema-probe.log" || exit 1
          grep -q '^D08_ORIGINAL_KERNEL_DIAG_COMMAND_LINK=PASS$' "$RUNNER_TEMP/d08-kernel-schema-probe.log" || exit 1
          grep -q '^D08_ORIGINAL_KERNEL_DIAG_COMMAND_REVISION2=PASS$' "$RUNNER_TEMP/d08-kernel-schema-probe.log" || exit 1
          grep -q '^D08_ORIGINAL_KERNEL_DIAG_COMMAND_EXPORT=PASS$' "$RUNNER_TEMP/d08-kernel-schema-probe.log" || exit 1
          grep -q '^D08_ORIGINAL_KERNEL_DIAG_COMMAND_IWXA=PASS$' "$RUNNER_TEMP/d08-kernel-schema-probe.log" || exit 1
          grep -q '^D08_ORIGINAL_KERNEL_DIAG_COMMAND_REVISION_LABELS=PASS$' "$RUNNER_TEMP/d08-kernel-schema-probe.log" || exit 1
          echo D08_ORIGINAL_KERNEL_SCHEMA_PROBE=PASS
      # Only safe fixed-state markers appear. No private files, source, dist or logs are uploaded.
