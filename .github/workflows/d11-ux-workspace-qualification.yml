name: D11 Workspace UX private source qualification
on:
  push:
    branches:
      - work/2026-11-21-d11-ux-workspace-qualification
    paths:
      - .github/workflows/d11-ux-workspace-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d11-ux-workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Confirm private checkout permission
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo D11_SOURCE_ACCESS=UNAVAILABLE; exit 1; }
          gh api repos/Faust-S/advice-logistics.ru --jq .id > /dev/null ||
            { echo D11_SITE_ACCESS=DENIED; exit 1; }
          gh api repos/Faust-S/T2 --jq .id > /dev/null ||
            { echo D11_T2_ACCESS=DENIED; exit 1; }
          echo D11_SOURCE_ACCESS=PASS
      - name: Checkout exact D11 UX candidate
        uses: actions/checkout@v4
        with:
          repository: Faust-S/advice-logistics.ru
          ref: d7e501bc8423fc3252e9a147acddc2954919d01f
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - name: Checkout original normative T2
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: e70de29b72b83e2546f7ab74b17572685a728c17
          token: ${{ secrets.DOMEN }}
          path: t2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm source revisions without printing content
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C site rev-parse HEAD)" = "d7e501bc8423fc3252e9a147acddc2954919d01f"
          test "$(git -C t2 rev-parse HEAD)" = "e70de29b72b83e2546f7ab74b17572685a728c17"
          echo D11_UX_SITE_REVISION=PASS
          echo D11_NORMATIVE_T2_REVISION=PASS
      - name: Install private dependencies
        working-directory: site
        shell: bash
        run: |
          if npm ci --no-audit --no-fund > "$RUNNER_TEMP/d11-ux-npm.log" 2>&1; then
            echo D11_UX_INSTALL=PASS
          else
            echo D11_UX_INSTALL=FAIL
            exit 1
          fi
      - name: Verify all D11 source and UX regression tests
        working-directory: site
        shell: bash
        run: |
          if node --experimental-strip-types --test tests/*.test.mjs > "$RUNNER_TEMP/d11-ux-tests.log" 2>&1; then
            echo D11_UX_ALL_SITE_TESTS=PASS
          else
            echo D11_UX_ALL_SITE_TESTS=FAIL
            grep -E '^not ok [0-9]+' "$RUNNER_TEMP/d11-ux-tests.log" |
              sed 's/[^a-zA-Z0-9 _.-]/_/g' | head -n 15 || true
            exit 1
          fi
      - name: Build exact public site and original T2 Host into one dist
        working-directory: site
        shell: bash
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
        run: |
          if npm run build:t2:site > "$RUNNER_TEMP/d11-ux-build.log" 2>&1; then
            echo D11_UX_ONE_DIST=PASS
          else
            echo D11_UX_ONE_DIST=FAIL
            { grep -E "^D11_(SUBBUILD_(HOST|KERNEL|SITE)|HOST_INSTALL|HOST_TYPECHECK_ON_ERROR)=(PASS|FAIL)$" "$RUNNER_TEMP/d11-ux-build.log" || true; }
            echo -n "D11_UX_BUILD_ERROR_CODES="
            { grep -Eo 'TS[0-9]{4}|T2_EXTERNAL_MODULE_[A-Z0-9_]+|D11_[A-Z0-9_]+|ERR_[A-Z0-9_]+' "$RUNNER_TEMP/d11-ux-build.log" || true; } | sort -u | head -n 20 | tr '\n' ','
            echo
            if grep -Eiq 'Could not resolve|Rollup failed to resolve|Failed to resolve import|Cannot find module' "$RUNNER_TEMP/d11-ux-build.log"; then echo D11_UX_BUILD_IMPORT_ERROR=YES; fi
            node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8"); for(const line of s.split(/\r?\n/).filter(x=>/failed to resolve import|cannot find module|could not resolve/i.test(x)).slice(-4)){const m=line.match(/"([^"]+)"/);const name=m?.[1]?.split(/[\\/]/).pop()||"UNKNOWN";console.log("D11_UX_UNRESOLVED_MODULE="+(/^[A-Za-z0-9@._-]{1,72}$/.test(name)?name:"UNKNOWN"));}' "$RUNNER_TEMP/d11-ux-build.log"
            if grep -Eq 'error TS[0-9]{4}' "$RUNNER_TEMP/d11-ux-build.log"; then echo D11_UX_BUILD_TYPE_ERROR=YES; fi
            if grep -Eq 'T2_EXTERNAL_MODULE_' "$RUNNER_TEMP/d11-ux-build.log"; then echo D11_UX_BUILD_STAGE_ERROR=YES; fi
            exit 1
          fi
      - name: Check TypeScript after generated file-route refresh
        working-directory: site
        shell: bash
        run: |
          if node_modules/.bin/tsc --noEmit --project tsconfig.json > "$RUNNER_TEMP/d11-ux-tsc.log" 2>&1; then
            echo D11_UX_TYPES=PASS
          else
            echo D11_UX_TYPES=FAIL
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/d11-ux-tsc.log" |
              sed -E 's/^([^ :]+)[(:][0-9:,)]*: error (TS[0-9]+).*/\2 in \1/' |
              head -n 15 || true
            exit 1
          fi
      - name: Check built routes and static hosting
        working-directory: site
        shell: bash
        run: |
          test -f dist/start/index.html || { echo D11_UX_START_ROUTE=FAIL; exit 1; }
          for check in check:links check:runtime check:assets check:htaccess; do
            if ! npm run --silent "$check" > "$RUNNER_TEMP/d11-ux-${check//:/-}.log" 2>&1; then
              echo D11_UX_STATIC_CHECK=FAIL
              exit 1
            fi
          done
          echo D11_UX_STATIC_CHECKS=PASS
      # No source, dist, logs, screenshots or other private artifacts are uploaded.

  browser:
    needs: qualification
    name: D11 actual T2 user journeys ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout exact private D11 UI
        uses: actions/checkout@v4
        with:
          repository: Faust-S/advice-logistics.ru
          ref: d7e501bc8423fc3252e9a147acddc2954919d01f
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - name: Checkout exact original T2
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: e70de29b72b83e2546f7ab74b17572685a728c17
          token: ${{ secrets.DOMEN }}
          path: t2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build integrated private candidate
        working-directory: site
        shell: bash
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d7e501bc8423fc3252e9a147acddc2954919d01f"
          test "$(git -C ../t2 rev-parse HEAD)" = "e70de29b72b83e2546f7ab74b17572685a728c17"
          node --check scripts/d11-ux-first-entry-browser-acceptance.mjs
          if ! npm ci --no-audit --no-fund > "$RUNNER_TEMP/d11-ux-browser-install.log" 2>&1; then
            echo D11_UX_BROWSER_INSTALL=FAIL
            exit 1
          fi
          if ! npm run build:t2:site > "$RUNNER_TEMP/d11-ux-browser-build.log" 2>&1; then
            echo D11_UX_BROWSER_BUILD=FAIL
            exit 1
          fi
          echo D11_UX_BROWSER_ONE_DIST=PASS
      - name: Real mobile, desktop and failed discovery first entry
        working-directory: site
        shell: bash
        run: |
          if node scripts/d11-ux-first-entry-browser-acceptance.mjs > "$RUNNER_TEMP/d11-ux-browser-entry.log" 2>&1; then
            grep '^D11_UX_.*=PASS' "$RUNNER_TEMP/d11-ux-browser-entry.log" || true
          else
            grep '^D11_UX_BROWSER_FAILED=' "$RUNNER_TEMP/d11-ux-browser-entry.log" |
              cut -c 1-180 || true
            exit 1
          fi
      - name: Real first Workspace, all ten calculations and independent .iwxa
        working-directory: site
        shell: bash
        run: |
          if node scripts/d11-live-t2-kernel-exchange-acceptance.mjs > "$RUNNER_TEMP/d11-ux-browser-t2.log" 2>&1; then
            grep -E '^D11_(T2_REAL_FIRST_WORKSPACE|REAL_T2_KERNEL_EXCHANGE_ACCEPTANCE|T2_IWXA_NEW_WORKSPACE_IMPORT)=PASS' "$RUNNER_TEMP/d11-ux-browser-t2.log" || true
            echo D11_UX_T2_END_TO_END=PASS
          else
            grep '^D11_REAL_T2_FAILED=' "$RUNNER_TEMP/d11-ux-browser-t2.log" |
              cut -c 1-180 || true
            exit 1
          fi
      - name: Real user projects, revision, direct source transfer and imported .iwxa
        working-directory: site
        shell: bash
        run: |
          if node scripts/d11-project-continuation-acceptance.mjs > "$RUNNER_TEMP/d11-ux-browser-project.log" 2>&1; then
            grep -E '^D11_(OWN_PROJECT_DIRECT_REOPEN_AND_ACTIONS|T2_TEN_SERVICE_PROJECT_FILTER|PROJECT_INDEPENDENT_IWXA_EXCHANGE|PROJECT_CONTINUATION_REAL_T2)=PASS' "$RUNNER_TEMP/d11-ux-browser-project.log" || true
            echo D11_UX_USER_PROJECTS_END_TO_END=PASS
          else
            grep '^D11_PROJECT_CONTINUATION_FAILED=' "$RUNNER_TEMP/d11-ux-browser-project.log" |
              cut -c 1-180 || true
            exit 1
          fi
      # Deliberately no uploads: private source, generated dist and browser profile stay on ephemeral runners.
