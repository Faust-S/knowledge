name: AKIS Mesa 3.5.2 R1-W2G causal Assurance parity

on:
  push:
    branches:
      - work/2026-11-24-akis-r1w2g-causal-assurance-parity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-r1w2g-assurance-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install original Mesa 3.5.2
        run: |
          python -m pip install --disable-pip-version-check "mesa==3.5.2" "pytest>=8,<10"
          python -c "import mesa; assert mesa.__version__ == '3.5.2'"
      - name: Compile original model
        run: python -m compileall -q qualifications/akis_2026_11_21/research
      - name: Compare native Assurance causal trajectories
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q -s qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r1w2g_assurance_parity_mesa.py
      - name: Native AKIS full regression
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests
