name: D01 Learn original T2 product and user journey
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d01-learn-real-ui
  cancel-in-progress: true
jobs:
  original-learn:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact original private Learn site
        uses: actions/checkout@v4
        with:
          repository: Faust-S/learn.iwxa.ru
          ref: 5b95b49d2065074d4e557b18feaddde0dcb9f6da
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - name: Checkout exact original Learn subject model
        uses: actions/checkout@v4
        with:
          repository: Faust-S/learn
          ref: bebed42b40de5a04b3633628d10eb80f842f9dc5
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/domain
      - name: Checkout original normative T2 and its qualified Kernel release
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: main
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/t2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Verify exact owners and run canonical linked-learning tests
        shell: bash
        run: |
          set -eu
          test "$(git -C private/t2 rev-parse HEAD)" = 9c64951cd78411283e8a416641c36d71e169fc1d
          test "$(git -C private/site rev-parse HEAD)" = 5b95b49d2065074d4e557b18feaddde0dcb9f6da
          test "$(git -C private/domain rev-parse HEAD)" = bebed42b40de5a04b3633628d10eb80f842f9dc5
          cmp private/domain/learning-journey/projection.ts private/site/t2/domain-modules/learn-results/learning-journey.ts
          cmp private/domain/learning-journey/today.ts private/site/t2/domain-modules/learn-results/learning-today.ts
          cmp private/domain/learning-journey/workplace-shifts.mjs private/site/practice/quick-arithmetic/engine/workplace-shifts.mjs
          cmp private/domain/learning-journey/price-check.mjs private/site/practice/quick-arithmetic/engine/price-check.mjs
          cmp private/domain/practice/feedback-v1.mjs private/site/practice/practice-feedback-v1.js
          cmp private/domain/practice/checklist-evaluation.mjs private/site/practice/checklist-evaluation.js
          cmp private/domain/practice/self-check-review.mjs private/site/practice/self-check-review.js
          cmp private/domain/practice/review-focus.mjs private/site/practice/review-focus.js
          cmp private/domain/practice/repeat-preparation.mjs private/site/practice/repeat-preparation.js
          cmp private/domain/practice/models/find-error-in-solution.v1.json private/site/practice/models/find-error-in-solution.v1.json
          cmp private/domain/practice/models/method-transfer.v1.json private/site/practice/models/method-transfer.v1.json
          cmp private/domain/practice/models/fact-or-assumption.v1.json private/site/practice/models/fact-or-assumption.v1.json
          cmp private/domain/practice/models/choose-strategy.v1.json private/site/practice/models/choose-strategy.v1.json
          cmp private/domain/practice/models/check-risks.v1.json private/site/practice/models/check-risks.v1.json
          cmp private/domain/practice/models/answer-objection.v1.json private/site/practice/models/answer-objection.v1.json
          cmp private/domain/practice/models/compare-alternatives.v1.json private/site/practice/models/compare-alternatives.v1.json
          cmp private/domain/practice/models/action-plan.v1.json private/site/practice/models/action-plan.v1.json
          cmp private/domain/practice/models/formulate-problem.v1.json private/site/practice/models/formulate-problem.v1.json
          cmp private/domain/practice/models/justify-decision.v1.json private/site/practice/models/justify-decision.v1.json
          cmp private/domain/practice/models/management-case.v1.json private/site/practice/models/management-case.v1.json
          cmp private/domain/practice/models/urgent-order.v1.json private/site/practice/models/urgent-order.v1.json
          node --check private/site/practice/assets-r6-clean/practice-player-U4wosZfh.js
          node --check private/site/practice/assets-r6-clean/run-Cq91mFXk.js
          node --check private/site/practice/assets-r6-clean/result-lQFostOC.js
          node --check private/site/practice/assets-r6-clean/index-D1kuNTQO.js
          node --check private/site/practice/assets-r6-clean/practice-core-ulGeKyHA.js
          node --check private/site/practice/assets-r6-clean/review-CrM-rL6l.js
          node --check private/site/practice/assets-r6-clean/model._slug-DZ9y8kMs.js
          node --check private/site/practice/repeat-preparation.js
          node --check private/site/practice/assets-r6-clean/practice-player-U4wosZfh.js
          node --check private/site/qa/d01-product-witness-2026-10-26/repeat-scenario-witness.mjs
          node --check private/site/practice/assets-r6-clean/results-b06FwAop.js
          node --check private/site/practice/self-check-review.js
          node --check private/site/qa/d01-product-witness-2026-10-26/product-witness.mjs
          node --check private/site/study/my-routes/practice-link.mjs
          node --check private/site/study/my-routes/practice-repeat.mjs
          node --test private/site/study/my-routes/practice-repeat.test.mjs
          node --test private/domain/practice/*.test.mjs
          node --test private/site/qa/d01-product-witness-2026-10-26/verify-model-guidance.test.mjs
          node --test private/site/qa/d01-product-witness-2026-10-26/repeat-focus-ui.test.mjs
          node --test private/site/qa/d01-product-witness-2026-10-26/repeat-comparison-ui.test.mjs
          node --experimental-strip-types --test private/domain/learning-journey/*.test.mjs
      - name: Run the original Learn/T2 site, Kernel and real browser witness
        shell: bash
        env:
          D01_T2_CHECKOUT: ${{ github.workspace }}/private/t2
          D01_EXPECTED_T2_HEAD: 9c64951cd78411283e8a416641c36d71e169fc1d
          D01_EXPECTED_SITE_HEAD: 5b95b49d2065074d4e557b18feaddde0dcb9f6da
          D01_SCREENSHOT_OUTPUT: ${{ runner.temp }}/d01-real-screens
          D01_CASE_FILE: ${{ github.workspace }}/private/domain/learning-journey/case-001-workplace-numeracy.json
          D01_CASE_002_FILE: ${{ github.workspace }}/private/domain/learning-journey/case-002-price-label-check.json
        run: node private/site/qa/d01-product-witness-2026-10-26/ci-real-screens.mjs
# Screenshots are used only inside the ephemeral runner to check layout.
# Nothing is published as a GitHub Actions artifact or committed to this repository.
