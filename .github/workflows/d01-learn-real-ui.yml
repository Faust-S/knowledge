name: D01 Learn original T2 product and user journey
on:
  push:
    branches: [work/2026-11-20-d01-real-ui]
    paths: [.github/workflows/d01-learn-real-ui.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d01-learn-real-ui
  cancel-in-progress: true
jobs:
  original-learn:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact original private Learn site
        uses: actions/checkout@v4
        with:
          repository: Faust-S/learn.iwxa.ru
          ref: 6860af044c0ee8095aba992f4a680b62e890a667
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - name: Checkout exact original Learn subject model
        uses: actions/checkout@v4
        with:
          repository: Faust-S/learn
          ref: 744be84d2639240ef8239fd6712ea8cb4fc67dc3
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/domain
      - name: Checkout original normative T2 and its qualified Kernel release
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: main
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/t2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Verify exact owners and run canonical linked-learning tests
        shell: bash
        run: |
          set -eu
          test "$(git -C private/t2 rev-parse HEAD)" = 9c64951cd78411283e8a416641c36d71e169fc1d
          test "$(git -C private/site rev-parse HEAD)" = 6860af044c0ee8095aba992f4a680b62e890a667
          test "$(git -C private/domain rev-parse HEAD)" = 744be84d2639240ef8239fd6712ea8cb4fc67dc3
          cmp private/domain/learning-journey/projection.ts private/site/t2/domain-modules/learn-results/learning-journey.ts
          cmp private/domain/learning-journey/today.ts private/site/t2/domain-modules/learn-results/learning-today.ts
          cmp private/domain/learning-journey/workplace-shifts.mjs private/site/practice/quick-arithmetic/engine/workplace-shifts.mjs
          cmp private/domain/learning-journey/price-check.mjs private/site/practice/quick-arithmetic/engine/price-check.mjs
          node --experimental-strip-types --test private/domain/learning-journey/*.test.mjs
      - name: Run the original Learn/T2 site, Kernel and real browser witness
        shell: bash
        env:
          D01_T2_CHECKOUT: ${{ github.workspace }}/private/t2
          D01_EXPECTED_T2_HEAD: 9c64951cd78411283e8a416641c36d71e169fc1d
          D01_EXPECTED_SITE_HEAD: 6860af044c0ee8095aba992f4a680b62e890a667
          D01_SCREENSHOT_OUTPUT: ${{ runner.temp }}/d01-real-screens
          D01_CASE_FILE: ${{ github.workspace }}/private/domain/learning-journey/case-001-workplace-numeracy.json
          D01_CASE_002_FILE: ${{ github.workspace }}/private/domain/learning-journey/case-002-price-label-check.json
        run: node private/site/qa/d01-product-witness-2026-10-26/ci-real-screens.mjs
# Screenshots are used only inside the ephemeral runner to check layout.
# Nothing is published as a GitHub Actions artifact or committed to this repository.
