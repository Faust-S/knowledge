name: D05 T3 actual local model engineering witness
on:
  push:
    branches: [test/2026-11-24-d05-t3-integration]
    paths: [.github/workflows/d05-t3-real-model.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/cehovod.ru
          ref: 5cddcca03e8dd68ccf1433724c8b6ae55f974210
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 9f41447197251d41e69fbcb98e52ef1050754ec2
          token: ${{ secrets.DOMEN }}
          path: assistant
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 326f725c44d69ac99f6b912241e9e8a6c3d716a5
          path: one-core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install pinned site dependencies
        working-directory: site
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/d05-t3-protected-npm.log" 2>&1 || { echo D05_T3_PROTECTED_NPM_FAIL; exit 1; }
      - name: Verify retained platform archive
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Faust-S/knowledge/actions/artifacts/14920233669/zip >"$RUNNER_TEMP/d05-t3-protected-artifact.zip"
          unzip -p "$RUNNER_TEMP/d05-t3-protected-artifact.zip" platform-inputs.zip >"$RUNNER_TEMP/d05-t3-protected-platform.zip"
          node scripts/t3-platform-inputs.mjs verify "$RUNNER_TEMP/d05-t3-protected-platform.zip" >"$RUNNER_TEMP/d05-t3-protected-platform.log" 2>&1 || { echo D05_T3_PROTECTED_PLATFORM_FAIL; exit 1; }
      - name: Prepare original Host for a fixed HTTPS loopback origin
        working-directory: site
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-protected-host.log"
          if ! npm run prepare:t3-host -- "$GITHUB_WORKSPACE/one-core/packages/t3-core" "$RUNNER_TEMP/d05-t3-protected-host" "$RUNNER_TEMP/d05-t3-protected-platform.zip" "$GITHUB_WORKSPACE/assistant" https://127.0.0.1:34567 >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_T3_HOST_[A-Z0-9_]+|TS[0-9]{4,6}' "$log" | sort -u | head -30 || true
            echo D05_T3_PROTECTED_HOST_FAIL
            exit 1
          fi
          echo D05_T3_PROTECTED_HOST_PASS
      - name: Assemble the real loopback T3 product
        working-directory: site
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-protected-build.log"
          if ! node scripts/build-cehovod-t3-local-site.mjs "$RUNNER_TEMP/d05-t3-protected-host" "$RUNNER_TEMP/d05-t3-protected-platform.zip" >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_[A-Z0-9_]+|IWXA_[A-Z0-9_]+|T3_[A-Z0-9_]+' "$log" | sort -u | head -30 || true
            echo D05_T3_PROTECTED_BUILD_FAIL
            exit 1
          fi
          echo D05_T3_PROTECTED_BUILD_PASS
      - name: Install original witness dependencies
        working-directory: one-core/packages/t3-core
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          npm ci --include=dev --no-audit --no-fund >"$RUNNER_TEMP/d05-t3-protected-witness-npm.log" 2>&1 || { echo D05_T3_WITNESS_NPM_FAIL; exit 1; }
          npx --no-install playwright install chromium >"$RUNNER_TEMP/d05-t3-protected-browser-install.log" 2>&1 || { echo D05_T3_WITNESS_BROWSER_INSTALL_FAIL; exit 1; }
      - name: Genuine light-profile local generation and cold-cache restart
        working-directory: site
        env:
          D05_T2_WITNESS_COPY: ${{ github.workspace }}/one-core/packages/t3-core
          D05_T3_MODEL_PROFILE: light
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-protected-model.log"
          code=0
          node scripts/d05-t3-real-model-witness.mjs >"$log" 2>&1 || code=$?
          grep -E '^D05_T3_REAL_MODEL_(PASS|FAIL) \{[A-Za-z0-9":{}, _-]+\}$' "$log" || true
          grep -Eo 'CEHOVOD_T3_MODEL_[A-Z0-9_]+' "$log" | sort -u | head -20 || true
          test "$code" -eq 0
          grep -q '^D05_T3_REAL_MODEL_PASS ' "$log"
      - name: Destroy temporary product, reports and source-bound input bytes
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/site/dist" "$GITHUB_WORKSPACE/site/.native-build" "$RUNNER_TEMP/d05-t3-protected-host"
          rm -f "$RUNNER_TEMP"/d05-t3-protected-*.log "$RUNNER_TEMP/d05-t3-protected-platform.zip" "$RUNNER_TEMP/d05-t3-protected-artifact.zip"
