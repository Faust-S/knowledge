name: D05 T3 actual model on hardware-required WebGPU
on:
  push:
    branches: [test/2026-11-24-d05-t3-integration]
    paths: [qualification/d05/t3-requests/real-model.json]
  workflow_dispatch:
  workflow_call:
    inputs:
      site_sha:
        type: string
        default: 'c31a6431105776dfdef8a5221f6fc04c867ad477'
      domain_sha:
        type: string
        default: '53d3f79b6e3c1bc36f3c507c065283181c1c0132'
      assistant_sha:
        type: string
        default: '5e3083788aa541921559de29d3457d4a52bbba00'
      grounded_advice:
        type: boolean
        default: false
      cross_service:
        type: boolean
        default: false
      witness_sha:
        type: string
        default: 'a27b765e55dc5fea9fa15b2537b0f21ec1b2149a'
      evaluator_sha:
        type: string
        default: '2f97a32d82231a5866cac80d44646e22015fc25c'
      profile_id:
        type: string
        default: 'balanced'
      release_candidate:
        type: boolean
        default: false
    secrets:
      DOMEN:
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: d05-t3-real-model-${{ github.ref }}
  cancel-in-progress: false
jobs:
  model:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/cehovod.ru
          ref: ${{ inputs.site_sha || 'c31a6431105776dfdef8a5221f6fc04c867ad477' }}
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/cehovod.ru
          ref: ${{ inputs.witness_sha || 'a27b765e55dc5fea9fa15b2537b0f21ec1b2149a' }}
          token: ${{ secrets.DOMEN }}
          path: model-witness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: ${{ inputs.assistant_sha || '5e3083788aa541921559de29d3457d4a52bbba00' }}
          token: ${{ secrets.DOMEN }}
          path: assistant
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 326f725c44d69ac99f6b912241e9e8a6c3d716a5
          path: one-core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/cehovod
          ref: ${{ inputs.domain_sha || '53d3f79b6e3c1bc36f3c507c065283181c1c0132' }}
          token: ${{ secrets.DOMEN }}
          path: domain
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/cehovod
          ref: ${{ inputs.evaluator_sha || '2f97a32d82231a5866cac80d44646e22015fc25c' }}
          token: ${{ secrets.DOMEN }}
          path: answer-diagnostics
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify exact product tree and separate witness-only changes
        shell: bash
        env:
          SITE_SHA: ${{ inputs.site_sha || 'c31a6431105776dfdef8a5221f6fc04c867ad477' }}
          WITNESS_SHA: ${{ inputs.witness_sha || 'a27b765e55dc5fea9fa15b2537b0f21ec1b2149a' }}
          DOMAIN_SHA: ${{ inputs.domain_sha || '53d3f79b6e3c1bc36f3c507c065283181c1c0132' }}
          EVALUATOR_SHA: ${{ inputs.evaluator_sha || '2f97a32d82231a5866cac80d44646e22015fc25c' }}
          PROFILE_ID: ${{ inputs.profile_id || 'balanced' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import {execFileSync} from "node:child_process";
          const git=(dir,args)=>execFileSync("git",["-C",dir,...args],{encoding:"utf8",maxBuffer:32*1024*1024,stdio:["ignore","pipe","pipe"]});
          const inventory=dir=>{
            const rows=git(dir,["ls-tree","-r","-z","HEAD"]).split("\0").filter(Boolean);
            const map=new Map(rows.map(row=>{
              const i=row.indexOf("\t");
              assert.ok(i>0);
              return [row.slice(i+1),row.slice(0,i)];
            }));
            assert.equal(map.size,rows.length);
            return map;
          };
          assert.equal(git("site",["rev-parse","HEAD"]).trim(),process.env.SITE_SHA);
          assert.equal(git("model-witness",["rev-parse","HEAD"]).trim(),process.env.WITNESS_SHA);
          const base=inventory("site"),test=inventory("model-witness");
          const paths=[...new Set([...base.keys(),...test.keys()])].filter(p=>base.get(p)!==test.get(p)).sort();
          assert.deepEqual(paths,[
            "scripts/d05-t3-real-model-witness.mjs",
            "scripts/lib/t3-model-install-consent.mjs",
            "scripts/lib/t3-model-install-consent.test.mjs"
          ]);
          assert.equal(git("domain",["rev-parse","HEAD"]).trim(),process.env.DOMAIN_SHA);
          assert.equal(git("answer-diagnostics",["rev-parse","HEAD"]).trim(),process.env.EVALUATOR_SHA);
          const owner=inventory("domain"),diagnostic=inventory("answer-diagnostics");
          const changed=[...new Set([...owner.keys(),...diagnostic.keys()])].filter(p=>owner.get(p)!==diagnostic.get(p)).sort();
          assert.deepEqual(changed,[
            "tests/assistant-answer-diagnostic.mjs",
            "tests/assistant-answer-role-evidence.test.mjs"
          ]);
          assert.ok(["light","balanced","extended"].includes(process.env.PROFILE_ID));
          console.log("D05_T3_HARDWARE_EXACT_PRODUCT_TREE_PASS");
          console.log("D05_T3_MODEL_EVALUATOR_TEST_ONLY_PASS");
          console.log("D05_T3_MODEL_REQUESTED_PROFILE "+process.env.PROFILE_ID);
          JS
          node --test model-witness/scripts/lib/t3-model-install-consent.test.mjs
          node --check model-witness/scripts/d05-t3-real-model-witness.mjs
      - name: Use the original hardware-test OpenSSL
        shell: bash
        run: |
          if ! brew list --versions openssl@3 >/dev/null 2>&1; then brew install openssl@3; fi
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Install original witness dependencies
        working-directory: one-core/packages/t3-core
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          npm ci --include=dev --no-audit --no-fund >"$RUNNER_TEMP/d05-t3-protected-witness-npm.log" 2>&1 || { echo D05_T3_WITNESS_NPM_FAIL; exit 1; }
          npx --no-install playwright install chromium >"$RUNNER_TEMP/d05-t3-protected-browser-install.log" 2>&1 || { echo D05_T3_WITNESS_BROWSER_INSTALL_FAIL; exit 1; }
      - name: Gate on actual nonfallback GPU compute before downloading the model
        working-directory: site
        env:
          D05_T2_WITNESS_COPY: ${{ github.workspace }}/one-core/packages/t3-core
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/lib/t3-webgpu-probe.test.mjs
          node --experimental-strip-types --test scripts/lib/t3-assistant-vite-config.test.mjs
          log="$RUNNER_TEMP/d05-t3-protected-gpu.log"
          code=0
          node scripts/check-t3-hardware-webgpu.mjs >"$log" 2>&1 || code=$?
          grep -E '^D05_T3_HARDWARE_PREFLIGHT \{"adapter":"[a-z-]+","supported":(true|false),"compute":(true|false),"reason":"[A-Z_]+"\}$' "$log" || true
          grep -Eo 'CEHOVOD_T3_GPU_[A-Z0-9_]+' "$log" | sort -u | head -10 || true
          test "$code" -eq 0
          grep -Fxq 'D05_T3_HARDWARE_PREFLIGHT {"adapter":"nonfallback-reported","supported":true,"compute":true,"reason":"READBACK"}' "$log"
      - name: Verify canonical cost context and bounded answer diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cmp -s domain/models/assistant-skills.json site/public/assets/cehovod-assistant-skills.json
          node --test answer-diagnostics/tests/assistant-answer-diagnostic.test.mjs answer-diagnostics/tests/assistant-answer-role-evidence.test.mjs
      - name: Install pinned site dependencies
        working-directory: site
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/d05-t3-protected-npm.log" 2>&1 || { echo D05_T3_PROTECTED_NPM_FAIL; exit 1; }
      - name: Verify retained platform archive
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Faust-S/knowledge/actions/artifacts/14920233669/zip >"$RUNNER_TEMP/d05-t3-protected-artifact.zip"
          unzip -p "$RUNNER_TEMP/d05-t3-protected-artifact.zip" platform-inputs.zip >"$RUNNER_TEMP/d05-t3-protected-platform.zip"
          node scripts/t3-platform-inputs.mjs verify "$RUNNER_TEMP/d05-t3-protected-platform.zip" >"$RUNNER_TEMP/d05-t3-protected-platform.log" 2>&1 || { echo D05_T3_PROTECTED_PLATFORM_FAIL; exit 1; }
      - name: Prepare original Host for a fixed HTTPS loopback origin
        working-directory: site
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-protected-host.log"
          if ! npm run prepare:t3-host -- "$GITHUB_WORKSPACE/one-core/packages/t3-core" "$RUNNER_TEMP/d05-t3-protected-host" "$RUNNER_TEMP/d05-t3-protected-platform.zip" "$GITHUB_WORKSPACE/assistant" https://127.0.0.1:34567 >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_T3_HOST_[A-Z0-9_]+|TS[0-9]{4,6}' "$log" | sort -u | head -30 || true
            node --input-type=module - "$log" <<'JS'
          import {readFileSync} from "node:fs";
          const raw=readFileSync(process.argv[2],"utf8");
          const checks=[
            ["ORIGINAL_ASSISTANT_IMPORT",/(?:Could not resolve|failed to resolve import|UNRESOLVED_IMPORT)[^\r\n]*\.\.\/src\/(?:catalog|engine|storage|domain-model-install)\.mjs/i],
            ["MODULE_RESOLUTION",/Could not resolve|failed to resolve import|UNRESOLVED_IMPORT|Cannot find (?:module|package)|ERR_MODULE_NOT_FOUND/i],
            ["NATIVE_DEPENDENCY",/ERR_DLOPEN_FAILED|wrong architecture|Cannot find module @rollup\/rollup|@tailwindcss\/oxide|esbuild.*(?:platform|binary)/i],
            ["PATH_ACCESS",/\b(?:ENOENT|EACCES|EPERM|ENAMETOOLONG|EISDIR)\b/],
            ["STATIC_ROUTE",/Missing Vite entry|Invalid base in dist/i],
            ["BUILD_PLUGIN",/PLUGIN_ERROR|RollupError|Transform failed|failed to load config/i],
            ["PROCESS_RESOURCE",/heap out of memory|SIGKILL|SIGABRT|ENOMEM/i]
          ];
          const phases=[...raw.matchAll(/CEHOVOD_T3_HOST_PHASE_([A-Z_]+)/g)];
          const kinds=checks.filter(([,pattern])=>pattern.test(raw)).map(([name])=>name);
          console.log("D05_T3_HOST_FAILURE_DIAG "+JSON.stringify({phase:phases.at(-1)?.[1]||"UNKNOWN",kinds:kinds.length?kinds:["UNCLASSIFIED"]}));
          JS
            echo D05_T3_PROTECTED_HOST_FAIL
            exit 1
          fi
          echo D05_T3_PROTECTED_HOST_PASS
      - name: Assemble the real loopback T3 product
        working-directory: site
        env:
          PUPPETEER_EXECUTABLE_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-protected-build.log"
          if ! node scripts/build-cehovod-t3-local-site.mjs "$RUNNER_TEMP/d05-t3-protected-host" "$RUNNER_TEMP/d05-t3-protected-platform.zip" >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_[A-Z0-9_]+|IWXA_[A-Z0-9_]+|T3_[A-Z0-9_]+' "$log" | sort -u | head -30 || true
            echo D05_T3_PROTECTED_BUILD_FAIL
            exit 1
          fi
          echo D05_T3_PROTECTED_BUILD_PASS
      - name: Verify real-model witness syntax
        working-directory: site
        run: node --check "$GITHUB_WORKSPACE/model-witness/scripts/d05-t3-real-model-witness.mjs"
      - name: Genuine selected-profile generation and cold-cache restart on nonfallback GPU
        working-directory: site
        env:
          D05_T2_WITNESS_COPY: ${{ github.workspace }}/one-core/packages/t3-core
          D05_T3_MODEL_PROFILE: ${{ inputs.profile_id || 'balanced' }}
          D05_T3_MODEL_CROSS_SERVICE: ${{ inputs.cross_service && '1' || '0' }}
          D05_T3_MODEL_GROUNDED_ADVICE: ${{ inputs.grounded_advice && '1' || '0' }}
          D05_T3_MODEL_EVALUATION_SOURCE: ${{ github.workspace }}/answer-diagnostics/tests/assistant-answer-diagnostic.mjs
          D05_T3_REQUIRE_HARDWARE_GPU: '1'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-protected-model.log"
          code=0
          node "$GITHUB_WORKSPACE/model-witness/scripts/d05-t3-real-model-witness.mjs" >"$log" 2>&1 || code=$?
          grep -E '^D05_T3_REAL_MODEL_(PASS|FAIL) \{[A-Za-z0-9":{}, _-]+\}$' "$log" || true
          grep -E '^D05_T3_REAL_MODEL_(INSTALL|CACHE_RELEASE|COLD_LOAD)_PASS$' "$log" || true
          grep -E '^D05_T3_MODEL_(ATTEMPT|COMPARISON|WORKER_EXIT|CACHE_RELEASE) \{[A-Za-z0-9":{}, _-]+\}$' "$log" || true
          grep -E '^D05_T3_MODEL_QUALITY \{[A-Za-z0-9":{}, _-]+\}$' "$log" || true
          grep -E '^D05_T3_MODEL_ROLE_EVIDENCE \{[A-Za-z0-9":{}, _-]+\}$' "$log" || true
          grep -E '^D05_T3_MODEL_PRICE_EVIDENCE \{[A-Za-z0-9":{}, _-]+\}$' "$log" || true
          grep -E '^D05_T3_MODEL_ADVICE_EVIDENCE \{[A-Za-z0-9":{}, _-]+\}$' "$log" || true
          grep -E '^D05_T3_MODEL_CROSS_SERVICE_EVIDENCE \{[A-Za-z0-9":{}, _-]+\}$' "$log" || true
          grep -Fx 'D05_T3_MODEL_CROSS_SERVICE_PASS_NOT_PRODUCT_ACCEPTED' "$log" || true
          grep -E '^D05_T3_MODEL_(CACHE_INSPECTION|CANCEL_DIAG|CANCEL_PASS) \{[A-Za-z0-9":{}, _-]+\}$' "$log" || true
          grep -Fx 'D05_T3_MODEL_INSTALL_CONFIRMATION_PASS' "$log" || true
          grep -E '^D05_T3_MODEL_GPU_PROBE \{"adapter":"[a-z-]+","supported":(true|false),"compute":(true|false),"reason":"[A-Z_]+"\}$' "$log" || true
          grep -E '^D05_T3_MODEL_GENERATION_RECEIPT \{"offline":(true|false),"elapsed":[0-9]+,"busy":(true|false),"characters":[0-9]+,"outcome":"[a-z-]+"\}$' "$log" | tail -70 || true
          grep -Eo 'CEHOVOD_T3_MODEL_[A-Z0-9_]+' "$log" | sort -u | head -20 || true
          test "$code" -eq 0
          grep -Fxq 'D05_T3_MODEL_CACHE_INSPECTION {"state":"missing"}' "$log"
          grep -Fxq 'D05_T3_MODEL_CANCEL_PASS {"cancelled":true,"workers":0,"externalRequests":0,"ready":false}' "$log"
          grep -Fxq 'D05_T3_MODEL_INSTALL_CONFIRMATION_PASS' "$log"
          grep -q '^D05_T3_REAL_MODEL_PASS ' "$log"
          if [ "$D05_T3_MODEL_GROUNDED_ADVICE" = 1 ]; then
            test "$(grep -c '^D05_T3_MODEL_ADVICE_EVIDENCE ' "$log")" -eq 4
          else
            test "$(grep -c '^D05_T3_MODEL_QUALITY ' "$log")" -eq 3
            test "$(grep -c '^D05_T3_MODEL_ROLE_EVIDENCE ' "$log")" -eq 3
            test "$(grep -c '^D05_T3_MODEL_PRICE_EVIDENCE ' "$log")" -eq 1
          fi
      - name: Require three comparable grounding observations and separate price evidence before release review
        if: ${{ !inputs.grounded_advice }}
        working-directory: site
        shell: bash
        env:
          PROFILE_ID: ${{ inputs.profile_id || 'balanced' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";
          const prefix="D05_T3_MODEL_QUALITY ";
          const lines=readFileSync(process.env.RUNNER_TEMP+"/d05-t3-protected-model.log","utf8").split(/\r?\n/);
          const receipts=key=>lines.filter(line=>line.startsWith(key)).map(line=>JSON.parse(line.slice(key.length)));
          const rows=receipts(prefix);
          const model=receipts("D05_T3_REAL_MODEL_PASS ");
          assert.equal(model.length,1);
          assert.equal(model[0].profile,process.env.PROFILE_ID);
          assert.equal(model[0].actualInference,true);
          assert.equal(model[0].semanticAcceptance,false);
          assert.equal(model[0].onlinePrice?.ok,true);
          const wanted=new Set(["cost:false","cost:true","missing-cost:true"]);
          assert.equal(rows.length,wanted.size);
          for(const row of rows){
            assert.ok(wanted.delete(row.scenario+":"+row.offline));
            assert.equal(row.semanticAcceptance,false);
            const expected=row.scenario==="cost"?4:3;
            if(row.checks!==expected||row.passed!==expected||row.unsupportedMoney!==0)
              throw Error("D05_T3_MODEL_GROUNDING_REVIEW_REQUIRED");
          }
          assert.equal(wanted.size,0);
          const roleRows=receipts("D05_T3_MODEL_ROLE_EVIDENCE ");
          const roleKeys=new Set(["cost:false","cost:true","missing-cost:true"]);
          assert.equal(roleRows.length,roleKeys.size);
          for(const row of roleRows){
            assert.ok(roleKeys.delete(row.scenario+":"+row.offline));
            assert.equal(row.semanticAcceptance,false);
            if(row.scenario==="cost"){
              assert.ok(["matched","conflicting","unresolved"].includes(row.batchRole));
              assert.ok(["matched","conflicting","unresolved"].includes(row.unitRole));
              if(row.conflictingRoles!==0||row.unresolvedRoles!==0||row.batchRole!=="matched"||row.unitRole!=="matched")
                throw Error("D05_T3_MODEL_ROLE_REVIEW_REQUIRED");
            }else{
              if(row.labels!==1||row.contiguousItems!==row.labels)
                throw Error("D05_T3_MODEL_ITEM_REVIEW_REQUIRED");
            }
          }
          assert.equal(roleKeys.size,0);
          const priceRows=receipts("D05_T3_MODEL_PRICE_EVIDENCE ");
          assert.equal(priceRows.length,1);
          const price=priceRows[0];
          assert.equal(price.semanticAcceptance,false);
          if(price.checks!==5||price.passed!==5||price.unsupportedMoney!==0||
             price.orderPriceRole!=="matched"||price.unitPriceRole!=="matched"||
             price.asksForVerification!==true||price.notAgreed!==true)
            throw Error("D05_T3_MODEL_PRICE_REVIEW_REQUIRED");
          console.log("D05_T3_MODEL_GROUNDING_OBSERVATIONS_PASS_NOT_SEMANTIC_ACCEPTANCE");
          JS
      - name: Require four exact-result and correct-choice observations (not semantic acceptance)
        if: ${{ inputs.grounded_advice }}
        working-directory: site
        shell: bash
        env:
          PROFILE_ID: ${{ inputs.profile_id || 'balanced' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";
          const lines=readFileSync(process.env.RUNNER_TEMP+"/d05-t3-protected-model.log","utf8").split(/\r?\n/);
          const receipts=key=>lines.filter(line=>line.startsWith(key)).map(line=>JSON.parse(line.slice(key.length)));
          const profile=process.env.PROFILE_ID;
          const model=receipts("D05_T3_REAL_MODEL_PASS ");
          assert.equal(model.length,1);
          const m=model[0];
          assert.equal(m.profile,profile);
          assert.equal(m.groundedAdvice,true);
          assert.equal(m.actualInference,true);
          assert.equal(m.serverStopped,true);
          assert.equal(m.browserRestarted,true);
          assert.equal(m.semanticAcceptance,false);
          assert.equal(m.productAccepted,false);
          for(const k of ["online","onlinePrice","offline","missingCost"]){
            assert.equal(m[k]?.ok,true);
            assert.equal(m[k]?.busyObserved,true);
            assert.ok(Number.isSafeInteger(m[k]?.workerCount)&&m[k].workerCount>0);
          }
          const keys=new Set(["cost:false","cost:true","price:false","missing-cost:true"]);
          const rows=receipts("D05_T3_MODEL_ADVICE_EVIDENCE ");
          assert.equal(rows.length,4);
          for(const row of rows){
            assert.ok(keys.delete(row.scenario+":"+row.offline));
            assert.equal(row.exactSource,true);
            assert.equal(row.validChoice,true);
            assert.equal(row.expectedChoice,true);
            assert.equal(row.abstained,false);
            assert.equal(row.busyObserved,true);
            assert.ok(Number.isSafeInteger(row.workerCount)&&row.workerCount>0);
            assert.equal(row.semanticAcceptance,false);
          }
          assert.equal(keys.size,0);
          for(const legacy of ["QUALITY","ROLE_EVIDENCE","PRICE_EVIDENCE"])assert.equal(receipts("D05_T3_MODEL_"+legacy+" ").length,0);
          console.log("D05_T3_GROUNDED_ADVICE_OBSERVATIONS_PASS_NOT_PRODUCT_ACCEPTED");
          JS
      - name: Require actual offline cross-service continuity and explicit abstention
        if: ${{ inputs.cross_service }}
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";
          const lines=readFileSync(process.env.RUNNER_TEMP+"/d05-t3-protected-model.log","utf8").split(/\r?\n/);
          const receipts=prefix=>lines.filter(line=>line.startsWith(prefix)).map(line=>JSON.parse(line.slice(prefix.length)));
          const model=receipts("D05_T3_REAL_MODEL_PASS ");
          assert.equal(model.length,1);
          assert.equal(model[0].groundedAdvice,true);
          assert.equal(model[0].actualInference,true);
          assert.equal(model[0].serverStopped,true);
          assert.equal(model[0].browserRestarted,true);
          assert.equal(model[0].crossServiceScenarios,3);
          assert.equal(model[0].productAccepted,false);
          const expected=new Map([["materials-shortage",false],["materials-unrelated",true],["route-capacity",false]]);
          const rows=receipts("D05_T3_MODEL_CROSS_SERVICE_EVIDENCE ");
          assert.equal(rows.length,expected.size);
          for(const row of rows){
            assert.ok(expected.has(row.scenario));
            const abstain=expected.get(row.scenario);
            expected.delete(row.scenario);
            assert.equal(row.expectAbstention,abstain);
            assert.equal(row.abstained,abstain);
            assert.equal(row.validChoice,!abstain);
            for(const k of ["exactSource","expectedChoice","busyObserved","sameWorker","sourceUnchanged","controlsUnchanged","workspaceUnchanged","offline"])
              assert.equal(row[k],true);
            assert.ok(Number.isSafeInteger(row.milliseconds)&&row.milliseconds>=0);
            assert.equal(row.semanticAcceptance,false);
          }
          assert.equal(expected.size,0);
          assert.equal(lines.filter(line=>line==="D05_T3_MODEL_CROSS_SERVICE_PASS_NOT_PRODUCT_ACCEPTED").length,1);
          console.log("D05_T3_CROSS_SERVICE_GATE_PASS_NOT_PRODUCT_ACCEPTED");
          JS
