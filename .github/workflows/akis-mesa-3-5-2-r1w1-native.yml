name: AKIS Mesa 3.5.2 R1-W1 original unfinished Work

on:
  push:
    branches:
      - work/2026-11-23-akis-r1w1-original-wip-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-original-mesa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install original Mesa 3.5.2 and pytest
        run: |
          python -m pip install --disable-pip-version-check "mesa==3.5.2" "pytest>=8,<10"
          python -c "import mesa; assert mesa.__version__ == '3.5.2'; print('ORIGINAL_MESA_3_5_2_PASS')"
      - name: Compile original AKIS
        run: python -m compileall -q qualifications/akis_2026_11_21/research
      - name: R1-W1 interrupted Work acceptance tests
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r1w1_original_wip_mesa.py
      - name: R1-W2 shared Work and material contract
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r1w2_cross_engine_parity_mesa.py
      - name: Full original AKIS regression
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests
