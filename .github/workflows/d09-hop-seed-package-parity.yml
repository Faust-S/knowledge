name: D09 HOP native seed-to-IWXA verifier
on:
  push:
    branches: [work/2026-11-02-pipeline-foundation]
    paths: [.github/workflows/d09-hop-seed-package-parity.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/hop.iwxa.ru
          ref: b53718f9e63a9b2683f9013bc81827ebbae18395
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact locked dependencies
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-native-npm.log" 2>&1 || {
            echo D09_NATIVE_SEED_NPM=FAIL; exit 1;
          }
          echo D09_NATIVE_SEED_NPM=PASS
      - name: Exercise real seed Remix to IWXA canonical roundtrip
        shell: bash
        run: |
          npx vitest run src/content-system/__tests__/seed-export-real-package.test.ts > "$RUNNER_TEMP/d09-seed.log" 2>&1 || {
            echo D09_NATIVE_SEED_PACKAGES=FAIL
            grep -E 'D09_SEED_ISSUE=' "$RUNNER_TEMP/d09-seed.log" | sort -u | head -30 || true
            grep -E 'Tests .* failed|Test Files .* failed' "$RUNNER_TEMP/d09-seed.log" | tail -4 || true
            exit 1
          }
          echo D09_NATIVE_SEED_PACKAGES=PASS
