name: D09 HOP native seed-to-IWXA verifier
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/hop.iwxa.ru
          ref: 7fdb2b21b56ed49b037752ca2938567c591eb990
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact locked dependencies
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-native-npm.log" 2>&1 || {
            echo D09_NATIVE_SEED_NPM=FAIL; exit 1;
          }
          echo D09_NATIVE_SEED_NPM=PASS
      - name: Generate normative HOP validators before Vitest
        shell: bash
        run: |
          npx tsx scripts/generate-hop-standalone.ts > "$RUNNER_TEMP/d09-schemas.log" 2>&1 || {
            echo D09_NATIVE_SCHEMAS=FAIL; exit 1;
          }
          echo D09_NATIVE_SCHEMAS=PASS
      - name: Exercise real seed Remix to IWXA canonical roundtrip
        shell: bash
        run: |
          npx tsx scripts/d09-seed-package-diagnostic.ts > "$RUNNER_TEMP/d09-seed.log" 2>&1 || {
            echo D09_NATIVE_SEED_PACKAGES=FAIL
            grep -E 'D09_SEED_ERROR=|D09_SEEDS_(TOTAL|FAILED)=' "$RUNNER_TEMP/d09-seed.log" | sort -u | head -35 || true
            grep -E 'Error:|Cannot find|Failed to resolve|Test Files|Tests |Error [A-Z]|Unhandled' "$RUNNER_TEMP/d09-seed.log" | sed -E 's#/(home|tmp|mnt)/[^[:space:]]+#<private-path>#g' | cut -c1-150 | tail -12 || true
            grep -E 'Tests .* failed|Test Files .* failed' "$RUNNER_TEMP/d09-seed.log" | tail -4 || true
            exit 1
          }
          grep -E 'D09_SEEDS_(TOTAL|FAILED)=' "$RUNNER_TEMP/d09-seed.log" | tail -2 || true
          echo D09_NATIVE_SEED_PACKAGES=PASS
      - name: Typecheck updated creative-chain guided editing
        run: |
          npm run typecheck > "$RUNNER_TEMP/d09-updated-types.log" 2>&1 || {
            echo D09_SEED_TYPES=FAIL
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/d09-updated-types.log" | head -12 || true
            exit 1
          }
          echo D09_SEED_TYPES=PASS
      - name: Verify all first-party seed fidelity and UUIDv7 Remix regressions
        shell: bash
        run: |
          npx vitest run src/lib/__tests__/remix.test.ts src/content-system/__tests__/seed-fidelity.test.ts src/templates/__tests__/completion-event-contract.test.ts src/integrations/t2/result-source-check.test.ts > "$RUNNER_TEMP/d09-seed-regressions.log" 2>&1 || {
            echo D09_SEED_REGRESSIONS=FAIL
            grep -E 'Test Files|Tests |FAIL|AssertionError' "$RUNNER_TEMP/d09-seed-regressions.log" | cut -c1-150 | tail -8 || true
            exit 1
          }
          echo D09_SEED_REGRESSIONS=PASS
