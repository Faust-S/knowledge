name: d05-cehovod-hosting-apache
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apache:
    name: D05 canonical redirects and real Apache cache semantics
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact private site without publishing source or dist
        env:
          DOMEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          test -n "${DOMEN:-}" || { echo "D05_DOMEN=UNAVAILABLE"; exit 1; }
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DOMEN" | base64 | tr -d '\r\n')"
          if ! GIT_TERMINAL_PROMPT=0 git -c "http.extraheader=$header" clone --quiet --depth 1 --single-branch --branch work/2026-10-23-t2-site-only --no-tags https://github.com/Faust-S/cehovod.ru.git site >/dev/null 2>&1; then
            echo "D05_PRIVATE_SITE=UNAVAILABLE"
            exit 1
          fi
          test "$(git -C site rev-parse HEAD)" = "0ada4f082a39ec9a7bf2be3f75b57ebc5ebc39b4" || { echo "D05_SITE_PIN=FAIL"; exit 1; }
          echo "D05_SITE_PIN=PASS"
          unset header DOMEN
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Prepare Apache and site check tools
        run: |
          set -euo pipefail
          if ! command -v apache2 >/dev/null 2>&1 && ! command -v httpd >/dev/null 2>&1; then
            sudo apt-get update -qq > "$RUNNER_TEMP/d05-apt-update.log" 2>&1
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq apache2 > "$RUNNER_TEMP/d05-apt-install.log" 2>&1
          fi
          (cd site && npm ci --no-audit --no-fund) > "$RUNNER_TEMP/d05-install.log" 2>&1
          echo "D05_APACHE_RUNTIME=AVAILABLE"
          echo "D05_NPM_CI=PASS"
      - name: Prove real production Apache rules with disposable static fixture
        run: |
          set -euo pipefail
          cd site
          mkdir -p dist/workspace dist/assets dist/_iwxa/runtime/0.3.6
          cp public/.htaccess dist/.htaccess
          printf '%s\n' '<!doctype html><title>CehoVod</title>' > dist/index.html
          printf '%s\n' '<!doctype html><title>404</title>' > dist/404.html
          printf '%s\n' '<!doctype html><title>Workspace</title>' > dist/workspace/index.html
          printf '%s\n' '{"origin":"https://cehovod.ru"}' > dist/_iwxa/domain.json
          printf '%s\n' 'console.log("runtime");' > dist/_iwxa/runtime/0.3.6/runtime.js
          printf '%s\n' 'body{}' > dist/assets/cehovod-workspace.css
          printf '%s\n' 'console.log("hashed");' > dist/assets/app-ABCDEF123456.js
          npm run check:htaccess:strict
          echo "D05_APACHE_HTTPS_WWW_404_CACHE=PASS"
          echo "D05_DIST_PUBLISHED=NO"
