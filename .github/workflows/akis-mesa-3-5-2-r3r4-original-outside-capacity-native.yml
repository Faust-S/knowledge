name: AKIS Mesa 3.5.2 R3-R4 original outside option capacity

on:
  push:
    branches:
      - work/2026-11-23-akis-r3r4-original-outside-capacity-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-outside-resource:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install official Mesa 3.5.2
        run: |
          python -m pip install --disable-pip-version-check "mesa==3.5.2" "pytest>=8,<10"
          python -c "import mesa; assert mesa.__version__ == '3.5.2'"
      - name: Compile entire original research package
        run: python -m compileall -q qualifications/akis_2026_11_21/research
      - name: Test original outside capacity and owner choice
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r3r4_original_owner_outside_capacity_mesa.py
      - name: Full original AKIS Mesa regression
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests
      - name: Export deterministic owner-minimized resource evidence
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_r3r4_original_outside_capacity_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: akis-original-outside-capacity-${{ matrix.os }}
          if-no-files-found: error
          path: qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r3r4_original_outside_capacity_evidence.json
