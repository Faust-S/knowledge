name: d05-resource-identity-qualify
on:
  push:
    branches:
      - test/2026-11-18-d05-source-qualification
    paths:
      - .github/workflows/d05-resource-identity-qualify-20261123.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Read pinned private sources ephemerally
        env:
          DOMEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          test -n "${DOMEN:-}" || { echo "D05_MULTI_READ=FAIL"; exit 1; }
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DOMEN" | base64 | tr -d '\r\n')"
          GIT_TERMINAL_PROMPT=0 git -c "http.extraheader=$header" clone --quiet --depth 1 --single-branch --branch work/2026-10-23-t2-site-only https://github.com/Faust-S/cehovod.ru.git site >/dev/null 2>&1 || { echo "D05_MULTI_READ=FAIL"; exit 1; }
          test "$(git -C site rev-parse HEAD)" = "2b8113a2de2d718b86a122cc5363e8f438ff8e5b" || { echo "D05_MULTI_SITE_PIN=FAIL"; exit 1; }
          unset header DOMEN
          echo "D05_MULTI_SITE_PIN=PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Format temporary copy and export non-source patch
        run: |
          set -euo pipefail
          cd site
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d05-multi-install.log" 2>&1 || { echo "D05_MULTI_INSTALL=FAIL"; exit 1; }
          echo "D05_MULTI_INSTALL=PASS"
          ./node_modules/.bin/prettier --write src/lib/shop-capacity.ts src/lib/capacity-resource-scope.ts src/lib/capacity-resource-scope.test.ts src/host/dispatch-capacity.ts src/host/dispatch-capacity.test.ts src/host/CehovodCapacityPanel.tsx src/host/CehovodCapacityPanel.regression.test.ts scripts/d05-first-use-real-kernel-witness.mjs > "$RUNNER_TEMP/d05-multi-prettier.log" 2>&1 || { echo "D05_MULTI_FORMAT=FAIL"; exit 1; }
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          names = [
              "src/lib/shop-capacity.ts",
              "src/lib/capacity-resource-scope.ts",
              "src/lib/capacity-resource-scope.test.ts",
              "src/host/dispatch-capacity.ts",
              "src/host/dispatch-capacity.test.ts",
              "src/host/CehovodCapacityPanel.tsx",
              "src/host/CehovodCapacityPanel.regression.test.ts",
              "scripts/d05-first-use-real-kernel-witness.mjs",
          ]
          punctuation = set('.,;:!?()[]{}\'"=<>+*/|&-')
          def partition(source):
              anchors, gaps = [], ['']
              for char in source:
                  if char.isspace() or char in punctuation:
                      gaps[-1] += char
                  else:
                      anchors.append(char)
                      gaps.append('')
              return anchors, gaps
          for name in names:
              original = subprocess.check_output(["git", "show", "HEAD:" + name]).decode("utf-8")
              formatted = pathlib.Path(name).read_text(encoding="utf-8")
              a, ag = partition(original)
              b, bg = partition(formatted)
              if a != b:
                  print("D05_SEPARATOR_ANCHORS_CHANGED="+name)
                  raise SystemExit(2)
              deltas = [[i, old, new] for i, (old, new) in enumerate(zip(ag, bg)) if old != new]
              if len(deltas) > 3000:
                  print("D05_SEPARATOR_EXCESS_DELTA="+name)
                  raise SystemExit(3)
              rebuilt = bg[0] + ''.join(char + bg[i + 1] for i, char in enumerate(a))
              if rebuilt != formatted:
                  raise SystemExit("D05_SEPARATOR_RECONSTRUCTION_INVALID")
              payload = json.dumps({
                  "path": name,
                  "before": hashlib.sha256(original.encode()).hexdigest(),
                  "after": hashlib.sha256(formatted.encode()).hexdigest(),
                  "separatorEdits": deltas,
              }, ensure_ascii=True, separators=(',',':'))
              print("D05_SEPARATOR_PATCH="+base64.b64encode(payload.encode()).decode())
              print("D05_SEPARATOR_EDIT_COUNT="+name+":"+str(len(deltas)))
          print("D05_PRIVATE_CODE_DISCLOSED=NO")
          PY
      - name: Execute subject tests, type check and lint
        run: |
          set -euo pipefail
          cd site
          if ./node_modules/.bin/vitest run src/lib/capacity-resource-scope.test.ts src/lib/capacity-decision.test.ts src/lib/shop-capacity.test.ts src/host/CehovodCapacityPanel.regression.test.ts src/host/dispatch-capacity.test.ts --reporter=json --outputFile="$RUNNER_TEMP/d05-multi-tests.json" > "$RUNNER_TEMP/d05-multi-tests.log" 2>&1; then
            echo "D05_MULTI_VITEST=PASS"
          else
            echo "D05_MULTI_VITEST=FAIL"
            if test -f "$RUNNER_TEMP/d05-multi-tests.json"; then
              node - <<'NODE'
          const fs=require("node:fs"), path=require("node:path");
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/d05-multi-tests.json","utf8"));
          for(const f of x.testResults||[]){
            const nums=(f.assertionResults||[]).flatMap((t,i)=>t.status==="failed"?[i+1]:[]);
            if(nums.length)console.log("D05_MULTI_FAILED_ORDINALS="+path.basename(f.name||"unknown")+":"+nums.join(","));
          }
          NODE
            fi
            exit 1
          fi
          if npm run typecheck > "$RUNNER_TEMP/d05-multi-typecheck.log" 2>&1; then
            echo "D05_MULTI_TYPECHECK=PASS"
          else
            echo "D05_MULTI_TYPECHECK=FAIL"
            python3 - <<'PY'
          import os,pathlib,re
          s=pathlib.Path(os.environ["RUNNER_TEMP"]+"/d05-multi-typecheck.log").read_text(errors="replace")
          matches=re.findall(r"(src/[A-Za-z0-9_./-]+)\((\d+),(\d+)\): error (TS\d+)",s)
          print("D05_MULTI_TYPE_CODES="+",".join(f"{a}:{b}:{c}:{d}" for a,b,c,d in matches[:20]))
          PY
            exit 1
          fi
          if ./node_modules/.bin/eslint src/lib/capacity-resource-scope.ts src/lib/capacity-resource-scope.test.ts src/lib/shop-capacity.ts src/host/dispatch-capacity.ts src/host/dispatch-capacity.test.ts src/host/CehovodCapacityPanel.tsx src/host/CehovodCapacityPanel.regression.test.ts scripts/d05-first-use-real-kernel-witness.mjs > "$RUNNER_TEMP/d05-multi-eslint.log" 2>&1; then
            echo "D05_MULTI_ESLINT=PASS"
          else
            echo "D05_MULTI_ESLINT=FAIL"
            exit 1
          fi
