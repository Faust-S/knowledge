name: Admin V8 native employee Workspace rights, scoped source build
on:
  push:
    branches:
      - work/2026-11-23-admin03-employee-workspace-rights
    paths:
      - .github/workflows/t3-admin03-employee-native-source-build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-check:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 790c9dd270a2e7a11aead6a9ee7666c6d7b677fc
          token: ${{ secrets.T3 || secrets.DOMEN }}
          sparse-checkout: |
            interop
            access-control
            reconciliation
          persist-credentials: false
          path: .private/t3
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: dcea0ec58e7c4c494ccc1958c74cdfd5b425d45c
          persist-credentials: false
          path: .private/center
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: c225e1b8d35e87e5de55dbb9c0c8dbe564d8fb08
          sparse-checkout: |
            src
          persist-credentials: false
          path: .private/atlas
      - name: Stage pinned original Atlas dependency for Center Vite
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((& git -C .private/atlas rev-parse HEAD).Trim() -cne 'c225e1b8d35e87e5de55dbb9c0c8dbe564d8fb08'){throw 'ORIGINAL_ATLAS_PIN_CHANGED'}
          New-Item -ItemType Directory -Force -Path '.private/center/vendor/atlas' | Out-Null
          Copy-Item '.private/atlas/src' '.private/center/vendor/atlas/src' -Recurse -Force
          if(!(Test-Path '.private/center/vendor/atlas/src/core.mjs')){throw 'ORIGINAL_ATLAS_VENDOR_NOT_STAGED'}
      - name: Pin immutable native products and parse real original owner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((& git -C .private/t3 rev-parse HEAD).Trim() -cne '790c9dd270a2e7a11aead6a9ee7666c6d7b677fc'){throw 'ORIGINAL_T3_PIN_CHANGED'}
          if((& git -C .private/center rev-parse HEAD).Trim() -cne 'dcea0ec58e7c4c494ccc1958c74cdfd5b425d45c'){throw 'CENTER_V8_PIN_CHANGED'}
          node --check '.private/t3/interop/native-admin-d3.mjs' *> $null
          if($LASTEXITCODE -ne 0){throw 'ORIGINAL_T3_D3_NATIVE_SYNTAX_FAILED'}
          rustfmt --edition 2021 --emit stdout '.private/center/src-tauri/src/cen03_native.rs' *> $null
          if($LASTEXITCODE -ne 0){throw 'CENTER_D3_NATIVE_RUST_SYNTAX_FAILED'}
          Write-Host 'EMPLOYEE_WORKSPACE_ORIGINAL_NATIVE_SOURCE_SYNTAX_PASS'
      - name: Build exact Center React/Vite with real employee rights UI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'center-npm-install.log'
          Push-Location '.private/center'
          try {
            & npm install --no-audit --no-fund *> $log
          } finally {Pop-Location}
          if($LASTEXITCODE -ne 0){
            $err=Get-Content -LiteralPath $log -Raw
            $codes=[regex]::Matches($err,'(?i)(?:npm error code |npm ERR! code )(E[A-Z0-9_]+)')
            if($codes.Count){Write-Host ('CENTER_NPM_ERROR_CODE='+$codes[$codes.Count-1].Groups[1].Value)}
            else{Write-Host 'CENTER_NPM_FAILURE_UNCLASSIFIED'}
            throw 'CENTER_V8_NATIVE_RIGHTS_DEPENDENCIES_FAILED'
          }
          $buildLog=Join-Path $env:RUNNER_TEMP 'center-typescript-vite.log'
          & npm run build --prefix '.private/center' *> $buildLog
          if($LASTEXITCODE -ne 0){
            $lines=Get-Content -LiteralPath $buildLog
            foreach($line in ($lines | Where-Object {
              $_ -match 'error TS[0-9]{4}:' -or
              $_ -match '^error during build:' -or
              $_ -match '^Error:' } | Select-Object -First 12)){
              Write-Host ('CENTER_BUILD_DIAGNOSTIC '+$line)
            }
            for($i=0;$i -lt $lines.Count;$i++){
              if($lines[$i] -match '^error during build:'){
                $end=[Math]::Min($lines.Count-1,$i+6)
                for($k=$i+1;$k -le $end;$k++){
                  $candidate=$lines[$k]
                  if($candidate -match '^(\s*\[vite\]|\s*\[rollup\]|\s*Could not|\s*Failed|\s*Error|\s*\[plugin|\s*at\s)' -or
                     $candidate -match 'No such file|Cannot find|Could not resolve'){
                    Write-Host ('CENTER_VITE_FAILURE '+$candidate)
                  }
                }
              }
            }
            throw 'CENTER_V8_NATIVE_RIGHTS_TYPESCRIPT_OR_VITE_FAILED'
          }
          Write-Host 'CENTER_V8_ORIGINAL_EMPLOYEE_WORKSPACE_UI_TYPESCRIPT_VITE_PASS'
