name: d06-private-product-qualification

# Isolated public CI control plane. Private source, dist, logs, and secrets
# remain on the ephemeral Windows runner. No PR trigger or artifact upload.
on:
  push:
    branches:
      - test/2026-11-18-d06-qualification
    paths:
      - .github/workflows/d06-private-product-qualification.yml

permissions:
  contents: read

concurrency:
  group: d06-private-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-d06:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Verify DOMEN read access separately for D06 and T2
        shell: bash
        env:
          DOMEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOMEN:-}" ]; then
            echo "D06_ACCESS=MISSING_DOMEN_SECRET"
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$DOMEN" | base64 | tr -d '\r\n')"
          for repo in komplektovod komplektovod.ru T2; do
            if GIT_TERMINAL_PROMPT=0 git -c "http.extraheader=AUTHORIZATION: basic ${auth}" \
              ls-remote --exit-code "https://github.com/Faust-S/${repo}.git" HEAD \
              >/dev/null 2>&1; then
              echo "D06_ACCESS_${repo}=PASS"
            else
              echo "D06_ACCESS_${repo}=DENIED"
              exit 1
            fi
          done
      - name: Checkout pinned D06 subject logic (runner only)
        uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod
          ref: ce66412a32049701a241dcdf383a32fb7d1aeeb0
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/domain
      - name: Checkout pinned D06 site (runner only)
        uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod.ru
          ref: dd6f5b83c01b5fa6ae6c82c09194fec292839822
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - name: Checkout qualified T2 source revision (runner only)
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: 9c64951cd78411283e8a416641c36d71e169fc1d
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/t2
      - name: Set up Node.js matching Windows qualification
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies privately
        shell: pwsh
        working-directory: private/site
        run: |
          $log = Join-Path $env:RUNNER_TEMP "d06-npm-ci-private.txt"
          & npm ci --no-audit --no-fund *> $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "D06_NPM_CI=FAIL"
            exit 1
          }
          Write-Host "D06_NPM_CI=PASS"
      - name: Apply formatting to the ephemeral private checkout only
        shell: pwsh
        working-directory: private/site
        run: |
          $log = Join-Path $env:RUNNER_TEMP "d06-format-ephemeral-private.txt"
          & npm run format:lint:apply *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_EPHEMERAL_FORMAT=FAIL"; exit 1 }
          & git diff --check *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_EPHEMERAL_DIFF_CHECK=FAIL"; exit 1 }
          Write-Host "D06_EPHEMERAL_FORMAT=PASS"
      - name: Check D06 source, native Host, and regression tests
        continue-on-error: true
        shell: pwsh
        working-directory: private/site
        run: |
          $ErrorActionPreference = "Continue"
          $tests = @(
            "check", "test", "build:host-module",
            "test:case-040", "test:case-040:supplier",
            "test:case040:procurement"
          )
          $failed = 0
          foreach ($test in $tests) {
            $safe = $test.Replace(":", "-")
            $log = Join-Path $env:RUNNER_TEMP ("d06-" + $safe + "-private.txt")
            & npm run $test *> $log
            $code = $LASTEXITCODE
            $status = if ($code -eq 0) { "PASS" } else { "FAIL" }
            Write-Host ("D06_" + $safe + "=" + $status)
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value (
              "| " + $safe + " | " + $status + " |"
            )
            if ($code -ne 0) { $failed += 1 }
          }
          if ($failed -gt 0) {
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "d06-source-failed.flag") -Value "1"
            exit 1
          }
      - name: Install browser dependencies for existing static QA
        shell: pwsh
        working-directory: private/site
        run: |
          $log = Join-Path $env:RUNNER_TEMP "d06-browser-setup-private.txt"
          & npm run setup:browser *> $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "D06_BROWSER_SETUP=FAIL"
            exit 1
          }
          Write-Host "D06_BROWSER_SETUP=PASS"
      - name: Run complete static qualification on published source
        shell: pwsh
        working-directory: private/site
        timeout-minutes: 50
        run: |
          $log = Join-Path $env:RUNNER_TEMP "d06-static-check-private.txt"
          & npm run build:static:check *> $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "D06_STATIC_AGGREGATE=FAIL"
            # The complete log remains private on this Windows runner.
            # Output only public npm stage labels, numeric spec ordinals and error categories.
            $body = Get-Content -LiteralPath $log -Raw
            $stages = [regex]::Matches($body, '(?m)^>\s+[^\r\n]+\s+(check|test|build:static|check:static|test:e2e|check:seo|check:external-assets)\s*
          Write-Host "D06_STATIC_AGGREGATE=PASS"
      - name: Assert source gate after all available diagnostics
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP "d06-source-failed.flag")) {
            Write-Host "D06_SOURCE_GATE_FINAL=FAIL"
            exit 1
          }
          Write-Host "D06_SOURCE_GATE_FINAL=PASS"
      - name: State privacy boundary
        if: always()
        shell: pwsh
        run: |
          Write-Host "D06_PUBLIC_ARTIFACT_UPLOADS=0"
          Write-Host "D06_PRIVATE_SOURCE_LOGS=RUNNER_LOCAL_ONLY"
)
            $stageNames = @($stages | ForEach-Object { $_.Groups[1].Value })
            if ($stageNames.Count) {
              Write-Host ("D06_AGGREGATE_LAST_NPM_STAGE=" + ($stageNames | Select-Object -Last 1))
              Write-Host ("D06_AGGREGATE_LAST_STAGES=" + (($stageNames | Select-Object -Last 6) -join ","))
            } else {
              Write-Host "D06_AGGREGATE_LAST_NPM_STAGE=UNKNOWN"
            }
            $registered = @(git ls-files "tests/e2e/*.spec.ts" | Sort-Object)
            $failing = [System.Collections.Generic.HashSet[int]]::new()
            foreach ($m in [regex]::Matches($body, '(?:tests[/\\]e2e[/\\])([a-zA-Z0-9.-]+\.spec\.ts)(?::\d+)?')) {
              $path = "tests/e2e/" + $m.Groups[1].Value
              $index = [array]::IndexOf($registered, $path)
              if ($index -ge 0) { [void]$failing.Add($index + 1) }
            }
            Write-Host ("D06_AGGREGATE_MENTIONED_SPEC_ORDINALS=" + ((@($failing) | Sort-Object | Select-Object -First 25) -join ","))
            foreach ($kind in @("TimeoutError","AssertionError","Test timeout","browserType.launch","ERR_CONNECTION","ECONNREFUSED","ERR_CERT","No tests found","not ok","EPIPE")) {
              $safe = $kind.Replace(" ","_").Replace(".","_").ToUpperInvariant()
              $count = ([regex]::Matches($body, [regex]::Escape($kind))).Count
              if ($count -gt 0) { Write-Host ("D06_AGGREGATE_CLASS_" + $safe + "=" + $count) }
            }
            $summary = [regex]::Matches($body, '(\d+)\s+(failed|passed|skipped|timed out)')
            foreach ($m in ($summary | Select-Object -Last 5)) {
              Write-Host ("D06_AGGREGATE_TEST_COUNT_" + $m.Groups[2].Value.ToUpperInvariant().Replace(" ","_") + "=" + $m.Groups[1].Value)
            }
            exit 1
          }
          Write-Host "D06_STATIC_AGGREGATE=PASS"
      - name: Assert source gate after all available diagnostics
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP "d06-source-failed.flag")) {
            Write-Host "D06_SOURCE_GATE_FINAL=FAIL"
            exit 1
          }
          Write-Host "D06_SOURCE_GATE_FINAL=PASS"
      - name: State privacy boundary
        if: always()
        shell: pwsh
        run: |
          Write-Host "D06_PUBLIC_ARTIFACT_UPLOADS=0"
          Write-Host "D06_PRIVATE_SOURCE_LOGS=RUNNER_LOCAL_ONLY"
