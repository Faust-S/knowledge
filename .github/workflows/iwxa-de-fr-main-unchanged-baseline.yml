name: IWXA main original DE FR source baseline
on:
  push:
    branches: [work/2026-11-18-pt-66-qualification]
    paths:
      - .github/workflows/iwxa-de-fr-main-unchanged-baseline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-ru-1
          ref: e93b9c1c49b2d6030da692142b77c3edba8f098e
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"
      - name: Establish unmodified main guard baselines
        shell: bash
        working-directory: site
        run: |
          set +e
          test "$(git rev-parse HEAD)" = "e93b9c1c49b2d6030da692142b77c3edba8f098e" || exit 1
          bun install --frozen-lockfile > "$RUNNER_TEMP/base-install.log" 2>&1 || exit 1
          node scripts/check-german-full-source.mjs > "$RUNNER_TEMP/base-de.log" 2>&1
          de=$?
          node scripts/check-french-source.mjs > "$RUNNER_TEMP/base-fr.log" 2>&1
          fr=$?
          echo "IWXA_UNMODIFIED_MAIN_DE_EXIT=$de"
          grep '^DE_SOURCE_CHECK_FAIL ' "$RUNNER_TEMP/base-de.log" | head -n 30 || true
          echo "IWXA_UNMODIFIED_MAIN_FR_EXIT=$fr"
          grep '^ - ' "$RUNNER_TEMP/base-fr.log" | head -n 20 || true
          echo "IWXA_BASELINE_RECORDED=PASS"
