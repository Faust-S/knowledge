name: D07 N185 candidate identity preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: 85184db197a6b208f3336758ab58092f3ebd0578
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - name: Confirm existing subject identities before selecting next five
        working-directory: site
        run: |
          bun install --frozen-lockfile > "$RUNNER_TEMP/d07-185-preflight.log" 2>&1
          node --import tsx scripts/d07-next500-candidate-preflight.mjs 15 | tee "$RUNNER_TEMP/d07-185-candidate-results.log"
          grep -qx 'D07_TOP500_SELECTED=500' "$RUNNER_TEMP/d07-185-candidate-results.log"
          grep -qx 'D07_INDIVIDUAL_TECHNOLOGIES=185' "$RUNNER_TEMP/d07-185-candidate-results.log"
          grep -qx 'D07_UNCOVERED_TECHNOLOGIES=315' "$RUNNER_TEMP/d07-185-candidate-results.log"
