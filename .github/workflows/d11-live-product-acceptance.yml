name: D11 stable T3 0.3.2 and original domain assistant qualification
on:
  workflow_dispatch:
  push:
    branches: ['ci/once/d11-live-product-acceptance/**']
    paths: ['.github/ci-requests/d11-live-product-acceptance.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: d11-live-product-acceptance
  cancel-in-progress: false
jobs:
  browser:
    name: D11 T3 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Admit one exact T3 request
        run: |
          python tools/ci/verify_once_request.py --repository Faust-S/knowledge --workflow d11-live-product-acceptance --profile t3-stable-os --revision domain=251f3e5d4f4333624c3e0bf8d3aad30003f6751f --revision site=2e12139e8ae8a562485fd2ff0083108511462815 --revision t3=8e26076ce66f0c26693a647e061fcd568e055b77 --revision assistant=2c247482306f218a7d5be668de11e98f168862d4
          if ($LASTEXITCODE -ne 0) { throw "D11_REQUEST_INVALID" }
      - name: Verify published stable T3 engineering release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run=gh api "repos/Faust-S/knowledge/actions/runs/46065502722" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne "success") { throw "D11_T3_ORIGINAL_QUALIFICATION_MISSING" }
          $release=gh api "repos/Faust-S/knowledge/releases/tags/t3-platform-v0.3.2" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.prerelease -or $release.draft -or $release.target_commitish -ne "8e26076ce66f0c26693a647e061fcd568e055b77") { throw "D11_T3_STABLE_RELEASE_IDENTITY" }
          $exact=@($release.assets | Where-Object { $_.id -eq 802021785 -and $_.name -eq "platform-inputs.zip" -and $_.digest -eq "sha256:5624d8a899c99fc2c100f57023eaf6fb1140f6f39ad1e7bfb85c5f20faadd32b" })
          if ($exact.Count -ne 1) { throw "D11_T3_RELEASE_ASSET_IDENTITY" }
          Write-Output "D11_T3_STABLE_RELEASE=PASS"
      - name: Existing private repository read scope
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw "D11_DOMEN_UNAVAILABLE" }
          foreach ($repo in @("Faust-S/advice-logistics.ru","Faust-S/advice-logistics","Faust-S/T3")) {
            gh api "repos/$repo" --jq ".id" *> $null
            if ($LASTEXITCODE -ne 0) { throw "D11_READ_SCOPE_UNAVAILABLE" }
          }
          Write-Output "D11_READ_SCOPE=PASS"
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/advice-logistics.ru
          ref: 2e12139e8ae8a562485fd2ff0083108511462815
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/advice-logistics
          ref: 251f3e5d4f4333624c3e0bf8d3aad30003f6751f
          token: ${{ secrets.DOMEN }}
          path: domain
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 8e26076ce66f0c26693a647e061fcd568e055b77
          path: t3
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 2c247482306f218a7d5be668de11e98f168862d4
          token: ${{ secrets.DOMEN }}
          path: assistant
          persist-credentials: false
      - name: Download exact published public platform input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir=Join-Path $env:RUNNER_TEMP "d11-t3-platform-input"
          New-Item -ItemType Directory -Force $dir | Out-Null
          & gh release download t3-platform-v0.3.2 --repo Faust-S/knowledge --pattern platform-inputs.zip --dir "$dir"
          if ($LASTEXITCODE -ne 0) { throw "D11_T3_STABLE_DOWNLOAD_FAILED" }
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify exact T3 source and 56 D11 canonical mirrors
        run: |
          if ((git -C site rev-parse HEAD).Trim() -ne "2e12139e8ae8a562485fd2ff0083108511462815" -or
              (git -C domain rev-parse HEAD).Trim() -ne "251f3e5d4f4333624c3e0bf8d3aad30003f6751f" -or
              (git -C t3 rev-parse HEAD).Trim() -ne "8e26076ce66f0c26693a647e061fcd568e055b77" -or
              (git -C t3 rev-parse "HEAD^{tree}").Trim() -ne "6ffc44d4a633d958ac7a4e71ea14fb182f5f82c5" -or
              (git -C t3 rev-parse "HEAD:packages/t3-core/src").Trim() -ne "81294420eff40500ecd04a43b4c253cb4bcd67c7" -or
              (git -C t3 rev-parse "HEAD:packages/t3-core").Trim() -ne "1d969c6ed91995e213bb9f89fc3c17b309ba3770") { throw "D11_T3_PIN_MISMATCH" }
          $o=Get-Content -Raw -Encoding UTF8 site/runtime/d11-module/operations/source.json | ConvertFrom-Json
          $m=Get-Content -Raw -Encoding UTF8 site/src/lib/logistics/professional-methods-source.json | ConvertFrom-Json
          $a=Get-Content -Raw -Encoding UTF8 site/runtime/d11-module/os-work-areas-source.json | ConvertFrom-Json
          $files=@($o.files)+@($m.files)+@([pscustomobject]@{sourcePath=$a.sourcePath;localPath=$a.localPath;blob=$a.sourceBlob})
          if ($files.Count -ne 56 -or @($files.localPath | Sort-Object -Unique).Count -ne 56 -or @($files.sourcePath | Sort-Object -Unique).Count -ne 55) { throw "D11_MIRROR_MANIFEST_INVALID" }
          foreach ($f in $files) {
            if ((git -C domain rev-parse "HEAD:$($f.sourcePath)").Trim() -ne $f.blob -or (git -C site rev-parse "HEAD:$($f.localPath)").Trim() -ne $f.blob) { throw "D11_MIRROR_MISMATCH" }
          }
          Write-Output "D11_MIRRORS=56/56 PASS"
          if ((git -C assistant rev-parse HEAD).Trim() -ne "2c247482306f218a7d5be668de11e98f168862d4") { throw "D11_ASSISTANT_PIN_MISMATCH" }
          $p=Get-Content -Raw -Encoding UTF8 site/runtime/t3-platform/0.3.2/domain-assistant.json | ConvertFrom-Json
          if ($p.sourceCommit -ne "2c247482306f218a7d5be668de11e98f168862d4" -or $p.sharedEngineSource -ne "8e26076ce66f0c26693a647e061fcd568e055b77" -or $p.files.Count -ne 4) { throw "D11_ASSISTANT_MANIFEST_MISMATCH" }
          foreach ($f in $p.files) {
            if ((git -C assistant rev-parse "HEAD:$($p.sourceRoot)/$($f.path)").Trim() -ne $f.blob) { throw "D11_ASSISTANT_BLOB_MISMATCH" }
          }
          $s=Get-Content -Raw -Encoding UTF8 site/runtime/t3-platform/0.3.2/domain-skills.json | ConvertFrom-Json
          if ($s.sourceCommit -ne "251f3e5d4f4333624c3e0bf8d3aad30003f6751f" -or (git -C domain rev-parse "HEAD:$($s.sourcePath)").Trim() -ne $s.sourceBlob -or (git -C site rev-parse "HEAD:$($s.publishedPath)").Trim() -ne $s.sourceBlob) { throw "D11_SKILL_MIRROR_MISMATCH" }
          Write-Output "D11_T3_ASSISTANT_FILES=4/4 PASS"
          Write-Output "D11_T3_CANONICAL_SKILLS=PASS"
          $archive=Join-Path $env:RUNNER_TEMP "d11-t3-platform-input/platform-inputs.zip"
          if (!(Test-Path $archive) -or (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "5624d8a899c99fc2c100f57023eaf6fb1140f6f39ad1e7bfb85c5f20faadd32b") { throw "D11_T3_ARCHIVE_MISMATCH" }
          Write-Output "D11_T3_ARCHIVE=PASS"
          "IWXA_D11_T3_PLATFORM_ARCHIVE=$archive" >> $env:GITHUB_ENV
          "IWXA_D11_T3_PREPARED_HOST=$(Join-Path $env:RUNNER_TEMP 'd11-t3-prepared-host')" >> $env:GITHUB_ENV
      - name: Site dependencies and source regression
        id: source
        working-directory: site
        continue-on-error: true
        run: |
          $status=0
          & npm ci --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP "d11-install.log")
          if ($LASTEXITCODE -ne 0) { throw "D11_INSTALL_FAILED" }
          $tests=@(Get-ChildItem tests -File -Filter "*.test.mjs" | ForEach-Object { $_.FullName })
          if ($tests.Count -eq 0) { throw "D11_TESTS_MISSING" }
          $log=Join-Path $env:RUNNER_TEMP "d11-site-regression.log"
          & node --experimental-strip-types --test --test-reporter=tap @tests *> $log
          $code=$LASTEXITCODE
          Get-Content $log | ForEach-Object {
            if ($_ -match '^# (tests|pass|fail|skipped) [0-9]+$') { Write-Output $_ }
            elseif ($_ -match '^not ok ([0-9]+)') { Write-Output ("D11_FAILED_TEST_NUMBER="+$Matches[1]) }
          }
          if ($code -ne 0) { $status=1 }
          & npx --no-install tsc --noEmit --pretty false *> (Join-Path $env:RUNNER_TEMP "d11-types.log")
          if ($LASTEXITCODE -ne 0) { $status=1; Write-Output "D11_TYPES=FAIL" } else { Write-Output "D11_TYPES=PASS" }
          if ($status -ne 0) { throw "D11_SOURCE_REGRESSION_FAILED" }
          Write-Output "D11_T3_SITE_SOURCE=PASS"
      - name: Original assistant validates actual public D11 skills
        working-directory: site
        run: |
          $env:D11_ASSISTANT_SOURCE=Join-Path $env:GITHUB_WORKSPACE "assistant/browser-local-inference/domain-assistant"
          $js=@'
          import {readFileSync} from "node:fs";
          import {resolve} from "node:path";
          import {pathToFileURL} from "node:url";
          const {validateSkillPack,rankSkills,routeSkill}=await import(pathToFileURL(resolve(process.env.D11_ASSISTANT_SOURCE,"skill-runtime.mjs")).href);
          const p=validateSkillPack(JSON.parse(readFileSync("public/assets/d11-assistant-skills.json","utf8")));
          if(p.skills.length!==17||p.formHints.length!==4||p.resultHints.length!==4||p.formHints.flatMap(h=>h.fields).length!==22||p.formHints.flatMap(h=>h.fields).filter(f=>f.kind==="omit").length!==5)throw Error("D11_SKILL_SCOPE");
          for(const s of p.skills)if(routeSkill(p,s.route)!==s||!rankSkills(p,s.triggers[0]).some(x=>x.id===s.id))throw Error("D11_SKILL_ROUTE");
          console.log("D11_T3_SKILLS=17/17 PASS");
          console.log("D11_T3_NATIVE_CONTEXT_CONTRACTS=4/4 PASS");
          '@
          & node --input-type=module -e $js
          if ($LASTEXITCODE -ne 0) { throw "D11_T3_SKILL_VALIDATION_FAILED" }
      - name: Verify exact portable T3 inputs
        working-directory: site
        run: |
          & npm run verify:t3:inputs -- "$env:IWXA_D11_T3_PLATFORM_ARCHIVE" *> (Join-Path $env:RUNNER_TEMP "d11-t3-verify.log")
          if ($LASTEXITCODE -ne 0) { throw "D11_T3_PORTABLE_VERIFY_FAILED" }
          Write-Output "D11_T3_PORTABLE_FILES=174/174 PASS"
      - name: Prepare original T3 Host with current D11 module and BLI
        id: host
        working-directory: site
        run: |
          $core=Join-Path $env:GITHUB_WORKSPACE "t3/packages/t3-core"
          $log=Join-Path $env:RUNNER_TEMP "d11-t3-host.log"
          $assistant=Join-Path $env:GITHUB_WORKSPACE "assistant/browser-local-inference/domain-assistant"
          & npm run prepare:t3:host -- "$core" "$env:IWXA_D11_T3_PREPARED_HOST" "$env:IWXA_D11_T3_PLATFORM_ARCHIVE" "$assistant" *> $log
          $code=$LASTEXITCODE
          Get-Content $log | ForEach-Object {
            if ($_ -match '(?:Error:|error:)\s*((?:D11_T3_|T3_|T2_|SOURCE_|EXACT_)[A-Z0-9_]+)\b') { Write-Output ("D11_T3_HOST_DIAGNOSTIC="+$Matches[1]) }
            elseif ($_ -match '(?<path>[^()\r\n]+\.(?:ts|tsx|mts))\((?<line>[0-9]+),(?<col>[0-9]+)\): error TS(?<code>[0-9]{4})') {
              $locPath=$Matches["path"].Trim().Replace('\','/')
              $locLine=$Matches["line"]; $locCol=$Matches["col"]; $locCode=$Matches["code"]
              # Only diagnostic coordinates and one-way filename identity;
              # never output private source snippets, types or messages.
              $nameHash=[Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($locPath))).ToLowerInvariant()
              Write-Output ("D11_T3_HOST_TS_LOCATION="+$nameHash.Substring(0,16)+":"+$locLine+":"+$locCol+":TS"+$locCode)
              Write-Output ("D11_T3_HOST_TYPESCRIPT=TS"+$locCode)
            }
            elseif ($_ -match '\berror TS([0-9]{4})\b') { Write-Output ("D11_T3_HOST_TYPESCRIPT=TS"+$Matches[1]) }
            elseif ($_ -match '\b(ENOENT|EACCES|EPERM|EINVAL|ENAMETOOLONG|EAI_AGAIN|ECONNRESET|ERR_[A-Z0-9_]+)\b') { Write-Output ("D11_T3_HOST_OS_DIAGNOSTIC="+$Matches[1]) }
            elseif ($_ -match '\bnpm (?:ERR!|error) code ([A-Z0-9_]+)\b') { Write-Output ("D11_T3_HOST_NPM_CODE="+$Matches[1]) }
          }
          if ($code -ne 0) { throw "D11_T3_HOST_PREPARE_FAILED" }
          & npm run verify:t3:host -- "$env:IWXA_D11_T3_PREPARED_HOST" *> (Join-Path $env:RUNNER_TEMP "d11-t3-host-readback.log")
          if ($LASTEXITCODE -ne 0) { throw "D11_T3_HOST_READBACK_FAILED" }
          Write-Output "D11_T3_ORIGINAL_HOST_AND_SHARED_ASSISTANT=PASS"
      - name: Ordinary product build on T3 only
        id: build
        working-directory: site
        run: |
          $log=Join-Path $env:RUNNER_TEMP "d11-t3-build.log"
          & npm run build *> $log
          $code=$LASTEXITCODE
          Get-Content $log | ForEach-Object {
            if ($_ -match '^D11_T3_ONE_DIST=PASS version=0\.3\.2 offline=[0-9]+$') { Write-Output $_ }
            elseif ($_ -match '(?:Error:|error:)\s*((?:D11_T3_|T3_|T2_|SOURCE_|EXACT_)[A-Z0-9_]+)\b') { Write-Output ("D11_T3_BUILD_DIAGNOSTIC="+$Matches[1]) }
            elseif ($_ -match '\berror TS([0-9]{4})\b') { Write-Output ("D11_T3_BUILD_TYPESCRIPT=TS"+$Matches[1]) }
          }
          if ($code -ne 0) { throw "D11_T3_BUILD_FAILED" }
          foreach ($p in @("workspace/index.html","workspace/exchange/index.html","workspace/lifecycle/index.html","t3-domain-mode.mjs","t3-sw.js","t3-app-manifest.json","t3-offline-manifest.json","_iwxa/runtime/0.3.6/runtime.js")) {
            if (!(Test-Path "dist/$p")) { throw "D11_T3_DIST_MISSING" }
          }
          if (!(Select-String -Path $log -SimpleMatch "D11_T3_ONE_DIST=PASS version=0.3.2" -Quiet)) { throw "D11_T3_BUILD_WITNESS_MISSING" }
          if (Test-Path dist/_iwxa/diagnostics) { throw "D11_ENGINEERING_DIAGNOSTICS_INCLUDED" }
          Write-Output "D11_T3_DIST=PASS"
      - name: Static product and public page checks
        id: static
        continue-on-error: true
        working-directory: site
        run: |
          $status=0
          foreach ($check in @("readability","hydration","runtime","no-localhost","assets","external-assets","links","seo","htaccess")) {
            & npm run "check:$check" *> (Join-Path $env:RUNNER_TEMP "d11-$check.log")
            if ($LASTEXITCODE -ne 0) { $status=1; Write-Output "D11_STATIC_FAIL=$check" } else { Write-Output "D11_STATIC_PASS=$check" }
          }
          if ($status -ne 0) { throw "D11_STATIC_FAILED" }
          Write-Output "D11_STATIC=9/9 PASS"
      - name: Online public routes and native product forms in compiled T3
        id: ui
        continue-on-error: true
        working-directory: site
        run: |
          $log=Join-Path $env:RUNNER_TEMP "d11-live-ui.log"
          & node scripts/d11-live-browser-acceptance.mjs *> $log
          $code=$LASTEXITCODE
          Get-Content $log | ForEach-Object {
            if ($_ -match '^(D11_(?:LIVE_GUI|OWN_)[A-Z0-9_]*=([0-9/ ]*PASS))') { Write-Output $Matches[1] }
            elseif ($_ -match '^(D11_LIVE_GUI_FAILED=[A-Z0-9_]+)') { Write-Output $Matches[1] }
          }
          if ($code -ne 0) { throw "D11_T3_ONLINE_PUBLIC_FAILED" }
          Write-Output "D11_T3_ONLINE_PUBLIC=PASS"
      - name: Original inherited result readback and Exchange in T3
        id: exchange
        continue-on-error: true
        working-directory: site
        run: |
          $log=Join-Path $env:RUNNER_TEMP "d11-live-exchange.log"
          & node scripts/d11-live-t2-kernel-exchange-acceptance.mjs *> $log
          $code=$LASTEXITCODE
          Get-Content $log | ForEach-Object {
            if ($_ -match '^(D11_[A-Z0-9_]+=([0-9/ ]*PASS))') { Write-Output $Matches[1] }
            elseif ($_ -match '^(D11_(?:REAL_T2_FAILED|LIVE_FAILURE_KIND)=[A-Z0-9_]+)') { Write-Output $Matches[1] }
          }
          if ($code -ne 0) { throw "D11_T3_ONLINE_EXCHANGE_FAILED" }
          Write-Output "D11_T3_ONLINE_EXCHANGE=PASS"
      - name: Original D11 operating route in compiled T3
        id: os
        continue-on-error: true
        working-directory: site
        run: |
          $log=Join-Path $env:RUNNER_TEMP "d11-live-os.log"
          & node scripts/d11-live-t2-kernel-exchange-acceptance.mjs --operational *> $log
          $code=$LASTEXITCODE
          Get-Content $log | ForEach-Object {
            if ($_ -match '^(D11_[A-Z0-9_]+=([0-9/ ]*PASS))') { Write-Output $Matches[1] }
            elseif ($_ -match '^(D11_(?:OS_STAGE|REAL_T2_FAILED|LIVE_FAILURE_KIND|OS_DISPATCH_NOTICE|OS_FORM_INVALID_KIND)=[A-Z0-9_,]+)$') { Write-Output $Matches[1] }
            elseif ($_ -match '^(D11_OS_FORM_INVALID_COUNT=[0-9]+)$') { Write-Output $Matches[1] }
          }
          if ($code -ne 0) { throw "D11_T3_ONLINE_OS_FAILED" }
          Write-Output "D11_T3_ONLINE_OS=PASS"
      - name: Require all current T3 build and online checks
        if: always()
        run: |
          if ("${{ steps.source.outcome }}" -ne "success" -or "${{ steps.host.outcome }}" -ne "success" -or "${{ steps.build.outcome }}" -ne "success" -or "${{ steps.static.outcome }}" -ne "success" -or "${{ steps.ui.outcome }}" -ne "success" -or "${{ steps.exchange.outcome }}" -ne "success" -or "${{ steps.os.outcome }}" -ne "success") { throw "D11_T3_BUILD_ONLINE_QUALIFICATION_INCOMPLETE" }
          Write-Output "D11_T3_BUILD_ONLINE_QUALIFICATION=PASS"
          Write-Output "D11_T3_OFFLINE_AND_MODEL_QUALIFICATION=NOT_RUN"
      - name: Remove private inputs and diagnostics
        if: always()
        run: |
          foreach ($name in @("domain","site","t3","assistant")) {
            $folder=Join-Path $env:GITHUB_WORKSPACE $name
            if (Test-Path $folder) { Remove-Item -LiteralPath $folder -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Get-ChildItem $env:RUNNER_TEMP -Filter "d11-*" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
      # No private code, output, logs, screenshots or artifacts uploaded.
