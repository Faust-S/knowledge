name: D11 exact release live Windows Linux acceptance
on:
  workflow_dispatch:
  push:
    branches: ['ci/once/d11-live-product-acceptance/**']
    paths: ['.github/ci-requests/d11-live-product-acceptance.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: d11-live-product-acceptance
  cancel-in-progress: false
jobs:
  browser:
    name: D11 LIVE ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Admit one exact request
        run: |
          python tools/ci/verify_once_request.py --repository Faust-S/knowledge --workflow d11-live-product-acceptance --profile live-os --revision domain=c4406c29abd639862fc21edf417c5d049184e926 --revision site=0b5a884b194d8a6bd719f565c0ad681ea1f52a37 --revision t2=e70de29b72b83e2546f7ab74b17572685a728c17
          if ($LASTEXITCODE -ne 0) { throw "D11_REQUEST_INVALID" }
      - name: Confirm previously qualified exact product sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $r=gh api "repos/Faust-S/knowledge/actions/runs/46045820704" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $r.conclusion -ne "success" -or $r.head_sha -ne "598d881dbbdc540ef7ed5b1c32e8c56bf1e5c0eb") { throw "D11_PRIOR_QUALIFICATION_MISSING" }
          Write-Output "D11_PRIOR_QUALIFICATION=PASS"
      - name: Reuse only successful unchanged Linux public and exchange evidence
        id: linux_previous
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run=gh api "repos/Faust-S/knowledge/actions/runs/46050414465" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne "2413f8e31d28af7c04f4def5e01088840a3c792e") { throw "D11_PREVIOUS_LIVE_IDENTITY_MISSING" }
          $raw=gh api "repos/Faust-S/knowledge/actions/jobs/140680033183/logs"
          if ($LASTEXITCODE -ne 0) { throw "D11_PREVIOUS_EVIDENCE_UNAVAILABLE" }
          $log=$raw -join [Environment]::NewLine
          foreach ($proof in @("D11_LIVE_GUI_ACCEPTANCE=10/10 PASS","D11_T2_COLD_HOST_READBACK=10/10 PASS","D11_T2_IWXA_IMPORT_READBACK=10/10 PASS","D11_REAL_T2_KERNEL_EXCHANGE_ACCEPTANCE=PASS","D11_SCREENSHOT_FILES=26/26 PASS")) {
            if (!$log.Contains($proof)) { throw "D11_PREVIOUS_EVIDENCE_MISSING" }
          }
          Write-Output "D11_LINUX_PRIOR_PUBLIC_AND_EXCHANGE=PASS"
      - name: Check existing private read scope
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw "D11_DOMEN_UNAVAILABLE" }
          foreach ($repo in @("Faust-S/advice-logistics.ru","Faust-S/advice-logistics","Faust-S/T2")) {
            gh api "repos/$repo" --jq ".id" *> $null
            if ($LASTEXITCODE -ne 0) { throw "D11_READ_SCOPE_UNAVAILABLE" }
          }
          Write-Output "D11_READ_SCOPE=PASS"
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/advice-logistics.ru
          ref: 0b5a884b194d8a6bd719f565c0ad681ea1f52a37
          token: ${{ secrets.DOMEN }}
          path: site
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/advice-logistics
          ref: c4406c29abd639862fc21edf417c5d049184e926
          token: ${{ secrets.DOMEN }}
          path: domain
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: e70de29b72b83e2546f7ab74b17572685a728c17
          token: ${{ secrets.DOMEN }}
          path: t2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify exact test-only successor and 56 canonical mirrors
        run: |
          if ((git -C site rev-parse HEAD).Trim() -ne "0b5a884b194d8a6bd719f565c0ad681ea1f52a37" -or
              (git -C domain rev-parse HEAD).Trim() -ne "c4406c29abd639862fc21edf417c5d049184e926" -or
              (git -C t2 rev-parse HEAD).Trim() -ne "e70de29b72b83e2546f7ab74b17572685a728c17" -or
              (git -C site rev-parse HEAD~2).Trim() -ne "56d5851c466d14d17a2c6e250df452a4dfeaf068") { throw "D11_PIN_MISMATCH" }
          $changes=@(git -C site diff --name-only HEAD~2 HEAD)
          if ($changes.Count -ne 2 -or $changes -notcontains "scripts/d11-live-operational-os.mjs" -or $changes -notcontains "scripts/d11-live-t2-kernel-exchange-acceptance.mjs") { throw "D11_TEST_ONLY_SUCCESSOR_INVALID" }
          $o=Get-Content -Raw -Encoding UTF8 site/runtime/d11-module/operations/source.json | ConvertFrom-Json
          $m=Get-Content -Raw -Encoding UTF8 site/src/lib/logistics/professional-methods-source.json | ConvertFrom-Json
          $a=Get-Content -Raw -Encoding UTF8 site/runtime/d11-module/os-work-areas-source.json | ConvertFrom-Json
          $files=@($o.files)+@($m.files)+@([pscustomobject]@{sourcePath=$a.sourcePath;localPath=$a.localPath;blob=$a.sourceBlob})
          if ($files.Count -ne 56 -or @($files.localPath | Sort-Object -Unique).Count -ne 56 -or @($files.sourcePath | Sort-Object -Unique).Count -ne 55) { throw "D11_MIRROR_MANIFEST_INVALID" }
          foreach ($f in $files) {
            if ((git -C domain rev-parse "HEAD:$($f.sourcePath)").Trim() -ne $f.blob -or (git -C site rev-parse "HEAD:$($f.localPath)").Trim() -ne $f.blob) { throw "D11_MIRROR_MISMATCH" }
          }
          Write-Output "D11_MIRRORS=56/56 PASS"
          Write-Output "D11_PRODUCT_SOURCES_UNCHANGED=PASS"
      - name: Install dependencies and parse browser witnesses
        working-directory: site
        run: |
          & npm ci --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP "d11-npm-install.log")
          if ($LASTEXITCODE -ne 0) { throw "D11_NPM_INSTALL_FAILED" }
          foreach ($script in @("d11-live-operational-os","d11-live-t2-kernel-exchange-acceptance","d11-live-browser-acceptance")) {
            & node --check "scripts/$script.mjs"
            if ($LASTEXITCODE -ne 0) { throw "D11_BROWSER_WITNESS_PARSE_FAILED" }
          }
          Write-Output "D11_WITNESSES_PARSE=PASS"
      - name: Full Windows source regression and types
        id: windows_source
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: site
        run: |
          $status=0
          foreach ($repo in @("../domain",".")) {
            $tests=@(Get-ChildItem "$repo/tests" -File -Filter "*.test.mjs" | ForEach-Object { $_.FullName })
            if ($tests.Count -eq 0) { throw "D11_TESTS_MISSING" }
            $log=Join-Path $env:RUNNER_TEMP ("d11-regression-"+($repo -replace '[^a-z]','')+".log")
            Push-Location $repo
            try {
              & node --experimental-strip-types --test --test-reporter=tap @tests *> $log
              $code=$LASTEXITCODE
            } finally { Pop-Location }
            Get-Content $log | Where-Object { $_ -match '^# (tests|pass|fail|skipped) [0-9]+$' } | Write-Output
            if ($code -ne 0) { $status=1 }
          }
          & npx --no-install tsc --noEmit --pretty false *> (Join-Path $env:RUNNER_TEMP "d11-types.log")
          if ($LASTEXITCODE -ne 0) { $status=1 }
          if ($status -ne 0) { throw "D11_WINDOWS_SOURCE_FAILED" }
          Write-Output "D11_WINDOWS_SOURCE=PASS"
      - name: Build the exact previously qualified product
        id: build
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
        run: |
          $log=Join-Path $env:RUNNER_TEMP "d11-build.log"
          & npm run build:t2:site *> $log
          $code=$LASTEXITCODE
          Get-Content $log | ForEach-Object {
            if ($_ -match '\b(D11_(?:HOST_INSTALL|SUBBUILD_HOST|SUBBUILD_KERNEL|SUBBUILD_SITE|HOST_TYPECHECK_ON_ERROR))=(PASS|FAIL)\b') { Write-Output ($Matches[1]+"="+$Matches[2]) }
            elseif ($_ -match '(?:Error:|error:)\s*((?:D11_|T2_|K035_|K036_|SOURCE_|SUCCESSOR_|EXACT_|OVERLAY_|PREDECESSOR_)[A-Z0-9_]+)\b') { Write-Output ("D11_BUILD_DIAGNOSTIC="+$Matches[1]) }
            elseif ($_ -match '\berror TS([0-9]{4})\b') { Write-Output ("D11_BUILD_TYPESCRIPT=TS"+$Matches[1]) }
            elseif ($_ -match '\b(ENOENT|EACCES|EPERM|EINVAL|ENAMETOOLONG|EAI_AGAIN|ECONNRESET|ERR_[A-Z0-9_]+)\b') { Write-Output ("D11_BUILD_OS_DIAGNOSTIC="+$Matches[1]) }
          }
          if ($code -ne 0) { Write-Output "D11_BUILD_EXIT=$code"; throw "D11_UI_BUILD_FAILED" }
          if (!(Test-Path dist/workspace/index.html)) { throw "D11_DIST_MISSING" }
          Write-Output "D11_ONE_DIST=PASS"
      - name: Windows static product and public page checks
        id: windows_static
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: site
        run: |
          $status=0
          foreach ($check in @("readability","hydration","runtime","no-localhost","assets","external-assets","links","seo","htaccess")) {
            & npm run "check:$check" *> (Join-Path $env:RUNNER_TEMP "d11-$check.log")
            if ($LASTEXITCODE -ne 0) { $status=1; Write-Output "D11_STATIC_FAIL=$check" } else { Write-Output "D11_STATIC_PASS=$check" }
          }
          if ($status -ne 0) { throw "D11_WINDOWS_STATIC_FAILED" }
          Write-Output "D11_WINDOWS_STATIC=9/9 PASS"
      - name: Real browser ten cases and own-project forms
        id: ui
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: site
        run: |
          $log=Join-Path $env:RUNNER_TEMP "d11-live-ui.log"
          & node scripts/d11-live-browser-acceptance.mjs *> $log
          $code=$LASTEXITCODE
          Get-Content $log | ForEach-Object {
            if ($_ -match '^(D11_(?:LIVE_GUI|OWN_)[A-Z0-9_]*)(?:=)([0-9/ ]*PASS)') { Write-Output ($Matches[1]+"="+$Matches[2]) }
            elseif ($_ -match '^(D11_LIVE_GUI_FAILED=[A-Z0-9_]+)') { Write-Output $Matches[1] }
          }
          if ($code -ne 0) { throw "D11_LIVE_TEN_CASES_FAILED" }
          Write-Output "D11_LIVE_BROWSER=PASS"
      - name: Original T2 result readback and Exchange
        id: kernel
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: site
        run: |
          $log=Join-Path $env:RUNNER_TEMP "d11-live-kernel.log"
          & node scripts/d11-live-t2-kernel-exchange-acceptance.mjs *> $log
          $code=$LASTEXITCODE
          Get-Content $log | ForEach-Object {
            if ($_ -match '^(D11_[A-Z0-9_]+)=([0-9/ ]*PASS)') { Write-Output ($Matches[1]+"="+$Matches[2]) }
            elseif ($_ -match '^(D11_REAL_T2_FAILED=[A-Z0-9_]+)') { Write-Output $Matches[1] }
          }
          if ($code -ne 0) { throw "D11_T2_REAL_KERNEL_EXCHANGE_FAILED" }
          Write-Output "D11_T2_REAL_KERNEL_EXCHANGE=PASS"
      - name: Real operational OS stock to economics and independent import
        id: os
        continue-on-error: true
        working-directory: site
        run: |
          $log=Join-Path $env:RUNNER_TEMP "d11-live-os.log"
          & node scripts/d11-live-t2-kernel-exchange-acceptance.mjs --operational *> $log
          $code=$LASTEXITCODE
          Get-Content $log | ForEach-Object {
            if ($_ -match '^(D11_[A-Z0-9_]+)=([0-9/ ]*PASS)') { Write-Output ($Matches[1]+"="+$Matches[2]) }
            elseif ($_ -match '^(D11_(?:OS_STAGE|REAL_T2_FAILED)=[A-Z0-9_]+)') { Write-Output $Matches[1] }
            elseif ($_ -match '^(D11_(?:LIVE_FAILURE_KIND|OS_DISPATCH_NOTICE|OS_FORM_INVALID_KIND)=[A-Z0-9_,]+)
          }
          if ($code -ne 0) { throw "D11_OPERATIONAL_OS_FAILED" }
          Write-Output "D11_OPERATIONAL_OS=PASS"
      - name: Verify original 26 desktop and mobile screenshots locally
        id: visual
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          $dir=Join-Path $env:RUNNER_TEMP "d11-visual"
          $names=@("d11-dashboard-desktop.png","d11-dashboard-mobile.png","d11-home-desktop.png","d11-home-mobile.png","d11-result-detail-desktop.png","d11-result-detail-mobile.png","d11-projects-desktop.png","d11-projects-mobile.png","d11-customer-order-desktop.png","d11-customer-order-mobile.png")
          foreach ($caseNumber in 2..9) {
            foreach ($viewport in @("desktop","mobile")) { $names+=("d11-own-{0:D3}-{1}.png" -f $caseNumber,$viewport) }
          }
          foreach ($name in $names) {
            $file=Join-Path $dir $name
            if (!(Test-Path $file) -or (Get-Item $file).Length -lt 1000) { throw "D11_SCREENSHOT_MISSING" }
          }
          Write-Output "D11_SCREENSHOT_FILES=26/26 PASS"
      - name: Require all applicable product checks
        if: always()
        run: |
          if ("${{ steps.build.outcome }}" -ne "success" -or "${{ steps.os.outcome }}" -ne "success") { throw "D11_LIVE_ACCEPTANCE_INCOMPLETE" }
          if ($env:RUNNER_OS -eq "Windows") {
            if ("${{ steps.windows_source.outcome }}" -ne "success" -or "${{ steps.windows_static.outcome }}" -ne "success" -or "${{ steps.ui.outcome }}" -ne "success" -or "${{ steps.kernel.outcome }}" -ne "success" -or "${{ steps.visual.outcome }}" -ne "success") { throw "D11_WINDOWS_QUALIFICATION_INCOMPLETE" }
          } elseif ("${{ steps.linux_previous.outcome }}" -ne "success") { throw "D11_LINUX_PRIOR_QUALIFICATION_INCOMPLETE" }
          Write-Output "D11_LIVE_FULL_ACCEPTANCE=PASS"
      - name: Remove private inputs and diagnostics
        if: always()
        run: |
          foreach ($name in @("domain","site","t2")) {
            $folder=Join-Path $env:GITHUB_WORKSPACE $name
            if (Test-Path $folder) { Remove-Item -LiteralPath $folder -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Get-ChildItem $env:RUNNER_TEMP -Filter "d11-*" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
      # No private code, output, logs, screenshots or artifacts uploaded.
) { Write-Output $Matches[1] }
            elseif ($_ -match '^(D11_OS_FORM_INVALID_COUNT=[0-9]+)
          }
          if ($code -ne 0) { throw "D11_OPERATIONAL_OS_FAILED" }
          Write-Output "D11_OPERATIONAL_OS=PASS"
      - name: Verify original 26 desktop and mobile screenshots locally
        id: visual
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          $dir=Join-Path $env:RUNNER_TEMP "d11-visual"
          $names=@("d11-dashboard-desktop.png","d11-dashboard-mobile.png","d11-home-desktop.png","d11-home-mobile.png","d11-result-detail-desktop.png","d11-result-detail-mobile.png","d11-projects-desktop.png","d11-projects-mobile.png","d11-customer-order-desktop.png","d11-customer-order-mobile.png")
          foreach ($caseNumber in 2..9) {
            foreach ($viewport in @("desktop","mobile")) { $names+=("d11-own-{0:D3}-{1}.png" -f $caseNumber,$viewport) }
          }
          foreach ($name in $names) {
            $file=Join-Path $dir $name
            if (!(Test-Path $file) -or (Get-Item $file).Length -lt 1000) { throw "D11_SCREENSHOT_MISSING" }
          }
          Write-Output "D11_SCREENSHOT_FILES=26/26 PASS"
      - name: Require all applicable product checks
        if: always()
        run: |
          if ("${{ steps.build.outcome }}" -ne "success" -or "${{ steps.os.outcome }}" -ne "success") { throw "D11_LIVE_ACCEPTANCE_INCOMPLETE" }
          if ($env:RUNNER_OS -eq "Windows") {
            if ("${{ steps.windows_source.outcome }}" -ne "success" -or "${{ steps.windows_static.outcome }}" -ne "success" -or "${{ steps.ui.outcome }}" -ne "success" -or "${{ steps.kernel.outcome }}" -ne "success" -or "${{ steps.visual.outcome }}" -ne "success") { throw "D11_WINDOWS_QUALIFICATION_INCOMPLETE" }
          } elseif ("${{ steps.linux_previous.outcome }}" -ne "success") { throw "D11_LINUX_PRIOR_QUALIFICATION_INCOMPLETE" }
          Write-Output "D11_LIVE_FULL_ACCEPTANCE=PASS"
      - name: Remove private inputs and diagnostics
        if: always()
        run: |
          foreach ($name in @("domain","site","t2")) {
            $folder=Join-Path $env:GITHUB_WORKSPACE $name
            if (Test-Path $folder) { Remove-Item -LiteralPath $folder -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Get-ChildItem $env:RUNNER_TEMP -Filter "d11-*" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
      # No private code, output, logs, screenshots or artifacts uploaded.
) { Write-Output $Matches[1] }
          }
          if ($code -ne 0) { throw "D11_OPERATIONAL_OS_FAILED" }
          Write-Output "D11_OPERATIONAL_OS=PASS"
