name: D11 full live Windows Linux acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d11-full-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: D11 LIVE ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check private repository permissions
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw "D11_DOMEN_UNAVAILABLE" }
          foreach ($repository in @("Faust-S/advice-logistics.ru","Faust-S/advice-logistics","Faust-S/T2")) {
            gh api "repos/$repository" --jq ".id" > $null
            if ($LASTEXITCODE -ne 0) { throw "D11_READ_ACCESS_DENIED" }
          }
          Write-Output "D11_PRIVATE_READ_ACCESS=PASS"
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/advice-logistics.ru
          ref: work/2026-11-12-case001-logistics-engineering
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/advice-logistics
          ref: work/2026-11-12-case001-logistics-engineering
          token: ${{ secrets.DOMEN }}
          path: domain
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: e70de29b72b83e2546f7ab74b17572685a728c17
          token: ${{ secrets.DOMEN }}
          path: t2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin revision and canonical source before browser acceptance
        run: |
          $site=(git -C site rev-parse HEAD).Trim()
          $domain=(git -C domain rev-parse HEAD).Trim()
          $t2=(git -C t2 rev-parse HEAD).Trim()
          Write-Output "D11_UI_SITE_HEAD=$site"
          Write-Output "D11_UI_DOMAIN_HEAD=$domain"
          if ($t2 -ne "e70de29b72b83e2546f7ab74b17572685a728c17") { throw "D11_T2_PIN_CHANGED" }
          $files=@(Get-ChildItem domain/model/logistics -File -Filter "*.ts")
          if ($files.Count -lt 25) { throw "D11_OPERATIONAL_SERVICE_SOURCE_MISSING" }
          foreach ($f in $files) {
            $a=(git -C domain rev-parse "HEAD:model/logistics/$($f.Name)").Trim()
            $b=(git -C site rev-parse "HEAD:src/lib/logistics/$($f.Name)").Trim()
            if ($a -ne $b) { throw "D11_CANONICAL_MIRROR_DIFF" }
          }
          Write-Output "D11_UI_MIRROR=$($files.Count)/$($files.Count)"
          if (!(Select-String -Path site/src/styles.css -Pattern "dashboard-card-d11.proposals.workspace" -SimpleMatch -Quiet)) { throw "D11_DASHBOARD_MOBILE_GRID_CONSTRAINT_MISSING" }
      - name: Validate original T2 service passport declaration shape
        working-directory: site
        run: |
          & node --test tests/d11-service-passport-contract.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "D11_T2_PASSPORT_DECLARATION_INVALID" }
          Write-Output "D11_T2_PASSPORT_DECLARATIONS=PASS"
      - name: Install npm dependencies in ephemeral checkout
        working-directory: site
        run: |
          & npm ci --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP "d11-npm-install.log")
          if ($LASTEXITCODE -ne 0) { throw "D11_UI_NPM_INSTALL_FAILED" }
          Write-Output "D11_UI_NPM=PASS"
      - name: Build actual T2 Host and public site together
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
        run: |
          & npm run build:t2:site *> (Join-Path $env:RUNNER_TEMP "d11-build.log")
          if ($LASTEXITCODE -ne 0) { throw "D11_UI_BUILD_FAILED" }
          Write-Output "D11_UI_ONE_DIST=PASS"
      # Every operational editor now retains selected JSON until File.text resolves.
      # The source suite rejects early-cleared file inputs before full browser checks.
      - name: Run both canonical and site D11 source regression suites
        id: source
        continue-on-error: true
        working-directory: site
        run: |
          $domainTests=@(Get-ChildItem ../domain/tests -File -Filter "*.test.mjs" | ForEach-Object { $_.FullName })
          $siteTests=@(Get-ChildItem tests -File -Filter "*.test.mjs" | ForEach-Object { $_.FullName })
          if ($domainTests.Count -ne 14 -or $siteTests.Count -lt 21) { throw "D11_OPERATIONAL_SERVICE_TESTS_MISSING" }
          & node --experimental-strip-types --test @domainTests
          if ($LASTEXITCODE -ne 0) { throw "D11_CANONICAL_MODELS_REGRESSION_FAILED" }
          & node --experimental-strip-types --test @siteTests
          if ($LASTEXITCODE -ne 0) { throw "D11_SITE_SOURCE_REGRESSION_FAILED" }
          # Git blobs are canonical. Windows checkout may expand LF to CRLF,
          # so never compare raw working-tree SHA256 across repositories.
          $siteBlob=(& git rev-parse "HEAD:src/lib/logistics/operational-services.ts").Trim()
          $domainBlob=(& git -C ../domain rev-parse "HEAD:model/logistics/operational-services.ts").Trim()
          if ($siteBlob -ne $domainBlob) { throw "D11_OPERATIONAL_CANONICAL_BLOB_MISMATCH" }
          $siteSource=[IO.File]::ReadAllText((Resolve-Path "src/lib/logistics/operational-services.ts"))
          $domainSource=[IO.File]::ReadAllText((Resolve-Path "../domain/model/logistics/operational-services.ts"))
          if ($siteSource.Replace("`r`n","`n") -cne $domainSource.Replace("`r`n","`n")) {
            throw "D11_OPERATIONAL_CANONICAL_WORKTREE_MISMATCH"
          }
          if (!(Select-String -Path "scripts/d11-live-t2-kernel-exchange-acceptance.mjs" -Pattern 'const names=await p.$$eval' -SimpleMatch -Quiet)) { throw "D11_PROJECT_LIST_MULTIROW_WITNESS_MISSING" }
          Write-Output "D11_PROJECT_LIST_MULTIROW_WITNESS=PASS"
          Write-Output "D11_CANONICAL_SERVICE_MIRROR=PASS"
          & npx --no-install tsc --noEmit --project tsconfig.json *> (Join-Path $env:RUNNER_TEMP "d11-types.log")
          if ($LASTEXITCODE -ne 0) { throw "D11_SITE_TYPES_FAILED" }
          Write-Output "D11_ALL_SOURCE_REGRESSIONS_AND_TYPES=PASS"
      - name: Verify all nine integrated static product checks
        id: hygiene
        continue-on-error: true
        working-directory: site
        run: |
          $checks=@("check:readability","check:hydration","check:runtime","check:no-localhost","check:assets","check:external-assets","check:links","check:seo","check:htaccess")
          foreach ($check in $checks) {
            & npm run --silent $check *> (Join-Path $env:RUNNER_TEMP ("d11-"+$check.Replace(":","-")+".log"))
            if ($LASTEXITCODE -ne 0) { throw "D11_PRODUCT_STATIC_CHECK_FAILED: $check" }
          }
          Write-Output "D11_PRODUCT_STATIC_CHECKS=9/9 PASS"
      # Test the real export entry point rather than an arbitrary form save.
      # Protect every source payload; only status codes appear in public logs.
      # Preserve verified production dist bytes; only two Host-origin config
      # responses are overlaid in-memory. Diagnose initial T2 route mount,
      # browser exceptions and missing Host resources without leaking payloads.
      - name: Real browser E2E for ten cases plus restored own-project forms
        id: ui
        continue-on-error: true
        working-directory: site
        run: |
          & node scripts/d11-live-browser-acceptance.mjs
          if ($LASTEXITCODE -ne 0) { throw "D11_LIVE_TEN_CASES_FAILED" }
          Write-Output "D11_LIVE_BROWSER=PASS"
      # Verify the user-selected same-tab packet with the exact original D11
      # canonical compact serializer, real Kernel consent and Exchange import.
      # Use T2 #/workspaces first-run flow on HTTP loopback.
      - name: Verify persistent browser JSON uploads, eight customer projects and original T2 Exchange
        id: kernel
        continue-on-error: true
        working-directory: site
        run: |
          & node scripts/d11-live-t2-kernel-exchange-acceptance.mjs
          if ($LASTEXITCODE -ne 0) { throw "D11_T2_REAL_KERNEL_EXCHANGE_FAILED" }
          Write-Output "D11_T2_REAL_KERNEL_EXCHANGE=PASS"
      - name: "Verify 26 screenshots: main surfaces and eight user projects on desktop/mobile"
        id: visual
        continue-on-error: true
        if: always()
        run: |
          $dir=Join-Path $env:RUNNER_TEMP "d11-visual"
          foreach ($name in @("d11-dashboard-desktop.png","d11-dashboard-mobile.png",
                             "d11-home-desktop.png","d11-home-mobile.png",
                             "d11-result-detail-desktop.png","d11-result-detail-mobile.png",
                             "d11-projects-desktop.png","d11-projects-mobile.png",
                             "d11-customer-order-desktop.png","d11-customer-order-mobile.png")) {
            $file=Join-Path $dir $name
            if (!(Test-Path $file) -or (Get-Item $file).Length -lt 1000) {
              throw "D11_VISUAL_SCREENSHOT_NOT_CONFIRMED"
            }
          }
          foreach ($caseNumber in 2..9) {
            foreach ($viewport in @("desktop","mobile")) {
              $name=("d11-own-{0:D3}-{1}.png" -f $caseNumber,$viewport)
              $file=Join-Path $dir $name
              if (!(Test-Path $file) -or (Get-Item $file).Length -lt 1000) {
                throw "D11_OWN_PROJECT_SCREENSHOT_NOT_CONFIRMED:$name"
              }
            }
          }
          Write-Output "D11_TWENTYSIX_SCREENSHOTS=PASS"
      - name: Enforce source, site, GUI and T2 Kernel acceptance
        if: always()
        run: |
          if ("${{ steps.source.outcome }}" -ne "success" -or
              "${{ steps.hygiene.outcome }}" -ne "success" -or
              "${{ steps.ui.outcome }}" -ne "success" -or
              "${{ steps.kernel.outcome }}" -ne "success" -or
              "${{ steps.visual.outcome }}" -ne "success") {
            throw "D11_LIVE_ACCEPTANCE_INCOMPLETE"
          }
          Write-Output "D11_LIVE_FULL_ACCEPTANCE=PASS"
      # Only four pixel screenshots of preloaded synthetic test Workspaces.
      # No private source, dist, JSON proposals or credentials leave the runner.
      - name: Capture tested desktop and mobile D11 interfaces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d11-visual-acceptance-${{ matrix.os }}
          path: ${{ runner.temp }}/d11-visual/*.png
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 6
      # No source, dist or raw project data published.

