name: D05 seal qualified hosting after confirmed catalogue correction
on:
  push:
    branches:
      - 'ci/once/d05-t3-seal-hosting/*'
    paths:
      - '.github/ci-requests/d05-t3-seal-hosting.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: d05-seal-hosting
  cancel-in-progress: false
jobs:
  admission:
    if: ${{ github.event.created == false && github.event.deleted == false && github.event.forced == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate deliberate one-shot qualification request
        shell: bash
        run: |
          python3 tools/ci/verify_once_request.py --repository Faust-S/knowledge --workflow d05-t3-seal-hosting --profile 0.3.2-seal-hosting --revision site=75eddb38289b5b10bffad82e2a6c2fc277101617 --revision subject=6852d55ae8e7100b480b2d5c0a10b92de1c7d467 --revision assistant=2c247482306f218a7d5be668de11e98f168862d4 --revision platform=8e26076ce66f0c26693a647e061fcd568e055b77
  linux:
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      normalized_tree: ${{ steps.normalized.outputs.tree }}
      digest: ${{ steps.package.outputs.digest }}
    env:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/cehovod.ru
          ref: 75eddb38289b5b10bffad82e2a6c2fc277101617
          path: site
          persist-credentials: false
          fetch-depth: 2
          token: ${{ secrets.DOMEN }}
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/cehovod
          ref: 6852d55ae8e7100b480b2d5c0a10b92de1c7d467
          path: domain
          persist-credentials: false
          token: ${{ secrets.DOMEN }}
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 2c247482306f218a7d5be668de11e98f168862d4
          path: assistant
          persist-credentials: false
          token: ${{ secrets.DOMEN }}
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 8e26076ce66f0c26693a647e061fcd568e055b77
          path: one-core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify pinned source and owner projection
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C site rev-parse HEAD)" = "75eddb38289b5b10bffad82e2a6c2fc277101617"
          test "$(git -C domain rev-parse HEAD)" = "6852d55ae8e7100b480b2d5c0a10b92de1c7d467"
          test "$(git -C assistant rev-parse HEAD)" = "2c247482306f218a7d5be668de11e98f168862d4"
          test "$(git -C one-core rev-parse HEAD)" = "8e26076ce66f0c26693a647e061fcd568e055b77"
          test "$(git -C one-core rev-parse HEAD:packages/t3-core)" = "1d969c6ed91995e213bb9f89fc3c17b309ba3770"
          cmp -s domain/models/assistant-skills.json site/public/assets/cehovod-assistant-skills.json
          cmp -s domain/src/lib/iwps/registry-snapshot.generated.json site/src/lib/iwps/registry-snapshot.generated.json
          echo D05_CURRENT_PINS_PASS
      - name: Verify the sole correction against the qualified predecessor
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import {execFileSync} from "node:child_process";
          import {readFileSync} from "node:fs";
          const git=(...args)=>execFileSync("git",args,{encoding:"utf8",stdio:["ignore","pipe","pipe"]});
          const path="src/routes/keisy.240-fartukov.tsx";
          assert.equal(git("rev-parse","HEAD^").trim(),"a9ead59a8db271209112a200bf7a8816b8449e0c");
          assert.deepEqual(git("diff","--name-only","HEAD^","HEAD").trim().split("\n"),[path]);
          const before=git("show","HEAD^:"+path);
          const broken=/^            <li>\n              <a\n                href="https:\/\/msk\.sarafanovo\.com\/category\/tekhnicheskie-tkani\/seryy\/"\n[\s\S]*?^            <\/li>\n/m;
          assert.ok(broken.test(before));
          const actual=readFileSync(path,"utf8");
          assert.equal(actual,before.replace(broken,"").replace("открытыми каталогами поставщика.","открытой карточкой материала у поставщика."));
          assert.ok(actual.includes('href="https://ufa.sarafanovo.com/product/tkan-sarzha-150-sm-260-gr-041-seryj/"'));
          console.log("D05_ONLY_CONFIRMED_BROKEN_EXTERNAL_REFERENCE_REMOVED");
          JS
      - name: Install locked site dependencies
        shell: bash
        working-directory: site
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/d05-current-npm.log" 2>&1 || { echo D05_CURRENT_NPM_FAIL; exit 1; }
          echo D05_CURRENT_NPM_PASS
      - name: Reconstruct the exact qualified predecessor tree and normalize the sole correction
        id: normalized
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          p=src/routes/keisy.240-fartukov.tsx
          cp "$p" "$RUNNER_TEMP/d05-final-corrected-page.tsx"
          git show "HEAD^:$p" >"$p"
          npx --no-install prettier --write scripts/check-t3-assistant-browser.ts scripts/d05-first-use-real-kernel-witness.mjs src/components/home/DocumentStack.tsx "$p" >"$RUNNER_TEMP/d05-current-format.log" 2>&1 || { echo D05_CURRENT_FORMAT_FAIL; exit 1; }
          git add -u
          prior_tree="$(git write-tree)"
          echo "D05_RECONSTRUCTED_PREDECESSOR_TREE=$prior_tree"
          test "$prior_tree" = "50e93d12e0a0648674fb83aad9f20be1c5e46247"
          cp "$RUNNER_TEMP/d05-final-corrected-page.tsx" "$p"
          npx --no-install prettier --write "$p" >>"$RUNNER_TEMP/d05-current-format.log" 2>&1
          rm -f "$RUNNER_TEMP/d05-final-corrected-page.tsx"
          git diff --check
          git add -u
          tree="$(git write-tree)"
          test "$(git diff --name-only "$prior_tree" "$tree")" = "$p"
          echo "D05_CURRENT_FORMATTED_TREE=$tree"
          echo "tree=$tree" >>"$GITHUB_OUTPUT"
          git diff --cached --binary >"$RUNNER_TEMP/d05-current-format.patch"
      - name: Retrieve exact published T3 input archive
        shell: bash
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download t3-platform-v0.3.2 --repo Faust-S/knowledge --pattern platform-inputs.zip --dir "$RUNNER_TEMP" >"$RUNNER_TEMP/d05-current-download.log" 2>&1 || { echo D05_CURRENT_PLATFORM_DOWNLOAD_FAIL; exit 1; }
          echo "5624d8a899c99fc2c100f57023eaf6fb1140f6f39ad1e7bfb85c5f20faadd32b  $RUNNER_TEMP/platform-inputs.zip" | shasum -a 256 -c
          node scripts/t3-platform-inputs.mjs verify "$RUNNER_TEMP/platform-inputs.zip" >"$RUNNER_TEMP/d05-current-platform.log" 2>&1 || { echo D05_CURRENT_PLATFORM_VERIFY_FAIL; exit 1; }
          echo D05_CURRENT_PLATFORM_PASS
      - name: Verify unchanged subject and assistant evidence from the first qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Faust-S/knowledge/actions/runs/46134347428 >"$RUNNER_TEMP/d05-prior-run.json"
          gh api repos/Faust-S/knowledge/actions/jobs/140946226512 >"$RUNNER_TEMP/d05-prior-linux.json"
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";
          const read=name=>JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/"+name,"utf8"));
          const r=read("d05-prior-run.json"),j=read("d05-prior-linux.json");
          assert.equal(r.head_sha,"b46f267bb4411a98df830a53540f25c762e7a62c");
          assert.equal(j.run_id,46134347428);
          assert.equal(j.name,"linux");
          assert.equal(j.steps.find(s=>s.name==="Verify owner subject, original assistant, and exact skill contract")?.conclusion,"success");
          assert.equal(j.steps.find(s=>s.name==="Verify pinned source and owner projection")?.conclusion,"success");
          console.log("D05_CURRENT_UNCHANGED_199_SUBJECT_ASSISTANT_TESTS_REUSED");
          JS
      - name: Verify completed predecessor regression, static and actual T2 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Faust-S/knowledge/actions/runs/46139054634 >"$RUNNER_TEMP/d05-qualified-predecessor-run.json"
          gh api repos/Faust-S/knowledge/actions/jobs/140960744989 >"$RUNNER_TEMP/d05-qualified-predecessor-job.json"
          gh api --allow-escape-sequences repos/Faust-S/knowledge/actions/jobs/140960744989/logs >"$RUNNER_TEMP/d05-qualified-predecessor.log"
          python3 "$GITHUB_WORKSPACE/harness/qualification/d05/current-hosting/verify-predecessor.py" "$RUNNER_TEMP"
          gh api repos/Faust-S/knowledge/actions/runs/46141394525 >"$RUNNER_TEMP/d05-qualified-integrated-run.json"
          gh api repos/Faust-S/knowledge/actions/jobs/140967926402 >"$RUNNER_TEMP/d05-qualified-integrated-job.json"
          gh api --allow-escape-sequences repos/Faust-S/knowledge/actions/jobs/140967926402/logs >"$RUNNER_TEMP/d05-qualified-integrated.log"
          python3 "$GITHUB_WORKSPACE/harness/qualification/d05/current-hosting/verify-integrated.py" "$RUNNER_TEMP"
      - name: Check current source and the affected site contracts without repeating unchanged algorithms
        id: source_gate
        continue-on-error: true
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-current-source.log"
          failed=0
          for gate in prepare:static verify:generated verify:static-build-contract typecheck lint; do
            if npm run "$gate" >"$log" 2>&1; then
              echo "D05_CURRENT_SOURCE $gate PASS"
            else
              echo "D05_CURRENT_SOURCE $gate FAIL"
              grep -Eo '(src|scripts)/[A-Za-z0-9_.$/-]+\.(tsx?|mjs)\([0-9]+,[0-9]+\): error TS[0-9]+|prettier/prettier|CEHOVOD_[A-Z0-9_]+' "$log" | head -60 || true
              failed=1
            fi
          done
          if npx --no-install vitest run src/design-contract.test.ts src/order-route-design-contract.test.ts src/static-checks-contract.test.ts src/site-routes.test.ts src/data/materials.test.ts --reporter=json --outputFile="$RUNNER_TEMP/d05-current-targeted-tests.json" >"$log" 2>&1; then
            echo D05_CURRENT_TARGETED_TESTS_PASS
          else
            echo D05_CURRENT_TARGETED_TESTS_FAIL
            failed=1
          fi
          python3 "$GITHUB_WORKSPACE/harness/qualification/d05/current-hosting/verify-predecessor.py" "$RUNNER_TEMP" targeted
          test "$failed" -eq 0
          git diff --check
          git add -u
          echo "D05_SOURCE_QUALIFIED_TREE=$(git write-tree)"
      - name: Prepare verified canonical Host and retain original input bytes
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-current-canonical-host.log"
          code=0
          (rm -rf dist .native-build "$RUNNER_TEMP/d05-current-loopback-host" && npm run prepare:t3-host -- "$GITHUB_WORKSPACE/one-core/packages/t3-core" "$RUNNER_TEMP/cehovod-host" "$RUNNER_TEMP/platform-inputs.zip" "$GITHUB_WORKSPACE/assistant" https://cehovod.ru && npm run retain:t3-inputs -- "$RUNNER_TEMP/cehovod-host" "$RUNNER_TEMP/platform-inputs.zip") >"$log" 2>&1 || code=$?
          grep -E '^# (tests|pass|fail) [0-9]+$|^D05_[A-Z0-9_]+=(PASS|FAIL|NOT_RUN)$|^D05_[A-Z0-9_]+_PASS$|^CEHOVOD_[A-Z0-9_]+_PASS$' "$log" | tail -60 || true
          grep -Eo 'CEHOVOD_[A-Z0-9_]+|IWXA_[A-Z0-9_]+|TS[0-9]{4,6}|TimeoutError|AssertionError|ERR_[A-Z0-9_]+' "$log" | sort -u | head -40 || true
          if [ "$code" -ne 0 ]; then echo "D05_CURRENT_CANONICAL_HOST_FAIL"; exit "$code"; fi
          echo "D05_CURRENT_CANONICAL_HOST_PASS"
      - name: Build canonical distribution from verified retained inputs
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-current-canonical-dist.log"
          code=0
          (node scripts/build-cehovod-t3-local-site.mjs && npm run verify:product:t3 -- --production) >"$log" 2>&1 || code=$?
          grep -E '^# (tests|pass|fail) [0-9]+$|^D05_[A-Z0-9_]+=(PASS|FAIL|NOT_RUN)$|^D05_[A-Z0-9_]+_PASS$|^CEHOVOD_[A-Z0-9_]+_PASS$' "$log" | tail -60 || true
          grep -Eo 'CEHOVOD_[A-Z0-9_]+|IWXA_[A-Z0-9_]+|TS[0-9]{4,6}|TimeoutError|AssertionError|ERR_[A-Z0-9_]+' "$log" | sort -u | head -40 || true
          if [ "$code" -ne 0 ]; then echo "D05_CURRENT_CANONICAL_DIST_FAIL"; exit "$code"; fi
          echo "D05_CURRENT_CANONICAL_DIST_PASS"
      - name: Check actual Apache routing and assets
        id: apache_gate
        continue-on-error: true
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          if ! command -v apache2 >/dev/null 2>&1 && ! command -v httpd >/dev/null 2>&1; then
            sudo apt-get update -qq >"$RUNNER_TEMP/d05-current-apache-install.log" 2>&1
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq apache2 >>"$RUNNER_TEMP/d05-current-apache-install.log" 2>&1
          fi
          set -euo pipefail
          log="$RUNNER_TEMP/d05-current-apache.log"
          code=0
          npm run check:htaccess:strict >"$log" 2>&1 || code=$?
          grep -E '^# (tests|pass|fail) [0-9]+$|^D05_[A-Z0-9_]+=(PASS|FAIL|NOT_RUN)$|^D05_[A-Z0-9_]+_PASS$|^CEHOVOD_[A-Z0-9_]+_PASS$' "$log" | tail -60 || true
          grep -Eo 'CEHOVOD_[A-Z0-9_]+|IWXA_[A-Z0-9_]+|TS[0-9]{4,6}|TimeoutError|AssertionError|ERR_[A-Z0-9_]+' "$log" | sort -u | head -40 || true
          if [ "$code" -ne 0 ]; then echo "D05_CURRENT_APACHE_FAIL"; exit "$code"; fi
          echo "D05_CURRENT_APACHE_PASS"
          grep -Eq '^  Apache integration[[:space:]]*:[[:space:]]*PASS$' "$log"
      - name: Confirm corrected case page and cold offline site in actual final distribution
        id: current_browser
        continue-on-error: true
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          audit=scripts/d05-release-final-case.ts
          test ! -e "$audit"
          trap 'rm -f "$audit"' EXIT
          cp "$GITHUB_WORKSPACE/harness/qualification/d05/current-hosting/check-final-case.ts" "$audit"
          log="$RUNNER_TEMP/d05-current-case-page.log"
          code=0
          node --import tsx "$audit" >"$log" 2>&1 || code=$?
          grep -E '^D05_FINAL_CASE_[A-Z_]+|^\{"status":"D05_FINAL_CASE_PASS"' "$log" || true
          grep -Eo 'D05_FINAL_CASE_[A-Z_]+|TimeoutError|AssertionError|d05-release-final-case\.ts:[0-9]+:[0-9]+' "$log" | sort -u | head -40 || true
          test "$code" -eq 0
          grep -q '^{"status":"D05_FINAL_CASE_PASS",' "$log"
          log="$RUNNER_TEMP/d05-current-cold-site.log"
          code=0
          npm run check:t3-public-offline >"$log" 2>&1 || code=$?
          grep -E '^\{"status":"CEHOVOD_T3_(ALL_SITE_COLD|PUBLIC_COLD_OFFLINE)_PASS"' "$log" || true
          grep -Eo 'CEHOVOD_T3_OFFLINE_[A-Z0-9_-]+|TimeoutError|AssertionError' "$log" | sort -u | head -40 || true
          test "$code" -eq 0
          grep -q '^{"status":"CEHOVOD_T3_ALL_SITE_COLD_PASS",' "$log"
          grep -q '^{"status":"CEHOVOD_T3_PUBLIC_COLD_OFFLINE_PASS",' "$log"
      - name: Verify external public anchor destinations without disclosing private source
        id: external_gate
        continue-on-error: true
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/harness/qualification/d05/current-hosting/external-links.py" dist "$RUNNER_TEMP/d05-external-links.json"
      - name: Require preserved integrated evidence and all current distribution gates
        shell: bash
        env:
          SOURCE_GATE: ${{ steps.source_gate.outcome }}
          APACHE_GATE: ${{ steps.apache_gate.outcome }}
          CURRENT_BROWSER: ${{ steps.current_browser.outcome }}
          EXTERNAL_GATE: ${{ steps.external_gate.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for gate in SOURCE_GATE APACHE_GATE CURRENT_BROWSER EXTERNAL_GATE; do
            echo "D05_FINAL_GATE $gate=${!gate}"
            [ "${!gate}" = success ] || failed=1
          done
          test -s "$RUNNER_TEMP/d05-integrated-evidence.json"
          test "$failed" -eq 0
      - name: Rebuild from retained bytes and verify damaged input rollback
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-current-repro.log"
          code=0
          node scripts/check-t3-dist-reproducibility.mjs >"$log" 2>&1 || code=$?
          grep -E '^# (tests|pass|fail) [0-9]+$|^D05_[A-Z0-9_]+=(PASS|FAIL|NOT_RUN)$|^D05_[A-Z0-9_]+_PASS$|^CEHOVOD_[A-Z0-9_]+_PASS$' "$log" | tail -60 || true
          grep -Eo 'CEHOVOD_[A-Z0-9_]+|IWXA_[A-Z0-9_]+|TS[0-9]{4,6}|TimeoutError|AssertionError|ERR_[A-Z0-9_]+' "$log" | sort -u | head -40 || true
          if [ "$code" -ne 0 ]; then echo "D05_CURRENT_REPRO_FAIL"; exit "$code"; fi
          echo "D05_CURRENT_REPRO_PASS"
          grep -E '^\{"status":"CEHOVOD_T3_REPRO_PASS","files":[0-9]+,"invalidInputPreservedDist":true,"exactBytes":true,"productAccepted":false\}$' "$log"
      - name: Require completed actual hardware inference on unchanged runtime and verify exact correction boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            gh api repos/Faust-S/knowledge/actions/jobs/140946226501 >"$RUNNER_TEMP/d05-prior-hardware.json"
            status="$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/d05-prior-hardware.json")).status')"
            [ "$status" = completed ] && break
            sleep 20
          done
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";
          const j=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/d05-prior-hardware.json","utf8"));
          assert.equal(j.run_id,46134347428);
          assert.equal(j.name,"hardware");
          assert.equal(j.status,"completed");
          assert.equal(j.conclusion,"success");
          for(const name of ["Verify pinned source and owner projection","Retrieve exact published T3 input archive","Prove real nonfallback WebGPU hardware","Assemble actual T3 loopback product","Run actual local model, cancel, online and cold offline use","Require four exact-result and correct-choice observations (not semantic acceptance)","Require actual offline cross-service continuity and explicit abstention"])
            assert.equal(j.steps.find(s=>s.name===name)?.conclusion,"success","D05_HARDWARE_GATE");
          console.log("D05_CURRENT_ACTUAL_MODEL_EVIDENCE_REUSED_LINK_AND_TEST_FORMAT_CORRECTION");
          JS
      - name: Seal hosting package after successful corrected Linux and hardware qualification
        shell: bash
        working-directory: site
        id: package
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/workspace/index.html
          git diff --check
          git add -u
          tree="$(git write-tree)"
          echo "D05_CURRENT_FINAL_SOURCE_TREE=$tree"
          test "$tree" = "${{ steps.normalized.outputs.tree }}"
          git diff HEAD --binary >"$RUNNER_TEMP/d05-current-final.patch"
          python3 "$GITHUB_WORKSPACE/harness/qualification/d05/current-hosting/package.py" dist "$RUNNER_TEMP/d05-current-final.patch" "$RUNNER_TEMP/cehovod-hosting.zip" "$tree" "$RUNNER_TEMP/d05-external-links.json" "$RUNNER_TEMP/d05-source-gates.json" "$RUNNER_TEMP/d05-integrated-evidence.json"
          openssl cms -encrypt -binary -aes-256-gcm -outform DER -in "$RUNNER_TEMP/cehovod-hosting.zip" -out "$RUNNER_TEMP/cehovod-hosting.cms" -recip "$GITHUB_WORKSPACE/harness/qualification/d05/current-hosting/recipient.pem" -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256
          digest="$(sha256sum "$RUNNER_TEMP/cehovod-hosting.zip" | cut -d' ' -f1)"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "D05_CURRENT_HOSTING_ZIP_SHA256=$digest"
          rm -f "$RUNNER_TEMP/cehovod-hosting.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: d05-t3-0.3.2-hosting-encrypted
          path: ${{ runner.temp }}/cehovod-hosting.cms
          if-no-files-found: error
          retention-days: 7
      - name: Destroy private source and unencrypted temporary data
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/site" "$GITHUB_WORKSPACE/domain" "$GITHUB_WORKSPACE/assistant" "$GITHUB_WORKSPACE/one-core" "$RUNNER_TEMP/cehovod-host" "$RUNNER_TEMP/d05-current-loopback-host"
          rm -f "$RUNNER_TEMP"/d05-current-*.log "$RUNNER_TEMP"/d05-current-*.patch "$RUNNER_TEMP"/d05-qualified-*.log "$RUNNER_TEMP/d05-final-corrected-page.tsx" "$RUNNER_TEMP/platform-inputs.zip" "$RUNNER_TEMP/cehovod-hosting.zip"
