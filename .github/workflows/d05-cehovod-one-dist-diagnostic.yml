name: d05-cehovod-one-dist-diagnostic
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: D05 one-dist (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact private site and immutable T2 inputs
        env:
          DOMEN: ${{ secrets.DOMEN }}
        run: |
          set -euo pipefail
          test -n "${DOMEN:-}" || { echo "D05_DOMEN=UNAVAILABLE"; exit 1; }
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DOMEN" | base64 | tr -d '\r\n')"
          if ! GIT_TERMINAL_PROMPT=0 git -c "http.extraheader=$header" clone --quiet --depth 1 --single-branch --branch work/2026-10-23-t2-site-only --no-tags https://github.com/Faust-S/cehovod.ru.git site >/dev/null 2>&1; then
            echo "D05_SITE_ACCESS=FAIL"
            exit 1
          fi
          test "$(git -C site rev-parse HEAD)" = "7821b0fc4b902b4aaee9c28cf3ca079c0557e944" || { echo "D05_SITE_PIN=FAIL"; exit 1; }
          echo "D05_SITE_PIN=PASS"
          git init --quiet t2
          if ! GIT_TERMINAL_PROMPT=0 git -C t2 -c "http.extraheader=$header" fetch --quiet --depth 1 --no-tags https://github.com/Faust-S/T2.git e70de29b72b83e2546f7ab74b17572685a728c17 >/dev/null 2>&1; then
            echo "D05_T2_READ_PIN=FAIL"
            exit 1
          fi
          git -C t2 checkout --quiet --detach FETCH_HEAD
          test "$(git -C t2 rev-parse HEAD)" = "e70de29b72b83e2546f7ab74b17572685a728c17" || { echo "D05_T2_PIN=FAIL"; exit 1; }
          echo "D05_T2_PIN=PASS"
          unset header DOMEN
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install site dependencies
        run: |
          set -euo pipefail
          if (cd site && npm ci --no-audit --no-fund) > "$RUNNER_TEMP/d05-site-install.log" 2>&1; then
            echo "D05_SITE_NPM_CI=PASS"
          else
            echo "D05_SITE_NPM_CI=FAIL"
            exit 1
          fi
      - name: Verify the exact accepted T2 Kernel archive and stage
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/t2/t2/current/final-successor/kernel-successors/k036-same-store-event-history-20261019/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip"
          node - "$archive" <<'NODE'
          const fs=require("node:fs");
          const crypto=require("node:crypto");
          const archive=process.argv[2];
          const expected="7075b8b9590ef1283e34ecb3c21dd9d1b7342697287e1aa150cd4f4a60860b68";
          const actual=crypto.createHash("sha256").update(fs.readFileSync(archive)).digest("hex");
          if(actual!==expected) {console.log("D05_KERNEL_ARCHIVE_SHA=FAIL"); process.exit(1);}
          console.log("D05_KERNEL_ARCHIVE_SHA=PASS");
          NODE
          mkdir -p "$RUNNER_TEMP/qualified-kernel" "$RUNNER_TEMP/verified-kernel"
          unzip -qq "$archive" -d "$RUNNER_TEMP/qualified-kernel"
          test -f "$RUNNER_TEMP/qualified-kernel/_iwxa/runtime/0.3.6/runtime.js" || { echo "D05_KERNEL_LAYOUT=FAIL"; exit 1; }
          verifier="$GITHUB_WORKSPACE/t2/t2/current/final-successor/canonical-source/scripts/stage-verified-kernel.mjs"
          if node "$verifier" "$RUNNER_TEMP/qualified-kernel" "$RUNNER_TEMP/verified-kernel" --qualification-only --artifact-id iwxa-kernel-k036-same-store-history-20261019-qualified.1 > "$RUNNER_TEMP/d05-kernel-verification.log" 2>&1; then
            echo "D05_KERNEL_QUALIFIED_STAGING=PASS"
          else
            echo "D05_KERNEL_QUALIFIED_STAGING=FAIL"
            exit 1
          fi
      - name: Assemble single diagnostic T2 product without browser automation
        env:
          IWXA_T2_CANONICAL_ROOT: ${{ github.workspace }}/t2/t2/current/final-successor/canonical-source
          IWXA_CEHOVOD_QUALIFIED_KERNEL_DIST: ${{ runner.temp }}/qualified-kernel
          IWXA_CEHOVOD_HOST_ORIGIN: https://127.0.0.1:8443
        run: |
          set -euo pipefail
          cd site
          if npm run diagnostic:preview:assemble > "$RUNNER_TEMP/d05-product-diagnostic.log" 2>&1; then
            echo "D05_DIAGNOSTIC_ONE_DIST=PASS"
          else
            echo "D05_DIAGNOSTIC_ONE_DIST=FAIL"
            node -e '
            const fs=require("node:fs");
            const text=fs.readFileSync(process.env.RUNNER_TEMP+"/d05-product-diagnostic.log","utf8");
            const codes=[...new Set(text.match(/\\b(?:CEHOVOD_[A-Z0-9_]+|T2_[A-Z0-9_]+|ERR_[A-Z0-9_]+)\\b/g)||[])];
            console.log("D05_DIAGNOSTIC_CODES="+codes.slice(-10).join(","));
            console.log("D05_HOST_DEPENDENCIES_READY="+text.includes("CEHOVOD_T2_DISPOSABLE_HOST_DEPENDENCIES_READY"));
            console.log("D05_SSR_ASSEMBLY_REACHED="+text.includes("CEHOVOD_T2_DIAGNOSTIC_PREVIEW_ASSEMBLED_NOT_QUALIFIED"));
            '
            exit 1
          fi
          test -f dist/_iwxa/current.json || { echo "D05_KERNEL_IN_DIST=FAIL"; exit 1; }
          for file in keisy/index.html keisy/120-kronshteynov/index.html keisy/240-fartukov/index.html keisy/48-tumb/index.html workspace/index.html; do
            test -f "dist/$file" || { echo "D05_STATIC_ROUTE_IN_DIST=FAIL"; exit 1; }
          done
          echo "D05_STATIC_ROUTES_IN_DIST=PASS"
          echo "D05_DIST_PUBLISHED=NO"
          echo "D05_BROWSER_GUI=NOT_RUN"
          echo "D05_KERNEL_RECEIPTS=NOT_RUN"
