name: K05 public pinned evidence evaluation

on:
  push:
    branches:
      - work/2026-11-05-k05-evidence-context-evaluation
    paths:
      - 'research/cross-lab/k05_evaluation.py'
      - 'research/cross-lab/tests/test_k05_evaluation.py'
      - 'research/cross-lab/tests/test_k05_k03_projection.py'
      - 'research/cross-lab/tests/test_k05_c17_projection.py'
      - 'research/cross-lab/tests/test_k05_agent_consumer.py'
      - 'research/cross-lab/k05_agent05_final_result_binding.py'
      - 'research/cross-lab/tests/test_k05_agent05_final_result_binding.py'
      - 'research/cross-lab/k05_agent05_graph_readback.py'
      - 'research/cross-lab/tests/test_k05_agent05_graph_readback.py'
      - 'research/cross-lab/k05_agent05_observations.py'
      - 'research/cross-lab/tests/test_k05_agent05_observations.py'
      - 'research/cross-lab/k05_real_offer_public.py'
      - 'research/cross-lab/tests/test_k05_real_offer_public.py'
      - 'research/cross-lab/k05_k01_refresh_review.mjs'
      - 'research/cross-lab/k05_k01_refresh_study.mjs'
      - 'research/cross-lab/k05_k01_evidence_check.mjs'
      - 'research/cross-lab/tests/test_k05_k01_refresh_review.test.mjs'
      - 'research/cross-lab/k05_commercial_ablation.mjs'
      - 'research/cross-lab/k05_k01_evidence_check.mjs'
      - 'research/cross-lab/tests/test_k05_commercial_ablation.test.mjs'
      - 'research/cross-lab/k05_u02_verified_reads.mjs'
      - 'research/cross-lab/tests/test_k05_u02_verified_reads.test.mjs'
      - 'research/cross-lab/k05_k02_source_cases.py'
      - 'research/cross-lab/k05_k02_strategy_compare.mjs'
      - 'research/cross-lab/tests/test_k05_k02_source_cases.py'
      - 'research/cross-lab/tests/test_k05_k02_strategy_compare.test.mjs'
      - 'research/cross-lab/k05_c17_projection.py'
      - 'research/cross-lab/tests/k05_k03_live.py'
      - '.github/workflows/k05-evidence-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k05-source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit and negative source tests
        run: python -W error::ResourceWarning -m unittest discover -s research/cross-lab/tests -v
      - name: Replay two immutable real public revisions
        run: python research/cross-lab/k05_evaluation.py --out "$RUNNER_TEMP/k05-proof.json" --rounds 200
      - name: Assert portable proof and no human-gold claims
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads((Path(os.environ["RUNNER_TEMP"]) / "k05-proof.json").read_text())
          assert receipt["schema"] == "IWXA_K05_COMPARISON_RESULT/0.2"
          assert receipt["status"] == "CONFIRMED"
          assert receipt["baseline"]["status"] == receipt["tested"]["status"] == "EVIDENCE_CHANGED"
          assert receipt["checks"]["baseline_tested_agreement"] is True
          assert receipt["measured"]["versions_verified"] == 2
          assert receipt["measured"]["review_bytes_tested"] < receipt["measured"]["review_bytes_baseline"]
          assert receipt["scope"]["human_gold"] is False
          assert receipt["scope"]["claim_labels_semantically_validated"] is False
          assert receipt["unknown"]["semantic_claim_accuracy"] is None
          assert receipt["unknown"]["human_task_accuracy"] is None
          assert receipt["unknown"]["human_completion_time_ms"] is None
          assert receipt["unknown"]["agent_result_readback"] == "NOT_TESTED"
          assert "source_text" not in str(receipt)
          print("K05_REVISION_CHANGE_BASELINE_PASS; SEMANTIC_CONFLICT_NOT_INFERRED")
          PY
      - name: Evaluate public multi-repository pinned suite
        run: python research/cross-lab/k05_evaluation.py --suite --out "$RUNNER_TEMP/k05-suite-proof.json" --rounds 100
      - name: Verify portable multi-source source-first proof
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads((Path(os.environ["RUNNER_TEMP"]) / "k05-suite-proof.json").read_text())
          assert receipt["schema"] == "IWXA_K05_EVALUATION_SUITE/0.1"
          assert receipt["status"] == "PASS"
          assert receipt["summary"]["case_count"] == 4
          assert receipt["summary"]["confirmed_cases"] == 4
          assert receipt["summary"]["baseline_agreement_count"] == 4
          assert receipt["summary"]["evidence_changed_cases"] == 3
          assert receipt["summary"]["evidence_unchanged_cases"] == 1
          assert receipt["summary"]["unique_source_versions"] == 6
          assert receipt["summary"]["unique_repositories"] == 3
          assert receipt["scope"]["human_gold"] is False
          assert receipt["scope"]["tested_has_curated_line_locator"] is True
          assert receipt["unknown"]["human_task_accuracy"] is None
          assert receipt["unknown"]["real_agent_result_readback"] == "NOT_TESTED"
          assert receipt["summary"]["review_payload_bytes_tested"] < receipt["summary"]["review_payload_bytes_baseline"]
          assert "source_text" not in str(receipt)
          print("K05_MULTI_SOURCE_PINNED_PASS; HUMAN_OUTCOME_NOT_MEASURED")
          PY
      - name: Live pinned Python release revision evidence for Agent Result handoff
        run: |
          python - <<'PY'
          import sys, json
          from dataclasses import asdict
          from pathlib import Path
          sys.path.insert(0, 'research/cross-lab')
          import k05_evaluation as k05
          case = k05.CPYTHON_CASE
          verified_bytes = {pin.version:k05.fetch_public_pinned_source(pin)
                            for pin in case.sources}
          result = asdict(k05.evaluate_case(case, verified_bytes, rounds=30))
          assert k05.verify_evidence_receipt(result, case, verified_bytes)
          assert result['schema'] == 'IWXA_K05_COMPARISON_RESULT/0.2'
          assert result['status'] == 'CONFIRMED'
          assert result['tested']['status'] == 'EVIDENCE_CHANGED'
          assert [o['locator'] for o in result['tested']['observations']] == ['L1', 'L1']
          assert all(o['state']=='OBSERVED' for o in result['tested']['observations'])
          assert result['scope']['claim_labels_semantically_validated'] is False
          assert result['unknown']['agent_result_readback'] == 'NOT_TESTED'
          assert result['unknown']['human_completion_time_ms'] is None
          out=Path(__import__('os').environ['RUNNER_TEMP'])/'k05-agent-result-evidence.json'
          with out.open('x', encoding='utf-8') as stream:
              json.dump(result, stream, sort_keys=True, ensure_ascii=True, indent=2)
          print('K05_REAL_PYTHON_312_313_AGENT_EVIDENCE_PASS',
                'source_versions', result['measured']['versions_verified'],
                'baseline_bytes', result['measured']['review_bytes_baseline'],
                'tested_excerpt_bytes', result['measured']['review_bytes_tested'],
                'semantic_claim_accuracy', result['unknown']['semantic_claim_accuracy'])
          PY
      - name: Checkout owner U02 source port, read-only
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Br-test
          ref: fc045f7bc34a98299f598dfda9ac757db85497e5
          path: .u02-owner
          persist-credentials: false
      - name: Compare two already-verified U02 snapshots without network access from K05
        env:
          K05_U02_OWNER_ROOT: .u02-owner
        run: |
          node --test research/cross-lab/tests/test_k05_u02_verified_reads.test.mjs
      - name: Checkout pinned K01 owner and commercial research fixture (read-only)
        uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 81de619f09f4393945ce5073fda5514729a67414
          path: .k01-owner
          persist-credentials: false
      - name: Install exact K01 package dependency in isolated read-only owner checkout
        run: npm install --prefix .k01-owner --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Compare four commercial-offer methods on identical owner inputs
        env:
          K05_K01_OWNER_ROOT: .k01-owner
        run: |
          node --test research/cross-lab/tests/test_k05_commercial_ablation.test.mjs
          node research/cross-lab/k05_commercial_ablation.mjs \
            --k01-owner-root .k01-owner \
            --out "$RUNNER_TEMP/k05-commercial-ablation.json"
      - name: Confirm no fake human gold or measured model quality
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'k05-commercial-ablation.json').read_text())
          assert report['schema']=='IWXA_K05_PROJECT_METHOD_ABLATION/0.1'
          assert len(report['scenarios'])==4
          assert all(len(case['methods'])==4 for case in report['scenarios'])
          assert report['constraints']['independentHumanGold'] is False
          assert report['constraints']['precision'] is None
          assert report['constraints']['llmCalls']==0
          assert all(x['metrics'].get('additionalHostReads',0)==0
            for c in report['scenarios'] for x in c['methods']
            if x['method']=='K01_PLUS_K05_SOURCE_CHECK')
          print('K05_K01_FOUR_ARMS_SOURCE_BOUND_MEASUREMENTS_PASS')
          PY
      - name: Discover official published supplier quote and board procurement packet
        run: |
          if ! command -v pdftotext; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          command -v pdftotext
          python research/cross-lab/k05_real_offer_public.py \
            --out "$RUNNER_TEMP/k05-public-offer-proof.json"
      - name: Verify pinned public quote evidence and historical unknowns
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads((Path(os.environ['RUNNER_TEMP'])/'k05-public-offer-proof.json').read_text())
          assert p['status']=='PINNED_PUBLIC_PDF_OBSERVED'
          assert p['source']['sha256']=='a97dcffeead9991795ec68975c71ccb12bd4e0aa6839b5c7e9c667e37a264d64'
          assert p['facts']['arithmetic_total_usd']=='10000.00'
          assert p['epistemic']['source_revision_pinned'] is True
          assert [x['locator'] for x in p['observations']] == ['pdf-page:67','pdf-page:68','pdf-page:69']
          assert p['facts']['prior_unrevised_price'] is None
          assert p['facts']['payment_amount_definitely_due_upfront'] is None
          print('K05_REAL_PUBLIC_PROCUREMENT_PINNED_SOURCE_PROOF_PASS')
          PY
      - name: Checkout current pinned K01 owner for refresh qualification
        uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 4d2db2dd1e27c3e27db0fec71dea791657db8453
          path: .k01-refresh-owner
          persist-credentials: false
      - name: Install pinned K01 public dependencies for refresh tests
        run: npm install --prefix .k01-refresh-owner --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Verify owner refresh and independent K05 source proof
        env:
          K05_K01_OWNER_ROOT: .k01-refresh-owner
        run: |
          node --test research/cross-lab/tests/test_k05_k01_refresh_review.test.mjs
          node research/cross-lab/k05_k01_refresh_study.mjs \
            --k01-owner-root .k01-refresh-owner \
            --out "$RUNNER_TEMP/k05-k01-refresh-measurements.json"
      - name: Hold if reported K05 savings or outdated Source status is invented
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          proof=json.loads((root/'k05-k01-refresh-measurements.json').read_text())
          assert proof['schema']=='IWXA_K05_K01_REFRESH_MEASUREMENTS/0.1'
          assert [x['status'] for x in proof['trials']] == ['CURRENT','UPDATED',
            'INCOMPLETE','REJECTED','REJECTED','UPDATED','UPDATED']
          assert proof['trials'][5]['unchangedClaims'] is True
          assert proof['trials'][6]['unchangedClaims'] is True
          assert all(x['repetitions']==12 and x['k05SourceReads']==0
            and x['humanGold'] is False and x['f1'] is None for x in proof['trials'])
          assert proof['trials'][4]['scenario']=='revoked_permission'
          assert proof['trials'][4]['ownerSourceReads']==0
          assert proof['trials'][4]['ownerSourceCatalogReads']==0
          assert proof['limits']['memoryGain']=='NOT_MEASURED'
          assert proof['limits']['realModelInvocations']==0
          print('K05_K01_CURRENT_REFRESH_SOURCE_PROOF_PASS_NO_PRIVATE_INPUTS')
          PY
      - name: Checkout pinned K02 owner code, read-only
        uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 2fac2a6b007a84f3cf14220d2d4a668f9d97916c
          path: .k02-owner
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare 8 real pinned source-bound tasks, no LLM calls
        run: |
          python research/cross-lab/k05_k02_source_cases.py \
            --k02-owner-root .k02-owner \
            --out "$RUNNER_TEMP/k05-k02-corpus.json"
      - name: Run K02 selection policies on reproducible synthetic outcomes
        env:
          K05_K02_CASES_PATH: ${{ runner.temp }}/k05-k02-corpus.json
          K05_K02_OWNER_ROOT: .k02-owner
        run: |
          node --test research/cross-lab/tests/test_k05_k02_strategy_compare.test.mjs
          node research/cross-lab/k05_k02_strategy_compare.mjs \
            --corpus "$RUNNER_TEMP/k05-k02-corpus.json" \
            --k02-owner-root .k02-owner \
            --out "$RUNNER_TEMP/k05-k02-routing-diagnostic.json"
      - name: Confirm no model inference or invented usage
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          corpus=json.loads((root/'k05-k02-corpus.json').read_text())
          comparison=json.loads((root/'k05-k02-routing-diagnostic.json').read_text())
          assert corpus['case_count']==8
          assert corpus['unique_verified_source_versions']==7
          assert corpus['model_quality']=='NOT_MEASURED'
          assert comparison['source_corpus_cases']==8
          assert len(comparison['strategies'])==4
          assert comparison['limitations']['real_model_invocations']==0
          assert comparison['limitations']['model_quality']=='NOT_MEASURED'
          assert comparison['limitations']['actual_provider_cost_usd'] is None
          assert comparison['limitations']['actual_inference_latency_ms'] is None
          assert comparison['limitations']['no_router_comparison_win_established'] is True
          print('K05_K02_PINNED_EIGHT_CASES_AND_FOUR_STRATEGIES_PASS')
          PY
      - name: Verify exact Agent Graph final Result readback binding
        run: |
          python -m unittest research/cross-lab/tests/test_k05_agent05_final_result_binding.py -v
          echo K05_AGENT05_GRAPH_FINAL_RESULT_BINDING_PASS_NO_CORE_READS
      - name: Verify saved Graph artifact/config digests against Agent K05 observations
        run: |
          python -m unittest research/cross-lab/tests/test_k05_agent05_graph_readback.py -v
          echo K05_AGENT05_GRAPH_SNAPSHOT_LINKAGE_PASS_NO_PRIVATE_AGENT_CHECKOUT
      - name: Confirm Agent 0.5 paired observation gate without private agent sources
        run: |
          python -m unittest research/cross-lab/tests/test_k05_agent05_observations.py -v
          echo K05_AGENT05_PAIRED_OBSERVATIONS_CONTRACT_PASS_NO_PRIVATE_CHECKOUT
      - name: C17 aggregate projection regression (no human reviews)
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'research/cross-lab')
          sys.path.insert(0, 'research/cross-lab/tests')
          import test_k05_c17_projection as example
          import k05_c17_projection as k05
          from dataclasses import asdict
          footprint, plan = example.case()
          output = asdict(k05.compare_c17_aggregate(footprint, plan))
          assert output["measured"]["candidate_counts"] == {
              "all": 23, "literal_enter_leave": 6, "reed_closed_after_end_5s": 3}
          assert output["measured"]["potential_footprint_reduction_percent"] == 93.17
          assert output["unknown"]["human_active_seconds"] is None
          assert output["unknown"]["task_f1"] is None
          assert k05.verify_c17_comparison(output, footprint, plan)
          print('K05_C17_23_6_3_AGGREGATE_PASS; HUMAN_REVIEW_NOT_MEASURED')
          PY
      - name: Checkout pinned K03 owner source (read-only public)
        uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 5688d58432b807b1c8afe41b1aa54bd949ab7ab1
          path: .k03-owner
          persist-credentials: false
      - name: K05 source-only proof of one real K03 issue without a new evaluator
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python research/cross-lab/tests/k05_k03_live.py
      - uses: actions/upload-artifact@v4
        with:
          name: k05-public-hash-only-proof
          path: |
            ${{ runner.temp }}/k05-proof.json
            ${{ runner.temp }}/k05-suite-proof.json
            ${{ runner.temp }}/k05-agent-result-evidence.json
            ${{ runner.temp }}/k05-commercial-ablation.json
            ${{ runner.temp }}/k05-k01-refresh-measurements.json
            ${{ runner.temp }}/k05-public-offer-proof.json
            ${{ runner.temp }}/k05-k02-corpus.json
            ${{ runner.temp }}/k05-k02-routing-diagnostic.json
          retention-days: 7
