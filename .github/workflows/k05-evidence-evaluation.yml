name: K05 public pinned evidence evaluation

on:
  push:
    branches:
      - work/2026-11-05-k05-evidence-context-evaluation
    paths:
      - 'research/cross-lab/k05_evaluation.py'
      - 'research/cross-lab/tests/test_k05_evaluation.py'
      - '.github/workflows/k05-evidence-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k05-source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit and negative source tests
        run: python -W error::ResourceWarning -m unittest discover -s research/cross-lab/tests -v
      - name: Replay two immutable real public revisions
        run: python research/cross-lab/k05_evaluation.py --out "$RUNNER_TEMP/k05-proof.json" --rounds 200
      - name: Assert portable proof and no human-gold claims
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads((Path(os.environ["RUNNER_TEMP"]) / "k05-proof.json").read_text())
          assert receipt["schema"] == "IWXA_K05_COMPARISON_RESULT/0.1"
          assert receipt["status"] == "CONFIRMED"
          assert receipt["baseline"]["status"] == receipt["tested"]["status"] == "CONFLICT"
          assert receipt["checks"]["baseline_tested_agreement"] is True
          assert receipt["measured"]["versions_verified"] == 2
          assert receipt["measured"]["review_bytes_tested"] < receipt["measured"]["review_bytes_baseline"]
          assert receipt["scope"]["human_gold"] is False
          assert receipt["unknown"]["human_task_accuracy"] is None
          assert receipt["unknown"]["human_completion_time_ms"] is None
          assert receipt["unknown"]["agent_result_readback"] == "NOT_TESTED"
          assert "source_text" not in str(receipt)
          print("K05_PINNED_CONFLICT_BASELINE_PASS; HUMAN_OUTCOME_NOT_MEASURED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: k05-public-hash-only-proof
          path: ${{ runner.temp }}/k05-proof.json
          retention-days: 7
