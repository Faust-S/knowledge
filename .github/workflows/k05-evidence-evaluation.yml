name: K05 public pinned evidence evaluation

on:
  push:
    branches:
      - work/2026-11-05-k05-evidence-context-evaluation
    paths:
      - 'research/cross-lab/k05_evaluation.py'
      - 'research/cross-lab/tests/test_k05_evaluation.py'
      - 'research/cross-lab/tests/test_k05_k03_projection.py'
      - 'research/cross-lab/tests/test_k05_c17_projection.py'
      - 'research/cross-lab/tests/test_k05_agent_consumer.py'
      - 'research/cross-lab/k05_c17_projection.py'
      - 'research/cross-lab/tests/k05_k03_live.py'
      - '.github/workflows/k05-evidence-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k05-source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit and negative source tests
        run: python -W error::ResourceWarning -m unittest discover -s research/cross-lab/tests -v
      - name: Replay two immutable real public revisions
        run: python research/cross-lab/k05_evaluation.py --out "$RUNNER_TEMP/k05-proof.json" --rounds 200
      - name: Assert portable proof and no human-gold claims
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads((Path(os.environ["RUNNER_TEMP"]) / "k05-proof.json").read_text())
          assert receipt["schema"] == "IWXA_K05_COMPARISON_RESULT/0.2"
          assert receipt["status"] == "CONFIRMED"
          assert receipt["baseline"]["status"] == receipt["tested"]["status"] == "EVIDENCE_CHANGED"
          assert receipt["checks"]["baseline_tested_agreement"] is True
          assert receipt["measured"]["versions_verified"] == 2
          assert receipt["measured"]["review_bytes_tested"] < receipt["measured"]["review_bytes_baseline"]
          assert receipt["scope"]["human_gold"] is False
          assert receipt["scope"]["claim_labels_semantically_validated"] is False
          assert receipt["unknown"]["semantic_claim_accuracy"] is None
          assert receipt["unknown"]["human_task_accuracy"] is None
          assert receipt["unknown"]["human_completion_time_ms"] is None
          assert receipt["unknown"]["agent_result_readback"] == "NOT_TESTED"
          assert "source_text" not in str(receipt)
          print("K05_REVISION_CHANGE_BASELINE_PASS; SEMANTIC_CONFLICT_NOT_INFERRED")
          PY
      - name: Evaluate public multi-repository pinned suite
        run: python research/cross-lab/k05_evaluation.py --suite --out "$RUNNER_TEMP/k05-suite-proof.json" --rounds 100
      - name: Verify portable multi-source source-first proof
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads((Path(os.environ["RUNNER_TEMP"]) / "k05-suite-proof.json").read_text())
          assert receipt["schema"] == "IWXA_K05_EVALUATION_SUITE/0.1"
          assert receipt["status"] == "PASS"
          assert receipt["summary"]["case_count"] == 4
          assert receipt["summary"]["confirmed_cases"] == 4
          assert receipt["summary"]["baseline_agreement_count"] == 4
          assert receipt["summary"]["evidence_changed_cases"] == 3
          assert receipt["summary"]["evidence_unchanged_cases"] == 1
          assert receipt["summary"]["unique_source_versions"] == 6
          assert receipt["summary"]["unique_repositories"] == 3
          assert receipt["scope"]["human_gold"] is False
          assert receipt["scope"]["tested_has_curated_line_locator"] is True
          assert receipt["unknown"]["human_task_accuracy"] is None
          assert receipt["unknown"]["real_agent_result_readback"] == "NOT_TESTED"
          assert receipt["summary"]["review_payload_bytes_tested"] < receipt["summary"]["review_payload_bytes_baseline"]
          assert "source_text" not in str(receipt)
          print("K05_MULTI_SOURCE_PINNED_PASS; HUMAN_OUTCOME_NOT_MEASURED")
          PY
      - name: Live pinned Python release revision evidence for Agent Result handoff
        run: |
          python - <<'PY'
          import sys, json
          from dataclasses import asdict
          from pathlib import Path
          sys.path.insert(0, 'research/cross-lab')
          import k05_evaluation as k05
          case = k05.CPYTHON_CASE
          verified_bytes = {pin.version:k05.fetch_public_pinned_source(pin)
                            for pin in case.sources}
          result = asdict(k05.evaluate_case(case, verified_bytes, rounds=30))
          assert k05.verify_evidence_receipt(result, case, verified_bytes)
          assert result['schema'] == 'IWXA_K05_COMPARISON_RESULT/0.2'
          assert result['status'] == 'CONFIRMED'
          assert result['tested']['status'] == 'EVIDENCE_CHANGED'
          assert [o['locator'] for o in result['tested']['observations']] == ['L1', 'L1']
          assert all(o['state']=='OBSERVED' for o in result['tested']['observations'])
          assert result['scope']['claim_labels_semantically_validated'] is False
          assert result['unknown']['agent_result_readback'] == 'NOT_TESTED'
          assert result['unknown']['human_completion_time_ms'] is None
          out=Path(__import__('os').environ['RUNNER_TEMP'])/'k05-agent-result-evidence.json'
          with out.open('x', encoding='utf-8') as stream:
              json.dump(result, stream, sort_keys=True, ensure_ascii=True, indent=2)
          print('K05_REAL_PYTHON_312_313_AGENT_EVIDENCE_PASS',
                'source_versions', result['measured']['versions_verified'],
                'baseline_bytes', result['measured']['review_bytes_baseline'],
                'tested_excerpt_bytes', result['measured']['review_bytes_tested'],
                'semantic_claim_accuracy', result['unknown']['semantic_claim_accuracy'])
          PY
      - name: C17 aggregate projection regression (no human reviews)
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'research/cross-lab')
          sys.path.insert(0, 'research/cross-lab/tests')
          import test_k05_c17_projection as example
          import k05_c17_projection as k05
          from dataclasses import asdict
          footprint, plan = example.case()
          output = asdict(k05.compare_c17_aggregate(footprint, plan))
          assert output["measured"]["candidate_counts"] == {
              "all": 23, "literal_enter_leave": 6, "reed_closed_after_end_5s": 3}
          assert output["measured"]["potential_footprint_reduction_percent"] == 93.17
          assert output["unknown"]["human_active_seconds"] is None
          assert output["unknown"]["task_f1"] is None
          assert k05.verify_c17_comparison(output, footprint, plan)
          print('K05_C17_23_6_3_AGGREGATE_PASS; HUMAN_REVIEW_NOT_MEASURED')
          PY
      - name: Checkout pinned K03 owner source (read-only public)
        uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 5688d58432b807b1c8afe41b1aa54bd949ab7ab1
          path: .k03-owner
          persist-credentials: false
      - name: K05 source-only proof of one real K03 issue without a new evaluator
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python research/cross-lab/tests/k05_k03_live.py
      - uses: actions/upload-artifact@v4
        with:
          name: k05-public-hash-only-proof
          path: |
            ${{ runner.temp }}/k05-proof.json
            ${{ runner.temp }}/k05-suite-proof.json
            ${{ runner.temp }}/k05-agent-result-evidence.json
          retention-days: 7
