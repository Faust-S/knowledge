name: D08 MarketOps private Windows source and original T2 qualification

# Public workflow, private source remains exclusively on ephemeral runners.
# Triggered by push to this isolated qualification branch.
# No release, artifact upload, PR, or private stdout is permitted.
on:
  push:
    branches: [work/2026-11-18-d08-marketops-windows-qualification]
    paths: [.github/workflows/d08-marketops-windows-qualification.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d08-private-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOMAIN_SHA: e915f54177573d5b9db6e3d10f4836fe2a462af2
  SITE_SHA: 8b46007adf462c45b86712e81265781e2437a251
  T2_SHA: 49b5aa53e7441793f957b4f874ad0b7a9ae0f0f7
  CI: 'true'
  PUPPETEER_SKIP_DOWNLOAD: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  source-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Verify DOMEN grants access to both private MarketOps repositories
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:GH_TOKEN)){throw 'D08_DOMEN_SECRET_UNAVAILABLE'}
          foreach($repo in @('Faust-S/market-ops','Faust-S/market-ops.ru')){
            & gh api "repos/$repo" --jq '.id' *> $null
            if($LASTEXITCODE -ne 0){throw 'D08_DOMAIN_ACCESS_DENIED'}
          }
          git config --global core.autocrlf false
          git config --global core.eol lf
          Write-Host 'D08_PRIVATE_READ_ACCESS=PASS'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/market-ops
          ref: ${{ env.DOMAIN_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/domain
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/market-ops.ru
          ref: ${{ env.SITE_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact private source commits
        run: |
          foreach($item in @(@('private/domain',$env:DOMAIN_SHA),@('private/site',$env:SITE_SHA))){
            $actual=(& git -C $item[0] rev-parse HEAD).Trim()
            if($actual -ne $item[1]){throw 'D08_SOURCE_PIN_MISMATCH'}
          }
          Write-Host 'D08_SOURCE_PIN=PASS'
      - name: Install site dependencies only on the ephemeral runner
        working-directory: private/site
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'd08-site-npm-ci-private.log'
          & npm ci --no-audit --no-fund *> $log
          if($LASTEXITCODE -ne 0){
            Write-Host 'D08_NPM_CI=FAIL'
            throw 'D08_SITE_INSTALL_FAILED'
          }
          Write-Host 'D08_NPM_CI=PASS'
      - name: Execute full domain, TypeScript, lint, entry, adapter and staging checks
        run: |
          $fail=[System.Collections.Generic.List[string]]::new()
          function Gate([string]$name,[string]$folder,[string[]]$argv){
            $log=Join-Path $env:RUNNER_TEMP ("d08-"+$name+".private.log")
            Push-Location $folder
            try {
              & npm @argv *> $log
              $code=$LASTEXITCODE
            } catch { $code=1 } finally { Pop-Location }
            if($code -ne 0){ $script:fail.Add($name) }
            $state=if($code -eq 0){'PASS'}else{'FAIL'}
            Write-Host ("D08_"+$name+"="+$state)
            $raw=Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
            if($name -eq 'DOMAIN' -or $name -eq 'ADAPTERS' -or $name -eq 'T2_ENTRY'){
              foreach($metric in @('tests','pass','fail')){
                $hit=[regex]::Matches($raw, "(?m)^# $metric\s+(\d+)\s*$")
                if($hit.Count -gt 0){
                  Write-Host ("D08_"+$name+"_"+$metric.ToUpperInvariant()+"="+$hit[$hit.Count-1].Groups[1].Value)
                }
              }
            }
            if($name -eq 'TYPES' -and $code -ne 0){
              $codes=[regex]::Matches($raw, "TS\d{4}") |
                ForEach-Object {$_.Value} | Sort-Object -Unique
              Write-Host ('D08_TYPES_CODES='+($codes -join ','))
            }
            if($code -ne 0){
              $kinds=[regex]::Matches($raw,'ERR_[A-Z_]+|MODULE_NOT_FOUND|EACCES|EPERM|ENOENT') |
                ForEach-Object {$_.Value} | Sort-Object -Unique | Select-Object -First 8
              Write-Host ('D08_'+$name+'_CLASSES='+($kinds -join ','))
            }
          }
          Gate DOMAIN private/domain @('run','test:cases')
          Gate TYPES private/site @('run','check:types')
          Gate LINT private/site @('run','lint')
          Gate T2_ENTRY private/site @('run','check:t2:entry')
          Gate ADAPTERS private/site @('run','test:d08:adapters')
          if($fail.Count -gt 0){throw ('D08_SOURCE_GATES_FAILED_COUNT='+$fail.Count)}
          Write-Host 'D08_DOMAIN_SOURCE_ACCEPTANCE=PASS'
      - name: Explicit privacy boundary
        if: always()
        run: |
          Write-Host 'D08_PRIVATE_SOURCE_PUBLISHED=NO'
          Write-Host 'D08_PRIVATE_LOGS_UPLOADED=NO'
          Write-Host 'D08_PRIVATE_DIST_UPLOADED=NO'
          Write-Host 'D08_USER_GUI=NOT_RUN'
          Write-Host 'D08_IWXA_ROUNDTRIP=NOT_RUN'

  integrated-t2-windows:
    runs-on: windows-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Verify DOMEN grants read access to exact site and normative T2
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:GH_TOKEN)){throw 'D08_DOMEN_SECRET_UNAVAILABLE'}
          foreach($repo in @('Faust-S/market-ops.ru','Faust-S/T2')){
            & gh api "repos/$repo" --jq '.id' *> $null
            if($LASTEXITCODE -ne 0){throw 'D08_T2_ACCESS_DENIED'}
          }
          git config --global core.autocrlf false
          git config --global core.eol lf
          Write-Host 'D08_T2_READ_ACCESS=PASS'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/market-ops.ru
          ref: ${{ env.SITE_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: ${{ env.T2_SHA }}
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/t2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify original T2 SHA and accepted Kernel source archive
        run: |
          foreach($item in @(@('private/site',$env:SITE_SHA),@('private/t2',$env:T2_SHA))){
            $actual=(& git -C $item[0] rev-parse HEAD).Trim()
            if($actual -ne $item[1]){throw 'D08_INTEGRATED_PIN_MISMATCH'}
          }
          $archive=Join-Path $env:GITHUB_WORKSPACE 'private/t2/t2/current/final-successor/kernel-successors/k036-same-store-event-history-20261019/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip'
          if(-not (Test-Path $archive)){throw 'D08_T2_QUALIFIED_ARCHIVE_MISSING'}
          $actual=(Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne '7075b8b9590ef1283e34ecb3c21dd9d1b7342697287e1aa150cd4f4a60860b68'){
            throw 'D08_T2_QUALIFIED_ARCHIVE_HASH_MISMATCH'
          }
          Write-Host 'D08_T2_EXACT_PIN=PASS'
          Write-Host 'D08_T2_QUALIFIED_KERNEL_ZIP=PASS'
      - name: Install site packages privately
        working-directory: private/site
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'd08-integrated-install.private.log'
          & npm ci --no-audit --no-fund *> $log
          if($LASTEXITCODE -ne 0){throw 'D08_INTEGRATED_SITE_INSTALL_FAILED'}
          Write-Host 'D08_INTEGRATED_SITE_INSTALL=PASS'
      - name: Build one actual site with original T2 Host and qualified Kernel
        working-directory: private/site
        timeout-minutes: 85
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/private/t2
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'd08-real-t2-build.private.log'
          & npm run build *> $log
          $code=$LASTEXITCODE
          if($code -ne 0){
            Write-Host 'D08_FULL_ORIGINAL_T2_BUILD=FAIL'
            $raw=Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
            $codes=[regex]::Matches($raw,'(?:MARKETOPS|IWXA|T2)_[A-Z0-9_]+') |
              ForEach-Object {$_.Value} | Sort-Object -Unique | Select-Object -Last 12
            Write-Host ('D08_BUILD_REASON_CODES='+($codes -join ','))
            $classes=[ordered]@{
              NPM_TARBALL='TAR_BAD_ARCHIVE|TAR_ENTRY_ERROR|tarball|EINTEGRITY'
              NETWORK='ECONNRESET|ETIMEDOUT|EAI_AGAIN|CERT_HAS_EXPIRED'
              MODULE='ERR_MODULE_NOT_FOUND|Cannot find module|MODULE_NOT_FOUND'
              TYPES='TS\d{4}|SyntaxError'
              PERMISSIONS='EPERM|EACCES|Access is denied'
              BUILD='Build failed|failed to build|RollupError'
            }
            $found=@($classes.Keys | Where-Object {$raw -match $classes[$_]})
            if($found.Count -eq 0){$found=@('UNCLASSIFIED')}
            Write-Host ('D08_BUILD_FAILURE_CLASSES='+($found -join ','))
            throw 'D08_INTEGRATED_BUILD_FAILED'
          }
          Write-Host 'D08_FULL_ORIGINAL_T2_BUILD=PASS'
      - name: Verify actual protected and public entries in one ephemeral dist
        working-directory: private/site
        run: |
          $required=@(
            'dist/index.html',
            'dist/tools/launch-map/index.html',
            'dist/tools/cash-gap/index.html',
            'dist/tools/forgotten-costs/index.html',
            'dist/tools/launch-budget/index.html',
            'dist/tools/fbo-fbs-selector/index.html',
            'dist/tools/unit-economy/index.html',
            'dist/tools/ad-load/index.html',
            'dist/workspace/index.html',
            'dist/workspace/exchange/index.html',
            'dist/workspace/lifecycle/index.html',
            'dist/_iwxa/runtime/0.3.6/runtime.js'
          )
          foreach($rel in $required){
            if(-not(Test-Path -LiteralPath $rel)){throw 'D08_INTEGRATED_ROUTE_ASSET_MISSING'}
          }
          $runtime=(Get-FileHash -LiteralPath 'dist/_iwxa/runtime/0.3.6/runtime.js' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($runtime -ne 'e1737245aba309e900203b458087ca07cb08d9ccc89901754e1122cbc9a01e78'){
            throw 'D08_T2_RUNTIME_HASH_MISMATCH'
          }
          Write-Host 'D08_PUBLIC_CASE_ROUTES=7/7'
          Write-Host 'D08_WORKSPACE_EXCHANGE_LIFECYCLE=3/3'
          Write-Host 'D08_QUALIFIED_RUNTIME_HASH=PASS'
          Write-Host 'D08_EPHEMERAL_INTEGRATED_DIST=PASS'
      - name: Mark precise limit of static build qualification
        if: always()
        run: |
          Write-Host 'D08_PRIVATE_SOURCE_PUBLISHED=NO'
          Write-Host 'D08_DIST_PUBLISHED=NO'
          Write-Host 'D08_ARTIFACT_UPLOADS=0'
          Write-Host 'D08_WINDOWS_INTERACTIVE_GUI=NOT_RUN'
          Write-Host 'D08_T2_SCOPED_RECEIPT=NOT_RUN'
          Write-Host 'D08_T2_RESTART_READBACK=NOT_RUN'
          Write-Host 'D08_IWXA_EXPORT_IMPORT=NOT_RUN'
