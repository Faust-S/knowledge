name: T3 original router snapshot regression
on:
  push:
    branches: [fix/2026-11-27-t3-route-snapshot]
    paths:
      - 'packages/t3-core/src/workspace-host/router/use-host-route-match.ts'
      - 'packages/t3-core/src/workspace-host/rendering/ModuleRouteOutlet.tsx'
      - 'packages/t3-core/tests/host-route-snapshot.dom.test.tsx'
      - '.github/workflows/t3-route-snapshot-regression.yml'
permissions:
  contents: read
jobs:
  route-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/t3-core
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Install public original T3 locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Original route snapshot and neighbouring router regression
        run: |
          node node_modules/vitest/vitest.mjs run --config vitest.t3-product.config.mjs tests/host-route-snapshot.dom.test.tsx tests/host-route-activation.test.ts tests/host-router-cross-base.test.ts tests/host-route-module-cleanup.test.ts tests/host-route-security.test.ts
      - name: Negative control against exact unmodified original source
        env:
          ORIGINAL: '326f725c44d69ac99f6b912241e9e8a6c3d716a5'
        run: |
          set -euo pipefail
          git cat-file -e "$ORIGINAL^{commit}" || git fetch --no-tags origin "$ORIGINAL"
          for name in src/workspace-host/router/use-host-route-match.ts src/workspace-host/rendering/ModuleRouteOutlet.tsx; do
            git show "$ORIGINAL:packages/t3-core/$name" > "$name"
          done
          set +e
          node node_modules/vitest/vitest.mjs run --config vitest.t3-product.config.mjs --project t3-product-dom --reporter=json --outputFile="$RUNNER_TEMP/t3-route-negative.json" tests/host-route-snapshot.dom.test.tsx > "$RUNNER_TEMP/t3-route-negative.log" 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          node --input-type=module - "$RUNNER_TEMP/t3-route-negative.json" <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const tests = report.testResults.flatMap(row => row.assertionResults);
          const expected = [
            "never commits a false unavailable route when the runtime first becomes ready",
            "does not resolve the previous router's route against a replacement runtime",
            "rechecks a changed original snapshot when the subscription is registered"
          ];
          assert.equal(tests.length, 5);
          for (const title of expected) {
            const found = tests.find(row => row.title === title);
            assert.equal(found?.status, 'failed', title);
          }
          for (const row of tests.filter(row => !expected.includes(row.title))) {
            assert.equal(row.status, 'passed', row.title);
          }
          console.log('T3_ROUTE_NEGATIVE_CONTROL=' + JSON.stringify({expectedFailures: expected.length, passed: tests.length - expected.length}));
          NODE
