name: D05 T3 Host assembly identity only
on:
  push:
    branches: ['ci/once/d05-t3-host-identity/*']
    paths: ['.github/ci-requests/d05-t3-host-identity.json']

permissions:
  contents: read
  actions: read
concurrency:
  group: d05-t3-release
  cancel-in-progress: false
jobs:
  identity:
    if: ${{ github.event.created == false && github.event.deleted == false && github.event.forced == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the public assembly identity harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          path: harness
      - name: Admit exactly one request and bind immutable qualification evidence
        working-directory: harness
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/verify_once_request.py \
            --repository Faust-S/knowledge --workflow d05-t3-host-identity \
            --profile 1.6.0-linux-host-identity \
            --revision site=5e3ff328f7b31d7fa69b86a0759b914148c921df \
            --revision subject=547148d8cd74838e0dd384c9da2f196e3595bf9d \
            --revision assistant=e2e4bf9157ca1dc81abe06a99ec98ff9aaa21d5f \
            --revision one-core=326f725c44d69ac99f6b912241e9e8a6c3d716a5 \
            --revision qualified-request=7b2f1ddddbfd0b117138c971cf94a6d44ae5cb2f \
            --revision expected-tree=34ce805156b5e81807a5ee2614c65c57a7464f94 \
            --revision reported-windows-tree=c33f6e2dde9f5c7ec08b6518a03e06f046a83394
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("qualification/d05/receipts/45780282826-linux.json").read_text())
          assert r["runId"]==45780282826 and r["jobId"]==139773898412
          assert r["requestCommit"]=="7b2f1ddddbfd0b117138c971cf94a6d44ae5cb2f"
          assert r["siteCommit"]=="5e3ff328f7b31d7fa69b86a0759b914148c921df" and r["subjectCommit"]=="547148d8cd74838e0dd384c9da2f196e3595bf9d"
          assert r["assistantCommit"]=="e2e4bf9157ca1dc81abe06a99ec98ff9aaa21d5f" and r["oneCoreCommit"]=="326f725c44d69ac99f6b912241e9e8a6c3d716a5"
          assert r["linux"]["functionalReady"] is True
          assert r["linux"]["snapshot"]["sourceTree"]=="34ce805156b5e81807a5ee2614c65c57a7464f94"
          assert r["linux"]["snapshot"]["inputFiles"]==92 and r["linux"]["snapshot"]["distFiles"]==224
          assert r["linux"]["snapshot"]["exactBytes"] is True
          assert r["linux"]["renderedNavigation"]["clicks"]==242
          print("D05_T3_HOST_IDENTITY_PRIOR_EVIDENCE_PASS")
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Verify exact Linux toolchain and test the temporary-index helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(node --version)" = v22.16.0
          test "$(npm --version)" = 10.9.2
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
          printf 'D05_T3_HOST_IDENTITY_ENV Linux %s node=%s npm=%s\n' "$VERSION_ID" "$(node --version)" "$(npm --version)"
          node --test harness/qualification/d05/assembly/retained-tree-identity.test.mjs
      - name: Read exact private site source without retaining credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Faust-S/cehovod.ru
          ref: 5e3ff328f7b31d7fa69b86a0759b914148c921df
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - name: Read exact original assistant without retaining credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Faust-S/T3
          ref: e2e4bf9157ca1dc81abe06a99ec98ff9aaa21d5f
          token: ${{ secrets.DOMEN }}
          path: assistant
          persist-credentials: false
      - name: Read exact original One Core source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Faust-S/knowledge
          ref: 326f725c44d69ac99f6b912241e9e8a6c3d716a5
          path: one-core
          persist-credentials: false
      - name: Confirm source pins and native Git filemode
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C site rev-parse HEAD)" = '5e3ff328f7b31d7fa69b86a0759b914148c921df'
          test "$(git -C assistant rev-parse HEAD)" = 'e2e4bf9157ca1dc81abe06a99ec98ff9aaa21d5f'
          test "$(git -C one-core rev-parse HEAD)" = '326f725c44d69ac99f6b912241e9e8a6c3d716a5'
          test "$(git -C site config --get core.filemode)" = true
          test -z "$(git -C site status --porcelain --untracked-files=no)"
          echo D05_T3_HOST_IDENTITY_SOURCE_PINS_PASS
      - name: Install dependencies without exporting private sources
        working-directory: site
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/d05-t3-npm.log" 2>&1 || { echo D05_T3_NPM_FAIL; exit 1; }
      - name: Verify exact portable common platform
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Faust-S/knowledge/actions/artifacts/14920233669/zip > "$RUNNER_TEMP/t3-artifact.zip"
          unzip -p "$RUNNER_TEMP/t3-artifact.zip" platform-inputs.zip > "$RUNNER_TEMP/platform-inputs.zip"
          if ! node scripts/t3-platform-inputs.mjs verify "$RUNNER_TEMP/platform-inputs.zip" > "$RUNNER_TEMP/d05-t3-platform.log" 2>&1; then
            grep -Eo 'CEHOVOD_T3_PLATFORM_[A-Z0-9_]+' "$RUNNER_TEMP/d05-t3-platform.log" | sort -u | head -20 || true
            echo D05_T3_PLATFORM_FAIL
            exit 1
          fi
          echo D05_T3_PLATFORM_PASS
      - name: Compile original T3 Host with current domain module and shared assistant
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-host.log"
          if ! npm run prepare:t3-host -- "$GITHUB_WORKSPACE/one-core/packages/t3-core" "$RUNNER_TEMP/cehovod-host" "$RUNNER_TEMP/platform-inputs.zip" "$GITHUB_WORKSPACE/assistant" https://cehovod.ru >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_T3_HOST_PHASE_[A-Z0-9_]+' "$log" | tail -5 || true
            grep -Eo 'CEHOVOD_[A-Z0-9_]+|IWXA_[A-Z0-9_]+|T[23]_[A-Z0-9_]+|TS[0-9]{4,6}|ERR_[A-Z0-9_]+' "$log" | sort -u | head -50 || true
            node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          import {basename} from "node:path";
          const rows=readFileSync(process.env.RUNNER_TEMP+"/d05-t3-host.log","utf8").split("\n");
          const found=new Set();
          for(const row of rows){
            const match=row.match(/^\s*([A-Za-z0-9_./-]{1,240})\((\d{1,6}),(\d{1,6})\): error (TS\d{4,6}):/);
            if(!match)continue;
            const key=JSON.stringify({file:basename(match[1]),line:Number(match[2]),column:Number(match[3]),code:match[4],area:match[1].includes("cehovod/")?"domain":match[1].includes("node_modules")?"dependency":"core"});
            if(!found.has(key)&&found.size<60){found.add(key);console.log("D05_T3_HOST_TYPE_DIAG "+key);}
          }
          JS
            echo D05_T3_HOST_BUILD_FAIL
            exit 1
          fi
          echo D05_T3_HOST_BUILD_PASS
      - name: Retain verified original Host and platform in the local version directory
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d05-t3-retain.log"
          if ! npm run retain:t3-inputs -- "$RUNNER_TEMP/cehovod-host" "$RUNNER_TEMP/platform-inputs.zip" >"$log" 2>&1; then
            grep -Eo 'CEHOVOD_T3_[A-Z0-9_]+' "$log" | sort -u | head -30 || true
            echo D05_T3_RETAIN_FAIL
            exit 1
          fi
          if ! npm run retain:t3-inputs -- "$RUNNER_TEMP/cehovod-host" "$RUNNER_TEMP/platform-inputs.zip" >"$log" 2>&1; then
            echo D05_T3_RETAIN_REPEAT_FAIL
            exit 1
          fi
          grep -Eq '"added":0' "$log"
          echo D05_T3_RETAIN_PASS
      - name: Compare exact rebuilt tree and executable-bit-only alternative
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C site status --porcelain --untracked-files=no)"
          log="$RUNNER_TEMP/d05-t3-host-identity.log"
          rc=0
          node harness/qualification/d05/assembly/retained-tree-identity.mjs site \
            34ce805156b5e81807a5ee2614c65c57a7464f94 \
            c33f6e2dde9f5c7ec08b6518a03e06f046a83394 >"$log" 2>&1 || rc=$?
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";
          const rows=readFileSync(process.env.RUNNER_TEMP+"/d05-t3-host-identity.log","utf8").split(/\r?\n/).filter(l=>l.startsWith('{"status":"D05_T3_HOST_IDENTITY_')).map(JSON.parse);
          assert.equal(rows.length,1,"D05_T3_HOST_IDENTITY_RECEIPT_MISSING");
          const r=rows[0],sha=/^[0-9a-f]{40}$/,digest=/^[0-9a-f]{64}$/;
          assert.ok(["D05_T3_HOST_IDENTITY_PASS","D05_T3_HOST_IDENTITY_MISMATCH"].includes(r.status));
          assert.equal(r.head,"5e3ff328f7b31d7fa69b86a0759b914148c921df");assert.equal(r.expectedTree,"34ce805156b5e81807a5ee2614c65c57a7464f94");
          assert.equal(r.reportedWindowsTree,"c33f6e2dde9f5c7ec08b6518a03e06f046a83394");
          assert.ok(sha.test(r.tree)&&sha.test(r.allRegularTree));
          for(const k of ["contentInventorySha256","modeInventorySha256","hostReceiptSha256","compiledFilesInventorySha256","moduleSourceInventorySha256"])assert.ok(digest.test(r[k]));
          for(const k of ["inputFiles","executableFiles","regularFiles"])assert.ok(Number.isSafeInteger(r[k])&&r[k]>=0);
          assert.equal(r.inputFiles,r.executableFiles+r.regularFiles);
          assert.equal(r.normalIndexUnchanged,true);assert.equal(r.productTestsRepeated,false);assert.equal(r.productAccepted,false);
          assert.equal(r.expectedTreeMatched,r.tree===r.expectedTree);
          assert.equal(r.reportedWindowsTreeExplainedByModesOnly,r.expectedTreeMatched&&r.tree!==r.allRegularTree&&r.allRegularTree===r.reportedWindowsTree);
          // Only aggregate hashes, counts and booleans leave the private checkout.
          console.log(JSON.stringify(r));
          assert.equal(r.inputFiles,92);
          JS
          exit "$rc"
      - name: Remove disposable private source and generated input directories
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/site" "$GITHUB_WORKSPACE/assistant" "$GITHUB_WORKSPACE/one-core" "$RUNNER_TEMP/cehovod-host"
          rm -f "$RUNNER_TEMP"/d05-t3-*.log "$RUNNER_TEMP/t3-artifact.zip" "$RUNNER_TEMP/platform-inputs.zip"
