name: D08 isolated native React obligation form
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d08-obligation-form-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-form:
    name: Exact MarketOps obligation React form in disposable Windows Chrome
    runs-on: windows-latest
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - name: Checkout exact private MarketOps site
        uses: actions/checkout@v4
        with:
          repository: Faust-S/market-ops.ru
          ref: 4808d5e077701bf4f75fc6de9b595035f30b0cff
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: site
      - name: Verify exact private site commit
        run: |
          test "$(git -C site rev-parse HEAD)" = "4808d5e077701bf4f75fc6de9b595035f30b0cff" || exit 1
          node --check site/tests/d08-obligation-form-native-preflight.mjs
          echo D08_FORM_SYNTAX=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install reproducible React test dependencies
        working-directory: site
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d08-form-install.log" 2>&1 || {
            echo D08_FORM_INSTALL=FAIL; exit 1;
          }
          echo D08_FORM_INSTALL=PASS
      - name: Use Chrome already on Windows image
        working-directory: site
        run: |
          CHROME="C:\Program Files\Google\Chrome\Application\chrome.exe"
          if test -f "$CHROME"; then
            echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
          else
            unset PUPPETEER_SKIP_DOWNLOAD
            node_modules/.bin/puppeteer browsers install chrome > "$RUNNER_TEMP/d08-form-browser.log" 2>&1 || {
              echo D08_FORM_BROWSER=FAIL; exit 1;
            }
          fi
      - name: Check original React form input to onSave without Kernel substitution
        working-directory: site
        run: |
          node tests/d08-obligation-form-native-preflight.mjs > "$RUNNER_TEMP/d08-form-native.log" 2>&1 || {
            grep -E '^D08_OBLIGATION_FORM_(PHASE|FAILURE)=' "$RUNNER_TEMP/d08-form-native.log" | head -3 || true
            echo D08_FORM_NATIVE=FAIL
            exit 1
          }
          grep -q '^D08_OBLIGATION_FORM_NATIVE_PREFLIGHT=PASS$' "$RUNNER_TEMP/d08-form-native.log" || exit 1
          echo D08_FORM_NATIVE=PASS
      # No source, user data, bundle, screenshots or artifacts are uploaded.
