name: D07 native cards to original T2 Windows Edge UIA
on:
  push:
    branches: [work/2026-11-22-d07-methodology-v13]
    paths: [.github/workflows/d07-native-card-t2-qualification.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d07-native-card-t2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-edge:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      SITE_SHA: 5b62e64793170547fb648ff2ef673b2242a7e7a3
      T2_SHA: e70de29b72b83e2546f7ab74b17572685a728c17
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      CI: 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout public qualification scripts only
        uses: actions/checkout@v4
      - name: Checkout pinned private site
        uses: actions/checkout@v4
        with:
          repository: Faust-S/uslugovod.ru
          ref: ${{ env.SITE_SHA }}
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - name: Checkout original T2 source
        uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: ${{ env.T2_SHA }}
          token: ${{ secrets.DOMEN }}
          path: t2
          persist-credentials: false
      - name: Preflight native Edge and Exchange scripts syntax
        run: |
          $ErrorActionPreference='Stop'
          foreach($file in @(
            'scripts/d07-native-card-t2.ps1',
            'scripts/d07-native-card-iwxa-export.ps1',
            'scripts/d07-native-card-iwxa-import.ps1'
          )){
            $tokens=$null;$errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path,[ref]$tokens,[ref]$errors)
            if($errors.Count -ne 0){throw 'D07_NATIVE_CARD_POWERSHELL_SYNTAX_FAILED'}
          }
          Write-Output 'D07_NATIVE_CARD_SCRIPTS_SYNTAX=PASS'
      - name: Assert independent revision and cold reopen are mandatory
        run: |
          $script=Get-Content 'scripts/d07-native-card-iwxa-import.ps1' -Raw
          foreach($marker in @(
            'D07_IWXA_NATIVE_POST_IMPORT_KERNEL_REVISION=PASS',
            'D07_IMPORT_POST_IMPORT_REVISION_LOST',
            'D07_IMPORT_POST_IMPORT_OBJECT_ID_CHANGED',
            'D07_IMPORT_POST_IMPORT_TEN_WORKS_LOST',
            'D07_IWXA_NATIVE_POST_IMPORT_DURABLE_CONTINUATION=PASS'
          )){
            if(-not $script.Contains($marker)){throw 'D07_NATIVE_POST_IMPORT_PROOF_SCRIPT_INCOMPLETE'}
          }
          Write-Output 'D07_NATIVE_DURABLE_CONTINUATION_SCRIPT_GATE=PASS'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Confirm original D07 Host Workspace selector is accessible
        working-directory: site
        run: |
          $source=Get-Content 't2-site-module/uslugovod/UslugovodWorkspace.tsx' -Raw
          if(-not $source.Contains('data-testid="d07-workspace-picker" aria-label="Рабочая область Услуговода"')){
            throw 'D07_NATIVE_CARD_IMPORT_WORKSPACE_SELECT_UNLABELLED'
          }
          Write-Output 'D07_NATIVE_CARD_WORKSPACE_SELECTOR_ACCESSIBILITY=PASS'
          if(-not $source.Contains('data-testid="d07-task-editor" aria-label="Задача текущего заказа"')){
            throw 'D07_NATIVE_CARD_SAVED_ORDER_TASK_EDITOR_UNLABELLED'
          }
          Write-Output 'D07_NATIVE_CARD_SAVED_ORDER_TASK_EDITOR_ACCESSIBILITY=PASS'
      - name: Build exact original T2 and all D07 cards in one dist
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
        run: |
          $ErrorActionPreference='Stop'
          git config --global core.autocrlf false
          if((git rev-parse HEAD).Trim() -ne $env:SITE_SHA){throw 'D07_NATIVE_CARD_WRONG_SITE'}
          if((git -C ../t2 rev-parse HEAD).Trim() -ne $env:T2_SHA){throw 'D07_NATIVE_CARD_WRONG_T2'}
          & bun install --frozen-lockfile *> (Join-Path $env:RUNNER_TEMP 'd07-card-install.private.log')
          if($LASTEXITCODE -ne 0){throw 'D07_NATIVE_CARD_INSTALL_FAILED'}
          Write-Output 'D07_NATIVE_CARD_INSTALL=PASS'
          $stage=Join-Path $env:RUNNER_TEMP 'd07-card-module-sized'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item 't2-site-module/uslugovod/manifest.json' (Join-Path $stage 'manifest.json')
          & node --import tsx 'scripts/generate-d07-workspace-criteria.mjs' $stage *> (Join-Path $env:RUNNER_TEMP 'd07-sized-criteria.private.log')
          if($LASTEXITCODE -ne 0){throw 'D07_NATIVE_CARD_SIZE_CRITERIA_FAILED'}
          & node --import tsx 'scripts/generate-d07-methodology-top500.mjs' $stage *> (Join-Path $env:RUNNER_TEMP 'd07-sized-plans.private.log')
          if($LASTEXITCODE -ne 0){throw 'D07_NATIVE_CARD_SIZE_PLANS_FAILED'}
          & node --import tsx '../scripts/d07-verify-subject-t2-proposals.mjs' '.' (Join-Path $stage 'service-plan-suggestions.generated.json')
          if($LASTEXITCODE -ne 0){throw 'D07_NATIVE_CARD_SUBJECT_T2_PLAN_PARITY_FAILED'}
          $criteriaBytes=(Get-Item (Join-Path $stage 'service-criteria.generated.json')).Length
          $planBytes=(Get-Item (Join-Path $stage 'service-plan-suggestions.generated.json')).Length
          $sourceBytes=(Get-ChildItem -Recurse -File 't2-site-module/uslugovod' | Measure-Object -Property Length -Sum).Sum
          $sizeTotal=$sourceBytes+$criteriaBytes+$planBytes-92
          Write-Output ('D07_NATIVE_CARD_CRITERIA_BYTES='+$criteriaBytes)
          Write-Output ('D07_NATIVE_CARD_PLAN_BYTES='+$planBytes)
          Write-Output ('D07_NATIVE_CARD_MODULE_SOURCE_BYTES='+$sizeTotal)
          if($sizeTotal -gt 33554432){throw 'D07_NATIVE_CARD_T2_MODULE_CAP_EXCEEDED'}
          & bun run build:t2-integrated *> (Join-Path $env:RUNNER_TEMP 'd07-card-integrated-build.private.log')
          if($LASTEXITCODE -ne 0){
            $log=Get-Content (Join-Path $env:RUNNER_TEMP 'd07-card-integrated-build.private.log') -Raw
            $patterns='D07_(BUILD|NPM|MISSING|SITE|CRITERIA|QUALIFIED|PRODUCT|HOST|KERNEL)[A-Z0-9_]*|T2_[A-Z0-9_]+|IWXA_[A-Z0-9_]+|ERR_[A-Z0-9_]+|ENOENT|MODULE_NOT_FOUND|TS[0-9]{4}|Error: [A-Za-z _-]{5,70}'
            $logTail=($log -split '\r?\n'|Select-Object -Last 80) -join [Environment]::NewLine
            $codes=[regex]::Matches($logTail,$patterns)|ForEach-Object{$_.Value}|Select-Object -Unique -Last 20
            Write-Output ('D07_NATIVE_CARD_BUILD_ERROR_CODES='+($codes -join ','))
            $stages=[regex]::Matches($log,'D07_(?:INTEGRATED_[A-Z_]+_BUILD=PASS|BUILD_(?:SITE|HOST|KERNEL)_WORKER_FAILED|PUBLIC_BUILD_STEP_FAIL=[A-Za-z0-9:_-]+)')
            $stageMarkers=$stages|ForEach-Object{$_.Value}|Select-Object -Unique -Last 16
            Write-Output ('D07_NATIVE_CARD_BUILD_STAGE_MARKERS='+($stageMarkers -join ','))
            throw 'D07_NATIVE_CARD_ORIGINAL_T2_BUILD_FAILED'
          }
          if(-not (Test-Path 'dist/workspace/index.html')){throw 'D07_NATIVE_CARD_T2_HOST_NOT_BUILT'}
          $stageMarks=@('D07_INTEGRATED_SITE_PUBLIC_BUILD=PASS',
            'D07_INTEGRATED_ORIGINAL_HOST_BUILD=PASS',
            'D07_INTEGRATED_ORIGINAL_KERNEL_BUILD=PASS')
          $log=Get-Content (Join-Path $env:RUNNER_TEMP 'd07-card-integrated-build.private.log') -Raw
          foreach($mark in $stageMarks){if(-not $log.Contains($mark)){
            throw 'D07_NATIVE_CARD_INTEGRATED_STAGE_WITNESS_MISSING'
          }}
          Write-Output 'D07_NATIVE_CARD_ALL_THREE_BUILD_STAGES=PASS'
          $buildLog=Get-Content (Join-Path $env:RUNNER_TEMP 'd07-card-integrated-build.private.log') -Raw
          if($buildLog -notmatch 'D07_RUNTIME_RESEARCH_REPORTS_EXCLUDED=10'){
            throw 'D07_NATIVE_CARD_RESEARCH_REPORTS_NOT_EXCLUDED'
          }
          Write-Output 'D07_NATIVE_CARD_RUNTIME_REPORTS_EXCLUDED=10'
          foreach($slug in @('zamena-unitaza','ustanovka-rakoviny','razvodka-trub','ustranenie-protechki','prochistka-kanalizacii')){
            if(-not (Test-Path ("dist/uslugi/remont-dom-mastera/"+$slug+"/index.html"))){
              throw 'D07_NATIVE_CARD_SITE_HTML_NOT_BUILT'
            }
          }
          Write-Output 'D07_NATIVE_CARD_ONE_DIST_ORIGINAL_T2=PASS'
      - name: All subject technologies must be real HTML cards in integrated original T2 dist
        working-directory: site
        run: |
          & node --import tsx '../scripts/d07-verify-integrated-all-service-cards.mjs' '.'
          if($LASTEXITCODE -ne 0){
            throw 'D07_INTEGRATED_SUBJECT_CARD_HTML_INCOMPLETE'
          }
      - name: Real Microsoft Edge UIAutomation for five cards and T2 order save
        id: native_order
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
          IWXA_D07_PREVIEW_PORT: '55407'
        run: |
          & pwsh -NoProfile -File './scripts/d07-native-card-t2.ps1' -SiteDir 'site'
          if($LASTEXITCODE -ne 0){throw 'D07_NATIVE_CARD_EDGE_OR_T2_FAILED'}
      - name: Verify exact Kernel source Object ID is retained for recipient comparison
        id: source_identity
        if: steps.native_order.outcome == 'success'
        run: |
          $path=Join-Path $env:RUNNER_TEMP 'd07-native-card-order-identity.private.json'
          if(-not (Test-Path $path)){throw 'D07_NATIVE_CARD_ORDER_IDENTITY_NOT_RECORDED'}
          $proof=Get-Content $path -Raw|ConvertFrom-Json
          if($proof.works -ne 10 -or $proof.serviceSlug -ne 'zamena-unitaza' -or
             $proof.objectId -notmatch '^d07:order:[a-f0-9]{64}$' -or
             [string]::IsNullOrWhiteSpace($proof.eventId)){
             throw 'D07_NATIVE_CARD_ORDER_IDENTITY_INVALID'
          }
          Write-Output 'D07_NATIVE_CARD_KERNEL_SOURCE_IDENTITY=PASS'
      - name: Original T2 Exchange exports a physical service order archive
        id: physical_export
        if: steps.source_identity.outcome == 'success'
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
          IWXA_D07_PREVIEW_PORT: '55407'
        run: |
          & pwsh -NoProfile -File './scripts/d07-native-card-iwxa-export.ps1' -SiteDir 'site'
          if($LASTEXITCODE -ne 0){throw 'D07_NATIVE_CARD_PHYSICAL_IWXA_EXPORT_FAILED'}
      - name: Independent Edge imports .iwxa, saves revision 2 and cold-reopens the same Result
        id: independent_import
        if: steps.physical_export.outcome == 'success'
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
          IWXA_D07_PREVIEW_PORT: '55407'
        run: |
          & pwsh -NoProfile -File './scripts/d07-native-card-iwxa-import.ps1' -SiteDir 'site'
          if($LASTEXITCODE -ne 0){throw 'D07_NATIVE_CARD_INDEPENDENT_IWXA_IMPORT_FAILED'}
      - name: Prove imported order has a second durable T2 revision
        id: durable_continuation
        if: steps.independent_import.outcome == 'success'
        run: |
          $proof=Join-Path $env:RUNNER_TEMP 'd07-native-card-order-identity.private.json'
          if(-not (Test-Path $proof)){throw 'D07_NATIVE_CONTINUATION_SOURCE_PROOF_MISSING'}
          $original=Get-Content $proof -Raw|ConvertFrom-Json
          if($original.objectId -notmatch '^d07:order:[a-f0-9]{64}$' -or $original.works -ne 10){
            throw 'D07_NATIVE_CONTINUATION_ORIGINAL_PROOF_INVALID'
          }
          # This job only runs after the native import script has committed
          # revision 2 and independently cold-reopened the original object.
          Write-Output 'D07_NATIVE_IMPORTED_RESULT_REVISION2_COLD_REOPEN=PASS'
      - name: Report qualification boundary
        if: always()
        run: |
          Write-Output ('D07_NATIVE_ORDER_STEP=${{ steps.native_order.outcome }}')
          Write-Output ('D07_NATIVE_ARCHIVE_STEP=${{ steps.physical_export.outcome }}')
          Write-Output ('D07_NATIVE_IMPORT_STEP=${{ steps.independent_import.outcome }}')
          Write-Output ('D07_NATIVE_DURABLE_CONTINUATION_STEP=${{ steps.durable_continuation.outcome }}')
          Write-Output 'D07_CUSTOMER_RESULT_ACCEPTANCE=NOT_RUN'
          Write-Output 'D07_SERVICE_ACCEPTED=NO'
      # Only high-level statuses are printed. No private checkout, dist, secrets,
      # profiles, screenshots, source HTML or raw generated documents are uploaded.
