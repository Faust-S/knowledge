name: D09 HOP avatar candidate static hosting gates
on:
  push:
    branches: [work/2026-11-20-d09-avatar-qualification]
    paths: [.github/workflows/d09-hop-avatar-static-hosting.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-public:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact private HOP website (no artifacts)
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop.iwxa.ru
          ref: c81e0d3d56e95ed1e7498b793402145ee85f10cf
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and qualify public static stage
        shell: bash
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-static-ci.log" 2>&1 || {
            echo D09_STATIC_NPM=FAIL; exit 1;
          }
          echo D09_STATIC_NPM=PASS
          npm run build:public-stage > "$RUNNER_TEMP/d09-static-build.log" 2>&1 || {
            if grep -q 'Timed out after 30000 ms while waiting for the WS endpoint URL' "$RUNNER_TEMP/d09-static-build.log"; then
              echo D09_CHROME_STARTUP_RETRY=1
              npm run build:public-stage > "$RUNNER_TEMP/d09-static-build-retry.log" 2>&1 || {
                echo D09_STATIC_PUBLIC_BUILD=FAIL
                grep -Ei 'error|fail|unexpected|cannot|not found|timed out' "$RUNNER_TEMP/d09-static-build-retry.log" | tail -8 | cut -c1-150 || true
                exit 1
              }
            else
              echo D09_STATIC_PUBLIC_BUILD=FAIL
              grep -Ei 'error|fail|unexpected|cannot|not found' "$RUNNER_TEMP/d09-static-build.log" | tail -8 | cut -c1-150 || true
              exit 1
            fi
          }
          echo D09_STATIC_PUBLIC_BUILD=PASS
          test -f dist/avatars/index.html || { echo D09_AVATARS_PRERENDER=FAIL; exit 1; }
          echo D09_AVATARS_PRERENDER=PASS
      - name: Independently qualify public hosting source and assembled static assets
        shell: bash
        run: |
          status=0
          for check in check:links check:seo check:htaccess check:no-localhost \
            check:external-assets check:network-privacy check:public-boundary \
            check:readability check:hydration check:runtime check:assets \
            check:public-claims check:landing-bundle-boundary; do
            key=$(printf '%s' "$check" | tr ':a-z-' '_A-Z_')
            logfile="$RUNNER_TEMP/d09-static-${key}.log"
            if npm run "$check" > "$logfile" 2>&1; then
              echo "D09_STATIC_${key}=PASS"
            else
              echo "D09_STATIC_${key}=FAIL"
              grep -Ei 'error|fail|invalid|mismatch|missing|broken' "$logfile" |
                sed -E 's#/(home|tmp|mnt)/[^[:space:]]+#<private-path>#g' |
                cut -c1-150 | tail -4 || true
              status=1
            fi
          done
          test "$status" -eq 0 || exit 1
          echo D09_STATIC_HOSTING_GATES=PASS
