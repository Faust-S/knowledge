name: AKIS Mesa 3.5.2 R4 independent buyer response to outside supplier offer

on:
  push:
    branches:
      - work/2026-11-23-akis-r4-buyer-response-to-offer-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-mesa-buyer-response:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Official original Mesa 3.5.2
        run: |
          python -m pip install --disable-pip-version-check "mesa==3.5.2" "pytest>=8,<10"
          python -c "import mesa; assert mesa.__version__ == '3.5.2'"
      - name: Compile entire original research package
        run: python -m compileall -q qualifications/akis_2026_11_21/research
      - name: Targeted independent buyer intent and previous R4 source evidence
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: |
          python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r4_original_buyer_offer_response_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r4_independent_supplier_offer_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r4_original_buyer_demand_withdrawal_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r4_independent_external_buyer_demand_mesa.py
      - name: Full original Mesa regression
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests
      - name: Export deterministic buyer-intent evidence
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_r4_original_buyer_response.py
      - uses: actions/upload-artifact@v4
        with:
          name: akis-r4-original-buyer-response-${{ matrix.os }}
          if-no-files-found: error
          path: qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r4_independent_original_buyer_offer_response_evidence.json
