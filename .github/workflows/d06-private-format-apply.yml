name: d06-private-format-apply

# Runner-local formatting of a private working branch. No source, patch,
# build, screenshot, trace or secret is uploaded to this public repository.
on:
  push:
    branches:
      - test/2026-11-18-d06-qualification
    paths:
      - .github/workflows/d06-private-format-apply.yml
permissions:
  contents: read
jobs:
  format-private-site:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact authorized private working revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/komplektovod.ru
          ref: 9e0136dfd11ec76542c7f7d7b23fea7a9939a7fe
          token: ${{ secrets.DOMEN }}
          persist-credentials: false
          path: private/site
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Format only existing lint violations and verify quality
        shell: pwsh
        working-directory: private/site
        env:
          DOMEN: ${{ secrets.DOMEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:RUNNER_TEMP "d06-private-format.log"
          & npm ci --no-audit --no-fund *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_FORMAT_INSTALL=FAIL"; exit 1 }
          Write-Host "D06_FORMAT_INSTALL=PASS"
          & node scripts/format-eslint-violations.mjs --apply *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_FORMAT_APPLY=FAIL"; exit 1 }
          Write-Host "D06_FORMAT_APPLY=PASS"
          & npm run check:lint *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_FORMAT_LINT=FAIL"; exit 1 }
          Write-Host "D06_FORMAT_LINT=PASS"
          & git diff --check *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_FORMAT_DIFF=FAIL"; exit 1 }
          $changed = @(& git diff --name-only)
          Write-Host ("D06_FORMAT_FILE_COUNT=" + $changed.Count)
          if ($changed.Count -eq 0) { Write-Host "D06_FORMAT_PUSH=NOT_NEEDED"; exit 0 }
          if (-not $env:DOMEN) { Write-Host "D06_FORMAT_PUSH=TOKEN_MISSING"; exit 1 }
          $branch = "work/2026-11-11-case-driven-entry-and-drill"
          $base = (& git rev-parse HEAD).Trim()
          if ($base -ne "9e0136dfd11ec76542c7f7d7b23fea7a9939a7fe") {
            Write-Host "D06_FORMAT_PUSH=SOURCE_CHANGED"; exit 1
          }
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:" + $env:DOMEN))
          $remote = "https://github.com/Faust-S/komplektovod.ru.git"
          $head = & git -c ("http.extraheader=AUTHORIZATION: basic " + $basic) ls-remote $remote ("refs/heads/" + $branch) 2> $log
          if ($LASTEXITCODE -ne 0 -or -not $head) {
            Write-Host "D06_FORMAT_PUSH=REMOTE_DENIED"; exit 1
          }
          $remoteSha = (($head | Select-Object -First 1) -split '\s+')[0]
          if ($remoteSha -ne $base) { Write-Host "D06_FORMAT_PUSH=REMOTE_MOVED"; exit 1 }
          & git config user.name "IWXA D06 private CI"
          & git config user.email "d06-ci@users.noreply.github.com"
          & git add -u
          & git commit -m "style(d06): format tracked source files flagged by ESLint" *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_FORMAT_COMMIT=FAIL"; exit 1 }
          & git -c ("http.extraheader=AUTHORIZATION: basic " + $basic) push $remote ("HEAD:refs/heads/" + $branch) *> $log
          if ($LASTEXITCODE -ne 0) { Write-Host "D06_FORMAT_PUSH=DENIED"; exit 1 }
          Write-Host "D06_FORMAT_PUSH=PASS"
      - name: Confirm private boundary
        if: always()
        shell: pwsh
        run: |
          Write-Host "D06_PRIVATE_SOURCE_UPLOADS=0"
          Write-Host "D06_PRIVATE_DIST_UPLOADS=0"
          Write-Host "D06_PRIVATE_DIFF_UPLOADS=0"
