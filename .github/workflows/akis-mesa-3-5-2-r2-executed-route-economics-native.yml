name: AKIS Mesa 3.5.2 R2 matched executed original route economics

on:
  push:
    branches:
      - work/2026-11-24-akis-r2-executed-route-economics-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-mesa-executed-route-economics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify complete pinned original executable scope
        run: python qualifications/akis_2026_11_21/verify_source_scope.py
      - name: Official Mesa 3.5.2
        run: |
          python -m pip install --disable-pip-version-check "mesa==3.5.2" "pytest>=8,<10"
          python -c "import mesa; assert mesa.__version__ == '3.5.2'"
      - name: Compile original package
        run: python -m compileall -q qualifications/akis_2026_11_21/research
      - name: Original network scale profile and semantic parity
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_original_network_scale_mesa.py
      - name: Original network organization and exact owner-period source scope
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_original_network_organization_mesa.py
      - name: Original delegated packet readiness
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_original_packet_readiness_mesa.py
      - name: Original independent portfolio delegation
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_original_portfolio_delegation_mesa.py
      - name: Addressed original executed route economics and R4 Work payment cases
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r2_executed_route_economics_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r4_original_outside_work_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r4_original_outside_work_payment_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r1p_r3_executed_route_economics_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_s0_s1_s2_original_preparation_economics_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r1t3_original_technology_route_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r3_r4_original_multi_order_portfolio_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_original_active_resource_readiness_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_original_material_replenishment_mesa.py
      - name: Original preparation renewal and re-use
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_original_preparation_pattern_revision_mesa.py
      - name: Original structural preparation model-time evolution
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_original_pattern_evolution_mesa.py
      - name: Original bounded customer delegation
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_original_bounded_delegation_mesa.py
      - name: Original delegation recovery and independent attempt costs
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_original_delegation_recovery_mesa.py
      - name: Restored cooperation regression
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_cooperation.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_cooperation_author_code.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_cooperation_change.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_cooperation_economic_evidence.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_cooperation_integrity.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_cooperation_lifecycle.py
      - name: Full original Mesa regression
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests
      - name: Export deterministic redacted evidence
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: |
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_r2_executed_route_economics.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_competing_market_economics.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_multi_order_portfolio.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_activity_efficiency.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_preparation_context_risk.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_quality_recovery_economics.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_resource_disturbance.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_material_replenishment.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_unfinished_activity.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_combined_process_recovery.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_recovery_reproduction.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_preparation_pattern_revision.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_preparation_pattern_evolution.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_bounded_delegation_economics.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_original_delegation_recovery.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_original_portfolio_delegation.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_original_packet_readiness.py
      - uses: actions/upload-artifact@v4
        with:
          name: akis-r2-executed-route-economics-${{ matrix.os }}
          if-no-files-found: error
          path: |
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r2_executed_route_economics_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r1p_r3_multiperiod_route_economics_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/s0_s1_s2_original_preparation_economics_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r3_competing_market_economics_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r3_r4_multi_order_portfolio_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r2_r3_r4_activity_efficiency_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r2_r3_r4_preparation_context_risk_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r2_r3_r4_quality_recovery_economics_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r2_r3_r4_resource_disturbance_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r2_r3_r4_material_replenishment_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r2_r3_r4_unfinished_activity_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r2_r3_r4_combined_process_recovery_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r2_r3_r4_recovery_reproduction_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r2_r3_r4_preparation_pattern_revision_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r2_r3_r4_preparation_pattern_evolution_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r2_r3_r4_bounded_delegation_economics_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r1_r2_r4_original_delegation_recovery_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r1_r2_r4_original_portfolio_delegation_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r1_r2_r4_original_packet_readiness_evidence.json
  original-mesa-network-scale:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        enterprises: [100, 1000, 10000, 30000]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify complete pinned original executable scope
        run: python qualifications/akis_2026_11_21/verify_source_scope.py
      - name: Official Mesa 3.5.2
        run: |
          python -m pip install --disable-pip-version-check "mesa==3.5.2"
          python -c "import mesa; assert mesa.__version__ == '3.5.2'"
      - name: Execute one original connected enterprise network
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_original_network_scale.py ${{ matrix.enterprises }}
      - uses: actions/upload-artifact@v4
        with:
          name: akis-network-scale-${{ matrix.os }}-${{ matrix.enterprises }}
          if-no-files-found: error
          path: qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/network_scale_infrastructure_${{ matrix.enterprises }}.json
  original-mesa-network-organization:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        enterprises: [100, 1000, 10000, 30000]
        include:
          - enterprises: 100
            periods: 3
          - enterprises: 1000
            periods: 3
          - enterprises: 10000
            periods: 3
          - enterprises: 30000
            periods: 1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify complete pinned original executable scope
        run: python qualifications/akis_2026_11_21/verify_source_scope.py
      - name: Official Mesa 3.5.2
        run: |
          python -m pip install --disable-pip-version-check "mesa==3.5.2"
          python -c "import mesa; assert mesa.__version__ == '3.5.2'"
      - name: Execute matched S0 and S2 original organization trajectories
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_original_network_organization.py ${{ matrix.enterprises }} ${{ matrix.periods }}
      - uses: actions/upload-artifact@v4
        with:
          name: akis-network-organization-${{ matrix.os }}-${{ matrix.enterprises }}-${{ matrix.periods }}
          if-no-files-found: error
          path: qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/network_organization_${{ matrix.enterprises }}_${{ matrix.periods }}.json
