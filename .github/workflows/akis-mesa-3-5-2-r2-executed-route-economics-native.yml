name: AKIS Mesa 3.5.2 R2 matched executed original route economics

on:
  push:
    branches:
      - work/2026-11-24-akis-r2-executed-route-economics-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-mesa-executed-route-economics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Official Mesa 3.5.2
        run: |
          python -m pip install --disable-pip-version-check "mesa==3.5.2" "pytest>=8,<10"
          python -c "import mesa; assert mesa.__version__ == '3.5.2'"
      - name: Compile original package
        run: python -m compileall -q qualifications/akis_2026_11_21/research
      - name: Addressed original executed route economics and R4 Work payment cases
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r2_executed_route_economics_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r4_original_outside_work_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r4_original_outside_work_payment_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r1p_r3_executed_route_economics_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_s0_s1_s2_original_preparation_economics_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r1t3_original_technology_route_mesa.py qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests/test_r3_r4_original_multi_order_portfolio_mesa.py
      - name: Full original Mesa regression
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: python -m pytest -q qualifications/akis_2026_11_21/research/akis/qualitative_mesa/tests
      - name: Export deterministic redacted evidence
        env:
          PYTHONPATH: qualifications/akis_2026_11_21
        run: |
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_r2_executed_route_economics.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_competing_market_economics.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_multi_order_portfolio.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_activity_efficiency.py
          python qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/export_preparation_context_risk.py
      - uses: actions/upload-artifact@v4
        with:
          name: akis-r2-executed-route-economics-${{ matrix.os }}
          if-no-files-found: error
          path: |
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r2_executed_route_economics_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r1p_r3_multiperiod_route_economics_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/s0_s1_s2_original_preparation_economics_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r3_competing_market_economics_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r3_r4_multi_order_portfolio_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r2_r3_r4_activity_efficiency_evidence.json
            qualifications/akis_2026_11_21/research/akis/qualitative_mesa/experiments/r2_r3_r4_preparation_context_risk_evidence.json
