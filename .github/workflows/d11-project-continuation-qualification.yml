name: D11 customer-project continuation original T2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d11-project-continuation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  continue-project:
    name: D11 project revision ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Verify approved private repository read access
        env:
          GH_TOKEN: ${{ secrets.DOMEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw "D11_DOMEN_UNAVAILABLE" }
          foreach ($repository in @("Faust-S/advice-logistics.ru", "Faust-S/advice-logistics", "Faust-S/T2")) {
            gh api "repos/$repository" --jq ".id" > $null
            if ($LASTEXITCODE -ne 0) { throw "D11_READ_ACCESS_DENIED" }
          }
          Write-Output "D11_PRIVATE_READ_ACCESS=PASS"
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/advice-logistics.ru
          ref: 770ab8f91624ebad17b49fe5889cf2b48e3bcaa3
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/advice-logistics
          ref: e88851681f310b325663475697e9120ab763ce12
          token: ${{ secrets.DOMEN }}
          path: domain
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T2
          ref: e70de29b72b83e2546f7ab74b17572685a728c17
          token: ${{ secrets.DOMEN }}
          path: t2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact baseline and source mirrors
        working-directory: site
        run: |
          $site=(git rev-parse HEAD).Trim()
          $domain=(git -C ../domain rev-parse HEAD).Trim()
          $t2=(git -C ../t2 rev-parse HEAD).Trim()
          Write-Output "D11_PROJECT_SITE_HEAD=$site"
          Write-Output "D11_PROJECT_DOMAIN_HEAD=$domain"
          if ($site -ne "770ab8f91624ebad17b49fe5889cf2b48e3bcaa3" -or
              $domain -ne "e88851681f310b325663475697e9120ab763ce12") {
            throw "D11_PROJECT_QUALIFICATION_REVISION_CHANGED"
          }
          if ($t2 -ne "e70de29b72b83e2546f7ab74b17572685a728c17") { throw "D11_NORMATIVE_T2_CHANGED" }
          foreach($file in @(Get-ChildItem ../domain/model/logistics -File -Filter "*.ts")){
            $canonical=(git -C ../domain rev-parse "HEAD:model/logistics/$($file.Name)").Trim()
            $mirror=(git rev-parse "HEAD:src/lib/logistics/$($file.Name)").Trim()
            if ($canonical -ne $mirror) { throw "D11_DOMAIN_SOURCE_MIRROR_DIFF" }
          }
          Write-Output "D11_OPERATIONAL_MIRRORS=PASS"
          # Hosting readiness is evaluated from private source, without exporting dist.
          & node --experimental-strip-types --test tests/d11-integrated-build.test.mjs *> (Join-Path $env:RUNNER_TEMP "d11-hosting-source.log")
          if ($LASTEXITCODE -ne 0) { throw "D11_HOSTING_SOURCE_TEST_FAILED" }
          Write-Output "D11_HOSTING_SOURCE=PASS"
      - name: Install and build original T2 with the full site
        working-directory: site
        env:
          IWXA_T2_SOURCE_DIR: ${{ github.workspace }}/t2
        run: |
          & npm ci --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP "d11-install.log")
          if ($LASTEXITCODE -ne 0) { throw "D11_NPM_INSTALL_FAILED" }
          & npm run build:t2:site *> (Join-Path $env:RUNNER_TEMP "d11-build.log")
          if ($LASTEXITCODE -ne 0) { throw "D11_T2_INTEGRATED_BUILD_FAILED" }
          Write-Output "D11_ONE_DIST=PASS"
          & npm run check:htaccess *> (Join-Path $env:RUNNER_TEMP "d11-hosting-http.log")
          if ($LASTEXITCODE -ne 0) { throw "D11_HOSTING_HTTP_CONFIG_FAILED" }
          Write-Output "D11_HOSTING_HTTP_CONFIG=PASS"
      - name: Verify project identity classification and TypeScript
        working-directory: site
        run: |
          & node --experimental-strip-types --test tests/d11-dashboard-projection.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "D11_PROJECT_IDENTITY_TEST_FAILED" }
          & node --experimental-strip-types --test ../domain/tests/case009-to-case010.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "D11_CANONICAL_WAREHOUSE_TRANSFER_FAILED" }
          & node --experimental-strip-types --test tests/d11-warehouse-to-order.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "D11_SITE_WAREHOUSE_TRANSFER_FAILED" }
          & node --experimental-strip-types --test tests/d11-warehouse-source-lineage.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "D11_WAREHOUSE_LINEAGE_CONTRACT_FAILED" }
          Write-Output "D11_CASE009_TO_CASE010_DOMAIN_AND_SITE=PASS"
          & node --experimental-strip-types --test ../domain/tests/case007-to-case010.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "D11_007_010_CARRIER_RECONCILIATION_FAILED" }
          & node --experimental-strip-types --test tests/d11-carrier-to-order.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "D11_007_010_SITE_RECONCILIATION_FAILED" }
          & node --experimental-strip-types --test tests/d11-direct-carrier-lineage.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "D11_DIRECT_CARRIER_LINEAGE_FAILED" }
          Write-Output "D11_CASE007_TO_CASE010_DOMAIN_AND_SITE=PASS"
          & npx --no-install tsc --noEmit --project tsconfig.json *> (Join-Path $env:RUNNER_TEMP "d11-types.log")
          if ($LASTEXITCODE -ne 0) {
            Get-Content (Join-Path $env:RUNNER_TEMP "d11-types.log") |
              Select-String -Pattern "error TS[0-9]+" |
              Select-Object -First 25
            throw "D11_PROJECT_TYPES_FAILED"
          }
          Write-Output "D11_PROJECT_IDENTITY_AND_TYPES=PASS"
      - name: Real editor to Host to Kernel fork and revision readback
        working-directory: site
        run: |
          & node --experimental-strip-types scripts/d11-project-continuation-acceptance.mjs
          if ($LASTEXITCODE -ne 0) { throw "D11_PROJECT_CONTINUATION_FAILED" }
          Write-Output "D11_REAL_PROJECT_CONTINUATION=PASS"
      # No screenshot, archive, dist, customer JSON, private source or secrets are published.
