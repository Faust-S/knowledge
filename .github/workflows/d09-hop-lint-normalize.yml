name: D09 HOP final Prettier lint normalization (private two-owner guarded)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-two-owner-format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact private website owner
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop.iwxa.ru
          ref: work/2026-10-27-d09-t2-site-only
          token: ${{ secrets.DOMEN }}
          path: site
          persist-credentials: true
      - name: Checkout exact private subject owner
        uses: actions/checkout@v4
        with:
          repository: Faust-S/hop
          ref: work/2026-11-19-narrative-ai-import
          token: ${{ secrets.DOMEN }}
          path: subject
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify both exact reviewed input revisions
        shell: bash
        run: |
          test "$(git -C site rev-parse HEAD)" = "cc6547c2ff949ba14bc7c153467ba06c5ec476a8" || { echo D09_LINT_SITE_PIN_DRIFT; exit 1; }
          test "$(git -C subject rev-parse HEAD)" = "3d11ce585838bfe3864d19f5bc327bb9b19729ae" || { echo D09_LINT_SUBJECT_PIN_DRIFT; exit 1; }
          test -z "$(git -C site status --porcelain --untracked-files=no)"
          test -z "$(git -C subject status --porcelain --untracked-files=no)"
          echo D09_LINT_TWO_OWNER_PINNED=PASS
      - name: Install website lockfile dependencies
        working-directory: site
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/d09-lint-npm.log" 2>&1 || { echo D09_LINT_NPM=FAIL; exit 1; }
          echo D09_LINT_NPM=PASS
      - name: Run original two-owner normalizer, without disabling lint
        working-directory: site
        shell: bash
        run: |
          node scripts/d09-normalize-lint.mjs "$GITHUB_WORKSPACE/subject" --format-only > "$RUNNER_TEMP/d09-normalize.log" 2>&1 || {
            grep -E '^D09_LINT_' "$RUNNER_TEMP/d09-normalize.log" | tail -18 || true
            echo D09_LINT_NORMALIZATION=FAIL
            exit 1
          }
          grep -E '^D09_LINT_' "$RUNNER_TEMP/d09-normalize.log" | tail -18 || true
          echo D09_LINT_NORMALIZATION=PASS
      - name: Independently verify lint and project consistency
        working-directory: site
        shell: bash
        run: |
          npm run lint > "$RUNNER_TEMP/d09-lint-final.log" 2>&1 || {
            echo D09_FULL_LINT=FAIL
            grep -E 'problems|error ' "$RUNNER_TEMP/d09-lint-final.log" | tail -10 || true
            exit 1
          }
          echo D09_FULL_LINT=PASS
          npm run typecheck > "$RUNNER_TEMP/d09-lint-types.log" 2>&1 || { echo D09_LINT_TYPES=FAIL; exit 1; }
          echo D09_LINT_TYPES=PASS
          npm run test:d09 > "$RUNNER_TEMP/d09-lint-d09.log" 2>&1 || {
            echo D09_LINT_D09=FAIL
            grep -E 'not ok|# fail|Error:|FAIL' "$RUNNER_TEMP/d09-lint-d09.log" | tail -12 || true
            exit 1
          }
          echo D09_LINT_D09=PASS
          node --experimental-strip-types --test tests/d09-json-content-equality.test.mjs > "$RUNNER_TEMP/d09-json-readback.log" 2>&1 || {
            echo D09_LINT_STRUCTURAL_READBACK=FAIL; exit 1;
          }
          echo D09_LINT_STRUCTURAL_READBACK=PASS
          npx vitest run src/lib/__tests__/remix.test.ts src/content-system/__tests__/seed-fidelity.test.ts > "$RUNNER_TEMP/d09-lint-regression.log" 2>&1 || {
            echo D09_LINT_REGRESSION=FAIL; exit 1;
          }
          echo D09_LINT_REGRESSION=PASS
          npx tsx scripts/d09-seed-package-diagnostic.ts > "$RUNNER_TEMP/d09-lint-seeds.log" 2>&1 || {
            echo D09_LINT_SEED_IWXA=FAIL; exit 1;
          }
          grep -q '^D09_SEEDS_FAILED=0$' "$RUNNER_TEMP/d09-lint-seeds.log"
          echo D09_LINT_SEED_IWXA=PASS
          git diff --check
          git -C "$GITHUB_WORKSPACE/subject" diff --check
          echo D09_LINT_DIFF_CHECK=PASS
      - name: Commit and push website and canonical parity (guarded normal fast-forward only)
        shell: bash
        env:
          GIT_AUTHOR_NAME: IWXA Engineering
          GIT_AUTHOR_EMAIL: engineering@users.noreply.github.com
          GIT_COMMITTER_NAME: IWXA Engineering
          GIT_COMMITTER_EMAIL: engineering@users.noreply.github.com
        run: |
          git -C site diff --quiet && { echo D09_LINT_SITE_NO_CHANGES; exit 1; }
          git -C site add -u
          git -C site commit -m "style(d09): normalize HOP website Prettier without suppressing lint" > "$RUNNER_TEMP/d09-site-commit.log"
          git -C site push origin HEAD:refs/heads/work/2026-10-27-d09-t2-site-only > "$RUNNER_TEMP/d09-site-push.log" 2>&1 || {
            if grep -qi 'fetch first\|non-fast-forward\|rejected' "$RUNNER_TEMP/d09-site-push.log"; then
              echo D09_LINT_SITE_PUSH_REF_ADVANCED
            elif grep -qi 'denied\|not allowed\|403\|authentication' "$RUNNER_TEMP/d09-site-push.log"; then
              echo D09_LINT_SITE_PUSH_PERMISSION_DENIED
            else
              echo D09_LINT_SITE_PUSH_OTHER_FAILURE
            fi
            echo D09_LINT_SITE_PUSH=FAIL; exit 1;
          }
          echo "D09_LINT_SITE_COMMIT=$(git -C site rev-parse HEAD)"
          echo D09_LINT_SITE_PUSH=PASS
          if ! git -C subject diff --quiet; then
            git -C subject add -u
            git -C subject commit -m "style(hop): retain canonical subject parity with D09 website formatting" > "$RUNNER_TEMP/d09-subject-commit.log"
            git -C subject push origin HEAD:refs/heads/work/2026-11-19-narrative-ai-import > "$RUNNER_TEMP/d09-subject-push.log" 2>&1 || {
              echo D09_LINT_SUBJECT_PUSH=FAIL; exit 1;
            }
          fi
          echo "D09_LINT_SUBJECT_COMMIT=$(git -C subject rev-parse HEAD)"
          echo D09_LINT_SUBJECT_PUSH=PASS
